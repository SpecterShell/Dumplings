name: Automation
on:
  schedule:
    - cron: 0 * * * *
  workflow_dispatch:
    inputs:
      params:
        description: Additional parameters passed to the script
        required: false
        type: string
jobs:
  build:
    name: Build
    runs-on: windows-2025
    concurrency:
      group: ${{ github.workflow }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: Dumplings
          submodules: true
      # - name: Checkout upstream winget-pkgs
      #   uses: actions/checkout@v4
      #   with:
      #     repository: microsoft/winget-pkgs
      #     path: winget-pkgs
      # - name: Install WinGet client
      #   run: .\Modules\PackageModule\Utilities\InstallWinGet.ps1
      #   working-directory: Dumplings
      #   shell: powershell
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull latest changes from the remote repository
        run: git pull
        working-directory: Dumplings
        shell: pwsh
      - name: Setup PowerShell modules
        uses: ./Dumplings/.github/actions/setup-powershell-modules
        with:
          cache-path: ${{ runner.temp }}\DumplingsPowerShellModules
          cache-key: dumplings-pwsh-modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dumplings/PowerShellModules.psd1') }}
      - name: Setup Playwright runtime
        uses: ./Dumplings/.github/actions/setup-playwright-runtime
        with:
          cache-path: ${{ runner.temp }}\DumplingsPlaywrightRuntime
          cache-key: dumplings-playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dumplings/Modules/PackageModule/Assets/PlaywrightRuntime.psd1') }}
      - name: Run tasks
        run: .\Core\Index.ps1 -ThrottleLimit 4 -EnableWrite -EnableMessage -EnableSubmit ${{ github.event.inputs.params }}
        working-directory: Dumplings
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_DUMPLINGS_TOKEN: ${{ secrets.GH_DUMPLINGS_TOKEN }}
          DUMPLINGS_SECRET: ${{ secrets.DUMPLINGS_SECRET }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MT_BOT_TOKEN: ${{ secrets.MT_BOT_TOKEN }}
          MT_ROOM_ID: ${{ secrets.MT_ROOM_ID }}
      - name: Commit and push local changes to the remote repository
        run: |-
          $Path = Join-Path $PWD 'Tasks'
          if (-not [string]::IsNullOrWhiteSpace((git ls-files --other --modified --exclude-standard $Path))) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git pull
            git add $Path
            git commit -m "${env:GITHUB_WORKFLOW}: Update states [${env:GITHUB_RUN_NUMBER}]"
            git push
          } else {
            Write-Host -Object 'No changes to commit'
          }
        working-directory: Dumplings
        shell: pwsh
      # The RunnerStopping module hook writes the task status report to
      # Outputs/Status. Publish it even when the run failed, falling back to a
      # placeholder page when the run ended before the report was generated.
      - name: Fall back to a placeholder status page when the report is missing
        if: always()
        run: |
          $StatusPath = Join-Path $PWD 'Dumplings' 'Outputs' 'Status'
          if (-not (Test-Path -LiteralPath (Join-Path $StatusPath 'index.html') -PathType Leaf)) {
            $null = New-Item -Path $StatusPath -ItemType Directory -Force
            $RunUrl = "${env:GITHUB_SERVER_URL}/${env:GITHUB_REPOSITORY}/actions/runs/${env:GITHUB_RUN_ID}"
            $Html = '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Dumplings task status</title></head><body><h1>Dumplings task status</h1><p>The automation run ended before the task status report was generated. See the <a href="' + $RunUrl + '">workflow run</a> for details.</p></body></html>'
            Set-Content -LiteralPath (Join-Path $StatusPath 'index.html') -Value $Html -Encoding utf8NoBOM
          }
        shell: pwsh
      - name: Upload status page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-page
          path: Dumplings/Outputs/Status
          retention-days: 1
          if-no-files-found: error
  deploy:
    name: Deploy status page
    needs: build
    # Deploy the status page even when the task run failed; skip only on cancellation
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download status page
        uses: actions/download-artifact@v4
        with:
          name: status-page
          path: status-page
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package status page
        uses: actions/upload-pages-artifact@v3
        with:
          path: status-page
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
