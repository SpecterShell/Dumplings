name: "➕ New Package Request"
description: Suggest a workflow for package submission (this does not mean you have to implement it).
type: Feature
labels: ["Help-Wanted","Package-Request"]
title: "[Package Request]: "
body:
  - type: dropdown
    id: submitter
    attributes:
      label: How can we help?
      # description: Are you requesting someone else to add the package, or do you need help adding the package yourself?
      multiple: false
      options:
        - I would like someone else to build the workflow for the manifest.
        - I would like help so I can submit the workflow for the manifest.
    validations:
      required: false
  - type: checkboxes
    attributes:
      label: Please read and ensure the following
      description: |
        WinGet only supports certain installer types. Please validate the installer may be supported before submitting your request.
        - The installer is at least one of the following:
          ```
          - A standalone MSIX, APPX, MSI, or .EXE installer
          - A portable .EXE application
          - A standalone installer or a portable application inside of a .ZIP file
          ```
        - The installer is not:
          ```
          - A script such as a .PS1, .BAT, or .SH file
          - Compressed as a .TAR, .GZ, .7z, or .RAR
          ```
      options:
        - label: The installer meets the above requirements
          required: true
  - type: textarea
    attributes:
      label: Please provide the following information
      description: If you can provide the following information, it will be easy for us to add the package to the repository.
      value: |
        Download Page URL:
        Publisher:
        Package Name:
        Description:
        Package Version:
        Installer URL:
  - type: textarea
    attributes:
      label: Please provide relevant discussions for the request
      description: |
        Users of the package may have requested to add it to WinGet in their own community.
        - A package may collect feedback on GitHub and an issue or a discussion may have been filed for adding it to WinGet.
        - A package publisher may host webpage(s) other than GitHub to collect feedback and the request may have been made there.
        - A user may have created a discussion on a forum or social media platform about adding the package to WinGet.
        Provide links to any such discussions for the request so we can track the community's interest in the package.
      placeholder: mrsaliericz/browser-gamma-fix#24
