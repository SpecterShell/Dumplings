  Value: |-
    Trellis Card 0.2.1
    新增功能
    - 支持 DeepSeek Harness（dsh）：设置里可安装 dsh 观察插件，dsh 在 Trellis 项目中的会话开始、用户消息、工具调用实时显示在卡片上
      - 接入方式：应用内置 dsh-trellis-bridge 插件（cordis 插件，纯观察者，不干预 dsh）
    修复
    - 终态事件保留工具信息：会话结束（Stop/idle）不再清空工具名/活动，卡片保留最后工具调用（对 dsh 等高频 agent 友好）
    其他
    - dsh 桥接模板清理无用导出
    - 完整变更见 Full Changelog
