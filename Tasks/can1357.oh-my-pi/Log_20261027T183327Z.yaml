    - fix(coding-agent): keep the system prompt byte-stable across retry fallbacks and roster changes by @sjawhar in https://github.com/can1357/oh-my-pi/pull/17014
    - perf(tui): memoize the output pane's styled content per frame by @yuzu-octopus in https://github.com/can1357/oh-my-pi/pull/16779
    - perf(ai): memoize schemaDefinesProperty per schema identity by @yuzu-octopus in https://github.com/can1357/oh-my-pi/pull/16780
    - fix(apply-patch): require matching context and support move-only sections by @alphastorm in https://github.com/can1357/oh-my-pi/pull/17184
    - fix(coding-agent): use the cheapest vision model for image descriptions by @gcp in https://github.com/can1357/oh-my-pi/pull/17196
    - fix(coding-agent): convert markit-supported documents in @file mentions by @GTanger in https://github.com/can1357/oh-my-pi/pull/17193
