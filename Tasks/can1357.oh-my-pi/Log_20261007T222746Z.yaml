  Key: ReleaseNotes
  Value: |-
    @oh-my-pi/pi-ai
    Added
    - Added OAuthRefreshUnavailableError, a retryable error that keys.getWithCredential and oauth.access reject with when every usable OAuth credential failed to refresh transiently; keys.get resolves undefined instead so availability probes move on to their next candidate (#14843 by @H4vC)
    Fixed
    - Fixed a single transient OAuth token-refresh failure (network blip, timeout, 5xx) ending a running session, including subagents restricted to an account pool, with a non-retryable "No API key for provider" error while the stored credential was still valid; the refresh error now surfaces and the request is retried (#14843 by @H4vC)
    @oh-my-pi/pi-catalog
    Added
    - Added Claude Haiku 5.5 with adaptive thinking (low through max effort), image input, a 1M-token context window, 128K output, and its tiered pricing above 100K input tokens.
    @oh-my-pi/pi-coding-agent
    Fixed
    - Fixed repeat opens of the model picker, model hub, or agents views stacking duplicates; the open one is brought forward instead (#14846 by @H4vC)
    What's Changed
    - fix(coding-agent): focus the open model picker and hubs instead of stacking duplicates by @H4vC in https://github.com/can1357/oh-my-pi/pull/14846
    - fix(ai): retry transient OAuth refresh failures instead of reporting a missing key by @H4vC in https://github.com/can1357/oh-my-pi/pull/14843
    Full Changelog: https://github.com/can1357/oh-my-pi/compare/v18.8.2...v18.8.3
