  Key: ReleaseNotes
  Value: |-
    @oh-my-pi/pi-agent-core
    Fixed
    - Fixed an issue where peer-IRC interrupts (such as subagent messages) incorrectly skipped non-interruptible tool calls queued in the same batch.
    - Improved interruption messaging to clearly distinguish between parent-agent steering and system-advisory interruptions.
    @oh-my-pi/pi-ai
    Added
    - Added profile-aware Bedrock Mantle region selection, authenticated model discovery, bearer-token or SigV4 authentication, and credential refresh handling for OpenAI Responses models.
    Fixed
    - Fixed an issue where Ollama requests without a user-role message would fail to generate output or silently fail with a misleading error.
    @oh-my-pi/pi-catalog
    Added
    - Added the bedrock-mantle provider with authenticated model discovery for OpenAI GPT-5.4, GPT-5.5, and GPT-5.6 models (including Luna and Terra variants with corrected pricing) served through Amazon Bedrock's Responses endpoint.
    Fixed
    - Fixed dynamic discovery for the deepseek-v4 model family (such as deepseek-v4-flash-0731) under alibaba-token-plan missing reasoning configuration and maximum thinking effort.
    - Fixed GitHub Copilot dynamic discovery retaining stale bundled prices for default-context models instead of using the provider's reported default-tier prices.
    @oh-my-pi/pi-coding-agent
    Added
    - Added the /reset slash command to reset the conversation context in place: it drops the live messages, queued turns, and pending tool calls (and cancels the turn's async jobs, post-prompt continuations, and checkpoint/plan runtime state) while keeping the session id, title, cwd, model, and on-disk transcript. It records a durable reset boundary so the live transcript stays cleared across rebuilds (theme change, focus attach, /shake, resume) instead of resurrecting the pre-reset messages, while the full pre-reset history stays on disk (#3580).
    Fixed
    - Fixed extension slash commands appearing as user prompts after being handled locally.
    - Preserved explicit session titles when branching from an earlier conversation turn.
    - Fixed an issue where unhandled JavaScript rejections in the browser guest could crash the main process and active sessions, converting them into tool errors instead.
    - Fixed a critical issue on Windows where cancelling a timed-out bash tool command could mistakenly terminate the main process due to PID recycling.
    - Fixed an issue where supervised processes reaching a terminal state failed to notify their launching session, requiring polling; the broker now actively notifies the session upon process completion.
    - Fixed crashes on macOS when using PCRE2-only grep patterns with Bun by defaulting to the interpreted PCRE2 engine instead of JIT, and introduced the OMP_PCRE2_JIT environment variable to manually control JIT compilation.
    - Fixed issues with /btw branch promotion where branches could park behind active turns, cut from outdated session leaves, or leave rejected branch keys indistinguishable from composer input.
    - Fixed database bloat by ensuring archived main and nested session rows are properly cleaned up from stats.db during garbage collection.
    - Fixed startup hanging during local model discovery when a timed-out transport left its request pending, which blocked the CLI before OAuth login could finish (#7482).
    @oh-my-pi/pi-mnemopi
    Added
    - Added opt-in SQLite page-size configuration for file-backed databases, configurable via the MNEMOPI_DB_PAGE_SIZE environment variable or the pageSize option in openDatabase. Existing databases retain their original page size.
    @oh-my-pi/pi-natives
    Added
    - Added non-blocking, process-owned FileLock bindings using abstract Unix sockets on Linux, named mutexes on Windows, and persistent flock(2) sidecars on other Unix platforms.
    @oh-my-pi/pi-utils
    Added
    - Added a shared file-lock utility backed by process-owned native OS locks with automatic crash release and bounded asynchronous retry.
    What's Changed
