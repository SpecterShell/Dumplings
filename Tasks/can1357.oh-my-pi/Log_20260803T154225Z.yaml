    - fix(browser): guard cmux guest rejections by @roboomp in https://github.com/can1357/oh-my-pi/pull/7368
    - fix(pi-shell): spare host process from run-cancellation sweeps by @roboomp in https://github.com/can1357/oh-my-pi/pull/7453
    - fix(agent): distinguish parent steering from advisories by @fatihaziz in https://github.com/can1357/oh-my-pi/pull/7460
    - fix(ai): guarantee ollama user turn and surface done_reason load by @roboomp in https://github.com/can1357/oh-my-pi/pull/7466
    - fix(catalog): add reasoning config for deepseek-v4 family in alibaba-token-plan by @21307369 in https://github.com/can1357/oh-my-pi/pull/7468
    - fix(catalog): use live Copilot default-tier prices by @roboomp in https://github.com/can1357/oh-my-pi/pull/7473
    - fix(session): preserve title when branching by @lemonleks in https://github.com/can1357/oh-my-pi/pull/7477
    - fix(tui): consume extension slash commands locally by @lemonleks in https://github.com/can1357/oh-my-pi/pull/7481
    - fix(agent): keep queued non-interruptible tools alive on peer-IRC interrupt by @roboomp in https://github.com/can1357/oh-my-pi/pull/7495
    - feat(mnemopi): add opt-in SQLite page-size selection by @bradmccormack in https://github.com/can1357/oh-my-pi/pull/7215
    - fix(coding-agent): prune archived session stats by @alphastorm in https://github.com/can1357/oh-my-pi/pull/7287
    - fix(hub): wake owners when supervised processes exit by @paralin in https://github.com/can1357/oh-my-pi/pull/7377
    - fix(grep): disable pcre2 jit on macos by @roboomp in https://github.com/can1357/oh-my-pi/pull/7469
