    @oh-my-pi/pi-tui
    Added
    - The resume picker renames the selected session in place: F2 opens a dialog prefilled with the current title, Enter commits, Esc cancels (#17262 by @Twilight0)
    Changed
    - Updated Bun engine requirement to ≥1.4.4
    Fixed
    - Restored WebP and JPEG images stay visible in Kitty scrollback after resuming a session (#17220).
    - Escape in an annotation note no longer discards it: the overlay closes and getDraft()/restoreDraft() let the host keep and reopen the note; Discard notes and close (confirmed by a second press) clears them instead, and code review's actions start on Paste so a stray Enter never sends the LLM review (#17271 by @H4vC, based on #17230 by @Shadorain).
    - Fixed terminal replies such as Tern's tsp;e;{"ev":"ack",…} showing up in the shell prompt after quitting omp; the exit drain now waits for the terminal to answer a final DA1 sentinel
    - Fixed the plan review sheet in Tern squeezing the "continue with" model tiers under a long plan, so the model name overlapped the tier buttons
    - /usage in Tern shows when each quota resets as a countdown (resets in 2h30m) instead of a clock time; hovering shows the date and time
    - Fixed extension ui.select dialogs treating unconfigured j/k keys as navigation, which could turn a default No into Yes when typing ok then Enter (#17255 by @SAKANA-MOONLIGHT).
    Removed
    - Removed support for the TSP t (theme) verb, as surface theme synchronization is no longer required
    @oh-my-pi/pi-utils
    Changed
    - Updated Bun engine requirement to ≥1.4.4
    @oh-my-pi/pi-wire
    Changed
    - Updated Bun engine requirement to ≥1.4.4
    Removed
    - Removed TspPalette definition and t verb from the protocol specification
