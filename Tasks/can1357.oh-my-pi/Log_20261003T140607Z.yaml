Version: 18.5.1
Installer:
- Architecture: x64
  InstallerType: portable
  InstallerUrl: https://github.com/can1357/oh-my-pi/releases/download/v18.5.1/omp-windows-x64.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    @oh-my-pi/pi-agent-core
    Added
    - Added provider-reported usage cost, the unnormalized provider ID, and the requested model ID to CostEstimatorContext, allowing cost estimators to use the cost already recorded for a request instead of recomputing it from token counts.
    Changed
    - Improved tool-result supersession so path reads with selectors are tracked independently from bare-path reads, while failed results supersede only earlier failed results for the same key.
    Fixed
    - Fixed parallel tool calls with reused or empty IDs executing with another call’s arguments or merging results; each call now executes and reports its own payload.
    - Fixed completed tool calls being retried after a transient provider-stream read error; incomplete calls from the affected turn are now discarded.
    - Fixed previously read code being removed from context when a subsequent read returned a summary, truncated content, or an error.
    - Fixed intent tracing for tools that define i as a real argument, preserving the argument and its declared schema order.
    @oh-my-pi/pi-ai
    Fixed
    - Fixed DeepSeek and OpenAI Responses requests failing or entering retry loops when replayed tool calls contained repaired arguments, orphaned tool results, or missing reasoning context.
    - Fixed requests to models that do not support sampling parameters from failing with HTTP 400 errors when accessed through non-native providers. Sampling parameters are now omitted for incompatible models, including requests made by chat judging, title generation, skill descriptions, and memory extraction.
    - Fixed OpenRouter BYOK usage being reported as free; provider inference costs and applicable credits charges are now included in session and status-line cost reporting.
    - Fixed Claude background and long-running bash commands losing their requested timeout and being terminated at the default deadline.
    - Fixed cleared credential cooldowns being incorrectly restored by another concurrently running session.
    - Fixed retryable Cursor provider errors, such as “Unable to reach the model provider,” from prematurely ending a turn.
    - Fixed resumed OpenAI Responses sessions losing earlier plaintext reasoning, which could cause self-hosted Responses servers to reprocess the entire context after a restart.
    - Fixed non-retryable HTTP 4xx responses being retried when their error messages contained transient-error terms such as “server_error,” “timeout,” or “overloaded.”
    - Fixed Cursor models receiving earlier multi-step tool calls as if they occurred simultaneously instead of in their original execution order.
    @oh-my-pi/browser-relay
    Fixed
    - Fixed tab adoption stalling when Chrome discards background tabs.
    @oh-my-pi/pi-catalog
    Added
    - Added support for listing models from Codex-compatible gateways through openaiCodexModelManagerOptions.baseUrl, with discovery caches isolated per endpoint.
    - Exposed the max reasoning-effort tier for Muse Spark 1.3 contributor models on Meta and Muse Code providers.
    Changed
    - Added full configurable reasoning-effort ladders for ClinePass DeepSeek V4.1 Flash Free and Muse Spark 1.3 Contributor Free models.
    - Recognize bare and provider-qualified k3 and k3-256k selectors as Kimi K3, enabling K3-specific catalog policies and replace-edit fallback behavior while preserving explicit edit-mode overrides.
    - Updated Fireworks model pricing to use Fireworks-specific rates, correcting missing and inaccurate costs for supported models.
    - Updated Fireworks fast-model listings to replace retired models with glm-5.3-fast and kimi-k3-fast; GLM-5.3 Fast now exposes low, high, and max reasoning levels on Fireworks, Baseten, and Vercel AI Gateway.
    Fixed
    - Fixed image input for OpenAI models used through custom Amazon Bedrock Converse providers when images are read through tools.
    - Fixed local Ollama thinking models continuing to reason when thinking was disabled, reducing delays such as slow session-title generation.
    - Fixed reasoning-level availability for OpenCode Go models so unsupported levels are no longer offered and reasoning can be disabled where supported.
    - Fixed Anthropic-compatible Claude Opus 5.5 sessions failing after tool use or system-prompt changes.
    - Fixed Cursor Grok 4.5 and 4.6 model selectors and overrides intermittently resolving to inconsistent model IDs.
    - Fixed Google Antigravity Gemini 3.1 Flash Image being recognized as an image-capable model for image roles and fallback chains.
    - Fixed GitHub Copilot base models reporting an incorrect long-context window when a separate -1m model is available.
    - Fixed newer OpenAI and Anthropic model families being incorrectly marked as accepting sampling parameters when accessed through compatible providers such as Amazon Bedrock, Google, Devin, or OpenRouter; explicit compatibility overrides continue to take precedence.
    @oh-my-pi/pi-coding-agent
    Added
    - Added RPC support for GPT live voice sessions bound to the RPC session, including live start, stop, mute, phase, level, transcript, and end events; closing stdin also stops an active live session.
    - Published a machine-readable RPC wire schema and added generated-client support for Python, Rust, and Go RPC clients, including protocol v2 negotiation, prompt-result handling, host tools, and host URIs. The Python client is now distributed from the SDK package location.
    - Added the read-only archive eval global for browsing projects and past sessions, viewing idle recaps and recap journals, opening session prompts, and searching prompt history. It is enabled by default with archive.enabled.
    Changed
    - wait now waits only for background jobs and services started by the calling agent and reports an error when there is no such work to wait for; messages can still end the wait.
    - Improved automatic session titles for image-only requests and mid-session refreshes so titles better reflect the user's actual goal and no longer echo placeholder text.
    - In focused subagent views, submitting . or c now continues the subagent just as it does in the main session.
    - Reduced memory use and loading time when forking sessions or when session history references the same image multiple times.
    - The computer tool's clipboard.write now updates only the desktop clipboard and no longer sends text to the terminal clipboard via OSC 52.
    - Improved terminal layout stability in Rebuild mode when resizing or zooming tmux panes.
    - Advisor concerns and notes now reach an active same-run continuation after a terminal answer instead of being retained unnecessarily.
    Fixed
    - Fixed background-job completions being lost when IRC-woken subagents finished while owned asynchronous work was still settling.
    - Fixed session reset leaving stale hashline edit snapshots available for later mismatch diagnostics.
    - Fixed multi-subagent task calls reporting success when one subagent failed.
    - Fixed RPC clients waiting indefinitely for prompt results after automatic compaction handoffs.
    - Fixed the retry prompt layout after interrupted tool calls and eliminated several TUI display issues, including flickering, duplicate streamed tool cards, blank space, and stray escape-code fragments during streaming, resizing, zooming, and clipboard or notification output.
    - Fixed shared headless browsers remaining resident after a failed close; unresponsive browser instances are now replaced automatically.
    - Fixed eval calls to extension and custom tools with strict schemas so they receive the same arguments as direct tool calls.
    - Skill URI reads now expose the selected skill path, allowing nested skills to locate sibling helpers.
    - Fixed strict subagent output schemas rejecting nested optional fields represented as null.
    - Fixed reasoning-only stops and user-uninterrupted aborts leaving sessions idle instead of continuing their configured retries.
    - OTLP exports now include chat request costs in spans, metrics, and completion logs, including provider charges when available and an explicit unavailable status when pricing cannot be determined.
    - Fixed background Bash jobs and automatically backgrounded eval cells being terminated at their default deadlines without clear guidance; async and timeout behavior is now documented and background-start messages show the applicable deadline.
    - Fixed user plugins being detected as project plugins when HOME has a trailing slash or resolves through a symlink.
    - Fixed collab.autoStart failing to host a session after a transient relay connection failure; failed room creation is retried with backoff.
    - Fixed the default advisor remaining at no model when its model becomes available after background discovery.
    - Disposed SDK sessions now release spilled tool output and reject further artifact writes.
    - Fixed Python Eval corrupting quoted source containing shell or magic syntax, including multiline strings.
    - Fixed explicit GitHub Copilot model selections and enabledModels entries being replaced by similarly named bundled models when the requested model came from the cached Copilot catalog.
    - Fixed copied text, Warp agent notifications, and terminal notifications occasionally corrupting the display while output streamed.
    - Advisors now receive the file path for pasted or dragged images so they can open the image with read.
    - Fixed collaboration guests queueing host-only prompts locally instead of receiving the appropriate refusal.
    - git worktree add and omp worktree add now run the new worktree's post-checkout hook, including fallback checkouts.
    - Added a warning when submitted prompts cannot be saved to persistent history until saving recovers.
    - Compiled extensions can now import root-level @oh-my-pi/pi-catalog modules.
    - Fixed idle compaction hiding the final assistant answer when advisor notes followed it.
    - omp render and resumed sessions now preserve token counts when imported assistant messages lack cost data.
    - Fixed cross-agent messages and background-job output from incorrectly closing or forging harness blocks.
    - openai-codex model discovery now uses the configured compatible gateway for model listing without sending ChatGPT OAuth credentials to that gateway.
    - Plan mode and device-only write sessions can now cancel their own background jobs and subagents with write proc://<id>/kill.
    - Fixed browser relay opens stalling on discarded tabs.
    - Fixed GitHub web scraping entries with deleted authors failing to render; they now display as @ghost.
    - Fixed stale-read pruning incorrectly discarding code that had already been read after a later summarized, partial, or failed read.
    - Session usage and cost totals now include Mnemopi memory completions, including billed failures before a fallback succeeds.
    - Fixed Hindsight banks with more than 100 mental models losing models from context, seed setup, or listings.
    - Prompts submitted during /handoff generation now wait for compaction to complete before starting.
    - Fixed supervised PTY services receiving an unintended startup keypress.
    - Fixed bash commands using pty: true missing shell environment variables, and ensured extension-provided environment changes follow session switches correctly.
    - Fixed notes-backed context rollover restoring an outdated parent assignment when reviving a subagent.
    - Advisor tool calls now report the advisor as the calling agent to extension tool-call and tool-result handlers.
    - Fixed the IDA integration on Windows: the IDA worker crashed after its first response, and timing out or aborting an IDA request killed the worker instead of interrupting it (#14186 by @H4vC)
    @oh-my-pi/pi-mnemopi
    Changed
    - Upgraded local embedding support to fastembed 3.0.0. Models now download from Hugging Face into the updated cache layout, with interrupted downloads resuming automatically; existing models are migrated on first use while producing the same vectors.
    Fixed
    - Fixed enhanced recall returning cached results from an unrelated longer query when answering a shorter query.
    - Fixed local embedding setup on fresh caches and Linux ARM64, including compatibility with current model downloads and ARM64 tokenization support.
    @oh-my-pi/pi-natives
    Fixed
    - Fixed macOS computer-use scrolling so takeover and desktop scroll actions move iPhone Mirroring and other pixel-forwarding windows reliably, with smooth mouse-like wheel steps.
    - Fixed macOS computer-use value entry for date and time controls, including Calendar date pickers, with support for ISO 8601 dates and date-times and clear validation for unsupported formats.
    - Fixed macOS computer-use value entry for popup buttons, allowing options to be selected by title with confirmation and reporting available options when a title is not found.
    - Fixed macOS accessibility values for checkboxes, radio buttons, and radio groups so snapshots, attributes, and window information return usable numbers, titles, and referenced element values instead of debug representations.
    @oh-my-pi/omp-stats
    Fixed
    - Fixed stats dashboard request rows for Judge and other role-model calls so they open correctly and display usage details.
    - Fixed stats and summary error-rate formatting so small nonzero percentages are displayed accurately instead of as 0.0%.
    - Fixed a visual fringe on the edges of the stats dashboard’s “Classify with judge” button.
    @oh-my-pi/pi-tui
    Added
    - Added native terminal support for submitting explicit composer prompts atomically, preserving displaced drafts and attachments for local recall.
    - Added progress percentages to subagent entries in the agent tree, task, and wait views.
    - Added a Rebuilding… indicator for lengthy tmux resize redraws without flashing it for quick updates.
    - Added writeTerminalSequence() for sending supported terminal escape sequences through the active terminal output stream, with stdout fallback when no terminal is active.
    Changed
    - Clipboard payloads are now represented by their length in PI_TUI_WRITE_LOG rather than by their contents.
    Fixed
    - Fixed pending clipboard-image attachments being bypassed when subsequent input or native prompts were submitted before loading completed.
    - Improved narrow /models layouts by retaining the scope sidebar while simplifying and truncating model rows as needed.
    - Fixed Markdown rendering with themes that do not define their own symbol set; the active theme's symbols are now used as a fallback.
    - Fixed model role assignment showing models that are unavailable for the selected provider.
    - Improved tmux resize, zoom, and rebuild behavior, including smoother coalesced redraws, reduced visual artifacts and extra output, correct transcript restoration after rapid size changes, and preservation of history when panes are resized.
    - Fixed multiline paste on Windows inserting escape-code fragments instead of line breaks, and prevented bracketed-paste markers from appearing in the composer.
    - Fixed terminal notifications occasionally corrupting the screen with stray escape-code fragments during streaming output.
    - Added rendering and notification compatibility for Monstar terminals, including Kitty graphics, hyperlinks, synchronized output, styled underlines, progress keepalives, and Monstar-focused desktop notifications.
    - Fixed Agent Hub transcripts crashing when assistant messages do not include usage or cost data.
    - Fixed idle terminal activity notifications while preserving bracketed-paste recovery during input and rendering.
    - Fixed diff blocks in ask questions losing their layout; additions and removals now retain separate diff highlighting.
    - Fixed duplicate ASCII Plan, Prewalk, and Goal labels in the status line.
    - Improved Markdown rendering for long and streamed messages, including display math, fenced code, reference links, lists, whitespace, emphasis, and line breaks, so completed content no longer shows raw markup, misplaced blank lines, or broken block layout.
    @oh-my-pi/pi-utils
    Added
    - Added utilities for detecting and scanning own-line display-math blocks in growing text, including identifying possible openers and closers efficiently.
    - Added an option to TerminalQueryResponder that lets PTY hosts provide cursor-position reports themselves.
    - Added refreshShellConfigCache() to rebuild the cached shell spawn environment from the current process environment.
    Fixed
    - Fixed the Markdown lexer dropping text preceding U+2028 or U+2029 line-separator characters.
    @oh-my-pi/pi-wire
    Added
    - Added support for submitting explicit prompts to live editable composers without simulating keyboard input.
