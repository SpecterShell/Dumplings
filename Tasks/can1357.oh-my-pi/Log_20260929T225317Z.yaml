    - docs: list overflow detection as a contextTokens consumer by @kvnloo in https://github.com/can1357/oh-my-pi/pull/13713
    - docs(web_search): remove stale default-chain model references by @kvnloo in https://github.com/can1357/oh-my-pi/pull/13710
    - docs(tools/computer): correct prompt path after computer-safety→computer-use rename by @kvnloo in https://github.com/can1357/oh-my-pi/pull/13707
    - docs(retry): note text-only committed-text-stream-stall continuation by @kvnloo in https://github.com/can1357/oh-my-pi/pull/13712
    - docs: corrected read tool to reference summarizeCodeAsync by @kvnloo in https://github.com/can1357/oh-my-pi/pull/13711
