  Key: ReleaseNotes
  Value: |-
    @oh-my-pi/pi-agent-core
    Fixed
    - When a DeepSeek turn ends with raw <｜DSML｜…> tool-call text that could not be parsed into a real call, and no tool call was made, the broken markup is now removed from the message before it is saved to history. The agent then tells the model the tool call failed, shows it the correct format, and asks it again, at most twice in a row. Previously the markup stayed in history, and the agent stopped as if the model had finished (#14202 by @H4vC).
    @oh-my-pi/pi-ai
    Fixed
    - Fixed Antigravity chat and image requests sending an outdated client version when the model list came from cache, which could make newer models such as Claude Opus 5.5 unavailable.
    - When a DeepSeek model writes a broken DSML tool call (for example with the opening <｜DSML｜tool_calls> and <｜DSML｜invoke> tags missing), its closing tags are now kept in the streamed text instead of being dropped. This lets the agent remove exactly the broken call while keeping any text after it (#14202 by @H4vC).
    @oh-my-pi/pi-catalog
    Fixed
    - Fixed DeepSeek V4 model IDs and the V4.1 Flash alias lacking version information in model identity and dashboards (#14194).
    - Fixed Antigravity models such as Claude Opus 5.5 and Sonnet 5.5 disappearing after omp models refresh. When the update check failed, omp reported an outdated Antigravity client version (2.8.0), so the server left the newer models out of the list. The fallback version is now 2.19.1.
    - DSML tool calls from DeepSeek models are now parsed on every host. This includes local servers (llama.cpp, LM Studio, vLLM), custom providers from models.yml, and gateways that weren't on the old list of supported hosts. Before, a complete <｜DSML｜tool_calls> envelope from these hosts showed up as plain text and the tool never ran (#14202 by @H4vC).
    @oh-my-pi/pi-coding-agent
    Added
    - The /models Roles view shows which saved model preset is in effect, and Ctrl+←/→ (or p/P on the role rows, for macOS where Ctrl+←/→ switches Spaces) switches to the next or previous one, in Tern and text mode (#14210 by @H4vC)
    Changed
    - Picking a model for a role in /models now puts the cursor on the model list, so ↑/↓ choose a model and Enter assigns it right away instead of moving through the sidebar and dropping the role selection; ← still reaches the providers (#14210 by @H4vC)
    - Sped up secret redaction on long conversations: it no longer slows down as history grows (#14213 by @H4vC)
    - Startup is faster with plugins that bundle large dependency trees: the extension loader no longer re-reads and re-checks the same files while loading them (e.g. ~280 ms → ~185 ms with the IDA MCP plugin) (#14219 by @H4vC)
    Fixed
    - Fixed an EPIPE: broken pipe unhandled rejection crashing the session when a debug adapter, eval kernel, IDA worker, or RPC server exits mid-write (seen on Windows) (#14196 by @andrebrait)
    @oh-my-pi/omp-stats
    Fixed
    - Fixed the Frustration page splitting DeepSeek V4 provider variants and the V4.1 Flash alias into separate model-version rows (#14194).
    @oh-my-pi/pi-tui
    Fixed
    - Fixed Alt+Up (restore queued steering), arrows and other escape-sequence keys on Windows acting as Esc (interrupting the turn) and typing [1;3A into the editor when the console host relays them one byte at a time (#14216 by @H4vC).
    What's Changed
    - fix(catalog): agy anthropic models display by @H4vC in https://github.com/can1357/oh-my-pi/pull/14197
    - fix(stats): merged DeepSeek V4 frustration rows by revision by @roboomp in https://github.com/can1357/oh-my-pi/pull/14199
    - fix(dsml): parse DeepSeek DSML on every host and keep unparsed markup out of history by @H4vC in https://github.com/can1357/oh-my-pi/pull/14202
    - feat(tui): switch model presets with ctrl+arrows in the /models roles view by @H4vC in https://github.com/can1357/oh-my-pi/pull/14210
    - perf(secrets): speed up secret redaction by @H4vC in https://github.com/can1357/oh-my-pi/pull/14213
    - fix(tui): reassemble escape keys relayed as win32-input-mode text records by @H4vC in https://github.com/can1357/oh-my-pi/pull/14216
    - perf(coding-agent): memoize legacy extension graph walk lookups by @H4vC in https://github.com/can1357/oh-my-pi/pull/14219
    - fix(coding-agent): handle pending pipe write failures by @andrebrait in https://github.com/can1357/oh-my-pi/pull/14196
    Full Changelog: https://github.com/can1357/oh-my-pi/compare/v18.5.1...v18.6.0
