    - fix(tui): deferred stalled win32 relay flushes by @roboomp in https://github.com/can1357/oh-my-pi/pull/18514
    - fix(memory): omit missing summary read path by @nick-maderight in https://github.com/can1357/oh-my-pi/pull/18523
    - fix(task): kept isolated cleanup alive on signal exit by @roboomp in https://github.com/can1357/oh-my-pi/pull/18524
    - fix(coding-agent): bound consecutive generic abort retries by @nick-maderight in https://github.com/can1357/oh-my-pi/pull/18535
    - fix(stats): don't invalidate parser cursors when a filesystem's device number changes by @Alex-Wengg in https://github.com/can1357/oh-my-pi/pull/18536
    - fix(compaction): run the display summary without reasoning by @phillipxkang in https://github.com/can1357/oh-my-pi/pull/18541
    - fix(mnemopi): key the local encoder cache by model by @eggpeat in https://github.com/can1357/oh-my-pi/pull/18562
    - fix(coding-agent): default omitted todo append phase by @taotao7 in https://github.com/can1357/oh-my-pi/pull/18575
    - fix(wait): explain the idle window in timed-out wait results by @alphastorm in https://github.com/can1357/oh-my-pi/pull/18612
    - feat(tui): split ask HTML forms into question tabs with Review and hide in Tern by @Gabriel-Hiss in https://github.com/can1357/oh-my-pi/pull/18608
    - feat(auth): pause providers with a KDL disabled rule; pause Google Antigravity by @H4vC in https://github.com/can1357/oh-my-pi/pull/18622
    - fix(collab): bound and attribute the host's send-queue admission by @iliaal in https://github.com/can1357/oh-my-pi/pull/11371
    - fix(coding-agent): preserve role ownership for retry fallback chains by @harshaygadekar in https://github.com/can1357/oh-my-pi/pull/18534
