    - fix(tui): keep a tree node's leading span style off its continuation rails by @chan1103 in https://github.com/can1357/oh-my-pi/pull/18584
    - fix(gemini): added base64 skip-thought-signature compat for Gemini gateways by @tuandinh0801 in https://github.com/can1357/oh-my-pi/pull/18586
    - fix(tui): opened prefilled ask inputs at the start by @roboomp in https://github.com/can1357/oh-my-pi/pull/18587
