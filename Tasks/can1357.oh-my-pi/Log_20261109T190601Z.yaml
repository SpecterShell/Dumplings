    - fix(mnemopi): reject obsolete background embedding writes by @eggpeat in https://github.com/can1357/oh-my-pi/pull/18503
    - fix(hindsight): prune expired quarantine on every outbox drain by @eggpeat in https://github.com/can1357/oh-my-pi/pull/18504
    - fix(autoresearch): match the ideas heading before inserting a note by @eggpeat in https://github.com/can1357/oh-my-pi/pull/18505
