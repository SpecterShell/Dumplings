- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    What's new
    - Automatic update checks. OpenMathpix now checks for a new version shortly after it starts and then at most once a day. When one is available, a notice at the top of the window offers Download Update or Remind Me Later, with no pop-up dialog. Turn it off under Settings → General → Check for updates automatically.
    Fixes
    - All-users installs went into your personal folder. If you switched the setup language on the first page and then chose Anyone who uses this computer, OpenMathpix was installed in your user folder instead of Program Files, so other Windows users could not open it. It now installs in Program Files.
    - The uninstaller now uses the app's language. Previously it used the language chosen during setup, even if you had changed the language in the app afterwards.
    Upgrading
    - From 2026.11.14 or earlier, use Help → Check for Updates once. From this version on, new releases are announced automatically. Your settings, history and models are kept.
    - If you were affected by the all-users bug, uninstall OpenMathpix (choose Keep my data) and install this version. Upgrading in place keeps the old folder.
    Download
    Download OpenMathpix-Setup-2026.11.15-x64.exe below (Windows 10/11, x64). The installer is not code-signed yet. If Windows SmartScreen appears, click More info → Run anyway. You can verify the file against the attached .sha256.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    更新内容
    - 自动检查更新：启动后稍等片刻会检查一次新版本，之后每天最多检查一次。有新版本时，窗口顶部会显示提示，可选择“下载更新”或“稍后提醒”，不会弹窗。可在“设置 → 通用 → 自动检查更新”中关闭。
    问题修复
    - “为所有用户安装”装进了个人目录：如果在安装程序第一页切换了语言，再选择“为使用这台电脑的任何人安装”，程序会被装进当前用户的个人文件夹，而不是 Program Files，其他 Windows 用户无法打开。现已修复。
    - 卸载程序现在使用应用的语言：以前卸载程序使用安装时选择的语言，即使之后在应用里改过语言也不变。
    升级说明
    - 2026.11.14 及更早版本的用户：请点“帮助 → 检查更新”手动更新一次；从这个版本开始，新版本会自动提示。设置、历史记录和模型都会保留。
    - 受“为所有用户安装”问题影响的用户：请先卸载（选择“保留我的数据”），再安装此版本。直接升级会沿用原来的文件夹。
