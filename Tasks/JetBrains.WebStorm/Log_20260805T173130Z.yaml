  Key: ReleaseNotes
  Value: |-
    What's fixed:
    - We've introduced the Figma Connect for WebStorm plugin. Select a layer in your Figma file and get its design context directly in WebStorm. The context is attached to the AI Chat automatically. Requires a one-time setup.
    - We've bundled a Chrome DevTools CLI skill into WebStorm, so AI agents can open Chrome, read console logs and network requests, take screenshots, and interact with the running page. One-time package installation on first use, automatic startup after that.
    - We've restored compatibility between the Svelte plugin and GoLand 2026.2 (WEB-78987).
    For more details, please see the release notes.
