  Key: ReleaseNotes
  Value: |-
    Thank you so much for using Orca and for your continued support! ❤️
    Please note: It usually takes 48–72 hours for a landed PR to be released (except P0+ fixes). We have many more exciting PRs and features coming in later versions!
    Notable changes
    - Faster worktree creation and smoother performance across terminals, large diffs, Git operations, and the app UI.
    - A more capable native chat experience, with image paste and attachment previews plus improved send and response reliability.
    - More reliable remote/SSH and Windows/WSL workflows, including safer terminal recovery, path handling, and updater downloads.
    UI / workspaces
    - perf: overlap independent worktree create preflight by @nwparker in https://github.com/stablyai/orca/pull/17386
    - perf(worktree): prepare checkouts while the composer is open by @nwparker in https://github.com/stablyai/orca/pull/17290
    - fix(worktree): complete a create Git can confirm but cannot list by @nwparker in https://github.com/stablyai/orca/pull/17388
    - perf(worktree): overlap finalization head probes by @nwparker in https://github.com/stablyai/orca/pull/17443
    - perf(worktree): parallelize head identity metadata reads by @nwparker in https://github.com/stablyai/orca/pull/17449
    - perf(diff): defer large diffs until user loads them by @AmethystLiang in https://github.com/stablyai/orca/pull/17521
    - Add show-more button for recent tabs in empty-query palette by @AmethystLiang in https://github.com/stablyai/orca/pull/17693
    - fix(tasks): keep the remembered GitHub scroll offset instead of clobbering it (STA-5949) by @nwparker in https://github.com/stablyai/orca/pull/17433
    - fix(tasks): restore scroll position when reopening GitHub item details by @AmethystLiang in https://github.com/stablyai/orca/pull/17524
    - feat(browser): edit a page annotation's comment and intent inline in the tray by @Sahir619 in https://github.com/stablyai/orca/pull/17511
    - fix(browser): show immediate feedback during reload by @Jinwoo-H in https://github.com/stablyai/orca/pull/17635
    Agents / native chat
    - Fix select all in the native chat composer by @brennanb2025 in https://github.com/stablyai/orca/pull/17294
    - fix(native-chat): keep agent responses selectable by @brennanb2025 in https://github.com/stablyai/orca/pull/17437
    - fix(native-chat): recover a transport-unconfirmed send instead of wedging the queue by @brennanb2025 in https://github.com/stablyai/orca/pull/17383
    - fix(native-chat): preserve structured chat across rollback by @brennanb2025 in https://github.com/stablyai/orca/pull/17439
    - fix(native-chat): paste images in structured Codex chat by @brennanb2025 in https://github.com/stablyai/orca/pull/17498
    - feat(native-chat): preview pending image attachments by @brennanb2025 in https://github.com/stablyai/orca/pull/17517
    - Fix duplicated Codex startup command in new agent tabs by @nwparker in https://github.com/stablyai/orca/pull/17488
    - fix(agents): keep OMP identity and forward ask/approval events by @brennanb2025 in https://github.com/stablyai/orca/pull/15713
    - fix(omp): read Pi/OMP static state-title markers and retire stale spinners by @brennanb2025 in https://github.com/stablyai/orca/pull/14602
    Terminal
    - perf(terminal): assemble queued output chunks linearly by @nwparker in https://github.com/stablyai/orca/pull/17500
    - perf(terminal): fast-path chunks without agent status markers by @nwparker in https://github.com/stablyai/orca/pull/17514
    - fix(paste): exclude xterm helper textareas from text ownership by @nwparker in https://github.com/stablyai/orca/pull/17475
    - Upgrade xterm to 6.1.0-beta.303 and generate the addon patches by @nwparker in https://github.com/stablyai/orca/pull/17335
    Windows, remote server / SSH
    - fix(updater): accept GitHub release asset redirects on Windows by @nwparker in https://github.com/stablyai/orca/pull/17369
    - perf(wsl): place worktrees inside the distro when the project runs in WSL by @nwparker in https://github.com/stablyai/orca/pull/17387
    - fix(cli): resolve a WSL shell's Linux path to the UNC-stored worktree by @nwparker in https://github.com/stablyai/orca/pull/17440
    - fix(cli): resolve WSL mounted-drive worktree paths by @nwparker in https://github.com/stablyai/orca/pull/17474
    - fix(ssh): match the exact worktree created by @nwparker in https://github.com/stablyai/orca/pull/17472
    - fix(remote): preserve standing host reconnect intent by @brennanb2025 in https://github.com/stablyai/orca/pull/17067
    - fix(remote): re-activate the pending host surface on paired PTY attach (STA-5291) by @nwparker in https://github.com/stablyai/orca/pull/17429
    - fix(relay): reap owned PTYs when the daemon dies on an uncaught exception (STA-5697) by @brennanb2025 in https://github.com/stablyai/orca/pull/16894
    - fix(daemon): bound the whole boot-recovery sequence with one budget (STA-5732) by @nwparker in https://github.com/stablyai/orca/pull/17427
    Performance / reliability
    - perf(git): bound git subprocess execution with an atomic admission scheduler by @brennanb2025 in https://github.com/stablyai/orca/pull/16874
    - fix(session): deduplicate editor records during restore by @nwparker in https://github.com/stablyai/orca/pull/17370
    - fix(persistence): stop rejected UI trailing flush loops by @Jinwoo-H in https://github.com/stablyai/orca/pull/17378
    - perf(packaging): ship one native runtime per target by @nwparker in https://github.com/stablyai/orca/pull/17528
    - perf(build): minify desktop JavaScript bundles without dropping crash context by @nwparker in https://github.com/stablyai/orca/pull/17527
    - ci(release): publish main-process source maps with each release by @nwparker in https://github.com/stablyai/orca/pull/17630
    - feat(docs): publish OSS docs with stable releases by @nwparker in https://github.com/stablyai/orca/pull/17622
    New Contributors
    - @Sahir619 made their first contribution in https://github.com/stablyai/orca/pull/17511
