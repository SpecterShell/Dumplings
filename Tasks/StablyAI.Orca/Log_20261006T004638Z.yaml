    - Reuse prepared reads while searching saved agent conversations by @nwparker in https://github.com/stablyai/orca/pull/24535
    - fix(ai-vault): bound transcript text before joining message blocks by @OrcaWin in https://github.com/stablyai/orca/pull/24659
    - fix(ai-vault): release expired host results while idle by @OrcaWin in https://github.com/stablyai/orca/pull/24766
    - Discard completed AI Vault cancellation IDs in the relay worker by @nwparker in https://github.com/stablyai/orca/pull/24820
    - Decode complete transcript lines without copying their bytes by @nwparker in https://github.com/stablyai/orca/pull/24546
    - Decode single-piece saved-session tails without copying them by @nwparker in https://github.com/stablyai/orca/pull/24632
    - refactor(ai-vault): delete the unused session-scanner worker thread by @Jinwoo-H in https://github.com/stablyai/orca/pull/24607
    Updates & reliability
    On macOS, Update & Restart no longer closes Orca and waits forever on background Orca servers, and idle updater and speech timers are released.
    - fix(updater): keep macOS Orca open when background instances block updates by @OrcaWin in https://github.com/stablyai/orca/pull/24952
    - Release completed updater setup timers and callbacks by @nwparker in https://github.com/stablyai/orca/pull/24920
    - Clear unused speech worker timers after errors and exit by @nwparker in https://github.com/stablyai/orca/pull/24924
    Relay service
    Server-side cleanup for Orca's relay and push services.
    - Release relay handshake timers when a host connection leaves by @nwparker in https://github.com/stablyai/orca/pull/24554
    - Reuse the parsed notification when leasing a push delivery by @nwparker in https://github.com/stablyai/orca/pull/24645
