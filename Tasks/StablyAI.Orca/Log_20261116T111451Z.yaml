  Key: ReleaseNotes
  Value: |-
    Customizable + menu, a faster chat store & browser Memory Saver ✨
    Orca 1.4.261 moves chat history into a new store that loads long conversations in pages, adds a customizable + menu, and frees memory from browser pages you haven't used in hours. Cursor joins Chat, and sites stay signed in after a restart.
    - ➕ Make the + menu yours: Ways to open a tab are now a compact row of icons. Use the gear to reorder them, hide the ones you don't use and set their shortcuts. Named agents rank first when you search.
    - 💬 Long chats stay quick: We further improved long chats. History now loads in pages from a SQLite store instead of being rebuilt in memory. Existing chats convert in the background or when you first open them.
    - 🌐 Lighter browser tabs: Memory Saver frees pages you haven't looked at for 4 hours and reloads them in place when you or an agent come back. orca serve tabs follow the same setting. Sites that use session cookies keep you signed in across restarts.
    - 🤖 Cursor in Chat: Run Cursor in Chat with the Cursor sign-in already on your computer. Pick a model, effort and Fast, approve commands and reopen chats later. Antigravity Chat now works on Windows, and Pi chats show their subagents.
    - 🗂️ Clearer workspace cards: Turn on the experimental workspace card under Experimental > Card style. The cards show activity, unread results, failures and offline hosts, with one unread dot per card. Switch card style from Workspace options. Finished agents stay marked Done while their panes sleep.
    - 📱 Your phone follows your desktop: The workspace list shows your project groups, one setting decides where chat and terminal links open, and Take back all returns phone-driven browser tabs.
    Previous release: 1.4.259: Major performance improvements, automatic cleanup and focused subagent views.
    Highlights
    - Agents work without taking over your screen: Computer use can launch apps, type into and click Windows controls, and read minimized or other-Space macOS windows without bringing them forward. Print dialogs, Windows Hello prompts, popups and extension tabs that an agent sets off stay out of your view.
    - Quieter notifications: Choose Silent to keep banners without sound. Orca's own notification sounds now respect macOS Focus and Windows Focus Assist.
    - Browser profiles per project and fewer PR checks: Pick which browser profile a repo's new tabs open in. Settings → Source Control → PR Updates offers Automatic, Less often or Manual polling.
    - More of Orca in your language: 1,302 missing Japanese strings are translated, with Simplified Chinese gaps filled and Turkish General settings completed.
    Compatibility & upgrade notes
    - New chat store: Existing chats convert to the new store on upgrade. The original chat files stay in place in this release, so going back to 1.4.259 still works. If you downgrade, keep chatting and upgrade again, those chats and turns show up. A chat continued in both versions appears as a second chat beside it, and nothing is deleted.
    - Finished agents: An agent's row now leaves the workspace card, Agents list and dashboard when its process exits or its SSH host disconnects, instead of lingering until dismissed. Agents whose panes are asleep keep showing Done.
    - Android: Orca for Android moves to the dev.orca.app app on Google Play, also published as an APK on GitHub. The old app prompts you to install the new one. This desktop update does not install a phone app.
    - PR Updates on remote hosts: The setting belongs to the host. Older servers show it disabled until Orca on that host is updated.

