  Key: ReleaseNotes
  Value: |-
    Thank you so much for using Orca and for your continued support! ❤️
    Please note: It usually takes 48–72 hours for a landed PR to be released (except P0+ fixes). We have many more exciting PRs and features coming in later versions!
    Notable changes
    - More reliable agent sessions, native chat, terminal recovery, and workspace state across local, remote, and SSH connections.
    - Smoother onboarding and everyday editing with faster rendering, improved review workflows, and clearer agent status.
    What's Changed
    - fix(agent-hooks): stop test runs and secondary profiles deleting the user's agent hooks (STA-5679) by @brennanb2025 in https://github.com/stablyai/orca/pull/16980
    - Show ready and close actions for draft reviews by @brennanb2025 in https://github.com/stablyai/orca/pull/16889
    - fix(e2e): drop the pi-title spec's stale private Docker-SSH connect fork by @brennanb2025 in https://github.com/stablyai/orca/pull/17017
    - Fix GitLab MR management menu in Checks sidebar by @brennanb2025 in https://github.com/stablyai/orca/pull/16906
    - fix(remote): stop painting a disconnected host as connected by @brennanb2025 in https://github.com/stablyai/orca/pull/17050
    - Fix lost session-tab changes during initial census by @Jinwoo-H in https://github.com/stablyai/orca/pull/17064
    - Stop the OS keyring probe from gating the first window on Linux by @brennanb2025 in https://github.com/stablyai/orca/pull/16912
    - fix(sta-5781): stop cross-client resets of workspace view preferences by @Jinwoo-H in https://github.com/stablyai/orca/pull/17057
    - fix(ui): label agent state glyphs and swap monitoring to a heartbeat by @brennanb2025 in https://github.com/stablyai/orca/pull/16981
    - fix(mobile): create-worktree sheet dies after picking a source and loses the picked PR by @brennanb2025 in https://github.com/stablyai/orca/pull/16917
    - Fix Windows daemon host pruning on unverifiable liveness by @brennanb2025 in https://github.com/stablyai/orca/pull/16908
    - Never let a non-owning provider answer a PTY presence question false during the daemon swap window by @brennanb2025 in https://github.com/stablyai/orca/pull/16953
    - feat(native-chat): Codex structured native chat restructure by @brennanb2025 in https://github.com/stablyai/orca/pull/16729
    - Bump mobile app.json to 0.0.47 by @brennanb2025 in https://github.com/stablyai/orca/pull/17102
    - feat(i18n): localize onboarding checklist steps to Korean by @hwantage in https://github.com/stablyai/orca/pull/17108
    - perf(editor): stop re-rendering every code block on each keystroke by @nwparker in https://github.com/stablyai/orca/pull/17008
    - fix(ci): stop the Linux Electron probe step from starving its own probes by @brennanb2025 in https://github.com/stablyai/orca/pull/17071
    - test: stabilize process and transcript liveness checks by @nwparker in https://github.com/stablyai/orca/pull/17126
    - test: widen updater schedule boundary margin by @nwparker in https://github.com/stablyai/orca/pull/17130
    - Repair scheduled computer-use CI by @nwparker in https://github.com/stablyai/orca/pull/17122
    - Fix setup-provisioned skills missing at agent startup by @nwparker in https://github.com/stablyai/orca/pull/17124
    - fix(terminal): recover OMP from stale working directories by @nwparker in https://github.com/stablyai/orca/pull/17128
    - fix(gpu): persist the safe-graphics marker before the restart prompt by @nwparker in https://github.com/stablyai/orca/pull/16945
    - feat(i18n): localize Agent Dashboard to Korean by @junyeokk in https://github.com/stablyai/orca/pull/17121
    - fix(gpu): capture hardware identity in crash reports by @nwparker in https://github.com/stablyai/orca/pull/16973
    - Pin pnpm and rebalance scheduled E2E by @nwparker in https://github.com/stablyai/orca/pull/17133
    New Contributors
    - @junyeokk made their first contribution in https://github.com/stablyai/orca/pull/17121
