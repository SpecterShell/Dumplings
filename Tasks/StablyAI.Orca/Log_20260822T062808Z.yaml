  Key: ReleaseNotes
  Value: |-
    Thank you so much for using Orca and for your continued support! ❤️
    Please note: It usually takes 48–72 hours for a landed PR to be released (except P0+ fixes). We have many more exciting PRs and features coming in later versions!
    Notable changes
    - Cmd+J search results are now ranked by recency, making it much easier to find past agent conversations.
    - Remote and paired workspaces recover more reliably after reconnects, host handoffs, and app restarts.
    - Terminal panes are more reliable when parked, restored, split, or waiting for protocol replies.
    - Codex account changes no longer show false restart notices after reauthentication, and Codex 0.149 usage checks work with the current approval-policy CLI contract.
    - Multi-host workspace discovery, search, and CLI targeting are clearer and more accurate.
    UI / workspace
    - fix(workspaces): re-seed a terminal when an emptied workspace is opened by @Jinwoo-H in https://github.com/stablyai/orca/pull/15513
    - fix(workspaces): settle an orca.yaml trust prompt when the modal slot is taken by @brennanb2025 in https://github.com/stablyai/orca/pull/15540
    - feat(cmd-j): rank palette results by direct matches and recency by @AmethystLiang in https://github.com/stablyai/orca/pull/15551
    - fix(tabs): stop split workspaces multiplying columns on return by @nwparker in https://github.com/stablyai/orca/pull/15482
    - fix(sidebar): host-qualify discovery notice rows on multi-host projects by @brennanb2025 in https://github.com/stablyai/orca/pull/15546
    Agents / native chat
    - fix(agent-hooks): stop backgrounded Claude sessions posting a stale pane key by @brennanb2025 in https://github.com/stablyai/orca/pull/15304
    - fix(agent-hooks): stop Antigravity's Windows hook from spawning PowerShell on every event by @nwparker in https://github.com/stablyai/orca/pull/15520
    - fix(rate-limits): support Codex 0.149 approval policy by @Jinwoo-H in https://github.com/stablyai/orca/pull/15823
    - fix(codex): suppress false restart notices after reauth by @Jinwoo-H in https://github.com/stablyai/orca/pull/15835
    Terminal
    - fix(terminal): keep a cold-parked pane's runtime-graph leaf while its PTY lives by @Jinwoo-H in https://github.com/stablyai/orca/pull/15514
    - fix(terminal): require a proven exit before retiring a subscription's lease by @brennanb2025 in https://github.com/stablyai/orca/pull/15470
    - refactor(shell): collapse the zsh wrapper to one .zshenv and a precmd hook by @nwparker in https://github.com/stablyai/orca/pull/15391
    - fix(pty): keep a CPR reply from overtaking a deferred colour reply by @nwparker in https://github.com/stablyai/orca/pull/15559
    - fix(terminal): refuse a cursor on a screen read, and correct the source docs by @nwparker in https://github.com/stablyai/orca/pull/15563
    - fix(terminal): keep xterm's render pause latched for a pane with no layout box by @brennanb2025 in https://github.com/stablyai/orca/pull/15555
    - fix(pty): delete the reply-withholding scheduler by @nwparker in https://github.com/stablyai/orca/pull/15578
    Remote server / SSH
    - fix(remote): stop paired-tab resurrection, ghost agent rows, and frozen visible panes by @Jinwoo-H in https://github.com/stablyai/orca/pull/15459
    - feat(remote): add a positional file read to the filesystem provider by @brennanb2025 in https://github.com/stablyai/orca/pull/15517
    - fix(runtime): stamp a runtime's own project setups as local, and report remote status about the remote by @nwparker in https://github.com/stablyai/orca/pull/15376
    - fix(cli): resolve host names across both kinds, and stop ssh: answering empty by @nwparker in https://github.com/stablyai/orca/pull/15449
    - fix(terminal): make remote-host take-back release the phone-fit lock by @brennanb2025 in https://github.com/stablyai/orca/pull/15473
    - docs(ssh): state the SSH execution boundary and pin the liveness vocabulary by @brennanb2025 in https://github.com/stablyai/orca/pull/14971
    Windows / WSL
    - Ship the WSL transcript helper with the Windows relay by @OrcaWin in https://github.com/stablyai/orca/pull/15529
    - fix(worktrees): cover WSL distro history and bound the retirement backfill scan by @brennanb2025 in https://github.com/stablyai/orca/pull/14924
    Browser
    - fix(browser): scope a native cookie import's clear to the domains it imports by @brennanb2025 in https://github.com/stablyai/orca/pull/15375
    - fix(browser): name the requesting frame and the permission in denial notices by @brennanb2025 in https://github.com/stablyai/orca/pull/15542
    Mobile (mobile has its own release cycle, so here is just a reference, not actual release for mobile)
    - fix(mobile): keep a terminal lease alive when the handle lookup fails by @brennanb2025 in https://github.com/stablyai/orca/pull/15463
    - fix(mobile): keep a desktop take-back from being undone by a passive viewport report by @brennanb2025 in https://github.com/stablyai/orca/pull/15539
    - fix(mobile): scope optimistic workspace removal to the deleted host by @brennanb2025 in https://github.com/stablyai/orca/pull/15424
    - fix(mobile): replay a delivery-ambiguous worktree.create instead of failing it by @brennanb2025 in https://github.com/stablyai/orca/pull/15472
    - docs(readme): add the Android install guide link to README.ko.md by @Jinwoo-H in https://github.com/stablyai/orca/pull/15566
    Tests / CI
    - ci: bound the shell-contracts apt install so a stalled mirror cannot wedge the run by @brennanb2025 in https://github.com/stablyai/orca/pull/15532
    - feat(release): build unsigned Windows artifacts for the dev channels by @brennanb2025 in https://github.com/stablyai/orca/pull/15465
    - fix(hooks): isolate lint-staged backups per worktree by @nwparker in https://github.com/stablyai/orca/pull/15388
    - ci: stop docs-only commits from starting the skill-roundtrip matrix by @nwparker in https://github.com/stablyai/orca/pull/15474
    - fix(ci): restrict release test token permissions by @Jinwoo-H in https://github.com/stablyai/orca/pull/15675
    - test(terminal): pin the conditions that keep macOS period substitution out by @nwparker in https://github.com/stablyai/orca/pull/15393
    - test(e2e): apply the scheduled golden E2E autofix by @AmethystLiang in https://github.com/stablyai/orca/pull/15379
    Full Changelog: https://github.com/stablyai/orca/compare/v1.4.187...v1.4.188
