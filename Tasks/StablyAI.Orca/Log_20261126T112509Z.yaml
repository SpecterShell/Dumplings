    ⚡ Performance & reliability
    Orca uses less memory and main-process time, idles more quietly, and keeps proxies and process starts from stalling the app.
    - perf(terminal): release hidden parked workspaces' terminals and layouts so memory stays flat by @brennanb2025 in https://github.com/stablyai/orca/pull/45956
    - Stop re-checking every worktree's git files every 30 seconds while Orca is idle by @brennanb2025 in https://github.com/stablyai/orca/pull/48030
    - perf(git): stop cached git data from holding whole git outputs in memory by @nwparker in https://github.com/stablyai/orca/pull/48204
    - perf(sqlite): keep a short fingerprint of saved rows instead of full copies in memory by @nwparker in https://github.com/stablyai/orca/pull/48207
    - perf(chat): share identical model options when loading the saved model list by @nwparker in https://github.com/stablyai/orca/pull/48211
    - perf(git): keep only the git settings Orca reads in the per-worktree config cache by @nwparker in https://github.com/stablyai/orca/pull/48219
    - perf(sidebar): store fewer objects in the worktree owner index by @nwparker in https://github.com/stablyai/orca/pull/48222
    - fix(updater): stop release HEAD probes from crashing main behind an authenticating proxy by @nwparker in https://github.com/stablyai/orca/pull/48556
    - fix(process): start plain runProcess children off the main thread on macOS/Linux by @nwparker in https://github.com/stablyai/orca/pull/48600
    - fix(emulator): stop iOS simulator attach from killing other apps' local ports by @AmoabaKelvin in https://github.com/stablyai/orca/pull/48601
    - perf(startup): build the shell probe env only when a probe runs by @Jinwoo-H in https://github.com/stablyai/orca/pull/48736
    - perf(tab-bar): skip the bot Home search on strips no bot calls home (STA-18089) by @AmethystLiang in https://github.com/stablyai/orca/pull/48802
    - perf(disk): stop rewriting unchanged search sessions and PR check rows; name the sync call behind long main stalls by @Jinwoo-H in https://github.com/stablyai/orca/pull/48812
    - Catch main memory spikes using the memory the OS reports, checked every 10 seconds by @brennanb2025 in https://github.com/stablyai/orca/pull/48847
