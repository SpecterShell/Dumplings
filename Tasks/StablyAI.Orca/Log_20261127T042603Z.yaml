    🧠 Agents, models & accounts
    Orca keeps custom hook commands and recognizes its existing hooks when refreshing configuration.
    - Keep custom Droid hook commands. Orca re-reads the remote settings and retries when it detects a concurrent edit. #49456
    - Orca recognizes its existing Codex, Cursor, Copilot and Kiro hooks when refreshing configuration. #50185
