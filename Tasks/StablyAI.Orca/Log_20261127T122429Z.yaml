Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Rename bot threads, answer in chat & grab browser annotations ✨
    - 🧠 Using Antigravity (agy)? Update to v1.4.280. Use Antigravity only through the agy CLI or in Orca chat. To align with Antigravity’s guidance on supported integrations, this release removes support for using agy to check quota in the standalone usage meter, generate bot avatars, or write source control text such as commit messages.
    - 🤖 Make bot spaces your own. Rename group rooms and threads right from their tabs. A pinned amber gauge makes it easier to see when a bot has paused at its usage limit.
    - 💬 Better bot follow-ups in Slack. Bots can follow up in the thread or DM where you asked them to start background work. Orca also does less work to send everyday replies.
    - 💬 Answer agent questions where you type. The Chat UI brings questions into the prompt band above the message box.
    - 🌐 Grab a spot on the page to annotate. The browser annotation palette opens at the bottom in Grab mode, ready to select an element.
    - 🧠 Antigravity (agy) chat improvements. Type / before your first message to see available commands and skills. When you hit a usage limit, Orca shows when it resets and can resume the chat afterward.
    - ⌨️ Terminal improvements. Remote terminals keep their own reconnect notices. WSL terminals explain when a copied file can’t be pasted.
    - 🪟 Better Codex settings and project moves in WSL. Model and plugin changes made in Codex tabs are saved in the Linux distro. Before moving a project to a WSL host, Orca shows how many workspaces, terminal panes, and chats will move.
    Performance & patch fixes
    - ⚡ Lighter startup. Orca loads connector setup, plugin dialogs, and several integrations when you open them.
    - ⌨️ Less work across busy terminal tabs. When Orca detects a running agent, it recalculates activity for the affected tab.
    - 📱 Mobile agent list bug fix. Home’s agent lists show agents on your directly paired desktops again. Server workspaces and bots are still available on your phone.
    Coming soon
    - Left sidebar and pull request review UX overhaul.
    - Auto account switching.
    - Switch agent harness in the chat composer.

