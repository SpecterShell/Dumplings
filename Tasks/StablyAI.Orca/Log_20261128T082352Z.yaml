  Key: ReleaseNotes
  Value: |-
    Thank you for using Orca and sharing your feedback. ❤️
    Chats that survive restarts, a faster start, Workbench pages & a redesigned phone app ✨
    - 🔁 Chats keep working when Orca restarts. On macOS and Linux, Claude chats and chats with Copilot, Cursor, OpenCode, Goose, Qwen Code and Grok keep working while Orca is closed or updating, and show what they did when it opens again. The resume notice is now one line, and agents hear "back soon" instead of "Orca is not running."
    - ⚡ A faster start and a lighter Orca. Most features now load the first time you use them instead of at launch. Hidden terminals hold less memory, Claude tool calls on a Mac no longer start extra processes, and old orchestration databases shrink on their own.
    - 📱 A redesigned phone app. A session's tabs move into a sidebar, the browser gets a Safari-style bottom bar, a computer connects with one tap, and terminal keys fit on one row. Chats and settings are quieter, you can search a whole workspace, comment on diff lines, and continue a Pi terminal in a chat.
    - 🧭 Workbench pages on the app rail. Artifacts, Automations, Skills and Tasks share one Workbench layout, Plugins can get its own page (turn it on from the rail's … menu), and GitHub Tasks opens on PRs with simpler filters.
    - 🤖 Bots that are easier to follow. Bots react only when a reaction is their whole answer, and a Slack thread asking to connect an app says where the Connect card is. A bot's All N automations shows just that bot's automations, and folded bots get a right-click menu and a ring when they need you.
    - 🔌 More reliable bot tools. A bot's Integrations tab lists tools connected with a key, answers to item questions show their formatting, and Google Calendar, Docs and Gmail handle long lists, attachments and bad dates better.
    - 💬 Open more outside sessions in a chat. Droid and Kimi sessions from Session History open as a chat you can keep talking in, and Session History stops re-reading every transcript after an update.
    - 🚀 Even better Agy support. Agy chats and terminals start on the account you picked, even after an older agy put its old sign-in back.
    - 🔀 Clearer source control. A paused rebase, merge or cherry-pick shows in the branch row with one button for the next step, every place that sends review notes shares one Send notes button, and GitLab, Bitbucket, Azure DevOps and Jira get fixes.
    - 🧩 See a chat's MCP servers up front. /mcp lists the servers a new chat will get before you send anything, and shared servers start and stop more reliably.
    - 🪟 Steadier on every platform. Macs draw with the GPU again, so WebGL pages open in the built-in browser. Windows records freezes, stops crashing when a folder can't be opened, and handles spaced paths and reserved file names. Agents you turn off in Settings stay off everywhere.
    About Orca Bots (Beta)
    Orca Bots are agents you can ask to handle ongoing work. They can coordinate agents and workers across your computers, connect to your apps, and run tasks on a schedule or when something happens.
    Coming soon
    - MCP servers you add once for every agent on a computer
    - More connectors
    - Easier moves for bots between computers
    - More performance improvements
    - Improvements to pull request review, plugins and the sidebar

