Installer:
- InstallerType: nullsoft
  InstallerUrl: https://github.com/stablyai/orca/releases/download/v1.4.226/orca-windows-setup.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Thank you so much for using Orca and for your continued support! ❤️
    We released two versions today. You can also check out the release notes for v1.4.225.
    The short version
    - Jira and workspaces: Jira now has boards, sprint and status views, saved filters, planning columns, reusable prompt templates, quicker assignment, and safer agent access from the CLI. Folder workspaces are easier to find, and a new workspace can run only its setup script.
    - Native chat and agents: Native chat can show inline edit diffs, wrap long code lines, zoom Mermaid diagrams, display Codex context usage, and retain the correct permission mode. More terminal conversations can resume in a new native chat, and agent status stays accurate across restarts and closed terminals.
    - Windows and WSL: Orca can run an experimental managed host in a WSL distro, with clearer recovery and account handling. It also improves Windows hooks, daemon checks, and the Windows-to-WSL path experience.
    - Terminals and remote servers: Terminal restoration, layouts, IME input, and daemon status are more reliable. SSH and managed-server connections recover more cleanly, keep terminal state, and handle mixed Orca versions better.
    - Browser and source control: Browser automation no longer takes your keyboard, and source-control refreshes and linked reviews are more dependable.
    - Mobile, performance and polish: Mobile downloads show progress, chats and server workspaces work more smoothly, and Orca avoids unnecessary background work in hooks, WSL, session history, worktree creation, and mobile updates.
    Notes
    Experimental WSL hosts: Running a managed Orca host inside a WSL distro, and moving projects into it, are experimental in this release.

