  Key: ReleaseNotes
  Value: |-
    Microphone checks, saved browser notes and steadier chats
    Orca 1.4.257 gives you more control over dictation in Chat UI and terminals, protects unsent page feedback, and reduces freezes when several long chats stream at once.
    - Check your voice input: In Settings → Voice → Input, use Test to record and play back your microphone and see what a ready speech model heard. Stop After Silence lets you choose 30 seconds, one minute, two minutes or Off, so dictation can wait while you think.
    - Keep your browser feedback: Unsent text annotations survive restarts, and closing their tab asks before discarding them. Agents running on the desktop can read those notes with orca tab annotations, without you pressing Send.
    - Keep chats moving: Run several long Chat UI conversations with fewer freezes as replies stream. Your latest Claude model choice also stays selected when older replies arrive.
    - Paste while a terminal connects: Commands pasted into a starting or reconnecting terminal now wait for the shell, rather than being dropped. This covers pastes up to 64 KB; larger pastes still need a connected terminal.
    - Automate folder workspace setup: Run configured setup scripts when creating folder workspaces and archive scripts before removal, including workspaces created through the CLI. Folder workspaces share the same underlying folder.
    For easier on-device dictation setup and earlier long-chat improvements, see 1.4.256, released November 10.
