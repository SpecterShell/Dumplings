  Key: ReleaseNotes
  Value: |-
    Thank you so much for using Orca and for your continued support! ❤️
    Please note: It usually takes 48–72 hours for a landed PR to be released (except P0+ fixes). We have many more exciting PRs and features coming in later versions!
    Notable changes
    - The sidebar's two create affordances are now one Create menu: Add project sits next to New workspace at every window width, with consistent labels and a keyboard-shortcut hint.
    - Structured native chat gains grouped tool batches, execution details, Codex subagent activity, /clear and /compact, session rewind, resume from Agent Session History, renameable chat tabs, and structured Codex chat on native Windows.
    - Faster relay connects and reconnects, plus a broad performance pass across the renderer, store, terminals, native-chat journal, Git parsing, and catalog indexing.
