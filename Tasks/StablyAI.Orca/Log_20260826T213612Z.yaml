    - fix(linear): unbound list-issues by default, surface truncation, bind cursor workspace by @brennanb2025 in https://github.com/stablyai/orca/pull/15824
    - Change 'SEÑOR' to 'MR' in Spanish locale by @YerayAlonso in https://github.com/stablyai/orca/pull/15594
    - fix(editor): detect .liquid files as Liquid by @webdevtodayjason in https://github.com/stablyai/orca/pull/15213
    - fix(i18n): correct five Korean strings that changed meaning in machine translation by @nwparker in https://github.com/stablyai/orca/pull/15875
    - Retry transient ripgrep spawn failures instead of demanding install by @AmethystLiang in https://github.com/stablyai/orca/pull/15983
    - UX: compact native density for context + dropdown menus by @nwparker in https://github.com/stablyai/orca/pull/15924
    - fix(i18n): match CheckRunJobs succeeded to its sibling count-label register by @erishforG in https://github.com/stablyai/orca/pull/16013
