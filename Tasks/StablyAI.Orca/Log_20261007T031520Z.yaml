    - Fix duplicate session option flags and preserve argument values by @AmethystLiang in https://github.com/stablyai/orca/pull/25382
    - fix(cursor): keep usage cookies on the resolved account by @nwparker in https://github.com/stablyai/orca/pull/25243
    - Submit initial OpenCode 2.0.12 prompts through the native startup plugin by @nwparker in https://github.com/stablyai/orca/pull/25428
    - Install OpenCode hooks in the terminal's config directory by @nwparker in https://github.com/stablyai/orca/pull/25296
    - Add repository OpenCode permission defaults by @nwparker in https://github.com/stablyai/orca/pull/25326
