    - fix(mobile): keep the working rings turning on the OTA page by @Jinwoo-H in https://github.com/stablyai/orca/pull/25299
    - fix(mobile): honour the desktop pinned-worktree placement setting by @Jinwoo-H in https://github.com/stablyai/orca/pull/25301
