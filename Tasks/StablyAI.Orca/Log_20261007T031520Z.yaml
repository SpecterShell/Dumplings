    - Update in-app Android APK links to mobile 0.0.52 by @brennanb2025 in https://github.com/stablyai/orca/pull/25168
    Workspaces & sidebar
    Revealed remote computers stay visible, workspaces with collapsed children can be reordered without crashes, the delete dialog stays steady, Create worktree no longer waits on script checks, and Activity previews stay short.
    - fix(sidebar): preserve remote host visibility across stale UI updates by @nwparker in https://github.com/stablyai/orca/pull/25737
