    Quality & delivery
    Nothing here changes what you see — it changes how smoothly Orca behaves under real workloads. Expanded below if you want the detail.
    Performance improvements
    Usage scans for Claude, Codex and OpenCode now run on a worker thread (the move called out as upcoming in v1.4.205). Terminal output skips SGR and kitty scans on plain PTY text. Automations run history virtualizes large tables.
    - perf(usage): run the Claude/Codex/OpenCode usage scans on a worker thread by @Jinwoo-H in https://github.com/stablyai/orca/pull/21114
    - perf(usage): resolve each cwd's worktree once per scan by @Jinwoo-H in https://github.com/stablyai/orca/pull/21130
    - perf(codex-usage): resume rollout scans at the last parsed byte by @Jinwoo-H in https://github.com/stablyai/orca/pull/21102
    - perf(terminal): skip background SGR scans without ESC by @nwparker in https://github.com/stablyai/orca/pull/21646
    - perf(terminal): skip kitty scans for plain PTY output by @nwparker in https://github.com/stablyai/orca/pull/21643
    - Virtualize automations run history table for large histories by @AmethystLiang in https://github.com/stablyai/orca/pull/20916
    - perf: always show project names and remove notification scans by @Jinwoo-H in https://github.com/stablyai/orca/pull/20931
    - Bound AI Vault transcript record assembly before allocation by @OrcaWin in https://github.com/stablyai/orca/pull/20963
    - fix(browser): bound CDP output for stalled clients by @OrcaWin in https://github.com/stablyai/orca/pull/20949
