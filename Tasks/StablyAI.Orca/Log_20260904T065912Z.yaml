  Key: ReleaseNotes
  Value: |-
    Thank you so much for using Orca and for your continued support! ❤️
    Please note: It usually takes 48–72 hours for a landed PR to be released (except P0+ fixes). We have many more exciting PRs and features coming in later versions!
    Notable changes
    - Faster worktree switching, Git metadata scans, terminal startup, and renderer updates across local, WSL, and remote workspaces.
    - More reliable native chat and agent sessions, including large command results, live tool progress, image attachments, and delivery recovery.
    - Broader SSH, Windows/WSL, GitLab, updater, startup, and release reliability improvements.
    UI / workspaces
    - fix(mobile): unblock targeted SSH session tab refresh by @Jinwoo-H in https://github.com/stablyai/orca/pull/17486
    - Preserve user-set workspace names across branch changes by @Jinwoo-H in https://github.com/stablyai/orca/pull/17448
    - Automations ux improvement by @AmethystLiang in https://github.com/stablyai/orca/pull/17626
    - fix(terminal): mount one surface per workspace id in the workbench (STA-4846) by @nwparker in https://github.com/stablyai/orca/pull/17432
    - Avoid Linear read re-fetches when workspace scope is unchanged by @AmethystLiang in https://github.com/stablyai/orca/pull/17529
    - fix(browser): scroll oversized viewport presets by @Jinwoo-H in https://github.com/stablyai/orca/pull/17569
    - fix(browser): refuse DevTools for offscreen guests by @Jinwoo-H in https://github.com/stablyai/orca/pull/17485
