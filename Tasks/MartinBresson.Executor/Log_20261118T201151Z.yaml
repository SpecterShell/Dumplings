- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    What's new
    - In the Notes windows you can now search all notes for text. Use the right-click menu in the notes sidebar or press Ctrl+Shift+F. Press "Esc" to exit the search all notes mode.
    - Added the keyword ns that search all notes for specific text. It can be imported from default.exc (type -imports). It's using a new keyword command $NOTESEARCH$.
    Fixes
    -  -n and -na would lowercase all input text (note name and note text).
    - $NOTEOPEN$ based keywords now respect the "add to history" option.
