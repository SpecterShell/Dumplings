- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    What's new
    - Added the option to launch tag by using the keyword lt [tag-name], this will launch all keywords with a specific tag, this allows an alternative workflow style of doing multiple commands, where you for example tag some specific tools and/or project assets with a tag and then you can launch all of them by using the lt keyword and use that tag as a parameter. You can import the lt keyword from extras.exc (type imports).
    - Added $LAUNCHTAG$ which is a keyword command that takes a tag name as parameter. This is used by the keyword lt. This means you can create a keyword that launches all keywords with a specific tag, by setting keyword.command=$LAUNCHTAG$ and keyword.parameters=thenameofthetag.
    Improvements
    - In the Keyword Editor a tooltip will list special tags when hovering mouse over the Tags label.
    - When exporting a skin from the Online Skin Editor and having "Show as one window" enabled, this will be exported as well and take effect when loading the skin in Executor.
