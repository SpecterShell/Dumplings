- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Improvements
    - For keywords doing multiple commands you can now add $SKIP$ to skip one or more commands instead of removing the command, useful for debugging etc. It can be inserted anywhere within that command. Example keyword command: vscode||email$SKIP$||slack (will skip the email command). $SKIP$ also works inside a single keyword command (keyword will then do nothing).
    Fixes
    - Fixed a bug where when launching an indexed items the wrong file could be launched. Could happen if Windows was set to hide file extensions for known types, and there was identical filenames with different file extensions.
