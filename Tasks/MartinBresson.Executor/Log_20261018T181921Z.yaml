- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    What's new
    - Added the keyword emoji that will open the Windows emojis dialog. Works best when triggered while Windows has focus on a text input in some application. The keyword can be imported from extras.exc (type imports).
    - Added the keyword command $SENDKEYS$ which is like $KEYS$ but will move focus back to the current window before Executor was opened. It also supports adding a {PAUSE x}, where x is milliseconds, in case you expect the target window to be slow. See docs for more info.
    - Added the keyword command $BACK$ will dismiss Executor and move focus back to the previous active window. Many keyword commands already does this automatically.
    Improvements
    - alarm and timer are now saved so if Executor is restarted they will still be active.
