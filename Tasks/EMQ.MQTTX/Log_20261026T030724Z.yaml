  Value: |-
    Release Note 🎉
    🤖 MQTTX Agent, Dashboard & GZIP Decompression
    MQTTX 1.13.2 introduces Dashboard for visualizing MQTT data, turns the desktop Copilot into MQTTX Agent, and adds optional GZIP decompression to Desktop and Web. It also improves performance with large Topic Trees, adds per-connection publish drafts and history, and preserves groups in JSON backups.
    MQTTX Agent 🤖
    MQTTX Agent brings MQTT tools into the desktop assistant. Create and connect clients, subscribe and publish, inspect messages and logs, work with scripts and schemas, and build dashboards using natural language.
    - Use / to choose Skills for client code, test data, schemas, custom functions, diagnostics, MQTTX CLI and Zero EMQX.
    - Mention a connection with @ to give the Agent the connection context for your request.
    - Open the Agent full screen or in a movable, resizable floating window with Cmd/Ctrl + J.
    - Use built-in MQTT tools alongside tools from your MCP servers, with action approval in Ask mode.
    - See context usage and keep long conversations working with automatic compaction.
    - Select reasoning strength when the chosen model supports it.
    - Create a free temporary Zero EMQX test broker and save its connection in MQTTX.
    - Read clearer tool steps and replies with improved spacing for paragraphs, headings, lists, code blocks and tables.
    Dashboard 📊
    Dashboard is now available in Viewer → Dashboard. Turn MQTT message fields into live values and charts without writing code.
    - Add Big Number, Line and Gauge widgets to a dashboard.
    - Choose a connection, topic filter and payload field for each widget.
    - Arrange widgets by dragging and resizing them on the dashboard grid.
    - Select a time range to review stored messages matched by each widget's MQTT topic filter, or follow live updates.
    - Ask MQTTX Agent to create dashboards, add widgets and arrange their positions and sizes.
    Features 🌈
    Desktop, Web:
    - Add a settings switch to decompress incoming GZIP messages.
    - Delete individual entries from publish topic history.
    - Refresh the connections empty page with quick connection actions.
    - Show EMQ products as a message flow on the About page.
    Desktop:
    - Keep the publish area and history separate for each connection.
    - Select a connection group when creating or editing a connection, and preserve groups in JSON backups.
    - Delete or disable subscriptions while a connection is disconnected.
    - Display MQTT 5.0 Response Information returned by the broker.
    - Add Dashboard with Big Number, Line and Gauge widgets, a configurable grid layout and time-range controls.
    - Keep the Topic Tree responsive with large topic sets through batched updates, bounded sub-topic lists and confirmation before expanding large trees.
    - Show direct sub-topics, sub-topic counts and depth in the Topic Tree, with a resizable information panel.
    - Mark GZIP-decompressed messages.
    - Add visible row menu buttons for connections and groups.
    CLI:
    - Display MQTT 5.0 Response Information when requested and returned by the broker.
    - Add EMQ product links to the root help output.
    Fixes 🛠
    Desktop, Web:
    - Correct MQTT topic matching in the message list, including wildcard levels, system topics, shared subscriptions and case sensitivity.
    - Show the active topic filter and provide a clear action.
    - Reset subscription dialog loading state across subscription edit outcomes.
    - Keep topic colors readable across themes and keep QoS labels on the same line when a scrollbar appears.
    Desktop:
    - Preserve the subscription filter during topic search and keep the nearest messages when paging older history.
    - Apply edited connection settings immediately and stop stale clients from reconnecting.
    - Preserve collapsed connection groups across navigation and reveal newly created connections.
    - Ask for confirmation before clearing connection history.
    - Keep Ctrl+W / Cmd+W from quitting the application through the main window.
    - Install the correct native CLI architecture on Apple Silicon.
    - Align closing braces in decoded Protobuf output and report unreadable Excel import files.
    - Report persisted subscription counts correctly in the Agent connection list.
    - Restore Agent connection context and the @ menu after a reload, send supported reasoning levels and keep the Agent from changing its own reasoning strength.
    - Align menus, list rows and translations, and keep view styles consistent across navigation.
    Web:
    - Reveal the connection list when opening it from the empty page.
    - Allow Node.js versions matching >=18 in the Web build configuration.
