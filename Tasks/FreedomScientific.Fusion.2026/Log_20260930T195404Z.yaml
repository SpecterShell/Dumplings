  Key: ReleaseNotes
  Value: |-
    The following describes improvements made in the September 2026 update.
    Continuous Scrolling in Live Text View
    When a line of text under the mouse pointer or cursor exceeds the width of the Live Text View window, scroll arrows appear at the start or end of the displayed text. Previously, CAPS LOCK+RIGHT ARROW and CAPS LOCK+LEFT ARROW moved through the line one character at a time. You can now press and hold either hotkey to scroll continuously, making it faster to read through long lines of text.
    Published Applications
    Published applications are virtual software programs hosted on a remote server that users can run as if they were installed directly on their own local device. These environments are commonly used by enterprise customers.
    - Published Applications now automatically use the same ZoomText settings configured locally, including application-specific settings such as different magnification levels for a web browser and Microsoft Word. Previously, these settings had to be configured separately.
    - The compact ZoomText interface shown when no local ZoomText instance is running has been simplified to two buttons: Expand/Collapse and Exit. When expanded, it now shows the ZoomText version and Windows Server version. The previous Show Toolbar and Run Standalone buttons have been removed.
    - After ZoomText has been started locally at least once, startup dialogs (such as the Welcome screen, Startup Wizard, and Account dialog) no longer display when ZoomText runs as a Published Application on the server side of a remote connection.
    - AppReader now starts and reads text correctly in Published Applications when launched via hotkeys: CAPS LOCK+ALT+R (AppReader), CAPS LOCK+ALT+A (App View mode), or CAPS LOCK+ALT+T (Text View mode).
    - Mouse commands for AppReader and Freeze View now work reliably when running ZoomText as a Published Application in remote desktop environments (including Citrix and RDP), regardless of the remote window's state. Previously, these commands could be unresponsive until the remote desktop window was maximized.
    - An AHOI status report is used by technical support to troubleshoot issues. The AHOI report (CTRL+ALT+SHIFT+R) now includes the status of the current foreground Published Application.
    Remote Desktop and Published Application Installations
    ZoomText automatically detects whether it is running in a Remote Desktop or Published Application environment. If needed for troubleshooting or specific deployments, network administrators can explicitly define the environment using these command-line arguments:
    - /RemoteDesktop — identifies a Remote Desktop environment.
    - /PublishedApp — identifies a Published Application environment.
    Other Changes
    - Resolved an issue where ZoomText could freeze after the computer resumed from sleep or hibernation, requiring ZoomText or Windows to be restarted.
    - When the ZoomText Display Adapter is set to First Available, this setting is now retained after ZoomText restarts. Previously, it may have reverted to a different value.
