  Key: ReleaseNotes
  Value: |-
    The following describes improvements made in the August 2026 update.
    Improved Support for Published Applications in Server Environments
    Published applications are virtual software programs hosted on a remote server that users can run as if they were installed directly on their own local device. These environments are commonly used by enterprise customers.
    To benefit from these improvements, this update must be installed on both the server and client computers. The following fixes are included:
    - When running ZoomText as a published application from a server while connected to a local instance of ZoomText, only the local settings are now used and stored. This change ensures that the user's settings remain available and consistent across sessions started from the same client computer. Previously, ZoomText attempted to store settings on the server, where they were not persistent.
    - When running ZoomText as a published application without a local instance of ZoomText also running, a small UI is displayed. It contains three buttons: Show Toolbar, Run Standalone, and Exit. Previously, clicking Show Toolbar on this UI would close the UI without displaying the ZoomText toolbar. This has been fixed. Clicking the Show Toolbar button now correctly displays the ZoomText toolbar.
    - When running ZoomText as a published application from a server and then launching a local instance of ZoomText, the ZoomText toolbar would fail to display. This has been fixed.
    Localization
    - Added Turkish localization for the Welcome dialog and Speech On Demand feature.
    - Updated Welcome dialog localization for Swedish, Finnish, English (UK), and Estonian.
    - Added Remote Desktop dialog localization for Albanian, Arabic, Chinese, Estonian, Kazakh, Latvian, Macedonian, and Norwegian.
    - Added Support Tool dialog localization for Albanian, Estonian, Icelandic, Kazakh, Latvian, and Macedonian.
    Other Enhancements
    - ZoomText now utilizes .NET 10.
