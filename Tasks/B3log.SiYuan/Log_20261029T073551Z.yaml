  Key: ReleaseNotes
  Value: |-
    Upgrade notice
    This release automatically migrates notebooks to the new document title mode and supports / in document titles.
    Before opening a workspace with this version, quit all older clients and upgrade every device that accesses or syncs the same data, including offline devices before they reconnect. Check plugin compatibility before upgrading.
    After migration, do not use older versions to open, edit, restore, or sync the same data: changes may be overwritten or lost and propagated through sync. Older clients rejecting some documents does not protect the entire notebook. See the compatibility details.
    Overview
    This release adds support for / in document titles and improves mind maps, database automations, mobile editing, and file change detection.
    Mind maps and editing
    Mind maps gain themes, global styling, node selection and clipboard operations, improved summaries, and list-style editing interactions.
    Tables support adjustable row heights, with improvements to cell activation, text formatting performance, and Markdown list copying and export.
    Databases and navigation
    Database automations support collecting block references, attribute name substring and regex matching, and subdocument depth limits.
    Backlinks can be filtered by database fields, new database items have configurable opening behavior, and mobile documents can display backlinks at the bottom.
    Platforms and reliability
    This release improves iOS text selection and editing, mobile search navigation, sync progress and cancellation, and file change detection for snapshots, sync, and restoration.
    It also adds Windows title bar overlay, macOS system proxy detection, TIFF previews, and custom lock screen wallpapers, and updates runtimes and CA certificates.
    Changelogs
    Below are the detailed changes in this version.
    Enhancement
    - Improve Markdown list formatting when copying and exporting
    - Support / in document titles
    - Improve editing, database view, and search performance
    - Support hiding parent paths in embedded block breadcrumbs
    - Support pinning agent sessions
    - Support maximizing and restoring PDF panes across platforms
    - Support selecting, copying, cutting and pasting mind map nodes
    - Improve mind map toolbar grouping and narrow layouts
    - Improve table cell activation and context menus
    - Improve mind map summary connectors and creation previews
    - Support moving document tabs back to the main window
    - Support closing detached windows with their last tab
    - Improve performance when formatting text in pasted tables
    - Support limiting subdocument depth in database automation scopes
    - Support backlinks at the bottom of documents on mobile
    - Improve sync checkout progress and cancellation
    - Support TIFF image previews
    - Improve database auto-collection with attribute name substring and regex matching
    - Support clearing recent document history
    - Improve mouse side button navigation
    - Support custom lock screen wallpaper
    - Support mind map themes and global styling
    - Support macOS system network proxy detection
    - Support filtering backlinks by database fields
    - Improve mind map summary creation from selected nodes
    - Support resizing table row heights
    - Improve combining block references with inline code formatting
    - Improve dock bar visibility when floating side panels are expanded
    - Improve mobile search result navigation and keyword highlighting
    - Improve loading indicators with theme-customizable fading rings
    - Improve asset link parsing for internal previews
    - Improve file change detection for snapshots, sync, and restoration
    - Improve iOS text selection and editing
    - Support title bar overlay on Windows
    - Support configurable opening after creating database items
    - Improve list-style editing interactions in mind maps
    - Support collecting block references through database automation
    - Improve LaTeX math delimiter compatibility for pasting and importing
    - Support extracting embedded PDF images with the AI agent
    Bugfix
    - Copied code blocks use fences shorter than embedded backtick sequences
    - Inline memo content appears in dynamic block reference text
    Refactor
    - Improve AI data storage consistency by consolidating workspace instructions
    - Upgrade Electron, Go and CA certificates to distrust compromised eMudhra intermediates
    - Improve Android file traversal with a pure Go implementation and diagnostics
