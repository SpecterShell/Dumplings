  Key: ReleaseNotes
  Value: |-
    Overview
    This release expands database automations, introduces a compact desktop interface, and improves mobile editing, mind maps, AI integrations, and Linux compatibility.
    Databases and editing
    Database automations can collect blocks and assign field values using templates. Locked views support temporary sorting, and database attribute panels adopt a single-column layout. Block reference input, outline navigation, callout conversion, and PDF page breaks are also improved.
    Desktop, mobile, and mind maps
    The desktop interface gains a compact mode, menus support scrolling with mouse movement, and mind maps offer multiple connector styles and improved layout density. Mobile database panels, table features, and long-press block dragging are improved. iOS Live Photos can be imported, with metadata display and playback available across platforms.
    AI and platform compatibility
    AI integrations add the Gemini Interactions API and DeepSeek Search and Fetch APIs, with configurable embedding concurrency and batch size. Linux improvements cover AppImage startup without libfuse2, built-in OCR compatibility with glibc 2.28, and GNOME system proxy detection. This release also upgrades Electron and Mermaid.
    Changelogs
    Below are the detailed changes in this version.
    Enhancement
    - Support compact mode for the desktop interface
    - Improve startup retries when the workspace is locked
    - Exclude manually typed closing brackets from block reference search
    - Support auto-closing [[ and completing block references by typing ]]
    - Support configurable image OCR tooltips
    - Improve editor settings grouping
    - Improve Linux GNOME system proxy detection
    - Improve mobile block dragging with long-press activation
    - Improve update downloads with official mirrors for all channels
    - Support collecting blocks into databases through automation
    - Improve database attribute panels with a single-column layout
    - Support Gemini Interactions API
    - Support page breaks before selected heading levels in PDF export
    - Preserve outline selection and scroll position during heading navigation
    - Improve blockquote conversion menu with direct callout type options
    - Improve device-local ChatGPT account binding
    - Support converting tab blocks directly to mind maps
    - Support excluding title images from image exports
    - Cross-origin resources fail to load in some embedded webpages
    - Improve built-in OCR compatibility with glibc 2.28 on Linux
    - Upgrade to Electron v44.9.0
    - Support temporary sorting in locked database views
    - Support configurable embedding concurrency and batch size
    - Support template-based field assignments in database automations
    - Improve menu height and positioning for dynamically added items
    - Support multiple connector styles in mind maps
    - Improve mobile table feature parity with desktop
    - Support full block indicator hierarchy and retain list item indicators in single-item lists
    - Support DeepSeek Search and Fetch APIs for agents
    - Improve Mermaid integration by upgrading to 12.2.0
    - Support scrolling menus with mouse movement
    - Improve mobile database editing panels
    - Improve AppImage compatibility with Linux distributions without libfuse2
    - Support iOS Live Photos
    - Improve mind map layout density
    Bugfix
    - Some inline formulas remain blank after inserting multiple blocks via API
    - File uploads silently fail in standalone database item panels
    - Linux input method compatibility setting incorrectly treats automatic backend selection as an override
    - Alt-dragging documents inserts references instead of converting to headings on HarmonyOS PC
    - Settings import skips exported preferences and overwrites imported layouts
    - Database automation block filters have misleading names and lack subtype matching
    - Repeated double-taps cause text selection and menu failures on iOS
    Development
    - Support stable insertion at the current editor selection for plugins
    - Remove deprecated Protyle.updateTransaction API
