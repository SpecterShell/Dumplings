  Key: ReleaseNotes
  Value: |-
    What's New in Maestri 0.30.9
    New
    - Set a default chat font for all terminals in Settings → Terminal → Appearance → Chat.
    - A text size for the Prompt Composer, in Settings → Terminal → Appearance.
    Updated
    - Improved markdown rendering in chat messages, including tables in the messages you send.
    - File paths in messages you send in the chat are now links that open the file, as they do in replies.
    - Table columns in notes and in the chat now follow the left, center or right alignment set in the table's markdown.
    - A chat where you sent screenshots now opens with its recent messages, not only the screenshots.
    - The Quote button over selected text in the chat grows with the chat font.
    - The theme and terminal font in Settings now have a reset button, like the other settings.
    - The Settings tabs now fit on one row in every language.
