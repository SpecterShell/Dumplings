  Key: ReleaseNotes
  Value: |-
    What's New in Maestri 0.32.0
    New
    - Screen Control: see and control another computer's screen from Maestri, with its keyboard and mouse, from your other computers, your iPhone or Android. Choose Full control with screen for a device in Settings → Wire → Devices, then open it from a computer's space.
    - Click a picture in an agent's reply to browse all of its pictures full size, with the arrow keys.
    - Change a terminal's agent account from its right-click menu; a running agent restarts and picks up where it left off.
    - Terminals now show Arabic and Hebrew right to left, with properly joined letters.
    Updated
    - Agents can now use a web portal that was unloaded; it reloads first.
    - The default role icon is now an ID card.
    - A Maestri Box update is available: Update Now is in the Box's space popover and in Settings → Wire → Devices.
    Fixed
    - Fixed an agent launched with an account not resuming its session after a restart.
    - Fixed removing an account leaving terminals on other floors pointing at it.
    - Fixed a link that wraps right before an emoji or CJK character opening only partly.
