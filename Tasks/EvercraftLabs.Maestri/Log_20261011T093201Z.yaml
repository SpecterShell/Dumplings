  Key: ReleaseNotes
  Value: |-
    What's New in Maestri 0.22.1
    New
    - Maestri Remote picks the agent account a terminal runs on in New Terminal and Edit Terminal, with the latest Maestri Remote update.
    Fixed
    - maestri commands in SSH, Docker and sandbox terminals keep working after Maestri's background service restarts on its own.
    - Restarting a running SSH terminal from its toolbar brings it back.
    - Fixed a case where a program started from a terminal could keep running after the terminal was deleted.
