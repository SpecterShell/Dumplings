  Key: ReleaseNotes
  Value: |-
    What's New in Maestri 0.27.0
    New
    - Save a prompt once with Save to Global or Workspace, then insert it from the Prompt Composer with @ then Prompts, or by typing $ at the start of a word.
    - Manage saved prompts in Settings > Agents > Prompts. Each one is a folder in the prompts folder holding a PROMPT.md that agents can edit too, and prompts travel with backups and workspace exports.
    - Right-click a workspace or a floor in the sidebar and choose Unload, then Keep Unloaded, and a visit starts nothing until you choose Reload Workspace or Reload Floor.
    - Right-click a band or use the command palette and choose Unload Band to unload every member at once, and Reload Band to wake them all again.
    - After a floor's pull request merges, choose Keep Working beside Remove Floor to go on working on that floor.
    - Settings > General > Canvas > Camera movement sets how every jump travels: Glide, the default, or Instant.
    Updated
    - Jumping to a band member, from a shortcut or a notification, and the zoom toggle frame the whole band.
    - An agent that reaches a terminal you unloaded is told to ask you to reload it.
    - Portuguese (Brazil) says espaço de trabalho throughout, and its labels use title case.
    Fixed
    - An idle chat stays where your scroll stops.
    - A chat's shell window opens below the message you just sent, short or with attachments, and stays there when you switch workspaces.
    - A menu an agent opens in a portal still answers its next key, and typing after a pause reaches the page.
    - In the file tree, a name made only of dots gets its own message.
    - Importing a full backup restores chats, partituras, settings, routines and account and git host providers along with your workspaces, and a workspace's backup brings back its roles and routines.
