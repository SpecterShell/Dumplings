  Key: ReleaseNotes
  Value: |-
    What's New in Maestri 0.22.0
    New
    - Claude Code and Codex agents can run on separate accounts, each with its own subscription login or API key, on this computer, in WSL, over SSH, in Docker or in a sandbox. Add them in Settings > Agents > Accounts and pick one per terminal, in a preset or with maestri recruit --account; the terminal's name shows which one it uses.
    - Clicking a commit in a file tree's History shows its message and every file's diff.
    - Floors can be reordered by dragging them or with Alt+Arrow.
    - maestri floor unload unloads a floor, and maestri ask wakes an agent on an unloaded floor.
    - Codex's Windows sandbox can run maestri commands.
    Fixed
    - Prompts to Codex submit more reliably.
    - Workspace exports with accented file names open on other computers.
    - maestri ask between OpenCode agents no longer hangs.
    - A prompt that ends in a mention pill sends in OpenCode.
    - The floor overview shows tall floors in full.
    - A floor's status can change without any text.
    - Inserting a partitura into a WSL or Linux workspace no longer doubles its terminals' folder.
