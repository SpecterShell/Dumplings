  Key: ReleaseNotes
  Value: |-
    What's New in Maestri 0.28.1
    New
    - Set a picture as a workspace's icon in the New and Edit Workspace sheets. It shows in the sidebar, the rail, the command palette and everywhere else the workspace's icon appears.
    Updated
    - A routine sends to a terminal whose floor or workspace is unloaded or not yet opened since launch, waking it first, and maestri routine run replies right away.
    - With Prompt Composer open, Escape in a terminal now reaches the program running in it instead of closing the composer.
    - Improved resource usage over long sessions where agents run Maestri commands often.
    Fixed
    - Fixed an issue where workspace icons drew smaller than their intended size.
    - Fixed an issue where floor overview cards could show no preview on high-resolution displays.
    - Fixed an issue where the floors button slid sideways when the floor overview opened.
