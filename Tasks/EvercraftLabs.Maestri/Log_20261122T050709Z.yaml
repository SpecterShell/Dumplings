  Value: |-
    What's New in Maestri 0.31.5
    New in 0.31.5
    - Toggle Mini Sidebar from the … menu in the top bar.
    - Settings opens from the first-run screen, before you create your first workspace.
    - PowerShell 7 from the Microsoft Store is listed in Terminal > Advanced > Shell on Windows.
    - Drag a number in Settings, or press the Left and Right arrow keys, to change it.
    - A terminal's cursor is a solid block in the theme's cursor color, outlined when the terminal isn't focused.
    - Popovers animate as they open and close, and menus open instantly.
    - In Chat Mode, click anywhere on the working line to show or hide the terminal preview.
    - A portal's browser presets match current browser versions.
    - Maestri Box 0.31.5 is available: update a Box with Update Now in its space popover or in Settings > Wire > Devices.
    Fixed in 0.31.5
    - Settings > Terminal > Appearance, New Item Defaults and the note font picker open at once on Windows.
    - Click anywhere in a window partly under another, inside a terminal too, to bring it to the front.
    - Copy, Paste and Select All work in another computer's terminal.
    - Rope terminals across two workspaces of another computer, such as a Box.
    - In a file tree, right-click a file and Open runs it with its default app, beside Edit in Maestri.
    - Edit Terminal on another computer's terminal shows this computer's own jump shortcut.
    - In New Terminal and Edit Terminal, Command uses the same font as Name.
    - The font picker shows a single Use default button.
    - Buttons in Settings and in the terminal sheets share one size, and the canvas Add menu lines up its icons and labels.
    - The mini sidebar stays readable over bright pages.
