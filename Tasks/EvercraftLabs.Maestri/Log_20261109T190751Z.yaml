  Value: |-
    What's New in Maestri 0.30.5
    Improved
    - More reliable session restore for Claude Code in WSL and SSH terminals.
    - The network command Maestri offers for a Docker Sandbox works with sbx 0.51.
    Fixed
    - maestri commands could be refused in a terminal with an out-of-date workspace ID.
    - Notes created or renamed at the same moment under the same name each keep their own file.
    - A note saved right after its workspace is cloned keeps what you wrote.
