  Key: ReleaseNotes
  Value: |-
    What's New in Maestri 0.21.5
    Fixed
    - Multi-line messages from agents in remote SSH terminals arrive complete again.
    - Files attached for agents in remote SSH or Docker terminals are uploaded to the server, and a failed upload no longer sends the message without it.
    - Quitting waits for agents to finish closing, so their sessions resume more reliably.
    - Terminals on a floor start in that floor's copy of the project instead of the main folder.
