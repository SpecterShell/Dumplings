  Key: ReleaseNotes
  Value: |-
    What's New in Maestri 0.28.0
    New
    - Agents list, place, save and delete partituras with maestri partitura list, insert, create and delete, and maestri floor create --partitura opens a new floor with a partitura in place.
    - A Maestro that places a partitura is connected to its team, and a Maestro in a band connects the whole band, on any floor or workspace.
    Updated
    - A routine's edit sheet has Delete… at the bottom, and it asks before deleting.
    - Unloading or deleting a workspace or floor, or deleting a device portal, shuts down an Android emulator Maestri started for it, unless another portal still uses it, and never one you started yourself.
    Fixed
    - Deleting a terminal, floor or workspace deletes its routines, and a routine whose terminal or workspace is gone pauses and waits in Routines for you to delete.
    - Fixed an issue where bands could lose some of their connections after Maestri restarted.
    - Fixed an issue where a partitura with a band could place the band without its members.
