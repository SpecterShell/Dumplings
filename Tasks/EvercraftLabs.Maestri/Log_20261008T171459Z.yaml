  Key: ReleaseNotes
  Value: |-
    What's New in Maestri 0.21.4
    New
    - Design mode can keep several annotations on a page and send them to an agent in one message. Kept annotations show as numbered marks, and you can review or remove them from one list.
    - Settings > Roles can delete several roles at once.
    Fixed
    - Deleting a workspace also deletes the roles made only for it. Roles still used elsewhere are kept.
    - Deleting or landing a floor removes its connections to other workspaces.
    - Swiping between workspaces no longer moves the canvas of the workspace you land on.
    - If activation can't reach our server, Maestri now says so and suggests trying another network.
    - Improved license activation on some networks.
