  Key: ReleaseNotes
  Value: |-
    What's New in Maestri 0.25.1
    New
    - Memory limit per terminal: set a limit in Settings, and when a terminal's processes use more than that, Maestri stops them and keeps the shell running. On Windows it also covers agents running inside WSL.
    - A processes button on every terminal shows what's running in it and how much memory each process uses, and lets you stop one.
    Updated
    - Improved portal automation for agents, so sites like WhatsApp Web and GitHub now work reliably: typing into rich editors, submitting forms with Enter, moving between fields with Tab, and clear errors when a click or page load fails.
    - Reduced animations when navigating between elements using the command palette.
    - A file tree docked on the right opens its editor toward the canvas, and gives it more room.
    - Improved CPU usage in chat.
    Fixed
    - Deleted terminals and notes no longer leave their chat history and text behind in memory.
