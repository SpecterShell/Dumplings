  Key: ReleaseNotes
  Value: |-
    What's New in Maestri 0.30.4
    New
    - Use touch on the canvas: tap, pan, pinch to zoom, drag and resize nodes, scroll terminals, and long press to open the menu.
    - Dragging a node to the edge of the view scrolls the canvas.
    - The chat toolbar has a Clear Chat History button.
    Improved
    - Click a link in a note to open it, or Shift+click to open it in a portal. While editing a note, Ctrl+click opens a link.
    - Links in chat replies show the pointing hand.
    - Pale colors such as a light blue get dark text in chat bubbles, notes and drawing labels.
    - Canvas settings keep each option's explanation behind an info button.
    - Agents running in WSL or on another machine can now recruit onto their own isolated floor.
    - Computer Use can now pick an option in a classic Windows dropdown in the background.
    - Computer Use can click canvases and charts on web pages in the background.
    Fixed
    - Fixed a small regression on chat scrolling on new messages
    - A long draft in the chat composer no longer covers the newest messages, and the chat stays put as the draft grows.
    - maestri floor set-dir no longer times out on a large folder.
