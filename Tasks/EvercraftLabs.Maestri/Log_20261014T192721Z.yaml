  Key: ReleaseNotes
  Value: |-
    What's New in Maestri 0.24.1
    New
    - Paired phones get push notifications from Maestri Remote while you are away from the computer, for finished agents, Maestro requests, floor status, pull requests, routines and new devices.
    - The phone picks which notifications it gets, and an agent's notification clears from the phone once you deal with it at the computer.
    - Settings > Wire > Manual also lists an https://127.0.0.1 address for apps on this computer.
    Fixed
    - A prompt sent to a busy agent is submitted instead of staying pasted in its input box.
    - A terminal woken from Unload shows its Maestri Chat conversation again without a new message.
    - Floors now follow a branch you check out, instead of keeping the old one.
