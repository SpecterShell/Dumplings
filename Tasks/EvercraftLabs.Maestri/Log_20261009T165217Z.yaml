  Key: ReleaseNotes
  Value: |-
    What's New in Maestri 0.21.6
    Fixed
    - Open in IDE on a floor opens that floor's folder.
    - Copying Ground's layout into a floor works when the workspace is a subfolder of the project.
    - Terminals copied from one floor and pasted into another start in the new floor's folder.
    - Deleting a floor no longer leaves its folder behind.
    - The sidebar shows Ground's branch name once a workspace has its first floor.
    - A terminal with a role installs or updates its role files every time it starts, and its role badge warns if that fails.
    - Duplicating or exporting a workspace leaves out its connections to other workspaces.
    - A workspace created from another one opens the new project, without the old one's editor tabs.
    - Terminal and portal names are unique across all floors of a workspace.
    - A portal pointed at a folder opens its index.html.
    - A local HTML portal reloads when its file is replaced.
    - Inserting a partitura made from a sleeping terminal starts that terminal.
