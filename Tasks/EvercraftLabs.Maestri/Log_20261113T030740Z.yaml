  Key: ReleaseNotes
  Value: |-
    What's New in Maestri 0.30.8
    Improved
    - SSH terminals now share one connection per server for their setup, so new terminals on the same server start faster and a key that asks for confirmation asks once per terminal instead of five times.
    - Improved security for SSH terminals, which now each get their own private line to Maestri.
    - Agents no longer treat a sleeping teammate as unavailable. A terminal resting on a sleeping floor now reads as asleep, with a note that asking it wakes it.
    Fixed
    - Links and file paths inside a note's tables open with a click.
    - maestri floor create leaves out the folders excluded in the workspace's floor settings, as New Floor does.
    - Deleting a floor removes all of its files even when their paths are very long, and says so if it can't.
