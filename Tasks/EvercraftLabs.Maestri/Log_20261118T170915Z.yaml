  Key: ReleaseNotes
  Value: |-
    What's New in Maestri 0.31.1
    New
    - Spaces: organize your sidebar into spaces, each with its own icon and color, and switch between them in one click. A space can hold workspaces on this computer or on another computer you've connected over Maestri Wire, so everything you run lives in one sidebar.
    - Remote Desktops: connect to Maestri on another computer on your network and work on its canvas as if it were your own, with its terminals, agents, notes, portals and file trees.
    - Agents across computers: rope agents together across computers, and ask, recruit or check a teammate on another computer by name, like "Reviewer @ Build Box".
    - Open in New Window: open any workspace in its own window, or drag it out of the sidebar, and move it to another desktop or monitor. Works with workspaces on other computers too.
    - Streaming Portals: control web and device portals remotely, from Maestri Remote or from another computer over Maestri Wire, Design mode included.
    - Maestri Box: connect to Maestri Box, the headless edition of Maestri for Linux that you can self-host, and use it like any other computer in your sidebar.
    - Profiles: set a name and photo that your other computers and devices see, shown on the live cursors of whoever is working on a canvas with you.
    Updated
    - Maestri Wire settings are redesigned, with simpler pairing for the Remote app and for other computers, and every paired device in one place.
    - Notifications from your connected computers show up on the computer you're sitting at, and your phone stays quiet while you're at your desk.
    - Workspaces on SSH, Docker or a custom environment can be set to always run there, so terminals, file trees and hooks never fall back to this computer.
    - Select several workspaces at once in the sidebar.
    - Ask a Maestro to start a teammate in another workspace by typing @ → Workspace… in the Prompt Composer.
    - 25 new icons for terminals, workspaces, bands and spaces.
    - Copy and paste on the canvas from the Edit menu, and each paste lands beside the last one instead of on top of it.
    - Settings and Routines are in the More menu beside the sidebar button.
    - Ctrl with the two keys right of 0 zooms the canvas on any keyboard layout, Japanese included.
    New in 0.31.1
    - Terminals made from another computer, on a Box, or for an account sign-in now get a unique name, so two agents can't share one.
