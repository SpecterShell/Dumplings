Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    What's New in Maestri 0.23.1
    New
    - Antigravity agents can run on separate accounts.
    - Other agent CLIs can have accounts through provider files in Settings > Agents > Accounts.
    - Agent Usage and Git providers settings have Copy Path.
    - Open Pull Request… in a file tree's git pill works on any git folder.
    - After a crash, each terminal returns to its last session.
    - maestri preset shows, creates, changes and deletes presets.
    - Hovering a chat thread's dot previews that thread.
    - Pressing and holding a thread's dot in Maestri Remote previews that thread, with the latest Maestri Remote update.
    - Hovering a provider's usage rings names the provider.
    - Git providers settings show how many workspaces picked each provider.
    Fixed
    - Fichário pages keep their text when switching between them.
    - No console window flashes when Maestri connects to WSL.
    - Session resume picks up the agent's actual session.
    - A recruited agent keeps its manager's Local (tmux) setting.
    - Fixed Codex agents on an account sometimes failing to start.
