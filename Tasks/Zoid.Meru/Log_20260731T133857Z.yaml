  Key: ReleaseNotes
  Value: |-
    Added
    - The version history in Settings… → Version History now shows which version you're currently running, with a "Current version" badge on the matching release
    Changed
    - Google app windows (Calendar, Drive, etc.) now show the page title in the window title, prefixed with the account label when you have multiple accounts
    Fixed
    - Clicking an account tab sometimes not switching to that account's view
    - "Copy Message Link" not being available for messages opened from search results, labels, or categories
    Internal Changes
    - Upgraded Electron to v43.2.0, which includes the latest Chromium with performance and security improvements
