  Key: ReleaseNotes
  Value: |-
    Changed
    - Meru names itself to websites as Meru and Electron again, instead of presenting itself as Chromium, because Google refused to sign in new accounts when it did. Settings… → Advanced → Miscellaneous → Use default user agent is gone with it, since there's nothing left to switch back to.
    Fixed
    - Adding a Google account works again. In 3.64.0, Google answered "Couldn't sign you in — This browser or app may not be secure" after the email address. Accounts that were already signed in were never affected and stay signed in.
