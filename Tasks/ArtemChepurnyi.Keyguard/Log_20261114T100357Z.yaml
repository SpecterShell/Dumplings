  Key: ReleaseNotes
  Value: |-
    New
    - Generator: Added dropping a file onto the Wordlists screen to add a wordlist.
    Improvements
    - Bitwarden: mTLS certificates can now be imported from the system store (#1666).
    - Bitwarden: Client certificates can now be dropped onto the login screen.
    - Sync: User-added privileged apps now sync between devices.
    - Sync: URIs blocked from autofill now sync between devices.
    - Sync: Device nodes in the mesh component are now clickable.
    - GPG: Files can now be dropped onto file fields in GPG tools.
    - Android: Predictive back animations now match Android Settings.
    - UI: Distinct icons are now used for Windows, Linux, and macOS platforms.
    Fixes
    - Linux: Fixed "Something went wrong" errors when opening links and Bitwarden SSO failures (#1553, #1671).
    - Desktop: Fixed pull to search so the gesture is disabled on desktop platforms.
    - Desktop: Fixed dropped file copies so they are deleted once a screen is done with them.
    - UI: Fixed filter items so their outline is displayed.
