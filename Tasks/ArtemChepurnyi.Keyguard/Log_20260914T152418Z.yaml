  Key: ReleaseNotes
  Value: |-
    New
    - Linux AppImage builds now support zsync delta updates.
    - Added GPG public certificate validation.
    Agents
    - Improves SSH and GPG agent reliability on Android.
    - GPG key details now respect configured policies.
    - SSH and GPG keys are revalidated after an agent request is approved.
    Platforms
    - Improves reliability when running multiple app instances on Windows.
    - Improves system tray icon reliability on desktop platforms.
    Fixes
    - Syncing local accounts no longer requires an active internet connection.
    - The 'Mark all as read' action in Watchtower now applies only to the currently filtered items.
    - Moving an item to the root of a KDBX database is now saved correctly.
    - Creating a Bitwarden Send now requires selecting a destination account.
    - Changing backup settings no longer resets the retention policy.
    - Ensures the latest master password is used for authentication.
    - Improves WebDAV sync reliability.
    - The vault item details screen now updates immediately when the Markdown notes preference is changed.
    - Fixes progress display for cancelled or failed vault exports.
    - Invalid regular expressions are now rejected in input fields.
    - The key generator shows an OpenPGP-specific tip for RSA keys.
    - The color picker selects the nearest available palette color.
