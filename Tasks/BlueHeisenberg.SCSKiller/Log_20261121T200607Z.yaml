  Key: ReleaseNotes
  Value: |-
    This build isn't code-signed yet, so the first run will probably show SmartScreen's "Windows protected your PC".
    Click More info, then Run anyway. Updates never show it.
    To check the download arrived whole, compare its SHA-256 with the one at the end of these notes (PowerShell:
    Get-FileHash <file>). These notes aren't signed, so that doesn't prove who built it. The source: https://github.com/BlueHeisenberg/SCSKiller/tree/v1.4.9.
    Smart App Control (Windows 11) blocks unsigned apps outright, with no Run anyway.
    Fixed
    - Windows, Linux: Steam games are no longer treated as anti-cheat games when the Steam client beta is installed.
    - Windows, Linux: Red Dead Redemption 2 and other games keep their correct game file when the online game list is older
      than the app's own.
    - Windows: With NVIDIA, the Cache page shows each game's own DirectX shader cache files and Clear cache deletes them,
      except files other apps with the same exe name use. (Thanks to ecelebi29 for the PR.)
    - Windows, Linux: The message about a damaged Steam manifest no longer tells you to move the file.
