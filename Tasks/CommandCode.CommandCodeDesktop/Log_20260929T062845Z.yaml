  Key: ReleaseNotes
  Value: |-
    [FEAT] Add Claude Sonnet 5.5 to the model picker
    [FEAT] Cycle through chats with Ctrl+Tab and Ctrl+Shift+Tab
    [FEAT] Focus the message box from anywhere outside the terminal with Shift+Esc
    [FEAT] Choose in Settings whether reasoning starts expanded, folded by default as before
    [FIX] Esc answers a pending approval by denying that tool instead of stopping the whole run, and the prompt now shows its keys
    [FIX] Find a chat by any word said in it, not only by its title, with the matching stretch highlighted in the row
    [FIX] Keep code highlighting fast as a chat grows longer
    [FIX] Fit wide tables inside the chat and the plan panel instead of clipping them
    [FIX] Picking a skill from the slash menu fills the message box and waits for your prompt
    [FIX] Ctrl+1 to Ctrl+9 open the chat you can see in the sidebar, in every language and from the terminal
    [FIX] The copy shortcut no longer stops a run when used in the message box, a text field or on a selection
    [FIX] A running compact shows its progress and ignores a repeated request
    [FIX] Compact says the conversation is already compact instead of claiming it saved nothing
    [FIX] Open the account usage page from the usage command instead of a dead end
    [FIX] Searching free in the model picker returns every free model
    [FIX] Reattaching a terminal no longer types stray characters at the prompt
    [FIX] The drop to attach overlay clears itself when a drag is cancelled, and stops draining the CPU with it
    [FIX] Hide the Linux menu bar until Alt is pressed
    [FIX] Onboarding Skip no longer sits on top of the Windows window controls
    [FIX] Keep updater output out of the terminal that launched the app on Windows
