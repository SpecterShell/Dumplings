Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    [FEAT] Finished responses show the time to first token and the tokens per second
    [FEAT] The sidebar filter is back, with a date view: group chats by project or by date, or show only running chats
    [FEAT] Settings has a goal turn budget, so /goal can run for as many turns as you choose
    [FEAT] /add-dir now adds the folder to the current chat instead of sending the line to the model
    [FEAT] Add GPT-6.1 Terra to the model picker
    [IMP] A streaming reply no longer re-renders the composer, sidebar and panels, so scrolling stays smooth in long chats
    [IMP] A slow or disconnected network folder can no longer freeze the app, and a folder that is not responding is reported
    [IMP] Persian, Arabic and Hebrew text reads right to left in chats and the prompt
    [IMP] Screen readers can read the whole chat in order
    [IMP] Diagrams in chat replies match the theme and fall back to a code block when they cannot be drawn
    [IMP] A model that stalls before its first reply now switches to a backup provider much sooner
    [IMP] Model errors say when the provider refused a request instead of a generic authentication failure
    [FIX] A huge paste or drop no longer freezes the chat, and anything over the size cap is refused with a message
    [FIX] A failed run now names the real reason, such as a missing project folder, instead of a generic error card
    [FIX] A chat whose saved branch cannot be checked out now opens on the current branch with a notice instead of bouncing back
    [FIX] The app signs you out and shows the sign-in screen when your saved key is rejected
    [FIX] One sidebar row per folder, even when it is opened under a different spelling of its path
    [FIX] The chat stops pulling you back down while a reply streams
    [FIX] The chat scrollbar no longer flashes while wheeling near the bottom, and can be dragged again with the right panel open
    [FIX] Skills and MCP settings are no longer cut off in narrow windows
    [FIX] The macOS sidebar toggle lines up with the window buttons
    [FIX] Windows: the terminal opens PowerShell instead of cmd
    [FIX] Windows: window controls stay clear of the panel toggle at any display size
    [FIX] Windows: the app no longer restarts in the middle of a long turn
