  Key: ReleaseNotes
  Value: |-
    0.1.64 (2026-11-26)
    Features
    - Dictate on your Mac: turn it on in Settings, Voice, then use the mic in the chat box or a shortcut. Speech is recognized on your Mac
    - /goal keeps working on its own across turns, and keeps its goal through compaction
    Improvements
    - The app opens faster: the agent engine now loads after the window shows
    - A sub-agent that reaches its turn limit now reports what it found and what is left
    - Opening a file-reading row shows the image the agent read
    Fixes
    - Full access and the default approval mode in Settings now survive a restart
    - Removed projects stay removed
    - The branch picker works in a new repository with no commits and when git is not installed
