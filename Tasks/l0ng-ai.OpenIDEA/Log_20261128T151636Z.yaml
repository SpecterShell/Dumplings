- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    OpenIDEA 0.1.55 brings Django and pytest fixture support, a Python Debug Server, profiling Python runs with cProfile, matplotlib figures in a Plots tool window, Jupyter Variables, installing packages from version control or a local directory, DuckDB SQL with attached catalogs, a Database Output tool window, data source folders, MDX and indented Sass, and a remote host resource dashboard. It also fixes a Windows crash when reading the clipboard.
    What's new
    Python
    - Django: Python Console set up for the project, manage.py tasks in Run Anything, URL names in reverse() and field lookups completed and navigable, django-types offered for model typing; breakpoints in Django, Jinja2 and Flask templates.
    - pytest: fixtures get go to definition, completion, find usages and rename; Create Test generates pytest tests for chosen functions; parametrized cases group under their test; unittest tests run without pytest; doctests run from the gutter.
    - Python Debug Server run configuration; profile Python runs with cProfile and open .pstats / .prof snapshots; import coverage.py data.
    - Plots tool window for matplotlib figures; Jupyter Variables tool window; convert a notebook to a script and back.
    - Python Packages: documentation pane, install from version control or a local directory; Ruff safe fixes on save and commit; choose a run configuration's interpreter from a list.
    Editor and languages
    - New actions: Transpose, Delete Duplicate Lines, Toggle Sticky Selection, Kill to Word Start / End, Scroll Left / Right, Increase / Decrease Font Size in All Editors, New Scratch Buffer, Save as Live Template; import JetBrains live templates.
    - MDX and indented Sass language servers; TypeScript import style settings and tsconfig's tsserver plugins; CSS Modules navigation; Related Symbol for JS/TS components.
    - Thymeleaf warns on fragment expressions naming a missing template or fragment; go to the Spring endpoint from a RestTemplate or WebClient URL.
    - Java interface, abstract class, enum and type parameter colours; output-directory class files open decompiled.
    - Pinyin input no longer leaves syllable spaces when the input source switches mid-composition; completion handles hyphenated tokens such as Tailwind classes.
    Database
    - DuckDB SQL, attached catalogs and EXPLAIN on named DuckDB sources; a Database Output tool window for SQL consoles.
    - Data source folders and batch actions; open .csv / .tsv files as a table; add and drop keys and indexes in Modify Table; Revert Selected and Copy Aggregation Result in the grid.
    - SQL consoles keep their own session and transaction (JDBC, PostgreSQL, ClickHouse).
    Version control
    - Compare File with Editor; Colors submenu and bold current-revision lines in the annotate gutter; drag Unversioned Files onto a changelist; settings to hide change markers.
    - Diff tabs keep their scroll position across tab switches and open at the first difference.
    Workbench, agents and remote development
    - Project color strength setting; remote windows are marked in tabs and the project switcher; remote host resource indicator and dashboard.
    - Agents: links in the composer as chips (a pasted GitHub file link from the project's repository becomes a file reference), the command a tool call ran, Session Info popover, separate chat and code fonts, slash command argument completion.
    - MCP: optimize_imports, and execute_run_configuration runs show in the Run tool window.
    - Windows: the clipboard is read and written one call at a time, fixing a crash (0xc0000374). macOS: windows no longer reopen in full screen from saved state.
