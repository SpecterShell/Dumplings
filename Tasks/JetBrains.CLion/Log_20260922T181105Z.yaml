  Key: ReleaseNotes
  Value: |-
    CLion 2026.2.3 is out with several new features and improvements. Here are the highlights:
    - The IDE now supports NVIDIA CUDA Tile C++, recognizing the new syntax and providing dedicated inspections for Tile-specific code issues. This functionality is available for projects configured with CUDA Toolkit 13.3 or later and C++20.
    - The updated Profiles switcher in the main toolbar makes it easier to spot problems in toolchain and debug configurations. A yellow warning icon now indicates when the selected build system or toolchain profile is incompatible with the selected debug profile, for example, a CMake profile that uses the system toolchain on macOS paired with GDB. The icon appears both on the switcher and next to the affected profile inside it. Hover over the warning icon to see a description of the issue. You can also open profile settings directly from the switcher by clicking the gear icon.
    - Adding a comment to a C++ file with Clang-Format and Reformat Code on Save enabled no longer causes formatting to hang. Formatting now completes successfully according to the configured rules.
    Give this build a try, share your feedback, and report any issues to our issue tracker.
    Thank you for using CLion!
