  Key: ReleaseNotes
  Value: |-
    CLion 2026.2.2 is now available, featuring a new bundled AI skill for hard fault debugging, backed by dedicated MCP tooling for debugging embedded projects. Your agent can now read the fault registers, inspect memory and disassembly, and track down the root cause – using the same debugger tools you would, just without you having to drive each step by hand.
    Read how it works in our blog.
    Give this build a try, share your feedback, and report any issues to our issue tracker.
    Thank you for using CLion!
