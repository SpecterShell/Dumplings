  Key: ReleaseNotes
  Value: |-
    CLion 2026.3 is now available, with JetBrains Air, agent-assisted embedded debugging and CMake project setup, plus support for NVIDIA CUDA Tile C++ and ISPC. Here are the highlights:
    - CLion now ships with Air, a new layer for agentic development. Run, track, and verify multi-agent workflows inside the IDE. Code intelligence guides agents away from common pitfalls, while integrated review tools let you inspect every change before it lands in your codebase. Air works with Claude Agent, Codex, Gemini, GitHub Copilot, Junie, OpenCode, and other ACP-compatible agents.
    - Your agents can now autonomously debug ARM Cortex-M hard faults using dedicated MCP tooling and a bundled AI skill. Agents can inspect fault registers, memory, and disassembly to trace the problem to its source using the same debugger tools you would.
    - CLion also adds RTOS tasks, queues, and timers to the MCP toolset, allowing agents to inspect them during a debug session.
    - When a CMake load fails, the IDE now shows a notification with a Configure with [agent] button. Select one of your installed terminal agents, and the IDE opens its terminal with a ready-made prompt.
    - CLion is now among the first C++ IDEs to support CUDA Tile C++. It understands the new syntax and highlights tile-specific code issues as you type, such as unsupported control flow or a non-positive irange step.
    - The IDE now stores debug profiles in JSON. You can continue configuring profiles in the UI or choose Configure Profile in .json to edit them right in the editor, with JSON schema validation and code completion.
    - CLion now supports ISPC syntax, providing code completion, navigation, and on-the-fly error highlighting.
    - The new Class Layout tool window visualizes the memory layout of a class, struct, or union. It displays the offset and size of every field, bit-field, base class subobject, and virtual table pointer, as well as the padding between them.
    Read our blog post to learn more about all the key updates and improvements.
    Give this build a try, share your feedback, and report any issues to our issue tracker.
    Thank you for using CLion!
