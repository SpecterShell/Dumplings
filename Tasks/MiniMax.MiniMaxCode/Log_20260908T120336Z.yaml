- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新功能
    - 无限画布：将对话和工作区中的图片、视频集中到画布上，支持搜索、筛选、预览和批量管理素材，并可将选中的素材加回对话继续创作。
    - 端云同步：桌面端会话列表可同时展示本地和云端会话，并支持从桌面端发起、查看和下载云端任务产出。
    - H3 Max：接入 H3 Max 视频模型，支持文生视频、图生视频、480p/768p 分辨率和同步生成声音。
    - 自定义 Mini App：可通过自然语言搭建个人可视化工作台，并持续调整页面、模块和数据源。
    体验优化
    - AI 水印：生成图片时可选择关闭水印，并可在设置中随时调整；默认水印样式也更协调。
    - Git 与代码审查：支持审查全部未提交改动或上一轮 Agent 产生的修改，可直接打开原文件、标记已查看，并保留 Diff 展示偏好。
