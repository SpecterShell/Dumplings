  Key: ReleaseNotes
  Value: |-
    新功能
    - 记忆管理：设置页新增记忆管理能力，新建对话时也可以选择是否使用和生成记忆。
    - Goal 模式：优化长任务执行过程中的重复回复、循环执行和中断问题，并支持随时补充要求、调整目标和查看状态。
    - Browser Use：增强网页读取、表单填写和问题诊断能力，可辅助识别报错、加载异常和请求失败。
    - Remote Control：新增产物下载与任务通知卡片，并优化远程场景下的 Plan、Goal、分支和 Worktree 管理体验。
    体验优化
    - 设置搜索：支持按关键词快速定位模型、连接、快捷键、Worktree、自定义指令等设置项。
    - 项目创建：优化创建项目流程与相关引导。
    - 权限与稳定性：优化权限管理、浏览器验证与运行稳定性。
