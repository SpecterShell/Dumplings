- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    本次更新让图片、视频与文档能力更易上手，按需推荐所需插件，Mini App 的创建、预览和运行管理更集中；同时优化当前页面操作、工作树创建进度和提问交互体验。

    新增与优化
    - 图片视频和文档能力开箱即用：图片生成、视频生成与 Word、Excel、PDF、PPT 插件默认安装，直接在对话中提出创作或处理需求；更多视频任务支持补问缺失信息，生成完成后交付文件。
    - 用到插件时，推荐直接出现：任务需要尚未准备好的插件时，可在对话中选择安装、启用或连接账号，准备好后按你最新的需求继续任务，无需重新描述。
    - 创建、找回和管理 Mini App：在 Mini App 首页描述需求即可创建应用并查看生成进度；最近使用卡片保留上次内容预览，常用应用可收藏，运行中的应用可集中查看、停止或全部关闭。
    - 中断的对话接着做：临时断网或服务异常时，对话可以等待恢复后继续；5 小时用量额度用完时显示重置时间，并可选择重置后自动继续，已完成的操作结果会保留。
    - 让 Agent 接着操作当前页面：打开网页、Mini App 或受支持的 Office 文档后，可以让 Agent 接着操作当前页面，首批支持 Excel 指定区域的读取与修改。
    - 创建工作树，看得见进度：用新工作树开启任务时，可以看到空间准备、文件检出等进度和失败原因；分支命名可结合任务内容，环境栏直接显示实际分支名。
    - 点选回答，继续下一步：需要你做决定时，可在对话卡片中点选回答，多项问题可回看修改后统一提交；等待回复时会话列表会提醒，提交后保留问答摘要。

    修复
    - 修复了部分已知问题
