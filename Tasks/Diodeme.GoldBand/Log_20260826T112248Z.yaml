  Value: |-
    Gold Band v0.14.1
    中文 · English
    中文
    功能新增/调整
    调整 Git 最低版本要求
    Important
    所有 Git 功能统一要求 Git 2.36 或更高版本。检测到 Git 版本低于 2.36 时，Gold Band 将停用所有 Git 相关功能。
    体验优化
    1. 修复若干已知问题。
    2. 优化部分 UI 样式。
    3. 优化 AUTO 模式系统提示词。
    English
    Features and changes
    Updated minimum Git version requirement
    Important
    All Git features now require Git 2.36 or later. If an earlier Git version is detected, Gold Band will disable all Git-related features.
    Experience improvements
    1. Fixed several known issues.
    2. Refined UI styling.
    3. Improved system prompts for AUTO mode.

    0.14.1 (2026-08-26)
    Bug Fixes
    - ai-dynamic: defer routing plans to finalize turn (de6310a)
    - conversation: adapt context controls to narrow widths (698cc96)
    - conversation: collapse session info into overflow (abb4135)
    - conversation: correct slash menu surface and stacking (9f07823)
    - git: require Git 2.36 for Git features (deb032e)
    - git: stabilize conversation branch selection (1ea3a88)
    - markdown: dedupe editor runtime dependencies (ddb7a95)
    - runtime: harden AI-DYNAMIC resume and recovery (a932ca5)
    - runtime: keep post-turn contract out of system prompt (c95f131)
    - runtime: resume previous task after user instruction (2e3d756)
    - source-control: follow selected worktree in one tab (9ea117f)
