    Gold Band v0.16.0
    中文 · English

    中文
    功能新增/调整
    1. 右侧工作区支持内置浏览器
    会话、文档里的网页链接，现在默认在右侧工作区的内置浏览器打开，不用切到系统浏览器。

    内置浏览器支持：
    1. 多页签浏览，前进、后退、刷新、地址栏。
    2. 地址栏可以直接输入网址；不是网址时，用当前搜索引擎搜索。搜索引擎可在「设置 → 通用 → 浏览器」中选择百度、Google 或 Bing。
    3. 当前页可以在电脑版和移动版之间切换。
    4. 会话和文档里的本地 HTML，也可以在内置浏览器打开。工作目录里的 HTML 文件默认仍打开源码，需要预览时再点浮层按钮。
    「设置 → 通用 → 浏览器」里可以分别选择：对话和文档里的 localhost、普通网站，是用内置浏览器还是系统浏览器。进入内置浏览器后，地址栏输入的内容始终在当前页打开。
    行内版本已内置常见开发网站。

    2. 支持企业微信远程干预
    离开电脑时，也可以在企业微信里处理任务卡住的权限、追问和人工检查。

    使用流程如下：
    1. 打开「设置 → 通用 → IM 远程干预与通知」，扫码接入企业微信。
    2. 用企业微信给机器人发一条私聊消息，完成一对一绑定。
    3. 任务需要你处理时，会先发一条详情，再发一张可操作卡片。
    4. 在卡片上同意或拒绝权限、回答追问、判定人工检查成功或失败。桌面端已经处理过的请求，卡片会显示已处理。
    也可以按类型开关通知：权限请求、追问、人工检查，以及 Run 成功 / 失败、回合结束。当前只支持企业微信一对一私聊，不支持群聊和自然语言指令。客户端离线、电脑休眠或断网时，不能保证实时收发。
    3. 新增项目记忆
    工作空间可以保存一组跨任务复用的参数，Agent 在执行时按需读取，不必每轮把固定参数再说一遍。

    在工作空间列表里点击书本图标，打开「项目记忆设置」。每条记忆包含参数名、参数值和用途描述，支持新增、修改和删除。
    当前任务用到的参数会单独记在任务记忆里：任务里有同名参数时优先用任务值；任务里把值清空后，不会自动退回项目默认值。项目记忆适合长期复用的默认值，任务记忆由执行过程维护，目前不单独提供任务记忆管理页。
    4. 权限支持自动批准
    权限模式下拉底部新增「自动批准」，默认关闭，可以和原来的权限模式同时使用。

    勾选后，后续带允许选项的工具权限会自动选择第一个允许项继续执行，不再弹出权限卡片，也不再发系统通知。已经弹出的权限卡仍需要手动处理；向你提问的卡片不会自动跳过。
    触发器会显示「当前权限模式 · 自动批准」。工作流节点、AUTO 和定时任务也会沿用创建时保存的自动批准设置。
    5. 输入框支持选择角色，并用方向键翻阅历史
    在输入框输入 @，可以选择 Gold Band 角色；输入 / 仍然是当前 Agent 的命令和 Skill。选中角色后，输入框和已发送消息上会显示角色标签，悬停可以查看完整角色内容。

    已经开始的会话里，光标在输入框第一行时按 ↑，可以翻阅本会话发过的原文；按 ↓ 翻到较新一条，越过最新一条或按 Esc 会回到翻阅前的完整草稿。多行输入时，只有光标在首行或末行才会进入翻阅。
    6. 完善定时任务的触发标识和执行历史
    持续会话被定时触发时，消息流里会插入一条轻量分隔线，区分自动触发和手动立即执行，不再混成普通即时发送。

    定时任务详情改为按每次真正执行分组查看历史。可以移除已完成的执行历史，对应会话仍保留在会话列表里，之后还能打开继续看。运行中、暂停中或等待你处理的记录不能移除。
    体验优化
    1. 更稳定的长会话阅读和跟随
    向上查看历史时，不会因为自动回到最新、或工具/思考详情展开而把阅读位置带走。发送新消息后，会回到最新内容并继续跟随输出。修复滚动尚未结束时跟随中断、以及自动补齐最新内容时跟丢的问题。
    2. 模型和思考强度按当前模型记忆
    现在切换模型会带回模型专属的配置，比如上下文配置，Fast 模式开关等。

    切换模型后，思考强度会尽量带到新模型仍支持的同一档；Fast、上下文等只属于当前模型的选项，不会串到另一个模型上。新模型不支持的项会回退为「不指定」，并在会话里说明，不会因此打断发送。
    Agent 选择器和会话列表会显示对应图标。会话里改模型、权限或自动批准，会保留在当前会话，不会把首页的默认配置改掉。
    3. 更稳妥的发送失败恢复
    消息还没被 Agent 真正接收时，取消或失败会把完整草稿（含附件、引用）放回输入框，避免内容丢失。已经发出去的消息停止生成后，不会再回填。
    修复人工检查后跳错后续节点、侧栏运行状态被冲掉，以及失败原因在重新打开会话后看不到的问题。嵌套 Agent 改动的文件，不再出现在主会话的文件变更里。
    4. 其他体验优化
    1. 修复 Windows 上偶发卡死无响应的问题。
    2. 改善 Git 版本识别；源码管理里的 PR 概览信息更完整。
    3. Agent 诊断失败时给出更明确的本地化原因，并保留有限的原始输出方便排查。
    4. 截断文字的提示不再挡住点击；无边框窗口缩放条在打开内置浏览器后仍可拖拽。
    5. 其他 UI 样式和已知问题修复若干。
    Important
    关于 Cursor 节点停止后的上下文
    由于 Cursor ACP 的限制，当前轮已经开始思考或调用工具后如果点停止，Cursor 可能把这一轮用户消息从后续模型上下文里撤掉。Gold Band 会话里仍会保留这条消息，但接下来直接追问时，模型可能看不到刚被停止的那一轮内容。
    工作流里点「继续」仍会重新带上当前任务上下文。该问题来自 Cursor 适配器，后续等待上游修复。
    详情见 Issue #130。

    English
    Features and changes
    1. Built-in browser in the right workspace
    Web links in conversations and documents now open in the built-in browser in the right workspace by default, without switching to the system browser.

    The built-in browser supports:
    1. Multiple tabs, plus back, forward, refresh, and an address bar.
    2. Entering a URL directly in the address bar. If the input is not a URL, it is searched with the current search engine. Choose Baidu, Google, or Bing under Settings → General → Browser.
    3. Switching the current page between desktop and mobile site.
    4. Opening local HTML from conversations and documents in the built-in browser. HTML files in the workspace tree still open as source by default; use the overlay button when you want a preview.
    Under Settings → General → Browser, you can choose separately whether localhost and regular websites in chats and documents open in the built-in browser or the system browser. After you are already in the built-in browser, address-bar input always opens in the current page.
    The internal channel build includes common development sites.

    2. WeCom remote intervention
    When you are away from the desktop, you can handle blocked permissions, follow-up questions, and manual checks in WeCom.

    How to use it:
    1. Open Settings → General → IM remote intervention and notifications, then scan the QR code to connect WeCom.
    2. Send a private message to the bot in WeCom to complete one-to-one binding.
    3. When a task needs your action, Gold Band sends a details message first, then an actionable card.
    4. On the card, allow or deny permissions, answer questions, or mark a manual check as succeeded or failed. Requests already handled on the desktop are shown as already processed.
    You can also toggle notifications by type: permission requests, questions, manual checks, Run succeeded / failed, and ACP turn finished. Only one-to-one WeCom private chat is supported. Group chats and natural-language commands are not. Real-time delivery is not guaranteed while the client is offline, the computer is asleep, or the network is disconnected.
    3. Project memory
    A workspace can store parameters that are reused across tasks. Agents read them when needed, so you do not have to repeat the same values every turn.

    Click the book icon in the workspace list to open Project Memory Settings. Each entry has a parameter key, value, and description, and can be added, edited, or deleted.
    Parameters used by the current task are stored separately as task memory. A same-named task entry takes precedence. Clearing a task value does not fall back to the workspace default. Project memory is for long-lived defaults. Task memory is maintained during execution, and there is no separate task-memory management page yet.
    4. Auto Accept for permissions
    The permission-mode menu now includes Auto Accept at the bottom. It is off by default and can be used together with the existing permission mode.

    When enabled, later tool permissions that include an allow option automatically choose the first allow option and continue. Permission cards are not shown, and system notifications are not sent. Cards that are already open still need a manual response. Question cards are never skipped.
    The trigger shows current permission mode · Auto Accept. Workflow nodes, AUTO, and scheduled tasks reuse the Auto Accept setting saved at creation time.
    5. Role picker and input history in the composer
    Type @ in the composer to choose a Gold Band role. / still opens the current Agent’s commands and Skills. After you select a role, a role tag appears in the composer and on sent messages. Hover the tag to read the full role content.

    In an established conversation, press ↑ when the cursor is on the first line to browse previously sent text. Press ↓ to move to a newer entry. Pressing ↓ past the newest entry, or pressing Esc, restores the full draft from before you started browsing. In multiline input, history browsing only starts when the cursor is on the first or last line.
    6. Scheduled task trigger markers and execution history
    When a continuous session is triggered on a schedule, a lightweight divider is inserted in the message stream so automatic triggers and manual run-now actions are not mixed with ordinary instant sends.

    Scheduled-task details now group history by each real execution. You can remove completed execution history while keeping the corresponding conversation in the conversation list, so you can still open it later. Records that are running, paused, or waiting for your action cannot be removed.
    Experience improvements
    1. More stable long-conversation reading and follow
    Reading earlier history is no longer pulled back to the latest messages, including when tool or thought details expand. After you send a new message, the view returns to the latest content and continues to follow output. Fixed follow being interrupted before scrolling finished, and losing follow while the latest content was being filled in.
    2. Per-model reasoning and configuration memory
    Switching models now restores model-specific settings such as context configuration and the Fast mode switch.

    After a model switch, reasoning is kept at the same level when the new model still supports it. Fast, context, and similar options stay bound to the current model and are not carried onto a different model. Unsupported options fall back to Unspecified, with a note in the conversation, and do not block sending.
    Agent pickers and the conversation list show the corresponding icons. Changing the model, permission, or Auto Accept inside a conversation stays on that conversation and does not overwrite the home-page defaults.
    3. Safer recovery when sending fails
    If a message has not yet been accepted by the Agent, canceling or failing restores the full draft—including attachments and quotes—to the composer so nothing is lost. Stopping generation after a message has already been sent does not restore it.
    Fixed jumping to the wrong successor after a manual check, sidebar run status being overwritten, and failure reasons disappearing after reopening a conversation. File changes from nested Agents no longer appear in the parent conversation’s file-change list.
    4. Other improvements
    1. Fixed occasional freezes on Windows.
    2. Improved Git version detection, and more complete PR overview information in Source Control.
    3. Clearer localized reasons when Agent diagnostics fail, with a bounded amount of raw output kept for troubleshooting.
    4. Truncation tooltips no longer intercept clicks; the undecorated window resize overlay remains draggable after opening the built-in browser.
    5. Additional UI refinements and fixes for known issues.
    Important
    Cursor context after Stop
    Due to a Cursor ACP limitation, if you stop a turn after thinking or tool calls have already started, Cursor may drop that user message from later model context. Gold Band still keeps the message in the conversation, but a direct follow-up may not see the stopped turn.
    Choosing Continue in a workflow still re-injects the current task context. This is a Cursor adapter issue and can be revisited after an upstream fix.
    See Issue #130 for details.
