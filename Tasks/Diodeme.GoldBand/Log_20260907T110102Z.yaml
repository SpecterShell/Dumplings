  Value: |-
    Gold Band v0.15.0
    中文 · English
    中文
    功能新增/调整
    1. 新增个人数据分析
    现在可以在「帮助 → 个人数据分析」中查看自己的使用情况了。
    支持查看任务完成情况、累计执行耗时、Token 消耗、Agent 和 Skill 使用情况，并查看耗时、Token 消耗 TOP10，点击任务可跳转到对应会话。
    支持按全部、今天、近 7 天、近 30 天或自定义日期筛选。还可以选择 Agent、模型和思考强度，生成针对当前数据的分析建议。
    2. 会话中直接展示本轮生成的附件
    Agent 本轮生成的附件，现在会和文件变更一起展示在会话中，点击即可在右侧工作区打开，不需要再去目录里逐个查找。
    3. 完善 AUTO 模式的任务协作和结果交接
    本次继续完善多节点并行执行：
    1. 节点可以在关键决策前了解其他任务分支的目标和进度，减少重复分工和相互冲突。
    2. 完善前后节点之间的附件传递，后续节点可以获取当前任务链路需要的材料。
    3. AUTO 节点完成后，会生成结果摘要和完整报告清单，供后续工作流节点继续处理，减少交接时遗漏信息。
    4. 优化新一轮反馈和节点交接的提示词，减少继续执行时偏离当前任务范围的问题。
    4. 调整侧栏入口
    将 Agent、上下文、运行模式、需求管理等入口收纳到「更多」菜单，会话侧栏更简洁。
    体验优化
    1. 更流畅的长会话体验
    优化长会话的消息渲染、流式工具更新和历史加载，减少持续输出时的卡顿及内存占用。侧栏优先加载首批可见数据，减少历史会话较多时的等待。
    修复向上翻阅时被自动拉回底部、返回最新消息按钮状态不稳定，以及加载更早历史时部分内容丢失的问题。
    2. 更稳定的会话执行与恢复
    修复切换或重新进入会话后，消息、运行状态和待处理交互不同步的问题；修复删除后新建会话可能混入旧内容、会话结束后侧栏仍显示运行中等问题。
    优化异常后的输入框恢复和会话重连，修复 Claude 部分后台执行导致任务提前结束的问题，以及运行中的连接被误回收的问题。
    Important
    关于 Claude 节点的特殊处理
    由于 Claude Code SDK 和 Claude Agent ACP 的局限性，目前 Claude 发起后台任务或 monitor 时，前台任务会直接停止，且暂时没有合理的手段判断后台任务是否完成并唤醒前台任务继续。因此，本次临时禁用 Claude 节点的后台任务和 monitor。对于无人值守的长程任务来说，影响很小，后续等待相关组件的进一步优化。
    详情见 Issue #114。
    3. 其他体验优化
    1. 改善较旧 WebView 环境中的页面显示、状态颜色和布局兼容性。
    2. 修复部分会话恢复后模型列表不正确的问题，更新内置 Agent 目录。
    3. 修复置顶会话和通知跳转定位问题。
    4. 修复工作流 JSON 编辑时执行槽位配置丢失的问题。
    5. 其他 UI 样式和已知问题修复若干。

    English
    Features and changes
    1. Personal analytics
    You can now review your usage under Help → Personal analytics.
    View task completion, cumulative execution time, Token usage, and Agent and Skill usage, along with the top 10 tasks by execution time and Token consumption. Click a task to open its conversation.
    Filter by all time, today, the last 7 days, the last 30 days, or a custom date range. You can also select an Agent, model, and reasoning level to generate insights and recommendations for the selected data.
    2. Generated attachments in conversations
    Attachments generated by the Agent during the current turn now appear alongside file changes in the conversation. Click an attachment to open it in the right workspace panel without searching through directories.
    3. Improved task coordination and result handoffs in AUTO mode
    This release further improves parallel execution across multiple nodes:
    1. Nodes can review the goals and progress of other task branches before key decisions, reducing duplicate work and conflicts.
    2. Improved attachment transfer between nodes so successors can access the materials needed for their task chain.
    3. Completed AUTO nodes produce a result summary and a full report manifest for subsequent workflow nodes, reducing information loss during handoffs.
    4. Improved prompts for new-round feedback and node handoffs to keep continued execution within the current task scope.
    4. Streamlined sidebar navigation
    Agent, Context, Run modes, and Requirements entries are now grouped under More, keeping the conversation sidebar simpler.
    Experience improvements
    1. Smoother long conversations
    Improved message rendering, streaming tool updates, and history loading to reduce stuttering and memory usage during continuous output. The sidebar prioritizes the first visible data to reduce waiting when many past conversations are stored.
    Fixed unwanted jumps to the bottom while reading earlier messages, inconsistent behavior of the return-to-latest button, and missing content when loading older history.
    2. More reliable conversation execution and recovery
    Fixed messages, execution status, and pending interactions becoming out of sync after switching or reopening conversations. Also fixed old content appearing in newly created conversations after deletion and the sidebar continuing to show completed conversations as running.
    Improved composer recovery after errors and conversation reconnection. Fixed premature task completion caused by some Claude background operations and active connections being incorrectly evicted.
    Important
    Special handling for Claude nodes
    Due to limitations in the Claude Code SDK and Claude Agent ACP, starting background tasks or monitor operations can stop the foreground task. There is currently no reliable way to determine when the background work has finished and resume the foreground task. This release therefore temporarily disables background tasks and monitor operations for Claude nodes. The impact on unattended, long-running tasks is expected to be small. This restriction can be revisited as the upstream components improve.
    See Issue #114 for details.
    3. Other improvements
    1. Improved page rendering, status colors, and layout compatibility in older WebView environments.
    2. Fixed incorrect model lists after restoring some conversations and updated the bundled Agent catalog.
    3. Fixed navigation to pinned conversations and conversations opened from notifications.
    4. Fixed execution slot settings being lost when editing workflow JSON.
    5. Additional UI refinements and fixes for known issues.
