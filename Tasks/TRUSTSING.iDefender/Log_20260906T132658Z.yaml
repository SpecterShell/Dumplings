    - 完善内置规则
    - 进程支持清理已经退出的进程
    - BitsDownload 支持显示下载的 Url
    - 信任列表支持注册表值内容字段
    - 修复关闭界面时卡顿的问题
    - 修复注入可能跟某些开启 ImageTlsCallbackCaller 的软件冲突导致崩溃的问题
    - 其他体验优化和功能修复
