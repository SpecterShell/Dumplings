  Key: ReleaseNotes
  Value: |-
    PhpStorm 2026.3 EAP #5 is now available
    This build brings a bunch of bug fixes and quality-of-life improvements.

    Here are the most notable changes and bug fixes in this build:

    - Fix: phpstan.phar is automatically excluded from WSL-based projects [WI-78661]
    - Fix: Dragging a local file onto a Remote Host file doesn't upload it [WI-74098]
    - Fix: No autocompletion with nested array of Objects [WI-75507]
    - Fix: Generic type of generator isn't inferred when generator has several template types [WI-85337]
    - Fix: Unable to use "Browse" buttons in a WSL-based Interpreter [WI-66357]
    - Fix: WSL type of interpreter isn't selected in Configure Remote PHP Interpreter when interpreter is chosen from autodetected list [WI-86000]
    - Fix: Discover PHP interpreters in the project's environment [WI-85797]
    - Fix: Generic return type isn't inferred based on class-string if code is located under namespace [WI-85715]
    - Fix: Generic return type in object like array isn't inferred [WI-85333]
    - Fix: Quality Tools: browse button in path fields insert WSL paths instead of Linux paths for a WSL interpreter [WI-73377]
    - Fix: License Collision Detected every few minutes. [IJPL-35616]
    - New: Configurable MCP Server Port Per Project [IJPL-207839]
    - New: Markdown: Footnotes, citations and references [IJPL-92238]

    For the full list of changes in this build, please see the release notes.
