  Key: ReleaseNotes
  Value: |-
    PhpStorm 2026.3 EAP #2 is now available
    This build brings a bunch of bug fixes and quality-of-life improvements.

    Here are the most notable changes and bug fixes in this build:

    - Fix: SASS: "Unexpected term" error when using namespaced functions/variables as calc() arguments [WEB-56489]
    - Fix: Erroneous unused default import "svelte-fa" in Svelte component [WEB-57512]
    - Fix: Add an icon for Brave browser [WEB-51602]
    - Fix: Excessive `forceUpdate` during index querying (particularly when the second project is closed during indexing) [IJPL-2966]
    - Fix: Markdown: 'Import Word Document' on a converted .docx fails with errors and deletes the original file from the system [IJPL-158668]
    - New: Updating terminal session name when starting from Markdown code block [IJPL-92258]
    - New: Markdown: Add ability to ignore headings when generating TOC [IJPL-177429]
    - Fix: Markdown table formatting does not follow specification [IJPL-92199]
    - New: Breadcrumbs for markdown files (heading based) [IJPL-91056]
    - New: Docker Registry: Support connection to registries as a service in case of google, amazon etc registries [IJPL-73459]
    - Fix: Namespace selection popup broken under Wayland [IJPL-215168]
    - Fix: Pycharm remote and local picture in .md file : "cannot resolve symbol 'picture.png'" [IJPL-167949]
    - New: Markdown preview doesn't render image from base64 data [IJPL-94682]
    - New: Go to File doesn't work for absolute paths outside the project [IJPL-220330]

    For the full list of changes in this build, please see the release notes.
