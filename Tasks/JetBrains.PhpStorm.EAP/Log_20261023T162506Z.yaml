  Key: ReleaseNotes
  Value: |-
    PhpStorm 2026.3 is now available
    PhpStorm 2026.3 is a minor update, and it includes a host of bug fixes and quality-of-life improvements.
    Here are the most notable changes and bug fixes in this build:

    - Fix: Rsync in WLS doesn't work when "Key pair" authentication type is used and private key file located in WSL [WI-77359]
    - Fix: Docker Compose PHPUnit execution fails on Windows 10 when project is opened via \\wsl.localhost path (Path mapping issue) [WI-84006]
    - Fix: Expression is not allowed as default value: Fallse positive for expression with partial function [WI-86157]
    - Fix: Partial function application: false positive "Expected parameter of type" on closure call with strict_types [WI-86249]
    - Fix: Partial function application: bound arguments are not type-checked [WI-86166]
    - Fix: Partial functions are marked as errors in expression with pipe operator [WI-86154]
    - Fix: call of function clone() as partial function is marked as error [WI-86153]
    - Fix: Required parameter missing: False positive for call of partial function [WI-86148]
    - Fix: Show Parameter Name Inlay Hints For PHP Partial Function Application Placeholders [WI-85723]
    - Fix: Add conversion support between closures and PHP partial function applications [WI-85598]
    - Fix: Add diagnostics and quick fixes for invalid PHP partial function applications [WI-85597]
    - Fix: Add type inference and control-flow support for PHP partial function applications [WI-85596]
    - Fix: Deployment with rsync uses incorrect binary under WSL [WI-85102]
    - New: Use extended assets configuration in angular.json to resolve images in templates [WEB-59564]
    - New: New UI for "Show Column List" popup [DBE-17485]
    - New: Angular: Support comments in html element (22+) [WEB-77405]
    - Fix: Error downloading schema: 'IDE_system_folder/httpFileSystem/xx.json' does not exist in VFS when setting up JSON Schema [IJPL-173495]
    - Fix: Redesign remote JSON schemas processing [IJPL-737]
    The full list of changes in PhpStorm 2026.3 is available in the release notes.

