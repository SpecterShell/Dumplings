  Key: ReleaseNotes
  Value: |-
    PhpStorm 2026.3 EAP #3 is now available
    This build brings a bunch of bug fixes and quality-of-life improvements.

    Here are the most notable changes and bug fixes in this build:

    - Fix: Wrong xdebug.client_host is being passed to the command when debug using interpreter from WSL [WI-66933]
    - Fix: Docker | Browse files not working [WI-44280]
    - Fix: WSL Interpreter: repetitive output delayed until the script stops [WI-67864]
    - Fix: PHP 8.6: Readonly Property Defaults [WI-85784]
    - Fix: PHP 8.6: Deprecate returning values from __construct() and __destruct() [WI-85604]
    - New: Storybook-related symbols aren't treated as unused [WEB-58905]
    - Fix: Private property read access not seen ("Contents of collection updated, but never queried") [WEB-79611]
    - New: Revive the "Open in Split with chooser" [IJPL-149905]
    - New: Github wiki links support [IJPL-91123]
    - Fix: Cannot Run shell snippets in terminal when within ssh connection (opens new RunMarkdown tab) [IJPL-92257]

    For the full list of changes in this build, please see the release notes.
