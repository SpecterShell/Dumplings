  Value: |-
    Codem v1.18.11
    发布日期：2026-11-06
    类型：Android 本机模式预览
    下载：Android 本机模式见下方；Windows 安装包随版
    本版要点
    手机本机项目目录改为共享存储，文件管理器可见：
    - 默认工作区：/storage/emulated/0/codem/workspace（即手机内部存储的 codem/workspace）；
    - 不再只放在应用沙箱；用系统文件管理器 / USB / 其他应用都能直接放入项目；
    - Android 11+ 首次启动会引导授予「所有文件访问」；拒绝则回退应用私有目录，不阻塞使用；
    - 项目选择/新建仍在本机模型设置里；保存后 Host 以所选项目目录启动。
    本机 Host 绑定共享存储：PRoot 将 /storage/emulated/0 原样 bind 进 Linux 环境，Host 的 --workspace 直接是该共享路径。
    Android 本机模式
    - Codem-Shell-1.18.11-arm64.apk：真机安装包，APK 内含 PRoot + Ubuntu + Node + 本机 Host，不依赖电脑。
    - Codem-Shell-1.18.11-x86_64.apk：x86_64 模拟器包。
    - 当前为 debug 签名预览包，只用于真机验证。
    使用
    1. 安装 APK，首次启动允许「所有文件访问」；
    2. 用文件管理器把项目放到 内部存储/codem/workspace；
    3. 点顶部「信息 → 本机模型设置」；
    4. 填 AICodeWith key，点「使用 AI Code With 预设」「获取模型列表」；
    5. 在「项目工作区」选择项目或新建，保存；
    6. Host 重启后就在该目录跑项目/对话。
    已知问题 / 后续
    - 终端（terminal.*）尚未支持；手机端仍是 Host 共享 Web UI，不是完整桌面 IDE；
    - 外部项目导入目前靠共享目录直接放文件，未做应用内文件选择器；
    - Flutter 远程客户端仍是「手机看电脑」，不是本机运行。
    校验
    - 模拟器授予 MANAGE_EXTERNAL_STORAGE 后，Host 实际参数：
      --workspace /storage/emulated/0/codem/workspace/emoy；
    - 共享目录存在且文件管理器可访问。
