  Value: |-
    Codem v1.18.18
    发布日期：2026-11-25
    类型：稳定版（Windows x64）
    下载：Codem_1.18.18_x64-setup.exe（NSIS 安装包）· Codem_1.18.18_x64_en-US.msi（MSI）
    本版要点
    1. 设置底栏的「会话恢复 / 用量统计」恢复为看得见、点得到的次级按钮。
    2. 设置里的次级动作统一补上按钮外框和底色，不再退化成一行普通文字。
    3. 「配置方案」附加动作增加独立底色与外框，和普通文本区分开。
    变更
    修复
    - 修复设置底栏两个次操作只有文字、没有按钮外框的问题。
    - 修复设置内次级按钮在部分面板里与背景混在一起、难以识别的问题。
    - 修复模型行「配置方案」看起来像说明文字、不像可点击动作的问题。
    测试
    - 新增按钮可识别性判据：底栏次操作必须有按钮类与可见外框，设置内次级按钮统一外框。
    升级说明
    - 支持直接覆盖安装，设置、会话、项目与工作区数据保留。
    - 本版不改数据格式；如需回退，可安装上一稳定版 1.18.17。
    已知问题 / 后续
    - 本版只处理按钮可识别性，未改模型路由与 agent 循环。
    校验
    - 附更新器签名 .sig；latest.json 使用 windows-x86_64-nsis 与 windows-x86_64 两个平台键。
