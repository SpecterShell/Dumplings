  Value: |-
    Codem v1.18.2
    发布日期：2026-11-04
    类型：稳定版（Windows x64）
    下载：Codem_1.18.2_x64-setup.exe（NSIS 安装包）· Codem_1.18.2_x64_en-US.msi（MSI）· Android 预览包见下方
    Android 真机验证包
    - Codem-Mobile-1.0.0-arm64.apk：真机（arm64-v8a）安装包。
    - Codem-Mobile-1.0.0-x86_64.apk：x86_64 模拟器包。
    - 最低 Android 7.0（API 24）。当前为 debug 签名预览包，只用于真机验证，不可上架应用商店。
    - 安装：手机允许“安装未知应用”后打开 APK；与已装同包名版本会覆盖升级。
    - 连接：PC 保持 Codem 运行，并执行 tailscale serve --bg 41873；手机与 PC 登录同一 tailnet 后，在手机「添加电脑」填 https://<machine>.<tailnet>.ts.net，配对码留空即可。
    本版要点
    1. 继续条与正文列对齐：修复共享样式覆盖桌面横向 gutter 的问题，继续条的内容右缘现在与正文列一致，不再比正文多出 24px，也不再贴到窗口最右侧。
    2. 旧会话也不再显示继续入口：没有结构化完成字段的历史消息按“已完成”处理，不会在重新打开旧会话时继续显示「继续」。
    3. 继续条样式统一：使用项目主题按钮与共享布局类，保留阅读列宽度约束。
    变更
    修复
    - ui.css 在桌面样式之后加载，同优先级的 .continue-bar 内边距覆盖了桌面阅读列 gutter；桌面规则提高为 .chat-panel > .desktop-continue-bar。
    - 继续条在旧会话已完成回合中仍然显示的问题。
    - 继续条宽度/对齐与按钮主题样式不一致。
    升级说明
    - 可直接覆盖安装，无需手动迁移数据；会话、设置、项目与已配对设备都会保留。
    - 本版只修复桌面继续条呈现，不改变任务执行、完成门、工具调用或长任务行为。
    - 手机 APK 与 v1.18.1 相同，本版未重新构建移动端。
    已知问题
    - 手机 APK 仍为 1.0.0 debug 签名预览包。
    - 完整 12 任务跨实现评测仍未重跑；长尾单任务的两轮结果只作为方向性参考。
    校验
    - 附更新器签名 .sig；latest.json 平台键为 windows-x86_64-nsis、windows-x86_64。
    - 安装包与 MSI 均由同一版本源码构建。
