  Value: |-
    Codem v1.18.16
    发布日期：2026-11-23
    类型：稳定版（Windows x64）
    下载：Codem_1.18.16_x64-setup.exe（NSIS 安装包）· Codem_1.18.16_x64_en-US.msi（MSI）
    本版要点
    1. 聊天头部的 7 个高频视图开关恢复为常显图标：完整历史、思考过程、智能体与团队、文件快照、上下文、执行轨迹、侧边面板。
    2. 不再需要先打开「更多操作」菜单再点；每个图标保留悬停提示、当前开关高亮和禁用态（没有会话时「完整历史」不可用）。
    变更
    修复
    - 头部视图开关恢复直接点击，移除旧「更多操作 → 视图与面板」菜单，避免同一组开关存在两个入口。
    - 删除旧菜单组件与样式，新增工具条判据，防止以后又把高频开关收进菜单。
    升级说明
    - 可直接覆盖安装，不需要先卸载 1.18.15；本版只改聊天头部交互，不影响会话与设置。
    已知问题
    - 本版未重跑 12 个真实仓库任务的配对评测；沿用上一稳定版的结论，不把未重跑说成提升。
    - 敏感文件读取、子进程环境剥离等安全边界与 1.18.15 相同；详见 1.18.15 发布说明。
    校验
