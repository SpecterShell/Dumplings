  Value: |-
    Codem v1.18.7
    发布日期：2026-11-05
    类型：稳定版（Windows x64）
    下载：Codem_1.18.7_x64-setup.exe（NSIS 安装包）· Codem_1.18.7_x64_en-US.msi（MSI）· Android 预览包见下方
    本版要点
    1. 修复冷启动视觉转录误报：刚启动 Codem 后立刻对扫描件/图片触发 OCR，第一次可能提示「未配置视觉模型」，需要手动重试。现在 OCR 会先同步已解封的 provider key，并在引擎尚未就绪时短暂重试，首次即可完成转录。
    变更
    修复
    - OCR 冷启动竞态：runDocumentOcr 在解析视觉模型前主动从已水合的设置同步 provider key，并做有限重试；视觉配置确实缺失时仍返回可行动错误，不假装成功。
    Android 真机验证包
    - Codem-Mobile-1.0.0-arm64.apk：真机（arm64-v8a）安装包。
    - Codem-Mobile-1.0.0-x86_64.apk：x86_64 模拟器包。
    - 最低 Android 7.0（API 24）。当前为 debug 签名预览包，只用于真机验证，不可上架应用商店。
    - 本版只改 Windows 端 OCR 初始化，APK 与 1.18.6 相同。
    升级说明
    - 可直接覆盖安装；设置、文档索引与会话数据不受影响。
    - 若 1.18.6 曾遇到首次 OCR 失败，升级后无需再手动重试。
    已知问题 / 后续
    - 视觉转录仍需要可用的视觉模型或「设置 → 多模态 → Vision」配置；完全未配置时会保持 needs_ocr 并给出提示。
    - 向量索引需要先配置 embedding 提供方；未配置时使用全文检索。
    校验
    - 附更新器签名 .sig；latest.json 平台键为 windows-x86_64-nsis、windows-x86_64。
    - MSI 与 NSIS 安装包同源同签名。
