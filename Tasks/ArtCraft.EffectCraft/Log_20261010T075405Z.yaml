  Key: ReleaseNotes
  Value: |-
    What's Changed
    - Import: a 3D model doesn't ask how to interpret its alpha (#264) by @bflatastic in https://github.com/storytold/effectcraft/pull/296
    - Effects: Fractal Noise's Soft Linear has no lattice creases (#259) by @bflatastic in https://github.com/storytold/effectcraft/pull/278
    - G2: add context menus to blank Project and Timeline areas by @jonassneu in https://github.com/storytold/effectcraft/pull/210
    - Docs: pitfalls for agents driving EffectCraft over MCP by @pat-the-wizard in https://github.com/storytold/effectcraft/pull/266
    - MCP: preserve unsaved work across server restarts (#258) by @jonassneu in https://github.com/storytold/effectcraft/pull/280
    - App: a second copy opening, or OpenGL that fails, no longer strands Window Graphics by @prekabreki in https://github.com/storytold/effectcraft/pull/283
    - M9: place Japanese vertical punctuation using font metrics by @midasdf in https://github.com/storytold/effectcraft/pull/298
    - i18n: add Simplified and Traditional Chinese (zh-hans, zh-hant) UI translation by @FeiLiuEM in https://github.com/storytold/effectcraft/pull/309
    - Text: fallback skips a font whose glyph for the character is empty (#285) by @DWAA1660 in https://github.com/storytold/effectcraft/pull/310
    - CLI: render --out is relative to the working directory (#300) by @Oldrich333 in https://github.com/storytold/effectcraft/pull/323
    - M9: open grouped tool flyouts on long press by @midasdf in https://github.com/storytold/effectcraft/pull/213
    - README: install on Gentoo from the ::snakebyte overlay by @switch87 in https://github.com/storytold/effectcraft/pull/256
    - 3D: layer.newLight lists the Environment light and how to set its source; parity notes reflections (#261) by @pat-the-wizard in https://github.com/storytold/effectcraft/pull/294
    - Render: text layers are always continuously rasterised by @EthanSuquet in https://github.com/storytold/effectcraft/pull/200
    - Media: footage audio at another sample rate no longer stutters (#274) by @bflatastic in https://github.com/storytold/effectcraft/pull/305
    - Media: resampling footage audio guards a zero mix rate (#274) by @bflatastic in https://github.com/storytold/effectcraft/pull/382
    - Render Queue: output files end in their format's extension once (#293) by @bflatastic in https://github.com/storytold/effectcraft/pull/380
    - Timeline, keyframes, Graph Editor, Puppet and pick whip fixes from #284 by @bflatastic in https://github.com/storytold/effectcraft/pull/381
    - Tweaks from #290: label colours, nudging, motion-path handles, Time Remap, masks, context menus by @bflatastic in https://github.com/storytold/effectcraft/pull/383
    - Effects: EXtractoR picks layers and channels of multi-layer EXRs (#295) by @bflatastic in https://github.com/storytold/effectcraft/pull/387
    - Menu-bar keyboard, comp marker bin, UI Scale and Settings scroll (#279, #275, #284) by @bflatastic in https://github.com/storytold/effectcraft/pull/391
    - macOS DMG: branded window background and icon layout by @XusBadia in https://github.com/storytold/effectcraft/pull/281
    - MCP: core tools, resources, render progress and cancellation by @storybored379 in https://github.com/storytold/effectcraft/pull/365
    - Fix #367: weighted_nms terminates on NaN or zero-area boxes by @bflatastic in https://github.com/storytold/effectcraft/pull/373
    - Fix #368: tflite rejects models whose scratch or work exceeds a budget by @bflatastic in https://github.com/storytold/effectcraft/pull/374
    - segment: sample crops like MediaPipe's ImageToTensor; no overflow in crop by @KazW in https://github.com/storytold/effectcraft/pull/388
    - Effects: effect points on shape layers start at the layer centre (#227) by @bflatastic in https://github.com/storytold/effectcraft/pull/289
    - text, ui: the CJK fallback fonts follow the interface language by @FeiLiuEM in https://github.com/storytold/effectcraft/pull/312
    - fix: rewrite Audio Spectrum to match After Effects linear frequency/amplitude model by @thanhcong2k7 in https://github.com/storytold/effectcraft/pull/319
    - Puppet: the first pin no longer turns the layer about it (#313) by @HEOJUNFO in https://github.com/storytold/effectcraft/pull/342
    - fix(export): keep values above 1.0 in EXR output (#339) by @MindlessRuff in https://github.com/storytold/effectcraft/pull/344
    - UI: Commit text edit session when switching away from Type tool by @thanhcong2k7 in https://github.com/storytold/effectcraft/pull/345
    - i18n: match the Simplified Chinese labels to the installed 26.5.0 UI by @cjcwwww in https://github.com/storytold/effectcraft/pull/353
    - UI: Draw panel focus outline after panel body to prevent clipping by @thanhcong2k7 in https://github.com/storytold/effectcraft/pull/354
    - Export: AIFF 32-bit float writes AIFF-C fl32 instead of 24-bit (#317) by @HEOJUNFO in https://github.com/storytold/effectcraft/pull/357
    - Import: image sequences with a Sequence option, ranges, folders and missing frames (#297) by @bflatastic in https://github.com/storytold/effectcraft/pull/384
    - Import: Interpret Footage has Start Timecode, as in After Effects (#297) by @bflatastic in https://github.com/storytold/effectcraft/pull/422
    - Plug-ins and extensions as in After Effects: ScriptUI panels reopen, Ease Presets becomes a bundled panel, AE's Snapping options by @bflatastic in https://github.com/storytold/effectcraft/pull/404
    - i18n: add Ukrainian (uk) menu translation by @dmatviichuk in https://github.com/storytold/effectcraft/pull/401
    - i18n: translate the interface below the menu bar (panels, dialogs, tooltips) by @FeiLiuEM in https://github.com/storytold/effectcraft/pull/398
    - UI: Compact and align effect parameter rows by @cdinhoo in https://github.com/storytold/effectcraft/pull/402
    - Fix GPU Posterize threshold parity by @sanyamsingh001 in https://github.com/storytold/effectcraft/pull/405
    - UI: no parameter row separators, as in After Effects (#402 follow-up) by @bflatastic in https://github.com/storytold/effectcraft/pull/433
    - Export: Render Queue jobs keep a layer cache and render on one compositor (#413, #414) by @bflatastic in https://github.com/storytold/effectcraft/pull/429
    - Timeline and viewer: resize cursors, time display toggle, pick whip, expression field, Tab, property menu (#393, #370, #362, #363, #371, #361, #407) by @bflatastic in https://github.com/storytold/effectcraft/pull/436
    - i18n: interface translations are looked up by hash (#398 follow-up) by @bflatastic in https://github.com/storytold/effectcraft/pull/445
    - Text and viewer fidelity: glyph seams, overlay fringes, text raster scale, viewer minification (#415, #416, #390, #417) by @bflatastic in https://github.com/storytold/effectcraft/pull/444
    - EXR beauty layer, Interpret Footage Preserve RGB, OCIO v2 transforms for Blender configs (#412, #411, #410) by @bflatastic in https://github.com/storytold/effectcraft/pull/449
    - Timeline: every property has a pick whip in the Parent & Link column (#363) by @bflatastic in https://github.com/storytold/effectcraft/pull/452
    - Effects: CC Particle World follows the comp camera (#397) by @bflatastic in https://github.com/storytold/effectcraft/pull/454
    - Arabic, Hebrew, Indic and Thai names; FLAC preview opens once and off the UI thread (#394, #408) by @bflatastic in https://github.com/storytold/effectcraft/pull/459
