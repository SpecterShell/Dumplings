  Key: ReleaseNotes
  Value: |-
    What's Changed
    - Window: saved workspaces are listed in Window ▸ Workspace (#191) by @bflatastic in https://github.com/storytold/effectcraft/pull/196
    - Render Queue: clicking the Output To file name opens a save dialog (#192) by @bflatastic in https://github.com/storytold/effectcraft/pull/197
    - Rename PrintCraft to PdfCraft by @echelon in https://github.com/storytold/effectcraft/pull/207
    - Preview: audio visualisers follow time in the viewer; sound starts once rendering keeps up (#208, #209) by @bflatastic in https://github.com/storytold/effectcraft/pull/219
    - App: starts with an empty project, opens on older GPUs, shows comps wider than the texture limit (#198, #201, #204) by @bflatastic in https://github.com/storytold/effectcraft/pull/220
    - Timeline, shapes and masks: Add menu, Change Renderer, toolbar Fill / Stroke, Alt+Shift+P reveal, mask selection, linked feather, Project selection box (#203, #205, #206) by @bflatastic in https://github.com/storytold/effectcraft/pull/221
    - Puppet: dragging pins keeps the layer under the Puppet cached (#212) by @bflatastic in https://github.com/storytold/effectcraft/pull/222
    - Docs: gaps.md records the user reports of 7 October by @bflatastic in https://github.com/storytold/effectcraft/pull/223
    - Web: replaced files reach reused workers, failed worker starts fail their job, failed storage writes retry (#215, #216, #218) by @bflatastic in https://github.com/storytold/effectcraft/pull/224
    - About: contributor and model credits compiled in (grab bag + table, self-submitted names) by @echelon in https://github.com/storytold/effectcraft/pull/228
    - Effects: Turbulent Displace displaces the whole layer, not one quadrant (#227) by @bflatastic in https://github.com/storytold/effectcraft/pull/235
    - Web: short Project panel, unreadable picked files, lost graphics device (#231, #226, #225) by @bflatastic in https://github.com/storytold/effectcraft/pull/237
    - Viewer: a press on a selected layer behind others acts on it (#230) by @bflatastic in https://github.com/storytold/effectcraft/pull/239
    - Settings: Language ▸ Match System follows the system language (#229) by @bflatastic in https://github.com/storytold/effectcraft/pull/241
    - Spacebar hand tool, Effect Controls menu, New Comp drop, switch drags (#227) by @bflatastic in https://github.com/storytold/effectcraft/pull/238
    - Shapes: draw into, copy, paste and duplicate shape contents (#227) by @bflatastic in https://github.com/storytold/effectcraft/pull/240
    - Docs: gaps.md records the user reports of 8 October by @bflatastic in https://github.com/storytold/effectcraft/pull/242
    - Logging: RUST_LOG prints to stderr, and start-up logs its milestones (#234) by @bflatastic in https://github.com/storytold/effectcraft/pull/244
    - Effects: the sim golden test accepts macOS 27's libm hash for Mr. Mercury (#232) by @bflatastic in https://github.com/storytold/effectcraft/pull/245
    - Fix variable-font animator test axis selection and endpoint delta by @ulanch in https://github.com/storytold/effectcraft/pull/233
    - App: a launch whose window never drew makes the next use OpenGL (#243) by @bflatastic in https://github.com/storytold/effectcraft/pull/247
    - Docs: gaps.md G4 lists py-aep as a candidate for .aep import (#248) by @bflatastic in https://github.com/storytold/effectcraft/pull/249
    - Timeline: a selected key selects its property and layer (#252) by @bflatastic in https://github.com/storytold/effectcraft/pull/255
    - Snapping: layers, scale handles and the work area snap as in After Effects (#253, #252) by @bflatastic in https://github.com/storytold/effectcraft/pull/265
    - Keyframes: ease presets apply saved curves to keyframe pairs (#254) by @bflatastic in https://github.com/storytold/effectcraft/pull/267
    - Render: render.backend says why it renders on the CPU; mcp --gpu documented (#262) by @bflatastic in https://github.com/storytold/effectcraft/pull/276
    - UI: long menus scroll, panels get scroll bars, Learn closes when leaving it (#269, #271, #272) by @bflatastic in https://github.com/storytold/effectcraft/pull/277
    - Puppet pin keys show in the Timeline; imports show an Importing card (#273, #270) by @bflatastic in https://github.com/storytold/effectcraft/pull/282
    - Release: FreeBSD x86_64, Flatpak x86_64 + aarch64, AppImage zsync updates; README Downloads by @echelon in https://github.com/storytold/effectcraft/pull/287
    - README Downloads: where to get it, then builds (Windows first) by @echelon in https://github.com/storytold/effectcraft/pull/291
    - Engine: adding a 3D model switches a Classic 3D comp to Advanced 3D (#264) by @bflatastic in https://github.com/storytold/effectcraft/pull/286
    - i18n: the browser build's Match System uses supported() too (#229) by @bflatastic in https://github.com/storytold/effectcraft/pull/292
    New Contributors
    - @ulanch made their first contribution in https://github.com/storytold/effectcraft/pull/233
