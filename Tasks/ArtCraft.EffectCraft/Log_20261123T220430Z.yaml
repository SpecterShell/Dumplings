  Key: ReleaseNotes
  Value: |-
    Highlights
    - After Effects compatibility: .aep import is twice as fast and handles huge or hostile files without stalling, keeps effects it can't map as placeholders, and imports text animator Stroke Opacity and Source Text expressions. Dozens of effect parameters now take After Effects' ranges, and Ball Grid gets every CC Ball Action control.
    - Media: video and audio decoding moved to the shared Craft media libraries, with many import fixes (ProRes alpha, MOV timecode and audio edits, Matroska aspect and duration, MXF, AVI and FLAC).
    - Caching rebuilt: footage is decoded once, all caches share one memory budget, and idle caching is on. Closing a project frees its memory.
    - Editing: the Graph Editor follows the theme and draws curves through every keyframe, number fields accept arithmetic (960/2), Effect Controls can be locked to a layer, the Composition viewer has a 1 | 2 | 4 views switch, and reversed layers play their audio backwards.
    - Fixes: file dialogs that can't open are errors instead of crashes, Warp Stabilizer and 3D Camera Tracker analyses survive offline footage and older projects, and LUT and OCIO files are re-read when they change on disk.
