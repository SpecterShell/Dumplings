- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Note
    FreeBSD aarch64 is dropped from this release. We had to cut releases, and we cannot build this target within the 5-hour CI limit for any of the Craft apps, so we are dropping it for now. This is a known blocker, flagged for a future fix in storytold/craft-common-actions#39. FreeBSD x86_64 and every other platform are included.
    What's Changed
    - security: enforce HTTPS on curl downloads (SonarCloud S6506) by @dylanmtaylor in https://github.com/storytold/effectcraft/pull/2059
    - README: the app icon above the title by @bflatastic in https://github.com/storytold/effectcraft/pull/2099
    - Fix panic in path::rect when both size components are NaN by @Silvertree2010 in https://github.com/storytold/effectcraft/pull/1989
    - Fix hsv_to_rgb returning magenta for tiny negative hues by @Silvertree2010 in https://github.com/storytold/effectcraft/pull/1902
    - Fix integer overflow in sampleImage for huge sample points by @Silvertree2010 in https://github.com/storytold/effectcraft/pull/1992
    - Fix feather points when deleting first vertex of a closed mask path by @Silvertree2010 in https://github.com/storytold/effectcraft/pull/1966
    - Windows: two fixes so cargo xtask ci gets past clippy and the media tests by @CharlesBaumer in https://github.com/storytold/effectcraft/pull/1855
    - script: setValue rejects an array of the wrong dimension (#1936) by @Anubhav-Rai in https://github.com/storytold/effectcraft/pull/1957
    - Project: comp_contains walks precomps with a visited set, not recursion (#1237) by @DWAA1660 in https://github.com/storytold/effectcraft/pull/1363
    New Contributors
    - @CharlesBaumer made their first contribution in https://github.com/storytold/effectcraft/pull/1855
    - @Anubhav-Rai made their first contribution in https://github.com/storytold/effectcraft/pull/1957
    Full Changelog: https://github.com/storytold/effectcraft/compare/v0.14.0...v0.15.0
