  Key: ReleaseNotes
  Value: |-
    本次更新
    - 新增启动时恢复上次工作区，保留窗口配置和全自动状态；已停止 Agent 不加入恢复名单。
    - Manager 名称与原生 Session 绑定，恢复历史优先显示最新名称，并支持显示、复制原生会话 ID。
    - 总览与列表模式共享拖动排序；关键词续跑按最近回复和 Agent 状态判断，并支持最大连续次数。
    - 优化 Codex PermissionRequest Hook：审批链路异常时明确拒绝，隔离 Hook 与终端广播，补充脱敏生命周期日志。
    - 修复 Codex 独立配置在恢复会话时失效的问题，并默认关闭 Astra 输入框装饰特效。
    - 改善终端切页后的渲染稳定性，加入手动刷新；Ctrl+C 在有选区时复制、无选区时中断。
    - 优化无监管审批时序，审批不再被恢复冷却或延迟 Enter 阻塞。
