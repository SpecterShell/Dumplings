  Key: ReleaseNotes
  Value: |-
    V0.4.13
    新增窗口级网络断线/HTTP 请求重试配置 可以分别设置 Codex/Claude Code 请求上游模型失败后的重试次数 提高网络不稳定时任务继续执行的成功率
    新增窗口级自动压缩上下文配置 可以为不同窗口设置上下文压缩阈值 建议配置 500K 左右 减少长会话触发 Any 524 错误或者 400 错误的情况
    新增新窗口清洗续写功能 可以从旧的会话一键启动全新的原生窗口 并指定新创建的会话读取旧会话内容后接手开发 用于解决长会话异常后需要手动新开窗口和迁移上下文的繁琐操作
    优化历史会话恢复和窗口绑定 Manager 会保留最新的窗口名称 启动失败时会自动重试 多次失败后可以选择历史会话恢复或者按原配置启动新会话
    独立配置新增 Provider 模型列表获取和模型选择 CCSwitch Provider 新增搜索功能 网络重试、自动压缩和模型配置都会跟随窗口保存
    优化窗口最大化和还原后的菜单状态 最大化时自动收起为图标菜单 还原后恢复完整菜单 鼠标悬停菜单不会再改变终端工作区布局
