  Key: ReleaseNotes
  Value: |-
    本版集中补齐单窗口配置和长任务续跑能力，并修复 Codex 自定义重试参数导致 Provider 加载失败的问题。
    新增与改进：
    - 新窗口清洗续写：从现有 Codex / Claude Code 窗口创建干净原生会话，按需读取旧历史并继承窗口级配置。
    - 单窗口网络重试：Codex 可分别设置流式断线重连和 HTTP 请求重试次数；Claude Code 支持请求重试与 Retry Watchdog。
    - 单窗口自动压缩：Codex / Claude Code 可设置上下文自动压缩阈值，留空时继承全局配置。
    - 无监管异常退避：可配置每轮异常恢复次数和退避分钟数，到期后自动继续尝试。
    - Codex Provider 兼容：修复重试参数把 Provider 名解析成新空 Provider、导致启动报错的问题。
    本次提供 Windows 10 / 11 x64 安装包。macOS 请在对应平台从源码构建。
