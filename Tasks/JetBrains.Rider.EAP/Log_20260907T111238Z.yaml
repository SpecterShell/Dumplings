    The Rider 2026.3 Early Access Program is here!
    The first early preview build comes with:
    - Rainbow brackets in the code editor.
    - Easier to set up data breakpoints for debugging Unreal Engine or custom C++ game engine code.
    - Game Development category on the Plugins settings page.
    - Test coverage for unit tests written with TUnit.
    - Filters in code completion.
