  Key: ReleaseNotes
  Value: |-
    Fix for compromised eMudhra certificates
    This build fixes a vulnerability caused by the compromise of eight eMudhra intermediate certificates. An attacker who can intercept your network traffic can use these certificates to impersonate websites and services.
    Install this update as soon as possible so that your IDE stops trusting connections that rely on the compromised certificates.
    Learn more.
    Debugging for .NET single-file applications (Windows only)
    Publishing a .NET application as a single executable simplifies deployment, but investigating issues in the published binary has previously been difficult.
    Rider now supports debugging single-file .NET applications, including code bundled from NuGet packages and framework libraries. You can launch or attach to a published single-file executable, set breakpoints, step through code, and inspect state as you would with a standard .NET build. This lets you diagnose issues that occur only after publishing, without trying to reproduce them in a different build configuration.
    For the complete list of updates included in this build, please see our release notes.
