    Rider 2026.3 EAP 6: Release Notes
    Let AI agents run .NET tests through Rider
    Agents need to run tests to check their own work. Without IDE support, an agent runs dotnet test, parses the console output, and handles each test framework's quirks on its own. The Rider MCP server now supports this workflow.
    An agent starts a test run with test_run_start and then retrieves its status and results. Rider builds the required projects, runs the tests through its own test infrastructure, and returns structured results to the agent, including test failures and build problems. Rider returns results in the same format regardless of the test framework or runner, including VSTest and Microsoft.Testing.Platform.
    Nothing happens out of sight. Agent-run tests show up in Rider as regular test sessions: you can follow a run, inspect results and failures, and navigate directly to the relevant code.
    Structured results can also require fewer tokens for the agent to process than raw console output, potentially reducing token usage and execution cost. How much depends on the model, project, context, and workflow.
    Native WSL support – now in Beta
    Rider now supports the Native WSL mode recently introduced in the IntelliJ Platform. You can open a solution stored inside WSL and work with it from Rider running on Windows: file access, indexing, build, code analysis, and debugging all use the Linux file system and toolchain. Rider uses IJent to interact with the WSL environment, while the IDE itself and the ReSharper language server stay on Windows.
    Rider already detects .NET SDKs installed inside WSL to build your solution and supports debugging; support for unit tests and NuGet is coming next.
    This support is in Beta, so expect some limitations and quirks.
    Lua support in Rider
    Lua is everywhere in game development: gameplay logic, engine customization, and hot updates. Now you can keep your engine code in C++ or C# and your Lua scripts in the same IDE, without relying on third-party Lua plugins.
    We developed a new Lua plugin, which we maintain ourselves.. It's available in Beta on JetBrains Marketplace and supports Lua 5.1–5.4, LuaJIT, and Luau. You don't need to change how you annotate your code. Rider infers types from your existing EmmyLua, LuaLS, and LDoc comments and from Luau type annotations, so your project works as it is.
    Here's what you get:
    - Syntax and error highlighting, plus more than 35 inspections with quick-fixes.
    - Completion, Quick Documentation, parameter info, and inlay hints.
    - Go to Declaration, Find Usages, call hierarchy, and require path resolution.
    - Refactorings like Rename, Extract Function, Inline, Change Signature, and Move to Module.
    - A formatter with Lua code style settings.
    To install the plugin, go to Settings | Plugins | Marketplace and search for "Lua". You can pick your dialect in Settings | Languages & Frameworks | Lua.
    The plugin is in Beta, so expect some rough edges.
    C# Interactive has been removed from Rider
    C# Interactive is no longer part of Rider, starting with 2026.3 EAP 7.
    Very few Rider users were actively using the feature, and it had accumulated several correctness and usability issues over time. Rather than maintaining a legacy workflow that no longer met our quality bar, we removed it as part of the ongoing simplification of the product.
    If C# Interactive was important to your workflow, please let us know in our issue tracker.

    For the complete list of updates included in this build, please see our release notes.
