  Value: |-
    Rider 2026.3 EAP 3: Release Notes
    New Welcome screen
    With Rider’s new Welcome screen, you can get started right away without opening a solution. The Welcome screen is now part of the main IDE window rather than a separate one, so you can quickly edit a file, use the terminal, work with databases, or attach the debugger or profiler to a running process.
    If you need to do more complex work, you can open or create a solution to use all of Rider’s intelligent features. You’ll still find your recent solutions and remote development connections in the Projects and Files tool window on the Welcome screen, so you can easily switch between quick tasks and full IDE work in one place.

    For the complete list of updates included in this build, please see our release notes.
