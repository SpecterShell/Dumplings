    Rider 2026.3 EAP 4: Release Notes
    Async debugging from .NET 11
    Rider’s async debugging tools now support Runtime Async, a new feature in .NET 11. You can set breakpoints and step through runtime-async methods, and Rider reconstructs async call stacks across await points, even in apps that use both traditional and runtime-async methods.
    You can still see parameters and local variables at suspension points. They show up in the Threads & Variables tab, so you can check them just like you would in a regular stack frame.
    If a simple stack view isn’t enough, try the Tasks tab. It now recognizes runtime-async methods and lets you explore complex chains of async operations to see how tasks connect.
    Azure DevOps plugin
    The Azure DevOps plugin now includes several updates that make it easier to manage your pull requests directly in Rider.
    - You can now sign in to Azure DevOps using your Azure account. If you use a self-hosted server, token-based authentication is still supported.
    - You can now see pull request events and discussions together on a single timeline.
    - You can manage comments in the timeline, diff view, and code editor. This lets you reply to discussions, interact with existing comments, and add new ones without leaving Rider.
    With these updates, the plugin now includes all of the features we had planned. Check this request for more details.
    JetBrains Air in IDEs
    JetBrains Air is now available in Rider 2026.3 EAP 4, bringing agentic development closer to the IDE. Benefit from your choice of coding agents, support for parallel workflows, and IDE-native review and verification.
    Please note that the bundled Air plugin takes over a couple of keyboard shortcuts:
    - ⌘2 on macOS / Alt+2 on Windows and Linux will open the Agent Session tool window instead of Bookmarks.
    - Ctrl+Ctrl on any platform will open a quick input window instead of Run Anything.
    Learn more.

    For the complete list of updates included in this build, please see our release notes.
