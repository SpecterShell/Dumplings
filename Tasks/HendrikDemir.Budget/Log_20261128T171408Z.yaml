- Locale: en-GB
  Key: ReleaseNotes
  Value: |-
    - Import a CSV export from any bank, not only ING. Budget recognises the date, amount, name and description columns by itself. When it can't tell, it asks once which column is which and remembers it for that bank's files. Choose "Wrong columns?" while reviewing to pick them again.
    - Bank files with amounts like +12.50 or 1,234.56, and older exports from Windows, are read correctly.
    - "Ready for next month?" updates right away when you change your expected income in the Outlook, instead of only after a restart.
    - When a new version is available, Budget shows what's new in every version since yours, not only the newest.
    - Going back to an older Budget works again where it safely can: Budget 0.10 and 0.11 can open your data again. If your data really is from a newer Budget, you see a clear page with both versions and a download button instead of an error.
