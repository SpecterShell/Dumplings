- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Bugfixes in 3.27.1.1
    - Fixed an issue where Tabular Editor 3 closed unexpectedly when you selected an object with an expression, on machines whose security configuration prevented the code editor component from starting. This issue was a regression since 3.27.0. Administrators can turn the signature check of the code editor libraries back on with the RequireNativeLibrarySignatureVerification policy. See Policies.
    - Fixed an issue where the details of an unexpected error, in the error report dialog and in errorreport.txt, listed the same error several times and left out the underlying error. Each error in the chain is now listed once, down to the underlying cause.
