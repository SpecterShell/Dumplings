    New in v28.0.0
    For an overview, see the release blog.
    Per-object files in TMDL folders
    Tabular Editor 3 Enterprise Edition can now save a TMDL folder with one file per object. Each column, measure, partition and hierarchy gets a file of its own in a folder beside its table's file. Functions, shared expressions, data sources and relationships also get one file each. Calculation items stay in their table's file. A change to one measure then shows in source control as a change to one file, and two developers who edit different measures of the same table no longer edit the same file.
    To choose the layout, check Save objects to separate files under Tools > Preferences > File Formats > Save-to-folder > TMDL Serialization, or under Model > Serialization options... for the model you have open. The choice is stored with the folder, and File > Save keeps the layout a folder already has. Folders saved by earlier versions or by Power BI Desktop keep the standard layout until you choose otherwise.
    A folder saved this way is still standard TMDL. Power BI Desktop, Tabular Editor 2.26 or later, Tabular Editor 3.19 or later and Tabular Editor 3 Business Edition open it, and save it back in the standard layout. Don't open such a folder in an older version of Tabular Editor, because it can lose the text of shared expressions. Tabular Editor 3 asks before a save writes the standard layout over a folder saved this way. For details, see the new Per-object TMDL serialization article.
    Basic and Advanced Properties views
    The Properties view can now show two tabs at the bottom, Basic and Advanced. Basic is a form with the fields that Power BI Desktop shows in the Properties pane of its Model view. The fields are grouped in sections such as General, Formatting and Data, with switches for options and the value names Power BI Desktop uses. Advanced is the property grid, with every property, the toolbar and search.
    Basic is a public preview. Turn it on with Basic Properties view under Tools > Preferences > Tabular Editor > Public Previews. Until you do, the Properties view shows the property grid alone. The view opens on the tab you last used, which you can change with Properties view tab on the same page.
    On the Basic tab, you can:
    - Edit the fields Power BI Desktop shows for each object type, such as a measure's Home table and Format, a relationship's From and To, a KPI's Status, Target and Trend and the model's Compatibility level
    - Click an expression, or a role's row-level security filter, to open it in the Expression Editor
    - Open the Perspective Editor, the Metadata Translation Editor or the Calendar Editor from the object they belong to
    - Edit several selected objects at once. Fields that differ show (Multiple values), and one Undo reverts the change on all of them
    - See how many other properties of the object have a value, and list those on the Advanced tab with Show in Advanced
    For details, see Properties view.
    Font preferences
    A new Fonts section under Tools > Preferences > Tabular Editor > User Interface sets the font of the application. User interface font and User interface font size (8 to 14 pt) apply to menus, tool windows, dialogs, grids, message boxes, code editor tooltips and the AI Assistant chat. Code editor font size (8 to 14 pt, default 10 pt) applies to the DAX, M, SQL and C# editors and to code boxes in dialogs. Changes take effect when Tabular Editor 3 restarts.
    The font list shows only fonts installed on the machine. Language default uses Segoe UI, or Microsoft YaHei UI for Chinese and Yu Gothic UI for Japanese. Ctrl+mouse wheel still zooms one editor, the AI Assistant or the Get Started page for the current session. The new Edit > Reset Zoom command (Ctrl+0) returns an editor to the preference size, and the AI Assistant and the Get Started page to 100%. For details, see Controlling preferences.
    Improvements in v28.0.0
    - Added four built-in Best Practice Analyzer rules in a new Security category. They flag roles whose row-level or object-level security never takes effect, Power BI roles with a permission other than Read, roles that let their members see all data in a model where other roles are secured and members whose queries fail because they belong to both a row-level security role and an object-level security role. See Built-in BPA Rules.
    - The DAX editor now recognizes the functions GROUPCROSSAPPLY, GROUPCROSSAPPLYTABLE, FILTERCLUSTER, ALLSELECTEDAPPLY, ALLSELECTEDREMOVE, ALWAYSAPPLY, NONFILTER, SHADOWCLUSTER and DEPENDON. Previously, they were underlined as unknown functions. Their arguments and placement are now validated the way the engine validates them, and they have calltips and DAX formatting. Auto-complete suggests them only where they're valid, cased according to your Preferred function casing preference.
    - The DAX editor now recognizes the full-text search functions TEXTCONTAINS and TEXTSIMILARITY, with calltips and auto-complete. Previously, both were underlined as unknown functions. Auto-complete suggests only columns with full-text indexing enabled, and an error is shown when a column or argument can't be used for full-text search.
    - The DAX Debugger can now debug cells of measures that a DAX query defines with DEFINE MEASURE. Previously, a message stated that query-scoped measures can't be debugged.
    - The DAX Debugger can now step into user-defined functions, both model functions and functions that a DAX query defines with DEFINE FUNCTION. A function call shows its arguments and then the function's body in the Call Tree, and Locals shows the function's parameters with the argument passed to each. Code that the query defines is now shown and highlighted in the DAX query itself while you debug. The query is read-only until you stop debugging, and a new Stop debugging button on the Debug toolbar and menu ends the session. See DAX Debugger.
    - Tables and columns that are selected in the TOM Explorer now stand out in a diagram. The table header takes the accent color of the current theme, and a selected column row takes the selection color of the TOM Explorer. The rest of the diagram now also follows the current theme and palette. Previously, it used a fixed light or dark color scheme. When you select several tables or columns, the diagram highlights each of their tables, and when you select a single object that's out of view, the diagram pans to it at the current zoom level.
    - Added a Duplicate command to the right-click menu of document tabs. It opens a new, unsaved copy of a DAX query, DAX script, C# script, diagram or Pivot Grid, which lets you build on an existing document without changing the original. Thank you to JuanSombrero23 for the suggestion on our GitHub ideas forum.
    - Redesigned the Save-to-folder preferences around the format being saved. Tools > Preferences > File Formats > Save-to-folder now sets the default format for File > Save to Folder and has a settings page for each folder format. The Serialization mode dropdown is gone. Settings shared with Model.bim files are now on File Formats > General, and Model > Serialization options... shows which format the model is saved in. If you used the default Database.json mode, File > Save to Folder now writes TMDL, your Include sensitive setting now also applies to folder saves and Ignore incremental refresh partitions is turned on, which means Model.bim saves also leave out those partitions. Other preferences carry over. Ignore incremental refresh partitions is also on by default for new installations. See Save to folder.
    - Saving a model to a TMDL folder now offers to reuse the serialization settings stored with the model, the same as saving to a Database.json folder. Previously, a TMDL save always used the settings from Tools > Preferences, even when the model carried its own.
    - Descriptions in a TMDL folder now keep their indentation and their leading and trailing spaces when the model is opened. Previously, an indented description such as a bullet list lost its indentation after a save and reopen. Earlier versions of Tabular Editor still remove the whitespace when they open and save the folder, which means team members who share a TMDL folder should update together. This change comes with the update of Microsoft.AnalysisServices (Tabular Object Model/AMO) to 19.118.3.
    - Saving a model to a TMDL or Database.json folder now shows a warning when files get a full path of 260 characters or more, which Power BI Desktop, Git without core.longpaths and Windows PowerShell 5.1 can't open. Such paths are most likely with Save objects to separate files in a deep folder. The warning names the longest path and suggests a shorter folder. File > Save shows it again for the same model only when a path gets longer or more files are affected, while File > Save As and File > Save to Folder always show it. See Save to folder.
    - The property category Basic on the Advanced tab of the Properties view is now called General, which avoids confusion with the new Basic tab.
    - Edit > Undo and Edit > Redo (Ctrl+Z, Ctrl+Y) now work while a drop-down list or a read-only text box has the focus, for example right after you pick a value in the Properties view. Previously, they were unavailable until you clicked elsewhere.
    Bugfixes in v28.0.0
    - Fixed an issue where Tabular Editor showed the error "The given key was not present in the dictionary" after saving a semantic model in which another tool had replaced a table's incremental refresh policy, a measure's KPI, a partition's data coverage definition or a column's Alternate Of on the server. Previously, the changes were saved, but the error appeared during the save or when the affected object was shown, until the model was opened again. Now the save completes without the error, and the object shows the values from the server.
    - Fixed an issue where editing a property in the Database group of the Model object, such as Name, Compatibility Level or Description, wasn't shown as an unsaved change. Previously, the Model node in the TOM Explorer stayed unmarked, Show changes hid the edit and Revert on the Model node left it in place. Now the edit is marked, reverted and listed like any other.
    - Fixed an issue where Edit > Undo or Edit > Redo of a change to the database ID raised an error. Now Undo restores the previous ID, and Redo restores the changed one.
    - Fixed an issue where Edit > Undo left annotations and empty perspective entries behind, which showed up as unexpected changes in source control after saving. Previously, undoing a move of a measure or calculated column to another table, by dragging it in the TOM Explorer or by changing Home table in the Properties view, added TabularEditor_InPerspective and TabularEditor_Translated... annotations to the object and kept an empty entry for the destination table in each of the object's perspectives. Undoing the inclusion of an object in a perspective that its table wasn't in, and Edit > Redo after undoing the removal of a table from a perspective, also kept an empty entry for the table. Now Undo and Redo leave neither behind.
    - Fixed an issue where undoing a change to a measure's Format String didn't restore the measure's Format annotation, which models built in Visual Studio (SSDT) store and which a format string change removes. Previously, Edit > Undo restored the format string, but the annotation stayed removed and the model was no longer marked as changed, so the next save dropped it. Now one undo restores both, and Edit > Redo removes the annotation again.
    - Fixed an issue where a change to a Database property was lost when the model was connected to Analysis Services or a Power BI / Fabric XMLA endpoint and the property was set back to the value it had when the model was opened. Previously, the save completed without an error, but the server kept the old value. A change to Unicode Character Behavior on its own was never saved to the server. Now the server receives every Database property value you save.
    - Fixed an issue where running Power BI Desktop instances weren't listed on recent Windows 11 updates, such as the October 2026 preview update (KB5127936). Previously, the Local instance dropdown in File > Open > Model from DB... stayed empty. Now the instances are listed again, with the name of their Power BI Desktop file. When no local instance is running, the dropdown shows No local instances found, and it lists a newly started instance without reopening the dialog.
    - Fixed an issue where a C# script that saved a model in the Save to Folder (Database.json) format over an existing folder could delete most of the model's files. Previously, when the folder path was written with forward slashes or contained a doubled separator, the save reported success but left only database.json. Now the save keeps every file of the model and removes only the files of objects that were deleted or renamed.
    - Fixed an issue where a DAX user-defined function that uses an ANYREF or COLUMNREF parameter inside ORDERBY, PARTITIONBY or MATCHBY of a window function, such as ROWNUMBER, RANK, INDEX, OFFSET or WINDOW, was reported as an error, although Power BI runs it. Previously, the function and every object calling it were flagged with Column [...] not found in the Relation argument. Now the function is accepted, and an error is reported only where a call passes a column that Power BI would also reject.
    - Fixed an issue where a DAX user-defined function that passes a COLUMNREF or ANYREF parameter to DISTINCT was reported as an error at every call with a column, although Power BI runs it. Previously, each measure calling the function was flagged with A single value for column ... cannot be determined. Now the call is accepted. A measure passed to DISTINCT through an ANYREF parameter is still reported.
    - Fixed an issue where passing a locale name to FORMAT was reported as valid in a model whose target Analysis Services version doesn't support it. Previously, FORMAT ( TODAY (), "dddd", "da-DK" ) in a model targeting a version earlier than SQL Server Analysis Services 2022 produced no message, and the problem only surfaced on deployment. The third argument is now flagged in the DAX editor and the Messages view.
    - Fixed an issue where changing the Compatibility Level of a model left messages behind about DAX that the new level supports. Previously, the Messages view and the warning icon in the TOM Explorer kept reporting the expression until the model was closed and opened again, and an open DAX script or DAX query kept the messages for the old level, for example that user-defined functions aren't supported, even after you edited it. The DAX editor, open DAX documents, the Messages view and the TOM Explorer now all use the current compatibility level as soon as it changes.
    - Fixed an issue where setting a model's Compatibility Level to a value that one of its objects can't work at still left an entry in the undo history, although the value was refused. Previously, pressing Ctrl+Z stepped back over a change that never happened. Now the message names the object that needs the higher level, and the undo history is untouched.
    - Fixed an issue where a calculated column added to a Direct Lake on OneLake table couldn't be saved to the Power BI service. Previously, the column was created with Expression Context set to Standard, which the service rejects. Now, at compatibility level 1705 or higher, the column is created with Expression Context set to UserContext, also when a C# script or a DAX script adds it, and a calculated column on such a table that's set to Standard is reported as an error in the Messages view. See User-context calculated columns.
    - Fixed an issue where editing a model while a large model was still being analyzed could fail with "EndUpdate() called before BeginUpdate()" or leave the change out of the undo history. Previously, this could happen right after opening a model or undoing a deletion. Now the edit is recorded normally.
    - Fixed an issue where a minus or plus sign in front of a value in a DAX expression, such as -[Discount] + [Fee] or -2^2, was read differently from how Power BI and Analysis Services evaluate it. Previously, this could produce a wrong data type or error message for the expression. Now the sign is applied the way the engine applies it: (-[Discount]) + [Fee] and -(2^2). The data type shown for such a measure, which Best Practice Analyzer rules can also check, may change to the one the engine returns.
    - Fixed an issue where formatting a DAX query removed the table name from a column passed to a COLUMNREF or ANYREF parameter of a function that the query defines, when the table wasn't in the model. Previously, F ( T[Grp] ) became F ( [Grp] ), and the query then failed. Now the column keeps its table name.
    - Fixed an issue where a measure or function that a DAX query redefines with DEFINE MEASURE or DEFINE FUNCTION was also applied inside the model measures and functions the query uses. Previously, this could show wrong data types or errors for such queries, and the DAX Debugger showed wrong values. Now only the query's own code uses the redefinition, the same as in Analysis Services and Power BI.
    - Fixed an issue where a C# script that failed could close Tabular Editor 3 without warning. Previously, some script failures produced no error message, and unsaved changes were lost. Now a failing script always reports what went wrong, and everything the script changed can still be undone.
    - Fixed the description shown for APPROXIMATEDISTINCTCOUNT in DAX auto-complete and calltips. Previously, it stated that the function requires DirectQuery mode. It now also covers Import and Direct Lake models.
    - Fixed several issues where Tabular Editor 3 could close unexpectedly. This could happen while typing in a DAX editor with code actions, when changing a Find/Replace option after a code editor was closed, when scrolling over the mode selector in DAX Dependencies, when cancelling a DAX query before it reached the server, when a diagram was open with no model loaded or when double-clicking a message about a deleted object.
    - Fixed an issue in the DAX Debugger where a watch or local that returns several text values in one column, such as VALUES('Product'[Color]), showed a | in a value as ~!`.
    - Fixed an issue where DAX auto-complete showed no items, or a list whose selected item couldn't be inserted, when you typed in front of or inside existing text. Previously, typing [ or ' in front of an existing reference showed no usable list, and inserting an item could delete the text after the cursor. Now the list is filtered by what you've typed, a reference you're editing is replaced as a whole and other text after the cursor is left unchanged.
    - Fixed an issue where rows in the Data Refresh view could show misleading durations or statuses. Previously, the rows of a short refresh all showed roughly the same duration, and a table or partition that the server reported an error for could still show as succeeded. Now durations reflect the time spent on the server, failing rows stay marked as failed and a refresh that fails before it reaches the server shows the reason.
    - Fixed an issue where the Data Refresh view didn't show table and partition progress for refresh operations that complete quickly, such as a Calculate refresh of a single small table. Previously, only the top-level job was shown.
    - Fixed an issue where starting a data refresh while the Expression Editor held changes that hadn't been applied gave no warning. Previously, the refresh ran against the previously saved expression. Now the editor's changes are applied before the refresh starts, and the Save changes before processing? prompt appears. Closing or opening a model while the Calendar Editor holds unapplied changes now also asks whether to save them.
    - Fixed an issue where an unexpected error could appear after the embedded browser behind the Get Started page stopped, and where the page stayed blank when the browser couldn't start. Now the page explains what happened, with a try again link and a link to the online version of the page.
    - Fixed an issue where the AI Assistant showed an error report and an empty panel when its embedded browser couldn't start, and stayed empty if the browser stopped later. Now the panel explains what happened, with a try again link that starts the chat again with the current conversation, without a restart of Tabular Editor 3.
    - Fixed an issue where an unexpected error could appear when Tabular Editor 3 closed, or when the layout changed, while the AI Assistant was starting.
    - Fixed an issue where a table in an AI Assistant reply was cut off at the right edge of the message when it didn't fit the panel, for example with a large User interface font size or a narrow panel. Previously, the last columns were hidden mid-word, and the whole conversation scrolled sideways. Now a table that's too wide has a horizontal scrollbar of its own inside the message, and its edge fades on the side where more columns are hidden.
    - Fixed an issue where the Item column of the Metadata Translation Editor was too narrow with a User interface font size above the default or with display scaling. Previously, the names under Model were cut to "P..." and "T...", and longer table names were cut after expanding Tables. Now the column opens wide enough for the names under Model and widens when you expand a node whose names don't fit. A width you set by dragging the column edge is kept.
    - Fixed an issue where the window title started with "definition" when a Power BI Project semantic model was opened from its definition folder or its definition\database.tmdl file. Now the title starts with the name of the semantic model folder without its .SemanticModel suffix, and the location shows the folder that contains it.
    - Fixed an issue where Tabular Editor 3 could close unexpectedly while the Properties view showed a column with Alternate Of. Previously, this happened after undoing the deletion of the column or its table, or after moving a calculated column with Alternate Of to another table.
    - Fixed an issue where the proxy password entered under Tools > Preferences > Tabular Editor > Proxy Settings wasn't saved. Previously, a custom proxy that requires a user name and password could fail to authenticate. If your proxy requires a password, enter it again on that page.
    - Fixed an issue where a password or access token entered together with a server name, for example powerbi://api.powerbi.com/v1.0/myorg/<workspace>;Password=<token> in Model > Deploy... or File > Open > Model from DB..., was stored in plain text in the list of recent servers and shown again in the Server box. Now the password is removed before the server is added to the list, and passwords stored by earlier versions are removed the first time Tabular Editor 3 starts.
    - Fixed an issue where Tabular Editor 3 took over all of Tabular Editor 2's preferences on its first start on a computer that also has Tabular Editor 2. Previously, Tabular Editor 3 defaults such as Ignore incremental refresh partitions and the TMDL Save to Folder format under Tools > Preferences > File Formats were replaced by Tabular Editor 2's values without notice. Now Tabular Editor 3 starts with its own defaults. If your Tabular Editor 2 serialization settings differ from them, or you have Best Practice Analyzer rules in Tabular Editor 2, a prompt appears once after startup that lists what would be imported, with the choice to keep the Tabular Editor 3 settings or import yours from Tabular Editor 2. Other Tabular Editor 2 preferences are no longer imported. See Migrating from Tabular Editor 2.x.
    - Fixed an issue where saving a model or refreshing a Pivot Grid could occasionally show an unexpected error report.
    - Fixed an issue where Model > Update Table Schema listed a column as removed when another column in the same table was bound to the same source column. Previously, applying the comparison deleted that column. Now every column bound to a source column that still exists is kept.
    - Fixed an issue where Model > Update Table Schema reported every column of a table as both removed and added when the columns were bound to source column names written with square brackets, such as [amount]. Tabular Editor 2 writes this form for tables over a native query. Previously, accepting the comparison dropped and recreated every column, which discarded their properties and broke DAX that referenced them. Such a column is now matched with the source column of the same name.
    - Fixed an issue where Model > Update Table Schema could report a table as up to date when Tabular Editor couldn't read the table's source. Such a table is now reported as one whose schema couldn't be detected.
    - Fixed an issue where tool windows docked as tabs in the document area, such as Expression Editor, Data Refresh, Messages and VertiPaq Analyzer, lost their arrangement when Tabular Editor was restarted or a layout was applied from Window > Layouts. Now the tabs return in the order you left them, and pinned tabs stay pinned.
