  Value: |-
    1.44.2 (2026-10-28)
    Features
    - Stream readable Batch results and match each result to its input by custom_id. (#652) (06f3af0)
    - Submit a Batch from a JSONL file, find uploaded inputs, and watch progress with batches list --watch. (#653) (b73b322)
    - Use openai batches browse to search batches, inspect results and errors, and create a batch interactively. (#654) (e349674)
    - Edit speech, play the recording, and save it from the same screen in openai audio speak. (#657) (672ae01)
    Chores
    - deps: update openai-go to v3.90.0 (#656) (1d4ea76)
