    1.38.0 (2026-10-08)
    Features
    - api: add usage source and user costs grouping (#376) (17b9b60)
    - cli: improve command groups, add task shortcuts, and fix shell completion (reload completion) (dce0616)
    - images: add native previews for Warp (#377) (e433bd2)
    - images: add opt-in VS Code PNG previews with OPENAI_VSCODE_IMAGES=1 (setup) (3540c75)
    - images: show common picker settings together and keep the multiline command preview visible (e6d3f50)
    Bug Fixes
    - api: correct custom voice creation parameters (#385) (d32b3ae)
    - cli: allow global request flags throughout commands and fix environment precedence and completion setup (da762ff)
    - images: align picker borders and refine empty prompts (#370) (4cd297a)
    - images: prevent encoded image output after Ctrl-C in Kitty on macOS (60603c5)
    Chores
    - deps: bump the codeql group across 1 directory with 2 updates (#374) (8f70d2a)
    - deps: bump the go-minor-and-patch group across 1 directory with 2 updates (#373) (4f808f2)
    - deps: update openai-go to v3.71.2 (#375) (2fff26b)
    - deps: update openai-go to v3.72.0 (#378) (82cdd6e)
    - deps: update openai-go to v3.73.0 (#380) (02307cb)
