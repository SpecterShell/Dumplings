  Key: ReleaseNotes
  Value: |-
    Features
    - 新增 Agent Skill 系统
    - 新增 Agent 检查点压缩方式，并支持画布多节点按需查询
    - 新增 Agent 媒体自动生成开关
    - 新增 Agent 对话消息键复制完整内容
    - 新增节点参考内容，提示词放大编辑，节点导出首尾帧
    What's Changed
    - 画布与首页 Agent 输入框支持内联素材缩略图和 @ 节点引用
    - 优化 Agent 输入框自适应高度、临时引用状态
    - 优化视频节点预览方式以及放大预览，控件，优化媒体焦点切换与交互
    - 修复登录后生图 Base64 刷新后丢失的问题
    - 修复画布图片节点生成遗漏参考图及顺序错误的问题
    - 修复画布视频节点复制、粘贴、删除等快捷键失效的问题
    - 修复 Agent 将媒体相关普通询问误判为工具调用失败的问题
    - 修复本地图片加入素材或删除后撤销时因 Blob 提前失效而丢图的问题
    - 画布左侧元素列表按组展示树形层级，组内节点支持展开和收起
    - 本地渠道支持新增选择模型，拉取全部渠道失败不影响其他正常渠道
    Full Changelog: https://github.com/tigerowo/infinite-canvas/compare/v0.5.5...v0.6.0
