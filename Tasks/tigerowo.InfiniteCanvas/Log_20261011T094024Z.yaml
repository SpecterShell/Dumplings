  Key: ReleaseNotes
  Value: |-
    Features
    - 渠道支持自定传参转译，随意接入任何 API 站
    - 画布及视频工作台支持停止生成、停止失败重试和重新生成
    - 新增 TokenDance 模型渠道，支持 OAuth 一键登录获取 Key
    What's Changed
    - 渠道拉取模型支持手动设置模型分类为图片，视频，音频，文本
    - Codex Agent 禁用 Codex 内置图片生成
    - 删除图片，音频，视频都走同一套任务清理
    - 修复后台渠道配置尚未加载完成时可能以空数据覆盖原配置的问题
    - 修复停止，提交，轮询及工作流同步并发时，旧响应状态被旧结果覆盖的问题
