  Key: ReleaseNotes
  Value: |-
    Features
    - 新增 open AI canvas RunningHub 与 ComfyUI 工作流渠道
    - 工作流支持参数拉取、逐条启停、字段映射、拓扑与 API JSON
    - 新增 ComfyUI Bridge，支持设备注册、工作流发现、任务恢复和本机预览播放
    - Codex Agent 升级最新
    - 我的素材，素材库增加分类，素材页面与画布侧栏支持按分类、标签筛选
    What's Changed
    - 修复 Agent 创建视频节点未按所选尺寸比例初始化问题
    - 修复画布 @ 的引用未正确显示
    - 修复 Grok2API 视频轮询嵌套 url 未解析的问题
    - 修复方舟 Agent Plan 无法拉取模型列表
    - 画布文本节点内容可用滚轮上下浏览
    - 修复切换账号退出，还残留配置没有清理干净问题
    - 修复后台限制可用模型未正确显示的问题
    - 优化 AI 日志只记录请求和结束
