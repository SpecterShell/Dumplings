  Key: ReleaseNotes
  Value: |-
    Features
    - Agent 支持画布内 Codex 对话及外部 MCP、插件操控
    - 新增 AutoDL ComfyUI 工作流
    - 后台支持自动同步新增媒体与生成结果至云存储，后台开关控制
    - 画布视频节点新增播放进度条，支持点击和拖动定位
    - 画布视频节点支持分离音频，生成音频节点并按需截取
    - Agent 支持手动开启文本模型推理参数
    What's Changed
    - Agent 激活指定 Skill 后优先遵循其创作规则，不再叠加内置流程与自动能力路由
    - Agent 在原生 Tool Calling 不可用时依次逐级回退，并按会话记忆可用模式
    - Agent 修复可恢复的 JSON，拒绝执行未完成、根结构不完整或超量的工具批次
    - 完善 Agent 工具名称、参数类型与字段校验，避免异常空消息阻断纠错重试
    - 将模型渠道规则转为静态内置协议模块
    - 修复首页与画布 Agent 插入素材时额外换行的问题
    Full Changelog: https://github.com/tigerowo/infinite-canvas/compare/v0.6.0...v0.7.0
