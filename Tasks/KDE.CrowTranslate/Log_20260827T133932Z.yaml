Version: 4.1.0
Installer:
- Architecture: x64
  InstallerUrl: https://download.kde.org/stable/crow-translate/4.1.0/crow-translate-4.1.0-windows-cl-msvc2022-x86_64.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Changelog:
    - Translate through any OpenAI-compatible endpoint with the new LocalAI backend.
    - Recognize text in images with a vision model, as an alternative OCR engine to Tesseract.
    - Open, drop or paste an image to recognize text from it.
    - Show what is currently running, and what failed, in a status strip.
    - Use an API key with LibreTranslate, either through Mozhi or directly.
    - Report a bug from the tray menu.
    - Fix the capture area on Windows with multiple monitors at different scaling.
    - Fix the missing application icon on Windows and macOS.
    - Fix starting up again after an unclean shutdown.
    - Fix the translate selection shortcut on Wayland.
    - Name icon-only buttons for screen readers, and make error messages translatable.
- Key: ReleaseNotesUrl
  Value: https://apps.kde.org/crowtranslate/#4.1.0
RealVersion: 4.1.0
