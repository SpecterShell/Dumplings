  Key: ReleaseNotes
  Value: |-
    Fixed
    - A dot layout crash when dealing with empty node lists has been fixed. #2762
    - A dot layout crash when dealing with slopes on non-existent edges has been fixed. #2764
    - rank-0 nodes with a labeled self-loop no longer cause a crash. #2870
    - A crash during spline routing has been fixed. #2746
    - The fdp layout now understands a cluster to be indicated by the common rules, including the “cluster” prefix being case insensitive and the cluster=true attribute as an alternative. #2717, #2187
    - Using lhead on an edge without arrowheads (e.g. dir=none) no longer causes an assertion failure. #2874
    - When layout fails, dot no longer attempts rendering. Previously this could result in crashes as rendering operated on data structures in inconsistent states. #2761
