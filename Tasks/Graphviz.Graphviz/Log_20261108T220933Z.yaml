  Key: ReleaseNotes
  Value: |-
    Changed
    - MinGW installers are no longer provided in Graphviz releases.
    - pkgconf is no longer included in the Windows installers. If you need pkgconf or are building Graphviz from source, you are expected to install it yourself by e.g. vcpkg install pkgconf.
    - The CMake build system no longer sets PKG_CONFIG_EXECUTABLE.
    Fixed
    - The Autotools build installs into lib64 on 64-bit LoongArch Linux (loongarch64), like the other 64-bit architectures.
    - nop no longer reorders edges. #2855
    - The canonical format (-Tcanon) produces output that is stable across multiple invocations. #2193
    - Cluster representatives in the derived graph are now anonymous nodes, preventing a potential heap overrun by name collision with ordinary nodes. #2768, #2769
    - A crash when setting an excessively large minimum node height has been fixed. #2781
    - gvpr no longer crashes when encountering $F in a BEGIN or END clause. Using $F in these clauses is rejected. #2858
    - Inducing a labeled non-adjacent flat edge to/from a rank 0 node no longer causes dot to crash. #2756
    - If routing produces bounding boxes that all have close-to-zero area, dot exits with an error message instead of crashing. #2773, #2774, #2776, #2778
    - A crash when using cluster subgraphs has been fixed. #2368, #2854
    - The effect of a negative argument to gvmap -r … has been documented in the man page. #2844
    - The GDI+ plugin no longer reads memory out of bounds when doing font lookups. This was a regression in Graphviz 16.0.0. #2867
    - A typo in the libpathplan man page has been corrected.
    - An ortho crash involving long vertex chains has been fixed. #2783
    - In HTML-like labels, white space around IMG tags is now ignored. #2621
    - gvpack exits when parsing of an input graph fails instead of trying to continue packing it. #2841
    - A circo crash has been fixed. #2866
    - Using invalid ports no longer causes crashes in dot routing. #2765
    - A dot layout crash when dealing with empty ranks has been fixed. #2759
    - When using SVG images in image="….svg", Graphviz understands the SVG’s dimensions even if whitespace or single quotes (') are involved in width and height attribute definitions. !5107
    - There is now a limit on how many times control points for bounding boxes are refined, fixing what could previously be an infinite loop. #2780
