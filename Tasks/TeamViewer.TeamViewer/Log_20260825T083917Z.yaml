Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    New Features
    - A new driver for Security Key Redirection has been added. The updated driver introduces several technical enhancements, including a fixed-size pool of reusable device interfaces and improvements to Plug and Play (PnP) power management event handling.
    - A new Default QuickSupport Module setting is now available in TeamViewer Remote under Admin Settings → Connection Settings. This ensures a consistent experience by automatically applying company-defined module customizations to sessions.
    - A dedicated section for user management permissions has been introduced, clearly separating user, user group, and user role permissions while highlighting their administrative significance. Additional information icons provide explanations to help users better understand these permissions.
    - Tia Troubleshooting has been enhanced from contextual guidance to AI-driven troubleshooting. Tia can now perform live diagnostics and execute approved remediation actions during remote support sessions on managed Windows devices, helping identify root causes and resolve issues more efficiently.
    - Tia now includes three modes: Advise, Diagnose, and Resolve. These modes provide increasing levels of troubleshooting capability, giving users control over how Tia investigates issues and helps resolve them.
    - Introduced Tia Toolbelt to bring together tools and data sources such as Session Insights, device context, screenshots, diagnostic scripts, AI-generated diagnostics, and remediation scripts that can be used to solve issues with Tia in a remote control connection.
    - Detailed audit traces for Tia-driven troubleshooting have been added to Session Insights. Users can now review actions performed by Tia, including executed actions and who started the execution, providing greater transparency into troubleshooting activities.
    - Administrators can now assign Tia Advise, Diagnose, and Resolve access to users and groups through dedicated Tia packages. Device policies can also be configured to control on which devices Tia capabilities are available.

    Improvements
    - The Active Connections feature is now available in TeamViewer Tensor and TeamViewer One. When enabled by a company administrator, users with the Active Connections permission can view all connections initiated by or to users within their company.
    - It is now possible to assign a default QuickSupport module to individual users and legacy groups. This ensures that the predefined module is automatically applied to the selected user or group.
    - The way the client receives updates about changes to devices and device groups has been improved.

    Bugfixes
    - Fixed a bug that could prevent session invitations from working correctly when both the inviter and the invitee were configured for Easy Access.
    - Fixed a bug that could prevent connections when a policy was applied.
    - Fixed a bug that prevented the assignment pop-up from appearing when managing a device through the custom full client module.
    - Fixed a bug that caused the User Management page to appear empty after a company was created.
    - Fixed a security vulnerability in the file transfer and clipboard features that could allow unauthorized file writes (Security Bulletin: TV-2026-1008).
- Locale: de-DE
  Key: ReleaseNotes
  Value: |-
    New Features
    - Ein neuer Treiber für die Umleitung von Sicherheitsschlüsseln wurde hinzugefügt. Der aktualisierte Treiber bietet mehrere technische Verbesserungen, darunter einen Pool von wiederverwendbaren Geräte-Interfaces fester Größe sowie Optimierungen bei der Behandlung von Plug-and-Play-(PnP-)Energiemanagementereignissen.
    - Eine neue Standardeinstellung für das QuickSupport-Modul ist jetzt in TeamViewer Remote unter Admin-Einstellungen → Verbindungseinstellungen verfügbar. Dies sorgt für ein konsistentes Erlebnis, indem unternehmensdefinierte Modulanpassungen automatisch auf Sessions angewendet werden.
    - Ein eigener Abschnitt für Berechtigungen im User-Management wurde eingeführt, der User-, Benutzergruppen- und Berechtigungen für Benutzerrollen klar voneinander trennt und deren administrative Bedeutung hervorhebt. Zusätzliche Informationssymbole bieten Erläuterungen, um User beim besseren Verständnis dieser Berechtigungen zu unterstützen.
    - Die Tia-Fehlerbehebung wurde von kontextbezogenen Empfehlungen zu einer KI-gestützten Fehleranalyse erweitert. Tia kann nun während Remote-Support-Sitzungen auf verwalteten Windows-Geräten Live-Diagnosen durchführen und freigegebene Behebungsmaßnahmen ausführen, um Ursachen schneller zu identifizieren und Probleme effizient zu lösen.
    - Tia umfasst jetzt die drei Modi „Advise“, „Diagnose“ und „Resolve“. Diese Modi bieten zunehmend erweiterte Funktionen zur Fehlerbehebung und geben Nutzern die Kontrolle darüber, wie Tia Probleme untersucht und bei deren Behebung unterstützt.
    - Einführung des „Tia Toolbelt”, um Tools und Datenquellen – wie Session Insights, Gerätekontext, Screenshots, Diagnoseskripte, KI-generierte Diagnosen und Skripte zur Problembehebung – zu bündeln, die zur Lösung von Problemen mit Tia im Rahmen einer Fernzugriffsverbindung genutzt werden können.
    - Detaillierte Audit-Protokolle für Tia-gestützte Fehlerbehebungen wurden zu Session Insights hinzugefügt. User können nun von Tia ausgeführte Aktionen und wer sie gestartet hat nachvollziehen und erhalten so mehr Transparenz über Fehlerbehebungsaktivitäten.
    - Administratoren können den Zugriff auf Tia Advise, Diagnose und Resolve jetzt über dedizierte Tia-Pakete für Benutzer und Gruppen zuweisen. Zusätzlich können Geräterichtlinien konfiguriert werden, um festzulegen, auf welchen Geräten Tia-Funktionen verfügbar sind.

    Improvements
    - Das Feature „Aktive Verbindungen“ ist jetzt in TeamViewer Tensor und TeamViewer One verfügbar. Wird das Feature von einer Administrator:in des Unternehmens aktiviert, können User mit der Berechtigung „Aktive Verbindungen“ alle Verbindungen einsehen, die von oder zu Usern innerhalb ihres Unternehmens initiiert wurden.
    - Es ist nun möglich, einzelnen Usern und Legacy‐Gruppen ein Standard‐QuickSupport‐Modul zuzuweisen. Dadurch wird sichergestellt, dass das vordefinierte Modul automatisch auf den ausgewählten User oder die ausgewählte Gruppe angewendet wird.
    - Die Aktualisierung des Clients über Änderungen an Geräten und Gerätegruppen wurde verbessert.

    Bugfixes
    - Es wurde ein Fehler behoben, der dazu führen konnte, dass Session-Einladungen nicht korrekt funktionierten, wenn sowohl die einladende als auch die eingeladene Person für Einfachen Zugriff konfiguriert waren.
    - Ein Fehler wurde behoben, der Verbindungen verhindern konnte, wenn eine Richtlinie angewendet wurde.
    - Es wurde ein Fehler behoben, der verhinderte, dass das Zuweisungs-Popup beim Verwalten eines Geräts über das benutzerdefinierte vollständige Client-Modul angezeigt wurde.
    - Es wurde ein Fehler behoben, der dazu führte, dass die Seite „User Management“ nach der Erstellung eines Unternehmens leer angezeigt wurde.
    - Eine Sicherheitslücke in den Dateiübertragungs- und Zwischenablagefunktionen, die unautorisierte Dateischreibvorgänge ermöglichen konnte, wurde behoben (Security Bulletin: TV-2026-1008).
