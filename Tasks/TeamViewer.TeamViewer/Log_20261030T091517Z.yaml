- Locale: de-DE
  Key: ReleaseNotes
  Value: |-
    New Features

    Improvements

    Bugfixes
    - Die AI-Upscaling-Funktion für AssistAR wurde deaktiviert (die Registrierung des Sparse-Pakets wurde entfernt).
    - Ein Problem wurde behoben, bei dem Patch Management nach der Aktivierung über ein Unternehmen oder eine Benutzergruppe als „Unvollständige Aktivierung" angezeigt wurde, obwohl es installiert war und funktionierte. Bereits betroffene Geräte zeigen nach dem Update den korrekten Status an.
