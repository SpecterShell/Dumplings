Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    New Features
    - The TeamViewer Full and Host MSI packages now support localization in multiple languages.
    - The TeamViewer Full and Host MSI packages now allow users to choose whether to keep or remove their settings during uninstallation.

    Improvements
    - Fixed a bug where deleted chat conversations could reappear after restarting the application. Chat messages are now marked as read more efficiently, ensuring chat history changes are handled correctly and consistently.
    - The remote session side panel has been improved by allowing the minimized panel to be repositioned vertically, helping prevent it from covering content on the remote device.

    Bugfixes
    - Fixed a bug in the in‑session chat that caused the account picture to flicker while typing a message.
    - Fixed a bug in Voice over IP (VoIP) that could cause TeamViewer to quit unexpectedly.
    - Fixed a bug in the in‑session toolbar where the “Ctrl+Alt+Del” action did not work correctly when connecting to a macOS device.
    - Fixed a DLL sideloading vulnerability that could lead to local privilege escalation (Security Bulletin: TV-2026-XXXX) (Security Bulletin: TV-2026-1012).
    - Fixed a command injection vulnerability leading to local privilege escalation in Advanced Asset Management (Security Bulletin: TV-2026-1012).
    - Fixed an improper access control vulnerability that could lead to local privilege escalation (Security Bulletin: TV-2026-1012).
    - Fixed a memory corruption vulnerability that could lead to application termination or RCE (Security Bulletin: TV-2026-1011).
- Locale: de-DE
  Key: ReleaseNotes
  Value: |-
    New Features
    - Die TeamViewer Full- und Host-MSI-Pakete unterstützen jetzt die Lokalisierung in mehreren Sprachen.
    - Die TeamViewer Full- und Host-MSI-Pakete ermöglichen es Usern jetzt, bei der Deinstallation auszuwählen, ob die eigenen Einstellungen beibehalten oder entfernt werden sollen.

    Improvements
    - Ein Fehler wurde behoben, bei dem gelöschte Chat-Konversationen nach einem Neustart der Anwendung erneut angezeigt werden konnten. Chatnachrichten werden jetzt effizienter als gelesen verarbeitet, sodass Änderungen im Chatverlauf korrekt und konsistent übernommen werden.
    - Das Seitenpanel für Remote-Sitzungen wurde verbessert: Das minimierte Panel kann nun vertikal verschoben werden, sodass Inhalte auf dem Remote-Gerät nicht verdeckt werden.

    Bugfixes
    - Ein Fehler im In-Session-Chat wurde behoben, der dazu führte, dass das Account-Bild beim Verfassen einer Nachricht flackerte.
    - Ein Problem mit Voice over IP (VoIP) wurde behoben, das dazu führen konnte, dass TeamViewer unerwartet beendet wurde.
    - Ein Fehler in der In-Session-Toolbar wurde behoben, bei dem die Aktion zum Senden von „Strg+Alt+Entf“ beim Herstellen einer Verbindung zu einem macOS-Gerät nicht korrekt funktionierte. Die Aktion wurde in „Beenden erzwingen“ umbenannt.
    - Es wurde eine DLL-Sideloading-Schwachstelle behoben, die unter bestimmten Umständen eine lokale Rechteausweitung ermöglichen konnte (Security Bulletin: TV-2026-1012).
    - Behebung einer Command-Injection-Schwachstelle in Advanced Asset Management, die zu einer lokalen Rechteausweitung führen konnte (Security Bulletin: TV-2026-1012).
    - Es wurde eine Schwachstelle aufgrund unzureichender Zugriffskontrollen behoben, die eine lokale Rechteausweitung ermöglichen konnte (Security Bulletin: TV-2026-1012).
    - Behebung einer Speicherbeschädigungsschwachstelle die zum Absturz der Anwendung oder zu Remotecodeausführung führen konnte (Security Bulletin: TV-2026-1011).
