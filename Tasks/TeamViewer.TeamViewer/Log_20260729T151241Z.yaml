Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    New Features
    - Added support for Admin settings, device management, Single-Sign-On (SSO) and Microsoft LAPS integration to the Hybrid Conditional Access.
    - Tensor-licensed customers can now forward their local microphone and camera to the remote device, enabling them to join meetings or use applications that require a camera and microphone directly from a remote session.
    - Auditability for account security has been improved. Password changes will now be logged as separate events.
    - The user creation date and last active information have been added to the User Details panel, giving administrators quick insight when reviewing user profiles.
    - Permission handling for user groups has been improved. Actions such as creating, viewing, updating, and deleting user groups are now controlled by assigned permissions, ensuring clear and consistent access management.
    - Customers can now create Conditional Access rules using Company Profiles, enabling secure access scenarios involving trusted third-party organizations, such as external support providers using TeamViewer. A new External Company option is available in both the Source and Target fields during rule creation, allowing administrators to specify a Company Profile name and apply the rule to users associated with that external organization.

    Improvements
    - TeamViewer now natively supports Windows on ARM devices for both TeamViewer Remote and TeamViewer (Classic). Its functionality matches the existing Intel-based versions, ensuring a consistent experience across device architectures.
    - The width of the in-session Tia side panel has been increased to provide a more comfortable experience when interacting with chat.
    - Session connections using Windows authentication are now available from both the command bar and the context menu on the Service Queue page.
    - The unattended access text in the Classic Host has been updated to align with TeamViewer Remote. The revised wording more clearly indicates that the device is managed by the company, reducing potential confusion around manager-based access and improving consistency between TeamViewer Remote and Classic.
    - User management has been enhanced with sortable columns for User Groups and User Roles, improving navigation and data visibility.

    Bugfixes
    - Fixed a bug that caused connection issues when a connection was initiated via Easy Access.
    - Fixed a bug that prevented access to the 3-dot menu on the Service Queue page.
    - Fixed a bug that caused the start screen to remain in an infinite loading state, preventing users from accessing the sign-in page.
    - Fixed a bug where pressing the Backspace key removed the entire input instead of only the last character when using certain Asian languages.
    - Fixed a bug that could cause the collapsed in-session toolbar to disappear after opening a side panel.
- Locale: de-DE
  Key: ReleaseNotes
  Value: |-
    New Features
    - Mit der Webcalls-Tunnel-Implementierung für Hybrid Conditional Access werden TeamViewer Client-Anfragen, die innerhalb des Netzwerks der Kundschaft initiiert werden, über den Hybrid Conditional Access-Router geleitet. Die erste Iteration umfasst Admin-Einstellungen, Device Management, SSO und LAPS.
    - Kunden mit einer Tensor-Lizenz können nun ihr lokales Mikrofon und ihre Kamera an das Remote-Gerät weiterleiten und so direkt aus einer Remote-Sitzung heraus an Meetings teilnehmen oder Anwendungen nutzen, die Kamera und Mikrofon erfordern.
    - Auditability für die Kontosicherheit wurde verbessert. Passwortänderungen werden jetzt als separate Ereignisse protokolliert.
    - Das Erstellungsdatum des User sowie Informationen zur letzten Aktivität wurden im Bereich „User-Details“ ergänzt, um Administrator:innen beim Überprüfen von User-Profilen einen schnellen Überblick zu ermöglichen.
    - Die Berechtigungsverwaltung für User-Gruppen wurde verbessert. Aktionen wie Erstellen, Anzeigen, Aktualisieren und Löschen von User-Gruppen werden nun durch zugewiesene Berechtigungen gesteuert, wodurch eine klare und konsistente Zugriffsverwaltung sichergestellt wird.
    - Kund:innen können jetzt Conditional Access-Regeln mithilfe von Unternehmensprofilen erstellen und so sichere Zugriffsszenarien mit vertrauenswürdigen Drittorganisationen ermöglichen, etwa externen Supportanbietern, die TeamViewer nutzen. Bei der Erstellung von Regeln steht sowohl im Quell- als auch im Zielfeld eine neue Option „Externe Firma“ zur Verfügung. Damit kann ein Unternehmensprofil-Name angegeben und die Regel auf User angewendet werden, die dieser externen Organisation zugeordnet sind.

    Improvements
    - TeamViewer unterstützt jetzt nativ Windows auf ARM-Geräten, sowohl für TeamViewer Remote als auch für TeamViewer (Classic). Der Funktionsumfang entspricht den bestehenden Intel-basierten Versionen und gewährleistet ein einheitliches Erlebnis über verschiedene Gerätearchitekturen hinweg.
    - Die Breite des Tia-Seitenpanels während der Session wurde erhöht, um die Nutzung des Chats komfortabler zu gestalten.
    - Session-Verbindungen mit Windows-Authentifizierung sind jetzt sowohl über die Befehlsleiste als auch über das Kontextmenü auf der Seite „Service Queue“ verfügbar.
    - Der Text zum unbeaufsichtigten Zugriff im Classic Host wurde aktualisiert, um ihn an TeamViewer Remote anzugleichen. Die überarbeitete Formulierung verdeutlicht, dass das Gerät vom Unternehmen verwaltet wird, reduziert potenzielle Verwirrung hinsichtlich des managerbasierten Zugriffs und sorgt für eine bessere Konsistenz zwischen TeamViewer Remote und Classic.
    - Die Userverwaltung wurde um sortierbare Spalten für User-Gruppen und User-Rollen erweitert, was die Navigation und die Sichtbarkeit der Daten verbessert.

    Bugfixes
    - Es wurde ein Fehler behoben, der zu Verbindungsproblemen führte, wenn eine Verbindung über Einfacher Zugriff initiiert wurde.
    - Ein Fehler wurde behoben, der den Zugriff auf das 3-Punkte-Menü auf der Seite „Service Queue“ verhinderte.
    - Ein Fehler wurde behoben, durch den der Startbildschirm in einem endlosen Ladezustand verblieb und User am Zugriff auf die Anmeldeseite gehindert wurden.
    - Es wurde ein Fehler behoben, bei dem beim Drücken der Rücktaste die gesamte Eingabe statt nur das letzte Zeichen entfernt wurde, wenn bestimmte asiatische Sprachen verwendet wurden.
    - Es wurde ein Fehler behoben, der dazu führen konnte, dass die eingeklappte Symbolleiste während der Session nach dem Öffnen eines Seitenbereichs verschwand.
