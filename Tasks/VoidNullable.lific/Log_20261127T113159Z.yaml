Version: 3.0.0
Installer:
- Architecture: x64
  InstallerType: portable
  InstallerUrl: https://github.com/VoidNullable/lific/releases/download/v3.0.0/lific-windows-x86_64.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Lific 3.0 is a major release, and several changes can break an existing setup: project roles are always enforced, the /mcp/<token> route is gone, published projects move to their normal links and take /public/api with them, and the web UI keeps its session only in an HttpOnly cookie, so sign-in responses no longer return a token. Read Before you upgrade first. Most of the rest is for agents sharing a tracker. An agent can claim an issue for a set time, retry a create without filing it twice, record a decision, and get the project's conventions page at the top of every briefing, which now remembers where it left off. The web UI is redrawn almost everywhere, from the sidebar and Inbox to the Pages tab, account settings and the issue and page views, and bodies are edited in place. Eighteen migrations run on first start.
    Before you upgrade
    - Project roles are always enforced. The authz_enforced setting and its unenforced mode are gone, with the web UI's Project permissions switch and lific instance set --authz-enforced. An instance that already enforced roles upgrades unchanged; that includes every instance created with 2.1 or later. On an instance that still had the setting off, the upgrade gives out roles from evidence: each project's lead becomes lead, anyone who wrote in a project becomes maintainer (a connected tool's work counts for its owner), and existing memberships stay. Someone who only ever read a project loses access to it.
    - Everyone who lost access that way is logged once at startup, and lific doctor lists them in a project_access warning until each has a role again. lific member add --project <PROJECT> --user <name> --role maintainer gives access back.
    - PATCH /api/instance/settings refuses "authz_enforced": false with 400 and ignores true. The settings response no longer has the field, and GET /api/projects/{id}/my-role no longer returns enforced. The rules that only applied with enforcement off are gone too: a project's lead can delete or archive it, maintainers manage modules, labels and folders, workspace pages are for administrators only, and @-mentions only suggest people who can see the project.
    - The /mcp/<token> route is removed and answers 404, since a credential in a URL ends up in proxy logs and shell history. Point clients at /mcp and send Authorization: Bearer <API_KEY>, or use the client's OAuth login; lific connect sets up either and refuses old URLs. The old mcp_path_token was a server secret, not an API key, so it does not work in the header. mcp_path_token and mcp_path_user in [server] still parse, so the server starts, but they do nothing, and startup and lific doctor warn until you remove them. lific doctor also finds old URLs in supported clients' configuration files without printing the secret.
    - A published project is read at its ordinary links and API routes, by visitors with no account, every signed-in account and every API key or MCP connection. Changing anything still needs a role. Plans and their steps, activity and edit history, insights, assignees, waits with their notes, claims with the holder's username, comment authors' usernames and live updates become readable, so review those in each published project, or unpublish it, before upgrading.
    - Every route under /public/api now answers 404; use the ordinary routes with no credential, such as GET /api/issues/resolve/APP-12. Old /public/APP/... links answer 301 to /APP/.... If a proxy or CDN special-cased /public/, apply those rules to requests that carry neither an Authorization: Bearer header nor a lific_token cookie, and do not cache responses to requests that carry the cookie.
    - The web UI's session lives only in the HttpOnly lific_token cookie. Sign-in, sign-up, auto-login, session refresh and password change responses no longer include the token, so a script that signed in with a password and sent the returned token must use an API key instead (Settings, Agents, or lific key create --user <name>). MCP clients and lific login use OAuth and are not affected.
    - Writes authenticated by the cookie must come from the server's own origin, public_url or a cors_origins entry, or they get 403. If people reach the instance over plain HTTP at any address other than localhost, set public_url = "http://..." to that address, or nobody can sign in. Behind a reverse proxy, set public_url to the address people open, or pass the original Host (and X-Forwarded-Proto when the proxy terminates TLS).
    - Project archives are written in format 3. Upgrade the destination to 3.0 before importing an archive exported by 3.0; format 1 and 2 archives still import.
    - The server now returns active issues untouched for 14 days to todo once a day, starting shortly after the first start. Run lific instance set --stale-active-reset-days 0 first if you do not want that.
    - 2.11 refuses a database that 3.0 has migrated. Take a backup first; going back means restoring it.
    Claiming issues
    - An agent can claim an issue for a limited time with update_issue (claim, claim_minutes, worker) or POST /api/issues/{id}/claim and /release. While a claim lasts, other workers are refused with the holder's name, and the issue is left out of their workable lists and the briefing's workable section. Claiming again moves the expiry and keeps the original claim time. An expired claim stops counting; no cleanup job is involved.
    - Two sessions on the same key are separate workers: each stdio process, each lific mcp --remote process, and each HTTP client sending Mcp-Session-Id or X-Lific-Worker gets its own id. A client resumes a claim by sending the worker id the claim returned.
    - Closing, deleting or moving an issue to another project ends its claim, and project archives do not carry live claims. Releasing a claim keeps it on record as activity.
    - Home lists claimed issues with their holder and time left, and the issue view and peek panel show who holds a claim. The web UI judges expiry by the server's clock, which GET /api/clock now reports as now_ms.
    - A claim counts as activity, so an issue someone keeps claiming is never reported as stale or moved back to todo.
    Safe retries
    - A create can be retried without writing it twice. create_issue (single and batch), add_comment, create_page and create_plan take an optional op_key, and the REST create routes for issues, comments, pages and plans read an Idempotency-Key header. A retry with the same key returns the first result, marked as a replay (Idempotent-Replayed: true over REST). The same key with a different request is refused and writes nothing. A failed write records no key, so a corrected retry goes through. Keys last 24 hours.
    - lific mcp --remote adds a key to every create that lacks one and resends it once when the connection drops or times out. The CLI's HTTP backend does the same for issue create, page create and comment add, but only resends to a server that lists idempotency-key in the new capabilities field of GET /api/instance, since an older server would write the create twice.
    - MCP create_plan now writes the plan and its steps in one transaction.
    Decisions
    - Mark a comment as a decision from the web composer, MCP (kind: "decision"), REST or the CLI. Decisions carry a badge, the web UI filters the thread to them, and project archives keep the kind.
    - get_issue lists the newest decisions in their own section, within 50 entries and 32 KiB, even when comment bodies are left out or the discussion is trimmed. Each summary is the first line of prose, skipping leading headings and code blocks. Older decisions are counted, with a pointer to list_comments, which now filters by kind.
    - The remote CLI reports when an older server stored an ordinary comment instead of the requested decision, naming the comment it created.
    Conventions pages
    - Each project can have one conventions page: the rules for working with its issues, pages and plans. New projects start with one, from a template you pick: empty (the default), heavily AI managed, human managed or human owned. Because of that, the first page a client creates in a new project through REST, MCP or the CLI is DOC-2.
    - get_briefing opens with the conventions page, up to 4,000 characters, outside its usual budget, and does not list it again among recently updated pages. Projects created before 3.0 get a one-line reminder in the briefing until they get a conventions page or turn the reminder off.
    - Turning the page off keeps its text. Deleting or emptying it also takes it out of briefings. get_page and page listings mark it, and search ranks it higher when it covers the query.
    - manage_resource, create_page, POST /api/projects, POST /api/pages, PUT /api/pages/{id} and lific project create take the new conventions options, and GET /api/conventions/templates lists the templates.
    - In the web UI the conventions page has its own project tab, listed after Pages in the sidebar, the collapsed rail, the mobile menu and the command palette. Without text, the tab shows the four templates at full length with one button to use the one you picked. With text, it is the page itself, with the usual editor, history and comments. Changing the template and leaving the page out of briefings are in the page's menu, each behind a confirmation. Creating a project offers the same picker. The Pages list leaves the conventions page out, and its old page link opens the tab.
    Briefing
    - get_briefing(since='last') resumes from your previous briefing of the project. The server keeps that mark per user, so agents no longer carry a timestamp between sessions. The change section now lists new comments and who made each change.
    - Briefings open with a human queue: open issues assigned to a person in every project you can view, ranked by how much work each blocks, then due date, then age, with possible duplicates flagged.
    - Active issues show how long they have been idle, and a Stale active section lists the ones nobody has touched for three days (--stale-active-days). list_issues accepts stale=true.
    - The briefing ends with a short Needs triage list: active plans idle for 30 days or more, and active modules with no open issues, three of each with full counts.
    Issues and plans
    - Move an issue to another project with the MCP move_issue tool, POST /api/issues/{id}/move, or Move to project in the issue view's menu and the command palette. It gets a new identifier there, and the old one keeps resolving in get_issue, links and search. Moving needs write access to both projects.
    - The server returns active issues untouched for 14 days to todo once a day, with a comment saying why. Set the period with lific instance set --stale-active-reset-days; 0 turns it off.
    - Cancelling an issue checks off the plan steps that mirror it, and reopening it unchecks them, so a plan with dropped work can reach 100 percent.
    - Active plans complete themselves when their last step is resolved, and reopen when a step is unchecked or its issue reopens.
    - Issue, page and plan numbers are never reused, even after the item is permanently deleted, and a moved issue's old number stays taken. The upgrade seeds the counters from existing rows, trashed items and moved-issue aliases; numbers purged before the upgrade cannot be recovered. Project archives carry the counters.
    MCP
    - get_issue reads up to 50 issues in one call with identifiers. An unknown or inaccessible identifier is reported inline without failing the rest.
    - create_issue accepts blocks, blocked_by and relates_to, on a single issue or on each batch item, written in the same transaction. Batch items can name each other by index or title.
    - get_issue and get_page show the record's seq in their header, so an agent can send expected_seq without first hitting a failed write.
    - list_issues (MCP and REST) sorts by order_by=target_date, with undated issues last in either direction.
    - list_issues and get_board rows show due:YYYY-MM-DD when an issue has a target date.
    - Project listings show the first line of each description, up to 100 characters. Pass verbose: true for the full text.
    - Module, label and folder names match regardless of case, and an exact spelling still wins. A name that matches nothing lists the project's valid names, closest first.
    - The MCP server runs on rmcp 3, which implements MCP 2026-07-28. Newer clients can start with server/discover and send their version with each request instead of initializing, over stdio and HTTP alike (the multi-instance proxy still expects initialize); older clients keep the initialize handshake and get the protocol version they ask for, rather than a fixed 2025-03-26. lific mcp --remote passes the newer revision's required HTTP headers through for stdio clients.
    - A misspelled or missing tool parameter now comes back as a failed tool result (isError: true) instead of a JSON-RPC -32602 error, so clients show the "Did you mean" hint to the model rather than treating it as a broken server.
    - A tool that fails now flags its result isError: true, so hosts show it as a failed call and count it in their retry logic. The Error: text is unchanged.
    - Browser clients may send the MCP 2026-07-28 Mcp-Method and Mcp-Name headers through CORS.
    - Every tool declares MCP annotations: which ones only read, which writes are destructive, and which are safe to repeat, so clients can auto-approve reads instead of prompting for every call. lific mcp --instances marks its list_instances tool read-only too.
    - Issues and pages are MCP resources: lific://APP/issues/APP-42 and lific://APP/pages/APP-DOC-3 read as the same text get_issue and get_page return, with the same role checks, so hosts that attach resources by @-mention can pull them into context. resources/list stays empty so a picker never lists a whole tracker.
    - list_issues, search, list_resources and get_briefing return structured results alongside their text. Each declares an MCP outputSchema and returns structuredContent with the identifiers, ids, titles, status and links its text shows, plus next_offset when more results follow, so clients that call tools from code can read fields instead of parsing lines. The text replies are unchanged.
    - A required parameter that arrives missing is named, with the tool's real parameters listed, the same way an unknown one is. A missing field inside a plan step or batch item is reported as that nested field, instead of blaming the tool's top-level parameters (PR #102 by @zorro432).
    - Tool descriptions say what fixes a failed call: an edit miss names the read that gets fresh content, create_page explains the workspace-page form, and link_issues states that the source blocks the target (PR #102 by @zorro432).
    - 32 tools now cost an agent 7,862 tokens of context.
    - initialize reports a tool surface version and a SHA-256 fingerprint of the tool list in capabilities.experimental["dev.lific/toolSurface"], so a wrapper that pins against Lific's tools can tell when they changed without diffing tools/list. 3.0's tools are version 1. The multi-instance proxy compares versions first and names the instance that runs an older one, instead of failing on a definition diff.
    Published projects
    - Published projects are read at their normal links, by anyone. Signed-out visitors get the same app members use, with a Sign in button wherever a member would see an edit control. A signed-in account without a role sees the project read-only.
    - Opening / signed out shows the only published project, a list when there are several, and the sign-in page when there are none.
    - Requests with no credential are limited to 600 reads a minute per address (up from 240, since a signed-out reader now loads the full app), 4 in progress, 4 downloads and 1 thumbnail or preview at a time. Responses to them are never cached. A request with a valid session cookie does not count against these limits.
    - Email addresses, keys, tokens, member lists and settings are never shown to a reader without a role. Activity shows each reader only rows from projects they can read, a relation or move involving a private issue shows "a private issue", and membership and repository-binding history stays with members. Plans hide links to issues the reader cannot see.
    - A live-update connection whose session has expired carries on as a signed-out reader of published projects instead of being refused.
    OAuth
    - Authorization responses carry iss, the issuer the metadata advertises, on approval and denial alike, and the metadata says so with authorization_response_iss_parameter_supported. Clients that connect to several authorization servers use it to reject a response from the wrong one.
    - Clients can skip registration by using an HTTPS URL as their client_id: Lific fetches the client metadata document behind it when a signed-in person opens the consent page, and the page names the host that published it. The fetch reaches only public addresses, follows no redirects, and is cached for an hour.
    Images and attachments
    - get_attachment answers clients on MCP 2025-06-18 or later with a resource_link to attachment://{id} for files it does not show inline, such as PDFs and archives. The client reads the bytes with resources/read when it needs them, behind the same permission check, instead of receiving them up front or getting a download URL it has no credential for. Older clients see no change.
    - get_attachment returns SVG images as their XML source, paged by line like text files and marked as untrusted markup, instead of an opaque blob or a download link. Browsers still only download SVG.
    - upload_attachment takes a local path when the client connects through lific mcp, the local server or either proxy. The process reads the file and sends the bytes, so the model no longer has to write a file out as base64, which ran past output limits for any real screenshot and could corrupt it without an error. HTTP MCP refuses path, since the server cannot see the agent's files. filename defaults to the file's name.
    - Over HTTP MCP, upload_attachment with a size and no content returns an upload ticket: a one-time URL, valid for 10 minutes, that takes a PUT of the file and a ready curl command. The bytes skip the model, the upload is checked and linked as the agent that asked for it, and the reply carries the attachment's Markdown. The ticket follows the experimental MCP files extension's upload target shape.
    - upload_attachment's description names every accepted file type, including video, audio, SQLite and HWP, which agents could not tell were allowed.
    - upload_attachment takes alt_text, stored like the web UI's and used as the embed snippet's link text. get_attachment and list_attachments show alt text and pixel dimensions, so an agent can often skip looking at an image at all.
    - get_attachment sends an image larger than 1600 px or 1 MB to the model as a scaled copy, cached beside its thumbnail, instead of the original. A 10 MiB original used to exceed what providers accept and could break the agent's session. full: true returns the original when it is within provider limits, and the first line names both sizes.
    - Images uploaded through MCP now record their pixel dimensions and get a thumbnail, as browser uploads always did, so the web UI no longer loads the full original where it shows a preview. Text files uploaded through MCP are searchable like browser uploads.
    - The HTTP /mcp endpoint accepts request bodies up to about 14.3 MiB, enough for a maximum-size base64 upload_attachment, and refuses larger ones with 413 before any tool runs.
    - Images can be sized: ![alt|320](url) renders at most 320 px wide, in issues, pages, comments and the public view, and a smaller image is never stretched. The suffix rides in the alt text, so other Markdown renderers and exports still show a normal image. The chip after an image upload offers S, M and L sizes that write it for you; L loads the original so a dense screenshot can fill the column instead of showing the 480 px preview.
    - An image on its own line with a Markdown title, ![alt](url "Caption"), shows the title as a caption under it, wrapped to the image's width.
    - Several images alone in a paragraph render side by side as equal-height tiles that wrap on a phone, instead of a tall stack. Dropping several screenshots at once now inserts them as such a group, set apart from the text around them by a blank line.
    - The Attachments panel under an issue or page has an Insert action on each file. It puts the file's Markdown, with the image's alt text, at the editor's caret, or opens the editor and adds it at the end when you are reading, so a file uploaded once can be placed again without copying its link by hand.
    - The image viewer zooms and pans: a click shows the native size, the wheel, a pinch or +/- zoom further, and a drag moves around, so a 4000 px screenshot of a log or a dense UI is finally readable. The arrow keys step through the other images on the page, and the toolbar downloads the original or opens it in a new tab. The same viewer now serves issue and page bodies, comments, and the Attachments panel.
    - The panel's Details action edits an image's alt text after upload (for whoever may delete the file) and lists every issue, page and comment you can see that uses the file, linked.
    - Pasting an image URL into a body editor, comment box or new issue offers to import the image as an attachment. Declining, or a failed import, keeps the URL as you pasted it. The server fetches only public addresses, follows no redirects, checks that the file is an image within the attachment size limit, and gives up after ten seconds.
    Agent activity
    - A new Agent activity page (/agents) shows what connected tools have been doing over the last hour, day or week: a chart of their reads, edits, creations and closures, each agent's status (active, idle or inactive) with its counts and a sparkline, and a feed of recent actions that links to what they touched. Only bot accounts count as agents, and only projects you can see are included. The data comes from GET /api/agents/activity.
    - MCP read tools now record which agent read what, so the page can count reads. Records are buffered and written every few seconds, and the server deletes them after 30 days.
    - Each agent in the roster shows its tool's mark, such as Claude, OpenCode or GitHub, instead of one generic bot icon. GET /api/agents/activity returns each agent's tool_id.
    - The sidebar's Agent activity row shows how many agents acted in the last 10 minutes.
    Sidebar and Home
    - The sidebar opens with a Workspace section (Home, Inbox, Assigned to me, Agent activity) that stays in place with live counts while only the project tree scrolls. A search launcher with your platform's keycaps and an account card sit beside it, and each project's views are split into daily and reference groups.
    - Collapsing the sidebar folds it into an icon rail instead of hiding it: workspace links, one button per project that opens a menu of its views, theme and account, all with tooltips. Icons sit on the same line in both states, so folding and unfolding does not move them.
    - Project groups show as folders with a project count, and one New project row replaces the Projects heading's create menu.
    - Folders nest up to four levels, and folders and projects share one order that is yours alone: arranging your sidebar never changes what anyone else sees, and GET /api/projects follows it. Drag a project or folder before, after or into another; closed folders spring open, and a refused drop says why. Folder and project menus can move things in and out of folders and create subfolders. Deleting a folder moves its contents up a level. On a phone the same tree moves through menus.
    - GET /api/project-groups/layout returns your whole tree and PUT /api/project-groups/move moves one item. Creating a folder takes parent_id and an item to put in it.
    - Assigned to me lists open issues that name you across projects, grouped by status and sorted by priority, then recency.
    - Home is redrawn in the style of the Agent activity page: sections divided by hairlines, the age chart and 90-day trend drawn with real count axes, and a freshness bar per project colored by its last change.
    Inbox
    - The Inbox is a triage feed: one row per issue with every reason it is there, and tabs with counts for All, Unread, Assigned, For anyone, Waiting and Later. Read state is kept per device.
    - A reading pane shows the issue's description and latest comments, with a reply box.
    - Later puts an issue off with a date wait noted "Put off from the inbox", and the sidebar's Inbox count leaves put-off issues out.
    - Rows have quick actions (read, later, done), and the reading pane can start the issue. Select several for bulk actions, search, filter by project, sort and group, and drive it all from the keyboard with a hint bar showing the keys.
    Issue list
    - Each filter (status, priority, assignee, label, module) can hold several values, so Urgent and High show together; separate filters still combine. The board shows a column for every status the filter admits, which also stops the Unresolved filter hiding every column. Saved views from before keep working.
    - The toolbar has two tiers: the page name, count, view switch, an always-visible search field and New issue on top, with slices and view tools below. Active filters are spelled out as removable chips, and F opens the filters.
    - Rows are taller, with hover states on every inline control and pickers that mark the current value. On phones the title gets two lines and the full width.
    - The composer stays open after Enter so you can file the next issue; Ctrl/⌘ Enter creates and opens it. A group header's "+" opens the composer preset to that group. A row that changes, here or from someone else, glows once.
    - A hint bar shows what the keys do, and when filters hide everything, the empty state says how many issues are hidden and by which filter, with one click to remove it.
    - On extra-wide screens a project pulse sidebar shows a completion ring, the status mix, open work by priority, module progress, labels and recently updated issues; every row toggles a filter. The right sidebar collapses to a labeled edge tab and remembers it (PR #106 by @zorro432).
    Issue and page views
    - Issues show start and due dates with overdue marks, and relations show the linked issue's status and title. S, P, M, L and D open the status, priority, module, label and due date pickers, and phones get a strip of the issue's properties.
    - Pages get an outline beside the body that follows your scroll (folded above it on narrower screens), a 760 px reading column, a line with length and reading time, and a pin toggle. Status saves as soon as you change it, and Delete offers Undo instead of a confirmation.
    - Both share one comment thread with a Saved indicator, a comment count that jumps to it, and C to write a comment. Copy link sits in the overflow menu for everyone and Export for anyone signed in, and the command palette can copy, export, set a due date or pin.
    - Issue, plan and module views use the full content width, with the metadata docked to the right.
    Pages
    - The Pages tab is rebuilt around three panes: folders on the left, the page list in the middle, and on wide screens a reading pane that shows the selected page rendered. While no page is selected, that pane lists recent edits and who made them, drafts that are waiting, active pages nobody has touched in 60 days, the most linked pages, and how many pages nothing links to.
    - Folders show how many pages they hold. Pick one to see only its pages and its subfolders' pages. Folders can be renamed in place, and dropping a page on one moves it. Below 1024px the folders open from the top bar.
    - Each row is one line: title, status (Draft or Complete; Active shows nothing), labels, how many issues, pages and comments link to it, who last edited it (an agent shows its tool's mark), the identifier and the date. The line under it is the page's first real sentence, not its first heading. Excerpts can be turned off.
    - The top bar matches the issue list: a search field and New page (C), then what the list shows, Filter (status, label, who last edited it, only pages nothing links to) with the active filters shown as chips, and Display (group by folder, day edited, label or status; sort by edit time, creation, title or status).
    - Keyboard: J/K move, Enter opens, Space peeks when the reading pane is off, P pins, X selects, F filters, / searches. Selected pages can be moved, given a status or a label, pinned, or exported as one Markdown file.
    - Pages edited since your last visit are marked, with an "N updated" chip that steps through them. Your own edits are not marked.
    - Right-click a page (or press and hold on a touch screen) to open, peek, copy its link or identifier, pin, move, change its status or archive it.
    - Pinned pages sit in one row above the list instead of appearing as cards and again in the tree.
    - The folder pane links to the Conventions tab and says when the conventions are not written yet or switched off. Archived pages are kept under Archived at the bottom of the folder pane, each with Restore, and the entry appears once something is archived.
    - Creating a page asks for its title and whether it starts as a draft or active, in the folder you are looking at.
    - GET /api/projects/{id}/pages/meta returns each page's excerpt, word count, who created and last edited it, and which issues and pages link to it.
    - Dates older than a week show the year when it is not the current one.
    Web app
    - Browser tabs, bookmarks and history name the page you are on, such as Issues · APP · Lific, and an issue or page title once it loads (PR #107 by @zorro432).
    - Opening a link without a session (a bookmark, a link from chat, an expired tab) takes you back to it after you sign in, instead of to Home.
    - On reload, the web app paints the data you last saw from a local cache right away, then brings it up to date. The cache is kept per account and cleared when you sign out.
    Editing in the browser
    - Issue descriptions, pages and module descriptions are edited in place, with formatting rendered as you type. The Edit and Preview switch and the Save and Cancel buttons are gone: click into the text and write. Markdown marks show only where the caret is, and images, tables, task checkboxes and diagrams stay rendered around it. The stored Markdown is exactly what you typed.
    - Edits save on their own after a short pause, when you click away and when you leave the page; Ctrl/⌘ S saves at once. Each save carries the body's expected_seq. An edit made elsewhere to a different part of the body is merged into yours; an edit to the same part stops and asks which version to keep, with the other version shown on request.
    - A body you are writing in no longer pauses live updates. Changes from agents and other tabs flow into the text without moving the caret.
    - Type / for a block menu (headings, lists, checklists, quotes, code, tables, diagrams, dividers, files) and # or a project prefix for issue references. Selecting text shows a formatting toolbar with a Quote into the comment box. Ctrl/⌘ Enter ticks the task on the caret's line, Tab and Shift+Tab indent list items, pasting a URL over selected text makes a link, and Ctrl/⌘-click opens a link.
    - Files dropped into the body upload at the point where they are dropped.
    Command palette
    - The palette (Ctrl/⌘ K) is easier to read. The selected row gets a neutral fill and a thin accent marker on its left edge instead of an accent tint, and every row is one line: status or kind icon, identifier, title, then the project and priority. The characters your query matched are highlighted. All palette text meets WCAG AA contrast with every accent in light and dark.
    - An empty palette lists what you opened recently and the next likely actions (New issue, New page, Switch project, New project) instead of every project. Projects show up when you type their name. Syntax tips (34, OMN-156, doc 3) appear only until you start typing.
    - A scope chip next to the input narrows results to issues, pages, plans, projects or actions. Tab and Shift+Tab cycle it. Plans are now searchable.
    - On wide screens a preview column shows the selected issue or page: status, priority, project, who it is for, labels and the first lines of its text.
    - Ctrl/⌘ . opens actions for the selected result: open it, open it in a new tab, copy its link or identifier, and for issues set the status or priority without leaving the palette.
    - The footer shows real keycaps, and reopening the palette within a minute restores your last query and selection.
    Project overview
    - A project's overview is rebuilt in the style of Home. Five numbers lead it: open issues and their change this week, what is in progress, what closed in the last four weeks with a weekly chart, what an agent can pick up, and what waits on a person. A bar of every issue by status sits under them; click a status, a number or a label to open the issue list filtered to it.
    - A Work list ranks open issues with tabs for Needs attention, In progress, Ready for agents, For a person and Blocked. Blocked issues name their blocker.
    - The overview also shows the open count over 90 days, opened against closed for the last four weeks, each module's progress, active plans, pinned and recent pages, who has been working, and open issues per label. It refreshes as changes arrive, and says what agents and people opened and closed since your last visit.
    - Recent activity reads as sentences: "closed APP-12", "moved APP-4 to Active", "checked off a step in APP-PLAN-2", with the issue's title and a comment's first words. A burst of edits by one person to one thing is folded into one line.
    - Settings move to their own tab at /{PROJECT}/settings, with a section index that follows the scroll: General (icon, name, description, identifier, lead, sidebar group), Labels, Members, Public access, Import and export, and an always-open Danger zone. The project lead is no longer under the danger zone. Projects' sidebar menus gain a Project settings item, and ?section=labels opens the page at a section.
    - GET /api/home/overview accepts project_id to narrow every aggregate to one project.
    - A project with no issues, modules, plans or pages shows only its first steps, without empty sections under them.
    New project form
    - The form is laid out as the project's overview header: pick the icon, type the name as a title and the description under it, then the setup rows and a conventions template below. On wide screens a preview shows the project's sidebar row and its issue and page links as you type.
    - The suggested identifier never starts with a digit and steps around ones already in use (LIF taken suggests LIF2). Typing keeps only letters and digits, and an identifier the server would refuse is named before you submit, with Create disabled until it is fixed. A changed identifier can go back to the suggestion in one click.
    - Ctrl+Enter (Cmd+Enter on a Mac) creates the project. A failed create shows its reason in the form, not only in the top bar.
    - Deactivated accounts are no longer offered as the project lead.
    Account settings
    - The page is split into Profile, Appearance, Agents and Security, with a section index that follows the scroll. Each setting is a row with a one-line explanation beside its control.
    - Connected tools become Agents: a list of the agent accounts you own, each with its username, whether it has a live key or an OAuth sign-in, when the key was issued, when it was last active and how many changes it has made. The grid of every supported tool, connected or not, is gone.
    - New agent account asks which tool will use it (which only picks the setup steps), a name, and an account ID, and shows the username it will get before creating the account and its key. A tool's mark now also shows for named variants such as codex-laptop.
    - Revoking a key and deleting an agent account each ask first. Deleting names the comments that go with the account.
    - GET /api/auth/bots returns key_created_at, oauth, last_active, changes and comments for each agent account.
    Storage
    - Page edits are recorded in the activity log as line diffs instead of two full copies of the page. An upgrade migration converts existing history; on a real 290 MB database it brought the file to 76 MB after VACUUM.
    - Module, label and folder names and issue and page titles that older clients saved with HTML entities (for example Window & Panel) are decoded on upgrade, so looking them up by their real name works again.
    Installing
    - Install with Homebrew on macOS or Linux: brew install voidnullable/tap/lific. The formula installs the release binary, checked against the release's SHA-256, plus shell completions, and is updated with every release (requested in #93 by @pasteley).
    - Install with winget on Windows: winget install VoidNullable.lific. Each release is submitted to winget's community repository, so winget upgrade sees it a day or two after the GitHub release.
    - cargo install --git https://github.com/VoidNullable/lific --locked --features build-web builds the web UI as part of the install, which needs Bun. Without the feature, a build from Git stops with an error instead of producing a binary with no web UI (PR #94 by @mjc).
    CLI and doctor
    - lific doctor diagnoses the instance that actually runs. When the usual search finds no configuration file, it uses the running server's own --config, then the one the installed service names, and says where the configuration came from. It warns when the running server or the service uses a different file from the one the search found, and fails when a service points at a file that no longer exists (PR #104 by @zorro432).
    - lific doctor no longer warns that no per-user service is installed on an instance that something else supervises, such as a system-level systemd unit or a container.
    - When no service manager is found, the message now says what each platform needs, so Windows users are no longer told Lific only supports systemd and launchd. lific init, lific service install and lific service tell you how to remove the service with lific service uninstall (PR #103 by @zorro432).
    - New lific doctor checks report anyone the roles upgrade left without access, obsolete MCP settings, and old /mcp/<token> URLs in client configurations (see Before you upgrade).
    Security
    - No script on the page can read the web session, which lives only in the HttpOnly cookie. A token an older version left in local storage is deleted on first load, and the browser carries on with the cookie set at its last sign-in.
    - A request with an Authorization: Bearer header (the scheme in any case) is judged by that header alone, so a missing or wrong credential after Bearer gets 401 even when a session cookie is present. A header with any other scheme, such as the Basic credentials an HTTP basic-auth proxy sends, is ignored and the cookie applies, so instances behind such a proxy keep working.
    - The session cookie omits Secure when public_url is an explicit http:// URL, as before, and now also for plain-HTTP requests to a loopback address, so a default local install can sign in from any browser.
    - Signing out ends the session from the cookie. If the server does not confirm it, the web UI keeps you signed in and shows the error so you can retry.
    - The CLI sends a stored credential only to the origin it was issued for or to a loopback address. Before, lific doctor could present it to another host when public_url named a different server. A bracketed IPv6 loopback such as [::1] now counts as loopback (PR #103 by @zorro432).
    Fixes
    - A project created by a connected tool through manage_resource makes the tool's owner its lead. Before, nobody was a member, so only administrators could see it (#108, reported by @lardissone).
    - Backups and lific dump work when the data directory is reached through a symlink, which on macOS includes every temporary directory.
    - Icons in the collapsed sidebar rail keep their full size when the project list overflows.
    - Creating or renaming a project to an identifier already in use answers 409 naming the identifier, instead of 500.
    Upgrading
    The full notes, with every command, are at lific.dev/docs/upgrading. In short:
    - Take a backup with lific dump and stop every process that opens the database first. Eighteen migrations run on first start. The page history conversion rewrites every stored page edit and can take tens of seconds on a large database; the space it frees only returns to the file system after a VACUUM. The roles migration seeds memberships only on an instance that still had enforcement off.
    - Work through Before you upgrade: replace /mcp/<token> clients, review published projects, move password-login scripts to API keys, and set public_url if people use plain HTTP beyond localhost.
    - Afterwards, run lific doctor and resolve any project_access warning with lific member add, remove mcp_path_token and mcp_path_user from lific.toml, and refresh MCP tool discovery in your clients.
    - lific start runs its first stale-issue pass shortly after starting. Turn it off first with lific instance set --stale-active-reset-days 0 if you do not want active issues idle for 14 days moved back to todo.
