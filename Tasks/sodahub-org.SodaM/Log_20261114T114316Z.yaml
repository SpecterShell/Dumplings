  Key: ReleaseNotes
  Value: |-
    SodaM 0.3.9
    播放与队列
    - 显式点播不可播曲目（下架 / 无整曲授权 / 拿不到试听地址）立刻给出原因，不再自动跳歌或重复打网络；列表与「接下来」面板会标记当前账号不可播的曲目（#108、#110、#111）。
    - 自动跳过按「扫一圈」计数，单曲循环或队列只有一首时不再谎称已跳歌；装载失败 / 被新请求取代的请求不再留下永久 loading（#108、#109）。
    - 不可播快照与结论共享同一份数据，切换账号后旧标记不会串到新账号（#110）。
    预取与故障
    - 全局故障（登录过期 / 签名服务 / 缺 Cookie / 磁盘）期间挂起预取管线，按故障类型恢复；按曲目的失败不再误伤整条管线（#112、#116）。
    - 未分类失败只走 60 秒冷却，不再生成永久逐曲黑名单；账号或会员变化时清理挂起状态（#117、#121）。
    音质与缓存
    - 认不出档位的旧缓存不再每次命中都白重下；0 分不再被判成降档或「高于所选」（#96）。
    - 档位菜单常驻显示「所选 vs 实际」，不再只靠 5 秒状态行（#97）。
    - 试听缓存补整曲时不再被「档位认不出」挡住，补齐后按整曲使用（#130）。
    签名与网络
    - 默认签名地址切到 HTTPS：https://signer.lingchuanbio.com/sign（Cloudflare Tunnel，源站不直接暴露公网）；旧明文地址自动迁移，老版本客户端仍可继续用旧接口过渡（#146）。
    安装包
    - 首次提供 Debian / Ubuntu .deb（amd64 / arm64），与 pacman、Homebrew、Windows 安装包同批发布（#133）。
    - README / 官网补充 winget 安装说明：winget install --id sodahub-org.SodaM -e。
    界面与文案
    - 设置页「编辑」按钮跟随界面语言（#140）。
    验证：scripts/check.sh 全过（cargo check + fmt --check + clippy -D warnings + test）；Windows / macOS / Linux 四平台 CI 全绿；RDP 真机启动 dev 包，经新 HTTPS 签名服务拉取两首整曲无损（44.9 MB / 24.0 MB）。
