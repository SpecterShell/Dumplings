- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - Wayland 双击标题栏最大化可用：之前按下标题栏就立刻把指针交给合成器，双击的第二下被吞掉；现在改成移动超过 4px 才开始拖拽，双击可以正常最大化 / 还原。
    - Linux 窗口按钮可配置：设置 → 窗口 新增「自动（跟随桌面，默认）/ 总是显示 / 不显示」。GNOME 这类要求客户端自绘的桌面自动显示；Hyprland、sway 等平铺桌面默认保持无边框，需要按钮时可在设置里强制打开。
    - 官网上线：https://sodahub-org.github.io/sodam/ —— 包含安装说明、「让 AI 帮我装」一键复制提示词、更新日志与开发者文档，手机端已适配。
    - 自建 pacman 源：在 /etc/pacman.conf 加入 [sodam] 源后，sudo pacman -Sy sodam 安装、随 pacman -Syu 升级；仓库由 CI 在每次发版后重建。
    - 其它：README 明确 SodaM 是汽水音乐的第三方客户端；更新日志页改为读取 CI 生成的 releases.json。
