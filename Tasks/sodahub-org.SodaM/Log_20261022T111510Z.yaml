  Key: ReleaseNotes
  Value: |-
    SodaM 0.3.5
    搜索与输入
    - 搜索框补齐标准文本编辑能力：选区、鼠标选择、复制 / 剪切 / 粘贴、词级移动与删除、Ctrl+F / ⌘F 聚焦，以及 Ctrl+Z / ⌘Z、Ctrl+Shift+Z / ⌘⇧Z 撤销与重做（#34、#36、#44、#48、#49，贡献者 @Xxx91n）。
    - 新增本地搜索历史与隐私开关；历史仅保存在本机，关闭时会清空已记录内容。
    快捷键与界面反馈
    - 新增快捷键冲突检测：拒绝播放动作重复绑定，拦截 macOS 保留键，并修复旧配置按键显示串迁移（#38、#39、#42，贡献者 @Xxx91n）。
    - 修复快捷键卡片按钮共享 ElementId 的问题（#37，贡献者 @Xxx91n）。
    - 全局 message 不再被普通加载、播放和导航状态刷屏，只提示登录、快捷键冲突、拉流或读取失败等重要事件；同类提示会替换而不是堆叠（#40、#46）。
    - 设置页“其他”新增来自 contrib.rocks 的维护者与贡献者头像，加载失败可重试（#47）。
    Windows 与隐私
    - Windows 安装器跟随系统显示语言，并在升级前正确处理正在运行的 SodaM，避免安装卡顿（#30、#32，贡献者 @Xxx91n）。
    - 新增中英文隐私政策与代码级数据流说明，明确本地数据、Cookie 与签名服务的数据边界。
    感谢本次 Release 涉及的贡献者 @Xxx91n：搜索选区 / 剪贴板 / 撤销重做、快捷键健壮性、Windows 安装器。感谢 @BranchCrypto 此前对列表和详情页的修复，也感谢所有提交 issue、参与 review 和测试的朋友。
