  Key: ReleaseNotes
  Value: |-
    - 搜索框可以正常编辑了：之前输入框只能往末尾追加 —— 左右方向键、Home/End、鼠标点击都无法移动光标，退格也只会删最后一个字符。现在插入点会跟着方向键和点击移动，可以在字符中间插入、删除（含中文等多字节字符）。
    - 修复细节：点击定位与光标绘制共用同一条排版结果（ShapedLine 的 closest_index_for_x / x_for_index），不会出现光标与文字错位；输入法组合输入（拼音上屏）继续走原来的 marked range。
