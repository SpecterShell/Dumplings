  Key: ReleaseNotes
  Value: |-
    SodaM v0.2.6：内存优化（RSS 归位）
    背景
    - top 里 SodaM 常驻 400+MB，而 Activity Monitor 只有 ~147MB。差在 macOS
      malloc 释放大块内存后只做 MADV_FREE（reclaimable）：页仍算进 RSS，却没算进
      phys_footprint。无损整曲下载解密会同时持有「加密体 + 明文 + mdat」多份缓冲
      （单曲可达 50MB+），播完释放后这些页被 malloc 留着，越听越高。
    本次改动
    - 整曲下载解密落盘后调用 malloc_zone_pressure_relief，把已释放的空闲页真正
      归还系统；需要时再按需缺页，不影响正确性。
    - 实测（debug）：RSS ~400MB → ~116MB，MALLOC_LARGE_REUSABLE 归零，
      phys_footprint ~112MB → ~85MB。
    其它
    - 封面缓存此前已改为「按显示尺寸解码 + 16MB 预算」，本次不再是瓶颈。
    开发钩子
    - SODAM_COVER_LOG / SODAM_THEME_LOG / SODAM_FRAME_LOG 仍可用于排查。
