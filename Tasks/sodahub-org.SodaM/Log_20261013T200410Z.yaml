    SodaM v0.2.5：界面细节修复
    macOS 标题栏
    - 修标题栏与内容之间的色差横缝：根元素不再整体留出红绿灯内边距，
      改由侧边栏 / 内容列各自下沉 28px，背景一直铺到窗口顶部；
      内容区不再重复画 ambient 渐变（渐变按各自元素尺寸起算，是横缝根因）。
    歌词页大封面
    - 切歌后强制显示 200ms 加载态，避免切歌瞬间直接出图导致的闪烁。
    - 大封面加载失败时，重试按钮由封面下方移入封面内（底部居中）。
