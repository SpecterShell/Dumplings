  Key: ReleaseNotes
  Value: |-
    SodaM v0.4.0
    - 扫码登录改为纯 HTTP：不再依赖 Chromium / CDP / Node（libresoda #50）。
    - 登录设备身份持久化进 config.json：服务端按 device_id 风控，
      持久身份不再触发封控验证页（首次升级自动迁移旧设备身份）。
    - 二次验证（2046）用系统默认浏览器打开本机验证页完成，Windows / macOS 实测通过。
    - 登录弹层新增反馈：二维码剩余时间、过期自动换码、验证窗口状态；配套脱敏诊断日志
      （login_qr_created / login_poll / login_success 等，不记录凭据）。
    - 搜索接口迁移：改走带应用签名的 PC /luna/pc/search/all，修复"搜索无结果"
      （#209，libresoda #54）。歌曲 / 音乐人 / 专辑 / 歌单统一从综合结果解析。
    - 高亮句垂直居中：对齐视口中心上方一行，与封面中心线齐平（#180）。
    - 开场过渡：第一句贴视口顶部，歌词先不动，高亮句逐句下走；越过跟随线后
      切入居中跟随，全程连续无跳变。
    - 滚动目标钳进实际可滚动范围，短歌词结尾不再抖动。
    - 依赖：libresoda 升至 c057371；gpui 升至 e0fbafb（带 #204 拖动修复）。
