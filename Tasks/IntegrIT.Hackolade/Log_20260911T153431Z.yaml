Version: 8.13.0
Installer:
- Architecture: x64
  InstallerUrl: https://s3-eu-west-1.amazonaws.com/hackolade/previous/v8.13.0/Hackolade-win64-setup-signed.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Tech refresh of ElectronJS (v44.2.0), Chromium (v152.0.7977.76), NodeJS (v24.20.0), V8 engine (v15.2.124.19), and related modules
    - Tech refresh: support macOS 12 (Monterey) is discontinued by Chromium. Older versions of Hackolade Studio will continue to run on Monterey, but macOS 13 (Ventura) or later is required to run v8.13.0 and higher
    - Supertype-subtypes: extended to include completeness (total or partial) and exclusivity (disjoint vs overlapping)
    - Supertype-subtypes: extended to support multiple supertype groups
    - Supertype-subtypes: extended to support choice of strategy during derive operation: preserver hierarchy, roll-up (flat or nested), roll-down
    - Licensing: limit reuse of desktop license to studio.hackolade.com and specific customer sub-domains
    - PowerDesigner: added reverse-engineering of creator, creation date, modifier, and modification date into the remark of each object
    - Plugin Manager: ensured plugin ZIP installation cannot write files outside the plugins directory
    - External references, Polyglot references: ensured potentially malicious reference links are ignored when refreshing definitions
    - BigQuery: eliminated symbolic links to binary files in node_modules/.bin
    - EventBridge, OpenAPI, Swagger: updated js-yaml library
ReleaseTime: 2026-09-11
