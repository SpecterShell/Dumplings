Version: 8.13.8
Installer:
- Architecture: x64
  InstallerUrl: https://s3-eu-west-1.amazonaws.com/hackolade/previous/v8.13.8/Hackolade-win64-setup-signed.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Tech refresh: ElectronJS v45.2.3 (Chromium v156.0.8078.80, NodeJS v24.22.2, V8 v15.6.75.27), and related modules
    - Workgroup: added support for OAuth authentication for GitHub Server repository connections
    - MEGA: added handling of Keep Both and Replace when resolving name conflicts during reverse-engineering
    - MEGA: added reverse-engineering of Db2-zOS Not Null with Default as required columns with WITH DEFAULT
    - MEGA: enhanced reverse-engineering of GRAPHIC and VARGRAPHIC columns into DB2 for z/OS
    - BigQuery: added support for Require partition filter on tables partitioned by time-unit column or integer range
    - BigQuery: updated glob and minimatch libraries
    - BigQuery, CockroachDB, Db2, Db2 for z/OS, DeltaLake/Databricks, Glue, Hive, MariaDB, MySQL, Oracle, Redshift, SQLServer/AzureSQL, Teradata: comment out the foreign key of a deactivated relationship
    - Databricks: added support for Microsoft Entra ID or OAuth authentication code flow (PKCE)
    - Db2: ensured boolean default value false is generated when column default values are in separate statements
    - Db2 for z/OS: added support for WITH DEFAULT without a specified value in the Properties Pane, plus forward- and reverse-engineering
    - Snowflake: updated toml and follow-redirects libraries
    - SQLServer/AzureSQL, Synapse: updated Entra ID MFA access token when user-to-machine OAuth module is exposed
ReleaseTime: 2026-11-06
