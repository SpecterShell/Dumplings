  Key: ReleaseNotes
  Value: |-
    - Tech refresh: ElectronJS v44.5.1 (Chromium v152.0.7977.130, NodeJS v24.21.0, V8 v15.2.124.28)
    - Licensing: updated license validation server URLs for QLM v20 upgrade
    - dbt: added data_type to source columns
    - Polyglot: preserved source attribute and collection identifiers after roll-up or roll-down during supertype derivation for Model Hub lineage
    - Supertype-subtypes: added error handling in copy-paste
    - Supertype-subtypes: added choice of supertype group materialization in derive dialog
    - PowerDesigner: added preservation of ERD layout for relationship anchors and paths
    - BigQuery: enhanced usability of the reverse-engineering connection dialog when a project has no datasets
    - BigQuery, EventBridge, OpenAPI: updated brace-expansion library
    - PostgreSQL: added support for renaming a table or a view in ALTER script of delta models
    - Snowflake: updated brace-expansion and momentjs libraries
ReleaseTime: 2026-10-02
