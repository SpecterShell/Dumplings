Version: 8.12.8
Installer:
- Architecture: x64
  InstallerUrl: https://s3-eu-west-1.amazonaws.com/hackolade/previous/v8.12.8/Hackolade-win64-setup-signed.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Tech refresh of ElectronJS (v43.4.0), NodeJS (v24.18.1), Chromium (v150.0.7871.224), V8 engine (v15.0.245.28), and related modules
    - IBM Db2 for z/OS (mainframe): added plugin with full support for forward-engineering of DDL, and reverse-engineering from offline DDL
    - Command-Line Interface: disabled superfluous chromium cache
    - DBML: added support for reverse-engineering indexes for MySQL, Oracle, and SQL Server
    - DDL forward-engineering: optimized script generation for models with references to user-defined types
    - Docker CLI: added support for read-only root filesystem
    - Documentation: enhanced robustness of diagrams generation for documentation under heavy load or slow system
    - Grid View: added support for copy-paste of dropdown select and multi-select properties
    - Grid View: separated Properties Pane visibility from row selection to enhance user focus while editing cells directly in the grid
    - PowerDesigner: added support for reverse-engineering of stand-alone view columns
    - PowerDesigner: added support for reverse-engineering of computed columns for CockroachDB, PostgreSQL, and SQL Server.
    - PowerDesigner: added support for reverse-engineering of sub-shortcuts
    - Oracle, Polyglot: added support for stand-alone columns in views without direct reference, for modeling purposes only
    - Oracle: allowed GENERATED AS properties of attributes referencing a definition to have their own value
    - Snowflake: added support for stand-alone columns in views (without direct reference), for modeling purposes only
ReleaseTime: 2026-08-14
