Version: 8.13.7
Installer:
- Architecture: x64
  InstallerUrl: https://s3-eu-west-1.amazonaws.com/hackolade/previous/v8.13.7/Hackolade-win64-setup-signed.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Tech refresh: ElectronJS v45.1.0 (Chromium v156.0.8078.49, NodeJS v24.22.1, V8 v15.6.75.19), and related modules
    - Polyglot: added option to automatically generate missing foreign key column upon derive of conceptual relationships
    - Symbol Annotations: added separate header color and body color
    - PowerDesigner: added reverse-engineering of text symbols as annotations with transparent fill, and skipped title symbols
    - PowerDesigner: added reverse-engineering of symbol fonts (bold, italic, size) as Markdown formatting in annotation text
    - PowerDesigner: flagged attributes of composite unique keys as alternate keys, including in models already reverse-engineered
    - MEGA: added possibility to reverse-engineer multiple .xmg files with the Command-Line Interface
    - MEGA: added reverse-engineering of physical layer for Db2-zOS target
    - BigQuery: made Partition By independent from the Primary Key
    - BigQuery, CockroachDB, Db2, Db2-zOS, DeltaLake/Databricks, Hive, MariaDB, MySQL, Oracle, PostgreSQL, Redshift, SQLServer/AzureSQL, Snowflake, Synapse, Teradata, YugabyteDB-YSQL: added option to automatically generate missing foreign key column upon derive of conceptual relationships
    - Cassandra, ScyllaDB: updated node-forge library
    - CockroachDB, Oracle, PostgreSQL, YugabyteDB-YSQL: ensured boolean default value false is generated when column default values are in separate statements
    - Couchbase v7+: enhanced forward-engineering and ALTER scripts of indexes with number of replicas, unnamed primary indexes, with all clauses allowed for each index type
    - Couchbase v7+: enabled applying ALTER scripts of delta models to instance, with a clear message when a bucket is missing
    - Couchbase v7+: added Max TTL property for collections in Properties Pane, forward-engineering and reverse-engineering
    - Db2 for z/OS: updated tinypool and oxfmt libraries
    - EventBridge: updated fast-xml-parser and fast-uri libraries
    - MarkLogic: updated qs library
    - OpenAPI: updated fast-uri library
    - SQLServer/AzureQL: updated mssqql and qs libraries
    - Snowflake: updated uuid library
ReleaseTime: 2026-10-23
