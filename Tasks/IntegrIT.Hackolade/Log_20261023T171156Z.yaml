  Key: ReleaseNotes
  Value: |-
    - Tech refresh: ElectronJS v44.9.3 (Chromium v152.0.7977.167, NodeJS v24.22.0, V8 v15.2.124.43), and related modules
    - External references: adjusted the Reference external definition dialog so that selecting an entity and selecting its attributes are mutually exclusive
    - Polyglot: added option to include technical names when converting a model to Polyglot -- see more details at https://hackolade.com/help/HandlingwhenconvertingtoaPolyglo.html
    - MEGA: added reverse-engineering of MEGA HOPEX logical models from .xmg exchange files into Polyglot models, from the GUI and the Command-Line Interface -- more features in upcoming releases
    - PowerDesigner: added preservation of relationship cardinalities when reverse-engineering a CDM or LDM where the parent entity is a shortcut
    - PowerDesigner: added reverse-engineering of free symbols (rectangles, ellipses, titles, text and notes) from CDM and LDM files
    - PowerDesigner: added detection of files saved in binary format, with a clear warning before reverse-engineering
    - PowerDesigner: added reverse-engineering of comments on primary and unique keys for Snowflake
    - Snowflake: added support for comments on primary and unique keys
ReleaseTime: 2026-10-23
