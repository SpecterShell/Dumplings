Version: 8.12.11
Installer:
- Architecture: x64
  InstallerUrl: https://s3-eu-west-1.amazonaws.com/hackolade/previous/v8.12.11/Hackolade-win64-setup-signed.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Tech refresh of ElectronJS (v43.6.0), Chromium (v150.0.7871.250), NodeJS (v24.20.0), V8 engine (v15.0.245.31), and related modules
    - PowerDesigner: added support for reverse-engineering of UNIQUE property of indexes
    - PowerDesigner: added support for reverse-engineering of indexes with expression-only index columns
    - Collibra: added publishing of large ERD images with Command-Line Interface
    - CosmosDB-with-Gremlin-API, CosmosDB-with-Mongo-API, CosmosDB-with-SQL-API, SQLServer/Azure SQL: updated qs library
    - Db2 for z/OS: added support for the GBPCACHE clause in CREATE INDEX statements during DDL reverse-engineering
    - EventBridge, OpenAPI: updated fast-uri library
    - MarkLogic: updated form-data and qs libraries
    - Snowflake: updated brace-expansion and toml libraries
    - Teradata: added optional chaining for composite key checks in primary keys and unique keys
ReleaseTime: 2026-09-04
