Version: 8.12.7
Installer:
- Architecture: x64
  InstallerUrl: https://s3-eu-west-1.amazonaws.com/hackolade/previous/v8.12.7/Hackolade-win64-setup-signed.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Tech refresh of ElectronJS (v42.8.1), NodeJS (v24.18.1), Chromium (v148.0.7778.280), V8 engine (v14.8.178.38), and related modules
    - Tech refresh: upgraded from Vite 7 (Rollup) to Vite 8 (Rolldown)
    - Grid View: added inline editing of single and multi-select dropdowns when not basis for dependencies
    - ERD/ERDV: enhanced readability of entity, view, and annotation headers by automatically applying the highest contrast font color according to WCAG recommendations
    - Glossary: initialized the description of modeling objects with the corresponding glossary term description upon binding
    - PowerDesigner: added support for import of self-referencing relationships
    - PowerDesigner: added support for reverse-engineering of computed and conditional view columns
    - PowerDesigner: added support for reverse-engineering computed columns for tables in Oracle and MySQL
    - References: allowed enum properties of attributes referencing a definition to have their own value
    - Docker CLI: improved offline validation of perpetual licenses, highlighting near-expiry licenses and enforcing container licensing rules for non-concurrent licenses
    - Docker: added support for read-only root filesystem for the hck-cli Docker image published on Docker Hub and hardened the setup for state of the art security standards in K8s
    - Workgroup: bound local Git/OAuth listeners to 127.0.0.1 when IPv6 is disabled
    - BigQuery: updated brace-expansion and minimatch libraries
    - EventBridge: updated brace-expansion and js-yaml libraries
    - Glue: updated brace-expansion, minimatch, and yauzl libraries
    - OpenAPI: updated fast-uri and js-yaml libraries
    - Oracle: adjusted DDL generation so that individual named column NOT NULL constraints remain inline
    - Swagger: updated js-yaml library
ReleaseTime: 2026-08-07
