Version: 9.0.2
Installer:
- Architecture: x64
  InstallerUrl: https://s3-eu-west-1.amazonaws.com/hackolade/previous/v9.0.2/Hackolade-win64-setup-signed.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Tech refresh: ElectronJS v45.5.0 (Chromium v156.0.8078.109, NodeJS v24.22.3, V8 v15.6.75.63), and related modules
    - AI-Assisted Data Modeling: added conversation history in a sidebar
    - AI-Assisted Data Modeling: added titles, rename, archive and delete of conversations
    - AI-Assisted Data Modeling: added search in the conversation history
    - AI-Assisted Data Modeling: enabled prompt caching with AI providers to improve performance and lower token cost
    - AI-Assisted Data Modeling: added deployment policy key to optionally disable storage of AI conversations on users' machines
    - ERD/ERDV: fine-tuned undo/redo to keep position and size of objects after switching diagram
    - Excel: added export of container background color in hex code instead of RGB
    - Excel: added container background color and font style to reverse-engineering
    - License: on Windows, the machine ID is now read from the firmware, so the license no longer becomes invalid when the WMI service does not answer
    - PowerDesigner: added choice of target when several targets are detected during reverse-engineering
    - PowerDesigner: enhanced reverse-engineering of views stored as full scripts
    - PowerDesigner: adjusted reverse-engineering of view columns with aliases in SELECT statements
    - BigQuery, CockroachDB, Db2, Db2 for z/OS, Glue, Hive, Oracle, PostgreSQL, Teradata, YugabyteDB: adjusted DDL and alter script generation to comment out views whose container, columns, or source objects are deactivated
    - BigQuery: added support for OR REPLACE in materialized view DDL
    - CosmosDB-with-Gremlin-API, CosmosDB-with-Mongo-API, CosmosDB-with-SQL-API, DeltaLake/Databricks: adjusted API requests to use the configured proxy
    - Couchbase v7+: added custom scripts before and after the forward-engineering script and each CREATE SCOPE and CREATE COLLECTION statement
    - Db2, Teradata: updated org.json library
    - ElasticsearchV7plus: added custom script formats for forward-engineering, with an editor to create them
    - Redshift: enhanced Test Connection to avoid query timeouts on databases with a large catalog
ReleaseTime: 2026-11-27
