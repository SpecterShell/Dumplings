Version: 8.12.9
Installer:
- Architecture: x64
  InstallerUrl: https://s3-eu-west-1.amazonaws.com/hackolade/previous/v8.12.9/Hackolade-win64-setup-signed.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Tech refresh of ElectronJS (v43.4.1), NodeJS (v24.18.1), Chromium (v150.0.7871.224), V8 engine (v15.0.245.28), and related modules
    - ERD/V: added display option for "Entity name only" data model storytelling
    - Grid View: inserted model level in hierarchy
    - DBML: added support for reverse-engineering of array datatype in BigQuery
    - PowerDesigner: ensured indexes are associated with tables and columns during reverse-engineering
    - PowerDesigner: handled message "expansion count limit exceeded" during reverse-engineering
    - Couchbase v7+: added support for ALTER script of indexes and collections
    - Db2 for z/OS: added support for CHECK CONSTRAINT in reverse-engineering when declared at column level
    - DeltaLake/Databricks: limit fetching of Unity catalogs during reverse-engineering when specified in connection settings
    - Oracle: enhanced grammar parsing of DDLs with UNUSABLE keyword not being at latest position
ReleaseTime: 2026-08-21
