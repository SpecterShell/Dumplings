Version: 8.13.2
Installer:
- Architecture: x64
  InstallerUrl: https://s3-eu-west-1.amazonaws.com/hackolade/previous/v8.13.2/Hackolade-win64-setup-signed.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Tech refresh of ElectronJS (v44.4.5), NodeJS (v24.21.0), Chromium (v152.0.7977.130), V8 engine (v15.2.124.28), and related modules
    - Tech refresh: updated Vitest to version 5 and adjusted unit and feature tests for the new mocking and Node environment behavior
    - Tech refresh: sanitized collection structure diagram in stored XSS
    - Tech refresh: reconfigured Content-Security-Policy (CSP) in HTTP Security Headers
    - Tech refresh: blocked HTML event handlers and inline scripts
    - Supertype-subtypes inheritance: de-duplicated entity during derive operation for a subtype that is also a supertype
    - Supertype-subtypes inheritance: added handling of roll-up and roll-down materializations resulting in no entity to derive, when related entities are not part of the selection
    - PowerDesigner: added support for reverse-engineering Oracle CHAR and VARCHAR2 without a CHAR or BYTE length semantic
    - PowerDesigner: added preservation of ERD layout through relative arrangement of tables, views, external shortcuts, rectangles, and annotation boxes
    - PowerDesigner: added support for reverse-engineering of stereotypes into the custom property stereotype
    - PowerDesigner: added reverse-engineering of column-level custom properties (extended attributes)
    - Db2 for z/OS: added support for reverse-engineering of data types without length
    - MariaDB, MySQL, Redshift, Synapse, Teradata: added an "All Schemas" entry to the forward-engineering lower tab to generate the script of the whole model, including tables outside any schema
    - PostgreSQL: adjusted ALTER scripts of delta model to omit COMMENT ON TABLE when the comment is unchanged
    - Snowflake: added COMMENT ON COLUMN statement for a newly added column in ALTER scripts when column comments are generated in a separate statement
ReleaseTime: 2026-09-25
