Version: 8.13.4
Installer:
- Architecture: x64
  InstallerUrl: https://s3-eu-west-1.amazonaws.com/hackolade/previous/v8.13.4/Hackolade-win64-setup-signed.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Tech refresh: ElectronJS v44.7.0 (Chromium v152.0.7977.130, NodeJS v24.21.0, V8 v15.2.124.28), and related modules
    - dbt: included view columns of derived models
    - Documentation: prioritized reference description over definition description for referenced attributes
    - ERD: preserved entity and view colors when copy-pasting between Studio instances for graph database targets
    - ERD: improved visibility of entity selection highlight when using custom entity colors
    - Forward-engineering: when script generation options are set for PK and UK constraints in separate statements, re-ordered so that ADD CONSTRAINT statements appear ahead of CREATE INDEX statements
    - References: display composite primary and unique constraints in ERD and documentation for attributes in externally referenced entities
    - Symbol Annotations: added styling options for border color, body font color, and body fill
    - PowerDesigner: enhanced reverse-engineering of symbol names stored as RTF
    - Db2: added tolerance for USING INDEX clauses in DDL reverse-engineering
    - Snowflake: added wait for callback server in external browser authentication
    - Snowflake: updated snowflake-sdk library and removed many extraneous dependencies
ReleaseTime: 2026-10-09
