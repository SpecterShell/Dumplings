  Key: ReleaseNotes
  Value: |-
    0.9.4 安装时不再要求手动退出 EditHere
    - 安装或卸载时若 EditHere 正在运行，安装程序不再只弹一句提示然后中止：它会先请运行中的实例自己退出（未保存的批注仍走应用自身的"保存/放弃/取消"提示，窗口会自动浮到前台），随后轮询等待进程消失再继续写入文件。
    - 等待有超时兜底：交互式安装先自动等 10 秒，仍无法退出才提示，并允许点「重试」继续等最多 60 秒；静默安装最多等 90 秒且不弹窗。窗口已被关闭但程序仍驻留托盘时，提示文案会明确说明这一点。
    - 新增 EditHere.exe --quit：复用已有的单实例本地 socket，请运行中的实例走正常退出流程并报告结果（0 已退出、2 仍在运行）。该指令自 0.9.4 起提供，安装器只对 0.9.4 及以上版本所在的安装目录发起请求，避免旧版本把未知参数当作普通启动而触发截图。
    - 修复静默安装（应用内「立即更新」）的竞态：应用在拉起安装器之后才退出，安装器可能先一步判定"程序正在运行"而静默中止，表现为程序关掉了、更新却没装上。
    Full Changelog: https://github.com/Inginnng/EditHere/compare/v0.9.3...v0.9.4
