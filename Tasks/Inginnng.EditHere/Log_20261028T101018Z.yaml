Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Copy options inside the button: the vertical ⋯ menu now sits inside Copy JSON content, without taking another toolbar slot. Click the text to copy, or click ⋯ to choose whether to include the original image. The choice is remembered.
    - OCR toggle on the annotation page: turn automatic region text recognition on or off directly on the screenshot annotation page. It is on by default and remembers your choice. Turning it off stops automatic recognition and retains existing text; turning it back on resumes recognition for regions without a result. Include region text in exports remains a separate setting.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 复制选项收进按钮：「复制 JSON 内容」的竖向「⋯」位于按钮内部，不再单独占一位。点击文字直接复制，点击「⋯」选择是否携带原图信息，选择会被记住。
    - 批注页 OCR 开关：截图批注页可直接开启或关闭区域文字自动识别，默认开启并记住选择。关闭后停止自动识别、保留已有文字；重新开启后继续识别尚无结果的区域。设置中的「导出时附带区域文字」仍单独控制反馈是否包含识别结果。
