  Value: |-
    0.9.5
    界面语言：简体中文与英文，切换即时生效
    - 新增「界面语言」设置：跟随系统 / 简体中文 / English，在「设置 → 外观」里选。中文系统默认是简体中文，其余默认是英文。
    - 切换是实时的：改完立刻生效，编辑器、托盘菜单、设置窗口的文案马上跟着变，不需要重启；取消会回到打开设置时的语言。
    - 「大爆炸」在英文界面里统一叫 Explode，与文档和快捷键说明里的叫法一致。
    - 系统的文件对话框、消息框按钮、颜色选择器也一起跟随界面语言。此前中文界面下它们一直是英文，现在修好了。
    - 英文界面的文案按整句翻译，不再是"前半句 + 后半句"拼出来的，所以不会出现多余或缺失的空格、读不通的句子。
    - 切换语言不会影响导出给 AI 的 JSON：「色块区域」「整个图片」这类标签的值始终是中文，AI 拿到的字段不会随你的界面语言变化。
    Full Changelog: https://github.com/Inginnng/EditHere/compare/v0.9.4...v0.9.5
