Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Fix a macOS long-capture crash: on macOS, starting a scrolling capture and reading the first frame could close the app (#39). The frame is now read for the whole display and the selection is cropped locally, and an error from the system capture interface is reported instead of ending the process. Each stage of the capture is written to the diagnostics log, so a remaining failure shows exactly where it stopped.
    - Fix macOS save locations: saving a project, an annotated image, a layout preview or the original image opened the dialog at the root of the file system, where the write always failed. Suggestions now start in Documents or Pictures.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 修复 macOS 长截图闪退：在 macOS 上框选区域点「长截图」后，程序会在读取第一帧画面时直接退出（#39）。现在改为整屏读取画面后在本地裁出选区，系统采集接口出错时给出提示，不再让程序退出；采集过程分阶段记入诊断日志，万一仍然失败，可以直接看出停在哪一步。
    - 修复 macOS 保存位置错误：在 macOS 上保存项目、带批注图片、调整效果或原图时，保存对话框曾打开在磁盘根目录，保存必然失败。现在默认落在「文稿」或「图片」文件夹。
