  Key: ReleaseNotes
  Value: |-
    本版本修复 v2.9.0 中的群聊功能回归，并补齐 Android 端的新建群聊入口。
    问题修复
    - 恢复群聊中同一模型绑定多个不同角色（Persona）的能力。
    - 修复添加群成员时按模型去重，导致同模型的第二个角色无法加入群聊的问题。
    - 修复成员选择器将群聊中已有模型错误禁用的问题。
    - Android 聊天页面新增“新建群聊”入口，可直接创建全新群聊。
    发布改进
    - 完善可重复执行的发布流程，重新运行构建时复用现有 Draft Release 并替换同名产物。
    - 恢复并加固 pnpm 锁文件发布流程。
    验证
    - 单元测试：186 项通过
    - Playwright E2E：9 项通过
    - TypeScript、Web 生产构建和 Rust 测试通过
    - npm audit：零已知漏洞
