  Key: ReleaseNotes
  Value: |-
    更新内容
    问题修复
    - 修复取消托管后聊天页面卡死（#19）
      - SSE 流现在能够可靠响应停止操作，不再因底层流读取挂起导致输入框永久禁用。
      - 修复托管讨论取消后剩余轮数恢复、继续自动发言的问题。
      - 修复并发生成任务互相清理停止控制器的问题。
      - 托管讨论始终固定在启动时的会话和消息分支，切换会话后也能正确取消原任务。
      - 生成异常时会正确恢复输入状态。
    - 修复 Windows 和桌面端无法删除角色（#18）
      - 角色列表新增明确的删除按钮。
      - 删除前显示确认对话框，避免误操作。
