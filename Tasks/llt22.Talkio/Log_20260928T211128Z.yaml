    - OpenAI Compatible 供应商模型检测失败(#43):Chatbox AI 等网关对非流式请求(stream 缺省)也返回 SSE,AI SDK 按 JSON 解析响应体后抛错，检测结果报 HTTP 200: data: {"object":"chat.completion.chunk", ...}。现在在传输层(fetch)把这类响应重建为标准 chat.completion JSON(内容、reasoning_content、tool_calls 按 index 合并，保留 id/model/usage),一处覆盖检测、能力探测、身份生成与上下文压缩等全部非流式调用；流式请求与非 OpenAI 风格的响应原样透传。
