    发布前完成 Mac 测试、DMG 挂载与签名完整性检查，以及 Windows 原生构建与包内容核验。Mac 为本地 ad-hoc 签名、未公证；Windows 安装包未签名。SHA256SUMS.txt 提供所有交付文件的校验值。
