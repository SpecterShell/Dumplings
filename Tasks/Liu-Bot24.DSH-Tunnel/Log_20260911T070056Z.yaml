  Key: ReleaseNotes
  Value: |-
    DSH Tunnel 0.1.8 更新了 DSH 0.1.5 系列的插件兼容，并修复 Windows 安装包中的预览插件路径。
    - Artifact Preview 升级至 0.1.8，修复新版 DSH 下预览插件无法加载的问题。
    - 支持新版会话信息结构，未激活会话中的文件也能正确定位；正文预览使用明确的会话 ID，避免关联到其他会话。
    - 保留新版 DSH 的原生交付文件卡片和打开方式，同时兼容旧版预览接口。
    - 修正 Windows 安装包仍使用旧插件文件名的问题，并增加打包路径与运行时路径一致性的回归检查。
    - 默认启动命令继续使用 npx --yes @deepseek-ai/dsh，主机和模型配置保持原有设置。
    本版已在 macOS arm64 和 Windows x64 原生构建并通过回归测试。DSH 0.1.5 会转换旧会话格式，部分旧子会话可能无法迁移；升级 DSH 前请备份或归档旧历史。客户端本身不会删除或归档用户会话。
    下载 macOS DMG、Windows Setup 安装包或 Portable 便携版；独立预览插件也包含在附件中。可使用 SHA256SUMS.txt 校验下载文件。
