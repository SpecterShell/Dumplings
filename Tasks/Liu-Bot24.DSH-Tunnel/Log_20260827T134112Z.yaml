  Key: ReleaseNotes
  Value: |-
    更新内容
    - 远程产物预览新增 PNG、JPG、JPEG、WebP、GIF 和 AVIF 图片支持。
    - 远程会话收尾回复中由 DSH 识别出的产物文件名，也可以点击预览；与底部“产物”行一样，在当前设备的新标签页打开，保留原会话。
    - 修复客户端升级后，配套插件可能因旧安装包路径失效而无法安装的问题。
    - 修复 macOS 停止本机 DSH 或退出客户端时，子进程残留导致停止失败的问题。
    升级说明
    本次客户端随附产物预览插件 v0.1.5。请在实际运行 DSH 的设备上停止 DSH，然后在客户端“设置 → 远程产物预览插件”中安装更新，再启动 DSH。插件仍为可选；未安装时不影响本机 DSH 启动。
