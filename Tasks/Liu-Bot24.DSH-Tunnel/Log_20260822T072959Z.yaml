  Key: ReleaseNotes
  Value: |-
    更新内容
    - 新增首次 SSH 连接向导：在客户端内显示并确认目标设备的主机指纹。
    - 没有可用密钥时，可输入一次目标设备账户的登录密码；密码不会保存。
    - 自动生成 DSH Tunnel 专用 SSH 密钥并安装公钥，后续连接无需再次输入密码。
    - 支持 macOS、Windows 和 Linux SSH 目标，不依赖目标系统类型。
    - 支持局域网、Tailscale、ZeroTier、FRP 等任意可达的 SSH 网络路径。
    - 使用系统 ssh -G 解析 SSH config 中的主机、用户和端口，保留现有别名配置。
    - Windows 正式构建同时提供安装版与便携版。
    - 移除 Windows 主窗口中无用的 Electron 默认英文菜单栏。
