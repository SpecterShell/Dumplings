  Key: ReleaseNotes
  Value: |-
    DSH Tunnel 0.1.9 新增访问链接复制，并让新版 DSH 优先使用原生文档预览侧栏。
    - 新增“复制访问链接”：本机 DSH 运行或 SSH 隧道连接后，可复制完整认证地址，在当前电脑的其他浏览器中打开。
    - “打开”和“复制”会验证当前服务与认证链接；旧令牌失效后重新读取启动信息，避免复制过期链接或实际无法登录的裸端口地址。
    - 支持读取其他启动器实例留下的有效认证交接记录。无法取得有效链接时，明确提示从启动 DSH 的终端获取，不会自动重启正在使用的服务。
    - Artifact Preview 升级至 0.1.9：新版具备对应读取与渲染能力时，保留原生文件入口并在右侧栏预览；旧版或尚不支持的格式继续使用兼容预览。
    - 保留原生交付卡片和正文文件引用，支持混合格式文件，不以兼容预览掩盖原生读取错误。
    本版已分别在 macOS arm64 与 Windows x64 原生构建并通过完整回归。Mac 实际验收覆盖新浏览器登录、SVG 原生预览与 Trace Insight 侧栏共存；Windows 已完成实际安装及认证接口验证。
    使用说明
    - 复制的链接包含登录凭据，请勿公开分享；DSH 重启后请重新复制。
    - SSH 链接使用当前电脑的本地转发端口，隧道断开后不可用，也不能直接拿到另一台电脑使用。
    - 升级客户端后，如预览插件仍显示旧版，请在“设置 → 远程产物预览插件”中更新，再启动 DSH。
    下载 macOS DMG、Windows Setup 安装包或 Portable 便携版；需要单独安装预览插件时使用附件中的 .tgz。SHA256SUMS.txt 可用于核验全部下载文件。
