  Key: ReleaseNotes
  Value: |-
    DSH Tunnel 0.1.10 随配套 Artifact Preview 0.1.10 更新了 DSH 兼容版本声明，已验证与官方默认的 DSH 0.1.5-rc.2 配合使用。本次为兼容性维护版本，启动器的复制访问链接和原生侧栏优先预览功能保持可用。
    - 提供 macOS arm64 DMG、Windows x64 Setup 安装包及 Portable 便携版。
    - 升级客户端后，可在“设置 → 远程产物预览插件”中更新配套插件；独立 .tgz 也包含在附件中。更新插件后重新启动 DSH Web。
    - 客户端沿用现有主机、模型和会话配置；DSH 引擎由各设备单独安装。
    Mac 与 Windows 均已安装验证。下载后可用 SHA256SUMS.txt 核对附件完整性。
