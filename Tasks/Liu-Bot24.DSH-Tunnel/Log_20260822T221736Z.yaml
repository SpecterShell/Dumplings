  Value: |-
    更新内容
    - 远程 DSH WebUI 地址会携带产物预览标记，可与独立的 DSH Artifact Preview 插件配合，让远程 HTML、HTM 和 SVG 产物在当前操作设备的浏览器中打开。
    - 本机 DSH 地址保持原有行为，不增加远程预览标记。
    - 修复首次 SSH 配对完成或连接关闭时，延迟到达的 socket 错误可能触发未捕获异常的问题。
    - Windows 安装版与便携版均由 0.1.2 正式源码重新构建，主窗口不显示 Electron 默认菜单栏，系统托盘菜单保持可用。
