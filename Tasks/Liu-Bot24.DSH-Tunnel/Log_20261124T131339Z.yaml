  Key: ReleaseNotes
  Value: |-
    DSH Tunnel 0.1.13 内置 Artifact Preview 0.1.13。配套插件支持 DSH Web 0.2.2-rc.5 和 0.2.1-rc.2，可在远程会话中使用原生 HTML、SVG、PNG 预览和 AVIF 兼容预览。
    - macOS Apple Silicon 用户下载 DMG。它使用本地 ad-hoc 签名，未经 Apple 公证。
    - Windows x64 用户可选择 Setup 安装版或 Portable 便携版。两种安装包均未签名。
    - 远端 DSH 主机可单独安装 dsh-plugin-artifact-preview-0.1.13.tgz。在运行目标 DSH 的设备上用 dsh plugin --profile web add <安装包完整路径> 安装，然后重启 DSH Web。
    SHA256SUMS.txt 提供上述文件的校验值。
