  Key: ReleaseNotes
  Value: |-
    DSH Tunnel 0.1.7 改进了新版 DSH 的 WebUI 认证、启动配置和产物预览。
    - 支持通过 SSH 隧道打开需要认证的 DSH WebUI，并沿用系统 OpenSSH 的主机别名和密钥配置。
    - 设置中可自定义 DSH 启动命令；默认仍为 npx --yes @deepseek-ai/dsh。
    - Artifact Preview 升级至 0.1.7，修复 DSH 0.1.2-rc.1 的正文与底部产物预览，并保留 0.1.1-rc.2 的接口兼容。
    - 改进插件隔离安装、macOS 打包依赖和非交互 SSH 环境下的 Node.js 查找。
    本版已在 macOS arm64 和 Windows x64 构建并测试，验证覆盖 DSH 0.1.2-rc.1 的认证、跨设备连接和 HTML / SVG / 位图预览。未验证 DSH alpha 版本。
    下载 macOS DMG、Windows Setup 安装包或 Portable 便携版；独立预览插件也包含在附件中。可使用 SHA256SUMS.txt 校验下载文件。
