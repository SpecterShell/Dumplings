  Value: |-
    The first release.
    - Add any folder and see every image in it, subfolders included, in one justified grid, at four sizes.
    - Rate images 1 to 5 stars, and tag them with colored tags.
    - Search by name, folder and tag, and filter by tag, file type, orientation and rating.
    - Save any search as a smart folder.
    - Untagged and Unrated views of what’s left to sort.
    - Separate libraries, each with its own folders, tags, ratings and smart folders.
    - Dark, grey and light themes, two high-contrast ones, or follow the system, with an accent color of your choice.
    - No account, no cloud, no tracking, and your files are never changed.
    - A free trial: every feature for 14 days of use.
