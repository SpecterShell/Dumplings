  Value: |-
    - AI Empowerment
      - Supports AI-generated attack reports
      - Supports AI-powered analysis of process information
      - Provides AI-powered real-time event analysis in pop-up prompts to support decision-making
    - AI Integration: Supports enabling MCP server
      - Supports rule editing and creation
      - Supports event viewing and generation of more customized attack reports
    - Added accurate detection of Silver Fox injection
    - Added accurate detection of Silver Fox Payload downloads
    - Event timeline supports export
    - Improved built-in rules
    - Processes support cleanup of already terminated processes
    - BitsDownload supports display of downloaded URLs
    - Trust list supports registry value data fields
    - Fixed UI freeze issue when closing the interface
    - Fixed potential crash issue caused by conflicts with certain software that enables ImageTlsCallbackCaller during injection
    - Other experience optimizations and bug fixes
