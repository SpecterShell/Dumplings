  Key: ReleaseNotes
  Value: |-
    - Optimized the large model API to support more models
    - Optimized MCP to support more tools
    - Added Stack Spoofing detection
    - Added Module Stomping dynamic execution detection
    - Added detection for Bind Link Redirection attacks
    - Added simple remediation support (support for blocking process startup and blocking process network access via response)
    - Added fast process rule support to process management
    - Improved and optimized built-in rules
    - MCP now supports viewing events by date and by process
    - Fixed other issues and improved the user experience
