- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Major release — upgrade recommended
    - Added activities view for process monitoring
    - Added attack timeline and attack graph visualization for events
    - Added attack tracing and object correlation
      - Service creation detection and correlation
      - Scheduled task execution detection and correlation
      - Shortcut launch detection and correlation
      - Archive extraction correlation
    - Added process tree segmentation
    - Added phishing website blocking
    - Added hardware breakpoint detection
    - Improved Indirect Syscall detection
    - Improved Shellcode detection
    - Network file modifications now display the initiating process
    - Downloaded files and BitsDownload events now display download source
    - Improved DumpLsass detection
    - Performance optimizations
      - Improved file, registry, network, scheduled task, and other extended event handling
      - Improved module loading signature verification
      - Improved process reputation evaluation
    - Enhanced antivirus engine to reduce false positives
    - Refined built-in rules
    - Other bug fixes and usability improvements
    Download Directly Download from Github Download from GoogleDrive
