  Value: |-
    DreamPaper v0.2.1
    自本版本起 Web 界面暂时停止维护，只维护桌面端（Windows 安装包 / 便携包、macOS、Ubuntu 22.04 及以上的 .deb）。仓库里的网页入口仍可在本地打开，但不再随版本修 bug 或加功能；下面的行为以桌面端为准。
    Linux Debian 发布、全局简单模式，以及适配 grok2api v3 的 Grok 搜索协议。
    - Linux 发布（Ubuntu 22.04 及以上，x86-64）。.deb 在 Ubuntu 22.04 上构建，以便 glibc 能在 22.04 和 24.04 上加载。包内含 OCR 辅助进程、ONNX Runtime、内置字体与提示词，Depends 声明 libwebkit2gtk-4.1-0、libgtk-3-0 与 libgomp1。仅发布 x86-64，不提供 RPM 与 AppImage。
    - 简单模式（Simple Mode）。顶栏新增全局开关，对科研图与幻灯片同时生效：仍走 design（与可选 search）链路，但不调用制图模型，也不需要 implement 凭据。结果卡片的「生成过程」里多出一行「最终制图提示词」——就是本应交给制图模型的完整提示词，科研图一条，幻灯片全部页面按页码排列，保留换行并支持一键复制。开关随任务快照写入请求，重跑历史任务使用当前开关，已开始的任务不受切换影响。
