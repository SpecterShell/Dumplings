      - @chr331：Caps Lock 标点、全拼简拼混合输入的候选排序
      - @muxueqingze：日语候选排序、nn 转换
      - @Tokisaki-Galaxy：AI 模型查询、Custom 提供商、热力图修复
      - @houko：国内镜像下载、SignPath 签名
      - @AkaneIwasa：中日英三语轮换
      - @xiaozhu1337：Vim 模式
      - @Ehtasham-Yasin：Shift+Enter 上屏全拼
      - @imluyg：标点上屏丢失已选词
      - @Hush-Jr：悬浮工具栏跨屏拖动
      - @normaltank：Emoji 候选排到末尾
      - @Neptrue-Lin：Emoji 混输默认关闭
    - 问题反馈：#612、#624、#637、#640、#641、#658、#662、#692、#731、#735、#747、#789、#821 的各位报告者
