  Key: ReleaseNotes
  Value: |-
    v0.10.0 更新内容
    📚 词库：中译英释义大更新
    - 本地中文词库基本都用 DeepSeek 重新翻译了一遍，共 912,640 条中译英释义，保留全部义项和词性，不再只留两个义项。打开候选翻译后，大部分词都能直接看到英文释义。(词库仓库 msime-dictionary，#784)
    - Ctrl+Enter 上屏译文时会自动去掉 n.、adj. 这类词性前缀，上屏的是 silver medal，不是 n. silver medal。(#784)
    - 翻译里的词性和分号单独配色，内置皮肤都配好了颜色，外部皮肤也可以自己设置。(#848)
    - 候选翻译的目标语言新增泰语、越南语和意大利语。(#694)
    - 新安装默认使用小牛翻译。(#836)
    ✨ 新功能
    AI 辅助
    - 设置页可以直接查询服务商提供的模型列表，新增「测试连接」，还新增了 Custom 提供商，可以接入自己的 OpenAI 兼容服务。(感谢 @Tokisaki-Galaxy，#711)
    - 模型框改成下拉框，也可以直接输入模型名；列表为空时点下拉箭头就会查询。(#829, #837, #841)
    - AI 联想和语音润色可以设置 DeepSeek 的思考强度（关闭、低、高、最高），这个选项只在选择 DeepSeek 时显示。(#824，对应 #821)
    - 隐私保护：AI 联想不会再把密码框和 PIN 输入框里的内容发出去；切换到其他应用时清空上下文；发送前会过滤掉看起来像密码或密钥的字符串。(#845)
    安全
    - config.toml 里的 API 凭证（翻译、语音、AI）改为用 Windows DPAPI 加密保存，升级后旧的明文凭证会自动转成密文，不需要重新填写。(#840)
    输入
    - 中日英三语轮换：「输入模式」新增「三语轮换」，用切换语言的快捷键按中文、日文、英文的顺序循环切换。(感谢 @AkaneIwasa，#717)
    - Vim 模式（默认关闭）：在 config.toml 的 [input] 段配置 vim_mode_apps，在 VS Code、gVim 等指定的应用里，按 Esc 退出插入模式时会同时切换到英文。(感谢 @xiaozhu1337，#737，修复 #735)
    - 双拼下按 Shift+Enter 上屏转换后的全拼，比如 nihc 上屏 nihao。(感谢 @Ehtasham-Yasin，#642，修复 #640)
    - 打开 Caps Lock 时，标点自动切换为英文；关闭后按当前的中英文模式恢复。打开期间也可以用 Ctrl+. 手动改回中文标点。(感谢 @chr331，#771, #796，修复 #731)
    - 五笔「四码唯一自动上屏」和「顶字」各新增一个设置开关，默认都开启，和之前的行为一样。(感谢 @jsfaint，#675)
    - Emoji 和颜文字候选改到候选列表末尾，不再挤占汉字候选。(感谢 @normaltank，#677，修复 #658)
    神经网络整句
    - 效果优先模型（desktop）改为在设置页按需下载，安装包因此变小。设置页还支持导入、删除，以及用浏览器下载。(#838)
    设置与界面
    - 帮助页新增「默认输入法」，可以一键把水杉设为系统的默认输入法。同时新增 Wiki、FAQ 和官网链接。(#802, #807)
    - 更新提示新增「国内镜像下载」按钮，可以从 dl.msime.app 下载安装包，速度更快。(感谢 @houko，#706)
    - 悬浮工具栏改用与候选窗相同的柔和阴影；开着阴影也能贴住屏幕边缘；阴影可以在设置中关闭。(#809)
    - 快捷键页补全了之前没有列出的快捷键，比如 Ctrl+Enter 上屏译文、Shift+Enter 提交拼音、Ctrl+Shift+E 切换英文候选模式。(#794)
    - 新增外部皮肤「微信玻璃」。(感谢 @jsfaint，#732)
    - 豆包语音识别设置中可以填写 Resource ID。(感谢 @ouchihao，#648，修复 #641)
    新安装的默认配置（老用户升级不受影响）
    - 默认皮肤改为 fluent 横排；默认中文输入；辅助码、Emoji 和颜文字模式、Emoji 混输、语音输入、AI 辅助默认都关闭。(#659, #793, #847)
    ⚡ 性能
    - 神经网络打分一次处理 8 行，固定长度候选下键盘模型从 30.1 ms 降到 22.8 ms。(感谢 @luojiyin1987，#638，修复 #637)
    🐛 问题修复
    输入
    - 修复部分选词后输入标点，已选的词会消失的问题。比如 nihao 选了「你」再按逗号，之前只上屏「好，」。(感谢 @imluyg，#769，修复 #747)
    - 全拼和简拼混合输入时，按原样匹配的词排在纠错结果前面。比如 kandy 首选「看电影」，gaizenmb 首选「该怎么办」。(感谢 @chr331，#827，相关 #789)
    - 「声母 + 完整拼音」的简拼不会再被当成手误纠错，比如 ywen、sshang。(感谢 @ouchihao，#650，相关 #624)
    - 日语：
      - 完整读音的转换结果排在前缀预测前面，比如 hashi 首选「橋」，shin'you 首选「信用」。(感谢 @muxueqingze，#667)
      - nn 按一个「ん」转换，比如 rennai 得到「恋愛」。(感谢 @muxueqingze，#669，修复 #662)
    - 悬浮工具栏显示的大小写状态不再和 Caps Lock 实际状态相反。之前长按 Caps Lock 或锁屏后会出现这个问题。(#822)
    - 候选文字里的逗号和私用区字符可以正常显示了。(感谢 @luojiyin1987，#766)
    - 只有页码或翻页箭头状态变化时，候选窗也会正常刷新。(感谢 @luojiyin1987，#834)
    设置页和运行环境
    - 修复部分用户打不开设置页的问题：
      - 安装器要求的 VC++ 运行库最低版本提高到 14.40；缺少依赖时，点「是」直接下载安装包。
      - WebView2 启动失败时，设置页会弹框说明原因。
      - 选择了 WebView2 候选窗但电脑上没装 WebView2 时，会临时改用 D2D 候选窗，仍然可以正常打字。
      (#801)
    - 双屏且两块屏缩放比例不同时，悬浮工具栏可以在两块屏之间正常拖动，不会再被拉回原来的屏幕。(感谢 @Hush-Jr，#657)
    - 修复 D2D 原尺寸图片发虚的问题。(感谢 @ouchihao，#649，修复 #612)
    - 输入统计的日历热力图默认滚动到最新日期，月份标签不再重叠。(感谢 @Tokisaki-Galaxy，#696，修复 #692)
    - 手写板「撤销」按钮的图标不再显示为方框。(#749)
    - 语音设置中，选择豆包以外的服务商时，不再显示豆包的鉴权方式。(#746)
    - 直接辅助码的说明更准确：三码字优先，四码词优先。(#753)
    🔧 开发与构建
    - 正式发布已接入 SignPath 签名，并在 GitHub 托管的 runner 上构建。(感谢 @houko，#709)
    - CI 的引擎编译加了 sccache 缓存；sccache 不可用时自动退回 MSVC。(感谢 @luojiyin1987，#770, #832)
    - 本地打包可以直接从 msime-dictionary 源数据构建词库，第一次运行时缺少的依赖会自动安装。(#654, #784, #823)
    - Server 记录按键处理每个阶段的耗时，方便定位吞字和卡顿。(感谢 @jsfaint，#643)
    - 删除 Server 进程里已经用不到的设置窗口代码，约 2500 行。(感谢 @jsfaint，#764)
    ⚠️ 升级须知
    - 效果优先神经模型不再随安装包附带。如果你之前开启了这个模型，升级后旧的模型文件会被清掉，需要到设置页重新下载一次，开关状态会保留。
    - API 凭证已改为加密保存。如果降级到 v0.9.x，旧版本读不了加密后的凭证，需要重新填写。把 config.toml 复制到其他电脑或账户后，也需要重新填写。
    🙏 感谢
