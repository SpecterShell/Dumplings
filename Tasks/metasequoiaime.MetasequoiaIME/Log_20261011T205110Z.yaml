  Key: ReleaseNotes
  Value: |-
    v0.10.1 更新内容
    ✨ 新功能
    全拼更准
    - 模糊音的候选和原读音按词频一起排序。之前模糊音的候选要排在原读音的所有字（包括生僻字）后面，现在会混在一起按常用程度排。比如开了 in/ing 模糊音后输入 min，结果是「民 明 名 命 敏…」。整句候选也会用模糊音，lin 能打出「另一边」。(#860)
    - 切分方式有歧义时，看哪种组成的整句更通顺。比如 yibananzhao 首选「一般按照」，不再是「一把南朝」；fang'an / fan'gan 这类 n/ng 分界的情况也一样处理。预编辑会按首选候选显示分词。(#859)
    - 修复合法的全拼被当成手误纠错：比如 zaijinuta 不再显示成 zai'ji'nut'a，选「再」之后也不会再丢掉 j。(#859)
    候选窗
    - 新增「候选窗口按文字收紧宽度」开关：打开后去掉候选窗的最小宽度，候选很短时右边不会留下一大块空白。外部皮肤也可以用 [candidate_window] fit_content 开启这个效果。(#858)
    - 混输时，最匹配的那个 Emoji 放在首页最后一位，其他 Emoji 仍然排在所有候选后面。v0.10.0 把 Emoji 全部放到末尾后，候选一多基本就看不到了。(#853)
    🐛 问题修复
    - 升级后任务栏的输入法图标不再变成「简体」两个字。(#863)
    - 「设为默认输入法」改为把水杉排到「中文（简体）」键盘列表的第一位，和系统设置里显示的一致，按 Win + Space 切到中文时也是水杉。卸载时会清理之前写入的「替代默认输入法」设置。(#862)
    - 开启中日英三语轮换后，点悬浮工具栏的语言按钮也会按「中 → 日 → 英」循环切换，不再跳过日语。(#857)
    - 新安装默认关闭候选词翻译。(#855)
    - 辅助码表补充了「瑠」和「弔」。(#856)
