  Key: ReleaseNotes
  Value: |-
    v0.13.2 更新内容
    🐛 问题修复
    - 字母词不再抢掉常用词的首选：以声母结尾的输入，首选会先给常用词，比如全拼 zhel 先出「这里」，nab 先出「那边」，双拼小鹤 vin 先出「智能」。字母词（T 恤、浙 L、用户自己加的字母词等）现在默认放在首页最后一个普通候选的位置，不会挤掉英文、emoji、云和 AI 候选，也不会挤掉你固定了位置的候选。(感谢 @enshulv，#1374、#1377，修复 #1370)
    - 字母词要打全第一段字母才会补全：比如打到 nabla 才出「Nabla 算子」，小鹤打到 vingic 才出「智能 IC 卡」。「卡拉 OK」要把 kalaok 打全才出，只打 kala、kalao 不再出现。(感谢 @enshulv，#1377)
    - 符号混输的符号也挪到首页末尾：开了符号混输后，第一个符号不再紧跟在首选后面，改放到首页最后一个普通候选的位置。比如 jt 的「→」、alpha 的「α」。这样 jt（今天）、sx（实现）这类常用词不会被挤到第三位。(感谢 @enshulv，#1377)
    - 减少杀毒软件误报：自带的几个 EXE 补上了版本信息（公司、文件描述、版本号等）。之前这些信息是空的，SentinelOne 等安全软件会误报，比如把表情面板判成恶意文件。新增误报处理文档，说明怎样按签名者和安装路径加白名单。(感谢 @jsfaint，#1404，修复 #1403)
    🔧 开发与构建
    - 升级 CI 用到的 GitHub Actions 版本。(#1362)
    🙏 感谢
    - 贡献者：@enshulv（字母词与符号的位置、补全门槛）、@jsfaint（EXE 版本信息、误报文档）
    - 问题反馈：@boypt (#1370)、@jsfaint (#1403)
