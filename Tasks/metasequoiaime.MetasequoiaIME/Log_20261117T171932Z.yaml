  Key: ReleaseNotes
  Value: |-
    v0.14.1 更新内容
    ✨ 新功能
    - 候选词翻译支持哔哩哔哩 Index-Translate：免费，不需要填 API Key。在「在线翻译服务」里选「哔哩哔哩」，可以选 2B、9B、35B-A3B 三种模型。新装用户默认使用它；升级的用户保持原来的翻译服务，候选词不会被自动发给新的服务。候选词翻译本身仍然默认关闭。(#1549)
    🐛 问题修复
    - 修复「数据同步」页无法配置的问题：0.14.0 里同步目标的三个选项可以同时勾上，点了也不切换下面的设置项。现在可以正常选择 WebDAV 或 S3。(感谢 @Tokisaki-Galaxy，#1548，修复 #1542)
    - WebDAV 不用再先在网盘里建文件夹：坚果云直接填 https://dav.jianguoyun.com/dav 就行，数据写在它下面的 msime 目录里，第一次上传时会自动创建。没开启同步时也能先点「测试连接」验证地址和账号。(感谢 @Tokisaki-Galaxy，#1548)
    - 「测试连接」的提示更明确：地址写错时提示「地址不存在」，不再显示 HTTP 409 Conflict；没有权限和服务暂时连不上，也会分开提示。(感谢 @Tokisaki-Galaxy，#1548、#1550)
    - 修复统计页在调整显示缩放后，可能访问已经释放的内存的问题。(感谢 @Tokisaki-Galaxy，#1548)
    🙏 感谢
    - 贡献者：@Tokisaki-Galaxy（修复数据同步页、改进 WebDAV 连接测试）
    - 问题反馈：@liu7say (#1542)、@zqusky (#1541)
