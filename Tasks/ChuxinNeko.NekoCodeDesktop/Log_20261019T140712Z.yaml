  Key: ReleaseNotes
  Value: |-
    NekoCode 0.1.6
    自 0.1.5（1477f0d）至 d33ad5d。
    对话
    - 工作过程改成按阶段展开的时间线，标题直接说明正在读哪个文件、改哪段代码。当前阶段会有闪烁提示，两步之间才显示「规划下一步」。
    - 模型选择和思考深度合并到同一个菜单。深度拉到最高时有灯阵和涟漪效果；切换模型后深度会自动对齐该模型支持的档位。
    - 编辑文件时，输入框上方出现实时胶囊，显示改了几个文件、增加和删除了多少行。悬停可以预览差异，完成后摘要留在对话里，跟着消息一起滚动。
    - 选中助手回复中的文字后，可以解释、改进、缩短、调整语气、修正语法，或用自定义指令发起下一轮。解释在弹窗里继续追问，不会写进主会话。
    - Markdown 里的 Mermaid 图可以直接渲染。
    - 右侧停靠栏新增本回合差异，点开某个已编辑文件即可查看。代理地图改为画布视图。
    - 每轮结束后可以预测下一条输入。团队成员可以上传头像。欢迎页按时间问候，并提供了解项目、构建功能、修复问题等快速开始。
    - 回复被截断或中断后，长时间任务可以接着做完。会话历史很多时，列表不再把界面卡住。
    界面
    - 首次启动增加引导：外观、模型、代码智能和 GitHub 可以在引导里直接配好。
    - 首页是会动的 ASCII 背景，主题色字母组成角色。
    - 支持 Wallpaper Engine 壁纸。开启后标题栏、侧栏、设置和菜单使用玻璃材质，并保证文字对比度。关闭壁纸后恢复原来的表面。
    GitHub 与评审
    - 可以用浏览器或设备码连接 GitHub App，授权时会确认仓库是否已经装上。
    - 原来的 Pull Request 面板换成 GitHub 工作台，可以查看代码、讨论和 Actions。
    - 评审视图接近 GitHub Desktop：切换分支，fetch、pull、push，勾选文件提交，amend、撤销、丢弃，查看历史和对比。可以用当前模型生成提交说明。同步和提交会显示进行中、成功或失败原因。
    远程桌面
    - SSH 主机可以启用隔离沙盒。桌面、命令、终端和文件传输共用这个沙盒，保存后自动检查并部署。可以暂停或重置，重置前需要先把要留的文件下载下来。
