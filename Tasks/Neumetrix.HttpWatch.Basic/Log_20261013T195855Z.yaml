  Key: ReleaseNotes
  Value: |-
    - Fixed: HttpWatch could crash when the Filter dialog was closed
    - Fixed: The installer could fail with 'Failed to open key ...\CurrentVersion\Run, Access is denied' on PCs where changes to that registry key are blocked, for example by security software
    - Improved: Toolbars and tabs now look better when Windows is running on high DPI monitors or display scaling is above 100%
    - Improved: When auto-record is on, the Chrome and Edge extensions now record the first network request when a new tab or window opened
    - Updated: The operating system shown for a log now includes the release name for more versions of Windows 10 and 11, such as Windows 11 version 24H2 and 25H2, instead of just a build number
    - Updated: The installer now includes the version 16.2.6 CRX files for the Chrome and Edge extensions
