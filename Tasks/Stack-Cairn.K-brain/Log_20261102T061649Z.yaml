    K-brain v0.107.7
    本版从 main 的 637efbf 构建，作为 LiveAgent v2.0.0 正式版的配套后端。
    更新
    - 桌面端 Bash 工具运行中推送输出快照（tool.status，协议不变），LiveAgent 可实时显示编译进度等命令输出（Stack-Cairn/LiveAgent#975）。
    - 运行输出节流：同一调用最多每 500ms 一次、单次最多 4 KiB，tool.result 之后不再发送；会话历史仍只保存最终结果。
    下载与校验
    提供 macOS、Linux、Windows 的 x64/ARM64 CLI 与 computer helper，共 12 个二进制；SHA256SUMS 用于校验下载文件。
    跨平台构建工作流通过。发布的 macOS ARM64 CLI 已验证 SHA256 校验与版本输出（k-brain v0.107.7）；其他平台不等同于完整真机验收。
    完整变更
