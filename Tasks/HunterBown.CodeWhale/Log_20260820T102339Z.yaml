    - Lstarsky0 (@Lstarsky0) — docs/constitution and docs/runtime-api follow the same dictionary spine: 28 inline isZh branches become typed English and Chinese dictionaries held to key and token parity, while the other sixteen locales keep the English fallback (#5517, a further phase of #5337).
