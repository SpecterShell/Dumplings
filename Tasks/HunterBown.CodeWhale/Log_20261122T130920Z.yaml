- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Codewhale v0.10.3 brings a unified Plugins surface with Creator mode ([features] plugin_creator) and unmodified DeepSeek Harness (@deepseek-ai/dsh-*) plugin compatibility, an upgraded Auto-Review guardian with workspace boundaries, soft rules, sub-agent return review, and one-use retry approvals, and a single Shift+Tab permission dial defaulting to Accept Edits (Ask → Accept Edits → Plan → Auto-Review → Full Access). It moves the ACP server and external-agent sessions (including Qwen Code and GitHub Copilot CLI) onto the official Agent Client Protocol SDK, publishes native signed HarmonyOS ARM64 release assets, adds a verified signed model-and-provider registry channel alongside unified model-ID resolution and managed /v1/models pricing, updates design tokens to 5.4.0 with a docked single-line approval strip, folded turn activity, live working-row light sweeps and 13 hex-lattice dot-whale forms, adds claude-org billing auth, show_data transcript charts, codewhale sessions migrate, DeepSeek Chatbot web search and speech tools, receipted self-updates and codewhale uninstall, and lands reliability, CJK/Unicode, Windows, and sandbox security fixes.
    Added
    - Added LLMTR as an OpenAI-compatible provider with live model discovery.
    - External-agent sessions can discover 25 installed agent CLIs. Set CODEWHALE_CUSTOM_ACP_AGENTS to include your own ACP-compatible command in the same picker. (CW-7942)
    - Read-only deferred tools: Auto-Review recognizes local inspection tools and task or automation reads without prompting for routine lookups. Thanks @NieZhuZhu. (#7431)
    - A quieter terminal launch: a compact Desktop-inspired whale shares the composer accent. Recent sessions open on demand, and MCP sign-in details stay in the connection manager. (CW-8318)
    - Exact route inventory: model lists separate metadata, observed roster evidence and readiness; optional session selections reject changed account or endpoint bindings, and the terminal shows the catalog status from that same route inventory, including on bundled fallback rows. A new Runtime thread can commit an exact selection before it becomes visible. Empty discovery no longer masquerades as a failed refresh. (CW-8311)
    - DSH reviewed client module map: CommonJS client activation uses the installer’s admitted import edges for relative modules, JSON, cycles and contained package exports. Undeclared requests fail closed, and prior compatibility receipts require review again. Installed Engine/App qualification remains pending (CW-8288, CW-8014, CW-8019).
    - An explicitly scoped child can request a read from an operator-declared static HTTP connector with a matching account binding, schema and approved arguments. Connector refreshes preserve the child’s authorized tool catalog.
    - SearchApi web search provider: web_search now supports SearchApi ([search] provider = "searchapi", SEARCHAPI_API_KEY or [search] api_key) for Google organic results with hl, gl, and time_period filtering. Thanks @gabsferreira (#7410).
    - Crisper 980-dot whale and activity forms in /pet: the terminal pet's 980 dots now compile from perimeter-anchored hexagonal-lattice silhouettes with rorqual throat illumination at rest and cleaner edges across all thirteen running, waiting and done forms, while keeping zero motion under Hold still and Reduce motion. (CW-6453)
    - Terminal and website design tokens updated to 5.4.0: vendored codewhale-design 5.4.0 and codewhale-ratatui 5.4.0 roles (Subagent and LivePeak), exported the updated 5.4.0 CSS custom properties to the website (web/app/tokens.css), fixed adapt_fg_for_depth ANSI-16 appearance awareness (bright 9–14 on dark, dark 1–6 on light) so warnings and status lines stay legible on light 16-color terminals, and preserved green/red hues (22/52 dark, 158/224 light) on 256-color diff line backgrounds. (CW-8264)
    - CNY pricing for custom models: [[custom_models]] entries accept cost_currency = "cny" (default usd, case-insensitive; unknown values fail at load) so /cost, /tokens and the status line estimate a CNY-priced custom model in yuan instead of labelling the rates USD. The picker excludes these yuan prices from its USD ranking (CW-8037).
    - DSH plugin parity gaps closed: codewhale plugins import dsh <PATH> reviews a DeepSeek Harness package and codewhale plugins import dsh approve <PATH> <HASH> installs exactly that reviewed content, disabled and untrusted; DSH plugins may now listen on tools/post-execute as read-only observers that see the tool name and call id, whether the call failed and how long it took, plus the session's workspace, mode and model — never the call's arguments or output; the plugins.item, plugins.detail.actions and plugins.detail.badge client slots render on the plugin detail seat; reviewed CSS, SVG, image and font files in a DSH client are served (SVG under a sandboxing content security policy); and pnpm-style confined node_modules directory symlinks are materialized into a symlink-free staged copy at install.
    - CNY pricing for custom models: [[custom_models]] entries accept cost_currency = "cny" (default usd, case-insensitive; unknown values fail at load) so /cost, /tokens and the status line estimate a CNY-priced custom model in yuan instead of labelling the rates USD (CW-8037).
    - Muse Code as an external agent: Codewhale now discovers an installed Meta Muse Code CLI (muse) and drives it over ACP through @bex-co/muse-code-acp (muse-code-acp, with MUSE_CODE_EXECUTABLE and muse login), listing it in GET /v1/agents/external alongside Claude, Codex, Antigravity, and other installed agents.
    - Single-line docked TUI approval strip: approval prompts now dock as one line directly above the composer with a leading amber edge glyph (⛯), concise verb and truncated command summary, Allow (y/1, or Enter when selected), Deny (n, or Enter by default; Esc cancels the turn or closes an open menu), m to open an upward scope menu (Allow once, Allow in this conversation, and Always allow in this repo with its .codewhale/permissions.toml rule pattern shown only there), and d or Tab to expand diff/command details upward on demand; after a decision, a one-line settled receipt (Allowed once · <command>, Denied · <command>, or Always allowed in this repo · <pattern>) is appended to the transcript. (CURRENT_DECISIONS §225)
    - Connect your Claude organization from the desktop: the app server's browser-connect routes (POST/GET/DELETE /v1/providers/anthropic/connect) now link a Claude Platform organization the same way they connect OrcaRouter, and select auth_mode = "claude-org" once the link finishes; the provider row offers it with browserConnect only while the account reports Claude organization billing as available. A link declined in the browser ends the attempt as declined, and saving or clearing an Anthropic API key stops a waiting attempt; saving one switches back to that key. (CW-8258)
    - Claude organization billing (auth_mode = "claude-org"): link a Claude Platform organization to your Codewhale account with codewhale account claude-org link (status and unlink too), set auth_mode = "claude-org" under [providers.anthropic], and Anthropic bills that organization directly. Each request sends a short-lived connection token from the Codewhale control plane as Authorization: Bearer with the version the control plane names, never an x-api-key; the token is refreshed two minutes before expiry and once after a 401. When the control plane names a Claude user profile, requests also carry its profile header, the user-profiles billing beta and a billing_policy that bills that profile. Not signed in, not linked, a link that ended, an organization that cannot be billed, and a spend cap or credit stop each get their own message and next step, and billing stops are never retried. A session provider key still takes precedence. API-key users are unchanged; the control-plane routes are not deployed yet. (CW-8258)
    - Owner-held client jobs and progress on running work: a POST /v1/threads/{id}/jobs body may set owner_keepalive_seconds and deadline_at; the Engine stops the job with its whole process group when the owner stops calling the new POST /v1/threads/{id}/jobs/{job_id}/keepalive or the deadline passes, and the job and its keyed operation record say why (stop_reason: owner_lost or deadline). GET /v1/threads/running now lists each thread's running jobs and a last_progress_at, and counts a thread whose only work is an owner-held job, so a remote computer is not slept under a live job and an orphaned one cannot run forever (CW-8260).
    - Models and providers guide: docs/MODELS_AND_PROVIDERS.md now explains in one place how Codewhale knows providers and models — how model ids, short names, prefixes and custom endpoints resolve, how context windows, output limits, capabilities and prices follow that choice, how to add a model or an OpenAI-compatible provider without code changes, and how signed registry.json updates are checked — with the provider, configuration, catalog-refresh and cloud-facts pages linking to it instead of repeating separate lists. (CW-8247)
    - Gemini 4 Hydrogen: Google's gemini-4-hydrogen is in the catalog and the Google model list, with a 1,048,576-token context window and 65,536 output tokens. The shut-down gemini-3-pro-preview leaves the Google list.
    - Gemini 4 Neon: gemini-4-neon is in the catalog and the Google model list with its real limits — a 1,048,576-token context window, 65,536 output tokens, reasoning with low/medium/high/xhigh thinking levels, and reference pricing ($3 input / $15 output / $0.15 cache-read per 1M tokens). Provider roster rows previously showed a guessed 128K window, no reasoning, and no price for it.
    - Hybrid Claude bundles: the Claude plugin compatibility page now shows a worked example, deja-vu's Codewhale bundle, that installs its manifest, .mcp.json, skills and commands with /plugin install and wires lifecycle hooks separately in ~/.codewhale/config.toml, since the importer rejects hooks; hooks there are your own shell commands and run outside plugin review. Thanks @vshulcz (#7346).
    - Plugins Command filter and bundle details: the terminal Plugins screen adds a Command filter listing your hand-written slash commands (~/.codewhale/commands/ and trusted project commands, excluding commands contributed by plugins), /plugin show lists the commands and profiles a plugin adds, and the README and its 18 translations rename the Extensions section to Plugins.
    - Allow rules in Auto-Review: a narrow allow rule (an exact command) now skips the Auto-Review reviewer; broad rules such as any shell command, any python, npm run or starting agents are paused while Auto-Review is on and come back when you leave it; auto_review.review_all_shell sends every shell command to the reviewer. (CW-8175)
    - Auto-Review reviewer: the reviewer now judges each action against what you typed and the project's instructions (never against tool output), so a specific request clears it and a stated limit such as "don't push" blocks; choose its model with auto_review.reviewer_model.
    - Multi-task background shell waiting (task_shell_wait): task_shell_wait now accepts task_ids and until (any or all) to poll or wait on multiple background shell commands together while keeping task_id for single-task waits, cancel=true, and gate evidence.
    - Auto-Review test and build runs: Common workspace test and build commands (for example python3 -m unittest, pytest, npm test, go test, and cargo clippy), including forms ending in 2>&1 or >/dev/null and a trailing head, tail, or literal grep filter, now run in Auto-Review without escalation, and Auto-Review block messages explain how to take a safer route or switch Permissions to Ask. (CW-8148)
    - /plugin create [idea]: /plugin create [idea] starts a new conversation in Creator mode with your idea typed in the message box, and sends nothing. A plugin named create is shown with /plugin show create.
    - Creator mode inspection tools: wire DeepSeek Harness's unmodified tool-cordis in the built-in creator module (cordis_inspect_list and cordis_inspect_query), serving live host services, events, plugin config schemas, caller-accessible tools, and plugin seats as approval-free Auto inspection tools in Creator mode. (CW-8077)
    - Plugin creator: a new built-in row on the Plugins page and a [features] plugin_creator key, on by default. It hosts DeepSeek Harness's own plugin_manager tool, unmodified, in Codewhale's built-in host process, which runs with the extension-host switch off, and makes Creator mode available whenever [features] plugin_creator is on and a Node.js or Bun runtime is found. (CW-8091)
    - Plugin audit and attribution: /plugin list, /plugin show, the Plugins screen and GET /v1/apps/plugins now show who approved and enabled each plugin, when it was reviewed with its review history, its reach outside the project, and its host services; a session-start notice lists active agent-approved plugins, and thread receipts count plugin changes. (CW-8084)
    - Required plugin connectors checked at install: installing or enabling a plugin whose MCP connector is required (DSH failOnStartupError: true) commits enabled = true on disk and connects the connector on an isolated pool fork, returning application: "failed" at stage: "enable" with the connector diagnostic while keeping the plugin enabled and defined on disk when the connection fails or is cancelled. (CW-8075)
    - Creator loop acceptance tests: scripted end-to-end tests now cover the full Creator loop across the runtime API, Engine, codewhale exec and the terminal, in Ask, Full Access, policy, mode-switch and restart cases. (CW-8078)
    - Plugin manager mutations (plugin_manager): Creator's built-in plugins broker arm now supports install, remove, enable, and disable with atomic review-and-enable transitions, agent/person provenance tracking, resolved-reach gating for remote and npm sources, and synchronous revocation across open sessions on disable or removal. (CW-8080)
    - Auto-Review critical paths: deleting the home folder, the project folder, a parent of it or a .git folder in Auto-Review always asks you, and is refused when nobody is there to ask. On Windows this holds whichever way the slashes in the path lean.
    - DSH package + sibling plugin.json import (OF-01): DSH packages across local directories, dsh:, npm:, Git, and HTTPS tarballs now merge sibling plugin.json commands, agents, and hooks with symlink/hardlink containment checks, surface those component counts and shell-authority hook warnings in /plugin import dsh review previews, and propagate read errors during local DSH detection. (CW-8076)
    - Auto-Review unattended runs: tasks, automations, delayed messages and exec runs in Auto-Review follow the unattended rules: they never wait for an approval card.
    - Agent cwd in sibling worktrees: spawning an agent with cwd pointing to an existing linked worktree (or a subdirectory inside it) under the repository's .codewhale-worktrees/<repo>/ root is now accepted when both share the same repository common git directory; outside directories and foreign or plain directories under .codewhale-worktrees/ stay refused. (CW-8215)
    - Runtime thread completion wakes: idle non-ACP runtime threads automatically coalesce finished background shell jobs and completed child sub-agents into a bounded runtime continuation turn without dropping completions during busy turns or triggering wakes on cancelled, archived, or already-drained work. (CW-8215)
    - Plugin install summary builder (crate API): codewhale-plugins adds install::build_summary, a pure one-line install and update summary builder with stable message IDs for plugins and DSH packages; no CLI, TUI or desktop caller uses it yet. (CW-8182)
    - Live reload for external plugin and MCP changes: when another process installs, enables or disables a plugin or updates the configured MCP file, an idle TUI session now applies the change automatically and records any added or removed skills in the transcript (provider plugin changes still note they apply in a new session); while a turn is running, a toast notifies you and applies the change once idle. (CW-8183)
    - First-party plugin catalog updates: saved codewhale marketplace catalogs that came from an earlier embedded snapshot revision now update to the shipped snapshot on load while leaving custom, moving-branch, desktop-bundled, and removed catalogs untouched; release-candidate checks also verify that the embedded snapshot matches the marketplace files it installs from. (CW-8185)
    - First-party marketplace snapshot: pins the built-in marketplace catalog to revision 455e78b5 with Computer Use 0.16.3.
    - Sub-minute delayed messages and plan replanning triggers: send_later now accepts delay_seconds alongside delay_minutes and fire_at (requiring exactly one of the three), and the automation scheduler wakes immediately on trigger creation or cancellation so sub-minute continuations fire promptly. Plans also support replan_if conditions across updates, snapshots, plan cards, and session relay handoff output.
    - Creator mode loadout (Engine): skills status labels the four Creator skills "Creator mode only" instead of "disabled by config", and the Engine derives Creator mode's per-conversation skills, read-only bundled skill roots, always-load tool names, and first-turn role notice from the session mode.
    - Chrome attachment: an explicit attach-only native Runtime capability connects to a selected authenticated owner without starting another Runtime; thread operations, approvals and journal observations stay bound to that folder.
    - Qwen Code as an external agent: Codewhale now finds an installed Qwen Code CLI (qwen, 0.6.1 or newer) and can run it as a session over ACP with qwen --acp. GET /v1/agents/external lists it, an older install is reported as needing npm i -g @qwen-code/qwen-code@latest, and sign-in stays inside Qwen Code (/auth). Thanks @MannXo (#7293).
    - GitHub Copilot CLI as an external agent: Codewhale now finds an installed GitHub Copilot CLI (copilot) and can run it as a session over ACP with copilot --acp --stdio. GET /v1/agents/external lists it, and sign-in stays inside Copilot CLI (copilot login). Thanks @Aboysky (#7326, #7279).
    - Plugin index (Runtime API): a new GET /v1/apps/plugin-index route lists plugins, skills, connectors, hooks and hand-written commands with kind, source and state, and /v1/commands rows say which plugin (plugin_id) added a command and whether a command came from the project (workspace_sourced) (CW-8092).
    - Model catalog: Claude Fable 5.2 (claude-fable-5-2) and Gemini 4 Carbon (gemini-4-carbon) are in the bundled catalog, and a daily catalog-refresh workflow proposes new first-party models from models.dev as a pull request. The workflow has not run in GitHub Actions yet.
    - Public model list: The public model list gains GPT-6.1 Terra, Kimi K3.1 Pro (and its high-speed variant), MiniMax M3.1 Flash and Mistral Large 4, each marked unreviewed.
    - DSH plugin client review: the DSH importer now reviews a plugin's client (dsh.client) files: the review lists every file the client loads with its SHA-256 and which modules the host must provide, and says exactly why a client stays disabled (for example an npm package that is not in the bundle, or a module loaded by a computed specifier). Plugin UI is still not shown; that needs the Engine client bootstrap.
    - Website languages: the Roadmap and Contribute pages now show their titles, introductions and actions in all 18 site languages instead of English outside English and Chinese. The translations have had no native review yet.
    - Automations: a run missed while Codewhale was closed now waits on reopen for Run now or Skip instead of catching up silently; each automation can choose "If missed: ask" (default), "run once" or "skip". Tested in the engine only; no HTTP route tests, no desktop client yet, and a Mac asleep longer than the grace window counts as closed.
    - External agent quota: The Runtime API route GET /v1/agents/external/quota reports each external agent's quota as unknown with a reason (flag off, consent missing, not implemented). The new agents.quota.<agent> and agents.quota.<agent>.consent settings, saved through POST /v1/config, record the opt-in and consent (at most 32 agent entries). No agent credential is read. (CW-7993)
    - Signed registry channel on the cloud-facts relay and publisher: GET and HEAD /api/facts/v1/registry, web/scripts/facts-publish.mjs, and the Supabase facts_release migration (20261117000114_registry_channel_publication.sql) now verify and serve codewhale.registry.v1 envelopes up to 8 MiB, binding facts_version to revision, published_at to generated_at, and not_after inside the signed bytes, requiring a founder signature when any provider carries an admission record, and bounding automation-signed model/offering updates to a seven-day not_after window while keeping all non-registry channels at 512 KiB. Source only: channel creation, signing and deployment remain founder actions. (CW-8253)
    - Managed model prices from /v1/models on the Codewhale account route: when signed in to the Codewhale provider, refreshing /v1/models now reads a row's USD codewhale.pricing rate card (input, cachedInput, output, and optional cacheWrite) so turn cost receipts and estimates reflect the account's published per-token price instead of staying unpriced. Quotes that are expired, not in USD, or malformed are ignored without dropping the model from the picker, and bring-your-own-key rows without a rate card stay unpriced as before. (CW-8254)
    - Standing-instruction receipt over the Runtime API: GET /v1/threads/{id}/context/standing (capability thread_standing_context) returns the receipt the Engine already computes for a live thread: per-item estimated tokens kept and dropped, the action taken (kept, trimmed, skipped, refused) and the limit that caused it, scope budgets and totals, relative paths only, the 65,536-byte delivery cap with whether the delivered message was truncated, and a not_measured list (skills, agents, MCP tool schemas, memory) so a client does not show zero. Read-only; prompts and the cached prefix are unchanged.
    - Signed model and provider registry wired into resolution and discovery (off by default): when [cloud_facts] is enabled (CODEWHALE_CLOUD_FACTS=1 or enabled = true), Codewhale fetches the signed models-and-providers list (registry.json, codewhale.registry.v1) from https://codewhale.net/api/facts/v1/registry by default (or CODEWHALE_REGISTRY_URL / CODEWHALE_REGISTRY_PATH, or CODEWHALE_CLOUD_FACTS_URL when it contains {channel}), verifies it against the pinned keys, caches the last good copy at $CODEWHALE_HOME/facts/registry-cache.json, and applies verified models, offerings, aliases and admitted providers across resolve_model, RouteResolver, catalog lookups and /provider discovery. Model requests to a custom provider whose host a verified registry admitted resolve that host on every connection, without an ambient proxy, and are refused when it answers with a private, loopback, link-local or cloud-metadata address; built-in providers (including local Ollama, vLLM and SGLang) and custom endpoints on any other host are unchanged. Scheduled automation signatures with a non-expired not_after within seven days of generated_at may update only models, offerings and built-in providers' aliases and wire_slugs; widening accept, changing strip_prefixes or ids, a route or descriptor default model (including an offering's default flag), catalog api/npm headers, pricing_withheld or corrections needs a founder signature. Adding a new OpenAI-compatible HTTPS provider also requires a founder signature, and such a provider can never change a built-in provider's address, key or protocol or reuse another product or provider *_API_KEY variable. Disabling cloud facts, expiry past not_after, CODEWHALE_DISABLE_CLOUD_FACTS=1, or a failed/rejected pull leaves or restores the copy already in use (or the bundled seed) without delaying startup; CI suppresses network pulls. Source only: cloud facts remain off by default and publication is separate. See docs/CLOUD_FACTS.md. (CW-8246)
    - Migrate saved sessions when a workspace directory moves: renaming or moving a project folder no longer strands its sessions. Run codewhale sessions migrate --old-path <old> --new-path <new> (--dry-run to preview, --session <id> for one session) to update saved sessions, recovery checkpoints, and Runtime thread bindings together. A dry run creates and changes no files, sessions in use are skipped, Runtime stores reached through a symlink are refused, one unreadable session is reported without stopping the rest, and overlapping old/new paths are refused. Workspace-mismatch errors print the scoped --session <id> --dry-run command, and symlinked workspace paths resolve consistently on resume and fork. (CW-8256)
    - Sub-agents follow your pinned memory: when memory is on, a sub-agent's system prompt now carries the session's reviewed memory packet and its ## Memory Hygiene guidance, the same block the main session gets, so a rule you pinned in Context Lens also binds the agent that edits the files. The packet is rebuilt for each launch, so a memory edited mid-session reaches later sub-agents; nothing is added when memory is off, empty or every entry is reviewed off, and memory keeps its standing as evidence, not instructions (#7359). Verified by the engine child-prompt and memory-guidance tests. Thanks @gaord.
    - Permission rules and "always allow in this repo" in the Runtime API (CW-8234): GET /v1/permissions/rules lists the user permissions.toml rules with removal tokens, POST /v1/permissions/rules/remove removes one for an owner caller and refuses a stale token, GET /v1/approval-grants lists grants across threads, and POST /v1/approvals/{id} accepts remember_scope: "workspace" to save the same exact, repo-scoped allow rule the terminal writes; approval.required shows that rule in advance, and sub-agent approvals are not eligible. Running threads of the same Runtime use an added or removed rule on their next matching call; a running terminal or another Runtime keeps its rules until it reloads, and POST /v1/config/reload now applies hand edits to running threads.
    - Private telemetry stats page: a new separate Cloudflare Worker, telemetry-stats/, reads the Analytics Engine dataset in place and serves aggregate charts (active installs by version, surface and OS, sessions, turns, tool calls, model usage by provider and catalog model, and the website funnel, with event counts weighted by sample interval, and never showing an install id) behind Cloudflare Access, and a daily rollup keeps whole-population per-day totals with no install ids beyond the three-month window; the write-only ingest Worker is unchanged. Deploying it is the owner's step. (CW-8192)
    - Auto-Review workspace boundaries, protected paths, and outside-workspace shell read confirmation: Under Auto-Review, file and shell writes targeting protected configuration and repository paths (.git, .codewhale/, .vscode/, .claude/, .mcp.json, .claude.json, .github/workflows/, .gitconfig, .config/gh/hosts.yml, shell rc/profile files, Library/LaunchAgents/, .config/autostart/, .cargo/config.toml, .config/fish/, .config/systemd/user/, Start Menu/Programs/Startup/, plus credential/env/key names and symlink/alias/case variants) now route to guardian review ahead of narrow typed allow rules and routine checks while leaving instruction-file holds and non-Auto modes (Accept Edits, Ask, Plan, Full Access) unchanged; ordinary writes in non-git folders run automatically in Auto-Review only when local snapshots are enabled and the workspace root is safe (non-/ / non-$HOME / non-top-level user directory, with file deletions and full-file empties still reviewed); shell reads of .claude.json and .config/gh/hosts.yml trigger print-credentials; and the first shell read resolving outside the workspace (ignoring standard pseudo-devices) requests one-time interactive confirmation per Auto-Review session (or routes to guardian review when non-interactive) while resetting on mode exit or session rewind/reset. (CW-8176)
    - Sub-agent return review under Auto-Review: Returning sub-agents that executed tool calls in Auto-Review now run one calls-only guardian review (tool names and compacted/redacted inputs only, excluding tool outputs and child report prose) against root owner intent and pinned instructions, prepend a sanitized [Auto-Review warning: ...] banner when the reviewer flags a concern or cannot run, and surface child and return-review Auto-Review blocks in the parent's blocked-actions list without minting retry grants while keeping child prompting disabled and non-Auto modes unchanged. (CW-8177)
    - Plugin calls under Auto-Review: Held plugin tool calls and nested extension core/call actions in Auto-Review now go through the Auto-Review reviewer with their host-minted plugin identity (without routine-tier, allow-rule, typed-allow, or cross-origin session-grant bypasses, while typed deny/ask, hook, and safety-floor holds still apply), and shell commands run in Auto-Review propagate agent posture provenance for plugins trust and plugins enable. (CW-8173)
    - Auto-Review soft rules, in-context push review, and user auto_review.environment: Interactive Auto-Review sessions (owner_present) now route repository-remote git push calls to the Auto-Review reviewer instead of a blanket safety-floor block while keeping unattended pushes hard-blocked and package/release publishing (npm publish, cargo publish, gh release) on the built-in safety floor; added nine named soft rules (force-push, git-tag, deploy-branch, git-discard, infra-destroy, ci-or-pr-bypass, print-credentials, secret-commit, deploy-wrapper, holding ahead of auto_review.allow and naming the rule in blocks and receipts while excluding cargo run, non-routine make targets, git add, and git commit from automatic routine allowance); kept outbound web requests with the reviewer; and added user/managed-only auto_review.environment context entries (ignored in project .codewhale/config.toml overlays) while keeping Ask and Accept Edits unchanged. (CW-8174)
    - Auto-Review recovery, approve-and-retry, and Ask fallback: Auto-Review block messages now name the rule and reason and invite either another route or one-use owner approval of the exact blocked call (without suggesting Full Access on unavailable checks). Interactive owners can approve one exact call from the block receipt (r with an empty composer), /permissions blocked [approve <id|latest>], or Runtime HTTP (GET /v1/threads/{id}/auto-review/blocks and owner-only POST /v1/threads/{id}/auto-review/approve); the retried call consumes its one-use (tool_name, call_digest) grant, still passes every non-Auto-Review gate, and cannot be created or consumed by child agents or extensions. Interactive runs fall back to Ask after 3 blocks in a row, 20 blocks in the conversation, or 3 unavailable reviews in a row (continuing the batch under Ask, and resetting counters when switched back to Auto-Review), while unattended runs continue past isolated and consecutive blocks until 20 total blocks or 10 consecutive unavailable checks. (CW-8169)
    - One approval card for Creator plugin changes: in Creator mode, plugin_manager reads run without prompts, and installs, removals and switches are previewed with no network fetch and shown on one approval card; changes outside the project, remote or npm sources, bundles that spawn commands when shell execution is disabled, person-approved plugins and built-in switches always ask you, even in Auto-Review and Full Access, and plugin changes are refused in Plan, read-only sandboxes, background runs, sub-agents and execute_tools. (CW-8085)
    - Plugins usable in the same turn: after Creator installs, enables, disables or removes a plugin, its native tools are added or removed and disabled or removed MCP connectors are dropped before the next model request in the same turn while newly enabled MCP connectors start connecting in the background for the next message, the terminal shows a notice and runtime threads emit thread.plugin_changed; enabling a native-only plugin with the extension host off says so. (CW-8086)
    - Unmodified DSH plugin compatibility (CW-8020): Admitted unmodified @deepseek-ai/dsh-* plugins end-to-end with grant-gated host-service bridges (workspace, llm, credentials, settings, pluginManager, deepseekAccount, terminal, remote), 9 host-spine row bridges, inert/mixed @deepseek-ai/dsh-agent-presets handling alongside executable composition rows, duplicate-key package.json parsing, sanitized manifest descriptions, a 16,384-file / 256 MiB bundle budget, and reviewed registry.npmjs.org transitive dependency staging during conversion.
    - Conversation mode in the terminal: In the terminal, /new creator starts a conversation in Creator mode, and the /mode picker lists Standard mode and Creator mode first. A conversation's mode is fixed after its first message and shown on screen when it is not Standard. codewhale and codewhale exec take --conversation-mode. When [features] plugin_creator is off or no Node.js or Bun runtime is found, Creator mode stays unavailable with the reason.
    -  --permission-mode and managed auto_review.disabled: codewhale and codewhale exec accept --permission-mode <ask|accept-edits|plan|auto-review|full-access> (while codewhale exec --auto keeps selecting Full Access). Setting [auto_review] disabled = true in managed configuration replaces the user [auto_review] table, omits Auto-Review from the Shift+Tab cycle and permission dial, ignores a saved Auto-Review posture, and refuses --permission-mode auto-review, /auto, /config approval_mode, and approval_policy = "auto". (CW-8168)
    - Auto-Review forced prompts: interactive sessions and owner-attached runtime threads in Auto-Review now show the normal approval card for forced holds (typed permissions.toml ask rules, tool_call_before hook ask, Computer Use consent and script cards, repository-law holds that require a person, and forced extension prompts) instead of blocking or consulting the guardian, with runtime thread cards answerable only by the owner's surface while hard blocks still deny and unattended Background/Headless turns still refuse without registering a pending approval. (CW-8170)
    - Shell parity and background task legibility: bash now accepts optional cwd, background (enabling parallel fan-out while refusing read_only=true with background=true), and forwards trimmed description onto BashTool action=run metadata and ShellJobSnapshot. Background task composer chips prefer readable task summaries over raw IDs, and shell work rows and completion notices display the normalized shell description when provided. (CW-8221)
    - DeepSeek Tools ASR, TTS, OCR, and uploaded runtime voice endpoints: integrates DeepSeek Tools /v1/tools/asr, /v1/tools/tts (stella / tide, wav / pcm), and opt-in /v1/tools/ocr fallback (CODEWHALE_DEEPSEEK_OCR=1); adds recorder-free POST /v1/voice/transcribe and POST /v1/voice/tts runtime HTTP routes plus upload_available, tts_available, max_upload_bytes, and tts_voices capability flags on GET /v1/voice, and enables DeepSeek in SpeechTool and CLI speech. (CW-8218)
    - DSH market npm installs and extension catalog service: DSH market npm entries with an exact semantic version (and optional https registry) now resolve to reviewed registry-tarball install plans (npm:<pkg>@<ver> or exact .tgz URL) without executing npm or bypassing plugin trust review. Inside the extension host, the dsh/catalog broker arm now plans reviewed installs without writing to disk, returns only verified approved provider routes scoped to the calling plugin, and serves account balance read-only while withholding credentials and account mutations (CW-7988).
    - Plugin settings service backend (0.10.3): adds the internal settings host-service handler (describe, update, replace, mutate) and extension-host adapter helper so plugins can inspect and atomically edit only their own reviewed [plugins."<name>".config] keys in config.toml through the session permission gate and live write posture, leaving comments, unrelated tables and other plugins' configuration untouched (writes return applies: "reload" and take effect at the next reload). This backend is not yet wired into live host-service dispatch or plugin grants, so no active plugin exposes it yet. (CW-7983)
    - Skill install and update controller: installing an already installed skill now updates it in place (reporting any replaced source and preserving skills_state.toml enabled/disabled state), local folders and .tar.gz/.tgz archives install and update as managed skills with path-safety and archive-bound checks, person-started global installs are trusted automatically without marking project skills, and mutations emit a one-line outcome receipt. (CW-8184)
    - DeepSeek Chatbot API parity: added DeepSeek web search (deepseek_web_search with search/deep_search and deepseek_read_url) with multi-turn passthrough, ServerToolUsage accounting, strict tool_choice and route guards, safety_check with refusal handling and delayed stream content_filter refusal events, latest_reminder message placement before user turns, title conversation title events with sanitized TUI rendering, anthropic-beta: files-api-2025-04-14 document file references, and bounded /files upload helpers. (CW-8216)
    - Plugin LLM broker arm (gated off): adds the dsh/broker llm service arm (catalog, complete) and TypeScript SDK adapter, routing completions over the active session route with an isolated plugin prompt (omitting workspace instructions, account constitution, and other plugins' prompt sections), session permission-gate checks (Read/Reach), and bounded concurrency; host injection stays disabled by default pending final review. (CW-7973)
    - Charts in the transcript: the model can now show numbers as a small chart with the new read-only show_data tool: a one-row sparkline, up to 24 labelled bars, or a multi-row trend. The TUI paints it in the transcript with the terminal kit, including after a session is restored, and a plain-text summary accompanies each chart for the model and other clients. Input the chart cannot show honestly (a non-finite number, more than 1024 points or 24 bars, a label over 120 characters) is refused with the limit it broke.
    - Plugin lifecycle from the shell: codewhale plugins now has install <spec>, show <name>, update <name> and uninstall <name> (each with --json) alongside status, restage, trust, enable, disable and revoke. plugins install uses the same reviewed installer as codewhale install, show prints the capability review without prompting or trusting, update refreshes from the recorded source and reports either the new version or already current, and uninstall disables an enabled bundle first and asks in a terminal unless --yes is passed (non-interactive and --json runs require --yes). (CW-8161)
    - Signed catalog updates: a pinned cloud-facts signing key now has a role. A new automation role is limited to its own -models channels and to model additions, corrections and deprecations that expire within seven days; it cannot sign for the stable channel, set a default model or endpoint, publish release information, announcements or prices, or remove a model. No automation key is pinned and no client reads a -models channel yet, so nothing changes for an install today. A signed release whose expiry equals its publication time is now rejected, as the website already did. (CW-8180)
    - First-time guide on the website: a new docs page, "Use Codewhale for the first time" (/docs/first-time, English and Simplified Chinese), walks someone who has never used a terminal through opening one, installing, choosing the folder Codewhale works in and when that choice matters, opening a terminal in a folder from Finder or File Explorer, connecting a model, a first task, and stopping, undoing and quitting. The install page gains a short "New to the terminal?" block for macOS and Windows that links to it, and llms.txt carries the same steps.
    - Plugins from a shell: codewhale plugins trust <name> prints the same capability review as /plugin trust with its bundle review token and, in a terminal, asks once. --review-token <token> --yes trusts without a prompt while that token still matches the installed content and capabilities; the token ties trust to the exact content, does not show that anyone read the review, and is not the host-service review token. A --yes trust is recorded as the command line and grants no host service. Every command the agent runs (shell, persistent terminal, verifier and test runs, the Python kernel, MCP servers it starts) now carries CODEWHALE_AGENT_PROJECT with the session's project, while hooks and configured MCP servers do not; with it, a trust or enable is recorded as the agent's, for that project only, even when a prompt is answered through a terminal, and the agent may trust only a plugin it installed from a folder inside the project. plugins enable, disable and revoke work the same way, each with --json, and plugins status shows who approved. The agent's shell commands that run them go through the session's approval like any other shell command, so a Full Access agent can trust and enable a plugin it wrote; the mark is a label the agent could remove in Full Access. (CW-7891)
    - Sandbox: a managed configuration can set tool_launcher (Linux) to run every sandboxed tool command as another user, in front of bubblewrap; commands then run inside the sandbox or not at all, masks are computed for that user, /tmp is private per command, and GET /v1/runtime/info reports sandbox.kind and sandbox.tool_launcher. Without the key nothing changes. A managed configuration named by CODEWHALE_MANAGED_CONFIG_PATH or managed_config_path is applied on every load, and one that is missing or cannot be read stops the load instead of loading with no managed layer; a blank CODEWHALE_MANAGED_CONFIG_PATH is now ignored instead of switching the managed layer off, and a config file's managed_config_path can no longer point away from an existing file at the default managed path. Fleet local workers inherit the managed-config variable, and codewhale serve --mcp does not expose shell tools when the managed configuration it loads sets tool_launcher. A configuration whose provider is declared only by a plugin fails to load under a managed configuration, with an error that says to declare the provider table or pick a built-in provider.
    - Receipts: a terminal session's receipt (/receipts, codewhale receipts) now shows the provider's token counts and the same cost report /cost prints, saying "unknown" and why when the route's price is not known, never a guess. A Runtime thread's receipt shows token counts only; its cost line follows in a later release. codewhale metrics now counts usage saved in terminal sessions instead of reporting none. Sessions saved by 0.10.2 carry only a combined token total.
    - Creator skills: Codewhale now ships DeepSeek Harness's four plugin-authoring skills (cordis-plugin-development, editing-cordis-compositions, cordis-composition-reference, agent-experience) bundled, unmodified, with their reference and template files and DeepSeek's MIT notice beside each. They stay hidden from the model until Creator mode. A bundled skill can now carry files; load_skill prints its base directory and a short Codewhale host-notes block, and a file you edited is never overwritten on upgrade.
    - Conversation modes (Engine): GET /v1/modes lists two built-in modes, standard (default) and creator, each with id, name, description, source and available (plus reason when not; Creator is listed unavailable when [features] plugin_creator is off or no Node.js or Bun plugin runtime is found). A thread's mode is agent_preset, set on POST /v1/threads or by PATCH /v1/threads/{id} until the thread has a turn, saved on the thread record and the terminal session file and shown in GET /v1/threads/summary; records without it load as standard. An unknown or unavailable id, a change after the first turn, or a mode together with another vendor's agent is refused with error.code unknown_mode, mode_unavailable, mode_locked or mode_not_supported_with_executor.
    - Model Studio Token Plan: Token Plan users can now pick qwen4-max-preview on both the OpenAI and Anthropic dialects. It was added from the model table Alibaba publishes on its Token Plan pricing page and has not been exercised against the live endpoint. Alibaba publishes no context window, output limit, tool calling or thinking control for it, so Codewhale records image input only and sends it no thinking switch on either dialect. The Coding Plan does not list it.
    - Read-only builtins over the Runtime API: POST /v1/threads/{id}/commands/builtin runs /system, /tokens or /cost against a thread and returns the same answer the terminal prints, including the effective system prompt the engine sends. Any other command name answers 404, a thread whose engine is not loaded or has no live context estimate answers 409, and the route never starts an engine or writes settings (#7277). Verified by the app-server route tests and terminal-host tests; no editor client uses it yet. Thanks @gaord.
    - Website maintainer: a scheduled web-maintainer workflow proposes website upkeep as pull requests only: regenerated facts, and three DeepSeek lanes (stale version mentions, moved links, docs drift) that may edit only allowlisted copy files and must pass npm run check and the web tests. It is off until the repository variable WEB_MAINTAINER_ENABLED is set and a capped WEB_MAINTAINER_DEEPSEEK_API_KEY secret exists, and it has never run. The Worker's triage, PR-review, stale, duplicate and curate (Today's Dispatch drafting) cron tasks are removed; the digest stays.
    - Installer PATH setup: when the install directory is not on PATH, the macOS and Linux installers now add Codewhale's marked three-line PATH block to your shell profile, print exactly which file and lines they added and the command that removes them, and skip this with --no-modify-path or CODEWHALE_NO_MODIFY_PATH=1; the Windows archive installer adds the directory to your user PATH the same way and skips it with -NoModifyPath. Release archives carry this from 0.10.3 on, and the Windows installer has not been run yet. (CW-8036) The website serves install.sh, so this reaches people only when the website is next deployed.
    - External agent options: GET /v1/agents/external/{id}/options?cwd= returns the models, modes and options an external agent itself offers for a folder, and which Codewhale actions it will not carry. A saved agent model the agent no longer offers is refused with a stable choice_not_offered code instead of being ignored, per-turn settings an agent cannot honor are refused as unsupported_control, and each agent turn records the context window and tokens the agent reported, with cost shown as unknown (CW-7879). Probing starts a real agent session in the folder, which the agent may keep in its own history. Mode and config choices are listed but cannot yet be chosen through thread creation. Verified on Linux by unit and local HTTP tests against a fixture agent; no real installed agent, macOS, Windows or hosted CI run.
    - Plugins the agent approved run apart: a plugin the agent approved now runs, in a host process of its own for that project, separate from the plugins you reviewed. It has its own data folder and its own crash and restart handling, and it never shares a host service with reviewed plugins or pauses theirs. When you review it, it moves into the shared process and its stored data moves with it; if a data folder for it is already there, the move is refused and the plugin stays off until you resolve it. /plugin shows each such host. One more Node process runs per open project that has such a plugin. (CW-8074)
    - Approvals name the client that answered: POST /v1/approvals/{id} accepts an optional client (desktop, phone, web, tui, acp), and the resulting approval.decided event carries it as responder. The phone and web mirrors and the ACP server send theirs. It is a label the client declares, not an authenticated device identity. Repeated answers from two clients wait for the same saved decision before acknowledging success.
    - Sessions on your own installed agents: POST /v1/threads with executor: {kind: "acp", agent_id} runs a session on an agent CLI already installed and signed in on this computer (OpenCode, Kimi Code, DeepSeek Harness, Antigravity, and Claude or Codex when their ACP adapter is installed). The agent's messages, reasoning, tool calls and plan arrive as ordinary session events, its permission requests are approval cards answered through the usual approvals route under the session's posture (Full Access allows, Plan rejects, Accept Edits allows only edits inside the workspace, everything else asks), stop cancels it and ends a process that does not stop, and the session reopens the same agent session after a restart. The agent keeps its own login; Codewhale never reads, stores or passes its credentials and never downloads an agent or adapter. Refusals carry a code (not_installed, adapter_missing, below_min_version, needs_sign_in) beside the sentence, session summary rows name their agent, and the agent's own usage reports are recorded as agent reported with cost unknown. Steering, compaction, forking and images are not available in these sessions. Quitting Codewhale, or abandoning a session while its agent is still starting, ends that agent before shutdown finishes. See docs/RUNTIME_API.md.
    - DSH market indexes are readable: /plugin marketplace add and GET /v1/apps/marketplaces now parse the DeepSeek Harness plugin market index (format 1) alongside the Kimi, Claude, Codex and Codewhale catalogs. Entries keep npm package identity, localized title and description, a resolved icon, declared category and label ids, and every version ordered by SemVer precedence; the highest version decides the row. A version whose engines.dsh range admits none of the DSH versions this host targets is refused before any download. npm sources with an exact version resolve to reviewed registry tarballs without executing npm, and a commit-pinned GitHub source without a package subdirectory installs from the pinned commit.
    - Plugin catalog over the Runtime API: GET /v1/apps/plugins/catalog lists the built-in plugin settings (Subagent, Web search, Shell, Agent loop), the experimental features and the remaining features as rows the desktop Plugins page renders directly. Enable, disable and the subagents concurrency setting persist through the same config writer and reload as /v1/config; the agent loop itself cannot be turned off.
    - Optional host policy on model HTTP clients: embedders can install an in-memory ModelHttpPolicy that vets or configures the HTTP builder for the primary, model-list, HTTP/1.1 and vision transports before a client is built. Config files cannot install the hook, and transport behavior without a policy is unchanged. Thanks @zhuowp (#7251).
    - DSH bundles install from tarballs and admit CJS packages: installing a DeepSeek Harness bundle from a .tgz now detects the dsh.bundle manifest, converts it during staging, and admits CommonJS packages (including require exports and bundled node_modules) alongside ESM. Admission checks engines.dsh as a real npm semver range against the host's supported DSH versions and refuses bundles whose dsh.bundle.platforms excludes this computer; native .node addons stay refused.
    - Prune pasted images: codewhale sessions prune-images lists pasted clipboard images that no saved session, checkpoint, Runtime thread, draft or history still names and that are older than 7 days (--older-than-days); --apply deletes them. If any file it must scan cannot be read, it deletes nothing. Run it while no Codewhale session is open. Thanks @Asteria1028 for the report (Refs #7221).
    - Task wall clock pauses for answerable human waits (#5898): a durable task run by the Runtime API server no longer spends its wall-time budget while a prompt on that run waits for an approval or user-input answer. [tools] task_human_wait_cap_seconds (default 1800, maximum 86400) bounds the total wait and fails an unanswered task with human_wait_timeout, releasing its worker. Only a Runtime serving its HTTP API pauses the clock; local Stdio, Socket and ACP control frontends keep the wall deadline, and a wall deadline crossed before the prompt still ends the task. The TUI's own tasks are unchanged. Thanks @asto18089.
    - MCP servers say why they are not connected: the Runtime API's GET /v1/apps/mcp/servers now includes a configured server's last connection error while it is retrying, so the desktop and other clients can show the reason instead of only "disconnected".
    - Inspect and repair plugin snapshots: codew plugins status [name] [--json] reports bundle state and diagnostics without changing plugin stores. Runtime loading restores a missing snapshot only from bytes matching its enabled review and policy; codew plugins restage <name> or /plugin restage <name> retries explicitly. Recovery preserves review and generation and refuses an existing changed snapshot. Isolated macOS checks exercised the published Code Review 1.0.8 Native status lifecycle and official filesystem MCP reconnect; live review execution and other plugins remain unqualified.
    - Shared optional account sign-in: /connect offers Codewhale sign-in or on-computer provider setup. Desktop and terminal use the same profile-scoped Rust account session; sign-in preserves the selected model and local keys. Ordinary logout removes the account session, while logout --all explicitly clears saved model credentials. Startup prompts keep missing-model setup visible instead of covering it with the optional working-agreement checkpoint. Real sign-in acceptance remains open.
    - Refresh model catalogs during use: Runtime provider refresh now checks public Models.dev metadata alongside the exact provider's model list; force_catalog=true bypasses the public cache TTL and retry backoff. GET /v1/providers exposes catalog revision and freshness so clients can pick up new models without repeatedly loading an unchanged catalog. The runtime rechecks in the background, retains the last good snapshot on failure, and preserves explicit model selections and account/route scope.
    - Tinker beta route: configure Thinking Machines Tinker's OpenAI-compatible endpoint and a serverless model or sampler checkpoint ID. Model-list discovery, key verification through that list, and cost estimates remain unavailable; live conversations, tools and image input have not been qualified in Codewhale. See provider setup.
    - Worktrees for parallel workspaces: GET /v1/worktrees lists a repository's worktrees, POST /v1/worktrees creates a branch and its own checkout under <repository>/.codewhale/worktrees/ through the existing lane provisioning, and POST /v1/worktrees/remove archives a clean managed one without --force, keeping the branch. A client starts a thread in the new folder, so several agents can work on one project without sharing files. (codewhale-hq/codewhale-app#3500)
    - Thread-scoped snapshots: GET /v1/snapshots and POST /v1/snapshots/{id}/restore accept ?thread_id= and act on that thread's workspace under the same restore admission rule. (codewhale-hq/codewhale-app#3500)
    - Reviewed plugin UI assets (preview): native plugin bundles with supported client entries can expose reviewed assets through the Engine's loopback descriptor and asset routes. Runtime and workspace authorization are required; exact asset bytes also require the current opaque grant. Responses keep bounded sizes, confined paths and safe MIME/no-store behavior. The desktop host binds grants to individual plugin frames; real Electron transport and teardown qualification remains open. Imported DSH client halves remain unsupported and refuse UI grants. (#2, #3)
    - Present final files: the read-only present tool takes 1–32 existing workspace files, streams their SHA-256 and byte counts, and returns an auditable handoff receipt without copying, moving or uploading them. It is eager in Act/Operate and Plan; the present-handoff feature is experimental, and there is no dedicated app card yet.
    - Truthful background jobs: shell job snapshots and completion events now carry the exact start time, a typed termination cause (producer, killed, timed_out, unknown) and whether the producer reported it. A killed job is no longer indistinguishable from a failed one, and the bash guidance tells the model to collect or cancel live jobs before a final answer.
    - /export writes HTML and JSON: /export file report.html saves a self-contained page (light and dark, no scripts, a strict content-security policy, tool calls collapsed) and report.json a versioned, typed-block envelope. --format md|html|json overrides the extension, and --no-tools drops tool calls and results from the conversation. /export file with no path now writes an auto-named codewhale-<title>-<timestamp> file under <codewhale home>/exports and reports the format, line count and redactions; ~ expands and quotes keep a path with spaces together. --force, --no-tools and --format are accepted in any position. HTML and JSON are file-only; the clipboard and /export turn remain Markdown.
    - Tencent HY4: the stable tencent/hy4 model is available through OpenRouter with its published multimodal, tool, reasoning and context metadata. /provider tencent adds the direct TokenHub route with hy4 and TENCENT_API_KEY; direct availability and prices remain separate from OpenRouter, and preview/HY3 selections are preserved.
    - WeCom steers a running turn (#7211): a WeCom message sent while a turn is running is forwarded to the Runtime's steer endpoint instead of being dropped with the busy notice, which remains the fallback when the steer is rejected. Thanks @gaord.
    - WeCom accepts media and voice (#7212): the WeCom bridge downloads image, video and file messages into WECOM_MEDIA_DIR (default <workspace>/media) under a sanitized name and replies with the saved name, size and path; a failed download tells the sender the link expires after about five minutes. Voice messages use WeCom's transcription as the prompt, and other message types get an explicit answer instead of a blanket refusal. Thanks @gaord.
    - Pinned local thread controls (preview): initialized App Server clients can list retained loaded Engines with cursor paging and rename the canonical thread through thread/loaded/list and thread/name/set. Saved but unloaded threads stay out of the loaded list; existing aliases remain available. Full-tool turns and subscription parity remain unfinished.
    - Reply style and sub-agent limit over the Runtime API: GET /v1/config reports and POST /v1/config writes verbosity (normal or concise) and subagents_max_concurrent (how many sub-agents may run at once, 0 to 128, where 0 turns them off), so the desktop's Settings can show and change both. An unset limit reads as the one the Engine applies; nothing writes a default for you.
    - Local whale voice (preview): the host can edit its private, revision-checked SOUL.md through the Runtime API. The Engine captures it for the next turn within the existing instruction budget and records its source; invalid private files refuse the turn with a terminal failure.
    - MCP tool approval rules (preview): exact tool names in the global server configuration can use Always, Ask or Off across workspaces. Off wins, server edits invalidate the prior grant, and required Computer Use consent and nested-program approval remain in place.
    - Attested watch-turn ingress (preview): a configured Runtime master bearer can admit typed schedule or pull-request receipts through the existing thread and turn owner, with exact operation replay and read-only recovery lookup. This supplies the Native ingress prerequisite; it does not qualify the complete continuous-operation workflow.
    - Goal continuations send the objective once per live conversation window. Later passes show the current goal state, estimated conversation input and the applicable compaction setting. Full notes stay available through get_goal. Thanks @7jrxt42BxFZo4iAnN4CX for measuring the repeated text and identifying the misleading token figure (#7172).
    - Composition on the first request: execute_tools accepts a bounded named batch from the current MCP catalog, with argument names from its allowed members and the same nested gate as a JavaScript program. Exact tool-name searches work with regex anchors. Stream receipts hash the executable in the background; CODEWHALE_TIMING=1 reports phase durations.
    - The model can read what compaction replaced (#7173): two read-only tools, context_archive_search and context_archive_get, search the session's saved pre-compaction snapshots and read one archived message by id, with bounded results (12,000 characters per read, 20 hits and a 200-character query per search). Each message is masked whole for credential shapes and currently configured secrets before it is searched or paged, and codewhale sessions scrub-secrets now also rewrites those snapshots. A /fork cannot read the archive its handoff note refers to, and a bare secret absent from current configuration is not masked. Thanks @SparkofSpike.
    - Opper as a bundled provider (#7131): /provider offers Opper, an EU-hosted OpenAI-compatible gateway, with OPPER_API_KEY, https://api.opper.ai/v3/compat and the claude-sonnet-4-6 pool name as the bootstrap model; provider/model ids pin one route. Live /v3/compat/models is the model authority and billing stays Unknown. No live Opper call was made here. Thanks @Felixkw12.
    - Runcrate is a bundled provider: runcrate reaches the OpenAI-compatible host at https://api.runcrate.ai/v1 with RUNCRATE_API_KEY, and codewhale models --update --provider runcrate refreshes its public model IDs before a key is configured. Inference requires the route key. Thanks @heydryft for the request and the vendor details. (#7085)
    - MCP connection status reaches the model: one existing history snapshot now records permitted configured, connecting, failed, authorization-required, unknown and connected servers, with bounded inert names and no raw errors. Stale status and server guidance are withdrawn on contention, configuration/scope changes and restore; observation does not connect servers or promise callable tools. (#6866)
    - Bundled-skill policy: [skills.bundled] separates automatic, authoritative and disabled installation from discovery, with per-name selection, disable and explicit-only controls. Aliases share policy; disabled shipped copies reveal user alternatives. Modified and managed files remain intact, and doctor plus /skills inspect show the effective policy. (#7066)
    - Configurable skill routing index: [skills] listing_max_description_chars and listing_budget_fraction control the shared parent/child catalogue. Defaults use 120 characters and 0.2% of the route window, within the existing total bounds. Load warnings, localized inspect notes and /context explain shortening; full skill loading stays available. (#7073)
    - Compact approvals keep their authority visible: cards show three choices and default to Deny. An exact saved rule requires its scope preview on screen. Shortcuts for additional actions require opening Details; a hidden saved-rule choice never falls back to granting the session.
    - Quicker everyday navigation: top-level help separates everyday and advanced commands, doctor --all expands path/backend details, and the launch screen labels how to resume recent work. Up selects the newest recent session. Whale cameos stay out of transcript text.
    - Session-window diagnostics: the audit log records when a saved window starts a new journal root while retaining the previous branch, helping distinguish window replacement from lost durable history. session.window.rerooted now names a cause (engine_projection, session_restore or unattributed) and also fires when a journal with entries has no active path. (#7142)
    - Usage reporting counts models, tokens and tools: when usage reporting is on, each session now also reports, per provider and model, its turns by outcome, input, output and prompt-cache tokens, and turn-time buckets, plus how many times each built-in tool ran and failed. A model is named only when it is in Codewhale's bundled public model catalog; custom, local and fine-tuned names are sent as other, and MCP and plugin tools as mcp or other. No prompts, outputs, tool arguments or paths are sent. Runs under CI or the GitHub Action report the ci session source. The first-run notice is shown once more to describe this. DO_NOT_TRACK=1 now turns usage reporting off for that run, like CODEWHALE_TELEMETRY=0; codewhale config set telemetry false still turns it off for good. See docs/TELEMETRY.md.
    - exec and doctor follow the TUI onto local Ollama: with no cloud key and no explicit route, codewhale exec uses a running local Ollama chat model and says so, and codewhale doctor --probe-local checks that route. Nothing is saved. (#7115)
    - Thinking starts at auto: new configurations and the built-in default use reasoning_effort = "auto" instead of max; an effort you set is never changed.
    - DSH Git review scopes: the extension host brokers bounded, read-only Git metadata to reviewed DSH plugins through a new git_review_scope action (extension-host policy v8).
    - Safer, more complete uninstall: for a receipted release copy, codewhale uninstall --yes now also removes this install's exact three-line # >>> codewhale PATH >>> block from your shell profiles and the Codewhale-generated completion files at their documented paths (bash, zsh and fish, honouring XDG_DATA_HOME and XDG_CONFIG_HOME). It touches nothing else in a profile, leaves a symlinked or unreadable profile for you to edit, keeps the completion files while another Codewhale copy remains on PATH, and exits non-zero if that cleanup fails after the program is already gone. The codewhale.net/install.sh hint and the install guide now print the PATH line as that marked block, so there is something provably yours to remove; a bare export PATH=… line you added earlier is never touched. Data purge requires a receipted removal in the same confirmed run. Both Unix installers reject unsafe or managed destinations before creating them and still never edit shell profiles themselves. Uninstall instructions match the explicit-home purge scope in English and Chinese. Not yet observed on a real Windows host or an installed release artifact. (Refs #7091)
    - Nested and deletable threads (Runtime API): a fork (including a backtrack fork) records parent_thread_id, POST /v1/threads accepts one naming an existing thread, and GET /v1/threads/summary returns it so clients can nest child conversations. DELETE /v1/threads/{id} removes an idle thread with its turns, items, events and goal, and its saved session unless another thread shares it or a terminal holds it open; a running thread answers 409.
    - Hunk actions in Review (Runtime API): POST /v1/git/stage, /v1/git/unstage and /v1/git/discard take a patch holding hunks of the one path in paths and apply only those hunks through git apply, under the same expect preconditions as whole-path writes. A patch that no longer applies fails with git's message and writes nothing; renames, mode changes and binary patches are refused. The tasks tool can also suggest a task, shown as a Start/Hide card, without starting anything.
    - Live /models ceilings reach the route: a provider that states per-model context and output limits in its own /models body now keeps them instead of falling back to the legacy 128K window. OpenAI limit blocks, flat context_length / context_window / max_model_len / max_context_length fields, max_output_tokens / max_completion_tokens, and a relay metadata block (context_limit, context_budget, output_budget) are read; metadata.context_limit outranks context_budget because the first is the model capability and the second the share one deployment accepts. Each field is parsed on its own, so an unreadable one costs only its own candidate instead of hiding the readable fields below it.
    - Change mode and permissions while the agent works: Tab, Shift+Tab, /mode, the hotbar and /config mode no longer refuse while a turn is running. A response that is already streaming is not restarted; the change applies at the agent's next step in the same turn (before its next tool batch, at every approval gate, and before its next model request, which carries the new mode notice). The status line says so until it applies. A call still waiting for approval goes back to the model under the new posture, and a call you already approved runs only if the new posture is equal or broader. Model, thinking level and provider stay locked until the turn ends.
    - Steering interrupts thinking: a steer (Ctrl+Enter, or Enter twice after queueing) now closes the in-flight model request at once, whether the model is waiting on headers, reasoning, writing text or emitting a tool call, and continues the same turn with your message. Text already shown is kept as interrupted output; unfinished reasoning and partial tool calls are discarded, never run.
    - Modern MCP client: MCP servers now connect through the official MCP SDK (2.4) behind Codewhale's Rust broker by default (mcp_backend = "host"; "rust" stays available for one release). Servers that speak the 2026-07-28 revision are discovered with server/discover; other stdio and HTTP servers fall back to the legacy initialize handshake, and configured SSE servers keep theirs. Rust keeps process, network, credential, catalog, approval and cancellation authority.
    - DeepSeek Harness plugins: reviewed DSH plugins (definition API pinned to DSH 0.2.2-rc.1 in a shared compatibility table) run in the Native extension host. Tool output is validated against its declared schema, unsupported options are refused instead of ignored, and plugin commands can submit a prompt with visible plugin attribution. Terminal command receipts are kept in thread snapshots without entering model history. Changing the compatibility table invalidates earlier trust. A newly enabled plugin's tools are offered on the first turn: the turn waits up to 10 seconds for the plugin host to finish loading instead of adding them only from the next turn. The importer reports that it does not convert dsh.client UI; Engine routes and a desktop slot exist, but isolated end-to-end plugin UI remains unqualified, including network containment. A plugin tool can call ctx.sessions.flush(exec.agent.session) to have the Engine save the conversation so far before it continues (Runtime, terminal and exec sessions); it reports failure instead of claiming a save. Installing a plugin whose bytes changed after review now returns a 409 conflict instead of a server error. A plugin tool can ask you a question with ctx.userQuestions.ask and gets back the options you picked, your own text, or a skip; the question shows like any other Codewhale question in the terminal and through the Runtime API. A plugin tool can start a child agent with ctx.subagents.startActivation (the spawn provider): the child runs through Codewhale's own sub-agent manager, needs the same approval as the model's agent tool, can carry an extra persona section and a narrower tool list set in its agent/created handler, and returns its result to the plugin.
    - MCP catalogs stay fresh: a server's tools, resources, prompts and skills are rediscovered on their own connection when an advertised ttlMs expires or the server sends a list-changed notice. A tool resolved against the old catalog is refused with "retry the call", a removed tool cannot run, and a failed refresh reconnects instead of serving stale entries. Catalogs are never shared across servers, credentials or reconnects.
    - MCP Skills extension: servers that advertise the published Skills extension have their skills listed in list_mcp_resources. Listing never activates a skill, and reading a skill file is refused unless its size and sha256 digest match the listing. MCP skills do not yet join /skills.
    - Updates install themselves: release-binary installs check for a new release every 6 hours (was 1), download and checksum-verify it in the background, and apply it the next time codewhale starts, never during a session. One line says Updated to v… · What's new: … · Undo: codewhale update --rollback. Until releases are signed, the download waits for your OK (one [y/N] question at the next start, or /update install); a release with a valid Ed25519 manifest signature applies on its own. codewhale update --rollback puts back the version the last update replaced and keeps the rolled-back version from returning automatically. Turn it down with codewhale config set update.mode notify (or off, or CODEWHALE_UPDATE_MODE); an organization's root-owned policy.toml overrides both. Offline and rate-limited checks retry about an hour later instead of on every launch. Package-manager and desktop-app copies only get their manager's command. Builds with the release key refuse a missing or invalid signature, and re-check the staged binary against the signed manifest at start. The checksum manifest now always comes from GitHub Releases; on Linux x64 the CNB mirror can still serve the binary, but only bytes that GitHub's manifest lists.
    - One view of every Codewhale on the machine: codewhale doctor has an Installations section and codewhale doctor --installs (--json, --brief) lists every codewhale, codew, codewhale-tui, deepseek and deepseek-tui with its owner: install receipt, package manager (with its exact removal command), the desktop app, a backup, or not ours. Nothing found is ever run. codewhale doctor --fix adds one plan to tidy them: old backups move to ~/.codewhale/recovery/<stamp>/ (kept 30 days, then deleted by a later --fix), an unreceipted codew is brought in line with codewhale, and the directory gets an install receipt; each move prints its undo and codewhale doctor --restore <stamp> reverses the lot. Package-managed, desktop-app, symlinked and foreign files are never touched, and neither is user data. codewhale uninstall now lists other copies with the same classification. Restoring an older command set now keeps its ownership receipt consistent and preserves the displaced receipt for undo. A partial restore retains ownership of unchanged commands.
    - Uninstall guidance on every install route: codewhale uninstall previews receipt-owned release files and --yes removes only checked files, with the running command last. Both Unix installers and the Windows archive installer record command ownership; self-update renews existing receipts on both. On Windows the running codewhale.exe is renamed, then a hidden PowerShell process deletes it after the command exits. Package-managed copies are left alone, and the command prints their exact removal command: npm with its prefix, Cargo with its root, the Homebrew formula, scoop uninstall codewhale, winget uninstall --id HunterBown.CodeWhale, or the Windows setup's Uninstall.exe. Every other codewhale/codew still on PATH is listed. User data is kept unless you add --purge-data. With --yes it runs only after a receipted installation was removed in that same run, and then deletes only ~/.codewhale (or a CODEWHALE_HOME named .codewhale) and ~/.deepseek/snapshots, refusing symlinks, home ancestors and directories owned by another user. A copy from an older curl | sh installer that wrote no receipt is adopted on --yes when it sits in a known older curl-installer directory: the commands byte-identical to the running program get a receipt and are removed, anything else is preserved, and a symlink or hard link among them stops adoption before any receipt is written. (Refs #7091)
    - GitHub Action reviews: analysis can export a structured Engine review for a separate trusted publisher job. The publisher checks the current PR revision and line anchors, deduplicates its findings, and keeps uncertain or preexisting claims out of inline comments.
    - DingTalk bridge: an optional internal-app Stream adapter reuses the same Engine, shared admission and approval helpers. Tenant/staff allowlists, durable acceptance before acknowledgement and retained uncertain deliveries protect recovery. Managed account linking is separate from this advanced self-hosted bridge.
    - Answerless output-limit recovery: opt into [reasoning_only] on_output_limit = true to request an answer again after a length stop with no answer or tool call, including hidden reasoning and ordinary Fleet workers. Retries share max_reprompts, retain existing output and control limits, and record request-scoped nudge receipts without adding them to resumed conversation context. RLM keeps its existing stop protocol. Thanks @M-Maciej for the long-proof Fleet report. (#6990)
    - OrcaRouter recommendation: /provider and /model offer a shared partner recommendation with the DeepSeek V4.1 Flash 30% top-up-match link, public referral disclosure and localized offer details. F7 or a click opens the existing pager while retaining the current route.
    - Per-scope instruction budgets: global and project standing instructions now have separate token budgets (100,000 estimated tokens each, capped at 25% of the usable context window), every trim, skip or refusal reaches the model and /context report, and [instruction_budget] policy = "refuse" stops a request before dispatch. Other tools' instruction files stay opt-in through project_instruction_imports or claude_fallback, and the table is user config only. Thanks @7jrxt42BxFZo4iAnN4CX for the design and implementation. (#6526, #7086)
    - The TUI Terminal dock now also shows the model's shell commands for the session: each running or recent command is a read-only tab with its live output, beside the interactive shells. "No live terminals" appears only when there are neither.
    - Preview: dispatch --computer starts an account cloud conversation that can also be opened in desktop. --thread continues or inspects it; --stop, --approve and --deny control its current task. Explicit --key-stdin installs provider access in the running computer's memory. Retries retain one operation key and the account/VM binding. Existing Agent Work dispatch remains available when no computer conversation is selected.
    - A long draft or paste now grows the composer past its density row limit, up to half the screen (never less than that limit) while leaving room for the transcript, so the text can be read and edited before sending. While a slash, mention or history-search menu is open the composer keeps its usual height (#7049).
    - Scheduled work can post into an existing conversation: automations, send_later triggers and tasks accept destination_thread_id. A run then starts a turn in that thread instead of a new one, retrying while the thread is busy up to the task's time limit, and a missing or archived thread fails the task by name.
    - Audit receipt as Markdown (Runtime API): format=md on the thread and turn receipt routes returns the same text the terminal shows; other formats return 400.
    - Native HarmonyOS binary: releases build aarch64-unknown-linux-ohos as an eighth target and publish a signed codewhale-ohos-arm64, so HarmonyOS users no longer need a Rust toolchain and the OpenHarmony SDK, and npm i -g codewhale there picks the native build.
    - Pinned whale routes (preview): codewhale account agents create NAME --provider P --model M pins the exact route on the whale's saved Agent, and account agents list shows each whale's provider and model.
    - Cloud dispatch reuses a configured API-key model (preview): plain dispatch picks your only running account computer and carries a portable configured model; the key is sent in memory only, bound to the account and the exact HTTPS endpoint.
    - Mistral Vibe key setup documented: the Mistral provider docs point to current Vibe Code key guidance, with its shared-allowance and billing limits. Live use in Codewhale is not verified.
    - Website: an Enterprise page at /enterprise lists what Enterprise will deliver, with no pricing or availability claim, and the FAQ is finished.
    - Runtime API: find the agent CLIs already installed on this computer. GET /v1/agents/external reports Claude, Codex, DeepSeek Harness, Antigravity, OpenCode, Kimi Code, Mistral Vibe, Qoder, CodeBuddy and Grok, with the version each one reports, whether it answers Agent Client Protocol itself, and runnable when a thread can run on it now. The probe runs --version and one initialize handshake, gets no Codewhale or provider credentials, and stores nothing. Google's agent is Antigravity (agy acp, 1.5.0 or newer); Gemini CLI is no longer listed.
    - Runtime API: check a provider key before storing it. POST /v1/providers/{id}/key/check asks the provider's own /models endpoint once whether it accepts a key, and never stores it. A key the provider rejects answers 422; a provider that cannot be reached answers 502, so a client can still save the key. The desktop app uses it so a wrong key is refused with a clear message instead of being saved. See docs/RUNTIME_API.md.
    - Website: the homepage whale comes alive. It starts as the flat Codewhale mark, is colored in as the live whale, then becomes a field of breathing lights made of the same 64 points as the desktop app. Pointing at it or picking a terminal view brings the whale back. Reduced motion keeps the still whale. Not yet published to codewhale.net.
    - Website and docs: installation now leads to a version check and a verifiable first task, article search finds text and commands with section links, and GitHub star links show the fetched count. The hero reuses the generated drone whale, and control/tool references identify v0.10.2 as the latest published release; the homepage leads with the live project and a new headline, a public roadmap and contributing guide put issues first for features, the shared project sections are translated into all 18 site locales, task guides no longer carry the retired mode instructions, and the missing-reply guide diagnoses a failing provider call without assuming the key is missing. These website changes still await deployment.
    - Chinese docs: a short setup page for people new to Codewhale (zh_hans/PROVIDER_QUICKSTART.md) walks through choosing a provider, setting an API key on macOS, Linux or Windows, picking a model and reading codewhale doctor --probe-api when the first call fails; the Receipts, Claude plugin compatibility and GitHub review bot pages are now translated into Simplified Chinese and linked from the Chinese index (#7266, #7264, #7263, #7265). Thanks @luochen211.
    Changed
    - Sub-agents inherit your instructions and know their capabilities: every child now starts with the user and project instructions pinned for the parent session (each scope capped at 64 KiB, given once even to forked children) and an identity block stating its workspace, isolated worktree and branch, file/shell/network/delegation grants and approval posture, with the rule to return a missing capability to the parent as a BLOCKER with the exact command instead of working around it.
    - Worktree guidance for write-capable sub-agents: general, implement and custom children are told to work in their own worktree (one agent per worktree, based on current upstream main), never switch or reset a shared checkout, commit coherent slices and report branch and SHA, and leave pushing, merging and cleanup to the parent.
    - Clearer sub-agent start refusals: a read-only role given deliverables, write_roots, exact_files or coordination_contracts is refused before it starts, naming the roles and saved profiles that can write; a task model that conflicts with a role or profile pin now names the roles and profiles that accept that model; and invalid-input feedback for tools with large schemas lists required fields and property names instead of echoing the whole schema.
    - Core read, file_search, and grep_files model-facing contracts: read now returns a model-visible header ([lines X-Y of Z | N bytes | truncated=...]) with 1-based line numbers (N: <line>), supports PDF pages extraction via pdftotext, fails fast with a route-capability error when reading images on text-only routes (and points to read_media for crop/detail inspection), and retains internal paging metadata; file_search now returns a compact {files, total_matches, truncated} object with truthful match counts and limit truncation; grep_files now appends caller exclude globs to default non-code exclusions unless replace_default_excludes=true, defaults context_lines to 0, and adds mode ("matches", "files_only", "count").
    - CNB and GitCode mirrors follow every published release and re-sync every half hour: Sync to CNB and Sync to GitCode now also run on release: published (a release published outside release.yml) and at :17 and :47 past each hour. The schedule re-mirrors main so a push that started no workflow still reaches cnb.cool/codewhale.net/codewhale and gitcode.com/HunterBown/Codewhale, and copies a missing latest published release tag (CNB after the inventory check; GitCode without --force), failing when a mirrored tag differs or the CNB checksum manifest is unreachable. Nothing here creates a tag or release; CNB_MIRROR and GITCODE_MIRROR still switch the mirrors off.
    - The codewhale npm package needs Node.js 22 or newer: its engines field and install check move from Node.js 18 to 22, so npm install -g codewhale on Node.js 18 or 20 stops and asks you to upgrade Node.js. Other install methods are unchanged. (CW-8205)
    - Faster secret redaction before every model request: redact_model_bound_secrets now skips lines with no credential signal through a byte-level fast path and gives byte-identical output to the previous code, checked against an unoptimized reference on a generated corpus, so long sessions no longer pay full redaction cost on ordinary text each turn. (#7347)
    - Bundled offline model catalog refreshed: refreshed the bundled Models.dev offline seed and public /models catalog to add google/gemini-4-neon, openai/gpt-6.2-astra, openai/gpt-6.2-sol, and meta/muse-ember-1.0 (each discovered from models.dev and marked unreviewed).
    - Cohesive rounded workbar frame and ocean column: the bottom, top and side workbar panels now share the composer's rounded border frame, integrate dock tabs and the close control into the top border rule, place overflow scrollbars along the right border flush with the transcript's right-edge scrollbar, and continue the Underwater theme's ocean water column seamlessly behind ordinary workbar cells while preserving selected and hovered row highlights.
    - The Underwater ocean is alive again, and quieter: the Underwater theme's water now holds a fish school, a far shoal of minnows, a visiting jellyfish, drifting marine snow, bubbles and a distant whale that crosses the deep every few minutes, on the home screen, while idle and beside a conversation instead of only in an empty session. Every creature is dimmer than before, keeps two columns and a row clear of text, and is drawn in braille at half-cell steps. The water's own colour no longer shimmers, so a tick redraws only the cells a creature moves through, at 4 frames a second when nothing else is moving. The ocean holds still while you scroll back through the transcript, while a decision is waiting, when the terminal loses focus, under reduced motion, and on 16-colour or NO_COLOR terminals; the water's breathing colour also stays still without synchronized output and in macOS Terminal.app.
    - Pickers and setup overlays share the rounded 5.4.0 frame: /model, /provider, /settings, /theme, /mode, /status, /fleet, /router and the login and connection overlays now paint one rounded, theme-aware card (ASCII corners in ASCII-safe terminals) with a right-aligned count or step pill, ▸ selection markers, ·-separated action hints and a scroll rail; /model groups its default view into Current, Pinned, Recent, Connected providers and More models, /provider gains a Configured · All · Local tab bar with section headings, /theme gains a live palette and sample preview pane, and /settings shows booleans as ●/○ with action-hint footers. New picker copy ships in all 15 locales. (CURRENT_DECISIONS §234)
    - Rounded TUI surfaces: /sessions, /automations and its editor, /help, /plugins, the pager, the context inspector, the file and feedback pickers, the launch resume prompt and onboarding now share the 5.4.0 rounded frame (ASCII corners under ascii_safe) with a hairline above the action footer; session rows show coloured mode, model and workspace badges, and automation rows show a short schedule badge such as daily 09:00.
    - Leaner tool surface and tool search: persistent terminal tools are now terminal_run, terminal_send, terminal_wait, terminal_cancel and terminal_reset (the old terminal/* names still resolve as hidden aliases and stay covered by the same shell rules); list_dir is loaded up front while get_goal, update_goal and task_shell_wait load on demand when a goal is active or a background shell job starts; tool_search no longer returns tools that are already loaded, ranks common words such as pdf, git, test or background toward the right tool, and readmits an evicted tool by exact name; calling a deferred tool before its schema is loaded now returns a failed result that lists each field's description and nested shape; and the deferred-toolbox notice is only repeated when the set of loaded tools actually changes. (CW-7957)
    - Terminal and website design tokens updated to 5.4.0: vendored codewhale-design 5.4.0 and codewhale-ratatui 5.4.0 roles (Subagent and LivePeak), exported the updated 5.4.0 CSS custom properties to the website (web/app/tokens.css), fixed adapt_fg_for_depth ANSI-16 appearance awareness (bright 9–14 on dark, dark 1–6 on light) so warnings and status lines stay legible on light 16-color terminals, and preserved green/red hues (22/52 dark, 158/224 light) on 256-color diff line backgrounds. (CW-8264)
    - Crisper 980-dot whale and activity forms in /pet: the terminal pet's 980 dots now compile from perimeter-anchored hexagonal-lattice silhouettes with rorqual throat illumination at rest and cleaner edges across all thirteen running, waiting and done forms, while keeping zero motion under Hold still and Reduce motion. (CW-6453)
    - A working turn now looks alive: while a tool runs, a soft light sweeps across its verb and status word (never the file name or command) at 15 frames a second, every running row and the footer's working clock in one shared wave; the footer clock's glow is stronger; and while the model is thinking or streaming between tool calls the composer border is lit and slowly breathes, turning gold while it waits on you. A running row's elapsed time now appears from the first second and sits after the file name (find running · READINESS.md 12s), so the name no longer jumps sideways. Quiet shells stop sweeping, idle stays completely still, and reduced motion, fancy_animations = false, 256/16-colour terminals and NO_COLOR keep steady lit states with no loops. (CW-8264)
    - A finished tool row flashes its outcome once: when a tool settles, its status mark and outcome word light briefly in the success or failure colour and fade back over about 0.7 s, so a run of tool calls reads as work completing rather than rows silently changing. The summary, path and command never flash, and reduced motion, fancy_animations = false, 256/16-colour terminals and NO_COLOR show the settled row with no flash. (CW-8264)
    - The terminal transcript folds finished work like the desktop app: when a turn ends, its settled tool steps collapse into one dim line, Worked for 1m 12s · 6 steps › (just the step count after a resume, when no time was measured), with N files changed +a -b · Enter to review under it when the turn edited files; Enter on that line opens the turn's own diff, and Space or a click opens the steps again. Failed, warning, stopped, and guarded steps (shell commands, MCP calls, reviews, plan updates, and write/edit/delete/commit/push tools) stay visible, and the headline adds 1 failed for failures. A finished sub-agent shows as one line with its name tag (reviewer · done · two findings ›) until opened, while failed or interrupted sub-agents stay expanded. A running turn (including when a follow-up is queued) and tool_collapse_mode = "expanded" are never folded.
    - One configured-model selection chain: a model id that a provider does not accept now gives the same clear error in every command (codewhale model resolve, the terminal UI, and the app-server) instead of being sent anyway by some of them, and configured default models resolve through one shared chain across every surface. (CW-8250)
    - Model limits, capabilities and prices follow the resolved route: context windows, output limits, thinking support, request wire selection, Google thought-signature and reasoning controls, and turn prices now come from the same catalog entry the request uses, so they match the model actually sent. (CW-8251)
    - Model shorthands work the same everywhere: short names that previously worked only in /provider <name> <model> or codewhale model resolve — such as flash, pro, v4-flash and v4-pro on DeepSeek-hosting routes, Anthropic opus-5-5, sonnet-5-5 and fable-5-1, Google gemini-3.7-flash and gemini-3.1-pro, Mistral codestral and mistral-code, Sakana fugu-ultra, and Xiaomi MiMo pro and text — now resolve to the same model in /model, /config model, sub-agents, speech and vision tools, and the Runtime API. (CW-8252)
    - /provider custom slot & Unix codew hard link: keep the blank Custom (OpenAI-compatible) slot in /provider Configured search and Details labeled needs endpoint instead of legacy or not checked (unadmitted route), and install the Unix codew command alias as a hard link to codewhale in the release installers and codewhale update (falling back to copying if linking fails) with explicit sibling-group ownership in receipted codewhale update and codewhale uninstall. (CW-8034)
    - Dependencies: Codewhale now uses clipboard-win 5.4.3 (with arboard 3.7.0) for the Windows clipboard, replacing 5.4.1, which its author withdrew from crates.io; updated the TLS, HTTP/2 and crypto libraries (rustls-webpki 0.103.17, rustls-pki-types 1.16.0, rustls-native-certs 0.8.5, rustls-platform-verifier 0.7.1, webpki-roots 1.0.12, h2 0.4.20, hyper 1.12.0, hyper-rustls 0.27.10, tokio-rustls 0.26.6, tokio 1.54.1, aws-lc-rs 1.19.0 with aws-lc-sys 0.47.0, and zeroize 1.9.1); and refreshed compatible transitive crates in Cargo.lock with a three-day publish-age cooldown while holding rmcp at 3.9.0 and keeping keyring, rusqlite, jsonschema, lru, parking_lot, and schemars (1.2.3 reorders generated schema properties) at their current lines. (CW-8205)
    - One reading of a model id: the model picker, requests, pricing and the context window now read a model id the same way, from one set of per-provider naming rules, so a short name or alternate spelling no longer resolves to one model in the picker and a different model, or a 128K fallback window, in the request.
    - Runtime API CORS defaults: the built-in CORS allow-list no longer includes tauri://localhost; the Codewhale desktop app does not use it. A UI that still runs from that origin can add it with --cors-origin, CODEWHALE_CORS_ORIGINS or [runtime_api] cors_origins.
    - Featured provider disclosure line: /provider and the model picker now show the localized referral disclosure directly below the featured OrcaRouter row across widths (and hide the row when both cannot fit above the list), while keeping zh-Hans and mainland China sessions hidden. (CW-8149)
    - Permission dial receipts and Plan footer label: every Shift+Tab step across the permission dial now writes one Permissions changed to … transcript receipt (including entering and leaving Plan), and switching to Plan announces Permissions: Plan (read only) instead of Ask · Plan. (CW-8150)
    - First-run setup: installer downloads retry up to three times and remove partial files after a failed attempt. Folder trust uses 1 to trust, 2 to continue untrusted, and 3 or Esc to quit; letters do nothing. Provider pickers consistently say "needs key", and the unconfigured custom placeholder says "needs endpoint" while configured-route errors remain visible.
    - Usage-reporting collector: accepts runtime schema 6 alongside existing versions and keeps schema 6 reports first-party only.
    - Source-build toolchain: Rust 1.100.0 is pinned consistently across local source builds, CI, Docker, Dev Containers and CNB recipes. The minimum supported Rust version remains 1.89.
    - Terminal widgets: narrow action hints wrap, scrollbars reach the final row, progress bars show fractional cells, focused tabs and panels are clearer, and the shared terminal kit supports measured ocean themes and reduced-motion-aware water drift.
    - Website Plugins page: The website's Plugins page now describes what the released version does, and a labelled section says what 0.10.3 adds: one Plugins place, Standard and Creator mode, and the Permissions control.
    - Website terminal frames recorded with a real model: the home page's session, model and receipt frames are now real captures of Codewhale 0.10.3 (development build) working with gemini-4-hydrogen through Google's API on a small ls.py --json task, replacing frames recorded against a scripted local model. The provider frame is now the model picker, the captions and frame descriptions in all 19 site languages name the real model, and the provenance file records how the frames were grabbed.
    - Website shows only real sessions: the docs guide terminal tour and the README image now use the same real gemini-4-hydrogen session as the home page (with the guide noting it is an unreleased 0.10.3 development build), and the scripted demo captures are gone. On /app, /plugins, /models and the home page, the earlier /app captures (conversation.webp, approval.webp, model-picker.webp) are replaced by real screenshots of the desktop development build (real engine, qwen3:4b locally through Ollama) in light and dark, with the home page showing the approval card and /plugins cropped below the development build's auto-enable sentence. The home page has its multi-agent section back, Plugins and the desktop page are in the top navigation, and /desktop opens the desktop page.
    - Model thinking: New installs show model thinking by default: it streams live in the transcript and collapses under a "Thought for …" header when the answer starts. Existing installs keep their saved setting; turn it on under Model reasoning in chat in /config.
    - Usage reporting: Installers now run their closing diagnostic with usage reporting and update checks off and print how to turn usage reporting off. codewhale doctor now says a saved opt-out comes from the config file, not the environment, and help and English notices call the feature "usage reporting".
    - External agents over ACP: Codewhale now drives external agents through the official Agent Client Protocol SDK. Request ids on the wire are strings, and an agent's error is treated as a sign-in problem only when it carries the protocol's auth-required code.
    - Website models and plugins: /models leads with recently added models, three ways to connect (DeepSeek, first-party providers, any OpenAI-compatible endpoint) and a catalog grouped by maker; Ollama and OpenRouter are listed but no longer featured. /plugins leads with "Everything is a plugin" (credited to DeepSeek Harness) and shows MCP connectors from the connection catalog.
    - Gemini 4 output limit: Gemini 4 Carbon and Gemini 4 Argon now allow 65,536 output tokens per reply, up from 32,768, matching Google's published limit.
    - Website brand and app pages: the header, footer and favicon use the black-and-white Codewhale mark, keeping the colored whale for character moments. New /app and /docs/account pages say plainly that the desktop app is a development build, the browser app is not open yet, and how sign-in works where it exists. The terminal demo was recaptured from the 0.10.3 source.
    - Website measurement: the first-party ingest now accepts a closed website funnel schema while preserving existing runtime and browser batches. Reader confirmations remain self-reports, new website data stays first-party, and no deployment or live conversion gain is established by the source change.
    - Installer PATH ending: when codewhale is not on PATH, the installers' last lines are now the copy-paste export PATH=...; hash -r command and codewhale --version, and when it is on PATH the last line is Next: codewhale --version; the Computer Use notice moves above them and shows on macOS only. (CW-8030) The installers reach people through the website, so this is not deployed yet.
    - The cost label shows an exact cost, an estimate or unknown.
    - Docs for agents match the release: /llms-full.txt and /docs-markdown/* now serve the documents as they were at the published release tag, from a committed snapshot that is checked against the published release.
    - Extension host (experimental): trusted plugins ask for review once more. With extension_host turned on, plugins you already trusted are shown for review again after this update, because the capability table they were reviewed against gained the remote service. No plugin can use that service yet: none is granted it.
    - Website text for agents: llms.txt now gives agents the install steps for the released version, the current release and the state of each part of Codewhale, from the same content as the pages. /docs-markdown/install.md serves those install steps as a page, and the main-branch documents beside it now say which release they can run ahead of.
    - Website design: codewhale.net now uses the desktop app's 5.3 light and dark colour roles and Geist / Geist Mono, replacing the warm-paper palette and Shannon Sans; the vendored design copy is synced to 5.3.0 and the whale-road ocean bands are unchanged.
    - Extension host: the sessions and systemPrompt services now come from a reviewed DSH adapter instead of inline shims, and sessions.flush refuses an empty checkpoint ticket. Session reads and events and the agent/pre-step hook are still not available to plugins. (CW-7959)
    - Extension host: DSH service adapters now have one ticketed dsh/broker request to the core, each ticket is bound to the plugin, the service and the session, and every service (workspace, llm, network, settings, catalog, terminal and remote) refuses with a typed not_available until its broker lands. Nothing new is offered to plugins yet. (CW-8012)
    - Fleet member starts are now durable: replaying an operation key after a timeout or restart returns the original worker, and GET /v1/threads//members/operations/ reports the outcome. A member start now answers with state accepted (200) or unknown (202) instead of started or queued. Verified by local HTTP tests on Linux; a real Engine restart is simulated, not exercised. (CW-7964)
    - Plugin activation now says when a requested service belongs to the Codewhale core and is not exposed to plugins yet. No plugin, provider or installed-app run exercised it; checked by the extension-host tests only.
    - Codex App Server v2 contract record (paused, not part of 0.10.3): the selected Codex v2 contract is frozen as a generated manifest in the protocol crate, with typed Rust and TypeScript shapes checked against the pinned Codex schema. It changes no wire behavior and adds no dispatch, so nothing is reachable through it yet.
    - Website copy: The site's headline is now "The model can be anyone's. The agent should be yours.", with its subhead, belief and labelled product map in every language.
    - Website routes: Pages that repeated each other now redirect to the one page that does the job, the header and footer list only pages that exist under their current names, the sitemap drops redirected and catalogue pages, and machine-drafted translations say so.
    - Website privacy: The website no longer counts anything when your browser sends Global Privacy Control or Do Not Track, and the privacy page says exactly what is counted and how it is keyed.
    - Whale forms replace the large activity words: while the agent works, the pet's 980 dots now leave the whale and become the thing the work is, in motion: a wrench turning a bolt for running commands and tools, a pencil writing for edits, a book with a turning page for reading, a lens for searching, a bubbling flask for tests, a turning globe for browsing, a pointer clicking for computer use, settling layers for memory, a bulb for thinking, a typing speech bubble for replies, a pod of small whales for parallel agents, a ringing bell when it needs you, and a check mark when a turn is done; then they return to the whale. Both whale styles and the still pose use the forms, and the caption under the pet keeps the activity in your interface language. /pet language and the studio's large-text language control are removed; saved appearance files that still name a language keep loading. (CW-6453)
    - Model commands and routing: codewhale model list now lists every custom endpoint you have configured, under its own name. codewhale model resolve no longer refuses a model on a custom endpoint, router or local server whose model list has not been fetched yet; once a list is fetched, a model missing from it is still refused. Automatic routing marks a context window as verified only when the route itself supplies it, and no longer reports a guessed output limit.
    - README and contributor credit: the repository front page now opens the way the website does: the line "The model can be anyone's. The agent should be yours.", one sentence on what Codewhale is, the install command and one picture, with reference detail moved into the linked guides; the 18 translated READMEs follow the same structure and say they are machine-drafted. The contributor wall and the website now count the same 435 people (415 GitHub accounts and the commit authors whose email is not linked to an account), where the website had counted accounts only. DEPENDENCY_SECURITY.md moved into docs/dependency-maintenance.md, and .github/SUPPORT.md says where to ask for help.
    - Plugin docs and plugin-creator: Docs now say everything you add is a plugin. The bundled plugin-creator skill no longer tells an agent never to trust or enable a plugin (in Full Access it may, for one it wrote and installed from its project), points code and screen plugins at cordis-plugin-development, and an untouched copy from 0.10.2 now upgrades. The Chinese extension and Runtime API docs now say editor ACP sessions get plugin tools and configured MCP servers.
    - ACP server on the official SDK: The ACP server (codewhale serve --acp) now runs on the official Agent Client Protocol SDK. Its messages follow the official v1 types, and it no longer advertises the non-standard modelSelection capability or session models field. Session list entries carry createdAt and messageCount under _meta.codewhale, terminal sign-in methods are advertised only to clients that enabled terminal authentication, a notification is never answered, a permission request always carries text, and session list and configuration requests are served while a turn runs, response ids are echoed unchanged for every client (the Zed-only string rewrite is gone), and initialize without protocolVersion is refused with -32602.
    - ACP file tool calls name their file and show the edit: in codewhale serve --acp, a read or edit tool call now carries its file as an absolute locations entry, so an editor can follow along, and a file write or edit starts with an ACP diff of the requested text. Shell output stays text; ACP editor terminals are not used (#7280).
    - Website home page, rebuilt around one first screen: the headline stays "The model can be anyone's. The agent should be yours.", centred, with one plain sentence under it that says what Codewhale is (an open-source coding agent for your terminal, written in Rust, working with any model and able to split a task across several agents), the install command, and one wide picture of a real terminal session that runs off the bottom of the first screen. A row of facts under the picture takes its counts of provider routes and models from the published release, and the facts row lists many agents on one task only while the release has it. The route of where the product is going moves lower and smaller, and the home page names no other coding agents. The dated OrcaRouter offer strip, English only, with its referral disclosure, stays below the first screen until it ends; the models and contribute pages keep their own content. The new text in the 17 non-English languages is machine-drafted and is labelled as such in the footer; the Arabic page now reads the opening sentence right to left. Unused home copy was removed from all 18 site languages.
    - Responses dialect profiles: Codex, DeepSeek and Concentrate Responses behavior now comes from one checked dialect table instead of per-provider code, a custom wire = "responses" provider can set responses_profile = "standard" (the default when omitted), and preview shows the profile each Responses request used. A Responses client whose route cannot be resolved now fails when it is created rather than at its first request (#7261). Thanks @SamhandsomeLee.
    - Website facts: the website now reads the installed version, asset list and repository numbers from the published release and a dated snapshot instead of the source tree, shows nothing rather than 0 when a live number cannot be read, stamps its facts revision and date together, no longer calls the desktop app native, says when the release was read, and drops the price from its structured data. This is a source change and is not deployed yet.
    - Website surface status: the status of the terminal, browser, desktop, cloud and accounts surfaces now comes from typed states with copy in every locale, the desktop download appears only for a signed, notarized release with a checksum, the cloud-invitation and plan switches are committed values that default to off, the partner strip expires at render time, and repository numbers show when they were read. This is a source change and is not deployed yet.
    - Website capabilities: the website now lists a capability as available only when the published release has it, labels features that exist only in source as not yet released, keeps held features (cloud computers beyond invite-only, other vendors' agents over ACP, and plans) hidden behind committed switches that default to off, and prints provider route, catalog model and tool counts as they are at the published release tag instead of on main. This is not deployed yet.
    - Installer uninstall lines: the installers now print the uninstall command, the update-mode sentence and the shell-profile marker sentence only when the Codewhale they just installed reports an uninstall command, and older releases such as a pinned v0.10.2 get the manual removal steps instead of a command that would be sent to the model as a prompt. (CW-8029) The installers reach people through the website, so this is not deployed yet.
    - ACP: editors can start, list, load, prompt and cancel Codewhale sessions and approve or reject tool permissions through the Runtime; prompts with image or audio blocks and relative session directories are now refused instead of ignored, and edit and read tools report the right kind. Sessions an editor drives now run the plugin tools (TypeScript and DSH, when the extension host is on) and the MCP servers configured in Codewhale; their calls show as ACP tool calls and ask through the session's permission setting, and initialize reports the state under agentCapabilities._meta.codewhale. MCP servers an editor passes in mcpServers and configured shell hooks still do not run in ACP sessions. A real-editor journey is not yet proved.
    - Plugin host services and who approved: a plugin can now be granted a Codewhale host service, and only by a review that shows it. The review names each service and the plugins it is shared with, and every review records who approved it: you, the agent (in Full Access, in Auto-Review, or from a shell command carrying the agent's mark), or the command line with --yes; who turned the plugin on is recorded too. Reviewed plugins share one process while a plugin the agent approved runs in its own host process for that project, so a service works in a host process only while every plugin loaded in it holds the same grant. A plugin the agent approved is active only in its own project and its code never runs beside the plugins you reviewed until you review it. A plugin reviewed before this release holds no grant until it is reviewed again. Once a plugin has been reviewed or turned on in this release, Codewhale 0.10.2 and earlier cannot read the plugin state file and turn every plugin off when run on the same home folder. (CW-8012)
    - Plugin UI: the Runtime API now serves reviewed DSH client closures on six seats (customize.plugins.detail, conversation.composer.dock, conversation.chat.node, workpane.panel, sidebar.section, command.row) with coded refusals, drops a plugin's UI grants the moment it is disabled, revoked or uninstalled, and adds a plugin route bridge that refuses until a plugin web server exists. No real DSH package has been served end to end yet, and a client that imports @deepseek-ai/dsh-client-* modules is still refused. (CW-7956)
    - Terminal Plugins screen: The terminal's Extensions screen is now called Plugins; its tabs filter by kind (Installed, Skills, Connectors, Hooks, Marketplace, Command), and /plugin is listed with the main commands. /skills, /mcp and /hooks work as before.
    - read pages in lines only (breaking). One read call returns at most 2,000 lines — the default and the maximum limit — inside a 50 KiB output cap, and a line longer than 2,000 chars comes back truncated with a marker instead of dead-ending the read. The model-facing max_bytes parameter is gone: continuation is always the next line offset, and footers say only that ("Showing lines 1-51 of 2000; output cap reached. Continue with offset=52."). The byte cap stays as an internal bound; operators can still widen it process-wide with [workshop] read_result_max_bytes.
    - A leaner first request. The pinned system prompt sheds its duplicate guidance: the base layers shrink to about 4,300 characters, the skills index no longer rides in every prompt (load_skill searches and lists the catalogue on demand), and MCP Registry guidance moved into the registry_sync and tool_search descriptions, where it is read when the tool is used instead of on every turn. This changes the session-pinned prompt, so each session re-pins its prompt cache once after upgrade.
    - Workspace instructions arrive as a conversation message. AGENTS.md and other standing instructions are delivered once as a user-role history message instead of being pinned inside the system prompt, capped at 64 KiB. The guidance is unchanged; editing the file now takes effect as a visible message rather than silently rewriting the pinned prefix.
    - grep_files is eager; workflow and the context archive load on demand. The default first-turn tool set trades workflow, context_archive_get and context_archive_search (now one tool_search away, including after compaction) for grep_files, and tool descriptions are trimmed to the first-relevant detail without changing any schema.
    - Sub-agent shell runs no longer wait on a peer's write claim. A child that holds a shared write claim can run bash while another child writes; the claim still coordinates bounded File/Edit/Patch targets, and the execution envelope, sandbox and approval posture govern executable work. A bounded write tool whose target overlaps a live peer still refuses. The old refusal told analysis agents to re-run with read_only=true, which cost steps without protecting a peer's files.
    - The footer cost chip shows confirmed dollars only. A session with some unpriced turns shows exactly the confirmed amount, such as $0.34, instead of subtotal 0.34 + unknown (request outcome unknown), and a session with nothing priced shows no cost at all instead of cost: unknown (…). The accounting is unchanged: unpriced turns stay excluded rather than guessed, and /cost still lists each one with its reason, now in plain words ("the provider never confirmed the request finished", "this session predates cost tracking"). The price view says unknown for a session with no confirmed price.
    - The transcript shows the work, not the decoration. The idle footer no longer carries a Work bar label (its key still opens the dock); fish, bubbles and the whale cameo swim only on the empty start screen and never behind transcript text; a streaming reasoning block is one Thinking… line instead of Thinking… above reasoning..., and the hidden-reasoning line and window title say thinking too; the tool-card hint reads ⌥V details in dim text instead of ⌥V:details.
    - Sub-agents and goals by default. The constitution now tells the agent to start independent parts of a request as parallel sub-agents in one message, keep working while their results arrive on their own, and end the turn when only waiting remains; to give each child a complete prompt and its own files; to inspect a write-capable child's evidence, review the diff and run the checks itself; to have an independent reviewer try to refute a non-trivial change before calling it done; and to start a goal for any request, in any language, whose verifiable end state needs more than one turn. Sub-agents, workflows and goals within the current request are in scope; spending real money (purchases, paid providers, billing) still needs the user's express authorization. Cost alone is not a reason to stop; only limits the user or configuration sets apply. This changes the session-pinned prompt and tool descriptions, so each session re-pins its prompt cache once after upgrade.
    - Operate's contract is retired. The Engine no longer appends the Operate contract to a session; its review, cost and evidence rules now live in the constitution for every session. Saved sessions that contain it still replay.
    - The Operate mode is gone; Work and Plan are the two modes. The Shift+Tab permission dial reaches both, /mode and the config editor offer only those two, and a saved default_mode = "operate" loads as Work with a one-time notice that /fleet runs parallel agents. operate, operation, ops and 3 still parse, as Work, so an old setting or script never errors. Fan-out is unchanged — 64 live sub-agents per message, workflows at a 64 default with a 128 ceiling — while the Operate-only launch-concurrency floor and its top-level child auto-accept posture are gone; a child's edits follow the permission posture like every other action. "Plan stays Read Only; this applies in Work" now says exactly that.
    - Clearer tool text. The agent description leads with when to delegate, gives one trigger per role and an example child brief, and drops Operate and legacy wording; the start receipt says results arrive automatically. create_goal and update_goal say when to start a goal and what complete, blocked and yield mean (blocked means the same obstacle persists; difficulty is not blocked). tool_search lists the deferred tool groups. The eager tool schemas shrink by 681 bytes.
    - Workflow fan-out default 16 → 64. [workflow] max_concurrent now defaults to 64 live agents per run, matching sub-agents; the per-run ceiling rises from 16 to 128. No spend caps were added.
    - Bundled skill goals is now personal-goals. It tracks personal resolutions in goals.md and no longer collides with goal mode; goals still resolves to it. An untouched installed goals copy becomes personal-goals on upgrade; an edited one stays as goals.
    - Each sub-agent is told its name, its scope and that its final answer is delivered to the parent automatically.
    - Thread-owned terminals (Runtime API, breaking): Engine terminal shells now belong to the conversation that started them, so two conversations using term-1 in one folder get separate shells instead of sharing cwd, running command and output. Clients list a thread's shells at GET /v1/threads/{id}/terminals and drive one at /v1/threads/{id}/terminals/{terminal_id}/output|input|resize|kill; a reset shell, another thread's or workspace's shell, or one from before an Engine restart answers 404 instead of attaching to a same-named shell. The name-addressed /v1/terminal/{name}/* routes now answer 410, and /v1/runtime/info advertises thread_scoped_terminals in place of the four terminal_* flags. Client input meets the thread's shell consent and sandbox-reuse guard, and a lone Ctrl-C uses the dock's confirmed interrupt. In the TUI, a new conversation starts its own term-1 rather than reusing the previous conversation's shell, which the dock still lists.
    - Ask asks before every edit; new Accept Edits posture (#5185, #5186): Ask now opens a card for file edits inside the workspace too, as its name and the Plan handoff ("Edits and commands ask you first") promise. The in-repository edit rule moved to a new posture, Accept Edits (Claude Code's acceptEdits): an edit whose every target stays inside the workspace git work tree runs without a card, while .git, .codewhale, .env*, credential and key files, folders without git, commands, network and connected apps still ask. Accept Edits is the default (see the permission dial entry below). /permissions, /status, /config and the Plan handoff offer it; the Runtime wire spells it permission_posture: "accept_edits", settings and config.toml accept-edits. Project config may tighten Accept Edits to Ask but never loosen Ask to it. ACP sessions run it as Ask.
    - One permission dial; Tab no longer changes the mode: Shift+Tab steps Ask → Accept Edits → Plan → Auto-Review → Full Access → Ask. Plan is the Plan mode; every other stop is Work with that posture. Tab only completes commands, file mentions and suggestions. The footer shows one chip for the current stop with Shift+Tab to change; the separate mode chip and its Tab hint are gone. The dial moves mid-turn too, into or out of Plan, and applies at the agent's next step without restarting a response or changing the pinned prompt. When config or managed policy owns the posture, the dial still alternates between that posture and Plan.
    - Accept Edits is the default posture: new installs, unset settings and new Runtime threads that send no permission_posture start on Accept Edits. A saved permission posture, including ask from an earlier build, is preserved. The "Normal agent" setup preset now writes Accept Edits and Settings shows it as the unconfigured default. Saved choices, including Ask on existing and new installs, survive upgrades and restarts, and managed approval policies keep their stricter startup posture when the dial is used. ACP still runs Accept Edits as Ask.
    - Full Access copy says what it does: its settings description now reads "Tools run without asking first, and commands can reach anything on this computer." in every language, instead of implying a folder fence.
    - Operate compatibility: /mode operate selects Work and says Operate was retired; a Runtime API request with mode: "operate" runs as agent with the default posture and logs one notice per process, never an error. Agents forked from a conversation saved by an earlier Operate build no longer inherit its contract message.
    - Brighter terminal working states: the Ocean palette has stronger accents, and active work uses a restrained left-to-right text sweep. Quiet and reduced-motion settings keep stable working indicators. The shared codewhale-ratatui kit carries the same palette and motion updates.
    - Managed ACP requirements outrank Full Access: when organization requirements manage approval policy, ACP no longer lets --full-access override them. The TUI already locked YOLO this way; ACP now matches.
    - Cleaner, safer Markdown export: headings no longer carry Content N: numbering, a text block that opens a message is bare, tool results show their tool name and appear under a tool role instead of user, and Error: appears only on an error. Tool output is now fenced, so a tool result can no longer forge a heading or a message in the transcript. A trailing --force is a flag rather than part of the path. /share now publishes the same HTML page as /export file x.html, still as a redacted secret gist after confirmation.
    - Internal coarse split: Runtime owns bounded owner work, Paths owns the protected socket layout, and Protocol owns shared avatar data. App Server now owns the Runtime host and control transports previously embedded in the TUI. Engine and Sandbox do not depend on App Server; the remaining Stage B boundaries stay open (#5586).
    - Newer DeepSeek Harness plugin compatibility: the Native host targets DSH 0.2.2-rc.1 with Cordis 4.1.0 and refreshed reviewed composition packages (loader, include and group 1.1.0). Reviewed compositions are still never rewritten, and plugin module loading still goes only through the reviewed closure. Boolean deferLoading hints are accepted while the Engine keeps tool-loading policy; when remains refused. Plugins receive host services only through explicit reviewed grants; dsh.client UI rendering remains gated until client bootstrap support lands. The changed compatibility digest requires fresh plugin review and trust. The legacy preset adapter keeps its recorded source pin; this is local compatibility evidence, not release qualification.
    - Goal tool guidance while awaiting an answer (#7177): the tool schema now tells the model to yield when it needs the user’s answer and reserves blocked for stalled progress. Existing runtime semantics are unchanged; no live-model qualification is claimed. Thanks @SparkofSpike.
    - A goal pauses to ask instead of inventing the answer (#7175): the goal continuation prompts now tell the model to call update_goal with status: "yield" when the next pass needs an answer only the user can give, and that asking in prose does not pause the goal. This is prompt steering, not enforcement: a model that ignores it still keeps the goal active. Thanks @SparkofSpike.
    - Newer model rows in the offline catalog: the bundled seed now carries kimi-k3.1-pro and kimi-k3.1-pro-highspeed (Moonshot), MiniMax-M3.1-Flash (MiniMax and its Anthropic-compatible endpoint) and gpt-6.1-terra (OpenAI), which Models.dev already listed and Codewhale did not pin. Live refreshes from Models.dev were already showing these online; the seed is what a first run, an offline start and a deep-offline install read, so it is now re-locked at 2026-10-30 and rendered. seed render --check matches and defaults audit reports no stale default.
    - Skills ownership (internal): skill discovery, provenance, mutation and bundled skill content move into codewhale-skills. Native roots still use the existing host manager's selection and lifetime checks. (S20, #5316)
    - Model pricing ownership (internal): hand-sourced price metadata and recorded-time rules move into codewhale-models; cost auditing and live catalog callers use the same owner. (S24p1, #5316)
    - codewhale-error-taxonomy crate (internal): error_taxonomy moves out of codewhale-tui into a new crate; the LlmError envelope conversion stays in the TUI crate until the model-wire split. No behavior change. (N13, #5316)
    - codewhale-tui-kit crate (internal): terminal rendering helpers (markdown, diff, text width, paste burst, OSC-8, streaming) move out of codewhale-tui into a new crate, and syntect is no longer a direct codewhale-tui dependency. No behavior change. (S52, #5316)
    - Terminal kit on design tokens 5.0.0: the vendored codewhale-ratatui reuses the current shared blue, Ocean grounds and contrast-checked state colors (upstream codewhale-hq/codewhale-ratatui 8311b65). Primary actions use blue fill with white text; raised panels keep a visible edge where 256-color backgrounds collapse. Built-in TUI palettes retain their own overrides, and existing working-motion and reduced-motion guards remain in place.
    - Fleet workers run the same Codewhale: codewhale fleet run and Runtime API Fleet runs (POST /v1/fleet/runs) now start workers from the running codewhale binary instead of whichever codewhale is first on PATH, so they work with a minimal PATH and never pick up a stale copy. CODEWHALE_FLEET_CODEWHALE_BINARY still overrides it. (#7119)
    - Switching provider lands on its current model: /provider stepfun now selects Step 5 Preview instead of the older Step 3.7 Flash; a model you saved for a provider is still kept. /model now lists the current provider's own models (bundled and live, newest first, up to 20) instead of only the selected one. Search also matches ids typed without separators (step5). While you search, Shift+P and Shift+F type their letters rather than pinning or adding to Fleet, so Step-5-Preview can be typed in full; Ctrl+P and Ctrl+F pin or add the highlighted row at any time.
    - First run without a key: /provider now opens on the full provider list (DeepSeek and the other cloud providers) when only a keyless local runtime is set up, no longer shows a disabled Antigravity row that was never configured, and Shift+A toggles the view like a. A local Ollama model that is not loaded yet is loaded before the first turn, so the route uses its real context window (for example 32K for qwen3:4b) instead of an 8K fallback that refused the second message with "~5120 tokens usable"; the footer's context reading follows the same window. The TUI resolves an unknown Ollama default to an installed chat model on startup. If the daemon or chat model appears later, selecting /provider ollama retries discovery. Embedding-only tags keep the model unresolved. An installed Ollama model is listed in /model and GET /v1/providers/ollama/models once its own catalog has answered, even when another provider is active. (#7113, #7114, #7116)
    - Computer Use delivery: the standalone Engine uses the separately released Computer Use plugin; desktop packaging owns its embedded background helper. The marketplace pins plugin 0.16.3 and its archive checksum. Consent tools load on first use, and decisions still require a human approval card.
    - Upgrading over older installs: codewhale update writes an install receipt for a copy installed before receipts, and moves a mismatched codew to the recovery folder and replaces it instead of refusing the update. The curl | sh and archive installers upgrade an earlier Codewhale in the install directory instead of refusing, keep the old files in the recovery folder rather than as .bak files beside the commands, and finish with codewhale doctor --installs --brief; a symlink or a non-Codewhale file at the destination is still refused. The Windows archive installer keeps the replaced files in the recovery folder too.
    - The desktop app's Engine is never self-updated: codewhale update refuses to write inside *.app/Contents/MacOS/ or the app's pinned Engine store, and the update notice for that copy says to use Codewhale > Check for Updates.
    - GitHub Action needs an explicit provider: the Action's provider input no longer defaults to the codewhale account relay. Name your BYOK provider (or codewhale for a separately verified account machine key); a missing provider stops with configuration_missing before any download or model call. The repository's own (disabled) review workflow now pins CLI v0.10.2 by default instead of v0.10.0.
    - Local Ollama defaults now come from chat-capable tags, and /provider ollama refreshes the live catalog before switching. Exec and Runtime API defaults use the same discovery path. Fresh context observations come from loaded models' served windows; unloaded models retain an explicitly unverified fallback (#5848).
    - The Runtime API's turn.usage receipts now carry each model call's priced cost on the route that served it and the prompt size the provider billed, so a client can follow a long turn while it runs. The mobile control page shows live token usage and a partial cost estimate in its header, keeps the estimate after the turn settles, starts fresh for the next turn, and counts a replayed receipt once (#7074). Thanks @gaord.
    -  --full-access is now the documented flag for Full Access (--yolo stays an alias), and serve accepts it after the subcommand: codewhale serve --acp --yolo used to fail with "unexpected argument". serve --acp also writes one stderr line naming the permission and sandbox it runs with, and the ACP permission option's Full Access hint names the working command. A configured sandbox_mode = "danger-full-access" still never widens Ask or Auto-Review (#6992, #4955). Thanks @eugenicum for the request.
    - Ctrl+C on an idle composer that holds a draft now clears the draft instead of arming exit, and Ctrl+Z restores it. The "press Ctrl+C again" exit prompt arms only once the composer is empty, and Ctrl+C during a running turn still cancels the turn first. Clearing a draft with Ctrl+C or Esc also resets a pending exit prompt (#6237, #7084).
    - While a background job runs, the git status probe now backs off after 30 seconds without input or engine events, as it already did in an idle session, instead of starting about a dozen git processes every 2 seconds for as long as the job lives (#6728).
    - An idle session wakes less often. While an approval, elevation or question prompt waits on you, while a background job runs, or while only a once-a-second label ticks, the event loop now relaxes to its 250 ms quiet poll instead of polling every 24 to 48 ms; animations and the prompt's timeout still wake it on their own deadlines. The terminal input thread polls every 200 ms instead of 50 ms after 5 seconds without input. Measured on macOS with release builds: an approval wait went from 29 to 12 timer wakeups per second, a background job from 32 to 16 and an idle composer from 25 to 11 (#6728).
    - Saving a session no longer copies every message body: journal entries share their content, so the snapshot taken on each update copies ids and pointers. Resuming a session compares a leftover crash checkpoint against the saved document's metadata instead of parsing the whole document first, so --resume and attach read the document once (#6842).
    - Multiline mode now has a send key on every terminal: with composer_multiline_mode = true, Enter inserts a newline and Alt-Enter sends. Shift-Enter also sends where the terminal reports it distinctly; on Linux terminals that report it as plain Enter, multiline mode previously had no way to send. Ctrl-J always inserts a newline. Thanks @luestr for the report. (#7093)
    - Faster repository checks: the Engine reads a repository's HEAD in-process instead of starting git, without running the repository's filters or fsmonitor.
    Removed
    - Standalone pet apps removed: the standalone macOS, iOS and Android pet apps, the standalone browser demo, /pet window and F9 are removed. The pet is shown by the terminal (/pet), its browser view (F8 or /pet appearance) and the Codewhale apps; the shared pet owner and its recorder are unchanged.
    - Removed (crate API): the unwired codewhale-hooks dispatcher and its stdout, JSONL and Unix-socket sinks; codewhale-core's session, journal and ids modules and the hooks argument of Runtime::new; codewhale-runtime::resource_telemetry; ten unreferenced public functions; and the duplicate codewhale-agent crate. hook_sinks.unix_socket_path still parses and is ignored. CLI, TUI and app-server behavior is unchanged.
    - Claude subscription sign-in (breaking): Claude subscription sign-in is removed: it used Claude Code's sign-in, which Anthropic doesn't allow other apps to use. Use an Anthropic API key instead, through codewhale auth set --provider anthropic, /provider setup anthropic or ANTHROPIC_API_KEY. codewhale auth claude and /auth claude now explain the removal, and /provider setup anthropic goes straight to API-key entry. A config that still selects auth_mode = "oauth" for Anthropic fails with the same guidance instead of switching billing to an API key. Saved Claude sign-in files are not deleted; codewhale logout removes them with your other saved credentials (Refs #6932).
    Fixed
    - Stopping an external agent while it waits for approval now records the turn as interrupted even when the agent replies that it finished. (CW-7965)
    - Provider errors in the terminal history now show whether a request was never sent, was rejected, or ended with an unknown outcome. The same detail is available after reopening the session.
    - Large session usage ledgers keep settled and unresolved usage and discard only the oldest routing diagnostics needed to stay within the storage limit. Thanks @donglovejava (#7449).
    - Shell policy: statically available AWK and sed programs are scanned for shell commands. AWK analysis that exceeds its scan budget is treated as unresolved. (CW-8300)
    - Bounded terminal-multiplexer policy parsing: tmux arguments and prompt templates are checked within a finite allowance. Expansion that runs out of allowance is reported as unresolved. (CW-8302)
    - Shell groups preserve command-owned input: policy evaluation keeps each command's explicit stdin source when a redirection supplies default input to its enclosing group. (CW-8303)
    - Sub-agent budget-stop receipts show clipped output: the receipt gives the character count and points to the retained child transcript. It also keeps the workspace preservation receipt visible when the partial output is long. Thanks @7jrxt42BxFZo4iAnN4CX for issue 7434. (CW-8317)
    - TUI command input: while the terminal’s raw-paste fallback detects a possible paste, Enter inserts a newline before slash completion can change the draft. This also applies to fast typing that matches the paste cadence. After the brief paste window passes, Enter can submit the command. (CW-8301)
    - Permission controls during an approval: Shift+Tab and Full Access in the approval’s additional choices open permission settings while leaving the current approval pending. (CW-8320)
    - Tool-call identity: generated IDs stay distinct from literal provider IDs, including when a provider sends the ID late in a stream. Thanks @donglovejava (PR 7423).
    - PR review: pass prompts direct the reviewer to inspect relevant callers with available read-only tools. Findings stay anchored to the commentable diff, and coverage follows the pass manifest. Thanks @swf1996120 for the report (issue 7435).
    - Headless resume: exec --resume asks for explicit provider or model reselection when the saved endpoint or account binding changes. (CW-8311)
    - Terminal translations: Auto-Review fallback, provider badges, theme previews, and automation schedules use the selected language.
    - AICraft setup: the bundled descriptor lists the mainland and international API endpoints. Thanks @BX166 (PR 7421).
    - Background shell output: explicit background bash jobs retain the complete piped output and return its artifact from task_shell_wait.
    - Session recall: session summaries omit internal tool-history repair receipts while preserving the surrounding conversation and tool summaries.
    - Workflow gates block roles written with older names: a gate whose role or blocks_role uses an alias such as implementer, verify or verifier now matches the canonical role a task is dispatched under, so the blocked role waits for the gate and receives its handoffs instead of running early.
    - Workflow gates apply to implicit roles. A blocked planner cannot start a reducer or receive its inputs until the gate passes.
    - Tool surface fixes: a ```repl block in an ordinary assistant reply is now shown as text and never executed (only a recursive rlm turn runs its fenced Python); the lsp tool accepts include_warnings for diagnostics/read_lints, lets symbols with a query omit path to search session language servers in a stable order with shared result bounds, and can run in parallel with other reads; remember reports why a proposal was rejected or could not be stored and adds action: "list" to look up current notes for a correction, without initializing an absent store, checking workspace freshness and applying the limit only to eligible notes; the diagnostics tool runs its git/toolchain probes off the async runtime; and resuming a crashed session preserves signed thinking and interrupted turn boundaries during tool-history repair.
    - Shell artifact writes stream large output. Background output remains available for another collection attempt if the artifact write fails.
    - Automation confirmation controls stay visible and usable in short terminal windows.
    - Stop terminal scroll-away redraw flicker ("scrolling demon"): scrolling up into transcript history now holds status animation ticks, the working clock glow, and Underwater ocean/completion animation still until you return to the live tail, preventing Terminal.app and other terminals without synchronized output from repainting at 8–12 fps while reading history during active multi-agent turns.
    - Long shell output no longer turns into a tool error when a background process keeps the pipe open: a bash or run_tests command that printed more than the in-memory limit while a detached child (for example ssh -fN) still held stdout, or a Windows cancel, now returns the retained tail with a "Full output was not persisted" notice instead of failing the call and retrying its completion every turn.
    - The offline model catalog uses the updated Models.dev prices for OpenRouter’s GLM 5.2 and DeepSeek V4 Pro routes.
    - Verbose Cargo tests keep recoverable shell output and flag omitted bytes. When capture is incomplete, the test result omits aggregate counts. Completed shell output remains retrievable after a provisional preview.
    - Delegated test runs stay in the foreground when the child cannot collect a background job. Managed Cargo test runs preserve argument boundaries on Windows, including spaces and ampersands in workspace paths.
    - After a connector session expires, Codewhale checks the replacement operation before retrying. Calls carrying an explicit consent attestation require a new request. (CW-8312)
    - Terminal output preserves Unicode alongside shell formatting. Test jobs retain their child owner, and a child without permission to wait for a detached job runs tests in the foreground. ACP approvals show the requested path and operation when a verified file diff is unavailable.
    - Auto-Review review failures ask you instead of blocking: when the Auto-Review reviewer times out, cannot be reached, answers incompletely or unparseably, or the review context is over budget, it now retries once after a timeout or transport failure within the same 90-second budget, then opens the normal approval card for that call on an interactive turn you are attending instead of blocking it. Child workers and unattended or headless runs still deny fail closed, now with a message that says the review failed rather than that the action is unsafe. (CW-6881)
    - TUI recovers terminal modes after a caught panic: when a caught panic runs the process panic hook and restores the terminal, the event loop now re-enters raw mode, the alternate screen, and keyboard/mouse/paste modes on its next foreground iteration instead of leaving input degraded until restart.
    - TUI keeps per-workspace plugin commands and requires saved rules for always-allowed receipts: listing another workspace's plugin commands no longer evicts the first workspace's cached plugin command sources on subsequent reads, and the Always allowed in this repo approval receipt is now emitted only when persisting the permission rule to disk succeeds.
    - Cached toolbox tools obey the schema budget and execute_tools bounds escaped string returns: tool_search now runs already-cached tools through the same protected-set budget check as newly admitted ones (without double-counting pinned tools or reporting retained tools as held), and execute_tools string truncation now measures JSON-encoded byte length so escape-heavy strings cannot exceed the 16 KiB return cap.
    - Gemini OpenAI-compatibility parallel tool calls, gemini-4-hydrogen xhigh effort, and error envelopes: Google /v1beta/openai sessions no longer fail permanently after parallel tool calls because only the first tool_calls entry in an assistant message carries extra_content.google.thought_signature, streaming delta.tool_calls chunks that omit index no longer collide onto slot 0 or drop continuation thought_signature fields, gemini-4-hydrogen preserves reasoning_effort = "xhigh" while Gemini 4 and 3.1/3.8 models without "minimal" map off/minimal to "low" so outbound catalog checks succeed, and single-element JSON array HTTP error responses ([{"error": …}]) surface their provider message, quota code, and retryDelay.
    - Scrolling up into history no longer flickers ("scrolling demon"): while the transcript is scrolled away from the live tail, status animation ticks, the working clock glow and the Underwater ocean and completion animation hold still until you return to the tail, so terminals without synchronized output such as Terminal.app stop repainting at 8-12 fps while you read history during an active turn.
    - DSH package import can no longer copy files from outside the package through a linked skill folder: a local DSH bundle whose customSkillDirs directory holds a symlinked skill directory or Markdown file is now refused with the existing "Source paths must not contain links or reparse points." message instead of reading through the link and copying outside files into the installed plugin's skills. Enumerated skill sources and every copied directory root are now checked with symlink_metadata, matching the containment rule the rest of the import already applies.
    - DSH plugin clients at the package root can use relative requires: a client.js entry at the package root could not require("./helper") — the served module loader resolved it against a bogus directory and threw "the plugin client requires a file outside its reviewed closure". Root-level entries now resolve ./x against the package root. (CW-8288)
    - Slow-injected pastes keep their line breaks on Windows Terminal: pasting a multi-line draft on Windows Terminal (which delivers console input records at its own pace) could drop newlines and concatenate the paste into one line — or worse, submit the half-written draft mid-paste when input processing lagged behind the key queue. The composer Enter gate and the paste-burst tick now judge the paste stream on each key event's own arrival timestamp instead of a fresh Instant::now(), so a stream delayed in the queue is never read as stale, and on Windows the detector also treats ≥3 plain characters arriving within a 60 ms stream window as a live paste — a deliberate Enter inside a fast typing burst there can still be absorbed as a newline (press Enter again to send); elsewhere the bound stays at the 8 ms burst interval, so a deliberate Enter after typing or an IME sequence still submits normally.
    - Sub-agents can use the MCP tools their parent session has connected. A sub-agent started while the parent or a sibling was mid-way through an MCP call used to get none of them; a call to an MCP tool a sub-agent cannot reach now names the server and why.
    - Shell policy: option and subcommand names that depend on shell expansion are treated as unresolved. A known option with a directly double-quoted scalar variable as its value remains supported. (CW-8297)
    - Command policy no longer stalls on repeated --: each -- made the deny check re-expand every later suffix again, so npm followed by 24 -- took about 14 seconds and 50 never finished. A suffix already checked at the same or a shallower depth is now skipped; a suffix list that grows past the deny cap is reported as unresolved so the command falls back to the reviewer instead of passing silently.
    - grep_files stays compact on huge single-line files: a match inside a very long line (JSONL fixtures, minified JavaScript, lockfiles) now returns an 800-byte window around the match, and context lines their first 800 bytes, each marked with how many bytes were left out, instead of the whole line; results stay valid JSON well under the spillover threshold. When a large tool result is one or a few long lines, its recovery footer now suggests retrieve_tool_result mode="summary", mode="json" with a jsonpath, or mode="query" instead of a lines="120-160" range that does not exist.
    - read on a directory says so: reading a directory now fails with "path is a directory; use file_search or list_dir to see its files" instead of "must be one regular, non-hard-linked file".
    - file_search skips hidden directories and keeps its default exclusions: hidden dot-directories (.operator, .scratch-*, .github, …) are no longer walked unless path points into one or the query names one (for example .github/workflows), and caller exclude globs now add to the default build/dependency exclusions instead of replacing them; set replace_default_excludes=true for the old replace behaviour, matching grep_files.
    - edit/write diff visibility, per-edit fuzzy fallback, and Git diff/validation fixes: edit and existing-file write tool responses now include a bounded unified diff directly in tool output (truncating large diffs and large brand-new file previews while keeping full diffs in structured mutation metadata), and edit match failures include the closest numbered region and first differing line from the file. Batch edit calls now accept unique exact matches without tripping on fuzzy-normalized duplicates elsewhere in the file and apply fuzzy fallback per edit rather than batch-wide, leaving exact items' untouched whitespace and punctuation intact; legacy edit_file recovery messages now point to read instead of retired File action="read". Git aligns its static capabilities with fetch while keeping inspection actions read-only per is_read_only_for, validates allowed parameter keys per action, and adds validated rev, base, and target revision-diff parameters to Git(action="diff").
    - Clean PTY terminal output, non-blocking Run tests with empty-filter detection and per-action key validation, and smart JSON summary in retrieve_tool_result: persistent PTY commands (terminal/run, terminal/send, terminal/wait, terminal/cancel) now strip internal heredoc wrapper setup, heredoc> prompts, ANSI/OSC escapes, zsh % prompt marks, and internal sentinel lines, returning structured JSON (stdout, exit_code, cwd, status, session, session_id); Run now validates allowed parameter keys per action (failing with an explicit invalid_input error instead of silently ignoring cross-action keys), Run(action="tests") now supports background and timeout_ms with a 30-second default auto-background fallback matching bash, and both Run(action="tests") and Run(action="verifiers") flag zero-test empty filters (0 passed; 0 failed; N filtered out, 0 tests run, No tests found, collected 0 items, testing: warning: no tests to run) with zero_tests_matched: true instead of reporting silent success; retrieve_tool_result(mode="summary") now returns a compact structural JSON summary (root type, byte size, bounded top-level keys/types/lengths/previews with base64 blobs omitted, and concrete mode="json" jsonpath hints) for JSON artifacts and shows the true end of non-JSON artifacts in tail without duplicating head.
    - Compact agent start receipts omit the transcript preview and retain the routing details and transcript handle.
    - Detailed status pages resume at the first undisplayed child event when a long page needs to shrink.
    - Compact sub-agent lifecycle responses and bounded explore children: agent start, peek, status (detail=true), and cancel now pass through context compaction as compact structured JSON carrying the actual role, usage, activity, bounded recent events, and transcript_handle without self-report wrapping, raw checkpoint.messages, base64 thought signatures, or 500 KB event dumps, while post-completion snapshots preserve transcript_handle, worktree workspace, and git_branch; explicit parent agent(action="cancel") suppresses duplicate <codewhale:runtime_event kind="subagent_completion"> user turns while asynchronous finishes and failures still deliver; explore children default to a 24-step ceiling (overridable when configured) and cap inherited reasoning effort at medium (preserving explicit thinking overrides and lower parent tiers); and child prompts strip <mcp_server_instructions> for any MCP server excluded from the child's admitted tool set.
    - Read-only tools run in one parallel wave: read, read_media, Git status/diff/log, read-only bash, load_skill, retrieve_tool_result, session/memory/archive lookups, Web search and fetch, read-only MCP tools and tool_search no longer fall back to a global exclusive lock, so a batch of reads runs together while writes, mutating shell, background starts and a second tool_search keep their barriers. task_shell_wait with task_ids claims only the listed tasks. [tools] max_parallel_shell_exec (default 4, maximum 32) bounds concurrent shell commands in one wave.
    - Sub-agents no longer carry the whole skill index: child system prompts stop embedding every installed skill name, description and shadow warning (often 10–15K tokens per spawn); a child finds skills through load_skill with a query, the same way the parent does.
    - Skill context accounting: /context and doctor --context-json report the available-skill catalog as a preview and exclude it from prompt token totals. Parent and child sessions discover skills on demand through load_skill. Thanks @7jrxt42BxFZo4iAnN4CX for issue 7432. (CW-8315)
    - Smaller agent(action="roster"): the cost-basis caveat is stated once at the top level instead of on every member and profile row, and with no Fleet selected the empty models list now says that any routable model is accepted for unpinned roles.
    - One sub-agent name across wait and completion notices: agent(action="wait") and the sub-agent done and failed notices now report the same display name the TUI shows, instead of the raw agent_<id> in one place and a generated whale name in the other.
    - Auto-Review approval prompt: when the reviewer times out or fails, the terminal names the failure beside the proposed action and explains it in the approval details.
    - The workbar's Fleet tab tells the truth about sub-agents: after a turn delegates work, the Fleet tab lists every sub-agent that ran this session, with its count on the tab, its input and output token totals and a failure colour when it failed, instead of saying "No agents have run this session" while the parent turn is still running or after a finished agent's live card has expired. Switching sessions or running /clear resets the Fleet and workbar lists, a resumed session shows the agents it already ran, and files a sub-agent wrote appear in the Files tab.
    - Leaner, more truthful model context: the Repo Working Set no longer lists paths the session may not read or paths named only in an instruction not to touch them (never read …, do not touch …, off-limits), and its top-level directory list is sorted with a (+N more) count instead of an arbitrary eight; execute_tools no longer carries a deferred MCP server's full batch schema on every request; tool_search returns four results by default, ranks first-party and name matches above MCP description matches and drops weak matches, so a search no longer evicts tools you were using; the trimmed-instructions notice arrives without a second Repo Working Set and without a /context report instruction the model cannot run; the Previous Session Relay has its own session_relay context fragment, is cut at a line boundary within that fragment's cap, and says to read .codewhale/handoff.md for the rest; bash keeps the last 400 lines or 16 KB inline and leaves the rest in its output artifact; and the interrupted-session hint names session_get with the full session id and how to load it.
    - Tool contracts say what they enforce: a truncated or incomplete model response is no longer mistaken for a context-length overflow and retried with compacted history; request_user_input explains a too-short or too-long option list with a step the model can take and no longer advertises an allow_free_text flag the dialog ignores (the user can always type an answer); todo_write rejects more than one in_progress item instead of silently demoting all but the last, and no longer declares that it writes files; apply_patch drops the top-level oneOf and the deprecated changes field from its schema (still accepted) and its stale-hash recovery names read; Web(action="fetch") runs in parallel with other read-only calls while keeping its approval; and read-only task_shell_wait polls run in parallel.
    - Cost reporting for Google Gemini 4 and major providers: turns on Google (gemini-4-carbon, gemini-4-hydrogen, gemini-4-argon, both bare and models/-prefixed), OpenAI, Anthropic, OpenRouter offline, Z.ai PAYG, and StepFun PAYG now freeze catalog dispatch quotes and report real USD spend instead of falling to $0.00 (unverified_live_pricing) when a provider's /models roster returns costless or models/-prefixed IDs or when the live models.dev cache is stale; multimodal models with input_audio rates and equal-rate reasoning fields also price text turns and agent(action="roster") probes instead of returning missing_usage_breakdown, while genuinely unpriced custom models and distinct-rate reasoning models without reasoning telemetry remain unpriced.
    - Exported conversations preserve failed/interrupted turn outcomes and error cards show typed error codes: /export (including clipboard / last-copy.md recovery copies, Markdown, HTML, and JSON exports) now interleaves failed and interrupted turn outcomes at their after_message_count positions with status, ended_at, optional typed error code, and secret-redacted error text, keeping --no-tools positions aligned. TUI error cards and error-cell copy/pager output now display the typed error code (for example [llm_network_error] or [llm_rate_limited]) in muted styling without duplicating codes already in the message, and SavedTurnOutcome persists optional code backwards-compatibly so resumed error cards and exports retain it. (#7328)
    - execute_tools JavaScript runtime adds console, URL, URLSearchParams, and clearer determinism errors: console.log, console.info, console.warn, console.error, and console.debug now route into the bounded receipt log array (capped at 200 lines, 1 KiB per line, and 8 KiB total with an omitted-entries notice) instead of throwing ReferenceError: console is not defined; deterministic URL and URLSearchParams globals are now available without I/O; and Date.now(), new Date(), and Math.random() inside execute_tools now report that they are unavailable in execute_tools programs rather than naming Workflow record/replay.
    - OpenCode Zen no longer offers *-free models that cannot work from Codewhale: OpenCode restricts Zen's free rows to its own client, so every request from Codewhale failed with HTTP 429 FreeUsageLimitError. The curated Zen snapshot drops the *-free rows, the provider docs say why, and that error now explains the restriction and points to paid Zen models, opencode-go or another provider instead of a generic quota message. (#7365)
    - A frozen background copy no longer freezes every launch: if a stopped or suspended codew/codewhale process is holding the telemetry lock, a new Codewhale launch now waits at most a few seconds and skips telemetry arming instead of hanging on the lock before any command or prompt runs. When you explicitly turn telemetry off, Codewhale waits for any delivery already holding the privacy lock before confirming.
    - Gemini parallel tool calls now match streamed continuations by identity and reject ambiguous batches. A late thought signature stays with its original tool call.
    - Oversized Bash results retain the full stdout and stderr beyond the in-memory window. Managed test jobs also expose their raw output through the job byte-stream API.
    - Large pastes no longer freeze the composer: pasting tens of thousands of characters — especially CJK/emoji text on terminals without bracketed paste — keeps image paths embedded in chunked text literal and retains every character across input chunks instead of rescanning or truncating the burst, and the composer stops re-wrapping the whole draft three times per frame.
    - Flag-only launcher commands no longer crash the turn: running npm --version, nix --version, launchctl --help, docker --version, podman --version, or another launcher command with global flags and no subcommand no longer panics with an out-of-bounds index during command policy expansion.
    - Command policy sees payloads behind empty words and --entrypoint: command policy now also checks the nested command in launcher lines with empty-string words before the subcommand (npm '' exec -c 'rm -rf /', docker '' -D run alpine rm -rf /) and checks docker run --entrypoint rm alpine -rf / as the entrypoint plus the arguments after the image, checking every --entrypoint value before the image, so deny rules and approval review match them. A launcher line with so many options that the option walk hits its state limit is now treated like other commands whose words are only known at run time: while deny rules are in force it asks for approval, or is refused where approval is unavailable, instead of dropping the nested command.
    - Long-prefill and high-thinking requests no longer time out at 45s waiting for response headers: raised the default stream.open_timeout_secs response-header wait from 45 seconds to 180 seconds (and its maximum from 300 to 600), and updated the response-header timeout message to mention large-context or high-thinking prefill alongside cold model loading with codewhale config set stream.open_timeout_secs 300 (up to 600).
    - Thread forks no longer stall unrelated conversations: named-turn /undo, /fork, and /retry now prepare and stage cloned turn records outside the manager-wide session admission lock and only take the guard for the brief pre-check and final atomic thread commit (failing closed if the source thread changed mid-preparation), so restoring or reloading unrelated threads no longer waits on a large conversation fork. A file-restoring /undo still holds admission while it prepares, and deleting a thread whose saved session a fork is reading now asks you to retry instead of leaving that session behind. (CW-8227)
    - Less flicker while you read back through a running turn: the composer's breathing border now holds still while the transcript is scrolled away from the latest output and resumes when you return. While scrolled up it had repainted the composer and footer rows on every frame, about 2.5 times the output of 0.10.2, which flickered visibly in terminals without synchronized output such as macOS Terminal.app.
    - One row per background shell in the transcript: polling a background shell with task_shell_wait no longer adds a separate run · task_id: shell_… row for every check; the shell's own row already shows it running or stopped. Stopping a shell shows one Cancelled command … row, gate checks and multi-shell waits keep their own row, and a check that fails still shows its error.
    - Less tool noise in context: load_skill lists project and Codewhale skills first, summarizes global compatible skills by source, and ranks multi-word queries across all skills. session_get hides internal events and summarizes tool-only turns. Active paths track explicit file targets and patch receipts, not search or tool output. Invalid shell directories now point to bash(cwd=…).
    - Foreground bash session artifacts and quieter background shell completions: large foreground bash, Bash, and task_shell_wait outputs now save their full un-truncated bytes into the session's art_… artifact store instead of leaving /tmp/codewhale-bash-* files outside the workspace or dropping the omitted middle past 30 KB before spillover, so retrieve_tool_result can inspect the full output in Ask, Auto-Review, sandboxed, and Full Access modes while inline display stays bounded. Terminal background shell completions already surfaced by task_shell_wait (including cancel=true) no longer inject a duplicate <codewhale:runtime_event kind="background_shell_completion"> message afterward while un-waited jobs still fire once and /jobs stays intact, and small inline background shell completions omit unnecessary art_background-shell-completion-… files and retrieve_tool_result boilerplate.
    - File search in very large folders returns results instead of timing out: file_search (shown as find) no longer fails with "operation timed out after 30s" in a huge folder that is not a git repository. It now walks the tree in parallel, searches the top four levels first so shallow files are found even when the rest of the tree is too large, also skips .venv, __pycache__, .next, .turbo and .gradle by default alongside target, node_modules, .git and build output, and, if the tree is still too large to finish in 20 seconds, returns the best matches found so far marked partial with a note to narrow path or the query. Results in an ordinary repository are unchanged apart from those newly skipped folders. (CW-8265)
    - Auto-Review on the desktop app sees what you asked for: the Auto-Review reviewer refused every command started from the desktop composer with "No person request provided (person_messages is empty)", because the desktop reaches its Engine with the local runtime token, which counted as an automation caller. A runtime-token caller that names the owner surface ("client": "desktop") on POST /v1/threads/{id}/turns or .../steer now records the typed prompt as your message, the same way the signed-in web composer and the terminal already do; a paired device or phone that claims desktop is refused with 403, and a runtime-token caller that names no owner surface, a tokenless local server, scheduled work, automations and agent-created threads still record nothing. The reviewer still blocks actions your messages do not cover. (CW-8270)
    - Scheduled catalog refresh pushes with a branch-tip lease: the Catalog refresh workflow now resolves the remote catalog-refresh branch tip before pushing, aborts if catalog-refresh has commits outside origin/main not committed by codewhale-agent[bot], and passes that resolved tip (empty when absent) to --force-with-lease so pushes no longer fail with stale info. (CW-8266)
    - A command that ran and exited non-zero keeps its exit code: a bash call that runs and exits with an error (for example a failing pytest) now records its exit_code and status on the Runtime tool item, as a successful call does, so clients can tell a command that ran and failed from one Codewhale refused. (CW-8270)
    - A session keeps the name of its first message: a Runtime API thread without a title is now named from its first message when that turn starts, so a follow-up such as "Please try that again." no longer becomes the session's name in clients that show the newest message for an untitled thread. A rename still replaces it. (CW-8270)
    - Provider status reflects the last real call: GET /v1/providers now carries lastCheck for a provider once a turn has used it: ok after a completed turn, or ok: false with the error category and a short reason after a provider-owned failure such as HTTP 402 (credits used up), 401 or 429. The record lasts for the running process. (CW-8270)
    - No approval note in tool output sent to the model: an approved tool call's result no longer starts with "[approval] This tool call required approval…", which models sometimes pasted into their answers. The approval stays in the result's approval metadata and receipts; older recorded results that carry the note still have it hidden from the person. (CW-8270)
    - Quieter snapshot and MCP notices: the "Snapshots and /undo are off" notice is emitted once per scope per session (with one "back on" line when snapshots recover, without repeating on subsequent turns or transient pre-delivery clears), snapshot-prune warnings log via tracing instead of stderr, and codewhale exec (including JSON modes) prints snapshot notices to stderr. MCP servers that need sign-in or fail to connect are named in one line per session (MCP · ⚠ auth required: slack · failed: beta · /mcp, with compact counts on narrow terminals), retries and reconnects add nothing, and a server that signs in is announced once; the footer no longer keeps a standing MCP failure chip, and details stay in /mcp and /status. (CW-8263)
    - Sub-agent receipts agree on name, build and thinking: a sub-agent started with a name now goes by that name in its completion event as well as its wait receipt, instead of a generated whale name. When a route clamps an explicit thinking request to its capability ceiling, the start acknowledgement (after admission) and the completion event now carry a reasoning_note naming both tiers and the route ceiling; the pin itself is unchanged. scripts/dev-cargo.sh clean release and install builds now stamp CODEWHALE_LOCAL_BUILD_SHA from HEAD for --version and receipt runtime_build_sha without setting telemetry release provenance (which remains null for local builds), while check, test, debug, and dirty builds stay unstamped. Claude Code agent files whose unquoted description: runs over several lines (the Examples: blocks Claude Code itself writes) now load, unknown frontmatter keys with values still fail closed regardless of position, and an agent file that cannot be parsed is reported as one line. (CW-8266)
    - Honest automation ownership and adoption, plus session_search skipping the live session: active automations owned by another runtime or unbound now show not scheduled here on both list and detail views instead of a stale or projected next_run_at that this runtime will never fire (GET /v1/automations and automation list/read include scheduled_here and execution_ownership), while owned schedules keep their true owed or held slots. An explicit adopt path (POST /v1/automations/{id}/adopt, /automation adopt <id>, a in /automations, and automation adopt) binds an orphaned automation to the active runtime so overdue slots ask per the missed-run policy before advancing. session_search no longer lists the session you are in under "Prior sessions for this workspace". (CW-8266)
    - Install housekeeping reports the truth: codewhale doctor now says why a leftover is left alone (changed within the last hour, or a receipt or marker file rather than a backup) instead of a blanket "in use or recent"; the recovery size it prints now counts files in nested folders; and codewhale doctor --restore refuses a recovered file that is too large to have been hashed when its size no longer matches what was recorded. codewhale uninstall --yes now has an end-to-end test.
    - Plugin details name files, and /v1/commands attributes plugin commands: a plugin's review detail (GET /v1/apps/plugins/{name}) now lists the commands, profiles and hooks it adds by file name instead of by their folder names (commands, agents), and GET /v1/commands under codewhale serve now carries plugin_id on a plugin's markdown commands, which were not loaded without a terminal session.
    - Read-only shell commands get a private temporary directory: under bash with read_only: true, zsh heredocs (<<EOF), Linux shell heredocs, mktemp -p "$TMPDIR", and other tools that honor TMPDIR/TMPPREFIX no longer fail with Operation not permitted. Each command gets its own empty TMPDIR (a Darwin system scratch directory protected against root unlink under Seatbelt on macOS, or the sandbox's private /tmp under bubblewrap on Linux) that is deleted when it ends; the workspace and home stay read-only. When a read-only command is still refused, the result now says why: writes such as git fetch need a run without read_only (git ls-remote reads remote refs), macOS will not start setuid ps/top in a sandbox (use pgrep -lf or lsof), a bare macOS mktemp ignores TMPDIR (use mktemp -p "$TMPDIR"), macOS /bin/sh and /bin/bash heredocs ignore TMPDIR (use /bin/zsh -c, printf, or a file under "$TMPDIR"), and an offline gh that reports an invalid keyring token is named as a network failure, not a keychain one. (CW-8266)
    - tool_search and the deferred toolbox: the tool_search description now lists only deferred tools that exist in the session (it no longer advertises Git or Run when they are absent); lsp is offered only when the session has LSP enabled, and the engine now attaches the session LSP manager so an offered lsp works instead of failing with "LSP manager is not attached"; regex queries match tool names case-insensitively, so ^(Web)$ finds Web; the toolbox soft targets rise to 16 deferred tools and 32 KiB of added schemas, and MCP tools are evicted before first-party tools such as Web, automation, lsp and apply_patch; and a tool re-admitted in the same search is no longer also reported as evicted. (CW-8266)
    - codewhale doctor gives one answer for the model route: Setup State and API Connectivity now both show the configured default route (the provider and model a new session uses) and where each comes from: config.toml, a profile, settings.toml, environment variables, managed configuration, --probe-local, or the built-in default. API Connectivity also shows the route of the most recent saved session, and notes when it differs from the configured default (sessions keep the route they ran with; /provider or /model without saving as default changes only that session). The provider line /setup saved is now labelled as recorded at setup and flagged when the default has changed since, and the top/bottom verdict checks whether the current route has credentials. codewhale doctor --fix moves eligible plaintext provider api_key values from the inspected config file into the secret store without clobbering OAuth routes, conflicting shared slots, or active keyless routes. Skills that are no longer bundled (feishu, v4-best-practices, contributor-onboarding, feedback, social-media, health) are no longer reported as unknown names, and listing one in [skills.bundled].disabled hides an unmodified installed copy (keeping .installed-from or user-edited copies active). The "last repair" line now names the session items it could not inspect and says how to list them all, and session repair no longer reports regular files in the task runtime folder as errors. (CW-8266)
    - Large MCP results stay usable: MCP tool results no longer carry the server's transport metadata (_meta, such as the GitHub MCP server's base64 PNG icons, and resultType) to the model or to execute_tools programs. An execute_tools nested result over the 100 KiB per-call cap now keeps its JSON shape (leading array elements, object members and string heads) instead of becoming a cut string a script cannot parse, and its truncated record carries a ref that retrieve_tool_result can open. retrieve_tool_result splits lines longer than 2 KiB into numbered segments for summary, head, tail, lines and query, instead of returning one giant line or refusing a line over 1 MiB, and a new json mode returns a jsonpath selection (JSON inside text fields, such as an MCP text block, included) cut to max_bytes as valid JSON. (CW-8266)
    - Undo to a named turn reads the session history once: undoing to a chosen turn (/undo with a turn, POST /v1/threads/{id}/undo with turn_id) no longer loads every turn and item a second time before preparing the fork, so long sessions spend less time holding the thread while undo is prepared. The selected turn and everything after it are still removed, and the source session is unchanged (#7362, #7355). Thanks @laozidabo for the fix and @soarkit for tracing the duplicate reads and the file-open benchmark.
    - MCP tools with optional parameters reach Moonshot (Kimi) models: an MCP tool with an optional parameter written the way Pydantic and FastMCP write it, an anyOf with a null branch plus "default": null (for example limit: int | None = None or filters: Filters | None = None), is no longer dropped from Kimi requests. The null default is removed from a parameter that already accepts null, so the model sees the tool and the parameter stays optional. Thanks @ruanchaves (#7364).
    - A turn that ends as the next one starts no longer freezes the terminal: saving the finished turn now waits at most two seconds for the Engine's session snapshot. When the Engine is already busy with the new turn, the terminal stays responsive, skips that save and keeps the recovery checkpoint, and the save notice says whether the snapshot timed out or no longer matched the session (#7360, refs #7357). Verified by unit tests of the bounded wait; the terminal reproduction is not automated. Thanks @deosiree for the fix and @7jrxt42BxFZo4iAnN4CX for the report.
    - Refocusing the terminal no longer blanks the screen: when the terminal window regains focus, Codewhale restores its terminal modes and repaints every cell of the viewport without first erasing the screen, so terminals that ignore synchronized output (DEC 2026) no longer flash an empty screen. Resizing, suspending, theme changes and handing the terminal to an external program still clear and redraw as before. Thanks @laozidabo for the fix and @scripting-drafts for the report and control-stream diagnosis (#7363, #7343).
    - Undo of selected files no longer leaves a half-restored workspace: when restoring individual files from an undo snapshot failed partway, after earlier files had already been checked out or removed, Codewhale reported the failure but left those earlier changes in place. It now rolls the attempted files back from the safety snapshot taken just before the restore, leaves alone any file that changed again in the meantime, and names any file it could not recover along with the safety snapshot ID. Emptied folders are pruned only after the whole restore succeeds. Thanks @laozidabo for the fix and @7jrxt42BxFZo4iAnN4CX for reporting partial restores (#7366, #6559).
    - Remaining English text in the translated interface: tool card subtitles (Reading, Listing, Searching for), the collapsed activity row's separators, /help entry counts and alias lists, the command palette's alias and match counts, the /diff summary and per-file hunk counts, the composer's resolved on send context preview and the /status catalog source row now come from the locale packs in all 15 languages, with plainer zh-Hans and zh-Hant wording. English output is unchanged. Thanks @luochen211 (#7367, #7304).
    - Withdrawn desktop account plugins connector removed on upgrade: the old desktop app's codewhale-desktop-account-plugins bundle, whose one connector (shown as plugin-…-codewhale-desktop-account-plugins-codewhale-plugins) failed on every session start, is now removed at startup together with its plugin record, and a plugin.retired line is written to audit.log. Only an installed copy whose single connector still points at the retired account endpoint is removed; other plugins, and a bundle of that name you changed or placed by hand, are left alone.
    - Linked AGENTS.md inside the workspace: a project AGENTS.md, CLAUDE.md, .codewhale/instructions.md or rules file that is a symlink to another file in the same directory tree now loads instead of being refused with Refusing symlinked file and leaving the session without project instructions. Every link in the chain is resolved first and the file is still refused, with a visible skip notice, when it resolves outside the workspace through .., an absolute target, a chain of links or a Windows junction. (CW-8266)
    - A connector tool switched Off leaves conversations that already used it: turning off a tool such as close_issue in Settings or with PATCH /v1/apps/mcp/servers/{name} now takes it out of the next turn of a conversation that had already found it through tool search, not only out of new conversations. The Engine rereads the connector configuration when it gathers a turn's tools and reconnects the changed server under the new settings.
    - Side-repo snapshot lock fairness: rapid snapshot and prune operations poll every 5 ms and yield for up to 50 ms on immediate same-process re-acquisition after releasing the side-repo write lock, preventing back-to-back acquires from starving waiting writers past the 30-second lock timeout, and skip redundant git rev-parse calls when rebuilding survivor chains. (CW-7957)
    - Thread events under heavy disk load: reading or appending a thread's runtime events no longer fails with "Runtime event lock timed out after 5s" while another write is still flushing to disk; the event-store lock now waits up to 25 seconds for in-progress writes before giving up. (CW-7957)
    - Timed-out hooks on Windows report the timeout: on a busy Windows machine, a hook that hits its time limit now reports "Hook timed out" instead of "hook could not be reaped after its timeout". CodeWhale now waits up to 10 seconds, rather than 2, for Windows to finish tearing down the hook's process tree. (CW-7957)
    - Ctrl-C reliably stops a terminal command that is just starting: terminal/cancel and Ctrl-C in the terminal dock no longer report "cancellation was not confirmed within 2 seconds" while the command keeps running when the interrupt lands just as the command takes over the terminal; the interrupt is re-sent at most every 500 ms, only while the command still holds the terminal, within the same 2-second limit. (CW-7957)
    - Plugin installs no longer report a false start failure: installing or enabling a plugin no longer fails with "the extension host did not finish starting native plugin code in time" while the host is still loading it within its own start-up deadlines, for example on a busy machine or behind another plugin that is slow to start, and a bundle with no native code no longer fails because a different plugin is still loading. (CW-7957)
    - Task wall-time and pending questions: a task whose approval or question was recorded before its wall-time budget ran out no longer ends with a wall_timeout because a task watchdog read the prompt late; the human-wait window now starts when the prompt was recorded, in both the turn drive and the worker supervisor. (CW-7957)
    - Installer on Debian 12 and other mawk 1.3.4-2020 systems: the curl | sh installer verified the release checksum manifest with an awk regular-expression interval that the 2020 mawk shipped by Debian 12 does not support, so it stopped with checksum not found for codewhale-linux-x64 on a correct download. The digest check now uses a plain length-and-character test.
    - Installed agent versions without a trailing period: an agent CLI that ends its --version line with a full stop, such as GitHub Copilot CLI (GitHub Copilot CLI 1.0.82.), is now listed as 1.0.82 instead of 1.0.82. in GET /v1/agents/external and the agent pickers that read it.
    - Named custom providers in the web client's new-thread dialog: when several [providers.<name>] routes share the generic custom kind, the browser client now preselects the configured route, loads its models by that exact route, and creates the thread on the route you picked, instead of failing with "custom is not a wildcard for a named provider". Thanks @Gyuke (#7352).
    - show_data charts tell the truth at the edges: a small value such as 0.004 is no longer shown, or reported back to the model, as 0; a trend with more points than the chart is wide keeps its spikes and dips instead of skipping them; a bar for any value above zero is always visible; and on a narrow terminal the label is shortened before the number is.
    - Worktree-side renames in the Runtime API: GET /v1/git and GET /v1/changes now show the source of a rename in the worktree column that leaves the workspace as a deleted row, as they already did for a staged rename; a copy is still never shown that way. Thanks @SparkofSpike (#7325).
    - Multiline XML tool arguments: a text-fallback tool call whose parameter value, in either the <parameter name=...> or the <key> form, contains a newline, such as multiline write_file content, no longer arrives with empty arguments. Thanks @Ricardo-M-L (#7341).
    - Assignments inside CLI argument values: the fallback tool-call parser no longer invents an extra parameter from text inside a --argument value, so --command "MODE=dev node app.js" stays one command. Thanks @Ricardo-M-L (#7342).
    - Network rules for internationalized domains: a [network] entry written with a non-ASCII domain such as 例子.com, including the one /network deny writes, now matches the host it names instead of never matching. Thanks @luochen211 (#7320).
    - Plugin storage on Windows: a plugin's ctx.storage reads and writes no longer fail with EPERM inside the Windows Native isolation; the storage directory is resolved the same way the reviewed-closure checks already resolve paths there. (CW-8049)
    - Workflow approval cards for nodes plans: Workflow approval analysis for nodes plans now shares the canonical tool-authority classifier with object plans so shell, network, and write tools named by their current families (Bash, Web, File, and related names) are reported accurately on approval cards.
    - Sub-agent file edits across /undo: Settled child sub-agent workspace writes (including file_path / filePath aliases and File tool actions) are now attributed to their parent turn across live turns, /resume, /branch, and runtime threads, so /undo restores delegated sub-agent edits together while still refusing when unattributed edits occurred during the turn or delegated work is still running.
    - Receipt edit line counts: /receipts and session summaries now count edit_file additions and deletions using a line diff of each search/replace pair instead of counting every line of both texts, matching git diff --stat and edit cards (with multi-edit calls summed per pair). (CW-8147)
    - Quota-window reset text: a rate-limited turn now gives the reset time in plain words such as "19h29m" instead of Rust debug output like Some(70168s), and leaves the reset clause out when the provider gives no reset time. An OpenCode Go message points at that provider's own key with codewhale auth set --provider opencode-go, without repeating a hint the message already carries. (CW-8209)
    - Terminal input recovery: retains a wake event from a replaced reader, suppresses retired events observed during a child-terminal handoff, and closes only the handoff window owned by that scope.
    - Plugin index hooks: hooks with the same name and event now have distinct row IDs, so clients can keep every configured hook visible.
    - Installers no longer say Computer Use comes bundled: the macOS install script and the install guide no longer print or state that Computer Use ships with the binary or needs Node.js 20. Computer Use is released separately and stays off until you turn it on.
    - Renaming sessions with Chinese titles: the session picker no longer rejects a Chinese, Japanese, Korean or emoji title of more than about 33 characters as "Title must be 1–100 characters". It now counts characters, as the message says and as /rename and the Runtime API already did, so any title up to 100 characters is accepted. Thanks @luochen211 (#7322).
    - Non-ASCII file names: /diff, the @git and @diff mentions and the Runtime API workspace diff now show paths with Chinese, emoji and other non-ASCII characters as written instead of as quoted octal escapes, and the turn context no longer lists the workspace root as an empty "Active paths" entry. Thanks @luochen211 (#7317).
    - Blank environment variables: exporting a variable empty (for example CODEWHALE_MODEL= from a compose ${VAR:-} template) no longer hides its legacy alias. DEEPSEEK_MODEL, DEEPSEEK_BASE_URL, KIMI_BASE_URL, DEEPSEEK_FORCE_HTTP1, DEEPSEEK_STREAM_OPEN_TIMEOUT_SECS and the other provider alias variables now apply as they do when the primary is unset. Thanks @luochen211 (#7315).
    - Telemetry setting default: the settings schema API reports telemetry's default as on, matching what Codewhale does when you have not chosen.
    - Auto routing abstention: when the decision model marks a tier, effort or shadow answer abstained: true, Auto no longer acts on it, even with min_confidence = 0: an abstained tier takes the local fallback, an abstained effort keeps the tier and drops only the effort, and the routing receipt lists the abstained questions.
    - ACP: when a plugin tool asks the core to run a tool that needs approval, the editor now gets a session/request_permission on the plugin tool's call that names the nested tool and its input; before, the prompt ended with an internal error (CW-8050).
    - Footer clock: The footer clock and phase now say "thinking", matching the transcript.
    - Paused stream: A paused stream now shows the thinking it has already received instead of waiting for the next token.
    - Sign-in notice: The "Account not loaded" notice now appears once per sign-in in the footer, and Esc dismisses it; it no longer lands in the transcript.
    - Starting after a hard kill: the Engine now starts when its process was killed and its data directory was then deleted, including when its home was spelled through a symbolic link (for example under /tmp on macOS) or, on macOS and Windows, in a different letter case: a dead socket owner's record for the deleted data directory is discarded instead of failing every start.
    - Context window labels: the model picker and fleet capability badges now show 1.5M and 2.1M for 1,500,000- and 2,100,000-token windows instead of 1.50M and 2.10M. Thanks @Aboysky (#7295).
    - REPL output limit: REPL output is now cut to its byte limit, so Chinese, Japanese, Korean or emoji output no longer comes back up to three times longer than the limit, and the cut never splits a character. Thanks @Aboysky (#7296).
    - Git status with renamed files: the Git and Changes views no longer fail with "git status failed" or show a phantom row when a file is renamed on the worktree side (for example a moved file marked with git add -N), including when the original name starts with non-ASCII text such as Chinese. Thanks @luochen211 (#7310).
    - Tool output escape stripping: tool output no longer shows a stray character after a character-set escape such as the ESC ( B that tput sgr0 prints, and a stray ESC [ no longer hides the Chinese, Japanese or Korean text after it. Coloured tool output now keeps only well-formed colour sequences. Thanks @luochen211 (#7313).
    - Script tools with env -S shebangs: a script tool whose first line is #!/usr/bin/env -S python3 -u now starts python3 -u instead of failing to launch a program named -S. Other env options, the attached -Sprogram form and env -S quoting are still not interpreted. Thanks @luochen211 (#7288).
    - Timeline summaries: a thread or task timeline summary that already fits its length limit is now shown in full, instead of having its last characters replaced by .... Thanks @luochen211 (#7289).
    - RLM context names: rlm_open without a name now keeps non-ASCII letters and digits from the file name, so docs/报告.txt and docs/总结.txt open as 报告_txt and 总结_txt instead of both becoming txt and the second open failing with "already exists". Names derived from ASCII file names are unchanged. Thanks @luochen211 (#7290).
    - Simplified Chinese punctuation and /status: in the zh-Hans interface, the /router setup and test screens, label prompts and usage lines now use full-width punctuation (：；，（）) instead of ASCII marks next to Chinese text, and /status values start in one column under Chinese labels instead of starting at a different column for each label. Thanks @luochen211 (#7314).
    - Git tool on older git: the Git tool's review_scope action no longer passes --no-lazy-fetch, which git older than 2.44 rejects, so it failed on every call there. It sets GIT_NO_LAZY_FETCH=1 instead, which keeps the same protection on newer git and is ignored by older git.
    - Anthropic xhigh effort: Choosing xhigh effort on an Anthropic model that documents it, such as Claude Fable 5.2 or Claude Opus 4.8, now sends xhigh instead of max, so the model uses and bills the level you picked.
    - codewhale exec prompt input: codewhale exec "prompt" no longer hangs when stdin is an open pipe that sends nothing (it continues after 2 s and says so, and a slow producer can be included by piping the prompt as well), and a flag typed after the prompt in full-width or typographic-dash form is rejected like --auto instead of being sent to the model as text. Tested on Unix only; no Windows, hosted CI or real-provider run.
    - Website docs: documentation pages no longer stack a second "Codewhale documentation" header under the site navigation; the line saying which release the docs describe now sits under the breadcrumb.
    - External agent interrupts: Interrupting a turn while an external agent waits for approval now answers the agent's permission request as cancelled. (CW-7958)
    - CJK text in terminal columns: the command palette, the hotbar setup rows, the /config detail labels, the workflow history lanes, the approval card intent and parameter lines and the elevation prompt now pad and cut text by the columns it takes on screen, so Chinese, Japanese and Korean labels no longer push later columns right or get cut to a third of their space. Thanks @luochen211 (#7273).
    - Slash-command arguments after any whitespace: /config splits its key from its value, and finds a trailing --save, after a tab or a full-width space (U+3000) from a CJK input method, not only after an ASCII space, and a user command's $ARGUMENTS and $N are filled in one pass, so $1 or $10 written inside your own argument is not expanded again. Thanks @luochen211 (#7269).
    - Negative retry delays: a [retry] setting with a negative or non-finite initial_delay, max_delay or exponential_base is now refused when the configuration loads, where jitter = false with max_delay = -1 made the first transport retry panic. Thanks @luochen211 (#7275).
    - Search include globs in linear time: a model-supplied include pattern with many * wildcards, such as *a*a*a*a*a*a*a*a*a*a*b, no longer takes exponential time against a long file name; matching is the same, only bounded. Thanks @luochen211 (#7276).
    - MCP connections that cannot answer a server: when Codewhale cannot send its answer to a request from an MCP server (the connection broke, or the call was cancelled mid-write) the connection is now marked disconnected and the call fails, and discovery of a server's resources, templates or prompts stops with an error when the connection drops during a server request instead of finishing with a partial list.
    - Cost tracking can no longer fail your work: a turn, a review, an Auto-Review check, a purge, a sub-agent or an Auto routing decision finishes even when Codewhale cannot record its cost, and the cost then shows as unknown.
    - Child processes now inherit only the standard locale variables (LC_ALL, LC_CTYPE and the other locale categories, plus LC_TERMINAL and LC_TERMINAL_VERSION) and a listed set of DOTNET_ host, SDK and runtime settings. Other DOTNET_ variables, including application configuration keys, are no longer passed to child processes or MCP servers.
    - The install guide's note for a first message that gets no answer now describes v0.10.2: connect a model with /provider, and restart if messages stay saved for later after you connect. It described v0.10.0's key screen. The Chinese guide carries the same correction.
    - Project activity on the site now comes from a server-side snapshot with a freshness record, the browser no longer calls GitHub, and count sentences use the right plural form in every language.
    - The install page now gives the exact steps for the released version on every platform, including what the installer adds to PATH, how to turn off usage counting, and how to remove it, and the install command no longer gets cut off on phones.
    - After choosing "explore offline" on first run, connecting a provider or Custom endpoint with /provider now takes effect immediately; messages are no longer held as "Saved for later" until restart, and a message held while offline returns to the composer.
    - The pet browser view opens with a one-time code instead of the long-lived owner token, so the token no longer appears in the URL or the launcher command line. The code lasts 30 seconds and works once; the owner token itself is still stored in the cookie and connection file and is not rotated. Not run in a real browser.
    - On Windows with Caps Lock on, Ctrl+E moves to the end of the line again instead of opening the file tree; the file tree now needs an explicit Shift (Ctrl+Shift+E or Cmd+Shift+E), so a terminal that reports an uppercase E with Ctrl but no Shift flag can no longer toggle it. The Caps Lock key event is simulated from the input library source; no native Windows run.
    - Cancelling or timing out a read-only Git tool (git_status, git_diff, git_commit_plan, git_log, git_show, git_blame, git_merge_tree) now stops the git process and anything it started, instead of leaving it running in the background. Verified on macOS by unit tests; Linux, Windows and hosted CI are not yet run, and the filter-override probe is still not contained.
    - TUI: the launch resume confirmation no longer treats Meta+Enter, Meta+Y or Hyper+Enter as "resume"; only a plain Enter/Y or Shift+Y answers it. Verified by the focused unit tests only; not tried in a terminal that sends Meta or Hyper.
    - TUI: mentioning a huge directory or a far-away line range (@file:N-M) now stops after a bounded scan and says the result is partial instead of claiming end of file. Verified by the focused file_mention unit tests; no real 64 MiB file was tried.
    - Runtime patch-undo now restores a turn's own file changes in the default (Ask) posture without trust mode or Full Access; later edits and changes the turn did not make are still refused with nothing changed, and the restore_requires_trust error code is gone (#6970). Verified by app-server and TUI unit tests on Linux; no Windows /undo or process-restart run.
    - Website terminal frames: The site can render terminal frames captured from the released version, and chooses each frame's caption from where it was captured.
    - Website docs truth: Documentation pages now describe the released version first and show what exists only in source in a labelled section that switches on when a release carries it.
    - Website Arabic pages: On Arabic pages, English text that has no translation yet keeps its own direction and language, so punctuation, commands and dates no longer appear reversed.
    - A DSH plugin whose package includes a .gitignore at its root now installs instead of being refused as a hidden file; nested .gitignore files, other hidden files, credential files and links are still refused. (CW-8023)
    - install.bat in the Windows release archive now passes its arguments to install.ps1, so install.bat -NoModifyPath declines the user PATH edit like the PowerShell installer does, and the install guide says so. It has not been run on Windows. The batch file reaches people in the next release archive, and the guide sentence when the website is next deployed, because the site serves the guide but not install.bat. (CW-8046)
    - Desktop browser tools when another Codewhale session is already open: starting the desktop app while a terminal or codewhale serve session already holds ~/.codewhale no longer fails browser-tool registration with a 400 (Desktop browser owner is unavailable). An attached Runtime API listener now carries its own validated Ed25519 browser-owner public key over the local owner channel without inheriting another listener's key or breaking attachment to an older host. (CW-8240)
    - Model id fixes: Google ids written as Google's model list spells them (models/gemini-4-hydrogen) now resolve to the bare id with its real limits; Moonshot kimi and Xiaomi MiMo short names such as mimo and asr are now sent as the model they name instead of unchanged; extra spaces around a model id are ignored; and an unknown model id on official DeepSeek or OpenCode Go is refused the same way by every path instead of being accepted by some. Legacy DeepSeek names (deepseek-chat, deepseek-reasoner) are now sent as the model they map to.
    - Fewer false task idle timeouts while progress is being saved: when a supervised task's idle deadline passes while the task supervisor is busy saving its previous progress, the supervisor now polls the task once, without waiting, before applying the deadline, so progress the task can report on that single poll is counted. Progress that needs more than one poll to be sent can still end in idle_timeout, and a task that is genuinely idle times out as before. (CW-7957)
    - Required MCP connectors during a host recycle: installing or enabling a plugin that requires a native MCP connector no longer fails with restarting after: planned restart after repeated dirty teardowns when the extension host recycles at that moment; it waits for the restarted host within the existing connect deadline. Inspecting a plugin bundle for review now allows 60 seconds instead of 10 before it reports timed out inspecting plugin bundle for review on a busy machine. (CW-7957)
    - Provider failure causes in the diagnostic log: when a provider request fails while opening or reading a stream, or during context recovery, the default diagnostic log now records a provider request failed warning with the error code, category, whether the request was sent, and the HTTP status or timeout duration when known; it never records the error text, response body, URL or credentials. Thanks @laozidabo for the fix and @7jrxt42BxFZo4iAnN4CX for the log analysis (#7353, #7328).
    - DeepSeek models behind OpenAI-compatible gateways: an openai-compatible provider row that serves a DeepSeek model from a host other than DeepSeek's own no longer sends DeepSeek's native thinking object, which aggregating gateways reject with a 400; it sends reasoning_effort instead, with off as none. A row pointed at api.deepseek.com keeps the native toggle. Thanks @SparkofSpike (#7349).
    - Usage reporting survives a killed session: when usage reporting is on, a session ended by a terminating signal or, in codewhale exec, a broken pipe now records its session end at once and makes one send attempt of at most 1.5 seconds, after consent and the opt-out are checked again; a second signal still ends the process immediately. Each process keeps its own local spool, and what a process that died left unsent is sent once by the next terminal UI, exec or serve start (at most four spools, none older than seven days), deleted before the request so it is never sent twice. Nothing new is sent. See docs/TELEMETRY.md. (CW-8190)
    - Usage reporting counts turns and sub-agents on every surface: when usage reporting is on, codewhale exec and codewhale serve sessions now report their turn count, turn-time buckets and sub-agent spawns instead of zero, because the engine counts them rather than the terminal UI. Sub-agent turns do not add to the session's turns, and terminal-UI turns that never reach the model (shell-command turns, rejected submissions) no longer count. Nothing new is sent. See docs/TELEMETRY.md. (CW-8190)
    - Idle wakeups while a background shell job runs: a running background shell command that prints nothing no longer keeps the terminal on its 48 ms idle poll, for the whole life of the job. Its elapsed time, its "no output for" label and its row in the background jobs panel still update, at most once a second, but those ticks no longer count as activity, so the event loop reaches its 250 ms quiet poll after 5 quiet seconds as it does with nothing running. Thanks @Gabriel-Degret for the measurements that found it (#6728).
    - Session names after a crash, and keep-forever snapshot retention: a session name saved right after a crash that cut off the previous session-index line is no longer lost, because the new entry now starts on its own line; and a very large [snapshots] max_age_days (such as 9223372036854775807 for "keep forever") no longer wraps around and deletes every undo snapshot at session start. Thanks @luochen211 (#7316).
    - MCP and language servers that send requests mid-call: a tool call no longer fails with "neither a result nor an error" when an MCP server sends a ping or other request that reuses the call's id while the call is running, and a language server's workspace/configuration or similar request no longer ends a pending LSP request. Codewhale now answers ping, answers other server requests with "Method not found" (it never advertised them), keeps waiting for the real reply, and a refused answer over Streamable HTTP no longer drops the connection to legacy SSE. Thanks @luochen211 (#7319).
    - Long tool names: Tools whose encoded name is longer than the route's limit are now left out with a visible warning instead of failing every request with a 400. The limit is 64 characters on OpenAI and on other OpenAI-compatible providers that document no larger limit, and 128 on Anthropic-style routes, DeepSeek, Ollama, Ollama Cloud, vLLM, SGLang and custom routes. Forcing such a tool gives an error that names the tool and the limit, and a session that already called one on a route with a documented limit (Anthropic, OpenAI, Codex, DeepSeek) is refused with a message saying to switch route or start a new session. A forced tool_choice in any chat form now names the encoded tool, and a tool whose real name looks like an encoded escape can no longer be mistaken for another tool.
    - Skill install and import: /skill install now works out an archive's wrapper directory from every entry instead of the first one, so a GitHub repository laid out as <name>/SKILL.md installs instead of failing with "missing SKILL.md in archive", a repository-root SKILL.md is chosen ahead of a nested skills/<name>/SKILL.md, and a flat tarball that lists scripts/run.sh before SKILL.md no longer installs without its SKILL.md. Importing an external skill that contains dotfiles such as .DS_Store, .gitignore or .config/ no longer fails with "imported content digest mismatch"; the dotfiles are copied, and the source's own .trusted and .installed-from are still left behind. Thanks @luochen211 (#7311).
    - Workflow authoring: a declarative Workflow or structured workflow plan whose goal or prompt mentions words such as "async", "import" or "open(" is no longer rejected as an unsupported construct. Fleet TOML values written as 'single-quoted' strings, or with escapes such as \", are now read without their quotes. Workflow scripts can no longer reach the internal __workflow_slot_dropped binding, which had let a script mark a clean run as Degraded. Thanks @luochen211 (#7312).
    - Patches with short hunk headers: apply_patch now reads every line of a hunk when the @@ header counts are too small. Lines past twice the header counts used to be dropped without an error, so a long hunk, or a new file written under @@ -0,0 +1 @@, could lose its later lines. A header with an enormous count no longer crashes the parser, and stray text after such a hunk now fails as a context mismatch. Thanks @luochen211 (#7287).
    - Web fetch and web.run entities: text a page escaped on purpose now stays escaped. A page that writes &lt;br&gt; to show a literal <br> now reads as <br> in fetched text, web.run lines, page titles and meta descriptions; before, it was decoded twice into <br>. Both tools now use the search scraper's single-pass decoder, so numeric references such as — and names such as — are decoded there too. Thanks @luochen211 (#7291).
    - Credential redaction: text, JSON, and workflow-disclosure redaction now masks multi-line private-key blocks across PGP armor headers (including Comment: URLs), longer preambles, and 16-character wrapped lines; masks credential values inside nested or escaped JSON assignments, escaped quotes, \u003c/\u003e delimiters, and spaced or nested JSON objects and arrays; and treats plural token keys (API_TOKENS, ACCESS_TOKENS) and credential-shaped tokens values as credentials while keeping model and tokenizer metric names (max_tokens, tokenizer, token_limit, tokens=5) visible.
    - Deny rules and command safety: a command whose command word is not a plain literal, or that redefines a command name earlier in the same call, is now refused while a deny rule is configured; the background destroyer hold reads commands the shell tokenizer rejects, decodes ANSI-C escapes inside shell payloads, and holds Windows drive, UNC, and backslash recursive delete targets; and sed, find, sort, rg, fd, uniq, env, less, more, ag, info and git count as read-only only when their words are literal and use read-only flags, with codewhale --version and Windows trailing-backslash paths normalized before checking.
    - External agents installed through npm on Windows (claude.cmd, codex.cmd, ...) are now found instead of the unrunnable shell shim, GET /v1/agents/external says whether an agent answered with an unsupported protocol rather than reporting every failure as no answer, and a hung --version or handshake probe no longer leaves the agent's child processes running. Verified on macOS and Linux; the Windows code has never been compiled or run, and no agent row is qualified by this change.
    - The Runtime API's POST /v1/git/push now pushes exactly one branch at one commit (<commit>:refs/heads/<branch>, no follow-tags or submodule recursion), so push.default, remote.<name>.push and push.followTags can no longer publish other branches or tags. Clients can bind a push to a named branch and expected HEAD with branch + expect.head (advertised as named_push in GET /v1/git); a stale branch or HEAD answers 409 git_state_changed and pushes nothing. A bare push from a detached HEAD or an unborn branch is now refused, and the desktop app has not yet adopted the named form. Verified on macOS by unit tests against a local bare remote; no real network remote, Linux, Windows or hosted CI run.
    - Saving a Fleet role on Windows no longer fails with a sharing violation: choosing a model for a saved project or personal agent profile wrote nothing and reported "The process cannot access the file because it is being used by another process". The write-lock identity check now reopens the lock without denying the writer that already holds it.
    - A missing or unreachable state directory no longer breaks the turn: when sub-agent state under .codewhale/state does not exist or is a symlink loop, the session warns once, naming the path, and keeps going without durable sub-agent cleanup instead of erroring every cycle. A state directory that exists but is invalid still refuses, and the credentials-directory error now says which case it hit.
    - resume and fork work without a terminal: run from a pipe, cron job or other non-TTY launcher, codewhale resume (and fork, which forks first) now continues the session through the headless exec path — prompt from stdin or trailing words — instead of refusing to start. In a real terminal both still open the TUI.
    - An MCP capture that fails no longer reads as an empty registry. A timed-out or changed-during-capture MCP snapshot emits nothing instead of withdrawing every server's instructions; withdrawals now happen only on a successful empty capture.
    - Deleting a conversation ends its terminal sessions and background jobs. A Runtime thread's terminal PTYs and running background shell jobs are killed when the thread is deleted, and the PTYs leave the live registry with their durable record marked cancelled. Jobs that already exited and other conversations' shells are untouched. The desktop tab-close half remains separate work.
    - A question waits for you. An answerable prompt from the desktop Runtime API no longer hits the 30-minute durable-task human-wait cap; it waits until you answer or cancel. Headless and unanswerable tasks keep the fail-safe cap.
    - A plugin refused for its runtime snapshot now says why. The warning and the enable error carry the reason the saved snapshot was rejected (for example the stage root is not read-only, or its content identity differs) instead of only "no staged snapshot". On Windows, 119 of the 135 hosted test failures were this one message with the cause discarded, so the next run can name it. Not a fix for those failures.
    - Listing installed agent CLIs no longer blocks the runtime. GET /v1/agents/external looks for each binary with tokio::fs instead of synchronous file calls on a runtime worker.
    - A failed custom-provider switch leaves the provider you were on. When saving a custom provider succeeds but switching to it fails (its identity cannot be resolved, or the engine refuses the route), the next request keeps going to the provider the footer shows instead of the half-configured one.
    - A zero page size over stdio still advances. thread/loaded/list on the App Server's stdio transport treats a requested limit of 0 as 1, so a client that sends 0 reaches the next page. GET /v1/threads is unchanged.
    - Anthropic and Messages-compatible routes accept any tool name. Tool names that Anthropic's pattern rejects, such as web.run from a loaded tool group, are encoded on the wire and decoded in replies, as the chat and responses routes already did, including when such a tool is forced through an object-form tool_choice. Before, one such name made every request fail with "tools.N.custom.name: String should match pattern", which stopped sub-agents that had loaded it (#7252). Thanks @ychu824 for the report.
    - A large sub-agent fan-out no longer exhausts the usage journal. The per-session limit of live usage receipts rises from 64 to 256, above the workflow ceiling of 128, so a full fan-out keeps its cost receipts instead of running with cost unknown.
    - A turn that stalls before it starts is now bounded. The stall watchdog covers the setup before the first model request, so a wedged start is logged, cancelled after 180 seconds with a stated reason, and leaves a stall record instead of waiting silently. A warning names the case where all four blocking-work slots are held. Refs #6184.
    - One unreadable saved session no longer empties the recent-sessions list. The launch card and ACP session/list show the readable sessions and log the failure. Refs #7095.
    - Windows uninstall removes the receipt and update leftovers. The installer's uninstaller also deletes .codewhale-install.sha256 and codewhale.old-*/codew.old-* left by a self-update, so bin can be removed. Refs #7091.
    - Windows /undo matches recorded file paths regardless of case. A write recorded under a different drive-letter or directory case, or a \\?\ prefix, is no longer dropped from the restore plan. Refs #6970.
    - Windows: Fleet and metrics read live files again. Replaying a Fleet ledger and reading audit or receipt records no longer fail with a sharing violation while their writer is still open; the same regular-file, link and identity checks apply. Plugin enablement now says which snapshot check refused (stage root, content identity or final check) instead of one generic message. Generated protocol and SDK exports keep LF line endings in Windows checkouts.
    - Sessions in one folder no longer leave each other's sub-agents read-only or private: a second session works beside another one, stale or suspended included, the older sub-agent store upgrades right away, and a store that cannot be opened is retried on the next sub-agent change instead of needing a restart. While another Codewhale session, a suspended one included, is open in a folder the desktop app or serve was asked to work in (other than the folder it started in), that Runtime still refuses sub-agents that would edit the folder directly; isolated worktrees are unaffected. A sub-agent store that cannot be opened shows its refusal once instead of repeating cleanup warnings on every sidebar refresh. Restart any session started with Codewhale 0.10.2 or older: once the folder upgrades it can no longer save sub-agent state (Refs #7232).
    - A dev server can outlive the turn in an interactive session. persist:true now works in the TUI and desktop when the thread has Full Access; restricted postures and Fleet/sub-agents still refuse it.
    - codewhale exec --add-dir <path> (repeatable) and addDirs on POST /v1/threads let the file tools read and write a sibling directory, a second checkout or a shared scratch root without turning on Full Access.
    - Unsettled usage is persisted in production, not only in tests. The interactive sink now records a legacy usage receipt when a provider response has no settlement, so children and turns stop reporting settlement failure.
    - A full usage journal no longer fails a turn before dispatch. The request runs with cost unknown instead of stopping on “native usage journal capacity reached”.
    - Reverting a file works in any posture. Restoring a file the thread's own turns changed no longer requires /trust or Full Access; the exact snapshot and reviewed-hash checks still apply. fetch_url can reach a typed localhost name or local IP literal you allowed with /network allow <host> (domain names resolving to private addresses and cloud metadata stay blocked). Both refusals now name the setting.
    - codewhale exec offers tools by default, still under the configured sandbox and approval posture. --no-tools is the one-shot. A pipe on stdin is the prompt when no arguments are given, or is appended to them.
    - A child no longer dies when usage settlement is not acknowledged. The turn continues and cost stays unknown, matching the parent path.
    - Workspace memory works without a git origin. A plain folder or a repo with no origin remote gets a stable workspace id. codewhale plugin list is an alias of plugins status. A heavy command runs after 30 seconds instead of waiting forever for an admission slot. An MCP registration 4xx names the status and the manual client-id path.
    - Wafer is a selectable OpenAI-compatible host at https://pass.wafer.ai/v1. The public model list is the catalog; the default is GLM-5.3. Inference uses WAFER_API_KEY.
    - Provider defaults follow the provider's own model list. A same-line successor (grok-4.6 to grok-4.7, muse-spark-1.2 to muse-spark-1.3) replaces a stale pin. A different line, such as GPT-6 beside GPT-5.6, does not. The provider pane shows one current model per line and spreads a gateway list across authors, instead of filling the screen with every Claude snapshot.
    - Turns no longer fail on a cost bookkeeping error. When Codewhale could not settle its own usage record ("previous usage publication has not been acknowledged"), the whole turn failed and sub-agents were interrupted, even though the model had answered. The turn now continues, the receipt keeps the accounting error, and the status line says the cost is uncertain.
    - OrcaRouter offer: no longer shown when Codewhale is in Simplified Chinese or your computer is set to mainland China, and its note now says the link is part of a referral campaign.
    - Cost line: a finished request is never "outcome unknown": the cost line drops "request outcome unknown" (and "provider omitted usage") once the requests behind it have settled, even when another turn is still unpriced for a different reason, and a request that is still running now reads "request in progress" instead. A request that an exit or crash left unsettled still reads "request outcome unknown" after a restart.
    - Sub-agents in codewhale exec: a sub-agent started from codewhale exec now runs. It used to stop before its first provider request with "child provider call has no captured accounting origin", because the exec session's accounting origin never reached the turn's tools, so a fan-out ran in one context instead.
    - IME candidate window under modals: the hidden terminal cursor now follows the caret in /config search and its value editor, so the input-method candidate window can appear there instead of over the composer. Real Pinyin input on macOS and Windows is not yet confirmed. Thanks @cmdcorp6534 for the report (Refs #2323).
    - Fleet members: a replayed member start now matches only within its own session, so two sessions that reuse an operation key no longer receive each other's agent.
    - Plugin stages created during a registry load are checked: a plugin whose staged copy appears while the registry is loading now goes through the same restage lock, receipt and policy checks as any other stage instead of being left unstaged; invalid bytes are still refused and stay in the failure cache.
    - Host-provided model clients: keep configured session isolation and approval deadlines when optional credential preflight fails.
    - Runtime SDK exports: include the existing thread-scoped Git, snapshot, worktree and job-operation capabilities in the committed schema and types.
    - Plugin enablement revalidates its review: enabling rechecks the staged snapshot and, under the existing state lock, refuses a changed review generation or trust receipt. The macOS stale-enable check passed (1/1); a separate Linux run reported 202 passed and one ignored on an earlier base with matching plugin files and lockfile. Snapshot checking is point-in-time; missing-stage recovery reuses the current receipt and policy. Filesystem race coverage and final-candidate native qualification remain open.
    - Plugin status and UI admission: an enabled, trusted plugin whose reviewed runtime snapshot is missing or invalid now reports runtime-snapshot-unavailable. Both plugin UI metadata and assets require a declared DSH client; ordinary plugins cannot expose staged files through the client UI route. Missing snapshots recover only from receipt-matching canonical source; authenticated assets require an exact current grant. Native and Electron qualification remains open; existing modified snapshots require review.
    - DSH package-directory imports: the existing offline reviewer uses npm's version-range parser with the pinned DeepSeek host's prerelease policy, and bare self-package exports resolve inside the selected package directory. Invalid or incompatible ranges and paths outside the reviewed package still refuse. Real published-plugin activation remains unqualified.
    - A local proxy that stops mid-session no longer strands the session (#7231): the model, catalog, search, vision, finance, MCP-registry, profile and remote-control clients watch a loopback proxy port and go direct while it refuses connections, then resume proxying when it returns. Only a definite refusal from every resolved address changes the route; remote proxies, NO_PROXY matches, credentials and the existing precedence are unchanged. Set CODEWHALE_LOCAL_PROXY_FALLBACK=0 to keep the old build-time snapshot.
    - Proxy diagnostic privacy (#7233): malformed MCP proxy warnings omit configured values; local-proxy log labels mask userinfo and omit URL paths, queries and fragments. Routing is unchanged. All 23 existing proxy tests passed on macOS; runtime log capture and other platforms remain unqualified. Thanks @SparkofSpike for the report.
    - Fork, undo and retry work after a workspace drift notice (#7234): the history-boundary walks now treat a whole <context_update> envelope as engine-owned, so a session that received one can be cut at every saved turn. A person quoting a notice or a truncated envelope still counts as their own prompt.
    - Git writes land in the right workspace: stage, unstage, discard, commit, push and branch take ?thread_id= and run in that thread's recorded workspace, matching the read routes. Before, they always ran in the server's own folder, so a commit asked for a thread in another folder could land in the wrong tree.
    - ChatGPT sign-in no longer depends on the device clock (#7203): identity- and access-token expiry and not-before times are checked against the issuer's clock, read from the Date header of the issuer's key response, with a 60-second tolerance; without that header the device clock is used as before. Time errors report how far the device clock is from the issuer's when the difference exceeds the tolerance. A token signed with a key missing from the first key download triggers one fresh download before verification fails, and a missing or malformed claim is named exactly. Signature, issuer, audience, subject, nonce, account and plan-scope checks remain exact. Thanks @mickey1204 for the report.
    - Remaining long-blocking work moved off async callers (#6553): route credential and certificate preflight, worktree creation, Runtime Chat relay and remote-control journal transactions, and the remaining session, branch, tree, skill, plugin and memory command I/O now run on the supervised blocking owner. Results are still awaited before state publication; sync APIs remain where sync callers still use them.
    - Frozen prices on DeepSeek endpoints: published rates are captured for DeepSeek's root, /v1, /beta and Anthropic endpoint variants, and remain bound to the exact endpoint on replay. Other providers keep their existing pricing scopes; official credential aliases alone do not establish equivalent regional or plan prices. Request outcomes, missing provider usage, legacy usage and unverified corrections now have distinct cost explanations; saved receipts without a frozen quote remain unpriced.
    - Clipboard image persistence: the existing confined writer handles relocated user state directly, without a second filesystem fallback that bypassed its protections and exceeded the blocking-call budget.
    - Case-sensitive model selection (#7214): the provider picker restores the exact configured or wire model ID before trying case-insensitive compatibility matches. Thanks @liuyy2 for the diagnosis and @SparkofSpike for the compatibility-preserving fix.
    - WeCom replies carry the API's error (#7208): a rejected WeCom call now shows its errcode and message in the bridge reply instead of [object Object]. Thanks @gaord.
    - WeCom streams survive the ten-minute expiry (#7210): the bridge finalizes the current stream and opens a fresh one before WeCom stops accepting updates, and reopens once on a rejected update. Thanks @gaord.
    - Non-English packs lose stale mode-jump and rail copy (#7225): the sweep covers every non-English locale and a test pins it. Thanks @asto18089.
    - image_analyze accepts absolute paths inside the workspace (#7226): POSIX and Windows spellings that resolve under the workspace are read instead of refused. Thanks @asto18089.
    - Sub-agent follow-ups report what happened (#7228): a message to an existing successor says whether it was delivered without a resume, the focus view follows the actual recipient, and an undelivered follow-up keeps focus and shows the failure. Thanks @asto18089.
    - A long turn no longer ends at 64 model requests: a turn that had recorded 64 provider usage receipts failed on the next one with "captured usage sink did not acknowledge its source", discarding the person's answer. The per-turn receipt cap is removed. Receipts keep recording exactly once; a sink refusal now retains the exact receipt for a later admitted flush and continues the turn, while owner-lock loss or thread mismatch still fails closed.
    - The verify tool names a callable surface (#7223): its description taught the model to use the retired, hidden run_verifiers name; it now says to use the Run tool with action="verifiers", and the retired-name guard test now covers verify's description. Thanks @asto18089.
    - A home-directory workspace no longer refuses its own state (#7207): a session started in the home directory treated it as a confined workspace, which broke the supported layout where ~/.codewhale is a directory junction onto another volume (Windows mklink /J); only the home state directory is now exempt, and confinement for links elsewhere is unchanged. Thanks @SparkofSpike.
    - The command palette keeps your draft (#7205): picking a command that takes an argument, such as /rename, no longer discards what was in the composer; the draft is stashed so history search can recover it. Thanks @Lstarsky0.
    - Old sessions restore with the topology checkpoint in place (#7229): sessions saved by v0.9.10 to v0.9.12 that compacted with live sub-agents placed the agent-topology checkpoint at the end of the history, which left a tool-then-user message pair that strict Chat Completions templates reject with HTTP 400. Restore now moves the checkpoint to where current saves place it, deletes nothing, and a restore followed by a re-compaction no longer keeps a superseded duplicate. Thanks @asto18089.
    - /patch-undo undoes the turn you chose (#7216): POST /v1/threads/{id}/patch-undo ignored turn_id and undid the latest turn instead, so a caller got a different turn than /undo removes for the same request. It now removes the named turn and every turn after it. GET previews the exact turns and the files that would be restored; sending them back as expected_turn_ids and expected_paths makes a changed selection answer 409 undo_selection_changed before any file is touched. Clients should require the thread_patch_undo_turn_id capability before sending a selected turn, because older Engines ignore the field. Thanks @soarkit for the report.
    - grep_files matches brace and nested-directory globs (#7215): include patterns such as *.{txt,md} and **/*.{txt,md} no longer return an empty result with no error; they match the same files the equivalent separate globs do, at the root and in nested directories. Nested brace groups and long runs of **/ are now bounded, so a hostile pattern can no longer expand to billions of patterns or hang the search (#7254). Thanks @Lstarsky0.
    - Sub-agent write claims accept absolute in-workspace paths (#7227): a write-capable sub-agent that spelled an in-workspace target as an absolute path was refused while the relative spelling succeeded. Absolute paths that resolve inside the claimed workspace are accepted; paths outside it, .. traversal and symlinked ancestors that escape are refused exactly as before. Thanks @asto18089.
    - WeCom replies are split by UTF-8 bytes (#7209): the WeCom bridge now caps each reply chunk at 3,800 bytes (WECOM_MAX_REPLY_BYTES) on code-point boundaries, so a long Chinese reply is no longer delivered silently truncated at WeCom's 4,096-byte limit. Callers that do not pass a byte cap keep their behavior. Thanks @gaord.
    - file_search reports workspace-root paths (#7213): a search scoped with path now returns matches the way read and grep_files resolve them, so reading a result opens the file that matched. A path naming one file and glob searches under a subdirectory are fixed too. Thanks @Lstarsky0.
    - Sub-agent worktree isolation no longer adopts unrelated checkouts (#7224): only the session anchor itself may adopt nested repositories; ancestors are probed for containment only, so a workspace a few levels below the home directory no longer fails with "Multiple git repositories found" over unrelated projects. Thanks @asto18089.
    - fetch_url no longer claims to be sandboxed (#7222): its description now says it is an in-process HTTP client guarded by the network policy and the SSRF/DNS checks, and attributes the sandbox contrast to exec_shell. Thanks @asto18089.
    - Usage on long tool turns: physical model-call receipts remain available after the 64th response without dropping earlier sources. A completed tool-only provider response uses its terminal stream event for accounting, while incomplete streams retain unknown coverage.
    - Retained browser connections follow their desktop owner: authenticated runtime registration binds the browser endpoint and credential to its workspace; existing Core catalogs and connections retire a replaced registration before reuse.
    - /new waits for the Engine: the terminal keeps the current session, transcript and draft until the exact session switch is acknowledged. A refused closure preserves them; a late acknowledgement can finish once while retaining input edited during the wait. Pending or uncertain switches pause new work and retain the existing scoped Stop controls.
    - Interactive command confirmations keep their stack headroom: the existing interactive startup chain heap-pins its large futures instead of embedding their debug state machines in each caller.
    - Live MCP status includes runtime servers: the existing pool snapshot now includes workspace-scoped dynamic servers, retaining static-name precedence and the same permission and connection checks.
    - Plugin reload confirms its workspace: the status translation receives the required workspace value instead of producing an empty acknowledgement.
    - MCP credentials fail clearly: missing or invalid required credential configuration stops before connection, stored OAuth discovery failures retain their cause, and reviewed-plugin errors redact credential details. Explicit reconnect still reloads saved credentials.
    - Desktop browser MCP stays with its workspace: the paired desktop host registers its authenticated loopback server at runtime, late registrations refresh the tool catalog, and another workspace cannot inherit the connection. Recognizable obsolete global browser entries are ignored without rewriting user configuration.
    - Closing an empty delegated fleet avoids an unnecessary writer lock: a session with no locally owned agent or worker records can close while another Codewhale process coordinates the workspace. Read-only or failed-admission state and sessions with owned records retain the existing coordination checks.
    - Child, review and Auto usage keeps its captured session and route through late completion and persistence retries. Unreported usage stays unknown, cache writes and reasoning remain distinct, and cost calculations use the quote captured for the request.
    - Interrupted children persist their continuation checkpoint and complete their workflow task instead of leaving it waiting on a worker whose execution already ended. Live approval waits retain their existing behavior.
    - Session publication compares the document and crash checkpoint captured before work was queued. A delayed save refuses changed records without replacing newer history or clearing its checkpoint. Ordered completion retains real checkpoint acknowledgments, and native turn/control identity follows restores, undo and terminal saves. Legacy checkpoints require explicit recovery; canonical history recovery retains its original source and exact prepared generation.
    - Damaged usage sidecars keep valid recovery data readable with incomplete coverage and no publication receipt. Known retirement, changed raw records and unsafe writes still refuse.
    - Local control and ACP output serialize within the existing 8 MiB frame limit and stop a damaged or stalled output stream. Compatibility replies, events and relay stdout now share the 30-second write deadline; owner forwarding keeps its tighter 5 seconds. Standalone and attached ACP recover after complete invalid UTF-8 or oversized input frames, discard oversized tails through the real newline, and preserve cancellation, permissions and actual Core receipts.
    - MCP composition records actual schema or description changes before the next request, so a conservative batch withdrawal re-pins the declared tool surface instead of failing the C5 prefix guard. Semantically unchanged runtime refreshes preserve the original serialized catalog and schema key order. The execute_tools description also explains that visual input needs a direct capture call because nested results do not deliver inline images to the model.
    - Runtime SDK declarations for event, image and dynamic-tool messages are generated from the same Rust wire contracts. Output schemas retain required nullable fields while request defaults remain optional.
    - Inference requests stop after uncertain delivery or an interrupted stream instead of silently sending another request. Automatic retries require an ordinary rate limit or a transient connection failure before dispatch. Redirects and HTTP protocol retries cannot bypass this policy; retained output and missing usage coverage remain visible. Terminal exec failures return exit 1; error categories no longer imply that repeating a saved command is safe.
    - MCP calls inside execute_tools expose a single bare JSON result directly through content. Rich or annotated results retain their envelopes, and oversized results keep the original raw size and spill receipt.
    - Session metadata reads stop at a bounded scan and report unreadable records without hiding healthy picker rows. Queued saves preserve durable renames, archive state and Runtime ownership under the session write lock; uncertain metadata refuses writes and cleanup. Persistence batches run off the async executor, and explicit placeholder-title renames retain their intent.
    - Worker coordination serializes durable admissions across processes, preserves foreign workers and winning completion receipts, and fences stale checkpoints. Fleet restart reservations retain uncertain prior processes until exact teardown is confirmed; final output, usage and the receipt publish together without duplicate accounting on retry. Retained transcripts follow committed ownership.
    - JSONPath projections bound path length, traversal steps and intermediate matches before cloning results. Direct fetches share the same parser and enforce one aggregate serialized-field budget; oversized selections refuse with narrower-selection guidance.
    - Long tool output and diffs use bounded display windows and a byte-limited row cache. Retained details load verified byte ranges and label what search and copy include; explicit source copy keeps stored text with control-sequence cleanup. Oversized Unicode is shown safely without changing question answers; long answers retain their exact bytes in the existing owned output artifact before bounded model-context projection. New pager notices are translated across all 15 complete language packs.
    - Markdown character references: ordinary prose renders valid references once, while inline code, plugin approval text and argv retain their literal values. Long URL punctuation stays linear to scan. Thanks @Lstarsky0 for the report and original fix (#7192).
    - Managed Fleet validates overlapping write roots with a component-sorted scan and deduplicates roots once. Large valid request bodies no longer spend quadratic CPU before admission; existing write-scope refusals and execution limits remain in force (#6554).
    - MCP transports, connection pools and child Engines retain the owning host credential context for placeholders, headers, bearer tokens and OAuth setup. Missing injected values never fall back to process secrets. Reviewed plugins keep their captured environment authority, whose Debug output now masks values. Durable OAuth token custody and full subprocess isolation remain separate work (#5637).
    - Python REPL drains stderr while code runs, retains at most 64 KiB of diagnostics and reports omitted bytes, so noisy code cannot block request completion (#6554).
    - Saved tool results use bounded streaming inspection while preserving session ownership, digest and generation checks. Text refuses oversized lines or selections with byte-recovery guidance; verification also has explicit scan and cancellation limits (#6554).
    - Telemetry bounds its pending event queue and disk-tail reads, keeps final flush admission available, and skips invalid UTF-8 records without discarding intact neighboring records. Existing opt-out and privacy ordering remain in force (#6554).
    - Workflow history summaries retain large child totals without allocating one row per claimed child. Missing outcomes, usage and elapsed time remain unknown, including in the workbar (#6554). The independent terminal kit advances to unpublished 0.2.0 for its u64 total API; registry-based TUI packaging waits for separately approved kit publication.
    - Web build dependencies cap glob preprocessing and stop cancelled directory traversals through compatible, verified upstream backports. Raw dependency findings remain visible. Thanks @isaacs for the minimatch and glob fixes (#6560).
    - Repeated requests no longer make /undo restore files from an older invocation. /undo select chooses a request range and shows checking, restoring and saving progress. Missing, ambiguous or stale restore points refuse before changing files. Esc–Esc continues to rewind only the conversation. Thanks @luestr for reporting #6970.
    - web.run refuses more than 64 operations across its command arrays before starting network work or changing its session cache (#6554).
    - Skill discovery and audit marker reads stop at 512 KiB. Approved linked global skills still load; oversized, invalid and non-regular files produce visible refusals instead of unbounded reads (#6554).
    - OpenSandbox caps successful responses at 8 MiB before parsing and limits remote error details to 4 KiB with terminal controls removed. Oversized responses fail explicitly. Remote execution cancellation remains a separate requirement (#6554).
    - The WinGet manifest generator now selects the published x64 portable executable by exact name and records its checksum and Visual C++ dependency.
    - The Windows setup uninstaller preserves a trailing separator in the current-user PATH and retains other settings stored in the CodeWhale registry key.
    - Inline code in terminal replies preserves embedded backticks. Text after an unmatched delimiter keeps its normal styling. Thanks @Lstarsky0. #7185
    - Windows Ctrl+Break and terminal-close events now request the same bounded session checkpoint and persistence flush as Ctrl+C.
    - When a keyless local Ollama route has no resolved chat model, retrying /provider ollama refreshes the catalog in the background. You can keep typing while the daemon responds. #5848
    - Auto checks the served context window on an active keyless Ollama route when its default model still has an unverified limit. A later turn can use the running model’s window once Ollama has loaded it. #5848
    - The bundled catalog recognizes the bare deepseek-v4.1-flash model ID. It reports a 1,000,000-token context window and a 384,000-token output ceiling. #7183
    - After /undo restores files, Codewhale saves the conversation rewind before reporting completion. Pressing Esc twice and choosing an earlier request also saves that exact conversation boundary, even when two requests have identical text. The picker keeps workspace files as they are. Thanks @luestr for reporting #6970.
    - Feishu and Weixin persist each incoming message ID before handling it. Concurrent deliveries share one result. After a restart, a message with an uncertain outcome stays pending until the bridge can tell the user to check its status. Thanks @7jrxt42BxFZo4iAnN4CX for the durability audit (#6555).
    - Custom OpenAI-compatible routes now honor explicit output requests within the configured window and serving limits. A hosted model with the same name could previously truncate reasoning at 32,768 tokens. Thanks @Gabriel-Degret for reporting #7179.
    - Saving a user turn when the Engine adds its metadata preserves the journal entry and its place in history. Sessions with a fork keep the earlier branch intact. Thanks @SparkofSpike. (#7180)
    - Star keycaps stay intact in Markdown (#7176): plain and escaped text preserve the full grapheme, and a keycap cannot open emphasis. The separate Windows Terminal font-fallback issue remains unqualified. Thanks @SparkofSpike.
    - Codewhale runs from a HarmonyOS user directory (#7168): on HarmonyOS hmdfs (the 2in1 /storage/Users/currentUser mount), which reports its own owner and a group-writable mode for every object and refuses chmod and advisory locks, a GUI start failed one feature at a time — the workspace lease, the owner control socket, then the OAuth credential directory. Private directories, the secret store and credential files now probe the mount once, keep the strict ownership check everywhere it can be expressed, and on a mount that cannot express ownership still enforce no-follow, single-link and atomic publication, with one warning naming what the mount reported. A filesystem without advisory locks serialises secret-store writes within the process instead of refusing; a held lock is still contention. Not observed here on a real HarmonyOS device. Thanks @gaord.
    - Notes stop swallowing a backslash: a transcript note is machine-generated and names paths, but it went through the markdown renderer, where CommonMark §2.4 reads a backslash before ASCII punctuation as an escape. A note naming C:\Users\asus\.codewhale\setup_state.json therefore printed as C:\Users\asus.codewhale\setup_state.json — a directory that does not exist, in the one line a user would copy to find the real one. Notes are now escaped where they are rendered. Fenced blocks, and lines carrying inline code or a table row, are passed through untouched, because the renderer already copies those verbatim and doubling a backslash inside one would print it doubled.
    - Setup state survives a second instance: two running Codewhale windows share one home, and both rewrite setup_state.json when the provider or model changes. The replacing rename is now retried briefly when the destination is held open for a read — Windows refuses it outright while that handle lives — instead of surfacing a write the caller could have made. The failure message also carries the underlying I/O error instead of only the outer context, so the next occurrence is diagnosable.
    - doctor stops flagging a user's own temp-named logs: the stale_setup_temp_files check matched any file whose name starts with .tmp, so scratch files such as .tmp-build-release.log made a clean home report as half-applied. It now matches the shape a staged write leaves when it never lands (.tmpXXXXXX, no extension).
    - Approval cards are translated in every locale (#7071): the "Do you want to proceed?" question, the Why and Stop explanations on destructive actions, the Approve, Edit plan and Cancel choices on workflow plans, the Save row, the details pager's title and the card's impact lines (one sentence per tool category plus the Reads, Writes, Target, Connected app, Agent type and Primary input rows) came from English literals, or from Simplified Chinese only. They now use the shared message catalogs, so all 15 packs carry them. The 14 non-English translations were written without native-speaker review. Still English outside Simplified Chinese: a workflow plan's own impact lines and detail labels, and the delegated-authority rows.
    - Local vLLM models keep their own reasoning ladder (#7124): a vLLM or SGLang route treated every model as low/medium/high and folded low and medium onto high. Reviewed model-template facts (crates/config/src/local_reasoning.json) now give Qwen3.8, Qwen3.6-35B-A3B, Ornith, GLM-5.3-Flash and DeepSeek-V4-Flash-Vision-Exp the controls their template accepts, and the effort picker offers exactly those tiers, so low stays low and medium stays medium where the model has them. Unreviewed models are unchanged. Not yet observed against a real vLLM or SGLang server. Thanks @gannp.
    - /undo, retry and fork-at-turn work on large and attachment-heavy conversations again (#7147): a fork was measured by the shape it is stored in (a saved session repeats its conversation while it carries a journal, so the file can be twice the history) against the 8 MiB bound the reader judges by what the conversation carries, so a conversation the runtime kept opening and extending could still refuse /undo with "full history exceeds byte transport bound". The saved-history boundary also counted MCP-server notices, shell-completion handoffs, the deferred-toolbox snapshot and <image> attachment tags as prompts you typed, so a conversation that had received one refused with "Cannot identify an exact saved-history boundary". Both now use what the conversation carries. Thanks @gaord.
    - Table cells retain code, bold text and clickable links when they wrap. Inline code that fits its cell keeps its indentation and any space-only content. Thanks @Lstarsky0. #7181 · #7184
    - Markdown shows what was written: a paragraph nested under a list item keeps its indent (#7146), ~~~ fences render as code blocks and keep backtick lines inside them as code (#7156), asterisks that do not open emphasis (5 * 60 * 60, *args) stay literal (#7157), a bare URL ends at full-width punctuation such as 。 and ） instead of swallowing it (#7158), a link whose target has its own parentheses (…/wiki/Rust_(programming_language)) keeps its closing ) (#7170), and inline code and links inside bold, italic or strikethrough render as code and links instead of their raw backticks and brackets (#7171). Thanks @Lstarsky0.
    - Fleet changes no longer put a stray English status in the footer (#7152): the engine's "Fleet roster refreshed for subsequent turns" arrived after the change's own receipt, stayed for seconds, took over the footer, pushed the Shift+Tab hint off the row and stayed English in every locale. /config stream_chunk_timeout_secs no longer leaves the engine's "Stream chunk timeout set to …" status in the footer after its own note either (#7169). Thanks @Lstarsky0.
    - Simplified Chinese uses one form per term (#7150): the pack addresses you as 你 throughout (the telemetry notice mixed 你 and 您), says 提供商 for provider and token for usage, and drops two stray spaces after full-width punctuation. Thanks @luochen211.
    - A turn can no longer wedge forever after a tool returns (#6184): the heartbeat's tool phase carried no bound, on the assumption that per-tool timeouts covered it. They cover a running tool, not the engine's own work after a result comes back, so that window had no owner: the in-app watchdog deferred to the engine because the engine still looked like the owner, and the engine watchdog only reported. A real turn sat there for 56 minutes, produced no stall record and never cancelled. The tool phase now has a ceiling, and a watchdog report cancels the turn so it ends with a stated reason instead of hanging.
    - A restored conversation can be undone again: a saved document keeps each turn's <turn_meta> envelope before the prompt while a thread rebuilt from its turn records keeps it after, and only the leading shape was stripped before comparing the two. Every record-side prompt was therefore longer than its transcript twin, so the exact-boundary search never matched and /undo on a resumed thread refused with "Cannot identify an exact saved-history boundary" instead of answering. Both shapes are now stripped, so the comparison sees the prompt text alone.
    - MCP servers that reject the modern probe now fall back to the legacy handshake: a server answering server/discover with HTTP 400 and a JSON-RPC error (for example -32600 Unsupported protocol version) was treated as a hard failure instead of evidence that it speaks the older handshake, so such a server could not connect at all. Codewhale now reads a parsed JSON-RPC error on the probe as a transport refusal and negotiates the legacy initialize handshake, which is what a server that clearly answered in JSON-RPC means. Reproduced against mcp.deepwiki.com (three tools after the fix); Linear is unaffected.
    - MCP servers reject requests that carried two framing headers: Codewhale sent every Streamable HTTP request with a duplicated Accept and Content-Type, because the extension host forwarded the SDK's headers and the Rust send path added them again. A server that validates those headers answered 415, which Codewhale read as "this endpoint is not Streamable HTTP" and answered by switching to the deprecated SSE transport; servers that refuse GET then returned 405 and the connection failed with only SSE error: Non-200 status code (405). Linear was unreachable this way. The send path now collapses the framing headers to one value each. Verified against Linear: discovery, tool listing (77 tools) and connection succeed.
    - One context window from planning to compaction (#7133): the window a route resolves (from provider facts, your configuration or a fallback) and where it came from now travel together. Turn planning, automatic compaction, tool-output sizing, output caps, child agents, the context inspector and the model picker all use the same window. Previously a custom model with no context metadata was sent with a 128K fallback while compaction planned against 1M. A model switch or re-sync that keeps the same model and limits keeps that window. On resume, /context shows the last Auto route’s saved window and its source. Each new turn resolves its own window from current settings and provider facts. After a model switch, the /preview-request body hash includes the compaction setting the new route will send. The /context report command identifies the Engine as the source of both its bundled constitution and the session relay template. The original Windows report has not been reproduced.
    - Session saves no longer fail silently (#7095): if the session store has stopped, a checkpoint or reset save now reports the failure in the status line instead of being dropped with only a log line.
    - Saves keep your recovery checkpoint (#7095): a finished turn is saved even when a newer in-progress checkpoint arrives at the same time, and a /clear or /new reset no longer drops its own snapshot when saves queue up. If the reset snapshot cannot be built or written, the previous recovery checkpoint is kept and the save failure is shown in the transcript and status line instead. Retrying an interrupted session deletion finishes it without removing the shared checkpoint an older Codewhale may still be writing. These fixes do not yet reproduce the original report.
    - Context inspector shows the real compaction trigger (#7133): /context uses the current route's effective threshold, including when it is zero. When automatic compaction is off, it says so, and the Work rail points to manual /compact.
    - doctor --probe-local changes nothing (#7115): when a configured route rules out local Ollama, the check skips credential inspection. Otherwise it reads credentials without migrating the legacy secret store; exec keeps its normal resolver.
    - Blockquotes keep their rail when wrapped (#7144): every wrapped row of a blockquote keeps the quote rail, and copying a selection still leaves the rail out. Thanks @Lstarsky0.
    - Localized activity and file receipts: grouped tool activity, file counts, patch outcomes and tool status use the shared 15-language catalog. Language changes refresh cached summaries; filenames, diffs and execution receipts keep their original data.
    - Automatic compaction stays off when disabled: preflight and provider context-overflow recovery preserve the conversation and report the setting instead of forcing a summary. Manual compaction remains available, and a rejected recovery request retains its actual cause in both paths. (#7142)
    - VS Code packaging security: use patched MSAL Node in the extension packager, addressing GHSA-xcx6-jx8p-x3h5.
    - Compaction preserves task state: a summary that is empty, a placeholder or only leaked reasoning tags (as local models sometimes return) no longer replaces your history. The recent tail is chosen by token budget on whole tool exchanges, the older span and any earlier checkpoint are summarized, and the original history is saved before the swap. Context budgeting learns from provider-reported usage within a turn and reports repeated rapid refills instead of looping. (#7133)
    - Vim Normal mode works on every terminal: with composer_vim_mode = "vim", Normal-mode keys no longer land in the draft as text on Windows terminals or on any terminal that does not report bracketed paste (everything except ghostty, iTerm, WezTerm and Apple Terminal, tmux and VS Code's terminal included). A held key now reaches Normal mode, shifted keys such as G move instead of typing, and k history recall repaints at once. Keys that arrive in one burst are still taken as a paste. (#7126, #7130) Thanks @Lstarsky0.
    - Remote-control start failures stay visible: a refused or failed /rc start now leaves the controller in the Failed state with its reason, logs a redacted line, and keeps /rc status in the footer after the toast expires instead of reporting "off". (#7127, #7120) Thanks @laozidabo.
    - /undo follows your language: what /undo reports (the request it undid, each file it restored, what it left in place) now comes from the locale catalog in all 15 complete packs instead of English text in the code; English output is unchanged. If a localized report cannot be built, the restore still syncs with the Engine and an English report is shown. (#7121, part of #7071) Thanks @Aboysky.
    - TSX files get TSX diagnostics: the language server now opens .tsx documents as typescriptreact, so valid JSX is no longer reported as a TypeScript syntax error. (#7140) Thanks @Ricardo-M-L.
    - Work stays with the session that was saved (#7118): saving, forking, renaming and rewinding a conversation now publish only the Work (To-do) state that belongs to the session just saved, and a newer update stays pending instead of being overwritten. A rewind that applied but could not be saved says so and puts the retry or replacement prompt where you can copy it. Tasks missing from /task list while the tracker shows them are not explained by this change.
    - Interrupted session hint stays visible (#7095): when a plain codewhale launch finds a session whose turn never finished, the "Run codewhale --continue to resume it" hint now appears in the TUI's status line instead of being printed to the terminal just before the TUI covered it.
    - Interrupted sessions are kept and listed (#7095): crash checkpoints are no longer deleted after 24 hours. The resume picker shows a session that exists only as a checkpoint, labelled Interrupted, --resume <id-prefix> finds it, and codewhale sessions lists it with an interrupted mark. A newer checkpoint is promoted into its saved session only under the session lease, and only for the same workspace. Retained checkpoints are not yet capped in number.
    - Resume an interrupted reply (#7095). Escape preserves the visible partial reply. On SIGINT, SIGTERM or SIGHUP the terminal has up to two seconds to save the active turn and flush pending writes. A second signal exits immediately. On Ubuntu, killing the process after its regular checkpoint preserved the visible text through that checkpoint. On resume, the transcript marks the partial reply interrupted, and /copy returns the last completed answer. Thanks @laozidabo for the signal handling in #7122.
    - Remote control works again: codewhale rc (/rc) can attach to the hosted control plane for web Chat again. The control plane had only accepted the retired 0.9.13 runtime identity, so every 0.10.x Engine was refused with runner_runtime_identity_unavailable; it now accepts the exact released runtime identity (commit, image and digest) and fails closed when they are not configured.
    - MCP compatibility fixes: older servers that answer the discovery probe with an error or an unrelated result now connect through the legacy handshake instead of being refused after the probe. A server that rejects sign-in reports its real 401 and the /mcp login hint rather than the probe's "method not found". A stale OAuth token is refreshed once when the probe itself is rejected. A server whose command cannot start now says why (for example, command not found) instead of a generic broker refusal.
    - Image-heavy session recovery: ordinary image reads use a 256 KiB delivery budget. Requests measure serialized bytes; over the local budget, older images are omitted from the outbound copy first, with receipts. An initial HTTP 413 is retried exactly once without image attachments, each replaced by an omission note. Saved images and executed tool actions remain intact.
    - Composer history honors CODEWHALE_HOME: with CODEWHALE_HOME set, prompt history reads and writes $CODEWHALE_HOME/composer_history.jsonl instead of sharing ~/.codewhale across isolated homes; an invalid CODEWHALE_HOME keeps no history rather than falling back to your real home. (#7069)
    - Slow tools are not reported missing: a tool whose --version probe is still running at its 3-second deadline (for example the cargo rustup shim on a busy machine) now counts as installed instead of being cached as missing for the rest of the session.
    - Telegram recovery: prompts and their initiating identity are durable before the polling cursor advances. Restart recovery reuses the original Engine operation, questions preserve human ownership, and uncertain final replies remain available through /status without an automatic resend.
    - Long drafts now show a localized external-editor hint when the actual composer viewport clips their text. The hint uses the shared F4 binding and preserves queue, running-turn, history, and menu hints (#7049). Thanks @Lstarsky0.
    - Archived context markdown now uses the active theme's palette when rendered in the transcript, preventing unreadable dark text on dark backgrounds (#7043). Thanks @Statter.
    - Plan-to-Work handoff now names the seeded To-do item in a localized reminder to keep it on the list and complete it after the plan (#7068).
    - Localized question footers, approval and plan-handoff chrome, tool waiting status, and /color receipts use the shared locale packs (#7071).
    - Clearing a conversation with no goal no longer shows a misleading "Goal cleared." receipt. Clearing an existing or configured goal still reports it (#7089). Thanks @Lstarsky0.
    - A fatal engine error no longer turns on offline queueing by itself. When the error came from a step that never starts a turn (a finished background shell, a goal continuation or a child completion that cannot resolve its route), every later message used to be queued behind it; it is now sent normally. An environment-only authentication failure still reopens provider setup and queues until you fix it (#6561).
    - codewhale --provider <name> resume <id> now moves the saved session to the named provider, as exec --resume already did, so a session whose provider table was deleted can be reopened on a provider you still have. It takes that provider's default model unless --model is also given. Without --provider the resume still refuses rather than fall back, and the refusal, now also on the codewhale resume and fork mount path, names this command beside codewhale sessions export <id> (#6996). Thanks @luestr.
    - The model's skills index now says when it shortens skill descriptions. When a description hits the 400-char row cap, or rows are cut to fit the context budget, the index ends with "descriptions shortened for N of M skills" and points to load_skill with name="list" for the full text; /context report and /context json show the same count on the skills entry. /skills inspect now flags a description by the same rule the index uses (#7073).
    - A shell command that spans several lines (a heredoc, a loop, an && chain split across lines) now shows those lines on its Live card while it runs and after it succeeds, within the card's usual line limit, instead of only the first line. Transcript shows the whole command. Single-line cards are unchanged (#6436, #7082).
    - codewhale review no longer accepts leaked tool-call markup as a review: a pass whose reply is a DeepSeek DSML (or other) tool-call wrapper outside code now fails as incomplete, with no tally and nothing posted (#7072). Reviews no longer have fixed per-risk output caps (a Low-risk review used to get 4,000 tokens, which a reasoning pass could spend entirely on thinking): every pass may use the route's own output limit, and the step, tool and money budgets still stop a review early as a named partial review rather than truncating it. The review tool bounds its reasoning level to leave room for the review, and an exhausted pass reports the allowance and reserve actually sent and says "cut off" when visible text came back (#7067).
    - A delegated agent still marked running that has reported no progress for 10 minutes no longer holds its parent turn open: the turn's stall watchdogs can recover again, and the stall record names the agent. A child's running time stays unlimited; only silence counts (#6184).
    - Code blocks inside reasoning cells now take their syntax colours from the active theme instead of the terminal's detected light or dark mode, so a dark theme such as Shoreline in a light-profile terminal no longer paints near-black code on its dark reasoning surface. The pager and clipboard copies still follow terminal detection (#7043).
    - /balance and the balance status chip work on the default DeepSeek route again. The balance request now goes to the DeepSeek API root instead of the /beta inference path, which failed with "Could not fetch DeepSeek account balance". A failed balance request now names its reason, such as HTTP 401 Unauthorized (#7055).
    - An AGENTS.md or global instruction file over 100 KiB is no longer skipped (which could let a sibling file load in its place): Codewhale loads its first 100 KiB, ends it with a marker giving the bytes omitted, and names the file in /context report. The shared 48 KiB instruction budget still applies after that, and the marker it leaves when it drops broader scopes now gives the bytes dropped and the total (#6526).
    - write over an existing file now says when it kept that file's CRLF or LF line endings, so the agent no longer reports a line-ending conversion that did not happen (#7070).
    - The To-do that a Plan-to-Work handoff seeds is now titled with the plan's first non-heading line outside code fences, without list or emphasis markdown, instead of the whole plan run together (#7068).
    - Right-click "Open in editor" on a transcript cell now also offers a bare workspace file path with no line number, opening it at line 1 (#2342).
    - Composer history is no longer rewritten from a partial read: when the history file cannot be read, new entries are not saved over it and a warning is logged. An empty declarative workflow is refused ("workflow must contain at least one node") instead of succeeding with no work (#6559).
    - A SKILL.md that is not a regular file is reported as a skill load warning instead of being read, so a FIFO in a skills directory can no longer stall discovery (#6554).
    - app-server: a turn whose response_start could not be written to stdio is now interrupted instead of running on with nothing able to stop it (#6558).
    - Session saves no longer fail with "Fleet artifact path must stay within the workspace" when the Codewhale state root is a symlink or Windows junction to another volume: the state root is resolved before session-side state is opened. Thanks @SparkofSpike. (#7097)
    - Dollar signs stay dollar signs: $5 a month, 10$ per year and PATH=$HOME/bin:$PATH no longer start inline math that swallows the text up to the next $.
    - Math with non-ASCII text no longer crashes the TUI: a reply with \text{如果} or Greek letters inside \begin{cases} or \begin{aligned} used to panic, and the saved reply panicked again on --continue. Escaped characters (\%, \{, \$) and delimiters such as \left\{ now render.
    - Markdown tables, rules, images and tabs: table columns size to their content instead of taking equal shares; <br> in a table cell breaks the line; - - - and * * * are rules, not bullets; images render as their alt text; and tabs in replies and sent messages expand, so Go and Makefile code keeps its indentation.
    - The read tool opens text that starts with "BM": a note beginning "BM25 is..." came back as "[Image omitted...]". A file is treated as a bitmap only when its header is valid.
    - The launch card keeps the folder you are in: on a narrow pane its path drops to the folder name before it clips, and /context keeps the end of the workspace path instead of its root.
    - A narrow rail keeps urgent notices: warnings and errors are cut to fit instead of vanishing when their first clause does not fit.
    - Truer status text: "Model set to" appears only when the model changes, so /effort high shows its own message; /status shows an unpriced session's cost as unknown instead of $0.0000; and /cache no longer prints Σ hit: 0 for routes that report no cache tokens.
    - Compaction never drops history to fit: when a complete summary cannot fit the context window, the pass fails and your history stays, instead of retrying with older messages silently left out.
    - /diff keeps its place on resize: resizing the terminal no longer jumps the pager and its search match back to an earlier line. (#7087)
    - First downloads for npx and uvx MCP servers: a stdio server started through npx, pnpx, bunx or uvx with no connect_timeout of its own now gets at least 120 seconds to connect, so a recommended server such as Playwright no longer fails its first /mcp add on a cold download.
    - The Linux extension host falls back to Node when Bun cannot run in the sandbox: a Bun that is a shim or script (asdf's, for example) now triggers the runtime = "auto" fallback instead of failing the start.
    - Shell jobs hold their worktree (Runtime API): removing a managed worktree while one of its tracked shell jobs runs is refused with 409 worktree_busy, and the folder stays until the job ends.
    - The installer reuses an identical download: codew is not downloaded again when its manifest digest matches codewhale's. (#7102)
    - The zsh missing-key hint reads as guidance: the first-run hint no longer looks like a shell error.
    - Website: recovered warm paper, clear-blue actions and original drawn water accents; added Computer Use and automatically refreshed terminal/plugin release links; shortened copy, clarified contribution paths and checked setup guidance against published versions.
    - Edit tool: when an edit only matches after quote, dash or full-width normalization, the rest of the touched line keeps its original characters instead of being rewritten (：１００（） no longer becomes :100()), and two adjacent fuzzy edits no longer overlap (#7257). Thanks @Lstarsky0.
    - File mentions: an @ mention typed straight after Chinese or Japanese text, such as 请看@src/main.rs, now attaches the file, completes with Tab and shows its chip, and full-width closing punctuation after a mention is no longer read as part of the file name; mentioning two line ranges of one file attaches both instead of dropping the second (#7258, #7259). Thanks @Lstarsky0.
    - Footer context meter: after /load, resume, /branch or a fork, the context percentage shows the restored conversation instead of the size of the one you left (#7256). Thanks @Lstarsky0.
    - Custom commands: a custom slash command now runs when its arguments follow a full-width space or start on a new line, instead of being reported as unknown (#7260). Thanks @Lstarsky0.
    - /config: the detail pane lines its values up in one column in every language, including locales with long or full-width labels such as Ukrainian and Chinese (#7267). Thanks @Lstarsky0.
    - Recovery safeguards: workflows reject results that cannot yet exist, implicit session storage refuses an unresolved home, and future-dated provider catalogs cannot stay fresh indefinitely.
    - A provider timeout no longer reads "after 0ns": a timed-out request used to report Request timed out after 0ns, which looked like a zero-length budget and hid the real failure. The retry loops now measure the elapsed time per attempt, and where it is unknown the message says so instead of printing a made-up duration (#7253). Thanks @gaord.
    - A failed send keeps what you typed since: when a message fails to send after you have started a new draft, the failed message is stashed rather than written over the draft, so it stays recoverable (#7255). Thanks @Lstarsky0.
    - Windows: plugins enable again on a finalized runtime root. The sandboxed plugin host adds its own AppContainer read and execute grant to the finalized plugin root, and Windows stored the root's inheriting read/execute entry as more than one entry; both made enabling refuse. The root now carries one non-inheriting entry, the verifier still requires a protected owner-only DACL with nothing above read and execute, and the refusal names the underlying check. Fleet ledger compaction is no longer blocked by a live appender, and a blocked checkpoint inspection is reported as such instead of clearing save health. The Windows suite has not been shown green for this change, so this is not a Windows qualification.
    - ACP tool cards settle when an external agent finishes them: a tool call reported by an external agent over ACP no longer stays pinned as pending after it completes — the completion update now matches the external agent's own tool call id, so the card closes with its status and result.
    - ACP sessions no longer run shell_env hooks: shell calls inside an ACP-driven session no longer launch operator-configured shell_env hook processes, matching the documented rule that the ACP surface fires no hooks. Terminal, desktop, and runtime API sessions still run them.
    - Mobile reconnects no longer invalidate each other's stream tickets: refreshing a mobile stream ticket no longer replaces a ticket another in-flight reconnect still holds — a mobile session keeps up to 32 pending tickets like the web client instead of a single slot, so rapid reconnects stop flickering between connected and expired.
    - LSP HTTP responses declare their position base: /v1/diagnostics, /v1/definition, /v1/references and /v1/symbols responses now carry position_base (1 for the normalized diagnostics items, 0 for the raw LSP ranges in the semantic operations) so a client no longer has to guess that 1-based inputs come back as 0-based positions.
    - Auto-Review no longer holds the read-only deferred tools for explicit review: load_skill, tool_search, handle_read and retrieve_tool_result were missing from the tool-category table, so Auto-Review treated them as unclassified and routed every call to the reviewer — in Web sessions that blocked read-only skill loads and deferred-tool discovery and retrieval. They now classify as read-only and run without a prompt. (#7372)
    - Parallel tool calls without ids no longer fail the turn on a non-streaming reply: when a provider, or a gateway in front of it, answered a non-streaming chat/completions request with several tool calls that carried no id, every call was given the same placeholder id and the whole response was then rejected for a duplicate pairing, failing the turn. Each call now gets its own fallback id, matching streaming replies.
    - Plugin conversion names the pnpm dependency limitation instead of dropping it: importing a source that links node_modules dependencies to directories (the pnpm layout) now refuses with a named explanation instead of silently omitting the linked packages from the converted bundle. Links to files inside node_modules (.bin shims) are still skipped harmlessly.
    - External-agent tool receipts keep the reported line number: a location an external agent attaches to a tool call is recorded as { path, line } (line is optional, 1-based as ACP declares) instead of only the path, so a client can jump to the touched line.
    Security
    - tool_launcher in a user config is refused by every command: codewhale model resolve, codewhale config, the other CLI subcommands and the desktop's config and secrets calls now stop with the same error the Engine gives when config.toml sets tool_launcher at the top level or in a profile, instead of loading the file and exiting 0. The key is still read only from the managed configuration. (CW-8021)
    - Provider keys next to CJK text: secret redaction now masks a provider key written beside Chinese text or full-width punctuation, and no longer masks the Chinese text after it. Thanks @luochen211 (#7318).
    - Deny rules and rebound command words: a command deny rule now also holds against a command word rebound with hash, alias values expanded in later code, a leading =cmd word, and operands run through parallel, chpst and screen. Thanks @luochen211 (#7321).
    - Deny rules and launcher programs: Command deny rules now also match commands run through additional launcher programs, shell dialects, -- separators, and launcher subcommands, while the configuration docs clarify that deny rules match command lines rather than interpreters or remote/container execution and that the sandbox is the real containment control.
    - Remote pairing HTTP sessions (CW-8093): block paired devices from overriding turn posture, model, or tool surface and close open thread SSE streams immediately with non-retryable stream.end on revocation, archive/delete, plugin withdrawal, or expiry.
    - Plugin install symlink and reparse guard (Windows): Plugin install on Windows refuses a source folder that contains a junction or another reparse point, as it already refused symbolic links.
    - Tool deny rules across scheduled work: tasks, automations, delayed messages and the threads that run them now keep the tool deny rules of the session that created them; older versions refuse such records instead of running them without those rules.
    - Project MCP approvals: Project .codewhale/mcp.json servers now load only after you approve the file's exact contents with /mcp review and /mcp approve <digest>, as project hooks do. A changed file loads none of its servers until it is approved again, and existing project files must be approved once after upgrading.
    - Extension service approvals: plugin service acts use the session permission gate and retain their approved or refused act records when a tool call fails. Closing a call seals its broker-act record so a late approval cannot authorize an unrecorded act. Ordinary nested-call receipts may still show an in-flight outcome when cancellation ends the call early.
    - Extension workspace confinement: plugin workspace file reads, listings, and overlay writes now verify pinned ancestors and non-linked targets at the point of use without letting session trust flags escape the workspace, reject Windows alternate data streams and 8.3 short-name aliases for protected metadata directories, and check caller deny rules for git review queries before requesting approval. (CW-8056)
    - Delayed-message workspaces and shell stdin approvals: send_later schedule now keeps its workspace inside the session's reachable paths instead of accepting an arbitrary directory, and send_later approval prompts show the requested workspace; session shell grants now match exact inputs when stdin (stdin, input, data) is supplied instead of reusing a command-only grant across different stdin.
    - Sub-agent approvals and worktree isolation: a child sub-agent's built-in verification calls now ask the same approval as the main session, a read-only agent started with workspace_policy: "worktree" shows the approval card, and a sub-agent worktree is refused when its root or nested adoption path passes through a symlink.
    - OCR image signature check: image_ocr and the OCR branch of read_file now refuse files without a PNG, JPEG, TIFF, BMP, GIF, or WebP signature before any OCR backend runs, and run tesseract in an empty temporary working directory.
    - Release download transport checks: self-update, npm postinstall, and install.sh downloads now enforce HTTPS (with TLS 1.2+ in install.sh), restrict redirects and download URLs to trusted release hosts or explicitly configured CODEWHALE_RELEASE_BASE_URL / CODEWHALE_UPDATE_ALLOWED_HOSTS hosts, and redact URL credentials from download errors and logs.
    - Repository-isolated git calls: project init, Fleet profile drafting, sub-agent worktree setup and delivery checkpoints (no longer commit-signed), repository-origin lookups, and Runtime worktree provisioning now use Git::workspace_command with repository hooks, fsmonitor, and filter drivers neutralized while keeping user global filters working, and Git::status_command delegates to Git::workspace_command.
    - Website maintainer and cron secrets: the manual cron trigger is rate limited, admin sign-in and the cron secret require a 32 to 512 character secret with at least 8 distinct characters that is not a repeated pattern, and changing the maintainer token signs out existing admin sessions.
    - Skill and plugin installs: skill and plugin installs now enforce the uncompressed size cap on the whole decompressed archive, and reject archive entries with names longer than 4096 bytes.
    - Built-in execution rules: a Bash deny rule now also blocks built-in test and verifier runs (Run / run_tests / run_verifiers), workflow runs with verify: true, and delayed-message scheduling (send_later schedule) while keeping task reads, status checks, management actions, and the bounded verifier's own default verification runs working.
    - Plugin service hardening (terminals, remote pairing, network): plugin background terminal sessions enforce the per-plugin cap inside the shared session registry after approval waits and close when the plugin owner is revoked or disabled (CW-8051); plugin remote pairing and status serve reviewed plugins only, refuse child-agent and stale requests, validate pairing labels and one-time loopback redemption through host secrets, and keep remote in the refused Cordis service and inspect catalogs (CW-8000); plugin network credentials are bound to a single https origin per plugin build in a private credential file, check live session posture and destination guards before egress, serialize first-send confirmation per site through plugin_network_send, and scrub returned URLs, headers and bodies before returning to plugins (CW-7979).
    - Network guard and portable config bundles: /network allow now admits a local or private address only for fetch_url, web.run, and config import when the host is a localhost name (resolving to loopback only) or a local/private IP literal you typed and explicitly allowed (with IPv6 deny rules matching across bracketed and uncompressed spellings and wildcard rules never matching IP literals); domain names resolving to private addresses, skill and plugin installs, extension-host requests, and all cloud metadata forms (including 64:ff9b:1::/48 and ::ffff:0:0:0/96 embedded addresses) plus 0.0.0.0/8 stay refused on every hop. codewhale config import <url> now validates every redirect hop and refuses cross-host redirects to visibly local hosts, and portable config bundles reject on import and omit on export visibly local network.allow entries (including localhost names, local-domain wildcards such as .localdomain and *.localhost, and local IP literals).
    - Git status reads: codewhale review, the git tool (status action), @git mentions, the file picker, the GitHub close check, and Runtime API status routes now share Git::status_command with repository-scoped filter neutralization and --ignore-submodules=dirty (global filters such as Git LFS keep working, while dirty submodule contents no longer show in status reads and submodules hidden with ignore = all show when their commit changes).
    - Python REPL & RLM sandbox: the Python kernels behind rlm and inline repl fences now start through the same sandboxed launcher as code_execution, so the session's sandbox policy, network setting and external sandbox backend apply to them, and the kernel bootstrap moves empty/current-directory sys.path entries behind the standard library. A kernel receives its input over stdin instead of a temp file, runs in the workspace, and is dropped whenever the sandbox policy changes (an rlm context opened under another policy must be opened again); rlm status no longer reports context_path.
    - Chat bridges thread ownership: Chat bridges now list and resume only the threads the chat itself created: /threads shows owned threads, /resume refuses any other thread id with one fixed message, and /new always starts a new thread. In an existing thread map each chat keeps only the thread it is bound to, so threads it created earlier and left are no longer listed or resumable; a thread that several chats already pointed at is usable from none of them (send /new). Review thread-map.json after upgrading.
    - Document conversion, speech output, and workspace Fleet rosters: pandoc_convert and speech now replace their output path atomically instead of writing through a symbolic link; pandoc_convert rejects unknown input fields, and its write-scope checks follow output_path; and repository Fleet and Reasoning Router files (including --fleet on the CLI) that are symbolic links are refused as I/O errors rather than being followed or treated as absent.
    - Pet companion owner token compared in constant time: the local companion server's Bearer and cookie checks no longer use plain byte equality, so response timing cannot reveal how much of a guessed token matched. The surface was already loopback-only with Host and Origin pinning and a private owner-checked directory.
    - MCP client advisory (RUSTSEC-2026-0462): the MCP library moves to rmcp 3.9.0, closing unbounded response-body buffering in its Streamable HTTP clients that a hostile or broken MCP server could use to exhaust memory.
    - Saved tool-result reads refuse links in the selected session, including a linked session directory, while preserving deliberately relocated application storage. Owned files and digest-checked legacy results keep their existing access paths.
    - Pinned marketplace archives: a Codewhale or Claude marketplace entry whose tarball source carries a sha256 now installs only when the downloaded bytes match it; a mismatch, a malformed pin or a pin on a non-archive source refuses the install with nothing written. The pin also applies to direct installs as https://…/x.tar.gz#sha256=<hex>.
    - Sandboxed commands cannot plant git hooks or edit git config: in workspace-write mode, .git/hooks and .git/config (and a linked worktree's shared hooks and config) are read-only to sandboxed commands, so a command cannot leave a hook or core.hooksPath that later runs outside the sandbox. The workspace's .codewhale/ is protected even before it exists (on Linux it is created first, because bubblewrap can only protect existing paths). git commit and ordinary file writes are unaffected; git config writes and hook edits need an approved unsandboxed command.
    - Tool image validation: an image returned by a tool must decode before it is sent, so truncated or corrupt files are omitted with a receipt even when they are already within the delivery budget.
    - Terminal graphics advisory (RUSTSEC-2026-0430): the terminal emulator library moves to rio-vt 0.5.29, closing a path traversal in its Kitty graphics handler that could read or delete files outside the intended directory.
    - Workspace status no longer runs repository filter drivers: GET /v1/workspace/status and the Git status detail neutralize clean and process filters a repository defines, so opening a cloned repository cannot run its code. A failing filter used to make the route report a clean tree; it no longer does.
    - Bridge and extension dependency advisories: the Feishu and WeCom bridges move to follow-redirects 1.16.2 (high severity), and the VS Code extension build no longer pulls a vulnerable minimatch.
    - Approval answers must match their request (Runtime API): an approval, user-input or tool answer that names a different thread, turn or call is refused with 403 instead of being delivered. Callers that send no binding, such as the existing HTTP route, behave as before.
    - Bounded release discovery: codewhale update reads at most 8 MiB of release metadata and 4 KiB of error text, strips control characters from remote errors and no longer echoes malformed input.
    - heapless unsound advisories (RUSTSEC-2026-0574 through 0582): nine advisories flag heapless 0.8.0 collection APIs. The crate remains in the graph only as a non-optional dependency edge of faster-hex 0.10.1 (via gix-hash, gix), whose alloc feature — enabled by gix-hash — compiles out its sole heapless use, so none of the flagged APIs is reachable. No patched release exists in a compatible range, so cargo deny records the deferral with a February 15, 2027 review date; docs/dependency-maintenance.md carries the assessment.
    Known limits
    - Terminal.app alternate-screen view can detach from scrollback: if the Terminal.app view stops following the live conversation after scrolling, scroll down to the bottom or type a character to re-attach it. Other terminals are not affected.
    - macOS Terminal.app window scroll bar: Terminal.app keeps your normal shell scrollback above the alternate screen, so dragging Terminal.app's own scroll bar up can scroll the window above Codewhale's TUI. Scrolling Terminal.app back to the bottom or typing in the window re-attaches it.
    - Codex App Server v2 remains paused: the typed Tier A and B method inventory stays in codewhale-protocol, while dispatch, subscriptions and WebSocket transport remain out of 0.10.3. The HTTP/SSE Runtime API remains the supported client contract and the legacy JSON-RPC dialect is not retired in this release.
    - Terminal session lifetime across Engine restarts: deleting a conversation ends its terminal shells and background jobs, and shells survive quitting or updating client apps, while restarting the Engine process loses live PTYs (reported as a new terminal instance) and scrollback beyond the 512 KiB ring.
    - External ACP agent capabilities: sessions on installed agent CLIs keep the agent's own login and support prompts, permissions, cancellation and restart recovery; steering, compaction, forking and image input are not available in external-agent sessions.
    - DSH client UI and plugin state downgrade: reviewed DSH plugins run unmodified against DSH 0.2.2-rc.1 (Cordis 4.1.0) with grant-gated host services, while dsh.client UI rendering remains gated until client bootstrap support lands. Once plugins are reviewed or enabled in 0.10.3, older 0.10.2 binaries cannot read the upgraded plugin state file and turn plugins off (#7091, #6992, #6970, #7203).
    - Rollback floor and deferred investigations: codewhale update --rollback refuses recorded targets below 0.10.3 once running 0.10.3 or newer; manual or package-manager downgrades remain outside that guard. The original Deepin 25.2.2 whole-history disappearance (#7095) and hours-long silent stalls beyond the turn and tool-phase watchdogs (#6184) move to 0.10.4.
    - ChatGPT sign-in on Windows: sign-in no longer depends on the device clock and reports clearer verification errors, but the reported 0.10.2 failure after browser sign-in has not been confirmed fixed in the reporter's environment. (#7203)
    - Permission dial: a manual pass through every stop of the Shift+Tab dial on a real terminal and on each client that reads the posture has not been recorded.
    Maintenance
    - Native release bundles, the Windows installer, npm packages and published crates include the Codewhale license and both third-party notice documents.
    - The Simplified Chinese telemetry guide now explains which files each process keeps, how much disk space they use and when old files are removed. (CW-7987)
    - Windows release harness: the terminal-clipboard check strips Windows PowerShell's UTF-8 BOM before parsing cleanup receipts and still runs the bounded private-path cleanup fallback after its controller has exited; the vendored terminal kit lock follows Protocol 0.10.3.
    - Windows release import floor: the 10 ARM64 import pairs that the native export probe resolved on Windows 11 ARM64 are qualified, and 12 x64 pairs are recorded as documented API contracts until a native x64 export probe exists. The Windows 10 build 14393 floor, the guard and the x86 profile are unchanged; the next frozen candidate's import job is the real check.
    - MCP regression fixtures retain private extension-host roots and wait for their own workers to finish, preventing parallel checks from borrowing a deleted fixture home. Production connection and credential policy is unchanged.
    - Independent terminal kit candidate 0.2.0: its workflow totals use u64, and its existing avatar API reexports the shared Protocol contract. All local consumers pin 0.2.0. Protocol 0.10.3 must be published and verified before the kit, followed by the dependent Engine packages; each publication retains its separate approval.
    - codewhale-plugins crate: plugin discovery, review, install and marketplace parsing move out of codewhale-tui into a new crate; MCP server config types move to codewhale-mcp, and the skill parse core and recommendations to codewhale-skill-install. Review and trust behavior is unchanged. (S19, #5316)
    - codewhale-config modules (internal): the 8,100-line lib.rs is split into 23 modules (provider TOML, permissions, fleet, config resolution, env overrides, state dirs, config store and backup, and others); codewhale_config:: paths are unchanged. No behavior change. (S57, #5316)
    - codewhale-app-server modules (internal): lib.rs is carved into http, stdio, turns, bridge and config_rpc modules; BoundedLines and runtime_compatibility_router now live at codewhale_app_server::stdio and ::http. No behavior change. (S49, #5316)
    - codewhale-account-cli crate (internal): the cloud account, cloud computer and dispatch CLI commands move out of codewhale-cli into a new crate. No behavior change. (S50, #5316)
    - runtime_threads store and manager (internal): runtime_threads is split into the durable store (runtime_threads.rs) and the thread manager (runtime_threads/manager.rs); callers import from runtime_threads::manager. No behavior change. (S35, #5316)
    - Crate split S24a (internal): the workshop byte-budget slot moves to codewhale-runtime, AutoRouteDecisionEvidence to codewhale-models, and cost-status session persistence to a tui usage_persistence module, so billing no longer reaches the session manager or model routing. No behavior change. (#5316)
    - Provider pre-cuts B (internal): client wire helpers, reasoning-effort mapping and the Ollama catalog parsers move into their own client modules, and test-only provider gates use the shared test-isolation predicate. No behavior change. (#5316)
    - codewhale-dependencies, codewhale-snapshot, codewhale-lsp, codewhale-repl crates: external-tool resolution, workspace snapshots, the language-server client and the Python REPL runtime moved out of codewhale-tui into their own crates; write_context_file now lives in codewhale-repl. No behavior change. (#5316)
    - codewhale-skill-install crate: the community-skill installer, package content digest and SKILL.md frontmatter reader move out of codewhale-tui into a new crate; the install SSRF guard and timeouts are unchanged in production builds. (#5316)
    - codewhale-util crate: shared utilities, confined workspace file access, link and file-identity checks, bundle file readers, the .git name rule and the owner file lock move out of codewhale-tui into a new crate; no behavior change. (#5316)
    - Crate-split contract hygiene: the canonical_action policy table now lives in codewhale-execpolicy, required_action, the file path-alias folding and the apply_patch preflight parser in codewhale-tools, and DEFAULT_SPAWN_DEPTH, PermissionCeiling and ShellCeiling in codewhale_protocol::fleet, so codewhale-agent-contract no longer depends on codewhale-config or codewhale-workflow. Approval and authority behavior is unchanged. (#5316)
    - Provider pre-cuts (internal): schema sanitizing, prompt-turn classification, image-window capping, tool-projection warning names and the reasoning-effort tier moved into codewhale-models; stall records and route-label sanitizing moved into codewhale-runtime. No behavior change. (#5316)
    - Linux hardening tests: the NoNewPrivs child matrices now respect a parent that already holds the irreversible flag, keeping the full assertions on unpinned hosts and checking the kernel ratchet on pinned hosts. Thanks @asto18089 for diagnosing the hardened-container failure. (#7021)
    - Removed the internal config re-export facade and its model-constant wrapper; provider types, shared constants, credential helpers, and notification types now come directly from their shared owners. Configuration and saved settings keep their existing behavior.
    - Removed superseded home-directory and Fleet-role re-export shims, unused tool-context sandbox/MCP fields, and the redundant core tool-parser facade. Consumers now call their existing owners directly; tool denial rules, approval posture, strict tool schemas, home resolution, and legacy saved-role migration retain their behavior. The cleanup removes three dead-code suppressions and keeps the engine as the sole owner of human approval attestations.
    - Removed unused plan/journal accessors, an unused plan-status glyph helper, and a cancellation case that no execution path issued. Active mailbox and cancellation wiring stays in place; its stale unused-code suppressions are removed. No supported command or feature is retired by this cleanup.
    - README translations carry refreshed source stamps after the 0.10.3 batch. Thanks @Aboysky. (#7104)
