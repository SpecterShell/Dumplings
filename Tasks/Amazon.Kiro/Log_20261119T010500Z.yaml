- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    GitLab Installs, Permission Request Hooks, and Organization Sign-In for MCP
    This release lets you install powers and skills from GitLab, answer permission prompts with a script, and sign in once to your organization's MCP servers. It also lets you move chats between the Side Bar and Editor Area and choose Memory settings from the Memories view.
    Install powers and skills from GitLab
    Paste a public GitLab URL to install a custom power or import a skill, the same way you do from GitHub. To use a self-hosted GitLab instance, add its host to the kiroAgent.powers.trustedGitLabHosts setting first. Learn more ->
    Answer permission prompts with a script
    Create a Permission Request Hook in the Hook editor to run a command just before Kiro would ask you to approve a tool call, so a script can answer routine prompts in a session nobody is watching. Pre Tool Use Hooks can also replace a tool call's input before it runs, and any approval prompt shows the final arguments. Learn more ->
    Sign in once to your organization's MCP servers
    Eligible HTTP MCP servers can share one sign-in through your organization's identity provider, instead of asking you to sign in to each server. Add the identity provider your administrator gives you to your user MCP configuration, then select Sign in on the Organization sign-in row in the MCP Servers view. Learn more ->
    Improvements

    Fixes
