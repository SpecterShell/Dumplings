  Value: |-
    Windows System-Wide Installer, Drag Files Into Chat Without Shift, Framed Mermaid Diagrams
    This release adds Windows system-wide installers for x64 and ARM64 devices. It also brings drag-and-drop file attachments to chat without holding Shift, and framed Mermaid diagrams that stay readable on dark themes. It fixes slash commands that did not run when you typed right after them, and hook toggles that failed without an error.
    Improvements

    Fixes
