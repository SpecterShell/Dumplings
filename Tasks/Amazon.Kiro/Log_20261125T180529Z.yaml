- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Remote SSH, Dev Containers, and Cloud Sessions in the IDE
    This release lets you work in a remote environment from Kiro IDE. Connect to your own Linux machine over SSH, open a project in its Dev Container, or open a cloud session in its own Kiro window.
    Connect to a Linux machine over SSH

    Video transcript
    The video shows a local Kiro IDE window. The user adds an SSH host, then opens Connect to Host, which lists the configured host my-remote, Enter SSH Destination…, and Add New SSH Host…. After the user selects my-remote, a new Kiro window opens on the host, shows its files, and opens index.ts in the editor.
    Connect a Kiro window to your own Linux machine with Connect to Host. The editor stays on your computer, while files, terminals, and the agent run on the remote machine, so the agent can keep working after you disconnect. Learn more ->
    Work inside a Dev Container

    Video transcript
    The video shows a Kiro IDE window with a project that has a .devcontainer folder. The user opens the remote menu and selects Reopen in Container. A notice reads "Opening Dev Container: Starting the Kiro server." Kiro then opens a window titled Dev Container: Todo API, where a terminal runs npm start and chat is ready in the side panel.
    Use the tools and dependencies a repository defines without installing them on your computer. Reopen in Container builds the repository's dev container with Docker and opens your project inside it, on your computer or on an SSH host. Learn more ->
    Open a cloud session in the IDE

    Video transcript
    The video shows the Sessions view listing a cloud session named Hello Remote. The user opens it in the IDE, and a new Kiro window opens on the cloud session's files, under Projects [Kiro Cloud], with index.ts open in the editor and chat in the side panel.
    Review and continue a cloud session's work without copying the repository to your computer. Open in IDE opens an editor on the cloud session in a new Kiro window, with chat attached to the agent already running there. Learn more ->
