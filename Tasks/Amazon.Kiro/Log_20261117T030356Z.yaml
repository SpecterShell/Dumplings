- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Follow Workflow Runs, Skills After Compaction, and Readable Diagrams
    This release lets you follow a workflow run step by step from its Workflow tab. After Kiro compacts a conversation, the agent now reloads the skills and steering files you asked for. Large Mermaid diagrams in chat also stay readable. Fixes cover freezes after a permissions change, stalls before large file writes begin, and missed reloads after you edit configuration on a Windows network drive.
    Improvements

    Fixes
