  Value: |-
    Approve for Me and Chat Permission Modes
    This release adds Approve for me to chat: Kiro approves routine actions for you, blocks risky ones, and asks when unsure. Where it is available, the Autopilot toggle becomes a permission mode menu with Supervised, Accept file changes, and Approve for me. It also brings organization-managed settings, Memory view sorting and filtering, and workflow run improvements, plus fixes for stopped turns, spec tasks, and workspace trust.
    Let Kiro approve routine actions for you
    In a chat where Approve for me is available, the Autopilot toggle becomes a permission mode menu: Supervised, Accept file changes (formerly Autopilot), and Approve for me. Your deny, ask, and allow rules decide first. For an action no rule covers, a model approves one it judges safe, blocks one it judges unsafe, and asks you when unsure. For every new chat, turn on Use Approve for me by default in What's new, or run Kiro: Enable Approve For Me (User) from the Command Palette. Learn more ->
    Improvements

    Fixes
