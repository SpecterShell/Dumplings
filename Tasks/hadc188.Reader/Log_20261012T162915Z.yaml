  Key: ReleaseNotes
  Value: |-
    新增
    书源管理：多选批量操作
    多选书源后，在「删除选中」旁边添加「更多」菜单：
    - 启用 / 停用选中
    - 添加到分组 / 从分组移除
    - 启用 / 停用发现
    - 置顶所选 / 沉底所选
    - 导出所选
    - 测试所选
    悬停呼出工具栏开关
    - 新增开关（默认关闭），位于设置「更多」页。关闭后边缘不再自动弹出，仍可「点击正文中部」呼出工具栏。
    优化
    - 导入本地书速度：上传走 IPC 二进制通道。涉及本地书导入、封面、字体、RSS、书源与 WebDAV 上传。
    修复
    - 左右分页往前翻，跨章停在上一章标题页（#7）
    - 书籍同时出现在多个分组（#9）
    - 分组选择框支持移出分组
    其它
    - 版本号 1.5.3 → 1.5.4。

    完整变更：https://github.com/hadc188/reader/compare/v1.5.3...v1.5.4
