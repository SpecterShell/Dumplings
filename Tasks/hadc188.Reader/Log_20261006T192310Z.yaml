  Key: ReleaseNotes
  Value: |-
    新增
    - 阅读页自定义配色：阅读页可单独设置背景色与文字颜色，不再与桌面背景图绑定（#5-2）。另可上传阅读页专属背景图并调节透明度；「应用到阅读页」开关只影响阅读页，关掉后桌面背景图仍正常显示。
    - 快捷键可自定义：改为「功能优先」列表 —— 左侧是功能，一个功能可绑定多个按键。点「＋ 录入按键」后直接按键盘即可绑定。
    - 书籍信息编辑入口：书架右键菜单新增「编辑信息」，可修改封面、书名、作者、简介（#5-4）。并新增「还原」：可撤销已保存的改动、回到最初的样子（首次自定义之前的书名/作者/简介与书源封面会被记录）。
    - 分组批量删除：分组管理支持多选 / 全选 / 批量删除。
    优化
    - 翻页动画与滚动速度现在真正生效（#5-1.1）：原先容器使用浏览器原生平滑滚动，会覆盖时长/速度设置。
    - 连续阅读改为按行高取整计算翻页步长，不再残留上一页内容（#5-1.2）。
    - 暗色主题下选中态底色改为中性提亮，不再出现浑浊的褐灰色。
    - 阅读页自定义配色现在会同时作用于标题栏与工具栏，呼出工具栏时与其拼成连续一条。
    修复
    - 备份恢复不再残留旧数据：原先清理步骤会吞掉读取异常，导致清理被整块跳过，而写入侧是合并语义 —— 旧的分组/书签/替换规则会与新数据混在一起且无任何提示。现改为显式报错中断。
    - 备份恢复不再复活已删分组：分组改为整表覆盖写入，并改用批量删除命令（逐个并发删除时读改写会交错，被删的分组会重现）。
    - 「移入分组」对单本生效：右键菜单那条路径下选中集必然为空，却走了批量接口，于是什么都不做还提示「成功将 0 本书移至新分组」。
    - 左右分页模式下「页面宽度」设置失效。
    - 左右分页模式下首页 / 尾页快捷键失效。
    - 用快捷键打开的目录 / 设置面板，无法用同一个按键再关掉。
    - 关闭「应用到阅读页」后桌面背景图一并消失。
    - 书源 JSON 编辑器在亮色主题下选中内容不可读。
    其它
    - 版本号 1.5.1 → 1.5.2。
    - 沿用 Legado 手机端备份格式，负数保留分组 id（如本地分组）现在会原样保留，不再被改写。

    完整变更：https://github.com/hadc188/reader/compare/v1.5.1...v1.5.2
