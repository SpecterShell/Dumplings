  Key: ReleaseNotes
  Value: |-
    本次更新
    - 新增网络代理设置，默认跟随系统代理，也可手动填写 HTTP/HTTPS（网页代理协议）地址；保存后立即生效。
    - 代理支持书源搜索、书籍详情、章节内容、封面、远程导入、RSS（订阅源）及未单独配置代理的语音请求。
    - 修复已关闭或删除的书源仍参与搜索、显示在详情页和换源列表的问题。
    - 优化书源状态刷新，启用、关闭或删除书源后，搜索结果和书籍详情会同步更新。
    - 清理旧的可用书源缓存，避免继续显示已经关闭或删除的来源。
    使用说明
    在设置的“网络代理”中选择“跟随系统”即可自动使用本机代理；本机未启用系统代理时会自动直接连接。也可以切换为“手动代理”，填写例如 http://127.0.0.1:7890（本机代理地址）。
    完整改动：https://github.com/hadc188/reader/compare/v1.3.2...v1.3.3
