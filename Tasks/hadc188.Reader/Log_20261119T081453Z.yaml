  Key: ReleaseNotes
  Value: |-
    新增
    缓存管理
    - 重构缓存管理页，按书源独立展示每个来源的已缓存章节数与缓存状态（#47）。
    - 书籍移出书架后自动清理对应缓存，删除书源时同步清理该源的缓存数据。
    - 清空本地缓存不再删除书籍封面缓存。
    书源与分组
    - 书源列表支持右键删除书源。
    - 支持书架分组拖动排序（#47）。
    优化
    搜索与备份
    - 优化搜索结果分页与分类翻页的终止判断，减少无效请求（#45）。
    - 优化 WebDAV 备份列表解析（#44）。
    修复
    封面缓存
    - 修复书架封面签名过期后无法自动恢复的问题，封面链接失效时可自愈重取。
    - 修复清空本地缓存后封面被误删且不再重新下载的问题。
    阅读体验
    - 修复左右分页模式下自动翻页跳过整章的问题（#49）。
    - 修复书籍删除后重新加入书架，目录中已读标签未清除的问题。
    其它
    - 版本号 1.6.6 → 1.6.7。
    ———
