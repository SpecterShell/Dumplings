  Key: ReleaseNotes
  Value: |-
    新增
    阅读与窗口
    - 阅读页支持文字、面板、背景透明度独立调节，背景透明度最低可设为 0%（#41 #42 #43）。
    - 新增“隐藏标题栏”开关及自定义快捷键。
    - Windows 新增“无边框模式”开关及自定义快捷键，用于切换原生窗口阴影。
    RSS
    - 重构 RSS 源管理页布局，优化源列表与编辑区域的使用体验。
    优化
    性能
    - 优化 WebView2 与阅读资源内存占用，降低长时间阅读的内存压力。
    阅读体验
    - 禁用阅读器双击选词，避免阅读时误触发选词（#39）。
    修复
    窗口与透明度
    - 修复阅读页窗口透明度不生效，以及调节窗口不透明度时文字透明度被联动的问题（#41 #42 #43）。
    - 修复隐藏标题栏后顶部残留空白、阅读页标题栏背景不一致的问题。
    - 修复阅读页按 Alt / F10 后系统菜单抢占焦点，导致无法继续滚动或翻页的问题。
    - 修复窗口不透明度在老板键恢复、迷你模式切换后失效的问题。
    WebDAV 与 EPUB
    - 修复 WebDAV 兼容备份恢复时非空字段报错的问题。
    - 修复 EPUB 未知章节标题的回退显示。
    其它
    - 版本号 1.6.5 → 1.6.6。

    完整变更：https://github.com/hadc188/reader/compare/v1.6.5...v1.6.6
