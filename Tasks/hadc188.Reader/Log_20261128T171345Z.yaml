  Key: ReleaseNotes
  Value: |-
    新增
    - 本地书支持批量导入并选择分组。
    - 新增本地书 TXT 目录规则管理与规则导入。
    - 新增替换净化规则管理。
    - 设置中新增搜索并发数配置。
    优化
    - 强化 TXT 目录规则解析，完善本地书目录规则与刷新流程。
    - 优化多源搜索超时处理与续搜游标。
    - 优化宽屏书架布局。
    - 优化批量删除进度反馈与清理速度。
    - 优化设置界面及本地书规则管理体验（#52）。
    - 提升 OkHttp 字节正文书源兼容性。
    修复
    - 修复发现页分页加载中断、切换书源阻塞，以及系统代理切换不生效的问题。
    - 修复缓存完成后本地书籍章节数未刷新。
    - 修复本地书籍空章节被误报为书源解析错误。
    - 修复在线漫画整页长图被压扁的问题（#53）。
    其它
    - 版本号 1.6.8 → 1.6.9。

    完整变更：https://github.com/hadc188/reader/compare/v1.6.8...v1.6.9
