  Key: ReleaseNotes
  Value: |-
    新增
    书架搜索
    - 书架标签栏右侧新增搜索框。
    书籍简介可展开
    - 书籍详情弹窗与阅读页书源面板的简介支持「展开全部 / 收起」。
    优化
    - 分段规则：仅靠裸换行分行的书源正文现在也能正确分段；此前整章会塌成一大段。
    - 本地缓存：「清本地」不再连带删除目录缓存，避免下次打开先同步联网抓一遍目录；封面按实际 Content-Type 决定扩展名，不再出现 .image 这种打不开的文件。
    修复
    - 搜索结果 0 条：java.getElement 改为按 legado 语义返回元素集合；元素快照还原成带 select/text/html/attr 的对象；元素上的 h4@text 按 CSS 求值；book.bookUrl 跨字段共享，详情链接不再恒为空。
    - 离开阅读页卡住：进度写入最多等 1.2 秒即放行导航，后端慢一次不再把用户锁在阅读页。
    - 封面地址：拼接在资源地址上的 legado URL option（,{"headers":…}）会被剥离，封面不再加载失败。
    其它
    - 版本号 1.5.7 → 1.5.8。

    完整变更：https://github.com/hadc188/reader/compare/v1.5.7...v1.5.8
