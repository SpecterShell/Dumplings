  Key: ReleaseNotes
  Value: |-
    本次更新
    - 新增应用内更新：自动识别 Windows 安装包版与便携版，支持下载进度、文件完整性校验和便携版失败恢复；Linux 与 macOS 会下载并打开对应安装文件。
    - 修复连续搜索不同书名时，旧请求结果偶尔覆盖新结果并跳转到无关书籍的问题。
    - 修复关闭或删除书源后，搜索结果、书籍详情和换源列表仍残留旧书源的问题。
    - 新增阅读页按住 Ctrl（控制键）配合滚轮调节字号，字号设置会自动保存。
    - 优化自动翻页状态提示，可查看当前滚动模式并快速停止。
    - 优化老板键设置，移除容易与系统快捷键冲突的 Win（窗口键）。
    - 备份与恢复改为“本地备份”和 WebDAV（网盘协议）分页管理。
    - 修复书海、统计和 RSS（订阅源）页面未应用桌面背景图的问题。
    - 整理应用设置与阅读设置分类，统一分页控件、按钮、圆角及交互反馈。
    更新说明
    应用会在设置中检查新版本。Windows 安装包版会匹配安装程序，便携版会匹配便携压缩包；更新便携版前会保留当前程序，若新版启动失败会自动恢复。
    首次使用应用内更新时，旧版本仍需从本发行页下载安装；升级到 v1.3.4 后，后续版本可直接在应用内更新。
    完整改动：https://github.com/hadc188/reader/compare/v1.3.3...v1.3.4
