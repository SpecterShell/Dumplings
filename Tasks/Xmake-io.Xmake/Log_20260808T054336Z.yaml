- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    New features
    - #7558: Add check_alignof / alignof detection support
    - #7587: Support xmake show --format=json
    - #7607: Support passing multiple target names to build / clean and other commands
    - #7634: Add filter support for xpack
    - #7654: Add batchcmds:call and lua-file transform support for bin2obj / bin2c
    - #7680: Rework xmake plugin to install plugins from repositories (repo@name or name), git urls (github:user/repo[#branch]) and local directories using the packages-style plugins/<first-letter>/<name> layout, and list built-in / installed / available plugins with their descriptions
    - Add gcc-16 toolchain support
    Changes
    - #7562: Improve nuget version handling
    - #7564: Improve vcpkg dependency info in find_package
    - #7582: Support set_encodings and filter output for nvcc
    - #7609: Use FormatMessageW for Windows system error messages
    - #7614: Improve cargo package installation
    - #7619: Work around clangd drive-letter casing issue
    - #7620: Improve cl flag detection and output handling on vs2015
    - #7625: Improve verilator rules
    - #7629: vsxmake: support custom source types in the solution explorer and nonetype targets
    - #7630: Add add_toolset api checker
    - #7637: Improve readline / curses options for mingw
    - #7648: Improve error tips
    - #7655: Improve bin2obj object-flag detection and add ppc / mips support
    - #7657: Update NDK sdkver for riscv64
    - #7666: Improve vcpkg package discovery
    - #7672: Add fallback download support
    - #7688: Improve static libc++ runtime links for clang
    - #7689: Rewrite xmake plugin --install to install plugins from xmake-repo as plugin kind packages, reusing the package installation flow
    - #7693: Replace the deprecated tbox interfaces
    - Improve elf rpath cleaning and package path handling
    - Add xcodebuild detection
    - Update the bundled tbox
    Bugs fixed
    - #7561: Fix -flto=thin regression for clang-cl
    - #7563: Fix crash in contains and improve PCH for C++ std modules
    - #7580: Fix the format plugin when the header path is already absolute
    - #7581: Fix missing paren in package loading
    - #7583: Fix splitting global flags for cmake packages
    - #7599: Fix gzip / tar detection on OpenBSD
    - #7600: Fix enabling the build cache memcache
    - #7601: Fix verilator to always define TRACE
    - #7602: Fix package load memcache
    - #7603: Fix rmdir via tbox update
    - #7604: Fix rpath cleaning for elf
    - #7608: Fix typos and format command menus
    - #7611: Fix cache environment variable handling (#7576)
    - #7622: Fix default maintainer for deb packaging
    - #7627: Fix PATH handling in debuild
    - #7631: Fix PATH handling when installing deb packages
    - #7633: Fix pkg-config path for BSD in the Meson backend
    - #7640: Improve emcc detection with a fallback search
    - #7644: Fix stack buffer overflow for long paths in path translation
    - #7645: Fix removing read-only directories
    - #7659: Fix emcc detection for .exe / .bat on Windows
    - #7661: Revert static libc++ link for clang
    - #7668: Fix passing paths to cmake
    - #7671: Fix tbox bugs
    - #7674: Fix Mach host send-right leaks on macOS
    - #7676: Fix masm symbol flags for embed / edit levels
    - #7679: Fix set_pcheader for msvc in C mode
    - #7684: Fix wrong Lua stack index in process.open
    - #7685: Fix engine resource leaks
    - #7687: Fix the ninja generator to emit build edges for win.sdk.resource source batches (#7682)
    - #7692: Fix dependency order for build.c++.modules.tryreuse
    - Fix trybuild for scons
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新特性
    - #7558: 添加 check_alignof / alignof 检测支持
