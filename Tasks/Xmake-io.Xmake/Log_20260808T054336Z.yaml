    - #7654: 为 bin2obj / bin2c 添加 batchcmds:call 和 lua 文件 transform 支持
    - #7680: 重构 xmake plugin，支持从仓库（repo@name 或名称）、git 地址（github:user/repo[#branch]）以及本地目录安装插件，仓库中的插件采用与 packages 相同的 plugins/<首字母>/<名称> 布局，并列出内置、已安装和仓库中可安装的插件及其描述
    - 添加 gcc-16 工具链支持
    改进
    - #7562: 改进 nuget 版本处理
    - #7564: 改进 find_package 中的 vcpkg 依赖信息
    - #7582: 支持 nvcc 的 set_encodings 并过滤其输出
    - #7609: 使用 FormatMessageW 获取 Windows 系统错误信息
    - #7614: 改进 cargo 包安装
