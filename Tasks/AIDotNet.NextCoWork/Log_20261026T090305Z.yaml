  Key: ReleaseNotes
  Value: |-
    修复
    - 数学公式不渲染(#183):模型常用 \(…\) 和 \[…\] 写公式，而渲染器只认 $…$,于是 \times 之类被当成普通文本。现在渲染前会把这两种写法转成 $ 形式；代码块和行内代码里的内容保持原样
    - 关闭工作区后终端任务仍在后台运行(#181):关闭工作区 Tab、删除工作区时，会一并结束它名下的终端进程，不再留下孤儿进程
    - 子 Agent 卡片卡在「运行中」、停止按钮没反应(#185):子 Agent 已结束但父会话漏了结束事件时，点停止会按主进程的实际状态把卡片收口，不再无反应
