  Key: ReleaseNotes
  Value: |-
    修复
    - 点「重启并安装 3.0」后没有反应：之前判断退出有没有被取消靠的是一个 8 秒的定时器，退出稍慢时界面会回到可点状态，看起来像没反应。现在和「重启更新」一样读退出流程的真实状态；退出被取消(例如有未保存的文档)时，会结束那个还在等待的安装脚本，不会在你稍后自己退出时突然换上 3.0
    - 安装脚本起不来时不再静默失败：被安全软件拦截、找不到 PowerShell 等情况现在会在界面上提示并允许重试；安装过程会写日志到 %TEMP%\nextcowork-v3-install\install.log(macOS / Linux 在系统临时目录的同名文件夹里),遇到问题时把这个文件发给我们即可
