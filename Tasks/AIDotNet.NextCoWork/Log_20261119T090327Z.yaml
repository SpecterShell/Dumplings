  Key: ReleaseNotes
  Value: |-
    新功能
    - 在应用内下载并安装 NextCoWork 3.0:升级卡片现在和正常更新一样——点「下载 3.0」,下载完成并校验后点「重启并安装 3.0」,2.x 会退出并自动换成 3.0 再打开它。macOS 就地替换应用(旧的 2.x 备份在 ~/Library/Application Support/NextCoWork-2.x-backup/),Windows 运行安装程序，Linux 放到 ~/Applications/ 并启动。只从官网下载、校验 sha256,macOS 还会验签；任何一步失败都会提示原因，并保留「只打开下载页」。3.0 会在第一次打开时接管 2.x 的数据(迁移前先做完整备份)
    其他
    - 发布流程不再向 npm 发布设备服务包(包仍在 GitHub Release 里)
