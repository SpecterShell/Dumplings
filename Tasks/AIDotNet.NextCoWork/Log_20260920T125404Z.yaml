  Key: ReleaseNotes
  Value: |-
    新增
    免 Key 的内置搜索兜底：一个搜索服务都没配也能真的搜
    - 搜索服务未配置、全部失败或全部零结果时，web_search 不再直接回一句「去设置里配 Key」，而是先走公共 SearxNG 实例（最多试 3 个、每个 4 秒），全挂再按 Bing → DuckDuckGo → 百度 直抓结果页（每家 5 秒）；命中后给前 2 条抓正文补摘要（总预算 6 秒，正文抓取失败只保留原摘要、绝不影响结果本身）
    - 结果标注实际来源（实例域名 / 引擎名），并附上给模型的提示：免费源质量与时效低于配置的专业服务；设置 › 连接 › 搜索 底部新增小节，可填自建 SearxNG 实例（支持 http://localhost:8080 这类本机地址，自建优先于内置实例）并一键测试
    - 零结果与失败分开归因：「搜索通了但没结果」会明说换查询词值得一试，不再和「全部失败」混成一句——旧行为下模型会把同一个查询原样重试三遍；付费源的失败原因即使被兜底救回也照常带回，否则过期的 Key 会永远坏下去而表面上「搜索还能用」
    Bash 后台命令与「停止这条命令」
    - Bash 新增 run_in_background，配套 BashOutput（增量读输出、读过即清、按行过滤、回包带退出码）与 KillShell（杀整棵进程树）；最多 8 条并行、24 条留痕、单条输出 256KB 环形缓冲，丢过的输出会明确告知——起 npm run dev 这类不退出的命令不再白等到超时，SSH 工作区同样可用
    - 运行中的 Bash 工具卡新增「停止这条命令」：只掐这一条，回合继续，模型收到「用户停止了这条命令、不要再跑」；此前唯一选择是停止整轮，模型写到一半的回复一起没。退出应用时统一收掉后台进程，不留占着端口却在界面上找不到的进程
    工作区编辑与外层 Tab 条
    - 外层 Tab「+」菜单的工作区行新增铅笔入口：改名、默认模型与思考强度、删除工作区；路径只读展示——改路径需要重新选择目录新建，画一个输入框会是一句点了没反应的假承诺
    - 「+」按钮移出可滚动的 Tab 列表（此前 Tab 挤满后，最后一个 Tab 的关闭按钮会盖住它）；被滚出视野的 Tab 收进右侧下拉菜单直达
    迁入数据的账户归属交接（v2.2.1 启动迁移闸门的后续）
    - 迁入的会话在登录账户后自动认领到账户名下、出现在侧边栏——此前迁移显示成功、账户侧却一条会话都看不见（行级合并发生在打开账户库之前，归属只能先落 local）；一份迁入数据只属于第一个认领它的账户，同根目录复用既有工作区，远端来源降级为未绑定
    - 归属清单与每条会话同一个数据库事务落盘：中途磁盘满等失败不会再把前半批永远留在 local；迁移重试与撤销后侧边栏当次刷新，不必重启
    改动
    - 上下文窗口校验改按本次请求实际预留的输出额度判断：模型目录声明 32K/64K 输出上限的模型，哪怕这一轮只预留 2K，也会在发请求前就被拦下报「超出上下文窗口」
    - 状态行压力条的分母实时跟随当前窗口：中途打开「最大上下文」后，占用读数与「接近上限」提示当帧回落——此前要等下一次发送，表现为界面在催用户做一件他刚做完的事
    - 更新说明正文随版本送达客户端更新卡片——此前只能送一个 GitHub Release 链接，卡片永远显示「暂无更新说明」；发布前先校验各平台产物齐全
    - Agent 的 shell 选择与自建 SearXNG 地址标记为机器本地设置：切换账户、云同步与导出不搬运（localhost 地址搬到另一台机器就是死地址）
    - 审批选项改为紧凑的决策项列表，多问题切换不再硬切得像整张卡重新挂载；子代理任务中心默认收起已归档任务，进行中/失败/被停的任务保持直接可见
    - WebFetch 与浏览器工具按工作区所有者的明确要求放开了本机与内网地址筛查（协议白名单、URL 内嵌凭证拦截与响应体积上限保留）；收录 MAI-Code 1.1 Flash 及其定价
    修复
    - SSH 密码认证被本机配置悄悄禁用：ssh_config 里 Host * 下的 PasswordAuthentication no（部分工具与公司策略会写入）会让 ssh 连试都不试密码——表现为同样的用户名密码别的终端连得上、这里永远「认证失败」，用户只会去反复核对密码；现在只要明确选了密码/键盘交互认证，就在命令行显式打开对应开关，选「自动」时仍尊重本机配置
    - 迁移目标库探测失败不再被当成「没有东西要搬」：这正是丢数据的形态（静默继续、日志里一个字都没有）；现在停在明确标注「目标库损坏」的错误页，与源库损坏区分开
    - 改动审查打开大文件首屏直接落在改动处，不再让用户从文件第 1 行开始翻；几千行只有少量分散改动的文件按预算裁掉相同头尾，极端整文件重写宁可提示打开文件，也不在渲染线程分配无界的 diff 矩阵
    - 切换审查文件不再沿用旧滚动位置（会直接越过改动），旧 diff 也不会顶着新文件名闪一帧
    测试
    - 新增后台 shell 注册表与限额、Bash 后台/单条停止契约、内置搜索三层链路与 SERP 解析（含验证码与改版降级）、迁移归属交接闭环（认领/撤销/降级/重试）、SSH 认证参数、上下文压力分母、任务清单、审查视图 diff 预算等测试；完整套件 5463 项全部通过
