Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    A fix for v0.12.0; see its notes for everything new in 0.12.
    Fixes
    - Protocol 1 discovery: v0.12.0 identified an ANAN-10E (and possibly other Apache Hermes-based radios) as a Hermes-Lite 2. A Hermes-Lite 2 identifying itself as a Hermes is now recognised by its MAC address as well, so Apache radios are a Hermes again.
    Downloads
    - Linux AppImage (x86_64 / aarch64): hpsdr-rs-0.12.1-x86_64.AppImage, hpsdr-rs-0.12.1-aarch64.AppImage. Run chmod +x on the file, then run it. USB radios still need the udev rules installed by hand; a copy is inside the AppImage under usr/share/doc/hpsdr-rs.
    - Debian/Ubuntu (amd64): hpsdr-rs_0.12.1-1_amd64.deb. Install with sudo apt install ./hpsdr-rs_0.12.1-1_amd64.deb.
    - Debian/Ubuntu/Raspberry Pi OS (arm64): hpsdr-rs_0.12.1-1_arm64.deb. Install with sudo apt install ./hpsdr-rs_0.12.1-1_arm64.deb.
    - Fedora/openSUSE RPM (x86_64 / aarch64): hpsdr-rs-0.12.1-1.x86_64.rpm, hpsdr-rs-0.12.1-1.aarch64.rpm. Install with sudo dnf install ./hpsdr-rs-0.12.1-1.x86_64.rpm, or on openSUSE sudo zypper install --allow-unsigned-rpm ./hpsdr-rs-0.12.1-1.x86_64.rpm.
    - macOS (Apple Silicon): hpsdr-rs-0.12.1-macos-arm64.tar.gz. It is built in CI, unsigned and not notarized, so Gatekeeper warns on first launch. Right-click the hpsdr-rs binary and choose Open, or run xattr -d com.apple.quarantine hpsdr-rs first.
    - Windows (x86_64): hpsdr-rs-0.12.1-x86_64.msi
