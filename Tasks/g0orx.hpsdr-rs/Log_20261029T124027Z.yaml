- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Changes since v0.8.4.
    New
    - ADALM-Pluto (and its clones) as a radio. It's reached over its USB network link at 192.168.2.1, or over Ethernet. Confirmed on a real Pluto clone (AD9363) receiving QO-100.
      - Receive: 325 MHz to 3.8 GHz (more on a Pluto in AD9364 mode), RF Gain 0-71 dB, rates 48-1536 kHz, and a Wide stream (4608 kHz) for DATV.
      - Transmit: full duplex, for example QO-100's 2400 MHz uplink while receiving the LNB. TX Drive is set in dB (-60 to 0 dB of the Pluto's few milliwatts). Checked end to end through the chip's own digital loopback, but not yet tested on air. It needs the Wide stream off, because the USB link can't carry both.
      - Ethernet: a Pluto+ or a USB-Ethernet adapter on the OTG port is found automatically by mDNS.
      - A new 13cm band (2300-2450 MHz).
    - DATV: a native DVB-S2 receiver for QO-100's wideband transponder, written from the ETSI standard. It works with an RTL-SDR, MSI.SDR or Pluto, and sends the transport stream over UDP to VLC or ffplay. Off-air, it decoded the wideband beacon and other stations to watchable video with a Pluto.
      - QPSK and 8PSK, every code rate, normal and short frames, with or without pilots.
      - Transponder view (Pluto): a spectrum of the whole 10491-10499.5 MHz transponder. Click a station to set the frequency and symbol rate.
      - Start retunes VFO A when the chosen signal is outside the receiver's stream.
      - The SNR readout is accurate near threshold, and the manual has a table of what each mode needs.
    - MSI.SDR Wide stream (4608 kHz) and Record raw IQ (SigMF) for the RTL-SDR, MSI.SDR and Pluto.
    - PureSignal: Reserve receivers for PureSignal can be turned off, which gives Add Receiver its full receiver count back.
    - Mute button next to Audio gain, on the main window and extra receivers. Record and TCI carry on while muted.
    - NB and NR open a menu of their choices instead of cycling through them.
    - XVTR: LO Error takes the scroll wheel (100 Hz a notch; Alt 10 Hz, Shift 1 kHz).
    Fixes
    - RTL-SDR: direct sampling is now automatic below 24 MHz. A saved "Off" left HF silent. The RTL-SDR Blog V4 stays on its upconverter.
    - TCI: dds is reported in the transverter's RF frequency (TCI Remote showed the IF), and VFO B is reported and can be set.
    - TCI: "Mute local audio output" now only applies while a client is connected.
    - Spectrum axis: labels are round numbers in RF terms and are no longer drawn past the right edge.
    - Settings → Network's note about rigctl and TCI PTT was wrong: all three servers can key the radio.
    Downloads
    - Linux AppImage (x86_64 / aarch64): hpsdr-rs-0.9.0-x86_64.AppImage, hpsdr-rs-0.9.0-aarch64.AppImage. Run chmod +x on the file, then run it. USB radios still need the udev rules installed by hand; a copy is inside the AppImage under usr/share/doc/hpsdr-rs.
    - Debian/Ubuntu (amd64): hpsdr-rs_0.9.0-1_amd64.deb. Install with sudo apt install ./hpsdr-rs_0.9.0-1_amd64.deb.
    - Debian/Ubuntu/Raspberry Pi OS (arm64): hpsdr-rs_0.9.0-1_arm64.deb. Install with sudo apt install ./hpsdr-rs_0.9.0-1_arm64.deb.
    - Fedora/openSUSE RPM (x86_64 / aarch64): hpsdr-rs-0.9.0-1.x86_64.rpm, hpsdr-rs-0.9.0-1.aarch64.rpm. Install with sudo dnf install ./hpsdr-rs-0.9.0-1.x86_64.rpm, or on openSUSE sudo zypper install --allow-unsigned-rpm ./hpsdr-rs-0.9.0-1.x86_64.rpm.
    - macOS (Apple Silicon): hpsdr-rs-0.9.0-macos-arm64.tar.gz. It is built in CI, unsigned and not notarized, so Gatekeeper warns on first launch. Right-click the hpsdr-rs binary and choose Open, or run xattr -d com.apple.quarantine hpsdr-rs first.
    - Windows (x86_64): hpsdr-rs-0.9.0-x86_64.msi
