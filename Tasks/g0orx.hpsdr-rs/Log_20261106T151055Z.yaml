- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Changes since v0.9.0.
    New
    - Named setups: a Setups menu next to B>A saves VFO A and B (frequencies, transverters, mode and filter width), CTUN, Split, SAT, Duplex, PSK Beacon and Lock LNB under a name, and recalls them with one click -- e.g. everything for QO-100. Frequencies come back as they were displayed, even if Lock LNB's correction has moved since.
    - SNR readout under the S-meter: the signal-to-noise ratio in the receive filter, for peaking a dish or LNB on a beacon. Within about 1 dB, checked against a real QO-100 beacon recording.
    - Fold the control rows away: a « button at the start of the band row folds everything down to rigctl/TCI/CAT into one line, giving the spectrum and waterfall the room -- in the main window and in each extra receiver. The main window can now be made as short as 360 px.
    - The transmit sliders (Mic gain, TCI TX gain, TX Power/Drive) have their own row under Audio gain.
    - Pluto:
      - Works on Tezuka firmware, whose FPGA rate conversion delivered only 40% of the samples: hpsdr-rs checks at connect and streams directly at 3.072 MS/s where needed.
      - The spectrum and S-meter take RF Gain back out, using the AD936x's measured gain steps, so levels stay put as you change it.
      - Reconnects after a stream stall instead of stopping, and the lost-samples message is timestamped.
    - Diagnostics: every log now starts with the version and commit; HPSDR_LOG (e.g. eframe=trace) turns on library logging, and HPSDR_P2_DEBUG shows which of a Protocol 2 radio's ports are sending.
    Fixes
    - PSK Beacon: about half the frames could fail their checksum when the receiver's clock was off (a Pluto clone was 16 ppm out) -- the symbol timing added or dropped a bit each time it drifted past one point. Now decodes every frame.
    - CW Tune went out two CW pitches from the dial; it's now on the CW carrier, and shows in the Duplex TX inset.
    - Protocol 1: changing the sample rate made TX run at the RX rate instead of 48 kHz.
    - Protocol 2: radios that report as Hermes with 2 DDCs (e.g. Brick2) had their receiver put on a DDC they don't have; the DDC count now comes from the radio.
    - Windows:
      - DirectX 12 (OpenGL fallback) instead of also starting Vulkan, which crashed an older Intel graphics driver at start.
      - An extra receiver's window froze while the main window had focus. The main window was redrawing flat out (on every platform), which also cuts its CPU use.
    - "Creating FFTW Wisdom File..." showed whenever no samples were arriving; it now says "Waiting for samples from the radio...".
    - The manual has new screenshots and covers all of the above.
    Downloads
    - Linux AppImage (x86_64 / aarch64): hpsdr-rs-0.10.0-x86_64.AppImage, hpsdr-rs-0.10.0-aarch64.AppImage. Run chmod +x on the file, then run it. USB radios still need the udev rules installed by hand; a copy is inside the AppImage under usr/share/doc/hpsdr-rs.
    - Debian/Ubuntu (amd64): hpsdr-rs_0.10.0-1_amd64.deb. Install with sudo apt install ./hpsdr-rs_0.10.0-1_amd64.deb.
    - Debian/Ubuntu/Raspberry Pi OS (arm64): hpsdr-rs_0.10.0-1_arm64.deb. Install with sudo apt install ./hpsdr-rs_0.10.0-1_arm64.deb.
    - Fedora/openSUSE RPM (x86_64 / aarch64): hpsdr-rs-0.10.0-1.x86_64.rpm, hpsdr-rs-0.10.0-1.aarch64.rpm. Install with sudo dnf install ./hpsdr-rs-0.10.0-1.x86_64.rpm, or on openSUSE sudo zypper install --allow-unsigned-rpm ./hpsdr-rs-0.10.0-1.x86_64.rpm.
    - macOS (Apple Silicon): hpsdr-rs-0.10.0-macos-arm64.tar.gz. It is built in CI, unsigned and not notarized, so Gatekeeper warns on first launch. Right-click the hpsdr-rs binary and choose Open, or run xattr -d com.apple.quarantine hpsdr-rs first.
    - Windows (x86_64): hpsdr-rs-0.10.0-x86_64.msi
