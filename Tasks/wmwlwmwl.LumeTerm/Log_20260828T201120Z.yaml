    - fix(tray): 修复 Windows 托盘右键菜单多次点击或切换其它托盘后不再弹出的问题 (#286)
    - fix(terminal): 修复标签切换/面板伸缩视口自适应、滚动条样式与缩放文字错位问题 (#285)
    - chore(deps-dev): bump @types/react-dom in /frontend (#281)
    - chore(deps): bump react-markdown from 9.1.0 to 10.1.0 in /frontend (#279)
    - chore(deps-dev): bump @babel/parser from 7.29.7 to 8.0.4 in /frontend (#280)
