  Value: |-
    deskHPSDR 2.8.10
    Changes:
    - optimize deskHPSDR for use with the new P2tunnel app
    The x86_64 Intel version is build against Xcode 26.3 and corresonding clang under macOS 15 "Sequoia".
    The ARM version is build with the lastest Xcode 27.0 version / clang currently under macOS 26 "Tahoe".
    The Windows version (64bit native) is build against MSYS2 UCRT64 under Windows 11 Pro.
    73 Heiko, DL1BZ
    Maintainer deskHPSDR project
    Note: deskHPSDR get seamless updates. The used version numbering (e.g. 2.7.40) is only a requirement for the release option at Github. But the crucial factor is the commit state, which is part of the download filename. Compare it, from time to time I replace the downloads with newer deskHPSDR versions, but without changing the actual version number. Support always required the use of the latest deskHPSDR version.
    Note 2: I never create or publish deskHPSDR binaries or appimages for Linux.
