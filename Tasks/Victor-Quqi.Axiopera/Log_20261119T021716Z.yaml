Version: 0.4.0
Installer:
- Architecture: x64
  InstallerType: zip
  NestedInstallerType: portable
  InstallerUrl: https://github.com/Victor-Quqi/Axiopera/releases/download/v0.4.0/axiopera-v0.4.0-x86_64-pc-windows-msvc.zip
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Added
    - Install the host skill with axiopera skill install agy. AGY tasks support read, work and full permissions. Read-only tasks can list workspace directories and read files. Approvals from native child sessions show which child requested the action.
    - axiopera models agy lists the effort levels available for each model. New tasks inherit the terminal’s saved model and effort when available. Resumed tasks keep their own selection.
    - A task that produces no visible progress for two minutes notifies its caller.
    Fixed
    - AGY retains messages it refuses mid-turn for delivery on the next turn. Results from native child sessions can wake the parent after its turn ends.
    - inbox and wait report pending questions and running tasks consistently. When a Codex host reads its inbox, Axiopera withdraws the queued reminder and retries if withdrawal fails.
    Other notes
    - In AGY 1.5.11, the default ACP permission mode can ask for approval even when a command matches your personal permissions.deny rule. Reject these requests when Axiopera forwards them. Backend permissions
    - Stop the daemon with axiopera daemon stop before replacing the executable.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Antigravity CLI 现可作为宿主派发任务，也可作为后端接收任务。
    新增
    - 用 axiopera skill install agy 安装宿主 skill。AGY 任务支持 read、work、full 三档权限。只读任务可以浏览工作区目录和读取文件，原生子会话发起的审批会显示子会话 ID。
    - axiopera models agy 按模型列出可用的推理强度。新任务默认沿用终端中可用的模型和强度，续接任务保留原选择。
    - 任务连续两分钟没有可见进展时，调用方会收到提醒。
    修复
    - AGY 在轮次中拒收的追加消息会保留到下一轮。原生子会话在父会话轮次结束后返回结果，也能唤醒父会话。
    - inbox 和 wait 对待答问题和运行中任务的报告保持一致。Codex 宿主收件后，Axiopera 会撤回已排队的提醒，撤回失败会重试。
    其它说明
    - AGY 1.5.11 在 ACP 默认权限模式下，命中个人 permissions.deny 规则的命令仍可能请求审批。Axiopera 转发这类请求时，请选择拒绝。后端权限说明
    - 替换程序前先运行 axiopera daemon stop。
