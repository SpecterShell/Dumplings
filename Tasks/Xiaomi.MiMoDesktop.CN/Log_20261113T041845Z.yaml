  Key: ReleaseNotes
  Value: |-
    角色动作更自然，摆臂、头颈与呼吸眨眼更显生动，上身柔和跟随关键帧。
    支持按描述生成自定义机器人造型，实验室可导入自有角色模型。
    会话管理页改版，待决事项集中呈现，名册以分组卡片与详情抽屉展示，并内置大管家统一记录与派发事项。
    新增视频创作技能，模型菜单支持拖动排序并保存，引用卡支持快捷键添加与发送。
    网页支持独立窗口显示并在切换会话时保持运行，账单余额查询覆盖手动配置的供应商。
    进一步优化性能，体验更佳。
    修复一些已知问题。
