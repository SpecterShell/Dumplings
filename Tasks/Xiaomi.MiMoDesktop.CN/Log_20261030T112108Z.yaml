  Value: |-
    支持通过飞书、微信、企业微信和 Slack 从手机远程控制电脑上的 MiMo，并审批待确认操作。
    电脑与手机间可同步会话，远程交互支持收发文件、图片和视频，以及处理计划审批和多项问题。
    新增米家设备状态查询与逐设备授权控制，并支持 MiMo 开放平台用量同步及内网服务接入。
    自动化支持自定义周期与有效期，并可设置应用保持唤醒。
    支持 Markdown 快捷输入与实时排版，内容区宽度也可通过拖动调整。
    进一步优化性能，体验更佳。
    修复一些已知问题。
