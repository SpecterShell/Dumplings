  Value: |-
    国内版支持去除显式水印。
    支持系统任务通知与角标联动。
    支持 SVG 图形、文字和区域批改。
    模型思考过程改为可折叠步骤块，公式可一键复制为 TeX。
    读取网页步骤显示可点击网址，参考区展示联网来源。
    图片自动压缩，优化长会话与侧栏渲染性能。
    上下文用量只认主会话，子智能体 token 不再覆盖 HUD。
    侧栏优先级提示改为无数字蓝点。
    修复 Windows 会话流式正文不更新、侧栏滚动白屏等问题。
    删除本地会话时真删引擎会话，防止同步复活。
