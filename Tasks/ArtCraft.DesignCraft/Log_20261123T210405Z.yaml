  Key: ReleaseNotes
  Value: |-
    Highlights
    - Place: place several images at once with a loaded place cursor (with thumbnails and a count), drop images straight in, and make a contact sheet with File › Place Contact Sheet…. Images come in at the resolution stored in the file.
    - Text and layout: Alpha Channel text wrap follows a transparent image's visible pixels, vertical justification is much more accurate in shaped and grid-aligned frames, and object styles can set paragraph styles and Text Frame General Options.
    - Tables: diagonal lines in cells (Cell Options › Diagonal Lines) and Table › Go to Row….
    - Faster editing: opening, preflight and recovery saves run in the background, and edits recompose only what changed, repaint only what moved and stop re-rendering every page thumbnail.
    - Safer files: Save refuses to write a document that wouldn't reopen, PDF links allow only web and mail addresses, and many importers now refuse oversized or malformed input instead of exhausting memory.
    - Fixes: Delete Unused Layers and Merge Layers keep grouped and anchored objects, cutting an object no longer pastes old text, whole-page PDF flattening respects non-printing layers, and pasting images from the system clipboard works.
