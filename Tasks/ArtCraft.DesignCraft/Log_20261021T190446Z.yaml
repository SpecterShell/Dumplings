  Key: ReleaseNotes
  Value: |-
    Note
    FreeBSD aarch64 is dropped from this release. We had to cut releases, and we cannot build this target within the 5-hour CI limit for any of the Craft apps, so we are dropping it for now. This is a known blocker, flagged for a future fix in storytold/craft-common-actions#39. FreeBSD x86_64 and every other platform are included.
    What's Changed
    - docs: add SonarCloud and CodeRabbit badges to README by @dylanmtaylor in https://github.com/storytold/designcraft/pull/1266
    - Skip CodeRabbit reviews on Dependabot PRs by @echelon in https://github.com/storytold/designcraft/pull/1386
    - Use shared PDF reading and report incomplete layered exports by @skylartaylor in https://github.com/storytold/designcraft/pull/876
    - Pin winit to storytold/winit (same commit) by @skylartaylor in https://github.com/storytold/designcraft/pull/1113
    - CI: run cargo xtask ci on pull requests and pushes to main by @FredApps in https://github.com/storytold/designcraft/pull/1352
    - ci: switch to shared nix workflow from craft-common-actions by @dylanmtaylor in https://github.com/storytold/designcraft/pull/1110
    New Contributors
    - @FredApps made their first contribution in https://github.com/storytold/designcraft/pull/1352
    Full Changelog: https://github.com/storytold/designcraft/compare/v0.10.0...v0.11.0
