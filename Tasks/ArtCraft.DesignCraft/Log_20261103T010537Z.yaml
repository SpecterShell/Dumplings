  Value: |-
    What's Changed
    - Drop text variable markers in Text Only and RTF story export by @Silvertree2010 in https://github.com/storytold/designcraft/pull/2098
    - Skip children of hidden groups in EPUB/HTML export by @Silvertree2010 in https://github.com/storytold/designcraft/pull/2097
    - Match placed SVG font-family against legacy family and full names by @Silvertree2010 in https://github.com/storytold/designcraft/pull/2094
    - Drop XML-forbidden control characters from math SVG text by @Silvertree2010 in https://github.com/storytold/designcraft/pull/2092
    - Keep Color::to_hsb hue below 360 by @Silvertree2010 in https://github.com/storytold/designcraft/pull/2090
    - Read PDF/X output intent and Info as parsed objects in validate-pdf by @Silvertree2010 in https://github.com/storytold/designcraft/pull/2086
    - Clamp math.svg size to the same range as math.insert by @Silvertree2010 in https://github.com/storytold/designcraft/pull/2084
    - Fix zero tangent angle in Type on a Path at collapsed handles by @Silvertree2010 in https://github.com/storytold/designcraft/pull/2083
    - Report script parse error line numbers from the original text by @Silvertree2010 in https://github.com/storytold/designcraft/pull/2081
    - Fix intersects_rect missing hits for zero-width/height marquee rects by @Silvertree2010 in https://github.com/storytold/designcraft/pull/2076
    - file.openBytes: title a .designcraft file without its extension by @Tom-R-Main in https://github.com/storytold/designcraft/pull/2108
    - Zoom In/Out shortcuts zoom around the pointer over the canvas (#2075) by @MarekSpodBiedry in https://github.com/storytold/designcraft/pull/2124
    - Contributors: credit Y-az by @y-az in https://github.com/storytold/designcraft/pull/1162
    - Hyphenation: bundle the Dutch patterns by @y-az in https://github.com/storytold/designcraft/pull/1147
    - Add initial Hungarian (hu) interface localization by @macrobi in https://github.com/storytold/designcraft/pull/1223
    - font.list: report each face's fsType embedding bits by @Tom-R-Main in https://github.com/storytold/designcraft/pull/2109
    - i18n: Swedish (sv) interface translation by @kler in https://github.com/storytold/designcraft/pull/1018
    - Windows: keep the custom title bar window borderless by @aiongg in https://github.com/storytold/designcraft/pull/2139
    - Fix parent page resizing in panels and Page Tool by @makesomethingshit in https://github.com/storytold/designcraft/pull/1654
    - Restore GNOME Wayland window controls without bundled fonts by @danielmigueltejedor in https://github.com/storytold/designcraft/pull/1072
