  Key: ReleaseNotes
  Value: |-
    What's Changed
    - Separate the CJK commands from Insert Math Expression in the Type menu (#2043) by @MarekSpodBiedry in https://github.com/storytold/designcraft/pull/2048
    - Add File > Quit to the in-window menu on Windows and Linux (#2044) by @MarekSpodBiedry in https://github.com/storytold/designcraft/pull/2049
    - Spellcheck squiggles follow the text frame rotation (#2042) by @MarekSpodBiedry in https://github.com/storytold/designcraft/pull/2047
    - macOS: Finder opens .indd and .indt files with DesignCraft by @texjer in https://github.com/storytold/designcraft/pull/2053
    - Parents: single-sided pages in a spread show the parent page in their place by @texjer in https://github.com/storytold/designcraft/pull/2071
    - Skip quoted attribute values when finding the end of an xref tag by @Silvertree2010 in https://github.com/storytold/designcraft/pull/2058
    - Keep text of nested inline elements in file.importXml by @Silvertree2010 in https://github.com/storytold/designcraft/pull/2061
    - Images: refuse a raster that would decode past 1 GiB of RGBA (fixes #1586) by @VoiceLessQ in https://github.com/storytold/designcraft/pull/1975
    - Keep underline, strikethrough, caps and tracking in EPUB/HTML character styles and overrides by @Silvertree2010 in https://github.com/storytold/designcraft/pull/1914
    - Toolbar: Alt/Option-click cycles the flyout tool group by @tareq-halaby in https://github.com/storytold/designcraft/pull/2031
    - Rectangle dialog: width and height in the ruler units, not always picas (#1964) by @ZIDAN44 in https://github.com/storytold/designcraft/pull/2055
    - Parent pages: document-page overlays no longer pile onto the parent canvas by @seanth in https://github.com/storytold/designcraft/pull/1232
    - Parent pages: running headers show their name on the parent itself only by @seanth in https://github.com/storytold/designcraft/pull/2057
    - Cross-references keep edited text and break at spaces by @seanth in https://github.com/storytold/designcraft/pull/1239
    - Import warnings: Show selects the frame a story warning is about by @texjer in https://github.com/storytold/designcraft/pull/2052
    - Updates: shared check-result dialog from craft-update by @aiongg in https://github.com/storytold/designcraft/pull/2072
    - docs: tidy agent, contributor and asset docs by @aiongg in https://github.com/storytold/designcraft/pull/2070
    - packaging(flatpak): add OCI image build and GHCR publishing helper by @dylanmtaylor in https://github.com/storytold/designcraft/pull/2099
    New Contributors
    - @texjer made their first contribution in https://github.com/storytold/designcraft/pull/2053
    - @tareq-halaby made their first contribution in https://github.com/storytold/designcraft/pull/2031
    - @ZIDAN44 made their first contribution in https://github.com/storytold/designcraft/pull/2055
