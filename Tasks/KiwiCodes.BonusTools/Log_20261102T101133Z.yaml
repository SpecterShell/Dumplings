Version: 20.26.09.20
Installer:
- Architecture: x86
  InstallerType: msi
  InstallerUrl: https://kiwi-codes-public.s3.ap-southeast-2.amazonaws.com/bonus-tools-builds/BonusTools-20-26-09-20.msi
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - General - New - Custom .msi installer: installs to "C:\Program Files\BonusTools", supports a fully silent install accepts the license key as a silent-install parameter i.e. msiexec /i "path\BonusTools-20-26-09-20.msi" /qn LICENSEKEY="key", removes the old Autodesk-installed version automatically, and stores the license key machine-wide at "C:\ProgramData\BonusTools" so one activation covers every Windows user on the machine.
    - 07 Settings - New - Settings Groups: an organization's users can be grouped so they share one Ribbon/tool configuration instead of each customizing their own.
    - 05 About - New - Added a "Send Journal Files" button to zip and email your journal/log files to support directly, without digging through file explorer; the same email is auto-prepared if license activation fails.
    - 05 About - Update - Now displays the loaded .NET runtime and build variant.
    - 43 Place Family Types - Update - Placement now routes each family to the right method automatically (view-based annotations, level-based model families, and wall-hosted doors/windows, which get a temporary host wall created for them); families that can't be placed (title blocks, curtain panel types, or model families while a drafting view is active) are skipped and reported instead of erroring.
    - 43 Place Family Types - Fix - Placement failures now report to the Output panel instead of popping an error dialog and email draft for every unsupported family in a batch.
    - General - Fix - Fixed the installer showing an incorrect/mangled version number in Windows "Programs and Features", and cleaned up leftover per-user bundle folders from earlier installs.
    - General - Fix - Fixed an App Resources path and ribbon load failure affecting some Revit 2025/2026 installations running on the .NET 10 runtime.
