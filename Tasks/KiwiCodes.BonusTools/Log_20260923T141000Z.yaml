Version: 20.26.08.01
Installer:
- Architecture: x86
  InstallerType: msi
  InstallerUrl: https://kiwi-codes-public.s3.ap-southeast-2.amazonaws.com/bonus-tools-builds/KiwiCodesBonusTools-20-26-08-01-signed.msi
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - 56 Print Revisions - New - PDF export added (Revit 2022 and later).
    - 56 Print Revisions - Update - Sheet selection replaced with a sortable, filterable grid; added Select Selected/All/None buttons, a live "Print (X)" count on the Print button, and a "None" option on the View Sheet Set selector (switching sets now replaces the selection instead of adding to it).
    - 56 Print Revisions - Fix - Export settings, format checkboxes, and the custom Print Name pattern were not always remembered between sessions; PDF export could silently fail to run or ignore the custom filename; DWG/DXF prefix/suffix fields were misaligned.
    - 145 Layer Properties - Fix - Layer widths could show floating-point noise (e.g. 21.999999999999996 instead of 22); combo box selections weren't being remembered.
    - 146 Keynote Usage - Fix - Window title showed the literal placeholder text "[window_title]" instead of "Keynote Usage".
    - 149 Process Standards - New - "Configure Prefix" dialog on the Families tab lets you edit each category's naming prefix directly, with Reset to Defaults and Import/Export to Excel.
    - 149 Process Standards - New - Select All/Select None buttons on the Families tab.
    - 149 Process Standards - New - Purge buttons (Fill Patterns, Line Patterns, Line Styles, Object Styles, Materials) now show live progress and support Cancel, instead of appearing to hang.
    - 149 Process Standards - New - Close button added next to Process file(s).
    - General - Fix - Swept and fixed the same floating-point display noise on unit-converted values in tools 48 (Location Point), 126 (Family Info), 127 (Style Output), 95 (Family Standards), and 149 (Process Standards wall type naming).
    - General - Fix - Named user license validation now normalizes usernames to lowercase.
    - General - Fix - License acquisition is now recorded correctly when a license validates via the offline grace period.
    - General - Update - Fixed a Syncfusion SfDataGrid crash on some Revit 2025/2026 machines caused by other installed add-ins (e.g. DiRoots.One) bundling a conflicting Syncfusion version; BonusTools now isolates its own Syncfusion assemblies via generated command stubs in BonusToolsLoader.
    - General - Update - Added dependency/assembly-load diagnostics to the startup journal log to help diagnose future add-in conflicts.
