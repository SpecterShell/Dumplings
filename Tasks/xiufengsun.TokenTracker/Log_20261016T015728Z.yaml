  Key: ReleaseNotes
  Value: |-
    What's Changed
    - Muse Code: passive session reader for Muse CLI / Muse.app usage (~/.local/share/muse/sessions). Usage shows in sync/status; no public pricing yet so costs stay unpriced. (#800)
    - Cloud device token: status / doctor now honor cloud-device-token.json (Dashboard OAuth), so they no longer false-report a missing token when only the device token file is present. (#810, closes #809)
    Install
    - macOS: TokenTrackerBar.dmg or brew upgrade tokentracker
    - Windows: TokenTracker-Setup.exe or TokenTracker-win-x64.zip
    - Linux: .AppImage / .deb / .rpm
    - CLI: npm i -g tokentracker-cli@1.4.2 (after npm publish)
    Full Changelog: https://github.com/xiufengsun/TokenTracker/compare/v1.4.1...v1.4.2
