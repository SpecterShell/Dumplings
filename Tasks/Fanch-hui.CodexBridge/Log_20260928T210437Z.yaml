  Value: |-
    Codex Bridge 1.3.1
    - 修复任务审批冷却期的拒绝结果、暂时不可用的模型目录探测，以及 Direct Git 输出不完整时的状态判断，避免任务被错误结束或改动被误判。
    - 统一 macOS 与 Windows 工作台的项目权限选项、会话增量更新和命令参数校验；修复 macOS 项目策略列表重复显示“允许”。
    - 加强 Windows Pi 会话目录的路径别名校验，并整理 Windows 桌面命令路由与 Git 补丁存储、受限进程执行器的职责。
    - 同步 MCPB 连接器版本及发布摘要，完善双平台安装包和公开源码导出的验证。
