  Key: ReleaseNotes
  Value: |-
    Codex Bridge 1.3.4
    - 适配新版 DeepSeek Harness 的 DeepSeek Messages 与 OpenAI Chat Completions 网关，推理、模型目录和搜索地址独立解析。
    - 支持 DSH 源码、npm/pnpm 与官方桌面 Electron 运行布局，保留已有连接、模型偏好、MCP 配置和凭据引用。
    - DSH 连接增加协议选择与可选模型目录地址，模型目录刷新使用真实返回模型；失败反馈明确，保留此前成功目录与默认项。
    - 所有 Agent 共用新的 wait_task：submit_task 先返回任务 ID，Bridge 默认最多等待 5 分钟，任务完成、需要审批或补充信息时提前返回。
    - 到点仍在执行时返回同一任务 ID，模型可随时通过 get_task 查询状态和保存的结果；等待结束或连接断开不取消任务。
    更新后请在 ChatGPT 的插件设置中刷新 Codex Bridge，让新工具和模型列表生效。
