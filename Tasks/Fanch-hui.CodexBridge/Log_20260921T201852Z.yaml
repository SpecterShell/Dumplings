  Key: ReleaseNotes
  Value: |-
    Codex Bridge 1.1.1
    - 修复 Windows 安装包与 portable 包缺失 Secure Tunnel helper（tunnel-client.exe）导致 ChatGPT Tunnel 无法连接的问题。
    - 打包与安装器新增完整性门禁：缺少 helper 目录时打包直接失败，安装器再独立核对 helper 的存在性、PE 架构与 SHA-256。
    - 功能代码与 1.1.0 一致，本次为发布工件修复版本。
    已安装 1.1.0 Windows 版本的用户请在设置页“检查更新”升级到 1.1.1，或重新下载安装包覆盖安装；配置、历史会话、凭据与浏览器登录数据都会保留。
