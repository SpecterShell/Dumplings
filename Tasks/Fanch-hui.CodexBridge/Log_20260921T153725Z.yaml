  Key: ReleaseNotes
  Value: |-
    Codex Bridge 1.1.0
    - 优化会话实时刷新、历史内容加载和后台资源占用。
    - 工具输入与输出分别展示，统一为小字号灰底；修复重复参数、终端控制字符和长行展示。
    - 补充子代理的名称、状态与执行结果展示。
    - 续聊输入框默认保持紧凑，随内容自动增高，到达上限后内部滚动。
    - 预取并缓存模型推理选项，切换已加载模型时立即显示对应选项。
    - 完善项目忙时排队、会话控制与失败反馈。
    - 收紧 Direct Safe 内置命令：移除构建测试类免审批规则，限制 Git 只读操作、符号链接搜索和 Node 语法检查，保留显式注册命令与 Full 模式。
    - 保留升级所需的配置、历史会话、凭据和浏览器登录数据。
    支持 macOS Apple Silicon 与 Windows x64。Windows 提供安装器和 portable ZIP；应用内更新使用本次发布的完整安装包。
    安装与使用说明见仓库 README 和 docs/USER_GUIDE.md。
