  Key: ReleaseNotes
  Value: |-
    Codex Bridge 1.2.0
    - 工作台输入框和发送按钮直接显示当前续写方式：支持插入的会话可选“立即插入对话引导”，其他会话显示“结束后运行”。
    - Antigravity 的模型选项已包含推理强度，选择模型时不再另选一遍推理强度。
    - 全局自定义指令明确仅供 ChatGPT / Qwen 使用，避免被当作发送给 Agent 的任务内容。
    - 完善多 Agent 任务交接、会话展示及相关执行状态处理。
    - 修复带引号的 Codex 可执行文件路径识别，并改进 app-server 启动失败提示。
    更新后请在 ChatGPT 刷新 Codex Bridge 插件，以加载新版工具定义。
    macOS 包为 ad hoc 签名；Windows 安装器未附 Authenticode 签名。
