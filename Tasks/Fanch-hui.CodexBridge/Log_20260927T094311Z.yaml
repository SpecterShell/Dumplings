  Key: ReleaseNotes
  Value: |-
    Codex Bridge 1.3.0
    - 新增 Pi 与 Qoder 接入，支持本机安装发现、模型与会话管理、任务续写、MCP 和 Skills。
    - Qoder CN 与国际版使用各自地区的 CLI、SDK 和原生会话；模型与权限设置按地区保存。
    - 新增 Qoder 原生权限模式设置：请求批准、帮我批准、允许完全访问。Bridge 项目读写和网络限制继续生效。
    - macOS Codex 自动发现支持新版 ChatGPT/Codex App 内嵌 CLI，同时保留旧版安装路径兼容。
    - 工作台为失败或中断任务恢复重试入口，并保留原任务附件；修复续写消息在会话记录中重复显示。
    - 修复 Qoder 初始化事件处理和连接失败原因展示，改善任务执行及故障排查。
