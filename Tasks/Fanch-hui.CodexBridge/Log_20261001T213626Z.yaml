  Key: ReleaseNotes
  Value: |-
    Codex Bridge 1.3.3
    - ChatGPT 可查询其他已连接 Agent 的模型列表，支持按安装记录和项目目录获取真实模型能力。
    - 修复远端任务提交超时中断 Agent 启动、任务持续停留在“正在启动”的问题。
    - 原生会话目录查询明确区分能力不支持、暂不可用和会话不存在，避免统一返回 internal_error。
    - 插入对话和续写在点击发送时立即显示消息、清空输入框；发送失败提供原因并恢复可重发输入。队列消息在实际派发时进入对话。
    - 会话按持续对话呈现，可继续的空闲会话显示“已创建”。
    - 加强更新前后的 ChatGPT 插件刷新提醒，使用醒目的颜色、更大的文字，并延长升级后的提示时间。
    更新后请在 ChatGPT 的插件设置中刷新 Codex Bridge，让新工具和模型列表生效。
