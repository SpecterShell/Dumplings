  Key: ReleaseNotes
  Value: |-
    What's Changed
    - linux: fix detection of system package installs by @dylanmtaylor in https://github.com/storytold/craft-launcher/pull/99
    - Add Linux riscv64 release build and switch runners to Ubuntu 26.04 by @dylanmtaylor in https://github.com/storytold/craft-launcher/pull/102
    - Automatically download and install updates when available by @dylanmtaylor in https://github.com/storytold/craft-launcher/pull/94
    - Check for launcher updates on launch and prompt to relaunch by @dylanmtaylor in https://github.com/storytold/craft-launcher/pull/96
    - Match running app paths literally by @Benziza in https://github.com/storytold/craft-launcher/pull/81
    - linux: prefer Flatpak if available and support host execution from Flatpak sandbox by @dylanmtaylor in https://github.com/storytold/craft-launcher/pull/89
    - Show GitHub's limit notice only while it actually holds details back by @itrycodinganditsbad in https://github.com/storytold/craft-launcher/pull/53
    - Use the system proxy for GitHub and downloads by @itrycodinganditsbad in https://github.com/storytold/craft-launcher/pull/58
    - macOS: install only apps signed by the Craft team, at the release's v… by @s17sh70x2jfl031ag in https://github.com/storytold/craft-launcher/pull/51
    - Pick the Linux package format from os-release, not from tools on PATH by @itrycodinganditsbad in https://github.com/storytold/craft-launcher/pull/56
    - Find AppImages outside ~/Applications and add a menu entry when installing one by @itrycodinganditsbad in https://github.com/storytold/craft-launcher/pull/57
    - Add a German interface by @Musiker15 in https://github.com/storytold/craft-launcher/pull/71
    - Add a French interface by @Byxis in https://github.com/storytold/craft-launcher/pull/85
    - Add Brazilian Portuguese (pt-BR) UI localization by @onicafe in https://github.com/storytold/craft-launcher/pull/92
    - fix(wgpu): prefer D3D12 (incl. WARP) over GL on Windows by @mjohnson7cd in https://github.com/storytold/craft-launcher/pull/105
    - Fix "Show in Explorer" opening Documents instead of the app's folder by @itrycodinganditsbad in https://github.com/storytold/craft-launcher/pull/54
    - Quit from the tray even when the window is minimized and gets no frames (#31) by @MarekSpodBiedry in https://github.com/storytold/craft-launcher/pull/77
    - Let a newer launcher take over from an older one that's already running by @itrycodinganditsbad in https://github.com/storytold/craft-launcher/pull/59
    - Add an option to install Craft apps from local repos instead of GitHub by @khutchings in https://github.com/storytold/craft-launcher/pull/64
    - Keep the footer's rate-limit notice clear of the links by @itrycodinganditsbad in https://github.com/storytold/craft-launcher/pull/55
    - macOS: open disk images reliably, and say why when they won't open; 0.2.1 by @bflatastic in https://github.com/storytold/craft-launcher/pull/135
