  Key: ReleaseNotes
  Value: |-
    Note
    FreeBSD aarch64 is dropped from this release. We had to cut releases, and we cannot build this target within the 5-hour CI limit for any of the Craft apps, so we are dropping it for now. This is a known blocker, flagged for a future fix in storytold/craft-common-actions#39. FreeBSD x86_64 and every other platform are included.
    What's Changed
    - fix(windows): retry busy download renames and log Windows Installer runs by @benandez in https://github.com/storytold/craft-launcher/pull/687
    - security: enforce HTTPS on curl downloads (SonarCloud S6506) by @dylanmtaylor in https://github.com/storytold/craft-launcher/pull/746
    - ci: pin GitHub Actions to full commit SHA (SonarCloud S7637) by @dylanmtaylor in https://github.com/storytold/craft-launcher/pull/745
    - README: the app icon above the title by @bflatastic in https://github.com/storytold/craft-launcher/pull/759
    - fix(windows): read a portable app's version without starting PowerShell by @dotCooCoo in https://github.com/storytold/craft-launcher/pull/743
    - security: confine release/feed download URLs and bind installed artifact version by @dylanmtaylor in https://github.com/storytold/craft-launcher/pull/747
    - Use jiff instead of hand-rolled UTC conversion by @dylanmtaylor in https://github.com/storytold/craft-launcher/pull/726
    - security: reject shell metacharacters in opened web links (WSL cmd.exe injection) by @dylanmtaylor in https://github.com/storytold/craft-launcher/pull/751
    - fix(windows): self-update runs no PowerShell and installs only files signed like the launcher by @dotCooCoo in https://github.com/storytold/craft-launcher/pull/742
    - security: bound decoded feed size, screenshot dimensions, and locale tag matching by @dylanmtaylor in https://github.com/storytold/craft-launcher/pull/748
    - security: harden local install and packaging against filesystem attacks by @dylanmtaylor in https://github.com/storytold/craft-launcher/pull/749
    - security: authenticate single-instance replace and bound the local mirror server by @dylanmtaylor in https://github.com/storytold/craft-launcher/pull/750
    New Contributors
    - @benandez made their first contribution in https://github.com/storytold/craft-launcher/pull/687
    - @dotCooCoo made their first contribution in https://github.com/storytold/craft-launcher/pull/743
    Full Changelog: https://github.com/storytold/craft-launcher/compare/v0.6.1...v0.7.0
