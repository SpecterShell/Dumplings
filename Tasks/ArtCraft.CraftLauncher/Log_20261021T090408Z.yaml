  Key: ReleaseNotes
  Value: |-
    Note
    FreeBSD aarch64 is dropped from this release. We had to cut releases, and we cannot build this target within the 5-hour CI limit for any of the Craft apps, so we are dropping it for now. This is a known blocker, flagged for a future fix in storytold/craft-common-actions#39. FreeBSD x86_64 and every other platform are included.
    What's Changed
    - Skip CodeRabbit reviews on Dependabot PRs by @echelon in https://github.com/storytold/craft-launcher/pull/676
    - Fix saved filters hiding all apps on startup (#678) by @skylartaylor in https://github.com/storytold/craft-launcher/pull/684
    - fix: address issue #388 by @Felix-Helleckes in https://github.com/storytold/craft-launcher/pull/677
    - fix(freebsd): pick the aarch64 tarball on FreeBSD aarch64; steady the pipe-deadline test by @echelon in https://github.com/storytold/craft-launcher/pull/675
    - fix: address issue #649 by @Felix-Helleckes in https://github.com/storytold/craft-launcher/pull/663
    New Contributors
    - @skylartaylor made their first contribution in https://github.com/storytold/craft-launcher/pull/684
    - @Felix-Helleckes made their first contribution in https://github.com/storytold/craft-launcher/pull/677
