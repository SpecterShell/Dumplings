  Key: ReleaseNotes
  Value: |-
    What's Changed
    - Verify HTTPS certificates with the OS instead of a copy of its root store by @itrycodinganditsbad in https://github.com/storytold/craft-launcher/pull/43
    - Default wgpu to Direct3D 12 on Windows to fix startup crash on hybrid AMD laptops by @JeremyYao in https://github.com/storytold/craft-launcher/pull/18
    - UI tests: stop the intermittent segfault in parallel runs by @Nael-Nathanael in https://github.com/storytold/craft-launcher/pull/17
    - Centre the app name and tagline on the icon in the grid and the table by @Nael-Nathanael in https://github.com/storytold/craft-launcher/pull/11
    - Stay in the tray on Wayland when the window closes by @Nael-Nathanael in https://github.com/storytold/craft-launcher/pull/8
    - Keep the verified download when the install step fails by @Nael-Nathanael in https://github.com/storytold/craft-launcher/pull/9
    - Queue system installs so several apps can install at once by @Nael-Nathanael in https://github.com/storytold/craft-launcher/pull/10
    - Add UI localisation (i18n) with a Russian catalog by @MaksPV in https://github.com/storytold/craft-launcher/pull/28
    - Add Simplified Chinese (简体中文) UI with embedded CJK fonts by @Flowershangfromthebranches in https://github.com/storytold/craft-launcher/pull/34
