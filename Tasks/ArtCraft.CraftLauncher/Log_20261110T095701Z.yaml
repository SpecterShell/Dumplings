    What's Changed
    - Update all apps behind one permission prompt on Linux and Windows by @mergenchik in https://github.com/storytold/craft-launcher/pull/1235
    - Add MailCraft as a community app by @benandez in https://github.com/storytold/craft-launcher/pull/1360
