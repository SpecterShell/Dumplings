    本更新包含了对 Yggdrasil Connect 的支持，并提供了针对多个问题的错误修复，建议所有 Beta 版用户安装。
    This update contains support for Yggdrasil Connect and provided bug fixes for multiple issues and is recommended for all Beta users.
    2.15.1-beta.1 更新一览(2026-09-04)
    🚀 功能追加
    - mod: 内嵌模组(Jar-in-Jar)自动解析与崩溃导出 (#3378)
    - setup: 添加“停止使用 PCL CE”功能 (#3433)
    - minecraft: 针对 Modrinth 添加下载原因追踪功能 (#3478)
    - i18n-banner: 添加 i18n 贡献标语横幅 (#3489)
    - i18n-banner: 在语言设置横幅中添加翻译平台入口 (#3560)
    🐛 问题修复
    - 26.x 版本 mc 启动时，缺失 Java 提示的弹窗始终为 Java1 (#3435)
    - 修正服务器玩家列表 tooltip 触发位置 (#3434)
    - network: 限制下载分块数与内存缓冲区上限，防止大文件下载导致内存溢出 (#3462)
    - 修复正版验证更改皮肤后头像不显示 (#3466)
    - launch-right: 改用 Path.Combine 拼接 hints.txt 路径 (#3476)
    - Cleanroom 实例下载模组不会自动选择当前实例 (#3461)
    - Install: 在 26.x 安装 optifine 时的若干问题 (#3477)
    - 下载页面侧边栏动画错误 (#3482)
    - 版本识别功能修复 (#3458)
    - instance-install: 修复实例设置中 OptiFine 卡片错误展开 (#3491)
    - modpack: 安装 MCBBS 整合包时 JVM 参数处理有误 (#3499)
    - setup-launch: Reload 时同步内存滑块可用状态 (#3553)
    - mod-setup: 标题栏居左设置不跟随标题栏样式选项切换 (#3572)
    - login-auth: 仅在确认支持 OAuth 时显示登录入口 (#3594)
    🚜 重构
    - quilt: 移除 Quilt 支持 (#3432)
    - 重构档案系统 (#3561)
    - tcp-forward: 重构 TCP 转发代码，让转发工作更加稳健 (#3593)
    👀 优化改进
    - 使“打包 PCL CE”不再被默认勾选 (#3445)
    🌐 国际化
    - en-GB: 添加 en-GB.xaml (#3484)
    - zh-TW: 添加 zh-TW.xaml (#3483)
    ⚙️ 其他改动
    - deps: 更新 bundle_e_sqlite3 包以修复漏洞 (#3414)
    - Update mcmod.buf (#3492)
    - Readme: Update star history chart link in README (#3569)

