- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    ✨ Features
    - Terminal-suggest shell completions — Lumina now taps the shell's own completion engine (zsh via a compadd recording shim, fish via complete -C) and shows its candidates in a floating popup at the cursor, with kind icons for folders, files, commands, and options. Tab accepts and re-triggers (directories cascade into the next level), typing narrows the list, and a lone candidate completes silently. The shell remains the single source of truth — no bundled completion database
    - Completion as you type (experimental) — A new setting (off by default) requests completions automatically after a typing pause, no Tab needed. Requests only fire while you're sitting at a prompt — never injected into a running command — and dismissing the popup cancels pending requests and in-flight offers
    - Persistent completion cache — Fetched completion sets are indexed per line context and persisted per profile (completion-cache.json), so the popup re-opens instantly for contexts you've already used, surviving restarts and same-profile tabs. Entries are trusted for 7 days; an explicit Tab is the refresh escape hatch
    - Append Space on Completion — An accepted completion now leaves a trailing space (directories excluded) so the cursor lands ready for the next argument. On by default, configurable in Settings → General
    ⚡ Performance
    - Completion requests are debounced tighter (150 ms → 100 ms) and warm-cache hits less than 60 s old now skip the correction request entirely — every in-band completion Tab briefly stalls the shell's echo, so cutting redundant ones keeps typing responsive
    🐛 Bug Fixes
    - Pressing Tab on a completely empty line no longer pops up the shell's full "everything" list as noise, while an empty word after a command (gh + Tab) still lists its subcommands
    - The completion popup now anchors to the live cursor position instead of appearing at a stale spot and jumping, with a restyled surface
    🎨 Polish
    - The session-save dialog's checkbox now reads "Don't ask this again" instead of "Remember this choice", making it clearer what checking it does (by @Keyneswu)
    🔧 Chores
    - Shell integration scripts moved from one inline Rust blob into per-shell source files (bash/, zsh/, fish/) for maintainability
    - Patch files are kept LF on checkout so pnpm patch no longer fails to parse them under CRLF on Windows CI
    - Expanded diagnostic logging across launchers, the file manager, title bar, and update flow to make issue reports easier to act on
    Full Changelog: https://github.com/iewnfod/lumina-terminal/compare/v0.3.2...v0.4.0
