- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    ✨ Features
    - Double-click to maximize — Double-clicking any drag region (title bar, sidebar header, empty-state page) now toggles maximize/unmaximize. The toggle is handled app-side instead of Tauri's built-in drag-region behavior, which is flaky on some platforms (tauri#11945/wry#622), and double-clicks on interactive children like title-bar buttons or profile rows never trigger it
    ⚡ Performance
    - Faster, jump-free startup window sizing — Terminal cell metrics are now cached (keyed by font family, size, weight, style, letterSpacing, lineHeight, and device pixel ratio), so a launch with unchanged fonts sizes the main window straight from cached numbers instead of spawning an off-screen measurement terminal. With warm caches the window is sized while still hidden and shown once at its final size — no more visible show-then-resize jump — and a restored window size skips re-sizing entirely; the first cold launch measures once and warms the cache for every launch after
    🔧 Chores
    - Consolidated runtime state into a state/ folder — Session, profile-recency, metrics-cache and tear-off files (plus the backend MCP token) now live under a single state/ subfolder of the app data dir, leaving the root holding only user-facing content like config.toml and themes/. Existing files are migrated automatically on first launch, so saved sessions and the recency map survive the upgrade untouched
    Full Changelog: https://github.com/iewnfod/lumina-terminal/compare/v0.3.1...v0.3.2
