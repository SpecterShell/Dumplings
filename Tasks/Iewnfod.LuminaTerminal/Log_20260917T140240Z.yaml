- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    ✨ Features
    - Compact autocomplete labels for paths — Path candidates in the autocomplete popup now display only their last component, so docs/notes/notes.txt shows as notes.txt. The typed command line already carries the path prefix and full paths were overflowing the popup row; non-path candidates (commands, options) pass through unchanged
    🐛 Bug Fixes
    - Fixed accepting a zsh candidate containing spaces (e.g. My File.txt) inserting it raw and splitting the argument into multiple shell words — the completion hook now applies the same shell quoting the real compadd would, and the completion cache index was versioned so stale unquoted entries start fresh
    - Fixed zsh's internal matcher probes leaking bare path segments as standalone candidates — accepting notes.txt for cat a/b/n<TAB> used to drop the directory part of the path
    - Fixed window chrome (TitleBar, Settings, About, UpdateModal) rendering black on startup when a light/dark theme mode is forced and no tab exists yet — the effective theme is now built from the forced background from the first render
    - Fixed text selection becoming nearly invisible when a light-designed profile theme is repainted onto a forced dark background (or the reverse) — the selection overlay now follows the applied background's polarity, and the default selection alpha was raised from 0.3 to 0.4 for better contrast on dark backgrounds
    - Newly added shortcut rows now appear at the top of the shortcuts list and enter key recording immediately, instead of being appended out of view at the bottom
    🎨 Polish
    - The keyboard shortcuts page now has a single dedicated edit button per row — the displayed key combo is plain text rather than a clickable chip, matching the updated "Click the edit button" hint
    - The "Wrap as App" toggle label in profile settings now shows a pointer cursor
    Full Changelog: https://github.com/iewnfod/lumina-terminal/compare/v0.4.0...v0.4.1
