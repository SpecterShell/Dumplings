- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    🐛 Bug Fixes
    - Proxy env now reaches terminals launched with a startup command — A profile (or CLI flag) that starts with a command used to run entirely outside your proxy: the -c command executes before the first prompt, so the pre-prompt proxy hooks never fired and tools like curl, git, or package managers ignored the configured proxy. Lumina now injects the current proxy env-file vars (http_proxy/https_proxy/all_proxy/no_proxy, both cases) straight into the PTY environment at spawn time. Parsing is strictly allowlisted to the managed keys, so a hand-edited or corrupted env file cannot smuggle arbitrary env vars (PATH=, LD_PRELOAD=…) into the shell. This is a spawn-time snapshot — hot proxy changes still only reach plain interactive tabs
    🎨 Polish
    - The search shortcut (Ctrl+F by default) now always focuses the search bar instead of toggling it closed when it's already open — only Escape or the ✕ button dismisses it
    - Escape now closes the search bar from anywhere inside it (including a focused option button), not just from the input field
    Full Changelog: https://github.com/iewnfod/lumina-terminal/compare/v0.3.0...v0.3.1
