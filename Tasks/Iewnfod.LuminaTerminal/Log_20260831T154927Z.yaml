- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    ✨ Features
    - Wrap a profile as an app — Any profile can now generate a real desktop launcher that opens it in its own window: a Linux .desktop entry, a macOS .app bundle, or a Windows Start-Menu shortcut, each with its own title, working directory, sidebar visibility, and icon (auto-derived from the startup command, or picked manually via the new shared icon picker). Launchers regenerate on every settings save and orphaned ones prune themselves. Configure per profile in Settings → Profiles
    - Copy, select-all & paste bindings — Ctrl+Shift+C/Cmd+Shift+C, Ctrl+Shift+A, and Ctrl+Shift+V now work out of the box as rebindable actions, replacing the hard-coded copy handler and the copyWithCtrl swap setting. Copy with nothing selected falls through to the shell, so even a copy rebound to plain Ctrl+C stays SIGINT-safe; paste goes through xterm's bracketed-paste path, and clipboard reads use the native plugin because WKWebView/WebKitGTK reject navigator.clipboard reads
    -  --sidebar show|hide launch flag — Overrides sidebar visibility for a single launch without overwriting the stored setting (the first explicit toggle drops the override). Unlike the tab-shaping flags, it does not affect tab seeding or skip session restore
    🐛 Bug Fixes
    -  -e/--command parsing — Previously everything after -e was swallowed verbatim, so Lumina's own flags could never follow the command. Now -T/--title, --hold, --working-directory, --profile, and --sidebar after -e parse as flags again (lumina-terminal -e nvim -T nvim works), while unknown dash tokens (grep -n), repeated -e (grep -e pat), and --help remain command data — and -- forces fully verbatim capture for commands using the same spellings (-e -- ssh -T host)
    🎨 Polish
    - Tolerant color-spread edge detection — The background bleed for fullscreen TUIs (vim, htop, lazygit…) no longer cancels when a single edge cell differs: a dominant color covering ≥90% of the sampled edge cells now wins, so a differently-colored statusline segment or characters touching the edge no longer leave a theme-colored border around the canvas
    🔧 Chores
    - Fixed the AUR publish trigger workflow: the repository-dispatch endpoint requires contents: write rather than actions: write, which had been causing 403s after release-triggered permission stripping
