- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新增功能
    - 新增「设置 → 通用设置 → 窗口 → 大纲位置」选项：默认以「文件 / 大纲」标签切换，也可在文件列表下方同时显示当前文档大纲；切换文件后自动更新，两个区域独立滚动。
    修复问题
    - 隐藏多文档标签栏的滚动条，保留横向滚动、快捷键切换及选中标签自动滚入可视区域的能力。
    - 更新检查改为读取官网静态 latest.json，不再占用 GitHub REST API 的匿名额度；安装包仍从 GitHub Releases 下载。
    优化改进
    - 自动更新检查间隔调整为 6 小时，缓存保存到应用数据目录并在多窗口间共享；手动检查支持刷新，1 分钟内合并重复请求。
    - 官网与客户端共用静态更新清单；每次发布后自动生成，发布信息读取失败或安装包未齐备时停止部署，保留上次成功的线上版本。
