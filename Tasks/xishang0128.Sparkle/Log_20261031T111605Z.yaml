  Key: ReleaseNotes
  Value: |-
    - 新增 macOS 和 Linux 网关模式，以及网关侧边栏设置。
    - 新增 Webhook 操作通知。
    - 优化网关卡片布局和设备数量展示；去重网关状态消息，并在禁用网关警告时隐藏相关警告。
    - 重启服务后会重新启动核心；自定义核心和系统核心不再执行服务加固。
    - 修复文件读取失败时误保存，以及订阅更新间隔异常导致反复刷新的问题。
    - 修复 Monaco 在模态框中的上下文菜单交互和查找框样式冲突。
    - 修复开关滑块位置，以及拖动配置档案卡片时布局偏移的问题。
    - 优化服务模态框状态布局；侧边栏展开时应用主题效果，并支持悬停展开图标侧边栏。
    - 保留自动网关选择。
