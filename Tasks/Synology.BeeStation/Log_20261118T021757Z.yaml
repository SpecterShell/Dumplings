Version: 1.5.0-701
Installer:
- Architecture: x64
  InstallerUrl: https://global.synologydownload.com/download/Utility/BeeStationClient/1.5.0-0701/Windows/BeeStation-1.5.0-0701.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    What's new
    - Added an account menu to the tray panel, allowing users to switch between BeeStation devices, manage their accounts, or sign out.
    - Added a connection indicator to the top bar that provides tips for improving transfer speeds when connected remotely.
    - Added a "Help" tab in "Settings", with links to the Knowledge Center, support tickets, and debug log export.
    - Added an option to create albums from subfolders when transferring folders from a computer.
    Fixed issues
    - Fixed an issue where syncing on Windows devices would pause and display an error if a "Stream My Files" folder contained a folder synced by another cloud service.
    macOS
    - Added continuous backup of the macOS Photos library to BeePhotos, along with a "Back up now" option to manually start a backup once the current backup task is complete.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    最新功能
    - 在系统匣面板中新增帐户选单，使用者可以切换 BeeStation 装置、管理帐户或登出。
    - 在顶部栏新增连线指示器，以提示如何在远端连线时提升传输速度。
    - 在「设定」中新增「说明」分页，提供知识中心、技术支援表单及除错日志汇出的相关连结。
    - 新增从电脑传输资料夹时，可从子资料夹建立相簿的选项。
    问题修复
    - 修正当「串流我的档案」资料夹包含由其他云端服务同步的资料夹时，Windows 装置上的同步作业会暂停并显示错误的问题。
    macOS
    - 新增将 macOS 照片图库持续备份至 BeePhotos 的功能，以及「立即备份」选项，可在目前的备份任务完成后手动启动备份。
ReleaseTime: 2026-11-10
