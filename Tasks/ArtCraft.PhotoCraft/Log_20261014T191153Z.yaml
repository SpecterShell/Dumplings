    - TIFF: write and read EXIF as the file's own Exif and GPS directories by @switch87 in https://github.com/storytold/photocraft/pull/4876
    - fix(gpu): contain errors in unwatched compositor work by @haranishi in https://github.com/storytold/photocraft/pull/4894
    - Deep EXR: open cropped renders on their full display-window stage by @Elvis33LE in https://github.com/storytold/photocraft/pull/4907
    - Stroke layer effect: the outer edge stays round at wide sizes (#3646) by @dottedt in https://github.com/storytold/photocraft/pull/3650
    - Stroke latency trace: PHOTOCRAFT_STROKE_TRACE times each frame of a brush stroke (#1343) by @tanish2k09 in https://github.com/storytold/photocraft/pull/4403
