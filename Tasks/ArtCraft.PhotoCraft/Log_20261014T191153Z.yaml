    - panic_hunt: count panics that Session::execute contains (#4982) by @prekabreki in https://github.com/storytold/photocraft/pull/5219
    - Drop shadow: knocked out beneath the whole shape when the layer's mode blends with it by @Deeev201 in https://github.com/storytold/photocraft/pull/5304
    - Layer masks: Reveal Selection drops the selection, as Photoshop does by @abc2cb in https://github.com/storytold/photocraft/pull/5251
