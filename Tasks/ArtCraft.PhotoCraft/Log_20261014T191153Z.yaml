    - Return channel copy allocation errors while keeping the clipboard by @vbasky in https://github.com/storytold/photocraft/pull/4587
    - Check selection modification limits before reading the canvas mask by @vbasky in https://github.com/storytold/photocraft/pull/4591
    - Background: an opacity, fill, blend mode or Select and Mask layer mask makes it Layer 0 by @switch87 in https://github.com/storytold/photocraft/pull/4837
    - Fibers: fill an empty layer, as Photoshop does (#5241) by @switch87 in https://github.com/storytold/photocraft/pull/5289
    - Object Selection: say so when the sampled layer is empty (#5246) by @switch87 in https://github.com/storytold/photocraft/pull/5298
    - layer.setProps: refuse opacity and fill outside 0..1 (#5242) by @switch87 in https://github.com/storytold/photocraft/pull/5291
