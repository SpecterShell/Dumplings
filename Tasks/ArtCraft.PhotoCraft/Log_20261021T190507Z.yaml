  Key: ReleaseNotes
  Value: |-
    Scorecard since v0.11.1
    From docs/scorecard.md (done / partial / missing):

    | Area               | v0.11.1     | v0.12.0    |
    | ------------------ | ----------- | ---------- |
    | Tools              | 33 / 11 / 0 | 36 / 8 / 0 |
    | File compatibility | 7 / 14 / 6  | 9 / 12 / 6 |
    | Type               | 4 / 3 / 2   | 5 / 3 / 1  |
    | Workspace and UI   | 13 / 6 / 4  | 13 / 7 / 3 |
    | Open bugs          | 29 / 2 / 1  | 31 / 1 / 0 |

    - Now done: Content-Aware Move with a coarse-then-exact preview for large selections; shape Density/Feather and mask Density/Feather in Properties; Export As Nearest Neighbor resample; large-file fixtures (20 MP, 150 layers, 2 GB PSD, 4 GB PSB); Warp Text opens with the layer's warp and previews live; retouch-tool mask/channel targeting tests; selection modifiers pressed before the drag.
    - Moved up: Alt+wheel zoom (missing → partial); live stroke preview now covers Pattern Stamp, Background Eraser and Color Replacement; Smart Filters map 41 filters to PSD (was 14); tool options and per-tool brushes persist across restarts.
    - Settings that do nothing: 24 of 171 (was 25 of 169).
    - Performance: no change to the 2026-10-05 baseline (3 within budget, 22 over). Added scenarios P20, P62 and P63 (2 GB PSD, 4–5 GB PSB, 3.1 GP New Document), not run yet.
    - Corpus floors: unchanged.
    FreeBSD aarch64 is not in this release: the shared release pipeline dropped it for every Craft app until it builds in time (storytold/craft-common-actions#40). FreeBSD x86_64 is included.
