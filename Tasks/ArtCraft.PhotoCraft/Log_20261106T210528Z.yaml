    - Move tool: History names its steps Move, Nudge and Duplicate as the reference does (#11383) by @TrevorBrown-dev in https://github.com/storytold/photocraft/pull/11443
    - Marquee: with no selection, Shift and Alt held from the press constrain the shape (#11389) by @Hamza0101 in https://github.com/storytold/photocraft/pull/11449
    - Menus: Combine Shapes, Open Recent, Arrange and Proof Setup items carry the reference's names (#11399) by @TrevorBrown-dev in https://github.com/storytold/photocraft/pull/11455
    - Crop: fill the active layer and Background with Content-Aware Fill by @yoriswind in https://github.com/storytold/photocraft/pull/11458
