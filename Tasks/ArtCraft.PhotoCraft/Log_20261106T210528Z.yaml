    - Menus: View › Guides submenu in the reference's order, with Edit Selected Guides and Clear Selected Guides (#11400) by @TrevorBrown-dev in https://github.com/storytold/photocraft/pull/11497
    - Layers panel: a right-click on the empty area opens the reference's menu (#11404) by @TrevorBrown-dev in https://github.com/storytold/photocraft/pull/11500
    - The document tab's right-click menu lists the reference's eight entries in order, with its two separators (#11403) by @TrevorBrown-dev in https://github.com/storytold/photocraft/pull/11502
    - Layer > Smart Objects says Reveal in Explorer, Embed Linked and Embed All Linked, in the reference order, without the Warp rows (#11401) by @TrevorBrown-dev in https://github.com/storytold/photocraft/pull/11503
    - Select and Mask: E switches the tool mode between add and subtract (#11402) by @TrevorBrown-dev in https://github.com/storytold/photocraft/pull/11511
    - Shift+letter cycles a tool group in toolbar order and the anchor point tools no longer take the letter P (#11376) by @TrevorBrown-dev in https://github.com/storytold/photocraft/pull/11521
