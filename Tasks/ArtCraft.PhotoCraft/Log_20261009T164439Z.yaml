    - Automation: an allowed command can't run a denied one on its behalf by @tanish2k09 in https://github.com/storytold/photocraft/pull/861
    - Variables dialog: malformed entries can't crash an edit by @tanish2k09 in https://github.com/storytold/photocraft/pull/875
    - Layers panel: drop layers on the footer's New Layer, New Group and Delete buttons (#736) by @echelon in https://github.com/storytold/photocraft/pull/965
    - Crop tool starts with a frame around the canvas (or the selection), as in Photoshop (#668 item 7) by @echelon in https://github.com/storytold/photocraft/pull/971
    - Type: ⌘/Ctrl+T while typing shows or hides the Character panel (#668 item 15) by @echelon in https://github.com/storytold/photocraft/pull/983
    - Shape tools: Shift and Alt pressed during the drag constrain it, as in Photoshop (#668 item 12) by @echelon in https://github.com/storytold/photocraft/pull/984
    - Layer via Copy, Copy and Cut read only the selected area: 33× faster on 24 MP (#668 item 18) by @echelon in https://github.com/storytold/photocraft/pull/985
    - Windows: selection and other crosshair tools stay visible over grey (#737) by @echelon in https://github.com/storytold/photocraft/pull/954
    - Clone Stamp / Healing Brush: the source crosshair shows only while painting (#668 item 10) by @echelon in https://github.com/storytold/photocraft/pull/969
    - Preferences: colour settings take a typed #rrggbb value (#668 item 2) by @echelon in https://github.com/storytold/photocraft/pull/1001
    - macOS: use the native menu bar instead of the in-window menus (#887) by @brennanMKE in https://github.com/storytold/photocraft/pull/894
    - README: Downloads section listing every release build by @echelon in https://github.com/storytold/photocraft/pull/1210
    - README Downloads: where to get it, then builds (Windows first) by @echelon in https://github.com/storytold/photocraft/pull/1219
    - Release workflow: only signing and draft-release jobs use the release environment by @echelon in https://github.com/storytold/photocraft/pull/1220
