  Key: ReleaseNotes
  Value: |-
    - Added a dark themed UI
    - Added a feature to show the EXIF metadata in PSD files
    - Added a feature to show the compressed metadata in JXL files
    - Added support for Ultra HDR HEIC format
    - Improved program UI/UX design
    - Improved the background color personalization
    - Updated the third-party libraries to their latest versions
    - Added a Bookmark Manager
    - Added a feature to save the image currently visible in the viewer as it is (Ctrl+Alt+S)
    - Improved the support for SVG format
    - Improved the loading speed for animated GIF, WebP, and AVIF formats
    - Fixed an issue that SDR colors are displayed incorrectly for some HEIF images
    - Improved program stability
    - Fixed a vulnerability that occurs with RAW files (KVE-2026-1707, CVE-2026-21413)
    - Fixed a vulnerability that occurs with HEIF files (KVE-2026-1708, KVE-2026-1706)
    - Fixed a vulnerability that occurs with JXR files (KVE-2026-1713)
    - Improved the support for RAW formats
    - Other modifications
