  Key: ReleaseNotes
  Value: |-
    Spotifast 0.11.2 puts the new icon everywhere the app shows its logo, makes pasting work again on Hyprland, keeps running when a computer has no audio output, and keeps desktop media controls in step with the volume.
    Download Spotifast: Mac · Windows · Windows ARM · Linux · Linux ARM · Flatpak

    The sign-in card, before and while connecting (demo content).
    Fixed
    - The new icon is on every screen. 0.11.1 refreshed the app icon, but the sign-in and connecting card and Settings → About still drew the old flat disc. They now show the same icon as the app, the window and the tray, and the built-in Winamp skin's logo button and About mark have its polished look too. By @crmne.
    - Pasting works again on Hyprland. Ctrl+V and Paste in the text menu did nothing on Hyprland, such as on Omarchy, in every field, including the Client ID. By @crmne; thanks @fgrehm. (#614)
    - No audio output no longer closes Spotifast. On a computer without an output device, for example a new PC still missing its audio drivers, pressing play closed the app without a word. The song now pauses with a message saying no audio output device was found, in your language, and Spotifast stays open to play on another Spotify Connect device. By @crmne; thanks @spencernaugler7. (#623)
    - Desktop media controls keep up with the volume. Changing the volume from your desktop's media controls on Linux could leave them showing the old level. By @rosset-nocpes. (#599)
    Known limitations
    - On Wayland, dropping a file on the window, such as a .wsz skin, is not available for now: it took the clipboard from the rest of the app on Hyprland. Put skins in the skins folder that Settings opens instead. X11, macOS and Windows are unaffected.
    Thanks
    @rosset-nocpes, @spencernaugler7, @fgrehm, and everyone who reported problems after 0.11.1.
    Full changelog: https://github.com/crmne/spotifast/compare/v0.11.1...v0.11.2
