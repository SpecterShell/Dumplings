Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Unsloth has gotten major performance upgrades!
    Highlights
    - Large perf gains: all Unsloth UI/UX faster - up to 10x for multiple chats
    - Up to 5x faster inference: 95% cache hit rate, MoE Strata style fixes, slowdown fixes
    - Better Compaction - works for all API + better UI handling
    - Drag and drop files: Desktop drops work again, with more than 3× as many supported document formats.
    - Browser use with scripts: click, move the mouse, drag, run approved scripts and set per-site browser rules.
    - LTX-2.5 + Wan2.2 + Faster image LoRA training: new video generation, image-to-video and faster image training.
    - NVIDIA RTX Spark: now supported with our Windows ARM64 downloadables
    - Major Unsloth workflow upgrades: improved files, chat history, browser agent and document handling.
    - Improved hardware compatibility: Windows AMD, Intel XPU and CUDA/PyTorch fixes.
    - Faster image LoRA training with aspect buckets, fused AdamW and improved FP8/MXFP8 support.
    Performance
    - Large chat and training histories load in smaller batches, using less startup data and memory.
    - Follow-up replies start sooner in long GGUF chats, including conversations with many tool calls.
    - LTX-2.5 generation runs faster with the default two-stage settings when memory permits.
    - Qwen3.5, Qwen3.6 and Qwen3.8 get faster prefill and speculative decoding with MLX.
    Browser use
    - Models can click at a point, move the mouse and drag page elements, including unlabelled targets such as canvases.
    - Run scripts on a page with your approval each time, or set Run scripts to Never in Settings > Browser.
    - Set per-site rules for unlabelled clicks, including Always allow for a site you trust.
    - Better handling of compressed pages, client-side navigation and delayed content in the web UI. Models can also fill date and time fields.
    - Pressing Enter in a form gets the same approval check as clicking its submit button.
    Images + video
    - Generate videos with LTX-2.5 from text or a start image, with synchronized audio. GGUF
    - Add a Start frame with Wan2.2-TI2V-5B, LTX-2 or LTX-2.3 to animate an image on the same loaded model.
    - Choose SDXL samplers and schedules on the Images page, and load v-prediction checkpoints correctly.
    - Crop image inputs before generation. Large photo uploads and ordinary video frame uploads resize automatically.
    Training
    - Image LoRA training uses fused AdamW by default on NVIDIA GPUs, with aspect-ratio buckets for new supported runs.
    - FP8 LoRA training for FLUX and Z-Image uses less memory on NVIDIA Ada, Hopper and Blackwell GPUs. MXFP8 handles aspect buckets on Blackwell with a compatible torchao stack.
    - Set Sample every on the Train tab to see preview images during supported image training and in run history.
    - Set caption dropout, LoRA dropout and checkpoint retention on the image Train tab. Random flipping is now opt-in.
    - Fine-tune AWQ models with LoRA using Transformers 5 and GPTQModel, and export INT4 QAT models as quantized weights.
    Chat + Desktop
    - Drag files into Desktop chat again, including more Office documents, templates, EPUBs, README files, dotfiles and media.
    - Upload supported PDF and Office documents up to 200 MB in the web UI.
    - Linked folders honor common .gitignore rules. Upload folders to project Sources from your browser, retry failed uploads and open completed sources.
    - Type /rewind, or choose Rewind from a message's More menu, to restore the conversation, tracked files in the chat folder, or both. Preview changes and undo a restore.
    - Use /compact in saved GGUF or MLX chats that support tools to compact context on the next message. Inline dividers mark compaction.
    - Download model-created files from tool results, and enable notifications when a background reply finishes.
    Models + settings
    - Use local models in VS Code Copilot Chat with unsloth start vscode.
    - Coding agents can use Unsloth over MCP with an account API key to load models, generate, train and export.
    - Choose a model download folder, and reveal or delete listed models from LM Studio, Ollama and your own folders.
    Hardware compatibility
    - Fix the PyTorch/Triton startup error on Windows AMD systems.
    - Intel XPU recognizes native BF16 on supported Arc and Data Center GPUs without intel-ocloc, with improved GPU selection on single-tile Linux hosts.
    - Avoid stale Triton launcher errors after switching Python versions on CUDA systems.
    - Improved low-VRAM Gemma 4 E2B loading, including host-memory offload on Windows and WSL.
