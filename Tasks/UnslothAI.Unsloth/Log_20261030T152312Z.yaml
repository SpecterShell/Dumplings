  Key: ReleaseNotes
  Value: |-
    Make Unsloth your own with custom backgrounds and a improved UI/UX. This release also cuts app update times and speeds up Linux app and Qwen-Image gen when VRAM is limited. Also new: DeepSeek-V4.1-Flash-1017 in Unsloth Dynamic v3.1 GGUFs (preview), FLUX.2-klein-9B on low-RAM machines, smoother chats and batched MoE fine-tuning.
    Highlights
    - Custom backgrounds to personalize your chats (more customization options coming next week)
    - DeepSeek-V4.1-Flash-1017 new Unsloth Dynamic v3.1 GGUFs (preview), the most accurate for their size on nearly all benchmarks Blog
    - 14 new languages for Unsloth
    - App updates finish twice as fast
    - Linux much less lag and improved performance
    - Qwen-Image renders up to 2x faster under a 16 GB VRAM limit
    - Updated interface with consistency and cleaner UI
    - MoE fine-tuning runs compatible API jobs together
    Customization and interface
    - Move the chat box to the bottom of new chats with Composer at the bottom in Settings > Chat.
    - Hide the greeting entirely for a simpler new-chat screen.
    - The Library gets shorter chat cards, clearer tooltips and consistent sort and filter icons.
    - Copy images between input slots by dragging a filled slot onto an empty one.
    - Pinned models stay saved across Unsloth Desktop restarts.
    - Each browser tab keeps its own unsent message.
    - Scrolling long chats is smoother on Linux with NVIDIA, X11 and driver 610+. Our high-resolution test improved from about 17 to 60 fps.
    Images and video
    - FLUX.2-klein-9B now loads and renders on Linux with 12.7 GB of system RAM and a supported GPU.
    - Qwen-Image-2512 renders up to 2x faster under a 16 GB VRAM limit.
    - Qwen-Image-Edit-2511 renders about 1.3x faster under the same limit.
    - MiniMax-H3 clips finish about 1.7x faster in our memory-limited NVIDIA test.
    Performance
    - App updates take about half as long by skipping Python precompilation. The tradeoff is a longer first launch afterwards, as before v0.1.912.
    - Long replies stream more smoothly, even with unfinished math formatting. Parsing an 83 KB reply with a stray $$ took 0.7 seconds instead of 71 seconds.
    - Previewing a 1 GB local Parquet file uses about 300 MB of peak memory, down from 1.5 GB.
    - Unsloth stays responsive as Transformers and MLX models finish loading.
    Chat and API
    - GGUF models reload in the background after a llama-server crash.
    - Failed or cancelled GGUF downloads leave your current model loaded.
    - Very long GGUF chats can compact and keep going.
    - Claude Code connected directly to a local GGUF reuses cached prompts across new sessions.
    - Rejected GGUF requests show llama-server’s explanation instead of a generic error.
    Mac
    - Claude Code, Codex and OpenCode requests can share an MLX batch. In our test, four simultaneous requests finished up to 2.3x faster.
    - Experimental Neural Engine Prefill processes prompts up to 31% faster in our Qwen3.8-27B-4bit test on M3 Max. It is opt-in and can slightly change replies.
    - Auto context starts GGUF models at no more than 65,536 tokens, reducing upfront memory use. You can still set a larger context manually.
    - Send LFM3-Audio or LFM3-Omni a voice clip on MLX and hear its answer alongside the text.
    Training
    - Compatible LoRA and QLoRA jobs on MoE models such as Qwen3.6-35B-A3B train together through the fine-tuning API, each with its own adapter.
    - Use via API on the Train page opens Python, JavaScript and curl examples for your setup.
    - Single-column text datasets are recognised automatically, with no manual column mapping.
