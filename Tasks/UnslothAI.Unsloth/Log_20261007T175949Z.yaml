  Key: ReleaseNotes
  Value: |-
    Turn any text or vision LLM into a Jev-style decision model in Unsloth, with decision accuracy going from 30% to 80%. Train, test, export and serve decision models directly from Unsloth. Also included: native ComfyUI models, diffusion improvements and a better Browser in Desktop.
    Highlights
    - Turn any model into a Jev-style decision model. Accuracy 30% to 80%
    - Load ComfyUI diffusion models natively in Unsloth
    - Faster + more accurate diffusion with INT8 ConvRot and more
    - Better Browser in Desktop with many bug fixes
    - Sandboxing with Bwrap for Linux, Seatbelt for Mac and MXC for Windows
    https://github.com/user-attachments/assets/92959172-d2a2-450b-a5bf-6369a1e5ae16
    Decision models
    - Train any text or vision LLM as a Jev-style decision model using QLoRA.
    - Test trained models directly from the Decision API settings.
    - Make decisions with confidence scores for every option.
    - Export Clef models with Qwen3.5 backbones and Laya models to GGUF.
    - Serve supported decision models through llama.cpp, including models that understand images.
    - Save and resume smaller adapter and decision-head checkpoints.
    - Guide at https://unsloth.ai/docs/basics/train-your-own-decision-model-with-unsloth
    Diffusion + ComfyUI
    - Run supported ComfyUI image and video models directly from Hugging Face.
    - Unsloth now recognises ComfyUI checkpoints and local model folders automatically.
    - Use your ComfyUI text encoders and VAEs in Unsloth.
    - Run Krea-2, HunyuanImage-2.1 and Wan2.2 expert pairs, plus ComfyUI NVFP4 and MXFP8 models.
    - Qwen-Image-2.1 now keeps more full-precision image detail with INT8 ConvRot enabled by default.
    - Faster Qwen-Image-2.1 ConvRot generation on supported NVIDIA GPUs.
    Training + performance
    - Train Qwen3.5-35B-A3B up to 4.1x faster and Qwen3-30B-A3B up to 3.3x faster with QLoRA on A100 and RTX PRO 6000.
    - Improved sample packing for gated-delta, Mamba2 and short-convolution models.
    - Train prompt and completion message lists as one conversation.
    - Vision datasets now keep each row's own question.
    - Chat exports and training data now include the system prompt.
    Browser + Desktop
    - Ask about open pages in the Desktop Browser.
    - Confirm Browser downloads and choose where files are saved.
    - Reorder pinned pages in the sidebar like chats.
    - Search continues past unusable results and can fall back to Wikipedia.
    - Reply citations such as [1] now open as links.
    - Pick, pin or unload RAG embedding models directly from the RAG menu.
    Sandboxing
    - Bwrap on Linux, Seatbelt on Mac and MXC on Windows sandbox code the model runs.
    - View sandbox status and choose protection levels in Settings.
