  Key: ReleaseNotes
  Value: |-
    This release introduces Qwen3.8-Flash-Next, polishes the Glass themes (now in Beta), adds a Composer position slider and lets models interact with files in the built-in browser. It also brings lower idle memory usage, preserved chat context when switching GGUF models, faster MLX loading and FP8 LoRA training.
    Highlights
    - Qwen3.8-Flash-Next Dynamic V3.1 - 10-15% extra accuracy Guide
    - Glass theme improvements across pages, menus, the sidebar and browser
    - Browser file interaction lets models click, read and edit HTML, files and pages
    - Lower idle memory with faster MLX loading and reloading
    - Preserved chat context when switching between GGUF models
    - FP8 LoRA training with lower GPU memory usage
    - Composer position slider to place the chat box anywhere on new chats
    Glass and appearance
    - Set the chat box position, from top to bottom, in Settings > Appearance > Composer.
    - Glass themes now have softer highlights, lighter shadows and improved frosted effects across menus, panels and the browser.
    - Pages like Library, Images and Train no longer heavily blur background images.
    - Open conversations now slightly dim the background and use denser glass for the composer.
    - Windows and Linux title bars better match Glass themes and background images.
    - Settings changes made in one browser tab now sync across other open tabs.
    Built-in browser
    - With Browser use enabled, models can click and type in HTML and React pages created in chat.
    - Models can read and edit HTML, React, Markdown, code and text files directly in the browser. Back restores the previous version.
    - Models can also read PDFs and other documents open in the browser.
    - Download prompts can remember permissions per site or across all sites, including for program files.
    Chat
    - Chats now show activity between tool calls, including context compaction on GGUF models.
    - Attach saved Library files using + > More > Attach from Library.
    - Switching away from a GGUF model and back now preserves chat context, avoiding the need to re-read long histories.
    - GGUF models can read up to four web pages at once when tools run without asking.
    Connections and API
    - OpenRouter models now load live, with working Reload models support.
    - Improved compatibility with newer MCP servers.
    - The Decision API adds LiquidAI's d1 models and Decider 2B (MLX only).
    - Settings > API > Quickstart now includes curl, Python and JavaScript examples.
    Performance and media
    - Unsloth no longer loads PyTorch and other ML libraries at startup, significantly reducing idle memory usage. Configure startup features in Settings > General > Startup performance.
    - MLX models load and reload much faster, and reducing a loaded model's context now takes seconds.
    - Long prompts on supported MLX models use less memory.
    - SDXL renders faster with very limited VRAM, including 4 GB setups.
    - Image LoRAs in your model folders now appear on the Images page.
    Training
    - Faster, lower-memory LoRA training on 16-bit bases with recent NVIDIA GPUs using float8_training = "fp8_lora".
    - DPO, ORPO, KTO, GRPO and CPO training now run on MLX.
    - Fixed crashes when full fine-tuning Gemma 4 in float16.
    Trim overlapping highlight bulletsCombine related Glass bullets
