Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Models can now use the browser in Unsloth. Turn on Browser use and your model can open pages, read them, click, type and scroll while you watch. Qwen-Image-2.1-Turbo is here too, making images in just 8 steps. Also included: text-diffusion LLM training, faster MoE GGUFs and speculative decoding on Mac.
    Highlights
    - Browser use. Local models can take control of the Unsloth Browser
    - Qwen-Image-2.1-Turbo: images in 8 steps (2.5x faster). See Guide
    - Train text-diffusion LLMs like DiffusionGemma, LLaDA and Dream
    - Up to 3x faster MoE GGUFs that are bigger than your VRAM
    - Speculative decoding on Mac for up to 2.8x faster MLX replies
    Browser use
    - Turn on Browser use from the + menu in chat, then ask your model to look something up or use a website.
    - Models can open pages, read them, click, type, pick options and scroll while you watch.
    - The model browses in its own tab beside the chat, with no access to your other tabs.
    - Browser use works with local models and API providers, including small text-only models.
    - Unsloth asks you before the model signs in, posts a form or presses a button that buys, sends or deletes.
    - The model never fills in passwords, card numbers or one-time codes. Those are yours to enter.
    - Choose which sites models can open, and their access to your browsing history and downloads, in Settings > Browser.
    Image generation
    - Run Qwen-Image-2.1-Turbo, the official 8-step version of Qwen-Image-2.1, from the Images page, with a 4.2 GB Q4 GGUF. GGUF
    - Export the image LoRAs you train in Unsloth as files you can reuse or share, and load image LoRAs from your own folders.
    - ComfyUI models now use the text encoders already in your ComfyUI folder instead of downloading them again.
    Training
    - Train text-diffusion LLMs (DiffusionGemma, LLaDA, LLaDA2, Dream, Nemotron and SDAR) with the new DiffusionTrainer.
    - Train with LoRA+ by setting loraplus_lr_ratio, and fine-tune GPTQ models with LoRA.
    - GRPO now trains on video prompts and tool calls with TRL 1.15, and AsyncGRPOTrainer can train and generate on one GPU.
    - Fine-tuning on tool-calling datasets now includes each row's tool definitions, and works on multi-turn agent traces.
    - On the Train page, set Offload layers with a VRAM budget (NVIDIA and AMD), and continue LoRA training from a saved adapter.
    - Train Laya and Clef decision models on Mac. Clef can also train on images.
    Performance
    - MoE GGUFs bigger than your VRAM now run up to 3x faster on NVIDIA and AMD GPUs.
    - Training with sample packing is now up to 8x faster when flash-attn and xformers are not installed (NVIDIA, PyTorch 2.12+).
    - Speculative decoding makes MLX replies on Mac up to 2.8x faster, with the same output.
    - MLX speculative decoding sets its draft depth automatically, and supports MTP, DFlash, DSpark and EAGLE-3 drafters.
    - Typing and scrolling stay smooth in long chats, and with hundreds of chats in the sidebar.
    Chat + Desktop
    - React code blocks (JSX and TSX) in a reply now run as live previews in the Browser.
    - Deep Research can use your MCP tools as sources and cite them, and retrying a failed run resumes from the steps it already finished.
    - Unsloth now reads AGENTS.md from your Unsloth home and project folders into chat instructions.
    - In Desktop, a project can now run its tools in an existing folder on your computer.
    - Turn on Read replies automatically in Settings > Voice to hear each reply aloud when it finishes.
    Models + settings
    - Use the optional vLLM engine on AMD GPUs, on Linux and through WSL on Windows.
    - Run DeepSeek-OCR and DeepSeek-OCR-2.
    - Filter Hub models by parameter count, context length and organization.
    - Turn on the detailed Live monitor to see GPU load, temperature and power.
    - On multi-user installs, limit which models each managed account can use.
    - Install the Unsloth web UI as an app from a supported browser.
