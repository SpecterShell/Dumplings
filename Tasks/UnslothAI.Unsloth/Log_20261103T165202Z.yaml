Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Unsloth now has Glass themes and more customization options for backgrounds, greetings and chats. This release also brings faster generation, more multi-GPU training options and CPU training in Unsloth.
    Highlights
    - New Glass themes with 5 themes, transparency + native macOS glass
    - Customization with custom greetings, background controls and code fonts
    - DeepSeek-V4.1 512K context benchmarks show Unsloth's GGUFs rank strongest across Terminal Bench, DeepSWE and AutomationBench. Analysis
    - Chat navigation to preview, bookmark and jump between earlier turns
    - CPU text training directly from the Train page
    Make it yours
    - Choose from five Glass styles with adjustable strength and optional glass menus, with or without a background image.
    - Unsloth Desktop on Mac supports native glass, letting your desktop show through the window.
    - Adjust background size and position, and choose where it appears across your chats.
    - Add your own greeting with text, an icon or an image, or hide it entirely.
    - Customize code fonts, line numbers, word wrapping and ligatures with a live preview.
    - Use the Trick or Treat theme year-round without the seasonal extras.
    Chat
    - Preview earlier messages, bookmark turns and jump through long conversations with the new chat navigator.
    - Paste formatted content as Markdown, including links, lists and spreadsheet tables.
    - Arabic, Persian, Hebrew and Urdu messages display right to left while code keeps its original direction.
    - Long chats stay more responsive while replies stream and you scroll.
    - MCP connections recover after a server restart.
    - Coding agents can follow instructions from files in your project's working folder.
    Performance and media
    - Supported single-GPU Llama and Qwen3 models generate faster in Unsloth's Transformers backend on NVIDIA GPUs with Linux or WSL. In our A100 test, 4-bit Qwen3-8B reached 99.1 tokens/s, up from 25.7, a 3.9x speedup.
    - SDXL now renders under a 4 GiB VRAM budget, tested on T4 and L4 GPUs.
    - Search large document collections faster with a new index for RAG.
    - Save generated images as PNG faster without changing the output.
    - Video models reuse cached INT8 weights for faster repeat loads.
    - Wan2.2 A14B uses less system memory when building INT8 weights for offloaded generation.
    - Adjust image LoRA strengths without reloading adapter files.
    - Transcribe audio up to four hours long with audio.cpp, subject to upload and storage limits.
    Mac
    - Try experimental Fast Verify for faster generation with supported MLX speculative decoding models. Replies may differ slightly.
    - MLX streaming spends less time processing text as replies grow.
    - Unsloth now uses the Mac system font by default.
    Training
    - Fine-tune text models on CPU from the Train page when no GPU is available.
    - Chat-only installs can add CPU training through Install Training.
    - Fine-tune audio vision models such as Gemma 3n and Gemma 4 using audio and images together in the same dataset.
    - Load supported non-quantized models larger than a single GPU by loading only each GPU's assigned pipeline layers.
    - Configure supported combinations of data, tensor, pipeline and context parallelism with UNSLOTH_PARALLEL.
    - Reduce MLP activation memory during training with unsloth.tile_mlp(model).
    - Send images to vision models through CLI chat and inference commands.
