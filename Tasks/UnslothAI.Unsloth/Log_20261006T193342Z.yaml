- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    This release adds a browser inside Unsloth (browser use coming very soon), so files, web pages and pages the model writes open right beside your chat. It also brings EmbeddingGemma 2, Google's new multimodal embedding model, plus new Audio pages and lower-memory training.
    Highlights
    - Browser beside chat for files, web pages and model-written HTML, as tabs
    - EmbeddingGemma 2: run and fine-tune Google's new model for text, code, images, video and audio Guide
    - Audio pages: Speak, Clone, Music, Transcribe, Edit, Separate, Convert, with 70+ GGUF models
    - Keep multiple models loaded, plus vLLM and SGLang engines (opt-in)
    - Sandbox for code the model runs, now with a Settings tab and Colab and Docker support
    - Live preview during image and video generation
    Browser
    Unsloth now has a built-in browser panel next to any chat. Attached files, web pages and HTML the model writes all open in it as tabs.
    - Files open as tabs: PDF, Office, HTML, Markdown, code and text.
    - Real browsing: address bar, search, tabs, find in page, zoom, bookmarks, history and downloads.
    - Model-written HTML and code open as tabs with a preview, console and Request edits, replacing Canvas.
    - Ask about this page: highlight part of a page and ask the model about it. Right-click a tab to pin it or fork it into a chat.
    - Settings > Browser: pick a search engine, set the default zoom, and import bookmarks from Chrome, Safari, Firefox or Edge.
    - Kept separate: web pages cannot reach your Unsloth account, chats or API.
    EmbeddingGemma 2
    EmbeddingGemma 2 is Google DeepMind's new multimodal embedding model. It turns text, code, images, video and audio into vectors for search, RAG, classification and clustering. Read our guide.
    - 740M parameters, or 270M for text only, with optional vision and audio encoders. 100+ languages and an 8K context window.
    - About 14% better on code than EmbeddingGemma 1 (78.68 vs 68.76, MTEB code).
    - Run it locally: import GGUF or safetensors into Unsloth, or serve text embeddings with llama.cpp. GGUF safetensors
    - Fine-tune the text model with FastSentenceTransformer, using 4-bit QLoRA or BF16 LoRA.
    - Prompts are kept. Fine-tunes of EmbeddingGemma and Qwen3-Embedding now save the model's built-in query and document prompts, not empty ones.
    Audio
    - Clone a voice from a short sample and save it.
    - Edit words in a recording and keep the speaker's voice.
    - Separate a song into vocals, drums and other parts, or Convert one voice into another.
    - Music makes songs and sound effects, and can edit parts of a clip.
    - Transcribe can show timestamps and speakers, and exports subtitles.
    Sandbox
    Code the model runs with the Python and Terminal tools stays inside a sandbox, with limited access to your computer.
    - OS sandbox on Linux and macOS, plus an opt-in Windows 11 preview. Now works in Colab and Docker.
    - Settings > Sandbox shows this computer's protection and can install a missing sandbox.
    - Low or High: High (default) uses the OS sandbox. Low uses software checks only.
    Models + chat
    - Keep multiple models loaded (off by default, in Settings > Resources). Each request is answered by the model it asks for.
    - vLLM and SGLang: opt-in, experimental engines for Linux with NVIDIA GPUs.
    - Auto-compact now works for API models like Claude and OpenAI, and for MLX chats.
    - Import your Cursor, Claude Code and Codex chats into projects, or chats saved as Markdown.
    - unsloth start --app lets the Codex, OpenCode, OpenClaw and Hermes desktop apps use your local model.
    Training + speed
    - Layer offload (opt-in, LoRA, NVIDIA and AMD graphics cards): offload_layers keeps frozen layers in system RAM, so Llama-3.1-8B 4-bit trains with VRAM capped at 7 GiB.
    - Faster padding-free training without flash-attn, the usual Colab case: Qwen3-0.6B drops from 5.45 GB to 1.87 GB of VRAM, with steps 5x to 8x faster.
    - gpt-oss-20b QLoRA is 2x to 3x faster on NVIDIA.
    - Images and video (NVIDIA): live preview while rendering, up to 20x faster Z-Image-Turbo on older GPUs, and the same seed gives the same image after a restart.
    - AMD: export fine-tuned models for the Ryzen AI NPU, and a much faster first Qwen-Image-2.1 image on newer Radeon cards.
    - Faster on Apple Silicon (MLX): Qwen3.6-35B-A3B replies about 10% faster, and long prompts start up to 10% sooner.
    - Int8 Prefill on M5 chips (MLX, experimental, opt-in): long prompts read up to 1.5x faster, with slightly less accurate answers.
