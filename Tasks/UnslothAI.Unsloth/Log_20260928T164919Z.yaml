Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    We're adding support for decision models, a unified Library for docs and media, document viewer, many Apple Silicon improvements, creation of Skills, and ~4.5× faster image and video generation.
    - Run and serve Decision Models like Laya (open-source Jev) locally
    - Skills Editor to create, edit, and delete Skills directly in Desktop
    - ModelScope model downloading is now here for users who can't use HF
    - Library + Document Viewer for PDF, Word, Excel, PowerPoint, and chats.
    - Apple Silicon Improvements including batched serving, structured outputs, and TurboQuant KV cache.
    - Configure how much of a model each GPU receives.
    - Faster Image + Video Generation with ~4.5x faster LTX-2.3 clips and 1.7–6.3x faster VAE decoding.
    Library + Viewer
    - View PDF, Word, Excel, and PowerPoint files directly in Unsloth, with links back to their source.
    - Manage chats, images, videos, everything in our new Library tab.
    - Improved attachment cards and support for reading more file formats.
    - Create your own sidebar sections and drag sections to reorder them.
    Laya + decision models
    Run Laya decision models locally to answer yes/no, multiple-choice, and scoring questions with probabilities.
    - Enable the Decision API from Settings > API, with model selection and CPU or GPU controls.
    - Supports the TypeSafe SDK through a Jev-compatible /v1/systemone endpoint.
    - Runs natively on MLX for Apple Silicon when GPU is selected. [Details](https://github.com/unslothai/unsloth/pull/11603)
    Faster image + video generation
    - LTX-2.3 clips are ~4.5x faster with distilled sampling, compile fixes, and hosted FP8 weights.
    - Image and video VAE optimizations deliver 1.7–6.3x faster decoding, with total generation speedups depending on the workflow.
    - MiniMax-H3's first render is up to a minute faster, with 25–29 GiB lower peak memory on A100, B200, and RTX PRO 6000.
    Apple Silicon + MLX
    - Batched serving allows multiple replies to decode at once.
    - Added grammar-constrained structured outputs through response_format.
    - Added TurboQuant KV cache and KV cache quantization for sliding-window models such as Gemma 4.
    - Improved memory estimates and automatic context sizing based on available memory.
    Skills + chat improvements
    - Create, edit, and delete Skills from the Desktop Skills menu.
    - Improved conversation recall across repeated auto compactions.
    - Long-running tool calls continue even when they produce no output, with better protection against excessive output consuming memory.
    - Auto-scroll or manual scroll your conversations
    - Use ModelScope instead of Hugging Face for model downloads
    Training + inference
    - Faster block-FP8 LoRA training and support for LoRA on compressed-tensors W8A8 checkpoints.
    - Load Voxtral and Qwen2-Audio through FastModel.
    - Export saved checkpoints from crashed or cancelled training runs.
    - Important compatibility fixes for Gemma, newer TRL trainers, and FP8 on RTX 5090 and RTX PRO 6000.
