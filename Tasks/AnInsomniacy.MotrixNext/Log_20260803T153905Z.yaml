  Key: ReleaseNotes
  Value: |-
    What's Changed
    Motrix Next 3.9.7 promotes the complete beta series to stable with Aria2 Next 2.5.5, runtime BitTorrent connection controls, safer file deletion, dynamic Material Design 3 theming, and substantial platform and architecture refinements.
    ✨ New Features
    - BitTorrent connection controls — Configure listen and external endpoints, apply supported changes without restarting the engine, and recover port conflicts automatically
    - File deletion policy — Move downloaded files to the system trash or delete them permanently
    - Dynamic color system — Use preset or custom seed colors with harmonized semantic roles across light and dark themes
    - Peer protection and diagnostics — Manage BT peer blocklists, log levels, log retention, and diagnostic exports
    - Task experience — Resume eligible paused tasks, show sidebar task counts, and control the task-list watermark
    🛠 Improvements
    - Updated all six bundled engine binaries to Aria2 Next 2.5.5
    - Reorganized BitTorrent, DHT, peer discovery, and sharing settings by protocol ownership
    - Added transactional preference saves with engine and configuration rollback on failure
    - Made Rust the sole task-lifecycle poller and consolidated shared configuration, proxy, and task utilities
    - Lazy-loaded locale messages and reduced the main frontend bundle
    - Added a custom macOS DMG experience, macOS ad-hoc signing, and Linux desktop integration
    - Rebuilt and polished the project website
    - Improved diagnostic guidance, default logging, localization, and updater signature documentation
    🐛 Bug Fixes
    - Improved magnet metadata reliability and paused-task resume behavior
    - Fixed locale loading during language changes
    - Removed intrusive missing-file card borders while preserving the status indicator
