Version: 2.0.9
Installer:
- InstallerUrl: https://download.once.work/Floweb_latest_x64-setup.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: "\U0001F31F Locked windows are easier to get back: once a site is locked into a desktop widget, a card shows up in the bottom-right of the main window — click it to open Switch window, which marks the locked window and unlocks it in one click. The icon right-click menu now offers Unlock click-through too, in the icon library and on group icons alike. Unlocking also clears always-on-top and always-on-bottom, so the window goes back to being an ordinary one. And a locked site now shows just the lock on its icon, instead of sharing the corner with the green dot that marks it as open."
- Locale: zh-CN
  Key: ReleaseNotes
  Value: "\U0001F31F 锁住的窗口更好找回来了：把网站锁成桌面挂件后，主窗口右下角会弹出一张卡片，点一下就能打开「切换窗口」，那里标着哪个窗口被锁住、一键就能解开；窗口图标的右键菜单里也多了「解锁穿透」，图标库和分组图标上都能用。解锁后窗口会自动取消置顶/置底，变回普通窗口。另外，锁住的网站在图标上只显示一把锁，不再和「已打开」的小绿点挤在一起。"
ReleaseTime: 2026-10-07T02:59:16.1390000Z
