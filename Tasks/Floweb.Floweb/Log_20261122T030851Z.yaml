  Key: ReleaseNotes
  Value: "\U0001F31F New: workspace temp tabs (⌘T/⌘W/⌘⇧T, open URLs directly), in-group tab clusters with folding, site/script/workspace preset packages, a 26-check config doctor, per-site zoom memory, recent apps in the tray, search bangs with 20 engines, keychain TOTP autofill, and Playbook run history. Fixes: temp tabs no longer delete same-named sites, cluster edits no longer overwrite concurrent changes, saving a schedule keeps its run history, group-switch shortcuts actually register, and tray/zoom updates refresh promptly — plus import/export, notification and startup edge cases."
- Locale: zh-CN
  Key: ReleaseNotes
  Value: "\U0001F31F 新增：工作区临时标签（⌘T/⌘W/⌘⇧T、网址直开）、组内标签分段与折叠、站点/脚本/工作场景配置包导入导出、配置体检（26 类）、站点级缩放记忆、托盘「最近使用」、搜索 bang 与 20 款引擎、钥匙串 TOTP 自动填码、Playbook 运行历史。修复：临时标签不再误删同名站点、标签段保存不再覆盖并发改动、定时保存不再清空运行历史、分组切换快捷键真正生效、托盘与缩放写回及时刷新，以及导入导出、通知与启动链路的边界问题。"
