- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    New Features Added
    - Twine' Polish translation has been updated.
    - The Electron version used by app Twine has been updated to version 43.
    Bugs Fixed
    - A security problem where a maliciously-crafted story could run commands locally in App Twine has been fixed. There have been no reports of this occurring to users to this point.
    - Pending changes in the passage editor are immediately saved when the editor loses focus, so that if the app is closed immediately afterwards, what was entered is saved.
    - App Twine no longer creates extraneous directories in the temporary directory when saving story files.
    - A bug where, in some localizations, the story list would mistakenly say there was 1 story, when in fact there were 0, was fixed.
    Story Format Updates
    - Snowman has been updated to version 2.1.3.
