  Key: ReleaseNotes
  Value: |-
    A bug-fix release for Windows input, plus a pause for fullscreen games. Installed copies offer the update by themselves.
    修复 Windows 输入问题，并新增全屏游戏中自动暂停。已安装的版本会自动提示更新。
    Fixed / 修复
    - Alt + click without moving froze mouse input for seconds across the whole system (#9). Holding Alt and clicking in place no longer stalls the cursor.
      按住 Alt 原地单击会让全系统鼠标卡住几秒（#9），已修复。
    - Alt stayed stuck down after a ping (#20), so the next key acted as Alt + key. Same cause as #9.
      发完信号后 Alt 一直处于按下状态（#20），与 #9 同一原因，已修复。
    - Clicking during Alt+Tab, Win+Tab or Alt+F4 placed a ping instead of reaching the switcher (#12). While another program's shortcut is in progress, clicks now pass straight through.
      Alt+Tab 等系统快捷键期间单击会放信号（#12），现在点击会原样交给系统。
    - A leftover hook-helper.exe could keep running after lolPing was force-closed and slow down input. It now exits with lolPing every time.
      强制关闭 lolPing 后残留的 hook-helper.exe 现在会随之退出。
    New / 新增
    - Pause in fullscreen apps (Settings → Trigger, on by default, Windows): in a fullscreen game, trigger + click goes to the game (Ctrl+click in CS no longer opens the emote wheel). Gestures still work on your other monitors and resume on the desktop. Windowed games aren't detected, and with an auto-hiding taskbar only borderless fullscreen counts (#16).
      全屏程序中暂停（设置 → 触发键，默认开启，仅 Windows）：全屏游戏中触发键 + 单击原样交给游戏，其他显示器和桌面上手势照常（#16）。
    Not in this release / 暂未包含
    - Friends seeing your own custom emotes in rooms is still the "?" placeholder. It's coming in 0.5.2 (#6).
      房间里其他人看到自定义表情仍是问号，将在 0.5.2 加入（#6）。
    Thanks / 致谢
    Big thanks to @istoolsfox for finding the root cause of the input freeze and contributing the fixes and the fullscreen pause (#10, #13, #17), all tested on real hardware.
    感谢 @istoolsfox 定位卡顿根因并贡献了修复与全屏暂停功能。
    Full Changelog: https://github.com/darrenprx/lolPing/compare/v0.5.0...v0.5.1
