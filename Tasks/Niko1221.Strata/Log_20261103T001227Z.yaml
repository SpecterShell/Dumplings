    - Against the original model (4,995 positions, 6 experts per word): KL 0.397, top-1 76.4%, perplexity 4.645 (original 3.140). KL and perplexity are lower the closer a model is to the original; top-1 (how often both pick the same next word) is higher. In the same test the ISTA-DAS 2.00 set measures KL 0.171 and perplexity 3.630, and the 2.25 set KL 0.109 and perplexity 3.405. KL by part: code 0.230, agent 0.199, documents 0.302, English 0.476, multilingual 0.777. Our 61-task suite: 54 of 61, the same as the 2.00 and 2.25 sets. ISTA-DASLab's own figures (their model card): SWE-bench Verified 77.00 against 81.20 for the base model, LiveCodeBench v6 88.57 against 89.71.
    - With the RAM limited (one R9700): 20.9 tokens per second at 40 GB, 18.5 at 32 GB, 15.0 at 24 GB, 8.0 at 16 GB.
    - On one R9700, our test engine decoded the ISTA-DAS Coder at 25.6 tokens per second, against 22.8 for the 0.1.55 DeepSeek package (median of 3 answers each).
    RTX 50 cards (Blackwell) and CUDA 12
    The CUDA 13 package starts in about a minute on an RTX 50 card (60 to 80 s measured). The CUDA 12 package, which older drivers need, builds its GPU code on the first start: 310 s measured on a Blackwell card (compute capability 12.0). After a driver update to 580.65 or newer, choose CUDA 13 in Settings, Engine. An update keeps the CUDA build you have.
    Going back to 0.2.9
    strata components rollback returns to the 0.1.55 engine; Control stays 0.1.56. To go back to the earlier drafting choice: strata launch --drafting mtp. To turn the split engine off: --split-engine off or STRATA_SPLIT_ENGINE=0. To start with a smaller context than 131,072: --max-context.
    What we ran on the release files
    Every line below used the release packages themselves.
    - Ryzen AI Max (Strix Halo), Windows, 128 GB: the final Terminal installed the engine from a local copy of the signed update feed, through its signature check. Qwen3.8 IQ3_S on Auto: DFlash2 alone, 64.9 / 67.7 / 56.5 tokens per second, a picture read correctly. The ISTA-DAS Coder from a Hugging Face layout folder, with a picture as the first request: ready in 93 s, nothing downloaded, "CODE 4217" read, first token on a code prompt in 0.70 s. The engine's working set peaked at 35.1 GiB and available RAM stayed above 15.4 GiB. With only about 19 GB of its 73 GB of experts held in memory (the rest read from the SSD), the ISTA-DAS Coder gave every answer right, at 4.0 to 5.5 tokens per second. No kernel-power, LiveKernelEvent 141 or watchdog event all evening.
    - DGX Spark: the final Terminal and Control. Qwen3.8 on Auto ran DFlash2 alone (625 MiB) and read a picture correctly with the GPU picture reader. The ISTA-DAS Coder from the repository folder read a picture correctly; it used its own picture file and downloaded nothing (1.6 MB of network traffic in that part). An update from a 0.2.9 install moved Terminal, Control and engine to 0.2.10 / 0.1.56, kept 0.1.55 for rollback, and downloaded no model file again.
    - Mac, M5 Max: the signed and notarized dmg installed the normal way (Gatekeeper accepted it as notarized; the app's own self-test passed 12 of 12 steps). From the installed app's Terminal, Qwen3.8 IQ3_S on Auto ran DFlash2 and read a picture correctly at 115 to 119 tokens per second. With the signed DeepSeek folder, the ISTA-DAS Coder answered 5 of 5 text requests (a tool call and a 6K needle among them) at 22 to 23 tokens per second, and read 3 of 3 pictures correctly. Peak memory was 74 GB.
    - Linux, two RTX PRO 6000 Blackwell: a plain strata launch on a new install fetched the MTP draft layer by itself and started the split engine (edits 754 to 773 tokens per second, a 32K prompt in 3.3 to 3.5 s). Four requests at once and four requests on three slots all completed. Pictures and an 8-turn agent session worked. --split-engine off ran the layer split with DFlash2 alone. The Linux app (AppImage), on a new install, took a model from a folder already on the PC without downloading it again. Its Auto load on both cards downloaded only the DFlash2 drafter (1.21 GB), built the drafter file and ran the layer split with DFlash2, one request at a time; the MTP layer was not downloaded. A chat and a picture worked. After an unload, a second load downloaded nothing and ran DFlash2 again. On one card the app ran DFlash2 the same way.
    - Linux, two RTX A6000: the split engine on Auto: edits 399 tokens per second against 201 on the layer split with MTP, a 32K prompt in 8.8 to 8.9 s against 11.0 s. Four requests at once completed.
    - Intel Arc A750 (8 GB): Auto ran DFlash2 alone (13.9 to 18.4 tokens per second). All four 128K starts we tried started at the asked context and request count. With MTP chosen, only MTP loaded.
    - Windows PC with an RTX 5070 (12 GB): the CUDA 13 and CUDA 12 packages passed these checks: 128K on Auto with DFlash2 alone; two requests at 128K on the full card and squeezed to about 8 GB (the context stayed 131,072); MTP chosen loading only MTP; the GPU picture reader; Gyro-S on Auto; and a start limited to about 8 GB. The Windows installer was checked without installing it: its hash, its update signature, the versions and the bundled runtime files.
    - Linux, four R9700: the final Terminal installed the RX 9070 package from a local copy of the signed feed (signature and every file checked). A plain strata launch started the split engine on 4 cards. With --parallel 8, 8 requests ran at 350 tokens per second, a 103K-token prompt took 33 s, and pictures read correctly. IQ3_S on Auto ran the layer split (318 with 8 requests); one card ran DFlash2 at 94. Earlier on the same day with the same Terminal: tool calls, strata connect opencode --check, and the refusal of logprobs and logit_bias on the split engine.
    Fixed, from your reports
    - Chat and the app:
      - #4725: with a long reply on screen, the Approve and Deny buttons scrolled out of sight. They now stay above the message box, and the reply says it is waiting for your answer.
      - #4748: a copy gave no sign on the button itself, and seven copy buttons gave none at all. Every Copy control now shows a check mark for about two seconds ("Copied" in menus).
      - #4749: the Subagents panel had no way to answer a helper. Each helper row now takes a message (steer for a working helper, queue for a finished one) and says when it was sent or refused.
      - #4750: the summary that replaces older history was always written in English. It is now asked for in the language you used; paths, commands and names stay exact.
      - #4783: while an answer was being written, the desktop chat could only wait. Enter can now wait, send after the answer, or interrupt it. The choice is in Settings.
      - #4785: you can now quote a turn or a selected passage into your next message. Quotes sit above the box and can be removed.
      - #4721: a web address in a reply opened nothing. A plain click now opens it in your own browser, and the Open button of a website preview works.
      - #4722: one reply showed three text widths (paragraphs, lists, tables). Paragraphs, lists and quotes now share one width; tables and code keep the full width.
      - #4218: a stopped helper kept its "In progress" row after a restart. It is shown as stopped when the page loads again.
      - #4244: the agent's own questions now get a card with options, your own words, one answer or a skip. A goal, a plan step or a /loop run with nobody there declines the question at once instead of stalling.
      - #3723 (part): the first start now opens in your computer's language and the first screen has a language choice. Context memory says in one line what each format costs. A start that ran out of graphics memory says so in plain words with the next step. The taskbar icon part is not covered.
    - Tuning, install and update:
      - #4802: the progress card of a download, load or tuning run now has its own look, a spinner, a running clock ("Still working for 3m 12s. You don't need to do anything.") and a line saying the buttons below wait.
      - #4804: "Start tuning" greyed out with no reason. It now says why in one sentence (still reading saved tunings, could not read them, another operation running).
      - #4805: a tuning that did not finish said only "could not start with these settings". It now shows the tuner's own reason and what this PC has, behind Details.
      - #4823: a model install that also updates a working engine now says from which version to which, that the old one is kept, and that Settings can go back.
      - #4853: the engine install could loop forever when Windows would not let Strata rename the checked engine into place. After a 40 second wait it copies instead, and the first-run card says why it stopped.
      - #4891: after two updates, a saved run config pointed into a removed engine folder, so every model showed as not installed. Saved paths now follow the update to the current folder.
      - #4772: DeepSeek-V4.1-Flash told you to update an engine that was fine, because it asked for the Qwen picture reader program. It reads pictures without it now.
      - #4824: strata launch after a tuning was blocked by a runtime host left in "failed", and --save-preset was lost. The host is cleared first, and the preset is kept when the start fails after the tuning.
      - #4779: in Docker, RETUNE=1 did nothing. It now passes --retune to the launcher.
      - #4693: Strata's own draft layer (mtp-q2_0.gguf) beside a model was counted as a second model, and the folder was refused ("holds more than one model"). It is no longer counted.
      - #4798: while sharing is on, the app now shows the address on this computer and the one for other devices, with a line on why their ports differ. The ports themselves are unchanged.
    - Tool calls and the server:
      - #4663, #4700: a tool the conversation already called counts as declared on the Anthropic and Responses routes too (0.2.9 did this only on Chat Completions). An Anthropic tool-search request with a deferred tool now comes back as a tool_use, and a tool_reference loads the tool's definition.
      - #4751: a call written as tools.write, functions.write or default_api.write is now the declared tool write, not text.
      - #4701: a file write whose content lists the closing tags on their own lines was cut short, and the rest leaked into the answer. The closing tags now end a value only when no text and no later closing tags follow, so the file is written whole. Full serve suite: 1,265 passed.
      - #4838: on /v1/messages a context overflow now starts with Anthropic's own wording ("prompt is too long: N tokens > M maximum"), then Strata's sentence. Claude Code then compacts or shortens max_tokens instead of retrying the same request three times.
      - #4678: the token counter showed "-" for tokens in on an Anthropic stream. The prompt count from message_start is read now.
      - #4654: the ResourceWarning lines on every run are gone (two files were never closed). No answer changes.
      - #4590: Qwen (and Qwen3.6 and the Intel engine): the repeat, frequency and presence penalties counted the last tokens of the prompt, so a new task could repeat the old JSON. They now count the reply's own tokens. On the reporter's 4-message conversation, IQ2_XS on a P100, the old JSON came back in 13 of 32 seeds as shipped and 4 of 32 with the change. On the 61-task suite: 56 and 55 as shipped, 55 with the change. STRATA_PENALTY_PROMPT=1 brings the old window back.
      - #4677: a parked conversation was sometimes refused on the next turn, and about 6% of the prompt was read again. The request now keeps only the rows the client got. On Linux Radeon (HIP), 4 of 16 continuations fell back before and 0 of 16 now (4 x R9700, long conversations). It is on by default; STRATA_SERVE_STOP_BOUND=0 turns it off.
    - Engine:
      - #4846: when RAM was still short at the expert arena, the host stalled with the table lock held. The lock is given back, and the experts are read from the file like --mmap-experts (or a RAM copy of the hottest ones). We have not run this on the reporter's setup.
      - #4671: the PLE table lock was refused under systemd's default memlock limit. Strata raises the soft limit to the hard one first, and if the table still does not fit it says how much this program may lock and what to set.
      - #4733: Windows: an engine started from a low-priority program (Task Scheduler, a service, an IDE) inherited Low disk priority and read its model about 15 times slower. Its disk priority goes back to Normal and one plain line says so.
      - #4741: a pack that keeps one projection in BF16 stopped the engine with "no native GGUF blocks" on the first request. That matrix is served as Q8_0 like its siblings.
      - #4825: Strix Halo, Unsloth UD-IQ1_S and UD-IQ1_M: every prompt of 96 tokens or more came out as NaN, because a Q6_K matrix overflowed the dequantizer's buffer. This is fixed, and the dequantizer is now bit-identical from run to run. Measured on a Strix Halo: UD-IQ1_S long prompts and the agent loop work. On the 2.25 set, prompt speed went from 166.1 to 164.9 at 4K and from 297.9 to 294.2 at 8K tokens per second (about 1% slower). We did not run the reporter's Linux container.
      - #3431, #2960 (PR #4787): Windows, Radeon (HIP): about one engine start in ten read every long prompt and picture wrong. The expert arena's GPU aliases are now kept clear of the process's memory. The author measured 0 bad starts in 110 with the change and 5 in 70 without, on an RX 7900 XTX. We only built it; we have no gfx1100 card to run it on.
      - #4144, #4730: Mac: a conversation never parked, so the second turn read its whole prompt again. With two conversations taking turns (11K and 6.5K, 24K and 3K tokens), the second request took 6.3 and 14.9 seconds before and 46 to 65 ms now, with the same answer ids.
    - Thanks: the SYCL prompt kernels and the copy-engine hang fix from maxfridbe (#3248), the Battlemage decode work from glorysdj (#4185), the --lookup-max-t window from merbanan (#4040), and the arena patch from GoldenLeafBird (#4787) are in this release.
    Probably fixed, please retest
    - #4848: Gyro-S gave one token per answer on an RTX 4050. The log showed engine 0.1.52 under app 0.2.9. Auto now only uses what the installed engine can do, and the Models screen tells you an older engine has a newer one, with an Update engine button. We could not reproduce the one-token answer on that card, so please retest.
    - #4926: after a switch to a local GGUF folder, picture reading said it was off or "prepare this model's vision files" although the picture file was there. Setup now uses a picture file you already have (also in the folder above --gguf-dir). Read pictures is on by default for models that can read them, and a load with no picture files fetches only those. Not tried on a 3090 with the reporter's folders.
    - #4706: Mac (Metal): the 256-expert pruned Coder. The routers, the prompt chain and the SSD stream now take the model's expert count. The 512-expert path gave the same greedy ids; an end-to-end 256-expert run on the new code was not made (58 GB download).
    - #4726 (part): the local-model importer accepts the Flash-Next family's own architecture (qwen4exp). The rest of that report (never registered, no autostart, "native load says not installed") is not covered.
    Known problems
    - DeepSeek answers can differ between starts at temperature 0 (the setting that should always give the same answer). One or two experts per card sit differently from one start to the next, and the expert cache moves experts between the CPU and the GPU between requests. On Radeon cards (HIP) the CPU lane computes part of the experts, which adds the same effect. We compared engines by KL, not by identical tokens. This was already so in 0.2.9.
    - A DeepSeek tool call can come out broken when most of the model streams from the SSD. With only about 13% of the default set held in memory and temperature 0.6, 1 of 5 runs put a "DSML" marker inside the tool's argument, on both the 0.1.55 and the 0.1.56 engine, the same request each time. With the model in memory, 8 of 8 tool calls were correct on both engines.
    - The drafter is fetched even with --dspark off. Skipping it for "off" or "none" is a later change.
    - Mac: the Terminal archive and the DeepSeek folder are signed and notarized but carry no stapled ticket (Apple cannot staple a ticket to bare programs). The first launch of a copy downloaded with a browser needs an internet connection; installs with curl | sh are not affected.
    - Intel Arc A750: 11 test programs that need 64-bit floats abort on the card, and the engine does not repeat its own answers exactly (the experts are computed on the CPU).
    - AMD, the split engine: the AMD engine packages do not bundle librccl, and setup does not install it for them, so the split adds the prompt sums through the host. The engine says so in one line. In our tests that made a 103K-token prompt about 14% slower than with librccl (about 4.5 s); answers are the same. The split engine does not support logprobs or logit_bias; those requests get a clear error that names --split-engine off. A plain launch gives the split 6 request slots; use --parallel 8 for 8 at once.
    - All-cards split engine on two A6000 cards: a 32K prompt is read in 10.1 to 10.2 s, against 7.65 to 7.81 s on the layer split with DFlash2. Two or four 32K prompts at once run at 12.5 and 12.7 tokens per second in total, against 11.7 and 12.9 on the layer split.
    - Windows with an AMD card: the DeepSeek package is built for the Ryzen AI Max (gfx1151) only; on other Radeon cards on Windows, DeepSeek has no engine yet. (The 0.2.9 item about UD-Q4_K_XL stopping on the first request on Strix Halo is fixed; it ran all evening.)
    What we did not test, and what we built but did not run on a matching card
    - Built and checked as packages, not run through a model by us on a matching card: Windows RX 9070 and RDNA2; Linux RX 7900, Strix Halo (halo) and RX 6000. The packages start with a stripped environment and report 0.1.56. The Linux RX 7900 package keeps the earlier AMD runtime; only the RX 9070 package has the newer one.
    - The all-cards split engine on a GeForce pair, on 3 or 4 NVIDIA cards, on Windows or macOS, on a PC with 64 GB of RAM and two large cards, and with contexts above 128K. The copy-engine ring it uses for prompts differs in its last bits from sFNX's, because the arithmetic differs: 39 of 61 suite answers are identical between the two, and 29 of 61 against the layer split's.
    - DeepSeek pictures on an M1, M2 or M3, and at the largest size of 9,189 patches exactly (the largest tested has 8,640).
    - The 8 GB NVIDIA and Radeon numbers above come from larger cards limited by hand, on a workstation with a lot of RAM. A home PC with less RAM reads more from the SSD and is slower. The Intel Arc A750 numbers are from a real 8 GB card. On the Arc, DFlash2 decodes 2.6% slower than MTP in our A/B; it is still the Auto choice there.
    - The Mac DeepSeek engine is built from a different commit than the other engines (f457ed7b9, the Metal picture tower on top of 06698c674). The Windows and Linux engines were built from 06698c674, the AMD Linux and Windows packages as listed in the tag message.
    Thanks and credits
    - antirez/ds4 (MIT, commit 890898cf): the Metal form of the DeepSeek picture tower follows it. The licence and credit travel with the code in third_party/antirez-ds4 and in the Mac engine package.
    - ISTA-DASLab: the ISTA-DAS sets and the ISTA-DAS Coder, and the Engram file they publish.
    - keinebenutzer (STRATA-average-patch, MIT): the speed cards show the run's average; ported onto 0.2.10 by hand.
    - John Fink: sFNX (MIT), the all-cards split engine Strata's is built from.
    - nazeshinjite: the community DFlash2 GGUF (Apache-2.0) whose idea of storing the selector codebooks as Q4_0 rows Strata's DFlash2 pack follows.
    - xrip (Anthropic tool search through the server), hanchengme (a request commits only the rows it can emit), Tycho Rasch (Windows HIP: the pinned expert arena's GPU aliases), and asf0 (libstrix, MIT, part of the Strix Halo prompt work since 0.2.9).
