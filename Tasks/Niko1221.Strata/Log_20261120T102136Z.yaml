    How we tested
    - Test suites on the release commit: on Linux 4,222 Terminal tests, 2,055 server tests, 1,853 tool tests, 138 engine CPU tests and 2,096 app tests passed with 0 failed. On Windows 4,157 Terminal tests (4 shards), 2,215 app tests and 2,023 server tests passed with 0 failed; three timing-sensitive tests (chat-heartbeat, timeskip-real, the abort sweep) ran 10 of 10 times alone and 10 of 10 beside 6 busy processes, 0 failed of 60. The desktop shell's 49 Rust tests passed on the release commit.
    - Same answers (BASE-05, 9 or 10 prompts, against the same box's 0.1.59 / 0.1.60 answers): Mac M5 Max 10 of 10; Arc A750 9 of 9; RTX PRO 5000 9 of 9 with --short-read 64, 7 of 9 at the new default of 16 (two prompts differ in the first-token logits and in token 18); RTX 5070 10 of 10 with --short-read 64, 8 of 10 at the defaults; 2 x RTX A4000 9 of 9 with STRATA_SPLIT_CPU_SHARE=0; Tesla P100 and Radeon R9700 10 of 10 with STRATA_ROUTE_TAIL_SKIP=7 and 10 of 10 different at the new default (tail skip Off).
    - Owner PC (RTX 5070, Windows, normal user): strata launch served after 75 s including the engine download (0.2.16: 71 s) and passed a chat, a second turn, a picture and a tool call; START-HERE.bat on a fresh clone was ready after 129 s (pip and the drafter came over a link of 0.3 to 0.7 MB/s); the app's first run listed what the PC can run at 0.0 s, chatted, and after a quit and start again was Ready in 48.3 s with its 3 chats; an old clone's real 0.2.16 UPDATE.bat ended in about 1 s with exit code 0 on both folder layouts. Median time per key on the strata launch screens (test console): Model 181 → 74 ms, Cards 312 → 73, Pictures 693 → 85, Save 572 → 83; in a real console 131 to 271 ms → 13 to 24 ms.
    - Mac M5 Max: the one-line install took 2 s; chat, a second turn, a picture and a tool call passed; strata update from 0.2.16 took 21 s; stop and start again 8 s; the signed dmg is accepted by Gatekeeper as a notarized Developer ID app (stapled, macOS 15.0 or later).
    - Linux, with the install line, strata launch, a chat, a second turn, a picture (not offered on Arc), a tool call and the update from 0.2.16: RTX PRO 5000 (offline) serving after 31 s; 2 x RTX A4000 (offline) 85 s; Radeon R9700 (hip-rx9070, offline) engine update in 25 s; Tesla P100 4 min 8 s including the downloads, and the AppImage updated itself from 0.2.16 with the real signature in 22 s; Arc A750 2.5 min.
    - Radeon RX 6700 XT (hip-rx6000): the default start served after 57 s and the swap grew by 1.7 MiB during the start (0.2.16: 1,320 MiB in 2 s).
    - Strix Halo (Windows, standard user): the one-line install took 9 s, the update from 0.2.16 17 s, and a chat, a picture and a tool call passed. The first start took 1,212 s: the 0.34 GB drafter came from GitHub at 0.34 MB/s (model preparation 42 s).
    - Rented machines:
      - RTX 4090, Coder: load 56 s, chat 106.7 tok/s, a 17K-token prompt answered at full cache (4,810 tok/s) and at --expert-cache 1500 (3,818 tok/s) with 0 aborts; the 0.1.62 engine ended with exit -6.
      - RTX 5090 in a cgroup v1 container at 183.51 of 183.53 GB: no "only X GiB of RAM is free" line; the CPU share is on for prompts up to 6,144 tokens.
      - RTX 5060 Ti 16 GB: decode 1.02 to 1.23 of the figure with STRATA_ADAPT_FETCH=0 by kind of request, in the arena mode.
      - DGX Spark (GB10): install 2 s; the 84.5 GB model came from Hugging Face in 7 min 45 s and the chat answered 10 min 13 s after the first key. A published 0.2.13 install updated from the new aarch64 feed and downloaded its DeepSeek engine from the 0.2.13 release (555 MB, HEAD 200, #6267).
      - 2 x RTX 4090 from a clean start: the model downloaded in about 3 min 15 s, the chat was ready about 4 min 40 s after the first key, decode 155.7 to 196.3 tok/s.
    - Swap, default start, 0.2.16 against 0.2.17 on the same files (10 s before to 60 s after the engine start): RTX PRO 5000 0 MiB growth in 9 and 6 starts; 2 x RTX A4000 one of 12 starts +1,693 MiB on 0.2.16 and a maximum of +20 MiB in 6 starts on 0.2.17; Radeon R9700 one first start +868 MiB on 0.2.16 and 0 to 16 MiB on 0.2.17; Tesla P100 343 → 343 MiB on both.
    - Update feed: both feeds (sequence 129 and 125) verify with the release key; every engine package is signed and its manifest equals its feed entry; the 3 app signatures verify.
