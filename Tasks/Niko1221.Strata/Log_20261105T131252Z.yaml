    On a Strix Halo, a set whose experts fit the shared graphics memory now keeps all of them there, with no RAM pinned beside it. During testing, the first start of UD-IQ2_XS failed with the earlier plan (a small fixed cache plus 35 GB of pinned RAM); with the new plan it started on the first try and decoded about three times faster. Not run with a real file: UD-Q2_0, UD-Q2_K_XL and UD-Q3_K_XL (their formats ran in the parity tests and in the sets above), any of the new sets on a Mac, and pictures with the new sets on an Arc. On the Arc the DFlash2 drafter's guesses were never accepted with UD-IQ1_M, which costs speed; with the GSQ IQ3_XXS file it accepted 77 to 94% as before.
    The numbers first
    Speeds are in tokens per second (a token is a short piece of a word). Decode is the speed of writing the answer; a prompt is the text you send, and the prompt speed is how fast the engine reads it. "First token" is the wait between sending a prompt and the first piece of the answer. DFlash2 and MTP are two drafters: small helper models that guess the next words so the main model can check them together. A layer split gives each card some layers of the model; the all-cards split engine gives every card a share of every layer. Experts are the model's specialist parts; a file "streams" when some of its experts are read from RAM or the SSD instead of sitting on the card. A prompt chunk is the piece of a long prompt the engine reads in one go. KL measures how far a model's next-word probabilities move from a reference (0 is identical, lower is closer); top-1 is how often both pick the same next word. The "61-task suite" is our own set of 61 tasks (retrieval, extraction, summary, JSON, code, agent loops) run at temperature 0.
    Most speed lines below were measured on engine builds made from the source of this release, in branches before the last merge, and on "package-like" folders (a release package with one engine file replaced); each line says which. The speed lines were not measured again on the 0.1.57 release packages; those packages were installed from a signed feed and run with real models (see "What we ran on the release files"). Many cells are one start per arm or two to three rounds; the line says so, and where a line names a noise level it is the one measured on that box.
    - Four Radeon AI PRO R9700 cards (Linux), the all-cards split engine, UD-Q4_K_XL. The 0.2.10 release package against the same package with the new split engine, through a plain strata launch-style start, 2 interleaved pairs, 1 start per run (change in the last column):

      |                                                | 0.2.10 package               | new                          | change |
      | ---------------------------------------------- | ---------------------------- | ---------------------------- | ------ |
      | 1 user, tokens per second                      | 161.8, 161.6                 | 173.2, 172.4                 | +6.9%  |
      | 8 users at once, combined tokens per second    | 276.3, 263.3                 | 358.4, 357.4                 | +32.7% |
      | two prompts of about 103K tokens, seconds each | 32.97 / 33.31, 33.71 / 34.14 | 30.93 / 31.35, 30.12 / 30.61 | -8.1%  |

      The new build has 4 changes: 8 request slots by default instead of 6; the prompt sums go through the other cards' memory, so librccl is not needed; chunks of up to 256 rows are summed in one step; and a cheaper expansion in the IQ3_S, IQ3_XXS and IQ2_S decode math (0 of 25 million test dot products differ). Greedy answers were identical to the 0.2.10 path in each step's check (6.5K, 26K and 103K tokens for the prompt sums; one 26K-token IQ3_S answer for the cheaper math). Without librccl, our screen measured a 103K-token prompt at 30.43 / 30.93 s against 28.91 / 29.42 s with it, and 1 user 1.7% behind it (2 pairs).
      A later change lets the shared expert (an expert every word uses) ride in the routed launches for every expert type, not only Q4_K. Engine-level harness, the build before this change against the build with it, 2 interleaved pairs, 1 start per run:

      | UD-Q4_K_XL, 4 x R9700     | before       | after        | change |
      | ------------------------- | ------------ | ------------ | ------ |
      | 1 user, tokens per second | 178.9, 178.2 | 186.1, 185.8 | +4.1%  |
      | 8 users, combined         | 367.3, 377.8 | 384.6, 381.1 | +2.8%  |
    - Four R9700 cards, IQ3_S set: Auto now starts the split engine. Through strata launch on a package-like folder with --parallel 8, 1 start per run:

      | IQ3_S, 4 x R9700          | layer split (--split-engine off) | split engine, before this change | split engine, new |
      | ------------------------- | -------------------------------- | -------------------------------- | ----------------- |
      | 1 user, tokens per second | 104.2                            | 92.8                             | 186.8             |
      | 8 users, combined         | 320.7                            | 303.2                            | 364.6             |

      A plain strata launch --model-path ... --gpu 0,1,2,3 with no flags picked the split by itself and measured 187.1 and 363.3 (default lanes, no --parallel); a picture (a code, a red square, a blue circle) was read in 1.1 s. Against the layer split on the same prompts (53 prompts, first token and 64 generated tokens): top-1 48 of 53 (90.6%), KL mean 0.0406, median 0.0047, max 0.85; the generated ids were identical on 13 of 53. The 61-task suite, one start each, 4 cards: the split 57 of 61 (fails: agent-A4, agent-A5, extr-M-d28, extr-L-d31), the layer split 54 of 61 (fails: agent-A3, A4, A5, A7, A10, extr-M-d28, extr-L-d31). The two extraction tasks fail in both; the agent tasks change from run to run (one run each, so this is not a verdict on them). Two and three R9700 cards were not re-measured with this change and keep the layer split.
    - NVIDIA UD-Q4_K_XL prompts: the K-quant prompt kernels are the default on cards of compute capability 8.0 and up. UD-Q4/Q5/Q6_K_XL files used to be converted to 16-bit numbers and multiplied by a general library; they now run on llama.cpp's MMQ kernels (compact integer kernels for quantized weights). Prompt speed in tokens per second, median of 4 requests per cell, 2 rounds, arms interleaved, a fresh engine per arm per round, MTP, 131072 context, medians shown as old to new:

      | card                                                  | 4K prompt               | 8K                      | 20K                     | 32K                     |
      | ----------------------------------------------------- | ----------------------- | ----------------------- | ----------------------- | ----------------------- |
      | RTX PRO 6000 (sm_120, all experts on the card)        | 2,338 to 3,097 (+37.7%) | 3,389 to 4,241 (+25.8%) | 3,386 to 4,573 (+34.3%) | 3,709 to 4,886 (+32.6%) |
      | RTX A6000 (sm_86, 13.1K of 24.6K experts on the card) | 1,113 to 1,130 (+1.7%)  | 1,917 to 2,093 (+9.0%)  | 1,726 to 1,867 (+8.1%)  | 2,010 to 2,235 (+11.2%) |

      Decode speed did not change. This path rounds differently: first-token KL against the old path, 24 prompts of about 2K tokens (19 plain, 5 agent turns): RTX PRO 6000 0.0243 (plain 0.0170, agent 0.0521), top-1 23 of 24; A6000 0.0351 (plain 0.0305, agent 0.0528), top-1 22 of 24 (noise floor 0.0013). The 61-task suite on the RTX PRO 6000, one server start per arm, two starts each: old path 53 and 53, new path 54 and 54 (agent 5 of 10 in all four). Of the 61 answers, 38 are byte-identical between the two paths; the agent flips go both ways in that comparison.
    - NVIDIA: a bare --prefill auto now reads prompts in chunks of up to 32768 tokens (it was 8192) on cards of compute capability 8.0 and up. Prompt speed in tokens per second, medians, 4 requests per cell, 2 rounds, a fresh engine per arm, 131072 context; the percent is the paired ratio:

      | box                                                                             | 8K                    | 20K                     | 32K                     | 64K                     | decode |
      | ------------------------------------------------------------------------------- | --------------------- | ----------------------- | ----------------------- | ----------------------- | ------ |
      | RTX A6000, UD-Q4_K_XL + the K-quant kernels, 13.1K of 24.6K experts on the card | 2,096 to 2,098 (0.0%) | 1,866 to 2,675 (+43.4%) | 2,247 to 2,752 (+22.5%) | 2,343 to 2,840 (+21.3%) | +1.1%  |
      | RTX PRO 5000 72 GB, IQ3_S, all 24,576 experts on the card                       | -0.8%                 | +0.05%                  | -2.0%                   | +2.0%                   | -0.6%  |
      | GB10 (DGX Spark), IQ3_S, all experts resident                                   | -0.4%                 | -2.8%                   | +2.6%                   | +8.4%                   | -0.3%  |

      The same change on an RTX PRO 5000 as a small PC (IQ3_S, 30 GB of RAM allowed by a cgroup, every model file evicted from the cache before each start so experts really come from the SSD, 2 rounds): 8K +2.4%, 20K +32.6%, 32K +70.6% with 32768 against 8192 (prompt speeds 434 / 446 / 528 against 445 / 592 / 899 tokens per second). The engine's own warning ("about 3x slower") was not reproduced on that fast NVMe drive; a slower disk, Windows or a smaller cgroup were not tested. The prompt borrows more cache slots while it is read (A6000: 4,663 slots / 13.64 GiB against 1,576 / 4.62 GiB) and gives them back. On a 12 GB card or a layer split the engine picked a smaller chunk by itself and speed did not change (one 12 GB card 4,608 tokens, two 12 GB cards 7,168 tokens). The 61-task suite on the streamed A6000 (UD-Q4_K_XL, 2 launches per arm): old 8192 ceiling 56 and 56 (agent 7 and 7); old ceiling plus a different, equally valid rounding switch (STRATA_SELECT_OLD=1) 55 and 54 (agent 6 and 5); 32768 ceiling 53 and 54 (agent 5 and 5). The agent tasks that flip (agent-A2, A4 and A8) are mostly the same in the arms that round differently: A8 is lost in all four arms that differ from the old ceiling in rounding, A2 and A4 in three of them. See "Known problems" for why the first answer of some agent prompts depends on the chunk size.
    - Two NVIDIA cards, the all-cards split engine, prompt time. Seconds to the first token, 2 x RTX A6000, Linux, 2 reps in each of 2 starts per arm (4 reps in 2 starts for the 0.2.10 IQ3_S cells):

      | prompt | IQ3_S, 0.2.10 | IQ3_S, 0.2.11         | UD-Q4_K_XL, 0.2.10 | UD-Q4_K_XL, 0.2.11    |
      | ------ | ------------- | --------------------- | ------------------ | --------------------- |
