      | 62.9K  | 18.0 to 18.7  | 16.52 to 16.75 (-10%) | 17.45 to 17.69     | 15.31 to 15.81 (-10%) |
      | 103K   | 30.7 to 31.2  | 27.0 to 27.8 (-11%)   | 29.6 to 29.8       | 26.23 to 26.62 (-10%) |

      On 2 x RTX PRO 6000 (UD-Q4_K_XL, 2 reps x 2 starts): a 32K prompt 3.27 to 3.58 s before, 2.86 to 3.10 s now; a 62.9K prompt 6.29 to 6.70 s before, 5.47 to 5.69 s now; edit decode 738 to 770 before, 746 to 784 now. The changes: the hyper-connection read (28% of the split's prompt time, done in full by both cards) is divided between the two cards when the start-up check finds a matching math routine (the exact mode, FNX_PF_HCSPLIT=1, is bit-identical to the unsplit path; the default mode 2 also splits shorter chunks and changes the last bits); the prompt chunk is 8192 rows with 4 chunks per pass; the int8 prompt attention is on for IQ3_S-type files and off for the others; and the tensor-core scan for the GDN layers is off for IQ3_S-type files and on for the others. The 61-task suite, one run per arm: IQ3_S with the final defaults 55 of 61 (53 of 61 with the tensor-core scan on in an earlier pair, 56 of 61 with it off); UD-Q4_K_XL 57 of 61 in the run that matches the final defaults (55 of 61 with the int8 prompt attention on, which is why it is off for these files). First-token KL against the unsplit 4096-row path (IQ3_S, 2 x A6000, int8 attention off) at 6.4K, 26K and 103K tokens: 2.6e-4, 6.7e-3, 1.5e-3, top-1 the same on all three.
    - FP16 weight cache for parallel requests (Linux NVIDIA, automatic). RTX PRO 5000, IQ3_S, MTP, --parallel 8, 32K context, 5 paired blocks, engines interleaved. Total tokens per second, old to new: 1 request 130.9 to 135.8 (ratio 1.038), 2 requests 137.2 to 144.1 (1.050), 4 requests 175.1 to 185.1 (1.057), 8 requests 197.8 to 210.9 (1.066); one solo 512-token request 175.7 to 178.6 (1.016). The cache keeps 3 GiB of the card free. Output is bit-for-bit the same: 100 of 100 test combinations equal on sm_120, sm_86 and sm_121, greedy answers identical on 12 of 12 prompts, first-token KL 0 on 25 requests.
    - Linux Radeon (gfx1200 / gfx1201, R9700 class): the route-tail skip stays on for Unsloth files. Setup used to write STRATA_ROUTE_TAIL_SKIP=0 for Unsloth (UD) files whose experts are all in RAM; on these cards it no longer does, and the engine's own default (skip experts that every token of a verify window routes at rank 7 or lower and that are not on the card) runs. One R9700, UD-Q4_K_XL, 2 rounds x 8 held-out classes interleaved: decode geomean +6.18% (chat_advice +16.0%, math +12.0% / +7.8%, code +9.6% / +5.4%, summarize +2.0%, xchat4 -2.2%, xchat5 +0.2%); absolute 72 to 104 tokens per second with the skip, 66 to 97 without. Median decode over the 61 suite tasks 90.9 against 78.6 (+15.6%). Quality: teacher-forced KL against no skip 0.07731 (top-1 91.11%; by segment code 0.0271, docs 0.0931, english 0.0396, multilingual 0.0236, agent 0.2033) on a fixed cache with a 54 to 63% hit rate, an upper bound for real use, as the test notes put it (the engine in real use adapts to about 81%); the text's perplexity was 3.985 with the skip and 4.093 without. The 61-task suite: 56 of 61 with the skip against 55, 57 and 56 for the default arms; 36 of 61 answers byte-identical to the default arms.
