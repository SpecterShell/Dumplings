    - Measured, not changed. One R9700, UD-Q4_K_XL: more resident experts (+100 slots = +0.3 hit points, about +0.5% decode), a UD-specific shipped hot-set profile (+0.6%), the swap budget (96 swaps every 4 rounds, 24 to 384 tested), and the CPU lane (headroom estimated at 3 to 5% of a window with a faster kernel; not built) gave nothing worth a default. On the Strix a smaller expert cache (--expert-cache 12500 against the engine's automatic 22,906 slots) read prompts 11 to 14% faster (4K 654 / 657 / 658 against 573 / 580 / 580 tokens per second; 15 of 15 pairs positive, first-token KL median 1.4e-5, max 1.5e-2), but the gain depends on the machine's 64 GB graphics split, comes in levels that change from start to start, and 12500 sits 1500 budget units from a size where the engine does not start (11000). We left the default. On the Intel Arc A750 a new 10-class A/B gave DFlash2 over MTP a geomean of 1.008 (DFlash2 faster in 7 of 10 classes; the 0.2.10 figure of 2.6% slower came from a different request mix); Auto stays DFlash2 there.
    What is new
    - Chats are files in Strata's data folder, not browser storage. Each chat is a file chats\<id>.json with an index.json beside them; the text is saved byte for byte, with no 5 MB limit. Writes go to a temporary file first and are renamed into place, so a crash in the middle leaves the last good copy. If a chat cannot be written (full disk, no permission) it stays whole in memory, a notice says so once with a "Copy unsaved chats" button (nine languages), and it is retried; the notice goes when the chat is saved. Two windows see each other's changes. The first start with 0.2.11 hands both of 0.2.10's browser layouts to the host once; the browser copy is left untouched for one release. The privacy note now reads "Conversations stay on this computer, in Strata's data folder."
    - A running agent turn is taken over again after a reload. If the page is reloaded or closed while an agent is working, the host keeps the turn running (as before). The reloaded page now finds it, shows the reply so far with its Stop button, and carries on in the same reply; a turn that finished while the page was away is shown whole once. Before, the chat showed "Network error", had no Stop button, and a new message was refused ("This chat is still working"). No new wording.
    - The desktop app starts the all-cards split engine wherever the Terminal does. With Drafting on Auto, two or more matching cards that the split engine takes now start it, with the MTP draft layer (the app fetches the 5.2 GB layer if it is missing); other cases keep the layer split with DFlash2. The app now runs the same conversion step the Terminal runs (strata split-engine apply); it did not run it before. An explicit MTP choice starts the split like the Terminal does. This was tested with a fake Control and plan-only runs, not with the packaged app on a two-card Linux PC.
    - Choosing DFlash2 yourself keeps the number of requests you chose (one card and layer split; app, Terminal and server). It starts --draft dflash2 ... --batch N with per-request drafters of about 85 MiB each. A start check on one card (--drafting dflash2 --parallel 4, n=1, a start check and not a speed measurement): "4 slot drafters ready", 4 different questions at once all answered correctly. Choosing DFlash2 with no number still means one request at a time, and Auto still picks MTP when several run at once. On Apple Metal the engine has no per-request drafters, so a named DFlash2 with several requests starts MTP as in 0.2.10. The all-cards split engine takes DFlash2 only on --split-engine on plus DFlash2 by name (engine flag; no launcher or app change for it otherwise).
    - Small multi-card layer splits start by walking down a list, and the context never shrinks. When a card is short of memory the engine now trims the dense weights each card carries, steps the KV window down (20480, 8192, 4096 cells), drops the drafter on the card that holds it, keeps 16 prompt-path cache slots, puts the output head in pinned host memory on the last card, and leaves a card out when it has under 3 GiB free (or even the whole list would not pay for the layers on the cards left). Each step is one short of GPU memory: line. The launcher's one retry after a memory stop now uses no drafter (never DFlash2 turned into MTP), and the last line of the failure message is the engine's own reason. A later card now prices 256 MiB for late allocations; that is what removes the 0.2.10 out-of-memory crash on 2 x 16 GB.
    - The split engine's Auto looks at free memory, not card size. A card now counts with its free memory minus 700 MiB (the engine's default reserve); if that is below what the split needs, the cards no longer get the split plan and the 5.2 GB draft-layer fetch, and Auto uses DFlash2. When you relaunch while your own server is running, that server's memory is not counted as busy.
    - The draft layer is also looked for in --data-dir (and the data folders Strata remembers). In 0.2.10 a model folder outside the data folder could show "About 6.1 GB to download" for a draft layer (5.2 GB) and the picture reader that were already there; the plan now says "Nothing to download" when they are.
    - The plan's card line shows both numbers: Main: GPU 2 (--gpu 1) RTX PRO 6000. Helper: GPU 1 (--gpu 0) .... Screens and setup still count cards from 1; --gpu counts from 0. Cards hidden by CUDA_VISIBLE_DEVICES (NVIDIA) or ROCR_VISIBLE_DEVICES / HIP_VISIBLE_DEVICES (AMD) are left out unless you name them. When the app switches from one model to another, the plan no longer counts the memory of the engine it is about to unload as busy.
    - One order for engine options in strata launch: values you give on the command line, then your saved overrides (user_args and hand edits to the launch file), then calibrated values from calibrate --apply-result, then Auto. A --set draft-conf you give survives, and --set mmap-experts on|off|auto keeps its word for DeepSeek (Qwen stays a bare switch).
    - The desktop window recovers from a dead page. If the page's renderer (WebView2) dies, the shell reloads the same screen, then the home screen on a second death, and leaves the browser's own error page after a third death within two minutes (Reload then works). Windows was run for real; the macOS hook was not compiled and Linux is unchanged.
    - Menus are placed so they can be read at every Interface size (one extreme case is listed under #4653 below; composer Mode, sidebar More, Reasoning effort, Add or open, chat options, model picker, subagents, and every dropdown in Settings, Models and the tune dialogs).
    - Quiet answers keep the connection: a chat stream with nothing to say for a while sends a small beat frame every 15 seconds so the desktop web view does not drop it.
    - Terminal: the ? key list in the monitor stays up for 15 seconds (it was wiped by the next one-second refresh) and wraps at 80 columns and at 60 columns so every key shows; ? again, Esc or a change of view closes it. The list does not name the / filter or the b key that the Serving footer shows.
    - Terminal: port-denied text names the right cause on Linux and macOS ("This system does not allow it (on Linux and macOS, ports below 1024 need administrator rights): start this one with a different --port"). It used to name Windows and netsh on Linux.
    - Windows: fewer background questions. launch --plan ran the same PowerShell display query 18 times (26 child processes, 15 to 17 s) and nvidia-smi 19 times once an engine was installed. The display query is now asked once per process for 2 minutes (a stuck one is cached too) and nvidia-smi once per field per 30 s. On the owner PC the plan started 10 child processes (it was 27), 4 nvidia-smi starts in total, and took 7.2 s.
    - Desktop: the first start from every new install path no longer asks Windows Defender Firewall about Node.js. The host's start-up probe for the sharing port listened on all addresses for an instant; it now listens on 127.0.0.1. Sharing is unchanged.
    - Pictures: a fixed list of formats. Strata opens JPEG, PNG, GIF, BMP, WEBP, TIFF and AVIF pictures only (see the security fix below). A JPEG 2000, ICO, PPM or PSD picture now gets the existing "the image could not be read (...)" message instead of being converted.
    Fixed
    - A reply could go to the wrong request when a model runs in more than one copy (#2892, a privacy bug). With replicas (the same model loaded twice so two requests run at once), the request that took a copy over could read the one before it finished: it got an empty reply, or text containing the earlier request's text, and its token counts were the other request's. We reproduced it on the old code by forcing the hand-over moment: 30 of 30 forced hand-overs crossed. The window is microseconds wide, so 60 unforced back-to-back requests were clean on the old code too. Now the first request's output is closed before the copy is released and the figures are copied per request: 30 of 30 forced hand-overs and 60 of 60 unforced requests are clean, and a frozen copy (stopped with SIGSTOP) leaves routing and its error reaches the caller. Python server only; the engine C++ was not touched. Related, not reproduced (#4451): batched output reaching another client could not be reproduced with the fake engine or a real one (680 clients per arm on an RTX PRO 5000, IQ3_S, --batch 4, 0 cross-deliveries on the old and the new code); two real holes were shown and fixed in the Python server (after an engine restart a request of the old process stayed attached to the new process's slots; vram() and session_file() could take a running request's lines, which ended a request at 212 of 421 tokens).
    - Chat and the app:
      - #5192: with long chats the saved copy lost text. In a test, 12 messages of 140,000 characters were sent through the old writer and 6 came back; now 12 of 12 come back byte for byte after two restarts. On the Windows app, a chat of 16 big messages (110 KB x 12 and 300 KB x 4) lost 8 of 16 in the session before and kept all of them (3.59 MB) after quit and restart; a second run restored 34 messages with 0 clipped. Text already cut by the old writer ([shortened in the saved copy]) cannot be recovered.
      - #5008: with two chats in one folder, a turn listed the other chat's file as its own. A turn now reports only the files its own tools wrote (Windows app, 3 to 4 rounds with marker files: own file only, right content).
      - #5079: a dead WebView2 renderer left a blank white window. Killed by process id on the Windows app: the page came back in about 3 s (kills 1 and 2), the third kill within two minutes left the browser error page and Reload restored the chat. Before, no recovery.
      - #5180: the Markdown preview did unbounded work while tokens streamed (50 unrelated updates were 50 renders before, 0 after). We could not reproduce the reported 4.4 GB memory blow-up from the report itself. On the way we found and fixed a second bug, which is also in 0.2.10.
        - A Markdown list with Windows line ends (CRLF), which PowerShell's Add-Content writes, made the renderer loop until memory ran out. In the changed-file case it grew to 4.4 GB in 25 s, on 5 of 5 runs.
        - A unit test shows the loop: the old code runs out of memory in 4 of 4 runs and the new code passes 4 of 4. A plain browser test did not show it; the check in the real app did.
        - It may be what the report saw; we can't confirm that.
        - On the release-candidate app build the same case showed "Version Two" six times with the renderer at most 171 MB. A page reload after killing the renderer with the preview open stayed at 159 MB.
      - The sidebar preview used to keep the first content of a file it already showed; it now shows the file's current content after it changed on disk.
      - #4653: the sidebar More menu (and other menus) opened off screen at an Interface size other than 100%. Edge 156 matrix (4 display scales x 3 window heights x 7 Interface sizes), cases passed 0.2.10 / this release: Mode 43 / 77 of 77; sidebar More 49 / 84 of 84; Reasoning effort 20 / 76 of 77; Add or open 47 / 76 of 77; chat options 22 / 77 of 77; model picker 55 / 77 of 77; subagents 35 / 77 of 77. The Settings dropdowns (72 cases each) 4, 33, 3 before and 69, 61, 61 after (the rest are harness rows where the control scrolled out of view at 200%). Left as it is: at display scale 175% + Interface size 200% + a 600-pixel-high window (a 343 px page) Reasoning effort's first item is covered and Add or open covers part of its button. A dropdown now opens as tall as the room allows instead of a fixed 320 px.
      - #4397: an empty or malformed Host header killed the app host; it now gets a 400 ({"error":"bad_host"}) and the host keeps running.
      - #4535: the API key is compared in constant time (SHA-256 digests); two other header secrets too.
      - #4221: opening /?q=... in the web client sent the question at once; it now fills and focuses the box and sends nothing until Send (4 cases on the app: plain, punctuation, unicode, 6,000 characters).
      - #4878: a quiet stream could be dropped by the web view (see the beat frame above).
      - #4533: Linux, a chat title cut in the middle of an emoji; titles are now cut at a character.
      - The Models page showed "Connect engine" and "Download & load" for a model that was already downloaded, for about 30 s after an app start (7.6 s to 35.8 s, 3 of 3 rounds). The host now says it is still checking until Control has answered, and the page shows the existing "Checking..." label. On the release-candidate app build, 3 of 3 rounds showed "Checking..." and then "Load model", with no wrong label, while a build ran on the same PC.
      - Start-up: the page could stay on "Connecting to the local engine..." when one of its start-up requests hung. Only the requests for setup, models, engine, serving and workspaces are needed to go live, each with an 8 s limit and 3 tries; the others (hardware, monitor, skills, providers, image models, runtime) fill in when they arrive. With /api/hardware made to hang, the full interface was up at once and the request was retried 3 times in 20 s.
      - Settings showed "args_written is not a setting Strata reads" on every freshly set-up model; those keys are known now.
      - A low-RAM copy of the experts that did not fit on disk named the model folder's drive; it now names the packs folder in Strata's data folder and the free space there, with next steps.
    - Starting, stopping and updating:
      - #5177, #5059: the app declared a start failed while the engine finished loading fine (Control's owner process answered its status request only after planning, with a 5 s limit; the first-token check shared the load's deadline). Planning now runs in a thread with phases (preparing, launching, loading, checking the engine, verifying generation), the status call is retried while the owner lives, and the first-token check has its own 180 s budget. The full SHA-256 pass over the engine files is kept.
      - #4973 (macOS): the owner stopped the engine silently when one look at the app host failed; it needs 3 failed looks in a row now, and the app marks the instance stopped after 3 failed polls when Control says stopped, failed or stale. We have no Mac that reproduced it; the causes are from the code and the issue's log. #4293 (PR): the app keeps and watches a start that Control stopped waiting for.
      - #4975, #5185 (Windows): Control identified the computer through WMI, which can hang; the operating system and machine are now read without it. A stuck WMI cost 18 queries x 15 s in a plan before.
      - #4574, #4893: a host that outlived its server now reports failed with a log tail for 10 s and leaves. #4824: strata launch already cleared failed hosts and kept --save-preset after a failed start; the host that stayed alive after its server exited was the #4574 case. #4250: a host lost before launch is recovered when its marker is exact.
      - #4529, #4570: Stop and a timed-out command end the whole process group on Linux and macOS (as taskkill /T does on Windows). On the Windows app an agent command with child processes, then Stop: 5 processes, all gone 4.5 s after Stop.
      - #4260: bench run --profile puts the engine tree in a job object and ends it through that. We did not reproduce the original "Access is denied".
      - #4463: strata update now sees a server started by running serve.py directly and uses a checkout's own engine store. #4352: the free-memory check releases this server's own picture encoder.
      - #3961 (mitigated, cause unknown): a stream that ended without an end event is now an error and the engine is ended, so "the next request restarts it" is true; the engine is ended only if it is still the process that request ran on and nobody else has the turn.
      - #4895 (partly): a memory wait that found nothing freed is not repeated for every later tuning candidate.
      - #4661 (Windows, whole-PC freeze after launch, bounded not reproduced): the drive-temperature reader now runs only for the Monitor screen's own request, never in the first 60 s of the host, asks only drives Windows names NVMe, one at a time, and a marker file drive-temperature.probe in %LOCALAPPDATA%\Strata stops it from starting again after a crash or a first pass longer than 45 s. Not run on any PC that froze. See "Behaviour that changed".
    - Terminal and launcher:
      - #4395, #4396: a damaged profile lent its neighbour's config or port, or made launch mint a new API key. Reproduced and fixed.
      - #4398: a failed launch --stop exits non-zero and no longer ends with "Nothing is running".
      - #5178, #5132, #4985: a --set draft-conf was saved as 0.35 but the engine got 0.8; launch now rebuilds the launch file with calibrated values and hand edits carried (see the order above). The hand-typed settings.json calibration keys in the second observation of #5132 were not investigated.
      - A launch whose own profile or run config could not be read (permissions) used to make a new API key and then fail; it now stops before anything is written (exit 2 for the profile, 6 for the run config), with owner-approved wording, and "A new API key was made" is said only after the run config holding it is written. Checked on Linux.
      - bench run --profile ended with SIGTERM left the engine (Linux) or the server and the engine (macOS) running; SIGINT during the model load lost the child. Both now end in 1.2 to 2.9 s with nothing left (Linux RTX PRO 5000: 2.7 s and 2.4 s; Mac M4: 1.2 s and 2.9 s).
      - #4484, #4483: bench results.json is redacted like the other report files; a credential of "none" is no key; a key is replaced as a whole word in its own case and next to a hyphen; redacting twice gives what once gives (no <<user>>). A login or host name that is an ordinary word no longer rewrites field names or reasons (it turned "user payload" into " payload").
      - #5006: client config for OpenCode and Claude Code writes an output cap of max(4096, context / 8) (16384 at 128K) instead of 4096, and keeps a cap you set. Config side only; not run in OpenCode.
      - #5027: --set mmap-experts on|off|auto works for DeepSeek. #4088: a full-length model shard whose size is pinned is hashed and repaired instead of being marked whole.
      - #4971, #5111 (partly): an integrated GPU (a 512 MiB Radeon carve-out) no longer outvotes a discrete Arc card, card numbers above 9 are seen, and an unlisted Battlemage or Alchemist id counts as an Arc of the family's smallest memory. No Battlemage card to run it on.
      - #5086: the Intel (SYCL) server crashed at start with unexpected keyword argument 'announce'. Fixed; real start on an Arc A750 (IQ3_XXS, 12.4 tokens per second, 3 chats answered right, no GPU hang).
      - #5056, #5122, #5078 (first two points): tuning now starts its worker without STRATA_API_KEY; a candidate that adds no memory is judged against the memory the base had free at its own start; a skipped-for-memory run says "N settings could not be tried: not enough free memory" (the Terminal says "some not tried") instead of "already the fastest we found"; an engine abort shows its own error line and counts as out of memory.
      - update --check on a source checkout prints the tree's own Control version instead of ?.
    - Tool calls and the server:
      - #5040, #4701: a streamed tool argument that lists the closing tags lost its end when text arrived in small pieces (139 of 216 characters came through at chunk sizes 1 and 7). The call is held while a closing tag is arriving; the final call was already whole.
      - #4738: a request waiting for the control lines could miss a wake-up. #4271 (part 1): a streaming client that stops reading no longer holds the engine's turn (a socket write with no progress for 60 s ends the request as a disconnect). #4479, #2481: server console output goes through a bounded queue so a blocked console cannot hold a request. #4792: a failed engine start no longer crashes when another thread closed the process. #5044 (Python parts): a refused batch admission is an error row with no totals, and engine output with a byte that is not UTF-8 is read. #3443: ConvCacheLog.poll runs under a lock.
      - #2518: a branching follow-up of a long chat went to the wrong slot, so another chat's slot was used. Simulation (4 chats of about 9,600 tokens, 12 interleaved branching follow-ups): retained prefix 96,000 tokens (83%) before, 115,200 (100%) after. Not a GPU run.
    - Security:
      - Pillow 13.0.0 (advisory GHSA-78g4-xqwv-q3g8, severity high: a memory-write bug in the JPEG 2000 decoder, reached by opening a crafted picture; affects 11.1.0 up to but not including 13.0.0). Python 3.11 and newer get 13.0.0; Python 3.10 stays on 12.3.0 and is covered by the format list above. The 0.1.57 Terminal and Control for Linux x86_64, Windows, the Mac and the DGX Spark carry Pillow 13.0.0 with Python 3.12, and so does the Control inside the desktop installers; engine packages carry no Python. An existing install keeps 12.3.0 until it is updated.
      - #4202: the prompt for the image tool (sd-cli) went on the command line, where other programs on the computer could read it; it now goes in an owner-only file (--prompt-file). Not run with a real sd-cli.
      - #5075: quant_formats --hf crashed with an AttributeError; fixed.
    - Engine (Qwen):
      - The 0.2.10 crash on 2 x 16 GB layer splits ("mmq out of memory" on the first long prompt) and the failure of every start on 2 x 8 GB (see the table).
      - Strix Halo, UD-Q4_K_XL, a prompt chunk of 32768 (STRATA_PREFILL_AUTO_MAX=32768 or --prefill auto:32768, which nothing sets by itself on a Strix): the engine died after reading the prompt when the shared memory pool was nearly full (a stream for the next step could not be created). It now stops at the start with one line and exit code 2 before any prompt is read: "a 32768-token prompt chunk does not fit beside the 52.1 GiB expert cache on this GPU (a stream could not be created): use --prefill auto:16384, or a smaller --expert-cache". The 0.2.10 engine crashes the same way. The check catches the case when the pool is full; on one Strix start through the Terminal (automatic cache and expert-cache=14000) the engine instead started and stepped the chunk down to 6144 at the first request. The setup tip for 32768, the tuner's prefill_32k arm (discrete GPUs only now) and the app's automatic retry no longer apply to a Strix. The stale #1630 warning is no longer printed on a Strix.
    Probably fixed, please retest
    - #5071 (Japanese input): the Enter that commits a conversion no longer sends the message (first Enter within 50 ms after the composition ends, or key code 229, counts as the IME's). We replayed the event orders of WebView2, WKWebView and WebKitGTK; we did not capture them on a real WKWebView or WebKitGTK.
    - #4533, #4485 (Linux): the window aborted when drawing the COLRv1 colour emoji font in WebKitGTK. The shell now keeps that font away from the window process only, and only when it is installed. The crash and the fix were not shown on WebKitGTK.
    - #4661 (Windows freeze): see above; we could not run it on a PC that froze. If your SSD temperature line is missing in the Monitor, see "Behaviour that changed".
    - #4973 (macOS), #3961, #4895, #4260: fixes from reading the code and the reports; see the lines above.
    - #3750 (reserve of 3256 MiB on a 16 GB card): already capped at 1536 MiB for cards of 16 GB or less in 0.2.10, now pinned by tests. The engine still skips every memory adaptation when --vram-reserve-mib is given and the app always passes it; that part needs an engine change and is not in this release.
    - #5111: an unlisted Battlemage card counts as an Arc; not tried on one.
    Behaviour that changed
    Each line says how to put 0.2.10's behaviour back. A value you set yourself is kept unless noted.
    - NVIDIA, compute capability 8.0 and up: the K-quant prompt kernels are on for Unsloth UD-Q4/Q5/Q6_K_XL files. Off: STRATA_MMQ_KQ=0, STRATA_NV_KQ_DEFAULT=0, or STRATA_DEFAULTS=026. Volta, Turing and Pascal keep the old path.
    - NVIDIA, compute capability 8.0 and up: a bare --prefill auto takes a 32768-token ceiling (was 8192). The fit scan can still pick a smaller chunk when the cache cannot lend the buffers, and the RAM guard steps 32768, 16384, 8192 when memory is short. A layer split takes 8192 back (STRATA_SPLIT_CHUNK16K=1 keeps the ceiling). Back to 0.2.10: STRATA_NV_CHUNK=0 or STRATA_DEFAULTS=026 (8192); STRATA_NV_CHUNK=16 keeps 16384; STRATA_NV_CHUNK=1 skips the RAM guard. An explicit --prefill N, --prefill auto:N or STRATA_PREFILL_AUTO_MAX is never touched. Volta, Turing and Pascal keep 8192.
    - Linux Radeon gfx12 (R9700, RX 9000): the K-quant prompt kernels are on (off: STRATA_MMQ_KQ=0, STRATA_GFX12_DEFAULTS=0 or STRATA_DEFAULTS=026); the bare --prefill auto ceiling is 32768 (was 16384; STRATA_GFX12_CHUNK=16 keeps 16384, =0 keeps 8192); the prompt staging ring is 256 or 192 slots below chunks of 12K tokens (back to 96: STRATA_GFX12_RING=0 or STRATA_PREFILL_RING=96). Setup no longer writes STRATA_ROUTE_TAIL_SKIP=0 for Unsloth files on these cards (back: set STRATA_ROUTE_TAIL_SKIP=0). R9700 numbers for these defaults, from the tests that led to them: K-quant kernels 4K +10.3%, 8K +14.3%, 32K +16.8% (n 3, first-token KL 0.031, agent 0.065, top-1 23 of 24); the 32768 ceiling IQ3_S 8K +0.9%, 20K +12.1%, 32K +1.3%, 64K +2.6% (3 rounds; KL at most 5e-5 against the default) and UD-Q4_K_XL 20K +26% (n 2); the ring on IQ3_S 2K +2.3%, 4K +16.1%, 8K +2.7%, 20K +0.1%, 32K +0.1% (first-token logits and 12 of 12 greedy hashes identical). The Strix keeps the 0.2.10 ring and the 16384 chunk.
    - Linux NVIDIA with batch slots (--parallel or --batch of 2 or more): the FP16 weight cache is on, keeping 3 GiB of the card free. Off: STRATA_PF_W16_CACHE_MIB=0. Not on Windows, AMD or Metal.
    - Auto starts the all-cards split engine on 4 R9700 cards for IQ3_S-type files too (expert types Q2_0, IQ2_S, IQ3_XXS, IQ3_S, IQ4_XS, IQ4_NL). Two and three cards are unchanged. Off: --split-engine off. The AMD split engine's default is 8 request slots (was 6); a number you choose with --parallel stays; NVIDIA keeps 6. FNX_PF_PEER=0 brings back the host-memory prompt sums, FNX_PF_A2A_ROWS=0 the ring for short chunks, FNX_SH_FUSE=0 the old shared-expert path.
    - Auto for the split engine counts free memory minus 700 MiB, not card size. Busy cards get DFlash2 and no draft-layer fetch.
    - Two NVIDIA cards, split engine: new prompt-path defaults (the hyper-connection read divided between the cards when a matching math routine is found, FNX_PF_HCSPLIT=2 with 4 chunks of 8192 rows a pass, passes limited to 8192 rows while other requests decode; the int8 prompt attention FNX_PFX_ATTN_I8 on for IQ3_S-type files and off for others; the tensor-core GDN scan FNX_PFX_GDN_TC off for IQ3_S-type files and on for others). Four chunk sets instead of two cost about 0.6 GB more per card; on a UD-Q4_K_XL file on 2 x 48 GB cards the engine picks the largest of 8192 x 4, 8192 x 2, 4096 x 4, 4096 x 2 chunks that fits (A6000: 8192 x 2). Each variable accepts =0 or =1; for 0.2.10's path set FNX_PF_ROWS=4096, FNX_PF_HCSPLIT=0, FNX_PFX_ATTN_I8=0, FNX_PFX_GDN_TC=0. The HCSPLIT=1 form is bit-identical to the old path; the 8192-row chunk and the int8 attention change the last bits.
    - CUDA layer split and single discrete cards: the CPU / upload share follows the CPU pool by default (ceiling 0.95, factor falling from 1.85 at 30 GB/s of expert bytes to 0.8 at 12). Back to 0.2.10: STRATA_PCIE_AUTO_SPLIT=0, STRATA_PCIE_K_RULE=0, STRATA_PCIE_SHARE_MAX=0.60. Integrated GPUs, HIP layer splits and STRATA_DEFAULTS=026 keep the old rule.
    - Layer splits on short cards trim and walk (see What is new). Cards that hold only part of their experts (the 12 to 24 GB class) have a 256 MiB smaller cache on later cards, which can change the last bits of a greedy answer; cards that hold everything are bit-identical. Old path: STRATA_STAGE_TRIM=0, STRATA_SPLIT_EARLY_OFF=1, STRATA_SPILL_OFF=1; keep the drafter: STRATA_MTP_KEEP=1; the 256 MiB term is off under STRATA_DEFAULTS=026.
    - A named DFlash2 keeps your number of requests; it used to fall back to MTP with "DFlash2 isn't available in this mode". Back: --drafting mtp or Auto. A start that stops for lack of memory is retried once with no drafter.
    - Chats are stored in the data folder. A 0.2.10 app opened later still reads its own browser copy, which 0.2.11 no longer updates (the move left it untouched); chats made in 0.2.11 are only in the chats folder. There is no setting to turn the new storage off.
    - The plan's card line has both numbers (see What is new).
    - Streams: a socket write with no progress for 60 s ends the request as a disconnect (STRATA_STREAM_WRITE_TIMEOUT_S, 0 = off); server console output goes through a bounded queue (STRATA_BLOCKING_CONSOLE=1 turns that off). After a request has left and the engine was told to stop, an engine that says nothing for 300 s plus 600 s is ended and the next request restarts it; every line the engine writes restarts those limits.
    - The Monitor's SSD temperature line appears only on the Monitor screen's own request, not in the first minute, only for NVMe drives. After a crash or a freeze while the reader was asking a drive, or after a first pass longer than 45 s, the line stays hidden until you delete the marker file drive-temperature.probe in Strata's state folder (%LOCALAPPDATA%\Strata on Windows). Nothing else is affected.
    - Pictures accept the format list above; client config writes the larger output cap; the Strix refuses an oversized chunk at the start.
    - Python 3.10 installs stay on Pillow 12.3.0.
    The DGX Spark
    The Spark (linux-aarch64) gets the same 0.2.11 Terminal and Control, the 0.1.57 Qwen engine and the 0.1.57 DeepSeek engine, built on a Spark from the source of this release. Its feed is strata-feed-linux-aarch64.json, at sequence 121. On a Spark, the release files were run like this:
    - Update from 0.2.10: a 0.2.10 setup made with the public install.sh updated the engine and Control from 0.1.56 to 0.1.57, and strata --version said 0.2.11. Rollback to 0.1.56 worked, and a second update worked too.
    - A fresh 0.2.11 install: IQ3_S started in 68 s and answered 3 chats. A small red picture was answered "Red".
    - Not run: the DFlash2 drafter (not downloaded for the test), speed numbers, and a DeepSeek model.
    Apart from the GB10 chunk-size comparison in the table above and the FP16 weight cache parity test on sm_121, none of the engine speed work in this release was measured on the Spark.
    Going back to 0.2.10
    strata components rollback returns to the 0.1.56 engine; Control stays 0.1.57, so strata --version still says 0.2.11. Checked on Linux, Windows and a DGX Spark after an update from a 0.2.10 install ("Engine rolled back: 0.1.57 → 0.1.56"); not checked on a Mac. To put an engine default back, use the off switches in "Behaviour that changed". To go back to the earlier drafting behaviour: strata launch --drafting mtp. To turn the split engine off: --split-engine off or STRATA_SPLIT_ENGINE=0. To start with a smaller context than 131,072: --max-context. For the app, install the 0.2.10 installer over it: it reads its own browser copy of your chats, which is the one 0.2.11 left untouched at the move, so chats made or changed in 0.2.11 are not in it; they stay in the chats folder of Strata's data folder.
    What we ran on the release files
    The release packages were installed from a signed local copy of the 0.2.11 feed (sequence 121) into empty scratch homes and run with models already on each PC. Every archive matched its size and SHA-256 in the feed. The Terminal said strata 0.2.11 (build 0.1.57).
    - Linux engines with a real model: each one was started, answered 3 chats (one of them a tool call that read a file) and stopped cleanly, with no error line in the engine log.

