      | engine, Radeon RX 9070 class          | Radeon AI PRO R9700 | Qwen3.8 IQ3_S    | 53 s                                          | about 91 to 98 tokens per second                                        |
      | DeepSeek engine, Radeon RX 9070 class | Radeon AI PRO R9700 | DeepSeek 2.25bpw | 371 s (one-time preparation and a 165 s load) | 4 to 25 tokens per second                                               |
      | engine, CUDA 13                       | RTX PRO 5000        | Qwen3.8 IQ3_S    | 23 s                                          | about 152 to 163 tokens per second                                      |
      | engine, Intel Arc (SYCL)              | Arc A750            | Qwen3.8 Q2_0     | 50 s                                          | 8 to 11 tokens per second (the 66 GB file streams through an 8 GB card) |
    - Windows Terminal: the 0.2.11 Windows Terminal in an empty scratch folder installed the Windows CUDA 13 engine from the feed in 12 s (signature and file checks, test start). It then started Gyro-S on an RTX 5070 in 204 s, including a one-time preparation and a 90 s load, answered 3 chats and stopped cleanly.
    - Update from 0.2.10: on Linux the public 0.2.10 install.sh, and on Windows the public 0.2.10 Terminal, were installed into scratch homes and pointed at the 0.2.11 feed. Both accepted it with their built-in keys and updated Control and the engine from 0.1.56 to 0.1.57. strata --version then said 0.2.11, and strata components rollback went back to the 0.1.56 engine. The app's in-app update from 0.2.10 was not run.
    - Desktop app: the Windows installer and the Linux AppImage carry valid update signatures (key B6B0999905521F5E) and say 0.2.11. The AppImage passed the repack check (see #4337 under "Known problems"). The installer itself was not run, because it writes the PC's own registry keys; the app tests ran on a test build of the same code (see below). The Mac app is built from the same code, signed with Developer ID and notarized; its signing run started the app and checked its signature, but did not load a model.
    - Engine packages: every package's manifest says 0.1.57 with build id 975eaab2bb40 and the toolkit (for example +cuda13.0). Every package passed package_engine --verify and the library scan: each library it needs is in the package or comes from the system or the driver. On Linux every program file has RUNPATH $ORIGIN or none, and needs at most GLIBC 2.34 (2.38 for the Intel package, which is built on Ubuntu 24.04). The Qwen engine's --version prints strata 0.1.57 with no commit, as in 0.2.10; the DeepSeek engine prints build 975eaab2b. The Mac engines link only system frameworks.
    Before the release files existed, the release candidates were run as follows (heads before the final one: 548fdf061 and 0fa4288d3, not the files above):
    - Windows desktop app (owner PC, RTX 5070), QAGUI: a release-style build of 548fdf061 with one test-only addition (a debugging port); the installer was not run, the install layout was assembled by script. Scenarios 1 to 14 and 16 passed on the final pass, except the sidebar preview of a changed file (renderer out of memory 5 of 5, which led to the CRLF fix above). On 0fa4288d3 the changed-file preview passed, menus and Settings dropdowns at 150% and 200% passed, a hung start-up request passed, and a 10-minute smoke ran 6 tasks with 0 failed (minimum 9.25 GiB available). Context was 32K or 64K with a 7 GiB resident budget, pictures off, because the app's default left 8.3 to 8.9 GiB free on this 63 GB PC. A 2-hour soak on 0fa4288d3 at 32K ran 66 tasks (39 chats, 13 agent tool loops, 9 stop tests, 2 model reloads, 3 app restarts) with 0 failed, 0 error lines and no memory growth in any process over 720 samples (engine private bytes 24.2 to 24.8 GB, renderer at most 178 MB), at least 9.28 GiB available. On 3c4afa8d7 (the Models page fix) the Models page passed 3 of 3 rounds and a 10-minute smoke ran 6 tasks with 0 failed (at least 9.95 GiB available).
    - Terminal, QATUI: l620 (RTX PRO 5000) chain of 13 scenarios on 548fdf061, a terminal walk in tmux (all screens, resize to 80x24 and 60x16), a 60-minute soak (98 cycles, 1,960 requests of which 588 were dropped on purpose, 0 HTTP errors, 0 empty answers, 0 failed launches or stops, 0 leftovers, server RSS 206 to 207 MB, engine RSS 79.6 to 80.0 GB flat); boston (2 x A6000: numbering, layer split, stop and start again, split engine); an Arc A750 box (one empty answer in 2 of 5 on the earlier head did not recur: 5 of 5 answered or hit the 400-token test cap); a Mac mini M4 (Gyro-S; bench SIGTERM and SIGINT); the owner PC (Windows Terminal, RTX 5070, Gyro-S: launch 170 s, 3 plain and 2 streamed chats, models list --served, stop twice, nothing left, lowest available RAM 9,874 MiB). On 0fa4288d3: the port text on Linux and macOS, the ? key list at 80x24 and 60x16, the Windows plan's child processes, and a Linux smoke all passed. A Strix run on an earlier head: plan, launch in 53 s, chats and stop passed; Strix was not used in the final pass.
    - Engine speed work is from branch builds (see the start of this page), 0.2.11 not yet re-run on the release packages.
    Known problems
    - The first answer of some agent prompts depends on the chunk size. The sparse block selection inside the model's attention sits on near-ties (the gap between the lowest chosen and the highest unchosen block is under 1e-3 on 75 to 93% of queries), so any change in rounding flips which blocks are picked on 70 to 90% of queries, and a few last positions amplify it. Changing the chunk size in either direction (4096, 6144, 12288, 16384, 32768 against 8192) moves a few agent prompts by an O(1) KL; plain text barely moves (KL about 1e-5). It is not specific to 32768. On the 96-request fair set (the suite's own prompts and later-turn agent contexts, RTX PRO 5000, IQ3_S, all experts resident, floor 0): 32768 against 8192 mean KL 0.023, p90 0.029, max 1.24, top-1 94 of 96; the 8192 path with a different equally valid rounding switch gave 0.022 / 0.016 / 0.99 and 93 of 96; the decode-path read gave 0.026 / 0.028 / 0.95 and 91 of 95. Earlier agent-prompt KL figures (the route-tail skip 0.203, the K-quant kernels 0.065 and 0.052) may be inflated by this effect and were not re-measured.
    - The 32768 chunk on Windows was not exercised above 8K. On the RTX 5070 (12 GB) the engine's chunk was 7,936 whatever the ceiling (RAM guard and fit scan), so no chunk above 8K ran on Windows. A memory check of a 17,000-token prompt at a chunk above 16384 rows ended with 0 errors but only a partial prompt read (the job hit its time limit); it was not repeated.
    - DFlash2, several requests, 64 GB PC, large context: on the Windows app with --max-context 65536 --draft dflash2 --resident-budget-gib 7 --conversation-cache-mib 768 --spec 6 --batch 4, four requests at once took the PC from 25,074 MB to 7,416 MB available; the engine's private bytes were 28.2 GB and everything else on the PC stayed constant, so we think it is the engine's request-time growth, which the app's "keep 8 GiB free" (decided at load) does not cover. At 32K the same run stayed at 10.5 GiB and answered all four. Agent turns at 64K with a 7 GiB resident budget took the same PC under 8 GiB available 4 times (7,955 to 8,159 MiB available, engine private 23.6 to 24.3 GB). The test's own guard ended the engine each time; the engine was not the one to crash. Not fixed in this release.
    - One first chat request after 20 minutes idle took 440 s (the engine used 5.3 to 7.3 cores at 15 to 20 tokens per second with an 11.8% expert-cache hit; normal is 32 to 57%). The idle was not the cause: 20 minutes idle gave 28 s on a repeat, and the first request after a load takes 82 s against 26 s later because of the prompt-prefix cache. Not reproduced; cause not found.
    - #5153: when the engine runs without the MTP drafter (including DFlash2-only runs), saving or restoring a conversation snapshot can fail with "conversation snapshot: invalid K/V extent"; the next request reads its prompt again. Cause found by reading (the save and restore handlers pass the MTP state unconditionally); the fix is in the engine and is not in this release. #3288 / #3036 (snapshot copies on a Windows gfx1201 card at 262144 context) were also left for the engine.
    - #4337: the AppImage's bundled ripgrep (rg) can crash with SIGSEGV. The likely cause is linuxdeploy rewriting a static-PIE's dynamic section; we showed it on a synthetic stand-in, not on the real rg. The repack script now checks static PIEs and smoke-runs rg. On the release AppImage the check found no damaged static PIE, and the bundled rg (ripgrep 15.0.0) ran and found its test match. A crash on a real PC was never reproduced, so this stays listed until a report confirms it.
    - Engine-side reports (device faults, wrong output, stalls, memory admission) were triaged on paper only this round (for example #5103, #5147 / #5149 (a hang with --pipeline-windows 2 and the drafter on the first card), #5104 (workaround: --set STRATA_PREFILL_LAYER_MAJOR=0), #5021). None is fixed here. #4451's real cause, if it is a wrong slot number in the engine, is also still open.
    - Strix Halo: UD-Q4_K_XL can stop on the first request after a start (7 of 30 starts on 0.1.55; UD-IQ4_XS ran 99 starts without it). With a 64 GB graphics split Windows reports 63.6 GiB of RAM, so setup keeps --expert-cache auto (66.86 GiB, larger than the split), on which prompts were 11 to 13% slower than with a 46 GiB cache; the setup warning does not say that. A cache budget of 11000 or less does not start and ends with the engine's own "prefill: copy stream" message. UD-Q4_K_XL greedy text varies from run to run (code_py 4 to 5 different outputs in 16 runs on both 0.2.10 and 0.2.11; first-token logits are bit-stable).
    - Apps: the Harness process exits with code 1 at every quit (the last line of the desktop log; harmless). The first "Prepare and load" of your own model folder says "Nothing is copied or downloaded" while it downloaded a 40 MB llama.cpp source and copied the picture file and the DFlash2 pack. "Open" on a file card starts the system's default program for the file (VS Code on one PC); "Open in sidebar" is under the chevron. If a draft-layer download fails and a DFlash2 download follows, the dialog does not list the second download.
    - Terminal: --set draft-conf=off with DFlash2 is replaced by the automatic value (0.35) with no notice; --gpu 1 on a one-card computer is accepted and the plan shows card 0 as "GPU 1 (--gpu 0)"; on the Advanced screen long Default and Tuned values run together; a stopped server leaves one stale procs\<pid>.json until the next start.
    - Carried from 0.2.10, not re-measured in this release: DeepSeek answers can differ between starts at temperature 0 (one or two experts per card sit differently from start to start, and the expert cache moves experts between CPU and GPU); a DeepSeek tool call can come out broken when most of the model streams from the SSD (1 of 5 runs at 13% of the default set in memory, temperature 0.6); the DeepSeek drafter is fetched even with --dspark off; the Mac Terminal archive and DeepSeek folder are signed and notarized but carry no stapled ticket; on Intel Arc A750 11 test programs that need 64-bit floats abort and the engine does not repeat its own answers exactly; on Windows with an AMD card the DeepSeek package is built for the Ryzen AI Max (gfx1151) only; the all-cards split engine does not support logprobs or logit_bias (a clear error names --split-engine off). None of these was checked again in this release.
