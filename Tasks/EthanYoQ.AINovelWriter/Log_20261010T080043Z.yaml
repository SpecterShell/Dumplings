    1.2.1-Preview
    - 修复安装后停在“启动尚未完成”、无法进入工作台的问题。
    - 修正默认数据目录冲突。保留原用户目录、外观设置和项目文件，无需删除配置后重装。
    - 增加默认目录启动和重启检查。安装验收须确认工作台可用，不能只检查窗口是否出现。
    这是 1.2.0-Preview 的启动修复版。版本名保留 Preview，使用正式发行渠道。
    请从本页下载安装包。旧版无法通过应用内更新识别此 Preview 版本。
    Windows 安装包未签名。Mac 安装包未获 Developer ID 签名和 Apple 公证。系统可能提示未知发布者或阻止打开。

