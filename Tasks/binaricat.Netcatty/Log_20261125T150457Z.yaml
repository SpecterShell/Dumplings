- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    ✨ Release Highlights
    Netcatty v1.1.91 delivers a major performance, responsiveness, and packaging overhaul—cutting idle CPU, memory leaks, startup bundle size, and tab-switch jank—alongside detached tab windows, workspace pane rearrangement, Windows CMD/PowerShell Directory Picker, SFTP default download folder and archive workflows, a durable global AI session manager with bulk execution, and macOS frosted-glass appearance.
    ⚡ Performance, memory, and smaller builds
    - Snappier tabs, side panels, and SFTP: narrowed active-tab, side-panel, and SFTP pane subscriptions, removed 60fps HostTreeSidebar resize layout thrashing, gated redundant WebGL atlas wipes on window focus, coalesced aside/vault drag resizes with requestAnimationFrame, and eliminated whole-shell re-renders on clicks, focus, and typing (#4117, #4362, #4364, #4365, #4366, #4367, #4368, #4369, #4371, #4375).
    - Lower idle CPU and leak fixes: paused hidden/idle stats, port-forwarding, and MCP polling timers, capped live WebGL contexts across split panes, fixed timer/FD/SSH-decoder/listener/Monaco-command leaks on session and editor close, and replaced quadratic hot paths in terminal output history, timestamps, keyword highlighting, and worker output buffering (#4118, #4122, #4239, #4370, #4372, #4373, #4374, #4377, #4379, #4382, #4383, #4397, #4403).
    - Faster startup and leaner packages: code-split heavy startup modules (re2js, css-tree, Monaco), switched Markdown code highlighting from full @streamdown/code to fine-grained shiki/core, converted Nerd Font symbols to WOFF2 without legacy .woff fallbacks, trimmed unused Monaco locales, and pruned unused app.asar payloads (#4115, #4120, #4385, #4387, #4388, #4390, #4391).
    🖥️ Terminal, tabs, and workspaces
    - Move any tab into its own window without reconnecting, reopen recently closed tabs and workspaces (Cmd/Ctrl+Shift+T), and rearrange workspace panes while keeping empty or single-member workspaces intact (#4202, #4325, #4158).
    - Closing a terminal tab focuses the adjacent terminal tab instead of jumping back to Vaults or SFTP, and closing session panes stays distinct from closing tabs (#4320, #4339).
    - Directory Picker now supports Windows PowerShell and Windows CMD (plus OSC 7 reconnect fixes and an inline compose-bar picker), and local terminal hosts support optional startup commands (#4113, #4177, #4343, #4356, #4326).
    - Compose bar, syntax, and autocomplete: reorder pinned snippets, isolated right-click menus, bracketed multiline compose submissions, Nginx syntax highlighting, localized Fig command descriptions per target OS, and faster Enter response with large command history (#4327, #4290, #4163, #4010, #4172, #4180, #4026).
    - Terminal stability: preserved pane geometry through zoom/restore (without Escape unzooming), capped ligature joiner spans to prevent WebGL 16384px atlas spikes, fixed Ctrl+Insert/Shift+Insert copy-paste and IME voice duplication, preserved timestamps after clear, live jump-host display, and per-host SSH input compatibility (#4337, #4170, #4358, #4357, #4142, #4304, #4056, #4316, #3977).
    📁 SFTP and file transfers
    - Configure a default download folder in Settings and choose a custom temp directory for SFTP staging (#4392, #4035).
    - Stream packed downloads with local folder restoration, create archives and one-click Duplicate files/folders from the context menu, navigate with Back / Forward directory history, and insert paths or cd directly into the paired terminal (#4179, #3936, #4133, #4324, #4323).
    - Skip auto-opening the SFTP side panel for network devices, use remote cp for fresh same-host copies, map WSL terminal cwd to the local Windows pane, double-click into tree folders, preserve non-ASCII paths in Windows compressed uploads, and keep SSH alive when cancelling mid-transfer (#4321, #4226, #4212, #4166, #4058, #4135, #3944).
    🤖 AI assistant and External MCP
    - Global AI session manager with /chats, /rename, and cross-scope /rebind so conversations stay recoverable across workspace changes. Chat sessions now persist per record in IndexedDB (removing the 2 MB localStorage limit) and remember the active chat across restarts (#4159, #4018, #4019, #4125, #4302, #4356).
    - Run a command across multiple sessions with terminal_execute_bulk, configure the tool-output truncation limit, use the OpenCode Go provider and GPT-5.5 xhigh reasoning effort, and filter vault_hosts_list by query or group (#4342, #4328, #4253, #4111, #4278).
    - Broader shell prompt readiness: safe OSC 133 readiness, unrecognized prompts surfaced as an actionable unknown state instead of hard blocking, and recognition for Powerline (U+E0B0–U+E0B7), Oh My Zsh (➜, ys), Powerlevel10k (❯), macOS zsh/root, Enter-PSSession, bracketed time prompts, and two-line prompts (#4110, #4198, #4359, #4079, #4076, #4008, #4197, #3980, #4229, #4277, #3961, #3963).
    - requestAnimationFrame-batched reasoning streams, theme-accented user message bubbles, automatic stale model-catalog refresh, Anthropic Bearer auth and signed-thinking fixes, and automatic socket reconnects for external MCP (#4378, #4317, #4263, #4269, #4074, #4016, #4182).
    🔐 SSH, port forwarding, and cloud sync
    - Configurable SSH reconnect interval (5–3600 seconds), capped exponential backoff for port forwarding reconnects, ChaCha20 cipher support in Electron's crypto runtime, saved password prefill on SSH auth retry after MFA failure, and OpenSSH host certificate fingerprinting by underlying key (#4039, #4322, #3992, #4350, #4222, #3974).
    - Cloud sync and storage: preserved occupied groups during Smart Merge, kept full AI chat history in cloud sync without interrupting active agent turns, skipped unchanged WebDAV vault downloads on auto-sync inspect, and added startup recovery for missing Chromium LevelDB CURRENT files (#4344, #4047, #4045, #4025, #4312, #4315).
    ✨ Appearance, monitoring, and platform polish
    - macOS frosted glass window background and tray panel blur, system-locale default language on first launch, and completed zh-TW localization (#4013, #4028, #4318, #4185).
    - Improved disk I/O and partition alerts in monitoring, full CPU core list in System Manager, unified tooltips, better small-screen and half-screen tiling window fit, Linux Secret Service keyring support on non-GNOME/KDE desktops, Nix/home-manager SSH config workaround, and Windows ssh:// Default Apps registration plus cleaner NSIS upgrades (#4031, #4184, #4360, #4254, #4178, #4190, #4192, #4205, #3962).
    Code signing policy
    Netcatty is applying to the SignPath Foundation open-source program. Once
    approved, covered Windows release artifacts will use Free code signing provided by SignPath.io, certificate by SignPath Foundation.
    See the
    Code signing policy
    and Privacy policy.
