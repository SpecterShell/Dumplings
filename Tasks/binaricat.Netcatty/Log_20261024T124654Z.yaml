    ✨ Release Highlights
    Netcatty v1.1.86 speeds up SFTP transfers and makes them more resilient on flaky links, expands SSH authentication and proxy options (including host TOTP), deepens the Docker panel with Kubernetes and runtime switching, and tightens AI/MCP workflows plus everyday terminal and Vault UX.
    ⚡ Faster, more reliable SFTP
    - Transfer throughput climbs with TCP_NODELAY, fanout uploads that fit one window on the shared session, barrier-free folder transfers, and lighter per-frame UI updates during progress (#3813, #3816, #3817, #3815, #3818, #3862).
    - Retry after a dropped connection resumes from the last checkpoint, including more channel-loss cases from the bridge, and recovers from abandoned channel-open failures on lossy links (#3823, #3864, #3865).
    - Uploads fail promptly when the SFTP connection is gone, unfinished transfers no longer freeze quit, and pending quit checks stay fail-closed. Completed uploads keep their files even when backup cleanup only warns (#3814, #3821, #3892, #3895).
    - Follow-cwd races that left the panel stuck after cd are fixed. Network-device and single-channel SSH sessions dial SFTP separately when needed, OTP page sessions reuse the authenticated channel for transfers, and TERM-SSHD work on shared channels stays serialized (#3761, #3759, #3801, #3889, #3880).
    - Open SFTP from the terminal context menu, and local file metadata refreshes before copy so stale listings do not mislead transfers (#3878, #3694).
    🖥️ Terminal workflows and side panels
    - Shift+Enter defaults to ESC+CR (Alt+Enter) without counting as command submission, with migration for the older newline setting. Compose-bar send is separate from toolbar broadcast, and Enter reconnects while the compose bar is open (#3770, #3775, #3860, #3768).
    - Show per-GPU usage in the server stats bar, open the current session log from the toolbar, toggle the host list with Ctrl/Cmd+Shift+B, and click archive names to fill an extraction command (#3781, #3834, #3868, #3787).
    - Autocomplete shows zh-CN and zh-TW descriptions for common commands. Custom CSS hooks target the selected top tab. Launch with --open-terminal-shell when you want a local shell up front (#3773, #3780, #3772, #3778).
    - Side-panel tool switches, history, and notes stay snappy: keep the history panel mounted while hidden, skip notes tree work when a retained panel hides, and commit tool switches in one render. Tab hibernate soft-hides the tab that just left when keep capacity is full, and side-panel refs resync after queued external writes (#3896, #3898, #3897, #3900, #3902, #3903).
    - Tab close survives drag gestures, title-bar window controls keep terminal focus, switching tabs avoids repeated atlas rebuilds, and input survives IME commits, mid-line snippets, heredoc broadcast paste, popup close, and local-shell cwd restore without OSC 7 (#3887, #3888, #3758, #3873, #3782, #3769, #3798, #3866, #3784).
    🔐 SSH authentication, proxies, and quick connect
    - Store host TOTP with QR scan and MFA auto-fill so multi-factor SSH prompts fill themselves (#3788).
    - Set a global default proxy with an explicit direct override per host. Temporary connections can opt into legacy algorithms, and temporary network-device mode plus tab-bar quick connect (lightning icon) speed ad-hoc access (#3774, #3792, #3793, #3803).
    - Inherit X11 forwarding from group defaults. Host-key rekey no longer re-prompts—the known key is answered synchronously. HTTP and SOCKS5 proxy replies keep bytes coalesced (#3777, #3845, #3804).
    - Port forwarding tolerates missing host OS metadata and cleans up runtime owners after a tunnel stops. PuTTY bastion tab titles show the final server (#3750, #3838, #3859).
    - Connect to local Windows named pipe consoles from the serial path (#3894).
    🤖 AI, MCP, and OpenCode
    - OpenCode 2.x works alongside 1.x. Reversible AI privacy settings are shared across Catty, agents, and MCP, with guarded privacy handoffs on OpenCode v2 (#3802, #3805, #3808).
    - Get an alert when an External MCP approval is waiting, including the tool name. Optional Streamable HTTP transport joins stdio for External MCP. Bridges reconnect after Netcatty restart and fail fast when managed stdio drops (#3771, #3779, #3790, #3872, #3874).
    - Model pickers hydrate from a last-known-good catalog and fetch on demand; manual refresh bypasses the warm cache, and catalog warnings clear once a good catalog serves. Catty image attachments survive routine context compression, and slow-starting CLIs get a longer version-probe timeout (#3884, #3765, #3753).
    - Scoped session opening keeps host sessions bound to workspaces, waits for shell prompts, and retains connection history for agent workspace opens (#3893).
    🐳 Containers, Kubernetes, and monitoring
    - Switch container runtimes in the Docker panel and browse Kubernetes pods alongside containers (#3791).
    - Monitoring shares Linux disk I/O sampling and refreshes on a one-second cadence. Stats history survives panels that read before sampling, and stale series retire when replacement sampling starts (#3870, #3747).
    🗂️ Vault and host organization
    - Marquee-select hosts and drag the selection onto groups. CSV import/export round-trips jump-host chains, and editing group details preserves order (#3789, #3827, #3843).
    - Vault unlock reuses the verified key. Connection-log replays move to IndexedDB with tighter persist caps, merge once per persist, skip side-store parse outside log windows, and keep the newest entries when quota is hit (#3841, #3861, #3848, #3852, #3853, #3855).
    - Host tree flattening reuses the manual order index for snappier large collections (#3842).
    ✨ Everyday polish
    - New Host menu icons stay full size, toast contrast respects mismatched app/system themes, and the in-app browser stays live beside overlay side panels (#3795, #3851).
    Code signing policy
    Netcatty is applying to the SignPath Foundation open-source program. Once
    approved, covered Windows release artifacts will use Free code signing provided by SignPath.io, certificate by SignPath Foundation.
    See the
    Code signing policy
    and Privacy policy.
