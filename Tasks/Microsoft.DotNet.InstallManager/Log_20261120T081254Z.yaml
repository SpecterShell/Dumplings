- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    .NET 10 migration
    DNIM now ships using the .NET 10 runtime.
    Signature validation for JSON data
    The detached signatures for the releases.json and releases-index.json files are now verified. The signature check for these files cannot be bypassed. Offline deployments should be updated to include the .p7s detached signatures.
    Implicit Offline Revocation Checks
    The --offline-revocation-checks option has been removed. Offline (cached) revocation checks are automatically performed when the --offline option is specified.
    Trusted host validation
    The update and layout commands now use the same logic to validate hosts before downloading installer bundles.
    Default retension for updates
    The update command will retain the latest installed versions for products in active support if neither --keep-latest-product-version nor --keep-latest-support-phase is specified.
    ASP.NET Core Module detection
    ASP.NET Core Module installations can be detected and classified. Both ANCM v1 and v2 installations are detected. Since early releases of ANCM shipped across multiple .NET and .NET Core releses, the lowest applicable release is used for classification.
    Faster packed GUID processing
    Packed GUID conversion was optimized for Windows Installer searches to reduce allocations and GC load.
