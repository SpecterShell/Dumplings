  Value: |-
    ThinkReader 0.9.56 · Windows x64
    本版修复已安装 Windows App 下载更新后重启仍显示旧版本的问题。点击“安装并重启”后，ThinkReader 会保存草稿、退出，在原安装目录静默执行已校验的完整安装包，并核对安装器退出码与最终版本。正常流程不显示安装向导。失败时会提示并写入 update-install.log。
    旧版更新代码无法追溯修复。如果旧版点击安装后仍显示原版本，请用下方 Windows 安装版覆盖安装 0.9.56 一次。之后 App 内更新会使用新流程。下载缓存中的安装包也是完整安装包，通常位于 %LOCALAPPDATA%\thinkreader-desktop-updater\pending\。
    English: Installed Windows updates now run the verified full installer silently in the running App's directory after ThinkReader exits, then verify the installed version. If an older client reopens at the old version, install 0.9.56 once with the Windows installer below.
    验证范围：Windows 11 x64；完整源码回归、打包检查、冻结后端/桌面冒烟，以及隔离目录中的真实 App 内 0.9.55 → 0.9.56 下载、安装、数据保留和重启。更新源使用本地 loopback。未测试全新 Windows 系统、真实外部服务或 macOS。本次 Windows 二进制未签名。
    私有源码实现提交：ef209efd62da2bf4a27760362ed82c74e1e002fc。原 0.9.42 故障没有留下当时的 NSIS 退出码；旧客户端复验确认，当安装登记位置与运行位置不一致时，旧流程会将新版装到登记位置，原 App 仍显示旧版本。不能据此断言原 0.9.42 故障只有这一原因。

