  Value: |-
    Windows 卸载页只保留三项完整选项，默认均不勾选：删除用户数据、卸载对应 MinerU 环境和模型、删除所有已登记 Library 库数据。
    三项独立生效；保留未勾选的数据、其他 uv 工具与无关模型。修复超过 12 个最近使用项目后遗漏外部 Library 的登记问题，并在清理无法安全完成时返回错误。
    源码提交：4ff902fcfa69a569be150ac7c5f075e1e649d15d。Windows 完整回归、14 组卸载清理检查、原生卸载界面与实际清理、打包后端/桌面冒烟、隔离安装环境下 0.9.53 → 0.9.54 的实际应用内更新和自动重启均通过。测试使用合成库及小型测试模型/工具；未重跑真实 MinerU 解析或 Agent 服务。更新验收使用本地更新源及独立 NSIS 身份，不等同于全新 Windows 系统测试。
    本次只发布 Windows x64 安装版、便携版、ZIP 和更新文件；Windows 二进制未签名。macOS 0.9.54 已从同一源码完成原生打包，继续保持私有，不提供公开 Mac 更新。
