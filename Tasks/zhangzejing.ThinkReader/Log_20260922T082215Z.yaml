  Value: |-
    ThinkReader 0.9.3
    Built from private implementation commit 6d6aef330f1d624136385fedfb28802715bcc0e0. The previous 0.9.2 release remains available in the development repository.
    - First-run MinerU setup now separates local parsing (MinerU Kit and complete Pipeline/VLM models) from API parsing (lightweight Open API CLI and token). Both paths provide detection, download progress, resource locations, copyable commands and repair controls in Settings.
    - Local and API extraction use their respective official MinerU CLI contracts. MinerU 4 output is normalized into ThinkReader's existing document-intelligence format.
    - Agent CLI discovery, first-run navigation, diagnostics and error codes have been improved. Model detection now follows MinerU CLI verification and its reported repository locations before using saved paths as fallback. The five-step indicator is centered, and the final setup transitions show immediate visual feedback while validation completes.
    - From 0.9.3 onward, in-App updates install silently and restart after checking unsaved drafts. Differential download remains enabled, with full download fallback. Older installed versions may show their existing installer wizard for the first upgrade.

