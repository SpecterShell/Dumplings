    The Windows binaries are unsigned. Complete source regression, source first-run smoke, packaged backend smoke, real MinerU 4.0.3 Standard model verification, and a real authenticated Open API CLI request passed. The installed-App upgrade and silent-restart tests were performed on an earlier 0.9.3 candidate, not these final binary bytes. Clean-machine installation, manual visual acceptance and other MinerU versions have not been verified.
