  Value: |-
    ThinkReader 0.9.59
    - 手稿主题英文采用随包提供的 Source Serif 4 Italic；中文文楷和公式字体保留。
    - 跨栏区域批注按实际区域分别绘制边线与轮廓，连接线指向最近的实际区域；句子 Hint 不再混入相邻栏的文字范围。
    - 在已验证段落范围内，利用精确匹配的相邻句和段落边界恢复部分段首、段中、段尾 Hint。保持数字、否定词和整句缺失保护，推断结果不继续充当下一次推断的锚点。
    - 批注动画默认显示为 1×，实际速度保持上一版默认值，可调 0.25–4×；已有速度按新标尺换算。该设置不改变 Agent 推理或生成速度。
    - 标签页关闭按钮显示手形光标。
    原有未绑定的 Hint 不会自动重写；需要重新定位或重新生成。此次索引修复保留原 PDF、批注和用户编辑过的阅读副本。
    Windows 为正式版，macOS Apple Silicon 使用独立预览标签。两端的实际验证范围、源码提交与文件校验值见下文。
    下载校验
    macOS 单独发布为预览，Windows 保持稳定 Latest。
