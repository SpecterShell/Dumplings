Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    本版更新
    - 修复 PDF 标题显示 NullObject：将 PDF 空对象按空值处理，补充 XMP、PRISM、DOI/Crossref 元数据识别。刷新元数据或重新导入同一 PDF 可修复旧的无效标题，保留正常标题、文献身份和原始 PDF。
    - 新增“帮助与更新”内下载、进度、取消/重试及“退出并安装更新”。下载完成校验后，由用户确认安装；安装前检查草稿保存。
    - 启动时检查更新。发现新版后，帮助按钮显示独立的圆圈下载图标，与 Agents、库主页共用主题颜色，跟随主题、深浅模式和强调色；悬停显示“有可用的更新”。关闭帮助面板后保留提示及下载状态。
    - 发布安装版、便携版、ZIP，以及 App 更新需要的 latest.yml 和安装包 blockmap。
    0.8.6 及更早版本需要先手动安装本版一次，之后可在“帮助与更新”中更新。 便携/ZIP 用户通过安装向导安装新版后，请使用新安装的快捷方式。
