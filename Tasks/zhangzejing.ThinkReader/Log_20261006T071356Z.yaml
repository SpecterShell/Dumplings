  Value: |-
    ThinkReader 0.9.61 — 批注布局与并发内存
    本版修复左栏批注误放到右侧和多 Agent 工作时内存升高的问题，并发布已安装试测的批注阅读改进。
    - 双栏正文恢复各自外侧布局，支持 LeCun 这类窄栏间距；整行摘要不会把两栏合并。三栏中间栏在同页选定一侧，单栏按段落两侧实际空间选边。狭窄空隙不会把卡片压成细条。
    - 卡片逐张出现，已出现的卡片保留位置；Hint 在悬停或选择时展开，也可由目标段落触发。连接线随页面固定，避开 Hint 和未选中的正文，不绘制远距离跨栏箭头。
    - 新生成标题、正文和其他 Skill 共用 ASD-STE100 启发的写作原则：短句、统一术语、一条 Hint 一个要点、保留必要条件。长度为弹性写作目标，不截断完成内容，不宣称中文 STE 认证。
    - App 按源句的端点定位 Hint，改善公式混排匹配；图像以整图区域和单一外框处理。新建批注在侧栏关闭时复用同一批注接口和页面临时输入框。
    - 任务轮询省去完整历史工具输出和私有检查点，活动日志按需展开输出；阻止重叠轮询。PDF 单页位图预算约 32 MiB，释放中间画布，缩放时保留已完成画面。
    - 继续记录白屏/渲染错误，并在崩溃或无响应时附上此前的进程内存采样；正常运行不持续写入这些采样。
    Windows 验收
    实现提交 fbc4782847ccda2ec7b4889dad9610aa311a7916，Windows 11 x64；完整源码回归 125/125，89 个独立后端测试文件。当前资源/冻结后端/MCP、打包桌面、中英文首次 Profile 和 loopback MinerU API 流程通过。
    10 篇真实 PDF 覆盖 2 篇单栏、7 篇双栏和 1 篇三栏。使用原始 PDF 和当前前端检查自动卡片宽度、选边、悬停/选中、连接线与缩放/滚动。三栏包含通过服务创建的布局夹具；另对真实 Agent 新生成的 29 张三栏批注逐张选中验收。新 /browse 的 92/92 条 Hint 通过可见高亮、源文匹配和端点覆盖检查。
    三个真实 Cursor App Agent 同时运行 /summary、/browse、/annotation，两轮分别新建 Channel、Actor workspace 和原生会话，共 6 个任务全部完成。首个可见回复为 22–46 秒。较长整篇任务约需 8–12 分钟，不承诺三分钟完成。第二轮全程持续界面监测，未发现白屏，渲染进程峰值约 417 MiB。使用真实原文和隔离 Library，不向用户论文写入测试批注。
    真实 Agent 和内存对照在前一实现 d0056f96050215eba85739f4941db2a09c8e8f5b 上执行。最终提交只增加连接线对同一 PDF 文字项内剩余文字的避让与回归；后端、资源、轮询和位图预算代码相同。最终前端重新通过 10 篇布局矩阵、29 张新批注和完整回归；原生任务结果没有用新会话重复生成。
    用户历史任务列表从 22,280,503 字节降至 375,485 字节，约少 98.3%。LeCun 在 278% 缩放下进行 54 次换页和 80 次缩放：App 全部进程合计私有内存峰值从 2461.3 MiB 降至 1471.8 MiB，约少 40%；这是受控对照，不代表每台机器或仅渲染进程的降幅。
    最终候选通过现有 App 的检查、下载、SHA-512 校验和真实静默安装。安装后 1645 个文件与本次 unpacked 一致，9 篇用户论文对应的 32 个 PDF、批注及阅读/输出文件哈希未变。更新源为 loopback，不等于全新机器或公开 GitHub 更新安装验收。
