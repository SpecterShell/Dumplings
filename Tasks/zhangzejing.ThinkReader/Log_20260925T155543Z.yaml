  Key: ReleaseNotes
  Value: |-
    ThinkReader 0.9.50 improves reading, annotations, Agent settings and quick file switching. This version supersedes 0.9.43 and supports normal in-app updates.
    本次更新
    - Agent Profile 直接编辑名称、角色指令、Harness 与模型。Cursor 加载实际可用模型，Codex 支持模型及思考强度切换；切换模型保留原生会话。
    - 快速切换缓存 Library 文件名，只更新变化目录，先显示已打开、最近文件和已加载论文；Home、Agents、PDF、Canvas、Markdown 使用不同图标。
    - 完成、失焦和点击外部时收起 @agent 提示；健康检查保留在命令中，移除常驻按钮。
    - 回答正文可选择复制，作者行与空白区域保留拖拽。Read with Agents 从工具栏、右键和选区展开并排对话，可将回答保存为批注或回复。
    - 多栏只移动被拖动的页面，自动收起拥挤侧栏，已打开侧栏按钮高亮。
    - Hint 独立匹配原文，匹配失败允许目标为空；组合块可覆盖多个段落。批注链接在 Markdown 中显示紧凑卡片，点击选中对应批注。
    - /audit 提供第二位研究者的新观点与讨论回复，输出包含真实批注链接；Agent 可创建纯高亮、修改颜色/位置、回复和更新批注。
    - 全文输入与工具分页避免截断，尽早保存批注并流式输出进展；flash 单遍速览，图片图注不再默认翻译。
    - Summary 面向窄侧栏、按实际实验组织结果，长度仅作生成指导，不因超长压缩、重写或报错。
    - 增加 Zotero 导入与可选接收；Claude SDK 支持外部 MCP 工具授权。本版暂不迁移 ACP。
