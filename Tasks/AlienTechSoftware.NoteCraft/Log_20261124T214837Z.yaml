  Key: ReleaseNotes
  Value: |-
    Alpha nightly build. NoteCraft is not a finished product. It has had little use, and the folder format can still change. Keep a backup of any notebook you care about.
    Built automatically from main. The web build is live at https://notecraft.cloud/demo/.
    The desktop files are not signed. Windows SmartScreen may show "Windows protected your PC": choose More info, then Run anyway. macOS may say the app is from an unidentified developer: right-click it and choose Open. Check a download against SHA256SUMS.txt, or with gh attestation verify <file> --repo AlienTechSoftware/notecraft.
    The Android APK (android-arm64.apk, 64-bit ARM, Android 8 or later) is signed with the project's release key, so each nightly updates the last one in place. Allow installs from your browser or file manager to install it.
    Your notebooks are plain folders, and no desktop installer or uninstall touches them. Report bugs at https://github.com/AlienTechSoftware/notecraft/issues. What is missing is listed in docs/gaps.md.
    What's Changed
    - Polish notebook navigation, search, and File screens by @DWAA1660 in https://github.com/AlienTechSoftware/notecraft/pull/462
    - fix(web): allow the fourteen-language Welcome notebook by @mameen in https://github.com/AlienTechSoftware/notecraft/pull/467
    - fix(web): expect fourteen language folders in the Welcome check by @mameen in https://github.com/AlienTechSoftware/notecraft/pull/468
    - fix(ui-egui): paragraphs show no block header, box first block keeps it by @mameen in https://github.com/AlienTechSoftware/notecraft/pull/470
    - fix(ui-egui): block + belongs to the box frame, not page content by @mameen in https://github.com/AlienTechSoftware/notecraft/pull/471
    - docs(devx): add fork/clone and agent initiation steps to README_DEV.md by @mameen in https://github.com/AlienTechSoftware/notecraft/pull/472
    - fix(ui-egui): draw colour emoji fonts on every platform by @mameen in https://github.com/AlienTechSoftware/notecraft/pull/474
    - fix(demo): add the Turkish OCR section and guard every language by @mameen in https://github.com/AlienTechSoftware/notecraft/pull/476
    - Fix emoji editing, search, and layout in smaller windows by @iamsko in https://github.com/AlienTechSoftware/notecraft/pull/473
    - fix(ink): preserve short final endpoint in smooth_open_curve by @OurOchs in https://github.com/AlienTechSoftware/notecraft/pull/482
    - fix(deps): report a pen's barrel buttons as mouse buttons on Wayland by @leifrossau in https://github.com/AlienTechSoftware/notecraft/pull/479
    - release: v0.0.20 by @notecraft-nightly[bot] in https://github.com/AlienTechSoftware/notecraft/pull/487
