  Key: ReleaseNotes
  Value: |-
    Alpha nightly build. NoteCraft is not a finished product. It has had little use, and the folder format can still change. Keep a backup of any notebook you care about.
    Built automatically from main. The web build is live at https://notecraft.cloud/demo/.
    The desktop files are not signed. Windows SmartScreen may show "Windows protected your PC": choose More info, then Run anyway. macOS may say the app is from an unidentified developer: right-click it and choose Open. Check a download against SHA256SUMS.txt, or with gh attestation verify <file> --repo AlienTechSoftware/notecraft.
    The Android APK (android-arm64.apk, 64-bit ARM, Android 8 or later) is signed with the project's release key, so each nightly updates the last one in place. Allow installs from your browser or file manager to install it.
    Your notebooks are plain folders, and no desktop installer or uninstall touches them. Report bugs at https://github.com/AlienTechSoftware/notecraft/issues. What is missing is listed in docs/gaps.md.
    What's Changed
    - perf(ui-egui): open a page without waiting on its files downloading by @leifrossau in https://github.com/AlienTechSoftware/notecraft/pull/431
    - test(ui-egui): count the tabs' reads without feeding the file watcher by @leifrossau in https://github.com/AlienTechSoftware/notecraft/pull/452
    - perf(ui-egui): write a page's ink out off the window's thread by @leifrossau in https://github.com/AlienTechSoftware/notecraft/pull/420
    - feat(ui-egui): fit long page titles and tidy the status footer by @mameen in https://github.com/AlienTechSoftware/notecraft/pull/455
    - feat(emoji): emoji on each block, saved with the page by @mameen in https://github.com/AlienTechSoftware/notecraft/pull/457
    - OCR on pictures, OCR test and label lab, ranked search by @mameen in https://github.com/AlienTechSoftware/notecraft/pull/456
    - feat(ui-egui): lock pages read only, with a demo page on menus by @mameen in https://github.com/AlienTechSoftware/notecraft/pull/458
    - docs: update feature parity for current NoteCraft capabilities by @Zaxaerith in https://github.com/AlienTechSoftware/notecraft/pull/459
    - release: v0.0.19 by @notecraft-nightly[bot] in https://github.com/AlienTechSoftware/notecraft/pull/461
    - fix(packaging): expect 14 demo languages by @alientechsw in https://github.com/AlienTechSoftware/notecraft/pull/463
    - release: v0.0.19 by @notecraft-nightly[bot] in https://github.com/AlienTechSoftware/notecraft/pull/466
