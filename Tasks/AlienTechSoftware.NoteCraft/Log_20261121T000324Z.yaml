  Key: ReleaseNotes
  Value: |-
    Alpha nightly build. NoteCraft is not a finished product. It has had little use, and the folder format can still change. Keep a backup of any notebook you care about.
    Built automatically from main. The web build is live at https://notecraft.cloud/demo/.
    The desktop files are not signed. Windows SmartScreen may show "Windows protected your PC": choose More info, then Run anyway. macOS may say the app is from an unidentified developer: right-click it and choose Open. Check a download against SHA256SUMS.txt, or with gh attestation verify <file> --repo AlienTechSoftware/notecraft.
    The Android APK (android-arm64.apk, 64-bit ARM, Android 8 or later) is signed with the project's release key, so each nightly updates the last one in place. Allow installs from your browser or file manager to install it.
    Your notebooks are plain folders, and no desktop installer or uninstall touches them. Report bugs at https://github.com/AlienTechSoftware/notecraft/issues. What is missing is listed in docs/gaps.md.
    What's Changed
    - ci(nightly): land the version bump through the merge queue by @alientechsw in https://github.com/AlienTechSoftware/notecraft/pull/421
    - ci(nightly): fetch only the LFS objects the branch push needs by @alientechsw in https://github.com/AlienTechSoftware/notecraft/pull/425
    - docs(skills): Git LFS in nc-devx, nightly workflow in release signoff by @mameen in https://github.com/AlienTechSoftware/notecraft/pull/427
    - feat(engine): debounce external file changes and defer mid-stroke by @OurOchs in https://github.com/AlienTechSoftware/notecraft/pull/413
    - fix(ui-egui): the canvas pans no higher than the page's top by @leifrossau in https://github.com/AlienTechSoftware/notecraft/pull/418
    - perf(ui-egui): read a page's pictures off the window's thread by @leifrossau in https://github.com/AlienTechSoftware/notecraft/pull/419
    - feat(ui-egui): the trackpad puts down a pen the pen picked up by @leifrossau in https://github.com/AlienTechSoftware/notecraft/pull/423
    - docs: refresh drawing guide for implemented ink features by @Zaxaerith in https://github.com/AlienTechSoftware/notecraft/pull/428
    - fix(test): step the repaint test until the window settles by @mameen in https://github.com/AlienTechSoftware/notecraft/pull/430
    - ci(nightly): allow the branch push without the LFS objects by @alientechsw in https://github.com/AlienTechSoftware/notecraft/pull/432
    - fix(engine): synchronize watcher wakeups by @mameen in https://github.com/AlienTechSoftware/notecraft/pull/434
    - fix(engine): refresh tree after watcher baseline by @mameen in https://github.com/AlienTechSoftware/notecraft/pull/435
