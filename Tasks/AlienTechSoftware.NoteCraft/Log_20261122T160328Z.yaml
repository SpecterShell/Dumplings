  Key: ReleaseNotes
  Value: |-
    Alpha nightly build. NoteCraft is not a finished product. It has had little use, and the folder format can still change. Keep a backup of any notebook you care about.
    Built automatically from main. The web build is live at https://notecraft.cloud/demo/.
    The desktop files are not signed. Windows SmartScreen may show "Windows protected your PC": choose More info, then Run anyway. macOS may say the app is from an unidentified developer: right-click it and choose Open. Check a download against SHA256SUMS.txt, or with gh attestation verify <file> --repo AlienTechSoftware/notecraft.
    The Android APK (android-arm64.apk, 64-bit ARM, Android 8 or later) is signed with the project's release key, so each nightly updates the last one in place. Allow installs from your browser or file manager to install it.
    Your notebooks are plain folders, and no desktop installer or uninstall touches them. Report bugs at https://github.com/AlienTechSoftware/notecraft/issues. What is missing is listed in docs/gaps.md.
    What's Changed
    - fix(ui-egui): a rack Add the full rack turns down chooses nothing by @leifrossau in https://github.com/AlienTechSoftware/notecraft/pull/437
    - docs(readme): add Sponsors and Mentions sections, Try NoteCraft badge by @alientechsw in https://github.com/AlienTechSoftware/notecraft/pull/445
    - perf(ui-egui): keep each finished stroke's shape between frames by @leifrossau in https://github.com/AlienTechSoftware/notecraft/pull/422
    - perf(ui-egui): draw the section tabs from the tree in memory by @leifrossau in https://github.com/AlienTechSoftware/notecraft/pull/424
    - feat(ui-egui): the Immersive Reader carries on after a swipe by @leifrossau in https://github.com/AlienTechSoftware/notecraft/pull/426
    - test(ui-egui): ignore the macOS-flaky tabs read test until #447 is fixed by @mameen in https://github.com/AlienTechSoftware/notecraft/pull/448
    - fix(release): deploy the website after the draft release by @alientechsw in https://github.com/AlienTechSoftware/notecraft/pull/446
    - fix(engine): open pages through links inside the notebooks folder by @mameen in https://github.com/AlienTechSoftware/notecraft/pull/449
    - docs: show the default dark theme in the README by @mameen in https://github.com/AlienTechSoftware/notecraft/pull/450
    - fix(ui-egui): picture reads, one wait per frame and less under lock by @leifrossau in https://github.com/AlienTechSoftware/notecraft/pull/436
