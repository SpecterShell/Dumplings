  Key: ReleaseNotes
  Value: |-
    Alpha nightly build. NoteCraft is not a finished product. It has had little use, and the folder format can still change. Keep a backup of any notebook you care about.
    Built automatically from main. The web build is live at https://notecraft.cloud/demo/.
    The desktop files are not signed. Windows SmartScreen may show "Windows protected your PC": choose More info, then Run anyway. macOS may say the app is from an unidentified developer: right-click it and choose Open. Check a download against SHA256SUMS.txt, or with gh attestation verify <file> --repo AlienTechSoftware/notecraft.
    The Android APK (android-arm64.apk, 64-bit ARM, Android 8 or later) is signed with the project's release key, so each nightly updates the last one in place. Allow installs from your browser or file manager to install it.
    Your notebooks are plain folders, and no desktop installer or uninstall touches them. Report bugs at https://github.com/AlienTechSoftware/notecraft/issues. What is missing is listed in docs/gaps.md.
    What's Changed
    - fix(ui-egui): a pen tap on the ribbon clicks, and the ribbon stays put by @leifrossau in https://github.com/AlienTechSoftware/notecraft/pull/478
    - feat(ui-egui): take a picture out of its box from its menu by @leifrossau in https://github.com/AlienTechSoftware/notecraft/pull/484
    - Fix note recovery, editing, and calendar regressions by @iamsko in https://github.com/AlienTechSoftware/notecraft/pull/485
    - fix(web): refresh the WASM SRI hash after wasm-opt by @mameen in https://github.com/AlienTechSoftware/notecraft/pull/488
    - fix(store): read a folder again when its listing names one twice by @leifrossau in https://github.com/AlienTechSoftware/notecraft/pull/483
    - fix(ui-egui): a click on open paper puts the caret under the pointer by @leifrossau in https://github.com/AlienTechSoftware/notecraft/pull/480
    - fix: Welcome notebook update on Windows, phone wizard, cached search by @DWAA1660 in https://github.com/AlienTechSoftware/notecraft/pull/491
    - docs(brand): add docs/brand folder with palette and logo usage by @alientechsw in https://github.com/AlienTechSoftware/notecraft/pull/492
    - feat(ui-egui): copy text from a picture or printout with OCR by @DWAA1660 in https://github.com/AlienTechSoftware/notecraft/pull/493
    - feat(ui-egui): print a page or section with preview and PDF output by @DWAA1660 in https://github.com/AlienTechSoftware/notecraft/pull/499
    - fix: link scan, conflict recovery, search paste, OCR lab tools by @DWAA1660 in https://github.com/AlienTechSoftware/notecraft/pull/500
