  Key: ReleaseNotes
  Value: |-
    Alpha nightly build. NoteCraft is not a finished product. It has had little use, and the folder format can still change. Keep a backup of any notebook you care about.
    Built automatically from main. The web build is live at https://notecraft.cloud/demo/.
    The desktop files are not signed. Windows SmartScreen may show "Windows protected your PC": choose More info, then Run anyway. macOS may say the app is from an unidentified developer: right-click it and choose Open. Check a download against SHA256SUMS.txt, or with gh attestation verify <file> --repo AlienTechSoftware/notecraft.
    The Android APK (android-arm64.apk, 64-bit ARM, Android 8 or later) is signed with the project's release key, so each nightly updates the last one in place. Allow installs from your browser or file manager to install it.
    Your notebooks are plain folders, and no desktop installer or uninstall touches them. Report bugs at https://github.com/AlienTechSoftware/notecraft/issues. What is missing is listed in docs/gaps.md.
