- Locale: en-GB
  Key: ReleaseNotes
  Value: |-
    Alpha. NoteCraft is not a finished product. It has had little use, and the folder format can still change. Keep a backup of any notebook you care about.
    These files are not signed: Windows SmartScreen may show "Windows protected your PC".
    Choose More info, then Run anyway. Check a download against SHA256SUMS.txt, or with
    gh attestation verify <file> --repo AlienTechSoftware/notecraft.
    Your notebooks are plain folders under Documents\NoteCraft, and neither the installer nor
    an uninstall touches them. The app writes notecraft.log in %APPDATA%\NoteCraft: attach it
    to a bug report at https://github.com/AlienTechSoftware/notecraft/issues. What is missing is listed in
    docs/gaps.md.
    The Android APK is for 64-bit ARM phones and tablets with Android 8 or later. The Packaging
    run's summary says whether it was signed with the release key; one signed with a key made
    for that build cannot update an earlier APK in place. Its notebooks live in the app's own
    storage (Android/data/com.alientechsoftware.notecraft/files/NoteCraft).
    What's Changed
    - fix(web): the browser build opens pages again by @mameen in https://github.com/AlienTechSoftware/notecraft/pull/441
    - feat(update): an installed copy checks for updates at startup by @mameen in https://github.com/AlienTechSoftware/notecraft/pull/439
    - release: v0.0.17 by @notecraft-nightly[bot] in https://github.com/AlienTechSoftware/notecraft/pull/442
    - chore: add Sponsor button (GitHub Sponsors, org only) by @alientechsw in https://github.com/AlienTechSoftware/notecraft/pull/417
    - fix(nightly): allow incomplete LFS push when tagging the release by @alientechsw in https://github.com/AlienTechSoftware/notecraft/pull/443
    - docs(devx): explain Git LFS setup, push and pull by @mameen in https://github.com/AlienTechSoftware/notecraft/pull/444
    Full Changelog: https://github.com/AlienTechSoftware/notecraft/compare/v0.0.16...v0.0.17
