- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    tty7 installs tty7-server on remote hosts automatically; download it manually only for offline installation. SHA-256 checksums.
    For fixes before the next stable release, try the nightly build. The phone companion is released separately.
    What’s new
    This release adds a phone companion, a message composer for agent CLIs, worktree setup and recovery, and Windows remote workspaces. It also improves daemon and SSH recovery and fixes desktop update checks when a mobile release is marked latest (reported by @zeuslcf in #1151).
    New Contributors
    - @NorthIsUp made their first contribution in #1022.
    - @Johnny0x38E made their first contribution in #1085.
    - @zuoxinyu made their first contribution in #1128.
    Changes in this release
    Added
    - A phone companion for live panes (#983, #1029, #1073, #1098).
    - A message composer for agent CLIs (#1066).
    - Worktrees can start ready for an agent (#1009).
    - Windows remote workspaces (#1041, #1040).
    - Native Windows ARM64 packages (#1043).
    - More agent integrations (#1071 by @kalpakprod).
    - Russian translation (#1072 by @kalpakprod).
    - Recently closed tabs and close confirmation (#1037).
    - Process resource usage (#1064 by @NorthIsUp, #1095).
    - Terminal theme and notification protocols (#1061 by @NorthIsUp, #1062 by @NorthIsUp).
    Changed
    - CI seeds caches from main and skips Rust jobs for documentation-only changes (#1022 by @NorthIsUp).
    - Copy joins Claude Code’s wrapped prose (#1141 by @NorthIsUp, #1149 by @NorthIsUp).
    - GitHub panels reuse unchanged responses (#1117 by @NorthIsUp, #1115 by @NorthIsUp).
    - OSC 8 links have a visible resting state (#1078 by @NorthIsUp, #1025 by @NorthIsUp).
    - Title-bar controls and sidebar navigation (#1036, #1063 by @NorthIsUp, #1060 by @NorthIsUp).
    - Local windows participate in workspace takeover (#1042).
    - Accessible application navigation.
    Fixed
    - Desktop update checks skip phone releases (#1156).
    - Recovery preserves live sessions and leaves diagnostics (#1153).
    - Daemon handoffs preserve terminal modes (#1145 by @NorthIsUp).
    - Full-screen programs repaint after old output is evicted (#1136).
    - Remote synchronization does not close unseen panes (#1125).
    - SSH connections recover from an unresponsive peer (#1129, #1035).
    - SFTP failures explain the cause (#1133).
    - Large remote workspaces remain responsive (#1034).
    - SSH credentials and host selection stay consistent (#1130, #1031).
    - Remote agent forks and missing resumes (#1016, #1024 by @NorthIsUp).
    - Mouse selection and input method positioning (#1143 by @wenlingang, #1134).
    - Text rendering respects platform settings (#1132, #1135).
    - New and deleted files remain readable in split diffs (#1138 by @NorthIsUp).
    - Light settings and title-bar alignment (#1137 by @NorthIsUp, #1139 by @NorthIsUp, #1128 by @zuoxinyu).
    - Panels and the palette keep their intended behavior (#1079 by @NorthIsUp, #1026 by @NorthIsUp, #1023 by @NorthIsUp).
    - The empty editor closes before its terminal (#1056).
    - Retry controls in the workspace switcher work (#1127).
    - Paths, themes and GitHub text handle more input (#1053, #1059 by @NorthIsUp, #1076 by @NorthIsUp).
    - History pages and sidebar grouping stay stable (#1020, #1011, #1014).
    - Quiet panes stop causing unnecessary redraws (#1015).
    - Phone connections handle proxy and DNS restrictions (#1058, #1092, #1093).
    - Phone pairing survives renewal (#1019, #1097).
    - macOS packaging supports alternate signing setups (#1067 by @NorthIsUp, #1082).
    - Long-running panes retain kitty keyboard state after reopening (#1103).
    - Phones keep receiving long-history panes and reconnect more smoothly after a screen lock (#1105, #1104).
    - Volta and other argv[0]-sensitive tools work inside Linux AppImages (#1111).
    - Sidebar controls keep their size and alignment (#1085, #1099 by @Johnny0x38E).
    - Status-only title changes avoid unnecessary redraws (#1114 by @kalpakprod).
    Full descriptions are in CHANGELOG.md.
    Full Changelog: https://github.com/l0ng-ai/tty7/compare/v26.9.4...v26.10.0
