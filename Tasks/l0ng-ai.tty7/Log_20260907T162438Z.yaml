- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    The first stable release since 26.8.3. 26.9.0 was tagged but never published, so everything from it arrives here too.
    Documents now dock beside the terminal instead of covering it, so a file or a diff can be read while the pane it came from stays visible and typeable. The prompt goes back to the shell: zsh, fish, bash and Nushell own the line again, which is what makes their completion, history search and multi-line editing behave the way they do outside tty7. A coding agent's conversation becomes an outline in the right panel, with every turn a way back into it.
    Remote work got most of the attention. A tty7-server is published for macOS, so a Mac can host a remote workspace for the first time. A remote workspace relinks its own dead panes when the link comes back. Saved SSH hosts are one click from the New Tab button, a host can be proved without spending a tab on it, and an SSH pane names itself after its host. Remote programs can copy images to the local clipboard over SSH — off by default, per host.
    Also in this release: an interface font of its own, four dark themes, Nushell OSC 7 and OSC 133 integration, in-app updates on Linux, a single UAC prompt for all-users Windows installs, tty7 server restart that replaces the server without dropping a session, and closing the last window retiring tty7 to the tray.
    Fixed in 26.9.1
    - A remote server that will not start now says why, instead of looping on "started but nothing was answering on the control socket after 15s" with no reason kept and no button offered (#774).
    - A stale pane socket no longer stops every later daemon from starting (#779).
    Full notes: CHANGELOG.md
