- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    From the follow-up report in issue #4:
    - Apps inside folders are found on macOS. Only the top level of the applications folders was read, so everything in Utilities (Activity Monitor, Terminal, Disk Utility, …) and in vendor folders was missing.
    - Apps answer to their localized names. 活动监视器 or huodong finds Activity Monitor, and with the interface in Chinese it is shown under its Chinese name. On Linux, .desktop names in other languages count as well.
    - camelCase names match by their initials. mt finds MacTap, and mac finds MyMacCleaner ahead of names that merely contain those letters. Acronyms now rank above plain substring matches.
    - Up to six app results instead of four.
    - The app list refreshes when you summon the palette (at most once a minute), so an app you just installed or moved is found right away. Launching an app that has gone away says so and refreshes the list.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    来自 issue #4 的追加反馈：
    - macOS 上文件夹里的应用也能找到了。 原来只读应用目录的第一层，实用工具里的活动监视器、终端、磁盘工具等，以及厂商文件夹里的应用都搜不到。
    - 应用认它的本地化名称。 活动监视器 或 huodong 都能找到 Activity Monitor；界面为中文时直接显示中文名。Linux 上 .desktop 里其他语言的名字也算。
    - 驼峰命名按首字母匹配。 mt 能找到 MacTap，mac 找 MyMacCleaner 时排在只是包含这几个字母的名字前面。首字母缩写的排序也调到了普通子串匹配之前。
    - 应用结果最多显示 6 个，原来是 4 个。
    - 唤出浮窗时刷新应用列表（最多每分钟一次），刚装好或刚移动的应用马上就能搜到；启动一个已经不在的应用会给出提示并刷新列表。
