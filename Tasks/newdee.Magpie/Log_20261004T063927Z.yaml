- Locale: en-US
  Key: ReleaseNotes
  Value: "- Windows Store apps in the app list. Notepad, Calculator, Paint, Terminal, Settings and every other app installed from the Microsoft Store (or as an MSIX package) had no Start Menu shortcut, so magpie never listed them and notepad found nothing on Windows 11. They are listed now, with their icons, under the names Windows shows. Windows' own apps answer to their English and their Chinese name whatever the system language: notepad, 记事本 and jsb all find Notepad. A Store app has no folder to show and cannot run as administrator, so those two entries are not in its Ctrl+K menu."
- Locale: zh-CN
  Key: ReleaseNotes
  Value: '- 商店应用也能启动了。记事本、计算器、画图、终端、设置，以及从 Microsoft Store（或以 MSIX 包）安装的应用，开始菜单里没有快捷方式，magpie 以前列不出来，在 Windows 11 上输入 notepad 什么也找不到。现在都在应用列表里，带图标，名字和系统里显示的一样。Windows 自带的这些应用不管系统是什么语言，中英文名都能搜：notepad、记事本、jsb 都能找到记事本。商店应用没有所在文件夹，也不能以管理员身份运行，Ctrl+K 菜单里就不放这两项。'
