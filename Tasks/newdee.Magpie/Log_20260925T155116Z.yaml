- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Firefox-based browsers are found now. Magpie used to look for Firefox's own folder only, so LibreWolf, Zen, Floorp, Waterfox and other Firefox forks were never indexed. It now finds any browser built on Firefox, the same way it already found any browser built on Chromium, and shows each under its own name.
    - New bookmarks show up while the browser is still open. Firefox and its forks keep recent changes in a side file for a while before merging them into the main database. Magpie now reads that file too, so a bookmark you just added no longer waits for the browser to close.
    - No more unrelated results in Web. When nothing you typed matched, Web used to list whatever bookmarks were closest in meaning, which with a few bookmarks meant all of them for any query. Now results that match your words come first and alone. Only when none do, up to three pages close in meaning are shown, marked "maybe related".
    - Opera is found, including on Windows where it keeps its data in a different folder.
    - A Chrome profile with history but no bookmarks has its history indexed. Before, a profile needed at least one bookmark to be found at all.
    - Apps that embed a browser engine (their data looks like a browser profile) are left out.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 现在能找到 Firefox 内核的浏览器了。 以前 magpie 只在 Firefox 自己的目录里找，所以 LibreWolf、Zen、Floorp、Waterfox 等 Firefox 分支从来没被收录。现在和 Chromium 内核一样，任何 Firefox 内核的浏览器都能自动识别，并用各自的名字显示。
    - 浏览器开着时，新加的书签也能搜到。 Firefox 系会先把最近的改动写在一个旁路文件里，过一阵才合并进主数据库。magpie 现在连这个文件一起读，刚加的书签不用等浏览器关掉。
    - Web 里不再冒出不相关的结果。 以前输入的词一个都没匹配上时，Web 会列出意思上"最接近"的书签；书签不多的话，不管搜什么都会把它们全列出来。现在和你输入的词对得上的结果优先，而且只显示这些；一条都对不上时，才按意思给出最多三条，并标注「可能相关」。
    - 能识别 Opera 了，包括它在 Windows 上放在另一个目录里的数据。
    - 只有历史、还没有书签的 Chrome profile，历史也会被收录。以前一个 profile 至少要有一个书签才会被发现。
    - 内嵌浏览器内核的应用（它们的数据看起来像浏览器 profile）不会被误收录。
