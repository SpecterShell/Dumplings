- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    More text verbs for the query box. Each one works on the text you type after it, or on your clipboard:
    - JSON, properly. json keeps the keys in their original order; before, it silently sorted them. json min puts JSON on one line, and json sort orders the keys. JSON that a log escaped into a string is unwrapped first. Input that doesn't parse now shows where it breaks, instead of showing nothing.
    - Hashes. md5, sha1 and sha256.
    - JWT. jwt decodes a token's header and payload on your machine and says when it expires. It also accepts Bearer ….
    - Naming styles. snake, kebab, camel, pascal and title. For example, snake HTTPServerConfig gives http_server_config.
    - QR codes. qr draws a QR code in the result row, and Enter copies it as an image.
    Errors show in red, and Enter leaves them alone. A multi-line result, such as pretty JSON, now previews on one line instead of showing only its first line.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    搜索框里的文本动词又多了几个。每个都作用于它后面输入的文字，或者剪贴板里的内容：
    - JSON 更完整。 json 保持键的原有顺序，以前会悄悄按字母重新排序。json min 把 JSON 压成一行，json sort 按键名排序。日志里被转义成字符串的 JSON 会先还原再处理。解析不了的内容现在会指出错在哪里，而不是什么都不显示。
    - 哈希。 md5、sha1、sha256。
    - JWT。 jwt 在本机解码 token 的 header 和 payload，并告诉你何时过期。也可以直接粘贴 Bearer …。
    - 命名风格。 snake、kebab、camel、pascal、title。例如 snake HTTPServerConfig 会得到 http_server_config。
    - 二维码。 qr 在结果行里画出二维码，按 Enter 复制成图片。
    出错时显示红字，按 Enter 不会复制任何内容。多行结果（比如格式化后的 JSON）现在预览为一行，而不是只显示第一行。
