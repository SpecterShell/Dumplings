- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Searching the selected text copies the selection again (#17). The copy shortcut went out while Option+Shift of the hotkey were still held, so apps saw ⌥⇧⌘C (Ctrl+Alt+C on Windows) and copied nothing, and magpie opened with an empty box. It now waits for those keys to come up, then waits for the app to actually write the clipboard instead of a fixed 160 ms. Text that was already on the clipboard counts as copied too.
    - The preview pane no longer jumps when it opens (#11). It used to show inside the narrow window first and then move right as the window widened. It now stays outside the window's edge until the window has grown, and closing works the other way round.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 划词搜索又能取到选中的文字了（#17）。之前模拟复制快捷键时，热键里的 Option+Shift 往往还按着，应用收到的是 ⌥⇧⌘C（Windows 上是 Ctrl+Alt+C），什么也没复制，magpie 就弹出一个空框。现在先等这些键松开再复制，并且等应用真正写入剪贴板，不再固定只等 160 毫秒。选中的文字原本就在剪贴板里，也算复制成功。
    - 打开预览时不再跳一下（#11）。之前预览会先挤在原来的窄窗口里，窗口加宽后才移到右边。现在窗口加宽完成之前，预览留在窗口边缘之外；关闭时顺序反过来。
