- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Files inside a ZIP find the ZIP. A ZIP is now searchable by the names of the files it holds, and the result says which one matched. Password-protected ZIPs too (ZIP keeps names in the clear), and Chinese names from Windows' own "Send to compressed folder" read right. ZIPs indexed before are read again once by themselves. 7z and rar are still found by their own name only.
    - Bookmarks and history say more (#13). The preview of a bookmark or a page from history now shows its site, the summary Firefox kept for it, where you bookmarked it and when, and how often you visited, from the earliest visit your browser still remembers to the latest. All of it comes from your browsers' own files; nothing is fetched.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - ZIP 里的文件能找到那个 ZIP。压缩包现在能按包里的文件名搜到，结果里写明命中的是哪个文件。加了密码的也行（ZIP 的文件名不加密）；Windows 自带「发送到压缩文件夹」打的中文文件名也能正确读出。之前索引过的 ZIP 会自动重读一次。7z、rar 仍只按自身文件名。
    - 书签和浏览记录的预览更有用（#13）。现在会显示是哪个网站、Firefox 记下的网页简介、收藏在哪个文件夹和收藏时间、访问过几次以及浏览器还记得的最早和最近一次访问。都来自浏览器自己的文件，不联网。
