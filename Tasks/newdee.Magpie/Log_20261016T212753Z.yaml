- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Clipboard history kept the CPU busy (#22, #23). With the history on, magpie read the whole clipboard every second to see whether it had changed; with a picture on it, it decoded the picture each second. On Windows that was about 5% of one core with a 4K picture on the clipboard, and it showed up on a Mac as 0.3–5% while idle. magpie now asks the system whether the clipboard changed (Windows and macOS keep a counter) and reads it only then: the same test now costs well under 0.2% of a core. Linux has no such counter and reads every second, as before.
    - When a copy put both text and a picture on the clipboard (a range of cells, say), the history recorded the two in turn every second. It now keeps the text, once.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 剪贴板历史一直占着 CPU（#22、#23）。打开剪贴板历史后，magpie 每秒把剪贴板完整读一遍来判断有没有变；剪贴板里是图片时，每秒都要解码一次。在 Windows 上，剪贴板放着一张 4K 图时大约占一个核心的 5%；在 Mac 上表现为空闲时 0.3%–5%。现在 magpie 先问系统剪贴板有没有变（Windows 和 macOS 有变化计数），变了才去读。同样的测试现在不到一个核心的 0.2%。Linux 没有这个计数，仍然每秒读一次，和以前一样。
    - 一次复制同时放了文本和图片时（比如复制一片单元格），历史里会每秒交替记一次文本和图片。现在只记文本，记一次。
