- Locale: en-US
  Key: ReleaseNotes
  Value: "- Well-known short names are built in. ps finds Adobe Photoshop, ai Illustrator, pr Premiere Pro, ae After Effects, au Audition, lr / lrc Lightroom, id InDesign, and the rest of Adobe's two-letter marks, plus ppt for PowerPoint. They work out of the box, alongside any aliases you add yourself. An app gets a short name only when its name holds the full product name, so an unrelated app that happens to say \"Bridge\" does not. Thanks to @Tikas in issue #4."
- Locale: zh-CN
  Key: ReleaseNotes
  Value: '- 内置常用软件简称。 ps 找到 Adobe Photoshop，ai 找到 Illustrator，pr 找到 Premiere Pro，ae 找到 After Effects，au 找到 Audition，lr / lrc 找到 Lightroom，id 找到 InDesign，Adobe 其他两字母简称同理，另有 ppt 找到 PowerPoint。装好就能用，也可以和你自己写的应用别名一起生效。只有应用名里包含完整的产品名才会获得简称，所以名字里碰巧有 "Bridge" 之类单词的其他应用不会被误加。感谢 @Tikas 在 issue #4 的建议。'
