- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Apps show up at once again in the Local tab. Apps, system commands and files used to be fetched together, and the list waited for the slowest of the three. That was the file search, which runs your query through the AI models and can take a second or more on a busy Mac. Now each part shows as soon as it's ready: apps come first, and files join below them. If you move to a row before the files arrive, it stays selected.
    - An app whose icon hasn't loaded yet shows the first letter of its name instead of an empty box. The icon replaces it when it's ready.
    - After each search, Magpie checks in the background whether any of the apps shown have changed, for example after an update, and reloads their icons if so. The results don't wait for this.
    - A slow search now writes a line to the log saying where the time went: text model, image model, waiting, ranking. If search is slow for you, that line tells us which part to fix. Your query is never logged.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 本地标签页里的应用又能立刻出来了。 以前应用、系统命令和文件是一起查的，列表要等三者中最慢的那个，也就是文件搜索：它要把查询送进 AI 模型，Mac 忙的时候可能要一秒以上。现在谁先查完谁先显示：应用先出来，文件随后接在下面。文件到之前你选中的那一行，文件到了之后仍然选中。
    - 图标还没加载好的应用，先显示名字的首字母，不再是空白方框；图标好了会自动替换。
    - 每次搜索后，Magpie 会在后台检查显示出来的应用有没有变化（比如刚更新过），有的话重新读取图标。搜索结果不等这一步。
    - 搜索慢的时候，日志里会记下时间花在了哪里：文本模型、图像模型、等待、排序。如果你遇到搜索慢，这一行能告诉我们该修哪一段。查询内容本身不会写进日志。
