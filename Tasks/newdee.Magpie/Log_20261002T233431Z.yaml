- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Add common places. Settings → Local Files → Add common places… lists where saved things usually land on this computer: Downloads, the desktop, the screenshots folder and, on Windows, the folders WeChat and QQ keep received files in. Each shows how many files it holds; only the ones you tick are added.
    - New and changed files on the empty box. With Recent opens on the empty box on, the Local tab also lists files in your folders that are new or changed this week, opened through magpie or not. On Windows a file copied or unzipped in counts as new even though it keeps an old date.
    - The preview waits for you to stop (#13). With the preview pane open, a local file loads its preview once the selection rests on it for 0.8 s, so arrowing down a list no longer decodes every image and PDF on the way. Meanwhile an image shows its thumbnail. Starred repos still show at once.
    - The preview closes with the palette (#13). Put the palette away and the next summon starts without the pane.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 添加常用位置。设置 → 本地文件 →「添加常用位置…」列出这台电脑上东西通常存去的地方：下载、桌面、截图文件夹，Windows 上还有微信、QQ 收到的文件所在的文件夹。每一项都标了文件数，只添加你勾选的。
    - 空搜索框列出新增或改过的文件。打开「空搜索框显示最近打开」后，本地文件页还会列出文件夹里这一周新增或改过的文件，不管有没有从 magpie 打开过。Windows 上复制或解压进来的文件虽然保留着旧日期，也算新增。
    - 预览等你停下再加载（#13）。预览打开时，选中本地文件停留 0.8 秒才加载预览，用方向键往下翻时不会把经过的每张图、每个 PDF 都解码一遍。等待期间图片先显示缩略图。GitHub 星标仍然立即显示。
    - 收起即关闭预览（#13）。收起浮窗后，下次唤出不带预览。
