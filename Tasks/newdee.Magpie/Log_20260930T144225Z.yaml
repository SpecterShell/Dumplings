- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - The palette fits its window again (#16). With Windows' "Text size" above 100%, the content grew but the window did not, and the shortcut bar at the bottom was cut off. The window now follows what the page actually draws, and keeps following it as the content changes.
    - No square frame around the rounded corners on Windows (#16). Windows 11 now rounds the window itself and the palette follows its outline; on Windows 10 the palette is square.
    - The focus goes back where it was on macOS (#9). Dismissing magpie hides the whole app, so the window you were in is active again without a click.
    - Arrow keys keep moving the selection after a click on the list, the right button too (#12).
    - The preview pane sits beside the list again, not over it (#11). This had been broken since the action menu arrived.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 窗口能完整装下面板了（#16）。Windows 的「文本大小」调到 100% 以上时，内容变大了窗口却没跟着变，底部快捷键栏被截掉一截。现在窗口按页面实际绘制的大小来调整，内容变化时也会随时跟上。
    - Windows 上圆角外不再有方框（#16）。Windows 11 上由系统把窗口本身做成圆角，面板贴合它的轮廓；Windows 10 上面板改为直角。
    - macOS 上收起后焦点回到原来的窗口（#9）。收起 magpie 时会隐藏整个应用，原来的窗口不用再点一下就恢复为活动状态。
    - 点过结果列表后，方向键仍然移动选中项（#12），右键也一样。
    - 预览窗格回到列表右边，不再盖住列表（#11）。这个问题从加入操作菜单那一版就存在了。
