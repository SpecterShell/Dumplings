- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Text in a copied image. Take a screenshot, type ocr in the box, and the text on it comes back, ready to copy with Enter. It uses the OCR engine, so switch on Image text (OCR) in settings first.
    - Who is using a port. port 3000 (or kill :3000) lists the processes listening on that port. Press Enter twice to end one. magpie and system processes are never listed.
    - Open in a terminal or an editor. In the action menu (Ctrl+K, ⌘K on a Mac), a file can now open its folder in a terminal, or open in an installed editor: VS Code, Cursor, Trae, Zed, Sublime Text, VSCodium or Windsurf.
    - Move to the Recycle Bin or Trash, from the same menu. It asks for a second Enter first.
    - Your local IP. ip shows this computer's address on the local network, real adapters before virtual ones such as WSL or Docker. It works offline and sends nothing.
    - Symbols. The : lookup finds symbols as well as emoji: :arrow →, :乘 ×, :rmb ¥, :cmd ⌘. :sym lists them all.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 截图取字。 截个图，在搜索框里输入 ocr，图上的字就出来了，回车复制。用的是 OCR 引擎，要先在设置里打开「图片文字（OCR）」。
    - 看看谁占着端口。 port 3000（或 kill :3000）列出正在监听这个端口的进程，按两次回车结束。magpie 自己和系统进程不会出现在列表里。
    - 在终端或编辑器里打开。 在操作菜单里（Ctrl+K，Mac 上是 ⌘K），文件可以在终端里打开它所在的文件夹，也可以用已安装的编辑器打开：VS Code、Cursor、Trae、Zed、Sublime Text、VSCodium、Windsurf。
    - 移到回收站或废纸篓，也在这个菜单里，按两次回车确认。
    - 本机 IP。 ip 显示这台电脑在局域网里的地址，真实网卡排在 WSL、Docker 这类虚拟网卡前面。直接从网卡读取，不联网也能用，不往外发任何请求。
    - 特殊符号。 : 除了找 emoji，现在也能找符号：:arrow →、:乘 ×、:rmb ¥、:cmd ⌘，:sym 列出全部。
