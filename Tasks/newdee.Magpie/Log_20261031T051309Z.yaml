- Locale: en-US
  Key: ReleaseNotes
  Value: '- Start every summon on the same tab (#10). Settings → General → Tabs has a new switch, "Start on the ★ tab". Turned on, magpie goes back to the ★ tab each time it is hidden, so every summon starts there, whatever tab you left it on; Cmd/Ctrl+1–4 still switch. Off by default: the palette comes back on the tab you left, as before. A selection search and magpie --source … still open on the tab they ask for.'
- Locale: zh-CN
  Key: ReleaseNotes
  Value: '- 每次呼出都从同一个标签页开始（#10）。设置 → 通用 → 标签页下面新增开关「每次呼出回到 ★ 标签页」。打开后，magpie 每次收起都回到 ★ 标签页，所以不管上次停在哪，下次呼出都从那里开始；Cmd/Ctrl+1–4 照样切换。默认关闭：关着时和以前一样，回到上次离开的标签页。划词搜索和 magpie --source … 仍然打开它们指定的标签页。'
