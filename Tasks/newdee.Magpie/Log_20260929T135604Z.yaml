- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - 农历，offline. 农历 (or nl) shows today in the Chinese calendar, with the zodiac year, festivals and where the solar terms stand; 农历 2026-10-1 does the same for any day. The other way round, 农历 八月十五，农历 腊月廿三 or 农历 中秋 gives the Gregorian date of the next one and the days left, and 节气 清明 finds the next 清明. Arabic numerals mean a Gregorian date, Chinese ones a lunar date. It covers 1900 to 2100 and was checked day by day against another implementation: 1958 to 2100 match exactly.
    - Solar term reminders. On the first day of each of the 24 solar terms, after 9 am, a notification brings a couplet of classical verse for it: five per term, a different one each year, all 120 checked against published texts. That day the couplet also takes turns with the tips under the empty search box, so it is seen even with Do Not Disturb on. On Windows, clicking the notification opens magpie on that term. On by default when the interface is in Chinese; Settings → General turns it off.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 农历，离线可查。 农历（或 nl）显示今天的农历，附带生肖年、节日和当前节气；农历 2026-10-1 查任意一天。反过来，农历 八月十五、农历 腊月廿三、农历 中秋 给出下一次是公历哪天、还有几天；节气 清明 查下一个清明。阿拉伯数字按公历，汉字数字按农历。覆盖 1900 到 2100 年，并与另一套独立实现逐日核对过：1958 到 2100 年完全一致。
    - 节气提醒。 二十四节气交节当天，上午 9 点后弹一条通知，配一联应节的古诗：每个节气五联，每年换一联，120 联都逐句核对过原文和出处。当天搜索框下方的小贴士里，这联诗也会和其他贴士交替出现，开着勿扰也看得到。Windows 上点通知会打开 magpie，显示这个节气。中文界面默认开启，设置 → 通用 里可以关掉。
