- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - The selection no longer jumps to the last row. When the palette came up with the mouse resting over the lower part of the window, the results growing under it could select the row there, even though the mouse hadn't moved. Hovering now selects a row only when the mouse really moves, and a row you picked with the arrow keys stays picked.
    - The footer no longer pushes the index status out of view in English. When space runs short, the least needed key hints make room first.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 选中项不会再跳到最后一条。 呼出面板时如果鼠标正好停在窗口下半部分，结果列表长出来盖到鼠标位置，就算鼠标没动，也可能把那一行选中。现在只有鼠标真的移动时，悬停才会改变选中项；用方向键选好的行也不会被抢走。
    - 英文界面下，底栏不会再把索引状态挤出视野。空间不够时，最不常用的快捷键提示会先让出位置。
