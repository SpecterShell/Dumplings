- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Command-line requests. Launching magpie again talks to the copy that is already running: magpie --toggle shows or hides the palette, --source clips opens on a tab (local, stars, web, clips), --query "text" fills the search box. Bind them to any key or use them in a script.
    - The summon key on Wayland (#15). A Wayland desktop lets no app claim a key for itself, so the key used to do nothing there. On sway and Hyprland magpie now binds it through their IPC at start and floats its window, without touching your config. On niri, GNOME, KDE and others, Settings → Summon shortcut shows the command to bind (on niri, the lines for config.kdl).
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 命令行参数。再运行一次 magpie，参数会交给已经在运行的那个：magpie --toggle 显示或收起浮窗，--source clips 打开到指定标签页（local、stars、web、clips），--query "文字" 在搜索框里填好内容。可以绑到任意快捷键，也可以写进脚本。
    - Wayland 下的唤出快捷键（#15）。Wayland 桌面不允许应用自己抢占按键，以前快捷键在这里不起作用。现在在 sway 和 Hyprland 上，magpie 启动时会通过它们的 IPC 绑定快捷键，并让浮窗浮动显示，不改你的配置文件。在 niri、GNOME、KDE 等桌面上，设置 → 唤出快捷键 下面会给出要绑定的命令（niri 给的是要加进 config.kdl 的几行）。
