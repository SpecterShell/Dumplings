- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Type a path, go there. D:\Projects, ~/Downloads, %APPDATA% or $HOME/.config (quotes from a paste are fine): Enter opens the folder, or shows a file in its folder. A file is never run from here, and only a path that exists takes over the top row.
    - System settings in one step. wifi, bluetooth, display, sound, power, default apps, uninstall, printer and ten more, in English or Chinese (蓝牙，分辨率，卸载), open that page of the system settings. On a Mac only the panes your system has are listed; on Linux they need GNOME Settings.
    - What is eating the machine. top lists the processes using the most memory, cpu the ones using the most CPU right now. Each row also shows the total for every process of the same name, so a browser's twenty helpers add up. Enter twice ends one, as with kill.
    - Volume. vol shows the output volume, vol 40 sets it, vol +10 and vol -10 step it, mute and unmute do what they say. The row shows before and after; nothing changes until you press Enter.
    - The About tab shows the update dot. When a new version is waiting, the About tab in settings carries the red dot too, so the update button is easy to find.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 输入路径直接去。 D:\Projects、~/Downloads、%APPDATA%、$HOME/.config（粘贴带引号也行）：回车打开文件夹；是文件的话，就在文件夹里把它标出来，不会运行它。只有真实存在的路径才会占用顶行。
    - 系统设置一步直达。 wifi、蓝牙、显示、声音、电源、默认应用、卸载、打印机 等十几项，中英文都认，直接打开系统设置里对应的那一页。Mac 上只列出本机确实有的面板；Linux 需要装有 GNOME 设置。
    - 看看谁在占资源。 top 列出最占内存的进程，cpu 列出此刻最占 CPU 的。每行还会算出同名进程一共多少，浏览器那二十几个小进程加起来一目了然。和 kill 一样，按两次回车结束选中的那个。
    - 调音量。 vol 看当前音量，vol 40 设成 40%，vol +10、vol -10 调大调小，静音、取消静音 顾名思义。顶行先显示调整前后，不按回车什么都不变。
    - 「关于」页签也有更新红点。 有新版本时，设置里的「关于」页签同样带红点，更新按钮一找就到。
