- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - A line for today (#13). With nothing typed, the top line shows today's date and weekday; in a Chinese interface also the Chinese calendar, with its festivals and the solar term on the day it begins; late at night, in the morning and at lunchtime, a word for the hour. It is never selected, and has its own switch in Settings → General.
    - Pinned folders (#13). Up to four folders you go to often, at the top of the local tab's empty box in the order you set (Settings → Local Files). Enter opens one. They need not be indexed.
    - From long ago, by tab (#13). The Web tab shows the bookmark card, the Stars tab the repo card, the local tab both; each is the same all day.
    - Workspaces by pinyin (#19). A workspace's name matches as an app's does: prefix, initials, pinyin. gzxc (or ws) lists them all. New tips point at the recall row, workspaces and script commands.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 今天这一行（#13）。搜索框为空时，最上面一行显示今天的日期和星期；中文界面还有农历、传统节日，以及交节当天的节气；深夜、早上、中午各有一句问候。这一行不会被选中，设置 → 通用 里可以单独关掉。
    - 置顶文件夹（#13）。最多 4 个常去的文件夹，按你排好的顺序显示在本地文件页签空框的最上面（设置 → 本地文件），回车打开，不需要在索引文件夹里。
    - 旧物重现按页签（#13）。Web 页签只出书签，Stars 页签只出仓库，本地文件页签两张都有，每张当天不换。
    - 工作现场支持拼音（#19）。名字和应用一样能用前缀、首字母、拼音搜到；gzxc（或 ws）列出全部。小贴士新增旧物重现、工作现场、脚本命令三条。
