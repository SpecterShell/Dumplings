- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Newest downloads. dl lists the newest files in your Downloads folder without indexing it; they open, reveal and copy like any other file. Downloads still in progress are left out.
    - Chinese capitals and pinyin. 大写 1234.56 gives 壹仟贰佰叁拾肆元伍角陆分 for invoices and contracts. py 重庆 gives chóng qìng, with tones; common words that read differently from their characters (银行，长大) come out right.
    - Timers. timer 25m standup starts a countdown and a notification comes when it ends. timer alone lists the running ones, and Enter stops them.
    - Read a QR code. With an image on the clipboard, qr reads the code in it; with text, it still draws one.
    - Compare two copies. diff shows how the last two texts you copied differ, line by line (needs the clipboard history).
    - System at a glance. sys shows CPU load, memory and free disk space.
    - Chance. random 1 100, pick pizza tacos ramen, dice and coin.
    - Text tools. 半角 and 全角 convert letters, digits and symbols (Chinese sentence marks stay wide); unicode and html escape or unescape.
    - Save a copied image. An image in the clipboard history can be saved as a file from its action menu.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 最近下载。 dl 列出「下载」文件夹里最新的文件，不用建索引，打开、在文件夹中显示、复制都和其他文件一样。还没下完的文件不会列出来。
    - 金额大写和拼音。 大写 1234.56 得到「壹仟贰佰叁拾肆元伍角陆分」，报销、写合同都用得上。py 重庆 得到 chóng qìng，带声调；银行、长大这类常见多音词能读对。
    - 倒计时。 timer 25m 开会 开始倒计时，时间一到弹出系统通知。单独输入 timer 看看正在进行的，回车全部停止。
    - 识别二维码。 剪贴板里是图片时，qr 读出图中的二维码；是文字时，照旧画成二维码。
    - 对比两次复制。 diff 逐行显示最近两次复制的文字有什么不同（需要打开剪贴板历史）。
    - 系统状况。 sys 显示 CPU、内存和各磁盘剩余空间。
    - 随机。 random 1 100、pick 火锅 烧烤 麻辣烫、dice（骰子）、coin（抛硬币）。
    - 文字小工具。 半角、全角 转换字母、数字和符号（中文句子里的标点保持全角）；unicode、html 负责转义和反转义。
    - 保存复制过的图片。 剪贴板历史里的图片，可以在操作菜单里另存为文件。
