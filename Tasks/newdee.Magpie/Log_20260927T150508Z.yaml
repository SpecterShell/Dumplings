- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Passwords and keys stay starred in the clipboard history. A copied GitHub, OpenAI, AWS or Slack key, a JWT or a private key, the value after password = or API_KEY:, and a clip that looks like a generated password now show as head and tail with **** in between. Show on the row, or Ctrl+K → Show the full text, reveals one until the palette loses focus. Copying and pasting still give the full text, and the MCP server only ever returns the starred form.
    - App folders. Apps kept outside the usual places, such as on an external drive, can be added under Settings → Local Files → App folders. Only the apps are listed (bundles on macOS; shortcuts and programs on Windows, without uninstallers and updaters; desktop entries and AppImages on Linux), not the files inside them.
    - Change or disconnect GitHub. Once connected, the token field folds away behind Change token and Disconnect. Disconnect asks twice, then removes the token and the star index from your computer; nothing changes on GitHub.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 剪贴板历史里的密码、密钥打上星号。 复制过的 GitHub、OpenAI、AWS、Slack 密钥，JWT 和私钥，password =、API_KEY: 后面的值，还有看着像生成出来的密码，现在只显示头尾，中间是 ****。点行尾的「显示」，或者 Ctrl+K → 显示完整内容，可以看全文，浮窗一失去焦点就重新遮上。复制、粘贴出去的仍是完整内容；MCP 服务只交出打码后的样子。
    - 应用文件夹。 装在别处的应用，比如外接硬盘上的，可以在 设置 → 本地文件 → 应用文件夹 里把目录加进来。只收应用本身（macOS 收 .app；Windows 收快捷方式和程序，跳过卸载、更新程序；Linux 收 .desktop 和 AppImage），里面的零碎文件不收。
    - 更换或断开 GitHub。 连上以后，token 输入框收起来，换成「更换 token」和「断开连接」。断开要点两次，会删掉本机保存的 token 和星标索引，GitHub 上的东西不受影响。
