- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - See your notes (#26). Type note alone on the Local tab ("all" scope) to list the newest 20 notes, newest first, with how many there are. Enter copies one; Ctrl/Cmd+K also opens the notes file. Only lines magpie wrote count, so a notes file that is a whole notebook lists just the notes.
    - A note says it was kept (#26). After note … and Enter, its row shows "✓ … noted in " for a moment before the palette goes. Typing on keeps the palette; a second Enter does not save the note twice.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 查看笔记（#26）。在本地文件标签页的「全部」范围只输入 note，列出最新的 20 条，最新的在最上面，并写明一共几条。Enter 复制一条；Ctrl/Cmd+K 里还能打开笔记文件。只认 magpie 写的行，笔记文件是一整本笔记时，只列出其中的笔记。
    - 记下后有提示（#26）。note … 按 Enter 后，这一行显示「✓ … 已记下，存在 <文件>」，停一下再收起面板。这段时间里接着打字，面板就留着；再按一次 Enter 不会重复记。
