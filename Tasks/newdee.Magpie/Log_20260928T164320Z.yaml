- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - A welcome on first start, and semantic search is your choice. A fresh install opens on a short welcome and asks whether to turn on semantic search before anything is downloaded. Say "Not now" and magpie never fetches the ~500 MB model: search matches words, and apps, tools and everything else work the same. Settings → General switches it on or off at any time. Installs from before this keep semantic search on.
    - Pause semantic search to free memory. Before a game or another heavy program, "Pause semantic search" in the tray menu (or in Settings → General) unloads the models; on Windows that gave back about 800 MB. Search runs on keywords while paused. Resume from the same place, or restart magpie.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 第一次启动有欢迎页，语义搜索由你决定。 全新安装会先显示一个简短的欢迎页，在下载任何东西之前，问你要不要开启语义搜索。选「先不开」，magpie 就不会去下载约 500 MB 的模型：搜索按字词匹配，启动应用、各种小工具都照常可用。之后随时可以在 设置 → 通用 里开关。在此之前安装的，语义搜索保持开启。
    - 暂停语义搜索，把内存让出来。 打游戏或跑大程序之前，在托盘菜单（或 设置 → 通用）里点「暂停语义搜索」，模型会被卸载；在 Windows 上实测能让出约 800 MB。暂停期间只按关键词搜索。在同一个地方点恢复，或者重启 magpie 就恢复了。
