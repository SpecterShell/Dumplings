  Value: |-
    - Today's date sits inside the search box (#13). The line of its own took a whole row; now, with nothing typed, the date and weekday show on the right of the empty search box, with the Chinese calendar in a Chinese interface. Typing takes it away. It shows on every tab. The greeting for the hour is gone, as the box has no room for it. The switch is Settings → General → Date in the search box.
