- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - The AppImage opens its window on Arch and other recent distributions (#15). It carried a copy of libwayland-client from Ubuntu 22.04 that did not get along with a newer graphics stack, and the window never appeared (EGL_BAD_PARAMETER). It now uses the system's copy; the LD_PRELOAD workaround is no longer needed.
    - macOS: the Accessibility prompt is no longer hidden under the palette (#17). Without the permission, the selection search used to call up macOS's prompt, which then opened underneath magpie. The palette now shows the hint itself, with a button that opens Privacy & Security → Accessibility. It stays until a selection search works or you close it.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - AppImage 在 Arch 等较新的发行版上能正常出界面了（#15）。包里自带的 libwayland-client 来自 Ubuntu 22.04，和较新的图形栈合不来，窗口出不来（EGL_BAD_PARAMETER）。现在改用系统自己的，不再需要 LD_PRELOAD。
    - macOS：辅助功能授权框不再被浮窗挡住（#17）。之前没有权限时，划词搜索会请系统弹出授权框，结果框被压在 magpie 下面。现在由浮窗自己显示提示，带一个按钮直接打开 隐私与安全性 → 辅助功能。划词成功或手动关闭之前，提示会一直留着。
