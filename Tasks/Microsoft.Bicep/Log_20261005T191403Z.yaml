  Key: ReleaseNotes
  Value: |-
    Features and Bug fixes
    - Emit GA language version for NullableExisting and ThisNamespace (#20258)
    - Make apiVersion optional in the Azure resource schema MCP tool (#20292)
    - Fix diagnostic locations for inherited .bicepparam values (#20085)
    - Refine docs command configuration and error handling (#20269)
    - Add trusted cloud configuration (#20294)
      - Custom clouds that aren't in the built-in list must now be allowed through the BICEP_TRUSTED_CLOUDS environment variable, the same way trusted registries work:
        [{"resourceManagerEndpoint":"https://management.example.com","activeDirectoryAuthority":"https://login.example.com"}]
    - Visualizer: improved resource discovery and creation (#20340)
      - Separate resource-creation dock, better browsing and filtering, and API version selection that takes the deployment scope into account
      - Fills in required resource properties and shows related diagnostics on the graph
      - Common resource providers listed first when browsing
    - Visualizer: undo/redo (#20356)
      - Undo and redo resource creation, node moves, and Reset Layout with Ctrl/Cmd+Z, Ctrl/Cmd+Shift+Z, or Ctrl+Y
      - Simpler communication between the visualizer and VS Code, and simpler visualizer internals
    Community contributions
    - fix: skip secure params lint for type aliases (#19796) - Thanks @nanookclaw!
    - fix: description decorator placement for type properties (#20185) - Thanks @johnlokerse!
    - Update image and contributing.md paths in mcp-tools.md (#20283) - Thanks @johnlokerse!
    - Fix blockquote formatting in resource and module hovers (#20281) - Thanks @simon-jensenz!
    - Refresh setup, testing, and debugging instructions in CONTRIBUTING.md (#20285) - Thanks @simon-jensenz!
    - Add -NoProfile in the call to PowerShell.exe in the installer (#20296) - Thanks @kilasuit!
    - Fix bicep test exit code on compilation errors (#20305) - Thanks @pathei-kosmos!
    Full Changelog: Comparing v0.47.16...v0.48.1 · Azure/bicep
