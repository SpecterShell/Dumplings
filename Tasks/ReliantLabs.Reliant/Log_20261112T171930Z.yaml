  Key: ReleaseNotes
  Value: |-
    3 new features, 1 fix and 4 other changes
    Every pull request merged since v1.15.0, grouped by its conventional-commit type.
    Added
    - retention: compact chat update logs and prune finished runs' internal steps #2536
    - console: forge's built-in product dashboards in the demo, and a Users card on the Overview #2597
    - inbox: keep or reclaim now a worktree marked to be reclaimed #2584
    Changed
    - handlers, streaming, daemonstate, …: wait on events, not the wall clock #2616
    - toolexec: wait on events, not the wall clock #2614
    - llm, daemonruntime: wait on events, not the wall clock #2615
    - workflow, triggers, auth, …: wait on events, not the wall clock #2617
    Fixed
    - gateway: re-subscribe NATS subscriptions the broker refused, with capped backoff #2618
    What's Changed
    📦 Other Changes
    - test(toolexec): wait on events, not the wall clock by @reliant-01 in https://github.com/reliant-labs/reliant/pull/2614
    - test(llm, daemonruntime): wait on events, not the wall clock by @reliant-01 in https://github.com/reliant-labs/reliant/pull/2615
    - test(handlers, streaming, daemonstate): wait on events, not the wall clock by @reliant-01 in https://github.com/reliant-labs/reliant/pull/2616
    - test(workflow, triggers, auth): wait on events, not the wall clock by @reliant-01 in https://github.com/reliant-labs/reliant/pull/2617
    - fix(gateway): re-subscribe NATS subscriptions the broker refused, with capped backoff by @reliant-01 in https://github.com/reliant-labs/reliant/pull/2618
    - feat(retention): compact chat update logs and prune finished runs' internal steps by @reliant-01 in https://github.com/reliant-labs/reliant/pull/2536
    - feat(console): forge's built-in product dashboards in the demo, and a Users card on the Overview by @reliant-01 in https://github.com/reliant-labs/reliant/pull/2597
    - feat(inbox): keep or reclaim now a worktree marked to be reclaimed by @reliant-01 in https://github.com/reliant-labs/reliant/pull/2584
    - fix(orgs): a cancelled request is not reported as unavailable by @reliant-01 in https://github.com/reliant-labs/reliant/pull/2624
    - chore(pin): forge@e01ef3a1 (adopt skill and obs check reason codes, forge #2034) by @reliant-01 in https://github.com/reliant-labs/reliant/pull/2601
    - fix(llm): log a spent Reliant credit balance at WARN, not ERROR by @reliant-01 in https://github.com/reliant-labs/reliant/pull/2623
    - chore: release v1.16.0 by @reliant-01 in https://github.com/reliant-labs/reliant/pull/2620
    - chore(pin): forge@9e678198 (direct apply honours delivery_units) by @reliant-01 in https://github.com/reliant-labs/reliant/pull/2619
    - chore(pin): forge@6e4246f3 (test factories never redeclare a hand-written name) by @reliant-01 in https://github.com/reliant-labs/reliant/pull/2625
    - docs(forge): adopt an existing app in any language with the adopt skill, in tiers; obs check reason codes by @reliant-01 in https://github.com/reliant-labs/reliant/pull/2534
    - chore(pin): forge@cdac1da2 — built-in analytics dashboards, web-runtime ^0.13.11, demo on the full analytics tier by @reliant-01 in https://github.com/reliant-labs/reliant/pull/2626
    - test(observability): the deployment contract test follows #2075's analytics dashboards by @reliant-01 in https://github.com/reliant-labs/reliant/pull/2627
    - chore(deps): @reliantlabs/forge-web-runtime ^0.13.13 — init keeps the attribution raised before it by @reliant-01 in https://github.com/reliant-labs/reliant/pull/2628
    - feat(web): opt into withheld deploy usage costs and render them as hidden by @reliant-01 in https://github.com/reliant-labs/reliant/pull/2612
