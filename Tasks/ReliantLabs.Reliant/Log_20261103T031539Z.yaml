  Key: ReleaseNotesUrl
  Value: https://github.com/reliant-labs/reliant/releases
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Observability dashboards, Integrations settings, project commands on the right machine
    Observability gains real dashboards, trace charts and replay verdicts; Settings lists every integration connection; project commands run on the machine holding the checkout; one account per machine; and the daemon, workflow and usage paths get a round of reliability fixes.
    Added
    - web: traces latency scatter and histogram, with click-to-open and brush-to-filter #2021
    - web: Observability opens on Dashboards; Service graph moves last in its tabs #2015
    - web: dashboard charts — a real legend, palette, top-N + Other, and every panel kind the spec has #2022
    - daemon: name the connected account by email #2029
    - web: read each environment's declared shape on demand from the slim Live roster #2047
    - release: release-tag.sh --rc accepts the RC commit's green release-gate record (the RC train's local gate), Actions' Release gate job as the fallback #2084
    - web: one chart palette, --chart-1..6: brand blue, then violet, no green or red #2069
    - web: chat and sidebar UX fixes: live tool groups, archive vs delete, status chips, keyboard parity #2081
    - settings: Settings → Integrations lists every connection, to test, rename, re-default or revoke #2074
    - web: the console hands broken things to an agent, and says when it cannot read deploy state #2068
    - auth: one account per machine — login and daemon sign-in stay in step #2059
    - web: Geist by default, the Reliant mark in the shell, one focus ring #2062
    - web: split accent text (--primary-ink) off the --primary fill #2058
    - web: settings UX fixes — dev-only Developer, true Privacy copy, project scope, IA, accessible tabs and theme #2077
    Changed
    - web: the settings layout test mocks the Automations section (#1971 added it without a QueryClient) #1977
    - release: release candidates — gate a frozen commit off main, never main's tip #1954
    - web: make MetricsExplorer tests fit their budget under load #1940
    - project: pin healProjectDir's missing-router answer for both targets #2039
    - a newer push to main supersedes the pending run, the run in progress finishes #2071
    - heavyjob: a slot waiter costs a few threads, and a slotted job gets its share of the CPUs #2083
    - review: drop the Review marker job; the required Reliant review check judges the marker #1956
    - contract: vendor control-plane at f97a5a37e38e (PreviewMachinePlanChange is NO_SIDE_EFFECTS) #2087
    - skills: authors add no merge:queue; releases are rc-train's #2079
    - tools_daemon: pin owner checks on the dial-out connect path #2036
    - workflow: the run-step timeout test gives its node real headroom over the command #2080
    - diskwatch: the reaper harness pins a floor-holding forge, not the linked one #2075
    - design: app UX review against the new site (internal) #2030
    - contract: sync vendored control-plane contract #2041
    - pin: forge@d09e8cb4679c, as promoted in v1.7.87-rc.14 #2091
    - runtime: order the parked-parent pressure flip after the parent's last turn #2040
    - pin: forge@468c64dccffb (#1653 signing transit, #1654 health gate, #1656/#1665 fluxdelivery, #1657 FluxInstance) #2092
    - fixtures give the project a checkout on its machine, as #2064 requires #2097
    - auth: keep the CLI login's account on forge's credential; drop reliant-accounts.json #2096
    - web: fix two flaky observability tests (quota clock, replay unplayable verdict) #2101
    - rc: pin forge@ae88e4b18afb for v1.8.15-rc.17
    Fixed
    - observability: sessions without a playable replay are dimmed and say why; a recording without a full snapshot is never offered as playable #2014
    - ci: a green review verdict re-runs the head's earlier red ones, so a reviewed PR enters the merge queue #1997
    - usage: ledger keeps billed tokens when a stream fails terminally #1980
    - trigger: activation approval masks runtime node-output args instead of refusing #2001
    - triggers: a pool-bound firing pins and describes its pool's agreed catalog #1944
    - worker: regression-test the worker on the production Temporal client (v1.8.14-rc.3 boot panic) #1985
    - ci: the Reliant review check never passes a fork's head (CPI-1) #2031
    - redact: redact bare AWS secret keys, cookie headers and claim tokens/links; keep git commit ids #2032
    - web: workflow builder/sidebar UX gaps — model toolbar pill, Back to chat, untruncated names, app selects #2042
    - workflows: a run node's timeout above the 12h cap fails validation, not silently hours in #2006
    - web: observability tells an unread environment list from an empty one, and lists platform-sourced processes #2023
    - forge: run forge commands on the machine holding the checkout, with that machine's path #2016
    - ci: reopen one rolling ci:main-red issue and sweep stale flake:suspected issues #2026
    - nats: retry auth refusals and log permission violations at ERROR #2045
    - worktrees: an undumpable ssh-agent, gpg-agent or the daemon's own sandbox init no longer holds every retirement (#1998) #2012
    - machines: run preflight and the resume wake believe a failed start only once it holds #2033
    - web: open dev links embedded and on the cloud daemon, other links in the default browser #2044
    - ci: the merge queue's budget step reports and never fails the group #2060
    - ci: the review check is never cancelled, so a reviewed PR enters the merge queue #2063
    - worktree: a no-machine chat's background checkouts never wake its machine #2034
    - heavyjob: print the slot-wait header and its holder line in one write #2035
    - ci: a passed head's stale review runs are re-run one at a time, and stuck PRs heal on their own #2086
    - daemon: reserve daemon ids for daemon-bound credentials #2070
    - every project command runs on the machine holding the checkout; the web says when none does #2028
    - ci: the green review run waits for an earlier run still in progress, a cancelled re-run is retried, and the sweep is schedule-only #2088
    - proctree: size each command's limit in threads, scaled to the machine #2089
    - generate: run each protoc plugin once, not once per proto directory #2078
    - web: keep DataTable's sr-only headers inside its scroller #2076
    - workflows: a sub-agent whose preset model the chat's provider cannot serve runs on the chat's model #2082
    - chats: an automation run whose origin was never recorded stays out of the chat list #1986
    - ci: the review healer stops cleanly before its timeout and retries a re-run GitHub refuses for now #2090
    - workflows: names stay visible on narrow screens; ready-made automations up front #2073
    - runtime: resolve a chat's checkout on the machine that runs it #2064
    - billing: plain-language checkout and correct hosting price disclosure #2066
    - onboarding: sign the daemon out on auth logout; simplify the machine step #2018
    - projects: per-machine checkout follow-ups #2093
    - web: alert Explore never opens a platform rule's marker, and a rule's counts as bound #2011
    - runtime: a foreign pin's refusal never names another account's machine; durable-machine test follows #2070/#2064 #2098
    - worktrees: systemd's (sd-pam) no longer holds every retirement #2099
    - lint: clear main's two golangci-lint findings (ineffassign, QF1001) #2095
