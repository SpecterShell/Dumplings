  Key: ReleaseNotes
  Value: |-
    Dashboards together, workflows on the right machine
    Find dashboards in a new Overview hub, retry failed panels, and run workflows with the definitions and tools of their own machine.
    Explore dashboards from one hub
    The dashboards Overview hub and grouped list bring your dashboards together. Panels queue within the server's read limit and offer Retry when a request fails.
    Use the workflow catalog a run started with
    Runs load workflow definitions from their original catalog. Automations use the project's workflow rather than a same-named account workflow, and skills, memories and MCP configuration stay scoped to each machine.
    Select the intended machine
    A daemon: shorthand containing a machine ID now selects that machine correctly.
    More accurate usage analytics
    Page visits and completed model calls are recorded again, and workflow events correctly identify child runs.
    What's Changed
    📦 Other Changes
    - fix(automations): an automation runs the project's workflow, not a same-named account workflow, and says so by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1837
    - fix(skills): keep each machine's skills, memories and MCP; a run reads its own machine's by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1841
    - fix(workflows): a run loads every definition from the catalog it started with by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1859
    - fix(toolexec): a daemon: shorthand naming a machine id selects that machine by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1817
    - test(handlers): MockToolExecutor is safe for the concurrent tool calls ExecuteTools makes by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1822
    - feat(web): dashboards Overview hub and grouped list by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1840
    - fix(web): dashboard panels queue under the server's read cap, retry its refusal, and every failed panel gets Retry by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1843
    - chore(pin): forge bfb0249b9 (#1519, sealed hosted SPA record names the candidate build) by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1885
    - fix(gen): regenerate the service catalog for NATSDaemonRouter.normalizeSelector (#1817) by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1894
    - fix(analytics): send page_visited, restore llm_call_completed, compute workflow is_child by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1848
    - fix(workflows): the spawn tool describes the presets of the run's pinned catalog by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1888
    - chore: release v1.8.13 by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1896
    Full Changelog: https://github.com/reliant-labs/reliant/compare/v1.8.12...v1.8.13
