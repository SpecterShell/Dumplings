Version: 1.14.0
Installer:
- Architecture: x64
  InstallerType: nullsoft
  InstallerUrl: https://downloads.reliantlabs.io/Reliant-1.14.0-win-x64.exe
- Architecture: arm64
  InstallerType: nullsoft
  InstallerUrl: https://downloads.reliantlabs.io/Reliant-1.14.0-win-arm64.exe
Locale:
- Locale: en-US
  Key: ReleaseNotesUrl
  Value: https://github.com/reliant-labs/reliant/releases
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    2 new features, 8 fixes and 7 other changes
    Every pull request merged since v1.13.0, grouped by its conventional-commit type.
    Added
    - web: environment Promotions timeline on the env Overview #2514
    - models: add Claude 5.2 Fable on the claude subscription driver #2531
    Changed
    - mcp: EnsureProjectServersLoaded tests start no built-in server (#2424) #2516
    - forge-version tests skip when forge is replaced by a local checkout (forge's consumer canary) #2518
    - daemonruntime: preview forwarder port tests hold their ports so no other process can take them (#2479) #2526
    - toolexec: restore TestTerminalOutputQueue_OverflowEndsWithError (#2228) #2528
    - shell: restore the archived-workspace kill notice assertion, waited for (#2128) #2530
    - authz: one authorization seam for chats, projects, machines, workflows and triggers #2533
    - demo: demo.reliantlabs.io ships with prod's release; the demo env is deprecated #2515
    Fixed
    - proctree: a command prepared alongside another no longer fails to start with ENOENT #2517
    - prove_test: admit files in another git worktree of a workspace repository #2520
    - worktree: a base branch whose local copy is behind origin's starts at origin's #2521
    - store: a NUL in a step's output no longer fails its step_executions insert #2522
    - toolexec: the daemon refusing a credential file is a user error, not an ERROR #2523
    - workflow: a step that cannot run as configured no longer reports "workflow validation failed" #2527
    - web: scrolling back no longer loads a chat's whole history with the view stuck at the top #2513
    - db: allocate chat updates at READ COMMITTED, as user updates already are #2524
    What's Changed
