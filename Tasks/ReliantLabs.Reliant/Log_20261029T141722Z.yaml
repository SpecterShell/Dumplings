  Key: ReleaseNotes
  Value: |-
    Workflows stay with their machine
    Synced workflows and presets are kept separately for each machine, and event-driven runs resolve their workflow on the target machine. Recovery and GitHub automation fixes make existing conversations and triggers more reliable.
    Keep each machine's workflows and presets
    Syncing one machine no longer replaces another machine's workflow and preset catalog. Triggers resolve their workflow on the machine they target.
    Recover workflows in the configured namespace
    Reset-and-replay recovery uses the configured Temporal namespace rather than assuming the default.
    Let issue-write GitHub automations update pull requests
    A bot with issue-write permission can label or comment on a pull request, matching GitHub's issue API permissions.
    What's Changed
    📦 Other Changes
    - fix(ci): the merge gate runs forge generate alone on a 16 GiB runner by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1788
    - fix(workflows): keep each machine's synced workflows and presets; resolve a trigger on its target machine by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1793
    - fix(workflow): reset-and-replay names the configured Temporal namespace (prod: every reset failed NamespaceNotFound) by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1797
    - fix(github): the bot's token for an issue write may label or comment on a pull request by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1803
    - fix(trigger): a duplicate trigger name is AlreadyExists, not a retried Internal error by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1804
    - feat(github): repo.get_content pages a large file by line window; a cut result says so by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1794
    - fix(worktree,auth): worktree repo discovery on the target daemon + cliauth by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1798
    - ci(merge-queue): a merge group lands only if pr-review passed every PR's current head by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1795
    - chore: release v1.8.9 by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1811
    - fix(release): release-tag.sh refuses while another cut of the same version is in progress by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1807
    - fix(ci): never cancel a run of main; each commit gets its own concurrency group by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1786
    Full Changelog: https://github.com/reliant-labs/reliant/compare/v1.8.8...v1.8.9
