  Key: ReleaseNotes
  Value: |-
    A cleaner chat list and steadier machines
    Automation and agent runs stay out of your chat list, chat lists refresh without request storms, workflows load from the machine they run on, and Reliant Forge moves to v1.0.6.
    Keep automation runs out of the chat list
    Runs started by automations, agents and the CLI no longer crowd the chat list. Each chat records where it came from, and only the conversations you start appear there.
    Refresh chat lists without request storms
    Streaming updates are coalesced into one list refresh, and a superseded chat-list request is cancelled instead of racing the new one.
    Load long chats faster
    A new index on messages makes counting a chat's messages an index-only read.
    Run workflows from the machine's own catalog
    A run loads its workflow, child workflows and presets from the catalog of the machine it runs on, so a machine's local changes apply to its own runs.
    See each repository's state from the daemon
    Daemons report every repository's branch, commit and uncommitted changes with each snapshot.
    See forge-applied rollout slots separately
    The Rollout tab groups slots that Forge applies apart from the rest.
    Reliant Forge v1.0.6
    The embedded reliant forge moves to v1.0.6 plus the environment validation fix: the service catalog no longer records source lines, and environments have no arbitrary entry-count limit.
    What's Changed
    📦 Other Changes
    - feat(workflows): daemons report each repo's branch, commit and dirty state with every snapshot by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1846
    - feat(web): the Rollout tab lists forge-applied slots in their own group by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1860
    - docs(hosting): env delete deletes the managed database unless --keep-data by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1861
    - docs(readme): lead with the whole-stack positioning; workflows, Autopilot, always-on machines and Forge by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1827
    - fix(workflows): a run loads its workflow, children and presets from its own machine's catalog by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1835
    - perf(web): coalesce stream-driven list refetches; abort a superseded ListChats by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1865
    - perf(db): index messages (chat_id, thread_id) so ListMessages' total is an index-only count by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1870
    - fix(deps): pin merged Forge environment validation fix by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1863
    - fix(lint): repo_state's git child inherits the environment (main's release gate is red on forbidigo) by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1873
    - fix(chats): automation, agent and CLI runs stay out of the chat list, keyed on an explicit chats.origin by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1874
    - chore: release v1.8.12 by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1878
    - fix(web): deploy usage says "requested": billed CPU and memory are exactly what the pods request by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1876
    - fix(web): sessions masked-replay test scans page text, not epoch timestamps by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1879
    - fix(web): runFilterState test lists cli.run, which #1874 added (main's release gate is red) by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1882
    Full Changelog: https://github.com/reliant-labs/reliant/compare/v1.8.11...v1.8.12
