    - feat(sdk): a funding warning on creating or enabling an automation no organization account can run yet (protos) by @reliant-01 in https://github.com/reliant-labs/reliant/pull/2776
    - feat(orgs): GetPolicyImpact previews how many of the org's chats a proposed provider and model policy would refuse (org-policies R2) by @reliant-01 in https://github.com/reliant-labs/reliant/pull/2772
    - feat(orgs): an enforced automations policy replaces an automation's unattended-funding stamp (P11, §11.3) by @reliant-01 in https://github.com/reliant-labs/reliant/pull/2774
    - fix(temporal): the deadlock-pausing converter names workflow.Context, which temporal sdk v1.51 still exports by @reliant-01 in https://github.com/reliant-labs/reliant/pull/2777
