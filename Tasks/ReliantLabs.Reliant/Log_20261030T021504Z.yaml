- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Faster chats and clearer workflow failures
    Chats open with less work, invalid workflow files fail safely, and browser errors use one observability pipeline.
    Open chats with less waiting
    Opening a chat no longer loads workflow state, ownership reads are leaner, and the connection pool stays warm.
    Fail invalid workflows safely
    A workflow file that cannot be parsed blocks its name instead of allowing another workflow with the same name to run.
    Use one browser error pipeline
    ClickStack is the browser error sink; the separate web Sentry integration has been removed.
    Understand environment deletion
    The confirmation dialog explicitly warns that deleting an environment also deletes its databases.
    What's Changed
    📦 Other Changes
    - test(web): pin the packaged desktop renderer's error-reporting path end to end by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1834
    - feat(web)!: remove web Sentry; ClickStack is the one browser error sink (O4) by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1833
    - fix(web): the delete-environment dialog says the databases are deleted too by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1830
    - perf(chat): open a chat without loading workflow state; lean ownership reads; warm pool by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1809
    - fix(workflows): a workflow file that does not parse fails its name closed by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1836
    - chore(deps): pin forge v1.0.4 by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1825
    - chore: release v1.8.11 by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1847
    - chore(deps): pin forge v1.0.5 by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1845
    - fix(triggers): a finished run frees its capacity slot at once, not five minutes after launch by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1850
    - fix(lint): main's release gate is green on forge v1.0.x (tracing fixes, replay harness compiles, NATS retry floor) by @reliant-01 in https://github.com/reliant-labs/reliant/pull/1855
    Full Changelog: https://github.com/reliant-labs/reliant/compare/v1.8.10...v1.8.11
