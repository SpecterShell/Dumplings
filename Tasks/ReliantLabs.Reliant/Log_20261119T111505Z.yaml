  Key: ReleaseNotes
  Value: |-
    3 new features, 5 fixes and 2 other changes
    Every pull request merged since v1.21.3, grouped by its conventional-commit type.
    Added
    - cli: reliant project delete deletes a project by id, name or path #2874
    - web: walk a first-time user on the forge site through the existing welcome wizard, then back #2866
    - web: Settings › API tokens lists your CLI logins and revokes one #2883
    Changed
    - worktree: a copied node_modules is the source checkout's install; reinstall when the lockfile differs #2858
    - forge: compare forge's guide and start-here by their rendered text, not a byte count or exact heading #2876
    Fixed
    - prompt: point agent scratch at a persistent per-chat directory, not /tmp #2872
    - workflows: record a tolerated node's workflow-side failure as its failed attempt #2877
    - lint: drop task lint:electron and fmt:electron, which never ran a linter #2878
    - ci: seed the Playwright system-package cache before the suite; responsive leg gets 30 minutes #2879
    - llm: key validation returns fixed, key-free messages with reason codes and logs provider errors only redacted #2857
    What's Changed
    📦 Other Changes
    - docs(worktree): a copied node_modules is the source checkout's install; reinstall when the lockfile differs by @reliant-01 in https://github.com/reliant-labs/reliant/pull/2858
