    - fix(workflows): record a tolerated node's workflow-side failure as its failed attempt by @reliant-01 in https://github.com/reliant-labs/reliant/pull/2877
    - fix(lint): drop task lint:electron and fmt:electron, which never ran a linter by @reliant-01 in https://github.com/reliant-labs/reliant/pull/2878
