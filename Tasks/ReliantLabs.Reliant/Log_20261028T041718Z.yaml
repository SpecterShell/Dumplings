- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    One workspace across projects, clearer automations, and organization switching
    This release reorganizes navigation, settings and automations around the work you are doing. Chats load with less repeated tool output, machine selection follows the chat more reliably, and Apps brings deployment details and observability together. It also adds organization switching and a fuller issue discussion timeline. Version 1.8.4 was prepared but never tagged or published; these are the changes since 1.8.3.
    Move between projects without losing your place
    Projects become a sidebar filter rather than separate windows. Navigation and chat loading have been tightened so switching context does not leave an older response in the current view. Large tool results arrive as previews, with the rest available on demand, and open chats use separate streams instead of sharing one stream for every update.
    A clearer home for automations
    Workflows have dedicated navigation and a redesigned creation dialog. Machine setup is brought into one Add machine sheet, with device-code pairing and payment handled in place. Automation settings and history are easier to inspect, and overlapping trigger starts are handled more explicitly.
    Switch organizations with the right account context
    Switch active organizations across the web app and Forge credentials. Requests retain the organization they started in while authentication completes, reducing the risk of an in-flight change being attributed to a newly selected organization.
    Keep issue conversations together
    Issue discussion brings the assignee, comments, linked chats and activity into one timeline, with clearer handling of duplicate submissions and access-controlled content.
    Deployment details and observability in Apps
    The Apps console brings workload status, deployment history, dashboards and release details into a more consistent layout. Organization-wide observability includes usage and billing information, and quota exhaustion is shown as a degraded state rather than hiding the rest of the console. Frontend URLs are easier to find from deployment views.
    More reliable chat recovery and settings
    Chats keep their machine choice more reliably, repaired worktrees are recovered more consistently, and compaction handles an overflowing summarizer without unnecessarily stopping the conversation. Settings navigation and credentials handling have also been consolidated.
