  Key: ReleaseNotes
  Value: |-
    ✨ Features:
    - You can now use Page break to force a new page when exporting to PDF
    - The PDF annotation editor now supports dark mode, additional text sizes, and improved selection controls.
    - You can now use the AI Assistant to create and manage events
    - Run saved AI Prompts by typing / in the AI Assistant

    🛠️ Fixes:
    - Links pasted into comments are now clickable.
    - Find in note now supports match case again, replacing matches with nothing, and prefilled selected text.
    - Fixed an issue that duplicated note titles in printed notes and PDF exports.
    - Fixed exported notes becoming progressively smaller and slower when exporting notebooks.
    - Fixed recordings controls not appearing when a recording opens in a separate note window.
