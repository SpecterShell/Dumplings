  Key: ReleaseNotes
  Value: |-
    ✨ Features:
    - You can turn list items into toggles.
    - When you start a recording during a calendar meeting, Evernote can suggest linking the event to the note — even when multiple meetings overlap.
    - The sidebar now has clearer spacing and indentation.

    🛠️ Fixes:
    - Fixed AI Assistant edits failing in notes with tasks or using stale context.
    - Fixed lists and tables in Spaces, Notebooks, and Calendar becoming unscrollable after using a menu.
    - Fixed live transcripts not staying visible and correctly sized when resizing the app window.
    - Fixed live transcription failing to reconnect if its connection drops during a recording.
    - Fixed audio recordings that could sound distorted or play at the wrong speed.
    - Fixed speaker profile photos not appearing when printing transcriptions.
    - Fixed date mentions and linked note titles not updating to the correct day.
    - Fixed Daily Notes showing a limit message when permissions prevent creation.
    - Fixed attached files not showing previews.
    - Fixed a crash when opening a note while its editor is loading.
    - Fixed Find in Note shortcuts blocking normal G typing and tag selection not reopening the panel.
    - Fixed inline note links losing their icons when notes are exported to HTML or PDF.
