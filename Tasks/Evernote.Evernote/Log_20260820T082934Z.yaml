  Key: ReleaseNotes
  Value: |-
    Features:
    - Evernote MCP is now available!
    - You can now ask the AI Assistant to pin notes to Home, pin notes in a notebook, or add notes to Shortcuts and help you manage stacks.
    - You can now open a note mention in a new tab or window from its context menu.
    - You can now upscale images past their natural size, up to the width of the note.
    - The menu with three dots in the sidebar has been reorganized for better structure.

    Fixes:
    - Fixed several printing and export issues, including attachment names, note title styling, page ranges, and table and mermaid diagram pagination.
    - Dictation now works in notes opened in a new window.
    - Fixed the tag, mention, and note link pickers not filtering correctly when typing in Japanese, Chinese, or Korean, or with accented characters.
    - Fixed incorrect dates returned for certain German date and holiday mentions.
    - Fixed inconsistent file size display between Note Info, Files, and attachment cards within the note.
