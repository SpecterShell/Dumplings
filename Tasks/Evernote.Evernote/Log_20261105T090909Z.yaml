  Key: ReleaseNotes
  Value: |-
    ✨ Features:
    - Tables get a new style menu: select non adjacent cells with Cmd/Ctrl, select the whole table with Cmd/Ctrl+A when a cell is focused, and align text in cells.
    - Click an empty slot in the Day or Week view in Calendar to create a 30 minute event.
    - The inline toolbar's More options menu now has a search field to find any formatting action.
    - In note edits proposed by the AI Assistant are now clearer: choose to see only the original text, only the changed text, or both, with changes highlighted word by word instead of large red and green blocks.
    - MCP can now read internal links, such as header links.

    🛠️ Fixes:
    - On Evernote Web, the browser tab now shows the open note's title.
    - Completed reminders in the note list now appear greyed out.
    - PDF, print, and HTML export now respect the strikethrough checklist setting.
    - Dates now follow your relative dates setting as soon as the app starts.
    - Fixes on Template imports and Meeting detection
    - Transcription made more reliable
