- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    New features:
    - Improved the search UX: notes open right at the first match with Find in note ready, and search better highlights matches inside images, PDFs, and audio or video recordings both inside the editor and in the note list.
    - The audio recorder now works across tabs, and the note tab stays pinned while you record.
    - Improved the UX of how tags are suggested when typing, and by default shows the most recently used matches.
    - You can create templates from the Templates tab or the sidebar Create menu.

    Fixes:
    - Fixed Find in Note menus being misplaced, obscured, or left open with stale highlights and search state.
    - Fixed the live transcription panel staying open across tabs and remaining available until you close it.
    - Fixed recordings being inserted at the bottom of a note instead of at the cursor position.
    - Misc print fixes, especially around components such as toggles and code blocks.
    - Fixed images in table cells so they resize correctly and their controls remain usable.
    - Fixed a crash when inserting date mentions in note titles for some display languages.
