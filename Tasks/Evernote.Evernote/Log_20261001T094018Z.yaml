  Key: ReleaseNotes
  Value: |-
    ✨ Features:
    - When clicking on a note link in the app, you can now request access if you don't have it.
    - Close tabs faster with two new options: Close other tabs and Close tabs to the right.
    - You can now open an attachment in your computer's default app: Cmd+Click on Mac, Ctrl+Click on Windows.
    - Tables are now much more powerful: sort and filter rows by column values, toggle a header row, customize borders, and distribute columns evenly (rolling out gradually).
    - The note editor's header and tag footer now hide while typing only when you enable "Hide controls while typing" in Settings
    - You can now start a new note directly from the Evernote icon in your Dock

    🛠️ Fixes:
    - Many fixes for export and print on the Web app, now reflecting improvements already available on the desktop app.
    - Fixed an issue where deleted image captions could reappear after reopening a note.
    - Fixed an issue where Find in Note could fail to reopen.
    - Fixed an issue where date mentions did not preserve surrounding text formatting.
    - Fixed an issue where sync folders could import metadata files or import the same file again.
    - Fixed an issue where the note list could reappear after navigating between notes, notebooks, stacks, Trash, or Templates.
    - Fixed an issue where search with Include sub tags could omit notes tagged with the parent tag.
    - Reordering PDF pages in Skitch now scrolls smoothly when you drag a page upward
