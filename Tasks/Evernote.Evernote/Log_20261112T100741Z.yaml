  Key: ReleaseNotes
  Value: |-
    ✨ Features:
    - Keep your table headers in view: freeze columns so they stay visible as you scroll horizontally.
    - Reactions are here: select any text, pick an emoji from the inline toolbar, and everyone with access to the note can react.
    - Meeting recordings started from notifications are saved in a note titled with the meeting's date and time, so you always know which call it was.

    🛠️ Fixes:
    - Templates: additional import fixes.
    - After verifying your email via a shared notebook invite, you go directly to the notebook you were trying to open.
    - Transcribing an image immediately after adding it no longer fails with a generic error.
    - Hovering over the disabled transcript button on an audio recording now explains why there is no transcript and lets you enable automatic transcription.
    - A table's horizontal scrollbar now appears only when the table overflows.
    - On touchscreens, tabs and filter chips no longer remain highlighted after you tap them.
