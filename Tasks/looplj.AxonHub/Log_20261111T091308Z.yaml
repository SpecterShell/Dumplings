    - fix(gemini): count toolUsePromptTokenCount in prompt usage by @pcbeingused333 in https://github.com/looplj/axonhub/pull/2906
    - perf(trace): cache request trace and thread identity by @looplj in https://github.com/looplj/axonhub/pull/2981
