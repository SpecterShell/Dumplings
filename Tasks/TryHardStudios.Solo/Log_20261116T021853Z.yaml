  Key: ReleaseNotes
  Value: |-
    Fixed
    Terminal
    - On macOS, typing an accent with a dead key, such as ´ then A on a Latin American layout, types the accented letter once. In 0.12.4 it was followed by a second, unaccented letter (áa, ÁA).
    Security
    - Updated openssl to 0.10.80, which fixes RUSTSEC-2026-0463 and RUSTSEC-2026-0473 through RUSTSEC-2026-0479. Only Linux builds use OpenSSL, for HTTPS requests.
    - Updated actix-web to 4.18.2 and actix-http to 3.20.3, which fix RUSTSEC-2026-0446, RUSTSEC-2026-0447, RUSTSEC-2026-0448 and RUSTSEC-2026-0455.
