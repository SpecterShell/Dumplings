  Key: ReleaseNotes
  Value: |-
    - Fixed: Push and Pull operations ignoring branch tracking remote
    - Fixed: Selected commit position lost or jumping after fetch operation
    - Fixed: Vulnerability allowing Remote Code Execution via Mercurial repository trust check bypass
    - Fixed: Vulnerability allowing Remote Code Execution via untrusted diff configuration in .git/config
    - Fixed: Vulnerability causing coerced NTLM authentication via sourcetree:// URI handler
    - Fixed: Vulnerability causing command execution via Git-flow release and hotfix branch names
    - Fixed: Vulnerability with incomplete Git configuration checks in repository trust prompt
    - Fixed: kdiff3 location resetting to legacy executable path
