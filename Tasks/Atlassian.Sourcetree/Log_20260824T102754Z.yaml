- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Changes: Added support for rotating OAuth refresh tokens and handling of oversized tokens stored in Windows Credential Manager
    - Fixed: Allow disabling AutoStartSSHAgent when using OpenSSH to support external ssh-agent
    - Fixed: Branch filter preference not saved and resets to "All Branches" on restart
    - Fixed: Checkout fails to discard pending submodule changes
    - Fixed: Custom action parameter $BRANCH not always properly replaced
    - Fixed: Jump to Commit not working on first attempt in large repositories
    - Fixed: Opening two repositories with the same folder name simultaneously not supported
    - Fixed: Renaming repository from New Tab screen fails when repository list is filtered
    - Fixed: Search/View in Full Log no longer working
ReleaseTime: 2026-08-28
