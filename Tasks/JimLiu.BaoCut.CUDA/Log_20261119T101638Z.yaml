  Key: ReleaseNotes
  Value: |-
    What's new in BaoCut 3.20.0
    Record your screen on macOS
    - Record a display, a window, or a selected region, with optional system audio, microphone and camera. Open Screen Recording from Home, Space, the editor's media panel or Tools. Pick a source on screen, preview your camera, and use the countdown, floating controls, menu bar or configurable shortcuts to manage the recording. Settings include frame rate, countdown and main-window behavior. Capture implementation, desktop controls
    - Display and region recordings exclude BaoCut's windows by default. You can include the app, choose how the pointer appears, and opt into shortcut or full keyboard capture. Keyboard capture is off by default and requires separate macOS Input Monitoring permission. If a selected microphone or camera is unavailable, the recording can proceed without that device. Include BaoCut, keyboard track, microphone, camera
    - The recorder warns about low disk space, waits for a picture before starting a capture, and keeps the display awake while recording. System sleep pauses recording, and quitting offers to stop and save. Home lets you recover or delete an unfinished recording. Screen captures larger than 4096 pixels on either side are scaled down proportionally on macOS. Recovery, first-frame checks, disk handling, quit and sleep, capture size
    - Use baocut record and baocut recordings with the local desktop app. Ctrl-C stops and keeps the recording when the CLI is waiting for it. Agents can open a prefilled recorder in an attended desktop session. baocut doctor now checks recording availability and permissions. CLI and agent tools
    Edit recordings on desktop and Web
    - Saved recordings open in the editor with screen, camera and audio tracks linked. Move, trim or split them together, or ungroup them for independent editing. Auto zooms are generated on import. Edit zoom and pointer behavior on the timeline, drag the focus frame on the stage, or choose camera layouts and presentation styles. Preview and export use the same screen framing and pointer behavior. Linked edits, framing and pointer, editing controls, focus frame
    - New videos, saved versions, snapshots and packages use video format 4. Format 3 videos still open and upgrade on the first committed edit. Format 3 snapshots and packages still restore or import. Use this version or newer to open format 4 videos. Format compatibility
    Other improvements
    - Relink a missing or overwritten source to a different file of the same media type. Clips that use the current revision follow the replacement, and the asset keeps its transcripts, captions and cut sets. Undo restores the old revision. Media relinking
    - Curly quotes and apostrophes in Latin text use proportional spacing in CJK fonts in both subtitle preview and export. Subtitle rendering
    - The macOS Skills page can add BaoCut's CLI directory to PATH at your request in zsh, bash and fish. CLI setup
    - In-app updates follow the system proxy. Downloads use the baocut.com mirror with a GitHub fallback, and interrupted transfers retry and resume when possible. Updates verify the final file against its published size and SHA-256. Download issue, mirror and resume, retry and validation
    Compatibility and verification
    - macOS requires Apple Silicon and macOS 14 or later. Screen capture requires a local macOS desktop session. Windows capture remains experimental and disabled by default. The Windows and Web editors can edit imported recordings. Recording support and verification scope
    - Windows packages are unsigned. They require AVX2 and the Microsoft Visual C++ v14 x64 Redistributable. CUDA and Vulkan variants also require compatible drivers. ffmpeg, ffprobe and an agent engine are external dependencies.
    - Automated release checks cover packaging and native smoke tests. Full UI and export workflows, live model or GPU inference, and paid agent calls are outside those checks.
    Source coverage
    The release includes 77 commits in two reviewed batches and no associated pull requests. Test, prototype, documentation and previous-release feed work is included in the comparison. Full comparison from 3.19.2 build 97
    Platform verification
