  Key: ReleaseNotes
  Value: |-
    Changes in 3.20.2 (Build 100)
    - Antigravity tools and approvals: BaoCut now uses agy acp, connecting BaoCut tools and supporting Plan, Ask and Full Access modes. BaoCut tools no longer ask for a second native approval. Update Antigravity CLI to 1.5.10 or later with agy update. Source
    - Session continuity: Existing Antigravity native conversations can resume through ACP. Developer instructions enter the system prompt when a native session is created and are not duplicated on resume. Changes to those instructions require a new native session. Source
    - Models and installation: Model switching preserves reasoning-level model IDs, Flash models are recommended, and Windows recognizes Antigravity's official installer location, including relocated user profiles. Source
    - Background commands: Antigravity turns stay open while commands run in the background, retaining their results and the agent's follow-up. Interrupt cancels the waiting turn; daemon commands and scheduled tasks do not keep it open. Source
    Known limits
    - Antigravity has no steer support: messages sent while a background command runs stay queued until the turn ends. Interrupt the turn to act sooner.
    - Without a follow-up usage update, a deferred turn can wait up to two minutes after its last activity. Behavior and limits
    - Real Google-account end-to-end use has not been verified. Protocol tests use an isolated local model server.
    - macOS requires Apple Silicon and macOS 14 or later. Windows packages are unsigned and require AVX2 and the Microsoft Visual C++ v14 x64 Redistributable; CUDA/Vulkan require compatible GPU drivers.
    Full comparison: 3.20.1 Build 99 to 3.20.2 Build 100.
    Source commit: d4444c97197825f67d50ba451e54442644d630ef. Changelog coverage: 6 commits, 0 associated PRs, 1 batch; all sources reconciled (including previous-release feed maintenance and release preparation).

    BaoCut 3.20.2 (Build 100) for Apple Silicon, macOS 14+.
    Bundle ID: com.baocut.app. Developer ID signed, hardened runtime and Apple notarization accepted for both App and DMG.
    Runtime and native Worker startup, signer fingerprint, staple and Gatekeeper checks passed. UI/export, real model inference and paid Agent calls were not exercised by this workflow. ffmpeg/ffprobe and an agent engine are external dependencies.
    Source: d4444c97197825f67d50ba451e54442644d630ef
