  Value: |-
    0.10.0 — 2026-11-19
    这一版新增「音波回忆」，可看本周最爱与听歌月报，月报支持导出海报与一键建歌单；
    音效新增自定义十段均衡，评论支持图片操作与分享卡片。播放记录与统计也会同步到账号。
    新增
    - 音波回忆 —— 侧栏新增根页，含本周最爱与听歌月报；月报可选年月，展示时长、次数、曲目、最长听歌日与最爱歌手、专辑。
    - 月报海报与歌单 —— 可导出月度总览、歌曲总览两张海报，支持亮 / 暗主题与点击放大；一键生成当月歌单。
    - 自定义均衡器 —— 音效面板新增「自定义」页签，最多保存 20 套十段曲线，可新建、重命名、删除，拖动滑杆实时试听；托盘面板也能直接选用。
    - 评论分享 —— 评论图片可右键复制或另存为；单条评论可生成分享卡片，支持亮 / 暗主题。
    - 最近播放同步 —— 登录后播放的歌曲、歌单与专辑会同步到账号的最近播放，手机端可见。
    修复
    - 播放统计 —— 播放次数与听歌时长一直为 0；现在播完与切歌时按官方规则上报。
    - 歌词页 —— 封面模糊背景在高 DPI 下有一条细缝；退出动画被打断后再进入会只剩背景。均已修复。
    - 评论区 —— 关闭再打开同一首歌的评论会跳回顶部；现在保留上次位置。
    已知问题
    - 自定义均衡预设仅保存在本机，暂不支持导入 / 导出；托盘面板只能选用，不能编辑。
