  Key: ReleaseNotes
  Value: |-
    0.10.1 — 2026-11-22
    这一版补齐界面字体在海报和列表里的覆盖，并给海报增加独立的字体选择；
    同时修正了长评论无法展开、月报海报封面与歌名不一致等问题。
    新增
    - 海报字体选择 —— 音波回忆海报、评论分享卡片可单独选择字体，切换后即时预览。
    修复
    - 长评论展开 —— 带空行或换行较多的评论有时只显示省略号、“更多”按钮不出现；现在按实际行数判断并稳定显示。
    - 月报海报封面 —— 月度总览“本月最爱”的封面有时与歌名对不上；现在使用榜首单曲自己的封面。
    - 界面字体 —— 歌词外观浮层、音波回忆列表中的部分文字不跟随界面字体；现已统一。
    - 海报页脚 —— 月报、评论分享与歌词海报的底部品牌横幅字体不一致；现在统一跟随界面字体，不受海报字体选择影响。
    变更
    - 侧栏图标 —— 收藏的歌单改为爱心，音波回忆改为回溯时钟，不再与其它入口重复。
    已知问题
    - 评论长度 —— 部分长评论服务端只返回前 140 字，展开与分享也只能看到这些内容。
