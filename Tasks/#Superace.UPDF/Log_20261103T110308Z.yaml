Version: 3.0.0
Installer: []
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - UPDF AI has been upgraded to Nomostar, offering AI assistants for academic, contract, financial, and other use cases, with support for custom quick tasks.
    - Ask questions about the entire document, the current page, or specific pages, start new conversations, manage conversation history, and resume previous conversations at any time.
    - UPDF Sign is now integrated, so you can sign documents on your desktop, invite others to sign, and track signing progress.
    - Translate and split PDFs in batches, and run multiple OCR and full-document translation tasks at the same time.
    - Customize the toolbar and how files open, and choose whether to remember your reading state and show gaps between pages.
    - Find and mark text, and select pages to print directly from the thumbnails.
    - Explore the new UPDF 3.0, with more practical features and improvements to the user experience.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - UPDF AI 升级为 Nomostar，提供学术、合同、财务等场景的 AI 助手，并支持自定义快捷任务。
    - 支持围绕整份文档、当前页或指定页面提问，新建对话、管理历史记录，随时继续之前的交流。
    - 集成 UPDF Sign，在桌面端签署文档、邀请他人签署，并跟踪签署进度。
    - 支持批量翻译、批量分割 PDF，以及同时处理多个 OCR 和全文翻译任务。
    - 支持自定义工具栏和文件打开方式，选择是否记住阅读状态、显示页面间隙。
    - 支持查找并标记文本，直接在缩略图中选择需要打印的页面。
    - 更多实用功能与体验优化，欢迎体验全新的 UPDF 3.0。
