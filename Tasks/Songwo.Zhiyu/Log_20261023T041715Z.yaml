  Key: ReleaseNotes
  Value: |-
    知屿 Zhiyu 1.12.1
    让 1.12.0 的「自定义资产类型」更容易找到：现在直接在「新建资产」窗口里。已有资料沿用原数据目录，可在应用内更新。
    新建资产窗口直达自定义类型
    - 「新建资产」窗口在内置类型下方新增「自定义资产」分区：高亮的「新建自定义类型」卡片，以及已建类型的快捷卡片（显示图标、名称和字段数）。
    - 点类型卡片直接进入服务资产的添加表单，并选好这个类型；新建类型保存后同样直接进入添加表单，不用再回到服务资产页找「管理类型」。
    - Ctrl K 命令面板的「操作」分组新增「新建自定义资产类型」。
    - 修改和删除类型仍在「服务资产」页的「管理类型」。
    升级与发行
    Windows 附件为安装包 Zhiyu-1.12.1-setup.exe、便携版 Zhiyu-1.12.1-portable-x64.zip、浏览器插件 Zhiyu-1.12.1-browser-extension.zip 与 SHA256SUMS.txt；应用内更新沿用同次构建的 latest.yml 和 .exe.blockmap。安装包与便携版均未做代码签名，请核对 SHA256。浏览器插件仅同步版本号。
    验证
    - TypeScript、ESLint、i18n、989 项后端与脚本单元测试和 103 项前端单元测试通过。
    - 浏览器集成测试覆盖前端、工作流、首页 hydration、服务资产、编辑器与卡片；另用演示数据走通「新建资产 → 新建自定义类型 → 自动选好类型 → 保存 → 再次从窗口添加」。
    - 已知：agent-workspace 的桌面输入区贴底断言（8px 间距）以及 usage-charts、usage-insights、relations-usage-ui、mail-push、probe-desktop 在 1.10.0 上同样失败，与本版改动无关。
