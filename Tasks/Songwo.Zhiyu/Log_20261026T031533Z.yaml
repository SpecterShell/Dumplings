  Key: ReleaseNotes
  Value: |-
    知屿 Zhiyu 1.14.0
    这一版来自 LINUX DO 与 GitHub 的反馈：「服务器没有代理连不上，希望每台能单独关掉采集」，以及网页版的两个问题（#4）。同时补上 1.13.0 留下的两项待完成：网页版的服务器端提醒推送和正式版 Docker 镜像。已有资料沿用原数据目录，可在应用内更新。
    每台服务器单独开关采集
    - 服务器卡片右下角新增「采集」开关。本机连不上的主机（需要代理、只在内网、暂时停机）关掉后，自动采集和「刷新」都不再连接它。
    - 关闭后不计入「需要留意」与告警、不弹离线系统通知、不推送；状态显示「已暂停采集」，上次采到的数据保留并淡显。终端列表里也不再因为「离线」禁止打开 SSH。
    - 采集失败的卡片下方会提示可以关掉这个开关。重新打开后，下个采集周期照常连接。
    网页版：服务器端提醒推送
    - 新增「设置 → 提醒推送」（网页版）：服务器每小时检查一次续费与备忘提醒，推送到 Telegram、Server 酱 / 微信、企业微信或 WxPusher，浏览器关着也能收到。同一件事每天最多推送一次，只含名称和剩余天数。
    - 推送凭据保存在服务器的 server/push.json（仅服务器可读），浏览器只看到「已保存」，不会回传。可以发送测试消息检查渠道。
    - 桌面版的推送渠道代码与网页版共用一份。
    网页版：Docker 镜像
    - 发布时自动构建并推送 ghcr.io/songwo/zhiyu-web:1.14.0 与 latest，支持 amd64 与 arm64（NAS、树莓派）。
    - docker-compose.yml 改为直接使用镜像：下载这一个文件后 docker compose up -d 即可，不用克隆源码；升级用 docker compose pull && docker compose up -d。想从源码构建，见 docker-compose.build.yml。
    - 修复：Docker 自动创建的 ./zhiyu-data 属于 root，1.13.0 的容器以普通用户运行时无法写入。现在启动时先把资料目录交给容器内的 node 用户再降权运行。
    修复
    - 网页版通过 http://局域网地址 打开时，新建文档报错「crypto.randomUUID is not a function」、进入「自建节点」整页白屏（#4）。原因是浏览器只在 HTTPS 或 localhost 下提供这个接口；现在改用任何页面都可用的随机数生成，并加了检查防止再次使用。
    - 同样在 http:// 下，浏览器不提供 WebCrypto，密钥库无法加解密。现在会改用纯 JavaScript 的 AES-256-GCM（@noble/ciphers），文件格式不变，与桌面版互通。放到公网仍建议使用 HTTPS。
    - 某个页面渲染出错时，只在这一页显示错误信息和「重试」，侧栏与其他页面照常可用，不再整个窗口白屏。
    升级与发行
    Windows 附件为安装包 Zhiyu-1.14.0-setup.exe、便携版 Zhiyu-1.14.0-portable-x64.zip、浏览器插件 Zhiyu-1.14.0-browser-extension.zip 与 SHA256SUMS.txt；应用内更新沿用同次构建的 latest.yml 和 .exe.blockmap。网页版镜像为 ghcr.io/songwo/zhiyu-web:1.14.0。安装包与便携版均未做代码签名，请核对 SHA256。
    验证
    - TypeScript、ESLint、i18n 通过；1007 项后端与脚本单元测试、105 项前端单元测试通过。新增：采集开关不探测、不告警、不发离线通知；网页版提醒推送的配置保存（凭据不回传）、测试消息与按天去重；randomId 格式；没有 WebCrypto 时网页版密钥库的创建、解锁与桌面版双向读写。
    - 浏览器端到端测试（真实构建产物）：首次设置、两台设备同步、完成提醒、配置服务器提醒推送、退出登录。另用 http://局域网地址 打开构建产物复现并确认 #4：新建文档成功，「自建节点」正常显示。
    - 打包程序的 19 项发布检查通过。CI 的 Docker 检查改为挂载由 Docker 自动创建的资料目录，并确认服务以 node 用户运行；发布流程在推送镜像前再次启动检查。
