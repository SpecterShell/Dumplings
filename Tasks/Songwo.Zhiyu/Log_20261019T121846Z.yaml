  Key: ReleaseNotes
  Value: |-
    知屿 Zhiyu 1.7.4
    重新整理导航与设置的分类，新增后退／前进，并首次提供 Windows 便携版。本版同时公开此前只在本机验证的 1.7.2 与 1.7.3 功能。已有资料沿用原数据目录，可在应用内更新。
    导航与设置
    - 左侧导航按「工作台」「基础设施」「账号与订阅」「安全与整理」分组：资产总览、文档和 AI 助手放在最前；服务器、自建节点、域名、证书和服务资产放在一起；AI 订阅、用量、邮箱和号码放在一起。终端仍在「更多工具」中，服务资产与域名改用不同图标。
    - 设置的十二个页面按「个人」「连接与服务」「数据与安全」「关于」分组显示。
    - 标题栏新增后退与前进按钮，也可以使用 Alt+←/→ 或鼠标侧键在最近浏览的页面之间切换。设置等弹窗打开时，快捷键不会在背后切换页面。
    Windows 便携版
    - 新增附件 Zhiyu-1.7.4-portable-x64.zip：解压到任意可写入的文件夹，双击 Zhiyu.exe 即可使用，无需安装。
    - 资料与浏览器会话全部保存在程序旁的 data 文件夹，复制整个文件夹即可备份或换电脑。不写注册表、不创建开始菜单项、不注册网页采集协议，删除文件夹即可移除。
    - 压缩包附带 portable.txt 使用说明与使用教程链接。「设置 → 关于知屿」显示运行模式和资料目录。
    - 便携版可以检查新版本，但不会自动安装：下载新的便携压缩包，退出后解压覆盖程序文件，保留 data 文件夹。
    - 密钥库由主密码加密，可随文件夹迁移；模型 API Key、云服务连接凭据、图床密钥与 Linux.do 登录由 Windows 系统加密，换电脑或换 Windows 账户后需要重新填写。
    - 从安装版迁移：退出两个版本后，将 %APPDATA%\Nanpad 的内容复制到便携版 data 文件夹。
    首次公开的 1.7.2 / 1.7.3 功能
    - 用量记录分为「用量概览」与「订阅与来源」，机场卡片展示额度、到期与节点摘要，支持只读查看 v2rayN 本机流量。详见 1.7.2 说明。
    - 「设置 → 云服务与探针」读取 Cloudflare 域名、Workers、Pages 与 Tunnel，预览确认后修改 DNS；新增可独立部署的知屿探针 Agent 与服务端，查看主机指标和 HTTP/TCP 服务检查。详见 云服务与探针指南。
    升级与发行
    Windows 附件为安装包 Zhiyu-1.7.4-setup.exe、便携版 Zhiyu-1.7.4-portable-x64.zip、浏览器插件 Zhiyu-1.7.4-browser-extension.zip 与 SHA256SUMS.txt；应用内更新沿用同次构建的 latest.yml 和 .exe.blockmap。安装包与便携版均未做代码签名，请核对 SHA256。浏览器插件仅同步版本号。
    本机验证：类型检查、中英文文案检查和 ESLint 通过；新增导航历史、便携目录识别与便携版更新限制的单元测试通过。实际打包的便携程序在本机启动，确认资料与会话写入程序旁 data 文件夹、更新为手动模式。完整的打包程序集成测试由 Windows 正式版流水线执行。
