  Key: ReleaseNotes
  Value: |-
    知屿 Zhiyu 1.17.6
    本版补齐可在 Web 安全实现的工作流，并修复 #5 的 SSH 指纹恢复入口。
    - SSH：终端错误可打开「编辑 SSH 凭据与指纹」，使用已保存凭据测试；输入完整 主机：端口 确认清除旧指纹，不自动重连。核对新指纹后再测试。
    - 密码与扩展：CSV 在浏览器本地处理、加密保存；扩展可连接已解锁 Web 标签页，关闭/刷新/锁库撤销配对。配对要求 HTTPS 或本机回环。
    - OAuth：AI、邮箱及旧独立身份增加完整回调粘贴。AI/独立身份令牌需要同意服务器加密保管；邮箱授权只核验地址，不授予邮件收发权限，服务器不持久保存本次邮箱令牌。
    - 邮件：后台检查默认关闭，同意后仅保存所选邮箱加密凭据；首次建基线，推送只含数量与时间。关闭并保存即清理邮箱凭据。
    - 安全：登录页与工作区常驻风险说明，敏感资产建议优先使用桌面端；明确区分浏览器密钥库与服务器加密保管，管理员仍有能力访问后者。
    验证使用隔离工作区、真实 SSH、本机 HTTP 合成 OAuth/推送供应商及浏览器扩展。合成协议验证不等于真实供应商账号或付费 API 验收；没有提供的真实账号/Key 不作通过声明。LDC 商户和可信 Exa 余额未配置时继续禁止积分购买。
    系统托盘、自启、本机 SSH agent/私钥路径、原生嵌入终端等差异保留。镜像发布不会自动升级已有自托管实例，请更新镜像并重建容器，保留数据卷。
