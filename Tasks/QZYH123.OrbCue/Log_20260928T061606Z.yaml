  Key: ReleaseNotes
  Value: |-
    设置里可以不敲 orb run，完成和手机也能收到同一次提醒。
    新增
    - 原命令启动：新开终端后，直接敲已连接的命令就等于 orb run。Cursor 的 agent 和 cursor-agent 都会开出专属标签。command 加上原命令仍跑原来的程序。
    - 正常完成默认弹出系统通知。关掉「完成通知」后，完成只响提示音。
    - 手机提醒：默认关。填了 ntfy 话题地址后，等待输入、等待授权、失败，以及打开了完成通知时的正常完成，会发到手机。内容是这句提示、工具名，有项目时加上文件夹名。不发完整路径和对话。
    修复
    - 自己开的会话在关闭或清除时，不再牵连别的同名会话。
    - 脱离终端之后的 hook 仍留在原来的会话上。
    - 拖动小球、贴边恢复，以及启动时查看 WSL，不再把界面卡住。
