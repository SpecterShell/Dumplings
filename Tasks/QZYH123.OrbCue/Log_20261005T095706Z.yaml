  Key: ReleaseNotes
  Value: |-
    设置里可以改语言。OpenCode 和 Pi 的命令行可以接到小球上。
    新增
    - 语言：跟随系统、中文或 English。面板、通知、托盘和 orb 命令一起改。系统语言不是中文时，默认是英文。
    - OpenCode 命令行：在连接页接入。关掉标签或客户端后，这一行会去掉。
    - Pi 命令行：在连接页接入。退出或关掉它所在的终端后，这一行会去掉。
    修复
    - OpenCode 2 的会话能认出来，按所在文件夹显示，不再标成「其他」。
    - 同一个项目路径末尾多一个斜杠时，归在同一个项目下，不再拆成两行。
    - Cursor 主会话还在等子代理时，不再提前标成已完成。
    - 连接失败的长说明留在面板里，不再挡住下面的页面切换。
