  Key: ReleaseNotes
  Value: |-
    Cursor 命令行的会话不再中途消失，派了子代理的回合也能正常标成已完成。
    修复
    - Cursor 命令行的会话开着时，不再十几秒后就从小球上消失、下一句话又重新出现。
    - Cursor 编辑器里的 Agent 不再出现在小球上。编辑器和命令行共用同一份 hook 配置，现在只认命令行（agent / cursor-agent）。
    - Cursor 的回合里用了子代理后，结束时会正常变成「已完成」，不再一直停在「工作中」。
    已知限制
    - Cursor 的打印模式（agent -p）没有回合结束通知，条目要等进程退出后才消失。交互使用不受影响。连接页上的说明已同步更新。
