  Value: |-
    - [Feature] Speaker manager: In Pro mode, operator can now select a
      custom visual profile or use a custom text when paging.
    - [Feature] Axis actions: Visual profile and text is now supported for
      audio clip actions (only supported when using AXIS Audio Manager Pro).
    - [Improvement] Visitor management: Support receiving calls from AXIS
      Q9307-LV Dome Camera
    - [Fix] Speaker manager: Fix audio clip upload failure on Axis OS 12+
    - [Fix] License plate list management: Workaround for AXIS License Plate
      Verifier web fails to start after adding a license plate containing
      only numbers.
    - [Fix] Minor fixes for license plate list management
    - [Fix] Access control: Correct door state icons for monitored doors
