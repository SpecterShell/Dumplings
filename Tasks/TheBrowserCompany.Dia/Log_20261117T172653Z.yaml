  Key: ReleaseNotes
  Value: |-
    Dia 1.6.0 for Windows brings richer hover previews, smoother tab management, and more useful Chat and app integrations.

    Attach Office Files to Chat
    Attach Excel, Word, and PowerPoint files to Chat for summaries, answers, and key points.

    Figma Integration Is Generally Available
    Connect your Figma account to search your Design files, FigJam boards, and Slides, and catch up on comments and mentions.

    Organize Tabs with Nested Groups
    Nest tab groups up to eight levels deep to organize related tabs within larger groups.

    Choose Whether New Tabs Open Inside a Tab Group
    Choose whether links open new tabs inside a group, including nested groups.

    Preview Calendar Events from Tabs
    Hover calendar tabs to see upcoming events, join meetings, open events, sign in, and refresh without switching tabs.

    Preview Morning Brief Checklists from Tabs
    Hover Morning Brief tabs to preview titles and scrollable, read-only task checklists without opening the tab.

    Preview Collapsed Tab Groups in the Sidebar
    Hover collapsed groups to preview tabs and nested groups, select tabs, close inactive tabs, and create grouped tabs.

    Scroll Large Tab-Group Hover Previews
    Large previews scroll within available space, keeping every tab and the New Tab button reachable.

    Show Every Split-Tab Pane in Hover Previews
    Hover previews show every split-tab pane in order, making the full contents easier to recognize before switching.

    Choose Tabs When Splitting from Hover Previews
    Choose existing tabs or new panes when splitting the active tab.

    Keep Tab Preview Buttons Highlighted on Hover
    Action buttons keep their hover highlight in light mode, eliminating flicker and making them easier to see.

    Restore Recently Closed Live-Folder Items
    Restore recently closed items through sidebar and top-bar previews, matching the Mac experience.

    Snap Windows When Dragging Title Bar Controls and Sidebar
    Drag Dia from title bar controls, address-bar space, or the sidebar to use Windows snapping and Snap Layouts.

    Clean Up Tabs
    Enable tab cleanup in settings to automatically clean up your inactive tabs each day.

    Teams Morning Brief and App Discovery
    Teams Morning Brief support, app suggestions, and automatic tool tours help you discover integrations.

    Display Google Images in Chat
    Chat shows Google Images alongside answers, making visual results easier to explore.

    Save Websites as PDFs from Chat
    Ask Chat to save any website as a PDF so it's easier to keep and share.

    Improved Chat Readability
    Wider columns, larger text, and a compact composer make Chat easier to read in large windows.

    Refresh Chat Tables
    Wider tables and a cleaner copy button improve readability and visual consistency.

    Smarter Calendar, Search, and App Connections
    Better context, search, and app connections make everyday workflows more reliable and less interruptive.

    More Relevant, Less Intrusive App Connection Prompts
    Prompts prioritize actual usage and high-intent moments, reducing irrelevant suggestions and interruptions.

    Upgrade Atlassian Integration
    Dia's updated Atlassian integration covers more products, including Loom, while using fewer tokens. You may be prompted to re-authenticate.

    Edit Profiles from Empty-Space Context Menus
    Edit profile colors, names, and settings from empty-space context menus.

    Streamline Link Rules Settings and Editor
    Find Link Rules in the Profiles pane and manage how links open with a simpler editor.

    Import Unpinned Tabs from Arc
    Arc imports now include unpinned tabs alongside Favorites and Pinned Tabs for a more complete migration.

    Refresh Tabs with Taller Heights and Tighter Shadows
    Taller tabs give content more breathing room, while tighter shadows better match web content.

    Rename Pull Request Tabs in GitHub Live Folders
    Rename pull request tabs for clearer organization, or clear custom names to restore the original descriptions.
