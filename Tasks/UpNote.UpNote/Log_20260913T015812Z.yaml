  Key: ReleaseNotes
  Value: |-
    - Writing code in UpNote is now smoother and more responsive. Syntax highlighting updates as you type, while automatic indentation on new lines and support for Tab and Shift + Tab make code easier to format.
    - You can also create a code block by typing three backticks followed by a language name, such as “python,” and pressing Enter.
    - You can now insert page breaks to start a chapter or section on a new page when print or exporting to PDF. Click the Page break icon in the editor’s formatting bar, or press Cmd + Option + P on Mac, Alt + P on Windows, or Ctrl + Alt + P on Linux.
    - This update also improves scroll-position restoration and includes several editor fixes.
