  Key: ReleaseNotes
  Value: |-
    Database:
    - Updated for the latest version of release 24.01, which includes:
      - New Blood Raiders' attack battlecruiser, Akoman
      - New event boosters
    Changes:
    - Added "Omega" status column to market listing, ship browser, fitting panel. It is optional and is disabled by default, you can enable it in General preferences (thanks @Skybladev2!)
    Fixes:
    - Reduced performance issues on Windows + dark mode by reducing how many autoresize/redraw calls is issued. This can result in some UI cells not updating when they should; if it happens, please report an issue (thanks @Yessica-C!)
