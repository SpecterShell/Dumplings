- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    New
    - Computer use on a Mac no longer needs the Codex App. Desktop now ships Cua Driver (cua-driver-rs 0.64.3, MIT) on macOS. An agent's local_cua tool can run one Cua Driver tool per call (get_desktop_state, click, type_text, run_steps and others), one driver process per conversation. Calls that run code through the Codex App work as before. Before the driver starts, Desktop asks macOS for Accessibility for itself. The driver's telemetry and update check are turned off. The macOS download grows by about 11 MB. Fixes #5316. (#5324)
    Known limits
    - The first-run macOS permission prompt and Gatekeeper behaviour with the bundled driver were not tested on a clean Mac before this release. The macOS builds were signed and notarized by the release workflow as usual.
    - Windows and Linux are unchanged: the driver is bundled on macOS only.
