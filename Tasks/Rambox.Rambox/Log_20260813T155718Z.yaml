  Value: |-
    Changelog
    Improvements
    - Upgraded Electron to v43.0.0 (Chromium 150.0.7871.46). :electron:
    - General improvements in extensions handling.
    Fixes
    - Fixed the download folder picker not defaulting to the selected folder.
    Extensions
    - Fixed popups not being sized correctly, showing trimmed pages (workaround for an Electron regression not yet fixed upstream).
    - Fixed some extensions showing a blank toolbar icon when none was defined in their manifest.
    - Fixed extension context menus sometimes rebuilding repeatedly while navigating within a page.
    - 1Password: Fixed autofill icon not present.
    - Bitwarden: Fixed login popup not loading.
    - Bitwarden: Fixed context menu autofill option.
    - Boomerang: Fixed some render issues.
    - Dashlane: Fixed the account creation flow hanging after logging out, including when the tab was still loading.
    - Dashlane: Fixed autofill icon not present.
    - Google Translate: Fixed the popup's click-to-translate feature failing to access the page.
    - Grammarly: Fixed the inline spell-checker failing to connect.
    - Grammarly: Fixed toolbar icons and underline indicators not displaying correctly.
    - Keeper: Fixed being logged out immediately after login.
    - Keeper: Fixed autofill icon not present.
    Known bugs
    - Keeper: Sign in page sometimes not loading correctly.
    - 1Password: Login popup not loading.
