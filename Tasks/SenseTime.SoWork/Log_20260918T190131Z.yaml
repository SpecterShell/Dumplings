  Value: |-
    版本号：3.2.4
    2026 年 9 月 3 日
    更新内容：

    优化定时任务指令配置，新增 Skill、Agent、工作空间选项，任务创建与执行配置更加灵活。
    优化定时任务展示样式，任务便签新增左侧短色条标注，便于快速区分和识别不同任务。
    新增语音输入时无光标聚焦时的转写内容弹窗，当语音转写无法直接输入到目标位置时，可通过弹窗查看和处理转写内容。
    优化套餐用量调用明细，新增详情内容展示，帮助用户更清晰地了解具体调用情况。
    新增套餐用量调用明细筛选与导出功能，支持按需查询和导出用量数据。
