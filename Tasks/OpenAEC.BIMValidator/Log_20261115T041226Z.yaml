  Key: ReleaseNotes
  Value: |-
    Nieuw in deze versie
    - OpenAEC Blueprint UI 0.4 met vijf thema’s, gedeelde React-bediening, native dialogen, B2-iconen en lokaal gebundelde lettertypen.
    - BCF 2.1-bestanden importeren in de issuewachtrij, viewpoints openen, status aanpassen en opnieuw exporteren.
    - Behoud van topic-ID’s, auteurs, oorspronkelijke reacties, camerabestanden en afbeeldingen; dubbele import overschrijft lokale issues niet.
    - Herstelde BCF 2.1 XML-structuur, orthografische zoom, zichtbaarheidsreset en Escape bij gestapelde dialogen.
    - README in Nederlands en Engels bijgewerkt, broncontrole voor Blueprint in CI en aangepaste Docker-/licentieverpakking.
    Verificatie
    193 frontendtests en productiebuild; volledige Python-testmatrix op 3.11 en 3.12 in PR #26. Browserimport, statuswijziging en export gecontroleerd tegen de officiële BCF 2.1 markup- en viewpointschema’s. Container lokaal als niet-root gestart met geslaagde healthcheck.
    Windows-app, gebundelde server en installer worden door de releaseworkflow ondertekend en inclusief tijdstempel gecontroleerd. De installer bevat de WebView2-bootstrapper en WebView2Loader.dll. Gebruik SHA256SUMS en GitHub artifact attestations om downloads te verifiëren.
    Openstaande onderdelen
    BCF API 3.0/OAuth2-synchronisatie met externe servers, weergave van aanvullende viewpoints en geïmporteerde clippingplanes blijven open in #18. Andere roadmaponderdelen zijn bijgehouden in docs/release-plan.md; deze release sluit die issues niet automatisch.
    Container
