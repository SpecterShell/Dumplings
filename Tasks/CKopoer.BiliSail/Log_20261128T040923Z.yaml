    ⚠️ 重要提醒
    本次升级后需要重新登录哔哩哔哩账号，才能正常使用 APP 推荐 登录后，请前往「设置 → 推荐流 → 推荐来源」选择 App 推荐。
    BiliSail 1.3.1+0 · App 推荐更新，支持 HDR 与杜比全景声 ⛵
    本次汇总自 1.3.0+8 以来的更新。首页 App 推荐接入 Android 手机版，Windows、Android、macOS 和 iOS 新增 HDR 视频与杜比全景声播放路径。新增课程播放、卡片封面比例设置和下载音质选择。
    🔐 登录与推荐
    - App 推荐与扫码登录统一使用 Android 手机版。首页可按封面设置获取 16:9 单列或 4:3 双列推荐。Android 和 iOS 默认使用 App 推荐，桌面端默认使用 Web 推荐，已保存的来源选择会保留。
    - 推荐反馈默认向哔哩哔哩上报首页推荐卡片的曝光和点击，可在「设置 → 推荐流」关闭「上报推荐卡片曝光和点击」。
    🎬 播放与课程
    - HDR 与杜比视界播放 HDR10、HLG 和杜比视界 Profile 5／8 片源时，可在兼容屏幕上输出 HDR。Windows 需开启系统 HDR，Android 需 Android 10 或更新版本，macOS 和 iOS 使用 Metal 显示面，iOS 的 HDR 输出需 iOS 16 或更新版本。设备无法输出 HDR 时会尝试映射到 SDR。修复 Apple 平台小窗播放杜比视界时画面被裁切的问题。
    - Dolby Digital Plus 全景声可在服务端提供杜比音轨时，从播放器的「音质」选择「杜比音频」。Windows 可向兼容 HDMI 接收端透传，需使用 100% 音量、1 倍速及 0 dB 增益。Android 10 及以上可调用系统杜比解码，macOS 和 iOS 将 JOC 音轨交给系统渲染。实际输出取决于设备和音频路由，可在「播放信息」查看。
    - 课程播放可在搜索框粘贴哔哩哔哩课程链接，也可从动态或观看历史进入。课程页支持按章节选课、查看试看状态和课时评论，并支持连续播放与本地续播。
    - 播放页布局宽窄布局均可从全屏按钮旁收起或展开播放信息，宽屏保留侧栏边缘按钮。「自动收起播放页侧边栏」也适用于上下布局。窄屏收起信息后仍可打开「更多播放选项」。
    - 播放兼容性支持部分仅有单文件播放地址的投稿视频。Intel Mac 在 OpenGL 初始化失败时可回退到软件渲染；Android 和 iOS 在其他应用打断音频后会同步暂停状态，可点一次播放继续。
    📥 下载与离线播放
    - 下载音质弹窗按当前分 P 或剧集列出实际可用的画质、编码和音质，优先预选 AAC 192K。批量下载遇到其他分集缺少所选音质时，会选取该集可用的音轨。下载中心和离线版本显示实际音质。
    - 无损封装支持将 FLAC 和杜比 E-AC-3 音轨直接合并到 MP4 或 MKV，保留原始音轨。
    🖱️ 浏览与界面
    - 卡片封面可在「设置 → 外观」分别为首页、动态和我的页面选择 16:9 或 4:3。4:3 优先使用列表提供的对应封面，缺少时直接裁切普通封面。4:3 视频卡为标题留出整行宽度。
    - 投稿观看进度 UP 主空间的投稿卡片可显示观看进度，播完时标为「已看完」。
    - 动态、评论与消息动态详情可按正文顺序展示专栏和长图文中的完整图片。楼中楼引用更紧凑，私信长文本使用普通正文布局。
    - iOS 导航与旋转 iOS 默认使用单标签导航，已有选择会保留。应用方向设为「自动」时，iPhone 播放横向视频可横拿进入全屏、竖拿退出。修复动态详情和评论的侧滑返回。
    本次构建提交的 CI 检查和七个构建目标均已通过。Apple 播放回归覆盖 macOS 和 iPhone 模拟器。Apple 设备的实际 HDR 显示效果及部分全景声硬件输出仍待实测。CI 构建记录
    完整更新范围：v1.3.0+8 → v1.3.1+0
