  Value: |-
    BiliSail v1.2.5+3 · 弹幕多点色彩，浏览更加顺手 ⛵
    本次更新扩展弹幕选色，调整顶部滚动与后台播放行为，并修复平板导航、系统媒体通知和 Windows 播放窗口等问题。
    - 💬 弹幕选色更丰富：视频和影视发送面板提供 17 种预设颜色，支持十六进制色值与 RGB 滑块自定义；可预览颜色并选择滚动、顶部或底部模式，面板适配手机、桌面和大字号。
    - 🎬 弹幕与画面同步出现：播放加载时等待视频画面就绪后再显示弹幕，避免黑底上先出现弹幕；视频、影视、直播及离线播放共用这一处理。
    - 🧭 顶部连续滚动：底栏布局下，首页搜索工具和“我的”资料区随内容滚出并淡出，子标签到顶后固定；窄屏 UP 主主页同步调整，返回列表顶部时可连续带回完整顶部。
    - 🎧 后台播放策略调整：移动端进入后台时保留当前播放器和播放源，不再自动切换听视频；返回前台不主动重新加载，也不会自动恢复用户手动暂停的播放。手动选择的听视频模式继续保留。
    - 🎛️ 系统媒体卡片完善：点播增加后退 10 秒、播放／暂停和前进 10 秒操作；自然完播且没有其他播放会话时清理媒体条目与通知。实际按钮布局由系统决定。
    - 📱 全屏遵守旋转选择：Android 手机的自动全屏切换遵守系统自动旋转开关，锁定方向后仍可手动进出全屏；iPhone 暂停由物理旋转触发的全屏切换，保留手动操作。
    - 🖥️ Android 平板导航修复：修复部分平板冷启动横屏时错误使用底栏、手动选择侧栏也不生效的问题，无需先旋转设备来恢复布局。
    - 🪟 Windows 播放窗口修复：修复以最大化状态重新打开独立播放窗口时，顶部栏和按钮先上移、随后回落的跳动。
    - 🎨 Windows 图标同步：切换应用图标时同步运行窗口与任务栏图标属性，EXE／MSI 安装同步当前用户的既有开始菜单入口；已固定的任务栏入口及 MSIX 开始菜单图标仍可能保留安装时的图标。
    - 🔄 App 推荐请求调整：补齐 App 来源推荐的请求信息，保留已有设备标识与登录状态。
    完整更新范围：v1.2.5+2 → v1.2.5+3
