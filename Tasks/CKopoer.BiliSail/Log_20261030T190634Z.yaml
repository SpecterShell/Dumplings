  Value: |-
    BiliSail v1.2.5+2 · 随心看，也能随心听 ⛵
    本次更新带来听视频、歌词式字幕和播放列表，并完善后台播放、小窗操作与日常浏览体验。
    - 🎧 新增听视频：支持独立音轨的视频、影视及离线分轨内容，可随时返回视频，保留进度、倍速、音量和暂停状态。
    - 📝 歌词式字幕：当前句自动高亮跟随，支持滚动浏览，点击字幕即可跳转到对应位置。
    - 📱 Android 后台听视频：退到后台自动切换音轨，回到前台恢复原模式；修复后台切换卡住及 Release 媒体通知缺失的问题。
    - 🎛️ 系统媒体控制：接入 Android 媒体通知、Apple“正在播放”、Windows 系统媒体控件及 Linux MPRIS，可通过系统入口控制当前播放。
    - 📚 播放列表更完整：收藏夹、订阅合集和 UP 投稿新增“播放全部”，支持列表选播、上一项／下一项及按需分页。
    - 🔁 相关视频接续：新增“连续播放相关视频”开关，默认关闭；修复视频播完后再次点击播放无法正常重播的问题。
    - 👆 上滑固定倍速：触屏长按加速后向上滑动，即可固定当前倍速；再次长按并上滑可解除固定。
    - 🪟 小窗操作完善：恢复可拖动进度条，增加字幕、听视频和更多设置入口，调整紧凑布局。
    - 🎵 音质与直播流偏好：新增 AAC、FLAC 无损和杜比音轨偏好；直播支持选择流格式、编码及 CDN 线路，并可记住流偏好。
    - 💬 弹幕显示修复：修复大画面下弹幕显示区域受限的问题，保留发送样式选择。
    - 🎨 外观与浏览调整：新增“哔帆／粉红小电视”图标选择；窄屏顶部信息可随滚动收起，调整视频卡片布局，并修复 Android 系统栏背景。
    - 🛠️ 播放与渲染修复：改进音视频断流恢复、缓冲提示和跳转进度反馈，减少听视频返回画面时的重复加载，修复 Windows 调整播放窗口大小时的黑闪。
