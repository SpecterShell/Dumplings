  Value: |-
    BiliSail v1.2.4+1 · 播放焕新，体验更顺手 ⛵
    本次更新调整了播放器与弹幕绘制实现，新增 Intel Mac 构建，并改进 Windows 安装体验和日常操作。
    - 🎬 播放器更新：切换至 Predidit 维护的 media-kit 分支。Windows 视频输出改用 D3D11，继续支持分轨视频、直播和离线播放。
    - 💬 弹幕绘制更新：接入 canvas_danmaku 的绘制管线，保留现有弹幕样式、显示设置和播放同步行为。
    - 🍎 支持 Intel Mac：新增 macOS Intel x64 构建，与 Apple Silicon 版本分别提供，下载时请按 Mac 的芯片类型选择。
    - 🪟 Windows 安装界面焕新：EXE 和 MSI 安装向导换上中文界面与新的视觉样式，支持查看和修改安装目录，并使用系统文件夹选择器浏览路径。
    - ✉️ 消息分类滑动切换：私信、回复、我的、收到的赞和系统通知之间支持左右滑动，顶部分类指示也会跟随手势移动。
    - 👆 触屏进度调整修复：横向滑动调整视频进度后，进度条会保持目标位置，直到跳转完成，减少松手时的进度闪动。
    - 🧭 桌面导航改进：统一桌面各导航模式下的按钮样式，并修复部分情况下关闭播放窗口后侧栏按钮可能无法响应的问题。
