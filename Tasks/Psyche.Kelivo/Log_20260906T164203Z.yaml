  Key: ReleaseNotes
  Value: |-
    What's Changed
    - feat: Redesign the mobile reasoning budget as a stepped slider.
    - feat: Add clear actions for imported fonts and local models in Storage Space.
    - feat: Adapt GPT-6 Astra, Claude 5.1, Qwen 3.8, Muse 1.3, and GLM-5.3.
    - feat: Add a current-location tool on Android.
    - feat: Add menstrual records to health data, and expand sleep summaries with time in bed, awake periods, and sleep stages.
    - feat: Make per-chat models optional and off by default; when off, picking a model applies to the current assistant.
    - feat: Add a setting to send Markdown image links as images, off by default.
    - fix: Send the lowest legal effort when turning thinking off on always-on models, and always send Laguna thinking knobs.
    - fix: Send stable session headers to OpenCode.
    - fix: Retry failed tool follow-ups before output, and reuse generated images in follow-up edits.
    - fix: Fix the restore black screen on large backups, and stop replaying superseded memory snapshots.
    - fix: Fix Markdown paragraph breaks and bubble sizing, table scrolling during streaming, math rendering, and TTS reading of code blocks.
    - fix: Enable high refresh rates on Android, and fix several other known bugs and UI issues.
    Full Changelog: https://github.com/Chevey339/kelivo/compare/v1.2.5...v1.2.6
