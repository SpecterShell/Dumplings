  Key: ReleaseNotes
  Value: |-
    What's Changed
    - feat: Add keep-recent context compression so recent turns stay verbatim, and pick the compress model from the compression dialog.
    - feat: Add conversation multi-select in the drawer, with batch pin, move, and delete.
    - feat: Add Chatbox ZIP v2 backup import.
    - feat: Add a dedicated message style settings page with live bubble preview and color overrides.
    - feat: Add configurable memory injection, humanized outcomes, editable type/scope, and a rebuilt about page, along with migration prompt and batch-size settings.
    - feat: Add a switch to keep message versions when forking.
    - feat: Add DeepSeek search and OpenRouter server tools.
    - feat: Add export for leftover Hive chat files after SQLite migration.
    - feat: Add a setting to disable or retune long-paste-as-file.
    - feat: Add official GLM-OCR support with empty-prompt handling.
    - feat: Raise the assistant context message limit to 4096.
    - feat: Rebuild the streaming layer, matching streaming markdown to the finished render.
    - feat: Remove Google Fonts support.
    - fix: Fix backup file-lock contention that could lock the app out of its own data.
    - fix: Fix minimap search to use full message text, with stable snippets and debounce.
    - fix: Prevent MCP tool name collisions with built-in tools, and send SSE tool calls as UTF-8.
    - fix: Preserve Gemini thought signatures and rebuild Claude thinking blocks from reasoning_details.
    - fix: Sum token usage across tool-call rounds.
    - fix: Fix several other known bugs and UI issues.
    Full Changelog: https://github.com/Chevey339/kelivo/compare/v1.2.2...v1.2.3
