  Key: ReleaseNotes
  Value: |-
    What's Changed
    This maintenance release focuses on message-saving stability and platform interaction fixes.
    - Message-saving stability: Fix an AOT compiler issue that could terminate the process when sending messages, regenerating replies, or saving edits to message history. Resolve checkpoint compatibility before the write loop while retaining incremental writes for changed message parts. This covers the persistence path used when saving an edit that removes images. (#1342)
    - Android text selection: Keep the editor's selection menu available after Select All so subsequent actions remain accessible. Retire replaced selection sessions before actions can use callbacks from an outdated selection. (#1343)
    - iOS Live Activities: Use the system background for the Lock Screen activity, correcting cases where a custom background could remain light in Dark Mode.
    - Speech recognition settings: Adjust hint colors and font weight to distinguish placeholders from entered values. Clarify the Workspace ID placeholder as “e.g. token-plan,” with English, Simplified Chinese, and Traditional Chinese localization.
    - Native AOT regression coverage: Add database integration coverage for first writes, empty assistant placeholders, unchanged and changed streaming checkpoints, timestamp invalidation, finalization, and edited message versions.
    - Image-removal regression coverage: Verify that saving history edits can remove one or all images, select the new revision, and preserve the original revision. Verify separately that removing restored images in the composer updates the draft without submitting it or deleting the source files.
    - Selection and image-context tests: Expand Android selection-menu coverage and correct the desktop image-context test to operate the intended switch directly.
    Full Changelog: v1.3.3...v1.3.4
