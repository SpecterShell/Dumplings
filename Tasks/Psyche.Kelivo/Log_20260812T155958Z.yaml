  Key: ReleaseNotes
  Value: |-
    What's Changed
    - feat: Add screen time (iOS only) and calendar local device tools.
    - feat: Add Azure speech (TTS) support.
    - feat: Add Doubao web search support.
    - feat: Add support for duplicating topics.
    - fix: Harden Hive-to-SQLite migration and backup restore against corrupt or legacy field values.
    - fix: Align MiMo and DeepSeek Responses support.
    - fix: Support OpenRouter Responses image generation.
    - fix: Improve reasoning content replay policies.
    - fix: Support Gboard image paste in chat.
    - fix: Preserve scroll position when paging history, and keep the chat tail stable after deleting the latest message.
    - fix: Expose app documents in the iOS Files app.
    - fix: Fix several other known bugs and UI issues.
