  Key: ReleaseNotes
  Value: |-
    Q-music 0.4.42
    - 音质优先修好了。如果主音源只能播 HQ，备用音源能播 SQ，选择「优先音质」后会先用备用源播放 SQ。主源以前留下的 SQ 缓存也会按它现在支持的音质重新判断。#33
    - QQ 音乐的歌曲只有在平台给出有效的 24-bit 文件大小时，才会列出这个档位。只有普通无损的歌曲会正确显示为 SQ。
    - 桌面设置新增总览，可以直接看到当前自定义音源的名字和播放音质，点卡片就能跳到对应设置。
    - 安卓「我的」页把收藏、下载和播放历史放在第一排，下一排是平台歌单和云端曲库。歌单的导入、同步和排序集中在一起，右侧的加号用来新建歌单。
    - 安卓设置在宽屏上并排显示下载目录和音乐账号。横屏切换分类时，左侧高亮会跟着移动，音源菜单关闭后也能马上再打开。
