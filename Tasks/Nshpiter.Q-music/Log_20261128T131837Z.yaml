  Key: ReleaseNotes
  Value: |-
    Q-music 0.4.43
    - 自定义音源可以直接更新了。 在设置里打开音源管理，在线导入的脚本会记住原链接。可以单独更新一个音源，也可以一键更新全部。想在启动时自动检查，可以给常用的音源打开自动更新。以前从文件导入的音源也能手动补上更新地址。#34
    - 「下一首播放」按选歌顺序排队。 一次选中多首歌加入队列，或回到上一首后再插歌，桌面和安卓都会按队列里的顺序继续播放。
    - 主题新增「暖白陶土」，默认主题换成「松烟暖白」。 两端都调整了浅色底和深色下的文字对比度。
    - 桌面歌曲列表给歌名和来源标记留出了间距。窗口变窄时会缩短长歌名，仍能看清 LOCAL 等来源。深色下多选框更清楚，当前播放行也去掉了左侧多余的边线。
    - 桌面播放栏和设置调整了两处细节。鼠标移到进度条上，时间提示会出现在播放键上方。设置侧栏的输入框现在直接写着「搜索设置」。
    - 安卓歌曲菜单把常用操作分组排列，播放队列里更容易看清当前在播和接下来要播的歌。
