Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Improvement: Faster syntax highlighting and HTML report generation when comparing or viewing large source code files
    - Improvement: Redesigned the Compare dialog's Sessions section for a cleaner look
    - Improvement: Replaced the progress indicator with a smoother animation
    - Fix: Various UI elements didn't scale correctly at high Windows display-scaling settings
    - Fix: Directory list/tree column sort direction could get stuck and not respond after a fresh launch
    - Fix: Directory list column header could show an incorrect highlight when hovering in light mode
    - Fix: Comparing file lists always required Administrator rights, even on systems where that wasn't necessary
    - Fix: Comparing a file list against an invalid file could show a confusing error instead of a clear explanation
    - Fix: Some warning dialogs could hang a command-line (console mode) comparison indefinitely instead of just logging the warning
    - Fix: In text comparison, if one file was shorter than the other, scrolling near the end could cause the two panes to become misaligned
ReleaseTime: 2026-08-16
