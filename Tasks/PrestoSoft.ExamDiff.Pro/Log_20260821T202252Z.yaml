Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Improvement: Selected text in text comparison and merge now keeps its syntax/diff coloring instead of turning solid blue/white
    - Fix: Comparing binary files in detail could fail outright when the system was low on memory, instead of offering to just determine whether the files are different
    - Fix: Some binary files could be incorrectly treated as text during comparison
    - Fix: Text selection could disappear entirely, instead of just appearing dimmed, when the application lost focus
    - Fix: An error message from a command-line comparison run directly via ExamDiff.exe could disappear before it could be read
    - Fix: A few UI elements (including the text cursor) still didn't scale correctly on some Windows display-scaling settings
    - Fix: The Update Available dialog could incorrectly state that a new build was covered by your maintenance period
    - Fix: In binary comparison, the color codes bar could show very few marks even when there were many differences throughout the file
    - Fix: The Windows Programs/Apps list showed the exact build number in the program name, duplicating the separate Version column
ReleaseTime: 2026-08-21
