Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Fix: Canceling a directory comparison's background content comparison (Esc) could take a very long time when many files required plug-ins
    - Fix: Clicking Cancel or pressing Esc during a comparison or plug-in execution often didn't register on the first attempt
    - Fix: Background content comparison in tree mode of directory comparison could run much slower than expected on large comparisons
    - Fix: Starting a new comparison shortly after canceling a directory comparison's background content comparison could crash the application
    - Fix: Canceling a comparison could leave a plug-in's helper process (e.g. when comparing against a remote URL) still running in the background
    - Fix: Comparing a password-protected ZIP, 7z, RAR, or other archive file could leave the application unresponsive indefinitely instead of showing an error
    - Fix: Comparing certain RTF files using the DOC to Text plug-in could incorrectly show them as identical, or show missing content
    - Fix: Comparing certain RTF files using the DOC to Text plug-in could show extra blank lines not present in the original document
ReleaseTime: 2026-08-08
