- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    新增
    - 支持 Helm 集群部署。多实例共用一个 PostgreSQL
    - 管理员可以限制创建专家时能选的存储后端
    - 新增托管专家，对话可以交给后端 Agent，如 OpenCode
    - 知识库支持知识图谱和重排序
    - 新增本地模型供应商 Magpie
    - 定时任务可以跟最新对话，也可以固定到某一场历史对话
    - 对话里列出本轮改过的文件、所在目录和增删行数
    修复
    - 编辑托管专家时，不显示存储后端也能保存
    安全
    - 不能再把宿主机目录挂进 Docker 专家
    - 腾讯云登录按用户隔离
    What's Changed
    - chore: sync main into develop after 1.0.3b5 by @github-actions[bot] in https://github.com/TencentCloud/Octop/pull/2942
    - feat(knowledge): rerank retrieved chunks with a provider's rerank model by @alison-xx in https://github.com/TencentCloud/Octop/pull/2918
    - feat: deploy multiple replicas on one PostgreSQL and limit expert backends by @jubaoliang in https://github.com/TencentCloud/Octop/pull/2953
    - feat(dashboard): guided tour for new users by @alison-xx in https://github.com/TencentCloud/Octop/pull/2949
    - fix(build): raise docker node heap to 4096mb by @liukewia in https://github.com/TencentCloud/Octop/pull/2948
    - fix(desktop): match the macos dock icon size to other apps by @liukewia in https://github.com/TencentCloud/Octop/pull/2961
    - feat(telegram): 基于 Gateway 集成配置与原生问答 by @ideshun in https://github.com/TencentCloud/Octop/pull/2335
    - fix(dashboard): tighten the new-user tour intro by @jubaoliang in https://github.com/TencentCloud/Octop/pull/2965
    - feat(dashboard): create and sort chat-nav experts without leaving the chat by @jubaoliang in https://github.com/TencentCloud/Octop/pull/2970
