  Key: ReleaseNotes
  Value: |-
    新增
    - 飞书 / 钉钉 / 企业微信 OAuth SSO 登录与绑定
    - 可选登录验证码（滑块及多家云验证码），并提供 octop captcha reset
    - 容器工作区默认、专家头像，以及聊天 HITL / 技能选择体验优化
    - 模型列表搜索；ACP 纳入个性化「工具」页签
    修复
    - 超长 URL 导致历史消息加载极慢
    - 手动创建渠道默认启用；PostgreSQL 知识库缺列；损坏 config 被清空
    - 若干 Dashboard / 构建相关问题（权限页签、抽屉滚动、Windows 构建等）
    变更
    - 升级 harness-agent / harness-browser
    What's Changed
    - chore: sync main into develop after 1.0.0 by @github-actions[bot] in https://github.com/TencentCloud/Octop/pull/678
    - docs: add Trendshift badge to README by @liukewia in https://github.com/TencentCloud/Octop/pull/726
