Installer:
- Architecture: x64
  InstallerType: nullsoft
  InstallerUrl: https://github.com/TencentCloud/Octop/releases/download/v1.0.2/Octop-desktop-windows-amd64-1.0.2.exe
- Architecture: arm64
  InstallerType: nullsoft
