  Key: ReleaseNotes
  Value: |-
    新增
    - 托管专家可选会话模式，并能使用连接器、知识库、专家回调和已启用的插件
    - 云服务器页的地域筛选改为按大区分组的下拉面板
    变更
    - 工具调用上限只拦截连续的相同调用
    - 云服务器页侧栏折叠、字号和未授权提示与对话页对齐
    修复
    - Docker 部署时仍可将宿主机目录挂进 Docker 专家
    - Telegram 回复本机器人时保留引用；记忆列表不再被过期响应覆盖
    - PostgreSQL 清理孤儿 checkpoint 时只统计，不再误删其他智能体的对话
    - 带路径的 MCP OAuth 按规范发现授权信息
    - 窄屏下 Word / PDF 左侧可以滚到；新手引导遮罩铺满窗口
    What's Changed
    - chore: sync main into develop after 1.0.3b6 by @liukewia in https://github.com/TencentCloud/Octop/pull/3002
    - fix(connectors): discover path-scoped MCP OAuth metadata per RFC 8414 by @huangcheng in https://github.com/TencentCloud/Octop/pull/3004
    - fix(memory): report PostgreSQL orphan checkpoints without deleting them by @Bosheng0422 in https://github.com/TencentCloud/Octop/pull/2960
    - fix(memory): 防止过期响应覆盖当前记忆列表 by @MakerFlyFly in https://github.com/TencentCloud/Octop/pull/1449
    - fix(dashboard): keep the left edge of wide Word / PDF pages reachable by @alison-xx in https://github.com/TencentCloud/Octop/pull/1286
    - fix(telegram): 保留普通回复机器人消息的引用上下文 by @ideshun in https://github.com/TencentCloud/Octop/pull/3005
    - fix(dashboard): cover the whole window with the new-user tour mask by @alison-xx in https://github.com/TencentCloud/Octop/pull/3015
    - feat(cloud): redesign workbench region picker and unify cloud hosts t… by @seed30 in https://github.com/TencentCloud/Octop/pull/3013
    - chore(deps): bump Octop runtime libraries by @Bosheng0422 in https://github.com/TencentCloud/Octop/pull/3017
    - feat: give managed experts session modes and Octop tools by @jubaoliang in https://github.com/TencentCloud/Octop/pull/3018
    - chore: release 1.0.3b7 by @jubaoliang in https://github.com/TencentCloud/Octop/pull/3021
    Full Changelog: https://github.com/TencentCloud/Octop/compare/v1.0.3b6...v1.0.3b7
