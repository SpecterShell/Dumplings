  Key: ReleaseNotes
  Value: |-
    新增
    - 对话 mid-turn steering
    - 当前专家记忆备份、恢复与存储维护
    - Telegram 可限制允许的用户 ID
    修复
    - Windows 记忆备份恢复；微信旧库定时任务与重启后推送
    - 审批放通、Steer 续跑，以及历史加载中消息消失
    - 知识库上限为 0、本地索引内存、技能集缺包、WPS / 旧版 Word
    - 云端协同多链接与附件；撤销授权未清 API Key
    - App 内下载、输入法回车误提交、命令行默认模型说明
    变更
    - 升级 octop-harness 1.0.3 与 octop-gateway 1.0.2
    What's Changed
    - chore: sync main into develop after 1.0.2b7 by @jubaoliang in https://github.com/TencentCloud/Octop/pull/1963
    - feat(knowledge): support .wps/.doc via firecrawl-anydoc (#1345) by @huangcheng in https://github.com/TencentCloud/Octop/pull/1938
    - fix(providers): clear the API key when authorization is revoked by @seed30 in https://github.com/TencentCloud/Octop/pull/1953
    - fix(chat): keep a turn sent while history is still loading by @seed30 in https://github.com/TencentCloud/Octop/pull/1952
    - fix(skills): skip a skillset skill whose package is not published by @seed30 in https://github.com/TencentCloud/Octop/pull/1954
    - fix: bound local knowledge indexing memory and service restarts by @Bosheng0422 in https://github.com/TencentCloud/Octop/pull/1985
    - fix(bridge): keep simultaneous peer logins and tunnel chat attachments by @jubaoliang in https://github.com/TencentCloud/Octop/pull/1986
    - fix(dashboard): treat a zero document cap as unlimited and follow expert defaults by @jubaoliang in https://github.com/TencentCloud/Octop/pull/1989
    - feat(connectors): add Yuque (语雀) gateway connector by @Yesno1314 in https://github.com/TencentCloud/Octop/pull/1936
    - fix(bridge): accept peers that advertise the default loopback URL by @jubaoliang in https://github.com/TencentCloud/Octop/pull/1994
    - fix(channels): restore Telegram allowed user IDs by @Bosheng0422 in https://github.com/TencentCloud/Octop/pull/1993
    - fix(bridge): do not treat a WebSocket 403 as a missing route by @jubaoliang in https://github.com/TencentCloud/Octop/pull/1997
    - feat(chat): mid-turn steering for dashboard conversations (#1300) by @huangcheng in https://github.com/TencentCloud/Octop/pull/1988
    - fix: let in-app browsers download files through a short-lived link by @alison-xx in https://github.com/TencentCloud/Octop/pull/1991
    - fix(dashboard): don't submit edits and renames on the IME confirm Enter by @alison-xx in https://github.com/TencentCloud/Octop/pull/1285
    - fix(cli): explain an unset default model and show what agents fall back to by @alison-xx in https://github.com/TencentCloud/Octop/pull/2025
    - fix(dashboard): keep bridge cards compact and update one row at a time by @jubaoliang in https://github.com/TencentCloud/Octop/pull/2024
    - docs: add a China GHCR compose file when ghcr.io is unreachable by @liukewia in https://github.com/TencentCloud/Octop/pull/2034
    - docs: add Zenith Hosting deploy option by @odpay in https://github.com/TencentCloud/Octop/pull/1969
    - fix(chat): keep steer, approvals, and stream errors consistent by @jubaoliang in https://github.com/TencentCloud/Octop/pull/2037
    - ci: upload desktop and FnOS release installers to COS by @liukewia in https://github.com/TencentCloud/Octop/pull/2036
    - fix(weixin): keep a durable send token and repair old cron columns by @seed30 in https://github.com/TencentCloud/Octop/pull/1999
