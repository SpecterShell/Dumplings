- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    新增
    - 桌面客户端改为 Electron 壳，登录过期后自动续上
    - 自定义 MCP 可填写 OAuth 应用凭证并完成授权
    - 新增 octop migrate openclaw / octop migrate hermes，把原有助手迁到一个专家
    - 知识库内的文档和文件夹可以移动。共享专家上可以分享对话
    - 专家市场默认打开「精选」。管理员可按用户查看用量
    变更
    - 桌面端不再使用 Wails
    - 升级 octop-harness 至 1.0.9、octop-memory 至 1.0.4
    修复
    - 下线 history v2，启动时把已有归档迁回原有历史表
    - 云端协同不再因心跳超时反复断开
    - 共享会话的回复不再重叠。聊天里的模型和提问顺序保持正确
    What's Changed
    - fix(memory): preserve capture and recall runtime switches by @mmhh256 in https://github.com/TencentCloud/Octop/pull/2296
    - chore: sync main into develop after 1.0.3b4 by @github-actions[bot] in https://github.com/TencentCloud/Octop/pull/2858
    - fix(ci): build darwin-arm64 desktop packages on macos-15 by @liukewia in https://github.com/TencentCloud/Octop/pull/2865
    - fix(models,bridge): keep pool preference out of chat and explain collab failures by @jubaoliang in https://github.com/TencentCloud/Octop/pull/2874
    - fix: close the open bug batch and mark pre-market experts as featured by @jubaoliang in https://github.com/TencentCloud/Octop/pull/2878
    - feat(chat): share conversations on a shared expert by @jubaoliang in https://github.com/TencentCloud/Octop/pull/2877
    - fix: keep provider defaults, model names, and upgrade prompts honest by @jubaoliang in https://github.com/TencentCloud/Octop/pull/2880
    - fix(packaging): add python-socks for SOCKS proxy browser attach by @huangcheng in https://github.com/TencentCloud/Octop/pull/2852
    - fix(gateway): resolve reasoning overrides on IM turns like the dashboard path by @wxhking in https://github.com/TencentCloud/Octop/pull/2787
    - fix: surface checkpoint retention and channel health by @seed30 in https://github.com/TencentCloud/Octop/pull/2832
    - fix(dashboard): drop the service worker cache before reloading after restart by @liukewia in https://github.com/TencentCloud/Octop/pull/2901
    - fix: keep live chat status honest and stop websocket keepalive flaps by @jubaoliang in https://github.com/TencentCloud/Octop/pull/2920
    - feat(knowledge): move documents and folders between folders by @alison-xx in https://github.com/TencentCloud/Octop/pull/2917
    - feat(cli): migrate an OpenClaw or Hermes Agent setup into an expert by @alison-xx in https://github.com/TencentCloud/Octop/pull/2916
    - feat(connectors): OAuth app credentials for custom MCP servers without dynamic registration by @alison-xx in https://github.com/TencentCloud/Octop/pull/2915
    - chore: retire versioned history after startup migration by @Bosheng0422 in https://github.com/TencentCloud/Octop/pull/2924
    - chore(deps): upgrade octop-harness to 1.0.9 by @Bosheng0422 in https://github.com/TencentCloud/Octop/pull/2933
    - fix: stop shared replies from overlapping and allow a chosen workspace by @jubaoliang in https://github.com/TencentCloud/Octop/pull/2934
    - feat(desktop): replace the Wails shell with an Electron shell by @liukewia in https://github.com/TencentCloud/Octop/pull/2445
    - chore: release 1.0.3b5 by @jubaoliang in https://github.com/TencentCloud/Octop/pull/2941
    New Contributors
    - @mmhh256 made their first contribution in https://github.com/TencentCloud/Octop/pull/2296
