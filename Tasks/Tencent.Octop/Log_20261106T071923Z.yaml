  Key: ReleaseNotes
  Value: |-
    新增
    - 工作台增加云主机页：授权后查看腾讯云 CVM，并由常驻运维专家巡检和变更
    - 后台标签页的定时提醒改为系统通知
    - 启动时同步新的预置模型，腾讯云通道支持 HY4
    修复
    - 共享专家能用查看者的自定义 MCP 名称
    - 编辑团队会保存示例头像
    - Docker 精简镜像在编译器已移除后仍能发布
    变更
    - 多实例部署时，腾讯云授权改存在控制面；单机仍用本地文件
    - 云服务器页移到工作台末尾，并注明目前只支持腾讯云 CVM
    - 默认 Docker 标签改为精简版，完整版使用 :<version>-full 和 :full
    - 连接器可按类别筛选，大额 token 用量会缩写
    - 升级 octop-harness 至 1.0.8
    What's Changed
    - chore: sync main into develop after 1.0.3b3 by @github-actions[bot] in https://github.com/TencentCloud/Octop/pull/2822
    - fix: persist team sample avatars when editing a team by @jubaoliang in https://github.com/TencentCloud/Octop/pull/2844
    - fix: let Docker publish finish when the compiler is already removed by @jubaoliang in https://github.com/TencentCloud/Octop/pull/2842
    - feat(providers): sync new preset models on startup and support HY4 by @Bosheng0422 in https://github.com/TencentCloud/Octop/pull/2830
    - fix: map shared custom MCP names onto the expert harness by @jubaoliang in https://github.com/TencentCloud/Octop/pull/2848
    - Feat/cloud hosts console by @seed30 in https://github.com/TencentCloud/Octop/pull/2778
    - fix(cloud): keep the cloud tab last and note Tencent-only support by @jubaoliang in https://github.com/TencentCloud/Octop/pull/2850
    - feat(dashboard): show cron reminders as system notifications in background tabs by @jubaoliang in https://github.com/TencentCloud/Octop/pull/2851
    - fix(cloud): share Tencent Cloud logins through PostgreSQL by @jubaoliang in https://github.com/TencentCloud/Octop/pull/2854
    - chore: release 1.0.3b4 by @jubaoliang in https://github.com/TencentCloud/Octop/pull/2855
    Full Changelog: https://github.com/TencentCloud/Octop/compare/v1.0.3b3...v1.0.3b4
