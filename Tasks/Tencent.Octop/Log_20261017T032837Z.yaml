  Key: ReleaseNotes
  Value: |-
    新增
    - 聊天侧栏置顶专家；业务流程专家；技能与技能包导出 ZIP
    - 记忆页可手改用户档案与强记忆，冲突转入审核
    - 技能、工具与团队的决策模型；通道插件；模型健康切换
    - 对外 Agent MCP 网关；ONNX 模型可离线加载
    修复
    - 无路径搜索不再打满主机内存；失败回合会正常结束
    - 云端专家结束态、未安装插件提示，以及对端模型与知识库显示
    - 用量显示专家名；定时任务会话有标题；文件描述符与 accept 日志
    - Docker 外部数据库重启、知识库运行时与安装后重启提示
    - Embedding 与 rerank 分开识别；飞牛 beta 可升级并保留浏览器驱动
    - 安装向导在已有用户后不再签发令牌
    变更
    - 用户消息的复制、编辑按钮一直显示
    - 升级 octop-memory 1.0.2、octop-harness 1.0.4、octop-gateway 1.0.3
    What's Changed
    - chore: sync main into develop after 1.0.2b8 by @github-actions[bot] in https://github.com/TencentCloud/Octop/pull/2055
    - feat(experts): add knowledge-work expert templates converted from Claude plugins by @Jeffrey8864 in https://github.com/TencentCloud/Octop/pull/2021
    - fix: peer composer defaults, usage names, and cron titles by @jubaoliang in https://github.com/TencentCloud/Octop/pull/2066
    - fix(docker): stop re-running octop init on restart with PostgreSQL (#1866) by @fengyue-xve in https://github.com/TencentCloud/Octop/pull/1868
    - fix(providers): recognise embedding models by naming convention by @mediasambb in https://github.com/TencentCloud/Octop/pull/2049
    - fix(setup): stop issuing wizard tokens after the first user exists by @jubaoliang in https://github.com/TencentCloud/Octop/pull/2074
    - fix(dashboard): gate PWA update prompt by permission and stop re-prompting by @zsuroy in https://github.com/TencentCloud/Octop/pull/2080
    - fix(docker): bake local knowledge dependencies into the image by @ideshun in https://github.com/TencentCloud/Octop/pull/2082
    - fix(knowledge): tell the user a restart is what the install needs by @sclfcz in https://github.com/TencentCloud/Octop/pull/1493
    - docs: add Pull Request submission guidelines to CONTRIBUTING.md by @jubaoliang in https://github.com/TencentCloud/Octop/pull/2109
