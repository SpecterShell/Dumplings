- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    新增
    - 账号支持 TOTP 与 Passkey：二次验证、无密码登录和恢复码
    - 新增 ragflow 知识库连接器
    修复
    - 记住登录会自动续期，改密码会退出其他设备。缺 MFA 表的旧库会自动补齐
    - 极简模式里，专家会话超过 10 条可以继续展开。长代码在气泡里换行，已结束的一轮不会在历史加载后再出现一次
    - 停用的会话模型回到 Auto。钉钉和微信切换时，草稿与二维码不再串台，登录回调会保留转发端口
    - 更早回合生成的文件不会再次发出。对话轨迹记下模型实际收到的系统提示
    变更
    - 通行密钥登录默认关闭，要在应用设置里打开。修改密码放在「账户安全」里
    - 虚拟桌面和系统浏览器默认不启动。未选 MBTI 时显示「未设置」
    - 升级 octop-harness 1.0.6
    What's Changed
    - chore: sync main into develop after 1.0.3b1 by @github-actions[bot] in https://github.com/TencentCloud/Octop/pull/2402
    - feat(connectors): add ragflow knowledge connector (#2308) by @Pandakingxbc in https://github.com/TencentCloud/Octop/pull/2403
    - fix(channels): prevent repeated requests when switching channel types (#2314) by @Pandakingxbc in https://github.com/TencentCloud/Octop/pull/2390
    - fix(chat): reset disabled conversation models to Auto (#2316) by @Pandakingxbc in https://github.com/TencentCloud/Octop/pull/2407
    - feat: opt in bundled desktop and harden chat turns by @jubaoliang in https://github.com/TencentCloud/Octop/pull/2446
    - fix(chat): don't append a finished turn again after history loads by @Bosheng0422 in https://github.com/TencentCloud/Octop/pull/2441
    - fix: preserve forwarded ports in OAuth callback URLs by @Bosheng0422 in https://github.com/TencentCloud/Octop/pull/2460
    - docs: document which runtime library owns a change by @liukewia in https://github.com/TencentCloud/Octop/pull/2463
    - fix(chat): wrap long inline code inside message bubbles by @liukewia in https://github.com/TencentCloud/Octop/pull/2411
    - feat: record the model system prompt and harden chat, connectors, and images by @jubaoliang in https://github.com/TencentCloud/Octop/pull/2700
    - feat(auth): TOTP/passkey MFA and passwordless passkey login by @huangcheng in https://github.com/TencentCloud/Octop/pull/2350
    - feat: renew remembered sessions and simplify sharing and chat nav by @jubaoliang in https://github.com/TencentCloud/Octop/pull/2724
    - feat: gate passkey sign-in and fold password change into account security by @jubaoliang in https://github.com/TencentCloud/Octop/pull/2729
    - chore: release 1.0.3b2 by @jubaoliang in https://github.com/TencentCloud/Octop/pull/2734
