  Value: |-
    新增
    - Teams 主持人改写派工，成员回复同步 IM
    - 企查查、OpenAlex 连接器
    修复
    - 专家编辑、聊天欢迎标题与专家切换预填
    - FPK 预发布版本解析、沙箱 ACP 委托、桌面重启 WAL、定时任务失败后 prompt 残留
    - 连接器 OAuth 回调安全加固
    What's Changed
    - chore: sync main into develop after 1.0.2b1 by @github-actions[bot] in https://github.com/TencentCloud/Octop/pull/1030
    - fix(connectors): secure OAuth callback redirects and popup messages by @dangzitou in https://github.com/TencentCloud/Octop/pull/942
    - fix(cron): 执行失败的定时任务不再留下空会话线程 (#516) by @sxh313 in https://github.com/TencentCloud/Octop/pull/984
    - fix(update): checkpoint SQLite WAL before desktop process restart by @Theater-ahyeon in https://github.com/TencentCloud/Octop/pull/918
    - fix(chat): avoid carrying prefill text across expert switches by @wxhking in https://github.com/TencentCloud/Octop/pull/920
    - feat(connectors): add OpenAlex connector by @locip123 in https://github.com/TencentCloud/Octop/pull/1009
    - feat(connectors): 新增企查查 OAuth 连接器，一次授权接入五类 MCP 服务 by @duhu2000 in https://github.com/TencentCloud/Octop/pull/1033
    - feat(connectors): 企查查改为 API Key，并用 internal 模式加载工具 by @jubaoliang in https://github.com/TencentCloud/Octop/pull/1046
    - fix(chat): show the real team name on the welcome heading by @jubaoliang in https://github.com/TencentCloud/Octop/pull/1048
    - fix(acp): 沙箱环境下禁用向外委托 Runner by @jubaoliang in https://github.com/TencentCloud/Octop/pull/1061
