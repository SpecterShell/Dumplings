- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    This release focuses on deepening Antigravity CLI (ACP) parity, collaboration workflows, and runtime stability: the Antigravity engine now supports /btw side chats, context-seeded session forking, per-turn file change tracking with read-only diff review (for both Git and non-Git workspaces), CLI v1.5.18 alignment, and async subagent wakeup bridging. It also adds configurable worktreeMode with existing worktree reuse, brings built-in Browser Use to the mobile app and remote H5, and fixes Claude Official environment isolation, Agent Teams idle-lead message delivery after reconnect, Workspace Browser runaway resource guards, updater check races, and iOS composer height bugs. The phone app updates to 0.1.8.
    Highlights
    - Antigravity CLI (ACP) Parity (#2053):
      - Side chat (/btw): aligns desktop sidebar, header, mobile subbar, and message selection entry points with ephemeral read-only side chats seeded from a fixed parent transcript snapshot, in-process model/effort/mode switching, and automatic cleanup on close.
      - Session forking & per-turn diff review: adds context-seeded session forking via ACP, and tracks per-turn file changes across both Git and non-Git workspaces with read-only diff review cards.
      - ACP protocol & concurrency: aligns with Antigravity CLI v1.5.18 updates (permission dialogs, approvals, and AskUserQuestion), bridges async subagent lifecycles with detached wakeup turns, and persists mid-turn steps incrementally using an O(1) append cache.
    - Collaboration & Worktree Reuse (#2019): adds configurable worktreeMode and existing worktree reuse across delegation dialogs, review bars, and collaboration APIs.
    - Desktop Tab Ergonomics (#2022): supports closing session tabs with middle click.
    - Mobile & Remote H5 Browser Use: adds Browser Use toggles, inline consent, target selection, and message capability badges to the mobile app and /m H5 composer while keeping status, Chrome lifecycle, and takeover routes strictly desktop-only.
    Fixes
    - Provider isolation & catalog caching (#2054): isolates Claude Official desktop environment variables and caches official catalogs per provider.
    - Agent Teams reconnect reliability (#2052, #2055): fixes an issue where an idle team lead failed to receive member messages after reconnecting to the team.
    - Workspace Browser runaway guards: prevents runaway workspace browser tabs and reclaims idle CDP leases and pollers.
    - Workflow reconstruction & mobile subagents (#2056, #2057): degrades bounded workflow reconstruction gracefully and shows subagents in mobile history views.
    - Desktop updater & Computer Use probes: prevents updater check races, preserves download progress, and logs updater diagnostics; makes cu-helper verification async and coalesces status probes.
    - macOS sidebar zoom inset (#2021): reserves zoom-compensated macOS traffic-light insets in the desktop sidebar.
    - Mobile iOS composer & keyboard: resets multiline composer height on iOS Fabric when drafts are cleared or shortened, guards third-party keyboard collapse events, and resyncs H5 viewport height on focusout.
    - Sponsor & preset cleanup: retires featured placement and referral links for the deprecated Atlas Cloud preset (while keeping existing saved providers usable) and removes Moe API sponsorship from READMEs.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    本版本聚焦 Antigravity CLI (ACP) 深度补齐、桌面端协作与稳定性加固：在 Antigravity 引擎下新增 /btw 侧边对话、带上下文的会话 Fork、每轮文件变更追踪与只读 Diff 预览（兼容 Git 与非 Git 工作区），并对齐 CLI v1.5.18 协议能力与异步子 Agent 唤醒；同时支持多工作区协作的可配置 worktreeMode 与已有 worktree 复用、移动端与远程 H5 的内置 Browser Use，并修复了 Claude Official 环境隔离、Agent Teams 空闲队长重连收消息、Workspace Browser 资源防失控、自动更新竞态及 iOS 输入框高度等关键问题。手机 App 同步升级到 0.1.8。
    核心功能
    - Antigravity CLI (ACP) 体验补齐（#2053）：
      - 侧边对话（/btw）：对齐桌面端侧边栏、标题栏、移动端子栏与消息选中入口，支持基于固定父会话上下文快照的临时只读侧边对话与进程内模型/推理强度/模式切换，关闭时自动清理。
      - 会话 Fork 与文件变更 Diff 预览：支持通过 ACP 发起带上下文种子的会话 Fork；自动追踪每轮文件变更（兼容 Git 仓库与非 Git 工作区）并展示只读 Diff 卡片。
      - ACP 协议与并发增强：对齐 Antigravity CLI v1.5.18 更新（含权限弹窗、审批与 AskUserQuestion 交互对齐），桥接异步子 Agent 生命周期并修复 detached 唤醒回合，改用 O(1) 增量缓存持久化回合步骤防止长任务丢步。
    - 团队协作与 Worktree 复用（#2019）：支持可配置的 worktreeMode 与已有 worktree 复用，在任务委派弹窗与评审栏中可直接选择或复用现有 worktree，减少重复创建开销。
    - 桌面端快捷交互（#2022）：会话标签栏支持鼠标中键直接关闭会话 Tab。
    - 移动端与远程 H5 Browser Use：Mobile App 与远程 /m H5 的输入框 + 菜单支持开启内置 Browser Use（含内联授权提示、目标切换与消息能力标签），同时将状态、Chrome 生命周期、Takeover 等敏感控制路由严格限制在桌面端。
    修复
    - 供应商环境隔离与缓存（#2054）：隔离 Claude Official 桌面端运行环境变量，并按 Provider 独立缓存官方模型目录，防止切换供应商时互相污染。
    - Agent Teams 重连可靠性（#2052，#2055）：修复空闲队长重新接入团队后收不到成员消息的问题。
    - Workspace Browser 防失控保护：限制内置浏览器异常标签页暴增，自动回收空闲 CDP 租约与后台轮询器，防止长期运行后资源泄漏或卡顿。
    - Workflow 历史重建与移动端 Subagent（#2056，#2057）：为有界历史重建提供优雅降级路径避免异常失败，并在移动端历史记录中补齐 Subagent 展示。
    - 桌面端自动更新与操作电脑探测：消除自动更新检查竞态、保留下载进度并补全更新诊断日志；将 Computer Use（操作电脑）helper 校验改为异步并合并状态探测请求，避免阻塞界面。
    - macOS 侧边栏缩放适配（#2021）：在桌面端侧边栏中按 UI 缩放比例预留 macOS 红绿灯按钮安全边距，避免缩放后按钮重叠。
    - 移动端键盘与输入框 ：修复 iOS 新架构下清空或缩短草稿时多行输入框高度未重置的问题，并防护第三方输入法收起时的异常视口事件与 H5 focusout 高度错位。
    - 赞助商与预设调整：下线 Atlas Cloud 预设的推荐展示与推广链接（保留已有配置兼容与编辑能力），并移除 README 中的 Moe API 赞助展示。
