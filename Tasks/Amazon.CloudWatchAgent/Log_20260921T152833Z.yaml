  Key: ReleaseNotes
  Value: |-
    New Features:
    * [Agent] Add Google Cloud support for GCE and GKE
    * [Agent] Add opt-in self-telemetry endpoint for agent metrics
    * [ContainerInsights] Add KEDA and Karpenter metrics scraping
    * [ContainerInsights] Add watch_replicaset toggle to disable the ReplicaSet informer

    Bug Fixes:
    * [Metrics/JMX] Format JVM metric units for Tomcat
    * [ContainerInsights] Fix EKS OTel Container Insights log delivery and stabilize cluster-scoped metric identity
    * [ContainerInsights] Only resolve cluster name when running in Kubernetes
    * [Logs] Prevent high log throughput from stalling log collection while recording file read progress
