  Key: ReleaseNotes
  Value: |-
    + Validate the correct memory address (vtable 0) for exec privs when detouring
         SteamAPI_RegisterCallback (...) rather than the base address of the class;
           prevented some games from getting achievements.
     + Add blocking wait for GPU vendor API initialization (ADL, NVAPI, etc.) to
         finish before letting hooked calls to CreateDXGIFactory{1|2} (...) or
           IDXGIFactory[2]::CreateSwapChain[ForHwnd] (...) execute.
