- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Settings and workspaces
    - Fixed an error that could prevent workspace files, including files in OneDrive folders, from being moved to the Recycle Bin.
    - Stopped Windows error messages from appearing repeatedly after cancelling a failed attempt to move a workspace file or folder to the Recycle Bin.
    Video capture
    - Fixed the recording timer including the recovery delay when a recording restarted automatically after a graphics driver reset.
    Installation and compatibility
    - Fixed the MSIX installer and Microsoft Store edition refusing to install on Windows 10 version 2004 and later.
    - Replaced unsupported Video Pack and image pack downloads on Windows 10 ARM computers with a message explaining that video conversion and editing, WebP images and JPEG XL images required Windows 11 on ARM.
