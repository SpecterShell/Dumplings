- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Screenshot capture
    - Made region captures more reliable when memory was low, especially on 4K screens.
    - Fixed screenshot file names when the {title} option is used.
    - Added a "Save capture context" checkbox in Screenshot settings to choose whether to save the captured window's title, application and web page address with a capture.
    - Fixed quick capture buttons being cut off after opening Settings on some Windows language configurations, including Korean.
    Settings and workspaces
    - Restored renaming a selected capture by clicking its filename in the workspace.
    - Fixed premature "Folder access error" messages at startup by waiting up to five minutes for mapped or network drives to reconnect.
    Image editor
    - Restored the image editor opening on the monitor where it was last closed, with a fallback to an available monitor when that screen was disconnected.
    - Fixed toolbar labels being cut off in languages with longer button text, including Korean, German and Turkish.
    Video capture
    - Added a clearer message when another application moved or deleted a recording before saving finished
    - Fixed an error when stopping a recording or exiting Screenpresso while a restart from the tray menu was still in progress.
    Video player
    - Updated the Video Pack to FFmpeg 8.0.1 for installation and on-demand downloads.
    - Fixed unnecessary Video Pack update prompts when FFmpeg 8.0 or newer was already installed.
    - Added a native Video Pack for Windows on ARM, enabling video conversion and editing on Windows 10 on ARM without emulation.
    - Fixed selected video sizes, such as 50% or Full HD, being ignored when saving or converting a video.
    Languages and interface
    - Improved Korean translations and corrected English and Vietnamese interface text.
    - Improved Korean text readability, including in Settings and the installer.
    - Fixed Korean, Chinese and Japanese window titles being cut off at the top.
    General improvements
    - Fixed errors opening files with accented characters in their paths when both the classic and Microsoft Store editions of the same version were installed.
    - Stopped unnecessary low-memory error reports
