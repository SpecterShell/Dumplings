  Key: ReleaseNotes
  Value: |-
    Screenshot capture
    - Fixed long pauses at startup and before each screenshot in the Microsoft Store edition on some PCs with AMD Radeon graphics.
    Settings and workspaces
    - Fixed an error that prevented the workspace from reopening after its window had been saved at a narrow width.
    Video capture
    - Fixed an error that could cause the classic recorder to fail when the computer woke from sleep during a recording.
    - Fixed an “Access denied” error that stopped recordings as soon as they started in some workspaces, including Documents folders redirected to another drive.
    - Fixed an error when finishing a recording if antivirus software, Windows Search or a sync app briefly held the video file open.
    - Fixed an issue that sometimes left temporary .tmp.mp4 files beside saved recordings.
    Video Pack and other tools
    - Fixed manual Video Pack installation so the instructions point to the correct folder and Screenpresso finds FFmpeg even when Windows extracts it into a subfolder.
    - Updated the Video Pack message in all languages to identify FFmpeg as the only third-party tool it contains.
    - Updated the download window to show when the Video Pack, Image Pack or Android tools are being unpacked. The window now stays open for up to a minute during this step to prevent accidental cancellation.
    Screenpresso updates
    - Fixed the progress bar freezing and repeatedly dropping back to zero while downloading a Screenpresso update.
