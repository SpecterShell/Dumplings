  Key: ReleaseNotes
  Value: |-
    Screenpresso 2.3.8.0
    Video recording
    - Replaced the old AVI recording format with MP4.
    - Added separate volume controls for the microphone and computer sound.
    - Simplified video quality choices and added an Ultra high option for sharper recordings and larger files.
    - Added a Stop waiting button for recordings that took unusually long to save.
    - Refreshed the recording toolbar.
    - Changed the default webcam view to a circle in the bottom-right corner.
    - Moved subtitle generation to the video player, so subtitles could be added after recording.
    - Added an alternative recording method for computers where the usual method could not start.
    - Made microphone and webcam selection more reliable.
    - Reduced recording file sizes.
    - Made recordings quicker to start.
    - Made recording across multiple screens smoother.
    - Adjusted recording smoothness to suit the computer's available performance.
    - Made quiet voices easier to hear.
    - Reduced the time needed to finish saving demanding recordings.
    - Improved recovery of interrupted recordings so the picture stayed in sync with sound.
    - Fixed sound falling behind the picture during demanding recordings, such as large screen areas at high quality.
    - Fixed distorted recording audio.
    - Fixed recordings failing to start on Windows 10 and older Windows 11 versions.
    - Fixed recording startup problems when a microphone was unavailable.
    - Fixed recordings getting stuck when a watermark was enabled.
    - Fixed recording problems with capture areas near screen edges.
    - Kept recordings running when a sound device or screen was disconnected.
    - Fixed problems with recordings that used the graphics card.
    - Fixed the text cursor being hard to see in recordings on screens with enlarged text and icons.
    - Fixed recordings failing to start with an Access denied message when the workspace was stored in a folder marked as hidden or as a system folder.

    Video editing
    - Added subtitle and written transcript generation from the video player's Subtitles menu, with a choice of language and progress updates.
    - Added an editor to change subtitle text and timing while watching the video.
    - Added an option to show or hide subtitles during playback.
    - Saved generated and edited subtitles inside MP4 videos, while keeping a separate subtitle file for further editing.
    - Made subtitle windows resizable and easier to read on screens with enlarged text.
    - Added French translations for subtitle generation and editing.
    - Made trimming easier with draggable handles and labels showing how much would be removed.
    - Renamed Convert to Apply in the video player.
    - Added a Saved confirmation when saving a video frame as an image.
    - Made the video player window appear immediately while the video loaded.
    - Removed the extra video-pack download previously needed to play videos.
    - Closed the subtitle generation window automatically after saving the subtitles and transcript.
    - Clarified how to resume subtitle generation after an interruption.
    - Updated the built-in video player.
    - Removed unused files from previous video player versions to save disk space after updates.
    - Fixed the subtitle editor selecting the first subtitle instead of the one at the paused video position.
    - Fixed subtitle generation getting stuck on upload preparation when the usage limit had been reached.
    - Kept recordings available to save even when the preview could not open.
    - Fixed a problem that could delete the original video when closing the player without making changes.
    - Fixed the video player failing to open when running Screenpresso without installing it.
    - Fixed the Subtitles button being too narrow on screens with enlarged text and icons.
    - Fixed empty, unplayable videos when resizing with the Exact option, which added black bars to fit the chosen size.
    - Fixed empty animated GIFs when exporting with a different image size.
    - Fixed exported videos losing their chosen size when changing playback speed with the Exact resize option.
    - Fixed failed video exports being reported as successful, with an error message and the original video kept in the workspace.
    - Replaced misleading reinstall instructions with a clearer message when the standalone video player could not run on an ARM-based computer.

    Image editing
    - Added tools to select several items, align them, and space them evenly.
    - Added Renumber to quickly reorder numbered annotations.
    - Updated Copy and Exit to copy both the image and its file location.
    - Made blurring and drawing faster.
    - Fixed an error when pasting images from the clipboard.
    - Fixed selection handles disappearing or appearing when they should not.
    - Fixed Page Down opening the image properties panel instead of simply moving to the next image.

    Workspace
    - Added date filters to quickly find recent or older captures.
    - Removed automatic cleanup and file-count limits, so captures stayed in the workspace until deleted.
    - Moved sorting and workspace preferences into the workspace menu.
    - Made the quick view window easier to resize.
    - Made the workspaces panel quicker to open and close.
    - Made browsing captures smoother.
    - Made filenames easier to read.
    - Fixed missing capture previews.
    - Fixed filenames wrapping onto extra lines in the workspace on screens with enlarged text and icons.

    Settings and screenshots
    - Added an option in Advanced settings to view and change the position and size of the last screenshot area.
    - Added an option to reset settings while keeping the license.
    - Added a connection check in General settings to help resolve Internet access problems.
    - Reorganized the general, screenshot, and video settings.
    - Redesigned the capture countdown so the mouse remained usable while it ran.
    - Made the first region screenshot quicker after startup, waking the computer, or a long idle period.
    - Made region screenshots and the color picker respond faster to keyboard shortcuts.
    - Fixed scrolling captures failing on some computers.
    - Fixed capture highlights near screen edges.
    - Restored missing scrolling capture buttons.
    - Fixed overlapping buttons and cramped text in the connection check window on screens with enlarged text.
    - Fixed advice about inaccessible folders being cut off on screens with enlarged text.
    - Restored keyboard control to the previous app after cancelling a screenshot or the color picker.

    Sharing and general improvements
    - Added a Send a bug report button in Settings.
    - Added an option to send diagnostic information to help troubleshoot problems, turned off by default.
    - Grouped sharing history by day, with easy access to copy, open, or delete shared links.
    - Refreshed buttons and sharing icons for a more consistent appearance.
    - Made warnings about conflicts with Logi Options+ clearer.
    - Updated the components used to create documents from captures.
    - Fixed sending bug reports when running Screenpresso without installing it.
    - Fixed a startup crash on some older Windows versions.
    - Fixed buttons for copying, opening, and deleting shared links being too small on screens with enlarged text and icons.
    - Fixed missing prices and currency symbols in the Upgrade to PRO window on some computers.

    Installation
    - Refreshed the installer with a cleaner layout and easier-to-read text.
    - Simplified the license page so clicking Install accepted the terms and started installation.
    - Fixed startup failures in the Windows app package for ARM-based computers.
