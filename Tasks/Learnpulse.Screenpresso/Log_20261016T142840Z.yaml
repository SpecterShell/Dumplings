    - Video format:
      - Refresh the suggested video dimensions in the video toolbar as well as in the format video dialog
      - Renew the file format icons in the format video dialog
    - Document generator:
      - renew the file format icons
    - Image OCR:
      - Fixed recognition of images exceeding Windows OCR's maximum dimensions.
