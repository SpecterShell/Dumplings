    July 17, 2026
    2.3.0.0
    Important notice
    Screnpresso is now packaged into a msix install. It cannot be run in portable mode anymore.
    Previous versions cannot automatically update to the new versions, so you must manually uninstall your current Screenpresso then download and install the new one. Live update will then be automatic thanks to the Microsoft msix engine.
    Advantages of the new installer mechanism:
    - Consistent: no more live downloads when required. Screenpresso is fully downloaded and installed in one step.
    - Secure: it installs to the Program Files folder without requiring elevated priviledges because it is done by Microsoft and also because the software is then run inside a sandbox (container) that cannot modify your computer without your explicit consent.
    - Fast: it deploys quickly and, when updating, downloads and installs only changes instead of the whole software.
    - Transparent: live updates are done automatically and in background by Microsoft so you always have the latest version of Screenpresso without having to do anything.
    Constraints of the new installer mechanism:
    - Screenpresso cannot change the system's settings anymore for you so it will ask you do the changes when needed.
    - To use a beta release or a specific version of Screenpresso you have to uninstall then install another package provided on our official web site.
    - Since Chocolatey does not support msix packages yet, we have decommissioned it. For the moment you should prefer WinGet instead.
    New features
    - Whole new installation engine based on Microsoft MSIX technology
    - The file activation.lic must now be stored in the folder C:\ProgramData\Screenpresso and not next to Screenpresso.exe anymore
    - Screenpresso is now based on the latest Microsoft .NET 10 framework and new libraries. This is a major internal change
    - Added native support for ARM64 processors (no emulation)
    - Added support for Microsoft OneDrive Business edition
    - Removed support for Microsoft OneNote
    - New design for the settings window

    June 12, 2026
    2.2.13
    Important information for the futur releases
    This is one of the latest automatic live update based on the current mechanism. Since the next official release will be only distributed via a Microsoft MSIX installer, you will soon have to manually uninstall your Screenpresso then install the new one to upgrade your version.
    Improvements
    - Improved ScreenpressoCloud uploads performances.
    - Improved HDR screens support.
    Bug fixes
    - Fixed an issue for Linear sharing.
    - Fixed the "Close" tooltip for the close button at the upper-right of all windows that was sometimes not hidden when it should.

