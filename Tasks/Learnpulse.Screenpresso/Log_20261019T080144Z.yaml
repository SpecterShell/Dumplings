  Key: ReleaseNotes
  Value: |-
    Screenpresso 2.3.9.0
    Video editing
    - Fixed subtitle generation being incorrectly blocked by a recording limit.
    - Replaced the bug report window with a clearer message when a video was empty or damaged, with an option to restore the original recording when available.
    - Fixed failed trimming or sound removal replacing an MP4 video with an empty file; the original video was kept and an error was shown.
    - Fixed conversions that produced no video replacing the previous video with an empty file; the previous video was kept and an error was shown.
    Workspace
    - Fixed the image properties window opening behind an always-on-top workspace when using F3 or the Properties menu item.
    - Added a crossed-out picture to distinguish unreadable files from thumbnails that were still loading.
    - Added MP4 video thumbnails using Windows' built-in video support, without requiring the video pack.
    - Fixed videos being marked as unreadable when the computer lacked the components needed to preview them; an empty thumbnail was shown instead.
    Settings and languages
    - Added Vietnamese and Korean translations and language choices in Settings and the installer.
    - Added an Install diagnostics button in General settings to view and copy installation, file location, license and Windows startup details for troubleshooting.
    Installation and general improvements
    - Restored the activation-key menu item in the system tray for Microsoft Store installations.
    - Enabled activation-key entry and management in the licensing window for Microsoft Store installations.
    - Fixed dialogs opening behind always-on-top windows in the MSIX and ARM64 versions, including the window for creating a workspace.
