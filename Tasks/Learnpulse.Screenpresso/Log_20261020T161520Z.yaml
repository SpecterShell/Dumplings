  Key: ReleaseNotes
  Value: |-
    Screenshot capture
    - Fixed screenshots freezing on some Windows 10 computers, leaving an orange border around the screen and preventing further captures.
    Video capture
    - Added a clearer explanation when missing or damaged Windows audio components prevented sound recording, with guidance for recording without sound.
    Text recognition and translation
    - Fixed the default translation language for text extracted from screenshots when using Traditional Chinese, Swedish, Czech or Brazilian Portuguese.
    - Fixed the language list in Google Translate settings when using Swedish or Czech.
    Settings and workspaces
    - Shared settings across installed, portable and Microsoft Store copies of Screenpresso.
    - Fixed settings being lost after restarting when the usual settings location was temporarily unavailable.
    - Fixed existing settings being ignored when they were read-only or temporarily in use by another program.
    - Fixed Screenpresso failing to start when settings could not be saved.
    - Preserved existing preferences when the settings storage location changed.
    - Fixed imported or restored settings being discarded after a temporary problem saving settings.
    - Preserved shared workspaces and capture-folder preferences when using a portable copy.
    - Fixed settings being stored in the wrong location when an organization required them to stay on the current computer.
    - Grouped settings import, export and reset controls on the Advanced tab.
    - Removed the initial settings import prompt for Microsoft Store and other packaged installations.
    Languages
    - Translated more messages across capture, editing, sharing, settings and support.
    - Corrected Traditional Chinese and Swedish messages that appeared in the wrong language.
    - Improved Korean and English wording in Settings.
    - Translated the File copy button in Settings and widened it to fit its caption.
    Support and diagnostics
    - Added a Support tab in Settings that grouped bug reporting, diagnostic tools and the diagnostic-data preference.
    - Expanded Install diagnostics with clearer information about where settings and activation keys were found.
    - Added organization-managed settings to the Install diagnostics report.
    - Added version details for the video and Android capture components to Install diagnostics.
    - Made the Install diagnostics window resizable and its report easier to read.
    Installation and activation
    - Improved detection of activation keys and default settings supplied by an organization across installation types, including 32-bit and Microsoft Store installations.
    - Fixed uninstallation failing to remove installation and settings folders whose names contained spaces.
