  Value: |-
    Vetta 0.5.65
    发布日期：2026-10-23
    修复
    - 修复手动添加或安装 MCP 后，Agent 一直看不到新工具、必须重启应用才生效的问题：新增的 MCP 服务首次启动失败（例如首次通过 npx 下载依赖超时）后，此前会被永久放弃；现在会在约 30 秒后的下一条消息自动重试，修改配置文件则立即重试。
    - 修复聊天与 Markdown 预览中网页链接的图标与文字没有垂直对齐的问题：取不到网站图标时（内网页面、站点未发布 favicon、图标加载失败）退回的通用地球图标会明显高于链接文字，现在两种图标状态都与文字垂直居中。
