  Value: |-
    Vetta 0.5.60
    新增
    - 会话新增目标模式：在已有会话里填写一个明确目标后，Vetta 会在每次回答结束时自行检查并继续下一步，直到目标完成、受阻或暂停；运行时输入栏会显示目标胶囊，也可以从目标面板暂停、恢复或清除。目标状态会随会话保存，但应用重启后不会擅自继续执行，需要你手动恢复。openvetta/open-vetta#62
    - 通用设置新增极简的 Agent 通知与提示音：通用设置提供清晰的「系统通知」与「提示音」独立开关；提示音开启后统一使用清脆柔和的官方内置音效，全覆盖任务完成、失败与等待审批事件，并支持设置播放时机（默认始终播放，亦可选离开会话或仅后台）与临时试听；系统通知与提示音相互解耦，中间工具失败、重试和主动中断不会误响。Desktop 配置同步加入版本迁移，未来版本字段在降级读写时仍会保留。openvetta/open-vetta#47
    - Markdown 支持 Mermaid 图表、更多 TeX 公式写法与公式复制；图片支持放大、复制、另存为、加载重试及相对路径。图表按需生成，过大或出错时仍可查看源码。
    - 消息支持按需使用的问答批注：选中文字后右键「问问 AI」，在小面板里单独讨论。问答自动保存，可继续追问、停止回答和搜索回看，不增加普通会话，也不影响主对话上下文。批注参考截至原消息的文字记录，不读取图片内容或执行工具。
    - 聊天与 Markdown 文件预览支持数学公式、SVG 和 HTML 页面：公式直接排版，SVG 显示为图形，HTML 提供静态预览和「运行 JavaScript」，可切换源码、复制原文或随时停止。公式在后台线程按需计算并缓存，流式更新限流，离屏停止重渲染；HTML 生成中不执行脚本。预览不加载外部资源、不访问 Vetta 数据，脚本在离屏、切换源码或运行 30 秒后停止，重新运行会重置页面状态；超大内容保留源码。浏览器沙箱不提供 CPU 硬隔离，同步死循环仍可能影响界面响应，因此脚本需手动运行。
    - Git 提交图新增右键操作：支持复制提交 SHA、从提交创建新分支、检出为分离 HEAD，以及带影响说明和确认的 Soft/Mixed/Hard Reset；创建分支不会自动切换，Reset 不会推送远端。
    - 手机上随时看电脑正在做的事：新的 Vetta iPhone 客户端（iOS 26 起的原生 App，apps/mobile/client-apple）可以和这台电脑配对，之后在手机上看到「对话」和所有已打开项目里的会话，包括你在电脑上发起、正在跑的任务：回答一字一字地同步过来，工具调用显示成卡片，电脑弹出的提问可以直接在手机上作答，也可以继续追问、中止或者新建一个任务。电脑离线时手机仍能翻看最近 50 个会话的内容，只是不能发消息。手机与电脑之间全程端到端加密：同一 Wi-Fi 下直连，出门后经中继转发，中继只看得到密文；空闲时连接会休眠，不产生任何费用。
      配对在 设置 → 远程连接 里完成：打开页面就会自动生成二维码，用手机上的 Vetta 扫描即可。二维码只对第一部扫描它的手机有效，10 分钟后自动作废；每部手机单独配对，可以随时单独解除，解除后它本地缓存的会话也一并清空。扫码不方便时，手机端可以手动输入电脑的局域网地址，两端会显示同一个 6 位验证码，在电脑上核对后放行。任何手机接入都会弹一条系统通知，即便二维码被人偷拍也能立刻发现。
      几处需要知道的代价：没有配对手机时这套功能完全不占资源，配对后电脑会在局域网开一个端口供手机直连，macOS 首次开启时会询问是否允许传入连接，请选择允许；「允许在外网访问」默认开启，关掉后只能在同一 Wi-Fi 下使用；本版本先做会话本身，SSH 终端、手机确认策略和面容确认暂未提供，iPhone 的提醒只在 App 能运行的时间里生效（见下文）。iPhone 和 Android 都会优先在同一 Wi-Fi 下直连。
    - Android 新增「工作」标签页，看到电脑上的全部会话：底部多了「工作」标签，列出配对电脑上「对话」和各项目里的会话，包括电脑上发起、正在跑的任务，与 iPhone 一致：置顶的排最前，其次是等你回答的，再按时间排序；顶部是彩色的状态筛选（所有、待你决策、处理中、已完成，待你决策显示数量），以及「类型」「项目」下拉，选了筛选后最前面出现 × 一键清除；每行左边是状态头像，处理中会转、待你决策会跳。长按一行可以置顶或删除，删除前会确认，电脑上的会话也会一起删除；下拉刷新；「工作」标签上的角标是等你回答的会话数。没配对时显示「还没有连接电脑」和扫码按钮，电脑离线或重连时标题旁出现电脑图标，点开能看连接状态并手动重连。英文界面的相对时间改为正确的单复数（如 “1 day ago”）。
    - Android 新增电脑设置页：「工作」页右上角的齿轮打开，与 iPhone 的设置一致：第一组是这台电脑的名字、连接方式（局域网直连或云端中继）、延迟和负荷（有几个任务在处理），以及「重新扫码」，没配对时只有「扫码连接电脑」；下面可以开关「实时看到电脑思考」和「任务做完震动提醒」（开启时电脑完成一轮回复手机会短震一下）；最后是「解除配对」，确认后删除这台电脑的连接凭据和手机上缓存的会话。配对凭据改为用 Android Keystore 中的密钥加密后保存。
    - Android 在同一 Wi-Fi 下直连电脑，也可以手动输入地址配对：扫码配对和之后每次连接都先试电脑的局域网地址（每个地址约 1.5 秒），连不上再走云端中继；走中继期间 App 在前台时每 20 秒再试一次局域网，一旦连通就悄悄切回直连，正在看的会话不会中断，回到前台时也会立即再试。扫码不方便时，「工作」页和电脑设置页的扫码按钮下方有「手动输入地址」，填入电脑显示的 IP 和端口（如 192.168.1.20:43117）后，手机和电脑会显示同一个 6 位验证码，在电脑上核对并点「允许」即完成配对，可随时取消。配对失败时会说明原因：电脑拒绝了配对、电脑不认识这部手机需要重新扫码，或是连不上电脑。手动配对只能在同一局域网内进行；访客网络通常会隔离设备，此时请改用扫码。
    - Android 可以按住说话：点输入框右侧的麦克风按钮，输入框下方滑出「按住说话」按钮，按住开始听写，屏幕底部亮起蓝色光晕并实时显示识别出的文字，松手后文字填进输入框、不会直接发出，可以改完再发；按住时往上滑再松手则取消（光晕变灰）。再点同一位置的键盘按钮或直接点输入框，就收起「按住说话」回到打字。使用系统的语音识别，跟随手机语言，能离线识别时优先离线；第一次使用会请求麦克风权限，未允许或设备没有语音识别时会在输入栏上方提示。
    - Android 上可以给电脑发图片和文件：会话页和新会话页的输入栏左边多了「+」附件按钮，点开可以选「相册」「拍照」或「文件」。相册用系统的照片选择器，不需要授予读取整个相册的权限，因此没有 iPhone 那排「最近的照片」；拍照第一次会请求相机权限。照片会自动压缩到单个附件的上限，照片以外的文件单个不能超过 700 KB，一次最多 6 个附件，超出时会在输入栏上方提示。附件显示在输入栏上方，可以逐个移除；发出后显示在你的消息上方，电脑上的 Agent 能直接读取。
    - Android 上回答电脑的提问改为和电脑一样的面板：电脑用 AskUserQuestion 等你回答时，会话页底部的输入框换成提问面板：有多个问题时顶部用标签切换，答完一题点「下一步」，全部答完才能「提交」；多选题标出「可多选」；每题最后都有「其它（自定义输入）」可以直接写答案；也可以「取消」。回答后输入框自动回来。
    - Android 与电脑的对话统一到「工作」：设备详情页的「开始对话」和「新建对话」里选择电脑，现在都打开新的「新会话」页，不再在手机上另建一份本地会话副本，也不再在首页弹出旧的「Desktop 正在等待你的选择」横幅，电脑的提问改在对应的会话页里处理。旧版本留在「会话」列表里的电脑对话：已知电脑端会话的会直接打开电脑上的这个会话；从未成功发到电脑的只保留记录、不能再发送。
    - Android 可以在手机上新建电脑会话：「工作」页右上角和会话页右上角都有「新会话」按钮（从会话页进入时默认在该会话所在项目开始，返回键回到原会话）。新会话页中间是 Vetta 头像和「让我们开始吧」，下方可以先选模型和思考强度、选在「对话」还是某个项目里开始，不选时用电脑的默认模型；页面底部带一层渐变。发出后立刻进入聊天页显示这条消息，电脑在后台创建会话；如果消息没能发出，会回到新会话页，刚才的文字和选择都还在。电脑离线时不能开始新会话。
    - Android 可以打开电脑上的会话继续聊：会话页和 iPhone 一致：两次提问之间 Agent 做的事合成一段，连续的思考和工具调用收成一行「完成了 N 步操作」，点开看每一步；进行中显示当前步骤、重试和压缩上下文的进度；同样的错误合并成一条并标注次数；一段结束后可一键复制最后的回答。标题下显示当前模型和思考强度，点一下从底部弹出面板切换，电脑正在回复时不能切换。右上角「更多」里可以刷新、重命名、置顶，改动和电脑侧边栏同步。输入框输入的文字按会话保留，发送失败会放回输入框。
    - iPhone 客户端支持中英文：界面语言跟随手机的系统语言，设为中文时显示中文，其他语言一律显示英文；相机与本地网络的授权提示也会随之切换。
    - iPhone 上可以发图片、文件，按住说话，并切换模型和思考强度：聊天页和新会话页的输入栏改成 Telegram 式：左边是回形针附件按钮，右边是一行高的输入框，随文字变高，回车换行，有文字后框内才出现发送按钮。点回形针弹出附件面板：最上面一排是「相册」「拍照」，后面紧跟着相册里最近的照片，点最近的照片直接放进消息，点「相册」打开系统的照片选择器，点「拍照」打开相机；下面的「文件」打开系统的文件选择器。第一次打开面板时会请求相册权限，不允许也不影响用「相册」挑照片；发出后附件显示在你的消息上方，电脑上的 Agent 能直接读取。照片会自动压缩；一次最多 6 个附件，照片以外的文件单个不能超过 700 KB，这是手机与电脑之间单条加密消息的容量。输入框为空时按住即可说话：底部亮起蓝色光晕，实时显示识别出的文字，松手后文字填进输入框、不会直接发出，按住时往上滑再松手则取消；支持的语言会在手机本地识别，第一次使用时会请求麦克风和语音识别权限。聊天页顶部的标题下显示当前模型和思考强度，点一下从底部弹出选择面板：上面一排选思考强度，下面按厂商分组列出模型，选项和电脑上一致，切换对这个会话之后的回复都生效；电脑正在回复时暂时不能切换。
    - iPhone 新会话页可以先选模型再开始：新会话页中间显示 Vetta 的头像和「让我们开始吧」，下方并排两个按钮：选模型、选在「对话」还是某个项目里开始，不用进入会话后再切模型。选模型弹出的是和聊天页同一个底部面板，可以连思考强度一起选好；模型列表和电脑上一致，不选时用电脑的默认模型和思考强度。发出后立刻进入聊天页并显示这条消息，不再停在新会话页等一两秒；如果电脑切换模型失败，会弹出提示，消息仍按默认模型发出；如果消息没能发出，会回到新会话页，刚才输入的文字、附件和选择都还在。
    - iPhone 上可以重命名、置顶和删除会话，置顶与电脑同步：聊天页右上角换成「新会话」和「更多」两个按钮，标题靠左贴着左上角的按钮，长标题和模型名不再被挤成几个字。「新会话」直接在当前会话所在的项目里开一个新会话；「更多」里是刷新、重命名和置顶。会话列表里长按一行，弹出菜单可以置顶/取消置顶或删除，删除前会确认，并且电脑上的这个会话也会一起删掉、无法恢复；会话正在回复时不能删除。置顶的会话排在列表最前面（最近置顶的在上），标题左边有一枚黄色图钉，在任何筛选条件下只要列得出来就排在最前。置顶和电脑侧边栏是同一份：手机上置顶，电脑上也置顶，反过来也一样；电脑上改名、删除会话，手机列表也会跟着更新。
    - iPhone 新增任务看板：会话列表抽屉里的「任务看板」现在可以打开了，看板从底部弹出，下滑或点右上角 ✕ 关闭，打开会话或新建会话时自动收起。看板按项目把会话排成两列瀑布流卡片：有会话在等你确认的项目排最前，其次是有会话在跑的，「对话」也单独一张卡、在同档里排第一，最后是最近完成的 6 个项目。每张卡片先列出所有待确认和运行中的会话（超过 5 条时显示「还有 N 条」，点击进入项目页），不足 3 条时用最近完成的会话补齐到 3 条。每条会话单独衬一块底色，点会话直接打开，点项目名进入项目页，长按会话可以置顶或删除。更早的项目不在看板上，底部的「全部会话」收起看板并打开完整的会话列表。
    - iPhone 新会话页改为渐变欢迎页，下方是任务看板的缩略：新会话页顶部是紫到蓝的渐变，往下渐渐融进背景（浅色模式下颜色更淡），打开时柔和地淡入；冷启动时会等 App 加载完、画面流畅后再淡入，不会卡一下后突然闪出来；左上角是两行欢迎语「你好 / 今天想做点什么？」，取代原来居中的头像和「让我们开始吧」，选择「对话 / 项目」的按钮紧跟在欢迎语下面。输入框上方是看板的缩略：机器人头像和「任务看板」，左边一张高卡片是最需要你处理的项目，列出它最多 3 条会话，点哪条打开哪条；右边一张小卡片是第二个项目，显示最紧急那条会话的标题，点卡片直接打开；两张卡片的角上都标着状态和数量；右下的胶囊汇总有几个会话在等你、几个在跑，点一下打开完整看板。还没连上电脑时，缩略按上次同步的状态显示，颜色略淡；开始打字时缩略会让开，把地方留给键盘；没有任何会话时不显示缩略，头像出现在欢迎语上方。
    - 设置 → 环境可以检测 Git 并引导安装：新增「开发工具」小节，显示本机 Git 的版本与来源；没装时按平台给出安装方式：macOS 点「安装」调起系统的「命令行开发者工具」安装窗口，Windows 可以一键「为 Vetta 安装」（约 40MB，从国内镜像下载并校验，只在 Vetta 里生效，不改系统环境；想在终端里也用 Git 请点链接下载官方安装包），Linux 给出对应发行版的安装命令供复制。装好后点「重新检测」即可。已装的系统 Git 始终优先，Vetta 不会用自己的版本盖过你的配置和凭据。Git 面板在没装 Git 时不再提示「初始化仓库」，而是给出同样的安装引导，Git 配置页顶部也会提示；macOS 缺命令行工具时，打开项目不再反复弹出系统安装框。关联 openvetta/open-vetta#49。
    - 能力页可以按类型和来源筛选：搜索框旁多了一个筛选按钮，点开后可以只看技能、MCP、插件、套装或场景（可多选），每项后面标着当前的数量；在「公开」里还能只看市场或 Vetta 内置的能力。有筛选生效时按钮上显示已选数量，以免误以为能力丢了；筛选不会被记住，下次打开能力页仍显示全部。openvetta/open-vetta#44
    - 手机不在电脑旁也能配对：连接码加密码：电脑「设置 → 远程连接」生成二维码时，旁边同时给出 8 位连接码和 6 位密码，在 iPhone 或 Android 的「连接电脑」里选「用连接码连接」输入即可配对，适合手机和电脑不在一处、或不方便扫码时使用；扫码配对照旧可用。连接码和二维码一样 10 分钟后失效、只对第一部连上的手机有效，配对信息用连接码和密码加密后才经过云端中继，中继自身无法读取。需要开启「允许在外网访问」，且中继已升级到本版本；否则电脑只显示二维码并说明原因。
    - 可以更换外网访问用的中继：「设置 → 远程连接」里「允许在外网访问」旁新增设置按钮，可填写自建中继的地址、测试能否连通以及是否支持连接码配对，也可一键恢复默认。更换时已连上的手机会先收到新地址并自动改用（需 Android 客户端为本版本），当前二维码随之刷新；不在线的手机要等下次在同一 Wi-Fi 下连上电脑后才会更新。
    - iPhone 发消息时可以引用电脑上的技能：点输入框左下角的按钮，选「技能」，就能从电脑的技能和场景里挑一个（支持搜索），它会显示在输入框上方，发送后和在桌面输入框里引用效果相同；只选技能、不打字也能发。列表按消息要发往的项目读取，包含该项目自己的技能，排序与桌面一致。一条消息可以引用多个技能，但场景只能用一个，再选会替换。代价：重新打开会话后，历史消息里不再显示当时用过的场景。
    - iPhone 上可以查看电脑上的文件：会话页右上角「更多」里新增「面板」分组，目前有「文件」一项，从底部弹出，只读浏览这个会话在电脑上的工作目录，可以逐层进入文件夹；半屏时仍能看到对话，下拉刷新，这一轮回复结束后自动刷新。回复里指向电脑文件的链接改为文档图标，点一下直接预览，不限于会话目录，例如写到桌面上的报告也能打开：Markdown 按对话样式排版，HTML 作为网页打开（脚本可以运行，但同目录的样式和图片暂不加载），代码和文本等宽显示，图片、PDF、Office 和 iWork 文档用系统预览，其他文件可以分享到别的应用。单个文件最多 10 MB，照片会先在电脑上缩小再传，所以大照片也能看；预览期间电脑上的文件被改写，页面顶部会提示点击重新加载。出于安全考虑，手机不能查看 SSH 密钥、云服务凭据、钥匙串和 Vetta 自己的配置等位置。SSH 远程项目的会话同样可以浏览，范围限于项目目录之内。需要电脑端也更新到本版本，否则菜单项置灰并提示更新。
    - iPhone 在你离开时提醒你：电脑等你确认、任务做完或出错都会发通知，灵动岛显示进行中的任务：配对后 App 会请求一次通知权限。App 不在前台时，会话一进入「待确认」就弹出通知，标题是会话名，正文带上电脑问的问题；一轮做完或出错也会通知。同一个会话只保留最新的一条，点通知直接打开这个会话；在电脑上答完或在手机上打开后，对应的「待确认」通知会自动收回。App 图标上的角标是等你确认的会话数。有任务在跑时，灵动岛和锁屏上会出现一个 Live Activity，显示领头的会话（有提问时优先）、它已经跑了多久、还有几个任务；全部做完后显示「全部完成」，10 分钟后自动消失，点它也会打开对应会话。电脑问的是一道单选题、选项不超过三个时（最常见的「继续吗？」就是这种），锁屏卡片和长按展开的灵动岛上会直接列出选项按钮，点一下就提交，出于安全考虑提交前要先解锁；点完后显示「已选某项，正在发送」，发送失败会恢复按钮。多选、一次问好几道题或选项更多时，显示「打开 Vetta 回答」，点开到 App 里作答。代价是这套提醒不经过 Apple 的推送服务，免费 Apple ID 签名也能用，但只在 iOS 允许 App 运行时生效：离开屏幕后大约半分钟内，以及系统安排后台刷新的时候（什么时候刷新、刷不刷新由 iOS 决定）。再往后电脑上发生的事，要等下次打开 App 才知道；Live Activity 超过 15 分钟没更新，会显示「打开 Vetta 查看最新进度」。通知和 Live Activity 都可以在系统设置里单独关闭。
    - iPhone 可以查看并操作电脑桌面：从首页抽屉、设置，或长按 App 图标选「远程控制」，全屏打开电脑屏幕，只有这一页可以横屏。整块屏幕像触控板一样用，手指不必点中画面上的按钮，画面外也能操作：单指移动光标，轻点点击，双指轻点右键，按住半秒后移动即拖动，双指缩放和移动画面；光标跟手移动、始终可见，形态和电脑上一致（箭头、I 型、手形）；放大后只有双指才移动画面，文字按实际尺寸重新渲染、不会发虚。暂时没有滚动手势，需要时拖动滚动条。页面上方实时显示画面走的线路（局域网直连或公网直连）、延迟、估算的画面延迟和帧率，卡顿时能看出是网络慢还是画面慢；画面改用手机和电脑都能硬件编解码的 H.264，拖动更跟手。点击、右键和开始拖动时有震动反馈；键盘上方一排补上 Esc、Tab、方向键和 ⌃ ⌥ ⌘ ⇧，点一下作用于下一个键、连点两下锁定；「粘贴」把 iPhone 剪贴板的文字打到电脑上，不会弹出粘贴授权；外接键盘的快捷键直接生效。看不到画面时，页面会说明原因：电脑没给这部手机开远程控制、电脑离线、没开外网访问、电脑版本太旧、当前网络无法直连，或 macOS 缺少屏幕录制权限；缺辅助功能权限时只能看、不能操作，也会标明。同时，iPhone 与电脑之间的会话、聊天和文件查看也会像 Android 一样，在直连建立后改走这条连接，外出时回复更快；直连不上时照常经中继。需要电脑端同样更新到本版本；画面经中继建立连接，所以要打开「允许在外网访问」。控制中心按钮、电脑剪贴板同步回手机、多显示器切换和画质档位暂未提供。
    - iPhone 会话页新增「滚动到底部」按钮：往上翻到离最新内容还有一屏半以上时，输入框上方会浮出一个向下箭头，点一下平滑回到最底部；回到附近后按钮自动消失。
    - 底部面板新增「脚本」：在项目会话的底部面板点「+」选「脚本」，就能看到项目里所有 package.json 的 scripts 和 Makefile 目标；monorepo 会递归找到每个子项目，每个子项目一张卡片、按面板宽度以瀑布流排成多列，脚本多的卡片先收起多余的项；不会扫描 node_modules 等依赖目录。点一下就在内置终端里运行，包管理器按 packageManager 字段和锁文件自动选择（bun、pnpm、yarn 或 npm）；再点同一个脚本会切回它已经开着的终端，不会重复启动 dev server，行尾按钮可以另开一个新终端。支持搜索，本地项目和远程项目都能用。命令会敲进你自己的 shell 并全程显示；重开会话时只恢复终端布局和上次输出，不会自动重新执行。
    改进
    - Android 侧边栏可以直接连接电脑：会话列表上方的菜单里新增「连接电脑」，没配对和已经配对时都在。已经连上一台电脑时，这一行右侧显示它的名字；点进去仍然是扫码配对，用来换一台或重新连接。设置里的「扫码连接电脑」和「重新扫码」还在。
    - 刷新远程连接的配对码时，页面保持原来的布局：点「刷新」后，二维码和连接码不再缩成一块转圈的灰底。它们停在原位，用同样大小的框显示正在准备的新码，页面不再上下跳动，刷新过程中也不会继续露出即将作废的二维码和连接码。
    - 侧边栏长会话标题悬浮后的横向滚动速度提升近一倍，更快看到被省略的后半段内容；默认省略与系统标题提示保持不变。openvetta/open-vetta#61
    - 从接口拉取本地服务商模型时默认不再全部勾选：本地服务商常一次返回上百个模型，过去默认全选，容易把用不到的模型一并加进来。现在拉取后默认不勾选，列表上方提供「全选」「取消全选」，全选只勾选尚未添加的模型。
    - 底部面板标签不再显示容易误解的绿灰状态点：终端最近有输出时变绿、空闲后变灰的圆点已移除；当前打开的标签仍由背景高亮表示，终端运行和关闭确认不受影响。关联 openvetta/open-vetta#59。
    - 团队会话的右上角操作与普通会话保持一致：现在可以直接导出当前团队对话、置顶窗口、打开终端或底部面板；底部面板及其中的终端按团队会话独立保存，不会误用上一个普通会话的目录或状态。后台任务和临时授权会聚合当前团队视图涉及的 Agent，撤销授权时仍准确作用于原 Agent。关联 openvetta/open-vetta#50。
    - 「构建 Apple App」改为从能力市场安装，不再随 Vetta 内置：iOS 模拟器面板和 SwiftUI 开发指南只对在 macOS 上做 iOS 开发的人有用，现在按需安装，不做 iOS 开发的用户不会再在插件列表里看到它。代价是升级后已在用的用户会发现它消失了，需要到 能力 → 市场 搜索「构建 Apple App」重新安装、启用并授予权限；原来的面板设置和默认设备会保留。市场版本要求 Vetta 0.5.60 或更高。
    - 插件异常日志现在会指出具体插件和所处阶段：插件加载、重载、清理、目录监听及能力调用失败时，会带上插件版本、激活与能力会话标识；能力会话失效还会说明它何时、因何关闭，不再只显示笼统的 session is not active。日志仍会隐藏密钥、令牌等敏感内容。
    - Android 远程连接会在建立后自动切到 P2P：Cloudflare 中继或局域网现在只负责配对、发现和 WebRTC 引导；直连成功后，对话、状态、诊断、画面和输入都在手机与电脑之间直接传输，减少远程操作绕行中继带来的延迟。受限网络无法建立 P2P 时会自动退回局域网或中继，连接不会因此中断。
    - 会话中切换模型时，消息间的提示现在会同时显示切换前后的模型，回看历史也能看清模型变化。（openvetta/open-vetta#52）
    - 问答批注不再为用户消息和 AI 回答额外显示三点菜单；仍可选中文字后右键「问问 AI」，并从已保存批注的标记进入批注面板。
    - HTML 交互预览改在独立沙盒窗口运行，30 秒后自动关闭，同步死循环不会卡住聊天；静态预览仍显示在正文中。链接图标优先使用网站声明的图标，并限制请求并发、等待时间和缓存占用。
    - 团队对话可按成员查看和切换模型：输入栏只显示默认模型名称，存在独立配置时显示「按成员配置」。面板以会话默认模型为主入口，单独配置的成员显示在下方；同模型成员合并展示头像，通过统一的「按成员设置」入口再展开个人选择框。成员编辑页使用「跟随会话默认」开关：选择具体模型会关闭开关，打开开关则恢复跟随；推理档位改为可点击、拖动的分档滑轨，切换时滑块缓动位移，拖动时即时预览，松开后保存。模型搜索与选择在原面板内完成，返回时保留展开状态。成员设置与团队设置同步，适用于该团队的所有会话；默认模型只影响当前会话中跟随的成员。修改仅影响之后入队的任务，已排队和正在执行的任务保留原模型。模型不可用或保存失败时会明确提示。
    - 长回复生成时合并 Markdown 渲染更新，减少大段正文、表格与代码反复解析；生成结束立即显示完整内容。未写完的行内公式、复杂链接与多反引号代码会短暂等待闭合，减少原始标记闪动。特别大的代码改为完整纯文本展示并保留复制，高亮缓存也增加总大小限制，减少卡顿与内存占用。
    - 聊天和 Markdown 文件预览中的网页链接会显示网站图标：按需加载站点的标准 favicon，加载失败时保留通用图标；重复链接复用浏览器缓存，失败结果短期缓存，避免滚动历史时反复请求。未提供标准 favicon 的网站仍显示通用图标。
    - 缩短新对话和发送前的准备等待：同一次准备复用已校验的技能与提示词资源，减少重复目录扫描，并限制并发检查文件；技能和项目说明的修改仍在下一轮生效。
    - 文件面板打开文件时更跟手：拖拽图标预热不再插入、删除临时页面节点，也会合并重复转换，减少点击时的整页样式重算；文件预览在界面获得绘制机会后开始加载，不再固定等待 240 毫秒。
    - 精简 Git 提交右键菜单，使用简短操作名和 reset --soft/--mixed/--hard 参数，详细影响说明保留在确认弹窗中。
    - iPhone 首页筛选项目后新建会话默认继承该项目：在首页抽屉中按项目筛选会话时，「新会话」入口右侧以灰色注明目标项目名称；点击后直接在被筛选的项目下开启新会话，无需进入新会话页后再手动切换。未筛选项目或筛选普通对话时行为不变，默认在「对话」中开始。
    - Android 首页筛选项目后新建会话默认继承该项目：与 iPhone 一致，按项目筛选会话时，首页「新会话」入口右侧以灰色注明该项目，点击后直接在这个项目下开始新会话，不必再到新会话页切换。
    - iPhone 会话里你发的消息改成 iMessage 样式的气泡：蓝底白字，尾巴在底边靠右处向下勾出，跟系统「信息」一眼就能对上，浅色和深色模式都是这套配色。
    - iPhone 会话页右上角「更多」按钮换成四宫格图标：原来的「…」换成四个小方格，和它打开的面板、刷新等一组操作更对得上。
    - 文档站改成现在的手机配对、设置入口和远程项目：远程连接不再写成仅限 Windows 的开发预览。文档说明 iPhone 与 Android 如何配对、离开局域网时怎样走中继、两端都可以用连接码，以及桌面画面按每部手机单独开关。设置参考和平台兼容表改成当前页面；补充 SSH 远程项目和 Git 检测，并写明开源版不必登录。
    - 已配对手机用电脑图标表示能否操作桌面：去掉含义不清的开关。手机在线且打开了外网访问时，名称旁边只有一个电脑图标，点一下即可切换。右下角绿色对勾表示可以查看并操作电脑画面，红色叉号表示不可以，默认是绿色对勾。手机不在线或没开外网访问时这个图标不出现。Android 上打不开画面时的提示改为指向这个图标。
    - 远程连接页的手机和外网图标不再单独上色：「已配对的手机」和「允许在外网访问」的圆形图标改为和中继那一行一样的中性底色；「在线」不再用绿色，改成普通正文颜色，离线仍是次要文字颜色。
    - 「设置 → 远程连接」页重新设计：去掉卡片和边框，改为留白排版；二维码在左、连接码和密码在右，两侧等高；连接码按 4 位一组分格显示、照着输入更不容易看错（不再显示倒计时提示，过期前仍会自动换新）；已配对的手机改为两列；同一 Wi-Fi 下的手动地址默认收起、点开才显示；中继服务器改为直接显示当前地址并可一键「更改」，不再藏在齿轮图标后面。
    - 配对二维码更稀疏、更好扫：开启外网访问时，二维码只装连接码和密码，格子从 61×61 降到 29×29，改为圆润样式并在中间放上连接图标；手机扫码后经中继取回配对信息，之后与原来完全相同。关闭外网访问或中继暂不可用时仍显示原来的完整二维码。代价：扫这种二维码时手机需要能访问中继；旧版手机 App 识别不了，需同时升级 iPhone 与 Android 客户端。设计见 ADR-0138。
    - Agent 设置的图片处理改为常用数值：最大宽高、解码限制、单张体积、JPEG 质量和一次请求的图片总量改成下拉选择。每一项列出常用值，最后一项是「自定义」，选中后才出现输入框；已经保存、不在常用值里的数字会直接显示为自定义。超出允许范围的自定义值不会写入。上下文压缩、图片处理和文字识别下方不再显示「生效时间」。
    - 团队会话更快进入首轮回复：创建后优先准备队长，其他成员在队长完成首个响应块后再初始化；等待提示会在模型请求实际开始时切换。全局 MCP 连接在应用启动后预热，并跨普通与团队会话复用，避免每个团队目录重复启动。项目 MCP、引用 ${PROJECT_ROOT} 的服务和显式工作区服务仍按工作区隔离；刚启动应用且预热尚未完成时，首次使用仍可能等待连接就绪。
    - Android 客户端重新支持扫码连接电脑：Kotlin 客户端已升级到远程协议 v2，扫码后会校验电脑身份并对会话内容端到端加密；聊天控制和远程桌面信令都使用新版中继地址。旧的 v1 配对不能沿用，需要重新扫描二维码。
    - Android 客户端支持中英文：界面、错误提示和相对时间都跟随手机的系统语言，设为简体中文时显示中文，其他语言一律显示英文。未命名的会话显示为「新对话」/「New chat」，旧版本存下的「新对话」标题也会随语言切换；新建的桌面会话改用电脑名作标题，不再写成「与某某的对话」。
    - Android 记住配对的电脑，重开 App 自动连上：以前关掉 App 再打开就要重新扫码，现在配对信息保存在手机上，启动或回到前台时自动重连，断线后按 1、2、4 秒递增重试（最长 30 秒），回到前台立即重试；重连后会补收断线期间电脑上发生的事，不会重复也不会遗漏。电脑上的会话列表和打开过的聊天记录会缓存在手机上（最近 50 个会话），离线时也能看到。升级后第一次仍需重新扫码一次，因为旧版本没有保存配对。
    - Android 远程连接更稳定：电脑重新建立连接或启动屏幕共享时，手机会自动恢复连接，不再出现“已扫码但无法发消息或查看屏幕”的状态。
    - Android 去掉云端 AI 和账号登录，打开就是电脑上的会话：云端 AI 需要商业版账号，开源版里用不了，现在连同登录、订阅页，以及「首页」「会话」「发现」「我的」四个标签一起移除，App 打开直接进入配对电脑的会话列表，没配对时显示扫码按钮。原先设备详情页上的电脑画面移到了电脑设置页，主题切换（跟随系统/浅色/深色）和版本号也放在这里。代价是：旧版本存在手机上的云端对话不再能打开，「自动恢复上次会话」「页面动效」「删除前确认」这几个只作用于云端对话的开关一并取消。
    - Android 配色与 iPhone 一致：页面、卡片、分割线和文字颜色改用 iPhone 端的同一套浅色/深色色值，深色模式的背景从纯黑改为微带灰度的深色，两端并排看观感一致。
    - Android 桌面上的名称和图标改为 Vetta：以前安装后桌面上显示的是模板默认的「Android」和安卓机器人图标，现在显示「Vetta」和与 iPhone 相同的白鼬图标，支持各家启动器的圆形、圆角等自适应形状。
    - Android 改为和 iPhone 一样的抽屉式首页：打开 App 直接是新会话页，会话占满整屏；左上角 ☰、从屏幕左缘右滑或系统返回手势都能拉出首页，首页跟手滑出、背后的页面随之右移变暗，松手过半或快速一甩就展开，否则弹回；在首页向左滑即可收起。首页顶部是「新会话」入口，下面是全部会话：每行一行字，显示置顶、标题、所属项目和状态（处理中的图标会转、待你决策的会呼吸，整行微微泛黄），长按可置顶或删除；「任务」标题右侧的两个按钮分别按状态筛选和按项目筛选，筛选生效时按钮变为实心。左上角「Vetta」右侧是一枚较小的连接状态胶囊（已连接为黑底对勾，连接中转圈，离线变红并可点开重连，未配对时点开即去配对），底部右边是搜索和设置；搜索会同时匹配会话标题、内容预览和项目名，并在上方列出匹配的项目，点进去是该项目的会话页，可在项目内新建会话。选择项目改为可搜索的底部面板，列出会话数和最近活动时间。设置从首页右下角进入，改为分组卡片样式；扫码配对改为底部面板，配对进度、电脑上的验证码和失败原因都直接显示在面板里，还附带排查指引。代价：原「工作」页顶部的彩色状态分段和「类型」下拉改为上述两个筛选按钮；会话行不再显示内容预览和相对时间。
    - Android 新增任务看板：首页「新会话」下方多了「任务看板」，从底部弹出，把会话按项目分成卡片、排成两列瀑布流：有会话等你决策的项目排最前，其次是有任务在跑的，然后是「对话」，最后是最近完成的项目（最多 6 个，更早的去首页的全部会话里找）。每张卡片先列出等待和进行中的会话（最多 5 条，多出来的显示「还有 N 条」），不足 3 条时用最近完成的补齐；点会话直接打开，长按可置顶或删除，点项目名进入该项目的会话页，底部「全部会话」回到首页列表。电脑离线时显示上次同步的内容并注明。
    - Android 新会话页改为 iPhone 的样式：左上角两行大字问候，第二行带紫蓝渐变，背后是一层淡入的紫蓝色光晕（浅色模式下更淡）；模型和思考强度移到顶部标题下方，点开即可切换；「开始位置」改为玻璃质感的按钮，点开是可搜索的项目面板。页面下方新增任务看板摘要：左边是最需要关注的项目及其前几条会话，右边是第二个项目和等待/进行中的总数，点总数打开完整看板；弹出键盘时摘要自动让位。电脑未连上时，输入栏的位置换成连接状态胶囊，可以直接点开重连。
    - Android 新会话记住上次用的模型：发起会话或在聊天里切换模型后，下次新会话默认就用这个模型和思考强度，不用每次重选；每台电脑分别记，解除配对时一并清除。电脑后来不再提供这个模型时自动退回它的默认模型。
    - Android 聊天页只在你停在底部时跟随回复：以前回复每到一段都会把页面拽回最底部，往上翻看前面内容时也会被打断。现在停在底部时页面随回复平滑下移；一旦手动往上翻就停止跟随，下方出现「回到最新」按钮，点一下或自己滑回底部就恢复跟随；发出新消息时也会回到底部。
    - Android 上 Vetta 的回复改为匀速流出：电脑发来的回复是一阵一阵到达的，手机上原本会一块一块蹦出来。现在文字按均匀的节奏逐步显示，积压较多时自动加快，在半秒左右追上，不会落后太多；打开已完成的会话时内容直接完整显示。
    - Android 聊天页顶部与 iPhone 一致：左上角 ☰ 打开首页，旁边是会话标题和下方的「模型 · 思考强度」，点标题切换；会话内容滚到标题和输入栏下方时柔和地淡出，不再被硬生生切断。
    - Android 远程控制改为全屏页面：以前电脑画面只是设置页里一块 200dp 高的预览，现在首页和设置里都有「远程控制」入口，打开后电脑屏幕占满整个黑底页面，顶部显示电脑名称和连接方式（P2P、局域网或中继及延迟），轻点即点击、拖动即移动指针；画面按电脑屏幕的比例显示，点击位置与电脑上的位置一一对应，以前画面留黑边时点击会偏移；查看期间屏幕保持常亮。电脑离线时页面会直接说明，不显示过期画面。
    - Android 远程控制改为整屏触控板，可以右键、滚动、缩放和打字，还能横屏：整个页面都是触控板，单指滑动移动光标（滑得快走得远），轻点点击、双指轻点右键、按住半秒后拖动，不必点准画面上的小按钮；光标由手机按电脑当前的样子画出来，始终看得见（光标样子目前只有 macOS 提供，其他系统显示通用箭头）；双指捏合放大画面（最多 4 倍），放大后双指拖动平移画面，未放大时双指上下滑动即滚动电脑上的内容；底部的键盘按钮调出手机键盘，直接在电脑上打字，大写字母会自动按住 Shift；旋转按钮切换横屏，横屏时按钮移到两侧，画面占满整个高度。标点、中文和表情也能直接打出来，用拼音等输入法选好字后才发给电脑，不会把拼音字母打上去。代价：在 Linux 电脑上仍只能输入英文字母、数字、空格、Tab、回车和退格；配合旧版电脑端时标点和中文打不出来，字母和数字照常；横竖屏切换不再重建界面，连接和画面不会因此中断。
    - Android 远程控制显示线路、延迟和帧率：画面顶部显示当前是局域网直连、公网直连还是经中转，以及往返延迟、估算的画面延迟、帧率和分辨率，每秒刷新，画面卡顿时能分清是网络慢还是画面慢。
    - Android 远程控制连不上时显示连接细节：直连迟迟没有画面时，左下角列出最近几步连接过程（信令、应答、ICE 状态、数据通道），便于判断卡在哪一步；只显示技术名称，不含地址与密钥。
    - Android 输入框可以引用电脑上的技能：点输入框左侧的 + 选「技能」，按当前项目列出电脑上的技能和场景（可搜索），选中后以胶囊显示在输入框上方，发出的消息里同样显示成胶囊；只选技能不写文字也能发送，场景一条消息最多一个，与 iPhone 和电脑一致。
    - Android 会话里可以查看电脑上的文件：会话右上角「更多」新增「文件」，只读浏览这个会话的目录，文件按类型显示图标、大小和修改时间；点回复里指向电脑文件的链接会直接打开预览。能直接看的有：Markdown、文本和代码（大日志也能立即打开）、网页（与 iPhone 一样运行页面脚本，图表类报告能正常显示）、图片（双指缩放，GIF 会动，SVG 显示为图形）、PDF（逐页显示、可缩放）、Word / Excel / PowerPoint（docx、xlsx、pptx，保留标题、列表、表格、合并单元格、数字与日期格式、图片和幻灯片版式）、CSV / TSV 表格，以及音频和视频片段。每个文件都可以分享或「用其他应用打开」，旧版 doc / xls / ppt、加密 PDF 等手机上看不了的格式也能这样交给其他应用。Agent 这一轮结束后，文件列表会自动刷新，正在看的文件被改动时顶部会提示重新载入。
      几处代价：单个文件最大 10 MB，照片由电脑缩小后再发送，原图最大 32 MB；Office 文档在手机上重新排版，字体、分页和复杂版式与电脑上不完全一致，图表、SmartArt、批注和页眉页脚不显示，只算过公式的表格显示公式本身；Excel 每个工作表最多显示前 3000 行。需要电脑端也是本版本。
    - Android 按住说话起得更快，并有提示音和节奏震动：按住「按住说话」约 0.1 秒就开始听写（原来要 0.2 秒），开始时会响一声轻柔的提示音（静音或振动模式下不响），并按「轻触、重击、嗡鸣渐弱」的节奏震动，与 iPhone 一致；刚开始听写就松手会当作轻点，不会误触发听写。
    - Android 可以从其他 App 分享到 Vetta：在浏览器、相册、文件管理等 App 里点「分享」选择 Vetta，会打开新会话页，分享的文字填进输入框，图片和文件作为附件带上（图片照常压缩），确认后再发送，不会直接发到电脑上。已经打了一半的内容会保留，分享的文字接在后面另起一行；超出单条消息附件上限或太大的文件会被跳过并提示。
    - Android 平板和手机横屏时首页常驻左侧：窗口宽度达到 840dp 时，首页不再是抽屉，而是固定在左侧，右侧显示会话或新会话，当前打开的会话在列表里高亮；窗口变窄（如竖屏）时自动恢复成抽屉。高度不够时（手机横屏）新会话页不显示任务看板摘要，避免挤压。
    - Android 切到后台也能收到会话通知：设置里新增「后台保持连接」，打开后切到后台或锁屏时仍与电脑保持连接，会话停下来等你决策、一轮回复完成或出错时发一条通知（显示会话标题），点通知直接打开该会话；同一会话只保留最新一条，App 在前台时不打扰。代价：默认关闭，开启时需要授予通知权限；开启期间通知栏常驻一条静默的「已连接到某某电脑」提示（Android 要求后台连接必须可见），并会多耗一些电量；关掉开关或解除配对即停止。
    - Android 在通知里直接回答电脑的提问：开启「后台保持连接」后，电脑停下来问你时，通知会显示问题本身；只有一个问题时不用打开 App 就能答复：单选且选项不超过 3 个时，选项直接显示为按钮，点一下即可；选项不足 3 个、超过 3 个或是多选题时，还可以点「回复」直接输入答案。答复送达后通知自动消失，没送到（比如这个问题已在电脑上答过）会提示你点开 App 作答。一次问多个问题时仍需点开 App 在提问面板里作答。
    - Android 长按桌面图标直达常用功能：长按 Vetta 图标会弹出「新会话」「任务看板」「远程控制」三个快捷方式，也可以把它们拖到桌面单独放置，点一下就直接打开对应页面；还没配对电脑时点「远程控制」会先打开扫码配对。
    - Android 下拉快捷设置里可以添加「Vetta」开关：在快捷设置的编辑页把 Vetta 拖进来后，从任何界面下拉点一下就会打开新会话，锁屏时会先要求解锁。
    - Android 新增桌面小组件：在桌面长按空白处 →「小组件」里添加 Vetta，就能随时看到有几个会话在等你决策、几个正在进行，全部处理完时显示「都处理完了」；电脑离线时注明离线和最后在线的时间，点一下打开任务看板，没配对时点一下去扫码。代价：App 关闭且没开「后台保持连接」时数字不会实时更新，系统大约每半小时刷新一次。
    - Android 读屏（TalkBack）更好用：输入框会读出「指示 Vetta」，不再只是「编辑框」；底部面板顶部的拖动条会说明可以拖动调整或关闭；轻点只会眨眼的机器人头像不再被读屏停留。
    - iPhone「解除配对」说明写清楚了影响范围：确认框与说明文字改为「只会清除这部手机上缓存的会话，电脑上的会话不受影响」，以前的说法容易让人以为电脑上的会话也会被删掉。
    - Android 解除配对后，手机上的会话不会消失：无论在手机设置里解除，还是在电脑上解除这部手机，手机上已有的会话和聊天记录都原样保留，重启 App 也还在，可以随时翻看，只是不再更新；聊天页底部会注明「已与电脑解除配对」，新会话页说明原因并提供「重新扫码」和「查看之前的会话」。重新扫码连接同一台电脑后，这些会话接着同步，不会重复也不会丢；没发出的草稿也会保留。电脑上解除时，在线的手机会立刻知道并切换到这种只读状态；手机当时不在线的，下次发现电脑已不认得这次配对时，连接状态里会提示「电脑可能已解除配对，重新扫码即可恢复」，不会删除任何东西。代价：手机上不提供删除这些记录的操作；iPhone 端暂未改为这种方式，仍是解除即清除。
    - Android 自动把最近的会话同步到手机：连着电脑时，手机会在后台把最近 20 个会话的完整聊天内容存到本地，不用逐个点开；之后断网、电脑关机或解除配对，这些会话仍能完整查看。只有电脑上有变化的会话才会重新同步，正在进行的会话等这一轮结束后再同步；同步只读取电脑上保存的记录，不会把会话在电脑上重新打开。代价：会多用一些流量和手机存储空间。
    - Android 可以按需设置会话通知：设置 →「后台保持连接」下面新增「通知」页。「等我决策」「会话完成」「会话出错」三类通知可以分别开关；可以按项目关掉某个项目的通知；可以设置免打扰时段（如 22:00–08:00，可跨过午夜），这段时间里的通知照常送达，只是不响铃不振动，醒来不会错过。多个会话的通知会收进同一组，显示「N 个会话有新动态」，不再一条条刷满通知栏。默认全部开启、不设免打扰，和以前一样。
    - 远程控制按手机逐台开启：电脑「设置 → 远程连接」的已配对手机列表里，连上的手机那一行有「远程控制」开关，手机连上电脑时会自动建立屏幕与输入通道，可以查看并用鼠标键盘操作电脑，不需要再手动启动另一套连接；关掉则立即断开屏幕，手机只能看会话。开关默认开启，改动会马上告诉手机，Android 打开远程控制时会说明要去电脑上哪里打开。远程控制经云端中继建立连接，需同时开启「允许在外网访问」。
    - 远程连接打开即显示配对二维码：进入设置页后会自动准备二维码，不再需要先点「生成二维码」；页面说明也改为只保留配对步骤、安全提示和必要的连接选项。
    - iPhone 客户端没配对也能正常打开：以前没配对时一进 App 就是全屏扫码页，关不掉，手边没有电脑就只能卡在那里。现在「我的工作」只显示一张「还没有连接电脑」引导，说明去电脑上哪里找二维码，点「扫码连接」才打开扫码页，扫码页随时可以关掉；之后要换电脑或重新配对，在「设置」里扫码。
    - iPhone 客户端改为「工作 / 设置」两个标签页：「我的工作」只保留会话列表，顶部用「状态」「类型」两个筛选按钮代替原来的分段控件——状态分为所有、待你决策、处理中、已完成，类型选「项目」后还能再选具体项目。等你回答问题的会话单独算作「待你决策」，始终排在最前面，数量显示在「工作」标签的角标上。每条会话显示标题、时间、最多两行内容、所属项目或对话，以及需要留意的状态（处理中、待你决策、出错、已中断）；已完成的不再标注。电脑离线或正在重连时，标题旁会出现电脑图标，点开可以看到连接情况并手动重连。「我的工作」右上角的新建按钮打开新会话页，可以先选在「对话」还是某个项目里开始，发出后直接进入这段会话的聊天页；聊天页不再显示底部标签栏，避免和输入框叠在一起。原先首页的搜索框、远程桌面与 SSH 入口和离线提示条已移除。「设置」改为系统设置式的分组列表：第一组是这台电脑的名字、连接方式、延迟、负载和「重新扫码」，没配对时只有一行「扫码连接电脑」；「即将推出」的面容确认开关已移除。
    - iPhone 聊天页把 Agent 的连续回复合并成一段：两次提问之间 Agent 做的所有事显示在同一个「Vetta」下面，和电脑上一致。连续的思考和工具调用收成一行「完成了 N 步操作」，点开才看到每一步；正在进行时这一行显示当前步骤，比如正在跑的命令。中间写出的文字会把步骤分段，出错信息留在这一段里，不再另起一个回复。一段结束后可以一键复制它最后的回答。
    - iPhone 上回答电脑的提问改为和电脑一样的面板：电脑用 AskUserQuestion 等你回答时，聊天页底部的输入框换成提问面板，不再是夹在消息中间的卡片。有多个问题时可以用顶部的标签切换，答完一题点「下一步」，全部答完才能「提交」；多选题会标出「可多选」；每题最后都有「其它（自定义输入）」，可以直接写自己的答案。原来的「暂不回答」改为「取消」，效果不变。回答后输入框自动回来。
    - iPhone 客户端换成黑白配色，新会话页加入渐变背景：主题色由绿色改为和电脑默认主题一致的黑白，发送按钮、开关、链接、提问选项和扫码框都随之调整；在线、处理中、已完成等状态仍用绿色标出。聊天里 Vetta 的头像换成电脑上的同款机器人头像，深色下白脸、浅色下黑脸，眼睛是镂空的，透出背后的颜色。新会话页不再显示「新会话」标题，底部带一层从背景过渡到深蓝（浅色下为淡蓝）的渐变。聊天页和新会话页的输入栏往下挪，更贴近屏幕底部，左侧的附件按钮换成 ⌘ 图标。
    - iPhone 上按住说话更快响应：输入框为空时按住 0.2 秒（原来 0.3 秒）就开始听写，开启麦克风也不再让界面顿一下；轻点输入框仍然是打字。
    - iPhone 标题栏和输入栏下的内容柔和淡出：在 iOS 27 上，内容滚到标题栏下面时会被一条生硬的分界线切断，现在所有页面都恢复成 iOS 26 那样的渐隐；聊天页的对话滚到输入栏下面时也会淡出，不再直接撞上输入框。
    - iPhone 首页全新改版：去掉底部的「工作 / 设置」标签栏，会话列表集中到一个页面。左下角的胶囊一直显示电脑的连接状态：在线显示 ✓，连接中转圈，离线显示红色 ✕，没配对时点一下直接扫码。右下角的放大镜打开系统原生的搜索框，搜索框出现在底部，上方内容收起，在手机本地搜会话标题、内容摘要和项目名，不搜完整聊天记录。按项目看会话点列表标题「任务」右边的文件夹图标，从「选择项目」面板里选对话或某个项目；搜索时匹配的项目排在会话上方，点进去是这个项目的会话页，在那里新建的会话默认放在这个项目下。会话列表每条只占一行：左边是标题，置顶的会话标题前有黄色图钉；右边是所属项目的灰色小胶囊，「对话」里的会话不标项目，宽度不够时截短标题、项目名始终完整；最右是状态图标（等你处理是黄色问号，进行中是转动的蓝色箭头，出错是红色感叹号，已完成不标）。不再显示时间和内容摘要，条目之间没有分隔线；「任务」右边的筛选图标弹出菜单，可选所有、待确认、处理中、完成，待确认后面显示有几个会话在等你；筛选生效时对应图标变成实心；往下滚时这一行停在最上方，下面的会话从它底下渐隐。进行中的图标会转动，等你处理的图标会呼吸。
    - iPhone 打开就是新会话页，会话列表改为从左侧滑出：App 启动后直接是新会话页，输入就能开始；发出后就地变成这段会话，不再一层层叠页面。新会话页和聊天页左上角都有 ☰ 按钮，点一下或从屏幕左边缘往右拖，会话列表就从左侧整屏滑出，后面的聊天页稍稍右移变暗；点右上角 ×，或在列表上往左拖，就收回去（「最近」卡片那一排仍然是左右滑动卡片）。在列表、项目页里点任一会话，列表收起，这段会话换到前面；列表顶部是「Vetta」标题和 ×，背景不再有顶部光晕，下面是紧凑排列的「新会话」和「任务看板」两个入口（任务看板本版本只有入口，点击暂无反应），左下角是电脑连接状态，右下角是搜索和设置。列表收起再打开，还停在上次看的项目页和位置。聊天页不再有返回按钮，要换会话请打开列表。没配对时首屏只显示扫码连接的引导。
    - iPhone 新会话页的模型选择移到顶部：和聊天页一样，新会话页左上角显示「新会话」和当前模型、思考强度，点一下弹出选模型的面板；页面中间只留选择对话或项目的按钮。
    - iPhone 选择项目改为统一的底部面板：新会话页点「对话 / 项目」按钮，从底部弹出「选择项目」面板：「对话」在最上面，下面按最近活跃列出所有项目，每个显示会话数和最近更新时间，当前选中的打勾，项目多时可以搜索。首页按项目筛选会话也用同一个面板。
    - iPhone 新会话页的入场更有生气：打开新会话页时，一团柔光从输入框后方升起、向两侧散开，随后静止不动，深色下为白色、浅色下为淡蓝，取代原来的深蓝渐变；机器人头像随后眨几下眼打招呼。电脑离线时头像保持闭眼不眨；系统开启「减弱动态效果」时，柔光直接以最终状态出现。
    - iPhone 按住说话起得更快，并有震动和提示音：按住输入框约 0.1 秒就开始听写，从手指按下那一刻起算，不再因系统传递触摸的延迟而额外多等；按得稍慢的轻点仍然当作打字，松手后直接弹出键盘，不会误开听写。开始听写时播放 iOS 自带的「滑梯」提示音并配上它原生的震动节奏；静音模式下只震动不出声。提示音取自系统，将来的 iOS 若不再提供这段声音，就只剩震动。
    - iPhone 上 Vetta 开始回复时轻震一下：发出消息后，电脑那边开始思考、调用工具或输出文字的第一刻，手机轻震一下，与回复结束时的震动成对出现，不用盯着屏幕等。同一轮回复只震一次；关掉设置里的「任务做完震动提醒」会一并关闭。
    - iPhone 首页抽屉的点按有了触感：点左上角打开首页、点右上角关闭、点上方的新会话 / 任务看板 / 远程控制入口，以及点会话进入聊天时，手机都会轻震一下，确认这一下点中了。
    - iPhone 新会话记住上次用的模型：发起会话或在聊天里切换模型后，下次新会话默认就用这个模型和思考强度，不用每次重选；每台电脑分别记，解除配对后清空。如果电脑上已经没有这个模型，会退回电脑的默认模型。
    - iPhone 工作页的会话列表更疏朗：行间距加大，会话之间的分割线改为从文字左缘开始，不再横穿左侧的状态头像。
    - iPhone 上 Vetta 的回复改为柔和地流出：电脑发来的回复本来是一阵一阵到达的，手机上会一块一块地蹦出来。现在文字以均匀的节奏流出，每个新字从透明淡入，前沿像墨水化开一样柔和；一次到达的内容很多时会加快播放，大约半秒内追上，不会明显落后电脑。「等待模型响应」「处理中」等状态文字改为流光效果，回答结束后「复制」按钮淡入。打开系统「减弱动态效果」时直接显示文字，不做动画。
    - iPhone 聊天页只在你停在底部时跟随回复：以前回复每到一段都会把页面拽回最底部，往上翻看前面内容时也会被打断。现在停在底部时页面随回复平滑下移；往上翻看时不再自动滚动，滑回底部或发出新消息后恢复跟随。
    - iPhone 上 Vetta 的回复更好读：正文字号加大、段落和列表项之间留出更多空隙；行内代码放在带圆角和内边距的浅色底块里，链接改为蓝色描边的高亮胶囊并带一枚 ↗，一眼能看出可以点。代价是正文不再支持长按选取部分文字，复制请用回复下方的「复制」按钮（整段复制），代码块仍可长按选取。
    - iPhone 聊天里的文字可以长按选择：以前长按消息只能整段拷贝或什么也不发生，现在你的消息和 Vetta 的回复（正文、标题、列表、引用和代码块）都能像备忘录一样长按选中任意一段，拖动手柄调整范围后拷贝、查询或翻译；点文件链接照常在 App 里打开。选择手柄与光标统一为蓝色，输入框里的光标也由黑色改为蓝色；你自己的蓝色气泡里用白色手柄，免得和气泡混在一起。回复还在生成、文字正在淡入时暂不能选，这一轮结束后即可选择；表格暂不支持选择。
    - 手机不看画面时，电脑不再截屏：以前手机一走点对点连接，电脑就一直截屏推流，哪怕手机上只是在聊天，也在消耗手机流量和电量，macOS 菜单栏的录屏指示灯也一直亮着。现在只有手机打开「远程控制」时电脑才开始截屏，离开页面或切到后台就停下、指示灯熄灭，代价是每次打开画面要多等一瞬。电脑缺少 macOS 的「屏幕录制」或「辅助功能」权限时，手机会直接说明原因，而不是黑屏或点了没反应；电脑上同时弹出通知，点击即可打开对应的系统设置。需要手机端也更新到本版本才会按需截屏，旧版手机仍按原来的方式常开。
    - 中继短暂断开不再打断远程桌面：手机和电脑直连成功后，画面、操作以及会话和聊天消息本来就不经过中继，但以前中继一重启或抖动，直连也会被一起关掉，远程桌面黑屏、外出时手机直接离线。现在已直连的 iPhone、Android 和电脑会保留这条连接，在后台自动重连中继（间隔从 1 秒逐步拉长到 30 秒）。代价是：中继断开期间无法新建直连，直连本身断开（例如手机从 Wi-Fi 切到蜂窝网络）后要等中继恢复才能重连。需要电脑和手机都更新到本版本，只更新一端时行为和以前一样。
    修复
    - 团队详情里的成员模型选择器现在与会话输入框使用同一套紧凑模型列表，识图能力统一显示为图标，模型较多时列表也能正常滚动；仍可随时切回「跟随会话默认」，成员固定模型和推理档位的保存方式不变。修复 openvetta/open-vetta#66。
    - 修复部分 Anthropic 兼容节点（第三方中转、自建代理）开启思考后一发消息就报 AI_RESPONSE_VALIDATION_FAILED 的问题：这类节点在思考内容开头省略了签名字段，现在可以正常对话。
    - 修复自定义模型（尤其是 Anthropic 兼容节点）返回的响应格式不符合预期时，会话只显示 Stored message.appended event ... does not match the schema 并中止、看不到真正原因的问题：现在会正常显示接口返回了什么不对，方便排查节点配置。
    - 底部面板收起后，输入框下方的待办进度与面板小胶囊现在在同一条线上居中对齐，待办不再比右侧的胶囊低一截。
    - 修复 Windows 上手机配对或多个设置同时保存时偶尔提示 EPERM、创建邀请失败的问题：桌面配置现在统一按最新状态排队保存，文件被系统短暂占用时会在后台继续重试，不再卡住主进程或让不同设置互相覆盖；同一部手机首次连接时也不会重复写入配对记录。
    - 项目列表不再提供本地文件删除能力：侧边栏只保留「从列表中移除」，磁盘上的项目目录、文件和历史会话都会保留；文件服务也会拒绝直接删除已登记的项目根目录。修复 openvetta/open-vetta#67。
    - 团队成员互相确认时不再无限循环回复：修复团队模式中成员回答问题或主控整合完成结果后，再向刚触发本轮的成员发送确认问题，会让双方持续自动唤醒、反复输出的问题。此类反向确认现在仍会显示在团队记录里，但不会再次启动对方；面向其他成员的真实问题和负责人发起的正式返工任务不受影响。修复 openvetta/open-vetta#60。
    - 修复 iPhone 从首页抽屉点开内容很多的会话时明显卡住的问题：一轮里做了几十步操作的会话，以前点开要整轮一次性排版，界面会冻住一两秒甚至更久；现在只排版屏幕上看得到的部分，往上翻时再逐段加载，打开速度不再随内容多少变慢。
    - 修复 iPhone 会话页在回复很长时滚动卡顿的问题：回复流式输出时不再自动追到底部，由你自己滑动查看；发送消息后键盘自动收起，这条消息滚到页面顶部，下方留出空白给回复继续生成。代价是停在历史位置时新内容不会自己出现在眼前，需要手动往下滑。
    - 修复 iPhone 远程控制 Mac 时画面只有十几帧、拖动窗口像幻灯片、画面里的鼠标明显落后于手指的问题：此前电脑对 iPhone 只能用软件编码推流，现在改用 Mac 的硬件编码，同样的高分辨率下帧率更高、画面延迟更低。
    - 调整侧边栏团队头像的折叠显示：最多保留三个头像圆圈；从第四位成员起，剩余人数会叠在第三张头像的半透明遮罩上，不再额外占一个圆圈。
    - 修复团队模型面板切换思考强度时内容短暂变淡、闪烁的问题；成员模型编辑页只在模型列表过长时滚动，思考强度区域不再让整个面板出现滚动条。跟随会话默认的成员行不再重复模型名称，面板底部移除「生效范围」声明。
    - 修复普通会话中选中文字后右键未显示「问问 AI」、消息批注入口未出现的问题；会话切换期间继续隔离不同会话的批注。
    - Windows 上保存设置偶尔失败：Vetta 保存配置时先写临时文件再替换原文件，若原文件恰好被杀毒软件或系统索引短暂占用，替换就会失败，这次改动（例如设备的最后在线时间）没有存下来，日志里还会出现报错。现在遇到这种短暂占用会稍等后重试，同时写入同一个文件时也不会再互相冲突。
    - Android 在设置里选了与系统不同的主题时，状态栏图标颜色不对：例如系统是深色、App 选了浅色时，状态栏的白色图标会看不见。现在状态栏和导航栏图标跟随 App 自己的主题变深或变浅。
    - Android 远程画面在 P2P 通道断开后一直黑屏：P2P 通道断开重连后，远程画面仍停在已经结束的旧会话上，只能退出重进；现在会自动换用新的画面会话。
    - Windows 和 macOS 上远程控制重启一次后，手机的点击和打字全部失效：电脑端的远程画面每次重新启动都要重新准备系统输入，第二次起就会失败，之后手机上看得到画面却点不动、打不了字，只能重启 Vetta。现在重启多少次都能照常控制。
    - 手机重新建立屏幕共享通道时不再把电脑连接整个断开：手机切换网络或重开远程画面时会在原通道上重新握手，电脑以前把这当成异常，直接关掉远程画面再从头启动，手机要多等几秒、画面和输入都会中断一下。现在电脑确认仍是同一部已配对手机后就地换用新的加密密钥，连接不中断；换成未配对的设备仍会被拒绝。
    - Vetta Vivi 会跟随会话状态并平滑切换动作：思考、工具执行、等待确认、完成、出错和暂停会显示对应的状态动作与气泡；连续变化会每约 3 秒合并为最新状态，完成后短暂展示再回到待机。修复长任务随机切回无关动作、待确认时没有提示、错误后误播完成、重开桌宠后状态不同步，以及节日装饰和阴影超出气泡窗口被裁切的问题。关闭待机自动动作也不影响会话状态同步。关联 openvetta/open-vetta#48。
    - 仅文本模型不再误收图片而拒绝请求：模型设置中的「输入能力」现在会真正决定发送内容。未勾选 Image 时，用户消息和工具结果里的图片会在本次请求中省略；切换回支持图片的模型后，原会话中的图片仍可继续使用。修复从视觉模型切换到仅文本模型后出现参数非法错误的问题。关联 openvetta/open-vetta#40。
    - 手机与电脑同时断开时中继不再产生连接关闭异常：中继只向仍处于打开状态的连接发送离线通知，网络切换或应用退出后的重连更稳定。
    - iPhone 客户端在真机上发送消息后闪退、冷启动黑屏：界面配色与列表滚动的计算会被系统放到后台渲染线程执行，而这部分代码只允许在主线程运行，真机上一触发就崩溃（模拟器不走这条渲染路径，所以之前没发现）。现在这些计算不再绑定主线程，发送消息和重新打开 App 都恢复正常。
    - iPhone 上电脑的提问不再要退出重进才出现：电脑用 AskUserQuestion 等你回答时，同一轮还在上报用量等进度，手机把这些进度当成「已经不用回答了」，提问面板刚出来就被收回，会话也从「待你决策」变回「处理中」，要退出聊天页再进来才看得到。现在问题一直留在面板上，直到你回答、取消，或者这一轮结束。
    - iPhone 上发出消息后立刻有反馈，出错能实时看到：以前发出消息后，到电脑开始回复之前界面没有任何变化；如果这一轮在回复前就出错（例如连不上模型），手机上什么也不显示，要退出再进来才看到。现在发出后马上出现「Vetta · 等待模型响应」，自动重试或压缩上下文时会显示「正在重试（1/3）」「正在压缩上下文」，出错时直接在这一段里显示错误。
    - iPhone 上连续的报错不再刷屏：自动重试每失败一次，手机上就多一段「Vetta + 报错」，中间还夹着同样文字的分隔线。现在和电脑一样：同一轮里相同的错误合成一条红色错误块并标注次数（如「×3」），重试成功后前面失败的尝试不再显示。
    - iPhone 打开 App 时能看出正在连接电脑：冷启动时手机要先花几秒连上电脑，这段时间新会话页会当成电脑离线：机器人闭眼、提示离线，输入框也不能点，看起来像卡住了。现在连上之前，输入框的位置显示和首页左下角一样的连接胶囊：连接中转圈，连不上时变成红色 ✕，点一下可以重连；连上后换回输入框。机器人只在真的连不上时闭眼。
    - iPhone 冷启动后第一次点输入框，键盘不再迟迟不出来：系统第一次弹出键盘时要先把键盘加载进来，以前这一下会让第一次点击卡顿很久；现在 App 启动后会在后台先把键盘预热好，点输入框时键盘立刻升起。
    - iPhone 首页在最顶部时标题栏不再多出一个小标题：下拉刷新过一次之后，首页即使回到最顶部，标题栏中间也一直显示「我的工作」小标题，和大标题重复。现在只有列表往上滚过大标题时才出现，和「设置」页一致。
    - iPhone 聊天页标题下的模型名不再变成电脑名：一轮结束、出错或更新用量之后，标题下的「模型 · 思考强度」会变成电脑的名字。现在会一直显示当前模型。
    - iPhone 聊天页点对话区域可以收起键盘：以前只能拖动对话来收起键盘，点空白处没有反应。
    - iPhone 新会话页第一次选模型不再卡住：模型列表要借一个已有会话去问电脑，以前借的是最近的那个，它若没在电脑上打开，电脑得先把它整个载入，第一次打开模型列表要干等好几秒。现在优先借电脑上已经打开的会话，列表按电脑记在手机上，下次打开新会话页立刻就有；连上电脑后也会提前取好。代价是电脑上新增的模型要等下一次取回列表才会出现在手机上。
    - iPhone 从任务看板进入项目页时，项目名不再被遮住：从看板点项目名进入项目页，顶部的大标题会被一层渐变盖住，要先下拉一下才看得见。现在打开就能直接看到项目名，只有真的往下滚动后，「任务」这一行才会停在顶部并在下方渐隐。
    - 电脑重启后，iPhone 上的回复不再停止实时更新：电脑重启（或关掉再打开手机连接）后，手机发出消息却看不到 Vetta 的回复，要退出会话再进来才出现。原因是电脑重启后给手机的消息编号从头算起，手机却还记着重启前的编号，把之后收到的回复都当成已经收过的旧消息丢掉了。现在电脑发现手机记的编号比自己还大时，会让手机整体重新同步；正打开着的聊天会自动重新拉取一次记录，之后照常实时更新。
    - iPhone 新会话发出的第一条消息不再过一会就消失：从新会话页发消息后，自己那条消息会在聊天里突然不见，Vetta 的回复照常出现，要退出会话再进来才恢复。原因是电脑先答应收下消息、稍后才交给 Vetta 记录，手机这时去拉取的记录里还没有这条消息，就用它把聊天整个换掉了。现在刚发起的会话打开时不再拉取记录，直接沿用手机上已有的内容和实时同步。
    - iPhone 打开电脑上的文件不再先报「电脑不在线」：手机与电脑建立直连后，打开一个没看过、稍大一点的文件（约 140 KB 以上，常见于照片、PDF 和长文档），会转圈约 30 秒后提示电脑不在线，点重试才打开。原因是文件按每块 700 KB 传送，超过了直连通道单条消息 256 KB 的上限，电脑发不出去。现在走直连时手机改为按每块 128 KB 分批取，打开大文件要多几次往返；走局域网或中继时不变。
    - 会话输入框现在与消息内容等宽：在宽窗口中，输入区不再比消息正文左右各缩进一截；新建会话页仍保持与欢迎标题和选项行对齐。openvetta/open-vetta#68
    - Linux 上取消或超时的 SSH 操作可以及时结束：本地 SSH 通道如果通过 ProxyCommand 或 shell 派生了子进程，现在会在停止时一并清理，不再因子进程继续占用输出管道而卡住。
    - 知识库整理恢复正常：修复手动「马上整理」和自动轮询在创建加工会话时因缺少系统提示词来源而直接失败的问题；现在可继续按批加工文件并写入知识库。关联 openvetta/open-vetta#35。
    - Git 提交详情可以完整浏览变更文件：修复虚拟文件树容器高度不足导致文件目录显示不全的问题，默认使用列表并可切换树状；完善特殊文件名和重命名差异读取。提交行悬浮不再遮挡显示作者和时间，详情与变更页共用语法高亮差异渲染。
    - 首条回复前的状态与计时更准确：新建会话时分别显示「正在创建会话」「正在准备请求」和「等待模型响应」；等待模型的计时从实际调用模型开始，内部初始化时间不再被算作模型等待。切换回仍在运行的会话也会恢复对应状态。此项修正不改变初始化本身的耗时。
    - 每条回复结束后会显示完整工作耗时：计时从这一轮真正开始工作时算起，包含模型输出前的准备和等待，不再出现明明等待过却显示 0 秒；不足 1 秒会显示为「少于 1 秒」。Team 会话同时显示整体回复和每个子 Agent 的耗时，重开会话后仍会保留。关联 openvetta/open-vetta#31。
    - 新建自动化时不填标题也能创建：以前新建自动化必须填写顶部的「任务标题」，可它看起来像页面标题而不像输入框，只写了任务内容时「创建」按钮一直是灰的，也没有任何提示（推荐任务自带标题，所以编辑它们时正常）。现在标题改为选填，留空时取任务内容的第一行作为标题，超过 40 个字会截断，之后随时可以改。修复 openvetta/open-vetta#45。
    - 右侧面板关着时点聊天里的文件，一次就能打开预览：以前面板关着时点回答里的文件（如交付物列表），只会展开文件目录，要再点一次才显示这个文件。现在第一次点击就会展开面板并直接预览该文件。修复 openvetta/open-vetta#51。
    - 排队消息「立即发送」后不再出现两条相同的消息：回答进行中发出的第二条消息进入队列后，点它立即发送，界面会把这条消息显示两次；退出再进入会话时，多出的一条还可能跑到新回答下面。会话记录本身一直是对的，强制刷新即可恢复。现在消息从发送到保存沿用同一个身份，界面能准确认出它，只显示一次。
    - 同一项目里有多份设计时，画布能切到你要打开的那份：画布开着时新建第二份设计、从画廊点开另一份或在文件树里右键「打开画布」，画布仍停在原来那份，左上角的设计下拉也只列出一份，得关掉整个活动面板再打开才正常。现在画布会立刻重新扫描项目、把新设计加进下拉并切换过去。
    其他
    - 开发环境：桌面端 dev 启动时会检测所有打进主进程的 workspace 包产物，改动 runtime-storage 等包后重启即可生效，不再沿用旧的主进程构建。
    - 测试基础设施：test:changed 现在只运行变更文件的直接、Vitest 关联或显式合同测试；公共入口、包配置、锁文件依赖和带前置构建的测试脚本也不会再扩展为整包、下游或全仓测试，无法可靠定向时直接失败。整包与全仓测试分别由 test:pkg 和 test:full 明确触发。
    - Windows 安装包现在会随包携带并校验完整的命令沙盒运行时；若沙盒缺失或能力不完整，发布构建会直接失败，不再生成安装后只能回退为完全访问的产物。openvetta/open-vetta#70
    - iPhone 的 interop 测试夹具可以生成指定轮数和步数的长会话，用来测量打开会话的耗时。
    - 跨平台质量测试改用操作系统分配的可用端口、按真实路径比较临时包目录，并限制 Windows CI 的测试并发，避免保留端口段、macOS /var 路径别名与 runner 资源拥塞让检查误报失败。
    - 修正本版本开发期间按住说话阈值调短后，轻点输入框无法开始打字的问题；该问题未进入任何已发布版本。
    - 修正本版本开发期间 iPhone 回答电脑的提问后，会话列表有时一直显示「处理中」、直到下次刷新才变成完成的问题；该问题未进入任何已发布版本。
    - Android 设置页的分组、开关、单选等行组件抽成独立文件，供后续设置子页面复用，界面无变化。
    - Android 的持续集成新增设备端界面测试：每次改动 Android 客户端都会在模拟器上跑全部界面测试，并先单独检查测试能否编译，失败时附带测试报告。
    - 修复 Android 持续集成在测试开始前因请求已下架的 SDK 工具包而失败的问题；构建、主机测试和模拟器测试恢复正常执行。
    - 电脑端记录手机最后在线时间失败时不再产生未处理的异常，也不再因此跳过给手机推送电脑状态和启动屏幕共享。
    - 修正本版本开发期间 Android 在前台使用时偶尔仍弹出会话通知的问题：从快捷方式或通知打开页面时会叠开一个新页面，被盖住的旧页面进入后台时把整个 App 当成了离开屏幕。现在只要还有页面在显示就算在前台。该问题未进入任何已发布版本。
    - 修正本版本开发期间 Android 聊天页标题里的思考强度在开始会话后有时消失的问题：标题要等这个会话的模型列表加载成功才显示思考强度，列表请求一失败（比如正好在切换连接通道）就只剩模型名，看起来像思考强度被改成了无，其实电脑上仍按原设置运行。现在直接显示电脑报告的思考强度，模型列表未就绪时沿用新会话页那份。该问题未进入任何已发布版本。
    - 修正本版本开发期间 Android 每打开又关闭一次远程控制，就多留下一个在后台继续接收电脑画面的隐藏渲染器的问题：用得越久越耗电、画面延迟越高。现在关闭远程控制页时会一并释放。该问题未进入任何已发布版本。
    - 修正本版本开发期间手机远程控制偶尔一直黑屏的问题：电脑上负责屏幕共享的服务断开时，如果手机的局域网或中继连接恰好也在重连，服务就不会再启动，此后手机只显示「局域网直连」且没有画面，只能重启电脑端 Vetta。现在手机任一连接恢复时都会补启动屏幕共享。该问题未进入任何已发布版本。
    - 修正本版本开发期间 Android 离线时打开某些会话一直显示「正在加载」的问题：会话在手机上只收到过零星的状态推送、还没完整打开过时，离线打开不会读取手机上缓存的完整记录；现在会先显示缓存。该问题未进入任何已发布版本。
    - 电脑「远程连接」的手机列表里，在线的手机会注明当前的连接方式（P2P 直连、局域网直连或云端中继）。
    - 电脑「远程连接」设置页改为由主进程在手机上线、离线、换通道或二维码与配对请求变化时主动推送状态，不再每秒查询一次；手机状态变化会立刻显示。
    - 修正本版本开发期间同一部手机每重新扫码或手动配对一次，电脑「远程连接」里就多一条永远离线的设备记录的问题：现在按手机身份识别，新的配对会替换这部手机原来的记录并清掉旧凭据，其他手机不受影响。该问题未进入任何已发布版本。
    - 修正本版本开发期间 Android 系统字体调大后，新会话页的任务看板摘要被截掉半行的问题：摘要随字号变高，字号很大时每张卡片少显示一条会话。该问题未进入任何已发布版本。
    - 修正本版本开发期间 Android 刚切到后台时来的会话消息收不到通知的问题：系统要等桌面稳定下来（有时十来秒）才告诉 App 已退到后台，这段时间里电脑的提问或完成被当成「你正在看」而略过；现在离开前 15 秒内的消息会在 App 真正退到后台时补发，已经回答过的提问不再提醒。该问题未进入任何已发布版本。
    - 修正本版本开发期间 Android 在 Vetta 回复时切到后台会卡住十几秒甚至提示「应用无响应」的问题：手机每收到一小段回复都把配对记录整个重写一遍，切到后台时系统要等这些写入全部完成；现在最多每两秒保存一次，离开 App 时再补存。该问题未进入任何已发布版本。
    - 修正本版本开发期间 Android 打开 App 后常弹出「出了点问题」的问题：手机从局域网或中继换到更快的 P2P 通道时，旧通道上还没返回的请求被直接判为失败；现在旧通道会等这些请求返回后再关闭。该问题未进入任何已发布版本。
    - 修正本版本开发期间开启「后台保持连接」后，冷启动 Android App 时偶尔闪退的问题：系统要求常驻通知在几秒内出现，而通知文案加载得更慢；现在先显示只带应用名的通知，文案加载后再替换。该问题未进入任何已发布版本。
    - 修正本版本开发期间 Android 在电脑关闭或网络中断时直接闪退的问题：与电脑的连接断开时，读取错误没有被接住；现在按连接断开处理并自动重连。该问题未进入任何已发布版本。
    - 修正本版本开发期间 Android 发送消息后输入框里的文字没有清空、连点发送会把同一条消息发出好几遍并提示「session is already processing another turn」的问题：现在点发送后消息和「处理中」立即出现，附件在后台上传，发送途中再点不会重复发送；电脑拒收时这条消息从聊天里撤回，文字放回输入框。该问题未进入任何已发布版本。
    - 修正本版本开发期间 Android 回答电脑的提问后，会话列表偶尔一直显示「处理中」的问题：电脑可能在回应之前就推来了本轮结束的状态，随后又被改回处理中，直到下次刷新列表才恢复。该问题未进入任何已发布版本。
    - 修正本版本开发期间 Android 新会话发出的第一条消息偶尔从聊天里消失的问题：电脑收下消息后才把它记进历史，聊天页紧接着拉取的历史还没有这条消息，会把它整个替换掉；现在刚发起的会话第一次打开时沿用已有内容，不再拉取历史。该问题未进入任何已发布版本。
    - 修正本版本开发期间 Android 用连接码或扫码配对时，手机不在电脑所在 Wi-Fi 下要等很久才开始连接的问题：电脑会写入每块网卡的地址，手机原来逐个等 4 秒超时后才轮到云端中继；现在所有局域网地址同时尝试，最多约 4 秒后转中继。该问题未进入任何已发布版本。
    - 调整本版本新增的「设置 → 远程连接」布局：添加手机（二维码）放在最前，连接码和密码排在二维码右侧，二维码随窗口宽度等比缩放不再被压扁；已配对手机列表移到页面底部，远程控制开关与手机名称放在同一行，且只对已连上的手机显示。
    - 修正本版本开发期间「设置 → 远程连接」的二维码过期或被手机用掉后，要手动点「生成新二维码」才会出现新码的问题：页面打开期间现在会立即换上新的二维码和连接码。该问题未进入任何已发布版本。
    - 精简「设置 → 远程连接」页的说明文字，去掉重复的段落说明，「作废」改为「刷新」。
    - 修正本版本开发期间装有 OrbStack、Docker、Parallels 等虚拟机或容器软件的 Mac 上，手机配对要等近一分钟的问题：这些软件在 macOS 上创建的 bridge 网卡地址被当成 Wi-Fi 地址排在最前，手机要先逐个等它们超时；现在它们排在最后。该问题未进入任何已发布版本。
    - iPhone 配对时同时尝试电脑的所有局域网地址，不再逐个等待超时：手机不在电脑所在的 Wi-Fi 时（例如用连接码配对），最多约 4 秒后就改走中继，而不是每个地址各等 4 秒。该问题未进入任何已发布版本。
    - 调整本版本新增的 iPhone「用连接码连接」界面：改为分两步引导，先在 8 个方格里输入连接码，填满自动进入下一步，再在 6 个方格里输入密码，填满即开始连接；长按方格可以粘贴。连接码不存在时回到第一步提示，密码错误时清空密码重填。上方的图示跟着输入变化：输连接码时电脑和手机之间逐格连上，输密码时锁随每位数字轻跳，连接中缓慢起伏，被拒时晃动，配对成功后锁打开再关闭页面。
    - 调整本版本新增的 Android「用连接码连接」界面，与 iPhone 一致：改为整页分两步引导，先在 8 个方格里输入连接码，填满自动进入下一步，再在 6 个方格里输入密码，填满即开始连接；长按方格可以粘贴。连接码不存在时回到第一步提示，密码错误时清空密码重填；上方图示随输入变化，连接中缓慢起伏，被拒时晃动。
    - 修正本版本开发期间手动输入地址配对的手机，在电脑「远程连接」里显示成一串 mobile-… 字符而不是手机名称的问题：现在记录手机自己报上的名称，已配对的手机下次连上时也会自动改成它当前的名称，在电脑上手动改过名字的保持不变。该问题未进入任何已发布版本。
    - Android 向电脑报上的名称改为你在系统「设置 → 关于手机」里给手机起的名字，没有时用「厂商 + 型号」（如 “Xiaomi 24031PN0DC”），不再只是一串型号代码。
    - 发版流水线去掉了构建之后单独跑的平台验收（安装包实装、Windows 补充格式检查、打包后 E2E）：它要把每个平台 1 GB 以上的构建存档传来传去，还曾因 Windows 路径问题卡住整次发版。各平台构建完直接上传安装包进入发布，R2 发布前的更新清单与 macOS 签名公证检查、发布后的更新源可达性检查照旧保留。
    - 手机与电脑之间的远程协议升级到 v2（端到端加密、局域网与中继双通道、按设备的事件日志），Cloudflare 中继同步升级为只转发加密帧；决策记录见 ADR-0128。
    - 手机客户端从 Expo/React Native 改为 Swift 原生重写（apps/mobile/client-apple），功能与原版一致，界面换成系统原生控件与 Liquid Glass 材质，深浅色跟随系统设置、不再单独切换；Kotlin 安卓工程迁到 apps/mobile/client-android。原 Expo 工程移出仓库。决策记录见 ADR-0129。
    - 手机远程协议新增附件上传（session.upload）、模型列表（model.list）和会话设置（session.configure），session.state 带上当前模型与思考强度，均为向后兼容的新增；手机上传的附件保存在电脑的 ~/.vetta/remote-uploads，7 天后自动清理。决策记录见 ADR-0130。
    - iPhone 客户端的 UI 测试只构建一次再按深浅色各跑一遍，并新增 --fast（只跑深色、不截图）与 --only 选项，改界面时一轮从约 7 分钟缩到 1 分半左右；端到端用例按界面拆成相互独立的几个，改哪块只跑哪块。
    - iPhone 客户端的开发验证改为模拟器构建加 VettaKit 单元测试即可提交，界面由真机验收；端到端 UI 测试不再是每次改动的必做项，改完一个界面不用再等几分钟。
    - 手机在电脑回复到一半时打开会话，之后同步过来的文字会接在已有回复后面，不再另起一段重复的「Vetta」回复。
    - iPhone 客户端的签名团队改为写在本地的 Config/Local.xcconfig（不进仓库，附示例文件），不再写进 Xcode 工程文件：各人真机调试不会再让工程文件出现改动，也不会把个人的 Team ID 带进提交。
    - 电脑侧边栏的会话置顶改为存在 ~/.vetta/desktop-app/session-pins.json，由主进程统一维护，不再放在窗口的本地存储里；升级后第一次打开会自动把原来的置顶搬过去。删除会话时，置顶和标签也改由主进程一并清理。
    - Android 设备端界面测试按当前语言取文案，「关于」页版本号用例随文案带上版本参数。
    - Android 客户端移植了 iPhone 端的会话镜像核心逻辑（远程载荷解析、会话记录归并、按轮合并回复、会话筛选排序、草稿与模型选择），并配套单元测试，为后续补齐界面做准备。
    - Android 客户端移植了 iPhone 端的任务看板排序、项目汇总与本地搜索、流式回复匀速渐显和项目范围筛选的纯逻辑，并补齐对应单元测试，供后续界面使用。
    - Android 新增一套通用界面组件：与 iPhone 同名的弹簧动效曲线（snappy / smooth / bouncy）、按下缩小松手回弹的点击反馈、半透明悬浮按钮、列表边缘渐隐、统一样式的底部面板和会动的会话状态图标，后续页面都基于它们搭建。
    - Android 抽屉的两层页面各自裁剪到自身边界，避免首页顶部光晕在抽屉收起时漏到新会话页上方（本版本新抽屉发布前修正）。
    - 手机远程协议新增重命名（session.rename）、置顶（session.pin）和删除（session.delete），会话摘要带上置顶时间，均为向后兼容的新增；决策记录见 ADR-0131。
    - @vetta/remote-control 新增连接码配对所需的加密信封：配对信息用连接码和密码派生的密钥加密后才交给中继，中继只见到连接码的哈希；决策记录见 ADR-0136。
    - Cloudflare 中继新增连接码配对用的加密信箱（/v2/invite），每个信箱最多保存 10 分钟、被读取 10 次。启用连接码配对需要重新部署中继（新增 Durable Object 迁移 v3）；未部署时电脑只提供二维码。
    - Android 客户端移植 iPhone 的远程桌面触控板模型（按手指位移移动光标、快速滑动走得更远）与光标形状的读取，订阅画面时向电脑索取光标样子。
    - iPhone 会话列表的筛选条改为按滚动视图的实际内容边距判断是否吸顶，修正抽屉顶栏被重复计算、筛选条未滚动就显示吸顶底色的问题（本版本内引入并修复）。
    - iPhone 客户端的 interop 假电脑新增 VETTA_INTEROP_LONG_REPLY=1，按不规则的节奏推送一段长回复，便于在模拟器里检查回复流出与淡入的效果。
    - 技能列表的排序规则从桌面输入框移到主进程与界面共用的位置，供手机端复用；桌面上的排序结果不变。
    - 手机远程协议新增技能列表（skill.list），手机可以按项目取到电脑上可引用的技能和场景，过滤与排序和桌面输入框一致，为向后兼容的新增；决策记录见 ADR-0137。
    - 修正 ADR-0137 对旧版电脑的描述：电脑遇到不认识的远程方法会断开连接，而不是只回一个错误。
    - 电脑处理手机发来的消息时，与桌面输入框一样把场景引用（@scene:）转为场景展开请求，一条消息最多一个场景；此前手机发出的场景引用只会作为普通文字交给模型。
    - 整理 iPhone 输入框的代码注释排版，界面无变化。
    - 精简开发质量门禁：快速检查改为按文件选择规则，移除重复的类型、文档与打包检查，架构守卫只保留长期依赖合同，并减少一组重复的通用单测平台矩阵。
    - 词汇表新增「远程可读范围」，约定手机查看电脑文件时的读取边界，为手机文件面板做准备。
    - 手机远程协议新增 file.list、file.stat、file.read 三个请求和 forbidden、too_large、file_changed 三个错误码，电脑在 device.status 里用 fileRead 声明支持，旧版电脑与手机互不影响；决策记录见 ADR-0139。
    - 移除两份 Desktop UI 设计与审查流程文档，以及开发指南中对应的强制阅读和审查要求。
    - 项目级智能体技能补充 Android Material 3 与自适应界面设计、Jetpack Compose 组件 API 设计及状态、副作用管理指南，仅供 Kotlin UI 开发协作使用。
    - 插件 SDK：fs.listFilesRecursive 可以只找指定文件名、并额外跳过某些目录，大型 monorepo 里扫描 package.json 之类的清单文件不再被 1 万条的结果上限截断（本地与远程项目都支持）。
    - 插件 SDK：底部面板插件可以申请新权限「在终端里运行命令」，在底部面板开出内置终端并替你敲入一条命令，命令全程显示在终端里；重开会话时只恢复布局和上次输出，不会重新执行。
    - 修正本版本开发期间 Android 打开 10–32 MB 的照片时提示「文件过大」的问题：电脑会先把照片缩小再发给手机，手机却按原图大小提前拒绝了。该问题未进入任何已发布版本。
    - Android 的文件预览页从文件面板中拆分成独立文件，便于按文件类型扩充，界面无变化。
    - 发版与 quality 流水线的质量测试先构建 capability-sdk，修正插件清单测试在干净环境下找不到该包、导致 v0.5.60 发版在校验阶段中止的问题。
    - 修正本版本开发期间新增的目标模式让桌面端界面打包失败、v0.5.60 四个平台安装包都无法构建的问题：界面用到的会话扩展入口间接加载了只能在后台运行的模型 Provider 代码；现在改为从不加载 Provider 的入口引用，并加测试防止再次引入。该问题未进入任何已发布版本。
