  Value: |-
    Vetta 0.5.61
    发布日期：待定
    修复
    - 手机断开后，电脑的远程连接状态会自动更新：修复手机已离开中继、电脑仍一直显示在线的问题。最后一条通道断开后，保留 5 秒重连宽限，再显示离线并停止会话同步；仍有局域网或 P2P 连接时保持在线，手机重连后自动恢复。
    - 模型网关提供的图像能力不再在注册时丢失：CLIProxyAPI 等模型插件声明支持图片后，宿主会在保存、重载和读回模型时保留输入类型；没有声明的模型仍按文本输入处理。
    - 目标完成后状态不再跳回「执行中」：目标启动或恢复时，迟到的操作返回值不会覆盖已收到的完成、暂停或清除状态；从新会话页发起目标后切到会话页也能保持正确状态。
    - 新会话使用 Gemini 启动目标模式不再立即发送失败：修复首轮缺少对话内容导致的 contents are required 错误；暂停后继续也会提供正确的启动上下文，不在聊天历史中插入额外消息。修复较早的目标状态写盘完成后把已恢复的目标覆盖回暂停的竞态。Google 和 Vertex 的空内容请求会明确报告请求无效，不再误报传输失败。
    - iPhone 会话页拖出左侧会话列表时，无序列表的文字不再消失：在聊天页从屏幕左边缘慢慢拖出会话列表，或者来回滚动时，回复里的无序列表常常只剩前面的圆点，文字不见了，只留下一片空白，小标题和普通段落却正常。现在列表文字无论拖动还是滚动都会一直显示，排版和折行保持不变。
    - 「交互」人设在 Coding 模式下会先问再做，不再和模式打架：之前选了「交互」人设再开 Coding 模式，Agent 同时收到「先征得同意再动手」和「默认直接改完」两条相反的要求，有时问一句，有时直接改。现在规则写明：人设和自定义指令决定沟通与确认方式，项目里的 AGENTS.md 等文件决定这个项目怎么做事，你在对话里说的话优先于这两者。「交互」人设也不再自称另一个名字。
    - 回复末尾的交付物清单只剩一种写法：之前一条规则要求正文里每次提到文件都写成可点击链接，另一条又说链接只能出现在末尾清单里，清单标题也有两种格式。现在正文里可以正常放文件链接，末尾照常给一份完整清单，标题统一为加粗的「交付物」，每个文件后面写明改了什么。
    - 桌面端切回正在运行的会话后，同一轮回复不再被拆成两段：Agent 还在干活时切到别的会话再切回来，后续输出常常另起一个带新时间的「Vetta」回复块，看起来像多了一轮对话，要刷新才能合回去。现在切回后的输出会接着原来的回复继续显示。
    - 桌面端切回自动续跑中的会话，新一轮不再接到上一轮回复上：目标模式等没有新用户消息的续跑回合，切走再切回时，之前会把正在进行的输出续写到上一轮已经结束的回复里，上一轮还会一直显示「处理中」。现在按正在运行的回合找到它自己的回复；切回时，这一轮里已经跑完或仍在运行的工具也会照实显示。
    - 桌面端发送失败的消息切换会话后不再冒出来：发送被拒绝（例如没配置模型或密钥）的消息，切到别的会话再切回来时会作为「待发送」重新出现在末尾，要来回几次才消失。现在失败的消息只留在原处，不再被当成待确认的消息带回来。
    - 桌面端回复在调用工具的间隙保持「进行中」：Agent 每完成一次模型调用、转去执行工具时，回复会被短暂标记为已结束并记下结束时间，直到下一次模型调用输出才恢复。现在只有整轮结束才会结束回复，耗时也按整轮计算。
    - 桌面端打开或切回会话时不再漏掉或重复一段回复：历史和实时输出原本分两次获取，恰好在两者之间保存的那次模型输出会暂时缺失，直到本轮结束才补上；反过来，读到的历史也可能与重放的输出重叠。现在二者作为一次快照获取，正在运行的这一轮完全由实时输出重建。
    - 桌面端回复流式输出时，屏幕上其他回复不再跟着重新渲染：每收到一段输出，列表都会生成一份新的会话用量清单并传给每条回复，导致所有可见回复每 0.1 秒整体重渲染一次；长会话滚动和输入时会因此发卡。现在用量没有变化时沿用同一份清单，只有正在输出的那条回复会更新。
    - 桌面端重复收到的回合结束信号不再改写已完成的回复：同一回合的取消或结束信号迟到或重复送达时，已经结束的回复不会再被改成「已中止」或刷新结束时间。
    - 桌面端打开会话或在新会话里发出第一条消息时，消息列表不再闪一下重新加载：会话就绪的那一刻，整个消息列表会被拆掉重建，已经显示的消息消失后再出现。现在会话就绪不再触动列表，消息原地保持；批注面板仍随会话切换各自独立。
    - 桌面端打开较长的会话后停在最底部：列表在定位到底部的途中被记成「阅读位置」，下次挂载时按这个半途位置恢复并停止跟随底部，结果停在中部偏上。现在只有你自己往上翻看历史时才会记住位置，否则打开会话总是回到最新消息。
    - 桌面端打开较长的已有会话时，消息不再消失再出现：长会话原先先显示最近两轮，随后把更早的历史补到上方；补入时列表按位置序号记录高度和滚动位置，序号整体后移，屏幕上换成了别的消息，等滚回底部才重新出现。现在打开会话时一次呈现完整历史，列表不再在上方补入内容；短会话本来就一次加载完，不受影响。
    - 桌面端在较长的会话里向上滚动不再闪烁：打开会话时先只显示最近两轮，随后把更早的历史补到上方。补入的消息高度只能粗略估算，向上滚动时每出现一条新消息，列表都要修正一次位置，画面跟着闪一下。现在打开会话时一次呈现完整历史，列表从一开始就按每条消息估算高度。本机最大约 2MB 的会话实测，完整历史只比两轮预览多花约 10 毫秒。
    - Android 会话页右上角的文件图标会一直留着：打开会话就能看到文件夹图标，点一下查看电脑上的文件。之前要等电脑回报「可以读文件」之后图标才出现，连上之前右上角是空的。电脑版本太旧时，打开后会说明需要更新桌面端。
    - Android 远程桌面重连时不再闪退：直连断开后重新建立的瞬间，旧连接会被关闭两次，App 直接退出。常见于切换网络、电脑端重启远程桌面，或者杀掉 App 后马上重开。现在旧连接只关一次，会话会自动连回去。
    - iPhone 走 P2P 直连时不再动不动显示断线：P2P 断开（换网、Wi-Fi 抖动）或 App 切到后台时，之前整条连接会被当成断线，先显示「离线」，等一秒后才重新连上局域网或中继。现在会立刻退回局域网或中继，界面只短暂显示「连接中」，回到前台后再自动升级到 P2P。
    - iPhone 从 P2P 退回局域网或中继时不再中断：走 P2P 时，原来的局域网或中继连接会继续保留作备用，只多一点心跳流量，电脑不会重复推送。P2P 断开时当场切到备用连接，不用重新连接、等握手，正在发的请求也不会因此失败；断开瞬间电脑发出、手机没收到的更新会自动补上。
    - iPhone 切换网络后马上换到新网络上的连接：在 Wi-Fi 和蜂窝之间切换，或断网后恢复时，之前要等旧连接的心跳超时（约半分钟）才发现连接已经断了，这段时间收不到更新。现在一切换网络就在新网络上重新连接，连好之前旧连接照常使用，不会显示离线；断网恢复后也不再按退避时间等待，而是立刻重连。
    - 手机远程桌面不再因网络抖动被电脑断开：中继重启或手机信令重连过一次之后，P2P 连接只要短暂抖一下（哪怕马上自己恢复），电脑就会重启截屏页、断开连接，正在看的画面随之中断。现在电脑会等 5 秒，连接恢复就继续；仍未恢复或彻底失败，才重新开始。
    - iPhone 的 P2P 直连短暂中断后不再长时间卡住：直连中断时，之前要等约 30 秒才认定断开，这段时间聊天不更新、请求也没有回应。现在中断 5 秒仍未恢复，就改走局域网或中继。
    - 桌面端回复写完后，结尾几个字马上恢复正常亮度：流式输出时最新的一两段文字会略暗，之前要等这一轮彻底结束（通常比文字写完晚约一秒）才变亮，看起来像结尾卡住了。现在文字停止增长约 0.3 秒就恢复全亮；Agent 继续输出时，新出现的文字照常略暗。
    改进
    - iPhone 补齐远程连接与操作体验：与 Android 一样使用多组 STUN 地址，并减少远程画面的播放缓冲；网络抖动时画面可能短暂停顿。远程桌面未放大时可双指滚动电脑内容，放大后仍平移画面。首页抽屉新增「连接电脑」，显示当前电脑名，可直接重新配对。
    - iPhone 自动跟随电脑更换中继：电脑公布新中继地址后，手机会记住并重新连接，正在查看的聊天保留，下次打开也使用新地址；切换期间连接会短暂中断，未完成的操作可能需要重试。
    - 开发版启动时减少骨架屏等待：首屏改为按组件加载界面代码，默认主题不再提前加载远程主题运行时，全局弹窗在页面绘制后准备，活动面板内容按需加载，能力页预取等当前页面绘制后再开始；开发服务器同时预热首屏代码。设置、主题和弹窗仍按原入口使用，启动期间收到的审批请求会保留到界面就绪。
    - 目标模式改为直接使用会话输入框：目标模式与计划模式放在输入栏的同一组动作中；开启后直接填写目标并使用原发送按钮提交，不再弹出另一套表单，新建任务时也可以直接发起。目标与待办以紧凑摘要共享输入框下方同一行，点击目标摘要可查看状态、受阻原因和执行用量，并暂停、继续或清除；连续三轮没有进展或执行失败时会自动停在「受阻」，避免空转。openvetta/open-vetta#62
    - Android 设置页先看到手机和电脑连在一起：打开设置，电脑和手机是两个放大的图标，没有底色，手机下面写的是这台机器的型号。中间一条细线：连上是实线，一个小点慢慢从电脑流向手机，不再另写「已连接」；没连上是虚线。线条不用绿色，也不会一明一暗地呼吸，只有断开时状态文字是红色。延迟、负荷、远程控制、重新扫码，以及实时思考和震动直接列在下面。还没配对时连线是断开的，扫码按钮和配对步骤都留在卡片上。通知说明留在开关下面。
    - Android 设置列表改成统一的分组样式：行高、分隔线、标题和脚注按 iPhone 的分组列表来排，设置和通知规则共用同一套，不用每页各画一行。同一张卡片里的分隔线对齐到同一条起笔。外观的分段选择外框、圆角和细边与其他分组相同，底也和别的卡片一样；选中项是一块略灰的按钮，点另一项时先变大，滑到那一项，到位后再收回。标题改成卡片上方的灰色脚注。解除配对改成居中的红色文字。
    - Android 通知规则的说明跟在标题下面：标题放进卡片里，颜色更深、字号与这一行的开关对齐并稍加粗，说明紧挨在标题下，再用一条细线和下面的开关分开，不再排在卡片最后。免打扰的开始和结束时间出现或收起时，卡片高度会缓缓变化。
    - Android 远程桌面画面更跟手：手机收到画面后不再为了平滑播放额外缓冲，解码完就显示。同一局域网下，画面稳定后的等待从约 85 毫秒降到约 60 毫秒；代价是网络抖动时画面可能偶尔一顿，而不是整体慢半拍。
    - 手机跨网络直连电脑更容易成功、绕路更少：寻找公网地址时优先使用国内可直连的服务器（小米、哔哩哔哩、芒果 TV），Google 和 Cloudflare 留作海外备用。之前只用 Google，在国内要么查不到地址、只能退回中继，要么经代理拿到境外节点的地址，画面和操作绕道海外，往返实测超过 300 毫秒。电脑端此前完全没有查询公网地址，现在也一并查询。
    - Android「后台保持连接」的说明改短了：开关下面只留一句，关掉后仍会通知你，通知栏留一条提示，耗电略增。
    - Android 设置里的开关缩小，连线详情分成两列：开关大约小三成，多行说明旁边的开关跟在标题上，不再竖在段落中间。连上之后，线路单独一行，延迟和负荷左右对齐；电脑名字可以显示两行。
    - Android 设置里的开关，关闭时不再是一圈粗边：关掉后是浅灰轨道和白色圆钮，打开时仍是深色轨道。深色模式下关闭轨道相应变深，圆钮保持浅色。
    - Android 标题旁的连接状态不再铺深色底：在线时只留一圈细边，电脑图标和勾号表示已经连上。断线时用很淡的红边提示，不再整块涂色。点一下仍能看到连接详情，断线时也可以重连。
    - Android 会话列表用右侧菜单管理会话：每一条会话右侧有三个点，点开可以置顶、重命名或删除。会话页右上角是一个文件图标，点一下打开电脑上的文件；置顶、刷新和重命名不再出现在会话页。
    - Android 会话行在标题下显示项目和时间：项目名前保留文件夹图标，时间紧跟在名字后面，项目名不再带底色。没有项目的对话只显示时间。首页列表和任务概览都是这样。
    - Android 对话输入栏里，加号和语音都收进输入框：加号在框内左侧，语音在框内右侧。写了内容之后，发送在输入框右边出现，输入框用 250 毫秒把宽度让出来，删掉内容或发送结束后用 300 毫秒收回；Agent 工作时，停止按钮仍占发送的位置。
    - iPhone 上 P2P 连接写明是「P2P 直连」：连接详情和设置里原先只写「直连」，和「局域网直连」分不清。现在 P2P 线路显示为「P2P 直连」（英文为 Peer-to-peer (P2P)）。
    - iPhone 在打不通 P2P 的网络下更省电：在蜂窝网络等无法直连电脑的环境里，手机原来每 20 秒就尝试一次 P2P，电脑每次都要重新准备连接。现在连续失败后会逐步拉长间隔，最长 5 分钟一次；换网络、回到前台或连上一次之后，又从头开始尝试。
    其他
    - iPhone 增加远程手势的 UIKit 组件测试与侧边栏配对流程测试，并修正当前 Swift 编译器下连接码解密的编译问题。
    - 开发时测试和 lint 默认只覆盖变更影响范围，Google 请求和目标模式测试使用经过回归验证的定向选择，减少公共入口带来的无关测试；保留显式全量检查，CI 和发布仍执行全量质量门禁。
    - 系统提示词只提及当前实际可用的工具（不再让模型去用不存在的 ls/find 等），图表后的「关键观察」小节标题跟随用户语言，且只在确实渲染了图表或卡片时出现；用户消息里 @skill:名字 找不到对应技能时，Agent 会简短说明后继续。
    - iPhone 客户端 Build 号升到 2（版本仍为 1.0.0），用于发布新的 TestFlight 测试版。
    - Android 的分组列表控件按 SwiftUI 拆成 Button、Toggle、Picker、LabeledContent，并补上 TextField、Slider、Stepper、ProgressView，不再堆在一个文件里。
    - 中途接入的会话订阅方也能收到本轮已执行的工具事件。会话状态快照中的当前回合开始时间与回合标识已删除：桌面端改由会话接入的快照与整轮重放恢复运行中回合，不再需要它们。
    - 桌面端历史消息的内容块改用与实时流一致的稳定标识，同一条消息重新加载时不再整块重建；工具块的更新逻辑抽成按单条消息操作的函数。无可见变化。
    - 桌面端消息列表改由单个按回合身份归约的消息流 reducer 维护（ADR-0146）：实时事件、历史快照、发送中的消息和本地报错都经它写入，历史按消息身份合并，不再比较列表形状或按文本、序号猜测乐观消息。已暂停批量子任务的恢复发送不再先显示一条乐观气泡，而是在回合开始时显示实际写入的消息。
    - 运行时在一轮内先失败、后续模型调用又正常完成时，会话结束时报告的原因改为正常结束，不再残留「出错」。此前这一纠正只写在一个早已不再发出的事件分支里，实际从未生效；目前界面没有按该原因区分展示。
    - 运行时会话事件合同删除五个早已不再发出的旧事件（message.delta、thinking.delta、message.final、toolcall.start、toolcall.args），通知、宠物、应用统计、插件事件桥、手机镜像、CLI 与团队会话中依赖它们的分支一并删除；这些功能都已由流式协议事件驱动，行为不变。
    - 质量门禁新增会话事件合同检查：每种运行时事件都必须登记并能找到实际发送它的代码；已删除的事件类型列入墓碑清单，源码（包括测试与移动端）再出现即检查失败；桌面端消息列表只能经会话消息流写入。
    - 运行时新增会话接入接口：一次返回历史快照，并从回合开始重放正在运行的回合，两者之间不遗漏也不重叠；重放时合并相邻的流式片段。原有订阅方式的行为不变。
    - 桌面端会话事件控制器拆分为路由、会话状态与输入预测三部分；每种运行时事件的去向写在一张穷尽的路由表里，合同新增事件时必须先决定由谁处理。无可见变化。
    - 桌面端消息列表改由可组合的 Conversation.* 部件组成：数据来自可实例化的会话数据源，每类消息可以声明自己的模板，横切功能以注册式扩展接入；原有消息列表成为由这些部件组合而成的兼容外壳。无可见变化。
    - 桌面端普通会话的消息列表改用 Conversation.* 部件显式组合：用户消息的编辑、分叉、复制、删除和分支切换作为可单独取舍的部件，命令来自会话数据源；批注、分叉来源提示和等待提示以扩展接入，旧的会话列表外壳删除。无可见变化。
    - 桌面端回复拆为可组合的 AgentMessage.* 部件（标题、工作折叠条、内容、复制、时间、用量、预测状态、卡片），普通会话显式组合它们；「预测下一条输入」状态改由会话数据源提供，删除原先的隐式渲染上下文。无可见变化。
    - 桌面端消息列表中的时间线事件（上下文压缩分界、任务委派、Team 成员回复卡）拆为 EventMessage.* 部件，每种事件可单独取舍；Team 成员回复卡的「打开会话」改由数据源能力决定是否出现。无可见变化。
    - 桌面端消息列表中工具调用下方的子 agent 进度卡片改为注册式扩展，放入会话视图才显示，归属的运行时仍由数据源指定。无可见变化。
    - 桌面端只属于普通会话的分叉来源提示、等待/重试提示与工作流脚注移入会话组合层；质量门禁禁止共享消息渲染代码读取当前活动会话或全局打开会话函数，避免查看器、Team 等其他视图的表现随当前会话变化。无可见变化。
    - Team 成员回复卡、任务委派提示、用户消息的分支切换与操作栏移入 theme-ui，成为不依赖会话数据的纯展示组件，桌面端只负责文案与数据映射。无可见变化。
    - 桌面端消息列表中没有声明模板的消息类型改用只读默认模板（正文加复制），删除按消息类型替换渲染器与按内容块替换渲染器的两个隐式上下文；内容块替换改为注册式扩展。无可见变化。
    - 桌面端会话查看器、工作流面板与 Team 时间线改为各自显式组合 Conversation.* 部件，数据来自快照数据源；删除原先由 props 开关功能的通用消息列表外壳。这三处不再显示子 agent 进度卡片（此前仅在它们恰好展示当前活动会话时才会出现）。
    - 更新 ADR-0147 实施记录与消息列表开发文档，说明数据源、部件、扩展三层的用法与守卫约束。
    - ADR-0147 补充两条约束：消息列表外层包裹不随会话状态变化，滚动记忆只记录读者主动停留的位置。
    - 新增架构决策 ADR-0147：桌面端消息列表改为 headless 数据源、Radix 风格复合组件与注册式扩展三层，功能按需组合，能力来自数据源而非 props 或全局状态；分步迁移。
    - 新增架构决策 ADR-0146：桌面端会话消息列表改为由快照和带序号的事件驱动的单一数据源，分阶段替换原有的多路写入与合并逻辑，从根上减少切会话串流、回复拆段、乐观消息残留等问题；文末记录实施进度与剩余阶段。
    - 发版流水线在全部平台构建成功后自动运行 desktop-promote 上线 R2 更新清单，不再需要手动点击；任一平台失败时不上线，线上保持旧版本，修好后重跑失败任务即可一并上线。手动发版可关闭 auto_promote，改为构建完再手动上线。
