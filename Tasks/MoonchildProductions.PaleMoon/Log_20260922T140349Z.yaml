Version: 35.0.1
Installer:
- Architecture: x86
  InstallerUrl: https://rm-eu.palemoon.org/release/palemoon-35.0.1.win32.installer.exe
- Architecture: x64
  InstallerUrl: https://rm-eu.palemoon.org/release/palemoon-35.0.1.win64.installer.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    This is a bugfix and security release.

    Changes/fixes:
    - Fixed a major performance bug with the new :has() implementation.
    - Fixed potential undefined behavior in float to int32 conversions.
    - Made checking for structural errors in XML-based files more strict.
    - Fixed a crash in the WeakRef implementation.
    - Fixed a potential issue in UI tooltips (DiD).
    - Fixed a regression in XSLT transformations that would result in incorrect output.
    - Security issues addressed: CVE-2026-92016 (DiD), CVE-2026-92044, CVE-2026-92049, CVE-2026-92030 and CVE-2026-92012.
ReleaseTime: 2026-09-22
