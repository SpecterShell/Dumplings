Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    This is a security release. Happy Halloween, everyone! 🎃

    Changes/fixes:
    - Removed compromised eMudhra certificates from the cert store.
    - Updated SQLite to 3.54.1.
    - Updated executable extensions list to warn about some additional types of files.
    - Fixed several potential crashes.
    - Resticted JAR loading to align better with in-browser usage.
    - Fixed an issue with potential out-of-bounds access in JavaScript.
ReleaseTime: 2026-10-27
