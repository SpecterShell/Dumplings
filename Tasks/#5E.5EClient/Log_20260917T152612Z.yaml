    优化升级
    跑图功能优化
    针对 V 社近期在「死城之谜」出生点位的更新，5E 跑图训练对相关道具进行了同步优化：
    1. 对原 T 阵营出生点 5 颗快警中烟进行了针对性优化；
    2. 新增：CT 阵营 5 颗 donk 同款快匪中烟，magixx 山上放血雷，OG 同款 A 小双封烟等大量道具；
    3. 合并了部分道具至反向，减少视觉干扰。

    福利回馈
    5E 周卡武库
    1. 活动时间：9 月 17 日 — 10 月 17 日
    2. 购买单周卡即可激活武库宝箱，每完成 1 场排位赛，宝箱进度 +1。
    3. 宝箱共 6 个阶段：青铜 → 白银 → 黄金 → 铂金 → 钻石 → 传说，阶段越高，奖励价值越高。
    4. 开启宝箱可获得一件 CS2 饰品，最高可获得 AK-47 | 火神（略有磨损）。
    5. 单周卡限量发售，售完即止；仅限受信用户购买，每个账号限购 1 次。
