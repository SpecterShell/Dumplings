  Key: ReleaseNotes
  Value: |-
    What's Changed
    - update dependencies to latest version by @mfuntowicz in https://github.com/ggml-org/Llama-Windows/pull/92
    - fix(app): remove only Llama's files from the shared install dir by @mfuntowicz in https://github.com/ggml-org/Llama-Windows/pull/95
    - Add ability to share images and text to the llama server by @mfuntowicz in https://github.com/ggml-org/Llama-Windows/pull/98
    - Add llama:// protocol deep links (chat prompt, model load) by @mfuntowicz in https://github.com/ggml-org/Llama-Windows/pull/99
    - Fix/arch detection by @mfuntowicz in https://github.com/ggml-org/Llama-Windows/pull/101
    - misc: update publisher for the windows store by @mfuntowicz in https://github.com/ggml-org/Llama-Windows/pull/102
    - Add speculative decoding support by @mfuntowicz in https://github.com/ggml-org/Llama-Windows/pull/105
    - Enroll local model folders for discovery by @mfuntowicz in https://github.com/ggml-org/Llama-Windows/pull/106
    - fix(server): keep every server-read path out of the MSIX virtualization sandbox by @mfuntowicz in https://github.com/ggml-org/Llama-Windows/pull/108
    - Put the server API key behind the same door as the HF token by @mfuntowicz in https://github.com/ggml-org/Llama-Windows/pull/109
    - Ability to heuristically determine if a model would fit the underlying hardware by @mfuntowicz in https://github.com/ggml-org/Llama-Windows/pull/111
    - fix(logo): unknown providers show the org's Hub avatar instead of an empty tile by @mfuntowicz in https://github.com/ggml-org/Llama-Windows/pull/112
    - security(install): run install.ps1 in memory — never written to disk by @mfuntowicz in https://github.com/ggml-org/Llama-Windows/pull/113
    - perf(poll): fingerprint-gate the /models poll; settle to 2s when idle by @mfuntowicz in https://github.com/ggml-org/Llama-Windows/pull/114
    - fix(supervisor): make server-death detection reachable by @mfuntowicz in https://github.com/ggml-org/Llama-Windows/pull/115
    - perf(model list): coalesce per-row rebuilds; diff-gate the browse tail by @mfuntowicz in https://github.com/ggml-org/Llama-Windows/pull/116
    - Security, CI and ini hardening by @mfuntowicz in https://github.com/ggml-org/Llama-Windows/pull/117
    - fix(publish): stop shipping trimmed zip builds by @mfuntowicz in https://github.com/ggml-org/Llama-Windows/pull/118
    - Fix/dict race and uri validation by @mfuntowicz in https://github.com/ggml-org/Llama-Windows/pull/119
    - perf(json): source-generate every DTO serializer; single-pass settings load by @mfuntowicz in https://github.com/ggml-org/Llama-Windows/pull/120
    - perf(publish): trim the zip builds — blockers fixed, IL gate enforced by @mfuntowicz in https://github.com/ggml-org/Llama-Windows/pull/122
    - perf(deps): drop the WinAppSDK metapackage — 52 MB of unused shell/ML runtime by @mfuntowicz in https://github.com/ggml-org/Llama-Windows/pull/123
    - chore(manifest): drop the stale mp:PhoneIdentity element by @mfuntowicz in https://github.com/ggml-org/Llama-Windows/pull/124
    - feat(store): publish to the Microsoft Store from GitHub Releases by @mfuntowicz in https://github.com/ggml-org/Llama-Windows/pull/125
    - Improve model loading error surface by @mfuntowicz in https://github.com/ggml-org/Llama-Windows/pull/127
    - Enrolled folder live updates by @mfuntowicz in https://github.com/ggml-org/Llama-Windows/pull/129
    - fix(zombies): delete leftover import artifacts — the source of undeletable rows by @mfuntowicz in https://github.com/ggml-org/Llama-Windows/pull/130
    Full Changelog: https://github.com/ggml-org/Llama-Windows/compare/v0.12.0...v0.13.0
