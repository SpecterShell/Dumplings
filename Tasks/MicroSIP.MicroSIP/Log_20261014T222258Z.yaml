Version: 3.22.19
Installer:
- InstallerUrl: https://www.microsip.org/download/MicroSIP-3.22.19.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - improved DTMF tone playback handling
    - do not play DTMF tones locally during calls
    - fixed an issue that caused microphone audio to be muted
    - fixed outgoing calls where P-Asserted-Identity (PAI) replaced the originally dialed extension
    - added P-Asserted-Identity (PAI) to the technical information displayed in Call Manager for outgoing calls
    - improved call setup and call state display
    - improved timer resolution handling to reduce unnecessary use of 1 ms timers
    - fixed keyboard shortcuts not working while the application menu was open
    - added detection of memory corruption caused by faulty audio devices or drivers; some problematic audio devices may no longer work with MicroSIP
    - improved stability in certain use cases
ReleaseTime: 2026-10-03
