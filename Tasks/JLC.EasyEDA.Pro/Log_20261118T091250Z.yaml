  InstallerUrl: https://image.easyeda.com/files/easyeda-pro-windows-x64-4.1.105.exe
- Architecture: x86
  InstallerUrl: https://image.easyeda.com/files/easyeda-pro-windows-ia32-4.1.105.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Schematic
    New / Improved
    - Support for multiple symbols and multiple devices
    - The "Device" property can be changed to a text-form value
    - Support for dragging and dropping or placing symbols directly onto the canvas
    - Support for a schematic circuit calculator
    - Support for quickly locating components, the origin, and coordinate points
    - Support for the swap function on extended objects
    - Support for directly editing reusable module symbols on the schematic
    - Support for converting non-electrical symbols to the PCB
    - Support for customizing the format and increment method of designators
    - Support for copying the currently selected circuit area as an image
    - Support for multi-level classification (hierarchical management of the library directory structure)
    - Support for design rule checking of symbol libraries
    - Support for viewing and comparing symbol version history
    - Place devices, symbols, and footprints that are pending update
    - Added multiple-grid and coordinate axis settings, and added transparency adjustment
    - PDF export supports exporting custom pages
    - Optimized interaction details such as grid and snapping during schematic editing
    - Press Tab while placing a component to quickly edit its value and footprint
    - Support for placing devices (symbols and footprints) that are pending update
    - Support for parameter presets for placed primitives (such as default font and color)
    - Place wire junctions
    PCB
    New / Improved
    - Support for multiple footprints and text footprints (PCB footprint management)
    - Support for FPGA pin swapping (adjusted during PCB placement)
    - Support for a PCB circuit calculator
    - Support for setting custom colors by primitive type (PCB layer display)
    - Added sketch-based semi-automatic placement (interactive placement assistance)
    - Added sketch-based semi-automatic routing (interactive routing assistance)
    - Support for rounded-rectangle slotted pad holes (new hole shape)
    - Support for board combining (special panelization)
    - Support for signal length matching by time and by logic (timing matching)
    - Support for component height checking within constraint areas (mechanical constraints)
    - Support for automatic designator silkscreen placement (automatic designator arrangement)
    - Added calculation of board area and exposed copper area (manufacturing assistance)
    - Footprints support PDF export (footprint documentation)
    - Support for importing coordinate files to automatically place components (automatic placement from external data)
    - Support for batch-aligning vias/mounting holes with the center points of components (precise positioning)
    - Support for setting pad sizes per layer (flexible pad design)
    - Support for showing/hiding specified primitive types on the current layer (enhanced layer management)
    - Support for placing footprint libraries onto the canvas (drag and drop directly from the library)
    - When placing footprints and converting a schematic to a PCB, automatically add or merge custom layers in the footprint
    - Support for drawing 3D body primitives (3D modeling capability)
    - Support for design rule checking of footprint libraries
    - Support for viewing and comparing footprint version history
    - Autorouting now displays multiple iterations, with overall routing algorithm optimization
    - Arc push-and-shove around obstacles and joint stretching of lines and arcs (interactive editing optimization)
    - Auto differential pairs support multi-selection and a mid-match mode (differential pair setting optimization)
    - Grouping of differential pairs and net classes, with support for batch rule setting (rule management optimization)
    - Distance measurement supports temporarily retaining multiple measurement results (measurement tool enhancement)
    - Support for automatic lossless compression when importing images (PCB image import optimization)
    System Function Modules
    New / Improved
    - Categories are now stored as text, with support for multi-level classification
    - Support for exporting a BOM preview and calculating BOM unit prices and total prices
    - Panels can be dragged anywhere and docked to the sides (new UI interaction)
    - Support for workspace switching and migration, and multi-select operations for projects
    - A default panel is automatically created when creating a new project
    - Common dialogs (such as Settings and Export) remember the last entered values
    - The language setting has been moved into the unified "Settings" dialog
    - The client supports CLI. EasyEDA CLI
    - Support for ray-traced 3D preview
    Others
    New / Improved
    - Support for automatic lossless compression when importing images (reduces project size)
    - Added symbol pin text-property primitives (API extension for external scripts to read and write the text display properties on pins)
    - Support for setting library files to read-only mode (prevents accidental modification)
    - Added LCSC / JLCPCB price, stock, popularity, and production-line attribute fields (facilitates procurement and part selection)
    - New device: four-channel oscilloscope (simulation waveform observation)
    - Support for exporting DISA-format simulation netlists (for integration with third-party simulation tools)
    - The simulation engine has been refactored into a plug-in architecture (facilitates independent upgrades and replacement)
    - Education workspace: exam projects now support submitting the exam early
    - Education workspace: creating a new exam now supports uploading an exam project template
    - Optimized so that the auto-routing and auto-designator placement buttons are grayed out in exam projects
ReleaseTime: 2026-11-18
