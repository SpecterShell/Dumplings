Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Schematic
    - Fixed the issue where selecting a net wire in the schematic could not highlight the net.
    - Fixed the issue where modifying pin length in the symbol editor moved the pin name.
    - Fixed the issue where placing a multi-part device symbol did not automatically assign a reference designator.
    - Fixed the issue where multi-part device reference designators were assigned incorrectly.
    - Fixed the issue where pins and other primitives could not be placed and symbols could not be edited in the symbol editor.
    - Fixed the issue where setting the net name font size to default and saving reverted the font size after reopening.
    - Fixed the issue where applying an attached drawing caused the schematic to freeze.
    - Fixed the issue where exporting PNG and SVG caused tables to disappear.
    - Fixed the issue where copying a schematic across projects and pasting it under a board lost the schematic name.
    - Fixed the issue where deleting a wire could not be restored through project history.
    - Fixed the issue where exporting BOM with a custom template misaligned data.
    - Fixed the issue where exporting BOM for SMT material preparation caused missing devices on the ordering platform.
    - Fixed the issue where DRC did not detect missing footprints.
      PCB
    - Fixed the issue where updating library device footprints in semi-offline mode caused memory exhaustion and freezing.
    - Fixed the issue where vias connected by wires still showed ratsnest.
    - Fixed the issue where exporting Gerber failed.
    - Fixed the issue where enabling auto copper pour caused the progress bar to stick at 50% after schematic changes were applied to PCB.
    - Fixed the issue where wires with unconnected endpoints could not add teardrops.
    - Fixed the issue where V4 auto-routing rate was low.
    - Fixed the issue where auto-routing progress stuck at 5%.
    - Fixed the issue where opening PCB kept loading at the progress bar.
    - Fixed the issue where a PCB with properly designed nets opened with some pads changed to net A17.
    - Fixed the issue where importing a project into an existing project changed pad nets.
    - Fixed the issue where exporting a solder mask polygon filled area to Gerber produced incorrect content.
    - Fixed the issue where colored silkscreen Gerber could not be exported.
    - Fixed the issue where custom Gerber export checked mirror for all layers but the mark point layer and drill table layer were not mirrored.
    - Fixed the issue where multi-selecting component footprints and pads for matrix distribution produced incorrect distribution.
    - Fixed the issue where historical copper and current copper could overlap in multi-user collaboration.
    - Fixed the issue where 3D preview showed incorrect thickness.
    - Fixed the issue where exporting a 3D model stuck at the progress bar and could not export.
    - Fixed the issue where exporting a 3D shell file produced empty content.
    - Fixed the issue where pads of bottom-layer devices could not find board holes.
      Format Conversion
    - Fixed the issue where importing an Ltspice schematic failed.
    - Fixed the issue where exporting an Altium symbol produced an incorrect .schdoc file name.
    - Fixed the issue where importing an AD file flipped device symbols by 180 degrees.
    - Fixed the issue where importing a single-layer AD file added only one copper layer and lacked dielectric layers.
    - Fixed the issue where importing an AD file changed an oval pad into a square pad.
    - Fixed the issue where exporting AD lost copper fill for grid-type copper with grid spacing 0.
    - Fixed the issue where importing an Altium schematic bound some components to incorrect footprints.
    - Fixed the issue where importing an Altium compressed schematic and PCB package did not bind schematic components to corresponding PCB footprints.
    - Fixed the issue where importing OrCad lost a large number of sheets.
    - Fixed the issue where importing PADS showed a conversion exception with decoding-error.
    - Fixed the issue where importing Protel caused copper pour to disappear.
    - Fixed the issue where importing a PROTEL99SE file lost copper pour fill.
    - Fixed the issue where exporting a PADS symbol made the reference designator font size very small.
    - Fixed the issue where exporting Altium reversed text was not reversed.
    - Fixed the issue where exporting Altium changed pad orientation.
      Other
    - Fixed the issue where an eprj project could not be opened and reported failure to obtain historical project data.
    - Fixed the issue where opening an eprj2 project stuck at 98%.
    - Fixed the issue where opening a project stuck at 66%.
    - Fixed the issue where saving a project as another project stuck at 50%.
    - Fixed the issue where saving an engineering library device as a team device library prevented the footprint manager from opening from the symbol editor.
    - Fixed the issue where deleting an engineering library generated abnormal data and caused PCB copy failure.
    - Fixed the issue where device standardization showed detail data does not exist after placing devices.
    - Fixed the issue where the new board and schematic menus were not grayed out after locking a project.
    - Fixed the issue where after locking a project, right-clicking the project level changed the secondary menu Delete to Exit.
    - Fixed the issue where personal bottom panel configuration was not applied when opening another project in another window.
    - Fixed the issue where Chinese mode translated the layer name Power into 功率.
    - Fixed the issue where when backup count reached the maximum, creating a new backup automatically deleted old backups.
    - Fixed the issue where sliding the left tree in a multi-board project was laggy.
    - Fixed the issue where the extraction rule book extraction wizard failed when extracting by page.
    - Fixed the issue where Firefox browser failed to open the professional online editor.
    - Fixed the issue where exporting a 3D model caused the editor to white screen.
ReleaseTime: 2026-10-12
