  Key: ReleaseNotes
  Value: |-
    Bug Fixes
    - Translate selected text even when the original clipboard cannot be restored. The selected text may remain available to paste. - by @doyuli in #77 (91f9c)
    - Keep reading the selection while you scroll, and discard pending results if you switch windows. - by @doyuli in #77 (91f9c)
    - Show a brief hint in the active translation mode when selected text cannot be read. - by @doyuli in #77 (91f9c)
    Performance
    - Reduce the Windows clipboard wait after simulated copy from two seconds to one. - by @doyuli in #77 (91f9c)
    Other Changes
    - Make the outlined Windows tray icon easier to see. - by @doyuli in #78 (fa4a4)
    - License Sotto under GPL-3.0-only and include the license in release packages. - by @doyuli in #76 (6a09a)
