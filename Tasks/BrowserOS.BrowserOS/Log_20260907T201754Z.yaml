  Key: ReleaseNotes
  Value: |-
    ✨ What's new
    - A simpler BrowserOS agent. We've redesigned the agent experience to make it easier to use, with a cleaner interface and more straightforward setup. Your conversation now follows you across the tabs the agent works in.
    - Better support for your AI provider. Improved compatibility across supported providers, including OpenAI, Anthropic, Google, and OpenRouter. Model selection and reasoning settings now better reflect what each model supports, with clearer error messages when something goes wrong.
    - A much lighter agent extension. We cut the unpacked extension size by 86%, from 42.93 MB to 6.02 MB, so there's much less for the browser to unpack at startup.
    - Chromium 151. Updated to Chromium 151.0.7922.137, bringing upstream security fixes and browser improvements.
    Also changed: Voice input has been removed in this release.
