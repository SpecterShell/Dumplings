  Key: ReleaseNotes
  Value: |-
    日期：2026 年 7 月 28 日
    - 优化来电前转至语音信箱功能：仅当分机已启用 语音信箱 时 (路径：设置 > 语音信箱 > 启用语音信箱)，来电窗口中才会显示 (发送到语言信箱) 按钮。
    - 修复以下通知问题：
      - 当内部聊天收到新消息时，未能收到弹窗通知。
      - Linkus 客户端正常运行且网络连接良好，但仍频繁弹出 连接错误 的通知。
    - 修复外部应用程序集成问题：集成用于来电弹屏的外部应用程序后，收到来电时，外部应用程序未能自动启动。
    - 修复通话问题：当使用域名登录 Linkus 客户端时，通话无声。
    - 修复 拨号键盘 中的号码粘贴问题：在通话过程中将号码粘贴到拨号键盘的输入框中时，内容被粘贴两次。例如，粘贴 1234，结果显示 12341234。
    - 修复 CTI 模式问题：设置 Linkus 桌面端以控制 Linkus 手机端后，通过 Linkus 桌面端发起呼叫时，点击 Linkus 手机端上的应答按钮，无法建立通话。
