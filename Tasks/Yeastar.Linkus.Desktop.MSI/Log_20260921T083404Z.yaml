  Value: |-
    日期：2026 年 9 月 21 日
    - 新增界面语言 克罗地亚语 (Croatian)、塞尔维亚语 (Serbian) 和 斯洛文尼亚语 (Slovenian)。
    - 修复客户端开机启动问题：如果 Linkus 客户端启用了 开机启动，电脑开机时，客户端自启但界面白屏且无法使用。
    - 修复证书问题：客户端的自签名证书已过期，无法与 PBX 建立安全连接。
    - 修复界面显示问题：将客户端语言切换为 德语 (German) 后，客户端界面与通话窗口 UI 布局过于密集。
    - 修复客户端窗口显示问题：从聊天消息通知弹窗打开 Linkus 客户端时，客户端窗口的大小和位置未与上一次关闭客户端时的状态保持一致。
    - 修复通话控制问题：通过耳机按键挂断外呼通话后，在下一通外呼的响铃阶段，无法再使用该耳机按键挂断呼叫。
