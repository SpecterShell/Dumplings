Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - New "Speech rate" setting in Settings → Speech lets you choose how fast text is read aloud, with a sample you can play to hear the difference
    - Speaking Practice has more playback speeds to choose from, including more slow ones
    - Fixed shortcuts not saving when one of them was already used by another app; now only that shortcut shows a warning
    - Fixed a new shortcut sometimes being saved with only part of the keys you pressed
    - Fixed shortcuts that use the L or R key showing up as "Left" or "Right"
    - "Manage / customize" in the translation engine list now opens your engine settings instead of the pricing page
    - Fixed custom translation engines that use a newly released model (such as Gemini 3.5 Flash Lite) showing "This engine's model isn't recognised", even though they worked in the browser extension
    - Windows: fixed "Launch at login" sometimes not opening the app
