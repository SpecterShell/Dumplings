Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - New "Image Translate": press Option-Command-G on Mac or Alt+Shift+G on Windows, select a screen region, and the translation appears right over the original text, in place. Click a block to flip it back, switch the target language or engine from the toolbar, pin the window to keep it open, and download the original or translated image. On Mac, hold Option to peek at the original. Requires an account; the shortcut can be changed in Settings > Translate
    - Mac: menu bar menu icons are back on macOS 27
    - Word card: tap the US / UK circle next to the phonetics to switch between American and British pronunciation, and pick which one shows first with the new "Default phonetics" setting in Settings > Translate
    - Words without phonetic symbols, such as "idempotency", now have a speaker button in the word card so you can still hear them
    - Word pronunciation switches to another voice when the audio is slow to load, and no longer plays twice when you click quickly
    - Text in AI Dictionary can now be selected and copied, and selecting a word or sentence inside it no longer closes the window when it isn't pinned
    - Fixed Smart Translate sometimes picking up the wrong word from web pages in Chrome
    - Clicking Trancy Air in the Dock, Launchpad or Spotlight while it is running now opens Settings instead of doing nothing. On Windows, opening Trancy Air again from its shortcut or the Start menu does the same
    - Mac: opening Settings or Onboarding while another app is in full screen, from the Dock or from Preferences in the menu bar, now takes you to the window instead of leaving you on the full-screen app
    - Fixed colors showing half light, half dark after your system switched between light and dark mode
    - Right-clicking inside Trancy Air no longer shows an unrelated web page menu; text fields still offer Copy and Paste
    - Windows: a single press of the Windows key opens the Start menu again when Voice Translate is set to a double press of the Windows key. The menu opens after a short pause
    - Windows: fixed signing in from the browser sometimes not completing in Trancy Air
    - Windows: Voice Transcribe and Voice Translate now type straight into the WeChat message box instead of only copying the text
