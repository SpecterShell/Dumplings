Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - New "Word lookup" setting in Settings > Translate: choose whether the Smart Translate shortcut shows the small word card or opens AI Dictionary straight away. AI Dictionary needs an account, and falls back to the word card when you are signed out or have used up your daily allowance
    - Word lookups now use the base form of an English word, so plurals, past tenses and comparatives such as "steps" or "went" finally show pronunciation
    - Saving a word saves its base form, so "steps" and "step" are one entry, the same one you see in the browser extension
    - Word meanings now show the form you looked up, such as "plural noun" or "past tense"
    - In AI Dictionary, the word stays in place at the top while the rest of the page scrolls
    - Fixed short text in your own language being left untranslated by Silent Translate when it uses accented letters, such as "Cảm ơn bạn" in Vietnamese
    - Fixed accented text copied from a PDF or typed with some keyboards not being recognized as the right language
    - Fixed the Feedback window not accepting files dragged onto it
