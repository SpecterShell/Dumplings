Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Notable Changes
    - Updated 7-zip and UnRAR libraries to fix vulnerabilities.
    - Windows: Fixed hang when launching more than ~64 comparisons at once.
    - Various minor improvements.
    Appearance
    - Fixed About dialog clipping descenders on various labels when scaling.
    File Views
    - Windows: Fixed hang when launching more than ~64 comparisons at once.
    - Fixed "Open File Using Profile" to keep button panel at the bottom.
    Folder Compare
    - Fixed Folder Compare sorted column marker not showing when the comparison is first opened.
    Misc
    - Pressing [Esc] in a search edit (Home view or Options dialog) while it has contents will now clear the search rather than closing the view/dialog.
    - macOS: Fixed double clicking on window titlebar to not-unzoom when System Settings > Desktop & Dock > Window title bar double click action is set to Fill.
    - macOS: Fixed Window > Zoom not unzooming if the window is already maximized.
    Third Party Libraries
    - Updated to 7-zip 26.06.
    - Updated UnRAR.dll to v7.30.2 and UnRAR source to v7.3.2.
ReleaseTime: 2026-11-10
