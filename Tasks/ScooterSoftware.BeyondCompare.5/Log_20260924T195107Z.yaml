Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Notable Changes
    - General polish, stability improvements, and vulnerability fixes.
    Cloud Services
    - Windows: MIME types for uploaded files are determined from the system database instead of a custom mime.types file.
    Command Line
    - Linux: Fixed command injection vulnerability in launcher script. Found by Vulcanix using GLM from Z.AI.
    Installer
    - Windows: Uninstaller now only removes the "ExePath" and "Version" registry values under the version-agnostic "Software\Scooter Software\Beyond Compare" if they match the version that's being uninstalled.
    Misc
    - Linux: Fixed Help showing incorrectly or blank when the system web browser runs in a sandbox.
    Text Compare
    - Fixed "Align with Marked" when mouse is released over gutter.
    Third Party Libraries
    - Updated 7-zip to 26.03. Fixes CVE-2026-58052.
    Crashes
    - Fixed Text Views crash when un-indenting a block of text.
    - Fixed Table Compare crash when mouse is released over column header during "Align With"
    - macOS: Fixed crash when opening Check for Updates dialog.
ReleaseTime: 2026-09-24
