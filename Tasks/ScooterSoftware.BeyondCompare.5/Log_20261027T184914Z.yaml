Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Notable Changes
    - Updated 7-zip to v26.04 to fix vulnerabilities.
    - General improvements and polish.
    Folder Compare
    - Tab stop added to Log panel in Folder Compare. Tab stop added to listbox in Folder Compare's Legend dialog.
    Home View
    - macOS/Linux: Fixed ⌘F (macOS) and Ctrl+F (Linux) not setting focus to the session tree search edit.
    Misc
    - macOS: Fixed double clicking on window title bars to follow the System Settings > Desktop & Dock > Window title bar double-click action setting and minimize, zoom, or do nothing as appropriate.
    - macOS: Added ⌘I shortcut for Session > Info and ⌘0 shortcut for Reset Display Font Size.
    Table Compare
    - Fixed Align with Marked when mouse is released anywhere.
    Third Party Libraries
    - Updated 7-zip to v26.04.
    - Updated Delphi to v13.2.
ReleaseTime: 2026-10-27
