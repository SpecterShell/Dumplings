  Key: ReleaseNotes
  Value: |-
    🎉 DSH Agent v1.3.0
    重点版本：首次启动全自动引导 + 任务完成通知 + 界面插件全家桶 + 主题联动。
    DeepSeek Harness 桌面客户端 v1.3.0 是一次里程碑式更新——从「依赖用户手动准备环境」进化到「开箱即用」：首次启动自动完成 Node.js / dsh / 界面插件的准备与安装，之后双击即用。

    🚀 新功能
    🌱 首次启动全自动引导
    - 9 阶段引导流水线：检查 Node.js → 下载便携版 → 检查/安装 dsh → 初始化配置 → 安装界面插件 → 校验挂载 → 启动服务 → 等待就绪
    - Node.js 版本闸门：精确匹配 ^22.19.0 || >=24.0.0（拒绝 23.x），系统缺失或版本不符时自动下载便携版
    - 便携版下载可靠性：镜像源实测测速排序（阿里云/清华/官方）+ SHA256 校验和官方独立获取（防镜像投毒）+ 断点续传 + 原子解压
    - dsh / pnpm 自动安装：缺失时经镜像源降级安装，不污染全局 npm 配置
    - 启动向导式引导页：单步聚焦展示当前进度（图标 + 整体进度条 + 实时日志），二次启动毫秒级通过，几乎无感
    🔔 任务完成通知
    - 监听 dsh 任务活动，任务完成时弹出系统通知 + 托盘图标闪烁 + 任务栏闪烁
    - 窗口在前台时不打扰；通知开关持久化（关于页可关）
    🧩 界面插件全家桶
    - 插件市场新增**「界面插件全家桶」卡片**：一键安装 dsh-web-ui-all（鲸鱼娘 / 任务看板 / 皮肤中心 / Git 图谱 / 右侧面板）
    - 安装完成自动自检挂载（顶层包 + dsh bundle 凭据双重验证），状态异常可一键修复
    - 装不上不阻断使用：DSH 本体可正常运行，缺的只是界面插件
    🎨 主题联动
    - 导航栏新增三态主题控件（浅色 / 深色 / 跟随系统）
    - 与 dsh 外观配置双向同步：外壳切换即写入 dsh 设置，dsh 里改的外壳下次启动跟随

    ✨ 体验改进
    - 托盘常驻：关闭窗口驻留托盘，dsh 后台继续运行；关闭行为三选（退出 / 最小化到托盘 / 取消）可记忆
    - 单实例：重复启动唤起已有窗口
    - 导航栏图标化：四个页签改为图标占位，激活时展开文字；状态指示升级为图标 + 颜色 pill
    - 视图切换动画：页面切换淡入淡出，不再闪屏
    - 环境页重构：dsh 更新独立卡片、需处理项红/橙描边高亮、信息密度统一
    - 引导页现代化：现代中文字体方案（微软雅黑/苹方/思源黑体），告别宋体点阵

    🔧 稳定性
    - 防白屏：窗口前端就绪后显示 + 4 秒强制显示兜底
    - dsh 设置写锁残留自动清理（崩溃/强杀后设置不再保存失败）
    - 安装引导启动失败根因修复（RedirectionGuard 拦截符号链接 → 经桌面 shell 转交启动）
