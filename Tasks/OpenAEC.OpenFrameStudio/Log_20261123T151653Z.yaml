  Key: ReleaseNotes
  Value: |-
    Kijkkubus en 3D-aanzichten
    Klik op een vlak, rand of hoek van de kijkkubus om het kozijn vanuit één van 26 richtingen te bekijken. Binnen en Buiten volgen de werkelijke zijden van het kozijn. Bij het draaien blijven het draaipunt en de zoom behouden. Voor het vergelijken van profielaanzichten kun je overschakelen naar orthografische projectie. De thuisknop brengt het hele kozijn terug in beeld.
    IFC-controle bij releases
    Open BIM Suite toetst de onderdelen-IFC van twee houten proefkozijnen vóór en na een revisie. De controle verifieert de ruitklasse IfcWindow, de eigenschap CPset_31.Onderdeel = Ruit en het behoud van de bestaande GlobalIds. De IFC-bestanden en testrapporten zijn beschikbaar als artifact ifc-ruitcontrole. GitHub-releasecheck
    Ronde en getoogde systeemkozijnen
    De tekening en de zaaglijst gebruiken de afzonderlijke T-profielen VEKA 102.310 en Reynaers 008.3113.XX. Bij een aansluiting op de boog toont de zaaglijst de geometrische kopmaten. Voor verbindingen waarvoor het fabrieksblad ontbreekt blijft de machinezaagmaat open. Bij de gedocumenteerde rechte VEKA-aansluiting zijn zichtmaat, afkortmaat en staafverbruik afzonderlijk terug te vinden.
    Installeren
    Gebruik op Windows de download die eindigt op _x64_user-setup.exe om de installatie voor de huidige gebruiker bij te werken. De variant _x64-setup.exe is voor installatie op de hele pc. Voor macOS is er een universele DMG en voor Linux een DEB en een AppImage.
    Docker (OpenAEC SuperCloud)
    The tested desktop image is ghcr.io/openaec-foundation/open-frame-studio:2026.48.0 (digest sha256:c79e6576bac740a672312cbf49e1cac1667a1eaa4e6ff56d17cb5489ed14ff65). Idle container memory: 300.7MiB. Run it behind an authenticated proxy; port 3000 has no built-in sign-in. The image SBOM is attached to this release.
