  Key: ReleaseNotes
  Value: |-
    Nieuw in v2026.47.1
    - Kunststof en aluminium kozijnen gebruiken de vleugelmaten, aanslag en dichtingsniveaus van het gekozen profielsysteem, ook bij ronde en getoogde kozijnen. In de 3D-viewer maakt Doorsnede de aansluiting zichtbaar.
    - Een los aanslagprofiel tegen de dagkant krijgt eigen regels in de kortlijst, inclusief booglengtes en zaaghoeken. De kozijneigenschappen tonen de buitenmaat inclusief aanslag.
    - Het hang- en sluitwerk volgt de openingswijze en de montageruimte per vleugel. Bij spiegelen blijven handmatige aantallen en krukhoogte behouden. Scharen en loopwagens blijven aanwezig wanneer je de krukhoogte wijzigt.
    - De beslaglijst en rubberlijst vermelden de stukreferenties per vleugel. Deze verwijzingen komen ook terug in de PDF-, Excel- en CSV-uitvoer.
    Lokaal installeren
    Voor je eigen Windows-account open je de Windows x64-gebruikersinstaller. Hiervoor zijn geen administratorrechten nodig. Voor alle gebruikers is er een afzonderlijke systeeminstaller. De release bevat ook een universele macOS-DMG en pakketten voor Linux.
    De maatvoering en beslagposities zijn bedoeld voor ontwerp en BIM-uitwisseling. Gebruik de gegevens van de leverancier voor boorpatronen, exacte rubbergroeven en bewerkingstoeslagen. Toepassingsgebied en releasecontroles
    De repository vermeldt CC BY-SA 4.0 in LICENSE en AGPL-3.0 in de Cargo- en UI-metadata. Licentievermeldingen
    Docker (OpenAEC SuperCloud)
    The tested desktop image is ghcr.io/openaec-foundation/open-frame-studio:2026.47.1 (digest sha256:98b547c6fabb326352b6949af880267c805bee239154e3a1ef91dd707b32e91d). Idle container memory: 300MiB. Run it behind an authenticated proxy; port 3000 has no built-in sign-in. The image SBOM is attached to this release.
