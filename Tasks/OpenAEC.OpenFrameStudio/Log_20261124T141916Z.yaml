  Key: ReleaseNotes
  Value: |-
    Wat is er nieuw?
    De 2D-editor tekent een spouwlat van 121 × 33 mm met 33 mm uitsteek in het vooraanzicht. De maat van 121 mm loopt in de diepte. De gestippelde buitenlijnen sluiten op elkaar aan waar twee latten bij een hoek samenkomen.
    De A3-werkplaatstekening vermeldt de buitenmaten, houtbreedtes, vrije vakmaten en de hartmaten van het tussenhout. Op het voorbeeldblad van K01 kun je de tussenstijl uitzetten op 1.050 mm vanaf links en de tussenregel op 535 mm vanaf onder.
    Demofilm
    De film volgt het ontwerp van een kozijn tot de afdruk voor de werkplaats. Rond 1:29 zie je de doorsnede met spouwlat en rond 3:50 de maatvoering op het A3-blad. De film duurt 4:10 en heeft een Nederlandse vrouwenstem en inschakelbare Nederlandse ondertiteling. Download Open Frame Studio in 4K (MP4, 56 MB)
    Installeren
    Kies op Windows de installer met _x64_user-setup.exe voor je eigen account of _x64-setup.exe voor de hele pc. De universele DMG is geschikt voor Intel- en Apple Silicon-Macs. Voor Linux zijn onder andere een DEB en een AppImage beschikbaar.
    Beide Windows-installers hebben een geldige Authenticode-handtekening van Impertio Studio B.V. met een Microsoft-tijdstempel. De hoofdapp uit de gebruikersinstaller van deze versie is ongetekend. Ondertekening en vervolgwerk
    Open Frame Studio is bedoeld voor ontwerp- en BIM-uitwisselproeven. Functionele scope en releasecontroles
    Docker (OpenAEC SuperCloud)
    The tested desktop image is ghcr.io/openaec-foundation/open-frame-studio:2026.48.4 (digest sha256:9daef291e3b3317f3634c3ed929ee5cd89197c9942309bbf213bae5729878396). Idle container memory: 384MiB. Run it behind an authenticated proxy; port 3000 has no built-in sign-in. The image SBOM is attached to this release.
