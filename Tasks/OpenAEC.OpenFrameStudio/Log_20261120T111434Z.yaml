  Value: |-
    Open Frame Studio v2026.47.2
    Parametric window frame design software for the construction industry.
    Downloads
    - Windows (System): Download the *_x64-setup.exe installer (requires admin)
    - Windows (User): Download the *_x64_user-setup.exe installer (no admin required)
    - macOS: Download the .dmg file (universal — supports Intel and Apple Silicon)
    - Linux: Download the .deb package or .AppImage
    Features
    - Parametric window frame design with grid editor
    - IFC / DXF / PDF / glTF export
    - Profile database (wood, PVC, aluminum)
    - Production lists & cost calculation
    - Blender/Bonsai integration
    - Multi-language (NL / EN / DE)
    Docker (OpenAEC SuperCloud)
    The tested desktop image is ghcr.io/openaec-foundation/open-frame-studio:2026.47.2 (digest sha256:9f5ceecef9014d7d7b09a9918fd775e72699e4f2a3f1be61a69a4d224730fe08). Idle container memory: 298.9MiB. Run it behind an authenticated proxy; port 3000 has no built-in sign-in. The image SBOM is attached to this release.
