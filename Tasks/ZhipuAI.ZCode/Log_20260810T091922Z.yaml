Version: 3.7.5
Installer:
- Architecture: x64
  InstallerUrl: https://cdn-zcode.z.ai/zcode/electron/releases/3.7.5/windows-x64/ZCode-3.7.5-win-x64.exe
Locale:
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新功能
    - 记忆页支持按项目浏览，并可在设置中查看项目记忆。
    - 任务工作台支持按分组拆分。
    - 支持通过 @ 引用插件、文件和会话。
    - 闲时任务支持使用配置了自定义模型的子智能体。
    - 自动化任务支持自定义分钟间隔。
    - 子智能体新增思考强度设置。
    问题修复
    - 优化记忆页导航、图标、操作布局和预览稳定性。
    - 修复对话跳转在历史变化后的定位问题。
    - 修复项目任务分组拖拽的预览和定位问题。
    - 优化状态面板、对话区和长标题在不同窗口尺寸下的显示。
    - 提升搜索历史、时间戳、工作时长和提示文字的可读性。
    - 优化文档、演示文稿和文件预览的显示与刷新。
    - 修复图片附件缓存导致预览异常的问题。
    - 修复自动化任务模型和目标显示异常。
    - 修复排队消息可能乱序或提前发送的问题。
    - 修复切换运行环境后模型选择丢失的问题。
    - 修复远程工作区重连时会话空白或丢失。
ReleaseTime: 2026-08-10T08:44:58.5940000Z
