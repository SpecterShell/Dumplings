- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新功能
    - 插件商店会按登录地区展示对应的插件
    - 配置服务不可用时，工作流功能默认仍可按需启用
    - 文档、表格、演示等插件不再执行额外的视觉验收步骤
    问题修复
    - 修复某些情况下会话启动长时间卡住无响应的问题
    - 修复切换模型或服务商后对话上下文偶发丢失的问题
    - 归档永久删除前的检查改为按批进行，更快并兼容旧版本
    - 按需加载工作流技能时，会提示发送 /workflow 启用相关工具
    - 自动化“立即运行”出错时给出更具体的提示
    - 报错详情不再把普通文本误识别为服务商错误码
    - 修复旧 shell 模式下 adb 命令解析出错的问题
