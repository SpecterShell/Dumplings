Version: 3.10.1
Installer:
- Architecture: x64
  InstallerUrl: https://cdn-zcode.z.ai/zcode/electron/releases/3.10.1/windows-x64/ZCode-3.10.1-win-x64.exe
Locale:
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新功能
    - 新增 Weekend Plan 免费提前领取，可邀请好友一起来领
    - 提示词模板引用的插件支持一键安装，进度提示更清晰
    - 输入框菜单新增技能快捷入口
    - 思考轨迹支持内容搜索，记录更完整并默认展开
    - MCP 服务器支持配置协议版本，协商失败时有引导提示
    - 编辑后的消息支持立即发送，无需排队等待
    - 对话回合结束时可查看执行摘要与耗时
    - 设置中「浏览器」菜单更名为「浏览器控制」
    问题修复
    - 优化登录授权流程，修复偶发回调失败的问题
    - 修复偶现的 mcp oauth 失败问题
    - 模型回复偶发中断或空白时，现在会自动重试
    - 修复出错后排队消息丢失、中断任务状态显示错误的问题
    - 统一工具执行状态文案，思考过程标签更简洁清晰
    - 修复任务操作提示被裁剪、触屏下任务信息错乱的问题
    - 打开任务时间线后未读标记会立即清除
    - 提高长文本粘贴转附件的阈值，减少误转换
    - 修复单个波浪线被误显示为删除线的问题
    - 切换侧边栏时输入框不再丢失焦点
    - 输入框引用与命令菜单显示更清晰，搜索不再反复重试
    - 修复工作区多个技能目录无法同时/列出的问题
    - 修复部分插件技能无法识别、名称显示不一致的问题
    - 用量统计默认展示近七天，图表与数值标注更清晰
    - 修复 Windows 下后台进程退出后残留的问题
    - 修复 Computer Use 在 macOS 与远程工作区下的多处异常
    - 提升浏览器控制会话稳定性，页面脚本执行更符合预期
    - 修复移动端远程界面菜单超出屏幕的问题
    - 修复套餐过期后模型状态显示异常的问题
    - 修复任务运行期间修改模型配置的报错问题
ReleaseTime: 2026-08-28T06:46:22.5120000Z
