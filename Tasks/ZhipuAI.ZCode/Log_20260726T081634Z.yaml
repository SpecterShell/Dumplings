  Key: ReleaseNotes
  Value: |-
    新功能
    - 新增内置网页应用集成，常用网页可直接在应用中打开使用。
    - 新增 PDF 预览，支持点击查看和顺畅缩放。
    - 新增统一外观设置，界面样式更集中好找。
    - 新增插件市场图标展示，浏览和识别更直观。
    - 新增仓库知识库目录与示意图生成，内容更完整。
    - 改进大文件读取，打开大文件更稳定。
    - 优化设置页布局，相关选项分组更清晰。
    问题修复
    - 修复浏览器截图和恢复问题，后台页面也能正常工作。
    - 修复 PDF 缩放闪烁和留白问题。
    - 修复子任务、会话恢复和编辑目标丢失问题。
    - 修复插件图标和概览加载阻塞问题。
    - 修复远程 WSL 退出、部署和恢复异常。
    - 修复 Windows 更新、关闭和清理过程中的卡顿与失败。
    - 修复模型上下文、令牌预算和流式重试问题。
    - 修复反馈草稿、并发提交和自动补选选项问题。
    - 修复本地化和语言显示问题，界面语言更一致。
    - 修复状态面板、待办和侧栏显示错位问题。
    - 修复桌面崩溃上报，便于更快定位问题。
