Version: 3.11.2
Installer:
- Architecture: x64
  InstallerUrl: https://cdn-zcode.z.ai/zcode/electron/releases/3.11.2/windows-x64/ZCode-3.11.2-win-x64.exe
Locale:
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新功能
    - 支持在对话中上传、读取和预览 PDF 文件
    - 支持预览对话中的图片、视频等媒体文件
    - 插件可按工作区单独安装
    - 插件有新版本时会显示提醒，可直接更新
    - 操作被拦截时会显示具体原因，方便处理
    - 侧边栏标签支持鼠标中键关闭，并记住各会话的显示状态
    - 草稿任务也支持通过侧边栏查看
    - 内置浏览器会记住上次打开的窗口尺寸
    - 内置浏览器中的本地文件链接支持以系统默认浏览器打开
    - 优化 Weekend/Global Plan 领取提醒，状态与到期信息展示更清晰
    问题修复
    - 对话进行中不再中途更换模型或丢失上下文
    - 上下文用量显示更准确，触屏设备也可点击查看
    - 修复远程重连后模型配置同步异常的问题
    - 改善远程工作区和 WSL 环境的连接与部署稳定性
    - 修复 SSH 连接或发送时偶发卡住的问题
    - 修复登录态过期、授权回调失败等登录问题
    - 修复官方 MCP 连接问题，失败提示更清晰
    - 官方插件加载超时或数据异常不再影响会话恢复
    - 修复插件菜单显示错乱，卸载不再被卡住
    - 修复 Windows 上电脑操作偶发无响应、任务被误重启的问题
    - 修复远程工作区中待确认操作不显示的问题
    - 对话生成过程中也能正常搜索内容
    - 命令输出过长时自动截断，避免界面卡顿
    - 修复仓库 Wiki 输出过长导致任务失败的问题
    - 修复文件路径和引用显示错误、无法跳转的问题
    - 修复打开会话时滚动位置不正确的问题
    - 调整用户消息的显示宽度，长内容更易读
    - 不再显示空的思考内容
    - 不同任务的浏览器窗口相互独立，互不干扰
    - 降低 Linux 大型工作区的文件监控资源占用
    - 修复 Linux 系统安装后被旧快捷方式遮挡的问题
    - 修复定时任务删除结果提示不准确的问题
