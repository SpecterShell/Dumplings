  Key: ReleaseNotes
  Value: |-
    新功能
    - 运行中的工作流可直接调整并发上限，无需停止任务。
    - 优化了工作流修改和重启时的复用逻辑。
    - 优化了大型工作流的实时状态显示。
    - 优化工作流脚本提交和修改效率，减少 token 消耗。
    问题修复
    - 修复了工作流在一些情况下导致界面崩溃的问题。
    - 修复了工作流卡片有时按钮会被挤出界面的问题。
    - 修复了工作流工具占用上下文过大的问题。
