Version: 3.17.2
Installer:
- Architecture: x64
  InstallerUrl: https://cdn-zcode.z.ai/zcode/electron/releases/3.17.2/windows-x64/ZCode-3.17.2-win-x64.exe
- Architecture: arm64
  InstallerUrl: https://cdn-zcode.z.ai/zcode/electron/releases/3.17.2/windows-arm64/ZCode-3.17.2-win-arm64.exe
Locale:
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新功能
    - 新增 ZCode Sites 官方插件，支持一键部署网站
    - 插件管理支持一键全部更新
    - 新增 Kimi K3.1 Pro、MiniMax M3.1 Flash 等模型配置项
    - 文档查看器按会话隔离，多个文档插件共用进程降低占用
    - 图片预览支持标注编辑并作为附件发送
    - 新增未读任务筛选
    - 设置页可批量管理项目，删除时可同时清理数据
    - 设置页统一远程数据同步功能
    - 远程设备改为紧凑的可搜索列表
    - 远程设备菜单支持停止、重启远端服务
    - 工作流因配额暂停后，配额重置时自动继续运行
    - Computer Use 新增多会话光标
    - 未安装 Node 的电脑上 MCP 服务器也能正常启动
    - 预览卡片整卡点击即可直接打开
    - 新增 MCP 配置界面（草稿版）
    - 文件卡片、正文链接和打开菜单支持「在 Finder/资源管理器中打开」并定位到文件
    问题修复
    - 配置文件损坏时不再被覆盖，避免数据丢失
    - 未打开项目时也能完成用户级数据迁移
    - 父子技能现在会一起同步，不再遗漏
    - 长对话的流式回复卡顿明显减少
    - 修复部分远程兼容性问题
    - 回复被安全策略拦截时快速报错，不再反复重试
    - 模型内置工具的调用过程和结果可完整显示
    - 无进展的重复执行会自动结束并提示
    - 错峰套餐到期后不再自动续费
    - Windows 窗口被其他程序遮挡后恢复正常显示
    - 删除项目后可正常新建任务
    - 修复 macOS 安装包丢失中英文语言资源的问题
    - 安装包体积明显减小
    - 浏览器附件链接不再被反复下载
    - 微信自动化任务的结果推送恢复正常
    - 修复会话切换与恢复时的归属问题，避免串到其他会话
    - 修复 Windows 64 位安装包可能混入不兼容组件的问题
    - 托盘图标不再显示未读红点，未读状态仍可在任务栏查看
    - 修复计划模式下可能放行高风险操作的问题
    - 子任务权限与主会话保持一致，计划模式下同样受限
    - 限制本地网页预览可访问的范围，提升安全性
    - MCP 启动失败时显示更具体的原因和解决办法
    - 收紧 MCP 设置检测权限，仅限已注册的工作区
    - 自定义命令中的脚本改为经权限确认后执行
    - 修复 Windows 上插件命令路径导致脚本出错的问题
    - 修复 Windows 上部分文件无法用默认应用打开的问题
    - 修复 macOS 上部分应用图标显示空白的问题
    - 修复产物卡片偶尔不刷新的问题
ReleaseTime: 2026-11-03T02:42:46.8930000Z
