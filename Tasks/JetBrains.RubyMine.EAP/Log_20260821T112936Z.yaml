    RubyMine 2026.2.2 Preview Is Out!
    Fixes and improvements:
    - Fixed an issue where a Git commit could still be created after being canceled: IJPL-242092
    - Added support for clickable OSC 8 hyperlinks in the Reworked Terminal: IJPL-246212
    - Added support for parallel steps in GitHub Actions workflows: IJPL-248486
    - Fixed IDE freezes when opening large Markdown files with soft wraps enabled: IJPL-250302
    - Fixed duplicated characters when accepting code completion suggestions in Remote Development: IJPL-252099
