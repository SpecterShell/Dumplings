  Value: |-
    RubyMine 2026.3 EAP 2 Is Out!
    Fixes and improvements:
    - Fixed Backspace behavior before Ruby heredoc terminators to prevent them from merging with the preceding line: RUBY-31304
    - Fixed endless code analysis caused by identical class_eval calls in multiple files: RUBY-35985
    - Fixed incorrect error highlighting for predicate keys in Ruby pattern matching: RUBY-33579
    - Added formatter support for the new rubocop:push and rubocop:pop directives: RUBY-36045
    - Added the ability to open files outside the project by entering their absolute path in Go to File: IJPL-220330
    For the full list of closed issues, refer to the release notes.
