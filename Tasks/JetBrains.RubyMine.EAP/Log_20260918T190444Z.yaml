  Key: ReleaseNotes
  Value: |-
    RubyMine 2026.3 EAP 3 Is Out!
    Fixes and improvements:
    - Added support for ActiveSupport’s on_load and run_load_hooks APIs: RUBY-35598
    - Improved Ruby interpreter management by keeping separate interpreter lists for local and WSL projects: RUBY-35768
    - Fixed an issue that prevented running Rails tests via Rake configurations with WSL or Docker interpreters on Windows: RUBY-36103
    - Introduced the Open in Split with Chooser plugin, replacing the experimental Registry option: IJPL-149905
    - Combined the Installed and Marketplace tabs into a single Plugins settings page: IJPL-248768
    For the full list of closed issues, refer to the release notes.
