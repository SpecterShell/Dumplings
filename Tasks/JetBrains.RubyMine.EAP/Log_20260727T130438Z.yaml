  Key: ReleaseNotes
  Value: |-
    RubyMine 2026.2.1 Preview Is Out!
    Fixes and improvements:
    - Improved stepping performance with the Ignore non-project files option enabled: RUBY-35773
    - Fixed debugger support for projects in paths containing non-ASCII characters: RUBY-34195
    - Fixed the "Method definition with parameters has no parentheses" inspection for multiline method definitions containing inline comments: RUBY-35150
    - Improved indexing performance for Rails projects with large or deeply nested RSpec files, reducing freezes during project analysis: RUBY-35648
    - Fixed terminal session restarts when dragging or moving terminal tabs: IJPL-165734
    For the full list of closed issues, refer to the release notes.
