  Key: ReleaseNotes
  Value: |-
    添加时间
    主题支持
    现在，您可以通过主题更改 Mister Download Manager 的外观，甚至图标，您也可以编写自己的主题。
    - 视图 → 主题 中有 9 种内置外观：经典、原生、高对比度、现代、Adwaita、Breeze、Luna、Aero、Aqua。
    - 您可以将自己的主题编写为 TOML 或 JSON 文件，或导入 Base16 方案或您的 pywal 颜色。
    远程控制和无界面模式支持
    MDM 不再需要显示在您面前：您可以从手机管理下载，或让它在无屏幕的机器上运行。
    - 在您自己的网络中，从手机添加链接并管理下载和队列：选项 → 远程。
    - 在服务器、NAS、Docker 或 Unraid 上，使用 --headless 运行无窗口的 MDM，并从浏览器向其发送下载任务。
    浏览器扩展
    现在，扩展程序可从您的浏览器商店安装，自动更新，并能捕获更多您下载的内容。
    - 从 Chrome 网上应用店或 Firefox 附加组件安装。
    - 查看页面已加载的流、视频和音频及其质量，并下载其中任何一个。
    - VPN 和代理支持： 通过浏览器的代理或 VPN 扩展发送下载（默认关闭，需手动开启）。
    - 查看下载停留在浏览器的原因，以及需要更改的设置。
    - 支持更多浏览器： 现在也适用于 Zen、Helium、LibreWolf、Floorp 和 Waterfox。
    视频和图像
    MDM 现在远不止支持单个视频：它支持整个播放列表、字幕、单独的音频和图片库。
    - 播放列表和频道支持： 从视频网站下载整个播放列表或频道：勾选您想要的视频并为所有视频选择一种质量。
    - 字幕支持： 下载视频字幕，可保存到视频旁边或嵌入视频中。
    - 纯音频支持： 仅下载视频的音频，格式为 MP3、Opus 或 FLAC。
    - 登录后视频支持： 使用您的浏览器 Cookie 下载需要登录才能观看的视频。
    - 图像画廊支持： 使用 gallery-dl 下载整个画廊（Flickr、Imgur、DeviantArt 等）。
    种子
    种子下载已发展为完整的客户端：可在下载时观看，关注订阅源，或让您的 Debrid 服务完成工作。
    - 顺序下载支持： 按顺序下载种子文件，以便您可以在下载时观看。
    - RSS 支持： 关注订阅源，并根据您自己的规则自动添加新种子。
    - Debrid 支持： 使用您的 Real-Debrid、AllDebrid 或 Premiumize 账户进行种子和文件托管链接下载。
    - 限制做种和上传，重新检查文件，重新发布，添加跟踪器，并使用黑名单阻止 IP。
    下载
    将一堆链接或 Google Drive 链接交给 MDM，让它自行处理。
    - 链接抓取器：粘贴多个链接，MDM 会将它们分组，检查哪些在线，并在文件到达时解压归档。
    - Google Drive 支持： 链接现在下载的是实际文件，而不是 Drive 的网页。
    - 如果开启，每个下载任务最多可使用 128 个连接。
    - 计划程序可以在队列运行时唤醒计算机。
    网络
    精确控制 MDM 如何连接互联网，并查看文件来源。
    - 所有下载都通过一个网络适配器（例如您的 VPN）进行。如果连接中断，则不会通过您的常规连接传输任何数据。
    - 自定义 DNS 支持： 选择由谁来解析地址：Cloudflare、Google、Quad9、AdGuard、NextDNS 或您自己的服务器，支持 HTTPS、TLS 或纯文本协议。
    - 查看每个下载任务的服务器信息：国家/地区、旗帜和往返时间。
    界面
    需要时更大，打开更快，更贴近您的系统。
    - 将所有窗口放大至 200%：视图 → 界面大小，或按 Ctrl + 和 Ctrl −。
    - 支持 Direct3D 12、Vulkan 和 Metal： MDM 在 Windows 上使用 Direct3D 12 绘制；在 Linux 上可选择 Vulkan，在 macOS 上可选择 Metal。
    - 现在每个文件名都带有其文件类型图标，即您的系统所使用的图标。
    - 内置类别现在可以重命名、指定其他文件类型或删除。
    - 将下载进度窗口隐藏到通知区域，同时下载继续进行。
    - MDM 随计算机启动时，现在会在通知区域等待，而不是打开其窗口。
    其他
    值得了解的小改进。
    - 支持系统钥匙串： 密码和账户登录信息现在保存在您系统的钥匙串中，而不是 MDM 的设置里。
    - 使用您自己的 yt-dlp 和 ffmpeg 副本，而不是 MDM 内置的。
    - 支持 AppImage 工具： AppImage 可以通过它们进行更新，只下载更改的部分。
    - 网站：每个功能都有一个页面，一个主题画廊，以及一个名人堂。
    已更改
    MDM 变得更轻巧，Linux 现在像 Windows 一样受到支持。
    - Linux 不再是实验性支持：已在 GNOME、KDE Plasma、Xfce 和 Cinnamon，以及纯净的 Ubuntu、Debian 和 Fedora 上进行测试。
    - 下载文件更小：setup.exe 从 23 MB 变为 16 MB，AppImage 从 36 MB 变为 20 MB，.deb 从 27 MB 变为 17 MB。
    - 在 Windows 上，通知区域的内存占用从约 50 MB 降至 10 MB 以下。
    - 所有 85 种语言的机器翻译都已根据英文原文重新检查并更正。
    - 从浏览器下载的文件会保留浏览器看到的名称、大小和类型，因此需要登录才能下载的文件会立即正确显示。
    - MDM 遵循浏览器执行的各种重定向，包括“您的下载即将开始”页面。
    - 冻结报告现在会说明 MDM 是陷入循环、等待某事，还是计算机太忙无法运行。
    已移除
    没有移除任何功能，只移除了一个旧标签和一些臃肿的文件。
    - Linux 文件上的 -experimental 标签（macOS 仍保留）。
    - 80 MB 的通用 Mac 下载包：现在分为 Apple Silicon 和 Intel 两种。从 0.2.4 更新的用户，请手动更新一次：在“检查更新”中点击下载即可打开发布页面。
    - 独立的 28 MB 命令行程序：现在是一个 0.2 MB 的启动器，所有命令功能不变。
    已修复
    超过 80 项修复。主要包括：
    - Firefox 和 Waterfox：MDM 现在会在浏览器文件对话框之前接管下载，避免浏览器重复下载。
    - 现在，扩展程序可以从 Ubuntu 的 Snap Firefox 和 Brave Origin 浏览器中连接到 MDM。
    - “下载文件信息”和进度窗口会在浏览器前面打开。
    - Windows 11 Insider 版本中，菜单和窗口不再出现黑色条带。
    - Windows 上的文本显示更清晰。
    - 启动缓慢不再导致 MDM 放弃 Direct3D 而停留在 OpenGL。
    - Linux：在 Hyprland 及类似合成器上，菜单会在正确位置立即显示。
    - Linux：深色模式现在会跟随桌面设置，并且密钥环或休眠服务缓慢不再导致窗口冻结。
    - 当 MDM 最小化或在系统托盘中时，接收到磁力链接或浏览器下载不再导致崩溃。
    - 最小化后的 MDM 会继续运行其队列和“计划程序”。
    - 在繁忙的电脑上，下载不再因“部分文件仍在占用”而失败。
    - 仅限一次的链接不再因“403 Forbidden”而失败。
    - YouTube 的“请求的格式不可用”不再中断下载：MDM 会选择次一级的可用画质。
    - “停止”现在也会停止 yt-dlp，后者以前会在后台继续下载。
    - 按钮文本在所有语言中都能正确显示。
    - 屏幕阅读器现在可以正确读取列表、菜单和窗口。
    安全
    此版本收紧了 MDM 对 torrent 文件的接受标准。
    - 拒绝 torrent 文件中不安全的文件名。
    - 当 torrent 文件已存在于文件夹中时，MDM 会在写入前进行询问。
    - 来自 torrent 的文件被标记为从互联网下载，以便 SmartScreen 和 Gatekeeper 在程序首次运行前进行检查。
    - MDM 不再联系此计算机或本地网络上的 torrent 跟踪器。
    - torrent 库 librqbit 已更新至 9.1.0。
