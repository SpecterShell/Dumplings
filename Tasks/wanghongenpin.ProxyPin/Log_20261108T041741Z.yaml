- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    1. 界面全新改版：桌面端可固定快捷工具栏与流量控制页、全新深色模式与 SVG 图标；移动端导航页与工具箱同步改版
    2. 支持导入 mTLS 客户端证书 (#680)
    3. 新增重放任务管理，支持批量保存与重放请求
    4. 支持抓取 MQTT over TLS 流量，按报文流展示并显示来源应用 (#949)
    5. form-data / form-urlencoded 请求体支持表单方式编辑，选中文本可直接发送到 Decoder 或 AES 工具
    6. 复制为 Python requests 与 curl 导入解析增强
    7. 修复压缩及非标准 SSE 响应体显示、close-delimited 响应体处理 (#956)、应用过滤加载失败等问题；iOS 最低支持提升至 iOS 15
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    1. Brand-new UI: desktop left-side navigation, pinnable quick toolbar with a traffic control page, redesigned dark mode and SVG icons; mobile navigation pages and toolbox
       revamped as well;
    2. Support importing mTLS client certificates (#680);
    3. Added replay task management to save and replay requests in batches;
    4. Capture MQTT over TLS traffic, displayed as a packet stream with originating app attribution (#949);
    5. Form-based editing for form-data and form-urlencoded bodies; selected text can be sent directly to the Decoder or AES tools;
    6. Enhanced copy-as-Python-requests and curl import parsing;
    7. Fixed display of compressed and non-standard SSE bodies, close-delimited response body handling (#956), app filter loading failures, and other issues; minimum iOS version
       raised to iOS 15.
