  Key: ReleaseNotes
  Value: |-
    Enterprise Policy Controls and MCP Fixes
    - Fixed incorrect display of the context usage percentage after refreshing the MCP or tool list
    - Fixed an issue where refreshing plugins caused some MCP servers to reload
    - Fixed an authentication failure where the resource parameter was not included when obtaining or refreshing MCP OAuth tokens
    - Changed follow-up suggestions to use the billing attribution of the main conversation
    - Added support for managing CLI client usage permissions through enterprise policy, allowing them to be enabled or disabled for specified user groups
    - Fixed code blocks with captions and other extra metadata not being highlighted correctly in the TUI
    - Fixed CodeMode falsely triggering duplicate call confirmations when polling long-running tasks with no new output at short intervals
    - Fixed subsequent configuration steps being out of view when the preset model list in TUI /model was too long
