  Key: ReleaseNotes
  Value: |-
    Improved Session Reliability and More Slash Commands While the Agent Responds
    - Fixed incorrect status display in the /plugins list when the same plugin is installed in multiple projects
    - Fixed an issue where all tools from an MCP server were lost in the session when it failed to fetch the prompts or resources list
    - Tightened proactive cross-session message delivery to reduce the chance of messages being mistakenly sent to other sessions
    - Added support for executing more local slash commands directly while the Agent is responding, including /model, /fast, /effort, /skills, /agents, and plugin management commands
