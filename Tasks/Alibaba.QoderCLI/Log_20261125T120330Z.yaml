  Key: ReleaseNotes
  Value: |-
    Model Switch Hooks and Session Stability Fixes
    - Added PreModelSwitch / PostModelSwitch hooks that trigger before and after manual model switches
    - Fixed an issue where toggling the Enabled switch for an MCP server in /mcp did not take effect in the current session
    - Background tasks in progress are now stopped when the user actively terminates a session
    - Fixed excessive startup time caused by automatic editor detection when subprocess execution is slow
    - Fixed an issue where sending plain text after restoring queued history messages containing legacy directory attachments still reported "unsupported model content block"
    - Fixed pressing Esc in the /sites list accidentally entering site detail
    - Fixed the context usage ratio still showing the old value after context compaction in SDK streaming chat; it now updates as soon as new usage is received, without waiting for the current conversation turn to end
