  Key: ReleaseNotes
  Value: |-
    More reliable conversations with improved memory sharing
    - Fixed authentication failure with the wiki subcommand
    - Fixed an issue where truncated or malformed tool-call arguments in conversation history caused repeated model service rejection errors, preventing users from continuing the conversation
    - When CodeMode is enabled, regular MCP tools are now provided via tool search by default
    - Fixed an issue where concurrent prompts sent during an ACP session could remain unanswered after being processed
    - Project auto memory is now shared across different Worktrees of the same Git repository
