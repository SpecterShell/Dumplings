  Key: ReleaseNotes
  Value: |-
    Skill Management and BYOK Improvements
    - Disabled in-session task tracking and automatic task/to-do reminders when using BYOK models
    - Fixed the message uuid mismatch between SDK streaming messages and session history
    - Added skill enablement management, allowing each skill to be set to Enabled, Show Name Only, Manual Invocation, or Disabled
    - Fixed tool-call correlation information being lost in subsequent requests and conversation history when enterprise-preset BYOK connects to Responses providers through Qoder servers
    - When using a personal BYOK connection to a custom Responses API endpoint, the system prompt is now sent as the first developer message in input, so it can participate in prefix caching
    - Fixed missing model congestion status in SDK integrations
    - Fixed project MCP servers disabled in /mcp still showing as enabled
    - Fixed compaction retry failures in long conversations to improve compaction success stability
