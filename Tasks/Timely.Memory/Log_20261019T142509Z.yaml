  Key: ReleaseNotes
  Value: |-
    - Away time: the return prompt ("Ask what I did when I'm back") is now off by default. This update turns it off once for everyone, even if you had turned it on before. Turn it back on in Settings → Away time, and Memory keeps your choice from then on.
    - New notifications can appear in the corner of the screen for key events; They are off by default. Turn them on in the new Notifications tab.
