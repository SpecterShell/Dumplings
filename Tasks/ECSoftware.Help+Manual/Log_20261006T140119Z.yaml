- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    We have released a maintenance update for both, Help+Manual and the Help+Manual Translation Assistant.
    Help+Manual 10.3.1
    - Markdown and HTML5/Markdown Export: tables with merged cells in the first heading row were not exported correctly.
    - Bugfix in XML topic parser: if a topic XML file was written in compressed shortened format (resulting from a bulk translation in H&M Translation Assistant), an empty table cell in the first column could have caused the table content to shift by 1 column, when reading the topic.
    - eWriter Export: file extension .ewriter was wrong in the German UI
    - Compiler log: in some cases, missing images were reported without a reference to the source topic.
    Translation Assistant 10.3.1
    - Bugfix in XML topic parser: if a topic XML file was written in compressed shortened format (resulting from a bulk translation in H&M Translation Assistant), an empty table cell in the first column could have caused the table content to shift by 1 column, when reading the topic.

    All updates are available from our download page.
- Locale: en-US
