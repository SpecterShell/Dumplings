  Key: ReleaseNotes
  Value: |-
    We have released a maintenance update for both, Help+Manual and the Help+Manual Translation Assistant. This update fixes a small but critical memory leak in PDF and Word export in combination with HelpXplain slideshows.
    Help+Manual 10.3.2
    - PDF and Word (DOCX) Export: the tabular export of HelpXplain slideshows created a small but critical memory leak. As a result, subsequent exports might have failed due to an “out of resources” error, requiring a restart of the application. This memory problem was independent of the amount of RAM installed.
    - Word/RTF Import: some hidden keyword fields were ignored and not read. Furthermore, the import function has improved handling of unusual outline levels (e.g. global outline levels starting at a value > 0).
    - HTML5/Markdown Hybrid Export: the title attribute of the internal link that refers from the HTML to the Markdown page was not UTF-8 encoded.
    - Markdown Import: imported tables now are assigned the “DEFAULT” table style, cell content alignment defaults to “top”. This also affects Markdown snippets.
    - DeepL Translation Plugin: the caption of protected text links was translated though.
    - Modifications to the XSD schema file.
    Translation Assistant 10.3.2
    - Bugfixes in the DeepL plugin and DeepL bulk translation.

    All updates are available from our download page.
