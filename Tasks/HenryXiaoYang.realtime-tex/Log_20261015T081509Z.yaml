- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Two live-editing fixes, both reported with excellent reproductions by @SDDKKK.
    Fixed
    - Two-column documents are live again (IEEEtran, \documentclass[twocolumn]{…}). When a column break fell inside a paragraph, rtex recorded the whole page as part of that paragraph, and most of the document lost live editing. In a 12-page IEEEtran paper almost no body text was live. The two-page example from the report now has 61 of 61 paragraphs live, identical to LuaLaTeX's output. (#2)
    - Comment lines no longer break paragraphs. Two % lines in a row, or one inside a paragraph, made rtex think the paragraph ended there, so its edits waited for the background compile. rtex now treats comments like TeX does. (#3)
    - Paragraphs with \marginpar update live. The margin note follows after the next background compile, like footnote text.
    - Full LaTeX error messages. Errors and warnings now include all of LaTeX's continuation lines. For example, "Mismatched LaTeX support files detected" now shows which versions don't match. (#1)
    Other
    - scripts/install-texlive.sh only contacts the TeX Live repository when packages are missing, and updates tlmgr first. Re-running it over an existing installation no longer fails with "tlmgr itself needs to be updated".
