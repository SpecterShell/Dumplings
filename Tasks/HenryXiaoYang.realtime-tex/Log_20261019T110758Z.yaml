- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Most of this release comes from contributors. Thank you @SDDKKK, @Sigewinne-330 and @Steve-Li-1998!
    Fixed
    - newtxmath in the live preview. Math typed with newtxmath (or any font whose TFM has a .vf) no longer shows wrong symbols such as Ï for +. (#7)
    - IEEEtran. Page 1 is drawn directly instead of from the PDF. Tables keep the class's \footnotesize when edited live. The run-in \subsubsection waits for the background compile instead of going live wrong. (#5)
    - Live engine. Fixed for a figure with a % comment or \vspace above it, for a float or list at the end of an \input file, for preamble \input files (they were loaded twice), and for \mathbf after \bm with fontspec (wrong font, sometimes a crash). (#4)
    - Main files with a space in the name (my paper.tex) work. (#8)
    - Blank pages (from \cleardoublepage with \pagestyle{empty}) no longer break the whole layout. (#9)
    New
    - IEEEtran's IEEEkeywords and IEEEdescription update as you type.
- Locale: en-US
