  Value: |-
    Blanc 1.51.0
    Added
    - Favorites gets a page of its own, and you can edit a favorite.
      Favorites (Show Favorites, ⌥⌘B or Ctrl+Shift+O, or /favorites) now opens
      as a full page in a tab, with your folders on the left and the open folder's
      favorites in one list. Every favorite has a ⋮ menu: open it in a new tab,
      edit it, pin it to the Start Page, move it, or remove it. Edit… changes a
      favorite's name, address and folder; a pinned favorite stays pinned. Select
      several to open, move or remove them together. Dragging, search and the
      keyboard work as before.
    - Widgets on your Start Page. The Start Page is now one page: the clock,
      with the week's blocked count under it. Favorites and your other devices'
      tabs are cards you turn on in Customize, then drag (or move with the
      arrow keys) to either side of the page and resize. Choose how many
      shortcuts show, from 1 to 12. If you used Ledger, Shelf or Tally, your
      Start Page keeps what it showed. Over your own image, the cards are frosted
      glass and the small text turns light or dark to stay readable.
    Changed
    - Your wallpaper runs behind the Island. On the Start Page, Sunrise, a
      color or your own photo now continues up behind the Island instead of
      stopping at a plain band, and the launch Sunrise plays there too. With
      vertical tabs, the tab list keeps its own look.
    - Customize fits the window. It never covers the clock: while it is
      open, a tall clock shrinks just enough to make room, and grows back when
      you close it or open Font & color to style it. Only on the smallest
      windows do Customize's options scroll.
