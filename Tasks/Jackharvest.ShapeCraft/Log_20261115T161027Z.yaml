- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Fixes from your reports: sketches stay out while they still have profiles to use, text is easier to set up, and an
    emptied body can't block extruding any more.
    Changed
    - A sketch stays shown until every profile in it is used. Extrude one of four holes and the other three stay
      there for the next pull; the sketch hides once the last one is used. Thanks @jan-tdy (#53).
    Fixed
    - "bounds failed: shape has no extent" no longer blocks extruding. A cut that would take away all of a body is
      refused with a message instead of leaving an empty body behind, and an empty body already in a project is passed
      over, so new sketches extrude again. Thanks @jan-tdy (#50).
    - Scrolling the Add Text font list scrolls the list. The view behind the Add Text dialog no longer zooms while you
      scroll over the dialog or its font list. Thanks @jan-tdy (#57).
    - Capital Height takes any value you type, like 0.5 mm or 1.5 mm. Before, a value starting with 0 or holding a
      decimal point couldn't be typed. Thanks @jan-tdy (#58).
    - .shapr import: a closed wall stored as two faces joins into one, so a solid that came in invalid, with the wrong
      volume and size, imports whole. Thanks @pablohc (#55, #56).

    Alpha: keep copies of anything important. ShapeCraft updates itself from here on: it downloads new
    versions in the background and installs them when you close it.
    Mac: download the -macos-universal.dmg (Apple silicon and Intel). The two autoupdate-only
    copies are the same file, there for copies of ShapeCraft up to 0.8.5 to update from.
    First launch: macOS asks once: System Settings ▸ Privacy & Security ▸ Open Anyway.
    Windows SmartScreen: More info ▸ Run anyway. Linux: make the AppImage executable, then double-click it,
    or install the .deb (Debian, Ubuntu) or .rpm (Fedora, openSUSE) package.
    Android (test build, arm64, Android 8.0+): open the APK on the device and allow installs from that app.
    A copy installed from an earlier test build (debug-signed) has to be uninstalled once first.
    iPhone (test build, iOS 17+, iPhone Duo included): sideload the -ios-arm64.ipa with AltStore,
    Sideloadly or a similar tool, signed with your own Apple account (a free one re-signs every 7 days).
    Or build it from source: docs/ios.md.
    Check a download against SHA256SUMS.txt: shasum -a 256 FILE (macOS, Linux) or Get-FileHash FILE (Windows).
