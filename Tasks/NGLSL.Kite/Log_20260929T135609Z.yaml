    - 验证步骤：cargo test、cargo build --release、NSIS 安装包构建
    - 构建记录：Release #25
    本次提交范围
    - chore(release): prepare v0.4.3 (4f39415)
    - fix(ui): wrap long text in developer tools (7dc9f3d)
