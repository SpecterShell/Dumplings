  Key: ReleaseNotes
  Value: |-
    Kite v0.2.12
    覆盖范围：v0.2.11（3847873）→ 本版（多 DPI 显示器唤起/设置窗口居中修复）。
    版本重点
    修复 1K 与 2K（不同缩放）显示器上呼出位置不一致：居中逻辑改为物理工作区计算，再按窗口当前 scale 转成 iced 逻辑坐标。
    修复
    多分辨率 / 多 DPI 定位
    - 热键 / 托盘唤起、托盘打开设置：窗口在光标所在显示器工作区水平居中、垂直约 1/3。
    - 根因：Win32 的 GetCursorPos / MONITORINFO.rcWork 是物理像素，iced window::move_to 收逻辑坐标；100% 缩放下碰巧正确，125%/150%（常见 2K）会整体偏移。
    - 现行为：按目标显示器 DPI 把逻辑窗口尺寸换算到物理工作区居中，再除以窗口当前 scale 交给 move_to，跨不同 DPI 显示器移动时落点仍是正确物理位置。
    升级影响
    设置、历史、固定项、别名、快捷键均无迁移。从 v0.2.11 覆盖安装即可。
    已知限制
    安装包仍无 Authenticode 数字签名。多显示器混合 DPI 已在本机 1K/2K 验证；三屏以上或自定义缩放组合建议再抽测一次唤起位置。
