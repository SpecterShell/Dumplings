- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Warning
    部署方式改变：4 个容器合并成 1 个
    升级前请重新下载下面两个文件
    - docker-compose.yml
    - .env
    旧的 heavrnl/nexus-terminal-frontend / -backend / -remote-gateway 三个镜像已停止更新，请改用 heavrnl/nexus-terminal。
    新增功能：
    - 远程桌面：RDP / VNC 改为浏览器直连，不再需要 guacd 与 remote-gateway
    - 远程桌面：并入会话标签，画面占满工作区；支持 Ctrl+Alt+Del、剪贴板、输入、全屏、重连
    - 新增 arm64 镜像（amd64 + arm64 多架构同时发布）
    - 文件管理器：搜索栏「固定」状态改为跨端同步
    修复：
    - 终端偶尔多出 / 重复行（TUI 重绘后会残留）
    优化：
    - 安全：跟随 2026-10 Node 安全公告，修掉匿名可达的 Brotli 解码器漏洞（CVE-2026-111497）
    - 容器基础镜像从已 EOL 的 node:20 升到 22.23.4
    - 终端分块输出切断中文 / emoji 时不再出现乱码
    Full Changelog: https://github.com/Heavrnl/nexus-terminal/compare/v0.9.10...v0.9.11
