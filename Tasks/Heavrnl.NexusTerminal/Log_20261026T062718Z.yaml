  Key: ReleaseNotes
  Value: |-
    新增功能：
    - 连接编辑：新增「启动命令」，连上终端后自动执行。与布局里给窗格配置的「自启指令」互相独立，两边都配置就都执行
    - 文件管理器：新增 SFTP sudo 提权。用 sudo 启动 sftp-server，让文件通道以 root 权限运行，可以直接浏览、编辑 /root、/etc 这类只有 root 能碰的路径，不用把整个账号提成 root。默认开启，密码可不填（走服务器的免密 sudo）；提权不成功会自动退回普通权限，原来的读写不受影响
    What's Changed
    - build(deps)(deps): bump the production-dependencies group with 6 updates by @dependabot[bot] in https://github.com/Heavrnl/nexus-terminal/pull/152
    Full Changelog: https://github.com/Heavrnl/nexus-terminal/compare/v0.9.18...v0.9.19
