  Key: ReleaseNotes
  Value: |-
    Warning
    自 v0.9.11 起部署方式改变：4 个容器合并成 1 个
    升级前请重新下载下面两个文件
    - docker-compose.yml
    - .env
    旧的 heavrnl/nexus-terminal-frontend / -backend / -remote-gateway 三个镜像已停止更新，请改用 heavrnl/nexus-terminal。
    新增功能：
    - 桌面端：端口转发面板，本地 -L / 动态 SOCKS5 -D / 远程 -R
    - 空工作区直接列出最近连接
    - 设置：「测试连接」超时可配置
    修复：
    - 挂起会话功能修复
    - 终端刷新 / 切回后台标签后缩成左上角一小块，旧内容挤在 80 列
    - Debian 12 中文环境下状态监控读不到内存
    优化：
    - 移动端启动包减 3.7MB，工作区不再静态拖入远程桌面客户端（入口 chunk 5.2MB → 1.5MB）
    - 内部整理：web 端与桌面端支持同时联调
    Full Changelog: https://github.com/Heavrnl/nexus-terminal/compare/v0.9.13...v0.9.14
