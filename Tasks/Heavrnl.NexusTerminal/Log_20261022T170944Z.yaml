Locale:
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Warning
    自 v0.9.11 起部署方式改变：4 个容器合并成 1 个
    升级前请重新下载下面两个文件
    - docker-compose.yml
    - .env
    旧的 heavrnl/nexus-terminal-frontend / -backend / -remote-gateway 三个镜像已停止更新，请改用 heavrnl/nexus-terminal。
    新增功能：
    - 数据导入导出重做
    - 桌面端：首次启动自动建好 admin 账号，不再走建账号向导；没设置密码时打开软件就是登录状态
    - 文件权限：支持勾选权限位批量修改，并可改所有者 / 所属组
    - 文件管理器：新增隐藏文件快捷开关
    - 连接编辑器：文件夹搬进「基本信息」卡片，选密钥时就地新建并随连接自动保存
    - 脚本批量导入重做：粘贴即实时预检，语法错误折叠提示
    - 文件传输：进度卡片显示「源服务器 → 目标服务器」与两端路径
    - 新增 Gotify 通知渠道
    修复：
    - 文件传输：「发送到另一个服务器」把目录摊平成内容，不保留文件夹层级
    优化：
    - 文件传输进度弹窗重做视觉与信息结构，源/目标一眼能分清
    - 目标机缺 rsync 时自动安装，不再中断
    - 连接编辑器的分区卡片用底色区分，已有密钥改为下方下拉选择
    Full Changelog: https://github.com/Heavrnl/nexus-terminal/compare/v0.9.12...v0.9.13
