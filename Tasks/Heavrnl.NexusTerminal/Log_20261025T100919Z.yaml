  Key: ReleaseNotes
  Value: |-
    新增功能：
    - 文件管理器：支持独立选择主机，两个文件管理器之间可直接拖拽传输
    - 文件管理器：收藏路径分为「全局」与「主机专属」，路径历史按主机隔离
    - 文件管理器：收藏夹支持书签移动 / 复制至全局或指定主机
    - 文件管理器：新建文件与文件夹支持输入完整路径，缺失目录自动创建
    - 文件传输：跨主机拖拽进度改为右下角可折叠窗口
    - 会话：文件拖拽至会话标签即切换会话，可直接在该会话的文件管理器中释放
    - 跨端同步：文件管理器的主机绑定纳入同步范围
    修复：
    - WebSocket：断线重连的退避时间改为 500ms 起步、5s 封顶，网络恢复与键盘输入可触发立即重连
    - 跨端同步：离线期间的变更在连接恢复后补拉，启动与定时同步不再要求本地存在变更
    - 文件管理器：隐藏文件开关切换会话后互相影响
    - 文件管理器：地址栏遇到超长路径会撑宽整体布局
    - 文件管理器：保存收藏路径后表单窗口未自动关闭
    - 文件管理器：分屏尺寸与目录自动刷新在不同会话间互相影响
    - 快捷指令：单次文件夹操作触发多条通知
    - 文件传输：跨文件管理器拖拽时遮罩覆盖文件夹落点提示
    - 文件传输：主机间中转将目标机密码写入源机命令行
    - 连接编辑：脚本模式「常见写法」缺少一键复制
    - 依赖：升级 multer、body-parser、nodemailer，修复已知漏洞
    优化：
    - Web：带 hash 的静态资源改为长缓存，减少重复校验
    - 工作区：会话面板分批挂载，降低首帧创建全部终端沙箱的开销
    - 工作区：首屏并行预取恢复数据，消除空工作区的闪帧
    - 界面：保存与删除确认按钮移除提交期间的过渡文案
    - 快捷指令：删除确认移入面板内遮罩，移除二级弹窗
    - 界面：修复「极简药丸」等缺失的图标
    - 文件管理器：移除工具栏多余的分隔线
    Full Changelog: https://github.com/Heavrnl/nexus-terminal/compare/v0.9.16...v0.9.17
