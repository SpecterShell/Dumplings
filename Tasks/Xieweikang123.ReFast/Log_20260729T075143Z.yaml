  Key: ReleaseNotes
  Value: |-
    修复：计算稿纸插件的"搜索结果被过滤"问题
    1. 修复输入 890162+254664 等数学表达式时"计算稿纸"不出现的问题。根本原因是插件类型的结果在合并阶段被错误过滤（shouldKeepResultForQuery 中缺失 "plugin" 类型），现已将 plugin 加入 isQueryIndependentResultType，确保所有插件结果不受查询关键词过滤影响。
    2. 完善计算稿纸的 %（取模）、^（幂运算）和科学计数法 e/E 支持，不再显示"包含非法字符"错误。
