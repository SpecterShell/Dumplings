- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Bug fixes and other updates/enhancements:
    1. Fixed some security and stability issues. Click here for further information.
    2. Fixed a rare issue with printing certain vector paths.
    3. Improved digital signature status detection.
    4. Fixed an issue with toggling the Quick Launch bar. (50499, 50372)
    5. Fixed an issue with "Booklet" mode in the print preview window—the paper dimensions are now swapped in some cases. (50532)
    6. Fixed some minor issues with UI automation.
    7. Fixed an issue with generating JPEG images with the CMYK color space.
    8. The "Set as default" option in the MSI installers is no longer enabled by default.
