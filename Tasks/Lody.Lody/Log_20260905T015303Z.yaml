  Key: ReleaseNotes
  Value: |-
    Version 0.91.0
    ✨ New
    - Support GPT-6 Astra.
    - Added session file actions so files that cannot be previewed directly can be opened in a system app, revealed in the file manager, or downloaded (#375).
    - Markdown can now render semantic diff code blocks (#373).
    - Session sidebars and desktop child-session tabs now show unread state (#332, #384).
    - File, Issue, and PR mentions now use VS Code-style fuzzy matching, making targets easier to find (#378).
    - Added bilingual guides for shared-session handoff, parallel agents, and agent teams (#387, #389, #390, #393, #394).
    🐛 Fixes and Improvements
    - Strengthened team preview and local browser connection checks for safer, more reliable access (#374).
    - DeepSeek Harness now discovers models from custom services and exposes model, reasoning, and permission options from the active runtime (#380, #395, DeepSeek ACP #10, #11).
    - Kimi model selectors now display and search model providers, making same-named models easier to distinguish (Kimi ACP #7).
    - Improved Markdown and streaming message rendering with TeX bracket delimiters, correct autolink boundaries around non-ASCII punctuation, preserved final text output, and a touch-closeable Mermaid full-screen viewer (#336, #370, #388, #396).
    - Fixed chat jitter while resizing the sidebar and made billing information load sooner (#368, #371).
    - Reduced Live Activity update overhead and capped mobile session-group previews for smoother long lists (#319, #323).
    - Improved when App Store review prompts appear and how their state is handled (#310).
    - Updated ACP provider icons and runtime registry information (#369).
    - Improved public-site page titles, search discoverability, and 404 handling for unknown pages (#379, #383, #391).
    - Thanks to external contributor @nokizw for improving provider display and search in Kimi model selectors (Kimi ACP #7).
