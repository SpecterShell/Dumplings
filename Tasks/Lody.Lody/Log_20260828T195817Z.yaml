  Key: ReleaseNotes
  Value: |-
    Version 0.88.0
    ✨ New
    - Added predictive hover intent to the conversation outline, making long conversations easier to navigate with fewer accidental openings (#51, #97, #113).
    - Provider setup now shows clearer progress and warns when a DeepSeek delegation model may incur additional costs (#66, #81).
    - The public blog now includes English and Chinese RSS feeds, reading times, and previous/next navigation; landing-page demos and the animated atmosphere are smoother too (#84, #85).
    - Public source and contribution moved to LodyAI/Lody, with structured Issue and PR templates, automated checks, and clearer feedback for contributors (#39, #63, #69, #80, #91).
    🐛 Fixes and Improvements
    - Undelivered messages are now clearly marked and can be resent after confirmation, preventing lost or duplicate execution (#48, #74).
    - Improved workspace switching and syncing so sidebar content stays within the current workspace, while increasing compatibility between newer and older clients (#49, #55, #96, #108).
    - Fixed missing Chinese translations, task-tool configuration, session-tab renaming, IME confirmation, editing in narrow message columns, queued steering, and Agent question compatibility (#40, #42, #43, #44, #52, #99, #101).
    - Improved desktop reliability with lighter Mermaid diagrams, Windows tray left-click behavior, restored local file preview and session controls, and safer window navigation (#45, #46, #50, #71, #75, #77).
    - Improved the usage calendar on smaller screens, including recent-week positioning and visual details, and fixed ordered-list marker alignment in Markdown (#53, #62, #78, #82, #83).
    - Removing a local project now archives its related sessions first, remains visible while waiting for an offline device, and can safely clean up Lody-created worktrees while retaining dirty or failed ones (#105, #119).
    - Corrected repository paths, the Chinese session-guide link, Node.js prerequisites, and public package metadata (#57, #60, #64).
    - Thanks to @clanzhang, @tommy0103, @lawvs, @Innei, @hyoban, @wibus-wee, @limichange, @27Aaron, @hcz-czh, @Pleasurecruise, @frostming, @natsustan, and @zxch3n for their public contributions to this release.
