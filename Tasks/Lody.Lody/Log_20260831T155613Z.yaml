  Key: ReleaseNotes
  Value: |-
    Version 0.89.0
    ✨ New
    - The redesigned onboarding flow lets you choose or skip the first Agent, complete an initial task with a read-only example project, and understand syncing or pending setup states more clearly (#163, #180, #182, #216).
    - Plan mode now uses a unified conversation panel, making plans from primary and child Agents easier to review and follow (#215, #221).
    - Projects settings now supports folders per machine and more convenient actions for local project rows (#205, #220).
    - Desktop now includes an option to launch Lody automatically at login (#176).
    - Scoped keyboard navigation improves keyboard use across the sidebar, menus, and conversation surfaces (#168).
    - The documentation site now has bilingual search that runs entirely in the browser (#228).
    - A shared community entry point now includes the Feishu group QR code (#164).
    - Registry Agents now support standard ACP authentication, and the bundled Claude, Codex, Kimi, and Grok runtimes have been upgraded (#201, #208).
    🐛 Fixes and Improvements
    - Fixed removed built-in Agents reappearing after a restart (#94).
    - Fixed project selection being lost when entering from the sidebar and improved the Projects settings dialog layout (#87, #177).
    - Improved Agent configuration synchronization across collaborators and Agent Role selection in child tabs (#159, #181).
    - Fixed queued-turn dispatch and MCP child-session completion notifications, while retaining compatibility with completion notifications from older clients (#166, #200).
    - Fixed active-tab preservation, URL synchronization, and renaming for long conversation titles (#194, #199, #202).
    - Fixed shortcut guidance, focus while searching for a model in child tabs, and composer focus after sending a message (#95, #129, #143).
    - Fixed session path launcher detection and Agent file links disappearing when they matched edited files (#73, #167).
    - Fixed mobile session authentication recovery, workspace settings spacing, safe-area layout, and background tabs waiting for approval (#190, #210, #222, #231).
    - Improved rounded-corner clipping, status alignment, nested dialog backdrops, and link behavior in settings (#186, #204, #226, #233).
    - Fixed language detection during first launch and broken links in the Chinese documentation (#117, #175).
    - Fixed conflicts between desktop window dragging and panel interactions (#169).
    - Improved GitHub project association for local sessions and prevented invalid WebSocket close codes from interrupting the preview proxy (#197, #198).
    - Restored the resume action for blocked goals (#230).
    - This release range also includes public repository maintenance for build consistency and the contribution workflow (#165, #171).
    - Special thanks to external contributors @Pleasurecruise (#73, #192), @sheepbox8646 (#87), @xuxu777xu (#94), @ShobhanKarthish (#95), @clanzhang (#117, #143), @1-WEEK (#129), @Innei (#168, #169, #205, #227), @kovsu (#186), @ImSingee (#194, #226), @MichaelYuhe (#231), and @wong2 (#233).
