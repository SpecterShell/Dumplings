  Key: ReleaseNotes
  Value: |-
    Version 0.80.0
    ✨ New
    - File Preview can now read workspace files directly, supports common text and image formats, and can preview untracked files and temporary files created by Agents.
    - Added copy and paste actions to the desktop terminal through its context menu, including a keyboard shortcut for copying selected text.
    🐛 Fixes and Improvements
    - Fixed Codex or Grok sometimes opening an unexpected terminal window on Windows.
    - Improved Codex error handling, title generation, and branch naming so Provider errors are not used as titles and the selected model configuration is preserved.
    - Fixed session image thumbnails sometimes failing to load or export, with an automatic fallback to the original image when thumbnail generation is unavailable.
    - Improved the reliability of the @ mention menu, including Skills, Issues, and Pull Requests after reopening, switching, or searching.
    - Fixed archived sessions reappearing in the list during app startup synchronization.
    - Improved notification readability in the light theme and the layout of action buttons.
    - Fixed expanded folders in the sidebar file tree sometimes collapsing unexpectedly.
    - Improved Windows memory-pressure detection to avoid restarting Agents while the system still has available commit capacity.
    - Improved synchronization recovery after brief disconnections so workspace and session state resume more reliably.
