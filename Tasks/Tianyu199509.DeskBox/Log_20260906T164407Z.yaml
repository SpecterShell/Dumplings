  Key: ReleaseNotes
  Value: |-
    DeskBox 1.5.0 是一次功能与可靠性更新：数据自动快照备份、整理桌面重设计并支持公共桌面、文件夹快捷方式就地导航、高分辨率 Shell 图标、小组件独立字号与时钟格式、文件格子原生右键菜单开关，以及跨盘拖入后桌面图标残留的修复。
    DeskBox 1.5.0 is a feature and reliability update: automatic data snapshots, a redesigned Organize Desktop with Public Desktop support, in-widget folder-shortcut navigation, high-resolution Shell icons, per-widget text sizes and clock formats, an optional native Windows context menu for file tiles, and a fix for stale desktop icons after cross-volume drags into grids.
    亮点 / Highlights
    - 数据自动快照 / Automatic data snapshots — 5 分钟到 5 天的可配置计划，保留 3~30 份快照，支持自定义备份目录；目录不可用时自动降级。
    - 整理桌面重设计 / Redesigned Organize Desktop — 桌面预览卡以透明度表达逐文件勾选，入口改为「预览整理」，来源可选公共桌面（管理员授权、中断恢复完整支持）。
    - 文件夹快捷方式就地导航 / In-widget folder shortcuts — 指向收纳树内的 .lnk 直接在格子内展开。
    - 高分辨率图标 / High-resolution icons — 256px Shell 图标、保留叠加层；Steam 封面等按用户关联图标正确显示。
    - 原生右键菜单 / Native context menu — 新设置：右键单个文件瓦片直接弹 Windows 原生菜单（默认关闭）。
    - 桌面图标残留修复 / Stale desktop icon fix — 跨盘把文件拖进格子后，资源管理器视图（包括 OneDrive 同步桌面）不再残留已移走文件的图标，无需手动刷新（已在第二台机器验证）。
    - 更低的内存占用 / Lower memory — 设置分区按需创建、缩略图零拷贝、文件项只实例化当前布局。
    完整变更列表见 CHANGELOG / See CHANGELOG.md for the complete list. 发布说明 / Release notes: docs/releases/v1.5.0.md
