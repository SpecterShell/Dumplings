    RubyMine 2026.2.3 Is Out!
    Fixes and improvements:
    - Fixed Go to Declaration, inspections, and annotators for Ruby constants in Slim templates: RUBY-36013
    - Fixed an issue where Rails tests run via Rake configurations failed on Windows: RUBY-35940
    - Fixed an issue that prevented running RSpec tests with Ruby 4.x interpreters in WSL: RUBY-36055
    - Fixed data loss when canceling merge conflict resolution: IJPL-251324
    - Fixed an IDE freeze caused by write actions waiting indefinitely for background tasks: IJPL-253271
