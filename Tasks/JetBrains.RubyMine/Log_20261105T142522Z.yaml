  Key: ReleaseNotes
  Value: |-
    RubyMine 2026.3 Is Out!
    Fixes and improvements:
    - Added an ability to enable native WSL interpreters: RUBY-36065
    - Implemented auto-detection of Ruby interpreters installed via Homebrew: RUBY-35827
    - Added automatic Ruby interpreter selection based on version requirements in Gemfile or gems.rb, including version ranges: RUBY-15772
    - Added support for ActiveSupport on_load and run_load_hooks: RUBY-35598
    - Added automatic indentation for basic heredocs (<<): RUBY-35934
    - Added support for the rails query CLI command: RUBY-35580
    - Added support for Git worktrees in multi-root projects: IJPL-239027
    For the full list of closed issues, refer to the release notes.
