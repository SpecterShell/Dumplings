Version: 1.28.3
Installer:
- InstallerUrl: https://image.yeastar.com/Linkus/Release/PC/Linkus Desktop Client-1.28.3-win-ia32-setup.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    1. Fixed the CTI issue: When a call was initiated from Linkus in CTI mode, the controlled IP phone did not respond, causing the call to fail.
    2. Fixed the call issue: There could be no audio during a call, and the corresponding call logs were not generated.
    3. Fixed the startup issue: Linkus remained stuck on the loading page and failed to start in certain network environments.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    1. 修复 CTI 呼叫问题： Linkus 在 CTI 模式下发起呼叫时，受控 IP 话机无响应，导致呼叫失败。
    2. 修复通话异常问题： 通话过程中概率性无声，且未生成对应的通话记录。
    3. 修复启动问题： 在特定网络环境下，Linkus 一直停留在加载页面，无法正常启动。
