  Key: ReleaseNotes
  Value: |-
    New in SNAP 13.0
    - New Naive-Bayes Classifier
    - New Spectral Indices
    - LERC compression in GDAL
    - Product Library: Copernicus Dataspace repository - support for Sentinel-1C & Sentinel-2C
    - Added support for ECOSTRESS Collection 2
    - Enhanced GraphBuilder validation handling
    - Updated HDF/HDF5 native library to version 3.3.2
