Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    New in SNAP 14.0
    - Hyperspectral processing: new spectral-library with standard-format import/export, pixel-based spectral extraction, metadata editing, noise-reduction, resampling and classification capabilities.
    - Faster product reading: improved reader caching for NetCDF and Sentinel-3 products.
    - Updated reader infrastructure: broad reader updates, including improved virtual-file-system support.
    - Improved GDAL support: updated GDAL to version 3.12.1, with fixes for performance, memory usage and parallel processing.
    - Enhanced STAC support: better handling of product types and asset roles.
    - Better product compatibility: fixes for Sentinel-2, ENVISAT MERIS, NetCDF CF and EnMAP products.
    - Improved processing workflows: fixes for Graph Builder, DEM downloads, DIMAP export and mask propagation.
