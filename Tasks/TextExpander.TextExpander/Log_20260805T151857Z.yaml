  Key: ReleaseNotes
  Value: |-
    What's new in TextExpander 8.4.6
    Features marked Phased Rollout are being enabled for accounts in stages. Contact support@textexpander.com to request earlier access.
    New Features
    - Conditional Sections in snippets (Phased Rollout). Build if/then branching directly into a snippet: wrap content in a conditional section with named branches, and the fill-in window shows a dropdown that reveals only the selected branch's content and fill-ins. Sections nest, branches are unlimited, and you can embed other snippets inside a branch. The expanded result reads as one clean document with no leftover blank lines.
    - Spell check and grammar suggestions in the snippet editor (Phased Rollout). Misspellings get a dashed red underline and grammar suggestions a wavy purple one. Click an underline to see suggestions, then apply or ignore. The checker skips macros, the spacing around them, and script snippets, and it also works in the default text fields of fill-in dialogs. Checking is English (en-US) for now.
    - Sign in with your browser. The sign-in screen now offers a single "Sign in with browser" button that hands authentication to your browser session, so you never type your password into the app window. A "Sign in manually" link keeps the email and password form one click away.
    Improvements
    - Group sharing is easier to find. Selecting a snippet group now shows an actions menu in the header with Share, Group Settings, and Delete, replacing the buried right-click and gear-icon paths.
    Bug fixes
    - Fixed a crash when using Print All Groups with groups containing rich text snippets.
    - Removed the Requests promotion callout that kept appearing after its promotional window ended.
    - Other fixes: the snippet type dropdown is now disabled for snippets the editor cannot safely edit, matching the editor itself, and switching a snippet to a script type and back no longer strips the compatibility guard that protects newer snippets from older clients.
