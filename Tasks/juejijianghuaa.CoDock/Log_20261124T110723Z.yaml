  Key: ReleaseNotes
  Value: |-
    v0.6.13 (2026-11-24)
    这一版让内嵌编辑器能真正拿来改代码：跟得上 Agent 的改动、能查找替换、能把代码拖给 Agent；Server 版也可以直接用 npm 安装了。
    新功能
    - npm 安装 Server 版：npm i -g codock 安装后运行 codock，或 npx codock 直接运行一次；只下载本平台的二进制（macOS arm64/x64、Linux x64/arm64、Windows x64），国内可加 --registry=https://registry.npmmirror.com。npm 版在 Windows 上是控制台程序，日志打印在终端里，Ctrl+C 即停止。
    - 拖文件、拖代码给 Agent：文件树的行（含搜索结果）和编辑器里选中的代码都能拖进终端或输入窗口。Agent 会话插入 @相对路径（代码带 #L 起-止），系统终端插入 shell 路径；只复制、不会把编辑器里的代码「移走」。
    - 编辑器查找替换：⌘F / Ctrl+F 查找，⌥⌘F / Ctrl+H 替换，F3 / ⌘G 下一处；支持区分大小写、全字、正则（替换可用 $1）。替换、全部替换、缩进与还原改动段都能 ⌘Z 撤回。
    - Tab 缩进：Tab / Shift+Tab 缩进与反缩进（缩进单位按文件推断），回车带上当前行的缩进。
    - 编辑器正文右键菜单：剪切 / 复制 / 粘贴 / 全选；复制文件引用或行号引用（@相对路径#L 起-止）、复制为代码块、复制相对 / 绝对路径；在文件树中定位；在 Finder 中显示，主机本机配了外部编辑器时可用它打开到当前行。
    调整
    - 终端路径直接点击打开：悬停即显示下划线，不再需要按 ⌘/Ctrl；在路径上拖选不算点击。
    - Agent 改了文件，编辑器自动跟上：没有未保存修改时，正在看的文件在磁盘上变了就静默重读，保留滚动与选区；以前会一直显示打开时那份，下一次自动保存还会把 Agent 的改动盖掉。
    修复
    - Claude Code 全屏滚动光标不再闪：启动时让它用同步输出包住重画，resize 时不再先露出空屏；改尺寸后当场重画一帧，旧画面不再被拉伸变形。
    - 终端链接遇到中文即收尾：网址后面紧跟的中文不再被算进链接。
    - 暗色主题编辑器选区看得清：选中文字不再变成灰底黑字；右键菜单开着时选区也不消失。
