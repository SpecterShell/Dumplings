  Value: |-
    v0.5.1 (2026-09-26)
    这一版带来移动端与共享会话全新双模体验：彻底摆脱在手机屏幕上眯眼看字符终端的痛点，支持原生对话流（Chat View）与终端视图自由切换，并将 Coding Agent 的交互式问答（单选、多选、自定义输入）直接转化为原生可交互卡片。此外，全新的移动端对话输入框支持图片/文件上传、实时 Model/Token 统计，交互细节全面升级。
    新功能
    - 移动端与共享会话「双模」自由切换（对话视图与原生终端）：
      - 手机端与局域网共享页面顶部提供模式切换按钮，可在「对话流」与「原生终端」之间随时一键切换。
      - 对话流（Chat View）：基于规范化的 Transcript 消息流渲染，像使用原生 IM 聊天软件一样清晰查阅 Coding Agent 的提问、代码生成、思考折叠块与工具调用。
      - 空会话专属卡片：新建空会话在手机端进入时展示专属对话卡片，一键唤起与进入。
    - 交互式问答卡片（Interactive Question Cards）：
      - 深度适配主流 Coding Agent 的提问交互（CodeBuddy / Claude Code 的 AskUserQuestion、Antigravity 的 ask_question，以及各类 Inquirer 选择与确认工具），直接在气泡流中解析为原生交互卡片。
      - 单选与自定义输入：轻点选项自动映射为终端步进光标移动与回车序列；支持展开「输入其他答案…」，直接输入自定义内容并自动适配 TextInput 聚焦与打字。
      - 多选全面支持（Multi-Select）：支持持久多选勾选状态，点选即勾选 [✓] 不闪退、不消失；底部渲染「已选 N 项」及「确认提交」操作栏；自动适配 CodeBuddy 的 Submit 行与回车确认规范，以及标准 Inquirer 的空格/回车规范；支持添加自定义回答作为多选项一并提交。
      - 提供「切到终端」一键直达底层终端视图。
    - 全新移动端对话输入框：
      - 自适应单行/多行展开与手机键盘弹起。
      - 支持手机相册图片与文件直接上传插入终端。
      - 顶部实时展示当前会话使用的 Model 模型名与实时 Token 用量统计。
      - 优化移动端首次连接时的直接写入逻辑，杜绝单行文本提交回车被 bracketed paste 吞掉。
    - 移动端交互细节全面优化：
      - 活跃会话列表信息升级：将以往冷冰冰的“终端行列分辨率”替换为更直观的运行耗时与消耗 Token 总量。
      - 增加移动端结束会话（关闭 Tab）操作。
      - 增加平滑「回到顶部」浮动按钮。
      - Toast 提示在移动端自适应置顶，避免遮挡底部操作栏。
    官网与文档
    - hero 上的版本徽章更新为 v0.5.1。
    - 官网特性卡片更新移动端双模（对话流 + 原生终端）与交互式问答卡片介绍。
    - README.md 补充移动端对话模式与交互式问答卡片详细说明。
