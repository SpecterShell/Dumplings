  Key: ReleaseNotes
  Value: |-
    v0.5.2 (2026-10-01)
    这一版带来 Agent Hook 原生任务状态感知、终端 Git 改动查看与 Diff 对比、多 Agent 并发新建与 Worktree 接力，并对移动端全屏 TUI 触摸滚动与多端协同做了全方位的交互体验升级。
    新功能
    - Agent Hook 原生任务状态感知：
      - 深度接入 Claude Code 原生 hook 事件，实时捕获会话执行、等待与停止状态，彻底替换过往基于终端静默超时的被动推断，任务状态判定更迅速、无抖动。
      - 架构上支持按 --source 与 --event 声明来源，抽象统一的 Agent hook 事件通道，为多 Agent 生命周期联动打下基础。
      - 完善中断恢复保护：在 hook 模式下用户按下 Esc 中断指令时，即刻清空等待并重置看门狗，杜绝转圈指示残留。
    - 终端未提交改动与 Diff 预览：
      - 终端窗格右上角实时感知当前工作区的 Git 状态，显示当前分支名与未提交变动文件计数。
      - 点击即可打开全功能 Diff 弹窗，直观浏览所有已修改、暂存及未跟踪文件，并提供行级代码差异高亮对比。
    - 新建任务与跨会话接力多选并发：
      - 新建任务弹窗与跨会话接力支持同时勾选多个 Agent（如同时选 Claude + Codex + Kimi），一键并发拉起多个工作 Tab。
      - 支持直接绑定/新建独立 Git Worktree 分支隔离工作区，并支持输入初始提示词（Initial Prompt）在终端就绪后自动投递。
    - PTY 终端尺寸冲突保护：
      - 当终端尺寸被其他并发窗口（如手机端）改变时，桌面端停止自动回抢尺寸，并在右上角显示尺寸变更提示与「刷新」按钮，避免多端竞争错位。
    - 移动端全屏 TUI 触摸滚动与多端优化：
      - 全屏 TUI 交互优化：触摸滚动精准转换为行级 SGR 鼠标滚轮序列，长文本回滚与交互界面更顺滑、更跟手。
      - 修复查看历史消息时轮询新数据自动强行滑到底部的体验问题，增加移动端触屏交互锁与单会话初始加载保护，仅在停留在底部且未触摸时静默跟随。
      - 会话内快捷切换器（Quick Session Switcher）：在当前会话顶部轻点即可呼出活动会话列表，实现多 Tab 极速穿梭。
      - 会话列表新增实时搜索与未读更新红点提醒。
      - 对话流新增「隐藏工具调用」过滤开关，方便快速通读核心对话与结论。
      - 增加常显的右下角双向悬浮操作按钮（滑到底部 / 回到顶部），长对话查阅更省力。
      - 优化气泡流在各种屏幕宽度下的排版，彻底解决宽表格与代码块撑破屏幕边界的问题。
    - 全端主题与网络访问增强：
      - 桌面端与移动端全面统一为「浅色（Light）」、「深色（Dark）」与「跟随系统（System）」三档主题切换。
      - 完善反向代理与 HTTPS 穿透（Nginx、Cloudflare Tunnel 等）环境下的 Origin 与 Cookie 校验。
    - Claude 用量统计精准修复：
      - 修复 Claude 日志解析按 Assistant 消息去重，解决流式拆行导致同一轮回复用量被重复累加的问题。
    官网与文档
    - hero 上的版本徽章更新为 v0.5.2。
