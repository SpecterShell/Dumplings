  Key: ReleaseNotes
  Value: |-
    v0.6.12 (2026-11-23)
    这一版围着终端观感和文件面板的边界收尾：切窗口不再闪、分栏不再挤、备用屏不再吞字；终端里的路径还能直接交给 CoDock 内置编辑器。
    新功能
    - 终端路径可选内置编辑器：设置页的编辑器选择新增「CoDock 内置」（无 command），自动检测找不到 IDEA 时也回退到它；终端里 ⌘/Ctrl+点击路径会打开文件面板与对应文件，不再跳外部编辑器。无效的外部配置仍照旧报错，不会悄悄换成内置。
    - ⌘/Ctrl+点击路径不再误触终端：点击不再同时把这次点击报给 Claude Code，避免顺手展开工具输出。
    调整
    - 编辑器与文件面板此消彼长：两者之间的拖动条现在同时调整两侧宽度，不再挤动终端区域；宽度偏好照旧记在本机。
    - 备用屏列数不再吞字：只有最后一列几乎完整可见时才向上取整；余数不足时向下取整，宁可留一条窄缝，也不让 Claude Code 按满宽折行的正文被裁在右边缘。
    修复
    - Windows 切回窗口终端不再闪：窗格尺寸只在布局真的变化时同步量取，最小化时的 0×0 直接忽略；resize 引起 TUI 清屏重打时用同步输出攒住上屏，开合文件面板不再先闪一帧空屏。
    - 清回滚区后视口不再卡在会话开头：非 alt 屏的 Ink 类 TUI（Claude Code 非全屏、CodeBuddy）resize 时清屏重打，xterm 清回滚区后不复位滚动标记，画面会停在开头且不跟随；现在识别到清回滚区就跳过这一轮的滚动还原，并在重打超出一屏时滚回底部。
    - 带括号的文件名可点：路径识别把文件名里成对的括号算作路径的一部分，「(已剔除测试账号)」这类后缀也能整段点开。
