- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    K-Switch like the Kaiserreich.
    Only the switch. Your config files stay yours.
    K-Switch is a third-party, slimmed-down fork of CC Switch, built to address parts of upstream that had become bloated. It is not the official CC Switch and is not affiliated with its maintainers.
    K-Switch does one job: it writes the provider you choose into the config file your coding tool already reads. No local gateway is required to switch, no per-provider sidecar config tree is created, and your local files remain the source of truth.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    K-Switch like the Kaiserreich.
    只做切换，管好配置文件。
    K-Switch 是 CC Switch 的第三方 fork 精简版，意在解决上游部分臃肿问题；它不是官方 CC Switch，也与上游维护者无隶属关系。
    K-Switch 只做一件事：把你选择的供应商写进工具本来就在读的配置文件。切换不需要本地网关，不创建每个供应商单独的旁路配置文件，本地文件始终是唯一真相。
