    v0.12.0 Highlights

    This is the first stable release of the 0.12 line. It collects everything since v0.11.3: new avatar formats, a rebuilt voice pipeline, tool calls you can actually read, desktop computer use, and a lot of reliability work. The desktop app is also much smaller now. The macOS download dropped from about 870 MB to about 530 MB.
    Important
    The update bug is fixed in v0.12.0, but your current version still runs the old updater.
    - macOS and Linux: after "Download Update", you can see an error such as ditto: … No such file or directory, or "Restart" can > do nothing. Quit AIRI from the tray menu (or press Cmd+Q on macOS), wait about 10 seconds, then open it again. The update installs when the app quits. Closing the window is not enough. On Linux, a password prompt can appear.
    - Windows: updates work as usual.
    - If the version did not change after you reopen AIRI, download the installer from this page.
    - 0.12.0 beta and nightly users: your update lane follows beta releases. Open Settings → About and set the update lane to Stable, or download the installer from this page.
    - v0.9.0 and earlier: download the installer from this page.
