  Key: ReleaseNotes
  Value: |-
    2026-09-16
    本次更新优化了对话体验、跨端任务和桌面端稳定性。
    对话体验：切换任务时自动保留输入草稿，修复回复文字重影、空回复误报完成的问题，完善超时重试提示。
    跨端任务：优化续问、停止和状态同步，修复新任务内容残留及页面意外跳转的问题。
    启动与流畅度：修复部分用户升级后白屏的问题，减少对话结束后的卡顿，改善 Windows 启动兼容性。
    其他改进：修复远程文件与文本发送失败、搭子编辑和删除无响应的问题；优化登录失效处理、辅助功能的模型兼容性及侧栏展示。
