  Key: ReleaseNotes
  Value: |-
    2026-09-09

    本次桌面端工作台升级，围绕多工作目录、模型与积分展示、三栏任务工作台等方面，让任务、文件和成果更方便地放在一起处理，边沟通、边查看、边验收。
    多工作目录：不同项目，分开处理：新版支持添加和管理多个工作目录。你可以为不同项目、客户或工作内容设置对应目录，并在聊天输入框下方快速切换，让 Loomy 在指定目录中查找和处理文件，减少不同项目内容混在一起的情况。
    模型直接切换，消耗看得明白：模型选择入口移到了聊天输入框下方，不用再专门进入设置页面。同时，你还能查看每一轮实际使用的模型和思考强度，了解单轮任务的积分消耗，并查询积分流水。用哪个模型、花了多少积分，都更清楚。
    三栏任务工作台：对话和成果，一起看：左侧管理任务，中间与 Loomy 对话，右侧查看文件、网页和任务成果。沟通、查看、验收，可以在同一个工作台里完成。
    其他改进：支持多标签同时打开多个文件和网页，方便来回对照；目录浏览更顺手，文件较多时，也能更方便地查找和切换；优化文档、代码和配置文件的阅读与高亮效果，内容阅读更清晰；修改前后可对比，清楚看到 Loomy 改了哪些文件、具体改了什么。
