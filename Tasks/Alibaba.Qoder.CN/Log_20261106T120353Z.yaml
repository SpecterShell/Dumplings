Locale:
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    日常优化

    优化
    - 官网登录衔接：从已登录的 Qoder 打开受支持的官网页面时，可沿用当前账号登录，减少查看用量、升级计划等操作中的重复登录。支持 Global 与 CN，不适用于自建接入。
    - Remote Control：支持在桌面端与配套移动端之间双向同步任务的全局置顶和取消置顶，便于在不同设备上继续关注同一任务；工作区内置顶和本机手动排序保持各自的设置。
    - 额度确认：在支持的额度提示中点击“继续”，可明确确认本次继续请求使用 Credits；支持从手机远控传递该确认，授权不会自动延续到后续消息。
    - 计划执行：完善“按计划执行”和“以目标模式执行此计划”的选项说明与展示，便于根据任务需要选择执行方式。

    修复
    - 修复共享资源包未设个人限额或无可用额度时的用量显示，补充对应状态说明。
    - 修复本地插件安装记录内容损坏时，基础对话也无法继续的问题；不覆盖原有插件记录和启停设置。
    - 修复部分无法继续的对话提示仍提供无效重试操作的问题，支持从相应提示直接打开新任务。
ReleaseTime: 2026-11-06T06:00:33.3250000Z
