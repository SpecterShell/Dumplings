Locale:
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    文档与站点，创作更进一步

    功能
    - Word 插件：新增 Word 插件，支持在 Qoder 中打开、编辑和保存 DOCX 文件，并结合对话处理文档内容。
    - 站点设计画布：支持在设计画布中调整站点页面内容与布局，结合标注提出修改要求；网站模板以附件加入任务，并可选择设计风格，保留自己输入的要求。
    - 远程任务使用本机浏览器：在受支持的远程会话中，可通过授权连接操作控制设备上的 Qoder 内置浏览器，结合远端执行处理网页任务。
    - 鸿蒙手机碰一碰：在支持的鸿蒙设备上，可将手机中的图片和 PDF 传入当前本地任务或新任务草稿，也可将本地文件碰传到手机。
    - 企业审批管控：支持由企业策略限制“完全访问”和“自动审批”的可用性；相关模式被禁用时，后续操作按可用的审批方式执行。

    优化
    - 智能体团队：支持从当前设备、云端和同账号的其他设备选择成员，并在需要时启用协作能力；已连接设备的工作区可使用对应团队。其他设备上的负责人可用于讨论，本地任务仍遵循负责人所在设备的执行限制。
    - 插件创建：内置 Plugin Creator，完善通过对话创建、定制和打包插件的流程，支持组合技能、命令、智能体、Hooks 和 MCP 等能力。
    - 本地扩展安装：支持拖拽或粘贴文件安装插件与技能；申请 Qoder SDK 访问权限的插件，在安装或权限变化时展示人工授权确认。
    - 计划与目标：审阅计划后，可在支持该能力的任务中选择以 Goal 模式执行，继续围绕明确目标推进。
    - SSH 与 WSL：优化连接管理和工作区创建，支持直接填写 SSH 主机信息、选择认证方式及重新关联连接；手动断开后暂停自动重连，保留工作区与任务记录。
    - 设备连接：按账号关系设置首次配对的授权范围，完善连接地址校验与局域网诊断；支持显式确认后停止远端工作并更新设备，也可在本地任务中引用已缓存的离线设备会话内容。
    - 模型选择：新任务在确认额度耗尽且存在可用免费官方模型时，可默认选择该模型；补充大上下文用量提示、专属资源包余量提醒和更清晰的限流说明。
    - 诊断与反馈：完善 Qoder Helper 的 Hook 耗时诊断及远端设备的问题诊断。
    - 跨设备自动化：在已连接设备的会话中，可通过 / 菜单创建自动化任务，由该设备执行和管理；SSH 与 WSL 会话不开放该入口。

    修复
    - 修复长会话向前翻阅停滞、章节导航缺失，以及搜索定位与回到底部相互干扰的问题。
    - 修复派生任务未继承自定义分组、部分分支任务初始化失败后无法继续，以及后台子智能体历史入口丢失的问题。
    - 修复恢复归档工作区中的单条任务时，其他归档任务也被恢复的问题。
    - 修复远端任务的结构化附件、Sites 模板附件及排队附件撤回重发失败，并修复远端 Office 附件预览、保存和生成文件读取异常。
    - 修复跨设备会话模型目录、默认模型和企业模型分类显示不一致的问题。
    - 修复远端最近会话排序、目录订阅中断后的同步恢复及实时语音状态展示异常。
    - 修复远端团队首次交接、后续委派引用、插件智能体协作启用，以及切换账号后团队历史显示异常。
