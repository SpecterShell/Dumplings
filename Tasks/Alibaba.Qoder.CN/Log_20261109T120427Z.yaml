  Key: ReleaseNotes
  Value: |-
    日常优化

    功能
    - PPT 模板：支持选择 PPT 模板，预览封面与页面示例，结合自己的要求创建演示文稿。

    优化
    - Remote Control：优化移动端远程控制长会话性能与速度。

    修复
    - 修复 Remote Control 历史消息中的图片和文件附件可能无法打开的问题。
    - 修复 Remote Control 中已开始执行的用户消息显示延迟，以及插话与后续回复混入原消息段的问题。
    - 修复 Remote Control 中尚未执行的排队消息提前出现在会话历史中的问题。
