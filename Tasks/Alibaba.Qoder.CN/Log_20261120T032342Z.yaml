  Key: ReleaseNotes
  Value: |-
    跨网络连接你的设备

    功能
    - 设备连接与远控：支持同账号设备跨网络连接。在目标设备开启“允许被操控”后，即可访问已授权的工作区和任务
    - 对话与产出分享：从本机或已同步的远端对话中选择已完成的消息，可将选中的记录和产出文件下载保存至本机或发送到有权限的讨论或同一项目的 Issue。
    - Issue 团队协作：支持项目协作的账号可将 Issue 指派给智能体团队、改派 Issue，并查看哪些执行需要人工介入。从评论发起执行会保留原指派。
    - 插件与技能分享：在已开放分享的公共市场，可通过链接分享、预览和安装符合条件的插件或独立技能。
    - 加密 Office 文档：可用密码打开受支持的 Word 和 Excel 文件，编辑后加密保存。
    - PAC 代理：可通过 URL 或本地文件配置 PAC，并在登录页或设置中诊断连接问题。

    优化
    - 远程工作区：新任务跟随所选设备，附件可提前上传。受管 SSH 断线后，已受理的任务可继续运行。
    - 模型与文件：支持的自定义模型可设置输出上限。
    - PPT 插件： 原生图表可内嵌可编辑的 Excel 数据。

    修复
    - 修复部分会话无法打开、重启后找不到待审批计划，以及重试图文消息时附件丢失的问题。
    - 修复远端 Office 文件保存冲突或刷新后显示异常，以及部分 Windows 安装、更新和 Linux DEB/RPM 后续更新失败的问题。
