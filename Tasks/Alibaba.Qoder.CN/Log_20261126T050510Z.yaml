  Key: ReleaseNotes
  Value: |-
    跨设备协作与云端任务

    功能
    - 云端任务：可在桌面端创建或继续云端任务，查看执行进度和生成的文件。
    - 跨设备协作：支持从已连接设备的工作区下载文件，并可按权限查看和管理该设备上的自动化任务。
    - 本机任务恢复：退出或更新 Qoder 后，可恢复符合条件的未完成任务，继续在本机执行。
    - 受管设备登录：企业管理员可将受管设备的登录范围限定为指定组织的企业账号。

    优化
    - 归档管理：支持按组恢复或删除已归档的本机任务。在搜索结果中批量删除时，仅删除匹配项。
    - 字号与界面缩放：对话正文和输入框新增特大字号，界面缩放可单独设为 125%。

    修复
    - 修复数据目录迁移后部分插件无法安装，以及部分插件的后台服务在受限 Windows 环境下无法启动的问题。
    - 修复自动化任务保存结果后，因后台连接中断而阻塞下一次运行的问题。
    - 修复已选择可用模型却无法开始对话的问题。
    - 修复远程控制会话中部分历史消息补传后显示顺序不正确的问题。
