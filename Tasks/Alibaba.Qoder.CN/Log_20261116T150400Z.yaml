  Key: ReleaseNotes
  Value: |-
    日常优化

    修复
    - 修复部分子智能体的模型或配置异常导致主会话无法启动或继续对话的问题。
    - 修复频繁切换任务、后台通知集中更新或会话内容加载失败后，部分任务无法打开的问题。
    - 修复设备信息准备较慢时，活动通知或权益提醒请求提前超时的问题。
    - 修复部分模型的上下文超限错误未被正确识别，导致无法按预期触发压缩恢复的问题。
    - 修复切换模型或调整上下文窗口后，上下文用量计算可能沿用旧配置的问题。
    - 修复从已压缩的会话派生任务或恢复到指定消息时，部分保留消息的关联关系异常的问题。
