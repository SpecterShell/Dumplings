  Value: |-
    What changed
    All 72 commits in this release.
    - ci(release): build the macOS disk image from a mounted sparse image (f95a5e6, 2026-11-02, zetxtech)
    - ci(release): drop the duplicated platform prefix from the windows job name (77dde8f, 2026-11-02, zetxtech)
    - docs: document the platform-prefixed download names (b27b73b, 2026-11-02, zetxtech)
    - ci(release): name every artifact for its platform and generate release notes (15935e9, 2026-11-02, zetxtech)
    - docs: rewrite the intro around what the app gives you (dcd0fac, 2026-10-29, zetxtech)
      The previous paragraph listed features in one flat sentence. It now leads with ownership of the apps you already installed, names the outcomes users actually want (old versions, backups, reinstall, self-signed installs) and keeps the local, no-third-party promise as its own line.
    - docs: link the stars badge to the repository (8c6a2b4, 2026-10-29, zetxtech)
    - docs: use a static prs badge (4e33a19, 2026-10-29, zetxtech)
    - docs: use tag based badges that resolve before the release is published (1bcc0c3, 2026-10-29, zetxtech)
    - docs: add bilingual readme with screenshot placeholders (707814a, 2026-10-29, zetxtech)
      The screenshots are neutral svg placeholders so the layout is complete before real captures exist; replacing a file and its link in the readme section is all that is needed.
    - chore(release): reset app version to 1.0.0 (c9dd773, 2026-10-29, zetxtech)
    - ci(release): give portable artifacts distinct names (fbd3a1d, 2026-10-28, zetxtech)
      The release job publishes every downloaded file by base name, so the x64 and x86 portable executables both named ipaget.exe overwrote each other and the linux binary arrived as a bare ipaget. Each portable artifact now carries its platform in the file name.
    - chore(release): set app version to 1.0.1 (fa0614f, 2026-10-28, zetxtech)
    - ci(release): merge macos apps on an intel runner (15edc9e, 2026-10-28, zetxtech)
      The universal job needs no arm64 hardware, yet it sat in the arm64 queue and was cancelled twice by capacity limits with zero steps executed. The intel macOS runner used by the x64 build has been reliable in every run.
    - ci(release): free disk space before building the universal dmg (40dde47, 2026-10-28, zetxtech)
      The universal job hit "hdiutil: create failed - No space left on device" while the two architecture copies and both zips were still on disk. The zips are now deleted right after unpacking and the per-architecture apps before the image is created, the free space is logged, and the job falls back to a zip of the universal app if the disk image still cannot be written.
    - fix(bundle): ship png icons required by appimage (e7475e8, 2026-10-28, zetxtech)
      The bundle icon list only had icns and ico, so tauri-bundler could not find a square icon and aborted AppImage creation with an expect panic. The standard png set is now bundled, which Linux packaging needs.
    - ci(release): fix macos artifact paths and fail on missing files (4a715d8, 2026-10-28, zetxtech)
      The .app lookup relied on **, which macos bash 3.2 does not expand as globstar, so no zip was ever produced; the dmg upload also pointed at bundle/macos while tauri writes dmg bundles to bundle/dmg. Uploads now fail loudly instead of silently skipping, which is what made the universal job fail far away from its cause.
    - ci(release): add the linux graphics and input dev libraries (22a50d0, 2026-10-28, zetxtech)
      Linker could not find -lgbm, and the xcap/pipewire stack also needs drm, wayland, xkbcommon, EGL, xcb-shm/xfixes/shape and libxdo headers. libfuse2 is installed under its 24.04 name and only for running AppImages, instead of the fuse package that removed the runner fuse3.
    - chore(release): set app version to 1.0.0 (1c6769a, 2026-10-28, zetxtech)
    - ci(release): build linux on ubuntu 24.04 for newer pipewire (be26969, 2026-10-28, zetxtech)
      xcap unconditionally pulls pipewire, libwayshot and zbus on Linux, and the pipewire headers shipped with ubuntu 22.04 lack the spa_video_info_raw fields those bindings expect, so the crate cannot compile there. The 24.04 image provides them; the produced AppImage now requires the newer glibc, which is a deliberate trade-off documented with the run.
    - ci(release): give unix jobs a valid config and system libs (6aafae7, 2026-10-28, zetxtech)
      TAURI_CONFIG expects inline JSON, so pointing it at tauri.ci.conf.json made tauri-build fail with "expected value at line 1 column 1" on both macOS jobs, while Windows passed because it never set the variable. The hook already builds the frontend and the Go service on every platform, so the patch step and the jq dependency are gone. Linux also needs the pipewire, dbus, xcb and xrandr headers that xcap compiles against.
    - ci(release): pass flags to the tauri cli, not cargo (5c7c76c, 2026-10-28, zetxtech)
      The -- separator tells the tauri CLI that the remaining arguments belong to the underlying cargo command, so --bundles, --target and --ci were forwarded to cargo and every platform failed with cargo build --bundles. The Go cache path also pointed at the repository root while the module lives in go-service.
    - chore(release): align app version with tag (6907c53, 2026-10-28, zetxtech)
    - ci(release): fix platform bundles and runners (2242f8d, 2026-10-28, zetxtech)
      The go-ios module was never initialized, so every platform failed at the Go build step. Windows rejects the app bundle type, Linux has no app bundle, go.mod requires Go 1.25, and the macos-13 runner is retired. Portable Windows output now comes from the release binary instead of a bundle directory that never existed.
    - fix(service): build without cgo on unix and 32-bit windows (58172a6, 2026-10-28, zetxtech)
      onepassword-sdk-go v0.4.1-beta.1 fails to compile by design when CGO is disabled on darwin/linux, which broke the whole root package on those targets; v0.4.1 defers that check to a runtime error instead. ppmd v0.1.0 overflows int on 386, and the simulated IMEI/IMSI ranges exceeded a 32-bit int.
