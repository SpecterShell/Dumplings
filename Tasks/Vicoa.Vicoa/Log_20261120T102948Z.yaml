  Key: ReleaseNotes
  Value: |-
    Bundles Vicoa CLI daemon v1.10.1.
    🚀 Features
    - AGENTS: don't name other products in PRs, commits or docs in https://github.com/vicoa-ai/vicoa/commit/8a029d8
    - Dashboard plugin: Needs you lists the open questions on tasks; the plugin bridge reports openQuestions in https://github.com/vicoa-ai/vicoa/commit/8231f26
    - Tasks: annotate text in a comment and send it in a reply in https://github.com/vicoa-ai/vicoa/pull/264
    - Tasks: agents link the tasks, sessions, automations and PRs they mention in comments in https://github.com/vicoa-ai/vicoa/pull/265
    - Tasks: a comment wakes only the agents it is for in https://github.com/vicoa-ai/vicoa/pull/263
    - CLI: rename, recolour and delete task labels in https://github.com/vicoa-ai/vicoa/pull/261
    - Tasks: pick an assignee when creating a task, including teammates in https://github.com/vicoa-ai/vicoa/pull/260
    - Tasks: an agent's task session starts in its folder; the agent makes a worktree when it changes code in https://github.com/vicoa-ai/vicoa/pull/259
    - Sessions: store an imported session's folder as ~/… like registered ones in https://github.com/vicoa-ai/vicoa/pull/258
    🧹 Maintenance
    - Desktop: v0.2.1 (bundle daemon v1.10.1) in https://github.com/vicoa-ai/vicoa/commit/75d9f30
    - Update pyproject to v1.10.1 in https://github.com/vicoa-ai/vicoa/commit/be3df65
    Full Changelog: https://github.com/vicoa-ai/vicoa/compare/v0.2.0...v0.2.1
