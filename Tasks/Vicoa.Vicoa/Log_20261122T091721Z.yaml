    - Tasks: agents answer a comment in the language it was written in in https://github.com/vicoa-ai/vicoa/pull/268
    - Mobile: filter tasks by Relation to me in https://github.com/vicoa-ai/vicoa/pull/269
    - Tasks: keep task text with a lone surrogate instead of failing with a 500 in https://github.com/vicoa-ai/vicoa/pull/267
