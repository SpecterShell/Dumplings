    Bundles Vicoa CLI daemon v1.10.2.
    🚀 Features
    - Mobile: swipe between the images in a folder in the file viewer in https://github.com/vicoa-ai/vicoa/pull/273
    - Billing: a Free chip in the sidebar, upgrade events name their entry, a quieter account menu in https://github.com/vicoa-ai/vicoa/pull/272
    - Docs: say which session picks up a task comment in https://github.com/vicoa-ai/vicoa/pull/270
    - Sessions: a summary card for the project, folder, branch and task in https://github.com/vicoa-ai/vicoa/pull/271
