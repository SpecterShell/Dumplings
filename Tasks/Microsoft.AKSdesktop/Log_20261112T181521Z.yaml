  Key: ReleaseNotes
  Value: |-
    AKS desktop v0.11.0 adds Windows on Arm support and preview upgrade-readiness checks, alongside fixes for Azure connections, GitHub sign-in, and port forwarding from projects.
    What's new
    - Windows on Arm now has its own installer. The app runs natively on ARM64; the bundled Azure CLI and Python use Windows 11 x64 emulation.
      Installation note: On Windows ARM64, installing for all users defaults to Program Files (x86), but the app still runs natively on ARM64. You can select Program Files during installation.
    - You can disconnect GitHub from the project header. "Disconnect GitHub" removes the app's saved credentials across project views, without signing you out of your browser or revoking GitHub permissions. If removal fails, you can retry.
    AKS enabled by Azure Arc (preview)
    AKS Desktop can discover and connect to AKS clusters running on bare-metal infrastructure through Azure Arc (Hybrid & Edge), alongside your Azure-hosted AKS clusters. Select a subscription during cluster registration or in the Create Project wizard to find these clusters.
    Finding clusters and checking their health is faster. Discovery failures now show the Azure error rather than an empty list or a misleading extension-install prompt. On Windows, connections no longer time out just because startup output was missed.
    This preview covers AKS-provisioned Hybrid & Edge clusters, not arbitrary bare-metal Kubernetes clusters or generic Arc-connected clusters.
    Upgrade Insights (preview)
    Upgrade Insights lets you review stored readiness checks and request a new evaluation before planning an AKS upgrade. You can filter the cluster inventory, inspect individual checks, and follow remediation links.
    Enable Upgrade Insights under Settings > Preview Features, then open Upgrade readiness from Home. The feature is off by default and requires access to the Azure public-cloud service preview and appropriate Azure permissions.
    Generating an evaluation does not upgrade, drain, or remediate your cluster. Results are point-in-time checks, not a guarantee that an upgrade will succeed.
    Performance
    Listing Azure subscriptions and resource groups, finding clusters and projects, and checking Hybrid & Edge health are faster. These operations now call Azure REST APIs directly instead of starting an Azure CLI command for each lookup. Entra user searches also go directly to Microsoft Graph.
    Fixes
    - Azure commands work again in signed macOS ARM64 apps.
    - Linux ARM64 packages include compatible Azure tools, fixing commands that could not run in 0.10.0.
    - GitHub browser sign-in and token refresh work again.
    - The "Port Forward" button is back in service details opened from a project.
    - Managed namespace deletion waits for Azure to finish removing the namespace. Existing Keep/Delete retention policies are unchanged.
    - Kubernetes API requests consistently identify the app as AKS Desktop with its version, operating system, and architecture, improving server-side diagnostics.
    - Cluster registration works after removing the last context, including when the existing kubeconfig contains null collections. Existing configuration is preserved.
    - Signed macOS ARM64 apps no longer crash immediately on startup, as observed in the release candidates.
    - The AKS Desktop tray icon is restored, with improved high-resolution rendering on macOS.
    AI Assistant
    The bundled AI Assistant is updated to 0.5.0-alpha, with a fix for app translations not appearing consistently.
    Diagnosis cards show which resources need attention and let you retry a failed analysis.

    YAML review shows the target cluster above the manifest and on the Apply button, so you can check where a change will go before applying it.

    Screenshots from the AI Assistant 0.5.0-alpha release notes, taken in Headlamp with test data. The failed analysis in the first image is intentional, to show the retry controls.
    Other changes
    - The namespace wizard's home navigation control is labelled "Back to home" for screen readers.
    - "Contact us" on the error screen opens an issue in the AKS Desktop repository with diagnostic details.
    - Telemetry documentation explains what is collected and how to opt out. Data collection itself has not changed.
    - Bundled dependencies have security updates. Some reported dependency advisories remain unresolved.
    - Translations are refreshed across 18 languages.
    - The extra AKS logo above “No clusters found” is removed. The app logo, message, and Add Cluster action are unchanged.

    The project creation wizard, captured for the provider-registration update.
