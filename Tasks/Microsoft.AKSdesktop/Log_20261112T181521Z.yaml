    Performance
    Resource lookups and status checks spend less time starting Azure CLI processes. Reusing cached tokens also avoids repeated credential requests.
    - #1054: Reuse cached Azure tokens to avoid repeated credential requests during resource lookups. Thanks to @tejhan.
    - #1081: Speed up subscription and resource group lookups by removing per-operation Azure CLI startup. Thanks to @tejhan and to @illume for reporting.
    - #1088: Speed up cluster and project discovery with direct, paginated Azure queries, while reporting truncated results. Thanks to @tejhan and to @illume for reporting.
    - #1073: Avoid Azure CLI startup when registering resource providers during project setup, preserving cancellation and subscription context. Thanks to @illume.
    - #1076: Remove Azure CLI startup from managed namespace deletion while still tracking completion and preserving retention policies. Thanks to @illume.
    - #1058: Make Hybrid & Edge health checks faster by querying Azure directly. Thanks to @skoeva and to @illume for reporting.
    - #1105: Make Hybrid & Edge discovery faster with direct Azure requests and show discovery errors. Thanks to @tejhan.
    - #1095: Avoid Azure CLI startup for Entra user searches, preserving manual entry and account/cloud isolation. Thanks to @skoeva.
