    - #961: Apply Insights plugin dependency audit fixes. Thanks to @skoeva.
    - #962: Apply AKS Desktop plugin dependency audit fixes. Thanks to @skoeva.
    - #1091: Update vulnerable npm dependencies and bundled Azure CLI Python packages. Thanks to @skoeva.
    - #1093: Add a workflow to sign release checksums and verify published assets. Thanks to @skoeva.
