  Value: |-
    🚀 VPN Parser v1.15.15 发布说明 / Release Notes
    🎉 欢迎使用 VPN Parser v1.15.15！本版对分流规则系统与 DNS 解析策略进行了重大增强，全面内置全量 .cn 直连与国内高防 WAF 域名直连，杜绝国内网站误走海外代理触发 ERR_SSL_VERSION_OR_CIPHER_MISMATCH 协议握手错误，并强化端口占用诊断与残留孤儿内核清理能力：
    🛡️ 根治境内网站 WAF 阻断与 SSL 协议错误
    - 全量 .cn 顶级域名直连：参考 Shadowrocket、Surge 等成熟客户端标准，内置推荐分流与智能分流前置规则引入 DOMAIN-SUFFIX,cn,DIRECT，秒级放行所有 .cn 站点，彻底解决因 GEOIP,CN,no-resolve 导致的漏网走代理问题。
    - 高防社区与 WAF 专属保底直连：内置对吾爱破解（52pojie.cn）、知道创宇云安全高防（yunaq.com、jiasule.com）等易受海外机房 IP 拦截站点的专属直连策略，杜绝因 WAF 阻断下发非标 TLS 重协商导致的 ERR_SSL_VERSION_OR_CIPHER_MISMATCH。
    - 境内权威 DNS 分流强化：nameserver-policy 同步补充 +.cn 与 +.52pojie.cn 绑定境内权威 DNS（阿里、腾讯 DoH/UDP），确保 100% 解析出大陆最佳 CDN 节点，避免 DNS 海外污染。
    ⚡ 端口占用诊断与进程精准收容
    - 占用进程明细透出：代理端口被占用时通过系统网络套接字逆查并提示具体的占用程序名称与 PID（如 占用进程：mihomo.exe [PID: 1234]），告别盲猜。
    - 孤儿内核精准清理：多路径加权判定本程序内核实例，避免盲杀第三方代理工具，多轮重试阶梯退避释放端口。
