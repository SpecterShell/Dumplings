  Key: ReleaseNotes
  Value: |-
    🚀 VPN Parser v1.15.1 发布说明 / Release Notes
    🎉 欢迎使用 VPN Parser v1.15.1！本版针对用户反馈的界面交互、抽屉排版与表格展现进行了全面深度优化与视觉重构：
    🛠️ 界面交互与布局深度优化
    - 网络设置抽屉布局修复与去重：
      - 彻底解决点击系统代理 / TUN 模式图标打开网络设置抽屉时左侧文字被遮挡截断（“网络设置”变成“设置”）的问题，引入 Y 轴相交安全裁剪矩形，杜绝横向内容裁切；
      - 抽屉宽度自适应扩充至 540~780px，DNS 输入框改为响应式弹性布局；
      - 移除抽屉内部冗余重复的二级标题，垂直空间全部释放给核心网络配置项。
    - 活跃连接与 DNS 审计抽屉 100% 满宽展示：
      - 彻底消除抽屉右侧大片空白，活跃连接、连接进程与 DNS 审计三大表格全面引入自适应列宽分配；
      - 核心“目标地址”、“进程”与“查询域名”列动态吸收全部可用空间，配合原生像素级智能文本截断与悬停全量提示，长域名与目标 IP 清晰呈现。
    - 订阅源列表行高与条纹背景对齐修复：
      - 彻底修复订阅源列表中单元格内容超出单行条纹背景色的问题，各单元格高度真实反馈至 Grid 容器，行高随内容动态撑开，条纹底色 100% 完整包裹整行。
    - 订阅源流量配额重构成“一条线”单进度条：
      - 告别原本上下堆叠的双柱状图，将总额度与已用量重构为单条一体化进度线；
      - 进度底色代表总额度，填充高亮代表已用量，右侧标注已用百分比（根据剩余额度智能预警变色：蓝/橙/红）；
      - 下方单行紧凑展示 已用流量 / 总额度 · 到期日，整行视觉更加整洁对称。
    - 大幅放宽订阅源列表「名称」列展示宽度：
      - 名称列宽度由原先狭窄的 55~95px 翻倍扩展至 120~240px，中长机场订阅源名称完整舒展呈现。
