  Value: |-
    🚀 VPN Parser v1.15.5 发布说明 / Release Notes
    🎉 欢迎使用 VPN Parser v1.15.5！本版默认启用了全新打造的「控制台简易模式」，对界面进行了深度视觉去噪与比例重构，升级了单行胶囊调度器，并彻底根除了多菜单切换的页面闪烁问题与标题栏交互体验：
    🖥️ 控制台简易模式（Compact Mode）与极简重构
    - 默认启用简易模式：
      - 新安装与默认启动全面采用极简高效的「简易模式」（可在「系统设置 - 外观」中自由切换为「完整模式」）；
      - 移除了第 2 行监控图表，将高度合理回流分配给核心功能区，第 3 行卡片高度大幅扩展至 180px（外框 200px），界面开阔大气；
      - 核心状态卡片与网络速率卡片支持动态智能垂直居中算法，各类屏幕下元素均呈现黄金比例；
      - 简易模式下自动收起服务状态卡中的内核选择器，仅保留运行时长、组织归属与协议类型等关键信息。
    - 全局视觉降噪与冗余精简：
      - 服务状态：移除「直连实测 / 经代理实测 / 检测中」等冗余峰值标签，保持纯净；
      - 分流规则：移除右上角「命中 0 次」标签；
      - 出站模式：移除右上角「当前 · 规则 · 订阅模式」及底部长段描述，三段胶囊居中展示；
      - 策略组：移除右上角「共 9 个」计数文本；
      - 活动连接：移除标题右侧「0 条」微标。
    🧭 单行胶囊分段策略组调度抽屉
    - 极简 Segmented Capsule 交互：
      - 策略组配置抽屉中原 2×2 网格的「延迟选优、故障转移、负载均衡、手动指定」重构为现代单行胶囊分段条；
      - 苹果微晶质感背景容器与高亮切换动效，点击即时下发调度策略，操作行云流水。
    📦 订阅源界面纯净化清理
    - 移除顶部大型度量看板：彻底删除源启用率、源可用率、订阅源池、累计解析节点等复杂看板卡片，还列表以清爽；
    - 移除冗余 Gist 操作入口：删除第二行操作栏的「Gist 节点」与「Gist 配置」按钮；
    - 净化表格状态与拉取信息：表格不再输出「ok」、「content unchanged」、「连续超时 N 次」等冗长文字，仅保留纯净的启用/停用与警告徽标；移除最近拉取列的「最近解析 N」文本。
    ⚡ 菜单流畅切换与原生标题栏优化
    - 消灭页面切换全屏闪烁：
      - 修正侧边栏 Tab 状态前置更新，消除 1 帧视图滞后与顿挫；
      - 移除顶层动态 ID Salt 包装，消除切换时子组件几何重排，并取消多余的 repaint 重绘；
    - 原生拖拽与双击全屏：
      - 优化标题栏事件捕获，恢复即按即拖的 Windows 原生窗口拖动响应；
      - 标题栏双击 400ms 内平滑在最大化与原始窗口尺寸之间切换。
