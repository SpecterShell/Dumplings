  Key: ReleaseNotes
  Value: |-
    🚀 VPN Parser v1.15.3 发布说明 / Release Notes
    🎉 欢迎使用 VPN Parser v1.15.3！本版重点提升了节点来源可识别性，统一了全应用卡片视觉风格，并优化了分流解析与 Hysteria 1 协议兼容性：
    🏷️ 节点卡片订阅源展示与视觉全局统一
    - 节点卡片全场景订阅源微标：
      - 在所有节点卡片（节点池、代理选择、策略组调度抽屉、订阅源弹框）第二行新增专属微晶胶囊风格的“订阅源”微标，内嵌专属订阅盘图标；
      - 针对剪贴板导入或自建无源节点，贴心标为“未分组”，节点出处一眼可见；
      - 采用动态宽度排版，超长订阅名称平滑截断，并支持悬停气泡查看完整订阅源名称。
    - 全应用节点卡片与容器视觉统一：
      - 统一“节点池列表”、“代理可用节点”、“策略组切换抽屉”与“订阅源节点弹窗”四大界面的卡片排版与行间距；
      - 将代理管理节点卡片网格统一嵌入 panel_frame() 晶体背景容器，消除视觉悬浮与层级差异；
      - 统一卡片悬浮发光边框圆角（10px）与网格行间距（4px），带来像素级精致质感。
    🌐 分流解析修复与 Hysteria 1 全面兼容
    - 恢复国内域名直连极速解析：
      - 纠正 GEOIP,CN 规则强制追加 no-resolve 导致的非典型国内域名跳过本地 DNS 解析、漏网穿透至远程代理的问题，恢复国内网站秒开与极速直连；
    - Hysteria 1 协议规范化与平滑兜底：
      - 完善 Hysteria 1（hy1）节点在客户端中的解析与参数重构，支持 skip-cert-verify / allowInsecure 证书跳过透传；
      - 在内核路由器中完善 Hysteria 1 协议的平滑降级机制，自动调度支持该协议的内核（Mihomo）完成测速与代理转发，确保各类老版本节点畅通无阻。
