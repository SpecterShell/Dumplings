  Value: |-
    🚀 VProxy v1.16.6 发布说明 / Release Notes
    🎉 VProxy v1.16.6 正式发布！本版本重点上线了 节点右键路由追踪全景诊断（5 大环节实时白盒诊断），深度对接了 VP-Core v1.7.0 原厂 Explain 推演引擎 与 原生 .vp 声明式 DSL 编译生成，并全面加固了 策略组熔断保底 (fallback: "DIRECT") 与 多数据源 IP 风控自愈链路：
    🧭 路由追踪：节点 5 大环节白盒链路推演与诊断
    - 全景分流流水线拆解：
      - 节点右键菜单新增「🧭 路由追踪」，清晰拆解流量流经内核的完整生命周期：01 入站会话（真实 TCP 握手 RTT）、02 协议嗅探（TLS SNI 提取 / 内核 DNS 真实反查）、03 规则逐级匹配（逐项匹配过程与短路截断）、04 路由动作（策略组自动优选与裁决决策）与 05 终结点决策（远端真实端到端网络实测）；
    - 界面极致精炼与防抖动：
      - 移除多余的通告横幅，将网络采样状态平滑收拢至右上角动态指示胶囊内，彻底消除诊断弹窗高度频繁上下跳动；
    - 全场景双模平滑自适应：
      - 运行 VP-Core 时直连原厂 /routes/explain API，点亮内核原生白盒推演徽章与微秒级 CPU 时序；
      - 运行 Mihomo / sing-box / Xray 或离线时，毫秒级自动降级至客户端同构白盒推导引擎，全场景 100% 稳定可用，对其他内核零侵入、零破坏。
    🛡️ 策略组防断网：VP-Core fallback: "DIRECT" 熔断保底
    - 策略组全员失效自动兜底：
      - 为 VpCoreCompiler 编译输出的所有策略组自动注入 fallback: "DIRECT" 熔断保护；
      - 当策略组中所有节点同时断联超时或正则筛选为空时，内核自动将流量平滑回退至直连出站，彻底根除整机全局断网。
    ⚡ 声明式 DSL：VP-Core 原生 .vp 极简配置与 CEL 规则对接
    - 原生块结构与 Google CEL 表达式引擎：
      - 支持 inbound、dns、node、group、route 原生极简块语法编译，彻底摆脱 YAML 缩进错误与 JSON 语法冗余；支持 CEL 复合条件表达式（AND / OR / NOT 零开销比对）；
    - 全套可视化查看与导出支持：
      - 「分流策略组」->「配置」新增 VP-Core 原生 DSL (.vp 声明式) 选项卡，提供即时语法高亮预览与一键复制；
      - 节点池「📥 导入/导出」菜单新增 导出 VP-Core 原生 (.vp DSL)；
      - 本地 HTTP API 开放 /api/export/vp 导出接口。
    🌐 网络画像：IP 落地风控多源降级与代理穿透
    - 四级数据源灾备：
      - 新增 api.ip.sb 作为第三级落地风控数据源，形成 ipinfo.io -> ipwho.is -> ip.sb -> ip-api.com 完备降级链，彻底根治单点速率限制与网络超时；
    - 智能直连与代理双通道穿透：
      - 引入 direct_client 防外部环境变量污染，并在直连受阻时自动无缝降级走本地代理通道查询，确保节点机房/住宅与 ASN 识别永远成功。
