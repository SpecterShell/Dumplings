  Key: ReleaseNotes
  Value: |-
    Welcome to this new release of rv v0.23.0!
    All artifacts are signed with this repos identity using Sigstore.
    You can verify the signatures using the GitHub CLI.
    gh attestation verify --owner A2-ai <my-artifact>
    What's Changed
    - improve rpm package name parsing by @weswc in https://github.com/A2-ai/rv/pull/503
    - Invoke Rscript.exe directly instead of via .bat shim (#488, #489) by @svraka in https://github.com/A2-ai/rv/pull/502
    - Use url content in local cache when possible by @Keats in https://github.com/A2-ai/rv/pull/507
    - Add --r-bin to rv sync by @Keats in https://github.com/A2-ai/rv/pull/508
    - Monorepo fix by @weswc in https://github.com/A2-ai/rv/pull/359
    - Isolate git tests from the machine's git configuration by @svraka in https://github.com/A2-ai/rv/pull/505
    - Add bioc support by @Keats in https://github.com/A2-ai/rv/pull/511
    - Handle local monorepo by @Keats in https://github.com/A2-ai/rv/pull/510
    - Keep mtime of files when copying by @Keats in https://github.com/A2-ai/rv/pull/518
    - Get known rig names in PATH by @Keats in https://github.com/A2-ai/rv/pull/509
    - Self contained scripts by @Keats in https://github.com/A2-ai/rv/pull/513
    - Bioc2 by @Keats in https://github.com/A2-ai/rv/pull/521
    - Fix unc path handling by @Keats in https://github.com/A2-ai/rv/pull/522
    - Panics by @Keats in https://github.com/A2-ai/rv/pull/523
    - Add migrate tests by @Keats in https://github.com/A2-ai/rv/pull/524
    - added filtering to tree command to show only paths that lead to targe… by @mduncans in https://github.com/A2-ai/rv/pull/305
    - Fix mtime_update for local package by @Keats in https://github.com/A2-ai/rv/pull/526
    - Add sandbox mode by @Keats in https://github.com/A2-ai/rv/pull/512
    New Contributors
    - @svraka made their first contribution in https://github.com/A2-ai/rv/pull/502
