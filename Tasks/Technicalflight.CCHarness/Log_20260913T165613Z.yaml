- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - Anthropic 请求侧修复：多轮对话历史（含工具调用链）以原生 tool_use / tool_result 块完整重放进 Claude 上下文——此前该协议臂只发送当轮消息，多轮对话静默失忆、工具链被剥成纯文本
    - 智能体与并发：圆桌群聊回读修复（此前第 2 位起成员发言读不到）、同会话并发发送 stop 守卫、SSE 工具调用增量索引上界（畸形上游不再可撑爆内存）、工具完成判定对 legacy finish_reason 兜底、stopped 回合 live 与重启重建字节一致
    - 持久化纪律：改名 / 置顶 / 归档 / 工作区 / 隔离开关 / 删除会话等元数据写入全部纳入保存锁（与流式落盘互斥）、落盘 rename 重试、配置文件读损坏先备份 .broken 再兜底（不再覆盖原配置）、memo 水位与 in-history 系统提示更新改为「落地后记账」（失败回合重新注入而非静默丢失）
    - 网络与 SSRF：Base URL 主机名解析后逐 IP 分类（nip.io / sslip.io 型公网域名指向内网被拒）、网页抓取逐跳重放沙箱网络策略并解析后锁定、git 远程 URL 传输白名单（ext:: 等命令执行形拒绝）
    - 工具与 MCP：workspace 遍历强制 canonical 边界（目录符号链接 / junction 不再越界读）、写路径识别 NTFS reparse point、MCP stdio 写超时与响应行上限、子代理工具结果纳入 guardrails 围栏、任务清单会话 ID 消毒、ccswitch 导入不回吐明文密钥、会话导入 64MB 上限
    - 会话生命周期：子任务（subagent）会话随父会话级联清理（会话文件 / 前缀缓存条目 / 附件不再无限累积），启动时自动清扫孤儿记录
    - 界面体验：流式中删除会话先停流清态、# 菜单回车取过滤后首项、粘贴转附件受大小上限约束、遥测 / 审阅页慢响应守卫、编辑重发输入法组合键防误触、浏览器 confirm 全部迁至自绘对话框、mermaid 图随明暗主题切换重渲染、文件预览过期响应丢弃、标题栏窗口监听器卸载竞态修复、CSP img-src 收紧（去除明文 http）
    - 目标模式：验收清单计数容忍 Markdown 列表前缀（- / * / 1. 开头的 ✅ ⬜ 行不再漏计）
    - 安全加固（第一批）：工具写路径符号链接逃逸防护（最深已存在祖先逐级校验 + 写侧拒绝）、网页抓取重定向逐跳「解析后锁定」（防 DNS 重绑定，IPv4 映射地址归一分类）、glob 工具拒绝根分隔符 / 相对上跳 / 盘符模式、沙箱命令提取包装器内层程序（cmd / pwsh / bash / wsl 递归识别）、git 远程名与选项前缀校验
    - 稳定性（第一批）：停轮遗留未配对工具调用自动修复（中断会话重启后不再报协议错误）、清理 / 回滚覆盖全部泳道（含缓存指纹水位）、后台命令移入阻塞线程池 + 进程树整体击杀（Windows taskkill /T /F、Unix 进程组信号）、MCP 服务进程生命周期治理（退出自愈、超时摘除等待者、连接失败有界重试）
    - Anthropic 协议适配修复：流式工具调用参数分片正确组装（此前参数可能静默丢失）、工具定义注入请求体（此前未携带）、历史内系统提示更新不再被丢弃、连续助手消息自动合并（避免角色交替报错）
    - 网络健壮性：流式响应改用空闲读超时（长生成不再被固定总时长上限掐断）、模型列表拉取超时收敛
    - 生命周期治理：辅助记忆台账自动裁剪（防无限增长）、隐私替身库与超大输出溢出目录随会话删除一并清理、主密钥文件权限收紧、Files API 文件索引过期驱逐 + 每供应商上限
    - 配置兼容：旧版或缺字段配置文件无损加载（顶层字段全默认），并修复旧配置可能发出空推理档位字段的问题
    - 前端体验：流式期间历史消息零重渲染（组件级 memo + 逐字段订阅，长会话打字更顺滑）、输入法组合键防误触发送、审批卡本地超时与停止即清、隔离 / 遥测慢响应跨会话守卫、git 推送 / 拉取 / 抓取转异步不再冻结界面
    - 引擎正确性（第三批）：前缀缓存纪元重建不再丢失采样参数（重启 / 系统提示变更 / 隐私切换后的首个请求保留 temperature / max_tokens / 推理档位）、Responses 协议通道上的滚动备忘正常注入（此前被静默丢弃而水位照推，记忆永久丢失）、工具轮数耗尽的回合正常收尾并提示「发送继续」（此前整回合被静默丢弃、重启后上下文分叉）、出错回合保留已完成部分（与重启重建字节一致）、流内 error 事件透出真实上游错误（不再记为空回复）、网关不发终止空行时的最后一个 SSE 帧照常解析（用量遥测不再丢失）、模型切换强制重建历史区（Files API 文件引用不再发往新端点）、状态机工作流指令文本随消息记录冻结（此后编辑工作流定义不再引发缓存全量未命中与上下文分叉）
    - 安全与隐私（第三批）：MCP http 传输逐跳「解析后分类 + 地址锁定」（重定向与 DNS 重绑定内网穿透端到端修复）、连接测试 / 模型拉取的「允许本地」以已保存配置为准（单次调用不可越权）、供应商与模型列表请求拒绝跨主机重定向（对话内容不随 30x 转发）、MCP 环境变量与请求头随密钥一并加密落盘且界面只回显掩码、会话导入路径限制（源目录 / 用户主目录内）、写路径最终分量以不跟随链接方式打开、工作区遍历环检测与深度上限（junction 环不再无限递归）、grep 单文件 8MB 上限、沙箱网络策略主机提取改协议解析（IPv6 字面量 / 十进制 IP 不再绕过拦截名单）、组播 / 保留段与 NAT64 / 6to4 内嵌地址分类补全、备份目录会话 ID 消毒、隐私映射日志权限收紧、技能市场解包按实际解压大小复核
    - 稳定性与体验（第三批）：子代理随停止按钮中止（此前委派不受停止控制）、同会话并发发送互斥、子会话落盘纳入保存锁、损坏会话文件不再静默跳过且不再误判其子任务为孤儿、自动压缩免费梯级记账单位修复（此前效果被低估 4 倍导致不必要的付费摘要）、配置保存 rename 重试并上抛错误、更新版本枚举值宽容解码（降级运行不再「Provider 全部消失」）、长期记忆存储键序确定化、基准历史串行化、git 面板中文文件名修复、git 管道读取有界（凭据助手残留进程不再挂死）、全部互斥锁防毒化、审批超时条目自动清理、markdown 外链走系统浏览器（不再整个窗口被导航）、设置页长文本输入防抖（不再逐键写盘）、@ 引用单文件 64KB / 总量 200KB 上限、@ / # / 技能菜单竞态守卫补齐、删除 MCP 服务需确认、全部视图完成订阅粒度拆分
