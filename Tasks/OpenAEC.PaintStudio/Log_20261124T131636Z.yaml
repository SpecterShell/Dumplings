  Key: ReleaseNotes
  Value: |-
    Open Paint Studio 2026.48.0
    - Fix blurry drawings: the canvas now renders at screen resolution (zoom × display scaling) instead of one pixel per document pixel that the browser then stretched. Lines, shapes and text stay crisp at every zoom level and on high-DPI displays.
    - The live preview while drawing, the color picker and the fill tool follow the same resolution.
    - Export, save, API and MCP output are unchanged and still use the document resolution.
    - For very large documents the on-screen resolution is capped at 16 megapixels to limit memory use.
