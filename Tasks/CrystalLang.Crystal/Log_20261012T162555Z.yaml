    lang
    - [deprecation] Deprecate uppercase instance and class variables (#17160, thanks @nobodywasishere)
    stdlib
    - (llvm) [deprecation] Deprecate LLVM::Type#size and #alignment (#17494, #17533, thanks @HertzDevil)
    - (networking) [deprecation] Deprecate HTTP::Request#local_address and #remote_address (#17260, thanks @straight-shoota)
    compiler
    - (codegen) Drop Compiler#fork_codegen (#16417, thanks @straight-shoota)
    other
    - Fix deprecation warnings in samples (#17342, thanks @HertzDevil)
    Performance
    stdlib
    - (networking) Optimize HTTP.header_name (#14503, thanks @jgaskins)
    - (runtime) Keep decoded backtrace lines into LRU cache (#17285, thanks @ysbaddaden)
    - (text) Optimize String#byte_index(Int) (#17303, thanks @HertzDevil)
    - (text) Optimize String#gsub(String) and #scan(String) (#17305, thanks @HertzDevil)
