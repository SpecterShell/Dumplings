- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Breaking changes
    stdlib
    - (system) Drop Process.fork (#17367, thanks @straight-shoota)
    Features
    lang
    - Allow constants with type declarations (#16951, thanks @stakach)
    - (macros) Add StringLiteral#bytesize (#17176, thanks @straight-shoota)
    - (macros) Add NumberLiteral#chr (#17169, thanks @straight-shoota)
    - (macros) Support CharLiteral in RangeLiteral#each (#17170, thanks @straight-shoota)
    stdlib
    - Add warning about minimum supported Crystal version in prelude (#17349, thanks @straight-shoota)
    - (crypto) Enable OpenSSL Kernel TLS support by default (#17059, thanks @ysbaddaden)
    - (crypto) Add OpenSSL::Cipher#gcm_tag and #gcm_tag= for AEAD ciphers (#17096, thanks @paulocoghi)
    - (files) Add IO::Memory#writable? (#17167, thanks @spuun)
    - (llvm) Support LLVM 23.1 and 24.0 (#17432, thanks @HertzDevil)
    - (macros) Add all enum types to Enum's list of subclasses (#17425, thanks @HertzDevil)
    - (networking) Add HTTP::Context#remote_address, #local_address (#17196, thanks @straight-shoota)
    - (networking) Validate method, version, and host in HTTP::WebSocketHandler (#17235, thanks @hahwul)
    - (networking) HTTP::Client::Request support Content-Encoding: x-gzip (#17263, thanks @straight-shoota)
    - (networking) Add HTTP::Headers#merge (#17326, thanks @jgaskins)
    - (networking) Serialize IO::Memory in HTTP body with Content-Length header (#17388, thanks @straight-shoota)
    - (runtime) Add GC.syscall(&) (#17150, thanks @ysbaddaden)
    - (runtime) Add Thread#wait and Thread#wake methods (#17226, #17243, #17247, #17380, #17419, thanks @ysbaddaden)
    - (runtime) Add Crystal::LRUCache (#17284, thanks @ysbaddaden)
    - (runtime) Add GC.max_heap_size= (#17346, thanks @straight-shoota)
    - (runtime) Use epoll event loop on Solaris targets (#17370, thanks @ysbaddaden)
    - (runtime) DWARF: build function names table for fast binary search (#17410, #17433, thanks @ysbaddaden)
    - (runtime) Enable kqueue event-loop by default on all BSD targets (#17421, thanks @ysbaddaden)
    - (runtime) DWARF: build index of .debug_line section (#17455, thanks @ysbaddaden)
    - (runtime) Support Bytes in Crystal::System.printf(%s) (#17463, thanks @ysbaddaden)
    - (runtime) Support DW_FORM_addrx<n> and DW_FORM_strx<n> from DWARF 5 (#17445, thanks @ysbaddaden)
    - (runtime) Add Fiber::ExecutionContext::Parallel#scale_up to manually scale parallel contexts (#17438, thanks @ysbaddaden)
    - (runtime) Re-enable pretty backtraces in UNIX segfault handler (#17456, thanks @ysbaddaden)
    - (serialization) Add XML::Node#line_number (#17179, thanks @n-rodriguez)
    - (system) Include exit code in Process::Status#description (#17087, thanks @straight-shoota)
    - (system) Add File::Info#inspect (#17375, thanks @straight-shoota)
    - (system) Add File.exists?(follow_symlinks: true) (#17307, #17600, thanks @straight-shoota, @ysbaddaden)
    - (system) File::Info.readable?, .writable?, .executable? follow_symlinks: false (#17391, thanks @straight-shoota)
    - (text) Add Char::Reader.new(Bytes) (#17428, thanks @straight-shoota)
    - (time) Add Time::Span#to_nanoseconds etc. (#17190, thanks @straight-shoota)
    compiler
    - (cli) Improve compiler error when writing cross-compile output fails (#17457, thanks @ralsina)
    - (parser) Fix parsing suffix form of ensure after an ExceptionHandler (#17426, #17460, thanks @Sija)
    - (semantic) Add Crystal::ALL_FLAGS and USER_FLAGS (#17392, #17621, thanks @straight-shoota)
    - (semantic) Fix method_missing call location metadata (#17465, thanks @nobodywasishere)
    tools
    - (docs-generator) Update markd 0.6.0 (#17269, thanks @straight-shoota)
    Bugfixes
    stdlib
    - (cli) Fix bundled short options not consuming a value from the next argument (#17473, thanks @alter)
    - (collection) Fix invalid access in BitArray#[](Int, Int) (#17205, thanks @HertzDevil)
    - (collection) Fix Range#step raise on zero step size (#17225, thanks @straight-shoota)
    - (collection) Fix Range#size overflow on max integer value (#17266, thanks @mvanhorn)
    - (collection) Fix each_repeated_combination iterator raising on an empty collection (#17275, thanks @SAY-5)
    - (concurrency) Sync::RWLock#try_write_lock? skips type protection (#17472, thanks @ysbaddaden)
    - (files) invalid resize when writing IO::Memory to itself (#17241, thanks @ysbaddaden)
    - (llvm) Add pointer indirection for __crystal_type_id_to_class_name_map (#17502, thanks @HertzDevil)
    - (llvm) Fix LLVM#gep and #inbounds_gep signatures with multiple indices (#17538, thanks @HertzDevil)
    - (networking) Reject unrecognized HTTP Transfer-Encoding header (#17140, thanks @straight-shoota)
    - (networking) Reject HTTP::Client::Response with invalid Content-Encoding (#17262, thanks @straight-shoota)
    - (networking) Fix HTTP::Request.from_io parsing empty header name (#17254, thanks @straight-shoota)
    - (networking) [breaking] Fix HTTP::Request#body= return value (#17257, thanks @straight-shoota)
    - (networking) Fix Content-Encoding: deflate (#17261, thanks @straight-shoota)
    - (networking) Fix validation in Request#hostname (#17258, thanks @straight-shoota)
    - (networking) Fix HTTP::Request#form_params? to ignore invalid content-type (#17256, thanks @straight-shoota)
    - (networking) Fix HTTP.parse_headers_and_body to not raise with without_zlib (#17272, thanks @straight-shoota)
    - (networking) Validate HTTP::Request#method (#17255, thanks @straight-shoota)
    - (networking) Validate HTTP::Request#version (#17304, #17374, thanks @straight-shoota, @Sija)
    - (networking) Fix HTTP::Request#content_length= return value (#17273, thanks @straight-shoota)
    - (networking) Validate HTTP::Request#resource (#17310, thanks @straight-shoota)
    - (networking) Fix Socket#sendfile when count > file.size (#17286, thanks @straight-shoota)
    - (networking) Fix File#sendfile should not move #pos (#17293, thanks @straight-shoota)
    - (networking) Fix IPv6 address passed to OpenSSL::SSL::Socket::Client.new for OpenSSL 4.0 (#17321, thanks @HertzDevil)
    - (networking) Fix HTTP::VALID_TOKEN_CHAR_MAP for Crystal < 1.16 (#17333, thanks @straight-shoota)
    - (networking) Fix validate HTTP::Headers name (#17317, thanks @straight-shoota)
    - (networking) Close HTTP::Client on IO::Error during request (#17318, thanks @jgaskins)
    - (networking) Fix reject invalid HTTP trailer (#17337, thanks @straight-shoota)
    - (networking) Validate HTTP::Request#content_length and type as Int64 (#17312, thanks @straight-shoota)
    - (networking) Fix keep HTTP::Request#content_length in sync with #body (#17389, thanks @straight-shoota)
    - (networking) Fix WebSocket buffer corruption with interleaved control frame (#17553, thanks @straight-shoota)
    - (networking) Fix WebSocket::Protocol#receive to validate masked/unmasked state (#17562, #17603, thanks @straight-shoota)
    - (networking) Fix WebSocket reject mixed opcode continuation (#17552, thanks @straight-shoota)
    - (numeric) Fix BigRational#<=> with an infinite Float (#17223, thanks @youdie006)
    - (numeric) Fix Int#humanize_bytes to use KiB in IEC format (#17234, thanks @kojix2)
    - (runtime) ThreadPool#main_thread_loop (#17194, thanks @ysbaddaden)
    - (runtime) free dead fiber stack when there's no stack pool (#17229, thanks @ysbaddaden)
    - (runtime) support bare threads in crystal/once (#17228, thanks @ysbaddaden)
    - (runtime) io_uring event loop hangs on sendfile (#17299, thanks @ysbaddaden)
    - (runtime) correctly iterate ELF file sections (#17327, thanks @ysbaddaden)
    - (runtime) backtraces on musl-libc when linking with -static-pie (#17316, thanks @ysbaddaden)
    - (runtime) abort on out-of-memory instead of segfaulting (#17111, #17345, thanks @carlhoerberg, @straight-shoota)
    - (runtime) enqueue thread once into thread pool (#17350, thanks @ysbaddaden)
    - (runtime) save stdio closed state on program start (#17378, thanks @ysbaddaden)
    - (runtime) rewrite thread pool logic to avoid race conditions (#17400, thanks @ysbaddaden)
    - (runtime) don't propagate trace environment variables to sub-processes (#17402, thanks @ysbaddaden)
    - (runtime) tracing 128 bit integers (#17403, thanks @ysbaddaden)
    - (runtime) kqueue event loop on NetBSD (#17420, thanks @ysbaddaden)
    - (runtime) [regression] Fix COFF symbols table being empty on MinGW-w64 (#17442, thanks @HertzDevil)
    - (runtime) Fix running on CPUs with cpu_count > UInt8::MAX (#17437, thanks @willhbr)
    - (runtime) parallel schedulers may deadlock each other (#17491, thanks @ysbaddaden)
    - (runtime) crystal/once must cleanup when an exception is raised (#17546, thanks @ysbaddaden)
    - (runtime) auto-scaling of multiple execution contexts (#17514, thanks @ysbaddaden)
    - (runtime) Distinguish kqueue registration errors from kevent errors (#17599, thanks @ysbaddaden)
    - (serialization) Fix CSV error line numbers with CRLF input (#17381, thanks @cuishuang)
    - (serialization) Fix CSV builder to escape CR characters (#17548, thanks @ysbaddaden)
    - (system) [regression] Fix missing NULL terminator for execve vargs (#17184, thanks @sdogruyol)
    - (system) Fix Process.new to close pipes on error (#17297, thanks @straight-shoota)
    - (system) [breaking] Add IO::FileDescriptor#exit_on_broken_pipe (#17335, thanks @straight-shoota)
    - (system) Skip inaccessible candidates for Process.find_executable (#17409, thanks @mvanhorn)
    - (system) Fix FileUtils.mv(Enumerable) swallowing errors (#17407, thanks @LaskaIDK)
    - (system) Ignore all File::Error in Process.find_executable (#17542, thanks @jochenseeber)
    - (text) Fix String#gsub when Regex pattern matches empty string and advances (#17204, thanks @HertzDevil)
    - (text) Fix URI#resolve for path without / (#17213, thanks @straight-shoota)
    - (text) Handle consecutive whitespace in String#titleize (#17206, thanks @HertzDevil)
    - (text) Fix String#each_line(remove_empty: true) with many empty lines (#17242, thanks @straight-shoota)
    - (text) Fix Char::Reader#pos= to raise on negative position (#17382, thanks @straight-shoota)
    - (text) Fix Char::Reader#current_char_width to be zero at end (#17405, thanks @straight-shoota)
    - (text) Fix String#compare(case_insensitive: true) to order invalid byte sequences (#17314, thanks @straight-shoota)
    - (text) Fix Char::Reader.new to raise on an invalid position (#17416, thanks @youdie006)
    - (text) Fix PCRE2#jit_compile to accept nomemory error for implicit fallback (#17559, thanks @straight-shoota)
    - (time) Fix local timezone location name for Android (#17248, thanks @HertzDevil)
    - (time) Fix Time::Location.load? for Android (#17249, thanks @HertzDevil)
    compiler
    - Fix vswhere ignoring ARM64-only MSVC installations (#17395, thanks @HertzDevil)
    - (codegen) Codegen doesn't materialize an unused yield block value in debug builds, pt. 2 (#17130, thanks @nobodywasishere)
    - (codegen) Unify LLVM types used for ReferenceStorage (#17397, thanks @HertzDevil)
    - (codegen) Do not access owner type in dispatch if it is not passed at runtime (#17424, thanks @HertzDevil)
    - (codegen) cross-compile crashes when combined with emit llvm-bc or obj (#17510, thanks @ysbaddaden)
    - (codegen) Fix memory leak in mixed union assignments (#17518, thanks @ysbaddaden)
    - (codegen) Fix SysV ABI classification of word containing Float32 followed by integer (#17572, thanks @HertzDevil)
    - (codegen) Respect ABI info when explicitly returning inside top-level funs (#17616, thanks @HertzDevil)
    - (debugger) Fix lldb-dap crash on Windows when loading Crystal formatters (#17448, thanks @magynhard)
    - (interpreter) Fix interpreter dispatch on a virtual struct narrowed from a union (#17450, thanks @jochenseeber)
    - (parser) Fix parse OP_SLASH after block (#17159, thanks @straight-shoota)
    - (parser) Fix suffix ExceptionHandler#location in an assignment (#17365, thanks @Sija)
    - (parser) Fix global calls shadowed by local variables (#17558, thanks @grepsedawk)
    - (semantic) Fix instance variable initializer using a class variable assignment (#17148, thanks @nobodywasishere)
    - (semantic) Fix bug allowing self in private top-level method (#17149, thanks @nobodywasishere)
    - (semantic) Fix dynamic class declaration macro error (#17274, thanks @nobodywasishere)
    - (semantic) Backfill included type to existing instantiations (#17094, thanks @straight-shoota)
    - (semantic) Fix ICE when module with ivar is included in a type that can't have them (#17386, thanks @bcardiff)
    - (semantic) Disallow instance_sizeof and instance_alignof on Void or NoReturn (#17453, thanks @HertzDevil)
    tools
    - (formatter) Fix formatter for setter assignment with parenthesized values (#17083, thanks @mamantoha)
    - (formatter) formatter unescapes fresh variables (#17517, thanks @ysbaddaden)
