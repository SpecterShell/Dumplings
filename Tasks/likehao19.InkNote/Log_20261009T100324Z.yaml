  Value: |-
    InkNote v0.2.13
    修复与改进
    - 标签右键菜单新增复制文件路径，支持复制后台标签路径
    - 查找自动定位首个结果，支持上下键切换、滚动跟随与高亮
    - 搜索命中表格、图表和公式时保留渲染，以组件高亮显示命中位置
    - 默认恢复上次打开的标签和未保存草稿，包括临时图片
    - 重启恢复各标签光标、选区和滚动位置，兼容旧会话备份
    - 原文件变更或丢失时将恢复内容保留为独立草稿，避免覆盖磁盘内容
