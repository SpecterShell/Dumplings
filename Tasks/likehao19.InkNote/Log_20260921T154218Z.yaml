  Value: |-
    InkNote v0.2.12
    修复与改进
    - 修复 Mermaid 和数学公式在只读预览中点击露出源码的问题
    - 新增图表与公式图片复制、Markdown / LaTeX 复制，统一使用底部操作提示
    - 图表操作栏改为悬停显示，避免遮挡阅读内容
    - 新增独立 Tauri 图表预览窗口，支持缩放、拖动、系统最大化和 F11 全屏
    - 精简预览窗口工具栏，仅保留缩小、缩放比例和放大
