    InkNote v0.2.16
    修复与改进
    - 支持拖入文件夹加载到左侧工作区，可同时添加多个目录并去重，保留点击打开入口（#13）
    - 修复表格单元格末尾回车后继续输入时换行丢失或光标回到上一行的问题（#10）
    - 表格支持 Enter / Shift+Enter 连续换行，Tab 切换单元格，保存重开保留空行
    - 下载页按钮文案简化为“下载”，保留系统识别和架构信息（#12）
