  Value: |-
    InkNote v0.2.11
    修复与改进
    - 新增可选 AI 助手，默认关闭，支持多服务商、模型列表获取和系统凭据存储
    - 支持流式正文、服务商返回的思考内容及停止生成，保留已接收内容
    - 修复 AI 请求完成后结果不显示的问题，提高默认输出额度至 32768 tokens
    - 新增标签页右键菜单：关闭当前、其他、左侧、右侧和全部标签，并保护未保存内容
    - 修复预览模式选中文字后的复制操作（#4）
