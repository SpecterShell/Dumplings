  Key: ReleaseNotes
  Value: |-
    InkNote v0.2.15
    修复与改进
    - 修复表格单元格换行与多行内容粘贴，保存和导出保留换行
    - 外部修改文件内容后自动同步，未保存的本地修改遇到冲突时保留并提示
    - 同一目录内重命名文件后同步标签、文件树与最近文件记录
    - 关闭软件时自动保存已有文件，新建未保存文档仍询问是否保存
    - 清理重命名遗留的重复未命名标签，找不到路径的历史文件不再反复提示恢复
    - 外部打开文档时优先显示目标文件，历史标签后台恢复，不再短暂跳转或抢占焦点
    - Windows 保存文件时保留文件身份与创建时间，避免桌面图标位置变化
