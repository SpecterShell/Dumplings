  Key: ReleaseNotes
  Value: |-
    A tray fix for the desktop app. Only the desktop app changed; the renderer is the same as 0.3.11, so there is no npm release.
    Desktop app
    - Tray popup opens next to the icon. When the Multiplane tray icon was tucked into the hidden icons flyout (the arrow next to the clock on Windows), the popup ignored where the icon was and opened pressed against the taskbar. It now opens above the icon, or below it if there is not enough room. When the icon sits on the taskbar itself, nothing changes.
