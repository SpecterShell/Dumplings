  Value: |-
    Desktop release 0.1.52
    更新说明
    🧪 新增 Beta 测试渠道
    加入 Beta 测试渠道可提前接收即将发布的客户端更新，开启后重启生效；开启前会先确认测试版可用，避免开了却收不到新版本。
    🛡️ 正式账号数据更安全
    开发实例误把工作目录指向正式账号时会被拒绝启动，不再连坐正式版强制重登；设备不匹配时也只让当前进程登出，不再误删本地数据。 @dashhuang
    ⚡ 启动不再露白屏
    登录和冷启动时不再露出白屏，大账号库的启动清理也不再阻塞首屏；登录过渡画面在减少动态效果时同样顺畅、不挡点击。 @dashhuang
    🖼️ 历史会话不再卡死
    压缩上下文或重放历史时，工具输出里不支持的图片等媒体会降级为占位文字，不再让会话每一轮都被拒绝、卡死到只能新建任务。
    🎯 目标推进更稳
    用 /goal 设定目标后，长时间自动压缩不再被超时打断、卡在「目标推进中 · 0 轮」，无法确认投递时会如实标记为「已受阻」，不再假装运行或重复执行。 @zqchris
    ⏱️ Pi 命令不再卡住
    Pi 里的命令加了默认超时和上限，漏传超时的单条命令不会一直占着整轮。 @dashhuang
    🔗 模型列表同步更稳
    启动时不再丢失首次模型列表同步，设备互联和 IM 能正确拿到模型列表。 @GaoWeiLiuXD
    💬 桌面端体验打磨
    发送消息后继续自动跟随最新消息，不再被误判成离开底部；侧栏悬停时标题给操作按钮让位、不再叠字；无标题会话改由 Cindy AI 起名，协同 Worker 的命名字段也更清晰。 @dashhuang

