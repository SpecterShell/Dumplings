  Value: |-
    Desktop release 0.1.49
    更新说明
    🤖 模型能力更完整
    新增 xAI 的图片和视频模型，补齐国产模型的官方元数据；Luna 与 GPT-5.4 Nano 有了默认推理强度，换过的模型下次新建也会沿用。 @dashhuang @zqchris
    🖥️ Pi 支持远程运行与协同
    Pi Agent 现在可以通过 SSH 在远程环境运行，并与 Orca 协同；图片生成队列、远程路由与过期会话的恢复也更稳定。 @dashhuang @tiammomo @yan-xdt @zyaoii
    👁️ 纯文本模型也能看图
    新增视觉桥：把图片内容转成文字描述再交给纯文本模型，让原本不识图的模型也能处理图片，并可在设置里开关。 @yan-xdt
    🎙️ 功能键按住说话
    现在可以直接按住 F 等功能键说话、松开即结束，无需再点按语音按钮。 @dashhuang
    🧩 插件面板支持网格布局
    插件面板可以按网格自由排布；插件批准凭据的校验与回滚更稳健，飞书权限失败的提示也更清晰。 @DavidShenXD
    🛡️ 审查与安全加固
    审查面板来源统一并记住状态；Windows 上 PowerShell 与 Codex 文件修改审批不再被静默拒绝，自定义 MCP 请求头会校验，Ghost 面板崩溃与多实例误判也已修复。 @DavidShenXD @Yuewei-LL @mimoren @ningkaikok @zqchris
    💬 协同、通讯录与设备更顺手
    协同 Worker 列表支持平铺与下拉切换，小窗口下菜单不再被裁；协同卡片与图标更清晰，暂停队列能正确恢复队首，通讯录确认后不再反弹，设备名称显示也统一了。 @Shinku-Chen @dashhuang @zqchris
    📱 侧边栏与界面细节打磨
    侧边栏列表标题对齐、搜索时不再盖住输入框并保持滚动位置；删除消息后位置稳定，移动端收起态输入框露出附件加号，智能标题恢复正常，设置卡对比度也提升了。 @DavidShenXD @dashhuang @gardenZzz
    💳 支持恢复已取消的订阅
    取消过的订阅现在可以恢复；Codex 会话消耗的 Claude 订阅用量也会即时更新，不再显示陈旧数值。 @AwakeyDonkey @GaoWeiLiuXD

