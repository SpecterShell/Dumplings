  Value: |-
    Desktop release 0.1.64
    更新说明
    📄 内置文档工具，任务里直接产出 Office 文件
    现在能直接在任务中生成 PDF、Word、PPT 和 Excel，自带排版模板，产出整洁美观，还支持在任务里预览。 @zqchris
    🤖 模型控制更灵活，图片输入更顺畅
    运行中可切换模型并在异常时自动降级；Kimi Code 编程计划支持发送图片，Windows 下 Git 路径解析也更可靠。 @LeeCarry @nanaco666 @zqchris
    🧩 插件能力与授权边界更清晰
    插件安装、授权与网络访问的边界更严格清晰，已装插件升级后照常可用，官方信任状态回填也更稳定。 @Battleplus @GaoWeiLiuXD @jiajiayao @nothingyuancando
    💳 订单与用量展示更清楚
    订单号支持脱敏展示和一键复制，账户配额、Fable 周限与用量历史显示恢复正常。 @AwakeyDonkey @GaoWeiLiuXD @fico-hub
    🧠 Agent 执行与协同更可靠
    长命令和子 Agent 在模型切换、中断或网络波动后能正确续跑；回答断流会自动重试并显示进度，Pi 的上下文压缩控制也恢复正常；Orca 协同更顺畅，任务完成与失败的红点不再残留。 @DavidShenXD @dashhuang @fmfsaisai @nothingyuancando @zqchris
    🔗 中英文网址识别更准
    消息里的中文、Unicode 与国际域名网址不再被截断或误识别，桌面端与移动端表现一致。 @zqchris
    📱 移动端与手机协作更稳
    Android 改用系统相册选择图片，热更新后版本不再回退；手机恢复同步更少重复、连接更不易中断。 @MagicLizi @dashhuang @guyong-zapo @zqchris
    ⚡ 大库卡顿明显减轻
    超大聊天记录的读写与搜索更顺滑，回答的流式输出更流畅，任务列表也更轻快。 @DavidShenXD @dashhuang @zqchris
    🛠️ 桌面端细节更到位
    macOS 全屏恢复更稳，发送后输入框立即清空，报错信息更清晰；企业身份授权确认更清晰安全，并新增 Beta 渠道标识。 @DavidShenXD @dashhuang @fmfsaisai @guyong-zapo @nothingyuancando @tiammomo @zqchris
