  Value: |-
    Desktop release 0.1.45
    更新说明
    📋 计划任务追踪更完整
    计划面板中正在执行的步骤显示呼吸动画指示，清晰区分运行中和等待中的任务。中断或放弃的计划清单在下一轮对话时自动对账，不再被遗忘。子代理和 Hook 自动触发的任务也能正确归入对应计划。子代理卡片恢复就地展开收起，不再自动弹出抢占视图。 @kafeifei @zqchris
    🪟 桌面体验改进
    任务可拖出到独立窗口处理，多任务并行更方便。提问导航条默认开启，常用操作触手可及。修复了分享选择框被裁切、长聊天分享图片失败、账号切换时运行中任务被静默中断且无提示等问题。区域数据与登录态按账号隔离，多账号不再互相干扰。自动修复因系统进程 ID 复用导致的数据迁移阻塞。 @dashhuang
    🔍 代码审查修复
    修复了审查中生成文件误报和大文件处理卡顿的问题。修复了包含工具链二进制或托管工作区的项目无法运行审查的问题——原因是有大量非源码文件耗尽了审查预算。审查现也支持对已提交的分支直接审查，不必依赖最近一轮对话记录。自动审查在网络波动时自动重试，失败则降级请用户确认。 @DavidShenXD @zqchris
    ✨ 流式动效默认开启
    流式回复的逐词淡入动效默认开启，输出呈现更流畅自然。修复了切换任务后动效意外重播的问题。资源用量窗口改为后台预热、点击即开，消除以往冷启动的加载延迟。 @DavidShenXD
    📱 iOS 模拟器改进
    模拟器工具在模型面前标明作用域，不再因与其他工具同名而被误路由、弹出授权卡。未安装模拟器插件时正确拦截相关能力，同时不再误拦用户自己的 Xcode 命令行工具。Xcode 权限探测推迟到真正使用模拟器时才进行，登录后不再无故弹窗。 @horizon554
    🤖 Telegram Bot 消息优化
    个人 Bot 的终稿消息改为独立发送，消除了批量发送时偶发的丢稿问题。 @zqchris
    🔧 稳定性修复
    自动更新前等待插件进程完全退出，避免更新后残留旧进程。修复了未知模型被错误归入模型分组、非流式请求回退在某些模型上不生效、以及共享工作区回收时的循环依赖等问题。 @horizon554 @kafeifei @klboke @yuaiccc

