  Value: |-
    Desktop release 0.1.51
    更新说明
    🧵 飞书群 @ 自动开话题
    在飞书群聊里 @ 机器人时，回复会自动开一个独立话题，各话题上下文互不串扰，后续回复都落在话题内，不再刷屏群聊主界面。 @MagicLizi
    🤖 Claude 工具循环自动收口
    原生 Claude 模型遇到反复循环调用工具的情况时，会自动中断本轮并给出提示，不再一直空转卡住。 @MagicLizi @ZJPex
    🃏 Subagent 卡片显示与状态更准确
    Subagent 卡片现在显示实际执行的模型，不再把请求的模型误当成执行模型；运行结束后会正确收起，不再长期停留在「运行中」。
    🛡️ 自动审批判断更稳定
    自动审批现在用独立的模型做判断，不再跟随当前任务所用的模型，审批结果更稳定；服务不可用时仍会交给你确认，不会悄悄通过或拒绝。 @zqchris
    📋 Codex 计划状态不再丢失
    未完成的 Codex 计划在应用重启后会被正确恢复，不再因状态丢失而中断。 @kafeifei
    🔗 远程模型列表更稳定
    受控机的模型列表里若有一条损坏记录，不再导致整个列表加载失败，模型选择器仍可正常使用。 @dashhuang
    📡 设备互联重连更平稳
    设备互联恢复连接时不再一次性重放堆积的消息，而是逐步恢复，重连更平稳、不易拥塞。 @dashhuang
    🖥️ 桌面端体验打磨
    侧栏里刚完成的未读任务不再立刻沉底，会看完后再置顶；文字模式任务信息按内容收缩，标题不再被空白挤掉；带操作指引的警告提示停留更久，读起来更从容。 @dashhuang

