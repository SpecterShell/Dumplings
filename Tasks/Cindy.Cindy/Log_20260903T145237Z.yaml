  Value: |-
    Desktop release 0.1.72
    更新说明
    🎮 新增手柄与桌面外设支持
    设置页新增手柄支持，可连接并预览 Switch、Switch 2 Pro 与通用手柄；接入 Codex Micro 设备时自动避免与桌面端冲突；Work Louder 键盘不再偶发反复重启。 @dashhuang @zqchris
    🧩 作品库文件随手可取
    作品库中的文件可以直接在系统文件夹里显示位置，也可以经系统「另存为」保存到你选择的位置。
    🤖 模型运行更可靠
    官方 DeepSeek 的思考模式在复杂多轮对话中不再偶发报错；切换到上下文窗口更小的模型前会先确认，避免丢失已有上下文；自建模型服务（如 vLLM）接入也更稳定。 @betterkite @fico-hub @zqchris
    🖥️ 启动、登录与更新更顺畅
    启动画面更稳定，也不再被更新检查拖慢；真实登录后打开系统浏览器不再失败，错误提示更清楚；Windows 更新器已内置所需运行库，更新失败时不再反复重试卡住。 @DavidShenXD @MagicLizi @dashhuang
    📱 移动端回前台自动刷新
    移动端从后台回到应用时，首页与设备列表会自动同步最新内容，不再需要手动下拉刷新。 @betterkite
    ⚙️ Pi 模式更接近原生
    Pi 完整权限不再拦截原生允许的读取与搜索；切换模型服务商后不再偶发报错；思考档位跟随服务端设置，偶发消息丢失与个性化配置被覆盖的问题也已修复。 @fico-hub @zqchris
    🛠️ iOS 模拟器更好用
    可以安全删除由应用创建的 iOS 模拟器，删除前会自动清理占用；同一工程反复构建从分钟级提速到秒级，构建前先核对目标架构，不再白等一次完整编译。 @BarneyZhaoooo @horizon554
    🗂️ 任务导入与自动化更省心
    重新导入已删除的本地任务会恢复它；导入 Codex 任务时沿用你自定义的标题；协同功能可自动清理中断遗留的空团队，避免之后无法启用；定时自动化失败时会发送通知。 @WEIWEICurry @fico-hub
