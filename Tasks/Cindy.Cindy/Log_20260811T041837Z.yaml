  Value: |-
    Desktop release 0.1.44
    更新说明
    🔍 远程代码审查
    在控制端可以只读查看被控设备上的代码审查结果；同时支持通过 SSH 连接远程工作区进行审查，无需在远程机器上打开桌面端。 @DavidShenXD
    ⚡ 长任务切换提速
    切换到消息较多的长任务时不再卡顿冻结，首帧加载更快；上滚浏览历史消息也更加流畅。 @DavidShenXD
    👤 多账号侧栏隔离
    多账号登录时，侧栏的分组、折叠和置顶状态按账号独立保存，切换账号不再互相干扰。 @dashhuang
    📝 工作区命名优化
    自动创建的工作区使用更有意义的名称，便于辨别和管理。 @kafeifei
    🔄 断线续跑修复
    修复网络重连后自动续跑被意外取消的问题，断线恢复后任务继续执行。 @dashhuang

