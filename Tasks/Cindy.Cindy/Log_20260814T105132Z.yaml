  Value: |-
    Desktop release 0.1.48
    更新说明
    🧩 插件升级不再要求重新批准
    已安装的插件升级时会自动完成授权迁移，无需逐个重新确认；插件的安装、卸载与更新也更加稳健，中途出错不会留下错乱状态。 @Yuewei-LL
    🔍 插件支持手动渐进式发现
    现在可以手动发现并安装插件，安装前会做兼容性检查，已有的手动安装升级后也会原样保留。 @fmfsaisai
    🎨 侧边栏全新重设计
    任务与对话按活动时间混排，支持按项目、设备、对话分组，新增整理菜单、排序与视图切换；底部账号信息框一并打磨。 @Shinku-Chen @dashhuang
    💬 飞书群上下文更完整
    群里 @ 机器人时会拉取聊天记录作为上下文，图片与文件一并带上；支持自动开话题、按权限档新建任务，消息去重与 /ctr 接管也更稳定。 @MagicLizi
    🛡️ 项目技能加载更安全
    任务启动前会先校验并快照已批准的项目技能，并绑定到对应工作目录，避免技能变更或目录切换带来的权限错乱。 @DavidShenXD
    🖼️ 图片附件统一为原生输入
    发送图片时按内容识别媒体类型并校验来源，远程图片保留来源提示，图片作为原生输入交给模型，不再误报或丢失。 @DavidShenXD
    🤖 模型可见性与选择器改进
    模型可见性按账号隔离，隐藏 Agent 可完整展示；模型选择器标签更清晰，开发版也能拉取远端模型目录，中途切换模型不再误报组织限制。 @MagicLizi @dashhuang @jiajiayao @zqchris
    📱 移动端登录安全上报
    登录后自动把用户信息上报到 THEMIS 安全 SDK，登出时及时清除，避免信息串到别的账号。 @guyong-zapo
    🔧 消息导航与稳定性修复
    新增消息导航刻度交互，可快速定位历史消息；切换任务不再重复加载历史，分离窗与 iOS 模拟器的几处显示和回退问题也已修复。 @DavidShenXD @dashhuang @horizon554

