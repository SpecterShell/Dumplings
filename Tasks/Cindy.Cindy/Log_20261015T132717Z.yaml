  Value: |-
    Desktop release 0.1.109
    更新说明
    ✍️ 需要你亲自填的步骤，交给你
    遇到登录、密码、验证码这类只有本人能做的步骤时，Agent 会把它变成一张卡片发到你的设备上，你填完就自动继续；你填的内容只交给本机执行，不会进入模型、记录或推送。 @zqchris
    🖥️ Agent 能管其它电脑上的定时任务
    Agent 现在可以查看和管理你其它电脑上的定时任务，也能给那台电脑上的任务发消息；跨电脑的改动会按当前权限档逐次确认。 @dashhuang
    💬 群聊可以引用回复
    群聊消息新增「引用回复」，在当前时间线引用某条消息作答，不会另开话题；原来的「回复」改名为「创建话题」，两者不再混淆。 @dashhuang
    📱 手机端顶栏统一，左右滑动切换
    iOS 上任务与伙伴首页的顶栏统一成一套，任务在左、伙伴在右，左右滑动或从菜单切换都有跟手的滑动效果，各页的搜索词与滚动位置都会保留；伙伴页保存失败时会自动滚回提示处。 @kirozeng
    ⌨️ 手机输入框能拖着调高
    手机上按住输入框顶边就能把它拉高或收小，从聊天记录往下拖也能顺势收起输入框；拖过一行再往下拉会直接收起键盘。 @dashhuang
    🤖 模型价目更清楚，收藏不再打架
    模型详情现在能展示按次、按量等更细的价目；收藏视图统一后，浏览分享的供应商时收藏和「全部」不再轮流出现，收藏跟着任务所在的那台电脑走。 @DavidShenXD @GaoWeiLiuXD
    🔐 「本任务总是允许」真的管用了
    使用分享的供应商时，点过「本任务总是允许」后不再反复弹确认：同一轮并行的多个请求、以及后台任务被回收重建后都继续有效；切换权限档或计划模式则重新确认。 @fmfsaisai
    🧩 插件指令更干净，旧插件恢复可用
    插件指令不再带一串看不懂的企业后缀，只有同名时才加区分并标注「团队共享」；从旧组织迁过来的插件也能重新验证来源、恢复可用，已保存的数据不受影响。 @GaoWeiLiuXD @kelv1nq1an
    🛠️ 其他修复
    推理强度不再被误显示成「低」；话题内的提问会带上该话题的上下文来回答；群聊打开更快，手机端消息菜单不再为空转；个别接口响应缺少类型标头时不再误报 502。 @dashhuang @nothingyuancando
