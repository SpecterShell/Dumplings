  Value: |-
    Desktop release 0.1.46
    更新说明
    👥 飞书群聊与话题
    飞书 Bot 现在支持在群聊和话题中工作，可在群里 @ 召唤，并结合群聊上下文回复；涉及重要操作时仍需群主确认。 @MagicLizi
    🎨 全新 2026-08 皮肤
    浅色模式换成暖象牙底色，暗色模式换成中性近黑，整体色彩更柔和、文字层次更清晰。 @kirozeng
    🧩 侧栏与分离窗口更稳
    修复了分离侧栏自动打开、上下文刷新失败，以及隐藏和恢复侧栏时标签与命令状态丢失等问题，并优化了侧栏与插件分离窗口的性能。
    💬 聊天与消息流更稳
    后台 Subagent 的内部思考不再刷屏主聊天窗口，右侧面板的 Subagent 页签也不再丢失；长对话中的空回复会自动重试，飞书等渠道里助手回复不再偶发消失；阅读历史时也不再被强行拉回底部。 @KingSystemHaiGo @fico-hub @zqchris
    🤖 模型与供应商接入
    新增供应商时会自动完成初始化，供应商接入更稳定；模型请求失败时，错误提示会给出更明确的失败原因，便于排查。 @GaoWeiLiuXD @gardenZzz @nanaco666 @xd-bobo @zqchris
    💳 订阅与用量
    取消订阅后，购买弹窗改为显示到期时间而非误导提示；账号用量数据在异常情况下不再被空数据覆盖，限额状态能正确保留。 @AwakeyDonkey @GaoWeiLiuXD
    🔧 细节修复
    iOS 模拟器的命令保护不再误拦普通命令；macOS 上可识别 Chrome Beta；AI 重命名不可用时会说明原因；另有多项界面与稳定性细节修复。 @KingSystemHaiGo @ZhangYingTuo @fatwang2 @horizon554 @tiammomo @yuaiccc

