- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Features
    - 新增任务流转与部门指派：管理员开启后，可查看负责人交接及任务状态变化记录，指派负责人时附带留言；支持配置部门负责人和部门管理员的指派范围。
    - 仪表盘焕新，个人任务列表与四象限展示更清晰，并适配深色主题；团队优先级以环形图展示，点击即可筛选对应任务。
    - 项目表格支持按到期、排期、逾期和未排期等分组选择显示内容，并记住各项目的选择；筛选菜单支持鼠标悬停展开。
    - 登录页支持自定义 Logo 和系统名称，网页、桌面端与移动端统一展示配置的品牌。
    - 项目设置改为右侧抽屉，窄屏下全屏展示，保存和取消按钮固定在底部，长表单操作更方便。
    - 创建任务时支持右键取消已选负责人和协助人员；人员选择弹窗支持通过头像关闭按钮或退格键取消选择，并改善触屏操作与部门列表布局。
    - 支持由部署管理员单独隐藏移动 APP 的 AI 相关入口，不影响网页和桌面端使用。
    Bug Fixes
    - 修复未领取任务缺少指定负责人入口的问题，有权限的成员可通过任务详情的「添加」菜单设置负责人。
    - 修复项目列表新增任务时出现空白行的问题。
    - 修复知识库读取权限不足可能影响 AI 助手使用产品及应用知识的问题。
    - 优化任务详情头部高度、流转记录加载图标及项目归档菜单分组，改善页面显示与操作体验。
