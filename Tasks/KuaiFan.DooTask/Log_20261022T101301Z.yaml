- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Features
    - 手机 App 全面升级为新版客户端：修复键盘遮挡输入框、定位一直转圈、会议页面显示不全等问题，iPad 窗口也更紧凑，整体使用更流畅稳定。
    - App 推送全新升级：接入小米、OPPO、vivo、荣耀、魅族等手机厂商推送通道，App 在后台也能及时收到消息；点击通知可直接打开对应会话。
    - 系统设置「App 推送」改为「系统配置 / 自定义 / 关闭」三种模式，默认的系统配置无需申请任何账号即可使用，原先的友盟推送不再使用。
    - App 支持检查更新：启动时自动检查，设置页「版本」旁新增「检查更新」按钮，发现新版本时 iOS 跳转 App Store、Android 直接下载安装包。
    - 移动端仪表盘界面优化：状态栏沉浸显示，标题与图标同排，截止时间右对齐，没有内容的栏目自动隐藏，页面更清爽。
    - 移动端项目与通讯录顶部的团队按钮样式统一，点击区域更大，选择团队后图标高亮提示。
    Bug Fixes
    - 修复退出登录后手机仍可能收到推送通知的问题。
    - 修复部分 OPPO 手机收不到 App 推送的问题。
    - 修复部分系统设置项缺失时读取出错的问题，缺失项会自动使用默认值。
    Performance
    - 优化全文搜索的后台数据同步，不再占用后台任务通道，其他后台任务处理更及时。
    Security
    - 升级 PHP 运行环境至 8.4.27，修复近期公开的两个高危远程代码执行漏洞（CVE-2026-109618、CVE-2026-109619），建议所有自部署用户尽快更新。
