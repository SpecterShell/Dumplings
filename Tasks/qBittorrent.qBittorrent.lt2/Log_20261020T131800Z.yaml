Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    qBittorrent v5.3.0 was released.
    The default version is now based on libtorrent 2.1.x series. It should have less I/O problems compared to 2.0.x series for those who chose to stay on the 1.2.x series. A version based on the 1.2.x series is still provided.
    NOTICE for heavy seeders: The new default libtorrent backend (2.1.x series) is known to have worse read performance compared to the 1.2.x series, which will affect your upload speed. So if you are a heavy seeder you may want to choose the version based on the 1.2.x series. Some details can be found here.
    Library versions

    |            |                                            |
    | ---------- | ------------------------------------------ |
    | libtorrent | 1.2.20+gitc5ff6c3186 / 2.1.2+gitaa09332d4a |
    | Qt         | 6.11.2                                     |
    | Boost      | 1.86 / 1.92                                |

