  Key: ReleaseNotes
  Value: |-
    v0.10.3 更新内容：
    ✨ 新功能
    - AI 输入框新增 @ 连接引用，可按名称、数据库类型或连接 ID 搜索已保存连接，将选定连接的身份信息随消息提供给助手；历史消息编辑也支持恢复和修改引用。
    - AI 输入框新增快捷命令：输入 / 并选择 /help 可查看使用说明，选择 /explain 可辅助解释 SQL，选择 /compact 可手动压缩当前会话上下文；手动压缩支持取消、失败后重试和重启后查看结果。
    - AI 长对话新增自动上下文压缩，接近模型上下文上限时可生成摘要并继续回复，也支持在同一轮工具执行之间压缩后自动续跑；原始消息、工具记录和附件引用仍保留在本机，压缩过程和结果会显示在对话中。
    - 工作台底部 Cloud 状态项现可点击刷新连接状态，并同步更新账号卡片与状态栏，便于在离线或状态过期后重新检查 Cloud 可用性。
    ⚡ 优化
    - 优化 AI 上下文用量展示：主百分比改为估算下一轮调用对当前模型上下文窗口的占用，分别展示实际用量与输出预留等辅助信息，减少正常对话过程中数值反向跳动；无法可靠估算时显示未知。
    - 优化历史消息编辑：重新发送后，对话显示与后续 AI 上下文会跟随新的对话分支，原分支记录仍保留在本机；编辑历史不会撤销已执行的数据库操作。
    - AI 模型执行错误现会在对应回复中保留供应商返回的具体说明，支持滚动查看、复制和重启后恢复，便于排查模型、附件兼容性或接口问题；错误中的已知完整密钥会被隐藏。
    - AI 消息提交失败时新增“恢复未发送草稿”入口，可在当前应用会话内恢复正文、附件与连接引用，减少重新输入。
    🐛 修复
    - 修复 AI 后续对话未完整利用历史回复及工具调用结果的问题，切换模型或供应商后仍可延续已有文本与工具上下文，历史工具操作不会因此重新执行。
    - 修复长时间生成回复、压缩上下文或等待工具与审批时，连接可能因暂时没有输出而被提前中断的问题；改进部分上下文超限场景的自动恢复，避免重复执行已完成的工具操作。
    - 修复 Cloud 新设备首次同步包含多层文件夹或旧版文件夹记录时可能失败的问题，连接及其所属文件夹现可按依赖顺序恢复。
    - 修复 Cloud 冲突处理中“保留本地”可能导致后续同步解密失败、“保留二者”可能复制错误连接参数，以及“保留 Cloud”后同步基准未正确更新的问题；符合校验条件的旧版“保留本地”记录可在原设备再次同步时自动修复。
    - 修复尚未解决的本地删除冲突可能在后续同步中丢失的问题，并改进恢复密钥重建访问后的同步状态隔离，避免沿用旧密钥对应的同步进度。
    - 修复 Cloud 分页下载中的文件夹依赖、同步中断及单页数据过大可能导致同步失败的问题，提升大量连接和复杂文件夹结构的同步恢复能力。
