  Key: ReleaseNotes
  Value: |-
    V0.1.2
    本版重点：修复「旅行派发失败」误报，网页端密钥可编辑
    修复
    旅行派发误报：今日已派完被当成失败，界面上刷「旅行派发失败：daily limit reached」，
    并导致当天反复重试已修复
    新增
    网页端 API 密钥可编辑：改前只能创建，IP 白名单、模型白名单、额度、有效期、
    版本归属、启用开关创建后全部改不了，只能撤销重建（会换掉密钥明文）
    邮箱告警 3 类扩展到 10 类：账号封禁、模型冻结、上游停用、积分告急、额度告急、
    池空、池不足、数据陈旧、刷新失败、密钥被拒
    企业版账号积分
    局域网访问：可在界面切换监听地址
    改进
    请求日志新增「密钥」列与筛选，能看出是哪个密钥发起的
    网页端控制台显示服务版本号与开源地址
    桌面端补齐「告警通知」「模型与用量」两个面板
    已知问题
    部分 Rust 测试在 Windows 上失败，系上游遗留的目录名不一致，不影响产品功能。
