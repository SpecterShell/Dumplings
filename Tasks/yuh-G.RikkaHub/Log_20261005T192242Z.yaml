- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    ✨ 新特性
    - 新增全局 AGENTS.md，用户可在 pc-data/AGENTS.md 下进行编辑和管理
    - 首页 UI 优化
    - 首页主题色阶细修
    - 设置页 UI/UX 重做，视觉效果焕新
    - 设置页增加搜索功能，优化拖拽动画
    - 助手/供应商/搜索引擎等增加右键 /「⋯」菜单统一删除与复制能力
    - 模型显示名规整化
    - 新增对供应商级自定义请求头的支持
    - 新增自定义搜索服务请求地址
    - 新增 Google Interactions API 支持
    - 新增助手孤儿会话恢复：引用已删助手的会话自动补建占位助手，不再无法打开
    🐛 问题修复
    - 修复 state.json 损坏导致无法启动
    - 修复切换会话导致的消息编辑静默腐化
    - 修复 MCP OAuth 互操作
    - 修复 Google 原生协议工具 schema 兼容
    - 修复 DashScope 推理参数按模型代际错发
    - 修复 chat-completions 下关闭思考仍钳 low 档
    - 修复工具消息内部字段泄漏到部分兼容端点
    - 修复 OpenRouter 图片编辑与 Grok 生图的参数兼容
    - 修复图片导出「展开思考」开关无真实输出
    🔧 优化与变更
    - 新增支持 Claude 5.5、Gemini 4，混元迁移 TokenHub
    - 与 APP 端互导备份兼容增强
    - 调整代码字体为 Cascadia Code
    - 新增会话 Fork 标题自动带「(N)」递增序号
    - 导出分享新增「包含思考过程」总开关，Markdown 与图片导出通用
