- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    🚀 Highlights
    - Tune a delegated Agent from the chip it was named with: the composer's runtime cascade now follows the caret instead of a separate panel. Landing on an @Agent chip makes the Provider, Model, thinking depth, conversation mode and feature toggles edit that collaborator; moving the caret off it returns them to the session. The chip carries its tuning beside the option reference, encoded into the token id so a draft, a clipboard or a remote client restores the exact configuration shown, and the resolver accepts either an exact option reference or one that matches a catalogue entry once the overrides are applied.
    - Choose fetched Provider models before importing them: fetching a saved Provider's catalogue no longer writes the endpoint's whole answer into the record. The Models tab opens a picker where each advertised Model is a row the reader can check and open in the shared Model editor; nothing is written until the confirm, which adds the chosen Models without replacing rows the reader authored. autoRefreshModels now only decides whether the vendor's rows arrive checked.
    - A parent Agent can answer its own child's approval: a delegated child inherits the parent's sandbox and tool set, so approving its routine command widens no authority. vibex_decide_approval lets the delegating session answer the one card — there is deliberately no "always allow" — while irreversible actions stay with the human, and vibex_read_approvals lets the parent read the card behind an explicit untrusted fence before deciding. Every resolution now records who answered.
    - The transcript gains context menus and folding: right-click opens a menu on user messages, Agent answers, selections, process rows, turn headers and the timeline itself, and Auto-collapse tool calls draws a live run as its one-line summary until the reader opens it. The folding preference ships off, so today's transcript is unchanged until asked for.
    - A stopped delegation can no longer freeze the composer: cancelling a task closes the approval cards its child raised, and resolving a permission reads the cancellation fence, so a late approval answers task_cancelled_before_approval instead of running the work the stop prevented. The pre-send queue's dispatch fence is now keyed by session, so a turn that never settles no longer holds every session back.
    🖥 Desktop
    - Context menus act on the transcript they were opened on: right-click now opens a menu on user messages, Agent answers, selections, process rows, turn headers and the timeline. Message menus copy, quote into the composer, fork at the row, edit and resend, and stop a streaming answer; process rows copy their command, output, input, diff or path and open files; a selection menu copies as text or Markdown, quotes, finds and opens one external link. A selection inside a row takes priority over that row's menu. Menus carry the data they act on instead of looking it back up through the borrowed view, so a menu opened on a group pane or the read-only child Agent rail acts on the transcript it was opened on; the child rail keeps copy and quote only, and fork, stop, fold and process commands are withheld there.
    - Tool calls fold into their summary line: Session settings gains Auto-collapse tool calls. With it on, a live run of tool activity draws only its one-line summary — the count of changed files, commands, reads and failures — and the reader opens the run when they want the calls. The preference lives in SessionUiState and is mirrored to mobile and remote through AgentTimelineDisplaySettings; it joins the turn shape key and every height fingerprint, so switching it releases the heights measured under the other disclosure. A run holding an approval-pending row keeps its live rule, because the request is an affordance and must never wait behind a summary.
    - The closed runtime menu is no longer rebuilt every frame: the composer is rebuilt on each timeline frame, and both runtime cascades built their Provider and Model panel even while the popover was closed and would drop it unpainted. Building it walks and copies the whole model catalogue, which took more than a third of the main thread while the pointer moved over a transcript. The panel is now built only while it is open or playing its exit.
    - A removed remote instance leaves the list at once: the remote list now reflects a removal immediately instead of waiting for the next refresh, so the row the reader just dismissed does not sit there looking still connected.
    - Links printed by a POSIX shell open on Windows: a Windows path echoed from a POSIX shell keeps a leading slash before the drive (/C:/.../timeline_activity.rs:354), and an editor location is appended with :line. The drive classifier now accepts that optional leading slash, and local_file_path drops the editor location and the slash before the platform path resolver sees the destination. The workspace root is normalized the same way, so the prefix comparison works whether it was stored as C:/... or /C:/...; a file: URL is unchanged apart from the stripped line suffix, and a POSIX absolute path is not a drive path.
    🔌 Providers and Agents
    - Fetched Provider models are chosen before they are written: the Models tab of a saved Provider now opens a picker instead of importing the endpoint's whole response. Each advertised Model fills one row, the reader checks the ones the Provider should offer, and a row opens the shared Model editor so its protocol, limits and capabilities are set before it is written. The confirm adds the chosen Models rather than replacing the list, so a row the user authored keeps its capabilities, display name and enabled state; rows the record already offers are listed and marked rather than toggled. AutoInclude (autoRefreshModels) now only seeds the picker: with it the vendor's new Models arrive checked, without it every row starts unchecked.
    - The Provider model picker is a full two-pane surface: it follows the Agent dialog's model picker. The fetched Models sit on the left with their checkboxes and filter, the selected Model's settings on the right, and both panes fill the dialog. The dialog takes the window instead of the authoring size, reads the viewport each frame so a resize while it is open is followed, selects a row for the settings pane on click, and closes the pane through the same command as its close button when a row is turned off.
    - Authoring dialogs scroll inside their panes: the kit's default dialog body wrapped its content in one auto-height scroll region, so a short catalogue left the panes sized by their rows and a wheel anywhere moved the whole dialog page. Both authoring dialogs now hand the body a definite height through the kit's content builder: the panes fill the dialog, each scrolls on its own, and a wheel over either pane moves only that pane's content, never the form band or the dialog page.
    - The manual provider path stays under the library: the Agent page's add-configuration step drew Custom provider and New route group as the last rows of the step, so a long Provider library pushed the one answer the library cannot offer past the fold. The band is now its own element under the list's scroll region, drawn by the dialog host so it stays put while the library scrolls. The step also loses its Cancel row; the dialog's close control and Escape already abandon it.
    - A parent Agent can read the card it is asked to answer: vibex_decide_approval let a parent answer its child's approval, but vibex_get_tasks reported only a request id, so approving from that was a guess. vibex_read_approvals now returns the cards a caller's own children are parked on — the title, the risk category, the deadline and the details inside an explicit untrusted fence with a notice. Called without taskRefs it reports everything of that caller's that is waiting, so a parent can ask "is anything of mine blocked on me?" without polling every task it ever created. mayAnswer reports the same rule the decision enforces, so an irreversible action reads as "a human has to decide this" instead of failing only when the parent tries. Reading is scoped to the delegating session: a sibling's cards are a different disclosure than a sibling's task, and are not readable.
    - A parent Agent can answer its own child's approval: only a delegated child that inherited the parent's sandbox and tool set can be answered, and only by the task's own parent; a sibling or an ancestor is refused, so one approval never becomes a tree-wide capability. The decision is approve or deny, with no "always allow", because a parent answers one card, never a category. Irreversible actions — deleting or moving files, destructive git, exporting provider configuration, custom tools, and network access, which the sandbox does not bound — stay with the human. A refusal leaves the card pending so the reader can still answer it. Every resolution now records its responder: a parent's approval carries the session and task that gave it and the transcript says so, so a reader can tell their own approval from one an Agent made on their behalf, while system denials leave the responder unset rather than claiming a person who never looked.
    - A cancelled task can no longer deadlock its session: three faults combined into one freeze. Cancelling a task never closed the approval cards its child had raised, and an ACP card carries no deadline, so the durable row stayed pending and a late approval could run the work the stop was meant to prevent. Resolving a permission did not read the cancellation fence, so that late approval reached the provider; it now answers task_cancelled_before_approval with the task id. The composer's pre-send queue held one global dispatch fence, so a turn that never settled froze every session's queue; the fence is now keyed by session, and a submission that ends before it reaches the provider releases the turn flag it armed. A settlement no longer rewrites a round that finished strictly before the stop was recorded, a late result is marked as such, and the delegation card derives its tool status from the task phase rather than the compatibility status column. The unsent-message row can put its text back in the composer or discard the row it dismisses.
    🤝 Delegation and collaboration
    - The composer's runtime controls follow the caret: the delegation target now carries its tuning beside the option reference, and the resolver accepts both forms — an exact option reference, or one that matches a catalogue entry once the request's overrides are applied. A chip's reference fingerprints a complete selection, so a tuned chip matched no catalogue entry and the lookup fell back to the Agent's first one: picking high on a second model brought the controls back showing the first. The chip now carries its depth, mode and feature values encoded into the token id, so it survives a draft, a clipboard and a remote client, and the lookup replays the tuning onto each candidate and compares fingerprints to recover the exact entry. An untuned chip keeps the exact id it always had, so older drafts still parse.
    - There is no separate panel or mode: a flat list of every Agent × provider × model combination did not scale and put the controls somewhere other than the draft being written. The composer's runtime cascade is now the entry point: land on an @Agent chip and it edits that collaborator, move the caret off it and it is the session's again. There is no mode to enter, leave or leak — deleting the chip or moving the caret is the whole exit gesture. The per-Agent choice map, its normalization and the rule that read it are gone rather than left looking load-bearing, and a collaborator row is now just the Agent and its two halves: the row itself is the choice, so its provider/model copy and the pencil beside it were removed.
    - The chip's edges and highlight match the controls: the chip stayed selected one character past its right edge, because the rule accepted the separator an insertion appends; it now owns start..=end and nothing past it. The input's own highlight is a strict range overlap, which leaves both edges dark, so a chip being edited looked inert; a collaborator chip now paints selected whenever the caret's verdict names it, which is the same verdict the controls use. A new-session page chip now takes the page into editing too, and choose_runtime_selection takes the composer it came from instead of always acting on the session, so changing a runtime option writes the chip and not the session selected behind the page. The page also gained the Delegating to badge.
    - Picking a collaborator opens its parameters: choosing an @Agent row left the caret after the separator the insertion appends, which is outside the chip, so the controls pointed back at the session and the reader had to walk the caret back in. The caret now lands on the chip's right edge — what clicking the chip does — so one Enter both picks the collaborator and opens its parameters, and moving the caret off the chip exits the mode as before.
    - A new session starts on the configuration its draft names: creation used the page's own runtime selection, so a tuned @Agent chip changed what the composer showed and then started the session on the page's Agent at its default depth. It now resolves through the same helper the session composer uses, so the request carries the configuration the reader actually saw. The first message also carried mentions: Vec::new(): the chips were rendered, stored in the draft and passed to the queue path, but the immediate send dropped them, so the turn's route note named no collaborator and the authority had nothing to bind a delegation to. Scheduled sends were unaffected.
    - The provider menu opens on the chip, not the session: opening the menu seeded its Agent and auth source from the session's runtime while the trigger above it showed the chip's, so a chip being tuned listed the session Agent's providers. The menu and the new-session page now seed from the cascade's own subject, the new-session cascade takes its Agent from the selection it is rendering with the page only as a fallback, and the chip writer follows the chosen Agent's id and name so a provider choice that names a different Agent does not leave the mention addressing the old collaborator.
    - A tuned chip's tuning reaches the child: binding a delegation to the user's chip replaced the target's selectionRef with the chip's reference but dropped the tuning beside it, so the resolver either failed to find the entry or found it at the option's default depth. The tuning now travels into the target the same way an explicit human delegation sends it. The chip also writes the same preference store a session switch uses, so the row built for the following @ carries the configuration the chip chose instead of the Agent's default source and model.
    ⬆️ Upgrading
    Install 0.1.6 over 0.1.5 as usual: sessions, workspaces, Provider configuration, Skills, and remote hosts carry over. Desktop packaging and the updater manifest format are unchanged, existing @Agent tokens still parse, and a Provider whose catalogue was already imported keeps every authored model. Auto-collapse tool calls is off by default, so the transcript looks the same until it is enabled.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    🚀 核心亮点
    - 用所点名的 chip 直接调校被委派的 Agent： 输入框的运行时级联现在跟随光标，而不再依赖独立面板。光标落在 @Agent chip 上时，Provider、模型、思考档位、对话模式和功能开关会编辑该协作者；移开光标就回到会话本身。chip 会把调校信息与选项引用一起携带，并编码进 token id，因此草稿、剪贴板和远程客户端都能还原所见的精确配置；解析器既接受精确的选项引用，也接受应用请求覆盖项后能匹配到目录条目的引用。
    - 抓取的 Provider 模型先挑选再导入： 抓取已保存 Provider 的目录不再把端点返回的全部内容写进记录。模型标签页会打开选择器，每个被宣传的模型是一行，可以勾选并在共享的模型编辑器中打开；确认之前不写入任何内容，确认时把所选模型加入列表，而不会覆盖用户已经编写的行。autoRefreshModels 现在只决定厂商的新行是否默认勾选。
    - 父 Agent 可以回答自己子任务的审批： 被委派的子 Agent 继承了父级的沙箱与工具集，批准它的常规命令并不会扩大权限。vibex_decide_approval 允许委派会话回答那一张卡片——刻意不提供“始终允许”——而不可逆操作仍由人决定；vibex_read_approvals 让父级先在不信任围栏内阅读卡片再决定。每次裁决现在都会记录由谁作出。
    - 会话转录新增右键菜单与折叠： 右键可在用户消息、Agent 回答、选区、过程行、回合标题和时间线上打开菜单；自动折叠工具调用 会把进行中的工具活动画成一行摘要，直到读者展开。折叠偏好默认关闭，因此在启用之前转录保持原样。
    - 被停止的委派不会再冻住输入框： 取消任务会关闭其子任务提出的审批卡片，裁决权限时会读取取消围栏，因此迟到的审批会以 task_cancelled_before_approval 作答，而不会执行停止本要阻止的工作。发送前队列的派发围栏现在按会话区分，一个永远不结算的回合不会再拖住所有会话。
    🖥 桌面体验
    - 右键菜单作用于打开它的那份转录： 右键现在可在用户消息、Agent 回答、选区、过程行、回合标题和时间线上打开菜单。消息菜单可以复制、引用到输入框、在该行分叉、编辑并重发、停止正在流式输出的回答；过程行可以复制其命令、输出、输入、diff 或路径并打开文件；选区菜单可以按文本或 Markdown 复制、引用、查找并打开一个外部链接。行内选区优先于该行的菜单。菜单携带自己要操作的数据，而不是通过借用的视图再查一遍，因此在分组面板或只读的子 Agent 侧栏上打开的菜单，作用于它被打开的那份转录；子 Agent 侧栏只保留复制和引用，分叉、停止、折叠与过程命令都不会出现。
    - 工具调用折叠进摘要行： 会话设置新增 自动折叠工具调用。启用后，进行中的工具活动只画出那一行摘要——改动文件、命令、读取和失败的数量——读者想要看具体调用时再展开。该偏好保存在 SessionUiState 中，并通过 AgentTimelineDisplaySettings 同步到移动端与远程；它参与回合形状键和所有高度指纹，切换时会释放按另一种展开方式测量的高度。含待审批行的运行会保留其实时规则，因为审批请求是一种可供操作，绝不能等在摘要后面。
    - 关闭的运行时菜单不再逐帧重建： 输入框会在每个时间线帧重建，而两个运行时级联即使在弹出层关闭、其面板不会被绘制的情况下也会构建 Provider 与模型面板。构建会遍历并复制整个模型目录，在指针划过转录时占用主线程超过三分之一的时间。现在只有弹出层打开或正在播放退出动画时才会构建。
    - 移除远程实例后列表立即更新： 远程列表现在会立即反映移除结果，而不必等到下一次刷新，读者刚关掉的那一行不会还留在那里像是仍然连接。
    - POSIX shell 打印的 Windows 链接可以打开： 从 POSIX shell 回显的 Windows 路径会在盘符前保留一个斜杠（/C:/.../timeline_activity.rs:354），编辑器位置则以 :line 追加。盘符识别现在接受这个可选的前导斜杠，local_file_path 会在平台路径解析器看到目标之前去掉编辑器位置和斜杠。工作区根目录也按同样方式归一化，因此无论它保存为 C:/... 还是 /C:/...，前缀比较都能成立；file: URL 除了去掉行号后缀外保持不变，POSIX 绝对路径不是盘符路径，也不会被改动。
    🔌 Provider 与 Agent
    - 抓取的 Provider 模型先挑选再写入： 已保存 Provider 的模型标签页现在打开选择器，而不是导入端点返回的全部内容。每个被宣传的模型占一行，读者勾选该 Provider 应当提供的行，并可在共享的模型编辑器中打开，让协议、限制与能力在写入前设置好。确认时把所选模型加入列表而非替换列表，因此用户编写的行会保留其能力、显示名称和启用状态；记录已经提供的行会被列出并标记，而不参与勾选。AutoInclude（autoRefreshModels）现在只用于初始化选择器：启用时厂商的新模型默认勾选，不启用时每一行都从未勾选开始。
    - Provider 模型选择器是完整双栏界面： 它沿用 Agent 对话框的模型选择器。抓取到的模型在左侧，带复选框与过滤；所选模型的设置在右侧；两栏都填满对话框。对话框改为占用整个窗口而非编写尺寸，逐帧读取视口以跟随打开期间的缩放，点击某行即将其选入设置栏，关闭某行时通过与设置栏关闭按钮相同的命令收起设置栏。
    - 编写对话框在各自栏内滚动： 套件默认的对话框主体把内容包在一个自动高度的滚动区域里，因此较短的目录会让两栏按行数定高，滚轮在任何位置都会滚动整个对话框页面。两个编写对话框现在通过套件的内容构建器给主体一个确定高度：两栏填满对话框、各自滚动，滚轮落在任一栏时只移动该栏内容，而不会带动表单带或对话框页面。
    - 手动 Provider 路径固定在图库下方： Agent 页面的添加配置步骤原来把 自定义 Provider 和 新建路由组 画成步骤的最后两行，较长的 Provider 图库会把图库无法提供的那个答案挤到折叠线以下。该条带现在是列表滚动区域下方的独立元素，由对话框宿主绘制，因此图库滚动时它保持不动。该步骤也去掉了取消行；对话框的关闭控件和 Escape 已经可以放弃它。
    - 父 Agent 可以阅读要它回答的卡片： vibex_decide_approval 允许父级回答子任务的审批，但 vibex_get_tasks 只报告一个请求 id，据此批准等于猜测。vibex_read_approvals 现在返回调用者自己的子任务所停驻的卡片——标题、风险类别、截止时间，以及带有提示的不信任围栏内的详情。不带 taskRefs 调用时，它会报告该调用者所有正在等待的卡片，父级因此可以直接问“我这边有什么被挡住了吗？”，而不必轮询自己创建过的每个任务。mayAnswer 报告与裁决相同的规则，因此不可逆操作会读作“需要人来决定”，而不是只在父级尝试时才失败。读取范围限定在委派会话内：同级任务的卡片与同级任务本身是不同的披露，不可读取。
    - 父 Agent 可以回答自己子任务的审批： 只有继承了父级沙箱与工具集的被委派子任务才能被回答，且只能由该任务自己的父级回答；同级或更上层的调用会被拒绝，因此一次批准不会变成整棵树的权限。裁决只有批准或拒绝，没有“始终允许”，因为父级回答的是一张卡片，而不是一个类别。不可逆操作——删除或移动文件、破坏性 git、导出 Provider 配置、自定义工具，以及沙箱无法约束的网络访问——仍由人决定。拒绝会让卡片保持待处理，读者仍可回答。每次裁决现在都会记录其裁决者：父级的批准会带上作出它的会话与任务，转录中也会说明，读者因此能区分自己的批准与 Agent 代其作出的批准；系统性的拒绝则不会填充裁决者，而不会冒充从未查看的人。
    - 被取消的任务不会再死锁其会话： 三个缺陷叠加成一次冻结。取消任务时从未关闭其子任务提出的审批卡片，而 ACP 卡片没有截止时间，持久行会一直待处理，迟到的审批甚至可能执行停止本要阻止的工作。裁决权限时没有读取取消围栏，迟到的审批因此到达了 Provider；现在会以任务 id 回答 task_cancelled_before_approval。输入框的发送前队列只有一个全局派发围栏，一个永不结算的回合会冻结所有会话的队列；围栏现在按会话区分，在到达 Provider 之前结束的提交会释放它所设置的回合标志。结算不会再重写严格早于停止记录完成的回合，迟到的结果会被标记，委派卡片也改为从任务阶段而非兼容状态列推导工具状态。未发送消息行现在可以把文本放回输入框，或丢弃它所关闭的那一行。
    🤝 委派与协作
    - 输入框的运行时控件跟随光标： 委派目标现在会把调校信息与选项引用一起携带，解析器同时接受两种形式——精确的选项引用，或应用请求覆盖项后能匹配到目录条目的引用。chip 的引用是一份完整选择的指纹，因此调校过的 chip 匹配不到任何目录条目，查找会回退到该 Agent 的第一个条目：在第二个模型上选择 high，控件回来却显示第一个。chip 现在把档位、模式和功能值编码进 token id，使其能穿过草稿、剪贴板和远程客户端；查找会把调校回放到每个候选上再比较指纹，从而找回精确条目。未调校的 chip 仍保留它一贯的精确 id，旧草稿仍可解析。
    - 没有独立面板，也没有单独模式： 平铺列出所有 Agent × Provider × 模型组合既不可扩展，也把控件放到了正在书写的草稿之外。输入框的运行时级联现在就是入口：光标落在 @Agent chip 上就编辑该协作者，移开就回到会话本身。没有需要进入、离开或泄漏的模式——删除 chip 或移动光标就是全部的退出手势。每个 Agent 的选择映射、它的归一化以及读取它的规则都已删除，而不是留成看似承重的代码；协作者行现在只是 Agent 和它的两半：行本身就是选择，因此它的 Provider/模型副本和旁边的铅笔按钮都已移除。
    - chip 的边缘与高亮和控件一致： chip 原来会在右边缘之后多选一个字符，因为规则接受了插入时追加的分隔符；现在它只拥有 start..=end，不包含更后的位置。输入框自身的高亮是严格区间相交，会让两侧边缘都保持暗色，正在编辑的 chip 因此看起来是惰性的；现在只要光标的判定指向某个协作者 chip，它就会画出选中态，而控件用的是同一个判定。新建会话页面上的 chip 现在也会让页面进入编辑，choose_runtime_selection 会接收它来自哪个输入框，而不再总是作用于会话，因此修改运行时选项会写入 chip，而不是页面背后选中的会话。该页面还新增了 委派给 徽章。
    - 选中协作者即打开其参数： 选择 @Agent 行时，光标落在插入所追加的分隔符之后，也就是 chip 之外，控件因此立刻指回会话，读者还得把光标挪回来。现在光标落在 chip 的右边缘——与点击 chip 相同——所以一次 Enter 既选中协作者又打开其参数；把光标移开 chip 仍会像以前一样退出该模式。
    - 新会话按草稿所指的配置启动： 创建时使用的是页面自身的运行时选择，因此调校过的 @Agent chip 改变了输入框显示的内容，随后却以页面的 Agent 及其默认档位启动会话。现在它通过与会话输入框相同的辅助函数解析，请求会带上读者实际看到的配置。第一条消息过去还携带 mentions: Vec::new()：chip 被渲染、存入草稿并传给队列路径，但立即发送时被丢弃，回合的路由说明因此没有点名任何协作者，权威端也无从绑定委派。定时发送不受影响。
    - Provider 菜单在 chip 上打开，而不是会话上： 打开菜单时，其 Agent 与认证来源取自会话的运行时，而上方触发器显示的却是 chip 的，因此正在调校的 chip 会列出会话 Agent 的 Provider。菜单和新建会话页面现在都从级联自身的对象初始化，新建会话级联从它正在渲染的选择中取 Agent、仅在无 chip 时回退到页面，chip 写入器也会跟随所选 Agent 的 id 与名称，因此选中另一个 Agent 的 Provider 后，提及不会仍指向旧协作者。
    - 调校过的 chip 会把调校传给子任务： 把委派绑定到用户的 chip 时，会用 chip 的引用替换目标的 selectionRef，却丢掉了旁边的调校信息，解析器因此要么找不到条目，要么在选项的默认档位上找到它。现在调校会像人类显式委派那样进入目标。chip 还会写入与会话切换相同的偏好存储，因此下一次输入 @ 时构建的行会带上 chip 所选的配置，而不是该 Agent 的默认来源与模型。
    ⬆️ 升级
    按正常方式用 0.1.6 覆盖 0.1.5 即可：会话、工作区、Provider 配置、Skills 与远程主机都会保留。桌面打包方式与更新清单格式没有变化，已有的 @Agent token 仍可解析，已经导入过目录的 Provider 会保留每一个已编写的模型。自动折叠工具调用 默认关闭，因此在启用之前转录看起来与原来一致。
