- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    🚀 Highlights
    - The Agent can react to your message: vibex_react lets an Agent attach any emoji to a user message, and the desktop draws it on that bubble. A reaction is the Agent's own choice rather than an automatic mark: the random receipt and its epoch are gone, and a short runtime instruction opens every human turn to say a reaction is welcome on a question, a report, an instruction, an image, a correction or a remark — not only on greetings, confirmations and thanks.
    - Attachments sit above the message: a user message now shows its pictures as thumbnails and its files as attachment cards in a right-aligned strip over the bubble, and both open what the inline label opens. The order follows the body, the strip wraps into lanes, and a decoded data: thumbnail is cached instead of re-decoded every frame.
    - Folders are no longer tied to one Worktree: folder nesting is an organization choice, so moving a folder under a parent in another workspace is allowed and survives reconcile. Compact mode draws the stored tree; detailed mode lifts a folder whose parent is outside the column to that column's root instead of hiding it.
    - A scrolled-up reader keeps their place: a lagged refetch used to replace the whole timeline with the newest window, dropping the rows the reader had scrolled up through and clamping the next layout to the newest row. The replacement now reaches back to the anchored turn one page at a time, and lands on the oldest row it holds when history or budget stops it.
    - A session that could never send a message is repaired: a Profile switch whose Model publishes a narrower effort scale recorded the requested value as the effective selection while the binding had converged without it, so every later turn was refused with message_submission_runtime_binding_mismatch. The commit now settles the selection on what the binding applied, and startup reconciliation repairs the rows already committed that way.
    🖥 Desktop
    - Message attachments are read before the text: a user message draws its pictures as 64 px thumbnails and its files as the library's medium attachment card, stacked in two right-aligned rows above the bubble and wrapped into lanes at the column width. A picture resolves to a local file or a decoded inline data: payload, kept in a bounded memo so a redraw does not pay for the decode again; a file card carries its name and a short type word taken from the extension and then from the MIME subtype. The strip and the inline label in the body resolve through one action, so clicking a thumbnail previews the image and clicking a file card opens it in the code preview, including files attached from outside the workspace. A picture with no path and no decodable payload falls back to its inline label rather than drawing a hole, and the strip's height estimate counts the same lanes the layout will use.
    - A reaction lives on the bubble's edge: the emoji the Agent attached is drawn in the bubble's lower-edge reaction region, in the same pill as the /goal badge and the queued-delivery accent, with a tighter inset when it stands alone. The runtime records a reaction as a hidden system notice whose provider correlation names the target item; the conversation projection drops the notice from the rows, and the renderer reads the newest notice for that item, so a changed reaction replaces the old one instead of accumulating. Because the mark sits in the edge region rather than the body, a row does not change height when a reaction arrives, and an edited draft stops showing it.
    - A replaced window covers the reader's place: both a lagged refetch and a session switch that re-opens its newest window replace the row table. That read now walks back one page at a time until it reaches the sequence the preserved anchor names, bounded by the resumed-load item budget, and asks for the cover only where the window is replaced. If the anchor still cannot be honoured — the history is gone or the budget is reached — the view lands on the oldest row it does hold and moves the anchor there, instead of leaving an offset from a longer window for the virtual list to clamp to the newest row. A page that belongs to another session, arrives empty or runs into rows already held is refused rather than prepended.
    - Folders cross Worktree scopes: move validation now requires only a shared project, and reconcile no longer detaches a folder whose parent lives in another workspace. Detailed mode projects one Worktree at a time, so a cross-scope child is lifted to the projected column's root; the stored arrangement is left untouched, so compact mode still shows the nesting and switching back restores it. No folder or session disappears from a column because its parent is elsewhere.
    🤝 Agent reactions
    - vibex_react is the twenty-third vibex_use tool: it takes an emoji and an optional sequence, defaults to the newest user message, and accepts any short expression up to 64 characters with no control characters. The tool appends a hidden system notice correlated as vibex-reaction:<item-id> and publishes it to the timeline, so a client that does not know the convention still reads the emoji as harmless text, while the desktop finds the notice and paints it. The reply reports the session, the target message id, its sequence and the emoji.
    - The model is invited, not instructed: every human turn opens with a short runtime guideline ahead of the team block and the caller's own context. It names the kinds of turns a reaction suits — a question, a report, an instruction, an image, a correction, a remark — and says plainly that a reaction must never replace the answer and should be skipped when it would be distracting. Delegated and system prompts never carry the guideline, so a child working a task is not told to decorate a synthetic prompt.
    - One switch decides both halves: Settings → Session → Reactions carries Message reactions, on by default. Turning it off removes vibex_react from the catalogue, suppresses the per-turn guideline and rejects a call made from a cached tool list. The desktop pushes the preference into the runtime at startup and on every toggle, so the catalogue, the prompt and the executor never disagree. The switch gates creation, not rendering: notices already recorded stay visible on their bubbles.
    ⚙️ Runtime reliability
    - The committed selection describes what the binding applied: a switch to a Profile whose Model publishes a narrower effort scale carried max from the previous Profile. The apply loop dropped the field because the Agent could not express it, the binding converged with effectiveReasoningEffort = null, but the commit still recorded the requested max as the effective selection. is_converged() treats null == null as converged, so the switch committed while the two halves disagreed and every later turn was refused with message_submission_runtime_binding_mismatch on an otherwise idle session. The commit transaction now reads the target binding's confirmed configuration, reconciles the effective selection against it, and settles the desired side with it, because turn admission also requires desired == effective. Settling is not a new user selection, so selection_revision does not move.
    - An unconfirmed configuration is not evidence of absence: reconciliation ignores a binding state the apply path never marked for a generation, because an empty state means nobody has answered yet, not that the Agent refuses the dimension. Startup reconciliation repairs rows already committed in the broken shape, since fixing only the write path would leave those conversations unable to send forever. A substituted Model is deliberately not reconciled: the Agent's answer is recorded on both halves of the configuration rather than rewritten.
    ⌨️ Terminal
    - A window that fits the band still reaches the history above it: a failed turn's answer is now its conclusion, so the turn folds its work and the loaded window can end up shorter than the transcript band. With every row on screen there is no scroll position to move — top and bottom are both zero, the view stays in follow mode, and older-history prefetch refused — so the wheel and page-up could never load the page above. A window that already fits the band now counts as standing at its own top, which makes the upward gesture ask for the page before it.
    - A scroll step starts from an offset the transcript can hold: visible_lines clamps the offset it draws without writing the clamp back, so a parked offset could sit past the end after a prepend re-measured a block shorter, an expansion collapsed or a summary replaced a detail. Stepping from it left the new offset past the end too, the bottom branch re-followed the tail, and an upward gesture moved the view nowhere. The clamp is now resolved before the step, and a prepend anchor keeps its row inside the block it names instead of carrying the excess past the transcript.
    ⬆️ Upgrading
    Install 0.1.7 over 0.1.6 as usual: sessions, workspaces, Provider configuration, Skills, remote hosts and drafts carry over. Desktop packaging and the updater manifest format are unchanged. A session already committed with the mismatched runtime selection is repaired during startup reconciliation, so it accepts messages again without a re-selection. Message reactions is on by default; turning it off stops new reactions while the ones already recorded stay visible, and vibex_react returns to the catalogue when it is turned back on.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    🚀 核心亮点
    - Agent 可以给你的消息添加 Reaction： vibex_react 允许 Agent 给用户消息附上任意 emoji，桌面端会把它画在那条气泡上。Reaction 由 Agent 自行决定，而不是自动标记：随机的回复表情及其 epoch 已经移除，每个用户回合都会先收到一段简短的运行时说明，告诉模型对问题、报告、指令、图片、更正或随口一句话都可以回应，而不只限于问候、确认和感谢。
    - 附件显示在消息上方： 用户消息现在会在气泡上方以右对齐的条带展示图片缩略图和文件卡片，两者打开的内容与正文中的行内链接一致。顺序跟随正文，条带按列宽换行，解码过的 data: 缩略图会被缓存，而不是每帧重新解码。
    - 文件夹不再受单个 Worktree 限制： 文件夹嵌套是组织方式，因此可以把文件夹移到另一个工作区的父文件夹下，并且能通过 reconcile 保留。紧凑模式画出存储的树；详细模式会把父级不在当前列的文件夹提升到该列根部，而不是让它消失。
    - 向上滚动阅读的人不会丢位置： 过去一次延迟的重新抓取会用最新窗口替换整条时间线，丢掉读者已经向上翻到的行，并把下一次布局夹到最新行。现在替换会逐页向前覆盖到锚点所在的回合；历史耗尽或预算用尽时，则落在仍然持有的最旧一行上。
    - 无法发送消息的会话会被修复： 切换到某个模型发布更窄思考档位的 Profile 时，请求的值会被记为生效选择，而绑定实际收敛时已经丢掉了该字段，之后每个回合都会以 message_submission_runtime_binding_mismatch 被拒绝。提交事务现在会把选择落在绑定真正应用的结果上，启动时的对账也会修复已经以此形状提交的行。
    🖥 桌面体验
    - 消息附件先于正文被读到： 用户消息会把图片画成 64 px 缩略图，把文件画成套件的中号附件卡片，在气泡上方堆成两行并右对齐，按列宽换行。图片解析为本地文件或解码后的行内 data: 负载，并保存在有界缓存中，重绘时不必再次解码；文件卡片带上名称和简短类型词，类型先取扩展名、再取 MIME 子类型。条带与正文中的行内标签通过同一个动作解析，因此点击缩略图会预览图片，点击文件卡片会在代码预览中打开它，包括从工作区之外附加的文件。既没有路径也无法解码的图片会退回其行内标签，而不是画出一个空洞；条带的高度估算与布局使用相同的换行结果。
    - Reaction 位于气泡边缘： Agent 附上的 emoji 画在气泡下边缘的 reaction 区域，与 /goal 徽章和排队发送标记共用同一个药丸，单独存在时内边距更紧。运行时把 reaction 记录为一条隐藏的系统通知，其 provider correlation 指向目标条目；会话投影会把该通知从行中移除，渲染时取该条目最新的一条通知，因此更改后的 reaction 会替换旧的而不是叠加。由于标记位于边缘区域而非正文，reaction 到达时行高不变；进入编辑状态的草稿也不再显示它。
    - 被替换的窗口会覆盖读者的位置： 延迟的重新抓取和重新打开最新窗口的会话切换都会替换行表。现在这类读取会逐页向前，直到覆盖锚点所指的序列，并受恢复加载的条目预算限制；只有真正替换窗口时才请求覆盖。如果锚点仍然无法满足——历史已不存在或预算用尽——视图会落在仍然持有的最旧一行并把锚点移到那里，而不是留下一个来自更长窗口的偏移量让虚拟列表夹到最新行。属于其它会话、内容为空或与已持有行重叠的页会被拒绝，而不会被前置。
    - 文件夹可以跨 Worktree 作用域： 移动校验现在只要求同一个项目，reconcile 也不会再拆开父级位于另一个工作区的文件夹。详细模式一次只投影一个 Worktree，因此跨作用域的子项会被提升到当前列的根部；存储的排列不会被改写，所以紧凑模式仍显示嵌套，切换回来也能恢复。任何文件夹或会话都不会因为父级在别处而从列中消失。
    🤝 Agent Reaction
    - vibex_react 是第二十三个 vibex_use 工具： 它接收 emoji 和可选的 sequence，默认作用于最新的用户消息，接受任何不超过 64 个字符且不含控制字符的短表达。工具会追加一条隐藏的系统通知，correlation 为 vibex-reaction:<item-id>，并把它发布到时间线，因此不了解该约定的客户端只会把 emoji 当作无害文本，而桌面端会找到这条通知并绘制出来。返回结果报告会话、目标消息 id、其序列号与 emoji。
    - 模型是被邀请而不是被命令： 每个用户回合都会在团队块和调用方自有上下文之前收到一段简短的运行时说明。它点名适合回应的情况——问题、报告、指令、图片、更正、随口一句话——并明确说明 reaction 绝不能替代回答，在会显得突兀时应当跳过。委派与系统提示不会携带这段说明，因此执行任务的子 Agent 不会被要求去装饰合成的提示。
    - 一个开关同时决定两侧： 设置 → 会话 → Reaction 中有 消息 Reaction，默认开启。关闭后会从工具目录中移除 vibex_react、抑制每回合的说明，并拒绝来自缓存工具列表的调用。桌面端在启动时以及每次切换时把偏好推给运行时，因此目录、提示与执行器不会互相矛盾。该开关只限制创建，不限制渲染：已经记录的通知仍会显示在对应气泡上。
    ⚙️ 运行时可靠性
    - 提交的选择描述绑定真正应用的结果： 切换到某个模型发布更窄思考档位的 Profile 时，会从上个 Profile 带上 max。应用循环因为 Agent 无法表达而丢掉该字段，绑定以 effectiveReasoningEffort = null 收敛，但提交仍把请求的 max 记为生效选择。is_converged() 把 null == null 视为已收敛，于是切换在两侧不一致的情况下提交，之后每个回合都会在一个本已空闲的会话上以 message_submission_runtime_binding_mismatch 被拒绝。提交事务现在读取目标绑定已确认的配置，据此对生效选择做对账，并让期望侧一起收敛，因为回合准入同样要求期望 == 生效。收敛不是新的用户选择，因此 selection_revision 不会移动。
    - 未确认的配置不能当作“不存在”的证据： 对账会忽略应用路径从未标记过 generation 的绑定状态，因为空状态意味着还没有人回答，而不是 Agent 拒绝该维度。启动时的对账会修复已经以此形状提交的行，因为只修写入路径会让那些会话永远无法发送消息。被替换的模型刻意不参与对账：Agent 的答复会同时记录在配置的两侧，而不是被改写。
    ⌨️ 终端
    - 能装下整个窗口的窗口仍然可以向上取历史： 失败回合的回答现在就是它的结论，因此该回合会折叠其过程，已加载的窗口可能比转录区域还短。所有行都在屏幕上时没有可移动的滚动位置——顶部和底部都是零，视图停留在跟随模式，较早历史的预取会被拒绝——滚轮和 PageUp 因此永远无法加载上方那一页。现在已能装下整个区域的窗口会被视为站在自己的顶部，向上手势因此会请求它前面的一页。
    - 滚动步骤从转录能够持有的偏移量开始： visible_lines 只夹紧它绘制时使用的偏移量，而不把夹紧结果写回，因此在前置加载把某个块重新测短、展开收起或摘要替换详情之后，停驻的偏移量可能停在末尾之外。从这个偏移量迈步会让新偏移量也落在末尾之外，底部分支重新跟随尾部，向上手势因此原地不动。现在会在迈步之前先解决夹紧，前置加载的锚点也会把它的行保留在所指的块内，而不是把超出的部分带到转录之外。
    ⬆️ 升级
    按正常方式用 0.1.7 覆盖 0.1.6 即可：会话、工作区、Provider 配置、Skills、远程主机与草稿都会保留。桌面打包方式与更新清单格式没有变化。已经以不匹配的运行时选择提交过的会话会在启动对账时被修复，无需重新选择即可再次发送消息。消息 Reaction 默认开启；关闭后不再产生新的 reaction，已经记录的通知仍然可见，重新开启后 vibex_react 会回到工具目录。
