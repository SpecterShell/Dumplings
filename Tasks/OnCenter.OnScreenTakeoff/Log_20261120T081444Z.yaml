  Key: ReleaseNotes
  Value: |-
    As companies work on larger projects, sharing projects with a large number of pages (500+) could cause the exported OSP file to exceed 1GB which caused the export to fail. We’ve increased the limit to 2GB, which should cover most projects handily. For the estimator, this means you don’t need to create multiple exports for a single project.
