  Key: ReleaseNotes
  Value: |-
    原理图
    - 修复系统缩放大于 100%时缩小画布原理图显示模糊的问题
    - 修复导线端点续画后网络标签位置移动的问题
    - 修复不自动分配位号时放置多部件器件部件未分配问号位号的问题
    - 修复复制内容粘贴效果慢的问题
    - 修复复制带网络标签的导线时有时粘贴结果的导线没有网络标签的问题
    - 修复模板导出 BOM 序号错误的问题
    PCB
    - 修复选线条时右侧属性面板未按多个线段转为多个对象进行数量统计的问题
    - 修复 DRC 检查无报错但画布出现大量 DRC 标识的问题
    - 修复手动铺铜和自动铺铜对内电层分割网络结果不同的问题
    - 修复自动布线时导线不会避开元件内板框的问题
    - 修复原理图导入变更到 PCB 封装排列位置不合理的问题
    - 修复点击 DRC 中引脚和焊盘为对应报错器件时打开老样式封装管理器的问题
    格式转换
    - 修复导入时勾选自动关联封装导致导入内容空白的问题
    - 修复导出 DXF 时导出了非勾选内容的问题
    - 修复导入插件转换后的 allegro 文件提示文件格式不正确的问题
    - 修复导入 DXF 图元偏移的问题
    - 修复导入 Protel 填充区方向和大小改变的问题
    - 修复导出的 Altium 文件在 AD 打开时被识别成 DXP 文件的问题
    其他
    - 修复启动客户端白屏的问题
    - 修复英文版导出 3D 模型界面存在未翻译中文的问题
    - 修复导出 3D 外壳内壁距离产生 1mm 多误差的问题
ReleaseTime: 2026-10-14
