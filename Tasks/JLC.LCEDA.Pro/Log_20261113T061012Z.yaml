Locale:
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    原理图
    - 修复原理图导入变更到 PCB 时网表显示变更封装内容为非器件封装内容的问题
    PCB
    - 修复图元转换为板框失败并弹出英文警告的问题
    - 修复设计规则网络规则中差分对切换规则后差分对正负网络交换的问题
    - 修复等长调节指定长度中使用增加到箭头时选中导线指定长度不会更新的问题
    - 修复开启自动添加泪滴后拖动焊盘原焊盘位置添加的泪滴不会被移除的问题
    - 修复复制粘贴显示唯一 ID 的封装后删除粘贴的封装时画布中唯一 ID 不会被删除且无法框选选中的问题
    - 修复焊盘对组不会实时更新的问题
    - 修复实时 DRC 和手动 DRC 检查后的 DRC 标识结果不同的问题
    - 修复 PCB 在 2D 预览下导出 png 图片时导出失败的问题
    其他
    - 修复简易模式下对无符号器件进行编辑器件时没有反应的问题
ReleaseTime: 2026-11-13
