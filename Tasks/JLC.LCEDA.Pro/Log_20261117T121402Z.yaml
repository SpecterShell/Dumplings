  Key: ReleaseNotes
  Value: |-
    原理图
    - 修复移动符号后符号会自动归位的问题
    - 修复原理图开启交叉选择适应性选中后首次进行交叉选择不生效的问题
    - 修复火狐浏览器导出 PDF 中文和符号乱码的问题
    - 修复原理图 DRC 检测全局网络被短接信息中没有检测对象的问题
    PCB
    - 修复 PCB 画布中修改某一网络类名称后该网络类在网络规则的相关网络会被删除的问题
    - 修复导线左侧结点拖动效果错误的问题
    - 修复焊盘拉出导线且导线末端未链接其他图元时左侧网络树中的 xNet 不会更新长度的问题
    - 修复切换单位后网格尺寸和栅格尺寸勾选配置消失的问题
    - 修复画布中存在左侧树有数据但无法选中的导线的问题
    - 修复左侧网络树中显示焊盘对组长度为 0 的问题
    - 修复移除导线中的过孔后导线不会合并的问题
    - 修复选中两个相同网络焊盘进行根据选择的网络创建 xNet 失效的问题
    - 修复右侧显示面板中调整填充区域透明度失效的问题
    - 修复自动拼版后板子层叠的问题
    - 修复闭合的板框层线条进行合板时弹出警告请先创建电路板边界的问题
    - 修复垂直分割时编辑封装打开封装编辑器会先在一侧加载而后在另一侧显示的问题
    - 修复 2D 和 3D 的圆弧预览和 PCB 显示不一致的问题
    - 修复半离线客户端多分支历史工程无法导出 Gerber 的问题
    其他
    - 新增教育工作区考试工程增加可以提前交卷功能
    - 新增教育工作区新家考试支持上传考试工程模板
    - 优化考试工程自动布线和自动位号布局按钮需要置灰
ReleaseTime: 2026-11-17
