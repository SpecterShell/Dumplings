  Key: ReleaseNotes
  Value: |-
    原理图
    - 修改引脚长度后引脚名称位置移动
    - 仿真示波器初始化失败
    - 仿真工程库符号无法按 ESC 取消放置
    - 复用模块中进行器件替换后未将目标器件的属性替换过来
    - 元件缺少封装但 DRC 检查不出来
    - 导出 BOM 使用模板导出时缺少装配变量的值
    - 打开工程后导线与符号断开
    PCB
    - 已被占用的网络仍可创建差分对
    - 导出 ODB++后弹窗错误地显示为“Gerber 导出成功”
    - 铺铜管理器修改底层铺铜优先级会变为内层优先级
    - 过孔通过导线连接后仍存在飞线
    - 导入网表后器件 3D 模型丢失
    - 参考点旋转后自动铺铜不生效
    - 应用复用模块时工程库生成两个同名封装导致对应不上
    - PCB 画布中存在游离的带网络焊盘但 DRC 检查不出来
    - 导线移除回路功能失效
    - 等长网络公差未对网络类里的网络生效
    - 导出 Gerber 时焊盘形状变为三角形
    - 复制粘贴板子内容后铺铜区域的网络热焊规则变为默认规则
    - 移动导线时画布非常卡
    - 打开 PCB 时底部进度条一直加载并报错
    - 导出 3D 模型时编辑器白屏
    格式转换
    - 导入 PADS 封装自定义层变成内层
    - 导入 PADS 工程时打开 PCB 进度条一直跑
    - 导出 PADS 单层焊盘变多层焊盘
    - 导入 Altium 时元件封装存在不一致时未去重重命名器件
    - 导入 KiCad 封装和 3D 模型大小不正确
    - 导出 PADS 后导线、过孔及部分元件丢失
    - 导入 Altium 后内层铺铜不正确且 DRC 检查结果错误
    - 导入 Altium 焊盘阻焊扩展值不正确
    其他
    - 超大工程因超时打不开，进度条卡在 66%
    - 工程库存在异常数据但底部日志未报错
