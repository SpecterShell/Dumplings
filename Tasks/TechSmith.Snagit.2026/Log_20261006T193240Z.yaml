  InstallerUrl: https://download.techsmith.com/snagit/releases/2640/snagit.msi
Locale:
- Key: ReleaseNotesUrl
  Value: https://download.techsmith.com/update/snagit/enu/26.4.0_updatemessage.html
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    New Features
    Record to Camtasia Online
    - Added the ability to record video directly to Camtasia Online, our web-based video editor, for more editing options and easy collaboration.
    - Customize your video style with hundreds of layouts, effects, animated backgrounds, and more.
    - Invite teammates to collaborate and add their own clips to a video project.
    - On the Video tab in Snagit Capture, select Open In: Camtasia Online.
    Feature Updates
    - Added a Snagit Capture Preferences option to receive Standard updates as soon as they're available, or choose Delayed updates to receive them after an extended rollout period.
    - Added messaging to let a user know when their media will be sent to Camtasia Online for continued editing or collaboration.
    - Updated Snagit to use Microsoft Optical Character Recognition as the default OCR engine for improved performance and security.
    - Step Captures sent to Camtasia Online now include image text to help with automatic video generation.
    - Added an easier way to get help from within Snagit. In the upper-right corner of Snagit Editor, click the '?' icon and select Tech Support, or opt to view tutorials or send product feedback.
    - Removed X (formerly Twitter) as a share destination. To continue sharing content to this destination, use the Copy All button and paste directly into X.
    - Updated the Email share destination to better display wide images in email applications.
    - Updated status messaging to "Sending..." when sharing to local applications and file locations, and "Uploading..." only when sharing to online or cloud-based services.
    - Improved experience and messaging when attempting to select a camera that is in use.
    - Improved Grab Text results to include paragraph spacing.
    - Updated video tooltips in Snagit Editor to reflect new interface colors and icons.
    Performance Improvements
    - Updated Create Image from Template and other Editor dialogs for improved screen reader and keyboard accessibility.
    Updates for IT Administrators
    - Added an option to the Deployment Tool to receive Standard updates as soon as they are available, or Delayed updates after an extended rollout period.
    - Added an option to the Deployment Tool to disable update speed selection by end users.
    - Updated Snagit's third-party licenses file for newly added libraries.
    Bug Fixes
    - Fixed a crash that could occur when using capture hotkeys in specific circumstances.
    - Fixed a crash that could occur when capturing the cursor in specific circumstances.
    - Fixed a crash that could occur if there was a delay starting an in-product tour.
    - Fixed a rare crash that could occur when creating a new image via the File menu.
    - Fixed an issue where capture preset tooltips did not match the Light color mode setting.
    - Fixed an issue where Microphone and System Audio buttons in the video recording toolbar did not show audio levels.
    - Fixed an issue where the Open in Camtasia Editor capture preset did not work as expected.
    - Fixed an issue where Snagit Editor could unexpectedly switch to the Library view in some situations.
    - Fixed an issue where copying and pasting a selection would not paste the most recently copied selection in some situations.
    - Fixed an issue where sharing videos to OneDrive or Dropbox would fail in certain circumstances.
    - Fixed an issue where tooltips for the Share Link button might not display correctly in some situations.
    - Fixed an issue where the Grab Text Results window would not close automatically and might be duplicated.
    - Fixed an issue where capturing with the Clipboard selection option failed to capture all text on the clipboard.
    - Fixed an issue where text in the Email share options dialog could be truncated in some languages.
    - Fixed an issue where an incomplete Smart Redact caused the Quick Styles and Tool Properties side bar for all other tools to appear black.
    - Fixed an issue where video capture presets may not respect the selected microphone.
    - Fixed an issue where Step Capture images might disappear if grouped with other annotations.
