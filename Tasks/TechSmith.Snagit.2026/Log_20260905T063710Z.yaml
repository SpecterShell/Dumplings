Version: 26.3.1
Installer:
- InstallerType: burn
  InstallerUrl: https://download.techsmith.com/snagit/releases/2631/snagit.exe
- InstallerType: wix
  InstallerUrl: https://download.techsmith.com/snagit/releases/2631/snagit.msi
Locale:
- Key: ReleaseNotesUrl
  Value: https://download.techsmith.com/update/snagit/enu/26.3.1_updatemessage.html
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Feature Updates
    - Snagit now sends images to Camtasia Online in the original .snagx format, including cursor, text, and other capture information to facilitate video creation.
    - Updated the Time Delay options in Snagit Capture from a minimum Interval Capture time of 1 second to 3 seconds.
    - Re-added Compose email options back into Share to Email output.
    Performance Improvements
    - Updated Tool Properties and Effects panels in Snagit Editor for improved accessibility with screen readers.
    - Improved keyboard accessibility in the Time Delay options in Snagit Capture.
    Updates for IT Administrators
    - Updated OpenSSL to 3.6.3.
    - Addressed an untrusted search path issue which could result in elevation of privilege by a local attacker.
    Bug Fixes
    - Fixed a crash that could occur when showing the video recording toolbar.
    - Fixed a rare crash that could occur when attempting to enter a software key in specific circumstances.
    - Fixed an issue where images added to a Step Capture in certain circumstances do not appear correctly when shared to Camtasia Online.
    - Fixed an issue where text in some Share dialogs was truncated in French installations of Snagit.
