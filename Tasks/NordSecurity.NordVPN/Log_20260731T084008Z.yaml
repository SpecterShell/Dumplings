  Key: ReleaseNotes
  Value: |-
    When it comes to banking risks, fast reaction matters most. Transaction monitoring is now live and ready to scan your charges, flagging anything that looks out of the ordinary. Repeating transactions, suspicious vendors, unusual patterns — we’ll catch them instantly, giving you time to act.
    Transaction monitoring is available with certain subscription plans using US bank accounts. You’ll find it next to Dark Web Monitor.
