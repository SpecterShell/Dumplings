- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Improved AI Assistant Experience
    - With the new AI Assistant widget, chat with AI anytime, right from your desktop.
    - Use keyboard shortcuts, pin chats, and drag the floating button to wherever you prefer.

    Added Section Colors in Kanban View
    - Use colors to distinguish sections and make task groups easier to identify at a glance. Go to "View Options" in Kanban View and enable "Show Section Color".
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    AI 助手体验优化
    - 新增 AI 助手小部件，随时在桌面上与 AI 对话。
    - 支持快捷键操作、会话置顶与悬浮球拖拽，使用更便捷。

     新增看板分组颜色
    - 支持使用颜色区分看板列，让任务分组更加清晰直观。前往看板视图的“显示设置”，开启“显示看板颜色”即可使用。
