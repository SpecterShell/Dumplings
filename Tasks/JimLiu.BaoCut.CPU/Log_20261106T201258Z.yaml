  Key: ReleaseNotes
  Value: |-
    BaoCut 3.16.3 (Build 91) for Apple Silicon, macOS 14+.
    Bundle ID: com.baocut.app. Developer ID signed, hardened runtime and Apple notarization accepted for both App and DMG.
    Runtime and native Worker startup, signer fingerprint, staple and Gatekeeper checks passed. UI/export, real model inference and paid Agent calls were not exercised by this workflow. ffmpeg/ffprobe and an agent engine are external dependencies.
    Source: 2a9c9c16697baae44f24a86367a7b0fd49b608d3
    Actions: https://github.com/JimLiu/baocut/actions/runs/42257056016
    What's changed
    - Export at the canvas size by default. The export dialog now follows the resolution you edited at. A 4K source in a 1080p canvas exports at 1080p unless you explicitly select the original resolution, avoiding unintended larger files and longer exports. The original resolution remains available. Details
    - More reliable speaker naming after transcription. Transcription and link-import completion now prompt the agent to identify placeholder speakers using source metadata and transcript evidence before translation, caption creation or delivery. This also applies to single-speaker recordings and skipped or partial transcript polishing. Names without sufficient evidence keep their placeholders; names with evidence are written in one undoable edit and reported with their evidence. Details
    - Updated OpenAI image models. Added GPT Image 2.6 Sunburst and Flare and refreshed GPT Image 2.5 choices for PNG/JPEG/WebP generation and reference-image editing, including the existing landscape and portrait 2K sizes. GPT Image 2 remains the default. GPT Image 1 remains visible for saved selections but is unavailable. GPT Image 2.6 SVG, animated GIF, markup and complexity controls are not exposed. Details
    Full comparison: https://github.com/jimliu/baocut/compare/baocut-v3.16.2-build.90...baocut-v3.16.3-build.91
    Requirements and verification limits
    Requirements and verification limits: macOS requires Apple Silicon and macOS 14+. Windows packages are unsigned and require AVX2 and the Microsoft Visual C++ v14 x64 Redistributable; GPU variants require compatible drivers. ffmpeg/ffprobe and an agent engine remain external dependencies. Electron 44.9.3 embeds Node 24.22.0 and does not include the October Node security fixes. Automated release checks do not cover full UI/export workflows, live model or GPU inference, or paid agent calls.
    Platform availability
    macOS Apple Silicon and Windows x64 CPU, CUDA and Vulkan are published and verified.
    Windows x64
    Variants: cpu, cuda, vulkan. NSIS installers and portable ZIPs are unsigned. Real credential migration and model/Agent/GPU inference were not exercised by the installer tests. Requires the Microsoft Visual C++ v14 x64 Redistributable; the current package does not bundle the VC runtime DLLs.
    Native build and installer verification: https://github.com/JimLiu/baocut/actions/runs/42257056016
