- Locale: en-US
  Key: ReleaseNotes
  Value: "- New in Settings › Phones › Web mirror: Answer approvals in the browser lets you allow or deny a held step from your own phone through Tailscale. Each answer asks for Face ID, a fingerprint or the phone's passcode, and while an agent uses the phone the browser is on (and for 30 seconds after), the page there answers nothing. Payments, sends and agents' questions can be answered there; new agents, blocked apps and handoffs stay in Pinky's window. Off by default, and not yet tried with a real passkey in Safari or Chrome."
- Locale: zh-CN
  Key: ReleaseNotes
  Value: '- 「设置 › 手机 › 网页投屏」里新增「在浏览器中处理审批」：通过 Tailscale，在自己的手机上允许或拒绝等待中的步骤。每次回答都要 Face ID、指纹或手机密码；浏览器所在的那台手机正被 Agent 使用时（以及用完后的 30 秒内），那里的网页不能回答。付款、发送和 Agent 的提问可以在网页上回答，新 Agent 接入、被屏蔽的 App 和交接仍在 Pinky 窗口里处理。默认关闭，还没在 Safari 或 Chrome 上用真实的通行密钥试过。'
