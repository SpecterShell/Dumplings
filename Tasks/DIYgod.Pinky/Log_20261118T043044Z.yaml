  Key: ReleaseNotes
  Value: "- Agents can now read the web requests a phone makes during their tasks, through Pinky's own proxy. It is off for every phone until you turn on \"Read network traffic\" in Settings › Phones and set the phone up there. Pinky asks you first in each task, hides passwords and tokens, and never decrypts banking, payment, brokerage or password-manager apps."
- Locale: zh-CN
  Key: ReleaseNotes
