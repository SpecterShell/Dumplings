- Locale: en-US
  Key: ReleaseNotes
  Value: "- pinky devices now refuses a word it doesn't take, such as a phone's name: it says which word and exits with status 2, instead of ignoring the word and every flag after it (pinky devices pixel-9 --json printed the table and exited 0). A flag it doesn't have is reported once and also exits 2, and pinky devices -h prints the command's usage. Thanks @6moran."
- Locale: zh-CN
  Key: ReleaseNotes
  Value: '- pinky devices 现在会拒绝它不接受的词（比如手机名），说明是哪个词并以状态码 2 退出；以前它会把这个词连同后面的选项一起忽略，pinky devices pixel-9 --json 输出的是表格，退出码还是 0。不认识的选项只报一次错，同样以 2 退出；pinky devices -h 会显示这个命令的用法。感谢 @6moran。'
