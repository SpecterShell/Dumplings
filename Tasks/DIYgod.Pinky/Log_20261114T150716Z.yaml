  Key: ReleaseNotes
  Value: "- A phone can now have a window of its own: choose Open in a window in its ⋯ menu or right-click menu. The window shows only the phone's live screen and keys and works like the phone's page: a click takes over and Hand back gives it back. It keeps the screen's shape as you resize it and can stay on top of other windows."
