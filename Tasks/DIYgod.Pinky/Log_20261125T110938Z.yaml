  Value: "- A phone's own window, opened with Open in a window, now has no title bar or menu bar, only the phone's screen and the bar with its keys under it. Drag the window by an empty part of that bar, and close it with the × at the end of the bar or ⌘W (Ctrl+W on Windows and Linux). Thanks @QFinn-Penguin for the idea."
