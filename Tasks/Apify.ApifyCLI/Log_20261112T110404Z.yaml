  Value: |-
    1.12.0 (2026-11-12)
    🚀 Features
    - Validate actor.json paths before apify push uploads anything (#1503) (3bff862) by @DaveHanns
    - Let apify push select which Actors to push in a repository with several (#1504) (85405bf) by @DaveHanns
    - Push monorepo Actors by uploading the repository root with actorPath (#1505) (13d2577) by @DaveHanns
    🐛 Bug Fixes
    - Isolate detectAiAgent test from ambient environment (#1421) (7e944ac) by @l2ysho
    - Leave out every gitignored file when apify push collects files (#1537) (1668bd5) by @DaveHanns
    - Zip symlinked files as their content and finish writing the zip before upload (#1549) (cd0dad4) by @DaveHanns
    - Settle the job log stream promise when the connection drops (#1561) (3f4a024) by @l2ysho
    - Make the Actor context fallback error generic and actionable (#1563) (9d3eee5) by @l2ysho
    - Leave out .git at any depth when apify push collects files (#1551) (d72a751) by @DaveHanns
    - Say personal token instead of long-lived in apify mcp install (#1583) (be03664) by @l2ysho
    ⚡ Performance
    - Lazy-load actor-memory-expression (#1541) (9190b28) by @JuanGalilea
