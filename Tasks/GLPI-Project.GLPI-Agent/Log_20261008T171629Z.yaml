Version: "1.21"
Installer:
- Architecture: x64
  InstallerUrl: https://github.com/glpi-project/glpi-agent/releases/download/1.21/GLPI-Agent-1.21-x64.msi
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    core:
    * On windows, synchronize not thread-safe api worker timeout with backend-collect-timeout
      configuration (remains 180 seconds by default).
    * On windows, fixed keystore SSL cache management.

    inventory:
    * Experimental feature: Support WINDOWS_UPN_AS_LOGIN as 'features' parameter key
      to better report UPN as user login on windows
    * Report no monitor serial for buggy LG E2011 monitors
    * fix #1247: Fix v1.20 regression: OAuth token doesn't expire
      Also enhanced token cache support
    * Support detecting ssh daemon port on windows and avoid to check ssh public key on
      no response
    * Updated pci.ids to 2026.10.07 version
    * Bump Inventory task version to 1.28

    netdiscovery/netinventory:
    * Updated GrandStream IP phones support
    * Bump NetDiscovery task version to 8.1
    * Bump NetInventory task version to 8.1

    packaging:
    * Update Windows packaging to use:
      - gcc 16.2.0posix-14.0.0-msvcrt-r2
      - OpenSSL 3.5.9
      - 7-Zip v26.04
      - msys2-base 20260927
    * Update MacOSX packages to use OpenSSL 3.5.9
ReleaseTime: 2026-10-08T10:05:07.0000000Z
