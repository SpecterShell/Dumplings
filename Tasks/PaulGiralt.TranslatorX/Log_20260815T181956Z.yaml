  Value: |-
    TranslatorX 26.1.2 is now available. It restores reliable automatic and manual software-update checks for installations affected by 26.1.1 and promotes the tested 26.1.2-beta.1 feature set unchanged to Stable.
    Highlights include bounded regular-expression search, multi-row call work, exact First INVITE navigation, configurable trace-data safety limits, remembered Call Flow media visibility, and refreshed supported dependencies. Packages remain signed for macOS, Windows, and Linux with signed updater metadata and versioned SBOMs.
