  Value: |-
    StudiumX 0.1.3
    0.1.3 聚焦提升 AI 对话与课程生成的可靠性：修复对话完成后偶发丢失、工具调用消息配对错误，以及部分模型生成课程时思考模式造成的超时和结构化输出问题。
    更新内容
    - 对话完成更可靠：为对话运行使用跨进程唯一的标识，并在终态与工作区目录刷新存在竞态时保留完成的会话投影，避免刚完成的对话在侧栏中短暂消失。
    - 失败状态可恢复：当主进程在创建完整事件流之前失败时，会向界面发送明确的终态错误，避免草稿或发送状态一直停留在进行中。
    - 工具调用兼容性修复：保留维护回合中的 assistant 工具调用消息，使后续工具结果保持成对，避免兼容性严格的模型服务返回孤立 tool message 的 400 错误。
    - 课程生成更快、更稳：常规课程直接使用结构化请求；仅在明确要求研究时才启用受限工具研究。结构不合法时最多进行一次紧凑重试，随后提供与学习任务一致的本地降级课程。
    - GLM-5 结构化输出优化：GLM-5.x 在 JSON 课程生成中会显式关闭 thinking，减少无效推理 token 占用与等待超时；普通对话仍可按模型能力使用思考模式。
    - 新工作区更中立：首次创建工作区不再预填具体产品主题，而是等待学习者确认自己的学习主题。
    升级说明
    无需迁移配置。若课程生成服务暂时不可用或返回不合规结构，应用现在会提供基于当前学习任务的本地课程模板；服务恢复后可重新生成完整 AI 课程。
