  Value: |-
    StudiumX 0.2.2
    0.2.2 聚焦于思维导图 AI 生成与画布编辑的可靠性：生成改为主进程内的完整 agent 循环，画布编辑与文字换行更稳定，并修复了部分模型仅返回推理内容时生成中断的问题。
    更新内容
    - 更可靠的 AI 导图生成：思维导图生成改为在桌面端主进程内运行完整的 agent 循环。模型可以根据导图现状自主决定需要读取的工作区资料，推理过程与工具调用在界面上完整可见，并通过严格校验的结构化工具提交最终导图；生成过程更可靠、可追踪，也更容易理解。
    - 画布元素全类型可编辑：标注、关联、摘要等所有画布元素类型现在都可以被选中和删除，操作方式与其他元素一致。
    - 编辑时不闪动：主题文字进入内联编辑时，画布会保留渲染后的标签显示，编辑过程中不再出现文字跳动。
    - 更稳定的文字换行：改用画布探针测量主题文字的实际宽度，换行计算更接近真实渲染效果，在不同字体和平台上更稳定。
    - 推理流恢复：当模型只返回推理内容而不返回正文时，界面会通过一次修复重试恢复生成，不再因此中断。
    - 推理过程更完整：模型推理内容会保留在本地工具行之前显示，时间顺序更符合实际生成过程。
    - 内部结构改进：教学 IPC 网关的巨石模块按功能拆分为独立命令组，行为保持不变，便于后续维护与扩展。
    升级说明
    已有学习工作区、模型配置与思维导图可继续使用。工具审批、路径围栏、工作区信任以及恢复后不自动重放工具等安全规则不因本次升级而放宽。
