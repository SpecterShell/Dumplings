  Value: |-
    StudiumX 0.2.3
    0.2.3 聚焦于思维导图画布编辑体验与模型输出的兼容性：图片缩放支持从任意边缘操作，AI 预览中可查看主题笔记，同时提升了对常见模型 JSON 输出瑕疵的容错，并把默认最大输出 Token 提升到 12800。
    更新内容
    - 图片可从任意边缘缩放：思维导图中的自由图片现在可以从 8 个边缘与角部吸附区域任意缩放，与节点和形状的调整方式一致；自由图片缩放时保持对侧边缘固定（位置与尺寸同步更新），附着在主题块上的图片按宽高缩放并保持居中。拖动过程为本地预览，松开后一次性可撤销提交。
    - AI 预览中可查看笔记：思维导图 AI 生成预览中的笔记图标现在可以点击，会打开只读笔记卡片并展示预览文档中的笔记内容（此前点击无响应）。
    - 推理流恢复覆盖普通对话：当模型把全部输出预算消耗在推理（thinking）上、只返回推理内容时（如 DeepSeek Responses 端点），此前只有思维导图生成会重试；现在普通对话与工具调用流程也会以「关闭推理」重试一次，不再因空输出失败。
    - 模型 JSON 输出容错：思维导图工具参数解析对常见模型 JSON 瑕疵更宽容——未加引号的属性名、尾随逗号，以及个别 OpenAI 兼容主机把参数二次编码为 {"arguments": "<json string>"} 包装的情况，都可在严格解析失败后自动修复；修复不会凭空补值，真正截断或损坏的输入仍会被拒绝。
    - 默认最大输出 Token 提升到 12800：设置 schema 升级到 v3，新安装与升级用户的最大输出 Token 默认值从 4096 提升到 12800。
    升级说明
    设置 schema 升级到 v3：仍使用旧默认 maxOutputTokens（4096）的存量配置会在首次加载时自动迁移为 12800 并持久化一次；用户显式设置过的非默认值保持不变。已有学习工作区、模型配置与思维导图可继续使用。工具审批、路径围栏、工作区信任以及恢复后不自动重放工具等安全规则不因本次升级而放宽。
