    概览
    Reasonix v1.38.6 — 修复桌面端无法启动
    修复了导致官方桌面安装包无法启动的构建不匹配问题。
    发布日期：2026-09-11
    Desktop 4 · CLI 1
    桌面端更新
    重点内容
    - [Desktop] 官方桌面安装包可正常启动 — 修复 v1.38.5 在全新安装或升级后出现 build_mismatch、无法打开的问题。桌面壳与内置服务现在使用一致的发布版本信息。 (#10089)
    修复
    - [Desktop] 发布前验证正式包启动 — Windows、macOS 和 Linux 发布检查现在以正式模式启动打包应用，要求服务握手、界面到服务的实际调用及正常退出全部成功。构建信息缺失或无效时仍会报错。 (#10089)
    CLI 端更新
    此板块没有功能或修复条目；相关说明请查看下方升级提醒和风险提示。
    升级提醒
    - [Desktop] 安装完整包恢复启动 — 如果 v1.38.5 无法打开，请下载并安装 v1.38.6 完整包，无需清理配置或会话数据。从 v1.38.3 或更早 Wails 版本首次升级到 Electron 时，也需要手动安装完整包；旧版更新器无法安装新的目录结构。 (#10089)
    风险提示
    - [Desktop · CLI] OpenCode Go Responses 搜索限制仍然存在 — 本次启动修复未改变此前已报告的 OpenCode Go Responses 原生搜索限制。需要联网搜索时，请使用 v1.38.5 已验证的 Anthropic 搜索路径。 (#10015, #10081)
    致谢
    感谢本版本的贡献者：@SivanCola
