  Key: ReleaseNotes
  Value: |-
    - improved gpu up/download speed
    - fixed memory model for gpu filters that export memory to cuda/vulkan, input frames they take are copied at most once per source frame and shared between requests
    - fixed access violation in matroska muxer
    - fixed missing includes in anticipation of libc++ 23 insanity
    - logging is now much less likely to create deadlocks
    - requests for negative frame numbers are now simply clamped unlike before where it was a fatal error to request negative frame numbers
    - setmaxcpu no longer accepts random strings
    - fixed avisynth compat having flipped rgb and added rgbs support
    - many small bug fixes and improved error messages
