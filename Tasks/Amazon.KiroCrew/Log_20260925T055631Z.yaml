- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    A hot patch for two ways the dashboard had become slow: slow to start a chat, and slow to move between them.
    Notable fixes
    Sessions and subagents. The per agent view files Kiro Crew publishes for its agent backend are now reclaimed as soon as no running session holds one, so that directory no longer grows without bound. On hosts where it had reached thousands of entries every new chat and every background subagent paid several seconds before its first reply, and past a few thousand the backend stopped loading agents at all, so chats failed to start. The cleanup runs by itself on the next session you open.
    Chat panes. Switching between chat tabs no longer stalls the dashboard: a pane that reconnects asks only for the rows it displays instead of the session's entire transcript, and a message read again reuses the redaction already computed for it.
    What's Changed
    - chore(release): cut 0.7.1 for the stable hot patch by @bolichen97 in https://github.com/kirodotdev/KiroCrew/pull/13483
    Full Changelog: https://github.com/kirodotdev/KiroCrew/compare/v0.7.0...v0.7.1
