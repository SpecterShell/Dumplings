  Key: ReleaseNotes
  Value: |-
    - Screen Recorder: added a Pause/Resume button while recording.
    - Screen Recorder: added Webcam overlay (live preview, position, size, flip).
    - Screen Recorder: added mouse effects — cursor highlight, click effects, and click sounds.
    - Screen Recorder: added a countdown before recording starts.
    - Screen Recorder: newly designed options dialog (General, Video & Audio, Cursor, Webcam).
    - Improved HEIF/HEIC image support.
    - Fixed window-control capture failing on apps that span the whole desktop.
    - Renaming a file now handles invalid and duplicate names.
    - Other minor bug fixes.
ReleaseTime: 2026-09-16
