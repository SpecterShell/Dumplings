Version: 7.7.0
Installer:
- InstallerType: nullsoft
  InstallerUrl: https://download.picpick.net/7.7.0/picpick_inst.exe
- InstallerType: zip
  NestedInstallerType: portable
  InstallerUrl: https://download.picpick.net/7.7.0/picpick_portable.zip
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Added Extract Text (OCR) and Scan Text, with QR code detection.
    - Added Recent Captures to the Open page.
    - Widget: choose and reorder the buttons, and switch to a vertical layout.
    - Added Auto Edge Detection for region capture.
    - Hotkeys: redesigned options with support for the Windows key and system hotkeys like Win+Shift+S.
    - Added a capture notification popup that shows a preview after each capture.
    - Reorganized the pages of the Options dialog.
    - Added an option to include the file path when copying to the clipboard.
    - Added a Ctrl+Shift+C shortcut to copy the file path.
    - Fixed crashes when Windows shuts down or signs out.
    - Other minor bug fixes.
ReleaseTime: 2026-11-23
