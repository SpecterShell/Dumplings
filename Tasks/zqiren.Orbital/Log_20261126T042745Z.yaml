  Value: |-
    Orbital v0.25.0
    A new first run, a new look, and a lot more control over the agents you work with. Orbital opens on one Welcome page and lands on the Workbench, its own agent can run on your ChatGPT plan, Antigravity joins as a worker, and undo reaches back to any message.
    New
    - One Welcome page. Your agents, your recent sessions from other tools and a place for a model key are on a single page; Start lands on the Workbench. With no key, a signed-in agent does the routing.
    - Sign in with ChatGPT. Orbital's own agent can run on your ChatGPT plan, through OpenAI's official sign-in. No API key needed.
    - One connect screen for model providers. Pick a provider from logo tiles, paste the key, and it tests itself; you choose the model after it passes.
    - Antigravity as a worker. Pin it like any other agent. Sign-in is paste-the-code, and a region that Google does not serve is named as such.
    - Undo since any message. Undo everything an agent changed since a message you pick, including files it created. The agent is told what was undone.
    - Dispatch cards. Every task one agent hands to another shows as a card with the brief and the time it took; open it to see the worker's steps. A worker's question arrives as a card with its options.
    - Queued messages. Type while an agent is working: the message waits in the composer, where you can edit it, delete it, or stop the turn and send it now. Esc stops a turn.
    - Usage limits. An agent that has hit its plan limit is marked as limited, and switching to another agent is one click.
    - New look. Tinted window chrome, one inset sheet for the work, a single type scale across the app, and on Windows a title bar that follows light and dark.
    Improvements
    - Honest agent status. An agent reads ready only when a message to it would work; otherwise the card and the pin menu name what is wrong (not installed, signed out, region, limit).
    - Quieter chat. A run of status-only steps folds into one line.
    - Model picker for workers works before a project has any session, and with two Codex copies installed Orbital drives the newer one, so it lists the models the Codex desktop app lists.
    - Codex threads Orbital runs carry the session's title in Codex's own history.
    - Claude Code's background agents run as background jobs: they stay out of the chat and no longer hold up your next message.
    - The chat stays where you left it. Typing a long message or opening the right panel no longer moves the conversation off its latest message.
    Fixes
    - Sessions Orbital itself ran, and other apps' copies of them, are no longer offered as sessions to import.
    - Windows setup removes agent definitions left by an older version (Gemini CLI no longer appears next to Antigravity).
    - Undo of the latest turn survives the history size cap.
    - A decision or lesson in project memory is no longer duplicated.
    Install
    - macOS (Apple Silicon, macOS 13+): Orbital-0.25.0-macOS.dmg. It is signed with a Developer ID and notarized, so it opens without a Gatekeeper prompt.
    - Windows 10/11: Orbital-Setup-0.25.0.exe. The installer is not code-signed yet, so SmartScreen shows Windows protected your PC: click More info → Run anyway.
    - From v0.24.0 or later, the pill at the bottom left offers the update.
    - Stable download names for scripts and the README buttons: Orbital-macOS.dmg and Orbital-Setup.exe (attached below).
    Known issues
    - A message sent while a pinned worker is running waits for that turn to end; "send now" stops the turn first. Delivering it into the running turn is planned for the next release.
    - Antigravity needs a network exit in a region Google serves; beyond sign-in it was not run end to end on Windows.
    - Installing v0.24.1 over v0.25.0 on Windows leaves Antigravity listed in the older app.
    - The usage-limit state was not exercised against an account at its real limit.
    - The Workbench is in beta.
    - Intel Macs are not supported by this build.
    - The Windows installer is unsigned (SmartScreen warning as above).
