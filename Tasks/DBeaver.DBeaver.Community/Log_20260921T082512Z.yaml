- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Product configuration:
        - Fixed an issue where toolbars for disabled tools remained visible
    - AI Assistant:
        - Added profile and model selectors to AI Chat
        - Fixed a white flash when opening AI Chat in the dark theme
        - Improved AI Chat prompt caching, reducing repeated input-token processing in multi-turn conversations
    - SQL Editor:
        - Detached query result tabs now preserve the original result tab name and tooltip
        - Disconnecting a data source no longer prompts to save or automatically saves an open SQL script (thanks to @gsastraw)
        - User-defined Escape key bindings now work when no inline suggestion is visible (thanks to @danielpallettfr)
        - Fixed default formatting of column lists in CREATE TABLE constraints
        - Fixed intermittent errors in the Error Log when editing INSERT statements
        - Fixed an error that could occur when editing or moving the caret quickly while code completion was open
    - Metadata Editor:
        - Added a tooltip explaining that object names are transformed according to database naming conventions
    - Data Editor:
        - Added an option to display very small numbers in scientific notation instead of rounding them to zero
        - Fixed dictionary lookups for columns with composite foreign keys (thanks to @gsastraw)
        - Fixed an issue where hiding a column reset manually adjusted widths for other columns (thanks to @gsastraw)
        - Fixed incorrect row filtering when navigating composite foreign-key references
        - Improved performance when pasting a large number of cells
        - Improved Value panel performance when navigating between text columns
        - Fixed an issue where Advanced Paste could make the application unresponsive when inserting a large number of rows
    - Data transfer:
        - Fixed invalid exported DDL when apostrophes in inline column comments caused separator commas to be misplaced (thanks to @MicBun)
    - Connectivity:
        - Connection URLs can now be selected and copied while using host-based connection settings
        - Added support for specifying a custom SSH agent socket for SSH tunnel authentication on macOS (thanks to @LystranG)
        - Fixed importing connections from custom CSV files when optional URL parameters were missing
        - Network profiles are now sorted alphabetically
    - Navigator:
        - Fixed object filtering in Database Navigator folders when the "Connected only" filter was enabled
        - Connection type color changes are now applied immediately in Database Navigator (thanks to @sernopay)
        - Fixed an issue where the active project disappeared from the Projects view after being renamed (thanks to @anton-erofeev)
        - Fixed an issue where changing connection view settings without reconnecting could leave the connection tree empty
        - Fixed an issue where connections were not displayed in Database Navigator after switching workspaces in the Eclipse plugin
    - Miscellaneous:
        - Version updates are now shown in the toolbar instead of a pop-up dialog, and update download progress was improved
        - Added a "Run DBeaver" option to the Windows installer
        - Improved editor tab highlighting for colored connections: active tabs now use the connection color, while inactive tabs use a lighter shade
        - Fixed UNC path handling for DBeaver data directories on Windows (thanks to @gsastraw)
        - Fixed low-contrast text in read-only dropdown menus when using the dark theme on macOS
        - Improved dark theme colors for progress bars and embedded SQL editors
        - Fixed an issue where log rotation failures could interrupt tasks and data transfers
        - Windows ARM: Fixed a startup crash
        - Fixed excessive CPU usage when the update notification appeared over the master password prompt
        - Reorganized standard preference pages for easier navigation
        - Windows: Restored the splash screen when DBeaver is installed in Program Files
    - New drivers:
        - Added the Manticore Search driver (thanks to @akmalsyrf)
        - Added the TiDB Cloud Lake driver (thanks to @hantmac)
    - Databases:
        - Apache Doris: Fixed SQL query execution in the default schema without requiring the database and schema to be reselected
        - Apache IoTDB: Fixed changing the active database in the SQL Editor (thanks to @LJW21-02)
        - DuckDB:
            - Added SQL LIMIT clauses to Data Editor queries to prevent excessive memory use with large tables
            - Added support for connections on Windows ARM64
        - Firebird: Fixed function DDL generation to preserve parameter and return types, nullability, and SQL security mode (thanks to @sakshichitnis27)
        - GBase 8s: Fixed loading large CLOB and TEXT values when DBeaver is installed for all users on Windows (thanks to @Downstream1998)
        - MariaDB:
            - Fixed an issue where the Constraints tab could show a CHECK expression from another table (thanks to @zanlucathiago)
            - Named CHECK constraints are now shown in the Constraints tab for users with SELECT-only access (thanks to @zanlucathiago)
        - MySQL: Fixed execution of the SOURCE command in SQL scripts (thanks to @gsastraw)
        - Oracle: Standalone indexes used by constraints are now preserved in generated DDL
        - PostgreSQL:
            - Fixed active schema changes in manual commit mode by prompting users to commit the current transaction and updating the schema indicator
            - Fixed errors when displaying curved PostGIS geometries in the Spatial data viewer
            - Fixed the ability to backup selected tables
        - SQL Server: Added support for selecting target column collations during data transfer
        - Timeplus: Fixed data transfer and CSV import by generating STREAM DDL for target objects (thanks to @EastLord)
        - VeloDB: Fixed an issue where Describe object failed for VeloDB
    - Localization:
        - Windows installer: Restored the language selector
