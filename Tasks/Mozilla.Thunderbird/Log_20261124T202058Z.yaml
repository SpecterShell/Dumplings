  Key: ReleaseNotes
  Value: |-
    What’s New
    new
    Unread count badges are available on supported Linux taskbars
    What’s Changed
    changed
    Thundermail built-in add-on updated to v2.0.30
    changed
    OTR chat encryption is disabled by default for profiles that never used it
    What’s Fixed
    fixed
    The Subscribe dialog continued to show "Please wait" after loading
    fixed
    The Quick Filter keyboard shortcut could stop working
    fixed
    Compose commands failed when feed articles were displayed as web pages
    fixed
    Shift+Space scrolled messages down when focus was in the message list
    fixed
    Selecting a message in a thread summary did not scroll it into view
    fixed
    Changing saved search matching options could insert an invalid search field
    fixed
    Ctrl+Enter could require two presses to send a message
    fixed
    Tab from the Subject field required an extra press to reach the message body
    fixed
    Ctrl+V could unexpectedly send a message
    fixed
    Forwarding IMAP messages failed in some folders with spaces in their names
    fixed
    Contact edits by Manifest V3 extensions stored excess data and caused slowdowns
    fixed
    Birthdays without a year were not saved in Google address books
    fixed
    New Contact and New List were missing from the address book context menu
    fixed
    Editing vCard 3.0 contacts could lose the preferred phone number
    fixed
    Some CardDAV birthdays without a year incorrectly displayed the year 1604
    fixed
    Adding a second Exchange account could show messages from first account
    fixed
    Concurrent offline Exchange downloads could display the wrong message body
    fixed
    Sending messages could incorrectly report an error applying filters
    fixed
    SMTP CRAM-MD5 authentication could fail with some server challenges
    fixed
    Some IMAP messages caused the message pane to reload endlessly
    fixed
    Visual and UX improvements
    fixed
    Security fixes
