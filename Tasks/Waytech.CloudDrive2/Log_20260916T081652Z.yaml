  Key: ReleaseNotes
  Value: |-
    1. 修复备份的文件过滤规则在白名单模式下部分规则不生效的问题(#490、#163)
    2. 修复文件夹被删除后又在第三方以同名重新创建（例如在另一台设备上操作，或清空回收站之后），之前对这个文件夹的浏览和读取会一直失败的问题
    3. 修复 Windows 挂载盘， 当挂载盘根目录是可写目录时，资源管理器中删除文件会提示回收站已损坏的问题，在根目录可写的本地挂载盘上支持 Windows 资源管理器的删除到回收站和从回收站恢复
    4. 修复 Windows 挂载盘在网页端或者其他设备上进行修改时，无法向操作系统发出文件变更通知的问题(#554)
