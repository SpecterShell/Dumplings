  Key: ReleaseNotes
  Value: |-
    1. 修复在挂载盘上写入大文件时报"找不到文件"(os error 2) 的问题。写入过程中如果有其他程序（如 Cryptomator、备份软件）打开又关闭了同一个文件，写入会在最后失败。1.0.16 只修复了文件被删除重建的情形，这次修复写入过程中被其他程序访问的情形
    2. 取消上传后不会再自动重新上传。此前如果有播放器或索引程序打开着该文件，取消会在它们关闭文件后失效
    3. Android：可以把 U 盘、SD 卡等外部存储添加为本地文件夹账户，此前只能添加内部存储
    4. Windows：修复安装为 Windows 服务后，关机或注销可能产生崩溃报告并导致关机耗时数分钟的问题。本次修复需要重新运行安装程序，应用内更新不会替换 Windows 服务程序
    5. WebUI：筛选文件后按 Ctrl-A/ Cmd-A 只选中筛选结果，不再选中被筛选掉的文件。与 macOS 和 Windows 客户端行为一致
    6. 其它 bug 修复和性能改进
