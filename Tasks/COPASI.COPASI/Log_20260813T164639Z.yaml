  Key: ReleaseNotes
  Value: |-
    New Features since COPASI 4.46 (Build 300)
    - Simulation Engine
      - Multi threading for population based optimization methods Differential Evolution, Evolutionary Programming, Evolution Strategy (SRES), Genetic Algorithm, Genetic Algorithm SR, Particle Swarm, and Scatter Search speeding up optimization and parameter estimation tasks.
    - Command Line (CopasiSE)
      - Added option to import and export task settings.
    Bug Fixes and Enhancements since COPASI 4.46 (Build 300)
    - Graphical User Interface (CopasiUI)
      - Opening files from URL when clicking on a link on a website is again functional.
      - Tool Profile Likelihood: This tool now also works with just one parameter.
      - Tool Create Events from Time Series Experiment allows now the selection of the experiment if multiple experiments are specified.
      - Scan Sub Task Output: The tool tips for the check boxes have been corrected.
      - Parameter Estimation: Improved behavior when stopping the process to return complete plots.
    - Simulation Engine
      - Time Course RADAU5: Improved method to properly support multi threading.
      - Optimization Scatter Search: Fixed issue detecting improvements in solution.
      - Increased stack size under Windows to prevent randomly occurring access violations.
