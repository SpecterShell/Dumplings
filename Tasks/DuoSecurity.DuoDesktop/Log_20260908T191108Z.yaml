Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Duo Desktop will now ask for permission to collect error and usage data when starting up. This is optional and can be enabled or disabled at any point in the app's preferences. Administrators can also set this preference system-wide to bypass the start-up prompt.
    - Improved the robustness of Secure Access connections to better handle intermittent network issues.
    - Internal changes to support reporting OS automatic update status and management agent detection for Secure Access.
    - Duo Desktop will now detect Google Compute Engine and Microsoft Azure as virtual environments.
    - Minor improvements and enhancements.
ReleaseTime: 2026-09-08
