  Key: ReleaseNotes
  Value: |-
    What's Changed
    - WASM: open presenter view in a separate browser window (#729) by @FredApps in https://github.com/storytold/deckcraft/pull/730
    - H.264: temporal direct mvs are scaled in i32 and clipped to the spec range by @SusieeTheLinuxUser in https://github.com/storytold/deckcraft/pull/1247
    - PPTX: parse each tags part once and cap the tags an import copies (#1164) by @Naseq in https://github.com/storytold/deckcraft/pull/1373
    - Allow resizing on all selected shapes (#1539) by @DominicTheD3v in https://github.com/storytold/deckcraft/pull/1558
    - Shape Fill: the gradient help lists every kind and key the command takes by @dotCooCoo in https://github.com/storytold/deckcraft/pull/1600
    - Reject invalid slide index in design.background by @Silvertree2010 in https://github.com/storytold/deckcraft/pull/1601
    - Fonts: unavailable monospace fonts fall back to a monospace substitute (#1598) by @madhasoeki in https://github.com/storytold/deckcraft/pull/1614
    - Let clicks pass through empty No Fill shapes by @QuirkyTurtle94 in https://github.com/storytold/deckcraft/pull/1623
    - render: keep even-odd holes open in shadow, glow and reflection silhouettes by @scks1 in https://github.com/storytold/deckcraft/pull/1626
    - Lowercase word-final Σ as ς in title and sentence case by @Silvertree2010 in https://github.com/storytold/deckcraft/pull/1627
    - Keep combining marks inside spell-check words by @Silvertree2010 in https://github.com/storytold/deckcraft/pull/1628
    - Apply alphaMod and alphaOff in ColorRef::alpha by @Silvertree2010 in https://github.com/storytold/deckcraft/pull/1630
    - Keep Xfrm::rot_norm within 0..360 for tiny negative rotations by @Silvertree2010 in https://github.com/storytold/deckcraft/pull/1631
    - Text: scale down insets when wider than the shape (#1632) by @Naseq in https://github.com/storytold/deckcraft/pull/1639
    - test: make the language-dialog test independent of installed dictionaries by @scks1 in https://github.com/storytold/deckcraft/pull/1645
    - Fix Unit::format printing "-0.00" for tiny negative lengths by @Silvertree2010 in https://github.com/storytold/deckcraft/pull/1667
    - Replace the Account page with About by @dylanmtaylor in https://github.com/storytold/deckcraft/pull/1697
