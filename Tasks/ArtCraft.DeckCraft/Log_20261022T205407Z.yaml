  Key: ReleaseNotes
  Value: |-
    Note
    FreeBSD aarch64 is dropped from this release. We had to cut releases, and we cannot build this target within the 5-hour CI limit for any of the Craft apps, so we are dropping it for now. This is a known blocker, flagged for a future fix in storytold/craft-common-actions#39. FreeBSD x86_64 and every other platform are included.
    What's Changed
    - docs: add SonarCloud and CodeRabbit badges to README by @dylanmtaylor in https://github.com/storytold/deckcraft/pull/984
    - Skip CodeRabbit reviews on Dependabot PRs by @echelon in https://github.com/storytold/deckcraft/pull/1068
    - ci: switch to shared nix workflow from craft-common-actions by @dylanmtaylor in https://github.com/storytold/deckcraft/pull/865
    - macOS: open presentations from Finder, Open With and the Dock (#138, #347) by @Lexx143 in https://github.com/storytold/deckcraft/pull/432
    - security: enforce HTTPS on curl downloads (SonarCloud S6506) by @dylanmtaylor in https://github.com/storytold/deckcraft/pull/1139
    - README: the app icon above the title by @bflatastic in https://github.com/storytold/deckcraft/pull/1158
    - fix(wasm): avoid std services that panic on wasm32-unknown-unknown at… by @alexeyvolkoff in https://github.com/storytold/deckcraft/pull/982
    - Thumbnails: only render the slides in view (#969) by @Faabyy in https://github.com/storytold/deckcraft/pull/1011
    - Text: an empty line takes the size of the mark that ends it by @Hamza0101 in https://github.com/storytold/deckcraft/pull/790
    - Reject invalid slide index params instead of using the selection by @Silvertree2010 in https://github.com/storytold/deckcraft/pull/1063
    - Strip URI fragment before percent-decoding OPC targets by @Silvertree2010 in https://github.com/storytold/deckcraft/pull/1071
    - Clear animation triggers that point at deleted shapes by @Silvertree2010 in https://github.com/storytold/deckcraft/pull/996
    New Contributors
    - @Lexx143 made their first contribution in https://github.com/storytold/deckcraft/pull/432
    - @bflatastic made their first contribution in https://github.com/storytold/deckcraft/pull/1158
    - @alexeyvolkoff made their first contribution in https://github.com/storytold/deckcraft/pull/982
    - @Hamza0101 made their first contribution in https://github.com/storytold/deckcraft/pull/790
