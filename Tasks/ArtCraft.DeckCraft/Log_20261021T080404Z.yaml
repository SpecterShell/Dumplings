  Key: ReleaseNotes
  Value: |-
    Note
    No FreeBSD aarch64 build in this release. We are having trouble building this architecture within the 5-hour CI timeout across all Craft apps, so we are releasing without it to unblock builds. FreeBSD x86_64 and every other platform are included. FreeBSD aarch64 builds will return once the build fits in CI.
    What's Changed
    - Keep bare '&' text when pasting HTML instead of dropping it by @Silvertree2010 in https://github.com/storytold/deckcraft/pull/795
    - Keep multi-paragraph slide titles on one line in outline export by @Silvertree2010 in https://github.com/storytold/deckcraft/pull/796
    - PPTX: a slide that can't be read is reported, not dropped in silence (#203) by @Faabyy in https://github.com/storytold/deckcraft/pull/802
    - Add slides from an outline to the section of the slide they follow by @Silvertree2010 in https://github.com/storytold/deckcraft/pull/827
    - Text: AutoFormat superscripts ordinals (1st, 22nd) as you type by @marcoarnulfo in https://github.com/storytold/deckcraft/pull/856
    - Opening a .ppsx from the command line starts the slide show (#862) by @marcoarnulfo in https://github.com/storytold/deckcraft/pull/864
    - Show: Back leaves a slide whose first animation plays by itself by @marcoarnulfo in https://github.com/storytold/deckcraft/pull/882
    - Export: PNG with a transparent background (#784) by @switch87 in https://github.com/storytold/deckcraft/pull/885
    - Limit shape.setBounds, shape.resize and shape.move size and position by @Silvertree2010 in https://github.com/storytold/deckcraft/pull/886
    - Remap slide links to the copies when reusing slides by @Silvertree2010 in https://github.com/storytold/deckcraft/pull/893
    - Change case across formatting run boundaries by @Silvertree2010 in https://github.com/storytold/deckcraft/pull/898
    - Mirror the rotation when flipping a rotated shape by @Silvertree2010 in https://github.com/storytold/deckcraft/pull/901
    - Reject invalid comment.delete index instead of clearing the slide by @Silvertree2010 in https://github.com/storytold/deckcraft/pull/902
    - Export: PDFs store each slide backdrop once (#845) by @FabPei in https://github.com/storytold/deckcraft/pull/928
    - Canvas: a shape in front of edited text takes the click (#931) by @Zetenypapp in https://github.com/storytold/deckcraft/pull/943
    - Edit Points: turning a shape into a freeform is one undo step by @Zetenypapp in https://github.com/storytold/deckcraft/pull/946
    - Open: cap absurd effect sizes from a file (a huge glow made rendering ask for 34 GB) by @Zetenypapp in https://github.com/storytold/deckcraft/pull/947
    - Open: give shapes that repeat an id in a .deckcraft file fresh ones by @Zetenypapp in https://github.com/storytold/deckcraft/pull/948
    - Hide the idle cursor over clickable clips during a slideshow (#968) by @MarekSpodBiedry in https://github.com/storytold/deckcraft/pull/979
    - Arrange: Align to Slide and Align Selected Objects in the Align menu, as in PowerPoint by @marcoarnulfo in https://github.com/storytold/deckcraft/pull/871
    - docs: drop references to competing commercial software by @dylanmtaylor in https://github.com/storytold/deckcraft/pull/952
    - ci: configure Dependabot for Cargo and GitHub Actions by @dylanmtaylor in https://github.com/storytold/deckcraft/pull/993
    - Format: retain imported chart parts through native saves by @MMexicann in https://github.com/storytold/deckcraft/pull/851
    New Contributors
    - @Faabyy made their first contribution in https://github.com/storytold/deckcraft/pull/802
    Full Changelog: https://github.com/storytold/deckcraft/compare/v0.8.0...v0.9.0
