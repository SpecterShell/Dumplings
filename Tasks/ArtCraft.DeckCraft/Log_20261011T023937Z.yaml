  Key: ReleaseNotes
  Value: |-
    What's Changed
    - Issue #23: README lists the ALSA headers a Linux build needs by @LloydNicholson in https://github.com/storytold/deckcraft/pull/24
    - Morph test: sort the ids before dedup so it really checks uniqueness by @alexanderalber in https://github.com/storytold/deckcraft/pull/25
    - App icon: scalable SVG for Linux desktops (#12) by @alexanderalber in https://github.com/storytold/deckcraft/pull/29
    - Slide show: transitions show the old slide instead of the new one twice (#33) by @alexanderalber in https://github.com/storytold/deckcraft/pull/46
    - Issue #44: MCP: the export tool lists PDF and its layout options by @LloydNicholson in https://github.com/storytold/deckcraft/pull/65
    - Issue #63: Text: hyperlinks are drawn in the theme's hyperlink colour, underlined by @LloydNicholson in https://github.com/storytold/deckcraft/pull/37
    - chore: bump github actions to fix Node 20 deprecation warnings by @dylanmtaylor in https://github.com/storytold/deckcraft/pull/52
    - Add OmaStore manifest by @KitsuneSemCalda in https://github.com/storytold/deckcraft/pull/57
    - Issue #61: Shapes: flipped shapes keep their text readable by @LloydNicholson in https://github.com/storytold/deckcraft/pull/35
    - Morph: a changed geometry morphs its outline (a circle turns into a star) by @alexanderalber in https://github.com/storytold/deckcraft/pull/27
    - Colour menus: clicking the hex field no longer closes the menu (#32) by @alexanderalber in https://github.com/storytold/deckcraft/pull/47
    - Home: the title bar's Home button opens the start screen (#17) by @alexanderalber in https://github.com/storytold/deckcraft/pull/49
    - feat(pictures): animated GIFs play, with pause (media.gifPlay) by @DimaSmaha in https://github.com/storytold/deckcraft/pull/39
    - Links: Insert Hyperlink with a bare caret inserts the address; the show follows links (#31) by @alexanderalber in https://github.com/storytold/deckcraft/pull/45
    - Animation Painter: copy and apply animation sequences between shapes by @Johannesgauss in https://github.com/storytold/deckcraft/pull/54
    - Issue #62: Fields: date fields show today's date in their own format by @LloydNicholson in https://github.com/storytold/deckcraft/pull/36
    - Progress docs: re-measure against PowerPoint 16.113 (craftrules standard) by @echelon in https://github.com/storytold/deckcraft/pull/89
    - Release prep: 0.5.0 and Linux riscv64 release build by @echelon in https://github.com/storytold/deckcraft/pull/102
