  Key: ReleaseNotes
  Value: |-
    What's Changed
    - CI: no macOS on PRs or main; macOS is built and tested by releases by @echelon in https://github.com/storytold/deckcraft/pull/22
    - macOS DMG: branded window background and icon layout by @XusBadia in https://github.com/storytold/deckcraft/pull/8
    - Fix integer overflow on hostile H.264/HEVC parameter sets by @Pedroj-64 in https://github.com/storytold/deckcraft/pull/2
    - README: install on Gentoo from the ::snakebyte overlay by @switch87 in https://github.com/storytold/deckcraft/pull/6
    - Slide show: a click after a long pause plays its step instead of skipping it by @alexanderalber in https://github.com/storytold/deckcraft/pull/11
    - PPTX: recognise packages whose [Content_Types].xml is not in the first 4 KB by @wurstbrotdlx in https://github.com/storytold/deckcraft/pull/19
    - Start screen: theme tiles that wrap to a new row keep the left inset (#17) by @MarekSpodBiedry in https://github.com/storytold/deckcraft/pull/20
    - Desktop: write log records to standard error and a rotating log file by @switch87 in https://github.com/storytold/deckcraft/pull/7
    - Default Windows startup to DirectX 12 by @DWAA1660 in https://github.com/storytold/deckcraft/pull/16
    - Morph: shapes move, resize and blend; Words and Characters options morph text by @alexanderalber in https://github.com/storytold/deckcraft/pull/5
    - Tables: rows grow to fit their text, cell text in the PDF text layer (#13) by @MarekSpodBiedry in https://github.com/storytold/deckcraft/pull/14
    - feat(text, fonts): UAX #9 BiDi and Arabic complex script typography engine by @hamzaelkachtaf4-star in https://github.com/storytold/deckcraft/pull/4
