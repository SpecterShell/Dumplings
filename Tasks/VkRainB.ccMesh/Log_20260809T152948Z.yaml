  Key: ReleaseNotes
  Value: |-
    v0.2.3
    新增
    - 配置档案 / Claude Desktop：接管本机真实配置目录，三栏编辑 Profile、_meta 与桌面配置文件；Windows / macOS / Linux 均有路径解析（Windows 含 MSIX 探测，Mac/Linux 按约定 3P 目录，可用环境变量覆盖）
    - 配置档案 / Claude Desktop：支持独立开关 3P 模式，打开配置目录，应用配置并标识当前生效项
    - 配置档案 / Claude Desktop：支持模型发现与模型别名；开启发现时自动拉取模型，关闭后可配置界面别名
    - 对话：新增内置对话页，支持模型选择、消息列表与话题管理
    - 工具会话：新增工具会话页面与导航入口
    - 桌宠：新增宠物管理与精灵展示，接入侧栏导航与设置入口
    - 端点管理：模型映射增加总开关、快捷预设与卡片高亮
    - 同步：导出/导入与 WebDAV 同步覆盖模型映射及总开关
    - 模型图标：未匹配模型改用通用图标兜底，完善 codex 前缀识别
    修复
    - 代理熔断：未知入站路径返回 404 时不再误触发端点熔断
    桌宠 （宽屏下显示，填补你的左侧空白）
    会话管理
    Claude Desktop 配置
