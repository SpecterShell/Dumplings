  Key: ReleaseNotes
  Value: |-
    新增
    - 统计页：用量统计与端点统计新增近一年调用热力图（贡献图风格，宽度自适应铺满，悬停查看当日请求数与输入/输出/缓存 Token）
    - 统计页：新增调用趋势图（面积图，次数/Tokens 指标切换，跟随所选时间范围按天展示、缺失日期补零）
    - 统计页：时间筛选统一升级为日期范围选择器，预设快捷项点击即生效，支持自定义起止日期时间（手写月历，零新增日期依赖）；端点统计的今日/昨日/本周/本月周期转为快捷项，任意自定义区间的指标卡与端点明细由历史数据聚合
    - 统计页：端点统计上下区块共用同一时间范围，请求记录支持精确到时分过滤；所选范围无数据时明细表与请求记录整块隐藏
    - 用量统计：本机用量记录落库精确时间戳（migration v17），支持时分粒度筛选，升级后首次同步自动回填历史记录
    - 配置档案：Claude 配置新增上下文窗口 tokens 与自动压缩触发窗口表单，含推荐值快捷填入
    - 配置档案：Claude 新增更多配置弹层，可跳过 Claude Code 初次安装确认（读写 ~/.claude.json）
    - 配置档案：新增 Pi / OMP 配置管理（后端接管 + 配置工作区页面）
    - 配置档案：配置文件卡项样式美化
    - 端点管理：API URL 路径已含 /vN（如智谱 /v4）时不再叠一层 /v1；末尾加 # 可强制不加 /v1，表单实时预览完整请求地址
    - 工具会话：支持扫描、查看与删除本机 OpenCode 会话（兼容 legacy JSON 与 opencode.db），筛选与图标与 Claude / Codex 一致，恢复命令可复制
    - 文档：新增 docs-site 文档站点与 GitHub Pages 自动部署工作流
    修复
    - macOS：关于页探测 CLI 版本不再反复触发「下载文件夹」权限请求（探测降级为非交互 shell，不再执行 .zshrc 插件）
    - 防止自动更新连点多次下载
    - Claude 流式互转：text / thinking 切换时 content block 索引冲突
    - 生产构建分包循环初始化导致整窗白屏

