  Value: |-
    Quiet.md 0.1.11
    中文
    这次更新把文档库改成了真实文件夹，并带来全新的首次启动。
    - 文档库改为真实文件夹：访达里看到的就是侧栏，文件以标题命名（工作/周报.xml），文档之间的链接写成相对路径。应用自己的数据收在隐藏的 .quiet/，图片在 .assets/。
    - 旧文档库自动迁移：本机的文档库打开时直接迁移，并在侧栏卡片里说明；放在 iCloud、Dropbox 等同步盘里，或在别的电脑上用过的，会先征求同意。迁移前完整备份到 .quiet/before-folders-4/，任何一步失败都会回滚。
    - 全新的首次启动：选择界面语言、文档库位置和随手记快捷键，并可从 Obsidian、Logseq、iA Writer、Typora 导入已有笔记（导入的是副本）。
    - 「打开」就地编辑 Markdown，「导入」复制进文档库。
    - 新增日语、西班牙语和韩语界面。
    - 设置可选择网页搜索（默认 Google）、打开链接的浏览器、窗口背景和界面字号。
    - 文档回到上次的阅读位置；新增原样粘贴（⌘⇧V / Ctrl+Shift+V）。
    - Markdown 支持块级公式和全角标点，表格列宽按内容调整；导入 Obsidian 的图片嵌入和 callout 提示块。
    - 「打开上次使用的文档」快捷键可以修改；文档列表跨启动缓存，启动更快。
    - 图片更省内存；代码块可横向滚动，拖选到边缘时自动滚动。
    - 修复页面跳动、换行处光标、截图粘贴、输入框按词移动和导出 PDF 的扩展名。
    - Windows：显卡设备丢失后不再崩溃。更新只从官方地址经 HTTPS 下载。
    注意：迁移后的文档库不能再用 0.1.10 及更早的版本打开。多台电脑共用一个文档库时，请先把它们都升级到 0.1.11。
    English
    This update turns the library into real folders and brings a new first launch.
    - The library is now real folders: Finder shows what the sidebar shows, files are named by title (Work/Weekly.xml), and links between documents are relative paths. The app's own data lives in a hidden .quiet/, pictures in .assets/.
    - Older libraries move automatically: a library on this computer moves when opened and a card in the sidebar says so; one in iCloud, Dropbox or another synced folder, or used on another computer, asks first. Everything is backed up to .quiet/before-folders-4/ first, and any failed step rolls back.
    - A new first launch: pick the interface language, where the library lives and the quick-note shortcut, and bring notes from Obsidian, Logseq, iA Writer or Typora (as copies).
    - Open edits Markdown in place; Import copies into the library.
    - Japanese, Spanish, and Korean interfaces.
    - Settings: the web search site (Google by default), the browser links open in, the window background, and the interface size.
    - Documents reopen where you left off; paste as written (Cmd+Shift+V / Ctrl+Shift+V).
    - Markdown: display math and full-width punctuation; table columns fit their content. Import Obsidian picture embeds and callouts.
    - The Open Last Document shortcut can be changed; the document list is cached between launches for a faster start.
    - Pictures use less memory; code blocks scroll sideways; drag-selecting scrolls at the edge.
    - Fix page jumps, the caret at wrapped lines, pasting screenshots, moving by word in text fields, and the exported PDF's extension.
    - Windows: no crash when the graphics device is lost. Updates download only from the official site over HTTPS.
    Note: once moved, a library can no longer be opened by 0.1.10 or earlier. If several computers share one library, update them all to 0.1.11 first.
    Thanks to everyone who contributed fixes, translations and reports.
    Packages / 安装包
    - macOS: Apple Silicon and Intel ZIPs, Developer ID signed and notarized.
    - Windows: x64 installer; unsigned, as in 0.1.10.
    - Linux: experimental x86_64 AppImage (glibc 2.35 baseline); in-app updates are supported when running the AppImage.
    Linux: chmod +x quiet-md-0.1.11-x86_64.AppImage, then run it. If FUSE is unavailable, run it with --appimage-extract-and-run.
    All packages include SHA-256 checksums and detached Minisign signatures, verified with packaging/update-key.pub.
    Full changelog: https://github.com/s1dashu/quiet-md/compare/v0.1.10...v0.1.11
