    Quiet.md 0.2.0
    中文
    这次更新去掉了单独的主页，侧栏按顶层文件夹分组；数据库正式开放；新增专注、打字机和段落聚焦三种写作模式、只缩放正文的放大缩小，以及命令行工具 quiet 和「连接 Agent」。整个界面换成了统一的一套组件，深色模式也更清晰。
    - 文件夹就是最上层：不再有单独的主页，侧栏按顶层文件夹分组，每组的标题可以折叠，标题的「…」里有批量管理、在访达中显示和从侧栏移除。用「添加文件夹」加入的文件夹就地使用，和默认文件夹并列。「我的文档」和「本机文件」不再单独列出：单独打开的 Markdown 文件在自己的窗口里编辑，以前列在「本机文件」里的文件留在原处不动，以前打开过的「本机文件夹」升级后自动成为顶层文件夹。页面和文件夹可以拖到、或用「移动到」移到另一个顶层文件夹，图片、链接和版本历史一起带过去，可以撤销。
    - 收藏并入置顶：已收藏的文档升级后变成置顶，菜单里只留「置顶」（字体列表的收藏不变）。
    - 标题栏：文档页右上角是 + · 搜索 · …，文件夹页是 + · 显示 · 搜索 · …，「+」、「搜索」和「…」在每一页的位置都一样。设置和回收站的侧栏顶部有「返回」。文件夹页的列表可以点表头按任意一列排序、再点切换升降序，侧栏跟着同样的排序。
    - 数据库：这个版本正式开放。可以从新建菜单、/ 菜单新建，或从 CSV 新建；有文本、单选、多选、日期、数字、公式、查找引用、关联等字段，可以筛选、排序、分组、按条件填色，行高可选「适应内容」。「笔记」列的每个单元格是文档库里的一篇真实笔记，放在表格旁边的「<表名> · 笔记」文件夹里。
    - 写作模式：都在文档的「…」菜单里。「专注模式」（⌘.，Windows 和 Linux 上是 Ctrl+Shift+Enter，Esc 退出）让窗口里只留下文档；「打字机模式」（⌘⇧T）让正在写的一行停在窗口中间，查找跳转和调整窗口大小时也保持居中；「段落聚焦」（⌘⇧F）让正在写的段落保持清晰，其余变淡。
    - 正文缩放：「显示」菜单里的放大 / 缩小 / 实际大小（⌘+ / ⌘− / ⌘0，Windows 和 Linux 上用 Ctrl）只缩放笔记正文，侧栏和标题栏不变，标题、表格、代码和公式一起缩放。设置 › 外观 › 正文字号除了预设也可以自定义字号；「文档大纲」开关可以隐藏正文旁的标题目录。
    - 命令行和 Agent：新增命令行工具 quiet，可以在终端里列出、搜索、阅读和编辑文档，也能查询和修改数据库，随应用一起安装。quiet folders add|remove 增删侧栏里的文件夹（应用开着时几秒内跟着变），quiet open 文档#块 在应用里打开文档并定位到那个块（quietmd:// 链接，只用来打开），还能置顶、创建副本。设置 › 连接 Agent 给出安装 skill 的命令（npx skills add s1dashu/quiet-md）和一段提示词，让 Claude Code、Codex 等 Agent 自己配置好；macOS 上点「安装命令行工具」把 quiet 放进 ~/.local/bin，Windows 安装程序默认把它加入 PATH。quiet 每天发送一次匿名使用计数（运行次数、失败次数和命令名，不含文档、标题或参数），见下面的「匿名使用统计」。
    - 匿名使用统计：应用和 quiet 每天各发送一次匿名计数（应用打开了几次、各命令运行和失败了几次），不含个人信息、文档、标题、文件名或参数。设置 › 通用 › 网络与隐私 ›「匿名使用统计」可以关闭，没动过时跟随「自动检查更新」；也可以用 quiet telemetry off、DO_NOT_TRACK 或 QUIET_NO_TELEMETRY 关闭。设置 › 通用分成基本、编辑、链接与搜索、网络与隐私四组。
    - 深色模式：「显示」›「切换深色 / 浅色」（⌃⌘D，Windows 和 Linux 上是 Ctrl+Shift+D）。深色下的链接、文字颜色、高亮、提醒日期、倒计时和按钮文字都调到清晰可读，空白页插图有深色版本，侧栏的毛玻璃跟随应用的深浅色，侧栏的文字和图标更亮。
    - 统一的界面组件：菜单、按钮、对话框、开关、提示和滚动条换成参照 shadcn/ui 的同一套组件；菜单放不下时可以滚动，鼠标移向子菜单时不会误触经过的行；图标统一换成 Nucleo。画板的工具栏、属性面板和帮助也换成同一套组件，画布、操作和快捷键不变。macOS 上的圆角改为连续圆角。
    - 回收站自动删除：回收站顶部可以选择删除的文档保留 1、3、7、14 或 30 天，也可以自定义天数，默认仍是 30 天。
    - 快捷键：每个快捷键都可以用旁边的垃圾桶清除，清除后显示「未设置」，即关闭；「全局快速新建笔记窗口」不再有单独开关，以前关掉的升级后清除它的按键。全局快捷键各自注册，注册不上时在对应一行下说明原因。
    - 新用户的默认文件夹：首次启动不再有引导页，直接打开「文稿」里的「Quiet Notes」文件夹和第一篇开始指南；别的文件夹和其他应用的笔记随时从「文件」菜单添加或导入。已有的 Quiet.md 文档库保持原样，不改名、不移动。在侧栏重命名默认文件夹时，文档库的位置跟着改。
    - 开始指南：新文档库里的指南重新分组：欢迎之外都放进文件夹，依次是文档、Markdown 文件、画板、数据库和日常使用（整理、导入导出、个性化）。Markdown 文件、画板和数据库三组各附一个真实的示例文件（.md、.excalidraw、.sqlite），示例数据库有 20 条记录、各种字段类型，数据库指南里还嵌着一张小表；原来的「示例」文件夹和练习场去掉了。已有的文档库不受影响。
    - 写作和编辑：子文档回来了（「…」›「新建子文档」）；Windows 和 Linux 上从 Word、浏览器、飞书粘贴时也保留格式，Word 的列表变成项目或编号列表，Windows 上复制的内容贴进 Word 和浏览器保留格式（#144）；正文里有了右键菜单；选中的文字可以转成行内公式；可选在中英文之间自动加空格（设置 › 通用，已有文字用「编辑」›「整理本文空格」）；中文输入法打出的全角 ＃、－、＞ 等也能触发 Markdown 格式；拖动段落时周围的段落会让出位置；把图片拖到另一张图片的左右两侧会排成一行，图片工具栏可以复制图片；主题可以设置标题、粗体和斜体的颜色。
    - 整理和导入：可以导入思源笔记的工作空间、笔记本和 .sy.zip 导出；「从其他应用导入…」一处列出思源笔记、Obsidian、Typora 和 Markdown 文件夹。指向文件的相对链接可以点击打开，文件移动后链接自动更新。批量管理里可以勾选文件夹，连同其中内容一起创建副本、移动和删除，删除确认写明包括几篇文档；文件夹自己的菜单里也有「创建副本」。「窗口保持在最前」在「…」菜单里（macOS 和 Windows）。搜索结果打开时直接定位到匹配处。侧栏右键菜单可以在访达中显示文件。Markdown 附件在自己的窗口里打开。文档的「…」菜单里也有「在新窗口中打开」，新窗口的大小和侧栏开合跟随打开它的主窗口。
    - 更快：重命名、移动文件夹时立即显示新位置，文件在后台写入（以前几百篇的文件夹按回车要等 1.3–1.8 秒）；大文档库第一次打开时在后台读取，窗口先出来。
    - 文档库格式升级：打开文档库时会升级到新的格式（FORMAT 6），升级后 0.1.14 及更早的版本不能再打开它，会提示「这个文档库由更新版本的 Quiet.md 创建」。放在 iCloud 等同步文件夹里的文档库暂时不升级。外观、快捷键等设置改为每台电脑各存一份，升级时从文档库复制过来。
    - 修复：在 Markdown 页里选中文字时崩溃；Markdown 页里打的空行和空格被吞掉；中文里的弯引号用中文字体显示，Windows 按任意名称都能找到字体；移动或重命名文件夹后图片断开；Markdown 文档里 Obsidian 的 ![[图片]] 嵌入不显示；导入的文档保留原文件的创建和修改时间；只在 iCloud 里、还没下载的文件不再卡住启动和导入；Windows 上不再闪出控制台窗口；更新和字体下载使用系统代理；确认对话框里按 ↩ 执行按钮的操作；滚动大纲时页面不再跟着滚；Linux 默认界面字体改用系统的无衬线字体，中文不再落到衬线字体（#452）；Linux 上用 IBus 下的 Rime 等发送 GB2312 的输入法不再崩溃（#465）。其他 7 种界面语言补齐了翻译。
    English
    This update drops the separate Home page and groups the sidebar by top-level folders; databases are open to everyone; and it brings three writing modes (Focus, Typewriter and Paragraph Focus), zoom for the note's text alone, and the quiet command-line tool with an Agent Connector page. The whole interface now uses one set of components, and dark mode reads more clearly.
    - Folders are the top: there is no separate Home page. The sidebar groups top-level folders under headings that fold, and a heading's … menu holds Manage, Show in Finder and Remove from sidebar. A folder added with Add Folder is used in place, beside the default one. My documents and Files on this computer are gone from the sidebar: a Markdown file opened on its own is edited in a window of its own, and files listed under Files on this computer before are left where they are on disk; folders opened there before become top-level folders. Pages and folders can be dragged, or moved with Move To, into another top-level folder, taking their pictures, links and version history along, with undo.
    - Favorites fold into Pinned: starred pages become pinned, and the menus offer Pin alone (starred fonts stay as they are).
    - Header: a document's page reads + · Search · … at the top right, a folder's + · View · Search · …, with +, Search and … in the same places on every page. Settings and the Trash have Back at the top of their sidebar. Click a column head in a folder's list to sort by it, again to reverse; the sidebar follows the same sort.
    - Databases: now in every build. Make one from the New menu, the / menu or a CSV file; fields include text, single and multiple select, date, number, formula, lookup and link, and views can be filtered, sorted, grouped and coloured by rule, with a Fit to content row height. Each cell of a Notes column is a real note in the library, kept in a «Table · Notes» folder beside the table.
    - Writing modes, all in the document's … menu: Focus Mode (⌘., Ctrl+Shift+Enter on Windows and Linux, Esc to leave) leaves the document alone in its window; Typewriter Mode (⌘⇧T) keeps the line you write in the middle, through find, jumps and window resizes; Paragraph Focus (⌘⇧F) keeps the paragraph you write clear and fades the rest.
    - Text zoom: View › Zoom In / Zoom Out / Actual Size (⌘+ / ⌘− / ⌘0, Ctrl on Windows and Linux) change the size of the note's text only, headings, tables, code and equations with it; the sidebar and header stay as they are. Settings › Appearance › Text size takes a custom size beside its presets, and an Outline switch hides the heading outline beside the page.
    - Command line and agents: the new quiet tool lists, searches, reads and edits documents from a terminal, databases included, and is installed with the app. quiet folders add|remove adds and removes the sidebar's folders (a running app follows within seconds), quiet open DOC#BLOCK opens a document in the app at that block (a quietmd:// link that only opens things), and it can pin and duplicate too. Settings › Agent Connector gives the command that installs the skill (npx skills add s1dashu/quiet-md) and a prompt that has an agent such as Claude Code or Codex set itself up; on macOS, Install Command puts quiet in ~/.local/bin, and the Windows installer adds it to the PATH by default. quiet sends anonymous usage counts once a day (runs, failures and command names; never documents, titles or arguments); see Anonymous usage statistics below.
    - Anonymous usage statistics: the app and quiet each send anonymous counts once a day (how often the app was opened, each command ran and failed); never personal information, documents, titles, file names or arguments. Settings › General › Network and privacy › Anonymous usage statistics turns them off; until touched it follows the automatic update check. quiet telemetry off, DO_NOT_TRACK and QUIET_NO_TELEMETRY turn them off too. Settings › General now comes in four groups.
    - Dark mode: View › Toggle Dark Mode (⌃⌘D, Ctrl+Shift+D on Windows and Linux). Links, text colours, highlights, reminder dates, countdowns and button labels are readable in the dark, empty pages have dark illustrations, and the sidebar's glass follows the app's look, and its text and icons are brighter.
    - One set of components: menus, buttons, dialogs, switches, tooltips and scrollbars follow shadcn/ui. Menus that don't fit scroll, and moving toward a submenu no longer lights the rows you cross. Icons are Nucleo throughout; the board's toolbar, properties panel and help use the same components, with canvas, interactions and shortcuts unchanged. Corners on macOS are continuous.
    - Trash auto-delete: the Trash's header picks how long deleted pages wait: 1, 3, 7, 14 or 30 days, or a custom number; 30 days stays the default.
    - Shortcuts: a bin beside any shortcut clears it, which turns it off (its keys read Not set). Quick note from anywhere loses its separate switch; one turned off before has its keys cleared on upgrade. Each global shortcut registers on its own, and one that can't says why under its row.
    - New default folder: first launch has no welcome pages any more: it opens straight into Documents › Quiet Notes and its first Getting started guide; add other folders or bring notes from other apps from the File menu whenever you like. An existing Quiet.md library stays where it is, with its name. Renaming the default folder in the sidebar moves the library's location with it.
    - Getting started guides: a new library's guides are regrouped: besides Welcome, everything sits in folders, namely Documents, Markdown files, Boards, Databases and Everyday use (organizing, import and export, personalizing). Markdown files, Boards and Databases each come with a real example file (.md, .excalidraw, .sqlite); the example database has 20 records and fields of many types, and the database guide embeds a small one. The Examples folder and the Playground are gone. Existing libraries are not touched.
    - Writing and editing: child pages are back (… › New child page); pasting from Word, browsers or Feishu keeps formatting on Windows and Linux too, Word lists becoming bulleted or numbered lists, and copies on Windows paste into Word and browsers with their formatting (#144); the page has right-click menus; selected text turns into an inline equation; an optional space between Chinese and English while typing (Settings › General; Edit › Add Spaces Between Chinese and English for existing text); full-width ＃, －, ＞ and the like from a Chinese input method start Markdown formatting; dragged blocks open a slot as the blocks around make room; an image dropped on either side of another lines up beside it, and the image toolbar copies the image; themes can colour headings, bold and italic text.
    - Organize and import: import SiYuan workspaces, notebooks and .sy.zip exports; Import from Another App… lists SiYuan, Obsidian, Typora and Markdown folders in one place. Relative links to files open with a click and follow the file when it moves. Manage can check folders and duplicate, move or delete them with everything inside, the delete confirmation saying how many documents go along; a folder's own menu has Duplicate too. Keep Window on Top is in the … menu (macOS and Windows). A search hit in the body opens at the match. A sidebar row's menu shows the file in Finder. A Markdown attachment opens in a window of its own. The document's … menu has Open in New Window too, and the new window takes the size and the sidebar of the main window it was opened from.
    - Faster: renaming or moving a folder shows at once and the files follow in the background (Enter used to wait 1.3–1.8 s on a folder of a few hundred pages); a big library's first listing runs in the background, so the window comes up first.
    - Library format upgrade: opening a library moves it to a new layout (FORMAT 6). After that, 0.1.14 and earlier can't open it and say it was made by a newer Quiet.md. Libraries in a synced folder such as iCloud are not moved for now. Settings such as the look and shortcuts are now kept per computer, copied from the library on the first launch.
    - Fixed: a crash selecting text in a Markdown page; blank lines and spaces typed in a Markdown page were dropped; curly quotes in Chinese text use the Chinese face, and Windows finds fonts by any of their names; pictures broke after a folder was moved or renamed; Obsidian ![[picture]] embeds in Markdown documents didn't show; imported documents keep the files' created and modified times; files only in iCloud no longer hold up startup or imports; no console window flashes up on Windows; updates and font downloads use the system proxy; ↩ in a confirmation presses its button; scrolling the outline no longer scrolls the page; Linux uses the desktop's sans-serif as the default interface font, so Chinese no longer falls back to a serif face (#452); input methods that send GB2312, such as Rime through IBus, no longer crash the app on Linux (#465). The seven other interface languages are fully translated.
    Packages / 安装包
    - macOS: Apple Silicon and Intel DMGs, Developer ID signed and notarized; the ZIPs are still published for in-app updates and Homebrew.
    - Windows: x64 installer; unsigned, as in 0.1.14. It includes quiet.exe and, by default, adds it to your PATH.
    - Linux: experimental x86_64 AppImage (glibc 2.35 baseline); in-app updates are supported when running the AppImage. Run it with --cli, or through a link named quiet, for the command-line tool.
    Linux: chmod +x quiet-md-0.2.0-x86_64.AppImage, then run it. If FUSE is unavailable, run it with --appimage-extract-and-run.
    All packages include SHA-256 checksums and detached Minisign signatures, verified with packaging/update-key.pub.
