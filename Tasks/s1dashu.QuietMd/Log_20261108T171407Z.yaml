    Quiet.md 0.1.8
    中文
    这次更新带来 Markdown 文件原地编辑、多级文件夹和内存优化。
    - 直接编辑 Markdown 文件：打开本机 .md 文件并保存回原位置；文件出现在「本机文件」列表，从列表移除不会删除原文件。检测到外部修改时避免直接覆盖。
    - 导入和拖入文件：导入 Markdown 后仍保存为 .md；支持导入整个文件夹，在首页或文件夹中拖入文件。Markdown 页面只显示适合该格式的编辑功能，尽量保留未编辑部分的排版、空行、front matter 和换行格式。
    - 多级文件夹：创建、重命名和嵌套文件夹，通过拖动整理笔记；首页可以浏览文件夹，文件操作支持撤销。
    - 内存优化：限制图片和首页预览缓存，及时回收不再使用的图片与渲染资源，减少多个窗口之间重复保存的文档文本，保持原图清晰度。
    - 界面细节：统一下拉菜单样式，改善搜索弹窗；调整表格列宽后保持页面位置；移除 Windows 侧栏重复的首页按钮。
    - 首次启动语言：按系统语言优先顺序选择中文或英文，没有支持的语言时使用英文；保留用户手动选择的语言。
    - Linux 实验性支持：加入源码构建、桌面集成和 Linux CI 检查；具体可下载的安装包以本次发布附件为准。
    第一次使用 Markdown 文档或本机文件功能后，文档库会升级为新版格式，旧版 Quiet.md 无法再打开该文档库。
    English
    This update adds in-place Markdown editing, nested folders, and lower memory use.
    - Edit Markdown files in place: open a local .md file and save it back to its original location. Files appear under Local files; removing one from the list does not delete it. External changes are detected to avoid overwriting them.
    - Import and drag files in: imported Markdown stays .md. Import a folder or drop files onto Home or a folder. Markdown pages offer format-compatible editing, while preserving untouched formatting, blank lines, front matter, and line endings where possible.
    - Nested folders: create, rename, and nest folders; drag notes into folders, browse folders from Home, and undo file operations.
    - Lower memory use: bound image and Home preview caches, reclaim unused image and rendering resources, and share document text between caches and windows. Original image quality is preserved.
    - Interface refinements: consistent dropdown menus, a tidier search dialog, no page jumps after resizing table columns, and no duplicate Home button on Windows.
    - First-launch language: use the first supported language in your system preferences, Chinese or English, falling back to English. Manual language choices are preserved.
    - Experimental Linux support: source builds, desktop integration, and Linux CI checks. Available download formats will be listed with the release assets.
    Using Markdown documents or Local files upgrades the library format. Older Quiet.md versions cannot reopen that library.
    Merged changes: https://github.com/s1dashu/quiet-md/compare/v0.1.7...f21c1a6ef5666f2ba374794f2bde2812aae335dd
    Packages / 安装包
    - macOS: Apple Silicon and Intel ZIPs, Developer ID signed and notarized.
    - Windows: x64 installer, per-user installation; unsigned, as in 0.1.7.
    - Linux: experimental x86_64 AppImage built on Ubuntu 22.04 (glibc 2.35 baseline). A compatible graphics driver is required. Updates are manual; this is not a claim of validation on every distribution.
    Linux: chmod +x quiet-md-0.1.8-x86_64.AppImage, then run it. If FUSE is unavailable, run it with --appimage-extract-and-run.
    All packages include SHA-256 checksums and detached Minisign signatures, verified with packaging/update-key.pub from this repository.
    Validation
    Three-platform CI passed on the release source, including macOS Intel update validation under Rosetta. Both macOS packages passed Apple notarization and Gatekeeper assessment. The AppImage started on Omarchy/Wayland with an isolated library and initialized all 12 bundled guides; the Compose configuration mismatch found during packaging was fixed and rechecked. Windows installer packaging passed in CI; installation on a physical Windows machine has not been retested. Linux support remains experimental.
    Release preparation: https://github.com/s1dashu/quiet-md/pull/106
