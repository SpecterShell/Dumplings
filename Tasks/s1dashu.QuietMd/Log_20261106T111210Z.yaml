  Key: ReleaseNotes
  Value: |-
    Quiet.md 0.1.6 improves editing, tables, and Windows support.
    - Keep typing after clicking blank space or returning to a window. Returning to the app no longer re-parses every unchanged document.
    - Wide tables use the page margins, with a visible edge when clipped. Vertical scrolling no longer moves tables sideways, and clicking empty space inside a cell places the caret in that cell.
    - Continuous typing saves at least every two seconds. Block handles hide while typing; the toolbar’s More menu stays inside the window; documents without headings hide the outline button.
    - macOS global quick notes now default to Option+Space, avoiding the default Spotlight shortcut.
    - Windows supports pasting screenshots and copied image files, PDF export, and printing. Ctrl+Backspace deletes a word instead of the whole line.
    - Clearer update download progress and refreshed empty-state illustrations.
    macOS: signed and notarized Apple Silicon app (macOS 13+). Windows: x64 installer, unsigned (Windows 10 2004+). Existing notes stay in their current library.
