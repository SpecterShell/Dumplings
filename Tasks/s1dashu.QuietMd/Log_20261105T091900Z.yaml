- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Quiet.md v0.1.5 整理了一批用户反馈，并改用新名字 Quiet.md。
    - 改名：应用、菜单、安装包和内置指南统一显示为 Quiet.md。文档库位置和已有内容不变。
    - 批量管理：首页新增「批量管理」，可以一次选中多篇文档创建副本、移动或删除。
    - 回收站：可以一键清空（会先确认），行菜单的文字不再被截断。
    - 插入菜单：图标格支持方向键，←/→ 逐个移动，↑/↓ 按行移动（#4）。
    - 删除全部文档后保持空白，不再自动新建空文档。
    - 更新日志：从本版本起，应用内更新后会在侧栏底部显示一次这个版本的变化。
    - Windows：快捷键和内置指南显示为 Ctrl / Alt；启动失败时会弹出提示，并把日志写到 %LOCALAPPDATA%\quiet.md\logs\quiet-md.log；修复回收站「清空回收站」按钮无法点击。
    - 下载：GitHub 附件与 macOS CDN、Windows CDN 内容一致，均附 SHA-256 校验文件。0.1.4 可以直接在应用内更新。
    macOS 包面向 Apple Silicon，已通过 Developer ID 签名、Apple 公证及 Gatekeeper 验证。最低系统声明为 macOS 13，尚未在 macOS 13 实机验证。
    Windows 包面向 x64、Windows 10 2004 及以上，暂未代码签名；全局快捷键、PDF 导出和打印暂不支持。Intel Mac 暂无预编译安装包。
