  Key: ReleaseNotes
  Value: |-
    Krypton 0.22.1.3
    Krypton 0.22.1.3 runs on Chromium 158.0.8127.36 and updates the bundled uBlock Origin to 1.76.6.
    Settings and sidebar
    - Appearance settings use smaller buttons, dropdowns and switches. Descriptions align with their setting labels and have space around them.
    - The Settings navigation rail expands when you click its menu button. Appearance can switch directly to Workspace.
    - Show shadows lets you turn off shadows on Krypton's floating panels. Shadows are on by default. The floating sidebar shadow follows its rounded edge.
    - Sleeping tabs are dimmed by default. You can change this in Appearance.
    Voice and translation
    - The bundled speech runtime uses a matched set of Microsoft C++ runtime files. The voice-model installer checks those files before transferring a pack and reports more specific errors if a transfer fails.
    - Voice models and translation packs still download only when you choose to install them. Dictation and translation run on your device.
    Notes and Easel
    - Updated the editor dependencies used by Notes and Easel.
    Windows efficiency
    - Hidden renderers can use lower Windows scheduling, timer and memory priorities. Visible and protected activity keeps the priority it needs.
    - Energy Saver can reduce background activity and frame rates. Background update checks respect metered connections.
    Windows x64 downloads
