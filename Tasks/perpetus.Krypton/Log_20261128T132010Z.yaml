  Key: ReleaseNotes
  Value: |-
    Krypton 0.22.5.1
    Krypton 0.22.5.1 moves to the Helium 0.22.5.1 baseline and updates Chromium from 158.0.8127.36 to 158.0.8127.88.
    Keyboard shortcuts
    - Settings → Keyboard shortcuts lets you choose the keys for each browser command. (#1)
      - Search by command name or by key, then press the new shortcut. Esc cancels.
      - If the keys are already in use, Krypton names the command that uses them. You can replace that binding or pick other keys.
      - You can unassign a shortcut, reset one command, or reset all shortcuts to their defaults.
      - Shortcuts must include a modifier, and reserved combinations are rejected.
    - New shortcuts take effect right away in every window. Menus show the shortcut you set.
    Tabs
    - The tab right-click menu has a new Sleep tab command. Sleeping the active tab switches to the same tab that closing it would select.
    - Settings → Appearance has a new Middle-click on a pinned tab or Essential option. Choose Close tab (the default) or Put tab to sleep. Middle-clicking an ordinary tab always closes it.
    - When tabs are along the top:
      - Essentials, each folder and loose pinned tabs sit in their own rounded groups. A folder shows as its name and an arrow.
      - The active tab joins the toolbar or the page below it.
      - Essentials' icons and folder names keep their width; tabs share the remaining space.
      - When the window is maximized, you can click a tab at the very top edge of the screen.
      - A tab dragged to the boundary between two groups stays in its own group, so you can move it to either end.
    Appearance
    - Menus and pop-ups now follow Krypton's light or dark theme, even when Windows apps use the other mode. Before, a light Krypton theme with dark Windows apps showed dark menus with dark text. This covers context menus, the main menu, the command bar, permission prompts, the downloads and media lists, and the tab switcher. (#3)
    - The highlighted address bar suggestion is readable in the light theme. (#3)
    - Address bar suggestions no longer repeat "Search" after the search engine's name.
    Welcome screens
    - Fixed the welcome screens that appear on first run. (#5)
      - The card background covers its content and no longer flickers or cuts off.
      - You can drag the window and use its minimize, maximize and close buttons again.
      - Options in the data import and search engine steps line up correctly.
    Stability and security
    - Fixed a crash when a site asked for your location together with other permissions.
    - Fixed a crash when the bookmark pop-up opened before its toolbar button was ready. The bookmark, open-in-app and translate pop-ups fall back to the window when their button isn't available, and they no longer wait indefinitely for it.
    - Boost's element picker responds only to your own clicks and key presses. A page can't simulate them.
    - Notes and Easel open only their own document. Deleting, renaming, exporting or moving a capture to another easel needs a fresh click.
