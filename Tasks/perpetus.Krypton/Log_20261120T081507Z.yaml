  Key: ReleaseNotes
  Value: |-
    Krypton 0.22.1.2 upgrades to Chromium 158.0.8127.36 and bundles uBlock Origin 1.76.2. This release adds on-device language tools, profiles per Space, Live Folders, and new ways to capture and organize what’s on screen.
    Translation and voice
    - Page translation appears in the address bar on eligible foreign-language pages. Choose the source and target languages, return to the original, or set preferences for a language or site. Eligible pages can translate automatically once the required language pair is installed.
    - Voice typing puts dictated text into the command bar so you can edit it before submitting. Live Caption also uses an installed local voice model.
    - Settings → Languages shows installed packs and lets you download or remove them and select a dictation model. Downloads are optional and show their size before you confirm. Translation and speech recognition run on your device.
    Tabs, Spaces, and the sidebar
    - Profiles per Space lets you separate browsing history, cookies, and sign-ins. Multiple Spaces can share a profile. Folders and Live Folders are unavailable in Spaces hosted by another profile.
    - Live Folders can follow RSS or Atom feeds, GitHub pull requests, and GitHub issues. The sidebar shows refresh status and keeps cached results when a refresh fails.
    - Ctrl+Tab shows up to five tab previews. You can cycle through awake tabs only or include sleeping tabs. Sidebar context menus now group tab, folder, layout, and appearance actions into submenus.
    - Ctrl+T opens the expanded command bar for browser actions, open tabs, Spaces, history, bookmarks, and web search. Ctrl+L edits the current page’s address.
    Capture and workspace tools
    - Capture a page element, a selected area, the visible page, or the full page. Copy or download the image, or send it to Easel.
    - Notes is a local Markdown editor. Easel gives you a canvas for drawings, images, and screenshots. Both open in browser tabs and keep documents in their owning profile.
    - The address bar shows a zoom reset when you change the zoom level. Back and forward buttons dim when unavailable.
    Stability and updates
    Improved focus return after closing menus and the command bar. Fixed crashes involving cached tab previews and local translation, along with startup and shutdown issues in profile-linked Spaces. Updated Windows defaults for startup, page loading, graphics scheduling, and memory management. Liquid Glass is disabled.
    Existing Windows x64 installations can update through the signed updater. It can use the 170 MB delta when the matching 0.22.1.1 package is cached, or download the 347 MB full update. Requires Windows 10 version 1903 or later and an x64 CPU with AVX2 and x86-64-v3 support.
