    官网更新日志
    zh-CN
    新功能
    - Swarm 模式二阶段：委派是父代理按实际收益的判断（不再强制）；专家经 fleet roster 发现与孵化（action=roster、profile_query 过滤、profile= 选择）；契约每次孵化注入一次，每轮提示压缩到 ≤8 行候选，匹配与 envelope 注入全程硬化。
    修复
    - 可选行为遥测客户端移除，代码与随附隐私清单一致；遗留 ~/.pinvou3/behavior-telemetry.json 为惰性文件，可手动删除。
    - 代理从不回答的 ACP 会话不再挂起：不活动守卫提示（3 分钟）、请求取消（30 分钟）、本地结算（60 秒宽限），轮完成归属显式化，捆绑 claude-agent-acp 桥刷新到 0.79.0。
    - Linux 图片粘贴恢复（GTK 剪贴板回退，X11 与 Wayland，3 秒持有者超时）；其他平台不变。
    - Linux 依赖安装重试瞬时 apt 失败（最多 3 次）；被拒绝的授权仍立即失败；错误文案不变。
    - 交叉构建按 --target 而非构建主机平台选择 overlay。
    - 两条日志不再携带会话 id；多引擎空闲回收事件不再可按会话归属（已披露取舍）。
    en-US
    Features
    - Swarm mode phase 2: delegation is the parent agent's judgment by actual benefit (no longer mandated); experts are discovered and spawned through the fleet roster (action=roster, profile_query filter, profile= selection); the contract is injected once per spawn, per-turn hints shrink to ≤8 candidate lines, with matcher and envelope-injection hardening throughout.
    Fixes
    - The optional behavior telemetry client is removed; the code now matches the shipped privacy manifest. Any leftover ~/.pinvou3/behavior-telemetry.json is inert and can be deleted manually.
    - ACP sessions the agent never answers no longer hang: an inactivity guard notices (3 min), requests cancellation (30 min), and settles locally (60 s grace), with explicit turn-completion ownership and the bundled claude-agent-acp bridge refreshed to 0.79.0.
    - Image paste works again on Linux (GTK clipboard fallback, X11 and Wayland, 3-second owner timeout); other platforms unchanged.
    - Transient apt failures are retried (up to 3 attempts) during Linux dependency setup; dismissed authorizations still fail immediately; error text unchanged.
    - Cross builds pick platform overlays by --target instead of the builder host's platform.
    - Two log lines no longer carry session ids; multi-engine idle-reclaim events are no longer per-session attributable (disclosed trade-off).
