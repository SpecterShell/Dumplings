    修复
    - 手机远程控制全链路审计：工作区通道统一凭据路径黑名单、relay 双侧崩溃守卫、重放投毒修复、注册可自愈、文件夹授权可视化并可一键撤销。（#802）
    - 普通模式文件任务经 present_artifact 交付产物卡并校验；计划/代码模式指引跟随实际工具与权限；规则加载显式按目标路径逐目录搜索 AGENTS.md。（#799）
