    en-US
    New Features
    - The session-reader MCP server gains create_session: a model can start a new chat session with an audited requester claim, optional workspace/model/title/first message, safe retries, and a feature gate; unattended first turns carry an isolation shield. (#657)
    - Connecting a CLI connector (feishu/wecom/dingtalk/tmeet) now enables its skills immediately on both the store card and the CLI, with explicit user verdicts sticky across boots, reconnects, and apply-skills runs. (#741)
    - pinvou monitor surfaces vLLM queue depth plus structured diagnostics/notices; data-parallel server metrics are now fleet-summed. (#795)
    - Assistant replies gain a regenerate button on the newest turn, plus a one-click composer clear and voice-result abandon fixes. (#789)
    Fixes
    - End-to-end audit of the phone remote control stack: a credential path policy on all workspace lanes, relay crash guards on both send and receive, replay-poisoning fixes, recoverable registration, and a visible, revocable folder-consent control. (#802)
    - Ordinary-mode file tasks now finish with a verified artifact card via present_artifact; plan/code guidance follows the tools actually available; rule discovery explicitly searches AGENTS.md per directory toward the target. (#799)
    - Dead ACP runtimes are reclaimed with a per-session crash budget (immediate → 250 ms → paused ladder), plus tree-kill on installer failure, persist-before-publish stores, durable cancel journaling, and generation-stamped permission cards. (#786)
    - Subprocess output is captured into tempfiles with a 4 MiB per-stream bound, fixing empty-output-on-success from pipe-holding descendants and unbounded capture memory. (#784)
    - The relay survives single-frame and malformed-Host crashes, parses proxy IPs fail-closed, attributes the rightmost XFF entry, shuts down idempotently, and logs fixed-line errors only. (#781)
    - Monitor TTFT/TPS now consume the engine's authoritative TurnUsage timing, fixing overstated TTFT, understated TPS, and inflated multi-call turns. (#816)
    - The multiagent depth guard no longer falsely denies ordinary path fields in structured plan payloads; lark/wecom guidance gaps closed (bundle 0.36). (#815)
    - calamine 0.38 fixes RUSTSEC-2026-0436 (malformed .xls/.xlsb panic/OOM → errors); async-executor 1.14.1 fixes a use-after-free in the yanked 1.14.0. (#827, #824)
    - The bridge-fallback sanitize regex flags align to giu, closing a Unicode case-folding divergence with the main renderer. (#813)
    - Runtime <context_update> messages no longer render as user bubbles or leak into auto-generated titles. (#782)
    - Nested buttons inside role="button" rows are keyboard-usable again, and hover-only buttons show on focus. (#778)
    - The WeCom bot tool's "view official docs" button works again (allowlist + visible errors). (#779)
    Performance
    - The browser pane moved out of the main entry (desktop 503 kB → 485 kB) and the web entry was split (506 kB → 128 kB), with lazy-loading, prefetch, and error boundaries. (#787)
    Internal improvements
    - CodeWhale base consumes #114/#125: TUI streaming suffix reuse and a bounded-probe discovery/skill doctrine across seven model-visible surfaces. (#805)
    - Repo-wide comment audit (181 fixes) plus a BUNDLE_VERSION bump to 0.35 so installed DingTalk/Lark skill trees refresh. (#808)
    - Parity hygiene: internal referents scrubbed, README connector claims rewritten, new DingTalk smoke script and hardened WeCom counterpart. (#792)
    - Docs governance: tool-governance counts re-derived, Windows CI runbook regenerated, four recovery/architecture docs published. (#793)
    - Dead code/test sweep (two dead production chains, 30 duplicate tests); hash-verified connector asset pins; local-only ACP runtime memory sampling. (#807, #788, #790)
    - webpki-roots lock-graph guard, CI disk/zram hardening and runner-image fixes, loong64 policy suite on stock macOS, thirteen restored regression pins, postcss-selector-parser CVE fix, chainable panic hooks. (#783, #794, #811, #820, #819, #806, #791, #757, #800, #780)
