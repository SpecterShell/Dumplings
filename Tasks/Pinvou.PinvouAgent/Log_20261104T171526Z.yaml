    zh-CN
    新功能
    - 会话读取 MCP 服务器新增 create_session：模型可创建新聊天会话（必填审计来源、可选工作区/模型/标题/首回合消息），重试安全、受功能门控、无人值守首回合带隔离 shield。（#657）
    - 连接 CLI 连接器（飞书/企业微信/钉钉/tmeet）即默认启用其技能：商店卡片与 CLI 同步，显式关闭粘滞，物化失败补偿性撤销、无 fail-open 窗口。（#741）
    - pinvou monitor 暴露 vLLM 队列深度与结构化诊断/通知字段；数据并行服务器指标按 fleet 求和。（#795）
