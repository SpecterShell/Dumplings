    en-US
    Features
    - Auxiliary side chat: ask questions beside a running task in an independent tool-free session whose answers never enter the task's context or execution.
    - Headless agent run sessions persist into the GUI session store under their own retention budget; the per-turn tool-call cap is removed everywhere.
    - Built-in plugin framework with a read-only Built-in plugins page showing security level and data access.
    - The embedded browser is released on macOS, matching Windows and Linux.
    - Vanished project folders can be rebound with all bindings moved and partial failures retryable.
    - Provider presets refreshed (Mimo/Anthropic/xAI); local models default to the lowest thinking tier instead of off.
    - GPT catalog models ride the OpenAI Responses wire (tool calling works on gpt-6 models); the OpenAI preset default is now gpt-6-sol; a new openai_responses custom preset joins the lineup.
    - Plain sessions default to DenyAll: connectors and skill packs need explicit opt-in per session, with existing switch state migrated on read.
    - One-click copy button on conversation code blocks.
    Fixes
    - OpenCode gateways accept requests again (x-opencode-session affinity header with deterministic per-conversation ids).
    - Unknown Ollama models detect their real context window and stop looping on doomed emergency compaction.
    - Runtime downloads prefer China mirrors while keeping SHA-256 pin verification on every source, mirrors included.
    - A crashed bge-m3 install reconciles on launch instead of permanently disabling semantic search.
    - Stale legacy connector binaries no longer shadow pinned versions.
    - Auxiliary-chat request bodies match the engine wire (gateways that reject client-chosen temperature stop returning 400).
    - HTML artifact previews render on macOS.
    - Computer use is discoverable by the model, and its macOS screen/recording permissions surface clearly.
    - Model and search-provider keyring deletes run after the preference save commits, so a failed save can no longer destroy a credential.
    - Voice recordings are window-owned and stay attributed across async writeback and rollbacks; ASR/conversion subprocesses get bounded waits.
    - Connector and updater failures show localized zh/en/ja copy.
    - Shared marketplace state files serialize through OS file locks; unserializable writes are refused.
    - Model-facing prompt text corrected against enforced behavior; engine-side findings filed upstream.
