    官网更新日志
    zh-CN
    新功能
    - 任务辅助侧聊：任务运行旁挂独立无工具问答会话，回答不进入主任务上下文或执行。
    - 无头 agent run 会话默认持久化（独立保留预算，不再驱逐桌面历史）；逐轮工具调用上限移除。
    - 内建插件框架与只读内建插件页（安全级别、数据访问透明展示）。
    - 内嵌浏览器在 macOS 正式发布，与 Windows/Linux 对齐。
    - 消失的项目文件夹可重新绑定（全绑定迁移、部分失败可重试）。
    - 供应商预设刷新（Mimo/Anthropic/xAI）；本地模型默认最低思考档而非 off。
