    en-US
    New
    - app-automations scheduled-task CRUD tool family: the model can create, inspect, list, update (name/model/paused) and delete scheduled tasks by exact ID; an unambiguous delete executes directly while an uncertain target requires asking first; prompt/rrule replacement still goes through panel confirmation. (#628)
    - Scheduled messages into a session: a task delivers its body into an existing session at each fire; CLI/MCP expose kind and target; isolated-prefix targets are refused. (#629)
    Fixes
    - Installed MCP connectors whose key/token cannot be resolved stay disabled at startup until the credential is present (the note names the missing keys); reconfiguring from the store card re-enables them. (#740)
    - Headless agentic_ sessions join the isolated-origin set and are refused consistently across messaging, scheduled, session-reader and aux surfaces (case-insensitive). (#752)
    - Swarm running overlay status and type labels no longer flicker; waiting on the model round trip shows as "Working". (#773)
    - CodeWhale foundation: Windows Python stdio keeps its UTF-8 default through hook/task env overlays (fixes garbled Python output); tool failure flags are recorded into history; web JSONPath subset documented with a parser contract. (#750)
    Performance
    - Failure statistics skip display-only output cleanup: 2000-turn history projection, first-30 cumulative up to −51.8%. (#774)
    - Native shell notifications coalesced: frontend work with multiple background sessions −26.1% to −30.5%. (#753)
