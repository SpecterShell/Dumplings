  Key: ReleaseNotes
  Value: |-
    New Features
    - designfilt can now design IIR filters (Butterworth, Chebyshev Type I/II, elliptic) at fixed or minimum order, and the resulting digital filter objects support their full set of methods.
    - lowpass, highpass, bandpass and bandstop can filter a signal using a minimum-order FIR (Kaiser window) or IIR design.
    - filtfilt can now filter using second-order sections and digital filter (IIR) objects.
    - yulewalk designs IIR filters by the modified Yule-Walker method.
    - window, db, scaleFilterSections and hanning are now available.
    - thd, sfdr, toi, snr and sinad can measure harmonic distortion from a signal or from a power/PSD spectrum.
    - fillgaps fills missing samples using forward and backward autoregressive (Burg) models.
    - stftmag2sig reconstructs a signal from an STFT magnitude using the Griffin-Lim algorithm.
    - strips plots a long signal as a set of stacked strips.
    - spectralCrest, spectralEntropy, spectralFlatness, spectralKurtosis and spectralSkewness compute audio spectral descriptors.
    - modwt computes the maximal overlap discrete wavelet transform, with orthogonal wavelets, custom filters, boundary reflection, time alignment, and complex or matrix input.
    - modwpt computes the maximal overlap wavelet packet transform, with the full packet tree, time alignment, and complex or single-precision input.
    - Figures can now hold several independently positioned axes: axes, subplot and tiledlayout each create and lay out their own axes, and a new figure starts with no axes until something is plotted.
    Updates and Fixes
    - Multi-output assignment into comma-separated lists (such as [c{1:2}] = f(...) or [s.f] = f(...)) now assigns each output to its own element instead of giving every element the first output.
    - On/off graphics properties such as Visible, Box and the grid properties now behave like MATLAB's on/off switch values: they compare, convert and display correctly as text or logical, on their own, in arrays and inside cells.
    - A new figure's Visible property now correctly defaults to on.
    - An axes with nothing plotted now gets the same default limits as MATLAB.
    - strrep leaves an on/off switch property unchanged, matching MATLAB's warning.
    - exist now recognizes the newly added signal processing functions.
    - Fixed several existing signal functions to match MATLAB exactly: xcorr, xcov, rms, sinc, detrend, movmedian, movmad, isoutlier, filloutliers, smoothdata, islocalmax, paddata, trimdata, resize, freqspace and ss2tf.
