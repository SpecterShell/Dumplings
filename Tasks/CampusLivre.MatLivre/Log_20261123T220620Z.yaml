- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    New Features
    - The command window now shows warnings and the last warning message for things like division by zero.
    - Anonymous functions now display exactly as typed, keeping parentheses as written and numbers in their original form instead of a canonical format.
    - The command window now correctly displays integers, complex numbers, logical and character arrays, empty arrays, strings, cell arrays, structs and function handles, not just plain numeric matrices.
    - Axes created by plotting commands (plot, bar, histogram, and similar) now show their box outline in the command window the way MATLAB does, and the box command works to turn it on or off.
    - Legends are now listed and found as part of their figure, legend options (location, orientation) and custom labels now work, and scatter plots keep the point sizes you give them.
    - Added statistics and machine learning toolbox support, including descriptive statistics, probability distributions and fitting, hypothesis tests, cluster analysis, regression and linear/generalized linear models, principal component analysis, distance and nearest-neighbor functions, k-means clustering, classification (k-NN, naive Bayes, discriminant analysis), experimental design, bootstrapping, and many related functions and objects.
    Updates and Fixes
    - Plotting commands that replace the current axes' contents now correctly reset the box outline to their own default, even on existing axes, matching MATLAB's behaviour with hold.
    - Graphics object displays now end with the correct link or text depending on whether the output is being captured or shown directly.
    - Fixed the Z-axis grid line setting so plots that only turn on the Y-axis grid no longer also affect the X and Z grids.
