- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    What's Changed
    New Features
    - test(mcp): cover the MCP lifecycle end to end — oauth renewal, live provider acceptance, no-auth server lifecycle check by @josemonteiro in https://github.com/getkimchi/kimchi/pull/1569
    - feat(permissions): auto-allow document-skill CLIs via kimchi doc-cli subcommand by @josemonteiro in https://github.com/getkimchi/kimchi/pull/1591
    - feat(skills): deterministic auto-load of skills on declared prompt triggers by @josemonteiro in https://github.com/getkimchi/kimchi/pull/1592
    - feat(documents): keep binary documents out of the model context by @josemonteiro in https://github.com/getkimchi/kimchi/pull/1605
    - feat(redaction): govern PII redaction via the resources system by @josemonteiro in https://github.com/getkimchi/kimchi/pull/1599
    - feat(guardrails): handle refused turns by @mszostok in https://github.com/getkimchi/kimchi/pull/1613
    - feat(side-chat): slash-command hints in the side editor by @mszostok in https://github.com/getkimchi/kimchi/pull/1614
    Bug Fixes
    - fix(side-chat): keep the pill off the side pane and hide the focus hint without kitty keys by @mszostok in https://github.com/getkimchi/kimchi/pull/1608
    - fix(side-chat): never strand a permission ask unfocused by the side chat by @mszostok in https://github.com/getkimchi/kimchi/pull/1609
    - fix: retry ledger store open on SQLITE_BUSY; isolate unit tests from agent env by @josemonteiro in https://github.com/getkimchi/kimchi/pull/1607
    - chore(bridge): bundle kimchi-bridge v0.1.0-rc.20 by @mikenorgate in https://github.com/getkimchi/kimchi/pull/1612
    - fix(pr-costs): keep each commit with its first PR, split multi-PR works by time, and fix three ways reporting stopped by @tautvydasLiekis in https://github.com/getkimchi/kimchi/pull/1539
    - fix(pr-costs): unstick the legacy snapshot queue (413 halving, bounded frozen queue, journal note recovery) by @josemonteiro in https://github.com/getkimchi/kimchi/pull/1610
    - chore(bridge): bundle kimchi-bridge v0.1.0-rc.22 by @mikenorgate in https://github.com/getkimchi/kimchi/pull/1620
    Other Changes
    - refactor(endpoints): call the API origin directly, not the console proxy by @mikenorgate in https://github.com/getkimchi/kimchi/pull/1590
    - perf: read .git/HEAD directly; share one whole-type ledger read per pass by @josemonteiro in https://github.com/getkimchi/kimchi/pull/1611
    Full Changelog: https://github.com/getkimchi/kimchi/compare/v1.25.1...v1.26.0
