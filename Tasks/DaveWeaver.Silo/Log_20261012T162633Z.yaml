  Key: ReleaseNotes
  Value: |-
    This is the first public release since v0.72.0. It also includes everything from v0.72.1, v0.72.2, and v0.72.3, whose builds were never published. All of those changes are listed below.
    0.73.0 (2026-10-09)
    Features
    - agents-chat-panel: show delegated subagent work in the transcript (#608) (5b42f3f)
    - agents: add AgentInfo.idleSince, a durable "when did this stop" stamp (#603) (569bb6b)
    - agents: route delegated subagent updates by sessionId (RFC 0057) (#610) (980e0cd)
    - agents: show backgrounded shells in the transcript (RFC 0058) (#613) (6b22c56)
    - workspaces: keep the open-workspace menu open after deleting a workspace (#606) (a2106c5)
    Bug Fixes
    - agents-chat-panel: return focus to composer after a config pick (#607) (79a274d)
    - agents: track turns the agent starts on its own (#598) (f0a98a0)
    - extension-host: make the close-workspace dialog dismissible (#612) (8521059)
    - test: survive Node 26's built-in localStorage global (#604) (08a6fd2)
    0.72.3 (2026-10-05)
    Bug Fixes
    - macos: drop the comment from Entitlements.plist so codesign parses it (#596) (2854551)
    0.72.2 (2026-10-05)
    Bug Fixes
    - macos: entitle Silo for microphone, camera, and Apple Events (#593) (d880948)
    0.72.1 (2026-10-03)
    Bug Fixes
    - agents-chat-panel: break a tool-call group on a failed call (#590) (6b10639)
    - agents-chat-panel: make Home/End move the composer caret (#588) (a2a8fbd)
    - agents-chat-panel: persist composer draft across restarts (#592) (1a06a7f)
