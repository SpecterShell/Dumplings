  Key: ReleaseNotes
  Value: |-
    This is the first public release since v0.73.0. It also includes everything from v0.74.0, v0.75.0, and v0.76.0, whose builds were never published. All of those changes are listed below.
    0.77.0 (2026-10-18)
    Features
    - sidedock: show the Silo wordmark at the head of the left dock's tabs (#641) (539e955)
    Bug Fixes
    - dock: let an inactive tab's title use the full tab width (#639) (267e638)
    0.76.0 (2026-10-17)
    Features
    - dock: make the tab highlight an inset chip, lighter on the active tab (#637) (ca9df2f)
    - dock: tab-highlight veil, an "info" color, and a reliable panel workspace id (#635) (e4c09d3)
    - sdk: panel/editor focus, active-panel state, and the split toolbar control (#633) (74f5219)
    Bug Fixes
    - agents-chat-panel: don't let a blank thought chunk break a tool-call group (#631) (983f0ab)
    - agents: show the waiting glyph for a blocked agent parked in Ready (#629) (c09bc62)
    0.75.0 (2026-10-14)
    Features
    - agents: parse an elicitation schema into questions and answers (#625) (3ffd36d)
    - agents: surface an agent's questions on ctx.agents.sessions (#626) (cd33a44)
    Bug Fixes
    - agents: generalize the blocked tab tooltip to any user answer (#621) (1d004c1)
    0.74.0 (2026-10-14)
    Features
    - agents-chat-panel: make the composer control row responsive (#616) (809346b)
    Bug Fixes
    - acp: kill an agent's whole process group, not just its own pid (#620) (6b98d69)
