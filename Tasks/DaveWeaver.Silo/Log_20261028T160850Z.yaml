  Key: ReleaseNotes
  Value: |-
    This is the first public release since v0.77.0. It also includes everything from v0.78.0, v0.78.1 and v0.78.2, whose builds were never published. All of those changes are listed below.
    0.79.0 (2026-10-27)
    Features
    - agents-chat-panel: add a Prompt Rail for jumping back to an earlier prompt (#659) (6e172ca)
    0.78.2 (2026-10-26)
    Bug Fixes
    - agents: follow the mode a plan approval leaves the session in (#656) (e66f89b)
    0.78.1 (2026-10-22)
    Bug Fixes
    - agents-chat-panel: make Clear actually reset the tab title (#651) (f543aae)
    - agents: reap agent processes on window reload and workspace close (#655) (922cc8c)
    - panels: keep a hovered tab's close button off its indicator glyph (#652) (e03a8bc)
    Performance Improvements
    - repo: scope the pre-commit test gate to the packages a commit touches (#654) (e89cdfa)
    0.78.0 (2026-10-20)
    Features
    - agents-chat-panel: give a fenced code block a gutter with wrap and copy (#649) (5d0615a)
    - agents-chat-panel: put the question card in tabs and show what you answered (#647) (e7e8c42)
    Bug Fixes
    - agents-chat-panel: let the profile pill use the room the composer has (#650) (0e523a6)
    - agents: end a chat turn whose end frame carries no origin marker (#648) (7baf054)
    - agents: keep an unanswered question on the record across a reload (#643) (5501bb6), closes #642
