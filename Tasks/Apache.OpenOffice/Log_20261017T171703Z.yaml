Locale:
- Key: ReleaseNotesUrl
  Value: https://cwiki.apache.org/confluence/display/OOOUSERS/AOO+4.1.17+Release+Notes
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Apache OpenOffice 4.1.17 is a Security and Bugfix Release, incorporating other bug fixes and little enhancements. All users of Apache OpenOffice 4.1.16 or earlier are advised to upgrade. You can download Apache OpenOffice 4.1.17 here. Windows 10 and 11 users will soon be able to get Apache OpenOffice for selected languages in the "Microsoft Store" App.
    Please review these Release Notes to learn what is new in this version, as well as important remarks concerning known issues and their workarounds.
    Only use the original website "https://www.openoffice.org/download/" to download. The installed software can be verified with the About box (see menu "Help - About OpenOffice") by comparing the numbers with the reference data on the download webpage (see the text in the light green box). For Apache OpenOffice 4.1.17 it has to be "AOO4117m2 | Build ID 9818 | Rev. 49c05bc6fd".
ReleaseTime: 2026-10-14
