  Value: |-
    v1.0.9
    修复
    - Windows 运行期间黑窗反复闪现：修复状态栏每 15 秒检测 Cursor 存活时弹出命令行窗口的问题；代理修复和重启等待中的同一检测也改为后台静默执行。
