- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Uses electron 42.9.3
    - Signs the bundled Electron DLLs on Windows, so Windows Defender ASR ransomware protection no longer blocks the app after installs and updates [jgraph/drawio-desktop#2509]
    - Builds the Windows no-installer zip with the full signed and fused configuration [jgraph/drawio-desktop#2509]
    - Stops the update download window staying on top of other applications and covering the install prompt [jgraph/drawio-desktop#2516]
    - Stops repeated manual update checks producing duplicate update dialogs
    - Fixes opening multi-page PDFs exported by releases before 30.3.6, where the diagram is embedded as a PDF file attachment
    - Updates to draw.io core 31.3.1.
