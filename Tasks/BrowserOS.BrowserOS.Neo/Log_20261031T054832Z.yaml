  Key: ReleaseNotes
  Value: |-
    ✨ What's new
    - See what every agent is doing. The refreshed cockpit shows live task previews, each task's open tabs, and a quick way to jump to the page you need. Quiet tasks now show as idle.
    - Replay tasks at full size. Open a recording full screen with its steps alongside it. Press F to open the replay and Esc to return.
    - Find and reuse your skills. Saved skills now appear as cards with site icons, clearer names, and token savings.
    - Native page reading. Agents can read pages and take snapshots through the browser's native tools. Running JavaScript is an explicit action through evaluate_in_page.
    Custom MCP integrations: the old evaluate tool is now evaluate_in_page. Refresh your agent's tool list and update any scripts that call the old name.
    Built on Chromium 155.0.8059.26. Available for macOS, Windows, and Linux.
