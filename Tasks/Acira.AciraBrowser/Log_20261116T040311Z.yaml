  Key: ReleaseNotes
  Value: |-
    What's new
    - Coming back to Acira from another app always gives the keyboard back to the page you were on. Before, after a lot of switching between windows, your keys could go nowhere until you clicked.
    - The camera, microphone and screen-sharing pill goes away the moment a site stops using them, such as when a WhatsApp Web voice message ends. It no longer stays until you reload.
    - An extension's side panel, such as Claude's, opens every time you press its button, its shortcut opens and closes it, and a panel opened on one tab stays with that tab.
    - Sites load faster: Acira no longer pauses for a moment while it saves your website sign-ins to disk.
    - A tab keeps its site icon and glow when you move to another page of the same site, such as from m.twitch.tv to twitch.tv.
    - The site colour glow fades smoothly even when you switch tabs quickly, instead of jumping.
    - Each extension has an "Allow access to file URLs" switch on its card, off by default as in Chrome. With it on, the PDF Viewer extension opens PDFs from your computer.
    - Taking a tab out of a folder is easy: drop it below the folder's last tab or above the folder and it lands there, with the line showing exactly where it goes.
    - "Favorites' tabs in the tab list" is now off by default. If you turned it on, it stays on. A Favorite's open tab still counts as a tab, and Ctrl+1 to 9 and Next tab reach it.
    - Ctrl+Tab steps through your tabs in the right order when you press it quickly.
    - With the sidebar on the right at 150 %, the toolbar's buttons no longer slide over the » menu while the sidebar opens or closes.
    - When you pick a tab far down the sidebar list, the list scrolls to it without the current-tab pill and the Bookmarks row popping in and cutting off the bottom rows.
    - Your mouse's back and forward buttons go back or forward one page per click. On Linux a click no longer goes back two pages, and on Windows some mice no longer close Acira.
    - Typing a file:/// address, such as a PDF on your computer, into the address bar or the New Tab page and pressing Enter opens it.
    - Pages load a little faster: answering cookie banners no longer makes every page redo its layout once while it loads.
    - Acira uses less graphics memory after a site's colour has shown, because the site glow no longer keeps idle layers in memory.
    - A video in full screen, such as YouTube's, can no longer leave Acira without its sidebar and toolbar: taking the window out of full screen gives them back, Esc no longer pulls the window back into full screen, and Acira can always be closed.
    - Over the sidebar, your mouse's back and forward buttons and a two-finger sideways swipe (Mac) move to the previous or next workspace. With a single workspace, the buttons go back and forward in the tab as usual.
    AciraBrowserSetup.exe is the installer; installed copies of Acira update themselves from it. SHA-256 checksums are in SHA256SUMS.txt.
