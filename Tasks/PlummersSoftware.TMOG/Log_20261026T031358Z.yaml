  Key: ReleaseNotes
  Value: |-
    - Accessibility on all three platforms: a Text size setting from 100% to 200%, support for the system's high contrast mode, and screen reader and keyboard access to meters, graphs and controls.
    - New settings for network rates in bytes or bits per second, Red and Purple display tints, and turning off process row highlights.
    - Go to details finds the process and says when a filter hides it, and Processes and Performance remember their sort order and selected device.
    - On Windows and Linux, Installed Apps (Pro) can uninstall apps, Disk Space (Pro) keeps a history of finished scans, and table columns can be hidden and resized.
    - Windows: one disk per physical drive, a Close to notification area setting, a System Pressure tile, a File activity window, a rebuilt Drivers page (Pro), and smoother graphs.
    - Linux: Intel GPU readings, Wi-Fi and memory details, SMART health, and support for systems without systemd.
    - macOS: graphs keep animating while TMOG is visible but another app is active, and the menu bar SSD Space meter shows the startup disk's free space.
    - Windows and Linux stop drawing while TMOG cannot be seen, and use less CPU while it can.
    - Clearer license activation errors, and fixes to readings, crashes and translations on all three platforms.
