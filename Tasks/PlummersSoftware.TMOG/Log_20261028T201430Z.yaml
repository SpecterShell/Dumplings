  Key: ReleaseNotes
  Value: |-
    Windows and Linux only; the macOS download remains 1.1 (1.1.0).
    - Windows: choices in the Settings page's drop-down menus, such as language, temperature unit, text size and update speed, are kept again, instead of going back to the previous value as soon as another control is clicked.
    - Windows: updating from inside TMOG works again. Earlier versions stopped with "The update's signature or publisher could not be verified" instead of installing the update; when an update cannot be installed, the message now says which check failed.
    - Linux: every locked Pro page has an Enter License Key button, so a license can be activated on desktops that move the menu bar out of the window, such as KDE Plasma with its Global Menu.
