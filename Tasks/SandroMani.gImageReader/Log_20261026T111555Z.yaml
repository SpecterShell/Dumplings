  Key: ReleaseNotes
  Value: |-
    - Bugfixes
    - [Qt] Fix spelling dictionary download not downloading all variants of the dictionary
    - Fix hOCR ppageno which should be zero-based
    - [Gtk,Qt] Fail the scan when the requested ADF source is not available
    - [Gtk] Insert recognized text at the cursor when nothing is selected
    - [Qt] Fix rendering images in hOCR exports
    - Enhancements:
    - Implement screenshot capturing on Wayland
    - Handle hOcr item classes separator and photo
    - Upgrade to libxml++-5.0
    - Use GtkSourceView directly instead of obsolete GtkSourceViewmm
    - [Gtk,Qt] Add feedback in the statusbar if user should draw a rectangle
    - Updated translations
