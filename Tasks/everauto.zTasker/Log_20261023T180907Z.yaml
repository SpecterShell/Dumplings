  Key: ReleaseNotes
  Value: |-
    新增：
    提醒窗口增加隐藏关闭按钮和任务栏图标设置

    改进：
    改善了稳定性
    简单任务->网络->搜索文本->“打开输入框输入文本”，热键运行时，现在可以直接输入文本搜索了，不再需要鼠标点击获取焦点
    简单任务->系统->注册表修改，写入字符串时，现在可以输入空值，不再强制输入数据
    绿色版升级时，不再不再在系统控制面板->程序中注册卸载项

    修复：
    修复了几个日志系统带来的崩溃问题
    Python 执行前台，参数不生效问题
    任务->文件，Excel 读取，当 Excel 文件路径具有中文时，读取失败问题
    挡屏休息，密码退出功能，输入正确密码，按按回车键无法正确关闭的问题
ReleaseTime: 2026-10-24
