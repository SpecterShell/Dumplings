  Value: |-
    New Features
    Extension policies
    Organization administrators can now manage which Chrome Web Store extensions are available directly within NordLayer Browser. This means your browser environment comes ready to go, with the right tools in place and unnecessary or risky extensions kept out.
    When you open NordLayer Browser, the extensions your administrator has approved for your team are already available for you to use. This removes the friction of setting up your workspace, allowing you to focus on the tasks at hand.
