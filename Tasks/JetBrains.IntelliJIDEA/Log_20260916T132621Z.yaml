  Value: |-
    IntelliJ IDEA 2026.2.3 is out with the following improvements:
    - When opening a recent project, the Maven tool window is now populated with the corresponding data. [IDEA-391792]
    - Several causes of IDE freezes have been resolved. [IJPL-235455], [IJPL-252292]
    - The vertical scrollbar is once again displayed correctly in the Markdown preview pane. [IJPL-251259]
    Get more details in our blog post.
