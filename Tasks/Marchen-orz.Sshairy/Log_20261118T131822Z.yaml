- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    本版本新增应用内更新，并修复文件面板闪烁与终端提示符识别，按模块整理如下：
    设置与更新
    - 更新弹窗可直接下载适配当前平台与构建的安装包（安装程序或便携版），显示进度，Release 附带 SHA256SUMS 时自动校验，完成后确认即正常退出并交给系统安装（a60f478）
    - 更新日志按界面语言显示，并以紧凑的 Markdown 渲染（210bf4c、7d496c2）
    终端
    - 识别带 conda / venv 前缀（如 (env) ）的提示符，在虚拟环境中命令补全同样可用（23d7f17）
    文件
    - 终端命令执行后，文件面板在后台静默重读目录：不再显示加载条，内容没变不重绘，cd 进入新目录同样如此，不再每条命令闪烁（500c7cc）
    This release adds in-app updates and fixes the files panel flicker and terminal prompt recognition, grouped by area below:
    Settings & Updates
    - The update dialog can download the package that fits this platform and build (installer or portable), shows progress, verifies SHA256SUMS when the release ships one, and after you confirm, the app exits normally and hands the file to the OS to install (a60f478)
    - Release notes now follow the app's language and are rendered as compact Markdown (210bf4c, 7d496c2)
    Terminal
    - Prompts behind a conda or venv prefix such as (env) are now recognised, so command completion works inside virtual environments too (23d7f17)
    Files
    - After a terminal command, the files panel re-reads the directory quietly in the background: no progress bar, no redraw when nothing changed, including after a cd, so it no longer flickers on every command (500c7cc)
