  Key: ReleaseNotes
  Value: |-
    Gopeed 2.0.0 is here! After more than eight months of development and testing, we merged 132 PRs, with 33 contributors and roughly 160,000 lines of code changes.
    - 🎨 Redesigned UI — A more modern look, a cleaner layout, and easier access to everyday actions.
    - 🪟 Desktop multi-window support — Create tasks in a separate window or open a progress window for an individual download.
    - ⬇️ More download protocol support — Added FTP and HLS (M3U8) downloads.
    - 🧩 Enhanced extension engine — WebView supports isolated sessions and proxies. Built-in FFmpeg can merge audio and video directly.
    - 📋 Better task management — Task groups and automatic folder categorization make batch downloads easier to organize.
    - 🤖 AI integration — Connect an AI assistant through MCP to create, check, and manage downloads in natural language.
    - 🛠️ Bug fixes and stability — Fixed many bugs and improved HTTP and BitTorrent download stability.
    Thank you to everyone in the community who helped develop, test, or share feedback. Upgrade now and try Gopeed 2.0.0!
