- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Gopeed 2.0.0 正式发布！历经 8 个多月的开发和测试，共合入 132 个 PR，由 33 位贡献者共同完成，涉及近 16 万行代码改动。
    - 🎨 全新 UI — 更现代的视觉设计，布局更清爽，好看也更顺手。
    - 🪟 桌面多窗口 — 支持在独立窗口新建任务，也能为单个下载弹出进度窗。
    - ⬇️ 更多下载协议支持 — 新增 FTP 和 HLS（M3U8）下载。
    - 🧩 扩展引擎增强 — WebView 支持独立会话和代理，内置 FFmpeg，可直接合并音视频。
    - 📋 任务管理升级 — 新增任务组和自动目录分类，批量下载更容易整理。
    - 🤖 AI 集成 — 通过 MCP 接入 AI 助手，用自然语言创建、查询和管理下载任务。
    - 🛠️ Bug 修复与稳定性 — 修复了大量 Bug，提升了 HTTP 和 BitTorrent 下载的稳定性。
    感谢每一位参与开发、测试和反馈的社区用户，赶紧升级体验吧！
