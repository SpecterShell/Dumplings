  Value: |-
    v0.2.0
    DeepSeek Harness 桌面端首个完整版本。
    功能
    - 全自绘无缝标题栏：标题栏与侧边栏同色成 L 形，内容区为圆角浮起卡片
    - 菜单直接嵌进标题栏，左上角收起侧边栏，右上角自绘最小化/最大化/关闭
    - DeepSeek 鲸鱼应用图标（多尺寸 ICO）
    - 服务自动启动（缺失时自动 npm 安装），退出只清理自己启动的服务
    - 窗口状态记忆、托盘 + 最小化到托盘、端口冲突自动换端口
    - 启动页/窗口主题自适应、菜单本地化（中/英）、日志查看器
    - 安装包自动检测并安装 DeepSeek Harness 依赖
    优化
    - 自动更新（electron-updater）
    - 安装包瘦身、优雅退出、安全加固、卸载清理、首启引导与通知
    - macOS/Linux 打包配置（待实测）
