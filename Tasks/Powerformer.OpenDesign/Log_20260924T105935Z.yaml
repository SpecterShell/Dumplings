  Value: |-
    ✨ World’s First Design Plan: Affordable models for everyone
    Generous monthly allowance. Explore and refine your designs with DeepSeek V4.1 Flash, GLM-5.3 Flash and MiMo 2.6 Flash. Get started with Go for $8 for your first month, or choose Plus or above for up to $200 in bonus credits.
    API access across your workflow. All personal subscription tiers support API calls. Use your OpenDesign API key with Codex, Claude Code, DSH, OpenCode, Hermes and other AI agents.
    Free credits for new users. Every new user receives approximately $0.50 in free credits to try OpenDesign.
    🐛 Fixed
    🧠 Agents, runtimes and diagnostics
    - A cleanly finished run stays visibly finished. A task-level block no longer turns a clean agent exit into a misleading failed-run card; real crashes and failed exits still remain failures. (#8350) Thanks @itscheems.
    - Support bundles retain the clues that matter. Diagnostics now carry daemon health evidence for memory pressure, SQLite growth and unclean exits, whether you export from the app or with od diagnostics export. (#8354) Thanks @PerishCode.
    - Failure evidence can be collected before the trail goes cold. With existing consent enabled, detected Agent and delivery failures queue bounded, redacted diagnostics automatically; opting out stops collection. (#8357) Thanks @Siri-Ray.
    - OD Next sandboxed runs clean up after themselves. The run input access root remains writable for sandbox teardown instead of leaving a run stranded on cleanup. (#8024) Thanks @arqueon.
    - Fatal MCP failures say what happened. An MCP stdio process now writes its fatal error before it exits, so the client has a usable diagnostic instead of a silent disappearance. (#7340) Thanks @lorenzozanee.
    🖥️ Desktop and presentation
    - Updating the desktop app no longer races its own shutdown. Renderer traffic is stopped before the packaged runtime retires, making the restart handoff safer. (#8348) Thanks @PerishCode.
    - The fullscreen exit button belongs to the theme you chose. Its colors, hover state and keyboard focus now remain readable in both light and dark presentations. (#7272) Thanks @dennytosp.
    - A macOS MCP session can become a desktop window in place. Opening the app after its headless runtime started now reveals the normal window without losing the local session. (#8398) Thanks @PerishCode.
    🏠 Home and campaigns
    - The task-type menu stays open when you ask for it. A click immediately after Home chooses a type no longer opens the picker only for it to snap shut. (#8386) Thanks @Siri-Ray.
    - A valid campaign remains present through ordinary interruptions. Network changes, short sleeps and tab switches no longer unnecessarily remove an active campaign; cached content follows its known server schedule while offline. (#8292) Thanks @alchemistklk.
