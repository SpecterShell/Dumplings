Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    New
    - Sval now runs on Intel Macs.
    - Colorshift changes a site's colors, theme and font, and syncs to your other devices. Choose Colorshift This Site… in the site settings menu, or right-click the tab.
    - Workspaces can now be shown in a row above your tabs. Go to Settings › Workspaces › Workspace switcher and choose Strip for this new experience.
    - Swipe sideways over the Workspace panel to switch Workspaces.
    - Hovering or focusing over a tab now shows a preview of its page. You can turn previews off in Settings › Appearance.
    - Ctrl+Tab now launches a visual recent tab switcher in your Workspace. Use Ctrl+` and Ctrl+Tab to navigate back and forwards, respectively.
    - Search with one engine by typing its keyword first, like `@yt cats`. Type `@` to see them all.
    - A playing video now moves to Picture-in-Picture when you switch tabs. You can turn this off in Settings › General.
    - Your Sval Card shows how long you've used Sval, and keeps your Arc card when you import from Arc. Choose View › Your Sval Card.
    - A hidden Workspace panel now slides in when you hold the pointer at its edge of the window.

    Fixed
    - Switching to a Workspace with many tabs is now much faster.
    - On macOS and Linux, Sval now puts tabs to sleep when your computer runs low on memory.

    Security
    - Sval includes the security fixes from Firefox 153.7.0 ESR.
ReleaseTime: 2026-11-11T00:00:00.0000000
