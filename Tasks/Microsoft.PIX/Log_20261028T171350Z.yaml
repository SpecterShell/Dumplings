    VS Output: new options
    The screen-space VS Output view now overlays the scissor rectangle and viewport, with a legend explaining the displayed bounds. This makes clipping problems easier to diagnose without comparing coordinates manually.
    The Relative To option switches between viewport-relative and render-target-relative positioning. Zoom to mesh frames the geometry’s bounding box in screen space.

    Dr. PIX Tight Resource Alignment experiment
    The Tight Resource Alignment experiment, available in the June preview, now joins the main release. Run it from Dr. PIX to estimate how much memory your placed resources could save by using D3D12_RESOURCE_FLAG_USE_TIGHT_ALIGNMENT.
    The experiment compares the original resource layout with a tighter layout, including a compaction step that tries to reduce gaps between resources. Results include:
    - Per-heap estimated savings in bytes and percentages.
    - Original and tightly aligned resource extents.
    - Detailed resource offsets and allocation requirements.
    - Padding within allocations and between resources.
    - Warnings for heap overallocation or aliased resources.
    The experiment requires an analysis device that supports tight resource alignment. Aliasing can affect the accuracy of the estimates.
