    Timing Captures
    Understand scheduling on heterogeneous CPUs
    The heterogeneous-core timeline introduced in the June preview is now part of the main release. CPU lanes and thread activity distinguish core performance classes.
    Core lane headers show a lightning-bolt indicator with the core’s efficiency class: class 0 represents efficiency cores, while higher values indicate higher-performance classes. Thread activity uses different colors for time on performance and efficiency cores. Hover over the activity graph for a breakdown of those fractions alongside stalled time.
    Use these indicators to spot critical work scheduled on efficiency cores or background work occupying performance cores.
    Since the preview, Range Details and Range Summary have also gained core-class analysis for PIX events and CPU samples in a selected range.

    This information comes from the captured machine, including when converting an ETL offline. Older captures without the required topology records cannot display it retroactively.
    Compare CPU execution with normalized measurements
    New experimental normalized CPU measurements help investigate changes in scheduling, boost, and throttling. They estimate execution relative to a reference core’s nominal performance rather than assuming that every millisecond of scheduled CPU time delivers the same capacity.
    When a capture contains the required counters, normalized metrics and Range Summary values are discovered automatically. An experimental, default-off option adds more detail to Event Details:
    - Normalized execution.
    - Normalized performance ratio.
    - Delivered Performance coverage.
    Core-placement percentages remain separate. Their tooltips now explain how child events and unknown cores affect the totals.

    These are model-based estimates, not exact predictions of how the same workload would execute on another processor. Heterogeneous support currently uses the Windows performance model for AMD and Intel CPUs; heterogeneous ARM and other vendor models are unavailable. Results require adequate measured coverage and are shown as unavailable when the data is insufficient, not as zero work.
    Range Summary improvements
    Range Summary now works more like Range Details, with separate Items and Summary results. Use Summary to group and aggregate results, then inspect the contributing work in Items.
    New controls include:
    - Text and regular-expression filtering alongside structured filters.
    - Separate column choices for Items and Summary.
    - Inclusive and exclusive percentages.
    - Expansion of hot regions using the selected ranking metric.
    - A Default action that restores the shipped grouping and display configuration.
    - Customize mode for editing how data is aggregated. Turn it off to hide the editing controls.
    - Summary columns can be edited, and the same column can be used for multiple summary types.
    - Percentage-of-parent aggregation shows how time is divided among child nodes.

    These improvements also apply to the existing file-I/O and memory summary tables.
    Asset-mapping improvements
    PIX uses CSV asset mappings to associate byte ranges in archive files with asset names. This lets you see which assets a DirectStorage batch or Win32 file read is loading.
    PIX now handles ambiguous archive-file paths more reliably when applying asset mappings.
    Follow DirectStorage requests through processing stages
    DirectStorage analysis now exposes queue and processing-stage information from compatible DirectStorage 1.4 preview-or-later event streams. Follow a request through file I/O and decompression, and correlate it with the related GPU upload, decompression, or copy work.
    The new timeline lanes and Range Summary tables expose request information such as:
    - Source file and offset.
    - Source and uncompressed sizes.
    - Compression and destination type.
    - Queue and process/thread context.
    - Synchronization and completion information, where recorded.
    Group requests to see where the most time is spent or the most data is loaded.

    Processing-stage analysis requires the corresponding runtime events. Those stages cannot be shown in older captures that lack the events.
    DirectStorage improvements also include:
    - Compression and shuffle information in operation details.
    - Corrected out-of-order request accounting so operations are not consumed by the wrong batch.
    - More robust DirectStorage 1.4 request/fence correlation when events are orphaned.
    - Corrected Show in Timeline navigation for DirectStorage operations.
    - Kept selected enqueue markers visible above aggregated timeline markers.
    Analyze Timing Captures with MCP
    PIX now includes a standalone PixTimingCapturesMcp.exe server for MCP-capable clients. Register the installed executable as a standard-input/output MCP server, then open an existing .wpix capture. It does not require a running PIX UI or a listening network port.
    The server supports:
    - CPU samples, stacks, and scheduling queries.
    - PIX CPU/GPU events and GPU-work correlations.
    - File-I/O and memory-allocation queries.
    - D3D object information.
    - DirectStorage queue and processing data.
    - Metric discovery and range statistics.
    - Comparing a metric across two ranges within one capture.
    - Reading and updating bookmarks.
    Multiple captures can be open at once, with explicit capture IDs. The built-in metric comparison compares two ranges in the selected capture; it does not automatically compare different capture files.
    When consolidated patterns share a name, MCP clients can use a unique display name to select the intended metric.
    Symbol lookup initially uses the capture’s embedded cache for the captured application. Clients can opt into a wider process scope and external symbol lookup. Migration and bookmark updates can modify capture files.
    For agents that support .mcp.json configuration, create a file like this in your working directory:
    {
        "mcpServers": {
            "pix": {
                "type": "stdio",
                "command": "C:\\Program Files\\Microsoft PIX\\<PixVersion>\\PixTimingCapturesMcp.exe",
                "args": [],
                "tools": [
                    "*"
                ]
            }
        }
    }
    The installation also includes an optional skill that guides your agent through the Timing Capture analysis techniques our engineers use. You can find it at C:\Program Files\Microsoft PIX\<PixVersion>\skills.
    New scripted capture options
    pixtool exposes more Timing Capture configuration for repeatable collection:
    - Circular recording and ring-buffer size.
    - Raw ETL output.
    - CPU sampling rate and stack collection.
    - File-I/O and memory instrumentation.
    - Managed-code data.
    - Capture duration or recording until process exit.
    - Minimal GPU instrumentation where supported by the application’s Agility SDK.
    Existing camelCase option spellings remain supported. Optional configuration passed through the PIX API is now honored, and errors reported while finalizing a capture reach the API/CLI instead of being mistaken for success.
    Raw ETL collection can also merge the image metadata needed for symbol resolution automatically. If the merge fails, PIX preserves the ETL and reports the manual workaround.
    Faster large-capture analysis and more accurate memory totals
    Opening and navigating large Timing Captures now uses less memory. PIX looks up saved symbols on demand and aggregates more results before passing them to the UI. Symbol loading is faster thanks to parallel function/source enumeration and lower-overhead caches.
    D3D memory views distinguish an object’s logical size from the physical memory it owns. This avoids double-counting committed resources and their implicit heaps. Placed and reserved resources remain inspectable as objects without being counted as separate backing allocations.
    Resource sizes no longer wrap at roughly 4 GiB, and allocation summaries show the D3D object type instead of a placeholder.
    Timeline and navigation improvements
    - Keep matching Range Details results in view after filtering, scrolling to a visible selected row or back to the top.
    - Keep the expected pattern selected after deleting an entry in the consolidated-event editor.
    - Color sampled functions by module/function or callstack depth.
    - Show command-list debug names in GPU timing lanes.
    - Select a budget profile directly from the capture toolbar.
    - Use one lane-sorting dropdown containing the applicable ordering choices.
    - Resize bookmark popups to read and edit longer comments.
    - Filter ETL-conversion process lists by name or PID and sort them.
    - Honor the accumulated mouse-wheel delta when zooming, reducing delayed overshoot.
    - Respect Windows’ configured scroll amount.
    - Keep timeline labels from drifting vertically after repeated rendering.
    - Page long context-switch-stall lists instead of materializing the whole list at once.
    - Keep core-lane loading responsive and avoid a save/read deadlock.
    - Correct zoom-to-sampled-functions framing.
    - Preserve pinned tooltips during screen-snipping transitions.
    - Report the thread-activity time bin under the pointer correctly.
    - Keep context-switch/stall lanes visible at close zoom levels.
    - Show lanes containing GPU work, samples, or API-object activity even when they contain no PIX events.
    - Prevent stale asynchronous hover results from reopening at an old pointer location.
    - Match video-frame tooltips and selected images to the rendered tile at scaled zoom levels.
    - Correct Copy to Clipboard and Save as BMP for selected video frames.
    - Reduce contention between video decoding and other timeline work.
    Metrics configuration improvements
    - Fix crashes when deleting configurations and restore Rename.
    - Honor Cancel without creating or changing a configuration.
    - Prevent duplicate Last Used configurations from accumulating.
    - Preserve existing configurations when importing another with the same name.
    - Keep named empty configurations across restarts and label them (empty).
    - Suggest unique names and explain naming conflicts before saving.
    Metrics, memory, and symbol fixes
    - Keep shared Y-axis and histogram ranges up to date as metrics with the same units finish loading.
    - Improve consolidated CPU-event matching in budgets and cross-capture comparisons when thread IDs change.
    - Use each capture’s own consolidated events when calculating comparison statistics.
    - Include low-activity title threads in Summary’s CPU Thread/Core Usage table, grouping them instead of dropping their contribution.
    - Explain missing thread activity and avoid invalid utilization percentages for empty ranges.
    - Correct CPU execution/stall accounting when context-switch records are missing.
    - Copy Allocated Size and Unfreed Size cells as text instead of empty values.
    - Prevent duplicate metric entries and errors from repeated or out-of-order graph toggles.
    - Prevent budget-profile initialization from changing a metric list while it is still being constructed.
    - Prevent missed histogram updates and collection-modified errors during asynchronous loading.
    - Stop memory animations from following a replaced analysis model.
    - Release retained metric configuration, timeline lanes, and symbol graphs when captures or views close.
    - Release intermediate storage used while paging Range Details and Range Summary results.
    - Attribute source-analysis samples to the selected function’s stack node rather than its parent.
    - Avoid appending duplicate saved function/source records when adding newly resolved type information.
    - Repair older duplicate symbol data when migration is required.
    - Preserve same-timestamp kernel/user stack ordering.
    - Reduce long finalization delays caused by repeatedly sorting pending stack data.
    - Bound the memory retained for Delivered Performance collection and analysis.
    - Correct full-range metric queries at the maximum timestamp.
    - Correct GPU event completion’s handling of nested timing state.
    Capture, conversion, and API reliability
    - Fix installed native Timing Capture API initialization when its managed runtime configuration was missing.
    - Reduce per-record allocation churn during circular ETW recording.
    - Distinguish viewer-local and UTC capture times in Summary.
    - Preserve the meaning of older stop timestamps recorded in the capturing machine’s local time.
    - Handle quoted filenames correctly in the ETL converter.
    - Avoid misleading validation errors for valid conversion filenames.
    - Enable a separate destination when migration is not in place.
    - Allow data-repair migration even when the capture already has the current schema version.
    - Rebuild changed indexes during capture migration instead of accepting stale same-name indexes.
    - Identify the associated metric in budget-detail headings.
    - Release replaced buffers when recalculating budget-exceedance markers.
    - Handle malformed or truncated ETW array payloads more robustly.
    PIX API and command-line tools
    PIX API SDK
    The PIX API, introduced as a beta in the May preview, is included in the main release. Use it to build tools around PIX capture documents and device connections, including the new retail interfaces for DirectX dump analysis and shader profiling.
    The installation includes:
    - Native headers under include.
    - lib\PixApi.lib and pixapi.dll.
    - C# extension assemblies.
    - Packaged API documentation in docs\pixapi.zip.
    Python integrations use pythonnet with the C# layer rather than the earlier separately installed Python package. Native integrations should use the current headers rather than the removed IDL/WinMD surface.
    Use the new online documentation alongside the PIX API samples when setting up an integration. Follow the sample’s version requirements and use headers from your installed PIX SDK.
    Code built against older preview headers needs rebuilding: the factory interface ID and a number of API types have changed. Experimental native interfaces remain separate from the retail surface.
    System Monitor
    Several new counters are available in System Monitor:
    - Per-IHV counters exposed via plugins. Currently supported by AMD and NVIDIA.
    - Advanced Shader Delivery cache statistics, including PSO creation and cache-hit/miss categories.
    - System power and usage related counters, including battery discharge rate, CPU requested and nominal frequency, and CPU C-State.
    To view available counters on your system open the System Monitor Modify Graphs panel. These counters are also recorded during a Timing Capture and can be plotted in the Metrics view.

    Remote connections and application launch
    Manage paired PCs from PIX
    The remote connection support introduced in the May preview uses the Xbox PC Remote tools to manage paired Windows PCs. PIX can deploy its engine and start the remote connection. A flyout shows connection status and setup instructions. You may need to acknowledge a UAC prompt on the remote device to deploy the engine and configure firewall rules; PIX will tell you when this is needed.

    Reattach to Last Process and launch improvements
    Reattach to Last Process is new since June. After restarting your application, use it to find processes with the previous executable name without reopening Attach to Process.
    The launch controls now show longer recent-launch lists and command-line history.
    When the defaults are suitable, use Launch directly without first going through Next. The capture-mode selector no longer unexpectedly toggles away from GPU Capture when you click the already-selected option, and its keyboard handling is improved.
    Additional fixes include:
    - Launch the correct remote engine architecture from an ARM64 installation.
    - Match executable names correctly in Attach to Process filtering.
    - Clean up packaged applications that fail partway through launch.
    - Correct packaged-app recent-list cache-miss handling.
    - Use the required process access rights for packaged-app GPU capture.
    - Correct x86 child-process launch passthrough.
    - Handle connection timeouts like disconnects rather than displaying an unrelated error.
    - Avoid an adapter-selection worker-thread exception.
    - Release connection, docking, and System Monitor state when a connection closes.
    Welcome, settings, and everyday usability
    PIX now opens to a new Welcome page. Open recent documents with a double-click or Enter, or launch or attach to applications from the device connections list. If a connection fails, you can retry with one click. The page also links to documentation and feedback. It stays available as a tab, and you can choose whether it appears on startup.

    When a newer version of PIX is available, a notification shows the release highlights and a download link. You can reopen it from a button in the top right corner. The redesigned What’s New page, opened with F2, shows the installed version next to the latest release. It also lists past releases, with filters for feature, incremental, and preview releases, and shows each release announcement inside PIX.

    PIX now follows the Windows light or dark theme by default through the Use System Theme setting. It switches immediately when the Windows theme changes while PIX is running. These changes first appeared in the June preview and are now part of the main release.
    The installer now updates the required .NET Desktop and Visual C++ runtimes and includes WebView2. A failure to remove an older version of PIX no longer blocks installation of the new version.
    Other UI improvements include:
    - Capture workflow:
      - Start Analysis no longer blocks views that don’t need analysis.
      - The Captures panel opens automatically for all GPU capture sources.
    - Opening and saving documents:
      - Captures without a thumbnail, including programmatic or non-rendering ones, show a more visible placeholder.
      - File opening uses the standard Windows file picker with a recent folder menu. It remembers the last folder used and offers an “All PIX Files” filter.
      - Opening a capture that is already open no longer fails.
      - Recent Documents checks the file type before opening a file and keeps entries after errors unrelated to the file.
      - Screenshot saving now handles file extensions correctly.
    - Tabs, docking and layout:
      - The selected tab stays visible when tabs overflow, and long titles are shortened in the middle.
      - Docking prefers nearby views, and panel-group splitters and layout rounding are fixed.
      - Detached panels no longer hit layout failures, and the cursor and window state recover after opening or minimizing.
    - Filtering and search:
      - Ctrl+E now focuses filters consistently in dialogs.
      - The About dialog filter works, and the dialog loads its content asynchronously.
    - Text editors and copying:
      - Text editors highlight other instances of the word under the cursor.
      - Improved horizontal scrolling and draggable editor overlays.
      - File Details text is easier to select and copy.
    - Keyboard: Escape closes popups. Switches support keyboard input, and keyboard focus is more reliable.
    - Visual polish:
      - Dark theme selection, breadcrumbs and panel titles are easier to read.
      - Improved tree-view scrolling and sizing.
      - Pipeline Resources shows a loading indicator and clearer errors.
    PIX documentation on Microsoft Learn
    Alongside this release, we’re bringing PIX documentation together on Microsoft Learn. The new site consolidates guidance previously spread across blog articles and existing documentation, with a common starting point for learning PIX and looking up its APIs. This blog will continue to carry release announcements.
    Detailed PIX API documentation
    The new documentation includes a getting-started guide for the PIX API and an extensive reference generated from its native headers. The guide explains the installed SDK layout, with examples that open a capture or establish a local connection through a PIX factory.
    The WinPixEventRuntime APIs are separate and have their own documentation.
    Public samples for your own tools
    The new docs are complemented by samples in the public PIX API samples repository. New examples include:
    - Upgrading older GPU Capture files.
    - Running Dr. PIX experiments.
    - Inspecting captured pipeline state.
    - Inspecting resources and their views.
    - Opening Timing Captures and resolving symbols..
    Download and feedback
    Get PIX from the download page. Please don’t hesitate to contact us with feedback – either via the Send Feedback button in PIX or via the DirectX Discord.
