  Value: |-
    Today we released PIX 2610.28, available for download here.
    This release supports all the new retail and preview D3D12 features released today in DirectX Agility SDK 620 and 721. This is the first PIX build combining support for both retail and preview Agility SDKs, simplifying the user experience.
    Beyond that, 2610.28 brings many new features and improvements since the last regular PIX release, PIX 2603.25, including all the features previewed in the May and June preview builds.
    It also includes the most bug fixes we’ve ever released in a single version of PIX.
