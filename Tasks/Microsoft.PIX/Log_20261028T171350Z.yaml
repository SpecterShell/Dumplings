    As always, many thanks to our hardware partners (AMD, Intel, NVIDIA and Qualcomm) for developing many of these features with us.
    DirectX Dump Files
    DirectX Dump Files are now available for use in retail games and applications! PIX has full support for analyzing them:
    - In the PIX UI
    - Programmatically through the PIX API
    - With AI agents using PIX’s MCP/CLI tools or your own tools built on the PIX API.
    See the dedicated blog post for more information.
    Shader Explorer
    Shader Explorer is now available in main PIX releases, with offline and live shader analysis for supported AMD and Intel hardware.
    We introduced the static-profiling workflow in the May preview. Start with a Compute, Graphics, or Mesh Shader Explorer project from File > New, choose a compiler and target architecture, and compile your source.
    The analysis views provide:
    - GPU ISA correlation to source, when the compiler supplies source mappings.
    - Register pressure with allocated and used register counts.
    - Register-lifetime matrices showing liveness, reads, and writes.
    - Incoming and outgoing instruction dependencies.
    - Separate revisions for comparing shader and pipeline-state changes.

    Add live instruction profiling
    This release adds the ability to collect live profiling data for a shader pipeline. PIX replays the captured workload in a GPU Capture and gathers instruction statistics from a compatible GPU plugin, then brings the results into Shader Explorer.
    Instruction costs are accumulated across shader waves and loop iterations in the profiled event. Start with expensive instructions and inspect their correlated HLSL. Dependency and stall data can help explain the cost.

    Move between GPU Captures and Shader Explorer with ease
    You can now export pipelines from GPU Captures to Shader Explorer.
    To use the new export feature, open a GPU Capture file, select an eligible GPU event, start analysis, and choose Profile from the Pipeline view. PIX brings across the pipeline state and shader compilation information.

    Export requires the shader source and compilation PDBs. The feature currently supports exporting traditional graphics and compute PSOs. Other pipelines like raytracing or work graphs will be available in a future PIX release.
    For more details, see the Shader Explorer documentation.
    Support for new D3D runtime features
    This release includes support for all new D3D12 features in Agility SDKs 620 (retail) and 721 (preview) that were released today. It also adds support for some existing D3D12 features such as D3D12 video.
    DXR Clusters and Partitioned TLAS (preview)
    PIX adds support for the new ExecuteIndirectRTASOperations preview features, including GPU-driven acceleration structure operations and new ways to organize raytracing geometry:
    - Cluster-level acceleration structures (CLAS).
    - Clustered bottom-level acceleration structures (CBLAS), built from clusters.
    - Partitioned top-level acceleration structures (PTLAS).
    You can:
    - Capture and replay batched indirect acceleration-structure operations, including cluster builds and partitioned-TLAS updates.
    - Explore cluster geometry and partitioned acceleration structures in the Acceleration Structure Viewer, with hierarchy views grouped by instance or BLAS.
    - Open an individual CLAS directly for inspection.
    - Inspect build inputs and outputs in the Pipeline view, with labels identifying the operation and argument each buffer belongs to.
    - Read indirect operation arguments in the Buffer Viewer using structured layouts instead of raw byte dumps.
    - Inspect indirectly referenced vertex and index buffers with layouts that account for their supported formats and strides.
    - Export captures which are using the new API and RTAS types to C++, including the batched operations and their indirect argument data.

    Clusters and PTLAS support require a compatible preview runtime and GPU driver.
    Partial graphics programs
    This release expands the partial-program support introduced in the May preview and included in June.
    Improvements since June include:
    - Many robustness improvements to Capture/Replay
    - API Objects: show more detailed information.
    - VS Output: supported
    - Pixel History: supported.
    - Image visualizers: improved support
    - Export to C++: supported
    Other new retail and preview D3D12 features
    PIX adds full capture/replay support for new D3D12 features, including:
    - Async commands
    - Texture GUID Layouts
    - Serialized root signature
    - Fence Barriers
    - Explicit PSDB subobjects
    - GPU descriptor copies (preview)
    D3D12 video capture/replay
    PIX has long had the ability to work with applications that use D3D12 video APIs, but before this release, PIX would just capture the output of that video work.
    PIX now has an opt-in setting to do full capture of D3D12 video decode, processing, and encoding work, with replay and C++ export support. This means that the full video APIs can be analyzed, and standard PIX features like buffer/texture viewers let you see the inputs/outputs of the video APIs.
    You can enable the full video-capture option in PIX’s File->Settings page. It is off by default.

    This support is marked as experimental for now, primarily because GPU plugins in PIX don’t support video queues so low-level hardware profiling information is not currently available. This will be fixed in a future version of PIX.
    GPU Captures: other improvements
    A new file format
    Over the years, PIX’s file format for GPU Captures has proven to be a large performance and feature bottleneck. Although it was robust in lots of ways, it prevented us from saving additional data back to the capture file and had to be decompressed linearly.
    We’re therefore excited to announce a new file format for GPU Captures with this release, which removes these restrictions and unlocks some exciting features and performance gains.
    We have more planned around this, but in this release: PIX is now able to save resolved PDBs into the capture file, Start Analysis is no longer bottlenecked by single-threaded decompression, and captured screenshots are now visible from File Explorer. See their sections below to learn more!
    Note that PIX can convert old captures to the new file format, so your old captures can get all these benefits. You will be prompted to do so when opening an older capture file.
    Save resolved shader PDBs into your GPU Capture
    The new capture format lets PIX save resolved shader PDBs inside the GPU Capture itself. After resolving symbols through the configured search paths or Resolve PDB, save the capture to keep those PDBs with it. This means that reopening the file no longer requires finding those same PDBs again. It also means that you can send the updated file to a colleague, and PDBs will automatically resolve for them.
    Start Analysis / Replay performance improvements
    The new capture format also allows us to better multithread Start Analysis. As mentioned above, we no longer need to decompress the capture linearly and can instead throw it all off to a threadpool. For captures that are gigabytes in size, this is a great speed-up.
    We’ve also dedicated lots of attention to improving performance in other areas of how PIX plays back a capture. Depending on your workload, you should see that PIX is noticeably faster, especially when collecting timing data.

    View captured screenshot directly from File Explorer
    This release finally brings one of the most requested quality-of-life features: the ability to view the captured screenshot directly from File Explorer. This is another feature that has been unlocked by the new file format and is very handy to distinguish between your different captures.

    Capture/replay robustness improvements
    Application-Specific Driver State and Recreate-at-GPUVA are now enabled by default to improve capture correctness and compatibility with applications.
    Tile Mappings Viewer
    First introduced in the May preview, PIX now supports inspecting how reserved resources map to physical heaps. This information is available in the Texture Viewer’s new Mapping Details panel as well as new Resource Mappings and Heap Mappings views. See the Tile Mappings documentation.
    Open a reserved resource in the Texture Viewer to use the Mapping Details panel. It provides:
    - An overlay to visualize unmapped tiles directly on top of the texture.
    - Mapping status per subresource.
    - Mapping information for the selected tile, with links to the Resource Mappings and Heap Mappings views.
    - General resource tiling information

    The Resource Mappings and Heap Mappings views include:
    - Automatically syncing the mapping state based on the currently selected event. A dedicated Mapping Events panel also provides a way to navigate between the capture’s initial mappings or subsequent UpdateTileMappings or CopyTileMappings operations.
    - A pivot table to inspect individual tile mappings.
    - A visualizer to quickly see tile mappings of a given subresource.

    Note: Captures migrated from older PIX versions do not contain the mapping data necessary and must be recaptured.
    Dedicated Pipeline State Objects view
    The Pipeline States view returns in this release. The pipeline state object (PSO) list now appears directly in the main view, with filters behind buttons. Use it to compare PSO configurations and navigate to their shaders.

    The updated view improves navigation between related PIX data. Global ID links in the History panel now open the corresponding pipeline and select its first shader in the Pipeline Resource view for easy access. This release also fixes an issue that could cause the PSO list to disappear, and includes additional usability and text improvements.
    Buffer Viewer improvements
    The Buffer Viewer has a new Image mode to display data visually, rather than just a long list or table of numbers. This is notably useful for image data outside the texture viewer’s usual domain of DXGI formats (such as multidimensional tensors for machine learning and for more niche formats), or at other points along the pipeline where a format isn’t known yet or is unspecified (such as uploaded raw data or generic UAV’s). It’s also a convenience for cases that don’t need a full custom shader for visualization.
    Image mode
    Visualization uses the existing tensor keyword to specify the data type, dimensions, strides (defaulting to packed), and optional axis semantics (tensor<dataType, dimensions, strides, axesSemantics, …>), and it works with multidimensional tensors too (e.g. unorm8_t pixels[480][640]). Below is a 3-channel float32 planar image in CHW layout:

    Tensor data types can even hold structures, such as this 16-bit b4g4r4x4 pixel:

    Color order
    The channel color order can be configured with a new [[colors(…)]] attribute, for planar tensors and packed structs, currently supporting: bgr, rgb, gray.

    Channel Ranges
    The color channel ranges normally have enough information from the data type alone (e.g. unorm8_t ranges [0, 255], unorm4_t ranges [0, 15], float32_t ranges [0, 1]…), but the new [[range(…)]] attribute can specify the low and high points explicitly (that is, the zero/black and full saturation/white points), such as range [[range(0, 1)]], [[range(0, 255)]], and [[range(-1, 1)]]. Below you can see an oversaturated image, and the proper range on the right: tensor<[[range(10000,40000)]] float32_t, {765,512}, increasing>:

    Subtiling
    Since multiple dimensions are supported, you can indirectly achieve nested subtiled arrangements like the D3D standard swizzle here. Axes can be flipped by negating a size component (e.g. {-8, 16} would mirror the first axis):

    Data Export
    While in image mode, you can export images to PNG, BMP, or JPEG files, and copy the currently selected image to the clipboard (Ctrl+C or right-click context menu on the image). Additionally you can export buffer data to NumPy array .npy files to continue investigating tensor differences in Python, which preserves binary fidelity, dimensions, and data types (where possible). If there isn’t a 1:1 mapping to a NumPy tensor type, the data type is upcast to the nearest NumPy equivalent (e.g. bfloat16 to float32) or stored as opaque elements. Any strides (padded, broadcasted, reversed) are flattened first.

    Data Types
    The buffer-format language gains more element types:
    - unorm* and snorm* types as familiar aliases to the older unint and snint types.
    - Low-precision floating point types:
      - float16m7e8s1_t – “Brain float” with standard infinity and NaN, mantissa with 7 bits, exponent with 8 bits, and final sign being 1 bit
      - float4m1e2s1fnnn_t – finite, no NaN
      - float6m3e2s1fn_t – finite, has NaN
      - float6m2e3s1fn_t – finite, has NaN
      - float8m3e4s1fnuz_t – finite, only unsigned zero with negative zero as NaN
      - float8m2e5s1fnuz_t – finite, only unsigned zero with negative zero as NaN
      - float8m4e3s1_t – has infinity, has NaN
      - float8m0e8s0fn_t – finite, mantissa has 0 bits, 0 sign bits, all 1’s set as NaN
      - float8m3e4b11s1fnuz_t – finite, only unsigned zero with negative zero as NaN
      - float8m3e4s1fn_t – finite, has NaN
      - (in addition to the existing float8m3e4s1_t and float8m2e5s1_t)
    - Packed integer types:
      - int1_t, int2_t, int4_t
      - uint1_t, uint2_t, uint4_t
      - unorm1_t, unorm2_t, unorm4_t
      - snorm2_t, snorm4_t
      - *Note field packing order depends on the current endianness setting.
    - Character types: char8_t, char16_t, char32_t.
    - Padding via the pad N statement was previously limited to bytes, but it now accepts a second parameter for the bit count (defaults to 8) or data type to pad out with. e.g. “pad 4, float32_t” pads out 3 floats worth, and “pad 12,1” pads 12 bits.
    The new “Default buffer element format” setting controls the fallback data type used when PIX cannot determine a buffer’s format automatically:

