- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    修复
    - 会话中发现新安装的插件工具：新增常驻的工具发现与调用入口，让缓存旧工具清单的 Agent 也能直接调用后来安装并启用的插件；停用、卸载或调整作用范围后按最新状态校验。
    - PI 待办面板与 Agent 数据同步：兼容原版 PI 面板的消息封装，正确转发 todo.sync 等插件通道，修复面板新增待办后 Agent 查不到、重新加载后丢失的问题。
    - 插件目录通知恢复：MCP 通知连接断开后自动重连，并在建连与重连时补发工具、提示词和资源目录变更通知。
    - 清理两处未使用代码导致的 Rust 编译警告，保留插件安装测试入口。
