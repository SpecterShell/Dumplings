  Key: ReleaseNotes
  Value: |-
    修复
    - 修复 Codex 异步问题仍处于 Working 状态时，房间识别不到选择题的问题。房间直接读取终端中已验证的请求，不再等待成员状态先变成等待回答。
    - Codex 房间答复使用独立的原生输入记录；连续提问处理完、题目从终端消失且状态回到空闲或完成后，释放答复占用，让后续消息继续投递。
    - Working 状态刷新不会重新启用已经回答的异步问题；题目后已恢复工作的历史内容不会被识别成新请求。
    - 保留终端中已有的回答草稿和主输入框草稿。用户继续编辑、输入法占用、输出缺失或写入结果不确定时，不清除输入、不重复提交。
    升级提示
    - 已有自定义回答草稿仍需在终端处理；旧消息提交结果不确定时，请先到终端核对。
