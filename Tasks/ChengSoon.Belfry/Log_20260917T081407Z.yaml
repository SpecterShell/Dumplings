- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新增
    - 接入 Pi CLI：工作区支持第三种 CLI Agent，与 Codex、Claude 同等参与分屏、协作与用量统计。
    - 「关于」设置页：查看应用版本与更新状态，并检测三个 CLI 的本地与最新版本，支持一键升级。
    - 版本检测从可执行文件反查真实包名：装的是第三方镜像包（如 @cometix/claude-code）且滞后于官方包时，在卡片上提示官方版本，而升级动作仍只针对已装的包，不偷偷替换。
    改进
    - Provider 卡片视图重做，加入翻牌启用与销毁碎裂动画。
    - 分屏标题栏与侧栏会话行支持 Pi 品牌图标。
    修复
    - 暗色主题下会话图标对比度不足（π 图标糊成黑影）：新增 --text-icon 灰阶，各暗色底从 3.13.7:1 提升到 4.65.5:1，同时修好关于页按钮未右对齐的问题。
