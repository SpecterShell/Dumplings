- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    修复
    - 修复协作收件箱中一条消息投递被打断后，同一会话后续所有消息一直卡住、不再发送的问题。现在正文尚未完整写入终端时被打断（例如投递瞬间有键盘输入），这批消息会退回待发，等会话空闲后自动重新投递，不会重复发送。
    - 切换窗口或标签页产生的终端焦点信号不再打断正在进行的自动投递。
    - 旧投递器迁移遗留、无法核对的投递记录在启动时标记为已放弃（不重发），不再阻塞后续消息。
    升级提示
    - 正文已完整写入终端、只有回车结果不确定的投递仍会保守暂停，以免 Agent 收到重复消息。
