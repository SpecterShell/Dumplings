- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    改进
    - 默认界面更新为曜石 Obsidian：统一亮暗主题、文字层级、圆角、间距和交互状态，工作台与设置使用浮起内容面；同步更新房间、Provider、插件中心、历史、用量与弹窗。
    - 设置正文铺满右侧可用区域，Provider 卡片根据数量自动等分，避免空列；保留窄窗布局与字号设置。
    - 工作台右上收为分屏、文件与 Git、更多三个入口，可选择已有会话并排显示；搜索、协作、主题和 Worktree 操作保留，统计并入同一状态行。
    - 项目分支提示改用轻量读取，仅在项目变化或窗口获焦时更新，减少后台 Git 进程调用。
    - 统一窗口首帧与原生底色，改善启动和切换主题时的视觉衔接。
    修复
    - 修复 UTF-16、GBK 等文本预览被误判为二进制的问题，补齐 Unicode BOM 与传统编码识别；大文件截到半个字符时保留有效内容，继续拦截真正的二进制文件。
    - 修复长路径在窄窗中把统计按钮挤出边界、弹窗禁用按钮状态不明显、分离 HEAD 分支提示与部分键盘焦点返回问题。
