  Value: |-
    改进
    - 优化背景图模式下的主界面：顶栏与状态条使用统一的半透明底色，主内容区贴齐窗口边缘，移除内部圆角、外框和多余留白。
    - 背景图片与动态视频保留用户设置的清晰度和透明度，主内容区不再额外叠加模糊。
    - 分屏窗格使用轻边界和聚焦提示，优化深浅主题、小窗口与侧栏收起时的布局衔接。
    修复
    - 修正终端正文留白的尺寸计算，让末列文字、光标和滚动条完整显示。
