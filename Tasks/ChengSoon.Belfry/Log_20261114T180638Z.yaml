- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    修复
    - 修复 Codex 在粘贴正文后从完成切换为空闲时，自动回车被取消、消息一直留在输入框的问题。Codex 与 Claude Code 连续的空闲或完成报告保留本次投递许可；忙碌、弹窗、报告缺失及用户输入仍会中断投递。
    - 修复已确认空白的输入框按回车后被误认为存在草稿，后续消息一直等待终端就绪的问题；真实草稿和未确认的输入仍受保护。
    - 收件箱显示原生输入受阻的具体原因，区分终端有未提交输入、安全粘贴未启用与终端状态未就绪。
    - 后台完整检查一次输出中的所有状态变化和粘贴模式重置，避免漏掉中间的忙碌或等待确认状态。
    升级提示
    - 新建终端自动使用支持本次修复的后台；正在运行的旧会话继续留在原后台，请在任务结束后重新启动受影响终端。
    - 已标记为提交结果不确定的旧消息不会自动重发，请先到终端核对后再处理。
