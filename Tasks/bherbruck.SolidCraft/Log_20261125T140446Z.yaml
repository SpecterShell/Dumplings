  Key: ReleaseNotes
  Value: |-
    - Simpler, faster graphics start-up. The window starts on one graphics instance and picks a hardware Vulkan GPU first, without the old probes and restarts; a window that can't start falls back to the software renderer. Set SOLIDCRAFT_GPU_STARTUP=legacy to start exactly as 0.49.0 did.
    - Sketch: the degrees-of-freedom status no longer draws over the 3D view.
    - Fillets: rounds between flat faces are built in closed form and finish sooner, a variable-radius round of a closed edge such as a cylinder's rim builds, and new fillets use Auto, which sweeps each corner the ball can pass and mitres the rest.
    - Offset: a rounded offset whose tube folds over itself is refused with a message instead of building a broken body, and a saved offset of a projected major arc on a shelled wall reopens.
    - Agent chat: a declined call says it did not run, Stop shows only while the agent is working, and a conversation past the model's context window drops its oldest turns and goes on.
    - Web app: a right-click in the Browser panel opens SolidCraft's menu again.
    - More fixes: holes picked on curved faces start on the exact surface, emboss text carries onto a tangent flat face, hidden lines draw rounded corners, STEP half-sphere end caps keep their side, and a mesh body in the path no longer fails an Extrude Cut.
    - Why a patch: 0.49.1 ships the fixes merged since 0.49.0, with the smaller additions that landed alongside them. Designs saved in 0.49.1 use design format 68, so open them in 0.49.1 or later.
    What's Changed
    - Booleans: an edge no longer grows by the fit error of a trim built to test a face merge by @bherbruck in https://github.com/tangency-labs/solidcraft/pull/21966
    - Contributing: kernel operations migrate to solidcore, and new features build on its API by @jyviko in https://github.com/tangency-labs/solidcraft/pull/12122
    - Holes: drill depth, reach and height on a face use exact rays and containment, not the display mesh by @bherbruck in https://github.com/tangency-labs/solidcraft/pull/21057
    - Naming: a point's face name is found on the exact B-rep faces, not the display mesh by @bherbruck in https://github.com/tangency-labs/solidcraft/pull/21061
    - Naming: edge names at a point are found on the exact B-rep, not the display mesh by @bherbruck in https://github.com/tangency-labs/solidcraft/pull/21062
    - solidcore: keep the fillet target's faces by a mark and retire fillet_cleanup_keeps_target_faces (#17169) by @brett19 in https://github.com/tangency-labs/solidcraft/pull/21270
    - Ruled Surface: a strip along the normal of a lofted edge is smooth at the loft's sections instead of refused by @Ledzz in https://github.com/tangency-labs/solidcraft/pull/21386
    - Stitch: a cavity sewn from loose faces is a void, so the part closes into a solid (#21540) by @MarkusReichart in https://github.com/tangency-labs/solidcraft/pull/21561
    - Offset Face: split-in pockets stay recessed regardless of spline outline direction by @ancientastronauttheorist in https://github.com/tangency-labs/solidcraft/pull/21881
    - smlib: bounds, solid tests, point classes, the edge/face gap and the check run through solidcore-ops by @bherbruck in https://github.com/tangency-labs/solidcraft/pull/21963
    - Settings: zooming with the wheel no longer reads every setting out in each frame by @bherbruck in https://github.com/tangency-labs/solidcraft/pull/21978
    - Commands: looking a command up by id no longer gathers every command first by @bherbruck in https://github.com/tangency-labs/solidcraft/pull/21985
    - solidcore: B-spline and surface evaluation entry points in ops for applications by @bherbruck in https://github.com/tangency-labs/solidcraft/pull/22003
    - Extrude, Revolve and Coil dialogs: step arrows on the angle boxes (#7480) by @Zredy in https://github.com/tangency-labs/solidcraft/pull/17382
    - 3D sketch: hold points to model edges, planes, faces and the sketch's 2D curves by @Karl-VonRichter in https://github.com/tangency-labs/solidcraft/pull/18383
    - Windows: a touchpad's two-finger scroll pans the view instead of zooming by @dudedagger42 in https://github.com/tangency-labs/solidcraft/pull/18403
    - Plugins: shaders@0.2 tints, a plugin colours the ribbon's icons, button blocks and panels with a checked WGSL function by @dudedagger42 in https://github.com/tangency-labs/solidcraft/pull/18979
    - Windows: the popped-out Browser follows the main window by @dh1011 in https://github.com/tangency-labs/solidcraft/pull/20963
    - Contributing: name the i18n and kernel-case coverage checks in the gate list by @Johnny-God in https://github.com/tangency-labs/solidcraft/pull/21857
    - smlib: shells, face offsets and sheet offsets are solidcore-ops', and smlib's copies go by @bherbruck in https://github.com/tangency-labs/solidcraft/pull/21964
    - smlib: mass properties and area are solidcore-ops', and smlib's own integration goes by @bherbruck in https://github.com/tangency-labs/solidcraft/pull/21965
    - smlib: extrusions, revolutions, lofts to a point and sections are solidcore-ops' by @bherbruck in https://github.com/tangency-labs/solidcraft/pull/21968
    - Drawings: start or open a sheet sketch only in the Drawing workspace by @0rdnungsamt in https://github.com/tangency-labs/solidcraft/pull/21503
    - Kernel: CADIR import and export reach solidcore only through the kernel adapter by @bherbruck in https://github.com/tangency-labs/solidcraft/pull/21923
    - Plugin panel shaders: kind "panel" (shaders@0.2) draws see-through panel backgrounds by @dudedagger42 in https://github.com/tangency-labs/solidcraft/pull/19096
    - Weldments: drag a frame member's profile with A/B arrows and turn it in 15° steps in the 3D view (#19438) by @sclMAX in https://github.com/tangency-labs/solidcraft/pull/19441
    - Extrude Cut: a mesh body in the path no longer fails the cut; a cut of only a mesh names Convert Mesh (#615) by @EldarPolitkin in https://github.com/tangency-labs/solidcraft/pull/21901
    - Scale: scale about a base point, the bodies' centre by default, and preview only the result (#12399) by @KristijanPruzinac in https://github.com/tangency-labs/solidcraft/pull/12400
    - solidcore-ops: splits refuse a tool that stops short, decide a plane's reach without refusing, and cut by closed tools by @bherbruck in https://github.com/tangency-labs/solidcraft/pull/22000
    - Command search: an option opens it centred over the view (#18309) by @0rdnungsamt in https://github.com/tangency-labs/solidcraft/pull/18327
