  Key: ReleaseNotes
  Value: |-
    Why 0.14: a minor release with new imports, kinematic joints, sketch patterns, a better agent chat and a new design file format. It includes everything in 0.13.1. Slow fillets and booleans are known; the real fix is the new kernel (#1597).
    New
    - Import FreeCAD and Rhino files (.FCStd, .3dm) through cadmpeg (#1435), and glTF 2.0 (.glb, .gltf) as mesh bodies with their colours and node structure (#1512).
    - Joints: gears, rack and pinion and screws (#1524); inverse kinematics with joint.reach, and a jointed part follows a drag (#1540); Motion Trace keeps a point's path as a joint is driven (#1529).
    - Sketch: associative pattern tools with Flip/Center (#1601); infinite construction lines (#1547); a new sketch on an origin plane faces the side you clicked (#1587); inch and foot marks in expressions (#1578).
    - Modelling: Split Body with a sketch line (#1592); feature mirrors and patterns keep replay and get Flip/Center (#1619); mirror planes take expressions (#1501); Edge Flange corner relief (#1481); Class-A surfacing part 2: surface match, boundary patch and CV fairing (#1487); Patch G1/G2 to neighbouring faces (#1521).
    - Agent chat: type while the agent works (queued messages, Send now), Stop, New chat and a model picker (#1566); xAI Grok (#1558).
    - Measure: circle and arc centres as fixed 3D points (#1514) and optional X/Y/Z distances (#1422).
    - Navigation and display: arrow keys turn the view, Ctrl+arrows pan, Ctrl+8 looks at the selection (#1585); the grid faces side views (#1583); 3D mouse in the web app (#1473) and on Windows without a 3DxWare profile (#1528); a frame-rate readout (#1580).
    - Updates: SolidCraft checks at every start and shows "Update to X" in the title bar (#1538).
    - Export the current 3D view as a 2D DXF with optional hidden lines (#1449); choose the interface font (#1408); Turkish (#1520).
    Fixed
    - Booleans and cuts: voids in cuts, prism cuts beside other faces, nudged results that mesh inconsistently, and more fallback axes (#1570, #1629, #1455, #1527).
    - Fillets and shells: perpendicular fillets after connected rounds, crossed-face refusals, shell saddle corners and open faces beside concave edges (#1581, #1517, #1316, #1495).
    - STEP export: shelled revolved bodies and merged partial cylinders (#1496, #1497).
    - Sketch: fillets keep rectangle constraints, tangent arcs from trimmed ends, a sketch on a thin extrude's cap keeps its face, Join from a face sketch joins that body (#1543, #1604, #1532, #1526).
    - Interface: edges between two faces are easy to pick, the taper drag stops where the profile would close, a second click closes a toolbar drop-down, no stale fillet preview on a new tab (#1568, #1614, #1576, #1533).
    - Speed and display: faster mesh collision and trim tests, smoother intersection edges, headless pictures drawn on the GPU, and the renderer skips a frame instead of crashing (#1307, #1309, #1615, #1555, #1579).
    - Agent chat: no terminal windows flash on Windows, and agents start when SolidCraft is launched from the desktop (#1567, #1551).
    - Linux: the AppImage leaves the menu entry to launchers that set it up (#1635).
    Compatibility
    Designs saved by 0.14.0 use file format 25 and don't open in 0.13.x or earlier. Older designs open and rebuild as before.
    Thanks
    Thank you to everyone who contributed to this release: @0xlillith, @CamWight, @cfaulkingham, @crono2250, @DuBearte, @erkexzcx, @gvocale, @Ian-cmd-ops, @jijinbei, @jyviko, @Karl-VonRichter, @lasselian, @macrulz54, @midasdf, @MythicForge, @NOWN-DEV, @oursland, @pablopeza, @phanoob, @PhilippBischoff0, @Rec0iL, @rlartot, @sthifen and @SychPL.
