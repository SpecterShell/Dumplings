  Value: |-
    Why a minor: new capabilities (pattern spacing modes, mesh reduce, sheet metal Tab, weldment plates, plugin panels) and design format v66.
    What's Changed
    - KiCad import: footprint text keeps its own rotation and reads upright, as KiCad draws it by @adnsv in https://github.com/tangency-labs/solidcraft/pull/20964
