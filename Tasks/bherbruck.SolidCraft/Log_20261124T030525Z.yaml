    - Offset Face: a face that would turn inside out between its two neighbours is refused, naming the largest move that fits (#19904) by @theironchef in https://github.com/tangency-labs/solidcraft/pull/20934
    - Emboss: debossing and embossing overlapping text glyphs builds across curved crossings by @ancientastronauttheorist in https://github.com/tangency-labs/solidcraft/pull/20498
    - Fillet: a refusal no longer names 0 mm as the largest radius that fits by @DavidClawson in https://github.com/tangency-labs/solidcraft/pull/20685
    - Fit Curves to Mesh Section: an STL's outline closes where two rounds meet by @j4py in https://github.com/tangency-labs/solidcraft/pull/20782
    - solidcore: a body's model size estimate no longer changes when another body is scaled or healed by @brett19 in https://github.com/tangency-labs/solidcraft/pull/20944
    - STEP import: a surface model with edges shared by three faces imports as an open body instead of being refused by @raykholo in https://github.com/tangency-labs/solidcraft/pull/20043
