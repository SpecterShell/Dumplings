  Key: ReleaseNotes
  Value: |-
    Why a minor: new capabilities (instancing, open in the running app, the document browser, Plugins phase 2, 3D sketch constraints) and the removal of the old SolveCraft names.
    What's Changed
    - solidcore: retire the surface-2 UpstreamFixes flags (offset swap, volume lift, volume continuity) by @brett19 in https://github.com/tangency-labs/solidcraft/pull/17350
    - Windows: mice that report at 4-8 kHz no longer send thousands of events a second to the window thread by @FinnDaCaptain in https://github.com/tangency-labs/solidcraft/pull/13994
    - Chamfer: a cylinder's top chamfered by its radius becomes a cone to the centre by @raykholo in https://github.com/tangency-labs/solidcraft/pull/17247
    - Rib: an end flush with a wall keeps a square end face by @leon-vv in https://github.com/tangency-labs/solidcraft/pull/16921
    - STEP import: a part with edges shorter than the file's stated tolerance is read at its own, finer tolerance (#16293) by @vshortt73 in https://github.com/tangency-labs/solidcraft/pull/16295
    - Booleans: a cylinder that only touches a sphere's or torus's seam intersects it, instead of being refused as "Face crosses Seam" (#17167) by @theironchef in https://github.com/tangency-labs/solidcraft/pull/17420
    - Rib: a top-level rib builds against a moved part where it is shown by @raykholo in https://github.com/tangency-labs/solidcraft/pull/17656
    - solidcore: retire query_statuses_pass_on (queries pass on the statuses SMLib drops) by @brett19 in https://github.com/tangency-labs/solidcraft/pull/16957
    - solidcore: a lone round between cylinders rolls over a seam onto the rest of the wall by @brett19 in https://github.com/tangency-labs/solidcraft/pull/17395
    - solidcore: the mesh path keeps a slit loop's sides where it passes a vertex twice by @brett19 in https://github.com/tangency-labs/solidcraft/pull/17651
    - solidcore: retire the cone p2 and ellipse flags (cylinder rebuild, ellipse trim seam, inside-out cylinder frame, ellipse step intervals) by @brett19 in https://github.com/tangency-labs/solidcraft/pull/16982
    - Torus offsets: move inside-out surfaces in the requested direction (#17091) by @cfaulkingham in https://github.com/tangency-labs/solidcraft/pull/17665
    - Shell: a filleted part that shelled in 0.40.1 shells again by @raykholo in https://github.com/tangency-labs/solidcraft/pull/17470
    - Sketch: keep selected arc and circle centres highlighted (#17607) by @cfaulkingham in https://github.com/tangency-labs/solidcraft/pull/17664
    - solidcore: retire offset_extended_edges_mated, offset_collapsed_rounds_mated, thicken_planar_side_walls by @brett19 in https://github.com/tangency-labs/solidcraft/pull/17325
    - Press Pull: honor the chosen body when flat faces meet (#17599) by @cfaulkingham in https://github.com/tangency-labs/solidcraft/pull/17630
    - Fillet: a round through a vertex where only a face's own splits meet builds, instead of "meets a corner of this kind" (#16654) by @cloker53 in https://github.com/tangency-labs/solidcraft/pull/16919
