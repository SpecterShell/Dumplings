    - Fillet: a round whose contact line never reaches the seam it joins across is refused naming the radius that fits by @raykholo in https://github.com/tangency-labs/solidcraft/pull/17260
    - STEP import: a cone point whose apex vertex lies a hair off the apex imports closed by @raykholo in https://github.com/tangency-labs/solidcraft/pull/17681
    - Sketch: projecting a closed circular edge gives one circle, not two arcs and three points by @raykholo in https://github.com/tangency-labs/solidcraft/pull/17175
