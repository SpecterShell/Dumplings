    - Insert STEP: a flatten option brings an assembly in as plain bodies of one component, named after their parts by @oursland in https://github.com/tangency-labs/solidcraft/pull/17572
    - Offset: the self-intersection check skips only contacts on a closed surface's seam, not the whole patch pair by @raykholo in https://github.com/tangency-labs/solidcraft/pull/18241
    - Mirror: OK applies the operation the window would choose even before the preview is in, and a hand-picked operation stays (#17377) by @iHateStupidPeople in https://github.com/tangency-labs/solidcraft/pull/18372
    - solidcore goldens: the huge and tiny proto-topology edge cases become scaled copies of the unit case by @MarkusReichart in https://github.com/tangency-labs/solidcraft/pull/18033
    - Plugins: the host previews what a command would change, as a dry run by @bherbruck in https://github.com/tangency-labs/solidcraft/pull/18346
    - Plugins: a sketch tool keeps the viewport, and a profile field keeps profiles from several sketches by @bherbruck in https://github.com/tangency-labs/solidcraft/pull/18378
    - Patterns: bodies of a part placed several times are copied where each placement shows them, so a whole assembly can be patterned by @oursland in https://github.com/tangency-labs/solidcraft/pull/17768
    - Selection: Select All (Ctrl+A) selects every curve and point of the open sketch, or every shown body (#18233) by @0rdnungsamt in https://github.com/tangency-labs/solidcraft/pull/18329
    - SVG import: an outline with nearly straight cubics now extrudes instead of failing the kernel's curve check by @raykholo in https://github.com/tangency-labs/solidcraft/pull/18367
    - solidcore: the disc-and-tube seam's stations on the circle are checked in the kernel, not the ops test (#18163) by @jyviko in https://github.com/tangency-labs/solidcraft/pull/18384
    - Mass properties: measuring a sphere or cylinder face takes about a fifth of the work, by a 15-point rule in each edge point's integral by @oursland in https://github.com/tangency-labs/solidcraft/pull/18081
    - Sketch: cancelling a new sketch closes its tab instead of leaving a dead one (#18264) by @iHateStupidPeople in https://github.com/tangency-labs/solidcraft/pull/18295
    - solidcore: edit a sewn body by its control points as one net, the points of each sewn edge moving together by @jyviko in https://github.com/tangency-labs/solidcraft/pull/18351
    - Show/Hide Planes and Show/Hide Reference Geometry: one command hides a whole category (#18131) by @0rdnungsamt in https://github.com/tangency-labs/solidcraft/pull/18221
    - solidcore: a curve's tight box finds the turning points of a B-spline past its knots (#17987) by @MarkusReichart in https://github.com/tangency-labs/solidcraft/pull/18269
    - Joints: the selection filter applies to the joint origin picker, so Faces only takes no edge or vertex snaps by @0rdnungsamt in https://github.com/tangency-labs/solidcraft/pull/18330
    - Select Sharp Edges: a command selects every edge whose faces meet at more than a set angle (#18105) by @0rdnungsamt in https://github.com/tangency-labs/solidcraft/pull/18222
    - Redefine Sketch Plane: a moved sketch keeps facing the way it did, and the panel takes a plane picked in the view (#11467, #12540) by @PaddleStroke in https://github.com/tangency-labs/solidcraft/pull/12705
    - solidcore: test the seam refusals of a sewn-body edit and pin that a falloff stops at a seam by @jyviko in https://github.com/tangency-labs/solidcraft/pull/18435
    - Sketch: Trim cuts a piece of an offset copy made from several curves, instead of refusing (#8074) by @shadaytree in https://github.com/tangency-labs/solidcraft/pull/17953
    - Release 0.44.0: fold the two later format changes into v58 by @bherbruck in https://github.com/tangency-labs/solidcraft/pull/18453
    - DXF export: a long or multi-line note is written whole as MTEXT, and the reader reads it back as typed (#5321) by @CamWight in https://github.com/tangency-labs/solidcraft/pull/18336
    - Rib: the rib's open ends run on to the next face of the body, so a rib closes the gap to a curved wall (#13019) by @0rdnungsamt in https://github.com/tangency-labs/solidcraft/pull/14745
    - Loft: regression test for arches offset to 97 and 193 points, which ran foot to crown and spoiled a cut (#15701) by @MarkusReichart in https://github.com/tangency-labs/solidcraft/pull/17945
    - Ukrainian: translate 113 untranslated interface strings by @BrunIF in https://github.com/tangency-labs/solidcraft/pull/18404
    - Decal: a curved face is named as one, not as a planar face that no longer exists (part of #18422) by @Ehuntabi in https://github.com/tangency-labs/solidcraft/pull/18427
    - i18n(ka): Georgian for 186 strings added since #16824 by @devius in https://github.com/tangency-labs/solidcraft/pull/18430
    - Web viewport: select multiple items with Apple Pencil taps by @cwallyman in https://github.com/tangency-labs/solidcraft/pull/15756
    - Features and History: selecting an offset construction plane highlights it in the view, like the origin planes by @raykholo in https://github.com/tangency-labs/solidcraft/pull/17007
    - Chamfer and Fillet: an edge of a cap that seals a hole into a void can be blended (#18287) by @MarkusReichart in https://github.com/tangency-labs/solidcraft/pull/18303
    - Draft: a cylinder's side face with a small boss near the top rim drafts instead of failing with a port invariant error by @raykholo in https://github.com/tangency-labs/solidcraft/pull/18390
    - Hole: a hole from a whole sketch no longer drills at projected fillet centres or a construction rectangle's centre by @raykholo in https://github.com/tangency-labs/solidcraft/pull/18444
    - solidcore: check_brep face test 34 no longer reports two edges that only share a vertex as partially coincident (#18212) by @MarkusReichart in https://github.com/tangency-labs/solidcraft/pull/18289
    - Prism reader: one solidcore primitive decides when a short circle piece is read as its arc, not its chord by @MarkusReichart in https://github.com/tangency-labs/solidcraft/pull/18326
    - solidcore: two B-spline edges at one place are proved coincident when their intervals differ only by rounding (#11652) by @MarkusReichart in https://github.com/tangency-labs/solidcraft/pull/18361
    - Tessellation: stop refining unavoidable gaps at shared edges (#17431) by @PaddleStroke in https://github.com/tangency-labs/solidcraft/pull/18432
    - fix(i18n): translate Hebrew sketch hints, errors and HEX field help by @nocturney in https://github.com/tangency-labs/solidcraft/pull/15298
    - solidcore: retire face_swap_uv_transposes_trims; SwapUV transposes UV trims exactly (WR-729) by @brett19 in https://github.com/tangency-labs/solidcraft/pull/17902
    - Assembly: the ribbon's Ground button grounds the selected component (#14911) by @bherbruck in https://github.com/tangency-labs/solidcraft/pull/17978
    - Shell: a square boss inset by half its width is refused naming the largest wall that fits by @raykholo in https://github.com/tangency-labs/solidcraft/pull/18345
    - fix(params): resolve forward references on import (#2748) by @mangod12 in https://github.com/tangency-labs/solidcraft/pull/2749
    - solidcore: retire proto_edge_splits_at_captured_vertices (flags G0, zero-row) by @brett19 in https://github.com/tangency-labs/solidcraft/pull/18400
    - Sketch: label the straight-line tool Rectas in Spanish (#15992) by @PaddleStroke in https://github.com/tangency-labs/solidcraft/pull/18447
    - UI kit: a spreadsheet grid (cell cursor, Excel copy/paste, fill down), and Parameters uses it by @bherbruck in https://github.com/tangency-labs/solidcraft/pull/16127
    - STEP import: tori exported by 0.30.1 come in whole instead of empty or open by @bherbruck in https://github.com/tangency-labs/solidcraft/pull/18082
    - Preferences: choose where a new Extrude's distance starts (fixed 10, last used, or a typed length) by @bherbruck in https://github.com/tangency-labs/solidcraft/pull/18136
    - Plugins: a command icon and choice pictures as SVG from the plugin package, checked and themed like built-in icons by @bherbruck in https://github.com/tangency-labs/solidcraft/pull/18363
    - Surface extension: refuse distances that collapse the original knots (#18025) by @PaddleStroke in https://github.com/tangency-labs/solidcraft/pull/18433
    - solidcore: enclose relative widths in one refinement, ~2x faster round_definition_rows tests (#18441) by @brett19 in https://github.com/tangency-labs/solidcraft/pull/18442
    - Extrude: return keyboard focus after choosing a direction (#18121) by @PaddleStroke in https://github.com/tangency-labs/solidcraft/pull/18431
    - Section View: right-click a face to add up to six cutting planes (#8717) by @kaievns in https://github.com/tangency-labs/solidcraft/pull/8719
    - i18n(ka): Georgian for the 1,284 strings added since #11501 by @devius in https://github.com/tangency-labs/solidcraft/pull/16824
    - Design tabs: no view switcher until a design has more than one view by @bherbruck in https://github.com/tangency-labs/solidcraft/pull/18095
    - Open: a file SolidCraft cannot read is named as unsupported, not as a broken design (#18465) by @Ehuntabi in https://github.com/tangency-labs/solidcraft/pull/18486
    - Sketch: hold Shift to draw a rectangle as a square (#18114) by @Ehuntabi in https://github.com/tangency-labs/solidcraft/pull/18146
    - Release 0.44.0: fold the rib-extend-ends format change into v58 by @bherbruck in https://github.com/tangency-labs/solidcraft/pull/18529
