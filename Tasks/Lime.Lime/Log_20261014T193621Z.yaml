  Key: ReleaseNotes
  Value: |-
    Lime v1.157.0
    新功能
    - 输入框采用统一结构化编辑器，支持技能、角色和能力引用，并保留图片、路径与富文本输入的提交和恢复信息。
    - 支持链接和代码块输入，按 Markdown 提交并保留引用位置；听写增加取消操作，隔离会话切换和输入法组字后的迟到结果。
    - 排队消息支持展开预览、编辑、删除、重排与空闲时启动；待执行输入与公开对话历史分开呈现。
    - 待处理审批集中展示在消息区，提供对应请求的操作与状态反馈。
    - Files 面板复用会话变更与 diff 视图，支持选择文件并定位到对应变更。
    修复
    - 修复会话切换和迟到通知导致队列、标题编辑、模型与工作目录设置落入错误会话的问题。
    - 修复浏览器标签与右侧面板恢复、关闭及切换时的状态串扰。
    - 修复长用户消息展开、折叠与复制时的滚动跳动，以及复制反馈在卸载后继续更新的问题。
    - 修复紧凑窗口中页头工具栏越界和消息、输入框布局错位。
    优化与重构
    - 长对话使用按视口挂载和卸载的 Turn 列表，保留独立历史分页、动态高度测量和阅读位置。
    - 统一输入框项目、分支与运行位置工具栏，收敛结构化提交和输入恢复链路。
    - GUI 队列、审批、文件与设置继续复用 App Server 和现有业务 owner，移除被替代的旧组件与重复投影。
    - 收敛桌面媒体与剪贴板权限处理，保持主窗口和浏览器标签的权限边界。
    测试与质量
    - 扩充队列公共历史、搜索与冷恢复、审批响应、结构化输入、列表滚动、复制生命周期及浏览器标签恢复回归。
    - 更新真实 Electron current fixture、交互定位和构建资源检查，区分源码、产物及平台验证证据。
    - 同步五语言界面文案与回归覆盖。
    文档
    - 更新 GUI 设计、架构与质量事实源，以及 Codex Desktop 分析证据和对齐执行账本。
    其他
    - 桌面应用、CLI npm 包与 Rust workspace 版本统一为 1.157.0。
    完整变更：v1.156.0 → v1.157.0
