  Key: ReleaseNotes
  Value: |-
    Lime v1.159.0
    新功能
    - 设置页新增未保存更改保护，覆盖记忆、网页搜索、环境、执行策略、个人资料和服务商配置，离开前可继续编辑或放弃草稿。
    修复
    - 设置保存只合并实际编辑的字段，避免覆盖其他设置；保存失败、在途新编辑和语言切换时保留输入。
    - 修复从设置返回会话时输入框未恢复，以及初始技能表单被导航重置清除的问题。
    - 设置章节、返回和首页动作使用统一导航，恢复实际会话并避免重复执行一次性启动意图。
    优化与重构
    - 拆分设置页的草稿生命周期、配置合并和展示组件，统一导航保护与安全错误提示。
    - 个人资料聚焦显示名称和简介，增加输入限制与换行归一化，移除旧标签、完成度、头像和邮箱展示及未使用字段。
    - 复用现有配置与 App Server 边界，保持会话、运行时和持久化的唯一职责归属。
    测试与质量
    - 扩充未保存导航、字段合并、失败保稿、在途编辑、会话恢复和五语言回归。
    - 增强真实 Electron 设置导航、保存、冷启动读回与正常退出检查，并同步构建新鲜度和证据护栏。
    - 增加 Rust 个人资料序列化回归，确保已移除字段不再写回配置。
    文档
    - 更新设置导航、配置草稿、个人资料结构的架构图、分析账本与验证记录，明确本地资料编辑和后续公共身份能力边界。
    其他
    - 桌面应用、CLI npm 包与 Rust workspace 版本统一为 1.159.0。
    完整变更：v1.158.0 → v1.159.0
