  Key: ReleaseNotes
  Value: |-
    - Fix - weird position behavior when using both left and right mouse button for dragging image objects.
    - Fix - text tool case not matching the caps lock key state.
    - Changed the default shortcut for hiding tool bar from H to Shift + H to reduce the likely hood of accidentally pressing it.
    - Fix - being unable to have two shortcuts that use the same letter key, where one shortcut is just the plain key while the other one has a modifier like Shift/Ctrl/Alt.
    - Added the ability to paste in local image files on to iScribby.
