  Key: ReleaseNotes
  Value: |-
    - Added a CTRL + S shortcut for saving shortcuts in the settings window.
    - Made ALT + F4 cause the app to exit the draw mode.
    - Deletion of multiple drawing at once will now be considered as single action - you will now be able to revert this using a single undo call.
    - Added a clear canvas button on to the toolbar - you can now clear all objects with a single click, without losing history for the undo action.
ReleaseTime: 2026-10-09
