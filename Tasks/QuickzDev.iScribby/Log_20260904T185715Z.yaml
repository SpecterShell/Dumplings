  Key: ReleaseNotes
  Value: |-
    - Disabled antialiasing for drawings - you can now draw pixel perfect lines.
    - Made the drawing pixel size stay the same size regardless of display scale.
    - Updated the drawing canvas screen to auto-adjust to full screen upon entering draw mode, if display scale has changed.
    - Disabled bitmap interpolation for images - you can now accurately see pixels of a scaled up image, without things getting blurry.
    - Added app name into the canvas screen.
    - Made the app window reposition to a different display, if your cursor is located on another screen, when entering draw mode.
