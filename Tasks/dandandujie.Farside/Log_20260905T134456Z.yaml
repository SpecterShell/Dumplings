  Key: ReleaseNotes
  Value: |-
    Farside 0.3.0 · Kimi Code 0.39.1 适配与桌面体验升级
    本版本将唯一 Runtime 从 Kimi Code 0.31.1 升级到 0.39.1，并集中修复了首次配置门禁、终端、回退与关闭流程中的一批交互缺陷，建议所有用户升级。
    升级亮点
    - 首次配置不再强制：Provider 引导层可以"暂不配置，直接进入"；服务端故障不再被误判为未配置；未配置状态下历史会话照常展示，可随时从空状态页或设置完成接入。
    - 终端按工作区缓存：切换会话/项目只切换终端显示，正在运行的 shell 任务（dev server、安装等）不再被杀掉；最多缓存 8 个实例，按最近使用淘汰。
    - 修复打包版终端 Enter 无效的问题：随包 runtime 始终使用管道降级后端，而管道没有 tty 的 CR→NL 行规转换，导致按 Enter 毫无响应；现已规整输入并让 zsh 以交互态运行（有提示符、有回显）。
    - 回退操作更安全：撤销上一轮改为先回退会话、再回滚文件，失败时自动重试并如实报告，不再出现"文件已回滚、轨迹还在"的不可逆半完成状态。
    - 关闭保护覆盖原生路径：macOS 红绿灯等原生关闭在任务运行中会弹出确认；标题栏 ×、/exit 与 Windows 更新退出流程行为保持不变。
    - 斜杠命令治理：补全清单只保留桌面端真实实现的命令；/login、/provider、/plugins、/mcp-config、/theme、/logout 映射到对应设置分区或真实动作；未实现命令给出明确提示，不再被静默当作提示词发送；/model 校验模型 ID。
    - 补齐约 60 条英文界面文案，文件选择竞态、侧栏初始宽度、燃料环刻度、配置编辑器草稿保护、OAuth 轮询容错等小缺陷一并修复。
    Runtime 与兼容性
    - 唯一 current Runtime：Kimi Code 0.39.1。
    - 固定上游 revision 5efca0c3116743855c28426000073bfe34a4862f。
    - 锁定 Windows、macOS、Linux 的 x64/arm64 六平台官方产物及 SHA-256。
    - /api/v1 REST、/api/v1/ws（协议版本仍为 2）、实例注册、shutdown 生命周期与会话持久化布局全部增量兼容，无需迁移本地数据。
    - 两处协议修复替换了 0.31 上从未开放（404）的 /api/v2 RPC：插件管理迁移到官方 REST（POST /api/v1/plugins 等，此前插件安装/启停实际不可用）；删除无效的配置 reload 调用（0.39 原生监听 config.toml 热加载）。
    - 适配 0.39 的 /api/v1/auth 摘要变化（ready 字段移除），按上游语义重推就绪状态，已对真实 0.39.1 实例完成端到端验证。
    下载与安装
    - Windows：.exe
    - macOS Apple Silicon：.dmg
    升级前请结束正在执行的 Agent 任务。安装包不会主动删除本地项目、Kimi 配置或会话数据。
    发布验证
    - 30/30 自动化测试通过；TypeScript 类型检查与生产构建通过。
    - Kimi Code 0.39.1 正式产物下载、SHA-256 校验及 Server meta/WebSocket smoke 通过。
    - 插件 REST、配置热加载、auth 就绪推导在真实 0.39.1 实例上定向验证通过。
    - 终端缓存与回退补偿在真实应用（生产构建 + 真实 PTY）中通过端到端探针验证。
    - GitHub Actions 负责 Windows 与 macOS 安装包构建和发布。
    已知限制
    - 无 node-pty 的环境仍使用管道降级后端：无窗口尺寸同步能力，终端体验为降级形态。
    完整变更
