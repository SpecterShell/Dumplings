- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    1. 新增第三内核 mihomo（Clash Meta）：支持 REALITY/Vision 全组合与全部 vmess 传输，热切节点、连接监控、延迟测速、智能切换与 sing-box 同款体验；首页/设置页可一键三内核切换
    2. Xray 模式增强：内核自动选路时首页可正确显示当前生效节点；新增内核看门狗——异常退出自动重启（防配置错误死循环）；不支持的 REALITY 传输组合节点自动隐藏
    3. 内存与性能优化：连接/请求列表虚拟化渲染、玻璃控件去逐控件模糊、关窗默认进托盘，WebView 常驻内存显著下降；设置页新增 WebView2 内存占用只读
    4. 界面焕新：新增笑脸（FaceMark）首页视觉、自定义主题色取色器、规则集整组指定节点/关键词过滤策略、磨砂控件开关
    5. 其他改进：测速改为经内核真实代理链路探测（更能反映可用性）；安装包默认仅内置 sing-box、体积更小，Xray/mihomo 可在设置页按需下载；修复 TUN 提权后切内核丢权限、订阅导入 UA 拦截等多个问题
    “不要回答！不要回答！不要回答！”——三个内核对墙喊了三次。
