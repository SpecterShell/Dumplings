Locale:
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    更新说明
    - OpenVPN 节点支持：clash 订阅中的 openvpn 节点不再被跳过——mihomo 内核模式下直接可用；多核模式下可在「设置 → 内核设置」把 OpenVPN 钉选到 mihomo 副进程转发。sing-box / Xray 内核无此协议能力，相关节点在其模式下继续隐藏
    - 节点分组测速：节点页列表/网格的分组头新增 ◉/∿ 按钮，可只对该组节点测真实延迟 / Ping
    - 节点列表订阅列：列表视图新增独立订阅列，订阅名不再挤在节点名下方
    - 首页细节修复：网络探测卡 kv 行与订阅名保持单行高度、不再换行溢出
    - 应用图标更新
    下载指南
    - macOS Apple Silicon（M 系列） → aarch64.dmg
    - macOS Intel → x64.dmg
    - Windows 64 位 → x64-setup.exe
    - Linux 64 位 → amd64.AppImage
    根据你的系统和 CPU 架构选择对应安装包即可。
    macOS 如果提示「Satelite 已损坏，无法打开」，可在终端执行：
    sudo xattr -d com.apple.quarantine /Applications/Satelite.app
