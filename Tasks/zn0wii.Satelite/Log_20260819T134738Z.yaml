- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 自定义配置：支持本地配置导入与自写 sing-box 配置直接启动，节点只读提取展示
    - 规则引擎：规则集混合类型统一重构，支持逐规则路由、批量设置出口与 DNS 菜单；新建规则集默认停用、空规则集不可启用，规则类型标签本地化
    - 设置与端口：新增多监听端口（listen-ports 自动应用、LAN 开关）；Clash API 密钥持久化，支持复制与手动重新生成
    - 仪表盘：卡片精简重排，新增运行时长/内存/延迟探测，配额条与节点名展示优化
    - 修复：内核自动模式下点击节点不再报 400——自动切回手动模式并重启内核（带加载提示）；订阅刷新后节点 ID 变化时自动重建内核；内核版本比对误报修复
    - 视觉：优化浅色主题表现. 修复一些 ui 抖动的问题
