  Key: ReleaseNotes
  Value: |-
    更新说明
    - 全新应用图标：薄荷绿发光「笑脸土星」深色圆角瓦片，三平台（macOS / Windows / Linux）全套替换
    - macOS 满幅适配：icns 继续走满幅深底 + 15% 自身圆角变体，macOS 26 Tahoe Dock 中无白边
    - 历史图标归档：土星环版与更早旧版全套图标归档进仓库（icon-saturn/、icon-legacy/），想回退随时可用
    下载指南
    - macOS Apple Silicon（M 系列） → aarch64.dmg
    - macOS Intel → x64.dmg
    - Windows 64 位 → x64-setup.exe
    - Linux 64 位 → amd64.AppImage
    根据你的系统和 CPU 架构选择对应安装包即可。
    macOS 如果提示「Satelite 已损坏，无法打开」，可在终端执行：
    sudo xattr -d com.apple.quarantine /Applications/Satelite.app
