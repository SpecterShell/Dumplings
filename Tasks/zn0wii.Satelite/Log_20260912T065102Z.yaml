Locale:
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    更新说明
    - 窗口自由放大：专业/简洁两种模式均可拖拽放大窗口（专业模式最小 960×720、简洁模式最小 320×480，均无上限），放大后 UI 按比例等比缩放、清晰度不受影响；窗口尺寸按模式分别记忆，托盘唤醒与下次启动直接一步到位显示目标大小，不再有拉大动画。
    - 新增 MASQUE 协议：mihomo 主内核原生支持（usque 风格 ECDSA 密钥，订阅与手动节点均可导入）；sing-box 主内核下未委托时自动过滤并提示。
    - 多核模式升级为三内核委托：协议钉选从仅 Xray 扩展为 Xray + mihomo 双列选择，任意可委托协议（hysteria2、masque 等）可经对应副进程出口；副进程独立看门狗、启动失败整体回滚，仪表盘多核卡片实时显示运行中的副内核。
    - 修复 Linux 闪退：Ubuntu 26.04 等 Wayland/NVIDIA 环境下 WebKitGTK 的 DMA-BUF 渲染器 EGL 初始化失败导致应用直接退出，现默认禁用该渲染器（Windows/macOS 不受影响）。
    - 其他：下拉框在滚动容器底部空间不足时自动向上弹出，修复内核选择下拉被遮挡的问题。
    下载指南
    - macOS Apple Silicon（M 系列） → aarch64.dmg
    - macOS Intel → x64.dmg
    - Windows 64 位 → x64-setup.exe
    - Linux 64 位 → amd64.AppImage
    根据你的系统和 CPU 架构选择对应安装包即可。
    macOS 如果提示「Satelite 已损坏，无法打开」，可在终端执行：
    sudo xattr -d com.apple.quarantine /Applications/Satelite.app
