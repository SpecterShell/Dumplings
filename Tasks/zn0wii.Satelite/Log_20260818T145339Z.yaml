- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    此版本主要修复，订阅转换 singbox 配置失败的 bug，之前有无法启动等情况的可以尝试下载试用
    - 订阅转换（clash → sing-box）：修复 SIP003 插件参数、alpn/hysteria 带宽单位/wireguard CIDR 等 4 处转换 bug，新增 shadow-tls 插件节点支持（独立 shadowtls outbound + detour），均对照参考实现校验并补充测试
    - 托盘图标：新增 danger/danger2/ghost2 三种风格，修复多个图标发光与面部细节
    - Dashboard 改版：首页卡片重做（合并流量/连接、嵌入迷你图、Mix 配额条），文案更简洁
    - UI 修复：主题启动闪烁、粒子球动画双重加速、导航栏 hover 滚动条闪烁、流量图显示应用连接数
