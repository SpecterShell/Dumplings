- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    更新说明
    - 智能切换引擎重构：每 20 秒主动巡检当前出口（快慢双档复核防误判），死出口秒级发现并验证式恢复切换（绝不凭 ping 上位），被动劣化感知 + 定时漂移校正自动择优
    - 引擎抗冻结加固：智能引擎改为监督式子任务循环——任何一轮卡死会被放弃并告警，引擎永不静默死亡；探测活动全程可见（日志 → 应用日志，target=smart_switch）
    - 启动即接管：应用带着智能模式启动代理时自动完成首次择优（此前需手动切换一次模式才生效）
    - 规则批量添加：匹配内容支持按行/空格分隔批量输入，按规则类型（域名/IP-CIDR/进程名）逐条校验并内联提示无效项
    - 界面细节：顶栏磨砂液体效果全标签统一；内核新版本检查改为仅手动触发，不再每次进页联网
    下载指南
    - macOS Apple Silicon（M 系列） → aarch64.dmg
    - macOS Intel → x64.dmg
    - Windows 64 位 → x64-setup.exe
    - Linux 64 位 → amd64.AppImage
    根据你的系统和 CPU 架构选择对应安装包即可。
    macOS 如果提示「Satelite 已损坏，无法打开」，可在终端执行：
    sudo xattr -d com.apple.quarantine /Applications/Satelite.app
