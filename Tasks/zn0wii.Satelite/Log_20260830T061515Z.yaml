  Key: ReleaseNotes
  Value: |-
    - 多核模式：sing-box 主内核旁可按协议钉选启动 Xray 副进程，指定协议的节点经本地回环委托转发，节点热切换、测速、连接页不受影响
    - 节点页：新增 TCP Ping 测试与「点选测速」开关（启用后点击节点即测该节点延迟并带绿框反馈）；列表/网格支持按订阅、协议、国家分组，组头可折叠，默认扁平分组
    - 稳定性：修复切换内核（尤其 mihomo 首次启动）时界面卡死——内核命令移出主线程；geodata/wintun 等运行时资源改为内核下载完成后立即预取，启动内核不再现场拉取
    - 智能切换：候选节点改用 TCP Ping 排序、URL 探测确认当前节点健康，避免「TCP 活但代理死」误判
    - 修复：订阅解析支持多文档 clash yaml；修复链路卡片菜单遮挡
    pro max 黑色主题谨慎使用
