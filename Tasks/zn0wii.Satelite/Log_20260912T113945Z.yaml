Locale:
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    更新说明
    - 修复：Windows 下打开设置页闪现命令行窗口：设置页自动检查内核更新时不再调用 reg.exe，改用系统注册表 API 直读，彻底消除黑窗闪现（v1.0.26 引入的回归）
    - 修复：托盘「复制环境变量」闪现命令行窗口：剪贴板改用系统 API 直写，并顺带修复经 clip.exe 控制台代码页转码可能导致的非英文字符乱码
    - 全新应用图标：由笑脸砖源图重新采样生成，各平台安装包图标统一更新
    - 文档更新：README 新增 Linux 安装说明与徽章等
    下载指南
    - macOS Apple Silicon（M 系列） → aarch64.dmg
    - macOS Intel → x64.dmg
    - Windows 64 位 → x64-setup.exe
    - Linux 64 位 → amd64.AppImage
    根据你的系统和 CPU 架构选择对应安装包即可。
    macOS 如果提示「Satelite 已损坏，无法打开」，可在终端执行：
    sudo xattr -d com.apple.quarantine /Applications/Satelite.app
