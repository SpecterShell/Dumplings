Version: 1.0.29
Installer:
- Architecture: x64
  InstallerType: nullsoft
  InstallerUrl: https://github.com/zn0wii/satelite-proxy/releases/download/v1.0.29/Satelite_1.0.29_x64-setup.exe
Locale:
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    更新说明
    - 规则集「指定」支持多选节点：勾 2 个以上自动组成节点池，自动择优、故障切换（三内核通用）
    - 编辑规则集弹窗重排：单列布局，普通目标显示满宽居中说明框；没改动时保存按钮置灰
    - 节点选择体验：网格 + 复选框 + 选中置顶 + 悬停看节点详情
    - 每规则集可单独设 DNS 解析策略
    - 内置 sing-box 版本标记修正为 1.13.18
    下载指南
    - macOS Apple Silicon（M 系列） → aarch64.dmg
    - macOS Intel → x64.dmg
    - Windows 64 位 → x64-setup.exe
    - Linux 64 位 → amd64.AppImage
    根据你的系统和 CPU 架构选择对应安装包即可。
    macOS 如果提示「Satelite 已损坏，无法打开」，可在终端执行：
    sudo xattr -d com.apple.quarantine /Applications/Satelite.app
