- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新增
    - 新增个人在线歌单，支持创建、查看和管理歌单。
    - 新增个人收藏功能，支持收藏与取消收藏。
    - 支持将在线歌曲添加到个人在线歌单。
    - 远程播放队列支持单项移除、清空队列，以及移除当前歌曲后继续播放。
    - 为本地音乐和在线音乐添加“添加到歌单”的快捷按钮。
    修复
    - 修复在线歌单点击歌曲或播放全部时，播放顺序与当前列表不一致的问题。
    - 修复在线收藏歌单的收藏状态与实际内容不同步的问题。
    - 修复在线歌词滚动、行切换和逐字高亮与本地歌词动画效果不一致的问题。
    - 修复清空播放队列后，BASS 失效句柄导致暂停操作崩溃的问题。
    - 修复远程歌词行切换依赖离散采样导致的延迟问题。
    - 修复在线歌词与本地歌词使用不同播放位置造成的逐词高亮偏移。
    - 修复播放页在线歌词缺少本地歌词设置入口的问题。
    - 修复 offset 负值跨越零点后产生非法时间戳的问题。
    优化
    - 音质不可用时自动降级播放，同时保留用户选择的音质，后续可自动恢复。
    - 优化播放页本地与在线队列的切换逻辑，空在线队列时隐藏无效操作。
    - 统一在线歌单与本地歌单的详情页交互，支持搜索、排序和列表视图切换。
    - 优化在线队列移除按钮的样式与显示方式，鼠标悬停时显示操作按钮。
    - 优化在线歌单与本地歌单的格式样式。
