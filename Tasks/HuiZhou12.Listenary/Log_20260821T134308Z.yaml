- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新增
    - 在线播放支持音质选择
    - 在线队列支持排序，以及顺序 、 单曲 、随机播放模式
    - 在线队列支持单项移除与一键清空
    修复
    - 修复数据目录与 Pure Music 冲突导致初始化被跳过：数据目录改为 %LOCALAPPDATA%\Listenary（绿色版为 exe 旁
      ListenaryData/），原 pure_music 数据需手动迁移（一定要看着这里！如果不迁移，安装版覆盖安装以后用户数据会检测不到！！！）
    - 修复在线封面因 CDN 拦截默认 User-Agent 而无法加载
    - 修复歌词切换不准确的问题
    - 修复切换页面时旧页面残留导致的卡顿
    优化
    - 音乐封面持久化，减少重复请求与加载等待（不消耗额度）
    - 优化侧边栏展开以及收起流畅度
