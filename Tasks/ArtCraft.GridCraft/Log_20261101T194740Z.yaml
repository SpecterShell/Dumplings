  Key: ReleaseNotes
  Value: |-
    What's Changed
    - Updates: shared check-result dialog from craft-update by @aiongg in https://github.com/storytold/gridcraft/pull/3013
    - docs: tidy agent, contributor and asset docs by @aiongg in https://github.com/storytold/gridcraft/pull/3012
    - Make the Merge & Center ribbon label part of its split button by @Silvertree2010 in https://github.com/storytold/gridcraft/pull/3024
    - Match Excel for YEARFRAC basis 0, MOD, NUMBERVALUE and PERCENTRANK edge cases by @Harrison-Booth in https://github.com/storytold/gridcraft/pull/2657
    - xlsx: _xlfn. prefix for STOCKHISTORY, TRANSLATE, DETECTLANGUAGE by @Harrison-Booth in https://github.com/storytold/gridcraft/pull/2793
    - MOD: match Excel large quotient limit by @Harrison-Booth in https://github.com/storytold/gridcraft/pull/2979
    - PERCENTRANK: match Excel significance limits by @Harrison-Booth in https://github.com/storytold/gridcraft/pull/2980
    - packaging(flatpak): add OCI image build and GHCR publishing helper by @dylanmtaylor in https://github.com/storytold/gridcraft/pull/3063
    - macOS: Intel Macs skip wgpu's indirect-call validation shaders (fixes #2812) by @vioreltus in https://github.com/storytold/gridcraft/pull/3039
    - File view: Esc leaves the text field before closing by @Zarvinx in https://github.com/storytold/gridcraft/pull/3050
    - Read cell formatting from .xls files by @Harrison-Booth in https://github.com/storytold/gridcraft/pull/2495
    - calc: form MAP's result size in u64 so wasm32 cannot wrap the MAX_CELLS cap (#2165) by @maxm11 in https://github.com/storytold/gridcraft/pull/3038
    - fix(ui): refuse a locked cell's edit before a draft blocks Save (#2945) by @maxm11 in https://github.com/storytold/gridcraft/pull/3040
    - Ribbon: each window keeps its own tab, so Table Design stays active (#2903) by @maxm11 in https://github.com/storytold/gridcraft/pull/3041
    - range.setValues: report the strings typed input read, and clear "" with parse: false (#2255) by @maxm11 in https://github.com/storytold/gridcraft/pull/3042
    - CSV and text open detect each column's date order (#2765) by @maxm11 in https://github.com/storytold/gridcraft/pull/3043
    - XLS: keep font family and charset when importing fonts (follow-up to #2495) by @daniellubryka in https://github.com/storytold/gridcraft/pull/3052
    - xlsx: keep the workbook view settings (sheet tabs, scroll bars, tab ratio) across an open + save (#3057) by @scks1 in https://github.com/storytold/gridcraft/pull/3062
    - #2871: open Google Sheets' DUMMYFUNCTION export wrapper as the original formula by @hsmith-dev in https://github.com/storytold/gridcraft/pull/3075
    - #2964: Alt, H, B opens the Borders menu with its item letters by @hsmith-dev in https://github.com/storytold/gridcraft/pull/3077
    - fix(quit): bring the asking window to the front on a Dock quit by @aiongg in https://github.com/storytold/gridcraft/pull/3083
    - Undo and redo keep each sheet's view (Normal, Page Layout, Page Break Preview) by @prxnvt in https://github.com/storytold/gridcraft/pull/2597
    - UI: Formulas › Function Library as labelled buttons with category menus; Recently Used and Insert Function categories by @prxnvt in https://github.com/storytold/gridcraft/pull/467
