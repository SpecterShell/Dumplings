  Key: ReleaseNotes
  Value: |-
    What's Changed
    - Reject unknown value-field func in insert.pivotTable by @Silvertree2010 in https://github.com/storytold/gridcraft/pull/1757
    - Fonts: probe ChromeOS's /usr/share/fonts/chromeos for script fallbacks (fixes #1762) by @dantebertuzzi in https://github.com/storytold/gridcraft/pull/1768
    - Conditional formatting: show a rule's number format (fixes #1163) by @dantebertuzzi in https://github.com/storytold/gridcraft/pull/1769
    - Fix MEDIAN overflow for large finite middle values by @MMexicann in https://github.com/storytold/gridcraft/pull/1585
    - ci: configure Dependabot for Cargo and GitHub Actions by @dylanmtaylor in https://github.com/storytold/gridcraft/pull/1872
    - docs: add SonarCloud and CodeRabbit badges to README by @dylanmtaylor in https://github.com/storytold/gridcraft/pull/1860
    - #1447: TRUE/FALSE or error values in a pivot source no longer make the file unopenable by @Higgs32584 in https://github.com/storytold/gridcraft/pull/1814
    - Translate the cell and header context menus into German (#1830) by @MarekSpodBiedry in https://github.com/storytold/gridcraft/pull/1845
    - #1528: a formula's references are outlined only on the sheet they belong to by @HyakoV3 in https://github.com/storytold/gridcraft/pull/1866
    - #1808: file.open can keep every CSV/TSV field as text by @HyakoV3 in https://github.com/storytold/gridcraft/pull/1867
    - ui: let an embedding host turn off the title bar and File tab by @rdexel in https://github.com/storytold/gridcraft/pull/1877
    - Hide blank and text rows for numeric ordering custom filters by @Silvertree2010 in https://github.com/storytold/gridcraft/pull/1879
    - fix(xlsx): read and write PivotTable grand totals in Excel's direction by @neilcawse in https://github.com/storytold/gridcraft/pull/1882
    - i18n: French and Serbian Options headings and Sheet Options “View” without the context prefix (#1891) by @vedran-dobos in https://github.com/storytold/gridcraft/pull/1892
    - Keytips: letters typed with Alt held continue the sequence (fixes #1846) by @Shnrqpdr in https://github.com/storytold/gridcraft/pull/1902
    - #1855: Backspace then Enter is one undo step; redo selects the redone cell by @justinjohn0306 in https://github.com/storytold/gridcraft/pull/1903
    - Pan the grid on a one-finger touch drag instead of selecting by @Silvertree2010 in https://github.com/storytold/gridcraft/pull/1910
    - Reuse one D-Bus session connection in the desktop theme watcher by @Silvertree2010 in https://github.com/storytold/gridcraft/pull/1916
    - fix(edit): Ctrl+Enter gives each cell the number format typing gives it (#1919) by @vedran-dobos in https://github.com/storytold/gridcraft/pull/1920
    - Reject signed and multi-$ whole-row ranges in RangeRef::parse by @Silvertree2010 in https://github.com/storytold/gridcraft/pull/1922
    - Fix two clippy lints new in Rust 1.95 by @DrM7md in https://github.com/storytold/gridcraft/pull/1923
    - Keyboard: Ctrl+Shift+= and Ctrl+- act on whole rows and columns at once by @DrM7md in https://github.com/storytold/gridcraft/pull/1925
    - Grid: explicit Left/Right alignment keeps its side on a right-to-left… by @DrM7md in https://github.com/storytold/gridcraft/pull/1926
    - Names: count characters, not bytes, in the 255-character name limit by @Mouhand-Kaddo in https://github.com/storytold/gridcraft/pull/1934
    - XLSX: keep right-to-left paragraph direction in text boxes and shapes by @Mouhand-Kaddo in https://github.com/storytold/gridcraft/pull/1935
    - HTML export and copy: keep right-to-left sheets and Arabic text direction by @Mouhand-Kaddo in https://github.com/storytold/gridcraft/pull/1938
    - XLS import: read WINDOW2 so right-to-left sheets open right-to-left by @Mouhand-Kaddo in https://github.com/storytold/gridcraft/pull/1939
    - Search from the end for negative TEXTBEFORE/TEXTAFTER instances by @Silvertree2010 in https://github.com/storytold/gridcraft/pull/1941
    - Tables: limit table names to 255 characters, counted as characters by @Mouhand-Kaddo in https://github.com/storytold/gridcraft/pull/1943
    - XLS: skip dialog sheets instead of importing them as worksheets by @Mouhand-Kaddo in https://github.com/storytold/gridcraft/pull/1947
    - Outline: + shows zero-width hidden columns at the default width (fixes #1714) by @HaSh3003 in https://github.com/storytold/gridcraft/pull/1965
    - docs: drop references to competing commercial software by @dylanmtaylor in https://github.com/storytold/gridcraft/pull/1828
