    - Cap CSV import fields per record at the worksheet column limit (#1037) by @MarekSpodBiedry in https://github.com/storytold/gridcraft/pull/1115
    - Fix table without header: re-point references when the data moves down (#1030) by @MarekSpodBiedry in https://github.com/storytold/gridcraft/pull/1117
    - Fix xlsx: combine escaped UTF-16 surrogate pairs when decoding strings (#1025) by @MarekSpodBiedry in https://github.com/storytold/gridcraft/pull/1119
    - Open notice: do not promise to keep macros that were dropped (#1024) by @MarekSpodBiedry in https://github.com/storytold/gridcraft/pull/1120
    - Grid: per-frame work no longer scales with the whole sheet (#1098) by @vangel76 in https://github.com/storytold/gridcraft/pull/1136
    - Charts: a huge trendline forecast no longer collapses the chart (#1148) by @vangel76 in https://github.com/storytold/gridcraft/pull/1151
    - XLSX: [Content_Types].xml is the first zip entry, workbook parts precede document properties, so libmagic detects the file type (#1090) by @vangel76 in https://github.com/storytold/gridcraft/pull/1156
    - fix(ui): menu items highlight under the pointer (#1174) by @richard1912 in https://github.com/storytold/gridcraft/pull/1180
    - fix(ui): ribbon tooltips show each platform's shortcuts (Ctrl+B on Windows, ⌘B on macOS) (#1191) by @richard1912 in https://github.com/storytold/gridcraft/pull/1194
    - Grid: an armed Format Painter pastes onto the next cells clicked or dragged by @marcoarnulfo in https://github.com/storytold/gridcraft/pull/1214
    - File: Save a Copy asks where to save a bare name instead of writing it to the working directory by @marcoarnulfo in https://github.com/storytold/gridcraft/pull/1215
    - Sheet tabs: right-clicking a tab activates its sheet by @richard1912 in https://github.com/storytold/gridcraft/pull/1223
    - XLSX: keep a dxf's protection, font size and face, and the font parts it turns off by @marcoarnulfo in https://github.com/storytold/gridcraft/pull/1225
    - Journal: cap by serialized size and keep a recording's start through trims by @marcoarnulfo in https://github.com/storytold/gridcraft/pull/1230
    - Fix native CJK fallback paths in Flatpak by @allenyllee in https://github.com/storytold/gridcraft/pull/1236
    - BAHTTEXT: a final one after the millions reads เอ็ด by @marcoarnulfo in https://github.com/storytold/gridcraft/pull/1237
    - Opening an XLSX with a part over 512 MB says how to get the data in by @marcoarnulfo in https://github.com/storytold/gridcraft/pull/1248
    - Headers: mark hidden columns and rows, split cursor and double-click to unhide (#1247) by @richard1912 in https://github.com/storytold/gridcraft/pull/1249
    - Dialogs move by their title bar instead of staying pinned to the centre by @marcoarnulfo in https://github.com/storytold/gridcraft/pull/1252
    - Bound Undo history growth after bulk edits by @derechopiano in https://github.com/storytold/gridcraft/pull/1263
    - Zoom dialog: Excel's layout, current zoom pre-selected, Fit selection (#930) by @richard1912 in https://github.com/storytold/gridcraft/pull/1277
    - N() converts a computed array element by element, so it works inside SUMPRODUCT by @marcoarnulfo in https://github.com/storytold/gridcraft/pull/1281
    - Sort: a Sheet! prefix on the range sorts that sheet, not the active one by @marcoarnulfo in https://github.com/storytold/gridcraft/pull/1284
    - Remove Duplicates, Filter and Subtotal: a Sheet! prefix on the range works on that sheet, not the active one by @marcoarnulfo in https://github.com/storytold/gridcraft/pull/1285
    - Preserve hyperlinks in PDF export and support PDF in CLI convert by @derechopiano in https://github.com/storytold/gridcraft/pull/1292
    - Filter: count empty text and ="" results as (Blanks) (#1294) by @MarekSpodBiedry in https://github.com/storytold/gridcraft/pull/1299
    - Show dynamic array source formulas read-only in spill cells by @Prachannagven in https://github.com/storytold/gridcraft/pull/1306
    - engine: refuse removeDuplicates with no valid column instead of deleting all rows by @midasmatterhorn in https://github.com/storytold/gridcraft/pull/1308
    - Reject a list data validation that has no formula1 (#1303) by @MarekSpodBiedry in https://github.com/storytold/gridcraft/pull/1326
    - Slicer: find a named table on any sheet by @dev-exe in https://github.com/storytold/gridcraft/pull/1329
    - Form dialogs open ready to type (Column Width, Row Height) by @Harrison-Booth in https://github.com/storytold/gridcraft/pull/1331
    - Edit: text that would parse as a number or formula keeps its quote prefix in the editor (#1362) by @vangel76 in https://github.com/storytold/gridcraft/pull/1372
    - perf: fill-handle double-click scans a dense neighbour column ~2.4x faster by @Dejan-Port in https://github.com/storytold/gridcraft/pull/451
    - Build: the ui-egui build script reads CARGO_MANIFEST_DIR when it runs by @prxnvt in https://github.com/storytold/gridcraft/pull/488
    - Refuse inserting cells that would push values off the worksheet (#580) by @MarekSpodBiedry in https://github.com/storytold/gridcraft/pull/584
    - Make check --json list warning messages instead of a count (#526) by @MarekSpodBiedry in https://github.com/storytold/gridcraft/pull/629
