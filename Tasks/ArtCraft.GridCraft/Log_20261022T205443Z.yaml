    - Names: a name over several ranges reads its top-level commas as unions by @marcoarnulfo in https://github.com/storytold/gridcraft/pull/759
    - i18n: test that translations keep the shape of their English by @bmh129 in https://github.com/storytold/gridcraft/pull/831
    - Closing the window asks to save unsaved workbooks by @marcoarnulfo in https://github.com/storytold/gridcraft/pull/846
    - Conditional formats: hex colours in a custom style, and no more silently empty or never-matching rules by @CouchRiv in https://github.com/storytold/gridcraft/pull/884
