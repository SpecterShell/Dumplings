  Value: |-
    What's Changed
    - Trace arrows stay on the traced cell when the selection moves by @marcoarnulfo in https://github.com/storytold/gridcraft/pull/2481
    - Make the Row Height dialog use points like Excel by @Silvertree2010 in https://github.com/storytold/gridcraft/pull/2524
    - Return None from datetime_from_serial when rounding carries past 9999 by @Silvertree2010 in https://github.com/storytold/gridcraft/pull/2528
    - Keep

      on every body-font font on save by @Silvertree2010 in https://github.com/storytold/gridcraft/pull/2557
    - Fix PERCENTRANK returning #NUM! for very large significance by @Silvertree2010 in https://github.com/storytold/gridcraft/pull/2417
    - Scale MINVERSE rounding cutoff to the input matrix by @Silvertree2010 in https://github.com/storytold/gridcraft/pull/2428
    - Fix ISOWEEKNUM/WEEKNUM(…,21) for the first days of the calendar by @Silvertree2010 in https://github.com/storytold/gridcraft/pull/2443
    - web: let an iframe host turn off the title bar and File tab from the URL (?chrome=) by @OdooPudakMachinery in https://github.com/storytold/gridcraft/pull/2444
    - Fix IMSQRT leaving a stray real part for negative reals by @Silvertree2010 in https://github.com/storytold/gridcraft/pull/2457
    - Fix YEARFRAC basis 0 for February-end start and 31st end by @Silvertree2010 in https://github.com/storytold/gridcraft/pull/2463
    - Fix parsing of ranges whose second end repeats the sheet name by @Silvertree2010 in https://github.com/storytold/gridcraft/pull/2473
    - Options > Formulas: Maximum Iterations and Maximum Change fields by @Harrison-Booth in https://github.com/storytold/gridcraft/pull/2493
