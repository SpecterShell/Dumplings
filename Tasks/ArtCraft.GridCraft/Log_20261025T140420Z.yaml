    - Conditional formatting: New Rule's formula box takes references clicked or dragged on the grid (#2348) by @marcoarnulfo in https://github.com/storytold/gridcraft/pull/2388
    - Calc: INDEX with one index on a 2-D reference is #REF!, as in Excel by @Harrison-Booth in https://github.com/storytold/gridcraft/pull/2392
    - Accuracy: PMT to Excel's last bits via ln_1p/exp_m1 by @Harrison-Booth in https://github.com/storytold/gridcraft/pull/2393
