    - M2.9: bound print/export/autofit work in the engine by @dylanmtaylor in https://github.com/storytold/gridcraft/pull/2416
    - M2.9: harden native file open/save by @dylanmtaylor in https://github.com/storytold/gridcraft/pull/2418
    - M2.9: close protection gaps a trusted script or other sheet would slip through by @dylanmtaylor in https://github.com/storytold/gridcraft/pull/2420
    - M6: misc hardening sweep (findings 0, 5, 7, 11, 12, 23, 26) by @dylanmtaylor in https://github.com/storytold/gridcraft/pull/2422
    - M7: enforce Agile encryption dataIntegrity (finding 1) by @dylanmtaylor in https://github.com/storytold/gridcraft/pull/2425
    - UI: theme tokens with a contrast test, ribbon overflow arrows and split button, multi-line formula bar, code editor widget by @prxnvt in https://github.com/storytold/gridcraft/pull/456
    - Merge 18 open PRs (tested batch) by @aiongg in https://github.com/storytold/gridcraft/pull/2538
    - docs: Different First Page and Different Odd & Even Pages are no longer listed as missing by @dotCooCoo in https://github.com/storytold/gridcraft/pull/2486
    - Error Checking: its arrow opens a Circular References submenu listing a cell on each loop by @dotCooCoo in https://github.com/storytold/gridcraft/pull/2501
    - Charts: 100% Stacked Area draws each value as a share of its category's total by @dotCooCoo in https://github.com/storytold/gridcraft/pull/2522
    - Ribbon: Insert › Column or Bar offers 100% Stacked Bar by @dotCooCoo in https://github.com/storytold/gridcraft/pull/2525
