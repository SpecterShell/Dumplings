  Key: ReleaseNotes
  Value: |-
    What's Changed
    - Romanian: translate Options|Editing and 22 newer strings by @vioreltus in https://github.com/storytold/gridcraft/pull/2233
    - Keep '!' in structured-reference columns intact on XLSX save by @Silvertree2010 in https://github.com/storytold/gridcraft/pull/2244
    - ui: a too-wide number in a repeat-fill format shows #### by @pick2510 in https://github.com/storytold/gridcraft/pull/2260
    - run --script: a line's unknown key stops the run (#2256) by @Hamza0101 in https://github.com/storytold/gridcraft/pull/2266
    - Snapshot: catalog installed fonts before rendering by @pick2510 in https://github.com/storytold/gridcraft/pull/2275
    - Print numbers near f64::MAX in a form that parses back by @Silvertree2010 in https://github.com/storytold/gridcraft/pull/2289
    - Add extra Japanese translations for UI elements by @coolvitto in https://github.com/storytold/gridcraft/pull/2292
    - Tables: Format as Table inside a table restyles it by @dfendr in https://github.com/storytold/gridcraft/pull/2295
    - Hyperlinks: Ctrl+click on a link follows it instead of extending the selection (#1198) by @xc4pr in https://github.com/storytold/gridcraft/pull/2314
    - Page Up into frozen rows scrolls the rows below back to the top by @RedBearAK in https://github.com/storytold/gridcraft/pull/2357
    - Treat empty instance_num in TEXTBEFORE/TEXTAFTER as 1 by @Silvertree2010 in https://github.com/storytold/gridcraft/pull/2245
    - range.setValues: parse: false stores a string as the text it is (#2255) by @Hamza0101 in https://github.com/storytold/gridcraft/pull/2267
    - view: Show Outline Symbols (Ctrl+8), read and written by @pick2510 in https://github.com/storytold/gridcraft/pull/2274
    - Hardening: overlong digits, NaN lookup indexes, bounded REGEXREPLACE (#2163, #2162) by @tyrel in https://github.com/storytold/gridcraft/pull/2279
    - Fill handle: Auto Fill Options button after a drag offers Copy Cells, Fill Series and the formatting modes (#1403) by @xc4pr in https://github.com/storytold/gridcraft/pull/2315
    - packaging: shell, PowerShell and web page fixes (SonarCloud S7688, S7679, S7682, S8677, S7926) by @dylanmtaylor in https://github.com/storytold/gridcraft/pull/2323
    - Use chrono instead of hand-rolled UTC conversion by @dylanmtaylor in https://github.com/storytold/gridcraft/pull/2121
    - CI: one test binary per crate, nextest, line tables only by @aiongg in https://github.com/storytold/gridcraft/pull/2372
    - Packaging: pin the signing client and appimagetool, and check their hashes by @aiongg in https://github.com/storytold/gridcraft/pull/2073
    - Grid: #### fits its cell in every font by @aiongg in https://github.com/storytold/gridcraft/pull/2378
    - CI: shared gate workflow; FreeBSD nightly and on release by @aiongg in https://github.com/storytold/gridcraft/pull/2338
    - CI: the gate builds with the release craft-fonts pin by @aiongg in https://github.com/storytold/gridcraft/pull/2381
    - i18n: missing translations are reported, never a failure by @aiongg in https://github.com/storytold/gridcraft/pull/2383
    - Keep the in-cell editor wide enough for the next character at high zoom (#2336) by @MarekSpodBiedry in https://github.com/storytold/gridcraft/pull/2366
    - AutoFilter: grow the range when a value is entered in the row below it (#2342) by @MarekSpodBiedry in https://github.com/storytold/gridcraft/pull/2367
    - Ribbon: fall back to Home when the active contextual tab is gone by @marcoarnulfo in https://github.com/storytold/gridcraft/pull/2369
    - Ctrl+Alt+click on a link extends the selection; Auto Fill Options button checked in screen space on right-to-left sheets (#2368) by @xc4pr in https://github.com/storytold/gridcraft/pull/2375
    - PivotTables: Show Details, double-click a value cell to list its source records on a new sheet (#2364) by @marcoarnulfo in https://github.com/storytold/gridcraft/pull/2386
    - Fix MOD returning wrong sign and magnitude for tiny divisors by @Silvertree2010 in https://github.com/storytold/gridcraft/pull/2387
