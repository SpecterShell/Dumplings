    - Fill handle: Fill Days, Fill Weekdays, Fill Months and Fill Years for a date by @dotCooCoo in https://github.com/storytold/gridcraft/pull/2456
    - PivotTables: Enable show details turns Show Details off for a PivotTable by @dotCooCoo in https://github.com/storytold/gridcraft/pull/2461
    - PivotTables: right-clicking a value cell offers Show Details in the cell menu by @dotCooCoo in https://github.com/storytold/gridcraft/pull/2467
    - Sheet tabs: drag the handle at the scrollbar's left edge to give the tabs more or less room by @dotCooCoo in https://github.com/storytold/gridcraft/pull/2477
    - Outline: Settings puts summary rows above and summary columns left of their detail by @dotCooCoo in https://github.com/storytold/gridcraft/pull/2482
    - Headers and footers: printing follows the Scale with Document and Align with Page Margins check boxes by @dotCooCoo in https://github.com/storytold/gridcraft/pull/2488
    - Circular references: Error Checking and the status bar quote sheet names that need quotes by @dotCooCoo in https://github.com/storytold/gridcraft/pull/2504
    - Status bar: Circular References names a cell only when a loop is on the active sheet by @dotCooCoo in https://github.com/storytold/gridcraft/pull/2510
    - Paste Name and Go To: follow-ups from the batch review by @aiongg in https://github.com/storytold/gridcraft/pull/2540
