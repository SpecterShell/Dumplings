  Key: ReleaseNotes
  Value: |-
    New Features
    Replace with padding
    It is now possible to specify padding for replace patterns (used in Replace, Replace All and Replace in Files commands). When found match is longer than the replace pattern, it will be padded with a given byte either on the right or on the left, keeping the original file size unchanged. This might be useful in certain scenarios.
    Bug Fixes
    Open file command does not work in Find in Files
    A regression in Find in Files tool window prevented opening the result files in the editor. Fixed.
