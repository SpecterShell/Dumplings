  Key: ReleaseNotes
  Value: |-
    新增：
    - 标签栏新增主题化自绘横向滚动条，收紧标签与按钮间距
    - 新增高亮块，支持自定义颜色与可选图标
    - 新增分栏卡片，支持自由设置栏数与拖动调整栏宽
    - 单击块拖拽把手整块选中该块
    - 可视化模式选区增强，完整选中的块整体显示底板
    - 以主题化输入弹窗替代浏览器原生 prompt，网络图片支持实时预览
    - 斜杠命令支持按语言直接插入代码块（/java、/py 等）并联想提示
    - 可视化模式渲染块级 HTML，支持插入 HTML 块并放开网络图片
    修复：
    - dompurify 单独分块，避免入口静态加载 mermaid 与 excalidraw
    - 修复段落内 与 在可视化模式中被整段丢弃
    - 修复可视化代码块无语法高亮，合并重复的 Shell/Bash 语言项
    优化：
    - 入口 CSS 预算上调至 160 KiB
    - update star history
