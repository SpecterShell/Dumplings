Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Improvement: added automatic detection of junctions or symbolic links used for the slash folder
    - Improvement: added support for WebAuthn redirection in RDP sessions, allowing Windows Hello requests to be redirected to the local computer
    - Improvement: updated the embedded Xorg server to its latest version
    - Improvement: updated the embedded PuTTY-based terminal to its latest version
    - Improvement: updated the embedded OpenSSL library to its latest version
    - Improvement: updated the embedded OpenSSH command to its latest version
    - Improvement: added support for Ctrl+Mouse Wheel events in VNC sessions
    - Improvement: added support for keyboard shortcuts in VNC sessions using combinations of Ctrl, Alt, Shift, Win, and/or standard keys
    - Improvement: automatically adapts the VNC session size after the remote desktop resolution is changed
    - Improvement: improved copy-and-paste operations in VNC sessions
    - Improvement: added support for new VNC encodings: Tight, Hextile, RRE, and TRLE
    - Improvement: added support for new VNC authentication methods: Tight, SASL, UltraVNC, and MsLogon2
    - Improvement: added several enhancements to VNC sessions for better performance and compatibility with specific remote servers
    - Improvement: in SFTP sessions, files can now be dragged directly from the remote server into a subfolder in the local file browser on the left
    - Improvement: prevented MobaXterm from searching for translation files in the installation folder
    - Improvement: added an option in the Customizer to disable all local terminals, including CygUtils and WSL
    - Improvement: added an option in the Customizer to disable the MobaXterm debug log
    - Improvement: assigned the main icon to the main window class to prevent an empty icon from appearing in the Windows taskbar
    - Improvement: improved startup speed by preventing MobaXterm from searching for files that are no longer needed
    - Improvement: added a verification step to ensure that the CygUtils file has not been altered before it is unpacked
    - Improvement: restricted permissions for the installation folder
    - Improvement: prevented MobaXterm from attempting to load the "winsta.dll" file at startup
    - Bugfix: fixed an issue where the mouse wheel did not work properly in a VNC session displayed on a secondary monitor
    - Bugfix: prevented VNC sessions from locking the clipboard
    - Bugfix: prevented the "ssh -legacy" command from failing when the server offered an "ssh-rsa" host key
    - Bugfix: properly handled the "DesktopSize" encoding in VNC sessions
    - Bugfix: removed an error message that could appear when exiting MobaXterm while the "View" menu was still open
    - Bugfix: prevented unexpected word wrapping in the "View" menu title
ReleaseTime: 2026-09-11
RealVersion: 26.5.0.5542
