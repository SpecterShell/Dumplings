Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - New feature: added a new 64-bit RDP engine for faster remote desktop sessions
    - New feature: added a new IME composition tool for terminal sessions
    - Improvement: improved support of the "RemoteGuard" RDP option with the new RDP engine
    - Improvement: added support for the "PublicMode" setting in the new RDP engine
    - Improvement: improved compatibility with new versions of RDP servers with the new RDP engine
    - Improvement: the new IME composition window is now displayed directly inside terminal sessions
    - Improvement: properly handle the backspace key in the new IME composition window
    - Improvement: changed the order of the executable main icon for better compatibility with Citrix
    - Improvement: added automatic detection of multi-line PAM prompts in SSH and SFTP sessions
    - Improvement: added automatic detection of URLs in SSH and SFTP session prompts
    - Improvement: the SSH browser follows the current terminal path even when the browser tab is hidden
    - Improvement: the "_Username_" variable in the custom persistent root folder will be translated into the current user name
    - Improvement: ensure that all terminal sessions are properly notified when the keyboard layout changes
    - Improvement: suppressed a first-time startup window in browser sessions that use the Firefox engine
    - Improvement: updated the embedded OpenSSL library to its latest version
    - Improvement: updated the embedded OpenSSH command to its latest version
    - Improvement: updated the embedded X server based on Xorg to its latest version
    - Bugfix: after reconnecting an RDP session, the corresponding tab title is no longer displayed in red
    - Bugfix: the startup macro now remains attached to the session when duplicating it
    - Bugfix: on some Windows 7 Pro computers, the tab titles were hidden
ReleaseTime: 2026-10-25
RealVersion: 26.6.0.5560
