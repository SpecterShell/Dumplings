  Value: |-
    Octans v1.2.1 — 鸽鸽电竞 雀 98 & Bytech 916/8815 无线键盘适配
    新增支持与修复
    - 鸽鸽电竞（Dovetek）雀 98（回应 Issue #1）：
      - 2.4G 接收器（VID 0x258A / PID 0x0150，0xFF02:0x0002 20B Output Report 0x13）
      - 有线模式（带屏版 258A:01B7、无屏版 258A:01C0，520B Feature Report 0x09 0x87）
    - 同平台 Bytech 916 / 8815 三模键盘同步覆盖：
      - VGN V98Pro V3 / V87 V2 / N75 V2 / V108、RK M87 / R98Pro V2（258A:0233）、GravaStar（379A:A002/A006/A009）等。
    - 兼容性增强：
      - 解除 VAR_KB_MCHOSE_BY 对 20B 0xFF02:0x0002 无线键盘的 VID 白名单限制，自动依次兼容 13 4A 01 ... 5E / 13 CA ... DD / khub916 帧格式，并过滤请求回显帧。
      - 修复 Bytech 916 充电/满电半字节标志解析（0x10 充电、0x11 满电）。
    质量与体量验证
