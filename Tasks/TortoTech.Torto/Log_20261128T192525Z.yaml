- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Feature
    - Support importing TXT and LIT ebooks on desktop and mobile.
    - Support using Tab in classic reading mode to open the chat panel and switch focus between the page and chat input. — by @Catapult291, #145
    - Add a Quote (@) button (and Tab shortcut) to the desktop text selection toolbar to send selected passages directly to chat.
    Improvement
    - Keep classic scroll text stationary when toggling the left sidebar. — by @Catapult291, #144
    - Keep your reading position steady when resizing the window or changing typography settings.
    - Redesign the reader font picker with separate tabs for primary, secondary, and code fonts.
    - Separate interface themes from reading page themes so you can customize them independently.
    - Improve AI layout accuracy and chart visualization for tables, passages, and illustrated pages.
    - Improve EPUB formatting for floating elements, book covers, tables, and footnotes.
    - Polish mobile reading experience, including focus-mode chat, page-turn animations, text selection menus, and footnote popups.
    - Make cross-device sync progress and macOS update status clearer.
    Fix
    - Fix an issue where pasting text or images could crash the app on Windows. — by @Catapult291, #145
    - Fix an issue where long English paragraphs sometimes failed to hyphenate properly.
    - Fix duplicate footnote numbers and stray page markers appearing in translated text.
    - Fix repeated cross-device reading progress notifications.
    - Fix shortcut label alignment on macOS and menu overlay shading over window buttons on Windows.
    Full Changelog
