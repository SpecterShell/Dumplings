- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    中文更新说明
    Feature
    - 桌面端与移动端支持导入 TXT 和 LIT 格式电子书。
    - 经典阅读模式支持按 Tab 键快速打开对话栏，并在正文与输入框之间切换焦点。——感谢 @Catapult291，PR #145
    - 桌面端划选工具栏新增引用（@）按钮（支持按 Tab 键），可将选中内容一键发送到对话中。
    Improvement
    - 经典滚动模式下开关左侧栏时，正文保持静止不跳动。——感谢 @Catapult291，PR #144
    - 调整窗口大小或修改排版设置时，保持当前阅读位置不跳动。
    - 升级阅读器字体选择面板，支持分别设置主要字体、次要字体与代码字体。
    - 将界面主题与阅读页主题拆分，支持独立搭配。
    - 提升 AI 排版与图表可视化效果，更好处理表格、段落与图文混排页面。
    - 优化 EPUB 电子书的浮动元素、封面、表格与脚注显示效果。
    - 优化移动端专注模式对话、翻页动画、划选浮层与脚注弹窗体验。
    - 同步进度与 macOS 更新状态提示更加清晰。
    Fix
    - 修复 Windows 端粘贴文字或图片时可能闪退的问题。——感谢 @Catapult291，PR #145
    - 修复英文长段落偶尔无法正常断词换行的问题。
    - 修复翻译结果中脚注序号重复或混入页码标记的问题。
    - 修复跨设备阅读进度提示重复弹出的问题。
    - 修复 macOS 快捷键设置标题未垂直居中，以及 Windows 阅读页菜单遮罩未覆盖窗口按钮的问题。
    完整更新记录
