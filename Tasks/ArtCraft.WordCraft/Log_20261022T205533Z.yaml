    - formats: the Markdown code fence outgrows any backtick run in its content, so a round trip keeps it by @midasmatterhorn in https://github.com/storytold/wordcraft/pull/1788
    - Layout: paragraph borders take their room and same-bordered paragraphs join in one shaded box by @dfgodvan in https://github.com/storytold/wordcraft/pull/1800
    - test(layout): verify Farsi Yeh joins correctly in bidi shaping by @asmodeus-oos in https://github.com/storytold/wordcraft/pull/1831
    - test(zotero): verify citation at document end stays closed through typing and reload by @asmodeus-oos in https://github.com/storytold/wordcraft/pull/1832
    - test(formats): verify txt export preserves list item labels by @asmodeus-oos in https://github.com/storytold/wordcraft/pull/1833
    - engine: reject malformed comment IDs before editing or caret fallback by @MMexicann in https://github.com/storytold/wordcraft/pull/1847
    - engine: Check spelling as you type is saved with the proofing options, so it survives a restart by @midasmatterhorn in https://github.com/storytold/wordcraft/pull/1850
    - engine: Update Field evaluates DOCPROPERTY against custom and built-in properties by @midasmatterhorn in https://github.com/storytold/wordcraft/pull/1851
    - .doc import: symbol runs read their font and character, and paragraph borders are read by @midasmatterhorn in https://github.com/storytold/wordcraft/pull/1852
    - Length fields show their unit in the interface language (#1734) by @switch87 in https://github.com/storytold/wordcraft/pull/1882
    - Layout: floats in table cells are not pushed up by align center/bottom (#1887) by @vangel76 in https://github.com/storytold/wordcraft/pull/1889
    - Charts: draw radar charts instead of a placeholder (#1890) by @vangel76 in https://github.com/storytold/wordcraft/pull/1892
    - Draw EMF text records (EXTTEXTOUTW) in metafile pictures by @Silvertree2010 in https://github.com/storytold/wordcraft/pull/1915
    - i18n(sv): translate 32 new strings by @kler in https://github.com/storytold/wordcraft/pull/1967
    - Read ^0nnn character codes 128-159 as Windows-1252 characters by @Silvertree2010 in https://github.com/storytold/wordcraft/pull/1985
    - #1976: breaks_menu tests use the English interface by @rabis7575 in https://github.com/storytold/wordcraft/pull/2017
    - i18n(it): translate the 15 strings other catalogs added since #1244 by @fabiodalez-dev in https://github.com/storytold/wordcraft/pull/2041
    - feat(navigation): implement collapsible headings in the navigation pane by @guruswarupa in https://github.com/storytold/wordcraft/pull/2043
    - IME: the caret follows the composition text by @aiongg in https://github.com/storytold/wordcraft/pull/3556
    - Header and footer: a click in the other band edits it there by @aiongg in https://github.com/storytold/wordcraft/pull/3557
