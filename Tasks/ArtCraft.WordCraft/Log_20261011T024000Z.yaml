  Key: ReleaseNotes
  Value: |-
    What's Changed
    - Typing parity with Word: lists, AutoFormat and AutoCorrect as you type by @echelon in https://github.com/storytold/wordcraft/pull/204
    - Desktop: keep the off-screen check until the monitor size is known (#23) by @MarekSpodBiedry in https://github.com/storytold/wordcraft/pull/76
    - DOCX: keep a line break written directly in a paragraph (#96) by @MarekSpodBiedry in https://github.com/storytold/wordcraft/pull/101
    - Page break (Ctrl+Enter) survives ODT/TXT/Markdown/HTML export and no longer glues words (#84) by @MarekSpodBiedry in https://github.com/storytold/wordcraft/pull/86
    - HTML import: tables without borders stay borderless in .docx (#99) by @MarekSpodBiedry in https://github.com/storytold/wordcraft/pull/102
    - Control server closes on non-JSON input; hyperlinks follow only http/https/mailto (#34) by @dkhlapov in https://github.com/storytold/wordcraft/pull/72
    - Tests: don't read the sample document aloud on every run by @goldsbd in https://github.com/storytold/wordcraft/pull/75
    - Import: HTML without keeps its body; RTF pictures inside \shppict are kept by @goldsbd in https://github.com/storytold/wordcraft/pull/154
    - M6: TOC follow-ups from #52 review, and a whole TOC heading in LibreOffice by @goldsbd in https://github.com/storytold/wordcraft/pull/74
    - Dark page: View › Switch Modes shows the page dark with inverted colours by @gledguri in https://github.com/storytold/wordcraft/pull/194
    - Reject unknown WordCraft CLI options before side effects by @cyfung1031 in https://github.com/storytold/wordcraft/pull/166
    - Issue #126: Web hosting guide no longer lists the unsupported ?cpu renderer flag by @LloydNicholson in https://github.com/storytold/wordcraft/pull/177
    - PDF: draw fonts krilla can't subset as outlines instead of failing by @naxvog in https://github.com/storytold/wordcraft/pull/132
    - Lists: honour a list's own level definitions (w:lvlOverride/w:lvl) by @naxvog in https://github.com/storytold/wordcraft/pull/134
    - Add Brazilian Portuguese (pt-br) interface translation by @edurbs in https://github.com/storytold/wordcraft/pull/128
    - Desktop: send the window title only when it changes, so an idle app stops redrawing (#117) by @g1obalworlds in https://github.com/storytold/wordcraft/pull/180
    - Zoom the page with Ctrl+scroll and pinch (#139) by @Geljic in https://github.com/storytold/wordcraft/pull/179
    - Find/Replace skips text deleted under Track Changes (#89); a failed command keeps undo history by @goldsbd in https://github.com/storytold/wordcraft/pull/153
