  Value: |-
    What's Changed
    - Updates: shared check-result dialog from craft-update by @aiongg in https://github.com/storytold/wordcraft/pull/5037
    - docs: tidy agent, contributor and asset docs by @aiongg in https://github.com/storytold/wordcraft/pull/5035
    - #3676: page parameters saturate instead of wrapping to page one by @socrabs151 in https://github.com/storytold/wordcraft/pull/4289
    - View › Macros opens a dialog to run, delete and record macros (#4327) by @x-labb in https://github.com/storytold/wordcraft/pull/4426
    - Word count: each Chinese and Japanese character is a word (#4547) by @naxvog in https://github.com/storytold/wordcraft/pull/4629
    - Printing: the print job's PDF leaves out link annotations, so documents with links print (#4734) by @D13GOOOO in https://github.com/storytold/wordcraft/pull/4817
    - Keytips: Alt, F shows the Backstage pages' letters; Alt, F, P and Alt, F, V print (#4960) by @ZIDAN44 in https://github.com/storytold/wordcraft/pull/4981
    - Layout: a kept heading goes over with a three-line paragraph that widow control moves whole by @dfgodvan in https://github.com/storytold/wordcraft/pull/4991
    - Treat and as empty comments in HTML import by @Silvertree2010 in https://github.com/storytold/wordcraft/pull/5040
    - Detect CSV separator from the first non-blank line by @Silvertree2010 in https://github.com/storytold/wordcraft/pull/5042
    - fix: translate highlighting color tooltips by @os-source in https://github.com/storytold/wordcraft/pull/5008
    - References: a table of contents writes its page numbers as PAGEREF fields, as Word does by @dfgodvan in https://github.com/storytold/wordcraft/pull/5097
    - DOCX: a paragraph naming an undefined style is formatted as Normal, as in Word (#5077) by @D13GOOOO in https://github.com/storytold/wordcraft/pull/5104
    - packaging(flatpak): add OCI image build and GHCR publishing helper by @dylanmtaylor in https://github.com/storytold/wordcraft/pull/5126
    - Tests: border lines, tab indents and wide spaces before a word by @dotCooCoo in https://github.com/storytold/wordcraft/pull/4235
    - Integration batch proof: 2 approved proofing PRs (merge commit, please) by @benandez in https://github.com/storytold/wordcraft/pull/5000
    - Proofing: one engine and language table for the dictionary languages, fixing three bugs the copies hid by @VoiceLessQ in https://github.com/storytold/wordcraft/pull/4191
    - proof: flag aliases, single-byte flags, ICONV, IGNORE and KEEPCASE in affix dictionaries (#735) by @Skaywalker in https://github.com/storytold/wordcraft/pull/4575
