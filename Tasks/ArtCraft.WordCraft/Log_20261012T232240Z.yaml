    - Word 365 cover pages: freeforms in groups, text-box margins and Resize to fit (#743) by @dkhlapov in https://github.com/storytold/wordcraft/pull/843
    - Heading numbers from a style's list level (6.4.5, not 6.15) by @echelon in https://github.com/storytold/wordcraft/pull/926
    - A list label raises its line, but doesn't deepen it by @echelon in https://github.com/storytold/wordcraft/pull/928
    - Sorting and table numbers follow the text's language (#836, #837) by @dkhlapov in https://github.com/storytold/wordcraft/pull/844
    - Hidden end-of-cell marks (hideMark) by @echelon in https://github.com/storytold/wordcraft/pull/939
    - ROADMAP: progress log table renders again by @echelon in https://github.com/storytold/wordcraft/pull/947
    - layout tests: fix clippy in a_hidden_cell_mark_takes_no_room by @echelon in https://github.com/storytold/wordcraft/pull/948
    - Text frames placed like Word's and kept on save by @echelon in https://github.com/storytold/wordcraft/pull/935
    - List indents and style indents combine like Word by @echelon in https://github.com/storytold/wordcraft/pull/927
    - AutoCorrect: the English replacement list applies only to English text (#835) by @dkhlapov in https://github.com/storytold/wordcraft/pull/846
    - Keep with next splits a paragraph that doesn't fit anyway by @echelon in https://github.com/storytold/wordcraft/pull/933
    - Start on File › Home when launched with nothing to open (#766) by @dkhlapov in https://github.com/storytold/wordcraft/pull/853
    - An empty continuous section mark takes no room by @echelon in https://github.com/storytold/wordcraft/pull/940
    - Undo history list beside the Quick Access Toolbar's Undo (#701) by @dkhlapov in https://github.com/storytold/wordcraft/pull/855
    - Paragraph-relative floats start above the space before by @echelon in https://github.com/storytold/wordcraft/pull/941
    - i18n(es): translate the equation gallery and built-in style names by @diegozpy in https://github.com/storytold/wordcraft/pull/854
    - Text after a column break uses the new column's width by @echelon in https://github.com/storytold/wordcraft/pull/934
    - Space before at the top of a page like Word by @echelon in https://github.com/storytold/wordcraft/pull/932
    - Tables: select, insert and move with the mouse; double-click a border to AutoFit by @rabis7575 in https://github.com/storytold/wordcraft/pull/637
    - Kerning and automatic paragraph spacing like Word by @echelon in https://github.com/storytold/wordcraft/pull/923
    - No automatic spacing between list items by @echelon in https://github.com/storytold/wordcraft/pull/924
    - Shift+F10 opens the context menu at the caret (#821) by @echelon in https://github.com/storytold/wordcraft/pull/920
    - Tables: the right-click menu offers the table's commands by @rabis7575 in https://github.com/storytold/wordcraft/pull/694
    - Tables: drags and Shift+arrows over cells select whole cells by @rabis7575 in https://github.com/storytold/wordcraft/pull/722
    - Rulers: table column and row markers; indents in a cell measured from it by @rabis7575 in https://github.com/storytold/wordcraft/pull/710
    - Alt+Q opens Search like Word (#819) by @echelon in https://github.com/storytold/wordcraft/pull/919
    - Tables: Ctrl, Alt, left-edge and selected-cells border drags by @rabis7575 in https://github.com/storytold/wordcraft/pull/720
    - Ctrl+F searches in the Navigation pane; one Find and Replace dialog (#712) by @echelon in https://github.com/storytold/wordcraft/pull/921
    - Fonts: documents use the craft-fonts Simplified Chinese face (fixes FreeBSD CI after #567) by @dkhlapov in https://github.com/storytold/wordcraft/pull/888
    - Smooth scrolling through a very large table (#811) by @dkhlapov in https://github.com/storytold/wordcraft/pull/891
    - Save Changes prompt answers from the keyboard (#861) by @dkhlapov in https://github.com/storytold/wordcraft/pull/870
    - Section breaks no longer delete the selected text (#852) by @dkhlapov in https://github.com/storytold/wordcraft/pull/875
    - Click in the left margin selects lines (selection bar) (#856) by @dkhlapov in https://github.com/storytold/wordcraft/pull/879
