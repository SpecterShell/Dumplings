- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    What's Changed
    - Use the body boundary for header margin anchors by @finwarman in https://github.com/storytold/wordcraft/pull/2485
    - Keep repeated spaces in LaTeX export by @Silvertree2010 in https://github.com/storytold/wordcraft/pull/5051
    - Paragraph side borders lie outside the text (#5036) by @VoiceLessQ in https://github.com/storytold/wordcraft/pull/5088
    - Lists: a level above counts its first number at the first deeper item by @pakiat in https://github.com/storytold/wordcraft/pull/5108
    - Layout: tab leader dots spaced and placed as in Word by @pakiat in https://github.com/storytold/wordcraft/pull/5144
    - Tables: a middle or bottom cell of a row split across pages lines up on the first page by @pakiat in https://github.com/storytold/wordcraft/pull/5145
    - Tables: a row isn't split to leave a picture cell empty beside its text; it moves on whole, as in Word (#4272) by @hsmith-dev in https://github.com/storytold/wordcraft/pull/5161
    - .doc import: the default font is the stylesheet's standard font, so Word 365 files open in Aptos (#5066) by @D13GOOOO in https://github.com/storytold/wordcraft/pull/5069
    - Layout tests: compare pairs of layouts drawn with the same faces by @pakiat in https://github.com/storytold/wordcraft/pull/5167
    - Columns: the line between them is drawn for selected text, as tall as the section's text (#5178) by @D13GOOOO in https://github.com/storytold/wordcraft/pull/5183
    - Shapes: arrowheads keep their kind and size and are drawn at Word's sizes by @pakiat in https://github.com/storytold/wordcraft/pull/5192
    - Markdown export: a list inside a block quote stays in the quote by @MichaelMuClaude in https://github.com/storytold/wordcraft/pull/5156
    - DOCX: keep alternate-content table rows and cells by @OPUZZLES in https://github.com/storytold/wordcraft/pull/5221
    - review.compare: keep text boxes of both documents in the result by @Silvertree2010 in https://github.com/storytold/wordcraft/pull/5248
    - Count the runs proofing text walks, instead of timing it (#5185) by @Hamza0101 in https://github.com/storytold/wordcraft/pull/5190
    - #3660: refuse a package that declares too many zip entries before zip parses them by @ljkx in https://github.com/storytold/wordcraft/pull/5260
    - Shapes: align soft-edge paint and caret opacity by @finwarman in https://github.com/storytold/wordcraft/pull/1600
    - DOCX: VML horizontal rules take their line by @Morzilla in https://github.com/storytold/wordcraft/pull/3956
    - Review: add a Word-style Proofing task pane with clickable suggestions by @totoz64 in https://github.com/storytold/wordcraft/pull/4471
    - Files: documents keep their embedded alternative format chunks (w:altChunk), and MHT opens by @naxvog in https://github.com/storytold/wordcraft/pull/1104
    - CP1.3: proofing moves to craft-proof (craft-libs) and craft-i18n language-data by @benandez in https://github.com/storytold/wordcraft/pull/5202
    - CP2.3: English spelling reads SCOWL 2026 (#40, #520, #1281, #1045) by @benandez in https://github.com/storytold/wordcraft/pull/5205
    - CP4.3–CP4.5: Language packs — proof.packs/installPack/removePack, Options › Language packs, missing-pack bar, About › Language data by @benandez in https://github.com/storytold/wordcraft/pull/5208
    New Contributors
