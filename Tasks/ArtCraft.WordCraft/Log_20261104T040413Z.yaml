    - CP4.3: one language list: Language pack languages in Set Proofing Language, Review › Language and the status bar by @benandez in https://github.com/storytold/wordcraft/pull/5513
    - CP4.3: the missing-pack bar works on a fresh install and counts the caret's language by @benandez in https://github.com/storytold/wordcraft/pull/5514
