    - CP4.3: craft-proof pin at craft-libs 01315d9: French elision suggestions first; Valencian reads its pack by @benandez in https://github.com/storytold/wordcraft/pull/5509
    - About: credits tables fit without side-scrolling and their columns resize by @FredApps in https://github.com/storytold/wordcraft/pull/5506
