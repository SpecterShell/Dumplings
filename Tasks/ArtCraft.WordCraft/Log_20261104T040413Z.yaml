  Key: ReleaseNotes
  Value: |-
    What's Changed
    - Read Aloud: look citations up by binary search, not a scan per character by @dylanmtaylor in https://github.com/storytold/wordcraft/pull/5335
    - Language packs 2: 75 packs and the merged craft-proof (compounding, en-AU); #5208 review follow-ups by @benandez in https://github.com/storytold/wordcraft/pull/5224
    - Pictures: refuse a TIFF whose first image names its compression twice by @dylanmtaylor in https://github.com/storytold/wordcraft/pull/5337
    - Fonts: cut names read from a font's name table to 128 characters by @dylanmtaylor in https://github.com/storytold/wordcraft/pull/5333
    - Fonts: refuse WOFF2 collections whose rebuilt directories are huge or repeat a table by @dylanmtaylor in https://github.com/storytold/wordcraft/pull/5332
    - A command line file's Password box survives the startup document's replacement (#5299) by @MichaelMuClaude in https://github.com/storytold/wordcraft/pull/5334
    - #5290: Page Up/Down move by a page in Outline, Draft and Web Layout by @ljkx in https://github.com/storytold/wordcraft/pull/5300
    - References: Remove and Replace Table of Contents treat a title above a section break as Word does (#4041) by @hsmith-dev in https://github.com/storytold/wordcraft/pull/5152
    - Proofing: look up unchecked runs by binary search, not a scan per issue by @dylanmtaylor in https://github.com/storytold/wordcraft/pull/5344
    - i18n: Arabic interface with mirrored RTL shell (+ parity docs) by @tareq-halaby in https://github.com/storytold/wordcraft/pull/5370
    - Tests: harnesses that render through wgpu take turns by @pakiat in https://github.com/storytold/wordcraft/pull/5354
    - DOC import: attach sections to their paragraphs through an index of paragraph ends by @dylanmtaylor in https://github.com/storytold/wordcraft/pull/5373
    - DOC import: keep one override per table cell instead of a copy per repeated sprm by @dylanmtaylor in https://github.com/storytold/wordcraft/pull/5374
    - Paste: charge copied text box stories for the formatting they clone by @dylanmtaylor in https://github.com/storytold/wordcraft/pull/5379
    - Comments: a long comment's card and balloon stop at ten lines (#3382) by @squaredcow in https://github.com/storytold/wordcraft/pull/3899
