  Key: ReleaseNotes
  Value: |-
    Improvements
    - Improved provider configuration loading by parsing providers.json once and reusing the result.
    - Optimized page performance by resolving routing group members only once.
    - Cached the account list used for sign-in alerts to avoid rebuilding it.
    - Pre-allocated model, provider, preset, and group-member lists to improve rendering efficiency.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Improvements
    - 通过只解析一次 providers.json 并复用结果，改进了提供程序配置加载。
    - 通过只解析一次路由组成员，优化了页面性能。
    - 缓存了用于登录提醒的账户列表，避免重复构建。
    - 预分配了模型、提供程序、预设和组成员列表，以提高渲染效率。
