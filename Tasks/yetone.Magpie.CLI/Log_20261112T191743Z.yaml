  Key: ReleaseNotes
  Value: |-
    Features
    - Added a quota page in English, Chinese, and Japanese.
    Bug Fixes
    - Fixed an issue where an agent’s settings sheet did not open from the panel.
    - Restored provider and GUI changes that were accidentally removed.
    - Fixed a catalog snapshot item so it compiles on first use.
