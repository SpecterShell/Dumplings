- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Features
    - Accounts on the same plan now show their combined remaining usage.
    Bug Fixes
    - Fixed history replay in Claude TUI so message text is kept when a line references an image file (#5548).
    - Fixed Codex reset tracking to use the exact reset that passed checks (#5555).
    - Fixed ZCode account-wide rate limits (429) to act as a hard limit rather than a temporary slowdown (#5406).
    Improvements
    - Missing Codex reset usage records are now reported instead of failing silently (#5556).
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    功能
    - 同一套餐下的账户现在会显示其合并的剩余使用量。
    错误修复
    - 修复了 Claude TUI 中的历史回放，当某行引用图像文件时保留消息文本 (#5548)。
    - 修复了 Codex 重置跟踪，以使用通过检查的确切重置 (#5555)。
    - 修复了 ZCode 账户级速率限制 (429)，使其作为硬限制而非临时减速 (#5406)。
    改进
    - 缺少的 Codex 重置使用记录现在会被报告，而不是静默失败 (#5556)。
