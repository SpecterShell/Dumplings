- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Bug Fixes
    - Provider model lists now show each model only once. (#6582)
    Improvements
    - Tests that share a process now check they leave a clean state behind. (#6717)
    - Gateway tests now release recorded REST data when a test ends. (#6717)
    - Fixed a timing-sensitive provider test by using a fixed clock. (#6474)
    - CI now runs internal/gateway tests in parallel chunks, one process per core. (#2191)
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Bug Fixes
    - Provider 模型列表现在每个模型只显示一次。(#6582)
    Improvements
    - 共享进程的测试现在会检查它们是否留下了干净状态。(#6717)
    - Gateway 测试现在会在测试结束时释放已记录的 REST 数据。(#6717)
    - 通过使用固定时钟修复了一个时序敏感的 Provider 测试。(#6474)
    - CI 现在以并行分块的方式运行 internal/gateway 测试，每个核心一个进程。(#2191)
