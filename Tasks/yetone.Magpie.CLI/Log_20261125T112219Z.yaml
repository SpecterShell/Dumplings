  Key: ReleaseNotes
  Value: |-
    Bug Fixes
    - Fixed an issue where a TLS record error caused a host’s requests to be sent as whole records.
    - Fixed handling of TLS records that failed to decrypt so they no longer affect other connections.
    - Fixed tool calls without a function name being dropped on every route.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    错误修复
    - 修复了 TLS 记录错误导致主机请求以完整记录形式发送的问题。
    - 修复了对解密失败的 TLS 记录的处理，使其不再影响其他连接。
    - 修复了没有函数名称的工具调用在每条路由上被丢弃的问题。
