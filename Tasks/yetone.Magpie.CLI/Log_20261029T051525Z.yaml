- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Features
    - Claude Code in WSL now includes the Tiers, Subagents, and Auto mode rows.
    Bug Fixes
    - Corrected the status message so Claude Code is only reported when it is actually inside Claude Desktop.
    - Fixed the Code tab in Desktop’s third-party mode to show as Claude Desktop, not Claude Code.
    - Fixed effort options for a stopped WSL distribution to display as “effort” instead of “models.”
    Improvements
    - Adjusted the interface to make room for the WSL and Desktop rows without increasing the budget.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    功能
    - WSL 中的 Claude Code 现在包含层级、子代理和自动模式行。
    错误修复
    - 修正了状态消息，使 Claude Code 仅在实际位于 Claude Desktop 内时才被报告。
    - 修复了 Desktop 第三方模式下的“代码”标签页，使其显示为 Claude Desktop，而不是 Claude Code。
    - 修复了已停止的 WSL 发行版中的 effort 选项，使其显示为“effort”而不是“models”。
    改进
    - 调整了界面，以便在不增加预算的情况下为 WSL 和 Desktop 行腾出空间。
