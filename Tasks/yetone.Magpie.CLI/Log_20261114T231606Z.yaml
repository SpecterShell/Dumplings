- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Bug Fixes
    - Fixed saving options for page-only plugins under the same lock as plugins.json, and prevented simultaneous plugin configuration changes from overwriting each other. (#4666)
    - Fixed gateway replay handling so a client’s full replay is requested again without IDs that another resource refuses.
    - Prevented sealed subagent tasks from being downgraded to translations. (#5198)
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Bug Fixes
    - 修复了在与 plugins.json 相同的锁下保存页面专用插件选项的问题，并防止同时进行的插件配置更改相互覆盖。(#4666)
    - 修复了网关重放处理，使客户端的完整重放会重新请求，且不包含被其他资源拒绝的 ID。
    - 防止密封的子代理任务被降级为翻译任务。(#5198)
