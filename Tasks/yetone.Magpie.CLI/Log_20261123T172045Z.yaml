- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Bug Fixes
    - Fixed image cap behavior so repeated images in a request are dropped first when the cap is reached.
    - Fixed Copilot tool turn reasoning details not being carried over to the next turn.
    - Fixed Copilot top-level reasoning token usage not being counted as reasoning tokens.
    Improvements
    - Empty replies now include the number of output and reasoning tokens counted.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    错误修复
    - 修复了图像上限行为，使请求中重复出现的图像在达到上限时优先被丢弃。
    - 修复了 Copilot 工具回合推理详情未传递到下一回合的问题。
    - 修复了 Copilot 顶层推理令牌使用量未被计为推理令牌的问题。
    改进
    - 空回复现在会包含已计数的输出令牌和推理令牌数量。
