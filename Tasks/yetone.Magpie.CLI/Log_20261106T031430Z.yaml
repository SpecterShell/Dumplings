Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Bug Fixes
    - Fixed the gateway to show the correct model name in 403 forbidden responses.
    - Fixed the gateway to correctly classify rate-limit responses that mention both “insufficient_quota” and a per-minute limit.
    - Fixed LiteLLM “Budget has been exceeded” errors to be treated as quota limits so key quota restrictions apply.
    - Fixed detection of prompts longer than the model context length so Codex automatically compacts.
    - Fixed routing groups to use their own intent confidence setting instead of inheriting it.
    - Fixed the uninstaller to remove Codex’s gateway URL even when related Magpie settings are already gone.
    - Fixed dock and tray icon transparency on macOS.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Bug Fixes
    - 修复了网关在 403 禁止访问响应中无法正确显示模型名称的问题。
    - 修复了网关，使其能够正确分类同时提到 “insufficient_quota” 和每分钟限制的限流响应。
    - 修复了将 LiteLLM “Budget has been exceeded” 错误视为配额限制，以便密钥配额限制生效的问题。
    - 修复了对超过模型上下文长度的提示的检测，以便 Codex 自动进行压缩。
    - 修复了路由组使用自身的意图置信度设置而不是继承该设置的问题。
    - 修复了卸载程序，使其即使相关 Magpie 设置已不存在，也能移除 Codex 的网关 URL。
    - 修复了 macOS 上 Dock 和托盘图标透明度的问题。
