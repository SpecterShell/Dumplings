- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Features
    - Projects can now keep their plugin set pinned to their own checkout.
    Improvements
    - Codex plugin rows now show whether a project has them enabled or disabled.
    - Plugins pinned to a release tag now offer newer releases.
    Bug Fixes
    - Fixed an issue where project plugins grouped by category were not read from their sources, so literals from #4702 now appear.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    功能
    - 项目现在可以将其插件集固定到自己的检出。
    改进
    - Codex 插件行现在会显示项目是否已启用或禁用它们。
    - 固定到发布标签的插件现在会提供更新的版本。
    缺陷修复
    - 修复了按类别分组的项目插件未从源读取的问题，因此 #4702 中的字面量现在会显示。
