- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Bug Fixes
    - Fixed an issue where images that Gemini couldn't read caused the turn to be refused. Such images are now sent as a PNG or a note instead.
    Improvements
    - Agent commands located in ~/.local/bin are now detected on Linux and macOS.
    - Added JetBrains Air documentation in English, Chinese, and Japanese.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Bug Fixes
    - 修复了 Gemini 无法读取的图片导致本轮对话被拒绝的问题。此类图片现在会改为以 PNG 或文字说明的形式发送。
    Improvements
    - 现在可在 Linux 和 macOS 上检测到位于 ~/.local/bin 中的 Agent 命令。
    - 新增了英文、中文和日文版的 JetBrains Air 文档。
