Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Bug Fixes
    - Fixed a macOS file-watching issue that could leave files inaccessible (EBADF) by avoiding FSEvents WatchRoot (#6368, #6785).
    - Fixed detection of a folder renamed under a watched folder; the renamed folder is now read again.
    - Fixed status messaging on macOS when a command is still running and its context ends (#5967).
    Improvements
    - Limited the gateway's thinking display to Claude only.
    Documentation
    - Moved the one-suite-per-machine lesson into the code standards and marked it as moved in the lesson list.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    错误修复
    - 修复了一个 macOS 文件监视问题：通过避免使用 FSEvents WatchRoot，解决了可能导致文件无法访问（EBADF）的问题（#6368，#6785）。
    - 修复了检测受监视文件夹下某个文件夹被重命名的问题；重命名后的文件夹现在会被重新读取。
    - 修复了 macOS 上当命令仍在运行且其上下文结束时的状态消息问题（#5967）。
    改进
    - 将网关的思考显示仅限于 Claude。
    文档
    - 将 one-suite-per-machine 课程移入代码标准，并在课程列表中标记为已移动。
