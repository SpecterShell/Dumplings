  Key: ReleaseNotes
  Value: |-
    Features
    - Added optional automatic account switching for Agy when its balance runs low. This is off by default.
    Bug Fixes
    - Fixed an issue where switching Agy sign-in could also switch other accounts. Now only Agy’s own account is switched.
    Improvements
    - Notifications about refused or delayed Agy account switches now appear in your language.
- Locale: zh-CN
  Key: ReleaseNotes
