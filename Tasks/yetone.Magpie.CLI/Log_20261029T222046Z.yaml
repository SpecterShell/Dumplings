Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Performance
    - Polls now create file lists, merges, and copy groups only once.
    - Reading published data marks it as used without creating unnecessary copies.
    - Poll session lists are sorted and gathered more efficiently.
    Analytics
    - PostHog now records sessions, errors, dead clicks, and request timings.
    - PostHog uses a locally stored identifier to recognize returning visitors, country, and clicks.
    Privacy
    - Updated the privacy page to clarify that PostHog does not look up country information for cookieless page views.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    性能
    - 轮询现在仅创建一次文件列表、合并和复制组。
    - 读取已发布数据会将其标记为已使用，而不会创建不必要的副本。
    - 轮询会话列表的排序和收集效率更高。
    分析
    - PostHog 现在记录会话、错误、无效点击和请求计时。
    - PostHog 使用本地存储的标识符来识别回访者、国家/地区和点击。
    隐私
    - 更新了隐私页面，以澄清 PostHog 不会为无 Cookie 页面浏览量查询国家/地区信息。
