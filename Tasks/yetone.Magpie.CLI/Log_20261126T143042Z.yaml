    - 对提供程序设置的手动编辑不再被覆盖，现在会传达给您的代理。
    - 输入的提供程序地址如果未包含 /v1，现在也能正确处理，即使服务器响应的是网页。
    Features
    - 分享预览图片现在会以每种支持的语言显示 pool pitch。
    Improvements
    - 文档现在打开时会显示 pool pitch。
