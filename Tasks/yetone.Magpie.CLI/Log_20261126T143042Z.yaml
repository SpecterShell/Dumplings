  Key: ReleaseNotes
  Value: |-
    Bug Fixes
    - Manual edits to provider settings are no longer overwritten and now reach your agents.
    - Provider addresses entered without /v1 are now handled correctly, even if the server responds with a web page.
    Features
    - Share preview images now display the pool pitch in each supported language.
    Improvements
    - The documentation now opens with the pool pitch.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
