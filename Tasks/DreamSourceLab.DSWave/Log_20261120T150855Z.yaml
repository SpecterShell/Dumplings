Version: 1.3.0
Installer:
- Architecture: x64
  InstallerUrl: https://dreamsourcelab.cn/software/DSWave_v1.3.0_x64_setup.exe
Locale:
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    *新增 DSCope U3P100 设备支持
    *新增璞石示波器通过 ESP32 连接到 DSWave
    *新增 DSCope M454 的逻辑分析仪模式
    *提升 DSCope M454 的 stream 采集最高至单通道 200MSa/s
    *提升全设备 stream 模式的采集时长（只受内存大小限制）
    *提供开放的解码器 SDK，支持客户自定义协议解码
    *新增多层解码器支持
    *新增多行解码器支持
    *解码器总量增至 115 个，新增以下解码器：OSPI, Parallel, AD9833, DCF77, DP AUX，DS1307, EV1527, EV1527-BIT, IR-TLLO-BASE, IR-TLLO-UPPER, JITTER, LM75, LTC26x7, MAX6675, MAX31855, MCP4921, MIPI-DSI, MXC6225XU, Nunchuk, PCA9536, PCA9548A, PCF8574, PT2262, PT2262-SYMBOL, PULSE-WIDTH-COUNTER, QI, QI-BYTE, RDM, RGB-LED, RTC-8564, SCCB, SDQ, SEGMENT-7, SENT, SLE-44xx, TIMING, USB-PD, FlexRay, HDQ, JTAG, Manchester, Miller, PCM, A7105, AD79X0, AD5626, ADE77XX, ADNS-5020, AMULET-ASCII, ARM_ITM, ATMEL-SWI, AVR_PDI, AVR_PDI_COMMAND, CC1101, EM4100, ENC28J60, J1850, LFAST, MAPLE-BUS, MAX7219, MIDI, MRF24J40, NES_GAMEPAD, NRF24L01+, NRF905, OOK_PACKET, OOK_VIS, PJON, PXX1, ST25R39XX, SWP, UNI, USB, USB-PACKET, USB-TRANSACTION
    *新增协议列表的查找和模糊匹配功能
    *新增解码错误信息和状态提示功能
    *修改解码器帧列表的详细内容显示
    *新增历史帧记录和回看功能
    *新增波形区域测量和统计
    *新增 csv 的区域导出功能
    *新增多 Tab 添加和切换功能
    *新增软件版本自动更新和提醒
    *新增单次采集的百分比和进度条显示
    *优化长时间采集的波形缩放流畅度
    *修复 I2C 解码帧对应错误问题
    *修复解码结果字节序不一致问题
    *修复解码结果导出格式问题
    *修复 csv 导出偏移以及大文件自动切分问题
    *修复数字阈值刷新的问题
    *修复导出文件名不合法的问题
    *修复鼠标测量采样点对齐问题
    *修复非示波器模式下的通道反向问题
    *修复模转数信号的鼠标测量问题
    *修复某些参数持久化遗漏的问题
    *修复文件保存的同名覆盖问题
    *修复模式切换之后功能异常问题
    *修复余晖在不同深度下的问题
