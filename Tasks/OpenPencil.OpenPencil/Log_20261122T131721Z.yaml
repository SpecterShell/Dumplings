- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    OpenPencil 0.17 adds OpenPencil Cloud, a self-hostable server where teams keep documents, edit them together in live rooms, share, comment, browse version history, and use AI paid from their plan's credits, and FigJam-style boards with sticky notes, shapes, connectors, and draw.io and Mermaid import. It also opens web pages from a URL as editable layers and adds variable formulas, variable fonts with Material Symbols and SF Symbols, Figma's glass, progressive blur, noise, and texture effects, image adjustments, the Scale tool, multi-layer transforms, custom AI prompts and design reviews, coding-agent subagents, and Arabic and Brazilian Portuguese. The canvas is much faster: a change settles in tens of milliseconds instead of over a second, only the tiles an edit touches are redrawn, and large .fig files open, switch pages, and save faster in less memory. Auto layout now runs on Taffy, and PDF export draws with Skia.
    Breaking changes
    - Shared rooms record document data in a new format, so people on this version and on earlier versions can no longer join each other's rooms, and rooms this browser saved with an earlier version are not converted. Room links use /rooms/<room-id> instead of /share/<room-id>, so links copied before no longer open.
    - Libraries use schema version 2: libraries published by earlier versions are left out of the library list until they are published again. In @open-pencil/core/library, PublishLibraryInput.assetNodeIds is now assetIds and LibraryAssetDescriptor.sourceNodeId is now sourceId.
    - Layers opened from a .fig file keep the GUIDs the file saved them under as their IDs, instead of 0:1, 0:2, and so on in reading order, so an ID stays the same after a save and reopen. IDs printed by openpencil tree or MCP before this release no longer find their layers.
    - SceneNode.lineHeight and letterSpacing, and the same style run fields, are { value, unit } objects in pixels or percent; documents and rooms saved with the old numbers are not converted. TextAutoResize no longer includes TRUNCATE: a truncating text is textAutoResize: 'NONE' with textTruncation: 'ENDING', as Figma stores it.
    - Removed from the app: the retained canvas renderer, the Rendering settings section, and the renderer URL parameter, since progressive rendering is the only canvas renderer; the Outline text command with outlineTextSelected and selection.outlineText, since text becomes vectors through Flatten or Outline stroke, as in Figma; and the selection.setOpacity command with canSetOpacity and setOpacityTarget, in favor of editor.setOpacity(value).
    - MCP tools that duplicated another tool are merged, and every tool is named verb first: update_node takes rotation and lock, boolean { op } and transform_path replace their families, and delete_nodes, clone_nodes, and ungroup_nodes take ids. Tool access settings name tools, so a tool disabled under its old name is enabled again; check Settings › Tool access after updating.
    - Design JSX binds component properties with property(name, default) in a layer's text, visible, or an instance's of; propertyRefs and properties on <Component> and <ComponentSet> are removed. defineVars(collection, values, options) defines a collection instead of grouping references, designVar takes a variable's name or ID, or its collection and name, without a fallback value, and a missing or ambiguous variable is an error. textAutoResize="truncate" is replaced by truncate. Code in the Code tab that puts statements before its JSX ends them with return and the JSX.
    - Plugin scripts run through eval, the CLI, and MCP follow Figma's font rule: an edit that lays text out again throws Cannot write to node with unloaded font until figma.loadFontAsync has loaded every font the text uses, and loadFontAsync rejects a font that cannot load or a style the family has no face of.
    - Scripts use variables as in Figma's Plugin API: figma.variables creates and looks up variables and collections, variables set values with setValueForMode, and layers bind with node.setBoundVariable; the top-level figma.getVariableById, createVariable, setVariableValue, deleteVariable, and collection methods are removed. OpenPencil-only features move to openpencil: bindVariable, unbindVariable, exposeInstanceSwap, getFontStatus, the OkHCL fill and stroke pairs, and layout and text direction. figma.booleanOperation and figma.flattenNode give way to figma.union, subtract, intersect, exclude, and flatten. Scripts no longer reach the scene graph or raw layers; SDK code calls graphOf(figma) from @open-pencil/core/figma-api.
    - The plugin API takes and gives paints in Figma's shape: gradientTransform and imageTransform are two rows of three such as [[1, 0, 0], [0, 1, 0]], image paints use scaleMode, rotation, and scalingFactor instead of imageScaleMode, and strokes refuse geometry keys such as weight or align. A page's type is PAGE instead of CANVAS, and figma.root.type is DOCUMENT instead of FRAME.
    - Variable modes come only from pages and layers, as in Figma: the document-wide shown mode (SceneGraph.activeMode, getActiveModeId, setActiveMode, the VariableModeFallback parameter), the Vue SDK's setActiveMode, and activeModeId in get_collection output are removed. resolvedPaintBindings is removed, since bound paints hold their colors in fills and strokes. VariableValue includes formula and color-expression objects, so resolve variables before treating non-alias objects as colors, and TokenExpression.resolved is optional.
    - Every public name of @open-pencil/* packages has exactly one import path, and no package re-exports another's names. @open-pencil/scene-graph's root holds SceneGraph, generateId, setIdSession, and the node types; primitives come from /primitives and every other domain from its own subpath, such as /instances, /variables, and /fields. /text-direction and /text-picture are now /text/direction and /text/picture, /types is part of the root, and /random and the JSON types move to @open-pencil/std/random and @open-pencil/std/json.
    - @open-pencil/core's root is the editor that /editor was; /editor and /kiwi are removed, and other names come from Core's subpaths or @open-pencil/kiwi, @open-pencil/fig, and @open-pencil/pen. @open-pencil/vue's root holds provideEditor, useEditor, and EDITOR_KEY, with every other composable and primitive on the subpath of its source folder, such as /canvas, /controls/fill, and /i18n. @open-pencil/kiwi has no root entry, and @open-pencil/dom-css's root no longer repeats /browser, /export, /scene-graph, or the JSX factories.
    - @open-pencil/dom-css no longer has a headless CSS runtime: createHeadlessCSSRuntime is removed and createCSSRuntime() throws outside a browser. Pass createHTMLEngineRuntime() from the new @open-pencil/html-engine as runtime instead. createBrowserCSSRuntime() no longer takes sandbox: it always lays markup out in a frame that runs no script (GHSA-x4rx-8c38-9hw8).
    - Smaller export surfaces: @open-pencil/pen exports only parsePenFile, readPenFile, and the PenDocument, PenNode, and PenOverride types. @open-pencil/core/clipboard drops buildOpenPencilClipboardHTML, parseOpenPencilClipboard, OpenPencilClipboardData, and TextPictureBuilder, and paste no longer reads the <!--(openpencil)--> HTML format, which OpenPencil stopped writing in March 2026. Valibot schemas are named <name>Schema in camelCase, such as serializedLibraryRevisionSchema, librarySummarySchema, and storedLibraryLatestManifestSchema.
    - CanvasKit is @open-pencil/canvaskit, OpenPencil's build of CanvasKit 0.41.1 with Skia's PDF backend: SDK hosts install it in place of canvaskit-wasm and serve @open-pencil/canvaskit/dist/canvaskit.wasm. getCanvasKit from @open-pencil/core/canvaskit is the one instance Core and the canvas use, and initCanvasKit is gone. In a browser it loads /canvaskit.wasm unless the host sets the URL with setCanvasKitLocator, passes locateFile, or adds openPencil() from @open-pencil/core/node/vite.
    - exportFigFile from @open-pencil/core/io/formats/fig takes one options object, exportFigFile(graph, { ck, renderer, pageId, renderHeadlessThumbnail, documentName }). The same subpath removes compressFigData and adds setFigCanvasCompressor and exportFigFileStream, and @open-pencil/core/canvas no longer exports withFigExportRuntime. In @open-pencil/fig, patchFigArchive returns a ReadableStream and compressFigDataSync is removed in favor of writeFigArchive.
    - SceneGraph.updateNode writes fields as given and no longer detaches shared styles; detach first with styleDetachmentChanges from @open-pencil/scene-graph/shared-styles, where sharedStylePatch and sharedStyleDetachPatch moved. reorderChild is removed in favor of insertChildAt, LAYOUT_AFFECTING_KEYS, TEXT_PICTURE_KEYS, and GLYPH_AFFECTING_KEYS are exports of /fields and /text/picture, and code that writes into a variable or collection directly calls willChangeVariable or willChangeCollection first, so undo records the change.
    - Vector and geometry APIs moved. A vector's per-region paints live on its network (VectorRegion.fills and fillStyleId), and cloneVectorNetwork is in @open-pencil/scene-graph/copy. lineArrowEndpoints gives way to lineStrokeEnds, StrokeCorners is StrokeShape, clipPolygon and clipBoundsToPolygon are in /clipping, strokeRuns and addStrokeRunToPath in /paths, and vectorNetworkToSVGPaths in /vector-network. evalCubic and geometryCommandCoordCount are replaced by cubicPoint and readGeometryBlob, and computeVisualBounds and its siblings by computeContentBounds from @open-pencil/core/io/formats/raster.
    - Text nodes and style runs have a fontStyle face name, and FONT_WEIGHT_NAMES uses Google Fonts' names ("SemiBold"). weightToStyleName, weightToFigmaStyle, styleToVariant, and normalizeFontStyleName are removed, weightToStyle is faceLoadKey, the desktop list_system_fonts command and setHostFontCatalog list each face with its style, weight, and slant, and the typography SDK's weights is faces, with faceName and setFace.
    - @open-pencil/core replaces state.play with state.canvasView and state.readOnly with state.hostRestrictions; read how a canvas behaves from resolveEditorProfile(state). Vector edit mode no longer has a history of its own: nodeEditUndo, nodeEditRedo, and NodeEditState.history are removed in favor of undoAction and redoAction, and cancelGesture replaces nodeEditCancelDrag.
    - In @open-pencil/vue, CanvasRoot takes pointer input and typing itself, so a host that also calls useCanvasInput or useTextEdit drops those calls or passes :input="false". useCanvas no longer takes onPresented; listen for the editor's render:presented event. useCanvasVirtualReference takes the view to project through instead of the editor, usePosition() gives each value through panelProp('x') and the like, isConstraintEligible moved to @open-pencil/scene-graph/constraints, and FillSwatch no longer takes the state of an enclosing BindableValueRoot. Messages drop useRenderingMessages and panels.toggleExportPreview, and replace linearGradient and radialGradient with gradient.
    - SDK shortcuts are TanStack Hotkeys chords such as Mod+S instead of tokens such as MOD+S: EditorCommandMetadata.shortcut and aliases replace keybinding, and TOOL_SHORTCUTS and toolKeys are keyed by chords. formatShortcut takes a HotkeyChord, and shortcutPlatform, shortcutCode, and shortcutEvent are removed in favor of TanStack's detectPlatform and matchesKeyboardEvent.
    - SkiaRenderer drops the box and corner arguments from its fill, stroke, clip, and effect methods and removes drawArc and makeRRectWithOffset. @open-pencil/core/canvas replaces outlineStrokeNodesToVectorProps with outlineStrokeLayer and layersToOutline, copySelectionAsSVG returns a promise, runsAfterTyping replaces adjustRunsForInsert, IconPath carries fills, strokes, and tint instead of paint strings, and createDesignJSXRenderer takes a vectorBounds(network) service.
    - Linux package managers see a 0.17.0 beta as newer than 0.17.0, so remove a beta installed from a .deb or .rpm before installing this release.
    Added
    - OpenPencil Cloud keeps documents on your team's server, ready to self-host. Connect a server in Settings → Cloud, which also holds the hosted service's waitlist, and sign in with email and password, Google, Apple, GitHub, or two-step sign-in. Home lists the server's workspaces and the documents shared with you; every account starts with a workspace of its own and can create team workspaces whose admins invite people by email as admins, editors, or viewers. File → Save to… saves the open document to a workspace or bucket, and a status beside the name appears when the document is offline, couldn't save, changed in two places, with the choice to keep both versions, or is view only. On the official server, Cloud is in beta.
    - Opening a Cloud document joins its live room, so everyone with it open sees edits and cursors as they happen while one editor saves for all. Share invites people by email and turns on a link that opens the document for guests, within what the plan allows. In the web app the address bar shows the open Cloud document, so a reload or the address reopens it for anyone with access, and the web editor offers to open invitations and shared links in the desktop app. A viewer's document is read-only, as in Figma: layers can be selected, copied, and exported, the toolbar keeps Move and Hand, and edits from the canvas, panels, shortcuts, and agents are refused.
    - Cloud documents have version history, comments, and a Trash. File → Show version history lists named versions and autosaves: look at one read-only, restore it for everyone in the room, duplicate it, or copy a link to it, and File → Save to version history… (⌥⌘S) names the document as it is now. Comments are kept by the server under each person's account; typing @ mentions people who can open the document and emails them, and threads with new replies show as unread. Deleted documents go to Trash on Home, which shows who deleted each one and how long it stays, to restore or delete forever.
    - A Cloud server has its own pages for accounts: Profile changes your name, email, and picture, Sessions lists where your account is signed in and signs out any of them, and Notifications chooses which comments arrive by email. The server emails you about a sign-in from a new address and about changes to two-step sign-in, in your language. Accounts can make personal access tokens for scripts and CI, sent as Authorization: Bearer <token>, and can be deleted after saving their files as one zip.
    - Cloud plans belong to accounts: every workspace takes its owner's storage, credits, and features. Servers can sell plans and credit packs through a billing service named by [billing] endpoint, with a Plan page at /account/plan that shows what the plan includes, and plans can be priced by the seat. An account that holds its whole storage allowance becomes read-only until space is freed or its plan grows: its files still open, download, and delete, and the editor shows Storage full.
    - OpenPencil services pay for AI and web search from one account's credits: choose OpenPencil Cloud as a model's provider in Settings → Models, or sign in on a fresh install with a plan that includes AI and the app sets up the model the server recommends for each kind of work. The chat shows the credits left, and a banner warns when they run low or run out. Self-hosted servers run openpencil-services, which forwards requests to one OpenAI-compatible provider with your key and holds each account to its monthly allowance.
    - Cloud administrators get a console that lists people, access requests, email, activity, and documents as searchable tables, where they suspend accounts with a reason, reset a locked-out person's two-step sign-in, and download a document, which Activity records. People who open a document from a share link can report it, and administrators can take it down, revoke its link, or suspend its owner. A server can open one workspace to everyone as a community gallery at /community, and can set a minimum editor version, so older desktop apps offer their update instead of connecting.
    - Self-host OpenPencil Cloud from npm (npm install -g @open-pencil/cloud provides openpencil-cloud and openpencil-services) or from the image ghcr.io/open-pencil/cloud; compose.self-hosted.yml starts it on one machine with a database, storage, and email. Configuration covers [legal] links with terms acceptance, GitHub sign-in through a GitHub App, collaboration rooms in the EU on Cloudflare, and optional PostHog error tracking that omits account and record IDs by default. The server, its services, and its pages are under the Apache License 2.0, while the protocol the editor speaks to it stays MIT; VITE_OPENPENCIL_CLOUD=off builds the editor without Cloud.
    - Boards: Home and the New file tab (⌘T) offer Design and Board side by side. A board has FigJam's tools (sticky note, shape, connector, section, text), its keys, a dot grid, and a 16-unit snap grid, and saves and opens as a FigJam .jam file. Boards open on the canvas and their tools alone, with the panels a click away and the AI chat floating over the canvas, and a selection gets FigJam's selection toolbar with colour, outline, text, alignment, and wrap-in-section menus.
    - FigJam sticky notes and shapes with text open from .fig files, paste from FigJam, and save back so Figma shows them as its own (#1118, #1114). The sticky note tool draws or places notes, and the Shape tool picks any of FigJam's 30 kinds from a searchable grid; the Design panel sets their colour, text size, typeface, and author line, with FigJam's palette. Shapes grow to fit their label, and scripts and design JSX read and write both, as <Sticky> and <Shape> in JSX.
    - FigJam connectors open from .fig files and paste from FigJam bound to the layers they join, route as FigJam does when those layers move or resize, and save back so Figma keeps them live (#616). The connector tool draws them between layers or points, their end handles reattach them, double-click types a label, and the Design panel sets their line type, end caps, colour, weight, and dash. Scripts and agents use figma.createConnector() and create_connector, and design JSX writes <Connector from="A" to="B">.
    - Open draw.io diagrams and Mermaid flowcharts as FigJam shapes and connectors: .drawio and .dio files and draw.io's editable PNG and SVG exports keep their colours, labels, arrowheads, bend points, layers, and containers, and .mmd and .mermaid files, or pasted Mermaid, are laid out automatically. Designs save as draw.io files from File › Export selection and the Export panel, and agents import Mermaid with import_mermaid. Text can be written in Markdown through set_text with markdown: true, openpencil.setTextMarkdown(), and <Text markdown>.
    - Arrange › Tidy Up, Pack Horizontal, and Pack Vertical work as in Figma, on Figma's keys. An Auto Arrange submenu spreads overlapping layers apart, packs them into rows, or lays shapes out along their connectors as a flow, tree, radial map, or network, and agents get the same as arrange modes.
    - Open a web page as editable layers with File → Open from URL…, which brings the stylesheets and pictures the page links: the desktop app opens any address, the browser sites that allow it, and openpencil import accepts a web address. The dialog chooses the window size the page is laid out at (Desktop, Tablet, or Mobile) and, in the desktop app, whether the page's scripts run first, so a page that builds itself with JavaScript usually opens with its content. The tab shows the open's progress, and closing it cancels.
    - Place and paste HTML: pages dropped on the canvas become editable layers, File → Place… places images, SVG files, and HTML pages, and text copied from a web page pastes as one text layer, as in Figma, with Paste as layers to lay the copied HTML out instead. HTML import keeps tables, multi-column CSS grids, and centered and margin-spaced blocks in auto layout, draws inline SVG and CSS mask icons as vectors named after their Iconify icon, and keeps ::before and ::after content and CSS counters.
    - Number and true/false variables take live formulas: references show as pills, the field shows the result, and formulas survive undo, copy and paste, sharing, and .fig saves. Formulas can also use text and colors, join text with +, and call if(), text(), and truthy(), and text and color variables can hold them. The token stylesheet writes number formulas as calc() over the variables they use, and CSS expressions complete token names, preview what the browser computes, and can be added to any number mode.
    - Bind more to variables, as in Figma: a layer's visibility to a boolean or text variable, a text layer's content to a text or number variable, and a shadow's colour, blur, spread, and offsets or a blur's radius, so effects follow a variable mode (#1712). CSS, HTML, Tailwind, and design token export write bound effect fields as their variable. Frames and pages show a row in Appearance for each collection with more than one mode, and the set_variable_mode and get_variable_modes tools switch and read modes.
    - Variable fonts draw every style they cover from one file, at the axes Figma draws them, and .fig exports, copies pasted into Figma, and PDF exports keep each glyph's shape at those axes. Set a font's axes, such as weight, width, or optical size, in the Typography section for the whole text or the selected characters; plugins, the set_font tools, and design JSX read and set them. Inter ships as its variable files, so every weight and italic draws offline.
    - Material Symbols icons draw from Google's variable fonts in the Outlined, Rounded, and Sharp sets, and the Icon section sets their optical size, weight, fill, and grade. On macOS 14 and later, the desktop app's icon picker offers SF Symbols, with weight, scale, palette, and multicolor rendering; documents keep the outlines, so they draw on every platform. insert_icon and Design JSX <Icon> take options for both.
    - Figma's glass, progressive blur, noise, and texture effects render on the canvas and in exports, keep their settings through .fig files, the plugin API, and design JSX, and can be added and edited in the Effects panel, with start and end handles on the canvas for progressive blur. Noise matches Figma's grain statistics rather than its exact pattern. Drop shadows gain Show behind transparent areas, and layers, fills, strokes, and effects gain the plus darker and plus lighter blend modes.
    - Image fills and strokes draw their exposure, contrast, saturation, temperature, tint, highlights, and shadows adjustments on the canvas and in exports, matching Figma's output, and the image fill picker sets them with sliders (#2241). The picker also sets a tile's scale, turns images by 90°, takes a dropped PNG, JPEG, or WebP file, and searches Unsplash or Pexels with Stock photo, crediting the photographer. Vectorize can use QuiverAI's Arrow 2 model with your own API key.
    - The Scale tool (K) resizes layers with their text, strokes, effects, radii, spacing, and vector geometry in proportion, as in Figma. With several layers selected, the handles on their selection box resize them all together and its rotation handle turns them about its center, with snapping, Shift for proportions or angle steps, mirroring past the opposite edge, and one undo step (#1919).
    - More of Figma's canvas: a selected layer shows its constraints as dashed lines to its parent's edges, the Eyedropper tool (I) picks any color on the canvas with a loupe, a selected ellipse shows arc handles, Group wraps a single layer, and Ungroup takes apart frames, boolean operations, and sections. Copy properties and Paste properties (⌥⌘C, ⌥⌘V) carry the look of one layer to others through the system clipboard, to and from Figma.
    - The pen and vector edit mode follow Figma: the pen snaps each new point to the path's own points with a red guide, a pen click away from an open path starts a new piece of the same layer, segments select and drag, deleting a middle segment splits a path, and clicking a filled region selects it. Undo steps through a pen path point by point, and each vector edit is its own step of the document's history (#1894). Text on a path is edited along the path, with the caret and selection following the curve.
    - The layers panel shows each vector, rectangle, ellipse, line, polygon, and star as its own outline, and pins a top-level frame's row while you scroll through its layers, as in Figma.
    - Sections, frames, components, and instances take a status from the document's own list of states, such as Draft, In review, or Ready for dev, shown beside their titles on the canvas (#1203). Figma's Ready for dev and Completed open and save as Figma's own statuses, and scripts and agents read and set statuses.
    - Component behaviours cover more: a Tab behaviour for tab triggers drawn as instances of a component, as in the shadcn/ui kit (#1710), and an invalid state for form controls, which preview shows and generated Vue and React components take as an invalid prop that sets aria-invalid (#1716).
    - Published libraries carry the file's styles and variable collections beside its components, and a thumbnail for each component. Inserting or updating a library component brings in the styles and variables it uses as read-only library copies, and updating a library redraws the document's copies in place, so instances keep their overrides, also on layers the library renamed.
    - Choose how tightly a document's .fig is compressed in the Design panel's Document section: Fast, as Figma saves, Smaller, or Smallest. The choice is stored in the file and Figma opens all three. Saves in the browser and of opened files on desktop write Zstd instead of deflate, so they come out smaller at every setting.
    - Home lists unsaved work kept from documents closed without saving or open when OpenPencil quit, with a preview of each, in place of the recovery prompt at start. In the desktop app and for files in storage, a file reopens on the page and at the view it was left at (#1675), and crowded comment pins gather into one bubble with their count when zoomed out.
    - System notifications cover an AI agent waiting for your permission, a reply that finishes or fails, a mention or reply in a Cloud comment, a failed autosave, which stays shown with Retry save, and a Cloud file that changed in two places or became view only. Clicking one opens that document; choose them under Settings › Notifications.
    - A Help menu gathers the documentation, keyboard shortcuts, release notes, the tour, Check for Updates…, Diagnostics, and Report a problem…, which in official builds sends a report you describe, or an unexpected error, to the OpenPencil team only once you choose Send report (#2009). The desktop app can follow nightly builds from Settings → Updates → Update channel, and Settings → General can turn off the update check at startup.
    - Arrange the interface: dock the toolbar to any edge of the canvas (#1825), split the canvas view to the right with ⇧⌘\, switch tabs with ⌃Tab and ⌃⇧Tab, choose an interface size of 100%, 110%, 125%, or 150% without changing canvas zoom, scale the zoom speed of mouse wheels and pinches, and choose how many recent files the desktop app keeps.
    - OpenPencil is available in Arabic and Brazilian Portuguese. In Arabic the interface reads right to left: panels swap sides and menus, lists, and dialogs mirror, while the canvas, numbers, colors, alignment, and code stay left to right; Mirror the interface in General settings turns it off.
    - Write your own AI instructions in Settings → Prompts, added after OpenPencil's or in their place, with your own prompts for design reviews, chat titles, and compaction summaries (#2132). /review asks the Review model to review the selection or page as an art director, from the layers' structure and lint findings, with a render when the model reads images; Fix these sends the findings to the Design model (#2119).
    - The AI chat handles long and busy conversations: it compacts what came before automatically before the context window fills up, or with /compact, and a Fast model names each conversation. Type @ to mention a layer, page, or skill and / to run a skill or an ACP agent's command, and messages written while the assistant works wait for it instead of being blocked. Agent Skills (SKILL.md folders) load when a request matches, managed in Settings › Skills, and agents search the web with search_web, through OpenPencil Cloud or an Exa key.
    - More coding agents and accounts in the desktop app: Cursor, Grok Build, and Antigravity CLI as the design agent, and sign-in with ChatGPT to use a ChatGPT plan's models without an API key. AI setup shows whether Claude Code, Codex, and Pi are installed and signed in. Claude Code and Codex chats continue in the agent's own session when reopened, revert and restore their edits, and choose the agent's model, thinking level, and modes such as Plan from the composer. Subagents each show as their own agent on the canvas, with a card in the chat that opens what they did (#2033, #2076), and Settings → Usage counts coding agents' tokens.
    - Design JSX writes more of the document: defineVars and defineMode define variable collections and modes, updating them when the same JSX runs again, mode pins a layer's variable modes, exposed exposes a nested instance's properties, and code may begin with statements that end with return. <Vector> takes SVG path data or Figma's vectorPaths, and <Ellipse> draws arcs and donuts with startAngle, endAngle, and innerRadius; any layer flips with flipX and flipY.
    - Scripts use more of Figma's plugin API: paint, text, effect, and grid styles (figma.createPaintStyle(), getLocalPaintStylesAsync(), set…StyleIdAsync(), and their siblings), node.exportAsync() and exportSettings (#1812), fillGeometry, strokeGeometry, outlineStroke(), getCSSAsync(), figma.setCurrentPageAsync() and page.loadAsync(), figma.createImageAsync(url), figma.getImageByHash(), figma.util, and properties such as guides, leadingTrim, openTypeFeatures, and removeOverrides().
    - For agents and the CLI: list_recent_files lists recently opened files inside the MCP root, set_image_fill fills a layer from image_path instead of Base64 a client can cut short (#1830), and get_jsx returns JSX too long to show whole as an outline, writing the complete JSX to a path (#2114). openpencil convert reports a font it cannot load and takes --font-policy, and the CLI reads the .pen libraries a .pen document imports.
    - For SDK hosts: setHostRestrictions narrows the editor to some tools, handle-only path edits, or move-only layers, with editor.asHost(run) for the host's own edits; pen:pressed, pen:released, cancelGesture(), and setSnapTargets follow and refuse the pen; setMovePolicy decides where moves put layers; and recordEdit({ joinStep }) adds a host's response to the undo step it answers. useEditorKeyboard binds the editor's keyboard, <CanvasRoot><CanvasSurface /></CanvasRoot> is a working editor canvas, and openPencil() from @open-pencil/core/node/vite serves CanvasKit, the bundled fonts, and HarfBuzz's subsetter.
    - New npm packages: @open-pencil/cloud, the Cloud server, its contracts, and its typed client; @open-pencil/html-engine, the HTML and CSS layout engine HTML import runs on; @open-pencil/std, a dependency-free standard library; @open-pencil/theme, the editor's design tokens and controls as tailwind-variants configurations; and @open-pencil/oxlint-plugin, OpenPencil's code conventions as Oxlint rules.
    Changed
    - Home is one tab pinned first that never closes and lists places in a sidebar: Recent files, the storage bucket, and the Cloud workspaces of the server you connect each have their own page. Designs open in tabs of their own, + and ⌘N start a new design, and ⌘T shows Home. Recent files show sharp previews of their whole cover page and leave the list one at a time, from Remove from recent.
    - The menus follow the tab in front: on Home and in a New file tab they leave out Object, Text, and Arrange, and in the desktop app items that cannot act, such as Group with nothing selected, are greyed out, as in Figma.
    - Auto layout and grid run on Taffy, the engine HTML import lays pages out with, and size Fill layers in rows as Figma does where they came out narrower before, such as an image that fills its row (#1763).
    - Imported HTML, in the app and the CLI, lands where a browser lays it out at 1440×900, or the window size chosen when opening a URL: CSS grid, floats, viewport units, media queries, and the page's linked stylesheets place layers as on the page, auto layout is kept wherever it reproduces the page, and text is set in the page's own @font-face fonts or the first available family of its font list.
    - PDF exports, from the editor, export_pdf, the CLI, and the MCP server, draw what the canvas draws with Skia's PDF backend: fonts are always embedded and stay searchable, each paragraph keeps the lines the canvas breaks it into, Arabic and other shaped text keeps every letter and its order, variable fonts embed at the axes they are drawn with, and blurs, shadows, images, and shader fills come out as on the canvas.
    - The layers panel lists the front-most layer first, as in Figma, and an auto layout's layers in their flow order; dropping a layer above another puts it in front of it.
    - Lines and arrows select by their two ends, as in Figma: dragging an end turns and stretches the line, Shift holds it to 45° steps, and Alt keeps its midpoint. Dragging a straight segment in vector edit mode bends it at a new point (#1848).
    - Outline stroke and Flatten work as in Figma: Outline stroke replaces each stroked layer by its fill and, above it, its stroke filled with the stroke's paints, keeping rotation, opacity, and effects, and turns text into glyph vectors. Flatten turns text into a vector that keeps each character's colour, its underlines and strikethroughs, and the text's opacity, blend mode, and effects (#1524).
    - Text on a path is shaped with HarfBuzz, so it keeps every kerning, ligature, and contextual form its font defines, and when selected it shows its path, box, and handles instead of a filled band over its lettering.
    - Web fonts from Google Fonts and Fontsource load as their variable files, one download per family. Font settings, including system font access, online font providers, fallback packs, and the downloaded font cache, moved to Settings › Fonts.
    - .fig files OpenPencil writes carry the meta.json Figma writes: the document's name, the thumbnail page's background, and the thumbnail's size, instead of an OpenPencil version, app name, and creation time. Designs saved without a Cover page get a thumbnail of their first page, as Figma's files do.
    - Zoom to fit and zoom to selection fill the canvas with the layers inside the margins Figma keeps, zooming in past 100% for small layers; a page opens fitted to its layers on its first visit and returns to the view it was left at after.
    - Colour and fill pickers are laid out as Figma's: a square colour area, the eyedropper beside hue and alpha, and a gradient stop's colour in a picker of its own. The Effects panel labels every shadow and blur setting, and blurs no longer offer a blend mode (#1942). Panel fields keep units beside the number, colour previews are the same 16 px swatch, and the variable button sits at the end of every field.
    - Settings groups its pages under App, AI, and Data & privacy: snapping and the toolbar are on Editor, AI & agents is Models, and Media is Image services. Every setting with a default offers Reset to default. Add model starts by choosing what the model runs on, and Tool access sets the built-in AI's tools while the local MCP server's tools are set from the MCP page.
    - Guided AI setup gives each role the provider's recommended model, unless what you assigned still works. Recommended models now include Claude Fable 5.2, Claude Haiku 5.5, GPT-6.2 Sol and Astra, GPT-6.1 Terra, Gemini 4 Carbon and Argon, GLM-5.3-FlashX, DeepSeek Flash, and MiniMax-M3.1-Flash; earlier models remain available from the full model list.
    - The chat shows that an agent is working for the whole reply, replies fade in word by word, Claude Code's thinking appears as summaries, the Pi agent runs Pi 1.5, which connects to MCP servers itself, and each of your agents on the canvas has a color of its own.
    - An MCP, CLI, or WebMCP call that names no document works on the document its session last worked on, instead of whichever tab is in front, so agents stay in their own documents while you switch tabs; with none it fails and names the open documents to pass as document_id. Every CLI command that works on one page takes --page or --page-id.
    - Agent tools are stricter: batch_update applies all of its operations or none (#1651), render with replace_id updates the layer in place, so it and its matching descendants keep their ids and bindings (#2118), and arrange spreads overlapping layers apart by default; pass mode: "grid" for the grid.
    - JSX export, in the Code panel, get_jsx, and the CLI, starts with the defineVars and defineMode for the variables its layers use and writes each bound value through its prop, as in bg={theme.Surface}. Design JSX warns about an unknown enum value and renders the rest, designMode also takes a mode's ID, and dashPattern dashes every stroke without a dash of its own (#2186).
    - The tour opens from the OpenPencil Cloud gallery instead of a copy built into the app, so it needs a connection, and its tips show both macOS and Windows/Linux shortcuts (#2072).
    - Smaller changes: on phones, Share sends a room link through the system share sheet; a new profile opens documents with design-issue markers off; and the web app offers a new version in a notification with a Reload button instead of reloading under you.
    - The daily ping also reports how many days the install has pinged, as a doubling step (1, 2, 3–4, 5–8, and so on) rather than the number itself.
    - @open-pencil/core declares ai as an optional peer dependency.
    Fixed
    - .fig files open more faithfully: image crops, rotated lines, icons shown through a nested component property, and instance swaps, theme colours, and positions on pages opened after the first. Files open when a layer's visibility is bound to a variable, when variables use expressions OpenPencil cannot evaluate yet, such as VAR_MODE_LOOKUP, when an instance leads back into its own component (#2191), and when layers hold a NaN or Infinity, such as stroke weights saved by OpenPencil 0.16.
    - Saving .fig files loses nothing: edits made by scrubbing a number field or dragging a handle, layers grouped or moved into a frame, and the positions auto layout changes are saved instead of dropped. Documents save and load pages again after a layer of a component is deleted (#1425, #1427), after moving a component with an instance in slot content, and with vector masks. Components and pages keep their order (#1707), a page's variable mode is saved, and flipped layers keep the flip.
    - Saving a large .fig writes the archive as it is produced, so a desktop save of several hundred megabytes no longer runs out of memory. A save that fails partway leaves the previous file in place and stays visible with a retry, and saving from MCP or the CLI to a path that is not .fig or .jam fails before writing.
    - Image fills keep Figma's adjustments when edited and saved (#2233, #2268), and video fills from .fig files draw their poster frame instead of nothing, with saves, exports, copies, and rooms keeping the video (#1858).
    - Instances keep what they set, as in Figma: a rescaled instance's vector shape after reopening, overrides on nested instances and slot content, cleared fills, strokes, effects, and text styles, plain colours set over variable-bound paints, and names when opened in Figma. Nested instances keep their own align, grow, and constraints instead of taking their main component's (#1883), and switching a variant keeps layers, IDs, and overrides wherever the new variant has a layer of the same name. Duplicating an instance from a .fig file with two instances of the same component no longer makes the document fail to save.
    - Component sets follow Figma: the default variant is the one Figma picks, sets from files that save no variant values, such as the shadcn/ui community kits, list their values in Figma's order, sets made in OpenPencil open in Figma as component sets, and their properties appear once, on the set (#1699, #1737). An instance of a library component set lists every variant and switches to any of them (#1811).
    - A paint bound to a color variable keeps a color or opacity written over it until the variable's color for that layer changes, as in Figma (#2047). Layers keep their text, fill, and stroke styles when variable bindings resolve, variable modes open in Figma's order with Figma's default mode, and saving gives a variable whose ID Figma cannot read a new one.
    - Libraries: text links inside a library component point at the component's own layers (#1906), inserted components keep their instances' overrides and instance-swap defaults, and openpencil libraries publish gives a component without an asset key a valid one instead of failing.
    - Text keeps each font face's own style name ("Semi Bold", "Book", "Italic"), so text saved to .fig or copied to Figma no longer opens there as a missing font. Faces that weight alone cannot pick, such as Avenir Book or Roboto Condensed Bold, load and draw as themselves, as do Windows fonts listed under families of their own (#2123, #2131). Text in a style its font lacks draws in the face the font has instead of a slanted or emboldened imitation, and text is laid out again once a font that was still loading arrives, instead of staying blank (#1821, #1947).
    - Emoji in text from Figma draw as emoji instead of squares and keep drawing in Figma after a save, and the caret treats an emoji as one character. Japanese, Chinese, and Korean text in web fonts draws in the browser app. CJK text no longer runs CanvasKit out of memory after repeated edits (#1684), and documents with thousands of texts in a large variable font, such as Noto Sans SC, open instead of running out of memory (#1761).
    - Text is laid out as in Figma: baselines sit on the whole pixel Figma draws them on, fractional and zero line heights take Figma's heights, letter-spaced text no longer gains an ellipsis or an extra line break (#1857, #2149), auto-width text keeps each line whole in a narrower auto layout frame, and a fixed-size text grown past its box draws its other lines instead of being cut off (#1885). Truncation set through the plugin API or tools works instead of failing with an invalid enum value (#2028), and gradient-filled text spreads its gradient across the layer.
    - Editing text keeps styles: text typed at the edge of a styled range, after Enter, over a selection, or pasted keeps that range's colour, font, and variable bindings, and styles set from the design panel apply to every character of a text styled in ranges. The caret takes the colour of the character before it, so it shows on light text over dark backgrounds.
    - Text drawn from the glyphs saved in a .fig file, because its font is missing or loading or it is set on a path, has smooth edges (#1799), keeps accents and descenders past its box (#1805), and places the caret where you click while edited. Resizing text on a path lays it out again along the resized path instead of scattering the old letters.
    - Clicks select as in Figma (#1664): a single click inside a selected frame keeps it selected, each double-click goes one level down, a group's empty area no longer takes clicks, and shapes are picked only where their fill or stroke draws (#1685). Clicks pass through locked layers (#1941), Escape clears the selection at any depth, and Shift-dragging a selected layer moves it instead of dropping the selection (#2113).
    - Continuing a vector's path with the pen grows that same layer, which keeps its name, position, parent, and style. The pen closes paths as Figma does (#1861), removing a point where three or more segments meet no longer leaves the shape filled as an open path, editing a path no longer stretches its gradient, and Flatten keeps each layer's fill on its own part of the vector, with rounded corners and ellipses as one curve each instead of dozens of points.
    - Groups span only their visible layers, refit when a layer inside is hidden, shown, deleted, or moved out, and remove themselves when left empty, with undo bringing them back (#2140). Layers in a group keep their own constraints against the frame around it (#1914). A rotated layer resizes along its own axes, resizing keeps stroke weights and no longer rounds the layers inside a frame to whole pixels (#1816), and typing a width or height for a frame places its layers by their constraints.
    - Auto layout matches Figma in more cases: negative item spacing and padding (#1884), a frame with nothing to hug keeping its size, wrapped rows spaced and aligned as set (#2145), and duplicates placed in the flow.
    - Strokes draw as in Figma: per-side weights as one ring with filled corners (#2094), dashes laid out per side and corner with whole dashes (#1973), lines with their caps and arrow heads at Figma's size, and inside or outside strokes that follow stars, polygons, arcs, and vectors. A dashed stroke keeps its dash pattern when a document is saved and reopened, also on a layer inside an instance (#2186), and a gradient stroke on a straight line draws instead of stopping the canvas.
    - Shadows, masks, and blurs draw as in Figma: shadows are cast from everything a layer draws, including strokes, children, and boolean operations (#2133), and draw out to their faint edge instead of stopping at a canvas tile (#1808). A rotated, flipped, or blurred mask masks everything it covers, layers with opacity or a blend mode draw whole when rotated instead of being cut off (#1767), boolean operations keep their operands' strokes and orientation, and tiled images draw at their own size and scale.
    - Exports take a layer at the size Figma exports it (#1847, #2094), text is measured by the ink of its glyphs (#1812), PNG, JPG, and WebP exports no longer blur an image placed at its own size (#1859), and WebP and JPEG export work on macOS desktop and in Safari. export_image works for a document whose canvas is not on screen and says why it returned no image (#1169).
    - SVG export sets text on the lines and baselines the canvas draws, in the case it is set to show, keeps inside and outside strokes on their side, arrow heads, fill and stroke opacity, and image fills as the canvas draws them, and draws background blur behind the layer, shadow spread, and shadow blend modes; effects SVG cannot draw are listed in the export's warnings. Exports from the CLI and MCP server running at the same time no longer draw one document's shapes in another's.
    - HTML and Tailwind export draw linear, radial, and angular gradient fills and stacked fills with their blend modes, blur layers and shadows as the canvas does, where blurs were 2.3 times as strong, and keep text shadows and each layer's constraints. HTML bundle export keeps SVG images inline instead of writing .svg files that could run script (#1869), and JSX export no longer fails for a layer with a noise effect (#2115).
    - Imported HTML draws closer to the browser: borders take room inside their boxes and appear only on the sides a page gives a width, generic font families use real fonts, CSS transforms, white-space: nowrap, percentage corner radii, and unitless line heights are applied, lists stay in one text layer, and linked pictures appear instead of empty layers. Pages are set in the fonts they load with @font-face, and HTML imported in the dark-themed app is styled in the light color scheme.
    - Import SVG keeps content hidden by visibility or display as hidden layers (#1166), applies a transform on the root <svg>, scales stroke weights by element transforms, draws gradient strokes, and leaves fill="none" shapes unpainted instead of black. Iconify icons draw in their set's own box, so sets without a size, such as Bootstrap Icons, fill the icon, and icons with gradients or xlink:href draw instead of coming out black or empty.
    - .pen files draw as in pen.dev: strokes, gradients, blend modes, and blurs (#1324), turned, mirrored, and grouped layers, text weight, wrapping, and alignment, auto layout with space-between and absolute layers, and icons from Lucide, Feather, Phosphor, and Material Symbols. Variables resolve in every theme across several theme axes, and a document with many theme axes opens instead of hanging (#1829). Instances keep their component's layout and paints, and documents whose overrides replace layers save as .fig.
    - The plugin API follows Figma more closely: variant properties rename and read as in Figma, inserting and deleting characters keeps each character's style, paints set in Figma's shape take effect, setters refuse values of the wrong kind or NaN and Infinity with Figma's messages, and figma.viewport and the zoom_to_fit and set_viewport tools move the canvas in the app (#1390). figma.flatten() and boolean operations in openpencil eval make real vectors instead of a placeholder box.
    - Design JSX exports components, component sets, and instances with their property() bindings, property values, and overrides, so they render back as linked components, and exports several layers as one expression in a fragment. It rejects an instance variant value the set does not have, leaves out a layer prop of the wrong kind as its warning says (#2071), and replacing a layer keeps the original when the replacement fails to render, in the original's place among its siblings (#1428, #2120).
    - Agent edits are safer: an agent's undo step holds only its own changes, a tool call or eval script that fails part way is rolled back, and an MCP call that times out is cancelled in the app instead of editing later (#1866, #1900). Agents can no longer add layers inside an instance, which left the document unable to save as .fig. Tools read pages that have not been opened yet, and text changed to a font that had not loaded takes its real size.
    - The MCP server no longer runs out of sessions after failed initializations or cancelled calls and closes sessions idle for 15 minutes. The desktop app waits up to 20 seconds for a slow-starting server and ends the server process when it stops or quits (#1167), and on macOS 14 and later agents keep editing while the app is hidden or the screen is locked (#979, #2184). Design files up to 256 MiB open through MCP and from web links, and long sessions no longer keep growing in memory once undo history is full (#2066).
    - The CLI saves a .fig with a rendered thumbnail and replaces the file only once it is fully written, so a failed save keeps the previous file. openpencil export -f pdf no longer fails with "DOMParser is not defined", PNG export works on Windows, --page-id reads that page of the running app, and the CLI packages load under Bun 1.3 again (#1397).
    - Large documents open and stay open: pages with a layer of more than about 120,000 direct children no longer overflow the stack, a document still opening in a background tab no longer fails with "The operation was timed out" (#2099), switching pages in a large .fig no longer freezes the editor (#2093, #2095), and reloading a large document after its file changed on disk no longer crashes the tab. A document whose page fails to draw reports the failure instead of closing its tab (#2070).
    - A document opened from a .fig file keeps a recovery copy of its unsaved edits while autosave is off, so a crash no longer loses them, and on macOS the desktop window loads the editor again when WebKit ends its page, instead of staying blank (#2037).
    - In browsers: Safari keeps each tab on its own document, where after a few tab switches every tab showed the one before it; a document opened from a link saves with Cmd+S and is covered by crash recovery; saving falls back to a download when the browser will not write to the chosen file; and requests to Cloud, the model catalog, and font downloads no longer wait forever on a server that doesn't answer.
    - Desktop app: on Linux, Backspace and letter keys type into comments and text fields instead of running menu commands, so Backspace no longer deletes the selected layer while you type; and the app no longer exits at startup on Wayland with the NVIDIA driver and older WebKitGTK. On Windows, documents are named by their file, not their whole path, and on Windows and Linux the Software Update window no longer shows the editor menu bar (#1230). Links in chat replies open in the browser instead of showing "shell.open not allowed", and View → Variables… opens the variables dialog.
    - Keyboard shortcuts follow the letters printed on QWERTZ, AZERTY, and other Latin layouts, so Cmd/Ctrl+Z undoes on a German keyboard, and keep their key positions on non-Latin layouts (#1844). Mod+S saves while editing text, and ⌘J opens the AI chat while the panels are hidden.
    - The canvas view stays put: hiding and showing the UI or panels keeps the drawing where it is instead of restarting or shifting it (#2122), a sideways two-finger swipe pans instead of going back in the browser's history, and the canvas draws sharp at any panel width (#1774). Panel fields show fractional values to two decimals instead of the raw value a .fig file stores (#1905, #1923).
    - Undo marks the document saved again when it returns to where it was saved, including after edits inside a component or by an AI agent (#1822, #1910), and undoing a duplicate, a layers panel drag, or a reorder inside a slot takes one step instead of two (#2143).
    - Panels and pickers: removing a fill, stroke, or effect keeps each remaining item's variable binding on that item; Escape closes a colour picker and keeps what was changed, and each drag in a picker is one undo step (#1437); and double-clicking a layer's expand arrow, lock, or visibility button no longer starts renaming it (#2246).
    - In a shared room, comments, replies, review statuses, and file settings that several people change at once all keep their changes instead of one replacing the others, and enabled libraries and the document's color space reach everyone in the room.
    - Interface: accent-colored text meets WCAG AA contrast in both themes (#2166), browsers set to Chinese open the app in Simplified Chinese, the interface draws in Inter on systems without it installed, and saving an API key while the system credential store is locked explains how to unlock it (#1925).
    - AI chat: Claude Code, Codex, and Gemini CLI chats end when the agent finishes its turn instead of staying busy, show their OpenPencil tool calls with results instead of as failed, and start the agent in a folder of OpenPencil's own instead of your home folder. Off and Minimal thinking no longer fail on OpenRouter models that always reason, Claude models through OpenRouter mark the prompt for caching, and tool images reach MiniMax and OpenAI-compatible models as images instead of Base64 text.
    Performance
    - Progressive rendering settles a changed canvas in tens of milliseconds instead of over a second and keeps exact tiles on screen while panning. Adding, removing, or moving a layer on a large page renders only the tiles it touched, and resizing the canvas renders only the newly exposed edge (#1753).
    - Pages with thousands of text layers draw faster, typing into a page of tens of thousands of layers no longer stalls at every keystroke, laying text along a path is about 50 times faster, and shadows of frames whose layers stand apart, as in rows of cards, render about four times faster.
    - Opening a .fig reads its record index up to 1.7× faster and decompresses about 3× faster with Zstd; large pages load about 15% sooner, and pages with many instances about a quarter sooner (#2104, #2116). It also needs less memory: each image is kept once instead of twice, only the active page is prepared, and switching to a page loads only the component sets its instances use.
    - openpencil export --node, eval, and tool call with --page or --page-id load only the page they need, so on a 24-page file with 240,000 layers a call takes about 3 seconds instead of 30 (#1988).
    - Switching pages is faster on large documents, deleting, hiding, or reordering a layer no longer lays out every auto layout frame on its page (#2128), and switching a variable mode lays out bound auto layouts once: on a frame of 1,600 bound cards, from about 36 seconds to under 0.1 seconds.
    - AI and MCP agents edit properties in documents of any size: a one-property edit takes milliseconds instead of seconds on large files and is no longer refused above 10 000 layers (#1866). Undo history holds about a quarter of the memory in long agent sessions (#2037).
    - Saving a large document on desktop hands its bytes to the native file writer as binary chunks instead of spending minutes encoding them as JSON. Joining a collaboration room on a large document is much faster and uses far less memory.
    - The editor downloads and compiles CanvasKit once instead of twice and no longer downloads AI provider code at startup, the web app's offline cache is about 9 MiB smaller, and the desktop app binary is about a third smaller on macOS arm64.
    Security
    - A coding agent the app starts, or any MCP client, gets a token that opens only MCP sessions, where the server's tool switches, file root, and "Share only the selection" apply, instead of the server's own token, which also opened /rpc, /files, and the app's socket; requests sent over the socket now keep to the selection too (GHSA-6r2v-cq7x-fvh6).
    - Opening, dropping, or pasting HTML as layers, and previewing HTML in the Code tab, no longer runs scripts the markup carries, such as an image's onerror: the browser lays it out in a frame that runs no script (GHSA-x4rx-8c38-9hw8). The one exception is File → Open from URL… in the desktop app with the page's scripts allowed, which runs them in a hidden private window before reading what they built.
    - On desktop, the app's window can no longer write to the folders it looks for coding agents and its own companions in, such as %LOCALAPPDATA%\agy\bin on Windows, so nothing it runs could have been put there from inside the window (GHSA-x4rx-8c38-9hw8).
