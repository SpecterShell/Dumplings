  Key: ReleaseNotes
  Value: |-
    MindFS v0.5.2
    新功能
    - 文本文件编辑
    - 任务编排：通过 cli 进行 agent 无关的任务编排，依托任务看板，大需求拆分更顺手、直观。
    优化和修复
    - api 供应商一键同步：方便新增模型后一键同步到 agent
    - 修复 dsh 的 token 用量统计错误
    - 修复 acp terminal 错误
    - 修复访问 markdown 中项目外部文件链接访问错误
    - 移除输入框中的蓝点，避免会话消息发送混乱
    - mermaid 可放大到全屏预览，手机上能放大缩小
    - 会话 token 总用量（在 agent 回复下方）
