  Value: |-
    MindFS v0.4.4
    优化和修复
    - 删除项目目录后自动移除项目
    - 命令模式只显示命令输出
    - 移动端按钮点击去掉蓝底
    - codex/claude 会话导入增加 toolcall
    - 插件加载增加确认流程
    - 配置切换时清理残留环境变量
    - agent 配置切换中增加重启按钮
    - 回复下面展示回复所用时长
    - 优化 git diff 展示效果
    - 修复 Window 下关闭终端导致 mindfs 被关闭
    - 任务卡片显示是否开启 worktree
    - 服务重启上下文窗口不丢失
