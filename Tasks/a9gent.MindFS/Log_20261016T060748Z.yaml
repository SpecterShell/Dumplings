  Value: |-
    MindFS v0.5.7
    优化和修复
    - 会话加载同步性能优化
    - 记住最后使用的 agent
    - 修复移动端在抽屉视图中编辑最后一条消息时的 ui 异常
    - 可以通过包含 ?dir= 的 url 直接打开目录界面
    - 可以通过启动参数 -title 设置标签页标题
    - 移动端左右侧边栏可以手势滑动控制
    - 会话菜单增加交接包
    - 更丰富的蓝环动作
    - 模型可以置顶，方便快速切换
    - codex 切换供应商时添加 gpt 以外的模型
