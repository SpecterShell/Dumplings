  Value: |-
    MindFS v0.5.6
    新功能
    - 自定义蓝环手势
    - 加入节点列表，方便多节点切换
    - 从会话菜单发起定时任务
    - 最后一条用户消息原地编辑
    优化和修复
    - 移动端可以选择显示哪些 agent 回复信息，减少换行空间占用
    - 会话菜单中可以复制会话 id，会话文件路径
    - 修复 markdown 中删除线渲染错误
    - 优化任务编排开启提示词
    - 修复讯飞输入法输入英文兼容问题
    - e2ee 配对码配对限速
