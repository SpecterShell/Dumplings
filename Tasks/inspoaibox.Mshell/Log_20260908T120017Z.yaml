  Key: ReleaseNotes
  Value: |-
    新增本机 Agent / MCP 接入
    让 Codex、Claude 等 Agent 操作当前已连接的 SSH 会话
    默认能力以只读为主：会话列表、连接状态、远程目录、远程文本文件和受限查询命令。 只有开启“允许写入与修改”后，Agent 才能写文件或执行修改命令；不暴露密码、私钥或 Electron IPC。
    安全边界
    只接受本机请求，并且必须携带访问令牌。
    只能操作 MShell 当前已经连接的 SSH 会话。
    远程文件读取限制为单文件 1 MiB，目录最多返回 2000 项。
    查询命令限制为单条白名单命令，禁止管道、重定向和修改类操作。
    “允许写入与修改”关闭时，写文件和修改命令会被服务端拒绝。
    每次 Agent 工具调用都会写入现有审计日志。
    查询示例
    先调用 list_ssh_sessions，并让我确认 connectionId。
    确认后调用 execute_readonly_command 执行 df -h。
    读取 output 并总结磁盘使用情况，不要修改服务器。
