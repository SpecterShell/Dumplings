  Key: ReleaseNotes
  Value: |-
    更新内容
    本次更新重点修复 SSH 跳板机连接问题，提升连接稳定性和错误提示的准确性。
    - 修复开启跳板机后，终端一直停留在“Connecting…”、无法成功连接也不提示失败的问题。
    - 修正多级跳板机的连接顺序，实际连接路径与配置页面保持一致。
    - 修复跳板场景下的目标私钥登录流程，支持跳板机与目标服务器分别使用密码或私钥认证，以及带密码保护的私钥。
    - 完善连接超时、认证失败、转发失败和连接中断时的错误提示。
    - 改进取消连接和自动重连逻辑，避免取消后继续重连或残留后台连接。
    - 将“测试连接”调整为“测试链路”，检查跳板机到实际目标地址及端口的连通性；目标账号认证仍通过终端连接验证。
    - 改进 HTTP、SOCKS5 代理握手处理，避免网络分包或数据合并导致 SSH 握手数据丢失。
    注意事项
    MShell-Setup-版本号.exe - 安装版（推荐）
    win-unpacked.zip - 免安装版
    app-debug.apk - 安卓手机版本
    其他文件（latest.yml、.blockmap）为自动更新所需，无需手动下载
