- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Security:
    - Fixed script injection in event scripts. With JScript, untrusted values passed to event handlers (such as the logon password in OnClientValidatePassword, or error text and UIDs sent by remote servers) could break out of their string. With either script language, a rule's "Run function" name could carry code. This would allow an attacker to run arbitrary code in the hMailServer process. Values are now escaped, and rule function names may only contain letters, digits and underscores.
    If you are unable to install this version, disable JScript execution and do not give end-users access to the hMailServer COM API.
