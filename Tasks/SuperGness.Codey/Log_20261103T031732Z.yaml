- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新增功能
    - 新增防御性编程约束规则，应用于 Codex 新会话、压缩后会话及子代理。
    - 支持在桌面宿主模式中永久删除对话消息。
    - 额度详情新增重置次数及最近过期时间，并提示即将过期的次数。
    - 托管会话切换模型时可先完成上下文交接，再发送新回合
    体验优化
    - 隐藏宠物浮窗时不再自动预热，语音浮窗仍按需创建
    - 定价与充值网页改为打开时才加载
    - 系统代理变更后，账号授权、模型获取和更新检查等请求会自动应用新设置
    - 删除消息后保留当前画面和滚动位置，减少重载闪烁。
    - 优化额度卡片和详情面板的视觉样式与信息布局。
    - 头像浮层和结账页改为按需加载，不再预加载隐藏页面，增加预加载面板
    - 额度详情改为展示剩余比例和重置时间，不再显示已用比例。
    问题修复
    - 设置面板预加载期间点击可在加载完成后打开，加载失败后也可重试。
    - 宿主托管模式下发送消息也会应用模型请求校验。
    - 修复桌面宿主模式下任务结束后对话状态未及时刷新的问题。
