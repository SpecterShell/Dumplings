  Value: |-
    新增 New API 连接信息快速导入，自动填写线路地址和密钥。
    启动代理支持账号密码认证，并增加连通性检查。
    优化请求日志，清晰展示请求状态、模型流转、耗时及 Token 用量，改进筛选和统计。
    修复应用重启后原日志页面无法继续访问的问题。
    改进 Codex 启动兼容性，修复 Windows 沙箱环境下的启动确认问题。
    修复流式响应结束时工具调用及后续对话记录可能丢失的问题。
    优化预热请求处理，避免产生多余的上游调用。
    更新 macOS 和 Windows 应用图标。
