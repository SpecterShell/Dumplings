  Value: |-
    新增功能
    - 第三方线路可按模型配置 Ultrafast，并在模型目录和选择器中显示速度选项
    - 官方账号模型目录会同步速度档位与上下文窗口
    体验优化
    - 容量允许时，官方模型默认使用 400K 上下文窗口
    问题修复
    - 模型目录变更后，运行中的会话继续使用启动时的上下文预算，并正确提示重启生效。
    - 父会话与子代理可在共享会话中并行执行压缩，不再相互阻塞。
