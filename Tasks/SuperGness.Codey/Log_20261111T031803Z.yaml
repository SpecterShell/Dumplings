  Key: ReleaseNotes
  Value: |-
    新增功能
    - 扩展条目现可查看声明依赖的数量及详情
    - 新增 STDIO 与 HTTP 示例模板，便于快速创建 MCP 服务配置。
    体验优化
    - 扩展列表支持跨页保留选择，并可批量启用或禁用所选资源。
    - 扩展列表改为卡片展示，集中查看类型、来源、状态和配置异常
    - 深色模式改为柔和的石墨灰层级，减少纯黑画面的强烈反差
    问题修复
    - Windows 下以管理员权限启动时，应用会在需要时重新以普通权限运行。
