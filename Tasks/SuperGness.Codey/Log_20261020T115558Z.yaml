- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新增功能
    - 支持自动复核的线路现在可路由自动复核模型请求
    - 路由请求日志新增路由决策和上游尝试详情，可查看重试结果与响应状态。
    体验优化
    - 注入确认补丁在位后即可继续启动，模型请求入口就绪改由后台轮询
    - 支持使用完整可见历史切换线路，无需源线路仍可用。
    问题修复
    - 模型目录与请求路由统一过滤不可用线路，避免展示无法路由的模型
    - 上游因缺少 reasoning 文本返回 400 时，会自动补齐并重试一次
    - 原生线程压缩未完成或被拒绝时，不再提前切换会话线路绑定
    - 上游 WebSocket 长时间无数据时会按上游超时处理
    - 第三方模型路由不再继承官方模型的压缩标识。
