  Key: ReleaseNotes
  Value: |-
    新增功能
    - 新增额度提示关闭能力，方便收起额度通知。
    - Windows 下 Codex 确认崩溃后会在交互会话可用时自动恢复启动
    - 支持停止正在执行的可移植摘要任务。
    体验优化
    - 页面内容高频变化时，扫描任务分批处理，减少界面卡顿。
    问题修复
    - 修复 Codex 启动失败后残留进程及配置未能完成清理的问题
    - 自定义工具的多次异步通知可正确保留在会话历史中，避免后续请求失败。
    - 切换会话或在多个列表查看时，任务运行状态不再误判或残留
    - 停止任务后，后续请求会等待清理完成，避免旧请求继续发送。
