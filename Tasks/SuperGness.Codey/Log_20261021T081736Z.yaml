  Key: ReleaseNotes
  Value: |-
    新增功能
    - 安装 Skill 前可预览名称、文件清单和大小，来源变化时需重新预览。
    - 插件列表新增全部、已启用和未启用状态筛选。
    - 用量分析新增自定义日期范围和今天、本月等快捷筛选。
    体验优化
    - 上游不支持图片时会提示切换模型，并说明历史图片也可能导致错误。
    - 设置控制台改为侧边栏布局，导航与品牌信息更清晰。
    - 侧边栏集中显示 Codex 运行状态，并提供保存与重启操作。
    - MCP 配置编辑区支持直接粘贴 JSON，也可导入文件
    - Skill 编辑内容上限提高至 4 MiB，MCP 仍为 1 MiB。
    问题修复
    - 修复命名空间工具调用名称混入 DSML 标记后无法正确识别的问题。
    - 扩展清单读取总量超限时会明确报错，避免生成不完整清单。
    - 重命名 Skill 遇到同名启用规则时会阻止保存，避免启用状态异常。
    - 过期的异步读取不再覆盖最新状态，失败后会释放操作标记。
