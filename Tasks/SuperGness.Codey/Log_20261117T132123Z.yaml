  Value: |-
    新增功能
    - 请求日志支持按请求 ID 或会话 ID 精确搜索。
    - 请求日志新增按供应商、模型、上游协议和请求类型筛选。
    体验优化
    - 白名单模型现在可使用 Ultrafast 推理档位。
    - 会话统计条会根据可用宽度切换紧凑显示，窄屏下更易查看。
    - 请求日志页重新整理概览、统计与明细布局，表格可在卡片内滚动查看。
    问题修复
    - SIWC 官方直连的压缩请求改由网关生成摘要。
    - 退出时完整写入已接收的请求记录，减少日志丢失。
