  Key: ReleaseNotes
  Value: |-
    新增功能
    - 在受支持的 Codex 桌面客户端中，通过 Codey 冷启动时播放开场动画。
    体验优化
    - 统一控制台组件尺寸与主题样式，改善深色模式下的文字和控件对比度。
    - 统一配置应用失败时的提示，并支持重试状态检查。
    - 在 Codex 扩展管理页集中显示扫描警告，方便查看被跳过的符号链接。
    - 减少启动和会话刷新时的重复读写，降低本地请求转发、协议转换和日志记录的开销。
    - 缩小 Codex 页面增强脚本的体积，并让请求日志页按需加载。
    问题修复
    - 修复恢复历史对话时模型提供方被强制切换的问题，恢复后沿用原来的模型提供方。
    - 修复官方账号下线后默认模型和子代理模型配置回退异常的问题。
    - 修复独立请求日志页未加载专用脚本的问题。
    - 适配新版 Codex 的页面增强、宿主连接、宠物状态存储和 Ultra 完整访问权限提示。
    - 修复客户端工具输出缺少调用 ID 时的兼容问题。
