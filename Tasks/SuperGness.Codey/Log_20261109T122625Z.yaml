- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新增功能
    - 第三方原生 Responses 请求现会补齐工具清单。
    - 探索型子代理现在也可写入工作区。
    - 原生额度提示的关闭按钮现已支持 Codex、Work 和 Team。
    体验优化
    - 统计详情改为分组卡片布局，窄屏下关键指标纵向展示
    - 滚动或调整窗口大小时，统计详情浮层会重新定位
    - 充值卡将在重置次数过期前 18 小时开始预警。
    - 隐藏设置页时暂停账号用量查询，重新打开后自动刷新
    问题修复
    - 修复压缩后工具声明丢失，导致后续请求无法继续使用工具的问题
    - 修复会话元数据中转义或重复字段导致的信息读取不准。
    - 子代理事件携带父级记录路径时，也能正确识别子代理自己的运行记录。
    - 修复子代理创建结果未及时关联时，后续任务操作无法识别该代理的问题
    - 避免将目标横幅和仍有剩余额度的提示误判为额度耗尽通知。
    - 清空提示词后立即点击优化，不再发送空请求
    - 修复浏览器调试端点探测被不可用回环地址拖慢的问题
