    - DXF: no CLASS instance counts in R2000 files (AutoCAD LT 2026 hung opening them) by @Slopapalooza in https://github.com/storytold/cadcraft/pull/1060
    - Ctrl/Cmd+W closes the drawing, as the File menu shows by @ATARYS-LAB in https://github.com/storytold/cadcraft/pull/2057
    - engine: renaming a layer repoints every viewport's frozen list and colour overrides by @midasmatterhorn in https://github.com/storytold/cadcraft/pull/1264
