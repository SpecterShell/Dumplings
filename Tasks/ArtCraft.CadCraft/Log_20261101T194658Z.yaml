- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    What's Changed
    - Validate new linetype names in the rename command by @Silvertree2010 in https://github.com/storytold/cadcraft/pull/2519
    - Updates: shared check-result dialog from craft-update by @aiongg in https://github.com/storytold/cadcraft/pull/2530
    - docs: tidy agent, contributor and asset docs by @aiongg in https://github.com/storytold/cadcraft/pull/2527
    - Backups of drawings sharing a name no longer overwrite each other by @tanish2k09 in https://github.com/storytold/cadcraft/pull/2537
    - Picking after an edit no longer ends the app on an rstar panic by @tanish2k09 in https://github.com/storytold/cadcraft/pull/2539
    - fix(ui): dash only the visible part of a highlight, so zooming far in doesn't freeze (#2299) by @austin62jake in https://github.com/storytold/cadcraft/pull/2454
    - wblock: write the source drawing's $INSUNITS and $MEASUREMENT (#2002) by @SusieeTheLinuxUser in https://github.com/storytold/cadcraft/pull/2023
    - fix(dxf): preserve LEADER vertex Z coordinates (#2245) by @Zaxaerith in https://github.com/storytold/cadcraft/pull/2397
    - Reject non-finite arguments in CAL min() and max() by @Silvertree2010 in https://github.com/storytold/cadcraft/pull/2547
    - Reject nan and inf text values in SETVAR for real variables by @Silvertree2010 in https://github.com/storytold/cadcraft/pull/2546
    - Fix LISP atof returning a wrong value for out-of-range exponents by @Silvertree2010 in https://github.com/storytold/cadcraft/pull/2533
    - Clamp Bounds2 width/height instead of overflowing to infinity by @Silvertree2010 in https://github.com/storytold/cadcraft/pull/2532
    - Reject out-of-range OSMODE values in SETVAR instead of wrapping by @Silvertree2010 in https://github.com/storytold/cadcraft/pull/2531
    - Refuse mirror lines whose points are closer than the geometry EPS by @Silvertree2010 in https://github.com/storytold/cadcraft/pull/2555
    - Add -UNITS; show due surveyor bearings as one letter by @2ez4gcx in https://github.com/storytold/cadcraft/pull/2562
    - SCALE scales heights; OFFSET keeps them by @2ez4gcx in https://github.com/storytold/cadcraft/pull/2558
    - RECTANG and POLYGON vertices in AutoCAD's order; RECTANG remembers its modes by @2ez4gcx in https://github.com/storytold/cadcraft/pull/2554
    -  -INSERT: ATTREQ, Preset and Verify attributes as AutoCAD asks them by @2ez4gcx in https://github.com/storytold/cadcraft/pull/2535
    - CHANGE: change objects by a change point or their properties, as AutoCAD does by @2ez4gcx in https://github.com/storytold/cadcraft/pull/2534
    - Add Vietnamese (vi) to the interface languages by @2ez4gcx in https://github.com/storytold/cadcraft/pull/2541
    - Turkish catalog: fix wrong registers and resolve term collisions by @GULERTOLGA in https://github.com/storytold/cadcraft/pull/2536
    -  -ARRAY: the classic command-line array, as AutoCAD lays it out by @2ez4gcx in https://github.com/storytold/cadcraft/pull/2538
    - packaging(flatpak): add OCI image build and GHCR publishing helper by @dylanmtaylor in https://github.com/storytold/cadcraft/pull/2577
    - Window opens centred; the Chinese menus have no English entries left (#1129) by @ZIDAN44 in https://github.com/storytold/cadcraft/pull/2510
    New Contributors
    - @GULERTOLGA made their first contribution in https://github.com/storytold/cadcraft/pull/2536
    Full Changelog: https://github.com/storytold/cadcraft/compare/v0.15.1...v0.16.0
