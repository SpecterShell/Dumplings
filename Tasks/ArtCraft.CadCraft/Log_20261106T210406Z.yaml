    - Land #1971 and #2016: Georgian font and Georgian interface language by @tanish2k09 in https://github.com/storytold/cadcraft/pull/2833
    - Fonts: draw Georgian with craft-fonts' Noto Sans Georgian, on the desktop and the web by @devius in https://github.com/storytold/cadcraft/pull/1971
    - i18n: add Georgian (ka) interface language by @devius in https://github.com/storytold/cadcraft/pull/2016
    - build: drop three egui patches nothing uses by @tanish2k09 in https://github.com/storytold/cadcraft/pull/2835
    - Stage 1 stack: land #2584, #1626, #2028, #2107, #2471, #1026, #2612, #2545, #2658 by @tanish2k09 in https://github.com/storytold/cadcraft/pull/2837
    - Menus list their items in the reference menu tree's order by @assamaral in https://github.com/storytold/cadcraft/pull/2658
    - fix(dxf): hostile-input hardening in the DXF reader and writer (fixes #1025) by @vangel76 in https://github.com/storytold/cadcraft/pull/1026
