    - mobile: 新增 Android 远程连接客户端 (#460) (37e95a9)
    - tunnels: 支持设置基于提供商的隧道以启用远程连接 (#453) (1035d1e)
    🐛 问题修复
    - agent: 修复变更汇总和轮次 Diff 详情不准确的问题 (#477) (a48f336)
    - agent: 修复模型以 JSON 字符串格式传递工具对象参数时解析失败的问题 (#450) (cc98518)
    - agent: 修复流式传输在特定情况下导致工具名重复拼接的问题 (#456) (a8b138c)
    - agent: 按模型协议路由 OpenCode Zen/Go 请求 (#427) (03549b5)
    - desktop: 修复因仪表盘日期时区错误与日志读取的性能问题导致的无响应 (#466) (41397ef)
    - desktop: 修复认证状态未持久化导致重启后要求重新输入密码的问题 (#470) (568605b)
    - frontend: 修复 Agent 消息自动滚动跟随在某些场景下失效的问题 (#475) (76ebea9)
    - frontend: 修复单美元行内 LaTeX 公式未渲染的问题 (#469) (d510408)
    - frontend: 修复窗口恢复时编辑内容和空列表项丢失的问题 (#471) (7c5eb95)
    - frontend: 修复部分提供商无法配置嵌入维度的问题并支持自动获取维度 (#472) (1fc72e2)
    - frontend: 修复章节首行缩进在保存重载时丢失的问题 (#476) (216d66a)
    - mobile: 修复移动端麦克风权限未转发导致语音转写不可用的问题 (#481) (c343ba4)
    🔧 杂项
    - agent: 支持 DeepSeek 联网搜索 (#454) (e0db008)
    - agent: 添加会话模型超时设置 (#474) (8e56e5a)
    - agent: 添加内置的 Skill 创建与小说文风蒸馏实验性技能 (#479) (7007a30)
    - backend: 适配 Models.dev 目录中的模型级路由配置 (#467) (34d7bf6)
    - desktop: 优化桌面端的镜像源选用逻辑以支持无外网环境使用 (#468) (da013c8)
    - frontend: 修复部分前端样式和布局错误 (#480) (7f27e0d)
    - provider: 添加 Requesty 提供商 (#420) (d578743)
