- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    ⚠️ 破坏式更新
    - 只支持云顶之弈独立客户端（虚幻引擎版），不再支持 LOL 客户端内的旧版云顶之弈。游戏需要设置为窗口化。
    - 当前赛季切换为 S18 自然之力，以前赛季的模式（S17 星神、S16 英雄联盟传奇、S4 瑞兽闹新春）不再提供。
    S18 自然之力
    - 排队、进入对局、识别和操作全部按新客户端重做。
    - 新增 S18 完整数据：棋子、羁绊、装备、阵容和对应的识别模板。
    - 开放模式：自然之力 匹配（初步支持）、自然之力 排位（初步支持）、发条鸟的试炼，其他模式适配中。
    - 首页改版：模式卡片、云顶风格的开始按钮，开始前会检查客户端是否已打开。
    识别
    - 用棋子头顶的血条判断格子上有没有棋子，不再要求最低画质和默认棋盘，高大的棋子也不会误判。
    - 识别装备锻造器（基础装备、成装等），自动打开。
    - 识别棋子星级；商店自动跳过自然仙灵卡。
    - 战利品球支持不同大小，新增银球。
    策略
    - 连败 3 场及以上、金币超过 50 时会 D 牌止血：大概率 D 到剩 50 金币吃满利息，中概率多 D 一些，小概率大幅 D 牌。
    体验
    - 普通对局阵亡后自动点击"现在退出"并重新排队。
    - 默认开启 GPU 渲染，启动时崩溃会自动关闭；切换页面不再卡顿。
    - 排队时游戏界面没有反应是正常的，首次开启挂机时会提示。
    已知问题
    - 自然之力 匹配为初步支持，部分阶段和高等级经验还没有充分验证；排位和匹配共用同一套逻辑，还没有经过实机验证。遇到问题欢迎反馈。
