  Key: ReleaseNotes
  Value: |-
    This release keeps the dashboard reading Broca sessions as Broca adds a context ceiling to its compaction support.
    Fixed
    - Broca sessions that record a context ceiling still open. Broca is adding records for a run held at its context ceiling and for the ceiling decision, plus a run end for when a run stops at its ceiling. The dashboard now recognises these. It reads usage, steps and timestamps, which these records don't change, so session timelines and cache charts stay the same.
