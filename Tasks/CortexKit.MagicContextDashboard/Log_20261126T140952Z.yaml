  Value: |-
    Fixed
    - Archived OpenCode sessions no longer create project cards. A session that OpenCode has archived could still add a card for its folder, or put its folder's label on another project's card. Archived sessions are now left out when the dashboard works out which projects exist and what they are called. Sessions, memories and history of those projects are untouched (issue 960).
