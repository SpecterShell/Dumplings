  Value: |-
    Improvements
    Section titled “Improvements”
    - Bulk Update Users: CSV files are now read regardless of delimiter. Comma, semicolon, tab, and pipe are auto-detected, so files from European/Latin locales import without being re-saved.
    - Password Reset & Unlock: the results list now fills the page and scrolls internally, instead of being confined to a small fixed box.
    Bug Fixes
    Section titled “Bug Fixes”
    - Group Members report: selecting an OU in the browse dialog no longer also selects the groups inside it, which had caused every member to appear twice.
