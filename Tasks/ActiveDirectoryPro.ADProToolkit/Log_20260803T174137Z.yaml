    New Features
    Section titled “New Features”
    - Offboard Users: added a “Delete User Account” option. When selected it supersedes the other actions, greys them out, requires a second confirmation, and handles objects protected from accidental deletion.
    - Create Single User: new “Custom” tab that shows the attributes defined in Settings → Custom Attributes (User) and writes them when creating the user.
    Improvements
    Section titled “Improvements”
    - Create Single User: renamed the “Other” tab to “Profile”.
