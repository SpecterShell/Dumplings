- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    What's New
    - BirdNET+ (preview version 3.1) is now available for members, along with variable input size support
    - Perch v2 inference up to 2.5x faster
    - Perch can now have a "local birds" list
    - Lists for Perch or BirdNET+ can include classes other than birds (Insects, Mammals, Reptiles, Amphibians). This replaces the class lists for Perch
    - All models can now have their labels translated
    - There is a new search box for included / excluded species
    - Labels translations added for Croatian, Czech, Estonian, Farsi, Serbian, Mexican and Ecuadorian Spanish
    - Database speed up for large archives and large result sets.
    - "Combine detections" and "Merge detections" now works with all lists
    - The currently selected species is no longer cleared when changing lists, if the species is present in the new list.
    - When aborting an analysis, the analysis complete event fires so any results so far can be sorted.
    Breaking changes
    - Label translations have been removed for Arabic, Hungarian, Slovenian, Thai and Korean
    - Translated labels for all models follow the AviList conventions. N.B. Custom lists may need to be updated (and a warning will be given)
    - Local list 'Species Threshold' will return extremely unlikely species using the defaults of previous versions. The new default is 0.5, changed from 0.03
    Bug fixes
    - Errors appearing at high zoom levels, or very short files, have been resolved
    - If you open a new file while exploring the archive, the Explore filters are removed
    Full Changelog: https://github.com/Mattk70/Chirpity-Electron/compare/v5.18.1...v6.0.0
