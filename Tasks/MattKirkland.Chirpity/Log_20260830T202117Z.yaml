  Key: ReleaseNotes
  Value: |-
    What's new
    - Support for 24 and 32 bit WAV file export
    - Corrupt files are removed from the list of open files. If the first file is corrupt, Chirpity will attempt to open the next good file.
    - The full file path for the current file is shown on mouse hover.
    - The reference call comparison spectrogram has a timeline.
    Bug fixes
    - Species filter retained through pagination (see #658)
    - After batch renaming archive files, these changes are synced in the in-memory database.
    Full Changelog: https://github.com/Mattk70/Chirpity-Electron/compare/v5.17.0...v5.18.1
