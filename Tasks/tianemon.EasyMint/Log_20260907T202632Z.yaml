- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Added（新增）
    - 用户消息编辑重发：发送后打断 Mint 回复，可在原消息气泡上点铅笔修改文字重发——不新增气泡，Mint 按新文字重新回复
    - 工具执行状态指示：工具执行中标题旁转圈，完成后 ✓（暗色下灰白）/ ✗（报错）；思考中同样转圈。失败不再整行标红
    - PPT 读取增强：.pptx 按页拆分并标注页码（第 N 页）；老版 .ppt 明确提示「用 WPS/Office 另存为 .pptx」；读取时注明图片/图表等视觉内容不包含
    - 权限模式持久化：聊天输入的权限开关切换后记住选择，新会话自动沿用；设置页可改默认权限模式
    - MCP 工具显示：标题显示「MCP」+ 插头图标，展开区显示具体工具名（如 tavily / tavily_search），不再铺长结果
    Changed（优化）
    - 思考/工具显示开关移除：聊天与子代理过程常显思考与工具内容（原设置页开关已去掉）
    - 执行进度条更名「待办」：界面统一称「待办 x/y」；用户个人清单保持「用户待办」（新图标区分）
    - 工具块折叠宽度自适应：折叠时气泡贴合标题行宽度，展开平滑铺满
    - slide 光效色带流动：多色滑动光效颜色随位置循环流动，不再固定分区
    - 输入卡片图标悬浮提示：权限/模型/思考等级图标 hover 显示名称；上下文使用率百分比移到 hover 悬浮
    - 提问卡片（ask）：输入框与发送/跳过按钮同行，支持回车发送
    - 待办条、附件按钮样式统一：输入卡片工具栏图标化，hover 一致
    - 压缩进行中反馈：压缩时蒙版显示转圈动画；完成后不再弹「会话已整理完毕」通知——蒙版消失即完成反馈
    - 「关闭待办」语义明确：对 Mint 说「关闭待办」＝把当前执行进度条全部标记完成（收尾），不再是关闭 UI 横幅；全部完成后进度条显示「全部完成 ✓」5 秒后自动消失，无需手动关
    Fixed（修复）
    - 上下文压缩挂起修复：SDK 压缩偶发永久无响应、界面一直等待（此前需结束会话才能恢复）——压缩前自动复位残留状态，120s 超时兜底并明确提示「压缩超时，请重试」
    - 压缩「假完成」误导消除：压缩挂起时蒙版 60s 后静默消失、界面看似已完成（实际压缩未结束，此时关闭会话会丢结果）——去掉静默提前消失，蒙版消失仅代表压缩真正完成；超时显示明确错误提示
    - 权限标准模式误拦截：项目内链式命令（cd x && npm run lint 等）、删除/移动/改权限、git 操作不再误拦；cd 逃逸、工作区外写入、系统敏感路径仍严格拦截
    - 权限模式即时生效：切换开关后下一条命令即按新模式判定（无需重启）
    - 工具描述/界面中文词辨析：Mint 能分辨「关闭待办条」是界面操作而非删除数据、「编辑有误」指文件修正而非消息编辑
