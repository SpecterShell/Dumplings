  Key: ReleaseNotes
  Value: |-
    Added（新增）
    - 图片查看器：聊天里的图片链接与左侧文件树里的图片改为在内置查看器中打开（滚轮缩放、拖拽平移、双击切换「适应窗口 ↔ 原始像素」）；svg 另提供一个「看源码」入口
    - Markdown 预览：编辑器打开 .md 默认显示渲染结果，可一键切回源码；预览里的相对路径图片会一并显示
    Changed（调整）
    - Mint 头像：改为矢量图形（任意尺寸都清晰，不再受位图分辨率限制）；生成回复期间最新一条消息的头像眨眼，其余保持睁眼静止
    - 应用图标：按 macOS 26 的图标网格重做；Dock 图标跟随亮/暗主题切换
    - 安装包体积：移除零引用的内置字体等资源（每个安装包约少 2.1MB）
