Locale:
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Added（新增）
    - 中英文界面：欢迎页和「设置 → 通用」可选择简体中文、English 或跟随系统，设置、项目管理、聊天操作、设备迁移及 HTML 原型编辑器支持中英文切换；语言选择同步到其他应用窗口
    - 英文使用说明：新增英文 README，中英文说明可互相切换
    Changed（调整）
    - 默认语言跟随系统：未设置界面语言时，简体或繁体中文系统显示简体中文，其他系统显示英文；已保存的语言选择保留
    - 默认英文使用说明：仓库首页展示英文 README，提供中文说明链接；截图保持原样
    - 语言选择样式统一：设置与欢迎页使用统一自绘下拉，支持键盘选择并保留保存失败提示
    - 原生 Pi 导入内容补齐：导入时包含受支持的 MCP 服务器配置，保留停用状态并列出冲突或不支持的配置；MCP 登录凭据需在导入后重新授权
    - 完全访问确认说明：明确此模式没有系统沙盒隔离，可能访问当前用户可读取的敏感文件
    Fixed（修复）
    - 语言切换后的显示同步：思考等级、默认标签标题、摘要抬头和 Agent 能力胶囊随语言更新，工具调用简述跟随用户所用语言
    - 英文说明准确性：修正导入数量表达、思考等级适配说明和 MCP 配置路径提示
    - 差异预览内容完整显示：文件内容包含“变更内容：”时，预览不再被提前截断
    - 模型参数识别：修复部分 Pi 模型的上下文窗口与最大输出参数识别不正确的问题
    - 会话权限切换：从只读切换到标准模式后，后续消息使用相应的工具能力；收紧权限时及时撤销此前的执行权限
    - 异常等待可恢复：会话异常忙碌或上下文压缩长时间未完成时，结束等待并提示重试，避免一直停在处理中
    - 项目迁移回执匹配：避免其他设备或重复回执干扰当前迁移的确认与完成状态
    - 内置角色更新：内置角色提示词随版本更新，自定义模板保留；默认提示词记录缺失时回退到内置提示词
