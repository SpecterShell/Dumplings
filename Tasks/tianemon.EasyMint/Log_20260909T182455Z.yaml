- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Added（新增）
    - 模型参数可自定义：为模型单独声明上下文窗口与最大输出，不再依赖自动推断
    - 供应商「测试连接」：填好地址即可验证连通，不必先发消息试
    - 内置供应商连接信息只读展示：官方地址与接入协议一目了然
    - 删除供应商前确认：删除时提示该配置与 API Key 将一并移除
    - Mint 发现问题会主动闭环：发现任务之外的问题时，先评估再带结论与建议告知；纯正面收益的直接处理
    Changed（调整）
    - 供应商设置页重构：默认模型与子 Agent 模型合并展示，模型管理收敛为「自添加模型」，表单高度与圆角统一
    - 设置页视觉统一：分组块去掉边框、改用底色深浅分层；输入框聚焦时底色加深作提示；圆角全站统一
    - 模型显示名统一：官方模型与自添加模型一律显示名称
    - 光效更流畅：绘制迁到独立线程，主线程繁忙时自动降低采样，长会话下掉帧明显减少
    - 设置弹窗移除投影：与遮罩的色差已足够区分层级
    - 颜色设置并排成组：输入卡片光效色与状态文本色左右并列，不再分散两处
    - 下拉与复选框改为自绘：外观与全站统一，不再受系统控件影响
    - 回复语言跟随用户：按用户所用语言回复，不再固定中文
    - 思考过程默认用英文：仅中文语义场景（文案推敲、语义辨析）或用户要求时切回中文
    Fixed（修复）
    - 弹窗/抽屉顶部按钮点不动：窗口拖拽区吞掉点击，关闭按钮等控件失效
    - 设置页保存供应商丢配置：配置未加载完成时保存会覆盖掉其他供应商与 API Key
    - 模型参数改动不生效：改窗口/输出后无需重开会话即可生效
    - 切换模型后上下文显示：使用率圆环不再停在旧窗口
    - 拖选文字误关弹窗：从弹窗内拖到遮罩松开不再触发关闭
    - 项目迁移抽屉被遮挡：层级修正，不再被聊天页控件盖住
