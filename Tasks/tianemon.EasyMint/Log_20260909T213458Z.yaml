  Key: ReleaseNotes
  Value: |-
    Added（新增）
    - 重新运行引导：设置「关于」页新增入口，可回到初始设置页重新走一遍引导
    Changed（调整）
    - 命令带动作标题：聊天页执行命令时显示这次在做什么（如「命令 · 查找文件」）
    - 运行面板状态拼色：卡片按运行状态整块上色（未运行中性块 / 启动中黄 / 运行中绿），描边全部去掉
    - 抽屉面板统一：任务 / 运行 / 问题记录三个面板的左右留白、行间距与卡片宽度统一；任务行悬停反馈更明显
    - 抽屉面板毛玻璃：任务 / 运行 / 问题记录改为半透明磨砂，与项目迁移、历史输入抽屉同一材质
    - 新建项目弹窗：输入框与选项卡去掉描边改色块分层，底部按钮尺寸统一
    - 弹窗底色与遮罩统一：全部弹窗底色统一为同一档并加深一档，遮罩层统一为同一深度
    - 暗色输入框层次：输入框与背景的深浅差重新拉开，凹陷感更清楚
    - 引导页：去掉描边与分隔线，改色块分层；重新运行引导时自动预填已配置的供应商
