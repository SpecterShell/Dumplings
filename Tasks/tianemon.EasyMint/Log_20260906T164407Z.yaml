- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Added（新增）
    - 用户待办清单：输入卡片新增「待办」按钮——想法与计划可增删改查、勾选完成；对 Mint 说「记一下」也会写入同一清单；旧版 docs/待办事项.md 首次打开自动导入并归档
    - 任务进度条：Mint 执行多步任务时在输入区上方实时展示当前步骤（完成项划线、进行中高亮、可手动收起）
    - 输入卡片附件合并：图片与文档上传合并为一个回形针按钮，点击弹出「图片 / 文档」菜单
    - 运行就绪检测：运行面板对配置了访问地址的服务做健康探测——服务真正可访问才显示为就绪（启动中与就绪分色显示）
    - 一键修复：运行脚本失败后日志窗口提供「让 Mint 修复」按钮，把错误输出交给对话中的 Mint 归因处理
    - 自动压缩倒计时：上下文达到阈值弹出压缩确认后，60 秒未操作自动执行「立即压缩」
    - 新建项目路径预览：填写名称时实时显示将创建的目录位置，中文名称自动翻译为英文目录名（后台预翻译，创建时无需等待）
    - 安全防护：删除数据表等不可逆数据库操作会被拦截并提示先备份；命令输出中的密码/密钥等敏感信息自动打码显示
    - 创建冲突预警：目标目录已存在且非空时即时红字提示（此前会静默混入模板内容）
    - 回复用量显示：每条 Mint 回复下方显示输入/输出 token 与缓存命中率（两位小数）；输入卡片显示本会话平均缓存命中率——历史消息重新打开同样可见
    - 打开项目保护：正被任何窗口打开的项目不再显示删除按钮（防止删除进行中的项目）
    Changed（变更）
    - 新建项目创建时机：项目在最终点「创建项目」时才真正建立——填写中途取消不会在磁盘留下目录；表单创建与直接对话创建两条路径体验统一（创建后立即进入对话，首条消息即时出现）
    - 系统消息折叠：对话中的系统消息（项目初始化、流程指令、待办同步等）默认折叠为小标签条，点击可展开原文——聊天更清爽，重点消息（子任务结果、命令完成状态）保持完整显示
    - 网络命令隔离执行（标准模式）：curl/wget 下载、内联代码等命令在受限环境中运行（只能写当前项目、读不到私密文件、连不上本机与内网），越界操作被拦截并说明原因；访问本机自己启动的服务（localhost）不受影响
    - 界面细节优化：暗色代码块配色、消息气泡、编辑弹窗、列表悬停等视觉细节统一调整；悬浮提示收敛——移除各处按钮的惯性提示（按钮形态自解释），仅指标类保留（淡入淡出、0.2 秒即显、亮暗配色统一）
    Fixed（修复）
    - 沙盒网络访问：修复受限模式下部分网络命令实际无法下载的问题（隔离网络配置修正，公网访问与本地隔离均按预期工作）
