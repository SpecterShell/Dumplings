  Key: ReleaseNotes
  Value: |-
    Added（新增）
    - 只读模式：权限档位新增最保守的一档——普通项目内容可以自由读取（SSH 私钥、云凭据这类高度敏感内容除外），但不执行任何命令、不写入文件或应用状态、不联网（适合只想让它看、不放心它动手时，比如审阅来源不明的项目）
    - 外部来源核查：安装第三方依赖、执行从网上抄来的安装命令、引入外来代码或二进制时，Mint 会先核实来源与内容，核不透就默认不用（内置技能，无需配置）
    Changed（调整）
    - Agent 模板去掉编辑功能：模板只保留人设，子 Agent 的模型与思考等级跟随主会话（供应商设置里的「子 Agent 默认模型」一并移除；Builder / Evaluator 由可编辑变为只读浏览）
    - 验收与原型审查可以看截图：模型能看图时直接读图判断界面，不再只靠读代码推理
    - 标准模式的边界改由操作系统沙盒强制：越界写入与读取敏感凭据由系统直接拦下，脚本与变量绕不过去（此前只靠程序自身的检查，换个写法就可能绕过）。系统临时目录纳入可写范围，写临时文件不再被拦；打开浏览器、Playwright、Docker 在标准模式下可正常使用（浏览器/容器类只豁免单一命令，cd x && open … 这类复合命令不再豁免）
    - 联网按域名白名单放行：安装依赖、拉取代码、访问常见开发服务不受影响；未知域名会被拦下（可在项目内 .easymint/sandbox.json 或设置里追加）
    - 标准模式下可以直接 git push 了：改用 ssh-agent 签名（私钥不进会话环境），需要先用 ssh-add 把密钥加进 agent；fetch / clone 同样适用
    - 简单项目不再绕道子 Agent：按场景与体量判定执行方式——一两个文件的小项目由 Mint 直接实现，不再一律委派；成串的复杂任务仍走子 Agent
    Fixed（修复）
    - 命令被沙盒拦下时能看到原因：此前只显示命令失败、不说明是被安全边界拦的（拦截信息从未被读取出来），现在会附上被拒的资源与操作说明
    - 用国内镜像源（如 npmmirror）装依赖不再失败：此前镜像的包下载地址不在访问白名单内，表现为「元数据能取、包装不上」的报错（换官方源才行）
    - 命令正常执行成功时不再附带无关的拦截说明：此前结果里会跟着一段系统层面的拒绝记录（多为进程启动时的常规查询），容易被误读成命令被拦；现在只在真正被拦时显示
    - 更新失败时能看到失败原因：此前无论是检测还是下载阶段失败，都只显示一句“检查更新失败”——原因虽然被程序记录下来，却从未传到界面；现在会区分「检查更新失败」与「下载更新失败」，并附上具体原因
    - 子 Agent 不再「什么都没干却报完成」：输出被截断、没给出终局结论时会判为失败，不再当成正常收尾
