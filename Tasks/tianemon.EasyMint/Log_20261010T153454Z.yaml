- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Added（新增）
    - 代码审查与软件健康检查：内置两项技能，可检查改动正确性、核心流程、状态一致性与异常恢复
    - 原生图像生成与编辑：在模型设置中选择图像模型后，可让 Mint 生成或参考已有图片编辑素材，保存到项目目录并在聊天中打开预览
    - 自动模型路由：配置规划与执行模型后，可选择 Auto 模型，每轮先规划、成功编辑文件后切到执行模型；回复显示实际调用的供应商与模型
    Changed（调整）
    - 运行状态与耗时：区分完成、取消与失败，等待用户回复时显示等待状态；回复和工具调用的耗时在实时与历史记录中一致展示
    - 费用归属准确性：跨供应商自动路由和图像生成按实际调用归属统计，避免套用聊天所选供应商的时段折算
    Fixed（修复）
    - 项目创建问答隔离：多个会话同时响应时，表单只接收自己的回复，避免误绑定其他会话
    - 会话关闭与取消：关闭前确认本轮已经停止，取消准备中的子任务或提问后不再开启新的等待
    - 后台命令结果完整性：保留命令退出前的末尾输出，启动失败时显示具体错误
    - 会话偏好保留：缓存损坏、扫描失败或导入会话使用自定义名称时，避免阻断聊天或误删会话偏好
