  Key: ReleaseNotes
  Value: |-
    Changed（调整）
    - 环境检测：CodeGraph 安装命令按系统显示（Windows 显示 PowerShell 安装命令，装完需重启 EasyMint 生效）；新增「重新检测」按钮；「未安装」与「检测失败」分开展示（后者引导重试）
    - 暗色弹窗：弹窗底色加深、头尾分区不再用色块（与内容同为面板面）；输入框凹槽同步加深，保证凹陷感
    - 新建项目弹窗：Step4 选项卡（完成度/AI/部署/预算）改用与输入卡片光效预设卡同一套选中/悬停效果——暗色下选中为深色槽、悬停压暗，选中与否一眼可辨
    Fixed（修复）
    - CodeGraph 误报未安装：修复 Windows 上已安装 CodeGraph 却显示「未安装」的问题
    - 抽屉面板毛玻璃：修复任务 / 运行 / 问题记录及右侧滑出抽屉背景模糊丢失、能看清下层文字的问题
    - 提问卡内容不显示：修复回答结束后提问卡呈展开态却空白、需手动收起再展开才显示的问题
