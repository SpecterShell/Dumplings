- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Added（新增）
    - 模型最大输出可配置：供应商设置里为手动添加的模型选择最大输出（自动 / 8K / 16K / 32K / 64K / 自定义），未设置时按 32K 处理
    Changed（调整）
    - 权限放宽：curl、wget、ssh、kill、chmod 等不会破坏本地数据的命令不再拦截；拦截提示改为说清「拦了什么、当前工作区在哪、怎么办」
    - 同系列模型能力自动继承：手动添加的模型（如 deepseek-v4.1）自动继承同系列内置模型的上下文窗口与最大输出
    - 供应商配置改动即时生效：修改配置后已打开的会话直接使用新配置，无需重开会话
    - 已添加模型显示为卡片：识图、上下文窗口、最大输出三项以标签形式展示，点击即可编辑
    Fixed（修复）
    - 压缩后使用率立即刷新：此前压缩完成后要等下一次回复才更新，现在压缩结束即显示新值
    - 重启后可直接压缩：此前重启应用后必须先发一条消息激活会话才能压缩，现在直接点即可
    - 权限禁区更严密：修复了系统核心目录、凭据目录可被变量写法（如 $HOME/.ssh）绕过拦截的问题
    - 提问卡片细节修正：多选标注不再重复显示；「推荐」徽章紧贴选项文字
