  Key: ReleaseNotes
  Value: |-
    Added（新增）
    - 供应商账号登录：供应商设置新增「账号登录」方式——可用 Claude 账号或 ChatGPT 账号（OpenAI Codex）登录，无需填 API Key
    - 联网搜索：Mint 可联网搜索并返回结果摘要（标题 / URL / 摘要），拿到链接后可继续抓取全文；在「设置 → 模型能力增强」开启并填写 Tavily API Key（与网页抓取共用）
    - 内置工具激活：Mint 新增文件内容搜索、按文件名查找、目录列出能力（Windows 下另有 PowerShell 命令执行）；聊天页里这些工具显示中文名与图标
    Changed（调整）
    - 打断不再中止子任务：打断只停当前回复；正在运行的子 Agent 转后台继续执行，完成后结果照常注入会话。要单独停止子 Agent，用运行面板的停止
    - 头像：用户与 Mint 头像统一放大；Mint 头像改为动态——生成回复期间播放动画，其余时间显示静态帧
    - 状态栏状态标识：状态提示前的符号改为动态图标（生成时三点聚拢），流光配色下跟着流光一起变色
    - 模型图标：左侧节点改为实心
    - Agent 胶囊图标：新增循环动效——轻微上下浮动两次、水平镜像翻转、再浮动两次；Shell 胶囊图标的终端光标新增闪烁效果
    Fixed（修复）
    - 上下文窗口显示：自添加模型按 128K / 256K 配置后，聊天页显示的窗口数与设置里选的一致（此前 128K 显示成 131K、256K 显示成 262K）
    - 标签栏与标签切换：切换侧边栏「会话 / 文件」不再隐藏标签栏，已打开的标签可随时切换（此前在文件页签下点会话标签是空白页）；关闭全部标签统一回到空会话页
    - 打断会话不再“默默发送”：打断时本轮还没收到回复的消息不再进入后续对话（此前会被当成新消息发给 Mint，界面也会卡在忙碌态）；要改写后重发，点消息气泡上的编辑即可
    - 消息编辑：发送按钮改到编辑按钮的位置（点编辑后，气泡下方右侧的铅笔位置变成发送按钮）；编辑框宽高随文字长度自适应，字号与气泡正文一致（此前固定尺寸且偏小）
    - 启动闪屏：修复启动瞬间先闪一下引导页再进主界面的问题
