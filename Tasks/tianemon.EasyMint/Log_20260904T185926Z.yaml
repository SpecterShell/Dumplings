Locale:
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Added（新增）
    - 权限模式简化为两种：输入栏权限开关改为「标准 / 完全访问」——两种模式都允许：读写当前项目内文件、安装依赖/运行时、读取环境配置与用户下载的文档；唯一区别是写入范围：标准模式只能写当前工作空间，完全访问可写所有非禁止区域（切换时有警告确认）。绝对禁区（两种模式都禁止）：系统核心目录（macOS 的 /etc /usr /System 等、Windows 的 C:\Windows 等）读写、凭据目录（~/.ssh /.aws 等）读写、用户目录（/Desktop ~/Documents ~/Downloads 等）写入；系统级变更命令（sudo、launchctl、reg 等）与「先写脚本再执行」绕过路径也会被拦截
    - 委派子 Agent 与主会话同权限边界：task 委派的子 Agent 遵守与主会话相同的权限模式与禁区（此前子 Agent 写操作被一律拒绝或不受限，与主会话行为不一致）
    - 系统弹窗替换为软件内确认框与轻提示：删除 MCP/skill/模板、重命名项目、关闭运行中会话、切换「完全访问」等确认操作改为软件内对话框（危险操作为红色确认按钮），表单校验与操作失败提示改为顶部轻提示——不再弹出系统原生窗口，视觉与软件统一
    - 「完全访问」开关高亮为红色：切换到完全访问时，权限开关文字与轨道变为红色（两种主题一致），提示当前已放开工作区外写入、需留意
    - 供应商页手动添加的模型可用了：切换后保留你设置的思考等级，名称含 vision 的模型支持读图——此前这类模型被当作「不支持思考、不支持图片」的纯文本模型（选了最高实际按关闭跑）；SDK 后续内置同名模型时自动改用官方定义，无需手动清理
    - SDK 新增的内置模型自动出现在模型下拉：升级后新模型直接可选（此前必须打开供应商配置页保存一次才会刷新）
    - 按模型设置思考等级：供应商配置页可为每个模型单独固定等级（跟随全局 / 关闭～最高），优先于全局思考等级；模型不支持时自动取最接近的可用档位
    - Read 支持二进制文档：pdf / docx / xlsx / pptx 等文档现在能直接读取内容（此前只能读文本文件，模型面对 pdf 等格式无法查看）；Windows / macOS / Linux 均可，doc / rtf 暂仅 macOS 支持
    Changed（变更）
    - 思考等级显示真实生效值：模型不支持所选等级时，输入栏下拉显示实际生效的等级（此前界面显示与实际不一致）
    - 思考等级按会话持久化：会话里选过的思考等级会记住，重新打开会话仍是该等级，不被全局设置覆盖；未选过的会话跟随全局设置并按模型能力自适应
    - 子 Agent 思考等级跟随主会话：标准委派（无角色模板）用主会话当前思考等级，Agent 模板委派以模板配置为准；均按子 Agent 模型能力自适应（此前写死「中」）
    - 自定义供应商的模型与内置供应商行为一致：第三方网关/镜像站的模型若能查到官方规格，会沿用其推理能力与读图支持——此前这类模型最高只能用到「高」，全局选「最高」会被静默降为「高」，且永远不支持读图
    - Pi SDK 升级 0.84.3 → 0.84.4：内置模型新增 DeepSeek V4 Flash Vision 实验版（可直接读图）；修复系统消息插在工具调用与结果之间导致的供应商报错、切换「显示思考」清空运行中命令输出、恢复会话时记录被写坏等问题
    - 输入卡片按钮文案字号调大：模型/思考/权限标签与下拉文字放大一号（输入框字体不变）；粘贴的图片与文档附件统一为 64px 方形卡片，图片按比例显示、删除按钮贴在右上角
    - 自动更新不再重复打扰：手动点过「检查更新」后取消自动检查；下载更新过程中重复点击检查会被忽略（此前下载中触发自动检查会导致界面状态闪烁）
    Fixed（修复）
    - 新会话首条消息按所选模型发送：新会话发首条消息即使用下拉框选的模型（此前首条消息忽略所选、按默认模型创建，从第二条起才生效）
    - MCP 服务器删除需二次确认：删除前弹出确认框说明影响范围（配置与凭据不可恢复），项目根 .mcp.json（只读来源）删除改为直接提示（此前点击即删除）
