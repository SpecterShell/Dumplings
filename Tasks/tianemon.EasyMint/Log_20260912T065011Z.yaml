  Key: ReleaseNotes
  Value: |-
    Fixed（修复）
    - 工具组合里的变更数量：多个工具被收进一组时，组内的「编辑文件」行也显示 +N/−M 变更数量（此前要展开那一行才看得到）
    - 思考块自动展开：生成回复期间，历史消息的思考块不再自动展开——只有正在输出的那条会展开并显示进行中
    - 打断后残留的工具行：打断时没拿到结果的工具行，在后续回合不再一直显示「执行中」
    Changed（调整）
    - 交互方式：明确交代的任务直接执行，不再反复确认「是否开始 / 是否继续」；需要用户拍板时会给出推荐与「改 / 不改」的对比
    - 交付报告：结果按「已完成 / 验证结果」分块，有影响使用的限制或待决定的事项单独提到前面
