  Key: ReleaseNotes
  Value: |-
    Added（新增）
    - 联网搜索：Mint 可联网搜索并返回结果摘要（标题 / URL / 摘要），拿到链接后可继续抓取全文；在「设置 → 模型能力增强」开启并填写 Tavily API Key（与网页抓取共用）
    - 内置工具激活：Mint 新增文件内容搜索、按文件名查找、目录列出能力（Windows 下另有 PowerShell 命令执行）；聊天页里这些工具显示中文名与图标
    Fixed（修复）
    - 上下文窗口显示：自添加模型按 128K / 256K 配置后，聊天页显示的窗口数与设置里选的一致（此前 128K 显示成 131K、256K 显示成 262K）
    - 标签栏与标签切换：切换侧边栏「会话 / 文件」不再隐藏标签栏，已打开的标签可随时切换（此前在文件页签下点会话标签是空白页）；关闭全部标签统一回到空会话页
