- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Added（新增）
    - 界面风格预览：创建项目时可选极简、扁平、Material、玻璃拟态、液态玻璃、Bento 等 17 种风格，预览网页与移动端效果，并选择总览、落地页、表单或详情布局
    - 风格组件展厅：预览里可逐类查看按钮、输入、下拉、复选、开关等常用控件的实际样子，Web 与移动端布局分别呈现，可放大到近全屏细看
    - 配色与效果选项：每种风格可另选配色与效果档位（如玻璃的清透/磨砂），所选规范会随项目一起保存并传给 Mint
    - 品牌参考与自定义风格：可选择品牌参考或填写自定义风格说明，并在项目菜单中继续调整界面设计
    - 创建草稿自动保留：新建项目过程中关闭弹窗，再次打开会接着上次的填写内容和所在步骤继续
    - 新建项目位置指引：还没有项目的用户首次进入会用聚光提示指出项目菜单里的新建入口，可跳过，之后不再打扰
    Changed（调整）
    - AI 引擎更新至 Pi Coding Agent 1.3.0：外部工具的资源读取不再拖慢连接，工具输出与参数处理更顺，登录授权中断可及时取消
    - 新建项目步骤指引：显示当前步骤与名称，功能推荐失败时提示重试，直接创建沿用已填写的交付要求
    - 自由对话：普通聊天不再因提到创建项目而自动进入项目创建流程
    - UI 设计能力：增强 UI 设计时，更注重内容布局、控件状态与移动端适配，并沿用项目已选的界面规范
    - 聊天气泡不再显示模型名：回复下方只保留耗时与用量信息，界面更干净
    - 弹窗按层级关闭：多层弹窗叠加时，Esc 只关闭最上层的确认框或预览，不会连带关掉整个窗口
    - 估算费用的汇率更新：人民币折算使用 2026-10-16 中间价 6.7220，悬停算式同步显示报价日期
    Fixed（修复）
    - HTML 原型编辑器打不开：此前从聊天里打开原型编辑器可能只显示空白页，现在能正常载入并编辑
    - HTML 编辑器导出与编辑：导出文件不再夹带编辑器自身的运行代码，相对路径的图片与样式在编辑和导出后都能正常显示；撤销、重做与快捷键不再互相抢占
    - 浏览器类外部工具可用：Playwright 等自带浏览器的外部工具此前在标准权限下因系统路径过长而启动失败，现已可用；其他外部工具仍按原有隔离执行
    - 便签缩放尺寸：缩放便签时按实际显示大小起算，短内容或首次打开的便签不再被强行拉成固定高度
    - 重跑初始设置保留当前项目：在设置里重新运行初始设置后，仍停留在原来的项目和会话，不再跳回空白首页
    - 项目创建失败可重试：会话初始化较慢时继续等待，失败后保留填写内容与已创建目录，重试不再重复创建项目
    - 开始开发确认：确认按钮只显示在对应项目和会话中，重新打开会话仍可继续确认，点击后不再重复出现
    - Kimi 官方模型连接：升级 AI 引擎后使用代理地址的 Kimi 模型不再错用其他协议而连不上
    - 缓存清理保护：后台扫描期间新增或改写的会话偏好不再因文件时间差异被误删
