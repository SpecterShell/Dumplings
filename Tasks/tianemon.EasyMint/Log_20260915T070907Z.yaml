- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Changed（调整）
    - 安装动画的光带更长、扫动范围更大：准备运行环境那一步的动画，光带比之前更长，来回移动的幅度也更大（此前它被锁在内容区的宽度里，光带越长、能移动的距离越短）
    - 安装引导「准备运行环境」是一个过场：进入这一步就在后台检查并自动安装缺少的组件，屏幕上只有标题与一段动画（至少显示 5 秒，最多等到装完）——没问题就直接进入下一步，有问题才把检测结果和该怎么处理展开给你看；仅在该平台无法自动安装时，才需要按提示手动执行
    - 环境检测说清缺组件的影响：每一项都写明缺少它会影响什么功能（此前只列组件名），并提示可选项不装也能继续
    - 环境检测的文字更好读：命令与提示的字号调大一号
    - 弹窗去掉描边：侧栏项目菜单、「打开项目」、「重命名项目」，以及从「打开项目」里进一步弹出的「窗口选择」「删除确认」——此前都带一圈 1px 描边，现与「设置」「新建项目」「供应商」等弹窗统一：靠底色深浅与投影分层，不再画描边
    - 系统提示与钉住的便签去掉描边：顶部的轻提示与迁移回执、Windows 防火墙提醒、消息区的系统通知气泡（后台命令/委派执行时那一条）、钉住的便签卡，以及「Agent 能力」切换的底色轨道——此前都带一圈 1px 描边，现同样改为靠底色与投影分层
    - 「历史输入」按钮换了图标：消息区右上角那个开关，图标从三条横线换成「对话气泡 + 时钟」，更贴近它实际打开的内容
    - 吸附后的便签变窄一档：贴到左右边缘的书签条比此前细 5px
    Fixed（修复）
    - 安装包挂载后的磁盘图标恢复圆角：此前双击安装包后，桌面出现的磁盘图标是方形直角，与 macOS 上其它应用不一致；现改为自带圆角与留白
    - Windows 上「系统保护」组件装不上：环境检测此前一直报「检测失败」（即使它已装好），一键安装也必然失败；现在能正确读出安装状态、一键安装可用
    - Windows 手动安装命令改为可直接复制执行：此前给的命令在终端里必然报错（npm 提示 canceled due to missing packages and no YES option），且包名少了作用域前缀——那个名字在 npm 上属于别的提供方，照着跑会装到无关的包；现改为带作用域、与本应用同版本、可直接粘贴执行的命令
    - 安装动画在两端不再被「切断」：光带扫到两端时，此前会被容器的直边竖着切一刀（看着像被整齐切开）；现在它始终整条完整地来回移动，两端恰好停在边界上，不再被裁
    - 环境检测里缺 Git Bash 时会给出下载入口：Windows 上若未安装 Git Bash，此前只显示「未安装」和影响说明，没有任何可点的指引（下载地址早就传到了界面，界面却只渲染命令、从不渲染地址）；现在会显示「前往下载」，同类条目的官方说明页也会一并显示
    - 便签吸附到边缘时跟着鼠标落点：此前无论从哪个高度把便签拖到左右边缘，它一律吸到同一个位置（都堆在顶部）；现在吸附在你松手时的高度，重新点开也回到那个位置
    - 便签不再被「历史输入」按钮压住：此前便签拖到消息区右上角时会被那个按钮盖住一角，现在便签始终显示在上层
    - 系统通知与提示块和对话气泡左边对齐了：系统通知气泡、委派进度、错误提示这几类块此前比 Mint 的对话气泡偏左 6px，现在左边缘对齐
    - 取色器拖到纯黑或无色时指示点不再跳回：此前把圆点拖到色板右下角（纯黑）或最左端（无色），圆点会自己跳回左下角，色相条拖到两端同理；现在停在你拖到的位置
