  Key: ReleaseNotes
  Value: |-
    Changed（调整）
    - 估算费用的汇率口径写清楚了：费用改为两位小数并带 ≈（不再用四位小数假装精确），鼠标悬停能看到算式（如 $0.4268 × 6.7884（2026-08-10 中间价））；汇率收成一处常量，附来源、报价日与更新策略
    Fixed（修复）
    - 委派给子 Agent 的用量算进会话统计了：委派出去的子 Agent（Builder / Evaluator 等）是独立会话，它们的调用账单照收、但此前不计入会话统计——只要用过委派，弹窗里的估算费用就会系统性偏低。现在一并汇总（同样按时段折算），并在费用下方单列「其中委派子 Agent ¥X」
