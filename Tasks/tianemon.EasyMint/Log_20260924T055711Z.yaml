- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Added（新增）
    - 按消息调整对话：可以编辑任意提问、重新生成指定回答，也可以将单条消息移出或恢复到上下文；整理历史图片时可选择只保留文件路径，无法直接发送的图片会提示 Mint 按路径读取
    Changed（调整）
    - 会话运行提示更清楚：主会话自动重试改在状态栏显示，不再在重试期间误报失败；打断后丢弃的插话会给出提示；忙碌状态会自行校正
    - 停止原因说明更准确：权限切换导致的中止不再显示成「已由用户中止」
    Fixed（修复）
    - 打开已改名或删除的文件时给出提示：点开聊天里的文件链接，而那个文件已被改名、移动或删除时，此前只会打开一片空白（既不显示内容也不报错）；现在会明确提示「文件已变更或删除」。文件确实存在、只是不在当前项目内的，提示为「该文件不在当前项目内，无法打开」
    - 改名失败不再丢掉新标题：会话文件暂时无法写入时，新标题会记录在本地并照常显示在列表与标签上；两处都写不进去时会提示失败，并保留输入供重试
    - 恢复会话与手机端连接更稳定：重开对话时不再沿用错误的对话落点；手机端快速切换会话时保留最新会话的事件订阅
    - MCP 项目配置变更后重新确认：已确认的服务器定义发生变化时会再次请求确认，项目级服务器可正确加载与重试
    - 退出时不再留下仍在跑的子进程：此前只清理一部分，运行面板起的开发服务器、前台命令与 MCP 服务会残留并占着端口；现在关闭应用时一并结束
