  Key: ReleaseNotes
  Value: |-
    Added（新增）
    - Mint 可主动停止后台命令：需要时由 Mint 停止运行中的命令，不再只能手动中止
    - 删除供应商前确认：删除时提示该配置与 API Key 一并移除
    - 失败请求可直接重试：请求失败的消息保留错误卡片，点击重试即可重新发送
    - 停止通知区分来源：委派任务与后台命令的停止通知会说明是用户中止还是 Mint 主动停止
    Changed（调整）
    - 停止操作文案统一为「中止」
    - 弹窗交互统一：支持 Esc 关闭、焦点保持在弹窗内、层级显示正确
    - 子代理窗口与主会话窗口视觉统一
    - 委派卡片跨批次合并显示：任意时刻只显示一张包含全部委派任务的卡片
    - ShellBar 弹窗宽度随内容自适应；日志路径显示长度随容器宽度调整
    Fixed（修复）
    - 供应商 API Key 失效：同一平台配置多份时可能导致「没有有效的 API Key」，且重新填写无效
    - 刷新后状态丢失：刷新页面后委派卡片、运行状态胶囊不再消失
    - 流式回复重复显示：同一句话不再在流式输出中重复出现
    - 委派结果汇总：区分「中止」与「失败」
    - 子代理窗口：修复窗口未清理的残留问题
    - 权限模式不再被重置：修复重启后权限模式回到「标准」的问题
    - 新建会话的权限模式：与全局默认值保持一致
    - 界面细节：修复若干误改
