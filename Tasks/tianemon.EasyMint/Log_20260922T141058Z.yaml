- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Added（新增）
    - 导入原生 pi 的配置与会话：电脑上装过 pi 的话，可以把它已有的供应商、会话与项目记录一次性搬进 EM（一次性复制，不改动 pi 自己的目录）。引导页检测到 pi 时会直接给出入口；设置 →「通用」→「原生 pi 配置」也能随时手动导入，还可以指定 pi 的 agent 目录。导入前逐项列出会导入什么、跳过什么——EM 已有的配置优先，重名冲突、重复与无效会话跳过并报数
    Changed（调整）
    - 切换供应商不再改动已打开的会话：此前在设置里换个供应商，所有打开的会话会被一起切到新供应商的默认模型；现在只影响「新会话用哪个模型」，已打开的会话保持各自的模型，要换就在那个会话里单独切
    - 发图与读图超出模型上限时自动缩放：附件、读取图片与工具产出的图片一旦超出该模型允许的尺寸或体积，会先缩放再发（内置视觉模型自带保守档位）
    - 自定义接口的模型不再被过严的工具参数校验挡住：用阿里百炼、本地模型一类的自定义 OpenAI 兼容接口时，此前会因模型不支持严格 JSON Schema 而报错，现在按模型能力决定是否启用
    - 引导页的供应商配置与设置页同一套外观：表单字段与「保存供应商配置」同处一张卡片（此前保存按钮像单独镶在一块底色里），输入框与下拉改为无边框拼色；底部操作栏也压矮了一档
    - 配置出问题时的提示可操作了：配置一旦损坏（手改出错、磁盘写坏），EM 会直接打不开，而此前的提示只有一句系统报错加「请修复配置后重新启动」——不说坏的是哪个文件、备份在哪；现在会指出具体是哪个文件与备份目录，并给出一条兜底办法：把配置目录改名后重启，EM 以全新配置开始，原数据保留在改名后的目录里
    - 改动前的备份不再无限堆积：只保留最近 20 份（这些备份里含凭据副本，长期留着并不合适）
    Fixed（修复）
    - 切到当前不可用的模型不再静默失败：此前切换不成功时界面看着已经切了、实际没生效；现在会明确提示模型不可用，并指出去检查供应商配置
    - 重新打开历史会话时显示它自己用过的模型与思考等级：此前这类会话会显示成当前默认值，看着像被改过；现在以会话自己的记录为准（只有新建会话才用全局默认）
    - 以「GIF」开头的文本文件不再被当成图片：读取这类文件时按文本处理
    - 删掉供应商后不再留下空壳：那些会话里原本绑定的这个供应商会一起清掉（此前打开它们会静默回落到默认模型，看不出原因），设置里也不会再多出一个没有模型、点不开的供应商条目
