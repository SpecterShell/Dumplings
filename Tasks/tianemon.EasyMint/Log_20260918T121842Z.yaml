- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Added（新增）
    - 手机终端（实验性）：电脑端可被手机连接——工具箱 →「连接手机」出示二维码，用手机 App 扫码配对后即可查看项目与会话、发送消息并看到实时回复；消息可附带图片与文档（图片直接交给模型看，文档给出本地路径由 Mint 按需读取，单次合计不超过 15 MB）。配对过的手机可在同一面板解除
    Changed（调整）
    - 品牌库改为内置技能：品牌设计规范随应用内置，不再往每个项目复制 2.5MB 的品牌文件（已建项目里的 .easymint/brand-tokens/ 可自行删除，删掉不影响使用）
    - 工具箱新增「连接手机」入口：手机终端从原本合在一起的「设备互联」中独立出来；电脑之间迁移项目的那一项恢复原名「项目迁移」
    Fixed（修复）
    - 窗口拖不动：点标题栏或侧栏空白处无法移动窗口（上一个版本引入）
    - 窗口崩溃后界面静默不再更新：渲染进程意外退出或页面重载后，该窗口会安静地丢掉之后的所有事件（界面看着正常、其实不再刷新），并且会连带其它窗口一起收不到事件
    - Windows 上连接手机缺少防火墙提示：连接手机首次开放端口时会提示需要放行（此前只提示项目迁移的端口）
