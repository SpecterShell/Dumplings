  Key: ReleaseNotes
  Value: |-
    Changed（调整）
    - 模型列表自动跟随 SDK 更新：模型清单随 SDK 的模型增删自动同步——新出现的直接可选、已失效的自动移除，不再需要打开供应商配置保存一次才刷新
    - 与官方模型重名的手动添加项不再重复显示：官方已收录的模型统一按官方名称与参数展示（此前会出现两个同名条目，且列表里显示的是手动填写的那份名称）
    - 自动识别 pi 的技能目录：装在 ~/.pi/agent/skills 或项目内 .pi/skills 的技能会被自动发现并可用（与已有的 Claude Code / Codex / GitHub 识别同一入口）
    Fixed（修复）
    - 项目改名或移动路径后历史会话看不到：此前这些会话会因路径不匹配被过滤掉，现在改名或移动后历史会话照常可见
    - 手机端打开后转圈、界面点不动：电脑端一边输出内容时会把整条数据流推给没打开该会话的手机，把手机端卡住；现在只推给你正在查看的会话（打开会话仍能看到完整内容）
    - 手机端「查看完整输出」取不到内容：电脑端此前不响应这个请求，手机上打开后台命令的完整输出一直是空的
