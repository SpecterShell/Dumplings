- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Added（新增）
    - 经验库改成「索引 + 原文」：每条经验落成一份 markdown 原文（可以单独打开、编辑、被引用），索引只记标题、原文位置、记录与更新时间；进对话上下文的只有索引，正文由 Mint 判断相关时再读——上下文有限，能索引的就索引
    - 经验分三类：本项目经验、本机/通用经验（本机环境与工作方式，每个会话常驻）、框架与技术栈经验（Flutter/Spring/Electron/React 等，只在对应技术栈的项目里出现）
    - 经验库维护：Mint 自行判断并清理过时、临时、重复的条目；被清理的原文与理由移进 archive/，可回溯
    Changed（调整）
    - 经验沉淀：Mint 自行判断后直接入库（此前的「确认卡片」随之移除），并标注时效性质（原则 / 约定 / 临时）
    - 经验检索：多关键词可命中（此前只有单个关键词的子串匹配才有效），返回索引与命中片段；需要全文时读原文
    - 进度条：显示当前步骤已耗时；等待你确认时显示「等待你」（此前一律显示「进行中」，分不清在干活、卡住还是等你）；清单被改回或漏项时 Mint 会收到提醒
    - 压缩后的提示卡：改为显示本次生成的摘要原文（Markdown 渲染、超长时卡片内部滚动），抬头按类型显示（此前一律显示「Agent 执行结果」）；不再附步骤清单
    - 浅色主题配色：头像与应用图标的主体色加深一档，浅色界面下更立得住
    - 头像形状：改为正方、铺满显示位置，与应用图标形状一致（此前略矮一点）
    - Windows / Linux 应用图标：改用自带圆角的图形（这两个系统不会自动给图标套圆角），与 macOS 下的观感一致
    - 关于页与引导页的应用图标跟随主题：暗色界面下改用暗色版图标（与 Dock 图标同一套素材）；引导页的图标改为直接显示（不再套一层卡片容器——容器形状会在图标四角外露，且套上后可见图标明显偏小）
    Fixed（修复）
    - 命令安全扫描误伤：脚本里出现 format 这类词不再被误判为系统级命令而拒绝执行
    - 工具结果卡片展开：滚动边界处不再切出半行文字
    - Windows 图标尺寸档位补全：应用图标此前只有 7 个尺寸档，缺 Windows 常用的 20 / 40 / 96——系统遇到这些尺寸会从相邻档缩放，小档缩放后圆角被抹平（桌面快捷方式在个别图标尺寸下看着是直角）；现补齐为 10 档
    - Windows 图标改用标准 ICO 格式：帧改为 32bpp BMP + AND 掩码（此前是 PNG 帧且缺掩码）——这种半标准结构会让打包环节给程序本体注入图标时出问题，表现为「桌面快捷方式与程序本体图标显示直角，而卸载程序图标正常」
    - Windows / Linux 图标改为贴边口径：图形本体占满画布（此前沿用 macOS 图标网格的 80.5%，会显得比同屏其它应用小一圈）；macOS 包内图标与 Dock 图标口径不变
