  Key: ReleaseNotes
  Value: |-
    Improvements
    Database Objects Tree
    Start quick search in the Databases tab from the currently selected position
    Export
    Add the ability to set a default sheet name for Excel exports
    Grid Component
    Make the time component optional when entering timestamps in the grid
    Bugs Fixed
    Auto-Completion
    Auto-complete gives no suggestions after unrecognized keywords in CASE
    Auto-complete may miss valid column suggestions in statements that contain multiple USING clauses
    Connection Setup
    Can't choose a file when configuring file-based databases
    DB Support: Oracle
    Incorrect script generated when adding a datafile without a filename (OMF)
    DB Support: PostgreSQL
    Error fetching constraint DDL in PostgreSQL
    Export/Import User Settings
    SSH configurations are not included when exporting mounted connections
    Favorites
    Error when renaming items in the Favorites tab
    Grid Component
    Error when moving columns in the grid
    OS Support: Windows
    Application title is missing in the Windows taskbar
    Query Builder
    Various JOIN-related fixes in the query builder
    SQL Commander
    Pressing Alt+Left and Alt+Right may not switch tabs as expected
    Pressing the End key is not recorded in macros
    Refreshing metadata may incorrectly report a read-only result set as editable
    Tabs may be lost or ungrouped when moving tab groups between windows
    SQL Log
    Error when saving large log files
    Security
    Connection may fail with a missing master password error when no master password is configured
