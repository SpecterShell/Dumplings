  Key: ReleaseNotes
  Value: |-
    Pi-Wm v0.1.17 — 终端侧栏、模型管理与界面体验优化
    已于 2026-10-04 19:16（北京时间）正式发布并设为 Latest。Windows 与 macOS 两种架构均完成构建和定向验证，九个正式附件摘要已核对。
    本次更新
    - 终端改为右侧独立面板，打开时保留当前对话和未发送草稿；支持拖动或方向键调整宽度、双击恢复默认宽度。收起面板不结束命令，窄屏使用抽屉布局，并与浏览器预览、运行详情面板互斥。
    - 模型服务支持二次确认后整组删除，同时移除保存的密钥及所属对话、图片和视频模型；刷新模型与媒体设置，清理相关编辑状态，持久化失败时保留服务和模型。
    - 模型设置和模型选择菜单展示所属服务，方便区分不同服务下的同名模型；选择器保留服务端口和路径，不展示 URL 中的账号、密码、查询参数或片段。
    - 优化壁纸模式下的思考强度菜单：点击打开、顶层渲染、外部点击关闭；长模型名使用省略显示，改善窄屏布局。
    - 深色壁纸下的 AI 回复默认隐藏整块底色、边框和阴影，鼠标进入或键盘聚焦时淡入阅读底色，不改变排版；触屏保留淡阅读底色，减少动态效果模式关闭过渡。
    - Windows 原生窗口按钮区域采用透明背景，消除不同配色下的固定背景色块；窗口按钮图标跟随深浅主题。
    验证状态
    - npm run check 通过：源码、E2E 与测试类型检查，以及 8 套主题各 80 对颜色对比检查。
    - 模型服务、模型分类和思考菜单的 3 个定向单元测试文件、36 项测试通过，包含删除服务、保存失败回滚、媒体默认模型处理和服务地址脱敏。
    - 11 项定向浏览器回归通过，覆盖模型来源、整组删除的确认与取消、重启后持久化、思考强度菜单、真实终端会话保留和调整宽度、深色壁纸回复及触屏布局。首次并行执行时模型分类测试在页面加载阶段遇到 Vite 504 Outdated Optimize Dep；保留失败 trace，改为单 worker 独立执行后通过，未修改或放宽断言。
    - 已查看 1440×900 与 390×844 页面、终端抽屉、模型来源菜单、壁纸思考菜单和回复截图；终端开启时对话保留，手机工具栏与关闭按钮可见，未发现本轮明显遮挡或横向溢出。
    - 浏览器诊断无未捕获页面异常、失败 HTTP 请求或 HTTP 错误；开发模式预览记录了连接建立前关闭的 WebSocket 警告，未影响后续连接和终端就绪。不将此记录表述为零警告。
    - node scripts/verify-desktop-chrome.mjs 通过：菜单、IPC 校验、拖拽区域、透明原生窗口按钮、四套配色、1440/800 像素窗口检查；已查看原生窗口截图。
    - npm run desktop:dist 通过；Windows 安装包 SHA-512、blockmap、更新源与 15,797 个运行时文件清单校验通过。安装包大小为 249,517,381 字节。
    - node scripts/verify-desktop.mjs --packaged=release/win-unpacked/Pi-Wm.exe 通过：隔离目录中的包内应用启动、鉴权 API/WebSocket、原生终端命令、渲染器隔离、单实例、项目与主题保留、重开及正常退出。未执行产品安装器。
    - Windows EXE SHA-256：da253761a70a2e1e09982aac14719f575df2c1c43ab934de9f25fac7ec21241c。
    - 应用源码及标签提交：5728415520b38cfa668248c6e2c6e67908dc2da4。提交钩子仅调整排版；提交后类型检查、36 项单元测试和模型管理、壁纸回复的 3 项浏览器复测通过。重新构建的 136 个应用文件与 Windows 暂存运行时逐项一致。
    - macOS 原生构建运行 37196999159：Apple Silicon 与 Intel 均通过归档、ad-hoc 签名、内置运行时与包内应用验证，并成功上传附件；按精简策略跳过完整桌面回归。
    - 九个正式附件已核对：Windows 三件文件大小与 SHA-256 和本地一致；Mac DMG/ZIP 与校验文件及 GitHub SHA-256 一致。未附带测试数据。
    - 发布后匿名下载公开 latest.yml，与本地元数据逐字一致；此检查不等于旧客户端完整安装包下载或真实升级验收。
    - 本次按改动风险执行定向验证，未重复全仓库测试、完整 E2E 或完整桌面测试；未执行收费模型、Windows 真实安装升级或旧客户端公开安装包下载验收。源码全量 CI 主动省略，采用本地定向验证。
    已知限制
    - Windows 安装包未配置发布者签名；macOS 使用 ad-hoc 签名、未经 Apple 公证，且不提供自动更新，系统可能提示未知发布者或拦截安装。
    - 任意壁纸局部的文字对比度无法仅靠自动取色保证，可降低背景强度或提高面板浓度。
    - 生产构建保留既有主包超过 500 kB 的提示；未将其当作本轮性能改进证明。
    - 本轮包内启动和附件校验不替代真实安装升级验收；Mac 干净系统 Gatekeeper 安装验收仍需独立完成。
