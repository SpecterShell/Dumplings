  Key: ReleaseNotes
  Value: |-
    Pi-Wm v0.1.19：团队任务流程、目录附件与聊天体验
    已于 **2026-10-12 13:05（北京时间）**正式发布并设为 Latest：GitHub Release。Windows x64、macOS Apple Silicon 与 Intel 共 9 个附件已核验。源码与版本标签提交为 e61179dd2c209fa79cd6357ba07bc2af99504198。
    本次更新
    - 团队看板增加阶段导航、完成进度、定位执行中任务和执行流连线；区分显式依赖与已记录的成员任务接续，搜索后保留原有阶段位置。
    - 优化壁纸下团队卡片的透明度、悬停与聚焦阅读效果。团队人数上限统一为 5 人（包含 Lead），保留已有历史团队。
    - 桌面端支持拖入文件夹作为只读目录引用，模型可通过 directory_read 按需列出、搜索和读取；不打包或遍历上传整个目录，支持与普通文件混合附加。
    - 本机普通文件上传默认不设应用层字节上限，可通过 WUMING_MAX_FILE_ATTACHMENT_BYTES 配置。远程、手机和图片等独立限制保持原有边界，并改善上传错误提示。
    - 对话输入区增加 Git 分支选择器，支持搜索、切换与创建本地分支；切换已有分支时保护未提交改动。
    - 设置中增加聊天字体、12–24px 字号及标准、宽、铺满三种对话宽度，支持即时预览、恢复默认与当前设备保存。
    - 桌面图片右键菜单增加“复制图片”，复制图像内容而非图片地址。
    - 前端验收默认只测试桌面网页；项目面向手机、任务涉及手机适配或用户明确要求时，才增加手机视口测试。
    下载与安装
    - Windows x64：下载 Pi-Wm-0.1.19-Setup-x64.exe，也可在已配置更新源的应用内检查更新。
    - macOS Apple Silicon：下载 Pi-Wm-0.1.19-mac-arm64.dmg 或对应 ZIP。
    - macOS Intel：下载 Pi-Wm-0.1.19-mac-x64.dmg 或对应 ZIP。
    - Windows 更新附件为同一次构建生成的安装包、.blockmap 与 latest.yml；macOS 校验值见对应 .sha256 文件。
    验证记录
    - 9 个测试文件共 156 项针对性功能测试通过，覆盖目录授权与读取、文件限制、团队人数与布局、分支操作、聊天外观和系统提示词。
    - 修复团队看板测试中 3 处严格可选属性类型错误后，受影响的 12 项测试再次通过；生产代码、网页、E2E 和测试代码类型检查通过。
    - 桌面上传协议与右键菜单的 12 项测试通过。8 套主题各 80 项对比度检查通过。
    - 原生 Electron 验证通过：附件按钮、多个文本和二进制文件逐字节上传、原生拖入、2100 文件目录引用、模型工具实际读取、混合附件和移除。
    - 11 项定向浏览器用例通过，覆盖分支切换保护、聊天外观持久化、图片粘贴、目录引用、阶段导航与壁纸。修复目录拖拽夹具在 Chromium 中丢失模拟目录标记的问题后，该用例与 E2E 类型检查再次通过；已检查桌面阶段看板和聊天设置截图。
    - 原生 Electron 图片右键复制验收通过，验证了剪贴板实际像素、鉴权图片、文本复制和预览区域操作。
    - Windows 构建通过：安装包大小为 249,590,802 字节，SHA-512、blockmap、更新源、15,811 个包内运行时文件清单与路径预算检查通过。
    - 将 Windows 包移到源码目录外启动，验证了 UI、鉴权 API/WebSocket、原生 PTY、渲染进程隔离、单实例、项目与主题持久化及正常退出。
    - macOS Apple Silicon 与 Intel 的构建、原生运行时及包内验证全部通过，专项工作流为 38144012267，对应源码提交 e61179dd2c209fa79cd6357ba07bc2af99504198。
    - 9 个正式附件已核验：Windows 安装包、blockmap 和更新元数据的大小及 SHA-256 与本地一致，Mac 的 DMG/ZIP 与对应校验文件及 GitHub SHA-256 一致。
    - 发布后匿名下载公开 latest.yml，与本地构建逐字节一致；这不等于旧客户端完整安装包下载或真实安装升级验收。
    已知限制与验证范围
    - 目录引用仅限本机，按工作区授权，只允许读取；引用内容反映磁盘当前状态，目录移动或删除后需要重新附加。普通浏览器无法取得拖入目录的原生路径。
    - 本机大文件仍受浏览器、Node.js 和可用内存限制；取消应用层字节上限不代表支持任意大小文件。
    - 分支切换影响同一工作区的所有对话，不创建独立 worktree。聊天外观设置不跨设备同步。
    - Windows 安装包未签名；macOS 使用 ad-hoc 签名，未经 Developer ID 签名和公证。
    - 按改动范围执行针对性验证，未执行全仓库测试、完整 E2E、完整桌面回归、收费模型、真实手机或完整安装升级矩阵。macOS 使用专项构建和包内检查；源码全量 CI 不重复执行本地验证。
    - 构建仍提示桌面主包大于 500 kB，检查中存在 SQLite 实验性提示和未使用导入的 lint 警告。
