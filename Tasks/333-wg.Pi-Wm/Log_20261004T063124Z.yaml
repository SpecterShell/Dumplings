  Value: |-
    Pi-Wm v0.1.16
    本次更新
    - 新增“壁纸与氛围”：两套渐变背景、自定义本地图片、最多 24 张壁纸收藏及缩略图切换；支持删除确认、背景强度、焦点、模糊与面板浓度调整。图片仅保存在本机浏览器存储，不上传。
    - 壁纸自动协调浅深色配色，背景贯穿工作台与桌面标题栏，终端支持透明背景；关闭壁纸恢复原有经典配色。保留减少动态效果偏好，隐藏页面暂停渐变动效。
    - 优化长会话初始渲染：已完成的执行过程首次展开才挂载详情，再次折叠保留工具详情状态；修复重复点击搜索命中时的展开与定位。
    - 优化团队目标折叠、长文本任务卡片、成员和通信消息阅读布局，团队状态色跟随主题；统一侧栏新建对话和定时任务入口样式。
    - 修复 Demo 模式历史编辑回退，新增核心浏览器回归门禁、长会话性能记录及 12 场景任务基准。基准默认只列计划，显式运行真实模型才可能产生费用。
    验证状态
    - npm run check 通过：源码与测试类型检查，8 套主题各 80 对颜色对比检查。
    - 7 个前端定向测试文件、129 项测试通过；任务基准工具 7 项自测通过，仅使用本机模拟模型。
    - 22 项定向浏览器回归通过，覆盖壁纸导入、图库迁移、切换与删除确认、存储失败、跨标签页同步、终端输出保留、长历史搜索、历史编辑、团队卡片和侧栏布局。
    - 已人工查看 1440×900 与 390×844 页面，验证壁纸启用、刷新保留、移动导航与深浅色切换；未发现本轮界面遮挡或横向溢出。
    - Windows 生产构建、安装包 SHA-512、blockmap、更新源配置和 15,797 个运行时文件校验通过。安装包大小为 249,516,024 字节。
    - Windows 隔离包内应用启动验证通过：鉴权 API/WebSocket、原生终端、渲染器隔离、单实例、项目与主题保留、重开及正常退出。未执行产品安装器。
    - 应用源码及标签提交为 97a602db447534eb34e563d32549d87bc23fbdde。提交钩子调整测试写法后，团队卡片 2 项回归再次通过；产品源码未改变。源码全量 CI 本次主动省略，使用上述本地定向验证。
    - macOS 原生构建运行 37114527530：Apple Silicon 与 Intel 均通过归档 ad-hoc 签名、内置 Node、Chromium/PDF/canvas/SQLite、应用界面及原生终端验证。按精简策略跳过完整桌面回归。
    - 九个正式附件已核对：Windows 三件文件与本地大小及 SHA-256 一致，Mac DMG/ZIP 与对应校验文件及 GitHub SHA-256 一致。未附带测试数据。
    - Windows EXE SHA-256：547581556e310e1a3adbee655c6e5006750b83eaa505d58e23b3e87e9551f810。
    - 已于 2026-10-03 18:07（北京时间）正式发布并设为 Latest。发布后匿名下载公开 latest.yml，与本地文件逐字一致；此检查不等于旧客户端完整安装包下载或真实升级验收。
    - 未重复全量仓库测试及完整 E2E；未执行收费模型、Windows 真实安装升级或旧客户端公开安装包下载验收。生产构建保留既有主包超过 500 kB 的提示。
    已知限制
    - Windows 安装包未签名；macOS 使用 ad-hoc 签名、未经 Apple 公证，系统可能提示未知发布者或拦截安装。macOS 不提供自动更新。
    - 壁纸保存在当前应用或浏览器站点的 IndexedDB，不跨浏览器或端口共享；清除站点数据会删除图库。任意图片局部的文字对比度无法仅靠自动取色保证，可降低背景强度或提高面板浓度。
    - 长会话优化不是全历史虚拟化；浏览并展开很多过程后内存仍可能增长。合成性能基线不是正式安装包或真实用户性能承诺。
    - 本次按改动风险执行定向验证，不重复全仓库测试、完整 E2E、Windows 真实安装升级矩阵或收费模型评测；Mac 干净系统 Gatekeeper 验收仍需独立完成。
