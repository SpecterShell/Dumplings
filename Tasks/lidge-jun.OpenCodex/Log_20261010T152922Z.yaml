Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Published to npm as @bitkyc08/opencodex@2.82.0 with dist-tag latest.
    New Features
    - Accept Codex thread links in conversation filters (#6734)
    - Carry each LazyCodex role's reasoning effort into omo.jsonc (carry #6801) (#6823)
    - Own the ocx terminal command on PATH (#6816)
    - Hand package launchers off to the Desktop ocx (#6818)
    - Refresh already-connected clients after a background catalog change (#6836)
    - Treat long windows as 1M on every Claude surface (#6780)
    - Add a 200k context-accounting opt-in (#6781)
    - Add a Context accounting control to the Claude Code page (#6782)
    Bug Fixes
    - Compare picker metadata file identity with BigInt stats (#6772)
    - Word context overflow as "prompt is too long" so Claude Code compacts (#6778)
    - Carry LazyCodex role-model fixes ([codex] mirror, routed effort ladder, omo tab) (#6785)
    - Read the Ollama Cloud quota from /api/balance (#6786)
    - Keep external task input a user turn in raw-body repairs (carry #6769) (#6795)
    - Keep hosted search history as bounded reference notes in portable summaries (carry #6746) (#6799)
    - Carry a provider's own encrypted reasoning, bound to its minting route (carry #6741) (#6804)
    - Bound and classify ChatGPT token refresh failures (#6792)
    - Drain ACL work and close history before Windows fixture removal (#6797)
    - Keep catalog probes async and release aborted translator budgets (#6796)
    - Pin claude-haiku-5-5 to the Anthropic wire (#6788)
    - Refresh Azure vision and token metadata during discovery (#6794)
    - Point to a manual download when an update install fails (#6789)
    - Apply initial effort to native Chat dispatch (carry #6750) (#6790)
    - Retain child-owned prepaid send reservations (carry #6751) (#6798)
    - Treat a Desktop-supervised runtime as the authority in status, doctor and resolve (#6802)
    - Keep the default Bun transpiler cache inside the test sandbox (#6805)
    - Fall back to a validated PATH Bun and warn on lifecycle version skew (#6807)
    - Refuse to compete with a Desktop-supervised runtime in service, update, start and stop (#6809)
    - Serialize config writers under one canonical lock and bind recovery to it (carry #6774) (#6811)
    - Retain operator Ultra Fast declarations across regeneration (#6819)
    - Treat a missing Codex home as nothing to restore (#6820)
    - Name the reviewed recovery for Aside profiles that read off (stale) (#6825)
    - Admit update restart past an inactive service record bound to a full record fingerprint (#6808)
    - Keep test processes out of the real Claude config directory (#6835)
    - End the translated stream at message_stop (#6826)
    - Log requested effort on native Messages requests (#6827)
    - Commit explicit account selections atomically (carry #6813) (#6824)
    - Expose the durable OCX request id as request-id on Messages (#6831)
    - Preflight the selected Bun before baking it into Windows launchers (replaces #6695) (#6812)
    - Record main-login responses under the observed main credential (#6830)
    - Eject an OAuth account whose access token was revoked (#6832)
    - Reclaim spill headroom before refusing a continuation (#6829)
    - Warn when Google Drive syncs the state directory (#6846)
    - Carry remaining #6723 change (picker CA persistence + log admission test) (#6847)
    - Stabilize account health and reuse WS per thread under concurrency (#6860)
    Documentation
    - Close the N3 test-infra unit (#6840)
    - Record the cross-OS probe of the desktop-owned CLI path (#6855)
    Chores
    - Open dev at 2.82.0 before releasing 2.81.0 (#6770)
    - Isolate the remote-prelude tests from a host-installed ocx (#6787)
    - Share bounded System One exchange across decision questions (carry #6698) (#6791)
    - Keep the rename fixture off provider discovery and serialize its temp homes (#6833)
    - Give the native toggle fixture its own service-manager evidence (#6834)
    - Make the periodic spill sweep resume case deterministic (#6848)
    - Warm the update-badge CLI graph before timing it (#6856)
    - Bound Windows shell shim spawns inside the spawn budget (#6862)
    - Give cold Windows bun.exe probes room inside the spawn budget (#6863)
    - Quarantine a final Windows EPERM instead of failing the case (#6861)
    - Expect the env-indirect Bun path in Windows preflight wrappers (#6852)
    - Read only marked lines from the real-shell PATH probe (#6851)
    - Add portable catalog async contracts and a Windows liveness diagnostic (#6806)
    Other Changes
    - 2.82.0 (#6878)
