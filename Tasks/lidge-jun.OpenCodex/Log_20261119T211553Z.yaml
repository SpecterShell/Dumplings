  Key: ReleaseNotes
  Value: |-
    Published to npm as @bitkyc08/opencodex@2.100.6 with dist-tag latest.
    New Features
    - Decide effort on every pinned turn with sessionPin.effort per-turn (#8549)
    - Add LLMTR to the free directory (#7955)
    - Support Business/Enterprise group-based spend_control quota (#8888)
    - Expose native Claude passthrough as a dashboard, CLI and API setting (#8860)
    - Add codexAuthMethod device-only login policy (#8598)
    - Report monthly usage from extra_usage when no plan window is present (#8889)
    - Opt in to Chat raw reasoning on the summary channel (#8773)
    - Official Antigravity CLI over ACP as a separate provider (#8794)
    - Support the Desktop picker on Linux through the user NSS database (#8775)
    - Add suggested combos to the existing workspace (#8914)
    - Carry hub quota-window projection from #7959 (#8909)
    - Per-provider connect and stall timeout overrides (#8907)
    - Explain managed release directories in the update dialog (#8911)
    - Carry the authenticated Hub management relay from #8079 (#8925)
    - Reduce terminal repair and credential masking work (#8774)
    - Keep the upstream message and status on an auto-paused account (#8751)
    - Gemini API inbound and one-click Antigravity app and agy CLI connection (#8742)
    - Add M365 Copilot with live account model discovery (#7757)
    - Opt-in weekly reserve for Claude subscription traffic (#8118)
    - Opt-in same-model retries for pre-output ChatGPT capacity refusals (#8894)
    - Surface validated Cloud Code Assist appeal links on paused accounts (#8936)
    - Admit proof-verified Codex package builds for compatibility (#8114)
    - Hide the effort control on a decide-mode JEV Combo (#8861)
    - Add AbliteratedLLM API-key preset (#8747)
    - Cost credit-billed provider rows from providerCredits and a configured credit price (#8452)
    - Reduce repeated uploads and continuation storage (#7806)
    - CLIProxyAPI parity for Gemini inbound, Interactions API and Google outbound fidelity (#8771)
    - Keep one OAuth account per organization and show its name (#8859)
    - Add reset-near-weighted account pool strategy (#8180)
    - Per-account probe and quota table, Antigravity quota-family rotation, verified Vertex ADC (#8740)
    - Opt-in capabilityPolicy "union" advertises member capabilities and filters per request (#8651)
    - Preserve native Gemini payloads over Antigravity OAuth (#8757)
    Bug Fixes
    - Preserve native identity for Claude cloud project children in the Anthropic pool (#8886)
    - Bound alias collision construction and reuse listing views (#8812)
    - Keep synthetic replay refusals out of combo quota attribution (#8862)
    - Bound tool-envelope echo filtering work (#8809)
    - Exclude foreign users from stop candidates (#8817)
    - Keep the configured pnpm store during update planning (#8906)
    - Report inert on the unified pool-settings read (#8825)
    - Pause a Cloud Code Assist account on its first Terms of Service ban without opt-in (#8826)
    - Select the Connect protocol per model (#8856)
    - Replay a Google 429 only when it carries retry evidence (#8897)
    - Name the Privacy Mode fix when xAI refuses a Legacy (no storage) account (#8901)
    - Enforce request tool choice before consultations (#8807)
    - Silence the checked-stop helper progress stream and count the pnpm owner probe in the update lint (#8917)
    - Withhold hosted advisor under captured spend ceilings (#8815)
    - Restore Child file integrations before shutdown (#8803)
    - Apply per-model compact windows at launch (#8688)
    - Retry owned reverse forwards and report relay degradation (#8924)
    - Keep fragmented native streams moving (#8883)
    - Opt-in one-shot image-413 recovery (carry of #7308) (#8927)
    - Keep proxy-enforced web-search deadlines out of upstream failure evidence (#8744)
    - Refresh owned DeepSeek Harness catalogs (#8910)
    - Recognise paid usage and recheck stale plan limits (#8599)
    - Recover startup after loopback connect timeouts (#8920)
    - Attribute local native continuation refusals (#8922)
    - Keep display estimates out of Combo spend accounting (#8887)
    - Write portable sibling model catalog bindings (#8912)
    - Normalize caller instructions in translated OAuth requests (#8194)
    - Restore Child file integrations before shutdown on Windows (#8937)
    - Reserve output headroom and margin estimates in target admission (#8585)
    - Enforce interactive-only policy on Gemini and Ollama ingress (#8941)
    - Retain same-account credential recovery attempt outcomes (carries #8882) (#8900)
    - Release a superseded retry response before waiting for a pacing slot (#8743)
    - Fill the unset Fable tier with claude-fable-5-2 (#8818)
    - Fix gateway client restore after profile or settings edits (#8943)
    - Scope keyless loopback replay to its WebSocket (#8816)
    - Cool targets after committed output_limit/stall and hop commentary-only degenerate completions (#8645)
    - Reject repeated Chat work announcements (#8841)
    - Report the final terminal-guard leg's usage to the client (#8881)
    - Infer phases from terminal snapshot tool work (#8586)
    - Keep snapshot owner reads inside the enumeration cap (#8965)
    Documentation
    - Mirror the OpenCode protocol-per-model section (fix dev Spanish localization gate) (#8913)
    - Keep error detail and provider reference within their line caps (#8942)
    Chores
    - Await the target-switch read before assertions (#8592)
    - Budget image and search relay fixtures (#8903)
    - Isolate updater and client fixtures from host installs (#8905)
    - Close hosted-advisor-choice fixtures before temp-home teardown (#8923)
    - Give PowerShell-backed proofs the spawn budget (#8926)
    - Revert "fix(link): restore Child file integrations before shutdown" (#8803) (#8930)
    - Raise the Ubuntu test shard timeout to 20 minutes (#8944)
    - Classify the managed-release launch-context read in the update lint (#8962)
    - Inject NSS stat failures across platforms (#8963)
    - Wait for native-main startup in Daybreak listing (#8966)
    - Silence progress before the fixture runs in the checked-stop helper test (#8921) (f5a0004d)
