- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Published to npm as @bitkyc08/opencodex@2.83.0 with dist-tag latest.
    Bug Fixes
    - Lower routed custom tools on the Responses wire (#6879)
    - Coordinate Grok and link writers (#6869)
    - Fill the unset Sonnet tier with claude-sonnet-5-5 (#6874)
    - Never discard a rotated native-main refresh token on cancel (#6859)
    - Release active-turn admission when the client cancels (#6850)
    - Key response tool calls by native id before index (#6858)
    - Carry reasoning ladders and image input into the provider_config.json store (#6828)
    - Warn once when a custom provider drops replayed plaintext reasoning (#6882)
    - Let the empty-completion retry replay a pre-output Vertex malformed call (#6881)
    - Release inbound body admission when the client disconnects (#6883)
    - Attribute proxy replay refusals as transport-ambiguous (#6887)
    - Judge machine-path-conflict from a fresh logon PATH (#6888)
    - Negotiate Auto for positively restricted accounts (carry #6472) (#6885)
    - Keep recognized bare upstream error classes in synthesized terminals (#6889)
    - Promote caller x-session-id on Chat Completions ingress (#6880)
    - Keep rediscovering main-account credits after an unavailable observation (#6886)
    - Report spend-ledger storage refusals as local 503s (#6890)
    - Claim coupon redemptions before dispatch and reconcile uncertain outcomes (#6870)
    - Drop credential-shaped upstream diagnostics before they reach log rows (#6903)
    - Restore the configured wire before each Auto negotiation (#6904)
    Documentation
    - Archive 205 landed units from _plan to _fin (#6884)
    - Archive release-train coordination records to _fin (#6896)
    Chores
    - Isolate host settings and bound native Windows fixtures (#6864)
    - Report the sibling-recycle child's state when it stalls (#6893)
    Other Changes
    - Open dev at 2.83.0 before releasing 2.82.0 (#6875)
    - 2.83.0 (#6910)
    Changelog
