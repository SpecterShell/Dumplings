  Value: |-
    Published to npm as @bitkyc08/opencodex@2.100.1 with dist-tag latest.
    New Features
    - Show a spinner while telemetry consent and profile actions wait (#8471)
    Bug Fixes
    - Publish the verified npm tarball as a local path (#8467)
    - Start the 2.100.0 changelog at the reviewed legacy baseline (#8468)
    - Rank Fable accounts by its share of the weekly limit (#8469)
    - Reject malformed retained compact input before routing (#8433)
    - Attach telemetry.opencodex.me as a Custom Domain (#8472)
    - Preserve identities across partial snapshots (#8401)
    - Bound image pruning memory and normalize malformed references (#8434)
    - List Identity Center profiles without an oversized page (carry of #8084) (#8473)
    - Revalidate ownership before honoring a spent publication wait (#8422)
    - Upscale inline images below the 64px minimum edge (#8083)
    - Present Claude Code 2.1.321 so Fable 5.2 is accepted (#8474)
    Changelog
    Full Changelog: https://github.com/lidge-jun/opencodex/compare/v2.100.0...v2.100.1
