  Key: ReleaseNotes
  Value: |-
    Published to npm as @bitkyc08/opencodex@2.95.0 with dist-tag latest.
    New Features
    - Show distinct first-response states on the provider overview (#7939)
    - Skip Unicode folding for plain ASCII metadata (#7886)
    - Per-client model visibility for the Desktop list (#7769)
    - Add IAM Identity Center login to dashboard (#7690)
    - Opt in to omitting disabled native models (#7889)
    - Link completion probe failures to recovery, re-verification, and disconnect scope (#7947)
    - Scan SSE inspection fragments incrementally (#7913)
    - Test all models of a provider and disable the failures (#7742)
    - Complete gracefully on max_output_tokens (#7770)
    - Let the omo integration write the Responses dialect (#7890)
    - Add keyless CC-Switch provider import with preview, apply and restore (#7935)
    - Count snapshot text bytes incrementally (#7957)
    - Move integrity scans off the serving thread (#7972)
    - Tier role auto-assign candidates by measured capability in the role's task domain (#7624)
    Bug Fixes
    - Honor explicit Opus 5.5 reasoning summaries (#7881)
    - Report main-pool affinity decisions in request logs (#7883)
    - Keep local account cooldowns from quarantining combo targets (#7887)
    - Reserve SSH forward ports until handoff and recover lost candidates (#7893)
    - Re-arm the atomic writer's ACL timeout memo per destination (#7891)
    - Preserve tool safety on translated Messages fallbacks (#7919)
    - Drop the include entry xAI rejects (#7911)
    - Preserve Muse reset countdown after quota exhaustion (#7730)
    - Explain why Antigravity project discovery failed (#7888)
    - Keep layout.json under the file-size threshold (#7943)
    - Default Moonshot API to K3.1 Pro and retire K2.5 (#7880)
    - Send LM Studio one leading system message (#7882)
    - Treat headless GUI-domain launchctl 125 as an unreachable domain (#7697) (#7745)
    - Fail over when a target rejects a request for context length (#7892)
    - Support manual consultations during web search (#7858)
    - Keep final Responses events without a newline (#7873)
    - Resolve the atomic-write fixture root before matching cleanup paths (#7945)
    - Budget hosted fixture phases without weakening contracts (#7946)
    - Feed the abort fixture's stdout once (#7948)
    - Use a never-allocated PID for the pending-child recovery fixture (#7949)
    - Give native passthrough success paths the internal header deadline (#7951)
    - Publish the overlap fixture after the recheck budget is spent (#7950)
    - Judge protected-tree containment per path component (#7884)
    - Apply the caller's paid-combo consent and device fallback policy (#7894)
    - Explain upstream request failures (#7936)
    - Distinguish install failures from owned deadlines (#7977)
    - Keep Kimi K3.1 Pro tool continuations valid (#7944)
    - Make per-task ceilings configurable from config and dashboard (#7960)
    - Keep Advisor requests cloneable for the retry snapshot (#7981)
    - Snapshot ACL failure diagnostics (#7970)
    - Explain tracked runtime stop refusals (#7973)
    - Decode routed slugs via modelDisplayNames ids (#7979)
    - Normalize Codex tool catalogs and include for Meta Muse (#7985)
    - Bigint probe identity in runtime preflight; release CC-Switch F3 WAL handles (#7986)
    - Skip Meta Muse targets for mandatory tool_choice (#7982)
    - Accept CR-delimited Responses events (#7989)
    - Omit unsupported Responses encrypted output include (#7988)
    - Validate CLI and desktop launcher execution boundaries (#7876)
    - Stop Windows ancestor-watch feedback loops (#7976)
    - Name the invalid model row and the static-list workaround (#7990)
    - Stop scoring an elapsed 5-hour window against a pool account (#7994)
    - Retire a pool account's carried 5-hour window when WHAM shows none (#7980)
    - Keep web_search native when no sidecar backend can run (#7991)
    - Keep the quota report cache when pool readings are only restamped (#7992)
    - Promote additional_tools to top-level tools for xAI and strict gateways (#7983)
    - Prune generated agents when the Claude integration is turned off (#7993)
    - Bound the integrity check wait (#7984) (#7997)
    - Await recovery ACL checks in async parent admission (#7931)
    - Refuse dashboard restart under a systemd unit OpenCodex does not own (#7996)
    - Admit config-root cache writes after the optional config-root ACL flight (#7998)
    - Compare file identity with bigint stat (#8019)
    - Compare Codex and remote workspace file identity with bigint stat (#8023)
    - Compare CLI install and update artifact identity with bigint stat (#8031)
    Documentation
    - Say when the workflow send ceiling is checked (#7987)
    Chores
    - Warm the PowerShell ancestry probe before its timed run (#7885)
    - Add offline fixtures for claude-cli schema-constrained output (#7908)
    - Expose bounded Windows plan refusal diagnostics (#7937)
    - Bump rustls from 0.23.45 to 0.23.46 in /desktop/src-tauri (#7942)
    - Cover encrypted Responses tool continuation (#7975)
    - Corrupt the index the health query plan actually reads (#7995)
    - Corrupt the health index through a cold connection (#8000)
    - Assert the cold keyring refusal kind and report its cause (#8001)
    - Finalize the F1/F2 fixture statements before cleanup (#8002)
    - Name the pinned-port holder when a sibling misses its deadline (#8003)
    - Await the admitted provider quota cache write (#8004)
    - Report the hardened local-CA ACL in the first-party apply suite (#8016)
    - Select injected stat targets by canonical path (#8029)
    - Give the Windows apply x64 fixture compile the shared spawn budget (#8032)
    Other Changes
    - Open dev at 2.95.0 before releasing 2.94.0 (#7934)
    - Kiro: log the usage Kiro reports on every wire, and forward combo child usage after commit (#7433)
    - Promote frozen tip c68885b5f1 to main as 2.95.0 (#8034)
