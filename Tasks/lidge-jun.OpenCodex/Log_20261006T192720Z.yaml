  Key: ReleaseNotes
  Value: |-
    Published to npm as @bitkyc08/opencodex@2.79.0 with dist-tag latest.
    Bug Fixes
    - Strip Claude Code's rotating billing line before Responses instructions (#6634)
    - Combine consecutive tool results for one invocation (carry #6584) (#6636)
    - Budget batched results per query so none are dropped (#6638)
    - Identify decode estimate timing basis (#6582)
    - Enforce admission scope on Advisor models (#6617)
    - Guide native login switching and manual retry (#6581)
    - Synchronize manual account pause across matching main and pool entries (#6624)
    - Cover the bounded startup health probe read (#6587)
    - Retain approved Desktop picker trust across restarts (#6639)
    - Redact terminal reset-replacement errors (#6616)
    - Enforce stored-account credit policy through dispatch (#6606)
    - Require one-use config write intent for standalone pairing (#6605)
    - Delete and reveal API keys from the key table (#6653)
    - Accept NTFS file ids above 2^53 in the update restart marker (#6644)
    - Migrate legacy Windows local-CA ACLs and stop re-inspecting unchanged files (#6645)
    - Read pairing-intent ACLs without PowerShell cmdlet autoload (#6651)
    - Let ocx ensure wait for a slow cold start while its child lives (#6681)
    - Join client-created voice calls as the caller that owns them (#6678)
    - 2.79.0 dependency audit fix (#6688)
    Documentation
    - Translate the busy-lease guidance on every locale page (#6626)
    Chores
    - Typecheck gui/ in prepush when the branch changes it (carry #6485, #6592) (#6637)
    - Keep the post-refresh replay inside the pacing window on Windows (#6652)
    - Stop the lease holder fixture from cold-importing the service graph (#6661)
    - Run Windows shards on Windows-sensitive PRs and nightly, with a shared PowerShell module cache (#6670)
    - Give the non-readiness cases an isolation budget (#6682)
    - Share Bun's transpiler cache across sandboxed homes (#6683)
    Other Changes
    - Open dev at 2.79.0 before releasing 2.78.0 (#6631)
    - 2.79.0 (#6677)
    Changelog
