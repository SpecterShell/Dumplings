Version: 2.94.0
Installer:
- Architecture: x64
  InstallerType: wix
  InstallerUrl: https://github.com/lidge-jun/opencodex/releases/download/v2.94.0/OpenCodex-2.94.0-windows-x64.msi
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Published to npm as @bitkyc08/opencodex@2.94.0 with dist-tag latest.
    New Features
    - Preserve structural tool turns (#7561)
    - Add Runcrate to the free directory (#7726)
    - Avoid rescanning fragmented SSE records (#7766)
    - Refresh connected Hermes configs after catalog changes (#7704) (#7719)
    - Add confirmed POSIX CLI updates and durable job status (#7586)
    - Label routed /v1/models rows from modelDisplayNames (#7817)
    - Add ocx codex launcher mirroring ocx claude (#7346)
    - Windows Remote Link Children and Child credential/connection attestation (#7832)
    - Restore LazyCodex role models from a change history (#7693)
    - Add proof-bound Windows CLI update planning (#7596)
    - Use Bun 1.4.4 native type checking (#7632)
    - Add T3 Code as an export and integration client (#7529)
    - Revocable server-side remembered device sessions (#7593)
    - Add protected Windows CLI update job storage (#7626)
    - Apply Windows CLI updates with owned transactions (#7648)
    - Add opt-in alias naming for Hermes and Command Code exports (#7867)
    - Add per-source interception toggles (#7760)
    Bug Fixes
    - Report a timed-out first-party rollback as incomplete (#7781)
    - Publish the subscription lane's widest context rung for Grok 4.5-4.7 (#7701)
    - Expire idle picker uploads while preserving backpressure (#7784)
    - Preserve native Mistral thinking on replay (#7814)
    - Preserve bounded ACL failure diagnostics (#7773)
    - Preserve append-only client tool discovery on opted-in Responses routes (#7453)
    - Frame retained requests before portable compaction checkpoints (#7822)
    - Scope cooldown reprobes to reserving request (#7764)
    - Honor Retry-After floor and recognize the Cloud Code Assist ToS account ban (#7819)
    - Guard the MiniMax stale-roster refresh to official destinations (#7829)
    - Forward Qoder CN images through shared coding-agent projection (#7536)
    - Verify live Desktop recovery before CLI cold start (#7797)
    - Harden long compaction recovery paths with the extended spelling (#7823)
    - Expose native Fast selectors with 1M context (#7748)
    - Align Claude Code 2.1.280 OAuth profile and isolate session/device IDs (#7838)
    - Isolate pooled installation IDs, scrub turn-state on account switch, and align JSON token refresh (#7840)
    - Isolate Antigravity session/replay and Cursor H2 pool/JWT sub scope (#7842)
    - Harden multi-account pool cooldowns, affinity eviction, and deactivated exclusion (#7844)
    - Relay OpenAI tool calls instead of ending on the first sentence (#7599)
    - Explain elevated scheduler uninstall failures on Windows (#7825)
    - Preserve replay refusal attribution on WebSocket ingress (#7830)
    - Deliver upstream raw reasoning to Chat clients without a generation opt-in (#7833)
    - Request quota summary with the CLI fingerprint so Argon usage shows (#7804)
    - Consolidate multi-account discovery and model-denial routing (#7835)
    - Enforce required tools in native combo streams (#7831)
    - Reclaim inbound body capacity with a configurable budget (#7428)
    - Attest connected-stop preflight reads (#7762)
    - Keep pool session affinity across restarts and transient detours (#7828)
    - Preserve native source priority behind featured subagent models (#7839)
    - Keep native main available after keyring migration (#7774)
    - Gate config and Desktop writer phases on config-root ACL settlement (#7826)
    - Provide paired authority for compatibility controls (#7775)
    - Land ten small jsonc, search, retry, plain-data and stream fixes (#7821)
    - Recognize exact case-insensitive media types (#7768)
    - Export a known output limit as maxTokens (#7763)
    - Preserve captured caller admission scope (#7718)
    - Keep captured usage on an invalid negotiated completion (#7849)
    - Validate macOS app trust at execution boundaries (#7758)
    - Keep replay-refusal attribution through combo failures (#7864)
    - Stream completion-stable canonical apply_patch input (#7506)
    - Compute pooled windows from held account rows (#7862)
    - Restore local routing when a Link Child stops (#7736)
    - Hop and cool provider on upstream account quota exhaustion (#7625)
    - Avoid quota refresh failures from paused accounts (#7628)
    - Reject drive-less rooted Windows path overrides (#7824)
    - Recheck live ownership before journal recovery (#7851)
    - Disable header-arrival deadline for local upstreams by default (#7472)
    - Keep a protected recovery copy before persisting the opencode-free retirement (#7836)
    - Preserve service-home authority during recovery (#7154)
    - Admit local config writer phases after config-root ACL settlement (#7869)
    - Recover interrupted Bun postinstalls on retry (#7898)
    - Keep the bun install retry working on macOS bash 3.2 (#7900)
    - Avoid repeat ACL propagation for lifecycle roots (#7903)
    - Recover interrupted Codex CLI child publication (#7909)
    - Retire drained parent ownership and preserve bind scope (#7874)
    - Address Windows updater release and observation reviews (#7875)
    - Show provider connection and model tests on the served dashboard (#7922)
    - Fail native Messages streams that end before message_stop (#7928)
    - Parse model variants in linear time (#7938)
    Documentation
    - Clarify subagent spawn_agent fill behavior in order hint (#7537)
    - Keep the provider configuration reference under the file-size cap (#7856)
    - Register and document citation replay coverage (carry #7608) (#7865)
    - Generate a client support matrix from the client registries (#7924)
    - Lead with one local gateway for every coding tool (#7925)
    - Record runtime-verified client results on the support page (#7927)
    Chores
    - Open dev at 2.94.0 before releasing 2.93.0 (#7795)
    - Take every Bun pin from package.json (#7818)
    - Fix ASL server fixture cleanup and budgets (#7778)
    - Reserve distinct remote fixture ports (#7820)
    - Stop rebinding released loopback ports (#7847)
    - Isolate Windows fixture children from the account-wide runtime namespace (#7852)
    - Assert the specific refusal gate in the fixture preload tests (#7861)
    - Stop restarting the proxy per row in the bearer admission matrix (#7866)
    - Isolate the Desktop lifecycle lock in first-party fixtures (#7868)
    - Bound frozen installs and retry only deadline stalls (#7870)
    - Isolate the remaining Desktop lifecycle-lock fixtures (#7877)
    - Tolerate delayed desktop compatibility fixture port release (#7897)
    - Copy macOS bundle binary in remote workspace fixture (#7901)
    - Expose Windows recovery proof state and drain failed fixtures (#7902)
    - Separate recovery PID evidence and budget cold Windows fetches (#7915)
    - Fix config-root seed and macOS history-probe fixtures after #7903/#7900 (#7914)
    - Partition Windows apply coverage and rebalance hosted shards (#7917)
    - Stop racing a 250ms deadline in the Windows Child HTTP success case (#7921)
    - Refresh shard weights and restore job-time headroom (#7923)
    - Make dead-upstream CONNECT fixture deterministic (#7929)
    - Stabilize native recovery fixture compilation (#7930)
    - Split suite across four weighted shards (#7926)
    Other Changes
    - Treat lane=all as a batched dev check, not a per-PR gate (#7855)
    - Kiro: drop the private final answer when a real tool call shares the turn (#7434)
    - Promote frozen tip dc75a3e51 to main as 2.94.0 (#7940)
