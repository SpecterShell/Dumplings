    Published to npm as @bitkyc08/opencodex@2.80.0 with dist-tag latest.
    Bug Fixes
    - Accumulate temporary tool declarations linearly (#6656)
    - Exclude Claude Code reminders from decision state (#6662)
    - Retain ToolSearch references in translated results (#6660)
    - Accumulate consecutive tool results without prefix copies (#6657)
    - Apply the Qwen3.8-27B template rule to gateway-namespaced ids (#6685)
    - Preserve bare client tool names for Claude Code sessions (#6640)
    - Name the path and chmod fix when a private shim artifact is group-writable (#6680)
    - Credit Linux desktop Start at Login as restart protection in doctor (#6679)
    - Retryable restart-drain code and quiet journal no-op recovery (#6686)
    - Bump proxy-addr, fast-uri, ip-address and source-map-js for new advisories (#6687)
    - Preserve applied effort transitions in combo logs (#6663)
    - Use factual tool redirects for Claude-family models (#6664)
    - Keep local pacing waits out of the header deadline (#6700)
    - 2.80.0 (#6706)
    - 2.80.0 dependency audit fix (#6708)
    Chores
    - Keep recover-history temp paths under Windows MAX_PATH (#6694)
    Other Changes
    - Open dev at 2.80.0 before releasing 2.79.0 (#6676)
