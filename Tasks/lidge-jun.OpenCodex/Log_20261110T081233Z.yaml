  Key: ReleaseNotes
  Value: |-
    Published to npm as @bitkyc08/opencodex@2.100.0 with dist-tag latest.
    New Features
    - Add lightweight Rust ocx-child ephemeral Child relay and offline journal (#8237)
    - Zero-preinstall SSH ocx-child planting, --purge detach, and #remote UX (#8255)
    - Index filtered ledger queries and resume append ingestion (#8391)
    - Sync route intent and materialize clients per device (#8274) (#8276)
    - Add an opt-in thinking display policy per provider and model (#8392)
    - Re-land #8392: feat(anthropic): add an opt-in thinking display policy per provider and model (#8406)
    - Extend opt-in cache continuation diagnostics (#7479)
    - Add cheapaimodel API-key preset (#7899)
    - Default-on anonymous telemetry core with a human-only consent boundary (#8300)
    - Windows installer page to disclose telemetry and opt out at install time (#8348)
    - Telemetry consent popup on first run and after updates, with an Advanced toggle (#8303)
    - Cloudflare Worker + D1 collector and public stats API (#8304)
    - Public usage dashboard at opencodex.me/dashboard (#8308)
    - Opt-in public profile and personal usage rank (#8393)
    - Add jevEffortMode to keep JEV from re-tiering a cache-sensitive target (#8041)
    - Add Claude Fable 5.2 pricing, fast mode and provider rows (#8466)
    Bug Fixes
    - Configure Google Vertex ADC (#8311)
    - Show WorkBuddy credit balance in quota bar (#8323)
    - Stop the prompt-cache usage leak — replay native Messages on Anthropic children (#7374)
    - Release preview and stable from verified dev commits (#8328)
    - Fix Windows release attachment contract test harness (#8335)
    - Show verified Claude account in provider overview (#8334)
    - Diagnose Windows native-main claim setup failures (#8341)
    - Accept one leading UTF-8 BOM (#8205)
    - Count supplementary Han in token estimates (#8207)
    - Stop after the first terminal event (#8209)
    - Preserve final citation titles (#8198)
    - Serialize Lab public-evidence mutation with an OS-held lock and compare Lab file identity with bigint stat (#8035)
    - Keep Codex metadata frames from committing a combo child (#8107) (#8152)
    - Show subscription quota in provider reports (#7916)
    - Show Claude account email when privacy.maskEmails is false (#8364)
    - Stream progress while watching a dispatched release (#8367)
    - Support native image input through stable replay (#7978)
    - Replace repeated text-done snapshots (#8197)
    - Name the active Claude account in the provider Overview (#8296)
    - Keep Aside aggregate current when unselected profiles are absent (#8373)
    - Serve ocx link status over a private local control socket (#8370)
    - Raise Child preflight output cap and name the limit (#8380)
    - Explain a refused Remember instead of reporting the admin token unverifiable (#8374)
    - Retry a read-only Windows catalog replacement (#8382)
    - Report an unavailable provider preset as a usage error (#8310)
    - Read Kimi Coding Plan usage from the regional kimi.ai origin (#8399)
    - Probe the app-bundled CLI when no Codex CLI resolves (#8395)
    - Show the Child's own reason when ocx link add fails (#8390)
    - Keep Auto negotiation off real DNS in tests and survive a mid-negotiation account switch (#8389)
    - Keep bun's postinstall enabled on npm 11 and diagnose a skipped one (#8387)
    - Recover Aside overwrite previews instead of failing silently (#8384)
    - Stop warning about an uninstalled owned client on every model toggle (#8353)
    - Reclaim stale shim restore lock with several dead owners (#8349)
    - Report an untyped SSE error envelope as response.failed (#8299)
    - Clear replayed thought signatures on a real HTTP 400 (#8054) (#8150)
    - Prove an unbound non-loopback address absent by binding it (#8045) (#8046)
    - Re-land #8399: fix(quota): read Kimi Coding Plan usage from the regional kimi.ai origin (#8403)
    - Re-land #8395: fix(codex): probe the app-bundled CLI when no Codex CLI resolves (#8404)
    - Re-land #8390: fix(link): show the Child's own reason when ocx link add fails (#8407)
    - Re-land #8389: fix(copilot): keep Auto negotiation off real DNS in tests and survive a mid-negotiation account switch (#8408)
    - Re-land #8387: fix(update): keep bun's postinstall enabled on npm 11 and diagnose a skipped one (#8409)
    - Re-land #8384: fix(gui): recover Aside overwrite previews instead of failing silently (#8410)
    - Re-land #8353: fix(integrations): stop warning about an uninstalled owned client on every model toggle (#8411)
    - Re-land #8349: fix(codex): reclaim stale shim restore lock with several dead owners (#8413)
    - Re-land #8150: fix(google): clear replayed thought signatures on a real HTTP 400 (#8054) (#8414)
    - Let T3 Code start opencodex models with an effort (#8085)
    - Honor native OpenAI display name overrides (#8234)
    - Extend streaming protocol support and allow ten-minute recordings (#8232)
    - Keep OpenGateway lifecycle output_text from reading as an empty completion (#8376)
    - Stop killing blocked Claude Keychain reads (#8327)
    - Fix encrypted orphan reasoning replay for opted-in Ark Kimi endpoints (#8097)
    - Borrow the app-bundled catalog only when no Codex CLI resolved (#8419)
    - Preserve Chat tool defaults on OpenAI Responses routes (#8144)
    - Keep a Claude Code session's cache key and pooled account across turns (#8371)
    - Wait out a manual launchd bootout before reporting failure (#8385)
    - Classify Meta's Muse Code refusal as a plan restriction (#8396)
    - Wait for complete owner metadata during first registration (#8270)
    - Run the install serving the Child before Desktop or PATH copies (#8424)
    - Preserve Codex client metadata on routed requests (#8193)
    - Wait for a concurrently created filter index instead of calling it foreign (#8439)
    - Preserve provider drafts and bind saves to their dashboard target (#8438)
    - Keep the filter index's WAL sidecars so filtered queries stop churning the config directory (#8442)
    Documentation
    - GOAT link, official-API commercial note, account pool under Advanced usage (#8006)
    - Plan automatic update parity (#8275)
    - Add offline signed-update verification and checkpoint codec (#8294)
    - Plan default-on (opt-out) telemetry and the opencodex.me usage dashboard (#8293)
    - Design Child-to-Home account move over Remote Link (OCX-4) (#7495)
    - Describe history reconciliation and attested resume (#8346)
    - Scope the Remember proxy refusal to standalone dashboards and list its code (#8394)
    - Add custom gateway verification guide (#8350)
    - Re-land #8394: docs: scope the Remember proxy refusal to standalone dashboards and list its code (#8405)
    - Re-land #8350: docs(providers): add custom gateway verification guide (#8412)
    - Follow-ups to the re-landed Remember, custom gateway and owned-refresh changes (#8418)
    - Note that the per-turn tk token is dropped from session identity (#8421)
    - Telemetry and privacy guide plus configuration reference (#8305)
    - Redesign landing, navigation, and theme (#8005)
    Chores
    - Add targeted Windows native claim diagnostic lane (#8345)
    - Use independent expected paths in the Windows release PATH contract (#8366)
    - Run heavy Linux jobs on the lidge self-hosted pool for trusted runs (#8369)
    - Pin release evidence policy to the current ci.yml (#8377)
    - Remove retired release branch references (#8381)
    - Restore Overview account-label test globals exactly (#8375)
    - Skip sockets when checking assertion persistence (#8400)
    - Add offline schema fixtures for Issue #6469 (#8078)
    - Revert 14 PRs admin-merged on CI alone without required review (#8402)
    - State the filter index availability contract Windows can reach (#8440)
    - Run the attach step from a script file so Windows keeps its backslashes (#8437)
    - Review the signed-update verification modules in the update lint (#8445)
    - Give each Desktop lifecycle case the budget its child process already has (#8441)
    - Name the input that moved when the warm aggregate rebuilds (#8459)
    - Derive toolchain homes from the rustup proxy and report them on failure (#8458)
    - Refresh the Windows shard durations from batch 42694893702 (#8463)
    - Read the warm base after the stage's work and name a Windows ChangeTime move (#8462)
    - Refresh the shared shard durations from Ubuntu and macOS logs (#8465)
