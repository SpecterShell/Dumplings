  Key: ReleaseNotes
  Value: |-
    Published to npm as @bitkyc08/opencodex@2.100.4 with dist-tag latest.
    New Features
    - Skip repeated scans of fragmented frames (#8695)
    - Route video_gen to images.videoProvider (#8783)
    - Headless Windows Desktop updater (ocx update --desktop) (#8795)
    - Add machine-readable cause fields to combo_unavailable (#7965) (#8789)
    - Opt-in estimated usage when a native provider omits it (#7427) (#8793)
    - Opt-in offline wait and one resend after a pre-connect failure (#7958) (#8790)
    - Experimental per-message effort keeps the prompt cache across effort changes (#8787)
    - Config-first routed catalog row defaults (#8797)
    - Require an explicit acknowledgement before any Google Antigravity sign-in (#8820)
    - Give Luna Reserve its own setting, seeded once from authless (#8788)
    Bug Fixes
    - Keep session identity when the per-turn tk is oversized (#8568)
    - Scale the integrity check bound with index size (#8709)
    - Hop past Anthropic's extra-usage refusal (#8588)
    - Refuse route edits during an unfinished removal; scope identity-file texts; close #8694 remedy gaps (#8754)
    - Handle denied Codex boilerplate and optional history rewrites (#8590)
    - Keep exact decimals for quota rounding (#8566)
    - Retire the main account's carried monthly window when WHAM shows none (#8698)
    - Fix two Windows timing failures from the dev lane=all batch (#8767)
    - Label Claude CLI turns as opencodex (carries #7837) (#8770)
    - Issue sweep 261115 (Qoder lazy MCP, ended OAuth paste, resolve on own Tailscale IP, Windows served runtime, Windows quarantines) (#8769)
    - A refused Child disconnect rolls back, Codex-edited config.toml no longer blocks it, desktop refusals name their cause (#8530)
    - Retain the native-main login only through a rewrite (#7345) (#8766)
    - Keep a slow streaming combo selection alive (#8326) (#8763)
    - Repair the dev lane=all Windows failures (O7 paths, Messages overflow quarantine) (#8791)
    - Ignore a ChangeTime-only ledger move on Windows (pricing-cache lane=all failure) (#8799)
    - Run the served install for Windows link sync and update planning (#8359) (#8781)
    - Refuse a bare OCX_SERVICE=1 client runtime with the re-register advice (#8796)
    - Per-family rotation, sibling hop on 403/5xx, verified Vertex ADC (carries #8740, #8750) (#8778)
    - Read usage once before a stale main hard-lock refusal (#8113) (#8786)
    - The release notes state whether this release's Windows files were signed (#8780)
    - Enforce an explicit stallTimeoutSec on native Responses SSE (#8206) (#8782)
    - Every relayed Remote Link turn reads its upstream only as its client drains (#8785)
    - Finish a decided stale retirement through transient rename refusals (#8823)
    - Offline wait probes the proxy's name when a proxy carries the send (#7958) (#8831)
    - Rotate an auth-failed 403 only under Google's PERMISSION_DENIED enum (#8835)
    - Verified state follows the selected credential; probe forces a fresh exchange (#8836)
    - A combo-routed Remote Link turn reads its upstream only as its client drains (#8837)
    - Let a 429 hop's 5xx replacement take the one fault hop (#8839)
    - Keep the offline wait for OpenCodex's own xAI and Mistral fetch wrappers (#7958) (#8832)
    - Enforce the resolved destination for video submit and poll (#8838)
    - Keep the DNS error on a cancelled offline wait and label the resend (#7958) (#8833)
    - Let a verify-account hop's 5xx replacement take the one fault hop (#8846)
    - Bind the Windows signing record to the published asset's digest (#8847)
    - Bound per-message effort pending slots and keep the new-history receipt across recovery (#8845)
    - Report an explicit stall on a bridge leg as upstream_stall_timeout (#8844)
    - Report an expired deadline as operation_timeout when a stage timer fires first (#8850)
    Documentation
    - Scope unknown probes during launchd recovery (#8572)
    - Restore Spanish adapters parity after #8590 (#8765)
    - Split the API-key preset catalog into its own guide page (#8768)
    Chores
    - Wait for complete fixture readiness URLs (#8576)
    - Pin checkpoint fixture clock after scan yields (#8571)
    - Repair cross-platform fixtures and stabilize lint runtime (#8429)
    - Wait for native-main startup before comparing the storage scan (#8819)
    - Rerun an uninstall refused by a busy lock in the ownership race test (#8822)
    - Admit the package launcher's ocx update --desktop refusal in the update lint allowlist (#8824)
    - Keep the live-cancel pool fixture quota prime off the network (#8828)
    - Move routing-profile config types out of src/types/config.ts (#8830)
    - Hold the reader until the pre-fix child exits so the frame is always cut (#8840)
