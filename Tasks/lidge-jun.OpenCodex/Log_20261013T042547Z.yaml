  Key: ReleaseNotes
  Value: |-
    Published to npm as @bitkyc08/opencodex@2.84.0 with dist-tag latest.
    New Features
    - Pick, clear and auto-assign each LazyCodex role's reasoning effort (#6960)
    - Release account pins from the dashboard (#6964)
    - GPT-6.1 Sol 500k default context in Codex and Meta Muse Wonder (#7013)
    Bug Fixes
    - Release eager relay listeners after producer teardown (#6894)
    - Refuse upstream diagnostics that repeat a sent credential (#6918)
    - Preserve prompt drafts and validate base imports (#6866)
    - Bound generated late-tool attribution (#6654)
    - Recover Home-initiated links after outages and make Retry reconnect (carry #6900) (#6915)
    - Explicitly unlock the CLI record lock before closing (#6917)
    - Keep combo capabilities for targets hidden from the picker (#6919)
    - Keep coupon callers on an operation that may still be spending (#6916)
    - Restore remote hub browser pairing on loopback-bound management ingress (carry #6892) (#6913)
    - Keep loopback MCP servers off the intercept proxy with NO_PROXY (#6936) (#6938)
    - Omit empty assistant history on native Responses and keep Chat call/result pairs intact (supersedes #6931) (#6947)
    - Verify configured credentials by content, route the tray to the connected hub, and make the headerless probe test deterministic (#6949)
    - Label alias tier slots in /model; count Anthropic cache tokens as input (#6950)
    - Keep the NO_PROXY receipt across a failed removal, and doc follow-ups (#6936) (#6952)
    - Preserve shadow-call user turns, honor ZCode dataBaseDir, forward Qoder Global images (#6921, #6932, carry #6906) (#6951)
    - Harden hub disable, log filters and service startup diagnostics (#6954)
    - Admit reset Anthropic accounts and report OAuth subscription plans (supersedes #6933) (#6953)
    - Verify Child runtime relay and add fingerprint-bound CLI enrollment (#6955)
    - Preserve remote topology across guarded live saves (#6956)
    - Reject unverified picker metadata snapshots (#6965)
    - Handle Flash-Next leading-system templates (#6966)
    - Save a model-inheriting LazyCodex role's effort without pinning a model (#6975)
    - Keep same-organization users as separate accounts (#6641) (#6981)
    - Read V1 collaboration tools rendered inside code-mode exec (#6977)
    - Dashboard installer on compiled ocx and clearer Desktop Start at Login state (#6963) (#6980)
    - Keep the Codex WebSocket error wrapper's 5xx status and record the terminal frame kind (#6974)
    - Opt-in health sentinel recovers a hung but listening service proxy (#6671) (#6979)
    - Recover API-key credit-balance refusals before output (#6962)
    - Carry five contributor fixes for the 2.84.0 train (#7005 #7001 #7003 #7002 #6968) (#7008)
    - Land eight owner fixes for 2.84.0 (#7009)
    - Detect deferred V1 collaboration tools and bound the picker upload drain (#7010)
    - Recognize Desktop supervision on Windows and discover the Codex app CLI on macOS (#7011)
    Documentation
    - Restore translated LazyCodex role effort guide sections (#6970)
    - Describe effort-only role saves in the translated guides (#6976)
    Chores
    - Make the drip-feed probe and plugin lifecycle tests independent of runner load (#6914)
    - Keep the credential-shape case off a same-size rewrite (#6924)
    - Split the macOS suite into three shards under the same 20-minute cap (#6983)
    Other Changes
    - Open dev at 2.84.0 before releasing 2.83.0 (#6902)
    - 2.84.0 (#7016)
