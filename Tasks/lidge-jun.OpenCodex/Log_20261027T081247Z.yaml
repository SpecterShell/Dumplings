  Key: ReleaseNotes
  Value: |-
    Release notes
    - GPT-6.1 Terra support (Codex native, OpenAI API, OpenRouter, Copilot and other providers; not Cursor) (#7779).
    - Required tool calls are now enforced in two places, with distinct error codes: a buffered native combo child that skips a required tool_choice fails with required_tool_contract_unsatisfied (HTTP 502, eligible for the existing fallback; HTTP 400 with x-should-retry: false after a hosted effect) (#7741), and a translated Chat route fails with required_tool_not_called (#7463). Streaming native combo children are not covered yet (#7456 stays open).
    - Anthropic: routed compaction now preserves cache prefixes; 413 recovery behavior is unchanged (#7749).
    Known issue
    - On a Remote Link Child, ocx stop leaves Codex pointed at the stopped Child, so Codex requests fail until ocx start (or ocx sync --restart-codex) reapplies routing. This comes from #7564, which keeps a connected client's integrations across stop; restoring native routing on an explicit Child stop is tracked in #7736.
    Published to npm as @bitkyc08/opencodex@2.93.0 with dist-tag latest.
    New Features
    - Price and seed Kimi K3.1 Pro on Kimi Code and Moonshot (#7657)
    - Expose JEV session pin in Combo editor (#7664)
    - Use Bun native CRC32 for Kiro frame validation (#7631)
    - Avoid input Buffer copies in gzip requests (#7671)
    - Avoid repeated growing-buffer prefix extraction in SSE decoding (#7676)
    - Seed Kimi K3.1 Pro on the Moonshot API preset (#7695)
    - Bound timeline aggregation scratch memory and avoid argument overflow (#7679)
    - Validate audit UTF-8 without round-trip Buffer copies (#7672)
    - Avoid quadratic copying of fragmented frames (#7673)
    - Coalesce queued thought-signature snapshot writes (#7675)
    - Skip unchanged partial-tail reads and SQLite metadata rewrites (#7680)
    - Ocx sync --expect-link / --expect-hub-key refuses a different Home (#7694) (#7707)
    - Use native SHA-256 for tool identity digests (#7670)
    - Bound upload waiters and release completed read results (#7661)
    - Connect named Hermes profiles (#7674) (#7700)
    - Bound CONNECT header buffering and avoid repeated prefix copies (#7663)
    - Add opt-in cooldown recovery with configurable interval (#7723)
    - Expose opt-in Flex tier for eligible routed models (#7534)
    - Connect Qoder CN and WorkBuddy desktop editions (#7665)
    - Add AI Stupid Level API-key preset (#7623)
    - Add GPT-6.1 Terra alongside GPT-5.6 Terra (non-Cursor providers, catalog, pricing, docs) (#7779)
    Bug Fixes
    - Launch native Windows CLIs and refuse empty-arg-dropping dispatchers (#7527)
    - Pin zod 4.6.6 and body-parser 2.4.0 for audit:high (#7642)
    - Bump gui happy-dom to 21.0.4 (GHSA-834v-8h66-3h79) (#7644)
    - Provider-only catalog, replay-envelope refusal and isolated status (#7545)
    - List pool accounts without a native home and expose safe slot identity metadata (#7551)
    - Rotate on insufficient-credit refusals (#7558)
    - Calibrate Business Premium display capacity (#7557)
    - Check the first hard-lock profile destination (#7589)
    - Bind ownership lease release to its acquisition (#7543)
    - Cancel Remote Link sheet focus work (#7611) (#7650)
