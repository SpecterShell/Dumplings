    - Resolve ACL principal natively without cold PowerShell (#7656)
    - Preserve sync edits with canonical sandbox checks (#7659)
    - Keep a connected client's integrations across ocx stop; status names ocx sync --restart-codex (#7563) (#7564)
    - Keep a role's model when auto-assign finds an equal-priced tie (#7617)
    - Validate subagent limit boundaries before writes (#7276)
    - Isolate Anthropic reasoning state from native passthrough (#7504)
    - Complete Turkish dashboard copy and documentation (#7565)
    - Wake the PR gate when attribution-approved is applied (#7698)
    - Fail over accounts when overage quota is exhausted (#7687)
    - Detect LazyCodex installed from the marketplace (#7692)
    - Answer MODEL_NOT_IN_PLAN once as a model-scoped 400 (#7696)
    - Bind exception approval labels to the evaluated head (#7699)
    - Release detached sweep hooks and preserve replacement timers (#7678)
    - Observe Pi prompt failures before acknowledgement (#7669)
    - Bound snapshot persistence under sustained updates (#7666)
    - Inspect hard-lock fallback without selecting candidates (#7683)
    - Honor backpressure in pinned HTTP responses (#7667)
    - Select Docker smoke for actual image build inputs (#7689)
    - Preserve gateway citations during native compact (#7682)
    - Deliver partial response payloads promptly and release terminal sockets (#7662)
    - Account for Antigravity direct Chat IR (#7724)
    - Classify legacy Desktop aliases before native fallback (#7721)
    - Use Bun timeout flag in temporary-file diagnostics (#7715)
    - Declare Hermes profile discovery route (#7729)
    - Preserve disabled sidecars when targets retire (#7420)
    - Preserve destinations when refreshing saved model rosters (#7735)
    - Use Bun glob matching for native grep (#7630)
    - Notice a Codex WebSocket that dies after the response started (#7725)
    - Clamp native efforts to selected model ladder (#7731)
    - Preserve literal SSH include names on Bun 1.4.4 (#7629)
    - Enforce the Bun patch floor in automatic PATH fallback (#7734)
    - Bound closing handshakes for non-reused upstream WebSockets (carry #7681) (#7743)
    - Bind usage trials to fresh package proof (#7709)
    - Fail unmet required client tool completions (#7463)
    - Verify installer signature before administrative extraction (#7421)
    - Preserve Windows probe support across Node and Bun (#7722)
    - Bind and serialize queue lock ownership (#7508)
    - Retain Kiro prompt estimates in hosted tool paths (carry #7620) (#7744)
    - Support Vercel JEV decisions and thinking model reasoning replay (#7574)
    - Join the Windows npm tree before stage cleanup (#7751)
    - Restore official V4 Pro availability (#7591)
    - Bound WebSocket close without releasing live ownership (#7635)
    - Send local stop requests directly to the loopback runtime (#7754)
    - Preserve cache prefixes during routed compaction (#7307) (#7749)
    - Move to GA MiniMax-M3.1-Flash and rename the retired preview id (#7746)
    - Reject buffered required-tool false successes (#7741)
    - Keep Codex routing for the restarted proxy during an update (#7423) (#7747)
    - Renew credit evidence for namespace-bound Direct accounts (#7621)
    - Separate support, thinking toggles and effort controls (#7531)
    - Fence uncertain catalog entry identity (#7610)
    - Keep sideband admission until the upstream closes after client cancellation (#7767)
    - Preserve credit recovery retry hints and scoped cooldowns (#7622)
    - Drain parent ACL flights before intercept secret writes (#7777)
    - Skip optional hardening for non-directory homes (#7688)
    Documentation
    - Qualify Qoder native executable precedence across PATH folders (#7615)
    - Translate Mistral and OpenGateway provider behavior across locales (#7646)
    - Align Korean installation guide with Bun 1.4.4 pin (#7616)
    - Correct ADR-7517 contract owner (#7686)
    Chores
    - Settle Windows ACL work and owner locks before fixture removal (#7528)
    - Make codex-runtime, client-connect and loopback-listener tests deterministic (#7552)
    - Keep cold first-exec and PowerShell start out of two timed cases (#7598)
    - Run docker/keyring smoke and React Doctor on PRs only when their inputs change (#7658)
    - Isolate agent-task-recovery fixtures (#7613) (#7649)
    - Align Bun runner with the 1.4.4 security baseline (#7627)
    - Isolate port reclaim fixture identity and clock (#7706)
    - Copy launcher module dependencies into activation fixtures (#7733)
    - Let the forged sibling-env start bind its own port (#7740)
    - Run import-graph tests on pull requests and verify merged batches on dev (#7782)
    Other Changes
    - Open dev at 2.93.0 before releasing 2.92.0 (#7633)
    - Promote frozen tip 2606f6f922 to main as 2.93.0 (#7805)
