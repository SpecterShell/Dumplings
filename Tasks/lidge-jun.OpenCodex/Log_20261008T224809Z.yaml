Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Published to npm as @bitkyc08/opencodex@2.81.0 with dist-tag latest.
    New Features
    - Allow an explicit restart drain grace (carry #6703) (#6724)
    - Add local Codex queued session messaging (#6544)
    - Bridge Codex-owned tools through MCP (#6289)
    - Allow arbitrary HTTPS decision endpoints (carry #6384) (#6731)
    - Add native Command Code integration and catalog sync (carry #3833) (#6728)
    - Add Claude Haiku 5.5 pricing, catalog rows and request contract (#6744)
    - Add anthropic2, an independent Anthropic account pool with a green Pool 2 mark (#6743)
    Bug Fixes
    - Bump @modelcontextprotocol/sdk to 1.31.0 for GHSA-6qxp-vccf-f47h (#6709)
    - Keep line breaks in logs explain text output (#6704)
    - Demote developer to user for OrcaSAQ-2 leading-system template (#6711)
    - Avoid Windows executable lookup in lease diagnostics (carry #6655) (#6715)
    - Renew opted-in main credits before expiry (#6692) (#6669)
    - Rotate web-search validation refusals (#6710)
    - Stop re-attaching the token footer as a user turn (#6714)
    - Surface a dead refresh token as needing re-auth (#6716)
    - Preserve reported thinking token usage (#6721)
    - Serve the desktop bundle's dashboard from an ocx the app did not start (#6722)
    - Stop refreshing pool accounts whose refresh grant is already revoked (#6707)
    - Close refused picker uploads and keep early replies intact (#6725)
    - Require independent sessions and expire revealed API keys (carry #6672) (#6729)
    - Ship Bun 1.4.2 and keep the CI test runner on 1.4.0 (#6713)
    - Relay undeclared passthrough tool calls on chat and anthropic inbound (#6732)
    - Keep Codex's auto-review model so reviews stop falling back to the task model (#6727)
    - Drain config-dir ACL hardening before removing picker-startup roots (#6748)
    - Bind restore requests to the selected client (#6755)
    - Preserve v1 pool history with bounded physical-send accounting (#6763)
    Documentation
    - Docs-site: mobile homepage polish, persistent GitHub link and star count (#6753)
    - Align provider copy and clean contract fixtures (#6756)
    - Close the anthropic2 account-pool unit (#6768)
    Chores
    - Count the web-search sidecar rotation site (#6717)
    - Compact layout.json back under the line ratchet (#6733)
    Other Changes
    - Open dev at 2.81.0 before releasing 2.80.0 (#6705)
    - 2.81.0 (#6771)
