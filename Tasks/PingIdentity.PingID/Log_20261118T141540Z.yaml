  Key: ReleaseNotes
  Value: |-
    Updates and enhancements to the PingID desktop app (legacy).
    - Java runtime and trust store
      We’ve updated the Java runtime and trust store bundled with PingID desktop app (legacy) to address CVE-2026-91403, CVE-2026-114820, and CVE-2026-61308. This includes distrusting eMudhra-operated emSign intermediate CA certificates and removing the related root CA certificates.
    - Security enhancements
      We’ve made some security enhancements.
ReleaseTime: 2026-11-18
