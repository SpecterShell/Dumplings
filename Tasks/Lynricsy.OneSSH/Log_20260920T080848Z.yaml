  Key: ReleaseNotes
  Value: |-
    新增
    - 支持令牌级 MCP 工具组禁用列表：手动创建、编辑令牌及 OAuth 授权时，可按与 ONESSH_DISABLED_TOOLS 相同的工具组限制客户端。
    - 有效禁用范围为进程级与令牌级的并集。受限工具不出现在 tools/list，直接调用会被拒绝并记录审计；对应 MCP Apps 卡片资源及服务器说明同步过滤，无需重启进程。
    - Web 令牌页新增编辑入口。新增 GET /api/v1/tool-groups 与 PUT /api/v1/tokens/{id}；后者全量替换名称和权限，不是部分更新。
    - OAuth 授权、令牌交换和刷新保留工具组限制；编辑当前 OAuth 访问令牌会同步尚未使用、未撤销的刷新令牌权限。
    安全与升级说明
    - 禁用列表解析异常时拒绝放行，避免意外扩大 MCP 权限。
    - 启动时自动执行 SQLite 迁移 13，为令牌、授权码和刷新令牌增加禁用组字段；已有记录默认不额外禁用。升级前建议备份数据目录。
    - 限制仅作用于 MCP，WebUI / REST 管理面不受影响。工具组限制不是主机操作沙箱：exec、fanout、jobs 仍可能提供独立的命令执行入口，应同时遵循远程账号最小权限原则。
