- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    This patch release focuses on the editor, macOS run workflows, and Diff performance while fixing several interaction and formatting issues.
    Highlights
    Changes are grouped below.
    ✨ New features
    - The editor adds middle-click tab closing and common line-level editing actions, while Windows restores the viewport when switching tabs.
    - The project tree can reveal the active file; the macOS Services window adds three-column grouping, batch selection, and batch starts.
    - The macOS run panel adds Maven module, lifecycle, and test actions and remembers project-level LSP toggles.
    ⚡ Improvements
    - Improved responsiveness when switching macOS sidebar features and horizontally scrolling split Diff views.
    - The Commit panel now supports Cmd multi-selection and Shift range selection, with clearer staging, discarding, input, and layout interactions.
    - The macOS main editor adds a soft-wrap toggle so long lines can wrap on demand or remain horizontally scrollable.
    - Refined large-file editing.
    🛠 Fixes
    - Fixed caret placement on empty lines and Markdown soft paragraph breaks.
    - Reduced redundant redraws during horizontal scrolling in macOS split Diff views, improving long-text scrolling.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    本次小版本聚焦编辑器、macOS 运行与 Diff 体验，并修复多处交互和排版问题。
    重点更新
    本次更新内容如下。
    ✨ 新功能
    - 编辑器支持中键关闭标签、常用行级编辑操作，并在 Windows 切换标签后恢复滚动位置。
    - 项目树支持定位当前打开的文件；macOS Services 窗口支持三栏分组、批量选择和批量启动。
    - macOS 运行面板补充 Maven 模块、生命周期和测试操作，并记忆项目级 LSP 开关状态。
    ⚡ 改进
    - 优化 macOS 左侧功能切换和双栏 Diff 横向滚动时的界面响应。
    - Commit 面板支持 Cmd 多选和 Shift 范围选择，并优化暂存、丢弃、输入和布局交互。
    - macOS 主编辑器新增软换行开关，长行可按需换行或保持横向滚动。
    - 改进大型文件编辑体验。
    🛠 修复
    - 修复空行中的光标定位和 Markdown 软段落换行问题。
    - 修复 macOS 双栏 Diff 横向滚动时不必要的重复重绘，降低长文本滚动卡顿。
