  Value: |-
    Dcode 0.2.1 · Windows 测试版
    首个公开下载的 Dcode Windows x64 安装包。这是未签名的测试构建；Windows 可能显示“未知发布者”或 SmartScreen 提示。请核对下方 SHA-256，并在自己可控的环境中试用。
    本版内容
    - GitHub 私有云备份：通过浏览器登录账号，为本地 Git 项目预览文件后开启备份；已保存到磁盘的暂存、未暂存和未跟踪修改会进入独立快照。支持应用运行期间的定时检查、手动备份、查看差异和恢复到新目录。备份目标必须是用户自己名下的私有 Dcode 备份仓库，不改变原项目提交记录。使用范围与步骤
    - ZCode 工作区 × DeepSeek Harness：DSH 驱动模型、会话、消息流、工具与权限；Dcode 将任务列表、聊天、文件、终端和 Git/Diff 接到同一桌面工作区。支持多会话、项目切换、停止与继续、重启后恢复。融合边界
    - Dcode 界面与图标：重新设计新任务页、输入区和可展开的工具执行记录，精简本地设置导航，并使用新的 Dcode 图标与品牌。
    验证范围与已知限制
    打包后的桌面程序通过本地合成模型夹具端到端测试，覆盖模型设置、会话和项目隔离、重启恢复、停止继续、工具输出、文件编辑、Diff、终端、云备份设置及品牌入口。DSH 测试 11 项、云备份测试 6 项、类型检查通过；Lint 为 0 错误、76 条既有警告。安装包载荷完整，抽取的程序、ASAR 和 DSH runtime 文件与验收用打包程序一致。
    尚未通过安装程序实际安装验收，也未用真实模型账号或真实 GitHub 账号完成在线上传验收。云备份目前仅支持 Windows 桌面端和 Git for Windows / Git Credential Manager；只备份已保存的文件，不包含未保存缓冲区、原 Git 历史、LFS 内容和子模块，退出应用后不继续定时运行。旧 ZCode 的 MCP、技能、记忆和子智能体等设置尚未逐项贯通 DSH。
