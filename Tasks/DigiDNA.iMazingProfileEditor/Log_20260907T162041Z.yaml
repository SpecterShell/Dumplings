- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Improvements in 2.2.0
    - Payload copy-paste is now available between profile windows as well as to and from text editors
    - When pasting-in from a text editor, an attempt is made to auto-detect the payload type
    - Payload drag and drop is now available between profile windows as well as to and from Windows File Explorer windows
    - When dragging-in from Windows File Explorer the Payload type is taken from the file content when available and from the file name otherwise
    - Payload drag and drop as well as copy-paste features support both plist and JSON. Drag-out to Windows File Explorer is plist only
    - Payload import and export operations now too support JSON alongside previous support for plist
    - The profile signing field now labels expired identities and displays serial numbers when common names are not unique
