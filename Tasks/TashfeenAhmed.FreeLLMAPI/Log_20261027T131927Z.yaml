  Value: |-
    Provider and modality support
    - KiosAPI: five verified daily-free chat routes, exact upstream alias validation, and bounded reasoning-aware streaming failover.
    - Plugsky: FLUX Schnell and FLUX Dev image support. The provider ID dall-e-3 is a FLUX Dev compatibility alias, not OpenAI DALL-E.
    - BlockRun: GPT-6 Luna typed decisions (predicate, choice and score), separate from paid chat access.
    Model entries are delivered by the signed catalog, not bundled into the app. Premium users receive the new catalog immediately; the existing 30-day Free delay is unchanged. Provider allowances remain shared and subject to their terms.
    Update to this app version to use the new provider and modality adapters.
    PR: #1723
    Tests: full server, CLI, client and locale suites passed; CI passed on Node 20/22/24 and all desktop/Docker build targets.
