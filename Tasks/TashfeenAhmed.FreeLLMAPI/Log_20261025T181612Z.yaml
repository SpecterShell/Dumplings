  Key: ReleaseNotes
  Value: |-
    Provider and media support
    - Kenari: named free chat and image routes, credential validation, exact-model identity checks, and empty-response protection. Free routes use a shared renewable daily account allowance; the adapter never retries a paid alias.
    - Mistral: Voxtral transcription through the existing audio-transcriptions endpoint, including multipart uploads and normalized responses.
    - Includes the onomeo response-model identity guard merged since v0.16.9.
    The separately signed catalog update adds 25 model routes, re-enables two, and disables one unsupported route (net +26 enabled). Model rows are not seeded by this release. Premium catalog access remains immediate; Free access remains subject to the existing 30-day gate. NVIDIA developer endpoints retain their development/testing-only caveat.
    Update the app to use the new adapters. Desktop installers and stable Docker images are built from this release tag.
    Existing local disabled-model preferences remain respected; re-enabled catalog routes can be enabled manually on installations where they are still disabled.
    What's Changed
    - fix(search): a lone-surrogate entity in a hit title corrupted every result by @tashdroid in https://github.com/tashfeenahmed/freellmapi/pull/1689
    - fix(search): stop Brave decorating every hit with tags by @tashdroid in https://github.com/tashfeenahmed/freellmapi/pull/1687
    - fix(keys): key labels can inject lines into the .env export by @tashdroid in https://github.com/tashfeenahmed/freellmapi/pull/1686
    - fix(routes): sort-preset whitelist rejects inherited Object members (500 on /sort/constructor) by @tashdroid in https://github.com/tashfeenahmed/freellmapi/pull/1685
    - fix(db): legacy baseline re-run no longer crashes on a model-id collision (#1603) by @tashdroid in https://github.com/tashfeenahmed/freellmapi/pull/1683
    - fix(anthropic,gemini): client-profile keys authenticate /v1/messages and /v1beta by @tashdroid in https://github.com/tashfeenahmed/freellmapi/pull/1682
    - fix(router): rerank and moderation honour the per-key model scope by @tashdroid in https://github.com/tashfeenahmed/freellmapi/pull/1677
    - fix(backups): bound the automatic dump pile (#1675) by @tashdroid in https://github.com/tashfeenahmed/freellmapi/pull/1679
    - fix(responses): end a truncated turn as incomplete, not completed by @jayhemnani9910 in https://github.com/tashfeenahmed/freellmapi/pull/1624
    - fix(providers): give each streamed Gemini and Sail tool call its own index by @jayhemnani9910 in https://github.com/tashfeenahmed/freellmapi/pull/1623
    - Fix/cloudflare account daily quota by @The88788 in https://github.com/tashfeenahmed/freellmapi/pull/1622
    - docs(readme): credit jayhemnani9910 by @tashfeenahmed in https://github.com/tashfeenahmed/freellmapi/pull/1691
    - fix(onomeo): reject substituted model identities by @tashfeenahmed in https://github.com/tashfeenahmed/freellmapi/pull/1694
    - feat: Kenari free routes and Mistral transcription by @tashfeenahmed in https://github.com/tashfeenahmed/freellmapi/pull/1703
    New Contributors
    - @jayhemnani9910 made their first contribution in https://github.com/tashfeenahmed/freellmapi/pull/1624
