  Value: |-
    Desktop agents
    Open Agents on macOS or Windows to see all 21 supported agents in one scrollable list. Search by name to narrow the list, and clear the search to see everyone again.
    Choose Connect to FreeLLMAPI next to Claude Code, Cline, OpenCode, or another agent to set up its gateway connection. The app saves supported configurations and guides you through tools that require a manual step.
    This update also fixes how the desktop app handles audio buffers for transcription uploads.
