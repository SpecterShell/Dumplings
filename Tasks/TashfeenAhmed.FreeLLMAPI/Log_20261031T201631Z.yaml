- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    New provider: nabh.cloud
    - Adds built-in nabh.cloud support for normal and streaming chat completions, with API-key setup in the dashboard and environment-file imports.
    - Uses a read-only authenticated model-list request for key health checks, without consuming inference credits.
    - Shares account-level quota across routes, preserves upstream errors for normal fallback, and rejects mismatched response model identities.
    GPT OSS 20B is the tested Free-plan route. Model availability is delivered through the signed live catalog, not bundled model seeds. Premium users receive catalog additions immediately; Free users retain the existing 30-day delay.
    Upgrade
    Install the desktop package for your platform below, or pull ghcr.io/tashfeenahmed/freellmapi:v0.16.15 (also published as latest) for stable Docker. Bring your own nabh.cloud API key.
    Validation
    The adapter passed live normal and streaming tests. Node 20/22/24 CI, both Docker architecture checks, all four desktop packaging checks and macOS updater-metadata validation passed before the release tag. Tagged macOS builds additionally run signing, notarization and packaged-backend smoke checks before publication.
