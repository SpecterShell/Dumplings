  Key: ReleaseNotes
  Value: |-
    This release fixes clients that send chat requests to the bare base URL, such as Tencent WorkBuddy.
    - Proxy: a POST to /v1 or /v1/ is now handled as a chat completion. Before, it returned the dashboard page with HTTP 200, so clients that use the URL exactly as typed failed with no clear error. Unknown /v1 paths now return a JSON 404 that names the right URL. (#2157)
    - Docs: Tencent WorkBuddy setup in the agent clients guide.
