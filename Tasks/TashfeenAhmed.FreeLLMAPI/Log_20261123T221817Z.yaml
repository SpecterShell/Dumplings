- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    New providers:
    - LLM.kiwi: free plan with no card, auto router, 20 requests a minute.
    - TokenReply: a relay with free models, including Nemotron 3.5, GLM 5.3 Flash and Step 5 Preview.
    - TinyFish: free web and news search, 30 searches a minute and 500 an hour.
    Add a key on the Keys page (or the search settings for TinyFish). The models become available when your signed catalog includes them. Existing Premium and Free catalog timing is unchanged.
    Fixes:
    - Ollama-compatible clients (Open WebUI, Page Assist) no longer get answers cut at 1,024 tokens or at 1 token for num_predict -1 (#1934).
    - Empty-wallet errors sent as 429 or 403, including in Chinese, now count as out of credits (#1942).
    - The model Test button allows 256 tokens and accepts reasoning-only replies (#1941).
    - Relay "free quota used up" notices fail over instead of being returned as the answer; more output-cap messages are learned (#1959).
    - Dashboard API responses are gzipped, and routing settings are read once per second instead of on every attempt (#1962, #1961).
