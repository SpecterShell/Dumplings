- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    This release adds Roboflow CLIP text embeddings, BlazeAPI image generation, and the dated Qwen 3.7 Max route on Puter.
    - Roboflow: use your own API key with nine CLIP checkpoints. The adapter checks the resolved checkpoint and native vector dimensions before returning embeddings.
    - BlazeAPI: six named free image routes return validated inline images. No paid alias or external image URL fallback.
    - Puter: qwen3.7-max-2026-05-17 is pinned to its dated provider ID.
    The signed model catalog is distributed separately. Premium receives new catalog entries immediately; Free receives eligible entries after the existing 30-day window. Pull request: #2144.
