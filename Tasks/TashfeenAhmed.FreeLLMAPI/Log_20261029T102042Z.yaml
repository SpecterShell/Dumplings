  Key: ReleaseNotes
  Value: |-
    Decision APIs and typed extraction
    - Add keyless HAL-X and AI SENSE decision providers. Activate them on the Keys page without entering a key.
    - Add Cloudflare Clairic text/number extraction via fields on /v1/decisions; keep extraction out of choice-based decision routing.
    - Preserve cancellation, provider cooldowns, model identity checks and typed answer validation.
    - Includes main's recent search-readiness fix.
    The independently published catalog adds 34 routes and disables 33 ineligible routes: net +1 enabled model. Two Inferbase IDs are corrected without affecting the count. Provider allowances are shared; AI SENSE TEV1 can temporarily return 503.
    Premium receives the live catalog immediately. Free access continues to use the unchanged 30-day per-model delay. Existing installs need this application update for the new decision/extraction support.
