  Key: ReleaseNotes
  Value: |-
    新功能
    - 分支会话：侧边栏会话菜单新增「分支」入口，无需打开会话即可将整个会话复制为新分支。
    - 运行摘要栏：新增会话运行摘要栏，展示持久化的累计 token 与时长统计。
    - 全局免审批工具：支持配置全局无审批工具，并与项目级授权合并生效。
    - 编辑自动格式化：文件编辑后可选自动以 Prettier 格式化，可在设置中开关。
    改进
    - 无操作编辑检测：检测内容无实际变化的编辑请求，跳过无意义的写入。
    - 模型选择器键盘导航：模型选择器支持键盘操作导航。
    - 压缩恢复保留任务消息：上下文压缩恢复后，用户任务消息得以保留。
    修复
    - 并发锁误报：分支会话事务改用 BEGIN IMMEDIATE，修复并发写入时 SQLITE_BUSY_SNAPSHOT 被误报为数据库锁定的问题。
