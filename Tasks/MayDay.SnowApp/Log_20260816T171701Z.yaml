  Key: ReleaseNotes
  Value: |-
    新功能
    - Git 克隆仓库：新增克隆对话框（URL / 保存位置 / 目标路径预览 / 实时进度），由 Rust 异步子进程执行 git clone，完成后自动注册为工作区目录。
    - 会话暂停状态：侧边栏中被用户暂停的流式会话显示暂停图标与警告色。
    改进
    - 视觉请求失败时复用主请求的重试配置（指数退避）；截断且无内容时加倍 max_tokens 重试。
    - 提交草稿与 AI 生成状态提升到模块级，按仓库路径隔离，切换或折叠后回显。
    - 检查点并发重构：bash 执行期间不再持有执行级锁，跨会话命令并行执行，回滚不被长命令阻塞；新增回滚纪元，检测到回滚覆盖工作树时跳过变更记录，避免跨会话误记。外部 MCP 工具仍使用整树独占锁。
