- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新功能
    - 备忘多选批量删除：备忘面板新增多选模式，支持全选已加载 / 取消全选与已选计数，确认后一次性删除所选备忘。
    - Responses Fast Mode 三态：Fast Mode 由开关改为三档——关闭不发 service_tier，Fast 发 priority，UltraFast 发 ultrafast；API 设置与聊天输入区选择器均可切换。
    - 系统日志自动清理：系统日志自动清理（启动时执行一次，之后每 6 小时复查），保留期可选近 7 / 30 / 90 天或不清理（默认近 7 天），并提示本次删除了多少条过期日志。
    改进
    - 文件阅读器全链路性能重构：文内搜索按行索引二分定位（提速 545 倍），代码折叠按区间二分（O(log K)），列宽估算改为跨步采样（提速 8.1 倍），超过 10,000 字符的单行截断并加徽标，搜索高亮改用 requestAnimationFrame 异步调度，语法高亮缓存扩容至 128 并加入 LRU 热度刷新。
    - Rust 原生文本读取改为零拷贝比对，并对原始文本读取增加 64 MiB 熔断。
    - 只读调用保护升级为状态感知：重复调用时探测文件指纹与 Git 脏状态 / 提交变化，放行合法重读；可变工具识别扩展到终端、子代理与 LSP 重命名；重复恢复轮补兜底提示，避免流被截断。
    - 工具错误文案本地化：23 个工具卡片共 30 处错误渲染点统一按语言展示，工具结果中的协议与审计字段仍保留原文。
    - 紧凑主题补齐原生表单对话框体系样式（卡片、页头、页脚、拖放区、输入框、按钮），统一只读输入框与禁用态；表单对话框初始焦点改落在选择按钮，而非只读路径输入框。
    - 插件消息 Footer 渲染资格判定精准化，普通 Footer 与任务历史 Footer 互斥隔离。
    修复
    - 修复文件阅读器编辑模式下搜索定位与滚动容器错误：编辑器 textarea 自身不滚动，改由外层容器承担滚动。
    - 修复 MCP 设置 JSON 模式保存需点击两次（闭包读到旧草稿）；解析与保存错误接入国际化，且不再被弹窗遮罩遮挡。
    - 修复文件变更追踪内存峰值：Git 输出与文件内容改为分块读取并做分配检查，分配失败时降级为覆盖率缺口，而不是中断整个应用。
