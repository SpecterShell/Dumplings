  Value: |-
    新功能
    - WorkTree 模式：新增隔离 Git 工作流模式——提示词引导基于分支/worktree 的变更，与计划/目标模式互斥，子代理与模式提示词隔离。
    - 站点屏蔽：正则屏蔽规则（blockedPatterns）过滤搜索结果，爬取时直接拒绝命中站点并向 AI 返回屏蔽详情；全局规则也通过 app-control 工具与代理设置暴露。
    - 来源徽标：带摘要的 Markdown 链接渲染为站点徽标——悬停显示摘要，点击在应用浏览器中打开来源。
    - 定时任务提及：定时任务提示词现支持文件与图片提及。
    改进
    - 窗口变窄时自动折叠侧边栏。
    - 宠物设置整合为单一 JSON 存储。
    - 文件工具可与检查点预览并行执行。
    修复
    - 修复检查点预览与子代理变更归属。
