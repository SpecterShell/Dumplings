  Key: ReleaseNotes
  Value: |-
    新功能
    - API 配置批量导入导出：可批量导入导出 API 配置，列表支持拖拽排序。
    - 会话导入：支持导入会话 JSON 文件，可批量导入到指定项目。
    - 记忆面板与检索：新增 /memory 会话记忆面板，记忆库支持关键词搜索。
    - Win95 主题：新增 Win95 主题预设，cream / google 主题同步补全。
    - 消息与备忘编辑：用户消息可一键写回输入框继续编辑；备忘编辑器支持 @ 引用。
    - 用量统计筛选：用量统计支持按 API 配置筛选。
    - 会话统计与手机端：新增平均首字延迟（TTFT）统计；手机端新增 token 粘贴按钮。
    - Git 面板：变更文件支持树形视图与关键词复制按钮；push/pull 增加二次确认浮层与开关。
    - 其他：设置新增「清理应用缓存」；宠物窗口右键菜单支持关闭宠物；Bash 停止按钮二次确认。
    改进
    - 空 AI 回复自动重试。
    - 摘要生成改为非流式请求。
    - 侧边栏会话与项目区重构为独立组件与 hook。
    - 命令触发符常驻可见，执行命令时保留已输入内容。
    - 项目列表本地文件夹图标沿用资源管理器配色并补充悬停态。
    - 思考块长内容提供底部折叠入口。
    修复
    - 修复消息不足一屏时无法加载更早记录续页的死锁。
    - 修复消息分页的滚动竞态。
    - 修复切换条目时滚动位置被重置。
    - 修复 Win95 主题关闭按钮悬停颜色。
