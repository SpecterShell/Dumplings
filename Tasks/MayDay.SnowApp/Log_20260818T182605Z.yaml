  Key: ReleaseNotes
  Value: |-
    新功能
    - 会话上下文拖放：将侧边栏会话拖入聊天输入框即可作为引用 chip；悬浮 chip 可预览发送时实际注入的上下文（已清理思考与工具细节，并按预算裁剪）。
    - 绘图工作台：右侧面板新增绘图标签页，支持直接生成图片——提示词编辑器带示例、模型能力联动参数（尺寸/格式/思考级别）、参考图、流式预览与历史图库灯箱。
    - LSP 设置面板：新增图形化 LSP 服务配置管理面板。
    改进
    - MCP 工具结果限额：工具结果按模型上下文百分比封顶（toolResultTokenLimit，默认 30%），超限截断并附引导信息；图片类结果不受限。可在 API 设置中调整。
    - API 配置 JSON 写入时规范化，并附带迁移以合并分歧配置。
    修复
    - 修复原生桥接中 responsesFastMode 为 null 时的 BooleanExpected 错误。
    - 恢复聊天输入框的拖放处理与初始布局。
