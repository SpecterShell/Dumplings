  Value: |-
    新功能
    - 会话拖放置顶：会话可在置顶区域与普通列表之间拖拽切换置顶状态，拖拽悬停时高亮提示可放置。
    - CodeLens 远程 SSH 支持：find_definition / find_references / file_outline 现支持 ssh:// 远程工作区——通过 SSH 读取源文件后在 Rust 阻塞池执行分析。
    改进
    - filesystem / grep / codelens 工具的相对路径统一解析到项目根目录；grep 未指定 path 时默认搜索项目根。
    - 回滚条目新增文件类型图标。
    - 移除文件查看器的草稿状态指示，清理符号索引与样式死代码。
    修复
    - grep 搜索路径不再静默失败：路径不存在或非文件/目录时返回明确错误。
