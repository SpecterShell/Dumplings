  Key: ReleaseNotes
  Value: |-
    新功能
    - WorkFlow 模式：新增可视化多节点工作流编排模式——AI 通过 workflow-generate 工具将需求分解为可执行的无环工作流图，以 React Flow 交互式渲染，支持逐节点编辑 API 配置/模型/提示词后再确认执行；每个节点在自己的会话中运行并接收上一节点的交接文档。节点会话全链路打通：归档/恢复/删除、侧边栏节点树（主会话 → 节点 → 子代理）与画布连线编辑，并与回滚、中止、会话删除等现有系统集成。
    - 模型品牌图标：模型下拉框显示模型品牌图标。
    - 用量统计图表：用量设置新增每日趋势折线图、模型占比环形图与成功率卡片，用量记录支持折叠。
    改进
    - 缩进敏感编辑增强：缩进敏感文件的模糊编辑支持自动补齐对齐与更宽松的匹配。
    - Plus 菜单重构：改为紧凑的内联布局。
    - 工具卡片优化：ToolCallNode 懒加载正文渲染，目录重排时显示精确的拖放指示。
    - 子代理思考强度不再继承父会话的单次发送覆盖，始终遵循解析后的 API 配置。
    修复
    - 修复单击已有选区时引用弹窗重复弹出。
