  Key: ReleaseNotes
  Value: |-
    新功能
    - 插件按需发现工具：插件工具按需加载，请求级授权更完整，并附工程化示例。
    - 通知提示音：新增通知提示音及相关设置。
    - 消息操作与回退：增强消息操作，完善回退（rollback）功能。
    - 手机远控 HTTP 服务：远控 HTTP 服务新增实现，统一请求限制与响应处理。
    - 图像生成、浏览器与 Git 完善：补充各面板交互能力，统一工具命名。
    改进
    - 敏感操作确认分类：确认弹窗按拦截类型区分；脚本命中片段作为证据提交给决策模型，判定时复用前置检查结果。
    - 输入统一：加入输入法守护，统一发送判定。
    - 界面统一：分段切换器统一，优化提示词交互；主题设置表单取消宽度上限。
    修复
    - 终端焦点恢复，菜单随键盘操作收起。
    - 远程文件标签复用工作区的 SSH 连接配置。
    - 启动时即应用缓存字体。
    - 翻译任务只输出译文。
