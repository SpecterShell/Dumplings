  Key: ReleaseNotes
  Value: |-
    新功能
    - 会话文件变更追踪：在工具执行边界采集本会话真实改动的文件——专用文件工具记录实际物理路径，终端用内容指纹比对前后变化（含已修改文件的再次编辑与命令非零退出）；文件变更面板标注采集来源、覆盖程度、根目录与缺口原因，并以 v1 契约（fileChangeTrackingVersion / fileChangeCoverage）向插件开放。
    - 插件消息末尾插槽：插件可在回复正文与操作按钮之间挂载自定义卡片（contributions.messageFooters，仅 ESM，配套生命周期绑定的只读 API 与自动清理），会话文件统计等展示改由插件贡献。
    - 插件一键提示词优化：新增宿主侧提示词优化通道（Rust 流式优化、独立取消，不影响普通聊天，遵循显式指定的模型服务与档案），插件可在输入工具栏一键优化草稿、安全回填、一键还原，全程不发送消息。
    - 更新日志：设置页新增「更新日志」标签页，按版本浏览发行说明并支持简体 / 繁体 / 英文切换；新增繁体中文发行说明，更新弹窗同步支持。
    - 流式重试与错误卡片：流式重试时展示重试次数与错误详情（可展开、复制），请求失败改为结构化错误提示卡片。
    改进
    - 浏览器元素拾取附带 DOM 层级树（祖先链与直接子元素摘要），便于 AI 理解元素在页面结构中的位置。
    - 已安装插件与脚本列表内联提示可更新版本，一键完成更新，无需进入市场页。
    - 插件市场索引改为按最新 commit SHA 内容寻址拉取，绕开分支引用的 CDN 长缓存。
    - 右侧面板标签页右键菜单列出已启用插件声明的面板入口。
