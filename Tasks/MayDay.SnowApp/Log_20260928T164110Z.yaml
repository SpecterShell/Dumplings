  Value: |-
    新功能
    - 排版与界面缩放：主题设置新增排版项（界面字号、字重、聊天字号 / 行高、代码字号），界面字号按整页缩放实现，并新增 mod+= / mod+- / mod+0 放大 / 缩小 / 重置快捷键。
    - 项目网格视图与切换定位：侧栏项目区新增网格视图（搜索、按分组浏览）；切换项目自动定位该项目正在运行的会话，没有则新建。
    - 脚本数据能力与无 CORS 请求：客户端脚本支持 @snow-privacy 声明，经 snow.metadata / snow.write 复用面板插件的元数据与写能力；新增 snow.fetch（主进程发出、绕过 CORS），沙箱脚本的全局 fetch 即为该实现。
    - 语言服务器符号寻址与运行时控制：LSP 工具可直接按符号名寻址（悬停 / 定义 / 引用 / 重命名 / 调用与类型层级无需文件坐标，省略路径时按工作区解析并返回歧义候选）；LSP 设置面板新增各服务器状态与启动 / 停止 / 重启操作。
    - Mac Platinum 主题：新增 macOS 风格主题预设（含明暗配色）。
    改进
    - Git 面板重构：提交图常驻、只遍历当前分支并标记未推送提交，diff 改为新标签页打开。
    - 设置页标题与操作区统一迁移到顶栏。
    - LSP 语义工具强化：工具清单按最终工具快照（权限 / 工作区 / 服务器能力 / 健康状态）生成；批量诊断支持 1–30 个文件（去重、并发 3、逐文件结果与汇总）；重命名须先预览并携带一次性 previewId；不再使用持久化诊断缓存，结果卡片显示完整 / 部分 / 失败统计与截断提示。
    - AI 生成提交信息改用 Conventional Commits 规范，并自动剥离代码围栏。
    - 启动提速：存储就绪门控提前释放，窗口与工作区 / Git IPC 不再等待。
    - 插件与脚本的新建入口统一为同一 AI 生成输入框。
    修复
    - 修复 Git 分支解析：本地分支名含 / 时不再被误判为远程分支，远端符号引用 refs/remotes/*/HEAD 不再显示。
    - 修正折叠侧栏时 macOS 窗口红绿灯的对齐偏移。
