  Value: |-
    新功能
    - 资源管理器可停靠右侧面板：资源管理器可在左侧栏与右侧面板标签页之间切换（管理器工具栏内一键切换；右侧面板模式下顶栏 + 菜单提供入口），位置偏好持久化，切换时保持当前浏览的目录。
    - 文件提及按工作目录定位：输入 @:工作目录/ 先选择工作目录、再在目录内搜索文件；关联项目组的成员目录均可选，当前目录带「当前」标记，来自兄弟项目的结果带项目名徽标。
    - 会话缓存保活时长可配置：通用设置新增「会话」分区，会话消息缓存 TTL 可调（默认 60 分钟，范围 1-10080 分钟）；配合定时清扫，超时未查看的会话自动从内存释放，正在查看或运行中的会话不受影响。
    - Snow Bot 流式光标：流式指示器新增「Snow Bot」动态流光样式。
    - 关于页 GitHub 仓库入口。
    改进
    - 终端默认字体栈内置 Nerd Font（Maple Mono、JetBrainsMono、MesloLGS 等），Oh My Posh / starship 提示符图开箱即渲染；终端设置新增字体预设下拉（#178）。
    - Git 分支列表改用 git for-each-ref：12 个工作树的仓库实测 1129ms → 112ms（#177）。
    - 插件市场强制刷新前先清理 jsDelivr 镜像缓存，刷新不再受 CDN 旧副本影响。
    - 内置浏览器 MCP 服务器改为默认关闭、按项目显式启用，浏览器工具不再默认注入模型上下文。
    - 内置通用子代理的默认配置（系统提示词与工具清单）随版本自动刷新。
    - 压缩摘要消息改为紧凑分割条样式，复制与回滚按钮并入。
    修复
    - 修复 Git 分支下拉交互：连点分支按钮不再「关闭后立即重开」；弹窗宽度按触发器右侧实际可用空间计算，窄窗口与显示缩放下不再被裁切，工作树行的操作按钮不再被挤出。
