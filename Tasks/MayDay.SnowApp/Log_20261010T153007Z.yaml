  Key: ReleaseNotes
  Value: |-
    新功能
    - 浏览器 Agent 授权与标签页共享：Agent 对内置浏览器的访问改为显式授权——只有你主动共享的标签页（或 Agent 自开的隔离会话标签页）才能被操作，其他标签页的命令直接报错。新增 browser-request_share 工具，通过应用内「允许 / 拒绝」确认条请求授权（60 秒未响应自动拒绝）；工具栏新增共享按钮与徽标、标签栏新增共享圆点、菜单新增「发送给 Agent」（页面正文 / 控制台日志 / 网络请求填入输入框），浏览器设置新增「Agent 授权」页（总开关、隔离会话、域名允许 / 屏蔽列表）。
    - 侧边栏项目树视图：侧边栏可在列表与树状视图间切换，树状视图把分组、项目与会话嵌套展示，运行中的会话与置顶会话有标记，视图选择会被记住。
    改进
    - 统一 Tooltip 组件替换了聊天输入工具栏、流式指标、消息操作、Git 控制与会话列表中零散的原生提示，位置与主题样式统一。
    - 会话列表：标题超长时悬停跑马灯滚动，悬停显示快捷操作，支持多选批量归档 / 删除；聊天输入工具栏新增 LSP 状态徽标。
    - 文件阅读器审阅面板在窄宽度下切换为上下结构，拖拽手柄随之调整高度或宽度。
    修复
    - 修复内置日志工具导致整个请求被拒：level 枚举不再包含空字符串（Gemini 兼容网关会返回 HTTP 400）。
    - 修复生成仍在进行时运行摘要提前出现的问题。
    - 修复侧边栏分组操作按钮长期占位，改为默认隐藏、悬停 / 聚焦时显示。
