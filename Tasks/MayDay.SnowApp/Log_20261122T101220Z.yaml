- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新功能
    - MCP OAuth 客户端元数据文档：授权服务器支持时，MCP 登录优先使用客户端 ID 元数据文档（SEP-991），否则回退动态客户端注册；没有注册端点的服务器（如 ElevenLabs）也能完成登录。
    - 设置页跳转入口：API 档案表单新增「管理系统提示词」「管理自定义请求头」按钮，可直接打开对应设置页。
    改进
    - 极简模式改为按行虚拟化渲染，AI 回复拆分为正文行与尾部行，长会话更流畅。
    - Git 提交图中未推送的提交以绿色虚线连接，连线不再压住 HEAD 光圈与工作树圆点。
    - 模型上下文与输出上限改为从完整拉取并缓存的 llm-specs 规格中补齐。
    - Claude Code User-Agent 仅在请求头方案未提供时补上，用户自定义的 User-Agent 不再被覆盖；模型列表请求也会携带该 User-Agent。
    修复
    - 修复极简模式下加载更早消息时滚动位置跳动的问题：翻页前后的工具分组保持一致。
