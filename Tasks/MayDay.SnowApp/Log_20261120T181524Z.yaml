- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新功能
    - MCP OAuth 登录：此前返回 401/403 的远程 HTTP MCP 服务器现在可按标准 MCP 授权流程登录（保护资源元数据发现、动态客户端注册、PKCE 授权码 + 本地回环回调、令牌交换）；凭据按服务器 URL 保存，Bearer 令牌自动附带与刷新，MCP 设置面板提供登录操作、状态轮询与显式 OAuth 开关。
    - 模型上限自动解析：从渠道模型目录读取上下文窗口与最大输出 token，缺失时回退公开 llm-specs 源，选择模型时同步写入 API 档案。
    - 角色卡开关：IM 角色卡可临时停用而不必删除，停用后不再注入内置系统提示词。
    改进
    - Git 面板分隔比例持久化保存（仅真实拖拽后写入），重启后保持原有高度。
    - SSH 目录图标按连接状态着色（断开为灰色、已连接或降级为绿色），目录行、树节点、悬浮提示与项目网格保持一致。
    - 非当前本地目录统一使用闭合多层文件夹图标，强调蓝的展开态只留给当前项目。
    修复
    - 工具 schema 会剥离 $schema 等 JSON Schema 方言元关键字，修复发布 draft/2020-12 schema 的 MCP 服务器导致 Gemini 返回 400 的问题。
    - 修复极简模式下流式输出时贴底滚动失效与位置跳动的问题。
    - 极简模式的工具分组边界固定为窗口首条消息，加载更早历史不再把尾部工具组合并进新分页并顶偏视口。
