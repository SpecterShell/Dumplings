- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新功能
    - 极简对话样式：新增第三种对话样式 minimal，每个轮次的中间回复折叠为可展开的「已工作 …」区块，生成过程中标题保持可见；工具组显示读取文件、搜索与命令等活动摘要。固定快捷键 mod+shift+u 改为在 classic、chips、minimal 之间循环，并以临时提示显示当前样式。
    - 浏览器日志点与路由故障注入：新增日志点操作，无需修改源码或暂停页面即可捕获运行时变量；scriptList / scriptSearch 通过源码映射查询脚本与源码文本。route 新增中止请求、延迟响应、按方法与资源类型匹配、次数限制、proxyTo 转发与 bodyFile 响应体，新增的 routeList 可查看生效规则与命中次数。跨域模拟响应自动附加 CORS 头并处理 OPTIONS 预检。
    - Porsche Sans 内置字体：打包子集化的 Porsche Sans 可变字体（字重 150-700），可在主题设置中作为内置字体选择。
    - 浏览器标签页站点图标：右侧面板的浏览器标签页显示站点图标，无法获取时回退为默认图标。
    改进
    - 侧边栏当前项目高亮：当前项目改用分层文件夹图标与强调色加粗标题标识，不再使用背景填充；关联的集合以彩色链接标记显示在项目名称旁。目录行、网格卡片与树节点的原生 title 提示统一改为 Tooltip 组件。
    - 用量筛选配置文件：横向的配置文件标签改为可搜索的下拉框，并整合到日期筛选栏中；用量表格的模型与配置文件单元格显示模型品牌图标。
    修复
    - Responses 请求会跳过内容为空的用户与助手消息，并丢弃既无加密内容也无文本的推理项；取消的轮次不再发送 content: [] 或进行中的占位内容，避免兼容网关将其转为空内容部分并返回 400。
