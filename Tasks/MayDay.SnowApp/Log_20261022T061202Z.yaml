  Key: ReleaseNotes
  Value: |-
    新功能
    - 插件提供 OAuth 登录：插件在 plugin.json 声明 oauth.entry 即可注册额外的 OAuth 登录提供方，无需发版。会话、PKCE、回调监听、持久化、刷新调度与并发锁仍由 Rust 核心负责，插件（主进程运行）只提供 authorize、exchange、poll、refresh、models、quota、transformRequest 等平台相关钩子。
    - 提供方分组：OAuth 提供方选择器按「内置 / 插件」分开显示，并新增设备码流程支持。
    - 分组拖拽排序：侧边栏可拖拽调整分组顺序，列表与树视图均支持，拖动时显示插入线。
    - 面板折叠与变更页签：面板分隔条支持拖过边界折叠、再拖回展开；右面板收起时顶栏新增「变更」页签（分支下拉 + Git 变更），可直接在面板中打开文件差异。
    改进
    - 插件安装、启停、重扫与删除后会即时同步登录提供方注册表；插件列表与市场按面板、OAuth、脚本分类。
    - 悬停侧边栏「更多」入口时显示各面板数量徽标，点击直达对应面板。
    - 精简定时任务底栏间距与「加载更多」按钮样式。
    修复
    - 修复工具调用时间戳因 Tooltip 包裹导致的布局异常。
