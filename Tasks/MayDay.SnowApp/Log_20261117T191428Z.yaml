  Key: ReleaseNotes
  Value: |-
    新功能
    - 浏览器新标签页：默认主页由 Google 改为空白起始页，并叠加内置新标签页，提供搜索、常用网站（由 Rust 按域名聚合）与分组书签。
    - 模型配置导入 / 导出：图像生成渠道及决策、嵌入、重排序模型支持批量导出与导入，提供冲突处理（覆盖或另存副本）与预览步骤。导出文件包含明文 API 密钥。
    - 对话样式设置：主题设置新增 classic、chips、minimal 对话样式选择器。
    - 后台任务多选：已结束的后台任务可批量移除，运行中的任务会被跳过。
    改进
    - 极简对话样式重做：每轮的「已工作 …」区块改为挂在助手消息下的工具运行集合；极简模式不再显示思考块，等待用户确认时集合自动展开。
    - 历史记录滚动更流畅：预取更早的分页，高度测量不再触发整个消息列表重渲染。
    - 各模型面板统一支持批量选择与删除。
    修复
    - AI 生成的内容（草稿、历史、规划查询、提示词）不再被脱敏，避免脱敏占位符混入模型输出。
    - 仅成对闭合的反引号才渲染为行内代码；工具执行期间工具组标题保持稳定。
