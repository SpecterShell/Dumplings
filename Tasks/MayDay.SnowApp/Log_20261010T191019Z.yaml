  Key: ReleaseNotes
  Value: |-
    新功能
    - 侧边栏插件更新提示：已安装的面板插件 / 脚本插件在市场中存在更高版本时，侧边栏插件入口（以及收起的「更多」入口）显示向上箭头徽标，无需进入插件页面即可感知待更新。
    - 树状会话列表手动加载更多：侧边栏树状项目会话列表由无限滚动改为「加载更多会话」按钮；无限滚动哨兵改用回调 ref 绑定节点，列表整体重挂载后仍能重新观察，切换视图时翻页不再失效。
    修复
    - 修复统一 Tooltip 常驻不消失：指针按下即收起（含被弹窗遮罩拦截的那一次点击）——遮罩盖住触发元素后浏览器不再补发 mouseleave，仅靠悬停退出会让提示一直显示。
    - 修复生成仍在进行时运行摘要提前出现：单独的思考状态不再视为活跃生成，只有存在待处理 / 运行中的工具调用时才隐藏摘要。
