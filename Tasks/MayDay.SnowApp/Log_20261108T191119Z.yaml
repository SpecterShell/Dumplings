- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新功能
    - 手机 Git 面板增强：支持拉取、推送与 AI 生成提交信息；变更页顶部显示当前分支及 ahead / behind 状态，分支与变更页可左右滑动切换。
    - 检查点开关：通用设置中可关闭检查点。关闭后新会话不再创建文件快照，回退仅恢复会话消息；关闭前需二次确认。
    改进
    - 历史图片按需加载：历史消息中的图片不再还原为 base64，改为从磁盘按需读取，降低渲染进程与主进程的内存占用。
    - SSH 大参数传输：SSH 命令支持通过 stdin 传递大参数，远程文件读取支持大小上限。
    - 移除 OAuth 插件 fetch 接管中的 ensure_fetch_safe 检查。
    修复
    - 终端 MCP 的默认目标与右侧面板的活动标签同步，分屏时点击其他分组的终端不再误判焦点。
    - 关闭隐私过滤总开关后，过滤模式、工具选择与规则配置统一停用，并停止预览显示。
