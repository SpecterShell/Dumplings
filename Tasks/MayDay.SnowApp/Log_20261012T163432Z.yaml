- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新功能
    - 应用任务管理器：右侧面板新增标签页，列出应用全部进程（主进程 / 渲染 / GPU / 工具 / 子进程）的 CPU、内存与线程数（每秒刷新），支持搜索、排序与二次确认的「结束进程」。
    - @@ 按内容检索文件：聊天输入框输入 @@关键词 改为检索文件内容而非文件名，选中后引用会带上命中的行号区间。
    - 输入栏插件二级菜单：面板可为输入栏 Action 贡献最多 8 个二级菜单项，右键、更多按钮或键盘（Shift+F10 / ContextMenu / Alt+ArrowDown）均可打开，支持完整键盘导航。
    - 自定义命令配置域：自定义斜杠命令新增 config 配置域（list / get / set / delete）供插件读写，/ 菜单与设置面板即时刷新。
    - 插件市场下载量：市场条目展示下载量，GitHub 接口配额用尽时给出明确提示。
    - 工具拒绝提示条：工具调用被拒绝后，工具卡片上常驻显示拒绝理由（用户未填写时明确说明）。
    改进
    - 重试间隔支持按档案配置固定时长，留 0 仍走指数退避（封顶 30 秒）。
    - 提示词优化可选纳入当前项目代码上下文：默认关闭、范围受限、改写前先审来源，且不会自动发送。
    - 子代理与 Workflow 节点继承父会话输入区选定的思考强度，档位不被支持时回落档案默认值。
    - Responses：可识别的上游流式异常安全恢复，认证头在诊断信息中完整脱敏。
    - 全局崩溃捕获覆盖主进程未捕获错误、渲染层 Promise 拒绝与 Rust panic（含调用栈）并落盘，退出前刷写未落盘日志。
    - 插件面板支持「全部更新」；插件市场的非破坏性确认按钮不再使用危险色。
    - 图像生成设置：统一模型标签与复选框样式、配色跟随主题，消除重复标签与列错位。
    修复
    - 修复 Gemini 工具历史丢弃无 ID 调用，导致这些调用的参数清理与结果保留失效。
    - 修复网络搜索的常驻无头浏览器不退出：空闲 3 分钟后关闭，释放内存与整棵子进程树。
    - 修复图像生成样式引用未定义 CSS 变量（部分主题下悬停无反馈、警告条不可见）。
    - 修复压缩（compact）进行中发送按钮被禁用。
