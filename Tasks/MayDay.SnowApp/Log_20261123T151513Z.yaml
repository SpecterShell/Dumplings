- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新功能
    - 工作树会话：会话可绑定到 Git 工作树，并在 Git 面板中切换，侧边栏显示工作树标识。
    - 侧边栏筛选：新增持久化开关，只显示运行中与已置顶的会话，其余折叠进「历史会话」分组。
    - 插件工具卡：支持按工具显示徽标图标、实时耗时，并通过 plugin-media:// 协议内嵌预览本地图片、音频与视频（Range 流式读取）。
    - 上限锁定：上下文与最大输出上限可选择跟随模型，或按档案手动锁定。
    - 角色卡确认：AI 生成的角色卡先预览，确认后才写入。
    改进
    - 导出的配置文件名按所选条目生成，导入的配置移到列表顶部。
    - Git 图中未拉取的提交连线改为红色虚线；删除未合并分支时先确认，再执行强制删除。
    - 窗口移动到不同 DPI 显示器后重新应用界面缩放，展开的面板宽度限制在窗口内。
    - 模型下拉框显示上下文窗口徽标；终端文件追踪为新建与删除补充行数。
    修复
    - 取消运行时同步中止进行中的工具调用修复请求，会话不再卡在运行状态。
    - 同一轮中新增工具调用时，已展开的工具卡不会被收起。
    - 丢弃大于等于上下文窗口的不合理输出上限，无同名官方规格的模型改用渠道规格汇总值。
