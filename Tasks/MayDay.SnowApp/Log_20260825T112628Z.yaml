  Key: ReleaseNotes
  Value: |-
    改进
    - 集合项目不再重复显示：已加入集合的项目不再出现在顶层项目列表中，消除集合视图与主列表的重复。
    - 项目列表分页：项目列表分页改用滚动事件驱动，替代 IntersectionObserver，增量加载更可靠。
    修复
    - 归档会话恢复统计：归档恢复查询缺少运行级 token 统计列，导致恢复的会话丢失运行统计；现已补上相关列。
