  Key: ReleaseNotes
  Value: |-
    新功能
    - 工作流节点并行执行：依赖就绪的节点同时启动，每个节点接收全部直接前驱合并的交接文档；节点会话运行期间可继续处理用户消息，完成后转为只读。
    改进
    - 记忆库弹窗支持多选批量删除。
    - MCP 传输层握手失败时自动回退 legacy initialize 握手，兼容旧版服务器。
    - 文件查看器滚动优化，View/Edit 模式布局调整，横向滚动条固定于视口底部。
    - 明确记忆 importance 的注入与检索语义。
    修复
    - 修复「会话+文件」回滚时文件不恢复的问题（恢复前移至 DB 删除之前执行）。
    - 修复中文输入法组合输入时快捷键误触发。
    - 修复项目无记忆条目时统计失败（SUM 空集返回 NULL）。
    - 修复输入框为空时的高度异常。
