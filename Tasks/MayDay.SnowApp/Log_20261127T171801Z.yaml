  Key: ReleaseNotes
  Value: |-
    新功能
    - Snow AI Router 登录与渠道开通：通过 OAuth 登录 Snow AI Router，登录后选择账号可用的渠道，自动创建或复用 API Key 并写入本地 API 配置，已有 Key 的渠道保持不变。
    - Markdown 原始 HTML 与相对图片：文件查看器的 Markdown 现在可渲染源码中的原始 HTML（按标签与属性白名单净化，脚本、样式、表单与外部资源标签一律剥离），相对图片按文件所在目录解析。
    - 思考强度 Extra High：思考强度选项新增 Extra High 档。
    改进
    - Antigravity 客户端升级到 2.35.2，支持 Gemini 4 模型族与 3.8 Flash；旧方案里过低的客户端版本会自动覆盖，并过滤当前套餐不可用的占位模型。
    - 侧边栏会话提示中显示消息数。
    - Token 上限跟随模型时，输入框旁给出提示，自动填入的数字不再让人误以为与「跟随模型」冲突。
    - 工具卡头部文字按基线对齐、行高调整避免裁切，尾部占位不再随内容加载闪动。
