- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新功能
    - 插件市场：插件页新增「市场」标签页，可在线浏览、安装与更新插件和用户脚本——索引来自 snow-plugin-store 仓库（GitHub raw 与 jsDelivr 双源），安装前校验 SHA-256，并支持版本更新检测。
    - 浏览器跨域 iframe：内置浏览器新增 browser-frames，返回绑定文档生命周期的不透明 frameId；读取、执行、等待、点击、输入、悬停、下拉选择、上传与快照/AX 均可指定 frame，输出与错误统一脱敏，不支持的操作直接报错而不回退误操作主 frame（#175）。
    - 浏览器调试工具集：新增设备仿真与视口调整、性能追踪与洞察分析、CSS 级联检查、无障碍审计（axe-core）、JS 堆快照采集与对比、页面录屏、表单填充与拖拽、页面注册工具调用等浏览器 MCP 能力。
    - SSH 单级 ProxyJump：SSH 连接支持配置单级跳板机，连接向导同步支持。
    - 关联项目组：项目合集升级为「关联项目组」——创建时可直接纳入成员，成员带关联开关（断开后保留但不参与关联解析），支持关联组统一搜索与组颜色标识，合集对话框新增自定义颜色选择器。
    改进
    - Git 提交图连线渲染重构：汇入车道以整行弧线平滑并入圆点，分支颜色从分叉点到汇合点保持一致。
