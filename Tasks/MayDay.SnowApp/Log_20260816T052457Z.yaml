  Key: ReleaseNotes
  Value: |-
    新功能
    - 更多 IDE 支持：新增 RustRover、Aqua、DataSpell 的检测与「用……打开」菜单支持。
    - API 提供商搜索：API 设置中的提供商列表支持搜索过滤。
    - Token 大单位：Token 数量显示支持 T/Q/Qi 单位。
    改进
    - 检查点增强：检查点操作提升原子性并本地化；远程检查点通过批量远程 IO 与 SSH 会话复用显著提速。
    - 性能优化：优化面板拖拽与会话切换性能（视口虚拟化）。
    - 多选操作按钮增加 Tooltip 并适配窄宽度。
    修复
    - 修复回滚的跨会话竞态条件。
    - 修复 Windows 宿主下 WSL 工作目录处理。
