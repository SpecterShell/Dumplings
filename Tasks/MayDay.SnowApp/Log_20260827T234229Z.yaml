- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新功能
    - 用量优化：通用设置资源占用区新增「优化用量」按钮，对运行时与归档数据库执行 VACUUM + WAL checkpoint、触发 V8 全量 GC 并在 Windows 上收缩进程工作集，回收空闲磁盘与内存并报告回收量。
    改进
    - 存储模块拆分：Rust 存储单体模块（约 2,400 行）按领域拆分为 16 个子模块，公共 API 保持不变。
    - 会话删除清理：删除会话时清理孤儿上传文件；磁盘回收统一交由「优化用量」处理，避免每次删除都执行 VACUUM 产生额外 IO。
    修复
    - 终端行重叠：修复 Windows ConPTY 在异常尺寸或高频 resize 时终端行重叠——尺寸钳制最小值并跳过无变化 resize、resize 通知增加 120ms 尾部防抖、容器不可见时冻结自动适配、标签重新激活后强制刷新可见区域。
