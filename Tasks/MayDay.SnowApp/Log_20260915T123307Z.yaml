  Key: ReleaseNotes
  Value: |-
    新功能
    - 手机远控：手机浏览器即可接管当前会话——实时对话与流式输出、切换工作区与模型、审批工具、回答问题、发送图片文件、回滚会话，并配套工具卡片与 WorkFlow 画布卡片。远控 HTTP 服务迁移到 Rust 原生层，公网入口改用长期令牌（移除一次性配对码与凭据轮换），内置 frpc 扩展至 macOS/Linux，支持多发行版 Linux 部署与自定义端口。
    - 工作区重新定位：校验项目目录状态（位置已失效、磁盘未挂载、无访问权限），可选择当前目录重新定位，并把会话、记忆、备忘、计划任务与项目级设置一并迁移，支持合并、迁移记录与撤销。
    - Markdown 表格导出：回复中的表格可导出为 CSV 或 XLSX。
    改进
    - 出站请求统一由 Rust 代理（no_proxy 本机网段直连），MCP HTTP 传输共用同一配置。
    - MCP 服务器列表改为快速返回，工具发现按需触发或后台补齐，慢服务器不再阻塞 MCP 设置面板与项目 MCP 面板。
    - 记忆注入改为会话快照：会话期间新增或修改的记忆不再影响当前会话的提示词前缀缓存。
    - 优化缩进敏感文件的模糊匹配性能。
    修复
    - 图片不再信任声明的 MIME，改为嗅探真实格式；工具结果中的内联图片落盘持久化，避免 base64 撑大数据库与请求上下文。
    - 修复严格 Chat Completions 提供商下工具结果图片触发 400 的问题：图片改为在该轮工具回复后合成为一条 user 消息。
    - 新增发送前上下文窗口守卫：超限请求在本地拦截（图片按视觉方式计费），不再由提供商返回错误。
    - 修复提问卡未回答或被中断时的状态泄漏。
    - 修复移动端历史消息翻页入口。
