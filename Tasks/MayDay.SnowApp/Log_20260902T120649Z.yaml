  Value: |-
    新功能
    - 工作流失败节点续跑：新增 workflow-resume 工具——节点失败后工作流暂停，经用户确认后可携带可选的 continuePrompt 在失败节点的原会话中继续执行（保留完整上下文），成功后剩余节点照常运行。
    改进
    - 回滚确认弹窗新增可选清理项：可一并删除被回滚轮次内保存的项目记忆，默认保留，支持展开查看清单。
    - 侧边栏记忆入口显示当前项目的记忆条数徽标，AI 保存/更新/删除记忆后实时刷新。
    - <handoff> 交接文档渲染为可折叠块；记忆与工作流工具卡片渲染优化。
