- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新功能
    - 团队协作：新增团队协作面板，支持任务、笔记、评审、动态与成员管理，内置 Markdown 编辑器，数据由 Rust 后端持久化。
    - @! Skill 引用：聊天输入框支持 @! 搜索并引用 Skill，用户消息与定时任务中的 Skill chip 同步支持。
    改进
    - API 设置内联编辑：模型下拉框可直接打开 API 设置编辑弹窗，编辑弹窗抽离为独立组件。
    - 资源管理器快速编辑：项目资源管理器中双击文件可直接打开快速编辑弹窗。
    - 侧边栏布局：折叠会话区块时，项目区块自动填满剩余高度。
    - 图片数据校验：工具结果与消息中的图片数据增加 magic byte 校验，拒绝非法内容。
    修复
    - SQLite 锁竞争：写入引入全局写锁与重试逻辑，避免并发写入时的锁冲突。
    - Windows 环境变量泄漏：修复 bash / MCP / 终端子进程继承宿主 PATH / NODE_ENV 的泄漏问题。
