- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新功能
    - 自定义命令：/ 命令面板支持自定义命令——全局或项目作用域、$ARGUMENTS 参数占位符、描述与启停管理，项目级可覆盖同名全局命令。
    - 重试策略设置：API 设置新增「重试策略」页，按错误分类（限流、5xx、网络、流错误等）开关重试、追加匹配关键词，或一键开启任意错误重试；对所有 API 配置生效。
    - 链接打开菜单：聊天回复中的链接可选择在应用内浏览器或系统浏览器打开。
    - 密码手动管理：浏览器设置中可手动添加、搜索与删除已保存的密码。
    改进
    - 文件查看器支持语法高亮与大文件虚拟行渲染，打开大文件不再卡顿。
    - 下拉弹层（文件提及、模型选择、命令面板等）动画与可见性处理统一优化。
    - 提问工具在同批调用中被全部拒绝时中止本轮，不再继续执行后续工具。
    - 归档数据库引入 schema 版本管理，归档与恢复时的数据库初始化逻辑更稳健。
    修复
    - 修复回滚截断后上下文 token 快照被清零的问题：每条消息持久化单次请求用量，回滚后从剩余消息恢复快照。
