- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新功能
    - 工作流定时任务：定时任务可按工作流运行——由 AI 节点组成的有向图，支持连线延时与画布编辑，运行状态跨重启保留。
    - 自定义 API MCP 传输：将 Web API 接口映射为 MCP 工具（一个接口一个工具），路径、查询、请求头与请求体支持参数占位，可配置公共 Cookie 与请求头，并能直接用未保存的草稿发送测试请求。
    - 布局风格：新增全局布局风格，提供岛屿、分层与平铺三种模式。
    - 子代理验收清单：激活子代理时可附带验收清单，每项按真实工具调用证据校验。
    - 浏览器操作回执：点击、输入、表单填充、下拉选择与按键操作返回回执，区分事件派发与实际观察结果；网络列表新增方法与请求头过滤及单请求详情。
    - 手机端工具纠错：手机远控新增工具调用自动纠错开关与纠错面板。
    改进
    - 定时任务所有字段均可编辑，Agent 可创建、更新、运行、取消、暂停与删除任务。
    - 备忘、站点拦截规则与定时任务创建统一迁入 config 服务。
    - MCP 列表支持搜索，HTML 预览新增开关；config-logs-read 改为按项目默认关闭。
    - 加号菜单的插件标签以带标题的分隔线分组；隐私开关支持分组折叠。
    - 可更新的插件脚本支持一键批量更新。
    - 回滚与并行数据加载更快；Goal 与 Plan 模式的上下文交接提示词更精确。
    修复
    - 修复工具纠错请求的自定义请求头中 {{session_id}} 未展开的问题。
    - 修复图片描述缓存未区分提示词的问题。
    - 修复分层布局下侧边栏内边距与用户消息定位条层级的问题。
