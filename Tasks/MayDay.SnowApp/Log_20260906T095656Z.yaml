    新功能
    - 终端 GPU（WebGL）渲染：终端新增 GPU 加速渲染，可在设置中的终端面板开关。
    - 用户脚本本地导入：浏览器设置支持从本地文件导入用户脚本，配置值解析容错，异常数据不再导致失效。
