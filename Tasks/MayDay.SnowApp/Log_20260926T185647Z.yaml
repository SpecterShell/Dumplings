  Key: ReleaseNotes
  Value: |-
    新功能
    - 顶部栏与 Git 面板重构：顶部栏重排并新增分支选择器（分支切换由 Git 面板头部移入）；Git 面板头部改为提交区（提交信息输入、AI 生成提交信息与提交按钮），两处共享同一仓库监视（引用计数）。
    - 常驻 PowerShell 会话：PowerShell 连续命令复用同一常驻会话，轻量命令开销约 400ms → 40ms；工作目录仍逐条重置，环境变量等进程级状态保留，空闲会话自动回收。
    - 客户端脚本：插件列表新增「脚本插件」标签页，可模板新建、AI 生成、导入、全屏编辑、删除与启停注入桌面 UI 的客户端脚本。
    - 团队头像颜色与顶栏团队信息：团队头像支持自定义颜色（默认按邮箱哈希）；团队名、远程地址、同步状态与身份操作移至顶部栏，避免重复拉取团队数据。
    - 内置 MCP 服务图标：内置 MCP 服务器在 MCP 面板中显示专属图标。
    改进
    - LSP 语义优先：提示词改为「场景 → 工具」硬绑定，语言服务器可用时定义 / 引用 / 类型 / 影响面优先使用语义工具，grep 退回字面文本并附语义工具提示；Plan / Goal / WorkFlow 调查阶段的工具列表按项目实际可调用工具动态注入。
    - 栈感知语言服务器：按语言栈根目录（Cargo.toml / go.mod / tsconfig.json 等）启动 LSP 会话，混合栈项目解析更准，无栈标记的语言不再启动。
    修复
    - 修复被单独禁用的工具仍出现在注入提示词中的问题。
    - 修复混合栈项目中 codelens 文档符号工具被整体隐藏的问题：语言服务器未覆盖的语言保留静态分析回退。
    - 修复 LSP 客户端日志重复刷屏与长行被读取缓冲截断的问题。
    - 修复技能设置与项目记忆列表在刷新或操作后重建、滚动位置跳回顶部的问题。
