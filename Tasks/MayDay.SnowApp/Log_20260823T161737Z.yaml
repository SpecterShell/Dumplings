- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新功能
    - 轻量模式：新增轻量模式，可禁用重量级 MCP 服务器以节省上下文。
    - 可配置发送按键：聊天输入支持选择 Enter 或 Ctrl+Enter 发送。
    - 并行新建会话：支持并行创建多个新会话，各拥有独立待处理槽位与目标会话位置。
    - 按日期删除使用记录：支持按日期范围删除使用记录。
    改进
    - 只读 MCP 工具并行执行：无副作用的只读 MCP 工具现在并行执行。
    - Gemini Interactions 协议：新增 Google Interactions 协议支持，改进工具调用流式、名称解析与工具结果恢复。
    - 缩进保护模糊编辑：模糊编辑对 Python/YAML/Makefile 文件保护行首缩进，缩进变化的编辑会被拒绝。
    - 模型选择器 API 设置入口：模型选择器新增 API 设置入口。
    - 其他：地址输入框右键菜单（剪切/复制/粘贴/全选）、目录右键菜单「在文件管理器中打开」、会话摘要显示平均输出速度、终端按键序列发送与输入等待检测、记录工具取消原因并保留部分 bash 输出。
    - 日志脱敏：API 请求日志中的敏感凭据被脱敏，并修复日志过滤问题。
    修复
    - Windows 进程等待卡死：改用轮询 try_wait 替代 Child::wait，修复 Windows 上进程等待卡死。
    - 子代理激活错误处理：改进子代理激活错误处理，失败会在 UI 中显示。
    - MCP 工具 Schema 兼容性：工具 Schema 显式声明 type: object 与标量类型，兼容 Gemini。
