    新功能
    - 持久记忆：新增 memory MCP 服务支持条目级持久记忆——代理可按项目保存/搜索/列出/更新/删除记忆条目，记忆自动注入系统提示；设置页新增记忆管理面板，删除会话时同步清理关联记忆。
    - 侧边栏折叠快捷键：新增左右侧边栏折叠/展开快捷键。
    改进
