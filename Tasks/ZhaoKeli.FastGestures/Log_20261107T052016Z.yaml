  Key: ReleaseNotes
  Value: |-
    优化
    - 优化图形识别(2.0 引擎)的计算速度，连续画手势更顺手，复杂图形匹配也更稳定
    - 优化长时间运行时的内存和句柄占用
    - 命中手势后的匹配度显示更准确(修复画得很快、很短的手势已命中却显示 0%的问题)
    修复
    - 修复升级后个别电脑反复启动失败的问题(配置文件缓存异常导致)
    - 修复登录窗口连续点击登录、或短时间内多次唤起时有概率闪退的问题
    - 修复快速启动面板按热键没反应、要再按一次才弹出的问题
    - 修复打开日志面板、使用云备份(恢复/删除/下载)时可能闪退的问题
    - 修复界面皮肤、资源加载异常时出现的闪退和白屏问题
    - 修复超长路径、剪贴板操作、多屏触控设备信息在部分情况下导致闪退的问题
    - 其它已知反馈问题
