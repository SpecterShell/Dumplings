  Key: ReleaseNotes
  Value: |-
    新功能
    - 添加实验性功能(默认开启),优化慢慢拖动窗口，特别是选中文字时容易发飘的问题
    - 变量替换支持系统环境变量，例：%WINDIR%,%WINDIR%,LUA 用法 fg_show_msg([[%WINDIR%]])
    - 添加新全局变量 fg_var_explorer_current_path 如果当前鼠标下是资源管理器则会获取它的打开路径
    - 添加连击 ctrl 强制退出应用配置项，可关闭/开启
    - 添加连击 CapsLock 键进行卡键修复，可检测并修复由于键盘、鼠标某个键未弹起，导致键盘、鼠标点击无反应的问题
    优化
    - 优化右键菜单删除手势失效的问题
    - 优化 UWP 应用路径、图标、识别和打开激活
    - 优化滚动条滑块显示少一个像素的问题
    - 手势操作、扩展下拉框添加搜索
    - 优化 win11 激活资源管理器后选中文件不能获得焦点问题
    - 优化资源管理器中选中文件的路径提取
    - 命中手势后，在日志中显示完整的手势继承路径方便定位手势位置
    修复
    - 修复已经启动的情况下再次点击图标启动，前台界面不显示的问题
    - 修复右键+滚轮快速执行时，有概率导致手势键被忽略、手势状态未释放的问题
    - 修复手势键长按显示操作面板后会直接触发操作的问题
    - 其它已知反馈问题
