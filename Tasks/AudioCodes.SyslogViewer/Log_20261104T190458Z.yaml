Version: "2.50"
Installer:
- Architecture: x86
  InstallerUrl: https://tools.audiocodes.com/install/syslogViewer/syslogViewer-setup-32.exe
- Architecture: x64
  InstallerUrl: https://tools.audiocodes.com/install/syslogViewer/syslogViewer-setup.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Improve Web connector:
      - Support SBC version 7.6.400.
      - Fix reconnection failing with "csrf error" or wrong password.
      - Show clear error messages.
      - Detect HTTPS interception by firewalls and suggest workarounds.
    - Support SBC sending hostname instead of IP address in syslog packets.
    - Fix TLS syslog listener rejecting SBC certificates without client authentication.
    - Show TLS syslog listener connection errors.
    - Support log files up to 1 GB; open large files faster and with less memory.
    - Speed up SIP Flow Diagram.
    - Fix multiple issues in syslog listener, log parsing and SIP Flow Diagram.
    - Remove OpenSSL libraries from Windows build.
    - Major code refactoring.
ReleaseTime: 2026-11-04
