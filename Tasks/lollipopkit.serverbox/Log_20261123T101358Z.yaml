- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Added
    - MCP server in the app and on Monitor: expose ServerBox hosts and settings through a local MCP server in the app, and expose an authenticated MCP endpoint on Monitor with scoped API tokens and per-IP / per-token rate limiting.
    - Expanded BMC (Redfish) management: read and clear event logs, inspect drives and predictive failure status, set boot device overrides, mount or eject virtual media, and toggle the locator LED.
    - SSH agent and jump-host multiplexing: authenticate using keys from the system ssh-agent, forward the agent to terminal sessions, and connect through a jump host's existing OpenSSH ControlMaster.
    - Agent secret redaction: automatically redact sensitive tokens, keys and passwords before the Agent sends context to a model.
    - Monitor fallback address and per-device metric history: configure a fallback address for Monitor connections, and query per-device metrics history over custom time ranges.
    - Server status sharing and swap breakdown: share a server's live status as a poster image or formatted text, and inspect each swap area's size, usage and priority individually.
    Changed
    - macOS builds are now unsandboxed only: Mac App Store builds and sandbox compatibility branches have been removed.
    - iOS local Linux environment migrated to the new userland engine (iul).
    - Unified UI interactions: dialogs replaced with bottom sheets across the app, a single server picker with search, tags and sorting used everywhere, and the bottom bar adapts the number of visible tabs to the window width.
    - Agent chat: tool calls now fold neatly with improved scroll following.
    - Older app builds can now open local storage databases written by newer schema steps they understand.
    - Upgraded to Flutter 3.50.
    Fixed
    - Read CPU temperatures from hwmon in addition to thermal zones.
    - Keep Agent replies intact across dropped connections and request iOS background execution time while a reply is streaming.
    - Deduplicate virtual media slots when a Redfish service lists the same slot twice.
    - Align server list titles properly with non-square distribution marks.
    - Prevent background sync and connection teardown from blocking UI dismissal.
    - Keep the theme background steady beneath pages during route transitions.
    - Respect the wake-lock setting in terminal sessions.
    中文更新日志：https://serverbox.lollipopkit.com/docs/zh/changelog/
    Full Changelog: https://github.com/lollipopkit/flutter_server_box/compare/v1.0.1925...v1.0.1962
