Locale:
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    1. 修复 macOS 全屏状态下最小化到托盘后出现黑屏的问题。
    2. 修复百度五笔大写英文模式下首字母丢失的问题。
    3. 修复重新打开最小化后的 iShellPro 时终端闪烁的问题。
    4. 修复终端长时间运行后偶发显示模糊的问题。
    5. 修复旧版 Windows Server 的 RDP Security 连接失败问题。
    6. 修复连接 iStoreOS 失败的问题。
    7. 修复使用 rz 命令上传文件异常的问题。
    8. 修复下载服务器文件夹到本地失败的问题。
    9. 修复修改编码后 SFTP 未同步编码、文件名显示乱码的问题。
    10. 修复批量复制多个文件到 Linux 目录时，文件数量较多会提示网络异常的问题。
    11. 优化断开连接后的提示信息。
    12. 优化终端命令行输入体验及字体显示效果。
    13. 优化列表中的密码复制功能。
    14. 支持通过 SCP 传输文件。
    15. 支持通过串口使用 YMODEM 协议传输文件。
    16. RDP 新增 RD Gateway 支持。
