  Key: ReleaseNotes
  Value: |-
    New features
    - One email is one Ovis account, whichever way you sign in.
    - Agents can start Qwen Code, Kimi, Devin and Command Code.
    - Open files and images from your other PCs.
    - Pair with a typed code through your own relay and app.
    Improvements
    - Password prompts get a hidden field in Chat.
    - The built-in browser and SSH PCs reach a PC's localhost.
    - An offline PC says why, and shows this PC's address.
    - Agent alerts wait five minutes before they repeat.
    Bug fixes
    - Touch selection in the terminal no longer stops swipes.
    - Subscription usage shows Claude's per-model weekly limits.
    - Many fixes across Chat, terminals and pairing.
