  Key: ReleaseNotes
  Value: |-
    This took a little bit longer than we would have liked, but it's an important one!
    Highlights
    - PLUGINS!! We've been using this system internally for a while (it's what powers AI Shell and ER Diagram), but we think it's finally time to let all of you get your hands dirty. @rathboma Has already gone wild and created some community plugins, and we already have some early community adopters with their entries available (thanks @Gldywn and @JonathanHerSa !!). Check out Tools -> Manage Plugins to get started.
    - More Themes! @azmy60 has been hard at work standardizing our styles across the app, and this means that it is much easier for us (annnddd maybe other people, hint hint) to create new themes. For now we have Dracula light/dark, and GitHub light/dark. Themes are now available in the View -> Appearance menu.
    - Windows distribution: We now build for Windows ARM, and for both ARM and x64 we distribute an MSI alongside the other formats.
