- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Argus v0.6.0 introduces a new dot-matrix performance chart app icon and a redesigned main window, with a streamlined title bar, reorganized page and status bars, and an Always on top button. The new “Components” page shows live system readings in the tray, on the desktop and on the taskbar; the redesigned History page supports multi-lane charts, resource events and cross-run process observation. Processes adds resource leak alerts and power usage columns, Processes, Services, Startup and Connections support copying cells and CSV export, services and startup entries can be deleted, Performance adds NPU monitoring, and touch input and a hardware acceleration switch are now available. This release also reduces scrolling and redraw overhead, fixes a blue screen when opening disk details on some Intel RST VMD systems, and avoids waking powered-off discrete GPUs and spun-down hard disks.
    Breaking changes
    - History: This release uses a new storage format, so History shows only data recorded from version 0.6.0 onward. The first write after upgrading replaces the old-format file for that day, if present; earlier versions of Argus cannot read the new records.
    - Privileged service protocol: The communication protocol changes from version 11 to 12. Update an existing service before using it to end processes or change I/O or memory priorities.
    Features
    - App icon: Switches to a new dot-matrix performance chart icon with dedicated layouts per size so it stays sharp on the taskbar, in the title bar and in updated shortcuts. About and the welcome guide form the logo from dots and transition into a live dot chart of the last 10 CPU samples; with “Interface animations” off, the dot chart appears immediately.
    - Title bar: Streamlined to the app logo, a search box that adapts to window width and Windows standard-size window buttons, leaving all remaining empty space draggable. A new pin button toggles “Always on top” and persists across restarts. (#121)
    - Page bar and status bar: Page controls and “More actions” move beside the navigation tabs, and process view switches use icons. “More actions” gathers “Run new task…” (Ctrl+N), “Find processes using a file…”, keyboard shortcuts and, on Services, the Windows Services console. The status bar adds pause and refresh-rate controls, while the version number also shows update progress and opens the install prompt. (#87)
    - Components page: Adds the “Components” page to manage tray and background options and to turn on the desktop and taskbar monitors (both off by default). Opening settings from the tray or a monitor selects its section in the sidebar.
    - Live tray icon: Shows live CPU usage with “Trend” by default, or switches to “Share”, “Number” or “App icon”; the three live styles turn amber at 80% usage. Hover for a live readings card, or right-click to open the quick panel listing the three busiest processes by CPU usage and common actions.
    - Tray card and quick panel: The hover card adapts its layout to the language and font size, with a system tooltip available when disabled. Click readings in the quick panel to jump to the corresponding device in Performance; opening the panel from the hidden-icons area keeps that area expanded. (@digital-bombyx #113 #153)
    - Desktop monitor: Displays live readings in a persistent desktop mini-window in “Strip” or “Panel” layout, with “List”, “Curves” and “Gauges” styles for panels. Dragging stays within the current display’s work area, with options for always on top, position lock, click-through and opacity.
    - Taskbar monitor: Displays live readings on the taskbar in “Labels”, “Curves”, “Capsules” or “Large figures” style. Preview and switch styles in Components or the right-click panel; the panel also selects the display, toggles readings and reorders them by dragging, taking effect immediately. (#28, #123)
    - Multi-display and window switching: If the selected display disconnects, the taskbar monitor moves to the primary display and returns automatically when reconnected. Clicking the taskbar monitor or tray icon hides an unobstructed main window, or brings a hidden, minimized or covered window to the front; double-clicking the desktop monitor opens the main window.
    - Monitor readings: Both monitors offer 18 readings, covering temperature, clock speed, power and fan speed. Select readings individually for each GPU, disk and network adapter, and drag categories or individual readings to reorder them. The taskbar monitor uses device colors for labels and identifies follow-up readings for the same CPU or GPU by metric name.
    - Monitor refresh interval: While the desktop or taskbar monitor is active, Argus samples at the main window’s refresh rate. When the minimized or background interval differs, Settings shows the actual interval in effect while preserving the interval option used after both monitors close.
    - History page: Redesigned into a multi-lane step chart where every lane can overlay a second reading. Search readings by name or device and drag lanes to reorder or resize them; when lanes exceed the chart height, scroll inside the chart.
    - Navigating history charts: Scroll the wheel to zoom around the time under the pointer; zooming, clicking a curve or dragging a selection pauses live tracking. Click “Back to latest”, right-click the chart or press End to resume. Hatching marks unrecorded gaps, and the last 10 minutes show each actual sampling interval. (#79, #129)
    - Live history charts: During live tracking, step curves advance continuously while the cursor on the hovered lane updates in real time as curves pass beneath it. Time range and axis transitions animate smoothly with fading overlays, and previously viewed long ranges reopen faster.
    - Time ranges and events: The dropdown offers 5 minutes, 3 hours, 1 day, 3 days and “Custom…”; in the “Custom time range” dialog, select dates on a calendar or enter exact start and end times. Enable “Show the 30-day overview and events” for an hourly heat map and events such as high CPU load, low memory and recording gaps.
    - History process table: Search processes for the selected moment or range, and sort by name to group apps, background processes and Windows processes. Expand a name group to inspect the top four instances and a combined total for the rest; the context menu overlays the program’s curve on the chart or copies its name and PIDs.
    - History chart tooltips: Hovering over CPU and other per-process lanes lists the five busiest processes, while the process-count lane lists the five programs with the most instances and a total for the rest. Temperature, battery level and other device-only readings display device data only.
    - Recorded history: Adds CPU clock speed, power and temperature, memory details, battery readings, and per-device readings for each disk, GPU and network adapter. Under “Settings → Data and history”, select categories to record, choose about 20, about 40 or all active processes per frame, and view the estimated daily storage use.
    - History storage: Set independent age and size limits, whichever is reached first; defaults are 30 days and 2 GB, with records older than 7 days merged by minute into averages, peaks and the busiest processes. Changing the save location offers to move existing history and watch records; if the target folder already contains other files, Argus stores records in an “Argus History” subfolder.
    - Process observation: Choose “Watch process” from the process context menu or details pane to record 14 readings per run for programs at the same path (memory, CPU, GPU, disk, I/O, network, threads and handles), or the current instance only if the path is unavailable. Starting a watch opens “Process observation” under History to switch between runs and compare readings with multi-lane charts. (@hayxe1 #82)
    - Watch records: The last 10 minutes display individual samples, while earlier periods read from disk. Records are retained for up to 7 days, removing the oldest data first if the capacity limit is reached; “Stop recording” keeps existing data, and watches must be restarted after Argus restarts.
    - Process groups: Distinct colors identify “Apps”, “Background processes”, “Windows processes” and each user group. While scrolling, the active group header stays pinned at the top, and markers beside the scroll bar indicate each group’s position and the current group name. With “Hide system processes” enabled, the process count also reports how many processes are hidden. (#88)
    - Process power usage: Adds optional “Power usage” and “Power usage trend” columns (hidden by default) that estimate power consumption from CPU, GPU and disk activity. The former shows the current level, and the latter shows the average over roughly two minutes. (#134)
    - Process priorities: The context menu now sets I/O priority and memory priority, with values shown in the details pane and optional columns. “Base priority” displays class names, keeps special values numeric and continues to sort numerically. (@digital-bombyx #80 #116)
    - Pause sorting while hovering: When hovering over the process list pauses sorting, the sort column header shows a pause icon and the status bar displays “Sorting paused”. “Settings → Language and appearance” adds a “Pause sorting while hovering” switch, enabled by default. (#86)
    - Resource leak alerts: Processes automatically detects handle leaks, accumulating child processes and leftover processes, with an amber header badge to jump straight to them. The details pane shows evidence, count trends and suggested actions, updating on the next sample after a process exits. Programs can be ignored individually and restored—or alerts disabled—under “Settings → Language and appearance → Resource leak alerts”.
    - Copying table data: Processes, Services, Startup and Connections all support copying the current cell, name or details from the context menu. On Processes, Ctrl+C copies the name and Ctrl+Shift+C copies details; when text is selected, Ctrl+C copies the selection first. (@digital-bombyx #161, #91, #150)
    - CSV export: Choose “Export current page as CSV…” from “More actions” on Processes, Services, Startup or Connections to export the complete list (including off-screen rows) while preserving column order, filters, sorting, display units and expanded groups. (#139)
    - Details pane: The “Resources” section adds peak working set, virtual address space, I/O rates and power usage; a new “Totals” section lists user and kernel CPU time, bytes by I/O category and page faults. The copy button at the top right copies all populated items by section.
    - Connections page: Supports collapsible grouping by app, expanding matching groups automatically while searching. Status filters for Services and Connections move into the “Status” column header; Connections also adds TCP, TCPv6, UDP and UDPv6 filters that combine with the status filter. (@digital-bombyx #152)
    - Delete services and startup apps: Adds “Delete” to the context menu to remove a service or startup entry after confirmation. Services in use are removed by Windows once stopped and released; startup folder entries move to the Recycle Bin, while packaged app startup tasks remain disable-only. (#114, #146)
    - Packaged app services: When Windows refuses to change a packaged app service’s startup type, Argus can write the setting to the registry after confirmation and marks entries that take effect after a restart. Error messages name the service and explain permission or protection limits. (@digital-bombyx #112, #168)
    - Memory readings: Hatching in the Performance memory composition bar marks compressed memory in use, with hover details showing estimated stored data and saved memory. Memory tooltips on Processes also clarify the scope of system usage, per-process private working sets and group totals. (@digital-bombyx #81, #122)
    - NPU: Performance displays the name, utilization and a 60-second live chart for each NPU identified by Windows, moving recognized NPUs out of the GPU list. (@SpookySandwich #140, #135, #148)
    - CPU charts and disk details: Overall/logical processor view switching and core type filters move into the CPU chart’s context menu; logical-processor charts keep readable proportions and omit clock speeds then titles when space is tight. Disk details display SMART raw values in decimal by default, and switching to hexadecimal applies to all disks and persists across restarts.
    - Hardware acceleration: “Settings → Animations” adds a “Hardware acceleration” switch, enabled by default. Turning it off switches UI rendering to the CPU immediately without using the GPU. (#127)
    - Touch: Supports tap, double-tap, swipe scrolling, press-and-hold menus and scroll-bar dragging on Windows touch screens. Forwarded touch taps activate main-window controls properly, and focused text fields bring up the touch keyboard as needed. (#73)
    - About page: Adds a “Copy diagnostic information” button to copy version, run state, hardware and display settings in one click for issue reports. New shortcut buttons beneath the website and GitHub cards link directly to downloads, the user guide, changelog, issues, discussions and releases.
    - Location of administrator programs: Privileged service, Task Manager replacement and administrator-mode binaries are now stored together in Program Files\Argus Privileged with fixed file names, keeping path-based security software exclusions valid across updates. When installing outside Program Files, an information icon on the installer page explains where these files are stored. (@digital-bombyx #154, #136, #159)
    Performance
    - Drawing: Updates, hover effects and clicks redraw only changed regions, significantly lowering GPU work when moving across lists or playing icon animations. In release-build benchmarks, scrolling the process list uses about 40% fewer CPU cycles per frame; with hardware acceleration off, scrolling and page switches also reuse already drawn content.
    - First readings: Shortens initial collection wait time after launch so the interface displays initial readings sooner. (@hayxe1 #119)
    Fixes
    - Blue screen from disk details: Checks the controller driver before querying temperature and NVMe health, preventing a blue screen when opening disk details on affected Intel RST VMD systems; skipped items appear as “Unknown”. If an abnormal exit occurs during or within two minutes after reading, automatic reads pause on the next start while still offering “Read anyway”. (#48, #133, #160)
    - Device sleep: Skips sensor queries for powered-off discrete GPUs on hybrid-graphics laptops to avoid repeatedly waking them, showing “Sleeping” and the reason on Performance. Idle hard disks retain their last temperature and skip temperature queries once spun down so they can stay asleep. (#147)
    - CPU readings: Calculates CPU usage from idle cycles, fixing inflated readings that counted the idle loop as load. Fixes missing clock speeds for hybrid processors on Windows 10 and Intel processors that failed to distinguish P-cores from E-cores. (#137)
    - GPU readings: Processes on integrated GPUs no longer count shared GPU memory as dedicated GPU memory. Without a hardware GPU, software rendering no longer counts as process GPU usage and Processes hides GPU columns. When a hardware GPU was detected at startup, driver updates or newly attached GPUs recover or appear without restarting.
    - Disk readings: Fixes USB external hard disks failing to read SMART data or reporting “Unknown” health, and drive letters of virtual drives such as Google Drive appearing under disk 0.
    - File locks: Fixes file-lock queries failing when the system has an unusually high handle count. Duplicate failure messages from the privileged service and local search are shown only once, and Argus no longer prompts to enable the privileged service when it is already installed.
    - Protection when ending processes: Refuses to end a target when Argus cannot verify whether it is a critical system process, covering single processes, batch actions and process trees. (@hayxe1 #77)
    - Processes page: Keeps column widths steady when searching or expanding and collapsing groups, and preserves row order when expanding child processes while hover-pause sorting is active. Fixes user-group rows not opening their context menu, double-clicking a selected row unexpectedly collapsing the details pane, and stray characters in program names and version strings.
    - Historical process jump: Verifies PID, name and start time when jumping from History to a process, avoiding selecting another process that reused the same PID. (@hayxe1 #76)
    - Service and startup lists: Automatically sizes columns to their contents, restores automatic width on border double-click and remembers manual widths across restarts. Unreadable startup states now display concisely as “Unavailable” in the Status column.
    - Privileged service and administrator mode: Fixes system folder misdetection that blocked enabling administrator mode or the privileged service. Missing service files show “Damaged” with repair or uninstall actions; power loss during updates or removal preserves usable service files, and uninstalling Argus cleans up files left after deregistration. (#111)
    - Task Manager replacement: Clearly displays “Replacement removed” in Settings and the welcome guide when security software or another program reverts the replacement. When the maintenance helper is terminated abnormally, the error includes its exit code.
    - Install and load security: The installer checks and protects eligible install directories so only administrators and the system can write to them; during a new interactive install, it explains why an unprotected location cannot be secured and lets you continue or pick another folder. Argus loads imported system DLLs only from the system directory and ignores same-named files in its run directory. (#136)
    - Window display: Fixes missing system transitions when maximizing or restoring, failing to stay maximized when reopened from the tray, and opening behind other windows on first launch or via Task Manager entry points. (#126, #142)
    - Scaling and scrolling: Fixes pages getting stuck at the bottom and unscrollable dialogs at system or interface scale levels such as 125% or 150%. Scale inputs now fit three digits cleanly, and column options and hints no longer clip descenders. (#164)
    - Menus and dialogs: Context menus and submenus dismiss immediately, while drop-down lists expand from and retract toward their triggers. Dialogs zoom and fade in from the window center, dim window button backgrounds while open, and shrink out on close. Fixes tooltips covering context menus and disabled items showing warning or hover highlights. (#141)
    - Layout: Fixes the Performance overview overflowing at the default window size; Settings expands appropriately in wide windows, and dialogs hide unneeded scroll bars when content fits.
    - Screen readers: Supports reading page headings, descriptions, performance readings and table cells, keeping controls accessible after page switches or refreshes. Settings switches and number inputs now take their accessible names from their setting titles. (#115)
    - Interface text: Trims redundant UI descriptions and standardizes CPU, GPU and I/O terms and hardware units across all languages; the Russian interface also revises error messages, grammar and unit spacing. (@Dimmitrius #93 #95 #96 #98 #100 #101 #102 #103 #104 #105 #106 #108 #109)
    Upgrading
    - Privileged service: Upgrading through the installer or in-app updater also updates the installed privileged service and Task Manager replacement copy. After replacing a portable executable, click “Update service” under “Settings → Permissions → Privileged service” and approve administrator authorization.
    - Location of administrator programs: After upgrading the installed version or updating the portable version’s service, existing privileged service, Task Manager replacement and administrator-mode copies migrate automatically to Program Files\Argus Privileged. Any path-based trust added in security software for the old path must be added once for the new path.
    - Page shortcuts: With the new “Components” page, Ctrl+7 opens Components, “Settings” moves to Ctrl+8 and “About” moves to Ctrl+9.
    - Settings and history: After upgrading, system history opens to the last 5 minutes by default and remembers new selections thereafter. A saved “UDP” status filter on Connections resets to “All” and can be reapplied in the “Protocol” column. Settings files now save only nondefault values, so unchanged options update automatically with future defaults.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    v0.6.0 换用全新的点阵性能图应用图标，重新设计主窗口界面，精简标题栏、重排页面栏与状态栏，并新增置顶显示按钮。新增“组件”页，可在托盘、桌面与任务栏实时显示系统读数；重构历史页，支持多轨道曲线、资源事件与跨次运行的进程观察。进程页新增资源泄漏提示与电源使用情况列，进程、服务、启动与连接页均支持内容复制与 CSV 导出，服务与启动项支持删除；性能页新增 NPU 监控，同时加入触屏操作与硬件加速开关。本版还大幅降低列表滚动与界面重绘开销，修复部分 Intel RST VMD 系统打开磁盘详情时触发蓝屏的问题，并避免唤醒已断电的独立显卡与停转硬盘。
    破坏性变更
    - 历史记录：本版改用新的存储格式，历史页仅显示 0.6.0 及之后记录的数据。升级后首次写入当日记录时，会替换当天的旧格式文件；旧版 Argus 也无法读取新版记录。
    - 特权服务协议：通信协议从第 11 版升至第 12 版。通过特权服务执行结束进程、调整 I/O 或内存优先级等操作前，须先更新旧版服务。
    新功能
    - 应用图标：换用全新的点阵性能图图标，针对不同尺寸单独排布点阵，在任务栏、标题栏与更新后的快捷方式中均保持清晰。关于页与首次启动引导先由点阵拼出标志，再转为最近 10 次 CPU 占用的动态点阵图；关闭“界面动画”时直接显示点阵图。
    - 标题栏：精简为仅保留应用标识、宽度自适应的搜索框与 Windows 标准尺寸窗口按钮，其余空白处均可拖动窗口。新增图钉按钮以切换“置顶显示”，状态在重启后保留。（#121）
    - 页面栏与状态栏：页面控件与“更多操作”移至导航标签旁，进程视图切换按钮改用图标。“更多操作”收纳“运行新任务…”（Ctrl+N）、“查找占用文件的进程…”与快捷键说明，服务页还可直接打开 Windows 服务管理器。状态栏提供暂停刷新与刷新频率按钮，版本号兼作更新进度与安装入口。（#87）
    - 组件页：新增“组件”页，集中管理托盘与后台常驻选项，并可开启桌面监控和任务栏监控（两者均默认关闭）。从托盘或监控打开设置时，侧栏自动定位到对应分组。
    - 实时托盘图标：托盘图标默认以“走势”实时显示 CPU 占用，也可切换为“占比”“数字”或“应用图标”；前三种实时样式在占用达到 80% 时以琥珀色提示。指针悬停时显示实时读数卡片，右键单击打开快捷面板，列出 CPU 占用最高的三个进程与常用操作。
    - 托盘卡片与快捷面板：悬停卡片按当前语言与字号自适应排版，关闭卡片后改用系统提示。单击快捷面板中的读数可直达性能页对应设备；从隐藏图标区打开面板时，该区域保持展开。（@digital-bombyx #113 #153）
    - 桌面监控：以桌面小窗口常驻显示实时读数，支持“横条”与“面板”两种显示方式，其中面板提供“列表”“曲线”“仪表”三种样式。拖动时自动限制在当前显示器工作区内，支持置顶显示、锁定位置、鼠标穿透与不透明度调节。
    - 任务栏监控：在任务栏常驻显示实时读数，提供“标签”“曲线”“胶囊”与“大数字”四种样式。可在组件页或右键面板实时预览并切换样式；右键面板还支持选择显示器、勾选读数与拖动排序，调整立即生效。（#28、#123）
    - 多显示器与窗口切换：所选显示器断开时，任务栏监控暂移至主显示器，重连后自动移回。单击任务栏监控或托盘图标，可在窗口未被遮挡时隐藏主窗口，或在窗口隐藏、最小化、被遮挡时将其调至前台；双击桌面监控可打开主窗口。
    - 监控读数：桌面监控与任务栏监控共提供 18 种读数，涵盖温度、频率、功耗与风扇转速。支持为每块显卡、磁盘与网卡单独勾选，并可拖动类别或单项读数排序。任务栏监控以设备颜色区分名称，同一 CPU 或 GPU 的后续读数直接标注参数名称。
    - 监控刷新间隔：桌面监控或任务栏监控开启期间，Argus 沿用主窗口的刷新频率进行采样。当最小化或后台常驻间隔与该频率不同时，设置页会注明当前实际间隔，同时保留监控关闭后恢复使用的间隔选项。
    - 历史页：全面重构为多轨道阶梯曲线图表，每条轨道均可叠加第二项读数。支持按名称或设备搜索读数，拖动调整轨道顺序与高度；轨道超出可视区域时可在图表内滚动查看。
    - 浏览历史曲线：滚轮围绕指针所在时刻缩放；缩放、单击曲线或拖选时段会暂停跟随最新读数。单击“回到最新”、右键单击图表或按 End 可恢复跟随。无记录时段以斜纹标示，最近 10 分钟按实际采样间隔显示。（#79、#129）
    - 历史曲线与游标：跟随最新读数时，阶梯曲线随时间持续推进，指针所在轨道的游标随曲线经过实时更新读数。切换时段或纵轴量程时曲线平滑过渡，叠加曲线淡入淡出；再次查看已打开过的较长时段时加载更快。
    - 时间范围与事件：下拉列表提供 5 分钟、3 小时、1 天、3 天与“自定义…”；在“自定义时间范围”对话框中可通过日历选定日期，或输入精确的起止时间。勾选“显示 30 天概览与事件”可查看按小时分布的热力图，并列出 CPU 高负载、内存紧张与记录空档等事件。
    - 历史进程表：支持搜索所选时刻或区间内的进程，按名称排序时分为应用、后台进程与 Windows 进程。展开同名分组可查看前四个实例及其余实例的合计；右键菜单支持在图表中叠加该程序的曲线，或复制名称与 PID。
    - 历史曲线提示：悬停在 CPU 等可按进程统计的轨道上时，提示框列出占用最高的五个进程；进程数轨道列出实例最多的五个程序及其余程序合计。温度、电池电量等读数仅显示设备数据。
    - 历史记录内容：新增 CPU 频率、功耗与温度、内存细分、电池读数，以及每块磁盘、显卡与每个网络适配器的独立读数。在“设置 → 数据与历史”中可按类别勾选记录项，选择每帧记录约 20 个、约 40 个或全部活跃进程，并实时查看预计每日占用空间。
    - 历史存储：支持分别设置时间与空间保留上限，先达到者生效；默认保留 30 天、上限 2 GB，超过 7 天的记录自动按分钟合并，保留平均值、峰值与占用最高的进程。更改保存位置时可选择是否一并迁移现有历史与观察记录；若目标文件夹已有其他文件，则自动存入其中的“Argus History”子文件夹。
    - 进程观察：在进程右键菜单或详细信息面板中选择“观察进程”，即可按运行实例持续记录同一路径程序的 14 项读数（涵盖内存、CPU、GPU、磁盘、I/O、网络、线程与句柄）；无法读取路径时仅观察当前实例。开始后自动进入“历史”下的“进程观察”，可切换各次运行实例，并以多轨道图表对比读数。（@hayxe1 #82）
    - 观察记录：最近 10 分钟按实际采样间隔显示，更早时段从磁盘读取。记录最多保留 7 天，达到容量上限时优先清理最早的数据；停止记录会保留已有数据，重启 Argus 后需重新开始观察。
    - 进程分组：“应用”“后台进程”“Windows 进程”与各用户分组以不同颜色区分。滚动列表时，当前分组标题固定在顶部，滚动条旁标出各组位置并显示当前组名。开启“隐藏系统进程”后，进程统计同时显示已隐藏的进程数。（#88）
    - 进程电源使用情况：新增“电源使用情况”与“电源使用情况趋势”两项可选列（默认隐藏），结合 CPU、GPU 与磁盘活动估算耗电水平。前者反映当前耗电等级，后者显示最近约两分钟的平均等级。（#134）
    - 进程优先级：右键菜单新增设置 I/O 优先级与内存优先级，详细信息面板及可选列同步显示。“基本优先级”改用类别名称展示，特殊值保留数字，排序仍按数值进行。（@digital-bombyx #80 #116）
    - 悬停暂停排序：指针悬停在进程列表上暂停排序时，排序列的表头显示暂停图标，状态栏同步提示“排序已暂停”。“设置 → 语言与外观”新增“指针悬停时暂停排序”开关，默认开启。（#86）
    - 资源泄漏提示：进程页自动检测句柄泄漏、子进程累积与残留进程，单击表头的琥珀色标记即可快速定位。详细信息面板列出判断依据、数量走势与处理建议，进程退出后标记随下次采样更新。支持按程序忽略提示，并可在“设置 → 语言与外观 → 资源泄漏提示”中恢复已忽略的程序或关闭该功能。
    - 复制表格内容：进程、服务、启动与连接页均支持通过右键菜单复制当前单元格内容、名称或详细信息。在进程页按 Ctrl+C 可复制名称，按 Ctrl+Shift+C 可复制详细信息；已选中文本时，Ctrl+C 优先复制所选文字。（@digital-bombyx #161、#91、#150）
    - 导出 CSV：在进程、服务、启动或连接页的“更多操作”菜单中选择“导出当前页为 CSV…”，即可导出完整列表（包含滚动区域外的行），并保留当前的列顺序、筛选、排序、显示单位与分组展开状态。（#139）
    - 详细信息面板：“资源”小节新增工作集峰值、虚拟地址空间、I/O 速率与电源使用情况；新增“累计”小节，展示用户态与内核态 CPU 时间、各类 I/O 字节数和缺页次数。右上角的复制按钮可按小节复制全部有读数的项目。
    - 连接页：支持按应用折叠分组显示连接，搜索时自动展开匹配的分组。服务页与连接页的状态筛选移至“状态”列的表头；连接页还新增按 TCP、TCPv6、UDP 或 UDPv6 筛选，可与状态筛选组合使用。（@digital-bombyx #152）
    - 删除服务与启动项：右键菜单新增“删除”操作，经确认后即可删除服务或启动项。正在使用的服务会在停止且释放后由 Windows 移除；启动文件夹中的条目将移至回收站，应用包启动任务仍仅支持禁用。（#114、#146）
    - 应用包服务：当 Windows 拒绝修改应用包服务的启动类型时，经确认可直接写入注册表，并在列表中标出需重启后生效的启动类型。操作失败时，提示会写明服务名称以及权限或系统保护限制。（@digital-bombyx #112、#168）
    - 内存读数：性能页的内存组成条以斜纹标出使用中的已压缩内存，悬停可查看估计存储的数据量与节省的内存。进程页的内存提示也分别说明整机占用、进程专用工作集与分组总量的统计范围。（@digital-bombyx #81、#122）
    - NPU：性能页为 Windows 识别到的每块 NPU 单独显示名称、利用率与最近 60 秒的实时曲线，并将已识别的 NPU 从 GPU 列表中移出。（@SpookySandwich #140、#135、#148）
    - CPU 图表与磁盘详情：CPU 的整体／多核视图切换与核心类型筛选移入曲线图右键菜单；多核视图的小图保持可读比例，空间不足时依次省略频率与标题。磁盘详情的 SMART 原始值默认以十进制显示，切换为十六进制后对全部磁盘生效并在重启后保留。
    - 硬件加速：“设置 → 动画”新增“硬件加速”开关，默认开启。关闭后改由 CPU 绘制界面、不再占用 GPU，切换立即生效。（#127）
    - 触屏操作：支持 Windows 触屏点按、双击、滑动滚动、长按打开菜单与拖动滚动条。远程转发的触控轻点也可正常激活主窗口内的控件，文本框获得焦点时按需呼出触摸键盘。（#73）
    - 关于页：新增“复制诊断信息”按钮，可一键复制版本、运行状态、硬件与显示设置，便于附入问题报告。官网与 GitHub 卡片下方新增快捷入口，直达下载、使用指南、更新日志、问题反馈、讨论区与发行版页面。
    - 管理员程序存放位置：特权服务、任务管理器替换与管理员运行相关程序集中存放于 Program Files\Argus Privileged 并采用固定文件名，安全软件按路径添加的信任在版本更新后继续有效。若安装路径位于 Program Files 之外，安装程序会通过信息图标说明上述文件的存放位置。（@digital-bombyx #154、#136、#159）
    性能
    - 界面绘制：刷新、悬停与单击仅重绘变化区域，指针移过列表或播放图标动画时的 GPU 开销明显降低。发布构建对照中，滚动进程列表的每帧 CPU 开销减少约四成；关闭硬件加速时，列表滚动与页面切换也会复用已绘制内容。
    - 首份读数：缩短启动后的首次采集等待时间，界面更早显示初始读数。（@hayxe1 #119）
    修复
    - 磁盘详情导致蓝屏：查询温度与 NVMe 健康信息前先检查控制器驱动，避免部分 Intel RST VMD 系统打开磁盘详情时触发蓝屏，被跳过的项目显示为“未知”。若读取期间或随后两分钟内异常退出，下次启动将暂停自动读取，仍可手动选择“仍要读取”。（#48、#133、#160）
    - 设备休眠：在混合显卡笔记本上跳过已断电独立显卡的传感器查询，避免反复唤醒，性能页同步显示“已休眠”及原因。机械硬盘空闲时保留上次温度读数，停转后跳过温度查询，不再妨碍硬盘休眠。（#147）
    - CPU 读数：CPU 占用改按空闲周期计算，修正将空闲循环计入负载导致的读数偏高。修复 Windows 10 上混合架构处理器频率缺失，以及部分 Intel 处理器无法区分性能核与能效核的问题。（#137）
    - GPU 读数：集成显卡上的进程不再将共享 GPU 内存计入专用 GPU 内存。无硬件 GPU 时，软件渲染不再计作进程 GPU 占用，进程页同步隐藏 GPU 列。若启动时已检测到硬件 GPU，更新驱动或接入新显卡后无需重启即可恢复或显示新读数。
    - 磁盘读数：修复 USB 外置硬盘无法读取 SMART 信息及健康状态显示为“未知”，以及 Google Drive 等虚拟驱动器盘符被错误列在磁盘 0 下的问题。
    - 文件占用：修复系统句柄总数过多时查询文件占用失败的问题。特权服务与本地查询因同一原因失败时仅提示一次；已安装特权服务时不再重复建议启用。
    - 结束进程保护：无法确认目标是否为系统关键进程时，拒绝执行结束操作，覆盖单个进程、批量操作与进程树。（@hayxe1 #77）
    - 进程页：搜索或展开、折叠分组时保持列宽稳定；悬停暂停排序期间展开子进程也维持原有行序。修复用户分组行无法弹出右键菜单、双击展开已选行时详细信息面板意外收起，以及部分程序名称与版本信息混入多余字符的问题。
    - 历史进程跳转：从历史页转到进程时同步核对 PID、名称与启动时间，避免误选复用同一 PID 的其他进程。（@hayxe1 #76）
    - 服务与启动列表：列宽改为按内容自动分配，双击列边界可恢复自动宽度，手动调整的宽度在重启后保留。无法获取启动项状态时，“状态”列简明显示为“无法读取”。
    - 特权服务与管理员运行：修复系统目录误判导致管理员运行与特权服务无法启用的问题。服务文件缺失时标示为“已损坏”并提供修复或卸载入口；更新或卸载期间意外断电时保留可用服务文件，卸载 Argus 时同步清理服务注销后的残留文件。（#111）
    - 任务管理器替换：当替换配置被安全软件等外部程序撤销时，设置页与首次启动引导会明确显示“替换已被撤销”。维护助手被异常终止时，错误提示会附带退出码。
    - 安装与加载安全：安装程序会检查并保护符合条件的安装目录（仅允许管理员与系统写入）；交互式新安装若无法保护所选位置，会说明原因并提供继续安装或更改位置选项。程序仅从系统目录加载所导入的系统 DLL，忽略运行目录中的同名文件。（#136）
    - 窗口显示：修复最大化与还原缺少系统过渡动画、从托盘重新打开时未保持最大化状态，以及首次启动或经任务管理器入口打开时被其他窗口遮挡的问题。（#126、#142）
    - 缩放与滚动：修复在 125%、150% 等系统或界面缩放比例下，部分页面滚动到底部后无法向上滚动以及对话框无法滚动的问题。缩放输入框现可完整显示三位数，列选项与操作提示的文字下缘也不再裁切。（#164）
    - 菜单与对话框：右键菜单与子菜单关闭时立即消失，下拉列表从控件位置展开并向原处收起。对话框改为从窗口中央放大淡入、关闭时缩小淡出，打开期间窗口按钮底色随遮罩一同变暗。修复悬停提示遮挡右键菜单，以及禁用菜单项仍显示警示色或悬停高亮的问题。（#141）
    - 界面布局：修复默认窗口尺寸下性能页概览显示不全的问题；设置页在较宽窗口中适当放宽内容宽度，对话框内容放得下时不再显示多余滚动条。
    - 屏幕阅读器：支持朗读页面标题、说明、性能读数与表格单元格，切换页面或刷新读数后控件仍保持可访问。设置页的开关与数字输入框改以对应设置项的标题命名。（#115）
    - 界面文案：精简冗余的界面说明文字，统一各语言的 CPU、GPU、I/O 术语与硬件单位；俄语界面同步修订错误提示、语法与单位间距。（@Dimmitrius #93 #95 #96 #98 #100 #101 #102 #103 #104 #105 #106 #108 #109）
    升级提示
    - 特权服务：使用安装程序或应用内更新升级时，已安装的特权服务与任务管理器替换副本会一并更新。免安装版替换主程序后，须在“设置 → 权限 → 特权服务”中单击“更新服务”并完成管理员授权。
    - 管理员程序存放位置：安装版升级或免安装版更新服务后，现有的特权服务、任务管理器替换与管理员运行副本将自动迁移至 Program Files\Argus Privileged。此前在安全软件中按旧路径添加的信任，需按新路径重新添加一次。
    - 页面快捷键：新增“组件”页后，Ctrl+7 用于打开组件页，“设置”调整为 Ctrl+8，“关于”调整为 Ctrl+9。
    - 设置与历史：升级后首次打开系统历史默认显示最近 5 分钟，此后记住新选择的范围。旧版连接页中保存为“UDP”的状态筛选会重置为“全部”，可在“协议”列重新筛选。设置文件现仅保存与默认值不同的项，保持默认值的选项将随后续版本自动更新。
