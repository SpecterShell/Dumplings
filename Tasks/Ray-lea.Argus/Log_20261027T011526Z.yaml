- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Fixes
    - Windows Explorer restart: Fixed the desktop and taskbar failing to recover when the old Explorer process gets stuck during exit cleanup or error reporting. If normal shutdown times out, Argus ends only the verified old instance and waits for it to exit before restoring the desktop. If Windows has already restored the desktop, Argus uses the existing Explorer instance instead of starting another. (#20)
    Upgrading
    - Upgrading from v0.3.x preserves existing settings and history.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    修复
    - 资源管理器重启：修复旧进程在退出清理或错误报告阶段卡住后，桌面与任务栏无法恢复的问题。正常退出超时后仅结束已确认的旧实例，确认其退出后再恢复桌面；Windows 已自动恢复桌面时使用现有实例，避免重复启动。(#20)
    升级提示
    - 从 v0.3.x 升级保留已有设置和历史记录。
