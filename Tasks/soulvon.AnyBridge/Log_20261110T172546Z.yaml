- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 修复：Antigravity 黑底 IDE 与白底客户端接入后，模型下拉看不到自己配置的模型、选中自定义模型也无法正常对话的问题。现在两端接入时都会把语言服务器一并指向本地网关，下拉会完整列出全部自定义模型
    - 修复：客户端自动升级后接入状态显示正常、实际却仍走官方通道的问题。新增自动保活，升级覆盖安装文件后会补回接管配置；停止接入时不会改动安装目录
    - 修复：多轮对话带工具调用或自动化脚本历史时，使用自建模型会中断会话的问题。现在这类历史可以跨协议转换，深度审查与多轮任务能连续运行
    - 修复：自定义模型数量较多时，选中某个模型却实际调用另一个模型的问题。现在每个模型都有独立标识，选择结果与请求路由一致
    - 修复：停止接入后黑底客户端界面一直转圈、加载不出来的问题。现在还原配置时不会破坏客户端的启动脚本
    - 增强：兼容更多旧版客户端，并适配不同用户名、自定义安装路径以及 Windows / macOS / Linux 三种系统；升级客户端后接入状态会自动恢复
    - 增强：发布前增加自动化校验，防止注入脚本损坏或凭据等敏感文件被提交
    - 修复：Windows 上证书信任升级后未对齐，导致部分客户端握手失败的问题
    - 其余功能不变，可直接覆盖安装
