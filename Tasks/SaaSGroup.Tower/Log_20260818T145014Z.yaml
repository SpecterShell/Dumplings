  Key: ReleaseNotes
  Value: |-
    New
    History: History now clearly identifies which commits a branch introduces relative to its parent at the fork point. License Account: The redesigned account window now shows license details and lets users manage device activations and invite team members. Tower Pro: Advanced features previously marked as Preview are now included in Tower Pro. Basic users can upgrade within Tower or start a Pro trial. Pro features include Graphite, Stacked Branches, Advanced Custom Workflows, Automatic Branch Management, and self-hosted service accounts.
    Improved
    Compare Tools: Added support for Beyond Compare 5 and improved the configuration of external diff and merge tools. Security: Self-signed certificates are now trusted only for accounts explicitly configured to trust their servers, rather than disabling TLS certificate validation globally. Trial Experience: Improved the trial-expired experience with updated content and recovery options. Performance: Tower no longer waits for service-account refreshes sequentially during startup. History: Improved performance in repositories with large conflicts, where mergeability checks could previously cause Tower to become unresponsive. Services: Improved repository loading across hosted and self-hosted services through server-driven pagination and more reliable redirect handling. Bundled Git: Updated Git for Windows to version 2.55.0.4.
    Fixed
    SSH: Fixed remote operations failing because Git configuration overrides were passed with invalid decorative quotes. OpenSSH: Fixed a crash that could occur when OpenSSH was unavailable, could not be found in PATH, or was only partially initialized. Git Configuration: Fixed a regression that could write literal quotes into committer names, signing configuration, safe directories, commit templates, and other Git settings. Tower also repairs affected values when possible. Compare Tools: Fixed external diff and merge tools failing to launch because their command paths were over-quoted. Changesets: Non-image binary files now display “Binary file differs” instead of an empty diff and no longer trigger repeated Git operations. Bookmarks: Fixed a crash that could occur when the bookmark selection changed while Tower was checking a repository. Branches: Parent branch settings now remain accessible in repositories with many refs. The Set Parent Branch dialog now lists valid candidates and preserves the branch’s stacked state when its parent changes. Graphite: Fixed parent branch validation incorrectly rejecting valid candidates or displaying an empty parent menu.
