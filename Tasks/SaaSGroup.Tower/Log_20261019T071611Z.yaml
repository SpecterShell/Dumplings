  Key: ReleaseNotes
  Value: |-
    Improved
    Working Copy: Improved performance and reduced memory usage when selecting very large files. Branches Review: Switching between branches stays responsive, even when a branch has many commits ahead of its base branch. Branches Review: Reduced memory usage in large repositories. Branches Review now refreshes only when shown and uses a lighter merge check.
    Fixed
    Diff View: Fixed Tower freezing for several minutes after choosing “Show Diff” for a very large diff. Branches Review: Fixed the commit list briefly showing commits from the previously selected branch when switching branches quickly. Services: Fixed missing GitHub, GitLab, and Beanstalk information. Pull requests again show their creation date and open in the browser; comments appear in the correct order; and Beanstalk lists SSH keys. Azure DevOps: Fixed pull requests on Azure DevOps Services being created in the wrong direction—from the base branch into your branch. License: Fixed an outdated “Activation expires” notice that could appear after a license renewal.
