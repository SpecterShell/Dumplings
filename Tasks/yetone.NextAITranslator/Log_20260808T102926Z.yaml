- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Major stability release: fixes freezes and progressive slowdown
    - Fixed the app becoming slower and slower the longer it ran, eventually freezing: an error-tracking session recorder leaked resources under this app's heavy UI updates and has been removed
    - Fixed random unresponsiveness where Submit and other actions did nothing for seconds or minutes: an internal blocking sleep could starve all app commands
    - Fixed streamed translations leaking event listeners every time a translation was superseded
    - Summoning the translator window now always brings it to the front, even over other apps' windows
    - Fixed windows staying throttled and unresponsive after being covered and revealed again
    - The API model selector is now a combo box: type any model name freely or pick from the filtered list
    - Added OpenRouter as a built-in provider with dynamic model listing
