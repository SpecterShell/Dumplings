Version: 5.12.0
Installer:
- InstallerUrl: https://fastcopy.jp/archive/FastCopy5.12.0_installer.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Added an option to Shell Extension to replace Explorer's standard drag & drop / paste with FastCopy. (Default: OFF)
    Various security enhancements.
      - Enabled CET Shadow Stack (/CETCOMPAT).
      - Enabled Control Flow Guard (/guard:cf).
      - Stricter DLL loading (added /DEPENDENTLOADFLAG:0x800).
      - (Already enabled: /GS, /NXCOMPAT (DEP), /SAFESEH (x86), /DELAYLOAD, /DYNAMICBASE, /HIGHENTROPYVA, SetDefaultDllDirectories)
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    在外壳扩展中，添加了将资源管理器的标准拖放／粘贴替换为 FastCopy 执行的选项。（默认关闭）
    多项安全性增强。
     - 启用 CET 影子堆栈（/CETCOMPAT）。
     - 启用控制流保护（Control Flow Guard，/guard:cf）。
     - 加强 DLL 加载安全性（/DEPENDENTLOADFLAG:0x800）
     - （此前已启用：/GS、/NXCOMPAT（DEP）、/SAFESEH（x86）、/DELAYLOAD、/DYNAMICBASE、/HIGHENTROPYVA、SetDefaultDllDirectories）
- Locale: ja-JP
  Key: ReleaseNotes
  Value: |-
    シェル拡張で、エクスプローラーの標準ドラッグ＆ドロップ／貼り付けを FastCopy に置き換えるオプションを追加。（デフォルト OFF）
    各種セキュリティ強化。
      - CET シャドウ スタック有効化（/CETCOMPAT）。
      - Control Flow Guard 有効化（/guard:cf）。
      - DLL ロード厳格化（/DEPENDENTLOADFLAG:0x800 追加）
      -（すでに有効化済は /GS, /NXCOMPAT(DEP), /SAFESEH(x86), /DELAYLOAD, /DYNAMICBASE, /HIGHENTROPYVA, SetDefaultDllDirectories）
