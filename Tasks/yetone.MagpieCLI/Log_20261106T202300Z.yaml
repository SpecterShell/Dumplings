Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Features
    - Search APIs marked as "mix" are now queried together and their result pages are merged. (#2845)
    - You can now set how many results a search returns, from 1 to 20. (#5545)
    Improvements
    - Claude thinking tokens are now counted as reasoning and shared with Claude Code when another protocol's model reasons. (#3430)
    - Tuned for you now weighs Magpie-routed models by provider price instead of model name. (#3435)
    Bug Fixes
    - Requests canceled by an agent are no longer counted as failures. (#2398)
    - Claude models on Copilot now use Copilot's pricing for 1-hour cache writes, billed at the 5-minute write rate. (#3435)
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Features
    - 标记为“mix”的搜索 API 现在会一起查询，并且它们的结果页会合并。(#2845)
    - 你现在可以设置一次搜索返回多少条结果，范围为 1 到 20。(#5545)
    Improvements
    - Claude 思考 token 现在会计为推理 token，并在其他协议的模型进行推理时与 Claude Code 共享。(#3430)
    - Tuned for you 现在按提供商价格而非模型名称对 Magpie 路由的模型进行加权。(#3435)
    Bug Fixes
    - 由智能体取消的请求不再计为失败。(#2398)
    - Copilot 上的 Claude 模型现在对 1 小时缓存写入使用 Copilot 的定价，按 5 分钟写入费率计费。(#3435)
