- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Arion 0.1.1 is the first stable release: local dictation, optional polishing and translation, an offline Pinyin keyboard, and opt-in clipboard history. It runs on Apple silicon Macs (macOS 14 or later) and Windows x64, under AGPL-3.0.
    Full announcement: https://arion.astrafoundry.si/blog/arion-0-1-1/
    This release
    - Hold a key to dictate in Chinese, English, or a mix of both. The sentence is typed at the cursor when you release.
    - Polishing is off until you turn it on. Voice translation has its own shortcut. Cloud models run only after you choose a provider and a model.
    - The Pinyin keyboard works offline, with local candidate ranking and vocabulary.
    - Clipboard history is off until you turn it on. It is encrypted on this computer.
    Known limits
    - Windows packages are not publisher-signed.
    - Multi-device sync is not available. Learning from your edits works in supported macOS editors.
    - Windows keyboard ranking uses recently committed text and does not read the cursor or window.
    - Clean-machine acceptance, an upgrade from an older published build, and real-service cloud and translation acceptance are still open.
    Checksums and the acceptance record are attached as SHA256SUMS and RELEASE-STATUS.md when the build finishes.
    Thanks to @stvlynn, @zacharyhaha, @AllenWriter, @gavi102803, and @liangchen-harold.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Arion 0.1.1 是第一个正式版本。语音听写、可选的润色与翻译、离线拼音键盘和可选的剪贴板历史都在本机运行。支持 Apple 芯片 Mac（macOS 14 及以上）和 Windows x64，以 AGPL-3.0 协议开源。
    完整公告：https://arion.astrafoundry.si/zh/blog/arion-0-1-1/
    本版内容
    - 按住快捷键即可听写中文、英文或中英混合句，松开后写入光标处。
    - 润色默认关闭。语音翻译使用独立快捷键。只有在你选择服务商和模型后才会使用云端模型。
    - 拼音键盘离线可用，带本地候选排序和词库。
    - 剪贴板历史默认关闭，开启后在本机加密保存。
    已知限制
    - Windows 安装包没有发布者签名。
    - 多设备同步尚未提供。根据你的修改学习词汇，目前只在受支持的 macOS 编辑器中可用。
    - Windows 键盘排序只参考最近上屏的文字，不读取光标和窗口。
    - 全新机器验收、从已发布旧版本升级，以及云端服务和翻译的实际服务验收仍待完成。
    校验和验收记录会在构建完成后附在 SHA256SUMS 与 RELEASE-STATUS.md。
    感谢 @stvlynn、@zacharyhaha、@AllenWriter、@gavi102803 和 @liangchen-harold。
