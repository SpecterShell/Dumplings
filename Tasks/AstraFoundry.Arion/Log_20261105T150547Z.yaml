- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Arion 0.1.2 fixes hotword-list text appearing in recognition drafts during quiet recordings or pauses after speech. It supports Apple silicon Macs (macOS 14 or later) and Windows x64, under AGPL-3.0.
    Bug fixes
    - Quiet recordings no longer send below-threshold audio windows to recognition, preventing the model from filling silence with the session hotword list.
    - If a transcript begins or ends with an ordered copy of two or more consecutive hotwords, Arion decodes the same audio once without hotword prompting and uses that result. A single matching hotword is kept. Cancellation and worker errors still stop the request.
    Known limits
    - Windows packages are not publisher-signed.
    - Multi-device sync is not available. Learning from your edits works in supported macOS editors.
    - Windows keyboard ranking uses recently committed text and does not read the cursor or window.
    - Clean-machine acceptance, an upgrade from an older published build, and real-service cloud and translation acceptance are still open.
    Checksums and the acceptance record are attached as SHA256SUMS and RELEASE-STATUS.md. GitHub publication does not publish the stable update channel; that is managed separately in the AstraFoundry admin.
    Full changelog: https://github.com/AstraFoundry/Arion/compare/v0.1.1...v0.1.2
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Arion 0.1.2 修复安静录音或句尾停顿时，识别草稿混入热词列表的问题。支持 Apple 芯片 Mac（macOS 14 及以上）和 Windows x64，以 AGPL-3.0 协议开源。
    问题修复
    - 安静录音中，低于语音阈值的音频窗口不再送入识别，避免模型用本次会话的热词列表填充静音。
    - 如果识别结果在开头或结尾按顺序复述了两个及以上连续热词，Arion 会对同一段音频去掉热词提示重新识别一次，并采用重识别结果。正常识别到的单个热词仍然保留；取消操作或识别进程报错仍会终止请求。
    已知限制
    - Windows 安装包没有发布者签名。
    - 多设备同步尚未提供。根据你的修改学习词汇，目前只在受支持的 macOS 编辑器中可用。
    - Windows 键盘排序只参考最近上屏的文字，不读取光标和窗口。
    - 全新机器验收、从已发布旧版本升级，以及云端服务和翻译的实际服务验收仍待完成。
    校验和验收记录附在 SHA256SUMS 与 RELEASE-STATUS.md。GitHub 发布不会自动发布稳定更新渠道，后者由 AstraFoundry 管理后台单独管理。
    完整变更： https://github.com/AstraFoundry/Arion/compare/v0.1.1...v0.1.2
