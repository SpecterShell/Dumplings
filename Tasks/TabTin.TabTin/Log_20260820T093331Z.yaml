  Key: ReleaseNotes
  Value: |-
    TabTin 内测版更新
    本次升级优化协作、通知、自动化、技能授权、计费与跨组织沟通体验。
    任务协作：Agent 任务支持邀请同事参与，或交给同事创建独立任务继续推进。
    工作台通知：优化桌面通知、侧栏提示和通知中心的分流，减少重复打扰。
    定时任务：优化列表、详情和运行记录展示，方便查看和追溯执行。
    技能授权：已验证的 MCP（模型上下文协议）服务支持统一授权与状态同步。
    AI 计费：统一模型调用的付款、额度与自备密钥规则。
    消息协作：支持添加外部联系人、外部私信和跨组织群聊。
