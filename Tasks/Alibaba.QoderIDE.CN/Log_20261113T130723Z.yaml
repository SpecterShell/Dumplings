  Key: ReleaseNotes
  Value: |-
    会话标签页新增运行状态显示
    功能
    - 会话运行状态直观可见：在标签页中直接查看会话运行状态，便于掌握任务进度并及时介入。
    - 会话标签页支持快捷键切换：通过快捷键左右切换会话标签页，便于快速浏览和处理多个任务。
    - 从 IDE 访问官网无需重复登录：从 IDE 打开官网相关页面时，可复用客户端登录态，减少重复认证。
    - 本地与远端插件分别安装：在 WSL/SSH 远端窗口中，插件仅安装到远端环境；在本地窗口中，插件安装到本地，避免安装位置混淆。
    - 新增“打开浏览器”入口：可在 IDE 的“更多操作”中一键打开浏览器，便捷访问外部页面。
    - 企业版用量信息更完整：用量面板新增 Enterprise 标签与额度刷新周期，便于了解当前套餐和额度刷新规则。
    优化
    - 优化失败重试时的提示与交互反馈，支持切换模型后使用新模型重试。
    - 支持在会话流中快速点击预览 .md 文件，提升 Markdown 内容的阅读体验。
    - 优化 Auto 模式下的代码搜索，减少不必要的搜索操作，提升任务执行效率。
    - 优化编辑器打开流程，减少界面卡顿，使文件打开更流畅。
    - 优化 Windows 历史会话恢复流程，缩短等待时间。
    - 完善异常重试与恢复机制，减少任务在异常后停滞的情况，提升 Agent 运行稳定性。
    - 提升配置保存与同步的可靠性，减少多窗口操作时设置被覆盖、插件开关状态丢失等问题。
    修复
    - 修复部分情况下重启后登录态与工作区信任丢失、历史会话无法恢复的问题。
    - 修复特殊环境变量导致会话面板一直显示连接中的问题。
    - 修复终端启动失败时反复自动重启的问题。
