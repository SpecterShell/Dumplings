  Key: ReleaseNotes
  Value: |-
    Qoder IDE 支持移动端远程控制
    特性
    - 移动端远程控制：离开电脑后，可通过 Qoder 移动端查看任务进度、处理确认请求、追加指令或停止任务，也可为 IDE 中已打开的项目新建 Agent 任务。

    - 自定义会话布局：可通过拖拽或标签页菜单，将会话在侧栏与编辑区之间自由移动，草稿、附件、模型选择和会话状态均会保留，方便边看代码边对话，或为长会话扩大阅读区域。

    优化
    - 支持为自定义模型配置最大输出 Token 数。
    - 对话框「优化输入」不可用时，会明确提示原因。
    - 聊天框用户提问不再固定在顶部；默认浅色主题下，用户消息气泡与回复更容易区分。
    - Agent 修改大文件时减少无关内容重写，降低编辑卡顿，同时降低保存和恢复大量编辑记录时的内存峰值。
    - 减少发送带图片消息时的重复上传和准备开销。
    - 优化内置浏览器打开和关闭新弹窗、新标签页时的处理，减少页面状态丢失。
    - 改善语音连接对系统受信任证书的兼容性，减少使用企业证书或代理时的连接失败。
    - 行内 Diff 中被删除的内容可随编辑器布局完整显示，并支持选中复制，方便审查时保留部分原文。
    - 优化 IDE 打包策略，减小安装包体积，加快启动速度。
    修复
    - 修复本地 AI 服务断连或持续连接失败后无法自动恢复，导致聊天面板长期不可用的问题。
    - 修复 Windows 更新中断后可能无法启动或快捷方式失效的问题。
    - 修复终端命令结束后仍持续等待、提示符缺失影响后续命令的问题。
    - 修复较大的编辑历史无法恢复的问题。
    - 修复断网重载或重新打开历史会话后，因旧状态残留而无法接受改动的问题。
    - 修复换行符变化后，选择「保留当前内容」仍无法接受改动的问题。
    - 修复删除空文件后无法继续查看下一个文件的问题。
    - 修复多张截图一起发送时被误判为消息过大的问题。
    - 修复复制历史消息中的失效图片会导致输入框崩溃的问题。
    - 修复调整输入框高度后，图片删除按钮被裁切、多余空白未及时释放的问题。
    - 修复打开历史会话时，未发送的草稿丢失的问题。
    - 修复将搜索编辑器中的选中文字加入对话时，因缺少文件位置而报错的问题。
    - 修复内置浏览器页面加载失败时被欢迎页遮挡的问题。
    - 修复部分任务信息导致专家团全景图渲染崩溃的问题。
    - 修复交互组件没有可滚动内容或已滚到边界时，外层会话无法继续滚动的问题。
    - 修复开启终端鼠标滚轮缩放字体后，缩放受滚动位置限制的问题。
