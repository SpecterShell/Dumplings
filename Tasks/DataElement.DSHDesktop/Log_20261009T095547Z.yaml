  Value: |-
    DSH Desktop v0.11.1 — 工作台默认启用，完善市场体验与首次启动引导
    更新内容
    - 工作台默认状态：首次使用或尚未设置偏好的用户现在默认启用工作台；在「常规」设置中明确关闭工作台的用户仍保持关闭，原有选择不会被覆盖。
    - 工作台市场英文界面：工作台市场及宿主相关界面新增英文文案，并可随宿主语言显示；切换语言时，目录条目和搜索、筛选状态不依赖翻译后的标签。
    - 工作台开发文档：新增英文版开发规范、六步快速入门和市场收录标准，并随应用提供离线文档。文档页支持中英文语言切换；市场界面可访问英文指南。
    - 品牌图标：各语言版 README 统一改用圆角 SVG 标志，替换原有 PNG 图像资源。
    问题修复
    - 首次启动提示：恢复首次运行时的引导提示，并将用户确认状态写入安装级状态文件，避免应用重启后重复提示。确认状态保存失败时会显示明确的重试提示。
    - 工作台卡片恢复：改进对加载失败或失去关联的工作台卡片的处理，减少异常卡片残留或无法恢复的情况。
    - 工作台导航状态：修正导航高亮与折叠状态下的标题显示，使当前工作台和折叠后的市场区域更易辨认。
    - Profile 可选组件：生成或投影插件代际配置时保留 Profile 原有的可选 bundle 选择，避免安装提供的可选组件被意外移除。
    性能与优化
    - 工作台标题拖动区域：扩大工作台标题栏的可拖动区域；折叠后的标题栏以及折叠市场上方的拖动条也可用于拖动窗口，并调整了折叠市场标题与内容的对齐方式。
