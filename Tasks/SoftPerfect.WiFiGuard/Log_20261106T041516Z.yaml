  Key: ReleaseNotes
  Value: |-
    - Added: Row spacing option in the View menu (Compact, Standard, Expanded).
    - Added: CIDR notation support for custom IP ranges, e.g. 192.168.1.0/24.
    - Improved: Modernised user interface with a new status bar, device cards and icons.
    - Improved: Faster network scanning, with all device queries running in parallel.
    - Changed: The Linux version now uses GTK 3.
    - Changed: 32-bit Windows is no longer supported.
    - Fixed: The device list being cleared when a new device joined the network.
