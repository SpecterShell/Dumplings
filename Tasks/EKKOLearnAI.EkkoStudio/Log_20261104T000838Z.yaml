  Value: |-
    Ekko Studio 0.8.15 更新日志
    日期：2026-11-04
    1. 修复工作流新节点选择 Agent 或编辑标题后消失的问题，避免旧尺寸覆盖画布状态，并保持连线新建与撤销行为一致 (#3670)
    2. 定时任务展示账户内所有 BOT 的计划，不再截断为 50 条；增加所属 BOT 头像、名称、目标预览及完整指令、时间表达式、时区、状态和下次执行详情，跨 BOT 编辑保留原归属和后台任务名称 (#3663)
    3. 修复 OpenAI 兼容接口流式工具调用续传空 id 或函数名时丢失已知身份、误报 invalid_tool_call 的问题，保留参数拼接与缺失身份校验 (#3647)
    4. 群聊路由未选择目标 Agent 时不再误报“交接信息可能不完整”；已选择 Agent 的交接提醒保持原有规则 (#3626)
    5. 前端更新日志仅保留最近三个版本，同步精简全部 12 种语言的旧日志条目 (#3662)
    6. 更新中英文 README 产品截图，展示实际运行界面的新建对话 Agent 轮播、可视化工作流和完整 Agent 管理器，移除过期示例图 (#3661)
    7. 开发与 CI 的任务报告及测试产物改为存放在仓库 worktree 之外，新增目录管理命令和只读位置检查，并同步覆盖率、浏览器报告及上传路径；检查不会自动删除文件 (#3657)
    范围：v0.8.14（3c0ba9f90d243b159431ce700818871ef86177b4）→ 内容基线 4f06db2c779746f735d724a5873513e8527c1e71。共 7 个已合并 PR，区间无独立回滚提交；发版准备 PR #3671。
    桌面 Hermes runtime 沿用 0.22.5，源码固定 v0.22.5 / bf0203a794a07aac3ff764972ab9087baa4e4f4e。Android 与 MCU 不在本轮范围。
