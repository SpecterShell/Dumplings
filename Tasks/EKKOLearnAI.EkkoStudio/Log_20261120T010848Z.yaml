  Value: |-
    Studio 0.8.29
    本版基于 3fac62347eeb7157f54a0f69977aa5324b94d0a3，上一正式版为 v0.8.28。
    - 聊天中的审批和澄清提交后会收到确认。Studio 右上角可处理账号关联的各个 Profile 的聊天审批、澄清及工作流审批，并在重新连接后刷新待处理请求。 (#3886)
    - 插件中心新增第三方插件风险提示。启用时会提示确认，安装、更新或切换来源时会显示可用的作者和仓库信息，并提示已启用的插件可能立即运行新版代码。 (#3879)
    - Person 的后台任务结果会在所依赖的其他任务处理完后继续回传。Studio 重启后可恢复等待中的结果，重试时会避免重复回传。 (#3869)
    - 修复 Agent 管理因单个插件状态检查卡住而无法加载的问题。新建单聊时，即使可用性还在检查或检查失败，仍可选择内置 Ekko。 (#3874)
    - 修复群聊中 Agent 交接后可能无法使用已配置 Provider 的问题。Hermes 和 Ekko 接手时会按发起者账号和接收 Agent 的 Profile 查找模型。 (#3875)
    - 审批 Hermes 记忆写入时，按当前 Profile 的记忆配置检查容量限制和启用状态。 (#3872)
    - 修复 Hermes 执行进程已退出时，重新连接会话可能误报失败的问题。查询会话状态时也会避免启动已退出的进程。 (#3867)
    - 修复 Hermes 通过 Amazon Bedrock 连接模型时，可能因 TLS 初始化顺序而无法建立 HTTPS 连接的问题。 (#3878)
    本版经发版 PR #3887 合入。
