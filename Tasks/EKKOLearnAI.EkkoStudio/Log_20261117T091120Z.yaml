  Key: ReleaseNotes
  Value: |-
    更新日志
    1. App 插件页面可通过局域网及云端中继连接实时会话，支持打开、命令、关闭、流式事件及确认，沿用账户和 Profile 权限校验；需配套更新 App 与云端中继 (#3839)
    2. 修复 Antigravity 已输出非空回答并以状态码 0 正常退出时仍被标记失败的问题；空回答、非零退出及显式错误仍按失败处理 (#3830)
    3. 修复本地 Desktop 插件调用 host.browser 时无法连接内置浏览器的问题，本地和远程模式共用已登录主窗口的账户/Profile 中继，保留租约和导航撤销校验；需同时更新 Desktop 与 Web UI (#3843)
    4. 插件 SDK 的实现、公开类型、harness、模板及全部指南改用 MIT 许可，CLI 分发和新建项目携带 LICENSE、NOTICE 与贡献者署名，插件业务代码许可仍由作者决定 (#3841)
    5. 移除内置版本预览页面、接口及进程管理，改由独立插件提供；旧预览地址跳转通用插件中心，保留旧预览磁盘数据和正式 npm 升级能力 (#3845, #3849)
    6. 插件中心、详情、页面和导航支持清单中的 12 种语言翻译，依次回退基础语言、英文及原字符串，兼容旧插件和旧市场目录；切换语言重新加载插件页面，阿拉伯语使用从右到左布局 (#3845)
    7. 插件设置侧栏支持包内图片 Logo，视图移入设置后旧插件链接自动跳转；新 SDK 项目及检查要求全部 12 种语言的名称、描述、页面和显式导航标题 (#3845)
    8. 修复 DeepSeek 经统一网关工具续传时丢失思考内容的问题，流式及非流式响应均支持保存与重放并兼容旧历史；将上游 SSE 保活转换为 Responses 进行中事件，减少等待时被误判中断 (#3852)
    9. 修复单个 Provider 刷新被无关 OAuth 凭证缺失阻断、共享模型缓存被旧 Profile 清理的问题；全局刷新跳过不可用授权并保留可用目录，刷新和恢复按账户共享目录及默认模型保护处理 (#3850)
    10. 修复账户 Provider 更新、删除和清除凭证后仍使用旧密钥或模型的问题，正确处理内联密钥、环境变量和独立 OAuth 槽位，同步各 Profile 的网关投影；保留其他 Provider 共用凭证及其他账户数据 (#3850)
    发布信息
    - Web UI / Desktop：0.8.26
    - 基线：9a0a2b891116f0a73e6772c74fdc8b3226e857ff
    - 发版 PR：https://github.com/EKKOLearnAI/ekko-studio/pull/3853
    - 完整变更：https://github.com/EKKOLearnAI/ekko-studio/compare/v0.8.25...v0.8.26
    兼容性与验收边界
    - App 实时插件会话需要配套 App 和云端中继版本；仓库合并不代表用户已安装或生产已部署。
    - 本地插件浏览器修复需要同时更新 Desktop 与 Web UI。
    - 自动构建、签名和清单核验不能替代各平台实际安装、首次授权、真实 Provider 全组合或旧版升级验收。
