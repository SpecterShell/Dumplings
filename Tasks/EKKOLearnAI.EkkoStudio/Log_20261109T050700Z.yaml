  Key: ReleaseNotes
  Value: |-
    Studio v0.8.20
    1. 为 Person 待处理投递计数增加按来源会话查询的索引，减少大数据量时的全表扫描；兼容无效的旧 JSON 数据，不改写历史记录 (#3723)
    2. Ekko 的 OpenAI Chat 请求将系统指令按原有顺序合并到开头的一条 system 消息，改善严格聊天模板兼容性，并保留普通消息、工具、图片和推理内容 (#3728)
    3. DSH 升级先在独立目录安装确定版本，检查运行时组合、依赖和 ACP 初始化，通过后才切换；失败时保留当前安装与版本锁定，已有可用 CLI 可作为恢复目标 (#3730)
    4. Agent 管理新增 DSH 精确版本安装与锁定、显式切换 latest、重新检查并恢复上一版本，以及适配器和已验证版本信息；自动更新尊重锁定版本 (#3730)
    5. DSH ACP 适配器更新到修订版 5，兼容已验证的 0.2.1-rc.5 与 0.2.2-rc.1 结构，保留原生初始化、预设选择与恢复、权限策略和回合保存；缺失关键能力时明确拒绝启用 (#3730)
    6. 修复群聊全局 Agent 的模型与推理强度设置在新增、编辑或重启后丢失的问题；此前已经丢失的选择需重新设置 (#3730)
    7. Antigravity 原生配置和技能链接遇到 EPERM、ENOTSUP 或 EINVAL 时改用独立运行副本，保留原生设置；副本是本次运行的快照，不会自动同步后续凭据变更 (#3730)
    涉及 PR：#3723、#3728、#3730；发版准备：#3731。
