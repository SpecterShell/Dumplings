  Key: ReleaseNotes
  Value: |-
    [0.8.1] - 2026-11-14
    Added
    - Backtest history supports selecting records for batch deletion, including select-all on the current page.
    Changed
    - The auto-login checkbox and legal consent sit next to each other on the login form.
    - Own-brand builds no longer show the PTrade fund-account hint that only applies to customer brands.
    Fixed
    - Subscription status is re-checked while the app stays open, so an expired account no longer keeps showing "Premium" and premium features until the app is reopened or the window refocuses.
    - Admin user lists, statistics, and CSV exports now treat a subscription as expired from its exact end time instead of waiting for the background cleanup to run.
    - Refunded or recycled accounts are shown as expired on the desktop instead of still displaying the premium badge.
    - Development builds no longer report a server start timeout when the cold start exceeds eight seconds.
