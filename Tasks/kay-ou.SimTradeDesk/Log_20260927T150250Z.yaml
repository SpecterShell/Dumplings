  Key: ReleaseNotes
  Value: |-
    [0.7.11] - 2026-09-27
    Added
    - Multiple branded clients can now be installed on the same device, with fully isolated sign-in state and data.
    - Admins can configure session timeout per brand from the admin portal.
    - New admin roles with per-brand scope: super admin, brand admin, and brand operator.
    - Low-code template version deletion.
    Changed
    - Low-code strategy export now delivers ready-to-run files matching the official PTrade format; the backtest range and capital follow your current settings.
    - Refreshed result panel visuals.
    Fixed
    - Fixed sign-in state leaking between branded clients installed on the same device.
    - Backtest startup now reports the concrete reason when access verification fails (subscription tier, expired sign-in, or unregistered device) instead of a generic error.
