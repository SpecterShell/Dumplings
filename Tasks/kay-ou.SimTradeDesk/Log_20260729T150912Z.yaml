  Value: |-
    [0.7.10] - 2026-07-29
    Changed
    - Refresh backtest date ranges and low-code field/index catalogs immediately after market-data downloads complete.
    - Harden Tencent Windows publishing for the zhengguan and customer-test brands with COS-backed artifacts, checksum verification, retry-safe uploads, and downloadable landing pages.
    - Strengthen cross-platform embedded SimTradeAPI packaging and package launch contracts.
    Fixed
    - Resume existing market-data download tasks when the drawer reopens or a duplicate request conflicts, and recover authoritative task state after WebSocket interruptions.
    - Deduplicate concurrent strategy source, history detail/log, and low-code catalog requests to avoid redundant calls and stale UI refreshes.
    - Stabilize release UI smokes by dismissing the expected startup data drawer before real workbench input and retrying transient CDP polling failures.
