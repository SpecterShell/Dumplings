  Key: ReleaseNotes
  Value: |-
    [0.8.3] - 2026-11-23
    Changed
    - Align desktop, API, and customer authentication permissions with each brand's Basic and Premium feature policy; administrator roles do not unlock disabled brand modules or bypass vendor license limits.
    - Require Premium to create or execute live.py and export PTrade live strategies, while keeping existing local strategy files editable according to each brand's access policy.
    - Allow expired own-brand users to edit local strategies while blocking strategy execution and protected history and data access.
    Fixed
    - Treat failed authorization or feature-policy queries as temporarily unavailable permissions rather than granting Basic access or incorrectly reporting an expired subscription; retry failed feature-policy requests.
    - Bound API authorization caching by the server-provided subscription expiry and preserve full UTC timestamps in access decisions.
    Added
    - Add automated permission acceptance across own and customer brands, Basic, Premium, and expired users, including API, authentication, strategy delivery, and desktop browser coverage.
