Version: 1.6.6
Installer:
- Architecture: x64
  InstallerUrl: https://tokeny-ai.com/app-api/version/download?softwareCode=tokeny&platform=windows&arch=x86_64
Locale:
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新功能
    - 套餐用量更直观：完善阿里云 Token Plan 接入，支持的渠道可查看套餐剩余用量、5 小时／7 天使用情况及重置时间，方便安排使用。
    - 新增魔搭模型接入：支持魔搭 ModelScope 的对话、识图、图片生成和图片编辑模型，同时更新小米 MiMo 等模型配置。
    - 新增快速会话：无需先创建工作空间，即可打开独立小窗口开始对话。支持从 Windows 文件夹右键启动，保留聊天记录和文字草稿，也可随时加入工作空间继续使用。
    优化
    - 模型管理升级：重新整理模型与渠道设置，同一渠道最多可配置 20 个 API Key，支持单独验证、启用和排序，遇到限流等异常时自动尝试其他可用密钥。已保存的密钥可查看和编辑，验证状态在重启后保留。
    - 技能和项目规则更灵活：技能可安装到所有项目或仅当前工作空间，方便不同项目使用不同能力。支持通过 /init 创建或更新项目规则，并保留已有的手动要求。
    - 文件修改更容易检查和撤销：更完整地记录 AI、脚本和命令产生的文件变化，支持逐项或全部接受、撤销，并可查看 Word、Excel、PPT 文件修改前后的历史内容。
    - 兼容已有 Git 项目：已有代码仓库及其子目录可直接使用版本管理，恢复文件时保留原有分支和暂存内容，减少与日常代码管理的冲突。
    - 知识库整理和搜索更方便：工作空间文件可右键添加进库，支持批量导入、选择存放位置和处理重名文件；同时改善分类、Markdown 编辑以及聊天记录和知识库的中文搜索。
    - 网页预览更顺畅：本机运行的网站可直接在 Tokeny 内打开，HTML 文件修改后自动更新预览，减少来回切换浏览器和手动刷新。
    - 长对话和复杂任务更稳定：加快长对话内容整理，优化任务中断后的重试与继续执行，减少重复操作，并让超时、限流、余额不足等提示更清楚。
    - 大图和多图输入优化：改善大图片和多张图片的处理方式，减少因输入过大导致的失败，同时保留原图供后续查看和分析。
    - 日常使用更流畅：减少切换工作空间、刷新文件目录、加载技能和知识库时的卡顿与重复加载，改善文件列表更新和语音输入的稳定性。
