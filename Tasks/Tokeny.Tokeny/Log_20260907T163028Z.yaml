Locale:
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新功能
    - 自 1.5.7 正式版以来的更新，主线是正式换上 Tokeny 自研的 Agent 内核，重新梳理多步骤任务的执行、审批、停止和记录保存，同时带来全新的 Markdown 编辑体验与独立阅读器，并对「库」、模型配置和日常使用中的稳定性问题进行了一批改进：
    - 自研 Agent 内核：Tokeny 现在有了自己的 Agent 执行引擎，多轮推理、工具调用、子任务协作、等待确认和停止执行，都由自研内核统一管理。日常对话、定时任务和 IM 助手等入口同步接入新的执行体系。读取文件、搜索内容等符合条件的只读操作可以并行处理，AI 查看多份资料、梳理代码时，减少逐项等待。
    - 任务执行与记录：重新梳理任务的执行状态和审批关系，停止、确认等操作会准确对应到当次任务，避免旧审批卡片影响新任务。修复子任务还在执行、卡片却提前显示完成，以及历史工具卡片丢失、回复重复显示的问题；异常退出后会整理遗留任务状态，并尽量保留已经生成但尚未完成的回复。
    - 独立 Markdown 阅读器：新增独立的 Markdown 阅读与编辑窗口。安装后可以在系统「打开方式」里选择 Tokeny，也可以设为 Markdown 文件的默认打开程序，无需先把文件放进工作空间。阅读器带有最近文件列表，支持自动保存、外部修改提示，以及把当前文档复制到指定工作空间，临时打开一份文档也能直接开始阅读和编辑。
    - 「库」标签与检索：网页剪藏、导入文件、图片视频、PDF 和笔记等内容，现在都能在标题下面统一管理自定义标签，重新索引也会保留手动整理的结果。搜索框支持输入 #标签 筛选资料，输入时自动补全已有标签，还能组合多个标签和关键词进一步缩小范围；详情页布局同步精简，内容和常用操作更集中。
    优化
    - PDF 正文提取：增强异常 PDF 的处理能力，个别页面解析失败时，会保留其他页面已经提取的正文；解析异常时也会尝试调用已启用的 OCR 继续识别，减少资料入库后只能搜到标题、搜不到正文的情况。
    - 思考强度与模型配置：思考强度调整移到输入框的模型名称旁，通过滑块即可切换，档位按照当前模型实际支持的能力显示，支持关闭思考的模型也能直接关闭。AI 模型配置面板同步简化，并支持按渠道单独设置请求超时，方便适配不同模型服务和代理渠道。
    - 长回答与模型兼容：重构模型请求的超时处理，改善长时间思考、持续生成长回答时被过早中断的问题。改进流式响应兼容性，修复部分服务或代理渠道丢失工具调用事件的问题；模型响应意外截断时会按异常处理，避免把没说完的回答误认为正常完成。
    - 稳定性与其他：修复在一个会话里输入内容时，另一个会话任务结束可能把当前输入框清空的问题；修复 AI 连续提问时卡片无法继续、提交的答案没有正确回显的问题；修复微信、飞书等已接入渠道可能收不到回复，以及消息往返后桌面会话没有及时更新的问题，工作空间列表中的 IM 助手入口也补齐了平台图标、名称和连接状态。
    重构
    - Markdown 编辑重构：Markdown 编辑器整体换成边写边预览的方式，光标所在位置显示可编辑的 Markdown 语法，其他内容直接呈现排版效果，标题、列表、图片、表格、公式和流程图都能在同一处查看和修改。同时改进中文输入、自动保存和外部文件更新时的光标与滚动位置保持，减少编辑过程中光标跳走、页面突然回到顶部的问题。
