  Value: |-
    Everyday Polish

    Improvements
    - Plugin pinning guide: The illustration now matches your interface language and light or dark theme. It shows how to open pinned plugins from More in the left sidebar.

    Fixes
    - Fixed an issue where some marketplace plugins had no app entry point after installation and authorization.
    - Fixed an issue where marketplace plugin introductions were repeated in the Description section.
    - Fixed an issue that could prevent Qoder from starting after a fast update on per-user Windows installations.
    - Fixed an issue where some failed model requests showed only a generic error.
