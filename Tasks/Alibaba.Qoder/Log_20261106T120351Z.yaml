  Key: ReleaseNotes
  Value: |-
    Everyday Polish

    Improvements
    - Website sign-in continuity: Supported website pages opened from a signed-in Qoder app can use the current account, reducing repeated sign-ins when viewing usage, upgrading a plan, and performing related actions. Available for Global and CN; excludes self-hosted deployments.
    - Remote Control: Syncs task-wide pin and unpin actions in both directions between desktop and the companion mobile client, making it easier to follow the same tasks across devices. Pins within a workspace and manual ordering on each device keep their own settings.
    - Credits confirmation: Clicking “Continue” in supported quota notices explicitly authorizes Credits usage for that continuation request. The confirmation can also be sent through mobile remote control and does not automatically carry over to later messages.
    - Plan execution: Improves the descriptions and presentation of “Execute as planned” and “Execute this plan in Goal mode,” making it easier to choose the appropriate execution approach.

    Fixes
    - Fixed shared add-on Credits usage displays when no individual cap is set or no quota is available, and added explanations for these states.
    - Fixed corrupted local plugin installation records also preventing basic conversations from continuing, while preserving the original plugin records and enablement settings.
    - Fixed some notices for conversations that cannot continue still offering an ineffective retry action. The relevant notices now let you open a new task directly.
