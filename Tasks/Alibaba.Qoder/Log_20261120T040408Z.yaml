  Key: ReleaseNotes
  Value: |-
    Connect Your Devices Across Networks

    Features
    - Device connections and Remote Control: Connect devices signed in to the same account across different networks. Enable Allow control on the target device to access the workspaces and tasks you have permission to use.
    - Conversation and file sharing: Select completed messages from a local or synced remote conversation. Save the selected messages and output files to your device, or send them to a discussion you can post to or an Issue in the same project.
    - Issue collaboration with Agent Teams: If your account supports project collaboration, you can assign Issues to Agent Teams, reassign them, and see which runs need human intervention. Starting a run from a comment preserves the original Issue assignment.
    - Plugin and skill sharing: Where public marketplace sharing is available, you can share eligible plugins and standalone skills by link. Recipients can preview and install them from the link.
    - Password-protected Office documents: Open supported Word and Excel files with their password, edit them, and save them with encryption intact.
    - PAC proxies: Configure a PAC proxy using a URL or a local file. Diagnose connection issues from the sign-in screen or Settings.

    Improvements
    - Remote workspaces: New tasks use the selected device, and you can upload attachments before sending a message. If a managed SSH connection drops, tasks already accepted by the remote host can continue running.
    - Models and files: Set an output limit for supported custom models.
    - PPT plugin: Native charts can now embed editable Excel data.

    Fixes
    - Fixed issues where some conversations would not open, plans awaiting approval could disappear from view after a restart, and attachments could be lost when retrying messages containing text and images.
    - Fixed display issues in remote Office files after a save conflict or refresh. Also fixed some installation and update failures on Windows and an issue that prevented subsequent updates on Linux DEB and RPM installations.
