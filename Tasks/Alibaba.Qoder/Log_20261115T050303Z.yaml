  Key: ReleaseNotes
  Value: |-
    Everyday Polish

    Improvements
    - Task titles: Improves automatic title generation to summarize task content and produce results in a consistent format.
    - File change previews: Improves preview updates after edits and writes, showing diff summaries and added or deleted line counts more promptly.

    Fixes
    - Fixed invalid file snapshots or malformed content-replacement records preventing an otherwise valid conversation from continuing.
    - Fixed some initialization flows failing when the local device identifier record was missing or empty.
    - Fixed reasoning effort levels and support for disabling reasoning not being recognized correctly in some custom model catalogs.
