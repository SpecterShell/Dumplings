  Key: ReleaseNotes
  Value: |-
    Everyday Polish

    Improvements
    - Remote device control: Improved synchronization of background task progress and end states on remotely controlled devices, and fixed pairing failures caused by differences in device clocks.

    Fixes
    - Fixed issues with preflight checks, resuming or forking older conversations, and reconnecting after host address changes in some Remote SSH workspaces.
    - Fixed an issue where conflicting, corrupted, or unreadable local MCP configurations could block conversations and automations.
    - Fixed an issue where saving image attachments across file systems could fail, preventing some messages containing text and images from being sent.
    - Fixed an issue where some plugin sharing, import, or installation failures showed only a generic message. More specific failure reasons are now provided.
    - Fixed an issue where the mobile app did not promptly show tool progress during some remotely controlled background task runs.
