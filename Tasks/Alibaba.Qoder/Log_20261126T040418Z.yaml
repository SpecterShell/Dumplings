  Key: ReleaseNotes
  Value: |-
    Cross-Device Collaboration and Cloud Tasks

    Features
    - Cloud tasks: Create or continue cloud tasks in the desktop app, track progress, and view generated files.
    - Cross-device collaboration: Download files from a workspace on a connected device and manage automations on that device according to your permissions.
    - Local task recovery: Resume eligible unfinished tasks on your device after quitting or updating Qoder.
    - Managed device sign-in: Enterprise administrators can restrict sign-in on managed devices to enterprise accounts from approved organizations.

    Improvements
    - Archived local tasks can now be restored or deleted by group. Bulk deletion from search results applies only to matching items.
    - Extra-large text is now available for conversations and the message box. Interface scaling can be set independently to 125%.

    Fixes
    - Fixed installation failures affecting some plugins after a data directory migration. Also fixed an issue that prevented some plugin background services from starting in restricted Windows environments.
    - Fixed an issue where a background disconnect could block the next automation run even after the previous run had saved its results.
    - Fixed an issue that prevented conversations from starting with a valid model selected.
    - Fixed an issue that caused some Remote Control messages to appear out of order when earlier messages synced later.
