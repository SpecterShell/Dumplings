  Key: ReleaseNotes
  Value: |-
    距离 v2.1.0 有 44 个提交。核心是 AI 生成能力重建，以及围绕「查词体验」的一轮界面重做。
    下载

    | 平台                  | 适用于                | 文件                |
    | --------------------- | --------------------- | ------------------- |
    | macOS · Apple Silicon | M1 / M2 / M3 / M4     | .dmg (8.0 MB)       |
    | macOS · Intel         | 2020 年前的 Mac       | .dmg (8.3 MB)       |
    | Windows · 安装版      | 一般情况选这个        | .msi (7.0 MB)       |
    | Windows · 免安装      | 绿色版 / 无管理员权限 | .zip (6.7 MB)       |
    | Linux                 | x86_64                | .AppImage (84.7 MB) |

    macOS 提示「应用已损坏」：这是未签名应用的常规拦截，执行一次即可
    xattr -cr /Applications/Aictionary.app
    首次启动请到 设置 → 词典 下载词库（84,212 词条），之后所有查询都在本地完成。

    ⚠️ 破坏性变更
    - 应用名从 aictionary-re 改为 Aictionary。安装包文件名和 macOS 上的 .app 名字都变了，升级不会覆盖旧版本，「应用程序」里可能同时存在新旧两份，手动删掉旧的即可。开机自启会失效（注册的是旧路径），到设置里关一次再开即可恢复。
    - LLM 配置结构变化。旧版本所有服务商共用一个 API key，现在每个服务商各自保存。升级时旧配置会自动迁移到对应的服务商名下，不需要手动操作。
    - 快速查词的默认快捷键改为 ⌘⇧D / Ctrl+Shift+D（原为 ⌘↩）。全局热键优先级高于前台应用，原来的默认值会把 ⌘↩ 从所有其他应用手里抢走。只有仍在使用旧默认值的用户会被迁移，自己改过的不受影响。
    - 移除了强调色个性化，保留浅色 / 深色主题。

    AI 释义生成（重建回归）
    本地词库查不到的词，可以调用大模型现场生成一份符合上游 distribution_entry_v5 契约的完整词条——和词库里的词条走同一套渲染，并单独缓存在 user_dictionary.sqlite，重新下载词库不会影响它。
    - 两段式生成。完整词条要几十秒，所以先用一次极小的请求拿到一句话概括，约 1.5 秒即可上屏，完整内容在后面流式补齐。
    - 流式骨架屏。未到达的部分以呼吸占位块停在它最终要占的位置上，和正式词条共用同一套布局，生成完成时是文字换进去，而不是整页重排。
    - 查不到的词不硬编。输入拼错的词或随机字符时，会直接告诉你查无此词，而不是一本正经地编一份看起来很像真的释义存进词库。
    - 7 个内置服务商：OpenAI、DeepSeek、OpenRouter、SiliconFlow、Moonshot、智谱 GLM、阿里百炼，选中即自动填好接口地址，也支持自定义端点。
    - 每个服务商独立保存 API key 和模型，切换服务商不会丢配置。填好 key 后自动拉取该服务商的模型列表。
    - 底层换用 Vercel AI SDK。
    语音朗读
    - 内置 Edge TTS 作为默认，开箱即用，不需要任何配置和 API key。
    - 新增 ElevenLabs，以及任意 OpenAI 兼容的 TTS 服务。
    - Edge 语音支持搜索选择，列表来自实时目录。
    全局快捷键
    - 注册失败不再静默。快捷键被其他应用占用时会明确提示，而不是在设置里显示得好好的却毫无反应。
    - 按平台显示修饰键（macOS 显示 ⌘⇧，其他平台显示 Ctrl+Shift），并且 Control 和 Command 可以分别绑定——此前 macOS 上无法绑定真正的 Ctrl 快捷键。
    - 修复 macOS 的复制授权。快速查词需要模拟 ⌘C 取走当前选中的文本，此前缺少声明导致系统直接拒绝且不弹授权框；现在会正常请求授权，被拒绝时也会给出可点击跳转的提示。
    - 修复窗口最小化时按快捷键只恢复窗口、光标却不进输入框的问题。
    界面
    - 词条视图重做为左栏标签 + 竖线的版式，音标、记忆钩子、学习要点、词源、义项各归其位。
    - 设置页改为侧栏目录结构；统计页重做。
    - 搜索框并入原生标题栏。
    - 每个页面拥有独立滚动区域，配细线滚动指示。
    其他
    - 新增更新检测（设置 → 关于），只检测不自动下载安装，可关闭。
    - 词典缓存从未下载过和已损坏现在会区分提示，不再对新用户说「缓存不完整」。
    - 应用内和 README 补充了词库数据的来源与许可署名。

    词库与许可
    词条数据来自上游项目 ahpxex/open-dictionary，以 Wiktionary/Wiktextract 快照为基础构建，当前发行版 84,212 词条（其中约 29,829 条是短语等多词条目）。
    - 词库数据：CC BY-SA 4.0，Wiktionary 内容的衍生作品，署名归其贡献者
    - 本项目与上游代码：MIT
    已知问题
    - 部分第三方模型服务商无法连接（#23）。应用的模型请求目前在 WebView 中发起，受 CORS 约束——不返回 CORS 头的服务商（如部分 Gemini 代理）会被浏览器层直接拦截。OpenAI 和 DeepSeek 实测正常。计划把这些请求移到 Rust 侧发起以绕开该限制。
    - 完整词条生成耗时较长，实测 25–60 秒且波动较大。这来自模型处理大型结构化输出 schema 的固有开销，而非网络或本地性能问题。一句话概括的 1.5 秒上屏正是为此设计的缓解措施。
