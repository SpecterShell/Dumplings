  Value: |-
    中文反查英文
    这个版本可以直接用中文查英文了：输入「解决」「什么」这样的中文，词典区会列出释义匹配的英文单词候选（词性 + 命中释义），点击任意一项打开完整词条，词条顶部可随时返回候选列表。反查基于本地词库的内存索引，即输即得，完全离线。

    其他改进：
    - 词条底部新增「回到顶部」按钮；面板切换不再继承上一屏的滚动位置
    - 词性标签统一显示中文（修复 adj / intj 等缩写未映射的问题）
    - README 重写
