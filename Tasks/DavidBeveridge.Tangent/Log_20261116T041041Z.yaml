  Key: ReleaseNotes
  Value: |-
    An experimental release of Tangent, an independent open-source browser for people who want to keep browsing the Arc way. This release brings the reviewed dependency and update-configuration improvements into the downloadable installers.
    Changes since 0.1.0
    - Updated TypeScript to 7.0.2 and Tangent's direct YAML parser to 5.5.0, with compatibility checks for the supported native platforms.
    - Bounded update-configuration parsing and rejected ambiguous YAML merge configuration. The updater's compatible nested YAML dependency is preserved.
    - Removed the vulnerable formatter from the build-tool dependency chain through a narrowly scoped logger update. Real downloader tests cover proxy authentication, HTTPS certificate and hostname validation, checksums, and structured logging.
    - Added a check that Node type declarations match Electron's actual Node major, a full dependency audit in CI, and native installer verification for dependency changes.
    - Fixed certificate-free macOS bundle integrity signing in pull-request package builds while preserving strict signature verification.
    Electron and Chromium are unchanged from 0.1.0. This release does not claim a browser-engine security update. The dependency audit checks known published advisories; it is not a complete security audit of Tangent.
