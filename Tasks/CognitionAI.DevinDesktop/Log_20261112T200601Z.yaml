  Key: ReleaseNotes
  Value: |-
    Changed
    - Devin Desktop now uses Electron 43.8.8, which includes Chromium security fixes and the Node.js 24.22.1 security update.
    Fixed
    - The model picker in a Devin Local chat no longer ignores clicks while Devin Desktop refreshes your account status after launch.
    - A Devin Local tab no longer tries to create a Cloud session in some enterprise accounts.
    - Devin Local no longer corrupts files that are not valid UTF-8 text.
    - Approving a plan in Devin Local implements the plan file as saved at that moment.
    - Images sent to GPT and Gemini models in Devin Local are sized to the limits of those models (2048 px and 3072 px on the longest side).
    - Devin Local deletes overflow files older than 7 days when it starts, so long command output no longer accumulates in the temp directory.
    - In Editor mode, the “Chat” button of the selection nudge inserts the selected code into the Devin Local composer.
    - Cmd/Ctrl+I Command uses the model you selected. Some models silently fell back to the default.
    - @ menu rows that overlap the title bar can be clicked.
    - A session tab no longer crashes when a reply with a Markdown table arrives while the tab is in the background.
    - Attachment tabs load for Cloud sessions of an organization with an IP allowlist.
    - The Settings editor no longer lists categories that have no settings to show.
