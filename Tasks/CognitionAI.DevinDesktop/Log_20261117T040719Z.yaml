  Key: ReleaseNotes
  Value: |-
    New
    - Added tabs to the Agent Command Center, so you can keep several sessions and pages open in one window, each with its own Back and Forward history.
    - Local sessions now run in a background process, so you can close or reopen Devin Desktop or the CLI without stopping a session, and open the same session in multiple clients at once. See the Devin CLI release notes for details.
    - The Files tab now previews local PDF files, shows CSV and TSV files as tables, and plays more media types.
    - Devin Local now nests the output of each subagent under it and shows how many subagents are running.
    Changed
    - The embedded IDE of a session now saves a file when you press Cmd/Ctrl+S instead of automatically, and marks unsaved tabs with a dot.
    - Chat diffs and line counts now use the Devin diff colors instead of your editor theme’s diff colors.
    Fixed
    - New sessions now start on the agent you star in Settings > Agents, or on the agent you picked last.
    - A Devin Local session no longer stops accepting messages after you close its tab and reopen it.
    - Devin Local no longer disconnects a moment after launch when another agent has an update.
    - The first message of a new Devin Local session no longer fails with “ACP host has not authenticated”.
    - A command that writes many large files no longer crashes the Devin Desktop window.
    - Sign-in no longer fails with “Problem with login service” on networks that reset some connections.
    - Fixed a crash of Devin Desktop windows on some Linux systems.
    - Fixed a crash of the Agent Command Center after some updates on Windows.
