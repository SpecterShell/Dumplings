  Key: ReleaseNotes
  Value: |-
    - [问题修复] 自动兼容 ChatGPT CLI (.chatgpt) 路径与配置同步：
      - 解决最新版 OpenAI CLI 将配置路径由 ~/.codex/ 变更/重命名为 ~/.chatgpt/ 导致无法一键同步 API Key 与代理 URL 的问题。支持智能级联识别 ~/.chatgpt 与 ~/.codex 双路径。
      - 相关 Issue: 详见 Issue #3275。
    - [功能增强] 支持选择仅暴露真实 Quota 配额模型 (Only Raw Quota Models Mode):
      - 精简第三方模型下拉选单：在 gui_config.json 的 proxy 配置及前端模型路由中心操作栏中新增“仅暴露真实配额模型”开关。开启后 /v1/models 接口将自动隐藏所有内置的虚拟别名模型（如 gpt-4o、claude-3-5-sonnet 等）及各种画幅变体模型，仅暴露当前已连接账号实际获取到的底层真实模型 ID 与用户自定义映射规则，大幅改善 Cherry Studio / NextChat / LobeChat 等第三方客户端的模型选择体验。
      - 相关 Issue: 详见 Issue #3273。
