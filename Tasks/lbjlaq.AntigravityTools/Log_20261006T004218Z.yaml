  Value: |-
    - [Release Re-run] Full Republish of v4.9.5 Content (v4.9.5 produced no Release assets due to hosted runner starvation):
      - Re-run Notice: The v4.9.5 release pipeline (tag v4.9.5, commit 56513c7f) was interrupted and cancelled because GitHub hosted runners stayed unavailable for an extended period, so publish-release never executed and no Release assets were produced; the in-app latest update channel is still on v4.9.4. This v4.9.6 release republishes the identical codebase (same commit 56513c7f); see the v4.9.5 section below for the detailed change entries.

    - [发布重跑] 完整重新发布 v4.9.5 全部内容（v4.9.5 因托管 Runner 资源不足未产出任何 Release 资产）:
      - 重发说明：v4.9.5 的发布流水线（tag v4.9.5，commit 56513c7f）因 GitHub 托管 Runner 长时间无可用机器，矩阵构建中断并被取消，publish-release 从未执行，未生成任何 Release 资产，应用内 latest 更新通道仍停留在 v4.9.4。本次以 v4.9.6 重新完整发布，代码内容与 v4.9.5 完全一致（同一 commit 56513c7f），详细变更条目见下方 v4.9.5 段落。
    What's Changed
    - fix(process): 隔离各 IDE 目标 state.vscdb 并通过 proc_pidpath 精准识别进程二进制 (Fixes #3598) by @cubelikeplayDaniel in https://github.com/lbjlaq/Antigravity-Manager/pull/3600
    - fix(gemini): 穿透非流式收集器中的流错误响应并防止空块污染思考缓存 by @cubelikeplayDaniel in https://github.com/lbjlaq/Antigravity-Manager/pull/3601
    - fix(proxy): 释放 invalid_grant 分片锁避免自死锁，隔离 project_id 探测并引入 5 分钟负缓存 by @cubelikeplayDaniel in https://github.com/lbjlaq/Antigravity-Manager/pull/3602
    - fix(patch): macOS 注入重签名失败时自动回滚备份以防 AMFI 闪退，并在还原时保留官方证书 by @cubelikeplayDaniel in https://github.com/lbjlaq/Antigravity-Manager/pull/3603
    - fix(cowork): 纳入工具 Schema 核算开销、消除免死租约遗漏，加固压缩生命周期与状态修剪 by @cubelikeplayDaniel in https://github.com/lbjlaq/Antigravity-Manager/pull/3604
    - fix(proxy): 统一 Claude 配额保护组、修复自定义路由与 Gemini Schema 规范化 (#3506, #2041, #1798) by @cubelikeplayDaniel in https://github.com/lbjlaq/Antigravity-Manager/pull/3606
    - fix(agy): verify keyring switches and sync selected account by @chenty2333 in https://github.com/lbjlaq/Antigravity-Manager/pull/3607
    - fix(gateway,ide): 优化网关级联故障转移重试、长连接会话恢复与 IDE 凭据命名变体支持 (#3506, #3517, #3509, #3598) by @cubelikeplayDaniel in https://github.com/lbjlaq/Antigravity-Manager/pull/3608
    - fix(cowork,patch): 深度提升压缩率、合并压缩状态机并支持补丁注入全生命周期管理 (#3604) by @cubelikeplayDaniel in https://github.com/lbjlaq/Antigravity-Manager/pull/3609
    - fix(pipeline): 彻底根治思考预算统一覆盖为 32768 根因并保证后缀与默认模式优先级 (#3610) by @cubelikeplayDaniel in https://github.com/lbjlaq/Antigravity-Manager/pull/3611
