  Key: ReleaseNotes
  Value: |-
    What's Changed
    - ci: run Harden-Runner on every job by @dylanmtaylor in https://github.com/storytold/pdfcraft/pull/7003
    - Updates: take craft-update from craft-libs main at 6e03f65bf by @dylanmtaylor in https://github.com/storytold/pdfcraft/pull/7008
    - fix(sign): a widget removed from a page's inline Annots is not a comment change by @dylanmtaylor in https://github.com/storytold/pdfcraft/pull/6013
    - fix(edit): editor font enumeration reads a face name without building font metrics by @dylanmtaylor in https://github.com/storytold/pdfcraft/pull/6086
    - fix(optimize): walk shared resource dictionaries and name-tree kids once by @dylanmtaylor in https://github.com/storytold/pdfcraft/pull/5956
    - fix(optimize): the fragment search charges every operator of a group it reads by @dylanmtaylor in https://github.com/storytold/pdfcraft/pull/6095
    - fix(preflight): follow every /Next action and bound colour and intent work by @dylanmtaylor in https://github.com/storytold/pdfcraft/pull/5926
    - fix(redact): read each Type 3 glyph program once per cleanup by @dylanmtaylor in https://github.com/storytold/pdfcraft/pull/5993
    - fix(annot): count ink points as strokes resolve and cap the eraser's samples by @dylanmtaylor in https://github.com/storytold/pdfcraft/pull/6001
    - fix(xfa): bound the name and path bytes data nodes and queued instances copy by @dylanmtaylor in https://github.com/storytold/pdfcraft/pull/6032
    - fix(forms): a read-only radio button is not picked or left through set_value by @dylanmtaylor in https://github.com/storytold/pdfcraft/pull/6038
    - ci: use StepSecurity's maintained actions by @dylanmtaylor in https://github.com/storytold/pdfcraft/pull/7026
    - fix(redact): hidden-layer removal reads the default state as viewers do by @dylanmtaylor in https://github.com/storytold/pdfcraft/pull/5867
    - fix(sign): judge a shared signature value once per listing; dedupe DSS evidence by object number by @dylanmtaylor in https://github.com/storytold/pdfcraft/pull/6041
    - fix(render): charge inspection text (fields, tooltips, layers, bookmarks, blank comments) against shared allowances by @dylanmtaylor in https://github.com/storytold/pdfcraft/pull/6015
    - fix(js): bound array text, month parsing, name registration and list work by @dylanmtaylor in https://github.com/storytold/pdfcraft/pull/5883
    - fix(engine): run the renderer redaction check on redactions applied inside a batch by @dylanmtaylor in https://github.com/storytold/pdfcraft/pull/5977
    - fix(edit,a11y): font aliases share the metrics built for their font by @dylanmtaylor in https://github.com/storytold/pdfcraft/pull/5998
    - CI: nightly release dry run by @FredApps in https://github.com/storytold/pdfcraft/pull/7040
    - fix(forms,xfa): find every password field before a save skips scrubbing it by @dylanmtaylor in https://github.com/storytold/pdfcraft/pull/5864
    - fix(redact): remove a stroked path by the box its stroke paints by @dylanmtaylor in https://github.com/storytold/pdfcraft/pull/5876
    - Fix Flatpak updates and bump to 0.21.1 by @dylanmtaylor in https://github.com/storytold/pdfcraft/pull/7020
