  Key: ReleaseNotes
  Value: |-
    Note
    FreeBSD aarch64 is dropped from this release. We had to cut releases, and we cannot build this target within the 5-hour CI limit for any of the Craft apps, so we are dropping it for now. This is a known blocker, flagged for a future fix in storytold/craft-common-actions#39. FreeBSD x86_64 and every other platform are included.
    What's Changed
    - M7: lay out the Edit panel as Acrobat's by @abc2cb in https://github.com/storytold/pdfcraft/pull/2245
    - fix(engine): PNG export writes opaque pages as RGB at deflate level 3 (3–5× faster, same size) by @Piohrun in https://github.com/storytold/pdfcraft/pull/2425
    - M3: the mode bar has no Read tab, as in Acrobat by @abc2cb in https://github.com/storytold/pdfcraft/pull/2240
    - fix(render): read each object stream's index once (vendored hayro-syntax patch 22) by @Piohrun in https://github.com/storytold/pdfcraft/pull/2427
    - M4: Organize pages remembers its page size, as Acrobat does by @abc2cb in https://github.com/storytold/pdfcraft/pull/2282
    - M3: the Tools panel has no tab strip while docked alone by @abc2cb in https://github.com/storytold/pdfcraft/pull/2244
    - M7: lay out Format text as Acrobat's panel by @abc2cb in https://github.com/storytold/pdfcraft/pull/2249
    - M6: renaming a field renames it in the calculations that read it by @Piohrun in https://github.com/storytold/pdfcraft/pull/3550
