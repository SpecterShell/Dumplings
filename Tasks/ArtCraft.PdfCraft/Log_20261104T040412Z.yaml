    - M12: FormCalc prints numbers to at most 15 significant digits by @seanGSISG in https://github.com/storytold/pdfcraft/pull/5819
    - Expand header/footer tokens preceded by extra '<' characters by @Silvertree2010 in https://github.com/storytold/pdfcraft/pull/5766
    - M7: Arrange keeps a top-level inline image a unit of its own (#3146) by @ljkx in https://github.com/storytold/pdfcraft/pull/5823
    - fix(optimize): make pictures under a stencil mask smaller by @quincy-jc in https://github.com/storytold/pdfcraft/pull/5847
    - M11: Optimize runs when a category it discards holds nothing by @Piohrun in https://github.com/storytold/pdfcraft/pull/5742
