    - Remove security also from files with /Encrypt inline in the trailer by @marcoarnulfo in https://github.com/storytold/pdfcraft/pull/2702
    - Go to page brings the page into view horizontally too by @marcoarnulfo in https://github.com/storytold/pdfcraft/pull/2703
    - M3: ⌘G and ⇧⌘G step through matches from the find field (#2669) by @mtlcl410 in https://github.com/storytold/pdfcraft/pull/2704
