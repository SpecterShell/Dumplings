  Key: ReleaseNotes
  Value: |-
    Note
    No FreeBSD aarch64 build in this release. We are having trouble building this architecture within the 5-hour CI timeout across all Craft apps, so we are releasing without it to unblock builds. FreeBSD x86_64 and every other platform are included. FreeBSD aarch64 builds will return once the build fits in CI.
    What's Changed
    - Tests: make timing-dependent render and UI tests deterministic by @guillehr2 in https://github.com/storytold/pdfcraft/pull/2812
    - Clear replacement text by @not-a-feature in https://github.com/storytold/pdfcraft/pull/1350
    - Prevent oversized GPU textures after page replacement (#3149) by @PerchAnton in https://github.com/storytold/pdfcraft/pull/3182
    - i18n: Turkish section titles and in-sentence labels keep İ and ı by @ogzhnklvz in https://github.com/storytold/pdfcraft/pull/3114
    - fix(engine): printing keeps layers hidden in the Layers panel hidden (#3046) by @mtlcl410 in https://github.com/storytold/pdfcraft/pull/3050
    - fix(ocr): the text layer restores the rendering mode it sets (#3029) by @mtlcl410 in https://github.com/storytold/pdfcraft/pull/3033
    - Control channel: don't lose the refusal reply to a TCP reset (fixes deadline test flake) by @skylartaylor in https://github.com/storytold/pdfcraft/pull/3165
    - fix(ui): the Hand tool moves the page with the pointer by @guillehr2 in https://github.com/storytold/pdfcraft/pull/3017
    - fix(i18n): the web build's Auto language follows the browser (#2954) by @kgemici in https://github.com/storytold/pdfcraft/pull/2998
    - Fix overflow panic for i64::MIN index in content_update/delete by @Silvertree2010 in https://github.com/storytold/pdfcraft/pull/2979
    - Apply JPEG EXIF orientation when creating PDFs from images by @Silvertree2010 in https://github.com/storytold/pdfcraft/pull/2951
    - M6: a box drawn with points along its sides is detected as a box (#2942) by @mtlcl410 in https://github.com/storytold/pdfcraft/pull/2947
    - Extract RTL lines with numbers and punctuation in logical order by @Silvertree2010 in https://github.com/storytold/pdfcraft/pull/2736
    - M8: redaction removes the replies of the annotations it removes (#2659) by @mtlcl410 in https://github.com/storytold/pdfcraft/pull/2697
    - Edit text: a loaded font is applied to the paragraph being edited by @marcoarnulfo in https://github.com/storytold/pdfcraft/pull/2599
    - Comments: an attachment comment's menu saves or opens its file by @marcoarnulfo in https://github.com/storytold/pdfcraft/pull/2585
    - M7: keep the text blocks cache after the document is edited by @komo1iddin in https://github.com/storytold/pdfcraft/pull/2504
    - M7: fold repeated group moves of a cropped image into one clip cm by @komo1iddin in https://github.com/storytold/pdfcraft/pull/2476
    - fix(engine): a new or recovered document stays unsaved through undo by @mtlcl410 in https://github.com/storytold/pdfcraft/pull/2346
    - M8: measure fonts without /Widths with their embedded program (#2130) by @Ridzzz0Alam in https://github.com/storytold/pdfcraft/pull/2232
    - Issue #2367: an object stream whose entry cannot place it is found by its header by @wstock in https://github.com/storytold/pdfcraft/pull/2398
    - Save As to another file writes a clean copy without earlier revisions by @marcoarnulfo in https://github.com/storytold/pdfcraft/pull/2174
    - M4: reverse page order (organize.reverse-pages) by @Erry91 in https://github.com/storytold/pdfcraft/pull/1720
    - M6: detect a row of comb boxes as one comb text field by @marcoarnulfo in https://github.com/storytold/pdfcraft/pull/2111
    - Redact email addresses whose local part starts with punctuation by @Silvertree2010 in https://github.com/storytold/pdfcraft/pull/2948
    - M7: never encode typed text with CID 0 (#3223) by @mtlcl410 in https://github.com/storytold/pdfcraft/pull/3235
    - M5: flattening comments leaves 3D, multimedia and print-production annotations (#3087) by @mtlcl410 in https://github.com/storytold/pdfcraft/pull/3089
    - Keep a subscript or superscript in its line when extracting text (#3174) by @MarekSpodBiedry in https://github.com/storytold/pdfcraft/pull/3244
    - Find credit card numbers followed by an expiry, year or CVV by @Silvertree2010 in https://github.com/storytold/pdfcraft/pull/2969
    - fix(i18n): zh-hant catalog uses Taiwan vocabulary consistently by @hms5232 in https://github.com/storytold/pdfcraft/pull/2856
    - M10: keep the OCR scan fixture at its original page size by @IanHollow in https://github.com/storytold/pdfcraft/pull/2399
    - Fix GPU startup requests exceeding adapter limits by @Bortlesboat in https://github.com/storytold/pdfcraft/pull/2433
    - M7: the Edit text caret is as tall as the row it is on by @Arakmar in https://github.com/storytold/pdfcraft/pull/2462
    - M3: the Pages panel follows the current page by @marcoarnulfo in https://github.com/storytold/pdfcraft/pull/2785
