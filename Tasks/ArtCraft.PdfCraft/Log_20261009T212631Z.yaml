    - #214: wheel paging, Page display menu, default layout and zoom by @chiranjeevi-max in https://github.com/storytold/pdfcraft/pull/241
    - Automation: doc_info reports annotation and link rects in displayed-page coordinates (#129) by @wstock in https://github.com/storytold/pdfcraft/pull/242
    - Automation: doc_protect restrictions need a permissions password — say so, and refuse them without one (#134) by @wstock in https://github.com/storytold/pdfcraft/pull/243
    - Pin mixed-size Fit page behavior with regression tests by @chiranjeevi-max in https://github.com/storytold/pdfcraft/pull/245
    - Desktop: no eprintln! on the log and panic paths by @switch87 in https://github.com/storytold/pdfcraft/pull/246
    - Add Spanish (es) interface catalog by @viator1969 in https://github.com/storytold/pdfcraft/pull/251
    - Issue #253: comment_add anchors note and attachment icons at the displayed top-left on rotated pages by @wstock in https://github.com/storytold/pdfcraft/pull/254
