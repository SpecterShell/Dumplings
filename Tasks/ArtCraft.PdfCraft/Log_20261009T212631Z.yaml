  Key: ReleaseNotes
  Value: |-
    What's Changed
    - Windows on ARM64: release builds, tested on ARM64 hardware (#61) by @echelon in https://github.com/storytold/pdfcraft/pull/66
    - Windows ARM64: fix the intermittent WARP crash in tests, remove the diagnostic job by @echelon in https://github.com/storytold/pdfcraft/pull/71
    - Fonts: use craft-fonts as an optional build input; move the Japanese fonts out by @echelon in https://github.com/storytold/pdfcraft/pull/75
    - View: next page in two-page view moves a whole spread (#70) by @bflatastic in https://github.com/storytold/pdfcraft/pull/77
    - Export to Word: files open in Word again (#72) by @bflatastic in https://github.com/storytold/pdfcraft/pull/78
    - ROADMAP: session 14 log by @echelon in https://github.com/storytold/pdfcraft/pull/83
    - UI: sharper, higher-contrast text, most visible on Windows (#76) by @bflatastic in https://github.com/storytold/pdfcraft/pull/84
    - macOS: open PDFs from Finder, Open With and the Dock (#73) by @bflatastic in https://github.com/storytold/pdfcraft/pull/82
    - Add text: clicking elsewhere keeps the text and starts a new box (#74) by @bflatastic in https://github.com/storytold/pdfcraft/pull/86
    - ROADMAP: session 15 log by @bflatastic in https://github.com/storytold/pdfcraft/pull/88
    - Prepare a form: Detect form fields in the panel, delete several fields at once (#93, #95) by @bflatastic in https://github.com/storytold/pdfcraft/pull/116
    - Forms: check box and radio button styles (#94) by @bflatastic in https://github.com/storytold/pdfcraft/pull/118
    - Docs: automation README, internal craftrules links, docs/releasing.md (#97, #98, #100) by @bflatastic in https://github.com/storytold/pdfcraft/pull/120
    - Windows: register PrintCraft as a PDF handler, so it can be the default (#107) by @bflatastic in https://github.com/storytold/pdfcraft/pull/122
    - Rename PrintCraft to PdfCraft by @echelon in https://github.com/storytold/pdfcraft/pull/174
    - Redact: operators split across a page's content streams are redacted whole by @EthanSuquet in https://github.com/storytold/pdfcraft/pull/153
    - Security: --root confinement leaks and escapes (#136, #137) by @jcl-bit in https://github.com/storytold/pdfcraft/pull/164
    - Security: ask before opening links from documents (#90, #91) by @jcl-bit in https://github.com/storytold/pdfcraft/pull/104
    - M1: validate object-number ranges before reading cross references by @storybored379 in https://github.com/storytold/pdfcraft/pull/92
    - fix: print: read lpstat untranslated so printers show on non-English macOS by @rutkk in https://github.com/storytold/pdfcraft/pull/101
    - macOS: declare PDF by UTI so Open With recommends PrintCraft by @ShauryaSwarup in https://github.com/storytold/pdfcraft/pull/176
    - Issue #96: on Linux, draw on the GPU that drives the monitors by @cmoro-deusto in https://github.com/storytold/pdfcraft/pull/105
    - Edit text: the graphics state carries over between a page's content streams by @Checkov23 in https://github.com/storytold/pdfcraft/pull/150
    - Edit text: keep the tokens a content stream shares with its neighbours by @EthanSuquet in https://github.com/storytold/pdfcraft/pull/154
    - Automation: file-writing tools no longer advertise read-only (#130) by @itsmunzir in https://github.com/storytold/pdfcraft/pull/138
    - CLI: text exits non-zero when a selected page cannot be read (#131) by @itsmunzir in https://github.com/storytold/pdfcraft/pull/139
    - Checkboxes with an indirect /AP /N state dictionary are drawn (#180) by @ebastos in https://github.com/storytold/pdfcraft/pull/181
    - Select all pages with Ctrl+A in Organize Pages by @Frumpy9 in https://github.com/storytold/pdfcraft/pull/113
    - Render: round page rasters up so the last partial row and column are drawn (#102) by @HEOJUNFO in https://github.com/storytold/pdfcraft/pull/114
    - M3: Add middle-click autoscroll on Linux by @Frumpy9 in https://github.com/storytold/pdfcraft/pull/111
    - Persist default workspace mode for newly opened PDFs by @mjshfrvstj-sys in https://github.com/storytold/pdfcraft/pull/172
