  Value: |-
    Desktop release 0.1.71
    更新说明
    🔍 桌面搜索更容易命中
    桌面端搜索中文内容时，输入几个字就能命中，不再需要输入完整句子；结果摘要的显示也更准确。
    ⚡ 移动端长列表更流畅
    移动端超长对话与首页列表更流畅：打开后直接看到最新内容，回看更早消息不跳位，对话持续输出时也能顺畅浏览，滚动与分组切换响应更快。
    🖼️ iOS 分享图片排版更完整
    iOS 端把对话分享成图片时，标题、列表、代码块等排版能更完整地保留；导出异常时自动回退原有方式，更稳定。

