  Value: |-
    Desktop release 0.1.43
    更新说明
    📱 iOS 模拟器集成
    macOS 用户可在 Cindy 内直接启动 iOS 模拟器，Agent 能自主操控模拟器进行 App 调试与测试；支持触控输入、屏幕录制与 Xcode 构建诊断。 @MagicLizi @guyong-zapo @horizon554
    ✨ 流式动效与长会话性能
    新增流式逐词淡入效果（设置 → 个性化中开启）；切换长会话时只布局视口内消息，减少主线程阻塞；修复减弱动效模式下仍有旋转动画的逃逸问题。 @DavidShenXD
    📋 计划气泡体验优化
    计划气泡按真实完成状态退场，不再伪造全勾完；中断或失败的步骤正确标记失败印记；支持在输入框通过 /plan 命令快速进入计划模式。 @dashhuang @kafeifei @tiammomo
    🌐 繁体中文与多语言
    新增繁体中文语言支持，覆盖桌面端与移动端全部界面。 @DavidShenXD @dashhuang @horizon554
    📲 移动端：图片分享与离线体验
    支持将对话分享为图片；断线期间消息自动排队，恢复后按序送达；新建会话正确携带自定义模型供应商，不再回落默认网关报错。 @dashhuang @happy9zhang
    🧩 插件市场加固
    启动扫描不再损坏已安装插件状态；自定义市场支持加载本地图标；安装来源严格隔离，防止静默替换；添加或刷新市场源后给出发现回执。 @DavidShenXD @GaoWeiLiuXD @nanaco666
    🔍 本地审阅与子代理工作区
    新增独立本地代码审阅器；子代理工作区支持多 harness 持久化，Rewind 后状态正确恢复；可切换 Cindy 与 Codex 原生子代理调度策略。 @LeeCarry @zqchris
    🖥️ 桌面端稳定性
    修复多显示器下灵动岛紧凑态宽度异常；Windows 退出不再触发 360 安全弹窗；消息密文恢复不再留空壳；远程归档任务列表不再为空；订阅模型经 Claude Code 不再返回空响应；Windows 登录授权窗口正确前置。 @DavidShenXD @MagicLizi @dashhuang @horizon554 @yunze7373
    🤖 供应商与模型
    自定义供应商支持一键填充其他 runtime 配置；模型选择不再被过期白名单覆盖；上下文压缩入口按 Agent 能力自动分流。 @KingSystemHaiGo @mengfanyu9410-hub @nanaco666
    💎 体验打磨
    更新公告右上角显示当前版本号并跟随滚动；回车发送后输入框不再失焦；折叠的计划预览恢复可选中；worktree 勾选记忆只对具备资格的目录生效；官方反馈信息质量与隐私保护提升；Orca 子代理不再向 Lead 重复上报。 @DavidShenXD @Shinku-Chen @dashhuang @fmfsaisai @yuaiccc

