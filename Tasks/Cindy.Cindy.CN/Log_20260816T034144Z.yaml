  Value: |-
    Desktop release 0.1.50
    更新说明
    🛡️ 自动审批故障不再误判
    自动审批超时、出错或确认卡没送达时，不再被误判成「您已拒绝」，而是弹确认卡或提示「自动审批没完成」。微信 /stop、IM 投递失败、退出登录等也会正确归类，故障卡不再显示只生效一次的「总是允许」，移动端提示支持多语言。 @MagicLizi
    🤖 模型与供应商更完整
    GLM Responses 模型现在能被发现和绑定，客户端也不再按地区过滤模型，可用模型列表更完整。自定义供应商会在新任务中沿用，模型路由和接口地址修改后的模型列表会正确校验，供应商弹窗点遮罩关闭的行为也修好了。 @zqchris
    🖥️ Pi 运行更稳定
    Pi 选择自定义模型和供应商时更稳定，xAI 搜索工具得以保留，远程运行与异常恢复也更可靠。 @zqchris

