  Value: |-
    Desktop release 0.1.58
    更新说明
    🧩 插件作品持久存储（Library）
    声明 library 槽的插件现在拥有专属的持久作品库：安装时可自定义存储位置，随时安全迁移；卸载不会删除数据，删除需在设置页单独确认。
    🔐 修复安装版周期性闪回登录页
    修复了安装版每隔约 55 分钟因令牌续期把主界面踢回登录页、整窗闪一下重新加载的问题；同一账号续期不再触发登出。
    ✨ 折叠项目的提醒点对齐任务行
    侧栏折叠项目的红/绿提醒点移到行最右侧，与任务行状态点对齐，悬停时让位给操作按钮。

