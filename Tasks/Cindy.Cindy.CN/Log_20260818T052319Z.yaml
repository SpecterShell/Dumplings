  Value: |-
    Desktop release 0.1.55
    更新说明
    ✨ 回复结束智能推荐下一句
    一轮回复结束后，输入框会以灰色文字推荐下一句，按 Tab 一键填入；不想用时可在设置「小技巧」里关闭。 @Shinku-Chen
    📊 SuperGrok 账号周用量一目了然
    登录 SuperGrok 后，设置页 xAI 卡片和 Grok 会话底栏会显示账号的周用量（套餐名、本周已用百分比、重置时间等），换号会自动清理、不再误读上一账号的数据。 @dashhuang
    🔒 PI 自动审批不再静默读凭证
    PI 自动审批不再静默读取 .env 等凭证文件，或通过看似无害的链接名读取凭证目标；这类读取会改成要求你明确确认。 @zqchris
    🤖 PI 重试与心跳更稳
    PI 瞬时抖动不再闪英文红条，第一次重试保持静默、识别为过载时才显示「正在自动重试」；SuperGrok 定时心跳复用活进程时不再整轮失败。 @dashhuang
    📱 iOS 模拟器画面与恢复更稳
    模拟器画面不再受固定高度限制、按面板宽度充分展示；兼容模式下新增「尝试恢复 Native」入口，恢复失败仍保留画面与输入；切换模拟器 Metro 版本时只在明确要求下接管、停止失败会安全退出。 @dashhuang @horizon554
    🧭 桌面端交互打磨
    任务行新增 PR 未解决角标；已安装插件卡片点击即进详情；加号菜单不再闪现横线、已连接设备绿点移除；登录只剩一种方式时跳过选择。 @dashhuang
    🎛️ 模型与媒体能力
    插件「Cindy 能力」配置会显示可执行的媒体模型，Agent 按你的配置调用相应模型；模型开关保存失败时给出明确提示、不再静默无效；Agent 查看图片时也能拿到受管地址交给工具使用。 @GaoWeiLiuXD @zhanghengxd
    🔧 其他稳定修复
    Grok 派完 Worker 后不再冒出结束符气泡；终态错误后连接及时释放、迟到的内容不再进入输出；Grok 模型陷入异常循环会被识别并中断当前轮。 @MagicLizi @dashhuang
    🧪 xd 组织默认打开 Beta 渠道
    xd 组织用户登录后默认打开 Beta 测试渠道，可随时在设置里关闭回到正式版。 @guyong-zapo

