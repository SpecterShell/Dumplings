  Key: ReleaseNotes
  Value: |-
    JetBrains Air is now available in PyCharm 2026.3 EAP 4, bringing agentic development closer to the IDE. With your choice of coding agents, support for parallel workflows, and IDE-native review and verification.
    - Command-2 on macOS / Alt+2 on Windows and Linux will open the Agent Session tool window instead of Bookmarks.
    - Ctrl+Ctrl on any platform will open a quick input window instead of Run Anything.
    Learn more
    This build fixes long-standing SQLAlchemy and Pydantic type checking issues, adds a new way to sort variables in the debugger, and cleans up a couple of smaller regressions. It also brings several fixes to the Process Output tool window, including correct line wrapping for long commands and more consistent section styling.
    Frameworks
    - SQLAlchemy 2.0 Mapped[...] attributes are now treated as their underlying type, so reading them or comparing them in where() filter clauses no longer triggers a false type mismatch - PY-59791 and PY-71748.
    - A path parameter used only inside a dependency function is no longer flagged as missing from the route handler - PY-88935.
    - Populating a nested Pydantic model field with a dict literal no longer triggers a false type mismatch warning - PY-90013.
    Debugger
    - Dictionary keys now appear in their correct order in the debugger and in the inline values preview - PY-75697.
    - Sort variables by type in the debugger's Variables pane - PY-39620.
    - Object attributes can now appear in their original declaration order in the debugger, instead of always being sorted alphabetically - PY-75114.

    Full release notes.
