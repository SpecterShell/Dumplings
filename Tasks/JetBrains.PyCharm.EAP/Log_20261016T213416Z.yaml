  Key: ReleaseNotes
  Value: |-
    PyCharm now uses the version of Pyrefly bundled with the IDE, along with a few related fixes to the integration. This build also resolves a long-standing devcontainer issue and fixes several type checking false positives.
    Pyrefly
    - Pyrefly now uses the version bundled with the IDE when selected as the type engine - PY-92265.
    - Disabling the Pyrefly type engine now also disables the Pyrefly tool and stops its server, instead of leaving it running - PY-92576.
    - PyCharm now offers a quick-fix to install a missing package, such as pandas, even when Pyrefly is enabled as the type engine - PY-93135.
    Devcontainers
    - Creating or selecting a Python environment in a natively opened devcontainer no longer fails - PY-88224.
    Code Insight
    - Subclassing a protocol class that declares call no longer triggers a false positive Type of 'init' is incompatible warning - PY-49246.
    - @cached_property re-exported by propcache (as used by yarl's MultiDictProxy) now keeps its correct return type instead of resolving to Any - PY-85200.
    - Turn off strict union type checking from Settings | Advanced Settings | Python if it produces too many warnings in existing code - PY-92878.
    - Quick documentation for a type statement now shows the correct aliased value instead of the wrong one - PY-93010.
    Other fixes
    - The "LangSmith project detected" notification now shows reliably the first time a project is opened - PY-92099.

    Full release notes.
