  Key: ReleaseNotes
  Value: |-
    This build fixes a batch of debugger, code insight, interpreter, and Jupyter issues reported by the community:
    Debugger
    - Use the "Jump to Cursor" action when debugging with debugpy - PY-90181.
    - Use the Set Value action to edit variables directly during a debugpy session - PY-90157.
    - Disable autocomplete in the debugger's interactive console when you don't need it - PY-75723.
    Run
    - Avoid the unnecessary datalore.display.display_ import that ran on every script execution - PY-91848.
    Code Insight
    - Get correct type inference for yield expressions and typing.Generator.send - PY-47487.
    - Rely on exhaustive reachability analysis to catch more reference-before-assignment issues - PY-83501.
    - Avoid false positive type check errors on generic dict subclasses - PY-88690.
    - Avoid false positive Parameter ... unfilled warnings when unpacking a non-total TypedDict in method parameters - PY-90856.
    Interpreters Settings
    - Generate a new Python environment with uv even when UV_PROJECT_ENVIRONMENT is set - PY-83666.
    - Get correct auto-detection for Poetry projects that don't declare a [project] table - PY-91765.
    - See the correct Python version after selecting a local virtual environment - PY-80914.
    Jupyter
    - Use Ctrl+A to select the current live template expression first - PY-81585.
    - Fold and unfold base64-encoded data in Jupyter notebooks - PY-47519.
    - Avoid running the script in an HTML cell output twice, which duplicated JS-rendered graphics - PY-91699.

    Full release notes.
