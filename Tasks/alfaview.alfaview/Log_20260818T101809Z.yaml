  Key: ReleaseNotes
  Value: |-
    [Feature
    Update] Disable Break Mode per Room
    Room admins can now turn off break mode for an entire room via the host tools or the room features. This also hides the break button and disables the keyboard shortcut. Anyone who is already on a break when the change takes effect remains on break and can return at any time.
    [Feature
    Update] Meeting List and Management
    The meeting list now also shows a list of meeting you have been invited to.
    Meeting creators can now edit their meeting from the room context menu while inside the meeting room.
    [Technical
    Update] Sign In
    The login screen now shows an option to sign in via an external identity provider after previously logging in through an SSO link.
    [Fixes in
    v9.29.0] File Sharing
    Some users could not see file sharing related options when joining a room of another company as a guest if their own company turned off file sharing for the entire company.

    Virtual Camera
    We fixed an issue where connecting or removing a physical camera could lead to a selected virtual camera becoming unselected.

    Raise Hand
    Fixed an issue where not all raised hands reappeared after a moderator turned off “Show raised hands only to moderators.”

    Linux – Crash Caused by Microphone Activation
    Fixed an issue on systems with PipeWire where enabling the microphone could crash the application.

    Linux – Update permission
    The in-app update permission dialog now shows a short, readable install command including the package name and version, instead of a truncated file path.

    Linux – System installer
    Fixed in-app updates silently doing nothing on systems without a graphical authentication (polkit) agent. The downloaded package now opens in the system installer instead.

    Webclient – Audio dropouts caused by buffering
    Fixed prolonged audio dropouts in the web client that could occur when playback briefly ran out of buffered audio.
