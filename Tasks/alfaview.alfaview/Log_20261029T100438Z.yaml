- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    [Feature
    Update] Host Tools Menu
    Reorganised into clear categories (Access, Moderation, Appearance, Recording, Administration) so moderators can find room controls faster instead of scrolling one long list.
    [Feature
    Update] Virtual Backgrounds
    Enabling virtual background feature on iOS, iPadOS, and Android devices. Making it more robust and efficient across all devices.
    [Technical
    Update] Audio Channel and stability
    We improved audio channel connection times on networks where QUIC traffic is blocked.
    Improved audio stability in the Webclient
    [Fixes in
    v9.30.0] Android Chat Messages
    Fixed an issue where the menu for copying chat messages did not open on Android when long-pressing or double-tapping the chat.

    Android and iOS notification sounds
    Fixed an issue where some notification sounds could not be heard when the app was backgrounded on Android and iOS.

    Switching Tabs
    Fixed an issue where switching tabs in one popped-out sidebar could blank out the tabs in another popped-out sidebar.

    Webclient
    We fixed an issue where short spoken sentences were inaudible after reactivating the microphone following a longer pause.

    Webclient
    We fixed an issue where the web client could freeze during a meeting and had to be reloaded.
    [Fixes in
    v9.30.1] Webclient
    We fixed an issue where log files could not be downloaded using Safari.
    [Fixes in
    v9.30.3] Webclient
    A problem has been fixed in which Safari used slightly more memory during audio playback.
    [Fixes in
    v9.30.4] Webclient
    Worked around a bug in Chrome 156 that showed your own video upside down when camera effects were enabled.
    [Fixes in
    v9.30.5] Room entry
    We fixed an issue where alfaview could freeze for multiple seconds on some systems when entering a room.
