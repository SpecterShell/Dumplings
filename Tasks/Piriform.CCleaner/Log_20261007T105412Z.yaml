  Key: ReleaseNotes
  Value: |-
    Expanding our cleaning
    - New AI Tools category in Custom Clean We've added a new AI Tools category to Custom Clean. You can now find, analyze, and clean junk files from popular AI apps including ChatGPT, Claude, Cursor, Codex, Antigravity, Gemini, and LM Studio.
    Keeping you safe
    - Improved file-write security We've fixed a security issue found during an internal audQit that could have allowed unauthorized file writes under certain conditions.
    - Fixed a crash that stopped the CCleaner service from starting Resolved a startup crash caused by an internal lookup error that affected over 1,000 users.
    - Better handling of browser runtime updates CCleaner now properly detects when the Edge WebView2 runtime has been updated or removed, preventing crashes when opening in-app content.
    - Smoother app shutdown We've fixed a timing issue during shutdown that could cause a crash when background tasks were still running.
    Fixing bugs
    - Installer now verifies WebView2 before launch The installer checks that the WebView2 runtime is actually present on disk, not just registered, and re-installs it if needed. This prevents launch failures some users experienced after installation.
    - Fixed an error when updating CCleaner Resolved an issue where some users saw a 0x404 error during the update process.
    - Faster app launch and no more duplicate windows CCleaner now opens roughly 3–6× faster. Launching CCleaner while it's already running correctly brings the existing window to the front instead of opening a second one.
    - Performance Optimizer no longer mislabels programs Fixed an issue where the WSL Service was incorrectly shown as "Microsoft GameInput" in Performance Optimizer.
    - Startup Manager shows the correct program names again Fixed an issue introduced in 7.09 where Startup Manager displayed wrong names for several common programs.
    - Your chosen landing page is now respected CCleaner now opens to the page you've set in Settings, instead of always defaulting to Health Check.
    - Health Check browser checkboxes work properly Clicking a browser name in the "Close browsers" dialog now correctly toggles its checkbox.
    - Fixed positioning of in-app messages Onboarding and upsell messages now display correctly over the CCleaner window.
