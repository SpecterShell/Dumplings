  Key: ReleaseNotes
  Value: |-
    本次更新
    搜索体验优化
    - 搜索结果拆成「命中」和「猜你喜欢」两块，精确搜到的剧不再被同类推荐挤下去
    - 过滤搜索里的帖子 / UGC 等非剧集条目，避免点开提示“内容不存在”
    - 多季剧卡片直接标注「共 N 季」，不用点进去才知道有几季
    详情页推荐修复
    - 漫剧 / 电影详情的推荐改为同类型内容（更多漫剧 / 更多电影），不再固定塞真人剧
    - 推荐区标题与官方一致（更多好剧），没有可推荐内容时不再显示空推荐区
    加载速度
    - 详情页数据增加 10 分钟缓存，二次进入秒开，推荐内容短时间内保持稳定
    - 详情、多季、推荐改为并行请求，首次打开等待更短
    说明
    - 支持直接覆盖安装，收藏与观看记录不受影响
    - iOS 包仍为未签名测试包，本轮无 iOS 相关改动；Android / Windows 用户无需理会
    iOS（未测试）
    ApexDrama-1.5.4_ios_unsigned.ipa 是未签名包，只能用 AltStore /
    SideStore / Sideloadly 自签安装。该版本未经测试：iOS 上的渲染
    （vo=libmpv 纹理管线 + VideoToolbox）与加密流解密链路尚未在真机
    验证过，可能无法播放。Android 与 Windows 用户请忽略这个文件。
