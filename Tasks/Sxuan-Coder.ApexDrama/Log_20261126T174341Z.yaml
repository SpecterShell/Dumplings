  Key: ReleaseNotes
  Value: |-
    新增：定时关闭
    - 睡前看剧可以设倒计时，时间一到自动停下并退出播放页；也可以选「本集播完就停」
    新增：Windows 悬浮小窗
    - 桌面版可以把播放器缩成一个小窗放在角落，边看边做别的事；小窗里同样能暂停、拖动进度、切换剧集
    播放手势更顺手
    - 竖屏：点一下画面就直接暂停/继续，不用再点两次
    - 横屏全屏：点一下画面唤出或收起控制栏，双击暂停/继续，不易误触
    - 横屏全屏新增「锁定」按钮：锁上后点击、滑动都不再生效，只留一个锁图标用来解锁，躺着看不再误触
    修复
    - 暂停后画面中间的播放图标有时不出现，或者继续播放后图标迟迟不消失；现在会随播放状态立刻变化
    说明
    - 支持直接覆盖安装，收藏与观看记录不受影响
    - iOS 包仍为未签名测试包，Android / Windows 用户无需理会
    iOS（未测试）
    ApexDrama-1.5.8_ios_unsigned.ipa 是未签名包，只能用 AltStore /
    SideStore / Sideloadly 自签安装。该版本未经测试：iOS 上的渲染
    （vo=libmpv 纹理管线 + VideoToolbox）与加密流解密链路尚未在真机
    验证过，可能无法播放。Android 与 Windows 用户请忽略这个文件。
