- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    myEnv 首个正式版本。提供 Windows 图形工作台，以及 Windows / 原生 Linux 的 TUI 和 CLI。
    主要功能
    - 在本机环境、myEnv 默认工具链和项目环境之间明确区分作用范围，支持 Python、Node.js、Java、Go、Rust。
    - 图形工作台提供首次环境检查、官方版本查询、变更预览、任务阶段与日志；准备成功后才切换受管环境。
    - Node.js / Python 包与工具可查询官方目录、安装、更新、切换版本和卸载，支持搜索、批量选择和逐项结果。
    - Python 下的 pip / uv、Node.js 下的 npm / pnpm 提供快捷管理入口，操作绑定具体安装位置。
    - TUI 提供语言与版本选择、预览同步及明确的终端运行交接；CLI 保持 init / sync / run 流程。
    - 修复 Windows Python 短路径和目录联接导致的环境核验误判，保留不同环境拒绝及预览启动钩子隔离。
    当前边界
    提供 Windows amd64 GUI/CLI/TUI、原生 Linux amd64/glibc CLI/TUI。Linux GUI、WSL TUI、macOS、ARM64 和 musl 不在本次支持范围。性能预算、高 DPI、真实 IME、无 WebView2 干净机器及部分管理工具自身写操作仍有验收缺口，详见仓库当前记录。
    GUI 包管理禁用 Node 安装脚本，Python 仅安装 wheel；外部包不承诺自动回滚，复杂 workspace 和未知管理器归属交回原管理器。
