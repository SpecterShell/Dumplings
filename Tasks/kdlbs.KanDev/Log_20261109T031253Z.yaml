    - group profile delete conflict tasks by workspace (#5041) by @jhillyerd
    - add workspace-scoped plugin tools (#5107)
    Bug Fixes
    - preserve legacy handoff report identity (#5150) by @dreampiler
    - classify prefixed OpenCode free usage limits (#5120) by @dreampiler
    - diagnose stalled stop phases (#5139) by @dreampiler
    - reconcile SSH controllers after directory loss (#5145) (#5201)
    - reconcile standalone retained journal owners (#5165) (#5200)
    - preserve fresh-start workflow context (#5137) (#5198)
    - fail closed on missing explicit base (#5142) (#5199)
    - preserve explicit disable at equal timestamps (#5153) by @dreampiler
    - bind worktree script messages without opening a turn (#5151) (#5196)
    - restore workspace trackers after agent restart (#5197)
    - distinguish restored history from requests (#5062) by @dreampiler
    - preserve successful antigravity login streams (#5195)
    - bound logs and temporary scratch for new executors (#5147) by @jumprope-jesse
    - restore transcript scroll after backend restart (#5194)
    - preserve unpublished commits when resuming retained repositories (#5100) by @jumprope-jesse
    - carry cross-step promotion entry ID (#5144) by @dreampiler
    - make generic compaction help provider-neutral (#5166)
    - launch Office runs into prepared sessions with a different profile (#5133) by @point-source
    - preserve startup process exit diagnostics (#5128) (#5168)
    - release capacity-deferred watcher reservations (#5099) by @jumprope-jesse
    - replay uncommitted fresh-start successor streams (#5136)
    - recover incomplete npm caches after upgrades (#5164)
    - handle namespaced versions in upgrade backups (#5154)
    - restore weekly managed runtime updates (#5076)
    - recover interrupted foreground handoff deliveries (#5104) (#5109)
    - scope terminal ownership across shared task environments (#5108)
    - restore Pi built-in MCP project delivery (#5090) (#5096)
    - render rich output from built-in MCP packages (#5097)
