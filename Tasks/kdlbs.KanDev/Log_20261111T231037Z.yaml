  Value: |-
    Warning
    macOS, Windows desktop installers in this release are unsigned development builds.
    They may require manual OS security bypasses and are not trusted downloads.
    If macOS blocks Kandev after you verify the checksum, run:
    xattr -d com.apple.quarantine /Applications/Kandev.app
    0.101.0 - 2026-11-11
    Features
    - select built-in packages and workspace MCPs (#5106)
    - clarify change workflow selector fields (#5249)
    - comment on extracts of task thread comments (#5233) by @jcoatelen-ledger
    - review question images in a large A/B view (#5239) by @point-source
    - cancel running chat turn with escape (#5241) by @ZenitK
    - show CI bubbles on PR status icons (#5244)
    - preview HTML files from review diffs (#5243)
    - remote credentials and config bundle for Pi (#4767) by @naerymdan
    - add Telegram plugin to the registry (#4756) by @scottof
    - move the task graph action into composer actions (#5232)
    - show readable byte sizes in startup progress (#5236)
    - reuse verified managed npm repairs (#5208)
    - classify unmatched provider diagnostics with opt-in context (#4917) by @dreampiler
    - add task relationship graph and create-time linking (#5115) by @ZenitK
    - distinguish recorded waiting reasons (#5148) by @dreampiler
    Bug Fixes
    - match npm token exchange response contract (#5275)
    - ignore creation metadata in npm preflight (#5264)
    - explain npm preflight response failures (#5261)
    - keep attachment previews open across the hover gap (#5238)
    - bind step completion to its source (#5173) (#5247)
    - start edited schedules after the save (#5220) (#5245)
    - recover watch mappings after task deletion (#5206) (#5246)
    - link only workspace-prefixed task identifiers (#5231) by @jcoatelen-ledger
    - classify mid-run provider quota notices (#5222) (#5234)
    - carry pinned client through cancel escalation (#5235)
    - create distinct sessions for explicit spawn requests (#4475) by @yattdev
    - require selected runtime admission (#5228)
    - resolve managed npm prefix in ACP provider probe (#5229) by @jcoatelen-ledger
    - fence profile destination allocation by entry (#4772) by @yattdev
    - harden npm publication reliability (#5226)
    - run executor admission on workflow cold resume (#5176) by @jumprope-jesse
    - isolate dynamic candidate runtime settings (#4600) by @dreampiler
    - preserve structured provider failure signals (#4601) by @dreampiler
    - ignore stopped executor rows when deleting a workspace (#5227) by @jcoatelen-ledger
    - recover delivery health and settled session state (#5225)
    - preserve attachment delivery after workspace rescans (#5223)
    - keep Done visible during task dragging (#5224)
    - allow edits past unresolvable retained executor bindings (#5179) by @jumprope-jesse
    - settle context-continued notices and keep workspace recovery session-owned (#5177) by @dreampiler
    - preserve explicit workflow launch prompts (#5178) (#5213)
    - repair SCP locators and clone URLs (#5212)
    - retain selected profile when promoting a workspace (#5162) by @dreampiler
    - return typed workspace deletion errors (#5209)
    - report bounded update stream stages (#5138) by @dreampiler
    - detach inherited environment on non-Kubernetes executor transition (#5175) by @dreampiler
    - recover brief refresh lock contention (#5215)
    - admit authorized Claude API-key profiles on remote executors (#5214)
    Performance
    - reuse session summary observations and parse projection JSON once (#5185) by @jumprope-jesse
    Documentation
    - fix PR screenshot publishing guidance (#5242)
