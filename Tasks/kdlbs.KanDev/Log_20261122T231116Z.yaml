  Key: ReleaseNotes
  Value: |-
    Warning
    macOS, Windows desktop installers in this release are unsigned development builds.
    They may require manual OS security bypasses and are not trusted downloads.
    If macOS blocks Kandev after you verify the checksum, run:
    xattr -d com.apple.quarantine /Applications/Kandev.app
    0.103.0 - 2026-11-22
    Features
    - list the Step History canvas in the registry (#4516) by @sharifndlovu123
    - complete plugin grouping for saved sidebar views (#5427) by @Fclem
    - report session configuration outcomes (#5376) (#5411)
    - support file viewers in panels and rich previews (#5367)
    - sync saved prompts from a repository with prompt sync (#5394) by @point-source
    - make Kandev MCP calls wait while detached, with offline budget (#4809) by @nova28
    - read API for task step transitions (#4591) by @qwent71
    - clarify workspace access and enable turn summaries (#5406)
    - compact expandable rows for the workflows settings list (#5396) by @point-source
    - auto-merge sub-task messages into their sender's queued entry (#5397) by @Fclem
    - add web preview annotation mode with the shared comment surface (#5392) by @point-source
    - retry a transient launch failure once (#5386) by @EmersonHenriique
    - keep reviewers off the author's provider (#5375) by @point-source
    - show OMP's native update check in Settings (#5390) by @Fclem
    - classify the devin-acp free-model rate limit (#5381) by @EmersonHenriique
    - show workspace root files in Changes (#5372) (#5379)
    - list the Azure DevOps plugin in the registry (#5267) by @JnManso
    Bug Fixes
    - keep Codex MCP startup reports out of turns (#5419) (#5434)
    - bootstrap OpenCode v2 session credentials (#4995) by @mysticfall
    - preserve Claude shell exits after Stop (#5421) (#5431)
    - improve mobile terminal keybar discoverability (#5423) (#5432)
    - preserve coordinator goal's first edit (#5425) (#5430)
    - keep session package caches off the memory-backed auth volume (#5428)
    - harden Prompt Sync quota and override handling (#5416) (#5429)
    - recover retained remote executor sessions (#5422)
    - settle Claude background jobs from provider evidence (#5405)
    - settle stale delivery recovery blocks (#5408)
    - reject conflicting Claude exact-model aliases (#5410)
    - explain Cursor MCP discovery failures (#5407) (#5409)
    - bound the recovered-delivery replay agentctl lease (#4796) by @nova28
    - retain managed Git credentials on relaunch (#5403)
    - settle root status and recover capture and retention progress (#5402)
    - bound utility request context and settle cancelled calls (#5384) by @EmersonHenriique
    - stop deleted dynamic profiles from blocking their candidates (#5383) by @EmersonHenriique
    - let a step profile switch supersede an in-flight launch (#5385) by @EmersonHenriique
    - open Windows no-follow paths from the volume root (#5382) by @EmersonHenriique
    - declare items for every array tool parameter (#5380) by @EmersonHenriique
    - start coordinator dream session before prompting, closes #5388 (#5395)
    - make Docker storage limits opt-in (#5240) (#5387)
    - prevent Improve Kandev bootstrap timeouts (#5327) (#5389)
    - repair MCP subtask workspace reuse (#5370) (#5378)
    - resolve the requested workspace on PostgreSQL and Linear issue routes (#5341) by @calltelemetry-jason
    Documentation
    - add pinned server extension example (#4749) by @yattdev
