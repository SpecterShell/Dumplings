  Key: ReleaseNotes
  Value: |-
    - (NEW) Region Builder now has the option to delete the source vectors after crating a region.
    - (NEW) Added "Square Corner" option for the Offset command.
    - (NEW) Node Edit Command: Added "Check Cutter Access" option.  This is flipped from the dedicated command, where the red sections are inaccessable, to keep the view cleaner.  Added option to show vector direction.  Added option to flip the direction of a vector.  Shortcuts are now collapsible.
    - (NEW) Cutter Check command now uses green to show the accessable areas to b more consistent with the Node Edit version.
    - (NEW) Darken up vertical surfaces in 3D rendering to show depths better.
    - (FIX) Fixed how parts of the model are calculated to reduce the chance of overlapping components, like Angled Plane components that share an edge.
    - (FIX) More work to fix the "stale button" problem where some buttons remain in the hover state after the command runs.
    - (FIX) Swap renderer back to perspective mode instead of orthographic.
