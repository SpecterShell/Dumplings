  Key: ReleaseNotes
  Value: |-
    Pilo v0.5.1
    优化与修复
    - 待发送消息更好管理：桌面端和远程 WebUI 都能查看排队消息、取回编辑，或中断当前回复并立即发送。
    - 新增「简略输出」：将思考过程和工具调用折叠成步骤摘要，需要时再展开查看。
    - 移动端 WebUI 更稳定：改善软键盘弹出时的布局，修复发送模式和上下文用量弹窗的位置，以及流式回复时聊天列表意外跳动的问题。
    - 会话切换与输入更可靠：修复切换会话时首条消息可能发到错误会话的问题。新建聊天时自动聚焦输入框，桌面快捷键在输入框内也能正常使用。
    - macOS 窗口恢复与安装体验改善：修复从菜单栏恢复窗口时 Dock 图标未显示、窗口未切到前台的问题；更新 DMG 外观并恢复拖拽安装布局。
    完整变更：v0.5.0 → v0.5.1
