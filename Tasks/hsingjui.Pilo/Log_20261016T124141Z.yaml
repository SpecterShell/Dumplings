  Value: |-
    新功能
    - 远程访问设置新增局域网地址选择器，方便选择 WebUI 访问地址
    - 主题支持分别配置桌面端与移动端尺寸，改善不同设备上的显示体验
    - 聊天活动中读取 Skill 时显示专属图标和名称
    优化与修复
    - 修复恢复会话时覆盖正在使用的会话状态和输入草稿的问题
    - 支持增量扫描恢复缺失的历史会话标题
    - 缓存保活计划提示延后至执行前 30 秒显示，减少界面干扰
    - 精简聊天活动布局，优化长名称截断显示
