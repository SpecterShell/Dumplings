  Key: ReleaseNotes
  Value: |-
    v0.3.5
    新功能
    - 新增系统托盘、开机启动和可自定义的全局窗口唤起快捷键
    - 聊天支持文件附件，桌面端与 WebUI 均可使用
    - 移动端 WebUI 支持增量加载项目会话，减少首次加载等待
    优化与修复
    - 改进 Pi 自动发现，支持更多 npm、pnpm、Bun 和独立安装路径，并保留运行所需的 PATH
    - 修复 Windows 下 Pi 扩展和工作区路径兼容问题
    - 修复会话刷新时缓存丢失的问题，避免并发刷新冲突
    - 修复缓存保活任务中断后的状态处理
    - 优化局域网访问地址选择，优先显示物理网卡地址
    - 改善 KDE Wayland 下的窗口装饰、应用图标关联和 AppImage 缩放
    - 新增连接、请求及前端启动失败诊断日志，便于排查问题
    - 优化聊天控件、设置页面和启动加载布局
    完整变更：https://github.com/hsingjui/pilo/compare/v0.3.4...v0.3.5
