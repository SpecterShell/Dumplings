  Key: ReleaseNotes
  Value: |-
    Pilo v0.4.0
    新功能
    - 选择 SSH Agent 密钥：配置 SSH 连接时，可以从 Pilo 主机的 SSH Agent 中指定密钥，也可以沿用 SSH 默认设置。
    - 按连接启用本地 Pi 资源：SSH 连接使用「本地 Pi」时，可以单独开启主机上的 Skill、扩展、MCP 和本地工具。默认关闭，桌面端和 WebUI 共享设置。扩展可在主机上执行代码，请只对信任的 SSH 工作区开启。
    优化与修复
    - 跨设备聊天更一致：桌面端和 WebUI 重连后会重新校准当前会话，补齐断线期间错过的回复。
    - 长聊天更流畅：减少流式输出期间的重复渲染，返回聊天时保留滚动位置，工具调用完成后也会保留已展开的详情。
    - 修复聊天内嵌工具图片无法打开，以及删除会话后新聊天可能复用旧会话的问题。
    - 改善 macOS 局域网访问和 SSH 连接兼容性，并修复部分旧款 x86_64 Linux 主机无法启动 SSH 运行时的问题。
    功能移除
    - 移除 v0.3.9 引入的 WebUI 只读屏幕共享。
    完整变更：v0.3.9 → v0.4.0
