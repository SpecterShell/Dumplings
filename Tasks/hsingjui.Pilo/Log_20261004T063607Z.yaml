  Key: ReleaseNotes
  Value: |-
    新功能
    - 桌面端自动更新 — 设置里的更新卡片改为侧栏底部更新按钮，检测到新版本后展示下载进度，可一键下载、安装并重启
    - Remote Web PWA — 新增 Service Worker 与更新提示，Remote Web 可作为 PWA 安装到桌面/主屏，新版本在当前会话空闲时就绪后再更新；补充 maskable 图标与主题元数据
    - Remote 断线恢复 — 断网或网络切换后自动重连并显示离线提示，恢复后自动重新同步会话列表
    修复
    - 修复共享 Host 轮次被误判为中断
    - 修复 Pi 响应失败标签重复显示
    - 修复通知在会话命名完成前发出导致标题缺失
    - 修复 Remote Web 移动端会话行图标槽与标题错位
    - 修复 Remote Web 重复拉取 run config 目录
    - 连接「显示在首页」改为后端存储，桌面端与 WebUI 共享同一设置
    完整变更：https://github.com/hsingjui/pilo/compare/v0.2.1...v0.2.2
