  Key: ReleaseNotes
  Value: |-
    v0.3.7
    新功能
    - 桌面端新增 Git 变更 Tab，支持查看已暂存、未暂存变更和文件 Diff，移除原右侧栏
    - 新增文件预览 Tab，支持打开聊天中的文件路径及 WSL、SSH 远程文件链接
    - 工具活动中的文件路径支持点击打开预览
    - 新增按需提示词增强，支持按连接配置模型，桌面端与 WebUI 均可使用
    - 支持设置项目默认模型及思考等级
    - 聊天新增每轮 Token 用量与费用、可折叠的思考过程及耗时、Todo 任务清单
    - 支持 Alt+Enter 排队发送，新增桌面插件通知开关
    - 会话侧栏菜单新增刷新操作
    优化与修复
    - 统一图片、文件和会话引用的附件标签，改善输入框高度、删除操作和移动端布局
    - 改善流式回复自动滚动，减少输入和调整高度时的闪动与跳变
    - 修复新建聊天重复草稿及会话刷新问题
    - 修复 Windows 会话路径兼容、终端目录及控制台窗口问题，改善项目模型配置同步
    - 修复提示词增强结果过期覆盖问题
    - 修复退出程序时未取消待连接任务的问题
    - 增强模型无响应保护，优化启动加载与语法高亮体积
    致谢
    感谢 @PeterZhang0612 和 @ruanimal 对本版本的贡献！
    完整变更：https://github.com/hsingjui/pilo/compare/v0.3.6...v0.3.7
