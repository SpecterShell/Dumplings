  Key: ReleaseNotes
  Value: |-
    v0.3.8
    新功能
    - 新增内置 Agent 控制 CLI，支持查询和调整 Pilo 设置，桌面端与 WebUI 共享 Host 偏好设置
    - 设置页支持按连接加载 Pi 模型目录，为会话命名、提示词增强、下一步提示和缓存保活选择对应环境的模型
    - 聊天支持项目文件链接与源码行号定位，改善文件及 Markdown 预览导航
    - 行内代码支持点击复制，消息引用独立显示在正文上方，欢迎页可直接选择项目
    优化与修复
    - 加快模型目录刷新，仅为当前可见连接自动加载目录；刷新模型时不再加载用户或项目扩展，扩展注册的模型与默认值覆盖不参与目录探测，正常聊天不受影响
    - 修复刷新模型列表时焦点丢失，以及移除后重新添加项目时模型偏好丢失的问题
    - 修复 WebUI 发送消息时输入框不可编辑、不同会话之间进度与通知串扰，以及刷新页面后项目选择丢失的问题（#26、#27）
    - 优化超长思考过程和 Markdown 流式渲染，减少大段内容带来的卡顿
    - 修复图片提示与排队消息的确认匹配，以及排队消息之间出现空白回复行的问题
    - 下一步提示不可用的通知支持关闭；修复加载占位状态下提示词增强仍可触发的问题
    - 改善移动端输入框间距、启动布局、折叠展开时的定位，以及内置主题的选区和焦点对比度
    - 修复 Windows 下 mise 管理的 Node.js 探测和 UTF-8 输出兼容问题
    完整变更：https://github.com/hsingjui/pilo/compare/v0.3.7...v0.3.8
