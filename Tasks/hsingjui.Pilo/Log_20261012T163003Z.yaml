- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新功能
    - 远程访问支持多地址配对：一次扫码为局域网、外网、组网地址签发授权，配对链接 10 分钟有效，设备授权 30 天
    - 远程地址设置简化：回车添加地址，自动补全 http/https，扫码入口固定为局域网地址
    - 工具调用显示退出码、耗时与截断标记，并识别 MCP 工具名
    - 发送与响应正确关联，乐观插入的轮次在 Pi 响应后落定
    修复
    - 远程访问：保留流式回复不再重复，配对失败给出具体原因
    - 重试失败原因显示在输入框上方，可随时停止重试
    - 打开模型选择器时高亮并滚动到当前模型
    - 未读状态按运行时快照判定，停止或失败的进程不再误报未读
    - 外部 Pi 会话按 JSONL 尾部判断进行中，长工具调用不再误判结束
    - 扩展报错以通知展示，不再静默失败
    - 修复三击选中段落会带上前一块边界、Android PWA 状态栏颜色不一致
    完整变更：https://github.com/hsingjui/pilo/compare/v0.2.3...v0.2.4
