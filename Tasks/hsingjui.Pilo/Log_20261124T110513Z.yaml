  Value: |-
    Pilo v0.5.0
    桌面端和远程 WebUI 已迁移到 nsh，带来重新设计的工作区、更快的长会话加载，以及新的应用内更新机制。
    从 v0.4.1 或更早版本升级，请从本页 Assets 手动下载并安装一次。 旧版 Tauri 客户端无法通过应用内更新升级到这一版。安装新版后，后续版本可在应用内检查并安装更新。
    主要变化
    - 桌面工作区改版：重新设计侧栏、聊天输入框和设置页。点击聊天里的文件链接，可在工作区直接预览并跳到对应行。
    - 长会话切换更快：打开时先显示最近消息，向上滚动时再按需加载更早的历史。
    - 远程 WebUI 改版：扫码配对页不再预先加载整个聊天界面；刷新页面后可恢复当前项目未发送的文字草稿。
    - 新增四款内置主题：Grove、Ocean、Ember 和 Iris。界面、阅读、代码和终端字号可分别调整。
    兼容性变化
    - 远程 WebUI 不再提供离线 PWA 模式。
    - 设置中不再提供自定义主题编辑；已保存并启用的自定义主题仍可显示。
    完整变更：v0.4.1 → v0.5.0
