- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新功能
    - 添加项目对话框支持直接选择本地目录
    - 设置拆分字体偏好，界面与代码字体可分别设置，移动端排版更稳定
    - Markdown 回复中直接渲染项目图片
    性能
    - 大内容渲染加界，长会话滚动更稳
    - 历史会话投影落盘缓存，打开大 session 与搜索更快
    - 远程会话更新与工作区渲染隔离，减少无谓重绘
    - 实时事件队列按 payload 限流，读取快照不再等待 session 锁
    修复
    - 桌面会话中断后再次发送会自动重连
    - 窗口尺寸适配系统工作区，多显示器布局重启后保持
    - 会话标识按项目划分，跨项目不再串会话
    - 侧边栏：移动端导航与删除确认、空 recent 分组标题、忽略过期刷新响应
    - 聊天：触屏模型选择器与发送按钮、工具调用行紧凑、IME 组合输入、工具行元数据
    - 远程：丢弃过期历史分页、后台活动刷新索引、移动端删除会话
    - 拒绝通过项目根路径修改文件
    完整变更：https://github.com/hsingjui/pilo/compare/v0.2.4...v0.2.5
