  Key: ReleaseNotes
  Value: |-
    Pilo v0.4.1
    优化与修复
    - 大聊天打开更快：增量读取新增的会话历史，减少打开长会话和流式回复时的渲染开销。
    - 移动端更易操作：扩大触控区域，改善聊天查找、弹窗和软键盘共存时的布局，并保留用户设置的字号。
    - WebUI 更稳定：回到前台时自动重连，支持设备授权续期，并防止历史刷新覆盖尚未确认的消息。
    - 聊天交互更可靠：外链图片加载失败后可以重试，改善局域网 HTTP 下的复制行为，并在复制失败时提示。
    - 会话状态更新更及时：由主机主动推送外部 Pi 会话活动；修复 Windows 上服务端处理部分 RPC 请求时可能出现的栈溢出。
    完整变更：v0.4.0 → v0.4.1
