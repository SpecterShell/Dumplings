    - 浏览空闲会话不再启动 Pi，及时回收闲置进程
    修复
    - 保留上一轮延迟输出，正确展示 write 工具内容
    - 修复提示词预测超时，优化移动端输入与附件操作
    - 修复内置 Server 查找及 Linux AppImage 打包问题
