  Value: |-
    Fixes
    - Fix rendering of YAML with leading indentation following newlines (#1990).
    - Fix import analysis failures for glob imports into local package deps (#1992).
    - Fix pkl project package with multiple projects (#1981).
    - Fix subscript access on unparameterized List/Listing/Map/Mapping references (#1993).

    Additions
    - Add publications for pkl-server, and pkl-profiler (#1995).

