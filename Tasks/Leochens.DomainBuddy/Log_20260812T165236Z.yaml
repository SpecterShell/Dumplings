  Value: |-
    做了个本地的域名管理器 DomainBuddy 可以方便的管理域名解析，原因是我有大量的域名和应用，分布在不同的服务商，比如腾讯云，阿里云，火山引擎甚至还有 cloudflare 等，每次加解析或者想看看域名解析的时候总是要各种登录。
    但是这些大服务商基本上都有 api 形式的管理途径，所以我直接 vibe 了一个域名管理的小 App，集中起来管理。
