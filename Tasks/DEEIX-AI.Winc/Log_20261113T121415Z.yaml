- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    ✨ Feature
    - Add SSH Remote (experimental, off by default): open a folder on a remote host through the system ssh, with the file tree, editing, search, Git, terminal and formatting running on the host (#104)
    - Add Vim mode (experimental, off by default), with normal, insert, replace and visual modes, text objects, registers, macros, mappings, surround, the command line and :help (#40)
    - Show the changelog in the app: a notice after each update, and a Release Notes tab from the command palette, Settings › About and the application menu on macOS (#157)
    - Add a first-time setup to the start page for appearance, theme, language and modules, opened by a launch animation
    - Add ArkTS syntax highlighting for .ets files, and list struct and class members in the outline
    - Show long lines in full with "Show Whole Line" at the end of a cut-off line, or always with the new "Show Long Lines in Full" setting
    - Zoom image and SVG previews around the pointer with the wheel, pan by dragging, and double-click to fit (#149)
    - Remember the reading position of each PDF (#148)
    - Fold unchanged regions in diff tabs again after expanding them, from the gutter or with the fold shortcuts (#169)
    - Add a horizontal scrollbar to each side of a diff tab
    - Search branches in the Git log filter
    - List recent folders in the Dock menu on macOS, the taskbar jump list on Windows and the launcher actions on Linux (#167)
    - Open search results in the preview tab when Preview Tabs is on (#176)
    - Show progress for long copies in the file tree, with a Cancel button
    - Show the system window menu when right-clicking the blank part of the top bar on Windows and Wayland (#165)
    - Support CachyOS in the Arch Linux install script
    ⚡ Optimization
    - Glide on far jumps in the Markdown preview, PDF preview, file tree, outline, search results and commit list, as the editor does
    - Continue touch scrolling with inertia, and keep a trackpad gesture on the axis it started with
    - Reduce memory use by about 75 MB after previewing an SVG that contains Chinese text, and remove spikes of up to 100 MB when opening the font list
    - Speed up editing and scrolling on very long lines: a keystroke on a 3 MB line takes 14 ms instead of 288 ms
    - Limit the memory held by image and SVG preview caches
    - Show one character on the project badge for full-width names (#145)
    - Locate a diff tab's file in the file tree when the tab is selected
    - List declarations preceded by annotations or decorators on the same line in the outline, such as @Override in Java
    - Turn off the input method where no text can be typed, such as the file tree and result lists
    - Refine the interface wording in both languages
    🐛 Fixed
    - Fix title bar buttons not responding on Windows when the UI zoom is not 100% (#164)
    - Fix a click on the title bar restoring a maximized window on Windows, and a window that fills the screen being remembered as its normal size (#166)
    - Fix double clicks above, below or between top bar controls maximizing or restoring the window (#165)
    - Fix a file opened from another launch not bringing the window to the front on Windows (#177)
    - Fix a newly opened tab not scrolling into view when many tabs are open (#161)
    - Fix blurry text on low-density displays on Windows and Linux (#162)
    - Fix the terminal's minimum contrast recoloring Powerline separators and box-drawing characters, which broke prompt segments (#168)
    - Fix typed letters not showing while composing on a blank line in the Markdown preview (#152)
    - Fix text being composed in the terminal also appearing in the Markdown preview
    - Fix rows overlapping past row 16,777,216
    - Fix hover effects in a window that lies under another window on macOS
    - Fix a click during a scroll glide landing on the glide's target instead of the line on screen
    - Fix wheel or touch input during a scroll glide jumping to the glide's target
    - Fix a startup race that could lose unsaved changes when restoring backups under heavy load
