- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    ✨ Feature
    - Split the editor into panes: split right or down to any depth, drag a tab or files onto a pane, and open one file in several panes, with "Split Right", "Split Down" and "Join All Splits" (#238)
    - Add a hex view: "Open as Hex" shows any file read-only, with selection, copying as hex or text, and "Go to Offset…"
    - Ask before closing a window or quitting, with the new editor.confirmClose setting (#208)
    - Retry a save the system refuses with "Retry as Administrator…", through UAC, the macOS authorization dialog or pkexec (#298)
    - Add IntelliJ IDEA and VS Code keymaps (keyboard.keymap): pick one on first launch or in Settings › Shortcuts, or import shortcuts from either editor installed on this computer, and the IntelliJ IDEA keymap opens quick open with Shift pressed twice
    - Edit shortcuts in Settings › Shortcuts: change, add, remove or reset a command's keys, find a command by pressing its keys, and see conflicts before saving
    - Add Markdown writing tools: shortcuts for headings, lists, quotes, code and math blocks, tables, links and images, a / command list filtered by English or pinyin, and a selection toolbar
    - Add Markdown focus mode (F8), typewriter mode (F9) and a word count in the status bar
    - Suggest files after ]( and headings after ](# in Markdown links, and underline links to missing targets
    - Resize Markdown images by dragging their handle or with "Image Size", and collapse headings from the arrow on their left
    - Render LaTeX math in Markdown written as \(…\), \[…\] or a bare environment such as align (#328)
    - Preview LaTeX documents: .tex files get their own icon and compile with the local TeX on macOS and Windows, with build progress, an error list, gutter markers and jumps between source and PDF, and latex.path names the program (#328)
    - Show blame on both sides of a Git diff, and add an "Open File" button to its header that opens the file at the line in view (#318, #324)
    - Edit history from the Git log: edit a message, drop, undo or push up to a commit, fixup or squash staged changes into it, use branch submenus, and go to the child or parent commit with ← and →
    - Pull from and push to any remote from the Git dialogs (#306)
    - Open files and folders from other apps with winc://file/<path>:line:column links
    - Show recently opened files in the Dock menu, the Windows jump list and "Open Recent…"
    - Drag local files out of the file tree into other apps on macOS and Windows, and delete files with "Delete Permanently", Shift+Delete (⌥⌘⌫ on macOS) (#275, #276, #284)
    - Work with remote projects in more ways: open them with winc ssh://host/path[:line[:column]], download files and folders with "Download…", and map them to local mounts with remote.localFolders (#200, #282)
    - Split a terminal tab into several shells with "Split Terminal", and add "Terminal: Copy" and "Terminal: Paste" with each platform's clipboard keys, such as Ctrl+V and Shift+Insert on Windows (#302)
    - Ship an RPM package for Fedora 40+, RHEL 10 and openSUSE Tumbleweed (#258)
    ⚡ Optimization
    - Offer three auto save modes in editor.autoSave: "Off", "On Focus Change" and "1 Second After Typing", and save when focus moves to the terminal or file tree (#234)
    - Show how much of a large file has been read while it opens
    - Reopen binary files with a chosen encoding, and detect UTF-16 without a BOM
    - Look in dependency folders when go to definition finds nothing in the project
    - Turn off smooth wheel scrolling with editor.smoothScrolling on macOS
    - Remember Source, Split or Preview separately for Markdown, SVG and table files, also after a restart (#305, #311)
    - Show a single newline in a Markdown paragraph as a line break, so Shift+Enter gives a compact break as in Typora
    - Convert Markdown pastes: a URL over selected text becomes a link, spreadsheet cells a table and rich text Markdown, with "Paste as Plain Text" to skip, and pasted images follow markdown.imageFolder and markdown.imageName
    - Honour ![alt|300], ![alt|300x200] and <img> sizes, and shrink tall Mermaid diagrams or fold them behind "Show All"
    - Keep a history diff's commit in a banner and switch between its files in the same tab, and show long names in full in the Git log's resizable panels
    - Choose whether pulls merge or rebase with git.pull, and stage or unstage whole folders from the staging tree (#307)
    - Keep 50 recent folders for "Open Recent…"
    - Mark symbolic links with a badge on their file tree icon, and match file icons by extension first, covering more lock files, manifests and build scripts
    - Paste clipboard images and copied files into a remote terminal by uploading them to the host first
    - Add a terminal.fontWeight setting, and list MSYS2's bash, zsh and fish as shells on Windows (#332)
    - Drag the settings card by its title row to see what is behind it (#279)
    - Show an icon for each notice's kind, and size in-app alerts on Windows and Linux to their content
    - Move "Use System Proxy" to About as network.systemProxy
    - Notify deb, rpm, Arch and portable zip installs about updates, linking to the downloads page
    🐛 Fixed
    - Fix toggle comment using the outer language's syntax in <script>, <style> and Markdown code blocks (#335)
    - Fix toggle comment doing nothing in languages with only block comments, such as CSS (#277)
    - Fix scrolled text wobbling against its highlights
    - Fix occasional horizontal tearing while scrolling with a touchpad on Windows
    - Fix quick open missing files opened earlier that the index skips, such as ignored .env files
    - Fix go to definition and find usages skipping added folders (#299)
    - Fix two Markdown list items switching to source together when the caret follows a trailing space, and typed trailing spaces not showing
    - Fix a Markdown list number sitting below an image on the item's first line
    - Fix the editable Markdown preview drifting when clicking back and forth
    - Fix the rendered part of a Markdown block not sliding with the blocks when its source shows or hides
    - Fix identical collapsible blocks and Mermaid diagrams opening and closing together
    - Fix a stray space at the start of a paragraph's second half when display math splits it
    - Fix the Markdown preview crashing on an HTML block holding only <br>
    - Fix EPUB contents jumps and tab switches losing the reading place (#278)
    - Fix clicking an untracked file in Git changes failing on Git before 2.24 (#285)
    - Fix repositories being treated as untrusted on Git 2.24–2.26, and merge pulls failing on Git before 2.27
    - Fix folder and group checkboxes in the commit view checking everything after a hunk or line was unchecked
    - Fix pushing to an upstream branch with a different name
    - Fix the Git log not following the repository switched to in the sidebar
    - Fix worktrees of submodules being listed and placed wrongly
    - Fix windows of different projects reopening with one shared size and position (#286)
    - Fix anchored menus drifting from their buttons when the terminal is on the right, and notices moving while the terminal restores
    - Fix uneven spacing under the worktree, stash and outline headers, and the missing folder group icon in the project menu
    - Fix copying or cutting in a remote file tree pasting old clipboard content (#272)
    - Fix Ctrl+J not hiding the terminal panel from inside the terminal (#319)
    - Fix Chinese file names showing as escapes in MSYS2, Cygwin and Git Bash terminals on Windows (#332)
    - Fix the missing entry point error on Windows 10 before 1809: the terminal panel now says it needs version 1809 or later (#293)
    - Fix update checks failing behind a corporate proxy, and show why a check failed (#291)
