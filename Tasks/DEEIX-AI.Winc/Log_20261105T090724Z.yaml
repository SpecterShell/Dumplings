- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    ✨ Feature
    - Add an optional minimap to the editor, off by default and available in Settings (#4)
    - Support several Git repositories in one folder, with switching between them (#15)
    - Add a toggle to include ignored files in global search
    - Write panic details to a local crash.log to make problems easier to report
    ⚡ Optimization
    - Speed up the animations of the settings card, quick open panel and input bars
    - Use AVX2 for compositing on x86-64 CPUs that support it, with a fallback for older CPUs
    - Show each repository's branch and changes in the project menu (#15)
    - Grow the global search and replace boxes with their text
    🐛 Fixed
    - Fix the minimap moving the view twice on press and not landing where the pointer is
    - Fix the deb package missing runtime dependencies, which crashed it at startup under X11 on a clean system
    - Fix quick open missing some files (#13)
    - Fix a possible crash in the live Markdown preview while editing (#12)
    - Fix Linux fallback fonts that lacked the characters they serve, which broke CJK and other text (#7)
    - Fix programs not being found on Windows when the variable is named Path
    - Fix failures when starting a program whose file is briefly busy; the start is now retried
    - Fix the editor and terminal tabs not scrolling sideways with the mouse
