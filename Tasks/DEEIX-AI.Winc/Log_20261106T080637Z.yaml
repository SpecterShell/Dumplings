- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    ✨ Feature
    - Rework the Git review flow: separate untracked files in the commit view, and show the current worktree beside the project name
    - Replace the branch menu with a searchable picker that has a / folder tree, sorts local branches by last commit and keeps the current branch first
    - Add a location picker to switch between repositories and worktrees, including repositories nested deeper in the folder
    - Add worktree and branch menus to the status bar, with sync, fetch, pull, push, new branch and new worktree
    - Combine sync and fetch into one control that shows ahead and behind counts, spins while working and confirms when done
    - Confirm before force pushing, committing and pushing, undoing a commit, or switching branches with uncommitted changes
    - Add a switchable inline layout to diffs
    - Support word wrap in the diff view
    - Mark the current diff change and step through changes and files
    - Render whitespace in the editor and diffs
    - Compact single-child folders in the file tree (#24)
    - Choose installed fonts from a menu in settings (#32)
    - Add settings for line numbers, the status bar and restoring the window size and position (#39, #53)
    - Add Ctrl+Alt+S as a second settings shortcut, and a settings button in the status bar (#30)
    - Register Winc as an Open With option for common file types (#41)
    - Embed the app icon in the Windows executable (#34)
    ⚡ Optimization
    - Smooth scrolling, and align wheel redraws to the screen
    - Speed up go to definition across files
    - Animate file tree label changes and overflow, and folding in the Git pickers
    - Align the commit view's folder rows with the file tree
    - Keep one sidebar width across all views, remembered for new windows and later launches
    - Refresh Git state across worktrees, including changes made outside Winc
    - Open worktrees in the current window unless a new window is chosen
    🐛 Fixed
    - Fix the Markdown preview scrollbar not being draggable
    - Fix some letters turning thinner instead of bolder in synthetic bold, such as i in JetBrains Mono
    - Fix worktrees whose upstream was deleted failing to be removed
    - Fix pull failing on diverged branches when pull.rebase is not set
    - Fix shortcuts not matching on keys taken by the input method (#30)
    - Fix text on the read-only side of a diff not being selectable or copyable (#38)
    - Fix a Windows terminal freezing silently after losing its pseudo console; it now reports the loss and confirms before ending programs (#36)
    - Fix the top line moving when toggling word wrap
    - Fix diff keys not working from the commit list
