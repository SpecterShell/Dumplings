Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    ✨ Feature
    - Add WYSIWYG editing to the Markdown live preview
    - Apply list, heading and quote syntax only after a trailing space in the Markdown live preview
    - Add task item input via - [ , [], -[] and 【】 in the Markdown live preview
    - Auto-close code fences when typing the third backtick or tilde
    - Renumber ordered lists on Enter, and indent or outdent list items with their children via Tab and Shift+Tab
    - Add structure-aware deletion that joins blocks across blank lines and never leaves a code fence half-deleted
    - Add Cmd/Ctrl+Enter to exit code blocks and formulas
    - Add Markdown formatting shortcuts: Cmd/Ctrl+B, Cmd/Ctrl+I, Cmd/Ctrl+E and Shift+Cmd/Ctrl+X for bold, italic, inline code and strikethrough
    - Make horizontal rules editable in place in the Markdown live preview
    - Add class, ER, mindmap, git and Gantt diagram rendering to the Markdown preview
    - Add horizontal scrolling for wide tables in the Markdown preview (#102)
    - Improve anchor navigation in the Markdown preview
    - Add window background images with adjustable opacity and fill, fit, stretch and tile modes (#110)
    - Add the Snow Veil, Linen Veil, Night Veil and Umber Veil themes, designed for background images
    - Add a global font weight setting (#112)
    - Add font size adjustment via Cmd/Ctrl + mouse wheel in the editor, terminal and PDF preview (#125)
    - Add an animations setting that overrides the system reduced motion preference
    - Add a dedicated Git settings page
    - Add a Confirm Before Pushing setting that shows the target remote before publishing, pushing or syncing
    - Add support for opening a single file without opening its folder (#128)
    - Add a New Window command, and open a new window when Winc is relaunched without arguments (#117)
    - Open new windows in full screen when the current window is in full screen (#124)
    - Persist folded regions per file across sessions and restarts (#133)
    - Add a scrollbar, page thumbnails and a toolbar with a page indicator to the PDF preview
    - Add PDF zoom from 50% to 200% via the toolbar, pinch and Cmd/Ctrl + mouse wheel
    - Add multicolor word highlights to the editor and Git diffs via Cmd/Ctrl+Shift+F7, cleared with Shift+Esc
    - Keep up to six word highlights, reusing the oldest color when all are in use
    - Add sticky scope headers to expanded Git diffs in both side-by-side and inline layouts
    - Show both line numbers for unchanged lines in pinned headers of inline Git diffs
    - Move the caret to the clicked line and column when clicking a pinned header in Git diffs
    - Add text search to Git commit diffs on either side, defaulting to the older side for deleted files
    - Add a changed-file tree to Git commit diffs that opens files in the same tab
    - Add a tree and list view toggle to Git change lists, with compact folders
    - Show the full file name, revision and directory in tab tooltips, including inactive Git history diff tabs
    - Add Open in Winc to the context menus of Windows Explorer, Dolphin, Nemo and Finder (#103)
    - Add an Install winc Command menu item on macOS
    - Add touchscreen support for tapping, double-tap word selection, scrolling, long-press context menus and dragging scrollbars and dividers
    - Add native window dragging, edge snapping, maximizing and restoring on Windows for touch and mouse
    - Add Arch Linux packages and a signed package repository
    ⚡ Optimization
    - Reduce editor scroll frame time by about 55%
    - Reduce release binary size by about 0.7 MB
    - Add word wrap support for very large files, computed in the background with visible lines wrapped immediately
    - Reduce scroll frame time for very large files by about 85%
    - Improve drawing, selection, caret movement and minimap performance for long lines
    - Improve text rendering performance by about 25%
    - Improve large file indexing and loading performance
    - Eliminate a UI freeze of about 1.5 s when opening settings (#126)
    - Cache the background image on disk and share it across windows, avoiding re-decoding on startup and resize
    - Reduce PDF preview memory usage by about half
    - Render each keystroke's final layout in the same frame in the Markdown live preview
    - Remove reflow animation while typing in the Markdown live preview
    - Move the caret past hidden list, quote and indent markers in the Markdown live preview
    - Follow wrapped rows with Home and End in the Markdown live preview
    - Keep the caret on the upper row when clicking or moving at a wrap point in the Markdown live preview
    - Select a line without its list marker on triple-click in the Markdown live preview
    - Add a paragraph when pressing Down at the end of a document ending in a code block, table or rule
    - Allow scrolling past the last line in the Markdown live preview
    - Show the caret when clicking an empty Markdown document, and keep the scroll position on Select All
    - Reveal matches in folded regions when navigating search results in Git commit diffs
    - Keep the caret and search matches below pinned headers in Git diffs
    - Keep Winc running after closing the terminal that launched it on Windows
    - Show the character limit in the truncated-line notice
    - Show a notice when a search match lies beyond the visible part of a long line
    - Show word wrap status for large files in the status bar
    🐛 Fixed
    - Fix Alt+V image paste for terminal agents on Windows and WSL (#116)
    - Fix Alt key combinations not being sent as Meta to terminal programs on Windows and Linux
    - Fix pasting an image-only clipboard into the terminal
    - Fix clean WSL repositories showing files as deleted and untracked (#130)
    - Fix committing, reverting and staging files in subdirectories of WSL repositories
    - Fix cloning into WSL folders
    - Fix ~/ in worktree and hook paths for WSL repositories, and reject worktree locations on a different system
    - Fix worktrees not being listed with Git versions earlier than 2.36
    - Fix committed files showing as deleted and untracked when Winc is launched by Git
    - Fix Git status not refreshing for changes to ignored tracked files
    - Fix staging files with special characters in their paths during merge conflict resolution and rebase
    - Fix Git blame navigating to the wrong commit in long histories
    - Fix new branches being published to the wrong remote
    - Fix winc . blocking the terminal on Windows
    - Fix blank PDF pages on Windows, and show the rendering error (#105)
    - Fix pasting text copied from other applications on Wayland
    - Fix search in very long lines scrolling to an empty area
    - Fix horizontal jitter when scrolling long lines with a trackpad
    - Fix the minimap omitting parts of long wrapped lines
    - Fix list marker rendering in the Markdown live preview
