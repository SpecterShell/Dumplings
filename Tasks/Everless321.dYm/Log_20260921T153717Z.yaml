  Value: |-
    修复：被风控账号添加作品链接、同步收藏夹失败
    v3.1.0 修好了作品列表，但作品详情接口在被加强管控的账号上还会被拦（Signature Not Found）。影响：用作品链接添加用户、收藏夹同步脚本、脚本里的 api.douyin.video。
    - 保存的 Cookie 之前漏掉了一部分（s_v_web_id 等 7 个），现在按浏览器实际发送的范围完整保存
    - 请求补上与 Cookie 同源的 verifyFp / fp（polydl 0.5.3）
    升级后无需重新扫码：进设置点一次「从浏览器获取」再关掉窗口，或等后台自动刷新 Cookie 即可生效。
    What's Changed
    - fix: 导出 Cookie 补上 s_v_web_id，详情接口带 verifyFp by @Everless321 in https://github.com/Everless321/dYm/pull/29
