  Key: ReleaseNotes
  Value: |-
    修复「从浏览器获取」丢失登录态
    v3.0.0 在打开登录窗口前会无条件清空登录分区的 cookie，本意是清掉旧指纹下发的匿名 cookie，结果把会话 cookie 也一起清了——点「从浏览器获取」打开的抖音总是未登录，每次都要重新扫码。
    本版改为：
    - 分区里已有登录态 → 不换指纹、不清 cookie，直接以登录态打开并导出，恢复 3.0 之前的体验
    - 分区里没有登录态（首次使用 / 已登出 / 已被 3.0.0 清过）→ 才轮换指纹并清匿名 cookie，登录成功后新指纹与新 Cookie 一起保存
    从 3.0.0 升级的用户登录分区已经被清过一次，升级后再登录一次即可，之后会一直保持登录态。想主动换指纹的话，在登录窗口里退出登录再重新登录即可。
    What's Changed
    - fix(douyin): 「从浏览器获取」不再清掉已有登录态 by @Everless321 in https://github.com/Everless321/dYm/pull/27
    Full Changelog: https://github.com/Everless321/dYm/compare/v3.0.0...v3.0.1
