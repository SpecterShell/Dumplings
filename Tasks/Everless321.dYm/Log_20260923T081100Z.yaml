  Key: ReleaseNotes
  Value: |-
    修复：登录窗口被抖音识别，导致账号拉不到作品列表
    同一台电脑、同一个网络下，用真实浏览器的 Cookie 一切正常，而在应用登录窗口里登录拿到的会话，作品列表接口只返回空数据。原因是登录窗口对外声称是 Chrome，但浏览器版本信息（Client Hints）暴露了它其实是内嵌浏览器，抖音据此把这类会话标记为可疑。
    - 设备信息改为如实上报内嵌浏览器的真实版本，登录窗口、后台页面与接口请求三处保持一致
    - 补齐 Chrome 会发送而应用此前缺失的浏览器版本请求头
    需要重新登录才生效： 设置 → 抖音 Cookie → 左下角「浏览器复位」，然后重新扫码登录。旧会话一旦被限制无法恢复。
    其它修复
    - 修复 v3.1.1 引入的 Cookie 重复问题：同名 Cookie 会积累两份、部分值互相矛盾，现已自动去重，旧数据在下次刷新 Cookie 时自愈
    - 主进程日志改为同时写入数据目录 logs/main.log（超过 5MB 自动轮换），反馈问题时可直接提供该文件
    What's Changed
    - fix: 登录窗口 Client Hints 自洽，Cookie 去重，主进程日志落盘 by @Everless321 in https://github.com/Everless321/dYm/pull/30
    Full Changelog: https://github.com/Everless321/dYm/compare/v3.1.1...v3.2.0
