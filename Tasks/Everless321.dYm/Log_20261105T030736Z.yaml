  Key: ReleaseNotes
  Value: |-
    v3.3.0 的问题修复（#40）。
    修复
    - 恢复侧边栏「下载任务」入口：新版界面去掉了这个入口，定时下载任务仍在运行却无处管理；任务详情页也能正常打开了
    - 侧边栏版本号显示实际版本，不再固定显示 3.2
    优化
    - 概览页的「占用」改为点击计算：打开概览不再遍历全部下载目录，启动后不会持续读硬盘，右上角刷新按钮也不会一直转圈。上次计算的结果会保留，悬停可看计算时间，再点一次重新计算
    排查
    - 主窗口报错、渲染进程崩溃或无响应、GPU 等子进程退出会写入 main.log，方便排查白屏
    - 作品详情诊断遇到非 JSON 响应时带出响应内容和 logid
    - 新增文档「下载失败与风控排查」
    Full Changelog: https://github.com/Everless321/dYm/compare/v3.3.0...v3.3.1
