    概览
    Reasonix v1.39.3 — Reasonix 1.39.3
    项目配置、serve 审批、宿主 git 与沙盒的安全加固，以及远程 SSH 会话恢复正常加载与发送。
    发布日期：2026-09-28
    Desktop 2 · CLI 2
    桌面端更新
    重点内容
    - [Desktop · CLI] 项目配置、serve 审批、宿主 git 与沙盒的安全加固 — 项目声明的 MCP 服务在启动前会先征得你的同意，项目也不能再设置状态栏命令；通过 serve 进行的修改与审批需要本次启动的令牌；Reasonix 自己执行的 git 命令不再运行仓库配置的程序；在 bash 沙盒内，仓库的 git 配置与钩子保持只读。 (#11114 by @esengine)
    - [Desktop] 远程 SSH 会话恢复正常加载与发送 — 在远端打开过一次旧的历史会话后，之后的连接会报 "transcript v2 is required" 或 "Transcript v2 is not synchronized"，无法加载也无法发送。现在远端 Serve 会始终如实声明它支持的能力。更新后重连一次，桌面端会自动重启远端 Serve 并替换其程序。 (#11124 by @esengine)
    CLI 端更新
    重点内容
    - [Desktop · CLI] 项目配置、serve 审批、宿主 git 与沙盒的安全加固 — 项目声明的 MCP 服务在启动前会先征得你的同意，项目也不能再设置状态栏命令；通过 serve 进行的修改与审批需要本次启动的令牌；Reasonix 自己执行的 git 命令不再运行仓库配置的程序；在 bash 沙盒内，仓库的 git 配置与钩子保持只读。 (#11114 by @esengine)
    修复
    - [CLI] ACP 对话保留你输入的技能调用原文 — 通过 ACP 发送的行内技能调用，现在以你输入的原文进入本轮，而不是渲染后的技能正文，与 CLI 和桌面端一致。 (#11047 by @KHG420)
    升级提醒
    本版本无需手动迁移。
    风险提示
    当前没有需要额外操作的已知风险。
    下载与安装
    - 官网按平台下载
    - 查看完整差异
    贡献者
    感谢本版本的贡献者：@esengine、@KHG420
