  Value: |-
    新增应用内 TMDB 凭证一键全流程申请，精简步骤；若无 TMDB 凭证，豆瓣 API 元数据兜底，首页、分类页海报、详情展示，同时预留一条内置播放源供无 TMDB 凭证时正常享受影片。
