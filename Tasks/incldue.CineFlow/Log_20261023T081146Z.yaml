    双路搜索增强，影片标题命中以及自然语言氛围关键词双路并行搜索，尽可能保证相关，搜索强化在下一版预告-_-
    新增应用内自动检查更新，"CF"图标拉取 Release 最新版并根据操作系统进行静默下载安装
