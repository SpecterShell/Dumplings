  Key: ReleaseNotes
  Value: |-
    播放器操作区新增投屏按钮，点击后弹出弹窗选择需要投屏的设备进行投屏；
    新增分类片库以及播放历史，首页下敲键盘左右方向键来进行三页面切换（没弄 Tab 栏或者啥是因为那样个人感觉界面不够简洁）；
    分类片库可按年份、热度、类型等进行分类选片；播放历史可选当前源继续播放或者详情页另选源播放；
    新增设置页同级片源设置来进行外部片源的导入&测速&管理；
    新增 Mac 的安装包(虽然不晓得 UI 咋样、运行咋样-_- )
