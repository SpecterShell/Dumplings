  Key: ReleaseNotes
  Value: |-
    New
    - Add support for custom inspectors built for Fiddler Classic on Windows.
    - Add support for GPT-6 models in the Chat Assistant.

    Fixed
    - Sanitization does not consistently mask nested JSON and XML values.
    - Removed sanitization keywords continue to mask matching data until the application restarts.
    - The Do Not Show rule action incorrectly changes gateway proxy behavior.
    - Updated third-party dependencies to address potential security vulnerabilities.
