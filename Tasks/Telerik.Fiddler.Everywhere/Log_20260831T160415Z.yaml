Version: 8.1.0
Installer:
- InstallerUrl: https://downloads.getfiddler.com/win/Fiddler Everywhere 8.1.0.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    New
    - Group sessions per domain/application.
    - Add QUERY method in Composer.
    - Updated AppImage integration for Linux.
    - Option to copy header name only in inspectors.

    Fixed
    - App crashes on startup when network access is blocked.
    - Duplicate VPN bypass entries when host contains multiple endpoints.
    - GRPC reflection fails to resolve for some sessions.
    - Stop loading animation if OS animations are disabled.
    - Close button is missing on some notifications.
    - Updated third-party dependencies to address potential security vulnerabilities.
ReleaseTime: 2026-08-31T07:09:00.8720000Z
