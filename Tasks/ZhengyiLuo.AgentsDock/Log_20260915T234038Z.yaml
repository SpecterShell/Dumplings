  Key: ReleaseNotes
  Value: |-
    AgentsDock 1.0.1
    Team Network
    - Paired members can now rename their own server in the Team Network
      directory: open the menu beside your entry, choose Rename, and save.
      This changes the name shown to teammates and used for new mail and mentions;
      it does not change your connection, identity, role or local connection label.
    - Saving updates the existing row and Team Network heading in place. Other
      members' entries remain protected. Invalid names, read-only connections,
      unsupported hosts and changed connections report an error without falling
      back to a role switch or retrying the write.
    - Durable join approvals remain visible across long observation windows.
      Older expired requests are available in a separate collapsed section;
      replacement requests hide their stale predecessors.
    Server update controls
    - Recover when a force-update confirmation becomes stale because the update
      has already advanced. Show the actual installation or preflight result,
      and restore a manual status check if the result cannot be verified.
      A refused confirmation never automatically retries a restart or update.
    Compatibility
    - Member rename uses the existing server-profile API; it does not require a
      new server deployment on hosts that already support that API. The name
      survives normal reconnection and restart. Explicitly joining or activating
      a pairing again can republish the server's locally configured name.
    - Non-expiring automatic joins require the corresponding standalone
      AgentsServer update on both the host and joining server.
    - No new Team Network polling, periodic roster reloads or inbox refresh timers
      are introduced. This desktop release does not restart or update your servers.
    - macOS packages are Developer ID signed and notarized. Windows installers
      remain unsigned under the established distribution policy and may display
      Windows security warnings.
