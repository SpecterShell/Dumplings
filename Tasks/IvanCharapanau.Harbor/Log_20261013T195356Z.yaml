  Key: ReleaseNotes
  Value: |-
    Misc
    - harbor models pull now downloads only the files you name. harbor models pull --source hf <repo> <file...> used to ignore the filenames and fetch the whole repository; the filenames are now passed to the Hugging Face CLI. A pull with filenames and no --source also goes through the Hugging Face CLI, including for GGUF repositories. Pulls with only a repository name work as before. Thanks to @cortezbuilds for the report and the fix (#290, #291).
    harbor models pull --source hf hf-internal-testing/tiny-random-gpt2 config.json
    Full Changelog: https://github.com/av/harbor/compare/v0.5.14...v0.5.15
