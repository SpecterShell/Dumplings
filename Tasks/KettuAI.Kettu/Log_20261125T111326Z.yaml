- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Page sizes for the browser, files dropped or uploaded into a project, Edit from here for OpenCode, computers kept to their own account, and fixes for Workflow steps that hit a plan limit.
    What changed
    - Page sizes in the browser: Page size on the browser pane's bar switches a tab between desktop (1280 x 800), tablet (768 x 1024) and phone (390 x 844), laid out as a touch device for tablet and phone; agents pick the size with a new tool too. (#2554)
    - Files into a project: drag files or folders from the system file manager onto a folder in the Files tree to copy them there; in the web client, Upload files… puts files into the chosen folder. A file with the same name waits for Replace or Skip. (#2557)
    - Edit from here for OpenCode: OpenCode sessions can go back to a message too, with OpenCode's own revert, which also takes the files back; Put back restores them until you send. (#2556)
    - Computers kept to their own account: a computer signed in to a Kettu account lets in only devices of that account; devices fold another account's computers into one row, Add host lists the account's computers that cannot be added yet with why, and a computer with remote access off asks once to turn it on when another device signs in to the account. Devices that do not say their account connect as before. (#2544)
    - Workflow steps and plan limits: a step whose agent runs out of its plan limit mid-turn now pauses instead of being stuck, and carries on in the same session when the limit resets; pinning a Codex agent that runs on your own provider works even when its ChatGPT plan is used up, and a pin that cannot start says why; the notch island no longer pops for stuck tasks. (#2553)
    - Proxy: every request the agent host makes to the internet (the ACP Registry, the harness manifest, the Marketplace, plan limit reads, remote MCP servers) uses the proxy from Settings › Advanced or your environment; requests to this computer never do. (#2551)
    - Fixes: projects on another computer have Remove project… in their menu (#2562); an agent's new browser tab lays out its first page at the size it keeps (#2558); the folder browser for another computer opens with focus in the list instead of popping a tip (#2562).
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    浏览器能切页面尺寸，文件能拖进或上传到项目里，OpenCode 也能从这里重新编辑，电脑只让同一个账号的设备连接，工作流步骤遇到套餐限额的问题也修好了。
    - 浏览器的页面尺寸：浏览器窗格栏上的 页面尺寸 能把标签切成桌面（1280 x 800）、平板（768 x 1024）和手机（390 x 844），平板和手机按触屏设备排版；智能体也能用新工具选尺寸。(#2554)
    - 把文件放进项目：从系统的文件管理器把文件或文件夹拖到文件树里的文件夹上，就复制进去；网页客户端里用 上传文件… 放进选中的文件夹。遇到同名文件会先问你替换还是跳过。(#2557)
    - OpenCode 也能从这里重新编辑：OpenCode 会话也能回到某条消息，用的是 OpenCode 自己的回退，文件也一起退回；发送之前点 放回原处 可以恢复。(#2556)
    - 电脑只让同一个账号的设备连接：登录了 Kettu 账号的电脑只让同一个账号的设备连接；设备会把其他账号的电脑收成一行，添加电脑 里列出账号里暂时加不了的电脑和原因，没开远程访问的电脑在账号里有别的设备登录时会问一次要不要打开。不报自己账号的设备照旧能连。(#2544)
    - 工作流步骤和套餐限额：步骤的智能体做到一半用完套餐限额时，现在显示暂停而不是卡住，限额重置后在原会话里接着做；用自己服务商的 Codex 智能体，在 ChatGPT 套餐用完时也能固定，固定后开不了工会说明原因；灵动岛不再为卡住的需求弹出。(#2553)
    - 代理：智能体主机发往互联网的请求（ACP Registry、Harness 兼容清单、市场、套餐限额读取、远程 MCP 服务器）都走 设置 › 高级 里或环境变量里的代理；发往本机的请求不走代理。(#2551)
    - 修复：别的电脑上的项目，菜单里也有 移除项目… (#2562)；智能体新开的浏览器标签，第一个页面就按保持的尺寸排版 (#2558)；另一台电脑的文件夹浏览器打开时焦点在列表上，不再弹出提示 (#2562)。
