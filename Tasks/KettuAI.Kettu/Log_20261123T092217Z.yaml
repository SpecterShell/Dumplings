Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    What changed
    - The artifact viewer is rebuilt. Web pages, canvases, documents and slides open in one viewer with View, Comment and Edit, in the main area and beside a session. A canvas has three distances: the whole page, one frame opened at a size you can read, and Present. Long pages scroll instead of shrinking, and a Pages card replaces Layers.
    - Opening an artifact lands on what changed. A pill counts the changes and walks you through them, each changed place carries the version that changed it, and a switch shows before and after. A link to a frame, a section or a slide in a reply opens that place.
    - Comments are pinned where you click and sent together to a session. Ask sends one selection with what you want changed. Direct edits save by themselves as versions, with undo, and version history says what each version changed.
    - Documents read on a sheet with an outline, and changes are marked in the text. Slides open one at a time, with a grid and notes. Web pages take a width of your choice and show their script errors.
    - The viewer says what is happening where it happens: opening without a spinner, a frame or an artifact that failed with Retry, a computer that is offline, the part an agent is writing. Cards show what changed and what you have not seen yet.
    - The Files pane previews PDF, Word and Excel files.
    - A session can continue by itself once a used-up plan limit resets, with a switch in Settings › General. A session that starts another one can pick its model and effort.
    - A new switch in Settings › General, off by default, lets agents type passwords you gave them or the project's files hold.
    - Effort can be shown as a dial or as segments, and an export's notice can show the file in its folder. Font pickers no longer freeze the window, Files keeps each session's reading position, the model menu lists each model once, and a comment whose element was removed is found again when the element comes back.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 产物查看器重做。网页、画布、文档和幻灯片在同一个查看器里打开，有查看、评论、编辑三种模式，主区和会话旁边都是它。画布有三种距离：整页、把一个画框打开到看得清的大小、演示。长页面改为滚动，不再缩小；“页面”卡片代替了原来的图层。
    - 打开产物会落在改动的地方。改动条写改了几处并带你逐处走，改过的地方标着是哪一版改的，开关可以在改前改后之间切换。回复里指向画框、小节或幻灯片的链接，点了就到那一处。
    - 评论钉在你点的位置，攒好后一起发给会话。选中一处可以直接让智能体改，带着这一处和你的要求发出去。直接修改会自动存成新版本，可以撤销；版本历史写明每一版改了什么。
    - 文档在一张纸上阅读，带大纲，改动直接标在原文里。幻灯片一张一张看，可以看全部幻灯片，也有备注。网页可以选宽度，脚本报错会标出来。
    - 查看器在出事的地方说明情况：打开时不转圈，画框或整个产物打不开时可以重试，电脑离线、智能体正在写哪一处都看得见。卡片上写着改了什么、哪些还没看过。
    - 文件面板可以预览 PDF、Word 和 Excel 文件。
    - 套餐限额用完后，会话可以在限额重置时自动继续，开关在 设置 › 通用。由会话启动的新会话可以指定模型和思考强度。
    - 设置 › 通用 新增一个开关，默认关闭：打开后智能体可以输入你给它的、或项目文件里已有的密码。
    - 思考强度可以显示为刻度盘或分段，导出完成的提示可以在文件夹中显示文件。字体选择器不再卡住窗口，文件面板会记住每个会话的阅读位置，模型菜单里每个模型只列一次；评论所在的元素被删掉后又回来时，评论会重新找到它。
