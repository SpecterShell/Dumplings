- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Kettu 0.1.11 lets you update every agent at once from the update card, manage hosts added over SSH from their page, drag the thread to the width you like, and choose what New session lists.
    What changed
    - Update all agents at once from the sidebar's update card; Kettu's own update comes last so its restart stays your click. (#1915)
    - Add machines from your SSH config in one step, and update, re-address, reconnect or uninstall a host added over SSH from its page. (#1891, #1900)
    - Drag the side of the thread to change the width of its content. (#1898)
    - Choose what New session lists: sessions, artifacts, or nothing. (#1883)
    - An Open project button sits at the end of the sidebar's Projects heading. (#1879)
    - Codex's model list refreshes while it runs, and agents that report no account, such as Pi, are rechecked for sign-in. (#1894, #1890)
    - Claude Code's command-line program is found again if it went missing, and an agent installed with npm updates the copy Kettu runs. (#1909, #1911)
    - A long artifact page scrolls when presenting. (#1910)
    - Links glued to Chinese text in replies are split correctly, and text after a sent link is kept. (#1901, #1895)
    - Smaller fixes: logs keep valid JSON when secrets are masked, the terminal fits once the side panel opens, deleting an attachment's chip removes the attachment, the board dot clears once seen, the text size preview is labeled, and the collapsed sidebar keeps its gap. (#1913, #1882, #1881, #1886, #1889, #1914)
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Kettu 0.1.11 支持在更新卡片里一次更新所有 Agent，在 SSH 主机的页面里管理它，拖动调整对话内容的宽度，并可以选择新会话页列出什么。
    - 在侧边栏的更新卡片里一次更新所有 Agent；Kettu 自己的更新排在最后，重启仍由你点击。(#1915)
    - 一步添加 SSH 配置里的机器，并在通过 SSH 添加的主机页面里更新、改地址、立即重连或卸载。(#1891, #1900)
    - 拖动对话内容两侧，调整内容宽度。(#1898)
    - 选择新会话页列出会话、Artifacts 还是什么都不列。(#1883)
    - 侧边栏“项目”标题末尾新增“打开项目”按钮。(#1879)
    - Codex 运行时会刷新模型列表；不上报账号的 Agent（如 Pi）会重新检查登录状态。(#1894, #1890)
    - Claude Code 的命令行程序丢失后能重新找到；用 npm 安装的 Agent 会更新 Kettu 正在运行的那份。(#1909, #1911)
    - 演示时，较长的 Artifact 页面可以滚动。(#1910)
    - 回复里与中文粘连的链接会被正确拆开，发送的链接后面的文字也会保留。(#1901, #1895)
    - 其他小修：遮盖密钥后日志仍是有效的 JSON，侧边面板展开后终端会自动适应尺寸，删除附件标签会同时移除附件，看板的圆点看过后会消失，文字大小预览加上了标签，侧边栏收起时保留间距。(#1913, #1882, #1881, #1886, #1889, #1914)
