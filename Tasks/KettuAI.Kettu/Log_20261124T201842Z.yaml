- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Kettu gets plugins of its own, a side panel that is one row of tabs, and a relay you can run yourself.
    What changed
    - Kettu plugins: one package of skills, MCP servers, workflows, slash commands, agent roles, themes and artifact templates, installed once for every agent, optionally with a script that runs in a sandbox on the computer. The Marketplace is rebuilt around them and no longer lists, installs or publishes Claude Code and Codex plugins; plugins already installed in a harness stay there. Skills now reach every agent (#2466).
    - Terminals, pages, devices, Files, Git, the board, the side chat, requests and the computer are tabs of one row in the side panel, kept per session. Opened files, their diffs and artifacts are tabs too, with one preview tab, and all of them come back after a restart (#2390, #2408).
    - A computer can use a relay you run yourself, or none, from a new Relay group in Settings › Remote access, or with kettu relay on a daemon. The relay can serve the web client, and the release adds the files for it. Switching waits for devices to follow before the old relay stops, and a computer's page shows which region it is reached through (#2444, #2463, #2464, #2454).
    - Each computer shows its CPU, memory, disk, network and battery in Settings › Computers, on its page and in New session's computer menu. They are read only while someone watches and kept nowhere (#2423, #2436).
    - After a turn, the empty message box can suggest your next message, and Tab fills it in. Claude Code only; Settings › General turns it off (#2412).
    - An update that waits for its restart no longer stops Kettu from checking, so one restart installs the newest release. The restart lists the work it stops and can wait for sessions to finish (#2373).
    - Updating from a downloaded disk image now downloads it inside Kettu and opens it only once its checksum matches the signed update file. The daemon's install script and checksums are signed and verified before anything runs (#2372, #2371).
    - A paired device no longer receives every copy of a growing command output, and answering a request no longer waits behind slow reads (#2381).
    - A long answer of your own in a question card wraps instead of scrolling out of view. A session that archives one it started no longer gets reports about it (#2433, #2447).
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - Kettu 有了自己的插件：一个包里可以有技能、MCP 服务器、工作流、斜杠命令、智能体角色、主题和产物模板，装一次所有智能体都能用，还可以带一段在电脑上沙盒里运行的脚本。市场围绕它重新做过，不再列出、安装和发布 Claude Code 与 Codex 的插件，已经装进某个 Harness 的插件仍留在那里。技能现在对所有智能体都有效（#2466）。
    - 终端、页面、设备、文件、Git、看板、侧聊、请求和电脑都是侧边面板同一行里的标签，按会话保存。打开的文件、它们的差异和产物也是标签，共用一个预览标签，重启后全部恢复（#2390、#2408）。
    - 一台电脑可以用你自己搭的中继，或者不用中继：在 设置 › 远程访问 新增的“中继”分组里选择，守护进程上用 kettu relay。中继可以提供网页端，这次发布带上了所需文件。切换时会等设备跟上再停掉旧的中继，电脑的页面会显示它经哪个区域连到（#2444、#2463、#2464、#2454）。
    - 每台电脑在 设置 › 电脑、它自己的页面和新会话的电脑菜单里显示 CPU、内存、磁盘、网络和电池。只在有人查看时读取，不保存（#2423、#2436）。
    - 一轮结束后，空着的输入框可以建议你的下一条消息，按 Tab 填入。目前只有 Claude Code，可在 设置 › 通用 里关闭（#2412）。
    - 更新下载好等待重启时，Kettu 不再停止检查，所以重启一次就装上最新版本。重启时会列出将被停止的任务，也可以等会话完成后再重启（#2373）。
    - 通过磁盘映像更新时，Kettu 自己下载，校验和与签名的更新文件一致后才打开。守护进程的安装脚本和校验和已签名，运行前会先验证（#2372、#2371）。
    - 已配对的设备不再收到不断增长的命令输出的每一份副本，回答请求也不再排在缓慢的读取后面（#2381）。
    - 问题卡片里很长的自定义回答会自动换行，不再滚出视野。归档了自己启动的会话后，不会再收到关于它的回报（#2433、#2447）。
