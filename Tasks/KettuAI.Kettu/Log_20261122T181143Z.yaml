Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    What changed
    - Edit a message you sent from where it was sent: the session goes back to just before it and the message returns to the composer. Put back restores the session until the next send.
    - Artifacts in a thread are drawn as cards across the column by what was written: Created, Updated with what changed, and Deleted with Restore.
    - The session's Git panel is redrawn. The branch popover leads with the next step, and a Git pane in the side panel holds changes, commits and the pull request. The side panel's panes open from one list.
    - Every agent's model menu is redesigned, with switches as rows. The agent menu shows only what can stop an agent.
    - Plan limits are named per window. Cards end on the next reset and what the account holds beyond its windows, and a session using extra usage is marked. The DeepSeek account balance is shown.
    - An agent's browser page keeps one size whatever the pane's width. Agents keep memory current, and file chips have a right-click menu.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 可以从已发送消息的位置重新编辑：会话回到这条消息之前，消息回到输入框。在下一次发送前可以用“放回”恢复。
    - 会话中的产物按写入方式显示为横跨整栏的卡片：已创建、已更新（说明改了什么）、已删除（可恢复）。
    - 会话的 Git 面板重新设计。分支弹窗先给出下一步，侧边面板新增 Git 面板，包含变更、提交和 Pull request。侧边面板的各个面板从一份列表打开。
    - 所有智能体的模型菜单重新设计，开关改为一行一项。智能体菜单只显示会让智能体无法使用的状态。
    - 套餐限额按窗口命名。卡片末尾显示下次重置和账号在窗口之外持有的额度，会话使用额外用量时会标出。显示 DeepSeek 账号余额。
    - 智能体使用的浏览器页面无论面板多宽都保持同一尺寸。智能体会持续维护记忆，文件标签新增右键菜单。
