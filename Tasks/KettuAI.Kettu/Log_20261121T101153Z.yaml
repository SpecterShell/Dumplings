- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Kettu 0.1.15 brings the Dynamic Island to the MacBook notch, lets you comment on several passages of a reply and send them in one message, lets you choose which pages the sidebar shows and in what order, and makes workflows start from one card in the conversation.
    What changed
    - macOS: a Dynamic Island in the notch (or the menu bar on a screen without one) shows each session as its agent mark with its status, and on hover a panel led by the oldest request, which you can answer there. Sessions on your other computers are listed too. While it is on, the requests and endings it shows no longer come as notifications. (#2055, #2057, #2061)
    - Comment on several passages of a reply: Add collects each comment above the composer, numbered like its passage, and Send sends them with what you wrote as one message. Cmd+Enter in the box adds and sends at once. (#2156)
    - The sidebar's pages (Overview, Artifacts, Routines, Marketplace, Usage) can be hidden and reordered in Settings › Appearance › Sidebar, or hidden by right-clicking one. Projects can be dragged within their computer, and computers by their heading. Session rows no longer keep empty room for their hover buttons, so titles run to the end of the row, and a session's sub-agents are also in its menu. (#2154, #2133, #2160)
    - Pick installed fonts for the interface, replies and code in Settings › Appearance; tool cards use the code font too. (#2102, #2126)
    - Workflows: for a request with stages, the agent suggests a workflow, from the Marketplace or one it writes, as a card with its flowchart; Start adds and starts it in one click, the conversation becomes the task, and what it delivers comes back to the conversation. Outcome names follow the interface language and charts read left to right. (#2097, #2106, #2110, #2115, #2140, #2112, #2131, #2132, #2139, #2101)
    - Diagrams in replies open larger with zoom and saving, and a narrow one is centered. (#2094, #2118)
    - Maths in replies: formulas written with a single dollar sign, \( \) or \[ \] now render in paragraphs and tables, while prices stay text, and a wide numbered formula scrolls sideways with its number. (#2161)
    - Messages Kettu sends to a session, such as a workflow step's reminder, show as Kettu's cards rather than as yours, also after a thread is rebuilt. (#2151, #2155)
    - Fixes: selecting text in a finished reply no longer jumps to select the whole reply, and on Windows, Chinese in code no longer shows in NSimSun. (#2159, #2123)
    - Fixes: projects with the same name are told apart, a plan sent back keeps its previous version, an old uv gets a hint to update, Codex's web citation markers are gone, and the sign-in hint clears once you sign in. (#2100, #2105, #2093)
    - Fixes: Devin's plan limits are read again, the update card names the version of a program you picked, the Changes view refreshes after edits that keep the counts, two Marketplace items installed at once both stay, and one /compact stores one entry. (#2098, #2116, #2119)
    - Fixes: publishing a workflow asks only in Kettu's card and the card waits past the turn, skills reach Codex at the right path, agents check a changed web page in Kettu's browser, a menu's highlight follows the pointer once its list scrolls, flowchart labels no longer overlap, and storage and search work on Node 22.13 to 22.15. (#2134, #2145, #2144, #2148, #2118, #2095, #2092, #2117)
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Kettu 0.1.15 把灵动岛带到 MacBook 的刘海，可以在一条回复里评论多段话、和你写的话一起发出，侧边栏显示哪些页面、按什么顺序由你定，工作流在对话里的一张卡片上一键就能开始。
    - macOS：刘海里的灵动岛（没有刘海的屏幕在菜单栏）把每个会话显示成它的智能体标志和状态，悬停时展开面板，最上面是最早等你的请求，可以直接在那里回答。其他电脑上的会话也会列出。打开灵动岛后，它显示的请求和结束不再另发通知。(#2055, #2057, #2061)
    - 在一条回复里评论多段话：点“加入”，评论按段落编号攒在输入框上方，发送时和你写的话一起作为一条消息发出。小框里按 ⌘回车 加入并立即发送。(#2156)
    - 侧边栏的页面（总览、产物、定时任务、市场、用量）可以在 设置 › 外观 › 侧边栏 里隐藏和调整顺序，也可以右键隐藏。项目可以在所在电脑里拖动排序，电脑也可以拖标题排序。会话行不再给悬停按钮留空位，标题一直排到行尾；会话的子智能体也能从它的菜单里打开。(#2154, #2133, #2160)
    - 在 设置 › 外观 里可以给界面、回复和代码选本机已安装的字体，工具卡片也用代码字体。(#2102, #2126)
    - 工作流：遇到分阶段的需求，智能体会建议一个工作流（市场里的，或它自己写的），以一张带流程图的卡片出现；点“开始”一键加入并启动，当前对话变成这个需求，交付的结果回到对话里。结局名称跟随界面语言，流程图从左往右画。(#2097, #2106, #2110, #2115, #2140, #2112, #2131, #2132, #2139, #2101)
    - 回复里的图表可以放大、缩放和保存，比对话栏窄的图会居中。(#2094, #2118)
    - 回复里的数学公式：用单个美元符号、\( \) 或 \[ \] 写的公式在段落和表格里都能正常显示，价格仍是文字；太宽的带编号公式连同编号一起横向滚动。(#2161)
    - Kettu 发给会话的消息（比如工作流步骤的提醒）显示为 Kettu 的卡片，不再像你自己发的，对话重建后也一样。(#2151, #2155)
    - 修复：在写完的回复里拖选文字时，不会再突然选中整条回复；Windows 上代码里的中文不再显示成新宋体。(#2159, #2123)
    - 修复：同名项目能区分开，打回的计划保留上一版，旧版 uv 会提示升级，Codex 的网页引用标记不再显示，登录后登录提示会消失。(#2100, #2105, #2093)
    - 修复：Devin 的套餐限额会重新读取，更新卡片显示你自己选的程序的版本，改动数不变的编辑也会刷新改动视图，同时安装两个市场项目不会只剩一个，一次 /compact 只存一条记录。(#2098, #2116, #2119)
    - 修复：发布工作流只在 Kettu 的卡片里询问一次，卡片在这一轮结束后仍会等你，技能交给 Codex 时路径正确，智能体改完网页会在 Kettu 的浏览器里检查，列表滚动后菜单的高亮跟着指针，流程图的标签不再重叠，存储和搜索在 Node 22.13 到 22.15 上正常。(#2134, #2145, #2144, #2148, #2118, #2095, #2092, #2117)
