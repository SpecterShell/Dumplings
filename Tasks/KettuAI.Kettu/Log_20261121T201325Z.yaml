Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    What changed
    - Kettu now prefers your own compatible agent programs and looks past unusable copies on your PATH. Settings show which copy Kettu runs.
    - The install dialog shows the source, version, destination, requirements and package size when available. If an agent cannot run, Kettu shows the reason and how to fix it. Updates to your own programs show the command for confirmation, with improved Homebrew, WinGet and tagged npm support.
    - On macOS, the Dynamic Island retracts into the notch when idle and opens on hover or click. The expanded island shows active subagents, and the sidebar keeps their badge visible when you hover a session.
    - Antigravity can now reach granted Kettu tools through a single entry point when its tool list hits its limit.
    - Drag the control indicator in the browser, terminal, device or computer pane. Each pane type remembers its position. Notifications stay clear of the browser and composer menus, and comment highlights have their own color.
    - More agent, Git, remote host and background service errors follow the app’s language.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - Kettu 优先运行你自己安装且兼容的智能体程序，会跳过 PATH 上不可用的版本。设置里可以看到当前运行的是哪一份。
    - 安装窗口会显示来源、版本、安装位置、运行要求，以及能查到的包大小。智能体无法运行时会提示原因和处理方法。更新你自己安装的程序前会展示命令供确认，并改进了 Homebrew、WinGet 和带标签的 npm 安装支持。
    - macOS 灵动岛空闲时收回刘海，悬停或点击可展开。展开后可看到正在工作的子智能体，侧栏悬停时也会保留子智能体徽标。
    - Antigravity 的工具列表达到上限时，仍可通过统一入口调用已授权的 Kettu 工具。
    - 浏览器、终端、设备和电脑面板的控制条可以拖动，各自记住位置。修复通知遮挡网页和输入框菜单的问题，并为评论标记应用独立配色。
    - 智能体、Git、远程主机和后台服务的更多错误提示会随界面语言显示。
