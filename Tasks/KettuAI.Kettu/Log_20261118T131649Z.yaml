- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Kettu 0.1.10 lets you drag the prompt box to the height you want, writes Git commit messages for you, shows a collapsed sidebar on hover, and brings the Intel Mac installer back.
    What changed
    - Resize the prompt box by dragging. (#1871)
    - Write the commit message with AI in the commit dialog. (#1827)
    - A collapsed sidebar shows on hover, and the top bar folds uncommon tools into a menu. (#1829, #1825)
    - Choose the terminal font. (#1842)
    - The web client shows a tab icon and attention marks. (#1826)
    - The desktop release builds an Intel Mac installer again. (#1844)
    - Harness versions can follow a signed compatibility manifest from the download service. (#1808)
    - Context and plan limits follow used or left everywhere they appear. (#1848, #1850)
    - Sessions started in a terminal show their turns again in Kettu. (#1864)
    - Side chat answers are flagged as unread, and new models appear in sessions that are already open. (#1824, #1833)
    - A session is revived to answer the report of a turn it asked for, and a stale workflow list no longer overwrites a newer one. (#1852, #1858)
    - ACP agents no longer get Kettu's guide block in their session titles. (#1859)
    - Git watches of one device no longer end another's. (#1855)
    - Browser pages stay when the last tab closes or the window reloads, and link site icons are retried after a failure and reloaded after clearing. (#1872, #1873, #1857, #1866)
    - Single tildes, as in paths, are no longer drawn as strikethrough. (#1869)
    - The commit dialog, the changes card and the composer's tray fit narrow columns. (#1819, #1820, #1823)
    - Smaller fixes: permission mode names are translated, a waiting question is worded as an answer, the install hint in Settings says it adds an agent, the share URL field and the out-of-credit strip are restyled, the terminal selection color shows, and the sidebar's empty hint hides when no project has a session. (#1854, #1860, #1870, #1856, #1853, #1865, #1867)
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Kettu 0.1.10 支持拖动调整输入框高度，可以用 AI 写 Git 提交信息，收起的侧边栏悬停时会弹出，Intel Mac 安装包也回来了。
    - 拖动调整输入框高度。(#1871)
    - 在提交对话框里用 AI 写提交信息。(#1827)
    - 收起的侧边栏悬停时显示，顶栏把不常用的工具折进一个菜单。(#1829, #1825)
    - 可以选择终端字体。(#1842)
    - Web 客户端显示标签图标和提醒标记。(#1826)
    - 桌面版发布重新构建 Intel Mac 安装包。(#1844)
    - Harness 版本可以跟随下载服务签名的兼容清单。(#1808)
    - 上下文和套餐限额在所有出现的地方都跟随"已用或剩余"。(#1848, #1850)
    - 在终端里开的会话，在 Kettu 里重新显示它的回合。(#1864)
    - 侧聊的回答会标为未读，已打开的会话里能看到新增的模型。(#1824, #1833)
    - 会话收到它要求的回合汇报时会被唤醒来回答；过期的 Workflow 列表不再盖掉较新的。(#1852, #1858)
    - ACP Agent 的会话标题里不再带上 Kettu 的指引文字。(#1859)
    - 一台设备的 Git 监听不再中断另一台的。(#1855)
    - 关掉最后一个标签或刷新窗口后，浏览器页面保留；链接的站点图标失败后会重试，清除后会重新加载。(#1872, #1873, #1857, #1866)
    - 路径里的单个波浪线不再被画成删除线。(#1869)
    - 提交对话框、改动卡片和输入框托盘适应窄栏。(#1819, #1820, #1823)
    - 其他小修：权限模式名称已翻译，等待回答的问题措辞改为"回答"，设置里的安装提示说明会添加 Agent，分享链接输入框和额度用尽提示条重新调了样式，终端选中色能显示，没有项目有会话时侧边栏不再显示空提示。(#1854, #1860, #1870, #1856, #1853, #1865, #1867)
