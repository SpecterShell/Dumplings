  Key: ReleaseNotes
  Value: |-
    Stops polling Google Antigravity plan limits to align with upstream policy, fixes blank Lock Screen Live Activity cards on iOS, adds independent official/self-hosted relays with manual node selection, adds in-app GLM Agent setup, adds non-destructive web cache refresh, and brings theme, outline, settings, and remote-host improvements.
    What changed
    - Stop polling Google Antigravity plan limits: Kettu no longer calls agy -p /usage or /credits to align with Google Antigravity's third-party integration policy. Local usage history and the plan tier badge remain intact; Antigravity users are recommended to update to v0.1.34. (#3053)
    - Fix blank Lock Screen Live Activity cards on iOS: gates v2 multi-state Live Activity payloads for compatible clients and isolates end-push cancellation per update token so newer updates never abort in-flight end requests. (#3055, #3044, thanks @ShaoClean)
    - Independent official and self-hosted relays with node selection: lets the official Kettu relay and your own relay run independently or together, probes all available nodes, and adds manual relay node selection. (#3054, #3026, #3049, thanks @Ariember, @songxff)
    - In-app sign-in and API key setup for GLM Agent: adds in-app setup and Z.AI API key configuration with credential detection for GLM Agent in Settings › Agents. (#3019, #3012)
    - Non-destructive Refresh web cache and Web version info: adds Refresh web cache and Web client version/mode details in Settings › About to pull the latest web files without clearing paired computers, sign-in, settings, or notifications. (#3030, #3024, thanks @xiaolfeng)
    - Installed themes prose contrast and Chinese serif fallback: restores assistant prose contrast over collapsed tool summaries across installed themes and adds Chinese serif font fallbacks for serif themes such as Paper. (#3051, #3038, thanks @songxff)
    - Message Outline copy prompt and resize sync: right-click an item in Message Outline to Copy prompt, and re-measure the outline layout automatically when resizing the session column width. (#3058, #3041, thanks @4xian; #3050, #3035, thanks @xiaolfeng)
    - Accurate Send with newline hint: updates the newline hint under Send with in Settings › General to match the active send key (Shift+Enter or Enter). (#3045, #3031, thanks @Ariember)
    - Sync outer sidebar plan-limit ring with Left view: keeps the outer sidebar plan-limit ring aligned with remaining percentage when switched to the Left view. (#3025, #3017, thanks @xiaolfeng)
    - Physical iPhone setup checks: checks runner signing, developer trust, and UI Automation during physical iPhone setup. (#3032, #1429)
    - Paired devices and remote host enhancements: streams JSON responses larger than 64 KiB (#3034), lists a session's browser tabs (#3047, #2260), exposes read-only host Computer Use status (#3046, #1597), host cloud state (#3033, #1584), and remote desktop diagnostics (#3056, #1596), and normalizes device platform names (#3052, #698).
    中文
    - 停止轮询 Google Antigravity 套餐额度：为遵守 Google Antigravity 的第三方集成政策，Kettu 不再调用 agy -p /usage 或 /credits；本地用量历史与套餐等级标识保持不变。建议 Antigravity 用户升级至 v0.1.34。(#3053)
    - 修复 iOS 锁屏出现空白实时活动卡片：为 v2 多状态实时活动推送增加版本与开关校验，并按 updateToken 隔离结束推送取消键，避免后续更新中止正在发送的关闭请求。(#3055, #3044，感谢 @ShaoClean)
    - 独立运行官方与自建中继并支持手动选择节点：官方 Kettu 中继与自建中继可分别独立开关或同时运行，并支持探测全部可用节点与手动选择中继节点。(#3054, #3026, #3049，感谢 @Ariember, @songxff)
    - GLM Agent 应用内登录与 API Key 配置：在 设置 › 智能体 中为 GLM Agent 增加应用内配置入口、Z.AI API key 填写与凭据检测。(#3019, #3012)
    - 不丢失状态的「刷新网页缓存」与网页版信息：在 设置 › 关于 中展示网页客户端版本与运行模式，并提供 刷新网页缓存 按钮，强制拉取最新网页文件且保留已配对电脑、登录状态、设置与通知订阅。(#3030, #3024，感谢 @xiaolfeng)
    - 恢复外置主题正文对比度与中文衬线字体回退：恢复外置主题下回复正文相对折叠工具摘要的视觉对比度，并为 Paper 等衬线主题补充中文字体衬线回退。(#3051, #3038，感谢 @songxff)
    - 消息大纲支持右键复制提示词及随列宽同步：在大纲项上右键可直接 复制提示词，并在调整会话列宽时自动重新测量并同步大纲显示状态。(#3058, #3041，感谢 @4xian；#3050, #3035，感谢 @xiaolfeng)
    - 修正「设置 › 通用」发送快捷键换行提示：发送快捷键 下方的换行提示现在准确跟随当前发送键显示（Shift+Enter 或 Enter）。(#3045, #3031，感谢 @Ariember)
    - 同步侧边栏外层限额圆环与「剩余」视图：切换套餐限额为 剩余 显示后，侧边栏外层圆环同步按剩余比例绘制。(#3025, #3017，感谢 @xiaolfeng)
    - 实体 iPhone 配置前检查：在实体 iPhone 配置步骤中补充 Runner 签名、开发者信任与 UI Automation 检查。(#3032, #1429)
    - 已配对设备与远程主机增强：支持流式传输大于 64 KiB 的 JSON 响应 (#3034)，支持向已配对设备返回会话浏览器标签页 (#3047, #2260)、主机 Computer Use 只读状态 (#3046, #1597)、主机云服务状态 (#3033, #1584) 与远程桌面诊断信息 (#3056, #1596)，并统一设备平台名称格式 (#3052, #698)。
