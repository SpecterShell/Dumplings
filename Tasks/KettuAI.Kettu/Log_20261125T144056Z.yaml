Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Favorite models for each agent, pairing answered from any of your devices, several computers with one code, problem reports without personal details, and a WeChat group under Contact us.
    What changed
    - Favorite models: an agent's page in Settings › Agents has Favorite models: pick up to four and drag them into order, and the model menu's first page shows just those, the rest under More models; Customize… at the foot of More models opens it, and Reset to automatic goes back to the automatic pick. (#2574)
    - Pairing within one account: a request from a device of your account can be answered on the computer or on any of your devices that may use it, in the desktop app, the web client or with kettu requests on the daemon; the first answer counts, and every device hears when another one joined. A computer can also connect to several computers of the account with one code. (#2560)
    - Removing a device that just joined: Remove on the joined toast or notification opens the device's page and asks before removing it, as the device list does. (#2569)
    - Problem reports: reports mask email addresses and your home folder, keep only the host log of the reported time range and leave out the names you gave your agents. (#2567)
    - Contact us: Settings › About lists the WeChat group, which opens its page on kettu.sh. (#2570)
    - Web client on a phone: long-pressing a link shows its preview in the menu. (#2568)
    - Fixes: a command an agent reports twice is listed once in the slash list (#2565); the update dialog lists each change by its heading, without Markdown marks or lines cut mid-sentence (#2572).
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    每个智能体都能选常用模型，同一个账号里的配对请求在任何一台设备上都能确认，一个码能连多台电脑，问题报告不再带个人信息，联系我们里加了微信群。
    - 常用模型：设置 › 智能体 里每个智能体的页上有 常用模型：最多选四个、拖动排好顺序，模型菜单的首页就只列这些，其余在 更多模型 里；更多模型 底部的 自定义… 直接打开这里，恢复自动 回到自动挑选。(#2574)
    - 同一个账号里的配对：账号里的设备发来请求，在电脑上或你任何一台能用它的设备上都能确认，桌面应用、网页客户端和守护进程的 kettu requests 都可以；以第一个回答为准，有设备加入时每台设备都会收到通知。一台电脑也能用一个码连上账号里的多台电脑。(#2560)
    - 移除刚加入的设备：加入提示或系统通知里的 移除 会打开这台设备的页面，先问一次再移除，和设备列表一样。(#2569)
    - 问题报告：报告里的邮箱地址和主目录会被遮掉，主机日志只保留报告的时间段，也不带你给智能体起的名字。(#2567)
    - 联系我们：设置 › 关于 里加了微信群，点开是 kettu.sh 上的群页面。(#2570)
    - 手机上的网页客户端：长按链接时菜单里会显示链接预览。(#2568)
    - 修复：智能体报了两遍的命令，斜杠列表里只列一次 (#2565)；更新弹窗按小标题列出每项改动，不再露出 Markdown 标记，也不在句子中间截断 (#2572)。
