- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Cards stay in reopened sessions, a repository's Claude Code settings env waits for your answer, and agents can manage Routines with your approval.
    What changed
    - Cards stay in reopened sessions: settings change cards and the cards for a repository's MCP servers and hooks stay in a session after it is reopened or Kettu restarts, and the session's stored thread is read back whole. (#2654)
    - A repository's Claude Code env waits for your answer: environment variables a repository's Claude Code settings set apply only after you allow them on the same card as its hooks, which lists their names, never their values; held values never appear on Claude Code's command line. (#2634, #2642)
    - Agents can manage Routines: agents can list, create, change, delete and run Routines, and every change waits for your card in every mode. (#2649)
    - Work that runs on after a turn: when sub-agents or background commands still run after a turn ends, the sidebar row, its hover card and the end of the thread show it, with Open board. (#2645)
    - Limits on sessions agents start: how many sessions an agent may start at once, per day and how many reports it gets are settings under Settings › Agents › Sessions agents start. (#2640)
    - Quote a selected passage of a file: with lines selected in the Files pane, Reference in conversation quotes just those lines with their line numbers. (#2653)
    - Clearer text: primary text everywhere takes the sidebar's text color. (#2638)
    - Kettu recovers a window that failed to load: if the window's page dies before it shows, Kettu reloads it, and if it fails again offers Restart Kettu instead of leaving no window. (#2646)
    - Codex sessions open elsewhere: when another Codex program holds a session, Kettu says so instead of a raw error, and a session Kettu lets go of can be resumed in your own Codex at once. (#2641, #2648)
    - Switching models keeps a valid effort: a model without the current effort takes the nearest lower one instead of failing to start. (#2636)
    - Paths named in a reply stay as text: a file path in inline code or a link that is not found no longer shows a broken tile or a Not found card. (#2644)
    - GitHub links without https://: github.com/owner/repo/issues/123 and pull request links are recognized like full links. (#2652)
    - Cloudflare sign-in in the built-in browser: Cloudflare's verification passes in the side panel's browser, so the Cloudflare dashboard and other sites behind it can be signed in to there. (#2656)
    - Other fixes: a Routine deleted during a run no longer comes back in the list (#2655); a Pi turn you stop puts the messages Pi had queued back in the paused queue (#2631); plugin panes have their own group in the side panel list (#2632); a document on a computer whose Kettu is too old to preview it says to update Kettu there (#2647).
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 重新打开的会话保留卡片：修改设置的卡片，以及仓库 MCP 服务器和 hooks 的卡片，在会话重新打开或 Kettu 重启后都还在，会话保存的记录也能完整读回。(#2654)
    - 仓库的 Claude Code env 等你同意后才生效：仓库的 Claude Code 设置里写的环境变量，要在和 hooks 同一张卡片上允许后才生效，卡片只列变量名，不列值；被替换的值也不会出现在 Claude Code 的命令行上。(#2634, #2642)
    - 智能体可以管理定时任务：智能体可以列出、新建、修改、删除和运行定时任务，每次改动无论什么模式都要你在卡片上同意。(#2649)
    - 一轮结束后仍在运行的任务：一轮结束时还有子代理或后台命令在运行，侧边栏的会话行、悬停卡片和对话末尾都会显示出来，可以「打开看板」查看。(#2645)
    - 智能体开的会话上限：智能体同时开、每天开多少会话，以及能收到多少回报，可以在「设置 › 智能体 › 智能体开的会话」里调整。(#2640)
    - 引用文件里选中的部分：在文件面板里选中几行后，「在对话中引用」只引用这几行，并带上行号。(#2653)
    - 文字更清楚：主要文字统一使用侧边栏的文字颜色。(#2638)
    - 窗口没能加载时自动恢复：窗口的页面在显示前崩溃时，Kettu 会重新加载；再次失败会提供「重启 Kettu」，不会再找不到窗口。(#2646)
    - Codex 会话被其他程序占用：另一个 Codex 程序还开着这个会话时，Kettu 会直接说明原因，不再显示原始报错；Kettu 放开的会话，你自己的 Codex 也能马上接着用。(#2641, #2648)
    - 切换模型时自动调整 effort：新模型没有当前的 effort 时，自动换成它有的最近一个低档，不会再启动失败。(#2636)
    - 回复里提到的路径保持文字：行内代码或链接里写的路径找不到时，不再显示破图块或「找不到」卡片。(#2644)
    - 不带 https:// 的 GitHub 链接：github.com/owner/repo/issues/123 这类 issue 和 PR 链接也能和完整链接一样识别。(#2652)
    - 内置浏览器里的 Cloudflare 登录：侧边面板的浏览器能通过 Cloudflare 的验证了，Cloudflare 控制台和其他用它做验证的网站都能在里面登录。(#2656)
    - 其他修复：运行中被删除的定时任务不会再出现在列表里 (#2655)；停止 Pi 的一轮后，Pi 排队的消息会放回暂停的队列 (#2631)；插件面板在侧边面板列表里有了自己的分组 (#2632)；电脑上的 Kettu 太旧、预览不了文档时，会提示去更新那台电脑上的 Kettu (#2647)。
