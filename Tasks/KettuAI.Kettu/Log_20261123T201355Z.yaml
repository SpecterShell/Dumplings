Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    What changed
    - Google Antigravity gets a permission mode for new sessions in Settings › Agent, Full access included, so its sessions no longer open in Default and ask before a read-only command. Its questions now appear in Kettu's question card, and a question it stops waiting for is withdrawn.
    - Send now steers an Antigravity turn instead of stopping it. A command still running when its turn ends stays running, shows on the session board and keeps the session from being closed, so the dev servers it started are no longer killed.
    - Antigravity's sub-agents show in the session with their asks answerable, and its plan limit names fit.
    - Permission cards label only commands that are unsafe and deletions as Risky, for every agent. A session that another session starts and Workflow steps start in the mode their agent starts in, never wider than Auto.
    - A harness's own interface, such as OpenCode's server or Cline's SDK, now applies to every version up to the next major one, and Kettu checks it every 6 hours. A version that fails twice in a row goes back to the compatible interface by itself, and a new major version takes the preferred one once the checks pass, without a new release.
    - Sessions open faster, since reads wait until the session is on screen. The model menu is back to its earlier picker. Cached input is counted apart for every agent, and Pi's replies add up their total when none is reported.
    - The web client can be installed as an app, and a browser can get Kettu's notifications, such as a request waiting for your answer, even with its page closed. Settings › Notifications says where a closed page gets none.
    - Automatic publishing of artifacts to Kettu starts off. The ring on the account row matches the account's plan card.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - Google Antigravity 在 设置 › 智能体 里有了新会话的权限模式，可以选完全访问，会话不再一律从默认模式开始、连只读命令也要问。它的提问会出现在 Kettu 的提问卡片里，它不再等待的提问会被撤回。
    - 对 Antigravity 的回合点“立即发送”会引导它继续，而不是停掉回合。回合结束时还在跑的命令会继续运行，显示在会话看板上，也不会因此关闭会话，它启动的开发服务器不再被杀掉。
    - Antigravity 的子智能体会显示在会话里，它们的提问可以回答，套餐限额的名称也能对上。
    - 授权卡片只给不安全的命令和删除操作标“有风险”，对所有智能体一样。由别的会话启动的会话和工作流的步骤，按所用智能体的启动模式开始，不会比自动模式更宽。
    - 智能体自带的接口，如 OpenCode 的服务和 Cline 的 SDK，现在适用于下一个大版本之前的所有版本，Kettu 每 6 小时检查一次。连续两次失败的版本会自动退回兼容的接口，新的大版本在检查通过后无需发版就能用上首选接口。
    - 会话打开更快，读取会等会话显示出来再进行。模型菜单恢复为之前的选择器。每个智能体的缓存输入单独计数，Pi 没有给出总数时，回复的总数会自行加起来。
    - 网页端可以安装成应用，浏览器关掉页面后也能收到 Kettu 的通知，例如等你回答的请求。设置 › 通知 会说明哪些情况下关掉页面收不到。
    - 产物自动发布到 Kettu 的开关默认关闭。账号行上的环与账号的套餐卡片一致。
