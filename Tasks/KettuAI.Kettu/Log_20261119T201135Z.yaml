- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Kettu 0.1.13 puts the side panel's terminals, browser pages and devices in one row of tabs, runs OpenCode, Pi and Cline on their own interfaces, and lets you choose the model Kettu uses for titles and commit messages.
    What changed
    - Terminals, browser pages and devices in the side panel share one row of tabs, marked while the agent or you are using them. (#1998)
    - OpenCode, Pi and Cline run on their own interfaces instead of ACP; their sessions, commands and context compaction work as before. (#1987, #1991, #1988, #1996, #2007, #2014, #2015)
    - Settings › Agent lets you choose the model for lightweight tasks such as session titles and commit messages, and start an agent's new sessions in Full access. (#2009, #2001, #2005)
    - Archiving a session that has sub-sessions asks whether they go too. (#2010)
    - Pin projects in the sidebar, and drag the plan limit cards in the account menu into your own order. (#1947, #1946)
    - A Codex account's plan card shows its rate-limit resets and lets you use one. (#1971)
    - The Marketplace lists items with their publisher and installs, and a workflow shows its flow before you add it. (#1986)
    - The image viewer, the Import sessions dialog and the sidebar menu are redesigned, and Codex's context card is one panel. (#1985, #1981, #1976, #1975)
    - DeepSeek Harness lists the models set up in dsh itself. (#1980, #1990)
    - Replies draw svg and mermaid diagrams without a frame, Report a problem opens on a drafted description, New session lists slash commands, the composer's placeholder reads the same for every agent, and the Cmd+Q hint is a centered HUD. (#1972, #1974, #2018, #1973, #2019)
    - The Chinese interface uses one set of terms. (#1982)
    - Fixes: sidebar badges stay still on hover, the prompt cache countdown ticks every second, a sub-agent shows its own model, the prompt box keeps growing with text, Claude Code hides terminal-only commands before a turn, and Kettu's guide no longer asks for approval. (#1968, #1969, #1963, #1962, #2023, #2006)
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Kettu 0.1.13 把侧边面板里的终端、浏览器页面和设备合并到同一行标签，让 OpenCode、Pi 和 Cline 改用各自的接口运行，并且可以选择 Kettu 写标题和提交信息所用的模型。
    - 侧边面板里的终端、浏览器页面和设备共用一行标签，智能体或你正在使用的标签会有标记。(#1998)
    - OpenCode、Pi 和 Cline 不再经过 ACP，改用各自的接口运行；会话、命令和上下文压缩照常工作。(#1987, #1991, #1988, #1996, #2007, #2014, #2015)
    - 在 设置 › 智能体 里可以选择“轻量任务的模型”，用于会话标题、提交信息等，也可以让智能体的新会话以“完全访问”开始。(#2009, #2001, #2005)
    - 归档带有子会话的会话时，会询问子会话是否一并归档。(#2010)
    - 可以在侧边栏置顶项目，也可以把账号菜单里的套餐限额卡片拖成自己的顺序。(#1947, #1946)
    - Codex 账号的套餐卡片显示速率限制重置卡，并可以使用一张。(#1971)
    - 市场里的条目显示发布者和安装次数，工作流在添加前就能看到它的流程。(#1986)
    - 图片查看器、导入会话对话框和侧边栏菜单重新设计，Codex 的上下文卡片合为一个面板。(#1985, #1981, #1976, #1975)
    - DeepSeek Harness 列出你在 dsh 里设置的模型。(#1980, #1990)
    - 回复里的 svg 和 mermaid 图不再带边框，报告问题时会先填好草稿描述，新会话会列出斜杠命令，输入框的占位文字对每个智能体都一致，Cmd+Q 的提示改为居中的浮层。(#1972, #1974, #2018, #1973, #2019)
    - 中文界面的用词统一。(#1982)
    - 修复：悬停时侧边栏的徽标不再跳动，提示词缓存倒计时每秒更新，子智能体显示自己的模型，输入框随文字持续增高，Claude Code 在第一轮前隐藏只能在终端里用的命令，读取 Kettu 的指南不再要求批准。(#1968, #1969, #1963, #1962, #2023, #2006)
