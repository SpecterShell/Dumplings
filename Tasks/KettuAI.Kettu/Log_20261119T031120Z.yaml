- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Kettu 0.1.12 adds a Requests pane that lists every model request of a session, shows estimated sizes for Codex's Skills and MCP servers in its context, and tidies the composer's chips and takeover controls.
    What changed
    - Open a Requests pane to see the model requests a session made; Claude Code, Codex and OpenCode list each request, and ACP agents list their turns. (#1925, #1932, #1934, #1933)
    - Codex's context details show estimated sizes for its Skills and MCP servers. (#1931)
    - Mentions and links in the composer and in sent messages are raised white chips, and a GitHub issue or pull request link reads as a reference. (#1924)
    - Taking over a browser, device or terminal is grouped into one control in the composer. (#1930)
    - Quitting with the shortcut shows its countdown. (#1929)
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Kettu 0.1.12 新增“请求”面板，列出一个会话发出的每个模型请求；Codex 的上下文详情会显示技能和 MCP 服务器的估算大小；输入框里的标签和接管控件也更整洁。
    - 打开“请求”面板，查看会话发出的模型请求：Claude Code、Codex 和 OpenCode 逐条列出请求，ACP Agent 列出各轮对话。(#1925, #1932, #1934, #1933)
    - Codex 的上下文详情显示技能和 MCP 服务器的估算大小。(#1931)
    - 输入框和已发送消息里的提及与链接改为浮起的白色标签，GitHub 的 issue 和 pull request 链接显示为引用。(#1924)
    - 接管浏览器、设备或终端的控件在输入框里合并为一组。(#1930)
    - 用快捷键退出时会显示倒计时。(#1929)
