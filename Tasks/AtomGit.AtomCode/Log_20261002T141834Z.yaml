    AtomCode v5.2.1 Release Notes
    发布日期：2026-10-01
    v5.2.1 是一个回退修复版本：将代码基线整体回退到 v5.1.0，版本号升至 5.2.1，并同步修正站点文档中的版本展示。遇到 v5.2.0 问题的用户建议升级到此版本。

    ⚠️ Behavior Changes（注意行为变化）
    - 回退到 v5.1.0 行为基线：v5.2.0 引入的改动已全部撤回，产品行为恢复到与 v5.1.0 一致。v5.2.0 新增的界面与快捷键不再可用，包括：新版 atomcode --tui 界面（Ctrl+O 推理显示切换、Ctrl+T 工具输出分组、Ctrl+G 鼠标移交）、经典界面的 Ctrl+O 工具输出/推理显示开关、Windows 下 Ctrl+Alt+V 粘贴剪贴板图片。剪贴板图片粘贴统一回到 /paste 命令方式。
    🛠 修复（Fixes）
    稳定性
    - 回退至 v5.1.0 稳定基线：将代码整体回退到 v5.1.0（72b538e8c），规避 v5.2.0 引入的问题
    📚 文档（Docs）
    - 站点 getting-started 横幅中的版本号由 5.1.0 更正为 5.2.1
