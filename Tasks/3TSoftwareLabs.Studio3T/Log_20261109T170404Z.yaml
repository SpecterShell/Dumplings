- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Improvement: Team Sharing - Increase Team Sharing folder resource limit
    Fix: Compare/Sync - Fixed an issue where the Source panel in Compare/Sync could sometimes be left empty.
    Fix: Vulnerabilities - Update third-party dependency to fix CVE-2026-47890 and CVE-2026-47892.
    Fix: JSON View - Fixed an issue where editing a document from the JSON view could select the wrong value in the Document Editor.
    Fix: Vulnerabilities - Update third party dependencies to fix CVE-2026-89407, CVE-2026-89425, CVE-2026-68497, CVE-2026-91776 and CVE-2026-91777.
    Fix: Export - Fixed an issue where Studio 3T could crash when a saved export target could not be loaded, preventing scheduled tasks from running.
    Fix: Authentication - Fixed connecting to Amazon DocumentDB with AWS IAM authentication
