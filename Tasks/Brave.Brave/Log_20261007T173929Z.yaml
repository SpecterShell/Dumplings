  Key: ReleaseNotes
  Value: |-
    Web3
    - Enabled Zcash Ironwood support by default. (#56872)
    - Updated wallet to reject incorrect Zcash account birthday height. (#58757)
    - Updated wallet to reject negative Zcash "Send" amounts before review. (#58755)
    General
    - Added support for self-service Brave Account deletion. (#58719)
    - Updated Brave VPN to allow local traffic on Windows when connected. (#56320)
    - Updated screenshots taken in Private or Tor Windows to be marked as sensitive on Windows. (#58875)
    - Fixed crash which occurred on macOS in certain cases when an update was pending. (#58699)
    - Fixed "Pin to taskbar" not displaying a system notification on Windows. (#58830)
    - Fixed app icon theme choice being broken when downloading a file on macOS 26 and 27. (#58790)
    - Fixed "Always allow" checkbox setting for "mailto" not being respected on the external protocol dialog on macOS. (#16927)
    - Fixed incorrect tab tinting for achromatic colors. (#58747)
    - Fixed shields icon jitter on PWAs in tabbed mode on Linux. (#55708)
    - Upgraded Chromium to 155.0.8059.40. (#59729) (Changelog for 155.0.8059.40)
