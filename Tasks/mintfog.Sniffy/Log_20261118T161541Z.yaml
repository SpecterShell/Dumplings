  Key: ReleaseNotes
  Value: |-
    跨平台抓包 / 代理工具，通过 JavaScript 插件实时修改请求与响应、Mock 和断点调试。
    新增功能
    - 规则和搜索中的正则支持实时预览，可以用测试文本验证匹配和替换结果
    - 支持从 JSON 响应中提取业务状态码，流量列表可以显示和筛选业务码（issue #10）
    - 安装向导添加了关于 Linux 系统的证书安装教程
    优化改进
    - HAR 导入无限制导入大小，导入大体积文件会显示进度（issue #13）
    - macOS 的标题栏和窗口按钮对齐
    - 界面一些视觉优化调整
    问题修复
    - 修复了窗口边缘的提示文本被截断的问题
    致谢
    - 感谢 narmgalaxy 关于实时预览的建议
    - 感谢 selden 关于业务码的建议
    - 感谢 可莉 关于 HAR 体积的建议
