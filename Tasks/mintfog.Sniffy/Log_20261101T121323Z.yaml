  Key: ReleaseNotes
  Value: |-
    跨平台抓包 / 代理工具，通过 JavaScript 插件实时修改请求与响应、Mock 和断点调试。
    新增功能
    - 新增指南页，浏览器打开代理监听地址即可查看设置步骤、下载证书。
    - 重写规则支持正则匹配与替换。
    - 新增更新弹窗，可在软件内查看更新内容。
    - 软件在后台运行时，再次启动会唤醒已有窗口。
    优化改进
    - 重新设计重写规则页面，操作更方便。
    - 调整菜单顺序，将常用菜单前置。
    问题修复
    - 修复代理自转发导致的软件卡死问题（issue #3）。
    - 修复插件编辑器选中文字时对比度过低的问题。
