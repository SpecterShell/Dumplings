  Value: |-
    📝 可以在 Linkly AI 里记笔记了，极简的卡片笔记，天生方便 Agent 使用💡 Tips：笔记是存在你本地资料库目录下的普通 Markdown 文件，不上传任何云端，随时可以用别的编辑器打开。写好的笔记会自动进入索引，之后能被搜索、被 AI 引用。🚀 新功能：
    - 新增 本地笔记（Note）：Chatbot 侧栏新增笔记入口（⌘/Ctrl + Shift + N 直达），卡片式时间线浏览，支持标签过滤、按时间排序、⌘F 全文搜索、一键复制与展开全文。
    - AI 可以 读写你的笔记：新增 note_save 与 list 两个 MCP 工具，Claude、Cursor 等 AI 助手可以帮你把对话整理成笔记、给已有笔记续写，也能按标签列出笔记再挑着读。
    - Chatbot 新增 上下文自动压缩：长对话接近模型上下文上限时自动压缩历史，不必再新开一轮重述背景；也可以随时输入 /compact 手动压缩。
    ⚡ 改进：
    - 浏览器扩展剪藏的文章，正文里的图片引用现在能被正确识别：此前标题含空格的剪藏文档，整篇的图片映射都会失效，现在本地与云端知识库都已修复。
    - Markdown 预览支持渲染内嵌的 HTML，扫描件识别出来的表格也可以正常显示了。
    - 设置页的 搜索索引就绪状态更准确，不再在还没建好时就显示可用。
    - 云端知识库推送遇到网络抖动时会 自动重试，不再整批失败、需要从头重传。
    - 官网上线全新首页，并新增 浏览器扩展 与 CLI 独立介绍页。
    🐛 Bug 修复：
    - 修复个别文件临时不可读（云盘未同步、外置磁盘未挂载）时被 高频重试 拖慢索引的问题。
    - 修复媒体文件刷新时误清正文指纹，可能导致 云端副本被误删 的问题。
    - 修复未添加文件夹的知识库参与自动同步、反复失败的问题。
    - 修复嵌入进度条在索引过程中新增文档时 进度倒退 的问题。
    - 修复文件监听在某些情况下不会唤醒索引流程，导致改动迟迟不生效的问题。
    - 修复短时间内 重复检查更新 的问题。
    - 修复关闭使用数据统计后仍会发送数据、以及发送失败的数据被丢弃的问题。
