  Key: ReleaseNotes
  Value: |-
    ☁️ 云端嵌入服务正式发布：Pro 用户可切换到云端💡 Tips：云端嵌入是 Pro 功能，需要先登录 Linkly 账号，并确保有 Pro 版订阅。🚀 新功能：
    - 云端嵌入正式发布：Pro 用户可切换到云端嵌入服务，更快、语义搜索质量更高、更省资源。
    - 笔记：新增 时间轴导航。
    - 笔记：新增 标签筛选栏。
    ⚡ 改进：
    - 改进扫描件被重复 OCR 的几率：带隐藏文本层的扫描 PDF 在检测合格后会直接采纳，不用再排队重跑一遍识别。
    - 杂志类「整页大图 + 可见文字」的排版页也不再被误判成扫描件。
    - 修复偶发的低配置机器索引长期停滞问题。
    - 提高了高性能索引模式对机器资源的使用率。
    - 云端知识库：百万字级超长文档不再索引失败，并且不会再连累同批次其他文档。
    - 云端知识库：索引速度大幅提升。
    🐛 Bug 修复：
    - 修复自定义模型（OpenAI 兼容、未上报上下文窗口）无法手动压缩对话的问题。
    - 修复某条笔记日期异常（如误填年份）时界面卡死数秒，以及跨夏令时时区（智利等）时间轴丢失最新一天的问题。
    - 统一了正文 #标签 的解析口径，前后端与不同编辑路径下的标签识别结果不再有差异。
