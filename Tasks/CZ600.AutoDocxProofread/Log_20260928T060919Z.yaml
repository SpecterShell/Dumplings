  Key: ReleaseNotes
  Value: |-
    本次更新内容如下：
    - 新增表格内容校对，表格文字按行参与校对（此前表格内容不参与校对）
    - 新增最近文件列表，可快速重新打开校对过的文档
    - 校对时支持同时选择多个知识库作为参考
    - 重排 API 设置页面，语言切换移至设置页，API 删除增加二次确认
    - 修复知识库引擎加载失败时界面无任何提示的问题，现会明确提示检查杀毒软件对 vec0.dll 的拦截（解决部分用户"知识库添加后无法正常显示"的问题）
    - 修复含公式段落的修改回写丢失问题，增强脚注、公式标记还原的容错性
    - 修复删除知识库失败时仍提示成功的问题
    The updates in this release include the following:
    - Added table content proofreading; table text now participates in proofreading row by row
    - Added a recent files list for quickly reopening previously proofread documents
    - Support selecting multiple knowledge bases simultaneously during proofreading
    - Rearranged the API settings page and added delete confirmation for API entries
    - Fixed the issue where knowledge base engine load failures showed no feedback in the UI, now with a clear hint to check antivirus interception of vec0.dll
    - Fixed modification write-back loss for paragraphs containing formulas
    - Fixed the issue where deleting a knowledge base reported success even when it failed
