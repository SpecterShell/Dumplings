- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    更新内容
    - 新增深度思考（推理）模型支持：兼容 DeepSeek、豆包、GLM 等，思维链内容在进度信息区实时流式展示，可一键开关
    - 新增五套浅色主题皮肤（晴空/樱花/薄荷/暮蓝/鹅黄）；暗色模式下文档预览纸面改为可选，默认所见即所得
    - 校对粒度随校对类型自动确定（词错误=逐句、综合错误=逐段、润色/降 AI=整篇），无需单独选择
    - 「结果复核」支持显式开关，便于控制 token 成本；校对建议应用后显示绿色对勾标记
    - 知识库体验优化，校对时可同时勾选多个知识库参考
    - 界面全面翻新：功能设置、API 设置等页面卡片化重排，常驻说明改为悬停提示，操作按钮统一右对齐
    - 性能优化：校对结果点击原位更新（不再整篇重渲染）、历史记录分页查询、页面懒加载与分包，启动更快
    - 安全与可观测性：API 密钥落盘加密、日志脱敏，新增运行日志（2MB 自动轮转）便于排查问题
    - 稳定性修复：LLM 超时与失败分片可观测、知识库数据事务修复、单请求同步 IO 异步化，并进一步精简安装包体积
