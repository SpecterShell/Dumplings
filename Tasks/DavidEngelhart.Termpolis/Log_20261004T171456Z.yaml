  Key: ReleaseNotes
  Value: |-
    Windows: a pinned Termpolis gets its taskbar icon back
    If Windows Defender quarantined v1.49.1 on your machine (that build shipped unsigned), it also removed Termpolis's shortcuts, including the one behind a pinned taskbar button. Windows kept the pin, so the taskbar showed a Termpolis button with no icon, and the Termpolis window, which groups under that pin, had no icon either. Reinstalling didn't help: the installer recreates the Start menu and desktop shortcuts, never the pinned one.
    Termpolis now checks for this at startup. When Windows still lists Termpolis as pinned but the pinned shortcut is gone, Termpolis writes the shortcut back, and the icon returns straight away without restarting Explorer. It only puts back a pin that Windows still lists, and it never pins Termpolis by itself.
    No other changes since v1.49.3.
    Full Changelog: https://github.com/codedev-david/termpolis/compare/v1.49.3...v1.49.4
