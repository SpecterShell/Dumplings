- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Added hysteria ech subcommand to generate ECH keys and client configuration
    - Fixed plain HTTP transfers through the HTTP proxy being cut off after 10 seconds
    - Fixed Linux port-hopping rules incorrectly redirecting outbound UDP traffic, which could break Realms connections and other UDP traffic on the same machine
    - Updated quic-go to v0.62.0
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 新增 hysteria ech 子命令，用于生成 ECH 密钥和客户端配置
    - 修复通过 HTTP 代理模式传输明文 HTTP 连接时，连接会在 10 秒后断开的问题
    - 修复 Linux 端口跳跃规则错误重定向出站 UDP 流量的问题。此问题可能导致 Realms 和其他 UDP 连接失败
    - quic-go 更新至 v0.62.0
