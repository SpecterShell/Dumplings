Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Fixed QUIC protocol sniffing for modern browsers and QUIC libraries, whose ClientHello spans multiple packets. Domain-based ACL rules now apply to their QUIC traffic
    - sniff.timeout now only applies to TCP
    - Upgraded TUN mode to the latest upstream sing-tun (v0.9.6)
    - Removed the TUN route.strict option, which no longer had any effect
    - Updated Chrome QUIC fingerprint parroting to match Chrome 154
    - Fixed the client log reporting ECH as not accepted when Chrome parroting is enabled
    - Updated quic-go to v0.63.0
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 修复 QUIC 协议嗅探无法识别将 ClientHello 分多个包发送的现代浏览器和 QUIC 库的问题。基于域名的 ACL 规则现可正常作用于这些 QUIC 流量
    - sniff.timeout 现在仅对 TCP 生效
    - TUN 模式升级至最新上游 sing-tun (v0.9.6)
    - 移除了 TUN 的 route.strict 选项，此选项不再有任何作用
    - Chrome QUIC 指纹模仿更新至 Chrome 154
    - 修复启用 Chrome 指纹模仿时，客户端日志始终显示 ECH 未开启的问题
    - quic-go 更新至 v0.63.0
- Locale: en-US
  Key: ReleaseNotesUrl
  Value: https://github.com/HyNetworks/hysteria/releases/tag/app/v2.13.0
