  Key: ReleaseNotes
  Value: |-
    [Added] Keep the current worktree toolbar segment visible with the "Always show worktree list" Appearance setting - #22888
    [Fixed] Fix a crash that could occur when Git LFS progress tracking encountered a file read error - #22889
    [Fixed] Fix "Open in Cygwin" integration for repository folders whose names contain spaces or punctuation - #22883
    [Fixed] Correctly handle branch, remote, and tag names that start with a dash across fetch, push, checkout, merge, rebase, and worktree operations - #22862
    [Improved] Update Copilot SDK to v1.0.13 - #22828
    [Improved] Improve contrast of the success and failure icons in the checks summary - #22900
    [Improved] Validate macOS application bundle paths in the clone dialog - #22891
