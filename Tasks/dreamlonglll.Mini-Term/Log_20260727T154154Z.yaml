  Key: ReleaseNotes
  Value: |-
    更新内容
    本版主线是 Git Worktree 的完整落地——从「能建能删」做到「建完就能当项目用」，同时给提交历史补上了分支拓扑图。
    新功能
    - Worktree 管理 — 项目右键菜单或 Git 面板仓库行右键打开管理弹窗：列出全部 worktree、基于现有分支或新建分支创建、删除（可强制）、清理失效条目，增删后仓库列表即时刷新。worktree 可一键「设为项目」或直接在终端打开；pane 支持工作目录覆盖并随布局持久化，分屏继承目录。
      - 向下发现仓库 + 多选批量新建 — 项目根目录本身不是 Git 仓库时不再直接报错，而是向下扫描子仓库并按主工作区归并成分组列表；组头可勾选（多选 / 全选），一次为每个勾选的仓库各建一个 worktree。多选时分支下拉取各仓库的分支交集，路径框语义变为父目录并预览 <仓库名>-<分支> 的完整落点，失败的逐仓库列出错误。
    - Worktree 子项目 — 「设为项目」后挂在主项目下方作子项目（缩进跟随分组），拖出或右键「脱离父项目」转回顶层，删除父项目时子项目原位晋升不丢失；项目列表为 worktree 显示 ⎇ 分支徽章，仓库列表与 Changes 下拉同样标注。
    - 提交历史分支拓扑图 — 每行左侧绘制 SVG 拓扑图，按 lane 布局画出分支、合并与直穿连线，节点按 lane 上色、合并提交用实心点套外环；汇入线用分支自身颜色的贝塞尔曲线并在根部渐变融入主线。后端 revwalk 追加 TOPOLOGICAL 排序，避免时钟偏移或 rebase 后父提交排在子提交之前导致连线断裂。
    - 分组右键直接添加远程项目 — 分组右键新增「添加远程项目」，新建的 SSH 项目直接落入该组，折叠的组自动展开；弹窗改为与「SSH 连接」「关联 SSH」同构的分组分栏布局。
    修复
    - Claude 提问文字在暗色下不可见 — 终端启用最小对比度。
    - 会话列表剩余会话加载不出来 — 底部改用「加载更多」按钮：原先靠滚动到底触发，而一页 20 条撑不满面板高度时容器不产生滚动条，scroll 事件永不触发。
    - 拓扑图分支线配色与拐弯方向 — 分支汇入主线时错用目标 lane 的颜色导致整段变主线色，已改用分支自身颜色；连线拐弯由圆角折线改为两端切线垂直的贝塞尔曲线。
    - 提交历史分页带回重复 commit — 从上一页末尾 commit 的 parent 重新 revwalk 时按 hash 去重，整页重复则停止分页。
    - commit 行挂满无关分支 — 只标注本仓库自己检出的分支（及正在查看的分支），不再把其他工作区 / 远程分支全列上去。
    体验
    - 退出确认不再动不动就弹 — 关窗盘点改为只统计 AI 会话（ai-working / ai-idle 的 pane），裸 shell 终端不计入；仅当存在 AI 会话时才弹确认并列出会话名清单。
    - 项目 / 分组右键菜单补确认与树形选择 — 「删除分组」先弹确认并说明组内项目会移到上一级而非被删除；项目右键新增红色「移除项目」；「移动到分组」由平铺列表改为按分组树逐级展开的子菜单，当前所在组标 ✓ 并置灰。菜单支持多级子菜单与 ArrowLeft 逐层返回。
    - 「关联 SSH」弹窗改为分组分栏 — 与「SSH 连接」弹窗同构，全部视图下按组折叠；全选 / 全不选只作用于当前可见连接，在某个分组里点全选不会顺手勾上其他分组。
    安全性
    - 删除 SSH 连接加二次确认 — 提示该操作不可撤销，会丢失已存密码与私钥路径，并收窄已关联项目的可见范围。
