  Key: ReleaseNotes
  Value: |-
    更新内容
    新功能
    - 终端帧率可调：「设置 → 系统 → 性能」新增前台帧率(10240,默认 30)与后台帧率(窗口失焦但仍看得见时，160,默认 5),改完即时生效。高刷屏想让刷屏更顺就调高前台，笔记本想省电就调低；实际帧率不会超过显示器刷新率，窗口最小化时照旧一帧不画。后台帧率调得再低，切回前台也会当场补画并立刻换到前台节拍，不会冻着等上一拍。
    - 皮肤库新增浅色皮肤 Morning Mist 晨雾：外观页点「更多皮肤」即可找到，下载后导入即用。
    安全性
    - SSH 密码自动填充不再「终身待命」:右键「SSH 连接」在公钥先登录成功时，密码填充此前会一直挂着，之后 sudo / su / mysql -p 的密码提示会被自动灌入 SSH 密码；现在写完连接命令即挂上「一打字就解除」并带过期时间。
    - known_hosts 校验收紧：读取失败不再当空文件放行；支持 Linux 默认的哈希条目；同一主机换了密钥算法按「主机密钥变化」拒绝，不再当新主机静默接受。
    - 中转桌面密钥加密保存，与 SSH 密码同一套封存；配置明文 ws:// 中转地址时给出警告。
    - sidecar 的 SSH 文件传输护栏扩到 config.db / 备份 / credential.key。
    - 会话续接命令拒绝以 - 开头的会话 id,防止被当成命令行参数注入；认不出的 AI 工具不再被拼成 claude --resume。
    修复
    - 配置在新旧版本之间来回装不再丢设置：旧版本只删自己认识的键，新版本写入的设置、项目与连接的未知字段原样保留；单个坏值按默认值降级，不再整库进入只读。
    - 配置加载失败进入只读时给出提示，配置写盘失败也会提示；提交失败在提交框下方原样显示 hook / GPG 输出；暂存、丢弃、在外部程序中打开失败都有提示；删除 worktree 失败显示原因。
    - 分屏后标签页较多时，整个界面不再被撑出窗口右侧。
    - Git 历史分页在有合并的仓库里不再漏掉提交。
    - Git 面板对项目根仓库点「在终端中打开」不再误带目录覆盖、改页签名。
    - 看图页签在图片文件被改写后跟随刷新。
    性能
    - 终端底层改用随包的 Windows Terminal 1.24 便携 ConPTY(此前实际一直用的是系统 conhost);环境变量 MT_DISABLE_PORTABLE_CONPTY=1 可回落系统版。
    - 启动更快：终端在后台启动(恢复多个分屏时界面不再卡一下),配置只读一次、备份挪到后台。
    - 闲置分屏不再每帧重画；终端查找条在大回滚区里只重扫有变化的行。
    - 目录监听改为全进程一个监听器(不再每个展开目录一条线程),注册挪出界面线程；文件树去掉常驻 100ms 轮询。
    - Git 历史十万级提交的仓库翻页从数百毫秒降到毫秒级。
    - 弹窗毛玻璃、看图、Markdown 图片、皮肤卡片用完即释放显存；全局内容搜索跳过超大文件并并行读取。
    - 移动端镜像不再每秒重新定位会话文件，大会话换绑不再整文件读进内存；多个终端同时改标题时状态推送不再被拖延。
    安装与交付
    - 安装器只关闭安装目录下的 mini-term,先请它正常退出(保存配置)再强制结束，不再误杀其它位置的副本；卸载时清理四家 AI 工具里的 hook 注册(升级时保留)。
    - 发布流程先建草稿、全部平台成功后才公开，并附 SHA256SUMS.txt;Windows 调试符号单独提供 x64-pdb.zip,崩溃日志带调用栈。
    - deb 包声明运行时依赖。
    升级须知
    - 从 v1.13.7 及更早版本升级时，旧版卸载器仍会按进程名结束一次所有 mini-term;之后的升级只关安装目录下的实例。
    - 用量统计的本地账本升级为新格式；装回旧版会自动重建一次，数据不丢。
    - 全局内容搜索改为收齐候选后再出第一批结果。
    下载

