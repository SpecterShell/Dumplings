  Key: ReleaseNotes
  Value: |-
    本版终端内置 Nerd Font 图标(issue #86),新增原版 pi 的接入(issue #85),SSH 快速连接面板与 Git 提交详情栏也一起发布。
    更新内容
    新功能
    - 内置 Nerd Font 图标 —— 终端字体缺 Nerd Font 图标时自动补上，starship / oh-my-posh / Claude Code 等 AI CLI 状态栏里的图标不再显示成方块，不必另装 Nerd Font 补丁版字体。图标按格子大小缩放，后面紧跟空格时按正文字号显示；powerline 三角、半圆端帽、斜切按格子直接绘制，撑满整行、与色段无缝衔接。终端字体本身就是 Nerd Font、或已在字体设置里配了已安装的 Nerd Font 时，画面与以前一致。
    - 支持原版 pi —— pi 的完成、打断、出错与等待确认会点亮页签状态灯并按通知设置提醒；pi 会话进入 AI 历史面板与手机端对话镜像，可从历史里一键续接(pi --session <id>)。与 oh-my-pi 共用扩展目录时两边互不干扰。
    - SSH 快速连接面板 —— 终端右键「SSH 连接」改为可搜索的面板：每行显示 user@host:port 与认证方式(密钥 / 密码),按名称、主机、用户、分组搜索，↑↓ 选择、Enter 直连；分组可折叠并记住折叠状态，底部直达新建 / 管理连接。
    - 提交详情栏 —— 单击提交历史行，在 Git 抽屉左侧展开单独的提交详情栏(可拖宽、宽度会记住),新增提交者与提交时间、父提交、所在分支、逐文件增删行数与合计；可复制提交消息、打开提交 diff。
    体验
    - AI 等你确认(批准权限、填表单、API 出错)时固定提醒一次，「待确认时也提醒」开关随之移除。
    修复
    - 终端里 Ctrl+单击文件路径打开文件时，新开的页签也能准确定位到行，目标行顶到视口顶部；：1-222、#L5-L9 这类范围写法会选中整段。
    - 切换终端页签或终端面板时，不再误弹出重命名。
