- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    更新内容
    新功能
    - Worktree 自动挂为子项目：本地仓库的 worktree 会自动出现在主项目下方——在终端里 git worktree add，或让 AI 新建 worktree 后，不用再去「Worktree 管理」里点「设为项目」；外部删除的 worktree 会自动从列表移除，手动从列表移除过的不会再被加回来
      - SSH 远程项目与 WSL 路径暂不自动发现，在「Worktree 管理」里新建的照常挂上
    - 项目列表的 worktree 分组：主项目与它的 worktree 收进同一个带树形连线的分组框，子项直接以分支名显示（手动改过名的保留你的名字）；主项目行上的计数徽标一键折叠整组，折叠后子项的 AI 完成、等你处理、报错与 SSH 状态汇总到主项目行上，不会漏看
    体验
    - Worktree 管理弹窗：当前项目所在的 worktree 高亮并标「当前」，点整行切到对应项目，行尾改成紧凑的图标按钮；新建区默认折叠，路径按仓库已有的存放习惯自动推断（已有 worktree 放在仓库内的 .worktrees/ 就沿用，放在仓库外就沿用常用的父目录），填好分支回车即可创建
    - 折叠动画：项目分组、worktree 分组与文件树目录的展开、收起改为按高度展开，半路反向从当前位置掉头，长列表不会拖很久
    修复
    - 用量统计：在请求日志表格或「按项目」列表里滚动滚轮时，外层弹窗会跟着一起滚
