Version: 1.13.31
Installer:
- Architecture: x64
  InstallerType: nullsoft
  InstallerUrl: https://github.com/dreamlonglll/mini-term/releases/download/v1.13.31/Mini-Term_1.13.31_x64-setup.exe
Locale:
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    更新内容
    新功能
    - SSH 远程项目支持 Git：远程项目也能用原来的 Git 面板查看更改与 diff、暂存提交、看历史、管理分支 / 贮藏 / Worktree、拉取推送。每个项目默认不启用，首次打开 Git 面板时会询问；同意后才会把随安装包附带的小助手程序上传到服务器的 ~/.cache/mini-term/git-helper/ 并运行，服务器只需装有 Git，无需 root 或额外端口。也可在项目右键菜单里随时启用或撤销。请只对可信的服务器和仓库启用，详见 README「远端 Git helper」（#97，感谢 @Clannad47）
    - 逐段解决冲突：冲突文件右键「逐段解决…」，每段冲突可以选当前、对方或两者都要，选完写回文件并标记已解决；也可以先只写回选好的段，其余段保留冲突标记
    - 按行暂存：diff 里可以勾选具体的行，只暂存、取消暂存或丢弃勾上的那几行；折叠起来的未改动行可以点开查看
    - 快速打开文件：Ctrl+Shift+O 按文件名边打字边查找当前项目的文件，输入 文件名：行号 打开后直接跳到该行；最近打开的文件排在最前，直接回车就能切回上一个文件
    - 识别文件编码：GBK、Big5、Shift_JIS 等非 UTF-8 文件不再乱码，可以正常查看、编辑和看 diff，保存时按原编码写回
    - 分支弹窗右键新增「复制分支名」
    体验
    - diff 改在编辑区页签里打开，不再弹窗；并排视图去掉了空白占位行，中间用彩色连接带标出两侧对应的改动，改动按修改 / 新增 / 删除分色
    - 文件在外部被修改、编辑器里又有未保存内容时，提示条新增「对比」（查看磁盘版本与你的修改的差异）和「保留我的」
    - 「全部暂存并提交」遇到只暂存了一部分的文件时会先确认，避免把有意留下的改动一起提交
    修复
    - macOS 上 ⌘← / ⌘→ 在终端里跳到行首 / 行尾（#98，#99，感谢 @Clannad47）
    - 手机端打开以前用过的配对链接（如书签）时提示配对码无效，现在会改用已保存的凭证直接重连。自建中转需更新到最新的中转服务后生效
