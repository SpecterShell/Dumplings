    | macOS Intel         | Mini-Term_1.2.8_x64.dmg（同上需 xattr -cr）                                                     |
    | Linux x64           | Mini-Term_1.2.8_amd64.deb / Mini-Term_1.2.8_amd64.tar.gz                                        |

