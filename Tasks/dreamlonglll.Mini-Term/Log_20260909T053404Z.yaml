  Key: ReleaseNotes
  Value: |-
    更新内容
    新功能
    - 文档页签批量关闭 — 页签上右键，可「关闭 / 关闭其他 / 关闭右边 / 关闭左边」；常驻的终端页不在任何关闭范围内、也不给菜单，永远关不掉。批量关闭里有未保存的文件时只弹一次确认并列出文件名（超过 5 条折成「另有 N 项」），活动页被一并带走时会落到你右键的那一页。
    - 页签条横向滚动 — 页签不再被挤压变形，多到装不下就横向滚动（垂直滚轮同样能推）；鼠标移上页签条时底缘浮出一根细滚动条，可以直接拖着滚。切页、新开文件、批量关闭之后都会把目标页签自动拉回视野；回终端的那一颗钉在最左侧不参与滚动，任何时候都点得到。
    体验
    - 左侧边条的 AI 历史、Git 变更、终端列表、用量统计四颗按钮不再有激活态，只保留悬停反馈，与设置 / SSH / 移动端三颗一致；「折叠中间栏」仍保留激活态——中间栏收起后没有别的线索能看出它的开合。
