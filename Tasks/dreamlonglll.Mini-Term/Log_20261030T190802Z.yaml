  Key: ReleaseNotes
  Value: |-
    本版主角是重做的 Git 面板：对标 JetBrains IDEA 的 Git 工作流，分支、同步、按块暂存、历史操作、贮藏、编辑器注解一应俱全。另有文件页签「打开文件所在文件夹」和几处终端 / 文件树 / worktree 的修复。
    更新内容
    新功能
    - Git 面板对标 IDEA —— 更改与提交历史上下同屏，中缝可拖、两区可折叠。
      - 分支弹窗：点仓库栏的分支胶囊打开，可搜索，按当前 / 最近 / 本地 / 远程分组，键盘全程可用；检出、从此新建、合并、变基、推送、重命名、删除都在这里。本地改动和目标分支冲突时提供「贮藏后检出」。
      - 同步：Fetch；拉取可选跟随 git 配置 / 合并 / 变基 / 仅快进；推送一律先打开对话框，列出待推送的提交，确认后才推，强制推送带期望值保护。
      - 更改区：diff 里每一块都能单独暂存、取消暂存或丢弃；冲突文件右键采用我方 / 对方（变基时写清哪边是你的改动）；合并、变基、拣选进行中时有状态条，可继续或中止；支持 Amend、提交消息历史、「提交并推送」。
      - 提交历史：拓扑图、引用胶囊、提交详情区；右键拣选、还原、重置、撤销提交、修改消息、新建分支 / 标签；可按文本、作者、path:路径 过滤，或只看自己的提交。文件右键「Git 历史」查看单个文件的历史。
      - 贮藏：贮藏列表可应用 / 弹出 / 删除 / 从贮藏新建分支，提交按钮旁菜单可新建贮藏。
      - 编辑器：行号旁显示与 HEAD 相比的变更标记，点开可看原内容、回滚这一处；「注解」开关显示每行的作者与日期。
      - 终端或外部工具里执行的 git 操作，面板会自动刷新；同一仓库同时只放一个写操作进去，其余按钮置灰并写明原因。
    - 文件页签「打开文件所在文件夹」 —— 二进制、过大或解不出的文件无法预览时，「使用默认工具打开」旁多一个按钮，直接在系统文件管理器里定位到它。
    修复
    - 在外部删掉文件树里已展开的目录、再建一个同名目录，文件树现在会自动显示新内容，不用再折叠展开一次。
    - 删除被终端占用的 worktree 不再「删一半」：mini-term 自己停在里面的终端会先列出并关闭；被其它程序占用时什么都不改，并说明原因。
    - 把 worktree 设为项目后，文件树和全局搜索不再列出它根目录下的 .git 文件。
    体验
    - 终端工具栏的查找、向右分屏、向下分屏、关闭整个区域补上悬停提示，带快捷键。
    - worktree 路径在 Windows 上统一显示为反斜杠，从不同入口打开的 worktree 终端路径一致；相关弹窗改用全角标点。
    - 提示气泡里的长路径整段换行，不再在斜杠处断开；「移除项目」「重命名终端」弹窗与其它确认框对齐。
