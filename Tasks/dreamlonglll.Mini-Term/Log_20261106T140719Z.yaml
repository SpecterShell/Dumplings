  Key: ReleaseNotes
  Value: |-
    更新内容
    新功能
    - 一键关闭所有文件：右键工作区最左边的「终端」页签，选「关闭所有」，就能关掉当前项目已打开的全部文件并回到终端。有未保存的文件时只确认一次，并列出文件名；取消则一个都不关
    体验
    - AI 还没忙完时，关终端仍会提醒：即使关闭了「关闭终端前确认」，只要要关的终端里有 AI 正在工作或亮着黄灯等你处理，关闭前也会再问一次，关整个区域或面板时同样如此。这个提示不提供「不再询问」；普通终端和闲置的 AI 对话仍然直接关闭
    修复
    - Windows 上 Esc 和部分 Alt 组合键失灵：v1.13.28 和 v1.13.29 中，按过 Shift+Enter 或 Ctrl+J 后，Esc、Alt+Backspace 等按键可能要等到下一次按键才生效，部分组合键还会吞掉之后的输入，现在已修复。如果还遇到类似问题，欢迎反馈（#95，感谢 @Clannad47）
