  Key: ReleaseNotes
  Value: |-
    更新内容
    体验
    - 移动端配对可以复制链接了：「移动端」面板的二维码下方现在显示完整的配对链接，旁边有复制按钮。手机没有扫码功能时，把链接发到手机，用浏览器打开就能配对（#94，感谢 @hyede 反馈）。这个版本不需要更新中转服务器
    修复
    - HTML / PDF 预览时按 Alt 可能让窗口卡住：焦点在预览页里时按 Alt 或 F10，主窗口会进入一种看不见的菜单状态，有时表现为界面点不动、最小化后点不出来。现在会拦下这类菜单命令；主窗口自己的 Alt+Space 系统菜单不受影响。如果还遇到类似的卡死，欢迎反馈
    - Claude Code 和 pi 里用 Shift+Enter 提交后的状态错误：未开 hook 时这一回合可能没有完成通知，这条输入还可能和下一条合并显示，现在都已修复
    已知限制
    - OMP 的 Ctrl+J 目前仍是提交，要等 OMP 上游调整，换行请先用 Shift+Enter
