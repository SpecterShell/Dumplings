  Key: ReleaseNotes
  Value: |-
    更新内容
    新功能
    - HTML 真预览：文件树打开本地 .html,预览态改用系统 WebView(Windows 为 WebView2)渲染，CSS 与脚本照跑，效果与浏览器一致。相对路径的样式、脚本、图片、字体按项目目录加载；在源码里改完不保存，切回预览就能看到效果。页面里的外链先弹确认再交给系统浏览器，链到本地文件的作为新页签打开。右键菜单、弹窗、通知、右侧抽屉照常盖在网页之上并且点得到；切页签或切到源码时网页隐藏，切回来页面状态还在。
    - 页面脚本读不到项目里的其它文件(.env、配置、源码等),比直接用浏览器打开本地文件还收紧一档；下载一律拒绝。WebView2 运行时缺失、或设了环境变量 MT_DISABLE_HTML_WEBVIEW=1 时回落到原来的简版渲染。
    体验
    - 确认框、提示框底部的「取消 / 确定」按钮，鼠标移上去显示手型光标。
    - 文件树标题栏精简：去掉粘贴、新建文件 / 文件夹、上传文件 / 文件夹五个图标，这些操作统一走空白处或目录行的右键菜单。
    修复
    - 背景图皮肤下，标题栏项目切换下拉面板不再半透明透出底下的内容。
    下载

