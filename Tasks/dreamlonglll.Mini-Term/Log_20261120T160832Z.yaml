  Key: ReleaseNotes
  Value: |-
    更新内容
    新功能
    - 看清 AI 在服务器上做了什么：AI 通过 mini-term-ssh 技能操作服务器后，终端组标题栏「查找」图标左边会出现 SSH 按钮（带调用次数，命令运行中亮蓝点、最近一次失败亮红点）。点开悬浮框，按时间列出 AI 发出的命令原文、服务器的原样输出与退出码；上传 / 下载显示路径和字节数。可以复制单条命令、单条输出或全部内容，也可以一键清空
      - 悬浮框不抢键盘焦点，鼠标不在框上时是淡底、不挡视线，移进去变实底
      - 记录只保存在内存里，关掉终端即清除
      - 暂不支持 WSL 终端和 SSH 远程项目里的终端
    体验
    - 浮层开合加了动画：SSH 悬浮框、命令库和终端查找条（Ctrl+F）都从标题栏对应图标的下方展开，收起时反向收回；在「设置 → 终端」关闭「启用动画」后直接开合
