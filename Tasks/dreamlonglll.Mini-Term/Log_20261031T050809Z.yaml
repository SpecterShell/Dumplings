- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    本版继续打磨 Git 面板的代码审查体验(issue #84):历史区可以多选提交、合并查看改动文件；改动文件按目录树展示并压缩单链目录；diff 正文可以选中复制。
    更新内容
    新功能
    - 多选提交合并查看 —— 提交历史里 Ctrl 单击、Shift 单击或 Shift+↑↓ 选中多个提交，详情区列出这些提交合起来改了哪些文件；点文件、按 Enter 或右键「查看变更」打开合并 diff。口径与 IDEA 一致：每个文件从「最早一次改动之前」比到「最后一次改动之后」,中途改名的会跟着走，先新增后删除的文件不再列出。多选时 Ctrl+C 或右键可复制全部哈希。
    - 改动文件目录树 —— 更改区的树形视图、提交详情、提交 diff 弹窗左栏统一按目录分组：只有一个子目录的目录链合并成一个节点(如 .claude/skills/scenarios),每个目录后面写着文件数，目录在前、按名称排序。提交详情和提交 diff 左栏可在列表 / 树形之间切换，默认树形，选择会被记住。
    - diff 正文选中复制 —— 单文件 diff、提交 diff、单文件历史里的 diff 都能用鼠标拖选(拖出边缘会自动滚动)、双击选词、三击选行，Ctrl+C 复制，Ctrl+A 全选，右键也有「复制 / 全选」。并排视图只复制起拖的那一栏；行内视图复制时不带行号和 +/- 标记；含 tab 的行复制出原样的 tab。
    体验
    - 提交详情里重命名的文件，悬停时显示「旧路径 → 新路径」。
