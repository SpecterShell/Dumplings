  Key: ReleaseNotes
  Value: |-
    本版处理 #83：找不到在哪里添加 SSH 连接。现在「添加远程项目」里可以直接新建连接，项目列表底部的按钮也写明了各自是做什么的。
    更新内容
    体验
    - 在「添加远程项目」里直接新建 SSH 连接 —— 还没有连接时，弹窗中间就有「+ 添加 SSH 连接」按钮；已有连接时，连接列表末尾也有一颗。点开直接进入新建表单，保存后自动回到「添加远程项目」并选中这条新连接，接着填路径即可。以前这里提示「请先通过顶部菜单『SSH』添加连接」，但那个菜单早已移到左侧边栏，照着提示找不到入口。
    - 项目列表底部按钮写明动作 —— 原来的「+ 添加项目 / SSH / +」改为「添加本地项目 / 添加远程项目 / 新建分组」，各带图标，悬停有说明；栏宽放不下时自动换行，不再截断。原先那颗「SSH」按钮容易被当成「添加 SSH 连接」，实际打开的是添加远程项目。
    修复
    - 没有 SSH 连接时打开「添加远程项目」，焦点不再落到看不见的路径框上（之前 Esc / 回车都没反应，得先点一下弹窗）。
    - 「关联 SSH」在没有连接时的提示改为指向左侧边栏的「SSH 连接」。
