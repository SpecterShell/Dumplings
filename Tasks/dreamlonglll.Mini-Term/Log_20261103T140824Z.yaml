- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    更新内容
    性能
    - Git 面板大仓库提速：上千条远程分支的仓库里，「提交是否已推送」的判断从分钟级降到百毫秒级，撤销提交 / 重置 / Amend 的强推警告即时弹出；领先 / 落后计数加了缓存，分支弹窗一次取齐
    - 长列表全部虚拟化：更改列表、分支弹窗、提交 diff 文件栏、编辑器变更小窗只绘制可见的行，两万项改动、一千多个分支照样流畅
    - 提交历史增量加载：十万级提交的仓库续页只算新追加的行，自动续页到 5000 条后改为「加载更多」
    - 大批量暂存提速：两万个文件全部暂存从 8 秒多降到 1.4 秒，取消暂存从 5 秒降到 0.9 秒
    - 自动刷新去重：终端里跑 git 命令、外部改动不再重复整面板刷新，结果没变时不重绘；窗口最小化时停止轮询
    - 超过 1MB 的文件 diff 显示「过大」，不再卡住界面；大批量改名按规模分档识别
    修复
    - 目录很多的大仓库里，深层文件被外部修改后不自动刷新
    - Git 抽屉收起时，文件树里折叠目录的改动标记不更新
    - 本地分支很多时，分支弹窗「当前分支」行不显示领先 / 落后
    - 切换分支后提交历史停在原来的滚动位置，不回到顶部
    体验
    - 从标题栏项目切换器、Ctrl+Shift+P、通知、托盘、AI 历史等入口切换项目时，左侧「项目」列表会自动展开所在分组并滚动到该项目，不再只是换了高亮却看不见
    - 提交 diff 弹窗左侧文件栏支持 ↑ / ↓ 切换文件
    - 刷新按钮只在手动刷新时转圈；只改 git 配置（如设置上游、添加远程）时，点一下刷新即可显示
