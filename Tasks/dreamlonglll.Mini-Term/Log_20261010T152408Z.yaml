  Key: ReleaseNotes
  Value: |-
    更新内容
    新功能
    - PDF 预览：文件树里点开本地 .pdf，直接在页签里查看。用的是系统 WebView 自带的阅读器（Windows 上是 Edge 阅读器），书签目录、页码跳转、搜索、缩放都能用。文件在磁盘上被改写后自动重新加载，工具栏可一键「使用默认工具打开」。文档里的外链先确认再交给浏览器，指向本地文件的链接作为新页签打开。Linux、远程项目里的 PDF，或系统缺少 WebView 时，显示打开 / 下载提示。
    - Markdown 预览目录栏：文档有两条以上标题时（写在列表、引用里的不算），预览左侧显示目录，按层级缩进，过长的标题截断、悬停看全文。点一条跳到对应章节，当前章节随滚动高亮，标题很多时高亮项会自动滚进可视范围。工具栏「目录」按钮控制开关，所有页签共用，重启后保持。用到脚注或引用式链接的文档暂不显示目录。
    修复
    - 拖动分隔条调整终端宽度后，Claude Code 的输出在回滚区里重复出现多份（慢慢拖窄再拖回时可多达二十余份）。
    - Windows 上缩窄终端（拖分隔条、拖窗口边、一次缩小一大截）或一次减少很多行后，PowerShell 的下一条输入画到提示符的上一行、输出盖掉提示符。
