- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    更新内容
    新功能
    - 远程通知（#87）：人不在电脑前也不漏。AI 任务完成，或停下来等你批权限 / 填表单 / 因 API 错误中断时，推送到手机。在「设置 → AI → 远程通知」打开后多选渠道：
      - Bark：填设备 Key，或直接粘贴 Bark App 里复制的整条推送地址；支持自建 bark-server
      - Telegram：填自己机器人的 Bot Token 和 Chat ID；国内网络需开系统代理，或填反代的 Bot API 地址
      - 通用 Webhook：POST JSON 到任意地址，可自定义请求体模板，ntfy、Server 酱、企业微信 / 飞书 / 钉钉机器人、Gotify、Discord 都能接
      - 每个渠道都可以一键「测试发送」；「需要你处理」类提醒依赖 Hook 事件（在「Hook 事件」页开启）
    - 通知直达手机端会话：配置了移动端中转时，通知附带手机端链接，点开直接进入对应会话的对话镜像，可以在手机上接着处理。自建中转的用户需要把中转更新到本版本才能直达会话（旧中转点开停在会话列表）
    - 推送内容只有项目名、AI 名称、终端名和待处理原因，不含对话内容；Bot Token 等凭据在本地加密保存
