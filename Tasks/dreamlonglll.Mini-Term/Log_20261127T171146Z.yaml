Locale:
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    更新内容
    本版是 v1.14.7 之后的正式版，包含 v1.14.8-pre 预览版的全部内容。
    新功能
    - 按需扩展：远端 Git helper、SSH 工具（mt-ssh-cli / mt-ssh-mcp）和 16 种大体积语法高亮（C/C++、C#、PHP、Ruby、Kotlin、Swift、SQL、PowerShell 等）不再打进安装包，安装包明显变小。用到时再下载：在「设置 → 扩展」里单独下载或全部下载；SSH 项目首次用托管 Git、在「关联 SSH」里启用 SSH 工具、或在文件预览里打开这些语言时，也会提示并自动下载。下载完成后语法高亮直接生效，不用重启
      - 无法访问 GitHub 时，可在「设置 → 扩展」里改下载地址（镜像），或下载本页的离线扩展包 Mini-Term_<版本>_<平台>-extensions.zip 后导入。任何来源下载的文件都会按安装包里的清单校验 SHA-256
      - 还没下载语法包时，这 16 种语言按纯文本显示
    - 终端剪贴板（OSC 52）：SSH 远程主机、tmux、screen 和全屏 TUI 里的复制可以直接进本机剪贴板。「设置 → 终端 → 终端剪贴板 (OSC 52)」分别控制写入（默认开）和读取（默认关）；读取开启后终端里的程序（含远程主机）可以读你的剪贴板，只建议在可信环境下打开
    - 多分屏焦点标识：开了多个分屏时，键盘焦点所在那组的激活页签底部有一条强调色细线，一眼看出敲字会进哪个终端；点文件树、侧栏时标识停在原来那组
    - Markdown 代码块一键复制：Markdown 预览和会话正文里的代码块右上角有「复制」按钮
    - 手机端实时终端视图：镜像页顶部可在「对话 / 终端」之间切换，终端视图只读跟随桌面上 AI 终端的实时画面，支持「重排 / 原屏」两种排版和字号调节，不会改动桌面终端尺寸；底部的应急按键条（Esc / Tab / 方向键 / Ctrl+C 等）直接发到桌面终端
      - 需要同时重新部署中转服务端（cd relay-server && docker compose up -d --build），手机端页面随中转一起更新
    - 手机端文件与技能补全：指令输入框里敲 @ 搜索并引用项目文件，敲 / 插入技能命令（Codex 会话为 $），只插入到草稿里、不会自动发送
      - SSH 远程项目暂不支持
    - 手机端返回手势：Android 返回手势 / 返回键逐级退出（终端视图 → 对话 → 列表，弹层也算一级），回到首页后再按返回才离开
      - 需要同时重新部署中转服务端（cd relay-server && docker compose up -d --build），手机端页面随中转一起更新
    体验
    - 文件树展开不再卡：展开的目录多了以后，点开 / 收起文件夹会卡顿约 0.2 秒；现在只渲染可视区附近的行，上千行的树展开、收起、悬停、滚动都保持流畅
    - AI 工作时更省电：AI 干活期间转圈灯不再带着项目列表和终端区整块重画，hook 频繁上报、终端频繁改标题时也不再连带重画无关界面，主线程占用明显下降
    - 手机端终端视图更省流量：桌面画面没变时不再重复推送，画面一直在变时适当放慢推送（最多晚 0.8 秒）
    - 弹窗里按 Esc 先退一步：SSH、移动端、设置里正在编辑表单时，第一下 Esc 回到列表，第二下才关弹窗
    - 删除前多确认一次：删除自定义 Shell 改为就地二次确认；皮肤卡片的删除按钮悬停时才出现；密钥输入框可切换显示明文
    - 项目栏更简洁：项目行、worktree 子项和分组行悬停时不再显示多余的「···」按钮，相应操作仍在右键菜单里；worktree 分支的容器底色和边框更淡，外置主题包下也不再像整块被选中
    - 手机端重连不丢上下文：断线重连期间停在原页面而不是跳回连接页，已加载的更早消息保留；指令发出后 15 秒没回执显示「结果未知」，不会自动重发
      - 需要同时重新部署中转服务端（cd relay-server && docker compose up -d --build），手机端页面随中转一起更新
    修复
    - Markdown 预览：文首的 YAML / TOML frontmatter（如 SKILL.md 的头部）被渲染成分隔线加二级标题，现在显示成代码块，目录栏也不再收它
    - 文件树：速搜跳到屏外的命中行时，紧接着敲的字会丢
    - 命令库：用键盘上下选择超过一屏时，列表不跟着滚动
    - 标题栏：暗色主题下「等你处理」灯与「工作中」颜色太接近，改为橙色
    - 手机端：列表没滚到顶时也会触发下拉刷新；iOS 上点指令输入框和历史搜索框会自动放大页面
      - 需要同时重新部署中转服务端（cd relay-server && docker compose up -d --build），手机端页面随中转一起更新
    - 项目栏：内置浅色 / 深色主题下，带 Git 分支的项目展开后背后是一整块不随主题变化的深色区域，浅色模式下分支名几乎看不清（#108）
    - 用量面板：内置主题下 Top 会话行悬停时背景过深
    安全性
    - 文件预览：Markdown / 网页预览里的外部链接只放行 mailto: / tel: 且打开前会确认；HTML 预览读取文件时按真实路径复核类型，防止经符号链接绕过
    - AI hook 服务只接受本机回环请求，拒绝浏览器跨站请求
    - 中转服务端增加心跳与空闲超时，及时断开失联的手机 / 桌面连接
    - 升级依赖，清零 Cargo audit 报告的已知漏洞
