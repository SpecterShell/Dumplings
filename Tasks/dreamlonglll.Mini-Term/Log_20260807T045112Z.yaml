  Key: ReleaseNotes
  Value: |-
    状态一览升级：托盘菜单列全量 AI 项目 + 标题栏项目切换器
    ✨ 新功能
    - 托盘右键菜单列出所有进入 AI 会话的项目 — 不再只列「有动静」的：新增第四档 ⚪ AI 空闲（agent 已进入但待命），排序 待确认 > 处理中 > 已完成 > 空闲，条数上限沿用设置里的「最多显示项目数」；托盘灯与 tooltip 口径不变，空闲项目只进菜单不点灯
    - 标题栏新增当前项目切换器 — 版本号右侧以竖线隔开的胶囊按钮，常显当前项目名与它自己的 AI 状态色点（无 AI 会话时压暗）；下拉列出进入 AI 会话的项目及状态，点击即切换并定位到该项目内最该处理的分屏（与托盘菜单同一套落点），全都安静时只切换项目
    - 全局状态灯移位 — 从最小化键左侧挪到项目切换器右边，全局态与当前项目态同处看齐；点击行为不变，右侧从此只剩窗口控制三键
    🔧 内部
    - 「进入 AI 会话的项目」聚合抽成 collectAiProjects 供托盘与标题栏共用；「已完成」判据集合由调用方注入——托盘用未读完成（随窗口聚焦清除），标题栏用完成队列（与全局状态灯同一套语义）
