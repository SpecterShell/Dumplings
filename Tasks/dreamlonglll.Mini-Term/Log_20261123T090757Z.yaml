- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    更新内容
    新功能
    - 用量统计新增请求日志：统计面板趋势图下方分为「请求日志」和「排行概览」两个页签。请求日志按时间倒序逐条列出每次调用的时间、应用、供应商、模型、成本、新增输入、输出、缓存命中与缓存写入 token，最多展示最近 10,000 条；点某一行可查看它所属会话的正文
      - 「显示列」菜单可勾选要看的列，选择会保存下来；项目、缓存写入两列默认不显示
      - 缓存命中率列：缓存命中 ÷（新增输入 + 缓存命中 + 缓存写入），保留两位小数，悬停可看具体 token 数
      - 速度列按本地会话日志的时间戳估算（含等待首字的时间），输出不少于 200 tokens 时才显示
    - 趋势图可点击下钻：多日视图里点某一天的柱子，进入当天按小时的视图，顶部指标、趋势图和下方明细一起切到那一天；在按小时的视图（下钻后、「今天」、同一天内的自定义范围）里点某个小时，下方的请求日志与排行概览只显示这一小时，再点一次取消
      - 趋势图标题右侧的路径可逐级返回，再点一次当前选中的时间范围直接回到总览
    - Antigravity CLI 等你处理的提示：agy 弹出权限确认或向你提问时，终端页签亮起「等你处理」标记，回答后恢复；未开启 hook、WSL 和 SSH 远程终端里同样生效
    体验
    - AI 会话中不再显示右键「SSH 连接」：终端里正在运行 AI 会话时，右键菜单隐藏「SSH 连接」，避免误操作；退出 AI 回到普通命令行后恢复。通过右键连上服务器后，即使在服务器上启动了 AI，「断开 SSH」仍会保留
    修复
    - 用量统计：Antigravity CLI 使用 xhigh 思考档位的 Gemini 模型时，成本没有按该模型的价格计算
