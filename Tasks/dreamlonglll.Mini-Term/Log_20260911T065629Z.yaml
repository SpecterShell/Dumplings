Locale:
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    更新内容
    新功能
    - Claude Code 终端里粘图，直接交给 Claude — 终端里正跑着 Claude Code 时，剪贴板里有截图按 Ctrl+V（Ctrl+Shift+V / 右键粘贴同样）不再存成临时 PNG 再粘一条本机路径，而是发 Alt+V 让 Claude 自己从剪贴板取图：输入框直接出现 [Image #N]，模型看到的是图本身而不是路径。Claude 退出后、或在 SSH 远程项目里（远端读的是远端剪贴板）仍走原来的落盘 / 上传路线。
    - 智能 Ctrl+C/V 默认开启 — 有选区时 Ctrl+C 复制、无选区时中断程序，Ctrl+V 直接粘贴。新安装默认生效；已有配置保持你之前的选择，可在「设置 → 终端」里切换。
    修复
    - 125% / 150% 显示缩放下，页签名、分支徽章等截断文本明明放得下也会把末字换成省略号——现在测量宽度先取整到设备像素，并给「放得下」判定留一个像素的容差。
    下载

    | 平台                | 文件                                                                                   |
    | ------------------- | -------------------------------------------------------------------------------------- |
    | Windows x64         | Mini-Term_1.2.10_x64-setup.exe                                                         |
    | macOS Apple Silicon | Mini-Term_1.2.10_aarch64.dmg（首次打开前先执行 xattr -cr /Applications/Mini-Term.app） |
    | macOS Intel         | Mini-Term_1.2.10_x64.dmg（同样需要 xattr -cr /Applications/Mini-Term.app）             |
    | Linux x64           | Mini-Term_1.2.10_amd64.deb / Mini-Term_1.2.10_amd64.tar.gz                             |

    Windows 是主要支持平台；macOS / Linux 构建可用但未经真机验证。
    完整变更：https://github.com/dreamlonglll/mini-term/compare/v1.2.9...v1.2.10
