  Key: ReleaseNotes
  Value: |-
    更新内容
    新功能
    - 文件编辑器补齐主流语言的语法高亮：C# / Swift / CMake / Proto / GraphQL 此前只有解析器没有配色，打开 .cs 整篇纯文本，现已正常上色；新增 PHP、Kotlin、Lua、PowerShell、XML（csproj / xaml / plist / svg 等）、Dart、Groovy（build.gradle / Jenkinsfile）、INI（.ini / .cfg / .conf / .editorconfig / .gitconfig / .properties）、批处理（.bat / .cmd）。vue / razor / scss 这类没有专属语法的文件退到最接近的语言上色，不再是纯文本。只收主流类型，安装包约增大 0.5 MB。
    - 安装器可选桌面快捷方式：安装向导新增组件页，桌面快捷方式改为自行勾选；升级时沿用上一次的选择（旧版没装桌面图标就默认不勾），开始菜单快捷方式照常创建。
