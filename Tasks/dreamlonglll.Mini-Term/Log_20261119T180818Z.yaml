Locale:
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    更新内容
    新功能
    - 支持 Antigravity CLI（agy）：在设置的「AI Hook 事件」里勾选 Antigravity CLI 注册即可接入（只增删 ~/.gemini/config/hooks.json 里 mini-term 这一组，别家的组不动），状态灯、完成通知与 Claude Code 一致；子代理收尾较晚时也会等它做完再报完成。会话面板能查看、续接 agy 历史会话，重启后自动用 agy --conversation 续回；用量统计、移动端对话镜像同步支持。不开 hook 时按输入检测降级识别。暂不支持删除 agy 会话，也没有等待批准的黄灯
    - oh-my-pi 桌面会话历史：会话面板直接列出当前项目的 oh-my-pi 会话，不开 hook 也能看；按记录里保存的当前分支显示正文，右键可续接或复制 omp --resume 命令
    - 自定义快捷键：「设置 → 快捷键」里点键帽就能录制新组合，也可以解绑、恢复默认。与已有快捷键冲突时会提示并可直接替换，改完立即生效。菜单和提示里显示的键位会跟着你的设置变
    - 重新打开刚关掉的终端和文件：按 Ctrl+Shift+Z，或在页签右键、「+」菜单里选，刚关掉的终端会按原来的 shell 和目录回到原位置；停在文件页签时则重新打开刚关掉的文件，连续按可按顺序找回一批，行号也会还原
    - 终端退出后一键重新启动：本地终端退出或没能启动时，原地显示「重新启动 / 关闭」和退出码，按 Enter 即可重启
    - SSH 连接「测试连接」：在连接表单里直接试连，不用先保存，结果就地显示用了哪种认证方式，失败时逐项说明原因。保存时会指出漏填的项和填错的端口
    - 更新提示显示发布说明：点侧栏的更新提示会弹出这一版的发布说明，可选择「忽略此版本」
    - 文件树键盘操作：F2 重命名、Delete 删除，方向键与 Home / End 移动；文件树会高亮当前打开的文件，页签右键可「在文件树中定位」，树顶部有「全部折叠」
    - AI 历史面板可搜索：顶部新增过滤框，按标题和 AI 工具筛选；平铺列表单击一条即可查看
    体验
    - 长文本粘贴默认只在 AI 会话里转成文件：普通 shell 里粘贴长文本会直接粘原文，粘进去的脚本能直接运行。想恢复以前所有终端都转存的行为，到「设置 → 终端 → 复制粘贴」关掉「只在 AI 会话里转存」
    - 本地文件删除改为移到回收站，误删可以找回。WSL、网络盘这类进不了回收站的位置会先问你是否永久删除；SSH 远程项目仍是直接删除
    - 改名、移动、删除文件后，已打开的页签跟着更新，未保存的内容和光标位置都保留
    - 键盘可以完成更多操作：Shift+PageUp/PageDown 翻看历史输出，Ctrl+= / Ctrl+- / Ctrl+0 或 Ctrl+滚轮 调字号；页签的关闭、最大化、移动和分屏比例调整都有了快捷键（可在「设置 → 快捷键」查看）；全局搜索结果可以用方向键选择、回车打开
    - 终端选区更好用：Shift+单击 扩大选区，Alt+拖动 选一块矩形区域，拖到上下边缘会自动滚动
    - 右键菜单更全：终端右键新增复制链接、清除缓冲、将缓冲保存为文件；页签右键新增复制此终端、关闭其他、关闭右侧终端，中键点页签可直接关闭
    - 项目切换器按最近使用排序：打开后直接回车即可回到上一个项目
    - 未保存文件关闭时三选一：「保存并关闭 / 不保存 / 取消」
    - macOS 默认快捷键改用 ⌘：应用级操作（新建终端、分屏、搜索等）默认改为 ⌘ 组合；Ctrl+Tab 等会和系统冲突的组合保持不变。习惯旧键位的话，可以在「设置 → 快捷键」改回
    修复
    - 关闭正在输入的终端后，键盘焦点会交给旁边的终端，快捷键不再失灵；焦点不在终端上时，新建、分屏、关闭会作用于你上次操作的那一组，而不是最左边那组
    - 没有相邻分屏时，Alt+方向键 交还给终端，shell 里按词移动光标恢复正常
    - 终端查找框首次打开时，选中的文本能正确预填并全选
    - 双击终端页签改名、或双击切换到另一个页签后，接着输入的内容进不了终端、要先点一下的问题
