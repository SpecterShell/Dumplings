  Value: |-
    更新内容
    修复
    - 修复 Codex 会话退出后标签状态残留的问题：此前 Codex 的 hook 注册漏了 SessionEnd 事件，退出 Codex 后标签页与项目列表上的状态灯会一直停在 ai-idle，只能等下次启动 AI 会话才自愈。现在退出即回落 idle，并补了注册契约测试防止退出事件再次遗漏
      - 已启用过 hook 的用户请到设置里重新注册一次 Hook（合并写入，不会覆盖你已有的 hook 配置），新的 SessionEnd 条目才会落到 Codex 配置里
