  Key: ReleaseNotes
  Value: |-
    更新内容
    这一版把注意力从「加功能」转回「用得顺手」：快捷键成体系、10 万行 scrollback 终于能搜、11 个弹窗的 Esc 行为归一。另外两件事值得单独说——远程终端里粘图片终于能被远端的 agent 读到，以及 Claude Code 这类 TUI 在终端里累积重复内容的老毛病修掉了。
    新功能
    - 全局快捷键体系 — 新建 / 关闭 / 切换终端、分屏、分屏间移焦、项目快速切换器、折叠侧栏全部有键位。键位表是唯一事实来源，同时驱动实际派发、设置页展示与界面提示，不会出现「设置页写着一个键、实际是另一个」。统一走 Ctrl+Shift+* 以避开 shell 的行编辑按键。
    - 终端内查找（Ctrl+F） — 10 万行 scrollback 从只能手滚变为可检索，支持大小写 / 全词 / 正则与命中计数。
    - 远程 SSH / WSL 粘贴自动落地（#36）— 粘贴图片和超长文本原本是「转存成本机文件、再粘路径」，这套逻辑在远程终端里是断的：粘进去的 C:\... 远端根本不存在，远端 agent 只会报文件不存在。现在会自动换算落点：
      - SSH 远程项目 — 经 SFTP 上传到远端后粘贴远端路径。默认落 <项目根>/.mini-term/pasted，选在项目内是因为 agent 对项目目录天然有读权限，不像 /tmp 那样会触发 Claude Code 的项目外路径确认；目录可在设置里改成 /tmp/mini-term、~/uploads 等。
      - WSL 项目 — 把 C:\... 换算成 /mnt/c/...，不用上传（文件本身经 automount 就能读到，缺的只是路径形式）。
      - 上传目录会自动写入一个自忽略的 .gitignore，粘图不再弄脏你仓库的 git status。
    - 首启引导 / Sessions 直接 resume / 抽屉内面板切换 — 首次启动给一条上手路径；会话列表可直接续接而不必手动复制命令。
    体验改进
    - 弹窗行为统一 — 新增共享 overlay 栈接管 Esc / 遮罩关闭、焦点陷阱与焦点还原，11 个弹窗规则归一；命令式弹窗与右键菜单纳入同一栈，Esc 只作用于最上层。
    - 关窗确认改为条件触发 — 只在真有活终端时才问，并列出将被终止的 AI 会话；没有终端时不再多问一句。
    - 无障碍 — 状态点改为形状 + 颜色双编码（不再只靠颜色区分），新增 :focus-visible 焦点环，项目列表 / 文件树 / 右键菜单支持键盘操作。
    - 字号随「界面字体大小」缩放 — 此前写死 px 的地方不跟随设置，两套皮肤 CSS 一并修正。
    - i18n 补齐漏网文案 — 面板标题、Git 面板、分屏 tooltip、状态枚举名等。
    问题修复
    - AI 终端 scrollback 累积重复内容 — 此前把 TUI 摁在主缓冲区，Ink 类 TUI（Claude Code）界面比窗口高时，相对光标上移够不到已滚入 scrollback 的帧首，每帧都留下擦不掉的残留，滚轮转发给 TUI 触发额外重绘后尤其明显。现在放行 alternate screen 切换，让 TUI 回到备用缓冲区原地重绘。
    - 设置图标画错了 — 原先是「中心小圆 + 8 条放射短线」，那是太阳 / 星芒的画法；改为闭合的 6 齿轮廓 + 轴孔（齿数取 6 是因为图标实际只有 18px，齿少才咬得出形状）。
    - AI 运行中的状态点纹丝不动 — 形状是 spinner 却不转，看上去像卡死的加载指示器。顺带修了 prefers-reduced-motion 一刀切把它也停掉的问题：进行中指示器传达的是状态本身而非装饰，改为放慢到 2.4s 继续循环；闪烁类动效仍照常停用。
    - 终端标签宽窄不一 — 状态点 + 标题 + 关闭按钮作为一组居中，左右 padding 对称并给出最小宽度。
    - 快捷键漏进 PTY、右键菜单抢焦点、分屏竞态下产生孤儿 PTY 等审查发现的缺陷。
    内部变更
    - 删除项目级 tab 死状态层 — ProjectState 由 tabs[] 收敛为单棵 layout 树（界面上从来没有那层的切换入口）。旧配置的多 tab 布局在迁移时把 pane 合并进保留树而非丢弃，不会丢你的终端。
    - 一并删除无人消费的 togglePanel 与四个 *Visible 字段（含 Rust 侧）。
    已知限制
    - 图片粘贴仍只在 Windows 可用（read_clipboard_image 只有 Windows 实现），macOS / Linux 下远程粘图会回退到 Alt+V 而对远端无效。长文本转存与 WSL 路径换算不受此限。
    - 远端上传目录不会自动清理（本机临时文件有 24 小时清理）。
