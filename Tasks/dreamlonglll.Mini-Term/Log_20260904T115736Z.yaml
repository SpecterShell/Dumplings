  Key: ReleaseNotes
  Value: |-
    更新内容
    体验
    - Git 仓库下拉区分同名仓库 — 仓库名取的是目录叶子名，monorepo 里 services/api、legacy/api 这类布局会排出一串一模一样的「api」，光看名字分不出是哪一个。现在下拉每条在名字下补一行弱化的父级路径（同名必然父目录不同，一定分得开），只有一层的仓库不加这行、不平白多出噪音；仓库栏里选中的那个同样带弱化的父级前缀，完整路径挂在 tooltip 上
    - 仓库列表顺序稳定 — 仓库发现结果按路径排序，不再跟着文件系统的枚举顺序漂移，同名仓库也按父目录挨在一起便于对比
    - 标题栏移除全局 AI 状态灯 — 项目切换胶囊右侧那颗灯撤掉了：胶囊自己左侧那颗点已经表达了当前项目的档位，并排两颗色点反而要人分辨谁是谁。「跳到下一个该我处理的会话」没丢——托盘图标左键做的是同一件事，胶囊下拉里逐项也各自跳自己那个项目
    下载

    | 平台                  | 文件                                                                                   |
    | --------------------- | -------------------------------------------------------------------------------------- |
    | Windows x64           | Mini-Term_1.2.6_x64-setup.exe                                                          |
    | macOS (Apple Silicon) | Mini-Term_1.2.6_aarch64.dmg（首次运行如被拦截：xattr -cr /Applications/Mini-Term.app） |
    | Linux                 | Mini-Term_1.2.6_amd64.deb / Mini-Term_1.2.6_amd64.tar.gz                               |

