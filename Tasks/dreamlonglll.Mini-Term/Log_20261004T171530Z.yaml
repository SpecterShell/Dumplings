- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    更新内容
    新功能
    - 状态灯第五态「等你处理」:AI 停下来等你批权限、填表单，或这一轮因 API 错误中断时，状态灯显示为实心圆加叹号(深色主题橙色、浅色主题暗金色),静止不闪。此前 Claude 等授权时显示成「已完成」的绿勾、Codex 显示成「运行中」的转圈，看不出是在等你。页签、折叠标题条、悬停预览、项目行、项目切换器、面板切换条、边栏全局徽标与会话列表都按这一档显示。
    - 页签绿点改为「做完了还没看」:AI 在你没看着的页签里做完后，关闭按钮的位置留一颗绿点，切到该页签才消失；切回窗口不再一次性清空。绿点与关闭按钮共用一个位置(鼠标移上去变回 ×),不会挤动其它页签。
    - 使用统计自定义范围精确到时分秒：起止框可填 2026-10-02、2026-10-02 14:30 或 2026-10-02 14:30:15;只填日期时与以前一致(起点当天 0 点、截止当天 23:59:59)。用日历换日期会保留已填的时间；起止在同一天时趋势图按小时显示。
    - SSH 连接一键复制：连接卡片新增「复制」,副本命名为「原名 (N)」并排在原连接后面，主机、端口、用户、私钥、分组和已保存的密码都会带过去。
    - 「关联 SSH」支持整组关联：勾选分组前的方框即可关联整组，之后加入该组的连接自动生效、移出的自动取消；分组改名关联不变，解散或并入其他组后原来的连接逐条保留关联。
    修复
    - macOS 界面文字全部不显示(#82):自 v1.13.6 起，macOS 包打开后菜单、按钮、设置项、终端内容等文字都不绘制，只剩图标和边框。原因是构建时漏开了字体渲染组件，Apple Silicon 与 Intel 包都受影响；Windows 与 Linux 不受影响。
    - 终端进程退出或没能启动(shell 路径失效、远程连接预检失败等)时，红叉一直保留在页签与项目行上，不会过几秒被改回空闲或完成；SSH 远程终端断线也不再误报一次「AI 完成」。
    - 未启用 Hook(默认即未启用)或在 WSL / SSH 里跑 AI 时，AI 空闲期的零星界面刷新、启动时的欢迎画面、被 Esc / Ctrl+C 打断的回合都不再误报「任务完成」。
    - 拒绝 Claude 的权限请求、这一轮随即结束时，完成提醒照常触发；Claude 完成约一分钟后的闲置提醒不再把会话从「跳到下一个待处理会话」里撤掉。
    - 同一项目里有异常退出的终端时，边栏全局徽标不再盖住另一个正在跑的 AI;AI 会话结束或断线重连后，页签副标题不再残留旧标题。
    - 背景图皮肤下，命令库、AI 完成通知、书签列表等浮层不再半透明透出底下的终端文字。
    性能
    - Claude Code 工作时每秒约 4 次改写窗口标题，这些变化在页签上本就不显示，此前却每次触发整窗重绘(窗口在后台也照样重绘),现在只记录不重绘。
