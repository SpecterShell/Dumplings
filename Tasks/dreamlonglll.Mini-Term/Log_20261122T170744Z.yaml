Locale:
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    更新内容
    新功能
    - 终端里的 SSH 改用内置客户端：终端右键「SSH 连接」不再往本地 shell 里敲 ssh 命令，而是由内置 SSH 客户端直接接管当前终端；本地 shell 原样挂起，断开后像退出全屏程序那样还原连接前的屏幕，远端内容留在回看里
      - 首见主机密钥（yes / no / 指纹）、密码、动态口令（OTP）、私钥口令都在终端里询问并等你输入，输入不回显，也不会进入 AI 识别与手机端镜像；已存密码先自动使用，错了才问
      - 连接中按 Ctrl+C 取消；接管期间右键菜单多出「断开 SSH」；连接失败、取消或断线时终端里写明原因并弹出提示
      - 在新终端里连接时，会等本地提示符出来后再接管
      - SSH 远程项目的终端同样改用内置客户端，失败、取消或断线时出现重连遮罩
      - 内置客户端只按连接里填写的内容建连，不读取 ~/.ssh/config、不使用默认私钥；需要 ~/.ssh/config、ProxyJump 跳板或默认私钥的连接，在连接编辑表单里勾选「终端使用系统 OpenSSH 客户端」即可回到原来的方式
    - 显示终端已连接 SSH：通过右键「SSH 连接」连上服务器后，终端页签、项目列表和顶栏项目切换处会出现「SSH 已连接」标记，点击可直达该终端
    体验
    - 终端渲染更省资源：终端重绘与后台标签页的刷新开销降低，切回后台标签页时内容立即补齐；界面布局改为后台保存，拖动分隔条等操作不再卡顿
    - 手机端长对话更流畅：对话镜像与历史列表在消息很多时滚动更顺
      - 需要同时重新部署中转服务端（cd relay-server && docker compose up -d --build），手机端页面随中转一起更新
    修复
    - 终端：表格单元格里折行显示的文件路径无法按 Ctrl 点击打开
    安全性
    - 使用私钥连接 SSH 时生成的临时私钥副本，权限改为完全覆盖为仅当前用户可访问，不再残留从父目录继承来的其他用户权限（Windows）；macOS / Linux 上副本放在按用户隔离的私有目录里
    - AI 状态上报服务增加并发上限与超时，异常的慢连接不会再占满它
