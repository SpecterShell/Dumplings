  Key: ReleaseNotes
  Value: |-
    更新内容
    新功能
    - 全局命令库（#81）— 终端控制条新增「命令」钮（与查找、分屏同排），或按 Ctrl+Shift+K 弹出命令库浮层：常用命令按分组保存，与项目 / SSH 连接无关，哪个终端里都是同一份
      - 搜索框按名称与命令文本过滤，↑ / ↓ 选、↵ 直接在当前终端运行；Ctrl+↵ 或 Ctrl+点击 只把命令敲进终端不回车，先改参数再跑
      - 行尾悬停出复制 / 编辑 / 删除，删除在行内二次确认；分组标题可折叠，支持新增到组、重命名、解散（命令回落未分组），底部「新增命令」「新建分组」
      - 运行走与手敲同一条链路，终端里的 AI 输入检测照常生效；命令库存在全局配置里，不随项目走
    - SSH 连接面板拖拽排序 — 「SSH」管理弹窗右栏的连接卡片可以上下拖着换位：拖到另一条的上 / 下半即插到它前 / 后（2px 指示线提示落点），拖到别的分组的卡片上顺带换组；顺序随配置保存，左栏分组先后不受影响，拖到一半按 Esc 取消
    修复
    - Markdown 预览里的 Mermaid 流程图按 mermaid.js 口径排版 — 三处与 mermaid.js 不一致的地方已对齐：节点标签里的 HTML 实体（<、#quot; 等）解码后再画；子图有节点连到外面时忽略自己的 direction、跟父图方向走；只靠虚线挂着的节点也参与分层，不再被扔到最左
    - 弹窗里的右键菜单不再被弹窗盖住 — SSH 表单的分组下拉、搜索弹窗里的右键菜单等此前在 v1.13.x 里画在弹窗底下看不见（悬停亮了、焦点也被收走、下一次 Esc 关的是那个看不见的菜单），现在正常浮在弹窗之上
