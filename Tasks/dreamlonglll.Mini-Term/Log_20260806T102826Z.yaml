  Key: ReleaseNotes
  Value: |-
    更新内容
    本版重排了设置弹框的信息架构。原来六个平铺分页里，「系统设置」一页塞了界面语言、状态栏三项、启动自动续接、主题、皮肤、终端跟随主题、外部编辑器共九组控件，找一个开关要滚半页。现在按主题归组，每页只剩一屏左右。
    体验
    - 设置侧栏改为两级菜单 — 分组 + 分页：终端（Shell / 复制粘贴）、外观（主题与语言 / 字体）、AI（完成通知 / Hook 事件）、系统（常规 / 外部编辑器），快捷键与关于留在顶级。界面语言与主题、皮肤、终端跟随主题一并收进「外观」
    - 三处过长分页拆开 — 「系统设置」散出去后只剩状态栏与启动两节；「回滚行数」此前错挂在「复制粘贴」小标题下，归入新的「终端行为」；「AI 完成通知」尾部整块 Hook 注册独立成页
    - 切页时标签文字不再横向抖一下 — 选中指示条改为始终占位、未选中透明，此前只有选中项才渲染那根竖条，切换时文字会左右跳
    兼容性
    - 分页 id 保留旧值（terminal / system / font / ai-notification），从别处直达某个设置分区的深链不因重排失效；所有开关的取值与行为一字未改，升级上来配置照旧
    下载

    | 平台    | 文件                                          | 说明                                                                     |
    | ------- | --------------------------------------------- | ------------------------------------------------------------------------ |
    | Windows | Mini-Term_0.10.5_x64-setup.exe / .msi         | 主要支持平台                                                             |
    | macOS   | Mini-Term_0.10.5_aarch64.dmg（Apple Silicon） | 首次打开如被 Gatekeeper 拦截，执行 xattr -cr /Applications/Mini-Term.app |
    | Linux   | Mini-Term_0.10.5_amd64.AppImage / .deb / .rpm | 实验性支持                                                               |

