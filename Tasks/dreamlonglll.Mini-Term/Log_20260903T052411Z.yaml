  Key: ReleaseNotes
  Value: |-
    更新内容
    修复
    - 文件预览里 Tab 缩进的文件不再整篇顶格（#74）—— Go、Makefile 这类用 Tab 缩进的文件，此前在文件预览与 Git Diff 面板里所有缩进都被画成零宽、整篇贴着左边，几乎没法读。现在 Tab 按制表位（4 列一档）展开显示，Git Diff 面板同口径展开。保存时按「展开行 → 原始行」逐字还原：没动过的行原样落盘，只有被你编辑过的行才把行首缩进折回 Tab，不会因为打开看一眼就产生全文件 diff。
    下载

    | 平台                  | 安装包                        |
    | --------------------- | ----------------------------- |
    | Windows x64           | Mini-Term_1.2.4_x64-setup.exe |
    | macOS (Apple Silicon) | Mini-Term_1.2.4_aarch64.dmg   |
    | Linux (deb)           | Mini-Term_1.2.4_amd64.deb     |
    | Linux (tar.gz)        | Mini-Term_1.2.4_amd64.tar.gz  |

    macOS 首次打开若提示「已损坏」，执行 xattr -cr /Applications/Mini-Term.app 后重试。
    完整变更：https://github.com/dreamlonglll/mini-term/compare/v1.2.3...v1.2.4
