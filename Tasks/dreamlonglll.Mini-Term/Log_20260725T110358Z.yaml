  Key: ReleaseNotes
  Value: |-
    更新内容
    本版主角是移动端 + 自托管中转：出门在外用手机看桌面上跑着的 AI，并直接给它发指令。桌面端只出不进（出站长连），不需要公网 IP、不需要内网穿透、不需要在路由器上开端口。
    新功能
    - 移动端体系上线 — 顶栏「移动端」面板一站式走完：填中转地址 → 保存并连接 → 生成配对二维码。手机相机扫码即打开 PWA 自动完成配对，配对码一次性有效（10 分钟），新设备配对自动顶替旧设备，「重置配对」立即吊销全部凭证。
    - 活跃 AI 会话列表 — 手机端按项目分组展示正在跑的 Claude / Codex 会话，状态灯与桌面端实时同步增删变色；桌面端离线时顶部横幅提示并置灰，恢复后自动消除。
    - 对话镜像（只读） — 点进任一会话实时查看对话内容，AI 回复 Markdown 渲染、桌面输入原文展示，滚动到顶自动分页加载更早消息。
    - 移动端指令 — 镜像页底部输入框把文本写穿到桌面对应终端，等价于本人在键盘上敲下并回车，带即时回执与明确失败原因；桌面端离线时中转直接拒绝，不做存储转发。
    - 中转服务开箱即部署 — 自带三阶段 Dockerfile 与 compose 示例，一条命令从源码构建启动；反代 + TLS 配置、环境变量表与运维注意见 部署文档。
    - PWA 体验 — 手机浏览器「添加到主屏幕」后以独立窗口运行，断线指数退避重连并自动恢复订阅，内置与桌面端同模式的中英双语。
    变更
    - 移除 cc-connect 集成 — 删除后端模块与全部 10 个相关命令，连接弹窗、Dashboard 嵌入、顶栏「连接」入口一并移除；带该字段的旧配置静默加载并在下次保存时自动清除，无需手工处理。移除原因与替代方案见仓库内 ADR 0001。
    修复
    - 对话镜像新会话不再错绑上一次会话的记录：镜像以 pane 内 AI 会话启动时刻为下限过滤，新会话首条消息落盘前给空镜像而不是展示旧内容。
    - 同项目并行开多个 AI pane 不再互相串台：镜像绑定改为经 Hook 会话身份精确到具体会话，/clear 换会话自动跟进；未启用 Hook 时退回原启发式，行为不劣化。
    体验
    - 「移动端」的连接配置与配对配置合并到同一个面板，不必再先去设置中心配地址再回来配对；设置中心的「移动端」页随之移除。
    - 「移动端」面板点击遮罩不再关闭，避免输入中转地址时误点外侧丢掉未保存内容。
    安全性
    - 中转服务器只做转发，不存储任何消息体，日志仅记录元数据；有子进程级自动化测试断言全流程零文件残留。
    - Hook 上报的 session_id 做字符白名单校验，防止经 hook 端口构造路径穿越。
    下载

    | 平台                  | 产物                                                                                      |
    | --------------------- | ----------------------------------------------------------------------------------------- |
    | Windows               | Mini-Term_0.7.0_x64-setup.exe（推荐）· Mini-Term_0.7.0_x64_en-US.msi                      |
    | macOS (Apple Silicon) | Mini-Term_0.7.0_aarch64.dmg · Mini-Term_aarch64.app.tar.gz                                |
    | Linux                 | Mini-Term_0.7.0_amd64.AppImage · Mini-Term_0.7.0_amd64.deb · Mini-Term-0.7.0-1.x86_64.rpm |

    macOS 提示：产物未经 Apple Developer ID 签名，双击可能提示「已损坏，移到废纸篓」。把 .app 拖入 /Applications 后执行一次 xattr -cr /Applications/Mini-Term.app 即可正常启动，每次升级后需重新执行。
    平台支持：Windows 为主要支持平台，macOS / Linux 代码层面已支持但未经充分打磨。
