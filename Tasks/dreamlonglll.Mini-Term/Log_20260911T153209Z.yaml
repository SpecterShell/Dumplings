    更新内容
    修复
    - 分组右键「添加项目」后新项目看不见、重启后才出现，且可能顶掉一个旧项目：项目 / 分组 / SSH 连接 / AI 启动器的 id 此前只靠进程内计数生成，恢复布局后计数几乎固定，启动后不久添加的项目会与库里既有项目撞号——新项目在列表上不显示，落盘时旧项目的那一行被新项目覆盖。现在 id 带毫秒时间戳并对既有数据去重；启动时顺带清理撞号留下的树内重复项。已中招的用户升级后无需手动处理，但被顶掉的旧项目需要重新添加一次。
