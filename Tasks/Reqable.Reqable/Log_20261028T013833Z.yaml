    💪【优化】URLEncoded 请求体默认讲将`+`号解码为空格。
    💪【优化】调整设置界面中选项分类和顺序。
    💪【优化】MCP 支持 HTTP 模式。
    💪【优化】支持保存多个 CA 证书，方便切换和管理。
