  Key: ReleaseNotes
  Value: |-
    🎙️ AI Voice-Over – Major Upgrade
    ✅ NEW: Create video file with built-in AI Voice-Over track
    You can now export a new video file with an additional AI voice track.
    - Original audio is preserved
    - AI Voice-Over is added as a separate audio track
    - Output format: MKV
    - Compatible with Smart TV, Android TV, consoles, phones and other players
    - No need to use ALLPlayer for playback
    This is a major step forward – AI Voice-Over is no longer limited to playback inside ALLPlayer.

    ✅ NEW: Use your own voice (WAV up to 10 seconds)
    You can now generate full AI narration using your own recorded voice sample.
    - Upload WAV file (max 10 seconds)
    - AI analyzes tone and voice characteristics
    - Generate full movie narration in your voice
    - Works even in languages you don’t speak
    Perfect for creators, brands and multilingual content.

    ✅ NEW: Local subtitle support (SRT only)
    - Subtitles no longer need to be downloaded from the Internet
    - You can create and use your own local SRT files
    - Full control over multilingual subtitle preparation

    🌍 Multilingual production workflow
    - Generate AI Voice-Over in multiple languages
    - Create multiple language versions of one movie
    - Ideal for YouTube creators, courses and global distribution
    Supported languages include:
    Polish, English, German, French, Spanish, Italian, Ukrainian, Russian, Czech, Slovak, Hungarian, Dutch, Swedish, Norwegian, Finnish, Portuguese, Japanese, Chinese, Korean, Turkish.

    🔊 AI Voice-Over Improvements
    🔧 Improved pronunciation of English words
    Enhanced voice processing significantly improves the natural pronunciation of English words inside subtitles.
    Result:
    - more natural speech flow
    - better handling of mixed-language content
    - improved clarity

    🔧 AI Voice-Over now ignores subtitle control tags
    The AI no longer reads formatting/control tags such as:
    - /an8
    - /style
    - and other subtitle styling commands
    Result:
    - cleaner narration
    - no spoken technical markers
    - professional audio output

    🔧 Improved number reading
    Enhanced interpretation and pronunciation of:
    - integers
    - dates
    - years
    - larger numbers
    Numbers are now spoken more naturally and context-aware.

    🎛️ Voice Mixing Behavior (Important)
    When exporting a video with an additional AI voice track:
    - Selected voice volume level is permanently saved
    - Volume cannot be adjusted later via the AI Voice-Over slider
    - Make sure to set proper balance before exporting

    ⚙️ Technical
    - AI Voice-Over export format standardized to MKV
    - SRT is now the only supported subtitle format for AI generation
    - Stability and performance improvements
