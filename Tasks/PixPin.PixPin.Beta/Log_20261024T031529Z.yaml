- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    PixPin 3.6.5.1 新增文档识别功能，支持将图像识别为文档并导出为 PDF、Markdown、Word 等格式，重新设计了文本识别、公式识别、表格识别及翻译对话框，增加 CSV 和 TIFF 格式支持，改进了标注、贴图及截图操作，并修复了录制、登录及菜单显示等问题。
    新增功能
    -【文档识别】新增文档识别功能，可将图像识别为文档，支持导出为 PDF、Markdown、Word、LaTex，快捷键为 Shift+E。
    -【表格识别】保存格式增加 CSV。
    -【公式识别】支持调整字号大小。
    -【全局鼠标】增加公式识别操作。
    -【标注】折线增加波浪线样式。
    -【标注】文字标注支持波斯语、阿拉伯语等从右向左书写的语言。
    -【托盘菜单】增加「移动到分组」选项。
    -【保存】图片保存增加 TIFF 格式。
    设置调整
    -【标注】「配置」-「标注」增加「记住工具栏的工具选择」选项，默认不勾选。未勾选时，选择标注工具的二级菜单项后，下次重新标注时，该工具仍保留在二级菜单中。
    -【贴图】「配置」-「贴图」增加「调整贴图以确保显示」选项。
    -【窗口贴图】增加「隐藏原窗口」选项，默认不隐藏原窗口；浏览器被遮挡时也能正常刷新。
    -【元素检测】内边距支持输入负值，最小为 -50。
    -【截图】「配置」-「截图」中的「左键双击动作」和「中键单击动作」增加「关闭截图」选项。
    -【保存/复制】「保存图像质量」更名为「保存/复制图像质量」。
    体验与性能优化
    -【文本识别/公式识别/表格识别/翻译】重新设计对话框。
    -【贴图】按住 Ctrl 并使用鼠标左键选中其他贴图时，也会选中原焦点所在的贴图。
    -【截图】截图时的快捷键提示会自动避开鼠标。
    -【标注】水印标注的层级固定在最高，防止受到马赛克或橡皮擦的影响。
    -【长截图】调整内置快捷键。
    问题修复
    -【贴图】修复右键菜单中的部分选项在某些情况下超出屏幕的问题。
    -【录制】修复普通录制的内存泄漏问题。
    -【快速录制】修复正常导出后，重启电脑仍会弹出是否恢复录制提示的问题。
    -【快捷键】修复触发包含 CapsLock 的快捷键时会切换输入法大小写的问题。
    -【悬浮球】修复 macOS 下「截图时隐藏」不生效的问题。
    -【截图】修复 macOS 下自定义截图管理预设列表的显示问题。
    -【账号】修复部分设备自动退出登录的问题。
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    PixPin 3.6.5.1 adds a document recognition feature, allowing images to be recognized as documents and exported in formats such as PDF, Markdown, and Word. The text recognition, formula recognition, table recognition, and translation dialogs have been redesigned, with support for CSV and TIFF formats added. Improvements have been made to annotation, sticker, and screenshot operations, and issues related to recording, login, and menu display have been fixed.
    New Features
    - Document Recognition: A new document recognition feature has been added, which can recognize images as documents and export them as PDF, Markdown, Word, or LaTeX. The shortcut key is Shift+E.
    - Table Recognition: CSV format has been added to the save options.
    - Formula Recognition: Font size adjustment is now supported.
    - Global Cursor: Formula recognition operations have been added.
    - Annotation: The polyline tool now includes a wavy line style.
    - Annotation: Text annotations now support right-to-left languages such as Persian and Arabic.
    - Tray Menu: The "Move to Group" option has been added.
    - Save: TIFF format has been added to image saving options.
    Settings Adjustments
    - Annotation: In "Settings" > "Annotation," a new option "Remember Toolbar Tool Selection" has been added, which is unchecked by default. When unchecked, after selecting a secondary menu item for an annotation tool, that tool will remain in the secondary menu the next time you annotate.
    - Stickers: In "Settings" > "Stickers," a new option "Adjust Stickers to Ensure Visibility" has been added.
    - Window Sticking: A new option "Hide Original Window" has been added, which is unchecked by default; this allows browsers to refresh normally even when they are obscured.
    - Element Detection: Negative values are now allowed for padding, with a minimum of -50.
    - Screenshot: In "Settings" > "Screenshot," the options "Left-Click Double-Click Action" and "Middle-Click Action" now include "Close Screenshot."
    - Save/Copy: The setting "Image Quality for Saving" has been renamed to "Image Quality for Save/Copy."
    Experience and Performance Optimizations
    - Text/Formula/Table Recognition/Translation: Dialogs have been redesigned.
    - Stickers: When holding Ctrl and left-clicking to select other stickers, the sticker currently in focus will also be selected.
    - Screenshot: Shortcut hints during screenshots now automatically avoid the mouse cursor.
    - Annotation: Watermark annotations are always placed on the top layer, preventing them from being affected by mosaics or erasers.
    - Long Screenshot: Built-in shortcut keys have been adjusted.
    Bug Fixes
    - Stickers: Fixed an issue where some items in the right-click menu would sometimes extend beyond the screen.
    - Recording: Fixed a memory leak issue in regular recording mode.
    - Quick Recording: Fixed an issue where, after normal export, a prompt to resume recording would still appear after restarting the computer.
    - Shortcuts: Fixed an issue where triggering shortcuts containing CapsLock would switch the input method's case.
    - Floating Ball: Fixed an issue on macOS where the "Hide During Screenshot" setting did not take effect.
    - Screenshot: Fixed a display issue with the custom screenshot management preset list on macOS.
    - Account: Fixed an issue where some devices would automatically log out.
