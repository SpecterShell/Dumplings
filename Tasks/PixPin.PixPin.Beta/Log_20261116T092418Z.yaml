Locale:
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    功能变化
    -【保存】调整图像尺寸时支持使用最近截图尺寸和自定义预设，可新增、管理与自定义截图共用的预设。
    -【设置】托盘单击、双击和中键动作新增“截图并贴图”选项。
    优化
    -【保存】切换像素和百分比模式时保留精确尺寸，避免反复切换导致尺寸变化。
    -【文字识别、保存】调整设置入口位置，统一设置面板样式。
    -【文字识别】将“显示原始图片”选项移至设置菜单。
    问题修复
    -【截图】修复识别贴图窗口区域时可能卡死的问题。
    -【界面】修复 macOS 全屏状态下打开保存、识别等窗口时切换桌面的问题。
    会员相关
    -【文档识别】新增“显示原始图片”选项，支持隐藏原图并记忆选择。
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Feature changes
    -【Save】Use the last capture size or custom presets when resizing an image. Add and manage presets shared with custom screenshots.
    -【Settings】Added “Screenshot and pin” to the tray icon’s single-click, double-click, and middle-click actions.
    Improvements
    -【Save】Preserve exact dimensions when switching between pixels and percentages, preventing size changes after repeated switching.
    -【Text recognition, Save】Moved the settings entry and unified the settings panel style.
    -【Text recognition】Moved “Show original image” into the settings menu.
    Bug fixes
    -【Screenshot】Fixed a possible freeze when detecting a pin window’s capture region.
    -【Interface】Fixed desktop switching when opening save, recognition, and similar windows in macOS full-screen mode.
    Membership
    -【Document recognition】Added “Show original image,” with the option to hide the original and remember your choice.
