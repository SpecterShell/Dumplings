- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    3.5.0.8
    New Features
    - [Translation] The modern Save dialog now supports simultaneously displaying a side-by-side view of translated images and text, as well as the text translation results.
    - [Translation] Added display of the source language.
    - [Windows] Support for closing various PixPin windows using Ctrl+W.
    - [Annotation] When drawing polylines, you can use the Tab key to toggle arrowhead activation.
    - [Stickers] Support for playing animated GIFs and WebP images.
    - [Screenshot] Added a rule-of-thirds grid to the guide lines.
    - [Stickers] Alignment functionality now includes left and right alignment options.
    - [Screenshot] The standard screenshot toolbar has added an “Edit” button, which is hidden by default but can be manually moved to the main menu level.
    - [Keyboard and Mouse Recording] Added horizontal scrolling animations.
    - [Stickers] On macOS, stickers’ display area can be controlled via the desktop settings.
    Settings Adjustments
    - [Screenshot] In “Settings” → “Appearance,” added a “Selection Border Color” option.
    - [Hotkeys] Hotkey input now supports the Alt+PrtSc key combination.
    - [Annotation] In “Settings” → “Annotation,” added a “Restrict Annotation Content Within Selection” option.
    - [Stickers] In “Settings” → “Stickers,” added a “Keep Other Stickers Hidden When Creating New Stickers” option.
    - [Annotation] Supports changing the foreground color (numbers and borders) of numbered annotations, with a new “Sequence Number Foreground Color” setting added under “Settings” → “Annotation.”
    Experience and Performance Optimizations
    - [Table Recognition] When saving recognition results, the last-used folder location is remembered.
    - [Annotation] Optimized line-breaking logic for numbered annotation text.
    - [Annotation] When numbered annotations are resized, the surrounding operation buttons maintain a minimum spacing.
    - [Save] Variable descriptions now include a reminder about Windows filename restrictions.
    - [Auto‑Save] A prompt dialog now appears if saving fails.
    - [Text/Formula/Table Recognition] Recognition windows now remember the last‑selected always‑on‑top status.
    - [UI Detection] By default, on multi‑monitor setups, only the screen under the mouse cursor is monitored.
    - [Editing] Image scaling no longer applies smoothing.
    - [Save] Optimized the default position of the classic Save dialog.
    - [Annotation] Improved the display logic of rounded‑corner and other buttons when in annotation mode.
    - [Floating Ball] Enhanced the floating ball’s appearance when positioned at the border between two monitors.
    - [Export] With hardware acceleration enabled, MP4 export now leverages the GPU.
    - [Recording] Optimized performance when the mouse hovers over the camera button.
    Bug Fixes
    - [Global Mouse] Fixed an issue on macOS where the global mouse trigger was malfunctioning.
    - [Stickers] Resolved a problem where stickers that had been deselected from always‑on‑top status would revert to being pinned after resuming from a hidden state.
    - [Stickers] Fixed a bug where, after taking a screenshot in certain PixPin windows, the shortcut‑based sticker feature failed to activate.
    - [Annotation] Corrected display anomalies in some arrow styles.
    - [Formula Recognition] Fixed an issue where recognition results could not be opened in Word.
    - [Save] Fixed a bug on macOS where the classic Save dialog could not be moved.
