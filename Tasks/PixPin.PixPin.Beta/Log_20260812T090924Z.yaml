  Value: |-
    3.5.0.8
    新增功能
    -【翻译】现代保存对话框支持同时显示翻译图文对照和文本翻译结果。
    -【翻译】增加源语言显示。
    -【窗口】支持使用 Ctrl+W 关闭各类 PixPin 窗口。
    -【标注】绘制折线时支持使用 Tab 键切换是否启用箭头。
    -【贴图】支持播放 GIF 和 WebP 动图。
    -【截图】辅助线增加三分法网格。
    -【贴图】对齐功能增加左对齐和右对齐。
    -【截图】常规截图工具栏增加“编辑”按钮。该按钮默认隐藏，可手动调整至一级菜单。
    -【键鼠录制】增加横向滚动动画。
    -【贴图】macOS 支持按桌面控制贴图的显示范围。
    设置调整
    -【截图】「配置」-「外观」增加“选区边框颜色”设置。
    -【快捷键】快捷键录入支持 Alt+PrtSc 组合键。
    -【标注】「配置」-「标注」增加“将标注内容限制在选区内”设置。
    -【贴图】「配置」-「贴图」增加“新建贴图时保持其他贴图隐藏状态”设置。
    -【标注】支持修改序号标注的前景颜色（数字和边框），并在「配置」-「标注」中增加“序列号前景颜色”设置。
    体验与性能优化
    -【表格识别】保存识别结果时会记忆上次使用的文件夹位置。
    -【标注】优化序号标注文本的换行逻辑。
    -【标注】序号标注缩小时，周围的操作按钮会保持最小间距。
    -【保存】变量说明增加 Windows 文件名限制的提示。
    -【自动保存】保存失败时增加提示弹窗。
    -【文字识别/公式识别/表格识别】识别窗口会记忆上次选择的置顶状态。
    -【UI 检测】在桌面上默认仅检测鼠标所在的屏幕。
    -【编辑】图像缩放时不再进行平滑处理。
    -【保存】优化经典保存对话框的默认显示位置。
    -【标注】优化圆角等按钮在标注状态下的显示逻辑。
    -【悬浮球】优化悬浮球位于两个显示器交界处时的显示效果。
    -【导出】开启硬件加速后，MP4 导出过程支持调用 GPU。
    -【录制】优化鼠标经过摄像头按钮时的性能表现。
    问题修复
    -【全局鼠标】修复 macOS 上全局鼠标触发方式异常的问题。
    -【贴图】修复已取消置顶的贴图从隐藏状态恢复显示后重新置顶的问题。
    -【贴图】修复在某些 PixPin 窗口无法截图后，使用快捷键贴图未生效的问题。
    -【标注】修复部分箭头样式显示异常的问题。
    -【公式识别】修复识别结果无法使用 Word 打开的问题。
    -【保存】修复 macOS 上经典保存对话框无法移动的问题。
