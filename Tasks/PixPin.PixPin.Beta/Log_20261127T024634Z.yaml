- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    功能变化
    -【拼图】新增拼图窗口，可从托盘菜单或桌面悬浮球打开。支持导入本地图片、粘贴剪贴板图片，也可直接添加截图和贴图。
    -【拼图】支持横向、纵向和自由拼接。可拖动图片调整顺序，自由模式下还可移动、缩放、对齐图片和调整图层顺序。
    -【拼图】支持自定义画布宽高、图片间距、外边距和背景，可为每两张相邻图片单独设置间距。
    -【文字识别】新增段落排版切换快捷键（Ctrl+L / ⌘L），可在智能分段、合并换行和保留换行之间循环切换。
    -【设置】快捷键预设新增“截取上次区域并快速保存”。
    优化
    -【标注】实心圆形和实心方形序号支持自定义数字颜色，也可使用自动配色。
    -【保存】保存窗口会记住窗口置顶状态，较长的文件名可自动换行显示。
    问题修复
    -【截图】修复自定义截图窗口打开时焦点未落在“开始”按钮上的问题。
    -【贴图】修复批量恢复后多张贴图可能显示相同内容，以及关闭或销毁确认窗口可能被其他贴图遮挡的问题。
    -【贴图】修复快捷键预设窗口打开时，无法用贴图快捷键将截图选区贴到屏幕上的问题。
    -【标注】修复放大镜取样后放大区域消失，以及文字标注悬停时边框缺失、字符抖动的问题。
    -【标注】修复编辑历史截图里的文字标注时，按回车可能异常拉长文本框的问题。
    -【录屏】修复回放时原本静止的鼠标指针可能漂移的问题。
    -【复制】修复 Windows 上复制图片后无法粘贴到 Word 和 Excel 的问题。
    -【界面】修复 macOS 打开设置或截图时可能崩溃的问题。
    会员相关
    -【公式识别】修复部分 LaTeX 公式转换为 Typst 时语法错误的问题。
    -【表格识别】修复小数末尾的 0 显示不全的问题。
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Feature changes
    -【Image stitching】Open the new stitching window from the tray menu or desktop floating ball. Import local files, paste images from the clipboard, or add screenshots and pins directly.
    -【Image stitching】Stitch images vertically, horizontally, or in a free layout. Drag to reorder them. In free mode you can also move, resize, and align images and change their stacking order.
    -【Image stitching】Set the canvas width and height, spacing, margins, and background. Adjust each gap between neighboring images individually.
    -【Text recognition】Use Ctrl+L / ⌘L to cycle between smart paragraphs, merging line breaks, and keeping line breaks.
    -【Settings】Added the “Screenshot last area and quick save” shortcut preset.
    Improvements
    -【Annotation】Set a custom digit color or use automatic coloring for solid circular and square number markers.
    -【Save】The save window remembers whether it was set to stay on top. Long filenames wrap onto additional lines automatically.
    Bug fixes
    -【Screenshot】Fixed the custom screenshot window opening without focus on the “Start” button.
    -【Pins】Fixed several pins showing the same content after a batch restore and other pins covering the confirmation dialog for closing or deleting a pin.
    -【Pins】Fixed the pin shortcut failing to pin a screenshot selection while the shortcut preset window was open.
    -【Annotation】Fixed the magnified area disappearing after sampling, and fixed missing borders and jittering characters when hovering over text annotations.
    -【Annotation】Fixed text boxes sometimes stretching when pressing Enter while editing a text annotation in a screenshot from history.
    -【Screen recording】Fixed stationary pointers sometimes drifting on playback.
    -【Copy】Fixed copied images on Windows failing to paste into Word and Excel.
    -【Interface】Fixed a possible crash on macOS when opening Settings or taking a screenshot.
    Membership
    -【Formula recognition】Fixed syntax errors when converting some LaTeX formulas to Typst.
    -【Table recognition】Fixed trailing zeros in decimals being cut off.
