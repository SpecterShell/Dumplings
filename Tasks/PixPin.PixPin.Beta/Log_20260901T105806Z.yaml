  Value: |-
    3.5.4.1
    新增功能
    -【公式识别】支持使用 Ctrl+C 复制识别结果，并增加「复制并关闭」选项。
    -【快捷键】「配置」-「内置快捷键」-「截图」增加「录制时暂停」动作，需手动设置快捷键。
    -【标注】序号标注增加箭头样式。
    -【保存】保存路径增加更多变量。
    -【标注】「配置」-「标注」-「序列号」增加「序号全局计数」选项。
    体验与性能优化
    -【截图】未勾选「显示信息栏」时，多截图模式仍会显示加号和减号图标。
    -【触控板】降低使用触控板切换 UI 元素时的灵敏度。
    -【贴图】托盘菜单与贴图右键菜单中的「销毁」操作增加二次确认。
    问题修复
    -【翻译】修复「图片到图片」翻译模式下部分语言报错的问题。
    -【截图】修复在某些情况下按 Esc 无法退出的问题。
    -【全局鼠标】修复按下键盘按键后意外触发全局鼠标的问题。
    -【截图】修复焦点位于副屏时，截图界面不显示快捷键提示的问题。
    3.5.3.0
    新增功能
    -【快捷键/动作】增加“隐藏当前选中以外的贴图”动作。
    设置调整
    -【保存/复制】“快速保存图像类型”修改为“保存/复制时的图像类型”。
    体验与性能优化
    -【文字识别】标点选项会记忆上次的选择。
    -【标注】优化序号标注在较小尺寸下的使用体验。
    -【硬件加速】启用硬件加速时增加硬件测试。
    问题修复
    -【标注】修复使用颜色选择器调整颜色时，标注颜色不会实时变化的问题。
    -【标注】修复启用标注时无法拖动边框的问题。
    -【标注】修复文本标注框在某些情况下发生位移的问题。
    -【自动粘贴】修复“复制截图后自动粘贴到输入焦点”在微信聊天框中无效的问题。
    -【标注】修复水印标注未限制在选框内的问题。
    3.5.2.2
    新增功能
    -【长截图】「配置」-「截图」-「长截图」增加“鼠标穿透”选项，默认开启。
    -【表格识别】编辑窗口增加表格识别按钮；如需识别长截图中的表格，请进入编辑窗口操作。
    -【录制】录制或回放预览过程中意外退出时，下次打开软件会恢复录制内容。
    体验与性能优化
    -【录制】记忆上次导出时选择的画质。
    问题修复
    -【快捷键】修复 Ctrl+Tab 被注册为全局快捷键的问题，现已调整至「配置」-「内置快捷键」-「截图」。
    -【截图】修复多区域截图模式下，删除内部截图范围未生效的问题。
    -【界面】修复部分 UI 问题。
    3.5.1.0
    新增功能
    -【截图】增加多截图模式，可在普通截图、折线截图、自由截图和多窗口截图之间切换。按下截图快捷键后，按 Ctrl+Tab 可切换截图模式；长按 Ctrl 并点按 Tab，可持续切换。
    -【截图】自由截图可沿鼠标轨迹绘制闭合区域进行截图。
    -【截图】折线截图可依次点击设置端点。至少设置三个端点后，按鼠标右键确认截图区域；端点不足三个时，按鼠标右键会取消已有端点。
    -【截图】多窗口截图可同时截取选中的多个窗口。
    -【截图】以上截图模式均可点击左上角的加号或减号，继续添加或移除截图区域，最终将所有截图合并保存为一张图片。
    -【表格识别】识别窗口右键支持合并、拆分单元格以及删除行列等操作。
    -【文字识别】识别窗口增加“选中文字时高亮图中对应文字”选项，需手动勾选。
    -【文字识别】识别窗口增加“关闭窗口时自动复制文字”选项，需手动勾选。
    设置调整
    -【长截图】「配置」-「截图」-「长截图」增加“响应快捷键”设置。启用后，长截图过程中无法使用鼠标中键滚轮滚动。
    -【折线截图】「配置」-「截图」-「折线截图」增加“折线圆角”设置，可调整圆角大小。
    -【长截图】支持设置阴影和边框，并跟随普通截图的相关设置。
    -【长截图】边框颜色与普通截图的边框颜色保持一致。
    -【标注】模糊强度最大值调整为 50。
    -【快捷键】快捷键录入支持 Ctrl+ScrLk 和 Ctrl+PauseBreak 组合键。
    体验与性能优化
    -【贴图】仅启用缩略图时，右键菜单也会显示“复制原始图像”和“原始图像另存为”选项。
    -【表格识别】识别结果文件由设备的默认打开方式打开。
    -【翻译】使用剪贴板翻译预设时不再显示贴图。
    -【标注】绘制箭头后，评论输入框会自动获得焦点。
    问题修复
    -【提示】修复 Tip 未持续显示的问题。
    -【导出】修复视频导出过程中最小化窗口后，无法重新打开界面的问题。
    -【标注】修复 macOS 多屏幕环境下序号标注显示异常的问题。
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    3.5.4.1
    New Features
    - Formula Recognition: Supports copying recognition results with Ctrl+C and adds a “Copy and Close” option.
    - Hotkeys: In “Settings” → “Built-in Hotkeys” → “Screenshot,” a “Pause During Recording” action has been added; the hotkey must be set manually.
    - Annotations: Numbered annotations now include an arrow style.
    - Saving: More variables have been added to the save path.
    - Annotations: In “Settings” → “Annotations” → “Serial Numbers,” a “Global Serial Number Counting” option has been added.
    Experience and Performance Improvements
    - Screenshots: When “Show Info Bar” is not checked, the plus and minus icons still appear in multi-screenshot mode.
    - Trackpad: Reduced sensitivity when using the trackpad to switch UI elements.
    - Stickers: The “Destroy” action in both the system tray menu and the sticker right-click menu now includes a confirmation prompt.
    Bug Fixes
    - Translation: Fixed errors in certain languages under the “Image-to-Image” translation mode.
    - Screenshots: Resolved an issue where pressing Esc sometimes failed to exit.
    - Global Mouse: Fixed unintended activation of the global mouse after pressing keyboard keys.
    - Screenshots: Corrected the problem where shortcut hints were not displayed on the screenshot interface when the focus was on a secondary screen.
    3.5.3.0
    New Features
    - Hotkeys/Actions: Added an action to “Hide all stickers except the currently selected one.”
    Settings Adjustments
    - Save/Copy: “Quick Save Image Type” has been changed to “Image Type for Save/Copy.”
    Experience and Performance Improvements
    - Text Recognition: The punctuation options now remember the last selection.
    - Annotations: Optimized the usability of numbered annotations at smaller sizes.
    - Hardware Acceleration: Added a hardware test when enabling hardware acceleration.
    Bug Fixes
    - Annotations: Fixed an issue where annotation colors did not update in real time when adjusting them via the color picker.
    - Annotations: Resolved the problem of being unable to drag the borders when annotations are enabled.
    - Annotations: Corrected text annotation boxes that sometimes shifted position.
    - Auto-Paste: Fixed the “Paste Screenshot into Input Focus Automatically” feature not working in WeChat chat windows.
    - Annotations: Fixed watermarks that were not confined within their bounding boxes.
    3.5.2.2
    New Features
    - Long Screenshot: In “Settings” → “Screenshot” → “Long Screenshot,” a “Mouse Pass-Through” option has been added, enabled by default.
    - Table Recognition: The editing window now includes a table recognition button; to recognize tables in long screenshots, please use the editing window.
    - Recording: If you accidentally exit during recording or playback preview, the software will restore the recording content the next time you open it.
    Experience and Performance Improvements
    - Recording: The software now remembers the quality setting used in the last export.
    Bug Fixes
    - Hotkeys: Fixed an issue where Ctrl+Tab had been registered as a global hotkey; it has now been moved to “Settings” → “Built-in Hotkeys” → “Screenshot.”
    - Screenshots: Resolved the problem where deleting inner screenshot regions in multi-area mode had no effect.
    - Interface: Fixed several UI issues.
    3.5.1.0
    New Features
    - Screenshots: Added multi-screenshot mode, allowing switching between regular, polyline, freehand, and multi-window screenshots. After pressing the screenshot hotkey, press Ctrl+Tab to change modes; hold Ctrl and tap Tab repeatedly for continuous switching.
    - Screenshots: Freehand screenshots let you draw a closed area along the mouse’s path.
    - Screenshots: Polyline screenshots allow you to click points in sequence to define endpoints. Once at least three endpoints are set, right-click to confirm the screenshot area; if fewer than three endpoints are set, right-click will cancel the existing ones.
    - Screenshots: Multi-window screenshots capture multiple selected windows simultaneously.
    - Screenshots: All of these modes allow you to click the plus or minus icons in the upper-left corner to add or remove screenshot areas, ultimately merging all captures into a single image.
    - Table Recognition: The recognition window’s right-click menu supports operations such as merging and splitting cells, as well as deleting rows and columns.
    - Text Recognition: The recognition window now includes an option to “Highlight Corresponding Text in the Image When Selected”; this must be manually enabled.
    - Text Recognition: The recognition window also offers an option to “Automatically Copy Text When Closing the Window”; this too requires manual activation.
    Settings Adjustments
    - Long Screenshot: In “Settings” → “Screenshot” → “Long Screenshot,” a “Respond to Hotkeys” setting has been added. When enabled, the middle mouse button scroll wheel cannot be used during long screenshots.
    - Polyline Screenshot: In “Settings” → “Screenshot” → “Polyline Screenshot,” a “Polyline Rounded Corners” setting has been added, allowing adjustment of the corner radius.
    - Long Screenshots: Shadow and border settings are supported and follow those of regular screenshots.
    - Long Screenshots: The border color matches that of regular screenshots.
    - Annotations: The maximum blur intensity has been adjusted to 50.
    - Hotkeys: Hotkey input now supports the key combinations Ctrl+ScrLk and Ctrl+PauseBreak.
    Experience and Performance Improvements
    - Stickers: Even when only thumbnails are enabled, the right-click menu still displays “Copy Original Image” and “Save Original Image As.”
    - Table Recognition: Recognition result files open with the device’s default application.
    - Translation: Clipboard-based translations no longer display stickers.
    - Annotations: After drawing an arrow, the comment input box automatically gains focus.
    Bug Fixes
    - Tooltips: Fixed the issue where tooltips did not remain visible.
    - Export: Resolved the problem of being unable to reopen the interface after minimizing the window during video export.
    - Annotations: Corrected abnormal display of numbered annotations in macOS multi‑monitor environments.
