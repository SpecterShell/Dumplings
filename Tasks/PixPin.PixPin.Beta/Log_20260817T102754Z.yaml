- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    3.5.1.0
    New Features
    - [Screenshot] Added multiple screenshot modes, allowing you to switch between standard, polyline, freehand, and multi‑window screenshots. After pressing the screenshot hotkey, press Ctrl+Tab to cycle through the modes; hold Ctrl and tap Tab to continuously alternate.
    - [Screenshot] The freehand mode lets you draw a closed region along your mouse path to capture the screenshot.
    - [Screenshot] The polyline mode lets you click successively to set endpoints. Once at least three endpoints are defined, right‑click to confirm the screenshot area; if fewer than three endpoints have been set, right‑clicking will cancel the existing ones.
    - [Screenshot] The multi‑window mode can capture multiple selected windows simultaneously.
    - [Screenshot] In all of these screenshot modes, you can click the plus or minus icons in the upper left corner to add or remove screenshot regions, and the final result is saved as a single merged image.
    - [Table Recognition] The context menu in the recognition window now supports operations such as merging and splitting cells, as well as deleting rows and columns.
    - [Text Recognition] An option has been added to the recognition window: “Highlight corresponding text in the image when text is selected.” This must be manually enabled.
    - [Text Recognition] An option has been added to the recognition window: “Automatically copy text when closing the window.” This must be manually enabled.
    Settings Adjustments
    - [Long Screenshot] In “Settings” > “Screenshot” > “Long Screenshot,” a new setting, “Respond to Hotkeys,” has been added. When enabled, the middle‑mouse wheel cannot be used for scrolling during long‑screenshot capture.
    - [Polyline Screenshot] In “Settings” > “Screenshot” > “Polyline Screenshot,” a new setting, “Polyline Corner Radius,” has been added to adjust the roundness of the corners.
    - [Long Screenshot] Shadow and border settings are now supported and follow the corresponding settings for regular screenshots.
    - [Long Screenshot] The border color matches that of regular screenshots.
    - [Annotation] The maximum blur intensity has been adjusted to 50.
    - [Hotkeys] Hotkey input now supports the key combinations Ctrl+ScrLk and Ctrl+PauseBreak.
    Experience and Performance Improvements
    - [Sticker] When only thumbnails are enabled, the right‑click context menu also displays the options “Copy Original Image” and “Save Original Image As.”
    - [Table Recognition] Recognized results files open with the device’s default application.
    - [Translation] When using clipboard‑based translation presets, stickers no longer appear.
    - [Annotation] After drawing an arrow, the comment input field automatically gains focus.
    Bug Fixes
    - [Tip] Fixed an issue where the Tip did not remain visible.
    - [Export] Fixed a problem where minimizing the window during video export prevented the interface from being reopened.
    - [Annotation] Fixed an issue with abnormal display of numbered annotations in macOS multi‑monitor setups.
