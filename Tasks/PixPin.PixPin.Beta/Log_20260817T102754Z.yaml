  Key: ReleaseNotes
  Value: |-
    3.5.1.0
    新增功能
    -【截图】增加多截图模式，可在普通截图、折线截图、自由截图和多窗口截图之间切换。按下截图快捷键后，按 Ctrl+Tab 可切换截图模式；长按 Ctrl 并点按 Tab，可持续切换。
    -【截图】自由截图可沿鼠标轨迹绘制闭合区域进行截图。
    -【截图】折线截图可依次点击设置端点。至少设置三个端点后，按鼠标右键确认截图区域；端点不足三个时，按鼠标右键会取消已有端点。
    -【截图】多窗口截图可同时截取选中的多个窗口。
    -【截图】以上截图模式均可点击左上角的加号或减号，继续添加或移除截图区域，最终将所有截图合并保存为一张图片。
    -【表格识别】识别窗口右键支持合并、拆分单元格以及删除行列等操作。
    -【文字识别】识别窗口增加“选中文字时高亮图中对应文字”选项，需手动勾选。
    -【文字识别】识别窗口增加“关闭窗口时自动复制文字”选项，需手动勾选。
    设置调整
    -【长截图】「配置」-「截图」-「长截图」增加“响应快捷键”设置。启用后，长截图过程中无法使用鼠标中键滚轮滚动。
    -【折线截图】「配置」-「截图」-「折线截图」增加“折线圆角”设置，可调整圆角大小。
    -【长截图】支持设置阴影和边框，并跟随普通截图的相关设置。
    -【长截图】边框颜色与普通截图的边框颜色保持一致。
    -【标注】模糊强度最大值调整为 50。
    -【快捷键】快捷键录入支持 Ctrl+ScrLk 和 Ctrl+PauseBreak 组合键。
    体验与性能优化
    -【贴图】仅启用缩略图时，右键菜单也会显示“复制原始图像”和“原始图像另存为”选项。
    -【表格识别】识别结果文件由设备的默认打开方式打开。
    -【翻译】使用剪贴板翻译预设时不再显示贴图。
    -【标注】绘制箭头后，评论输入框会自动获得焦点。
    问题修复
    -【提示】修复 Tip 未持续显示的问题。
    -【导出】修复视频导出过程中最小化窗口后，无法重新打开界面的问题。
    -【标注】修复 macOS 多屏幕环境下序号标注显示异常的问题。
