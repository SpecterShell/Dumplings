  Key: ReleaseNotes
  Value: |-
    This release introduces ACP support so that Vicinae can be used to drive existing AI agents such as claude-code, codex, grok code, mistral vibe, and many more...
    What's Changed
    - feat(ai): ACP support by @aurelleb in https://github.com/vicinaehq/vicinae/pull/2143
    - feat: add vicinae mcp to export Vicinae tools to agents by @aurelleb in https://github.com/vicinaehq/vicinae/pull/2145
    - feat: replace deprecated gemini CLI with antigravity-cli by @aurelleb in https://github.com/vicinaehq/vicinae/pull/2146
    - fix(ai): compatibility with mistral reasoning models by @aurelleb in https://github.com/vicinaehq/vicinae/pull/2147
    - feat(ai): add more agent providers by @aurelleb in https://github.com/vicinaehq/vicinae/pull/2148
    - fix(i18n): register es_ES translation and fix malformed .ts by @jmmartinf in https://github.com/vicinaehq/vicinae/pull/2153
    - feat(ai): extension tool support by @aurelleb in https://github.com/vicinaehq/vicinae/pull/2154
    - feat(i18n): add Korean translations by @ivLis-Studio in https://github.com/vicinaehq/vicinae/pull/2176
    - fix(config): preserve symlinked user config on write by @dnlzro in https://github.com/vicinaehq/vicinae/pull/2173
    - Add API Key field for llama.cpp provider by @nikorsd in https://github.com/vicinaehq/vicinae/pull/2164
    - fix(windows): prevent the launcher from closing when a command reads selected text by @Sulaiman-Dawood in https://github.com/vicinaehq/vicinae/pull/2174
    - feat(root): open bare domains and IP addresses as links by @Sulaiman-Dawood in https://github.com/vicinaehq/vicinae/pull/2169
    - Detect absolute paths on windows in dmenu by @zerebos in https://github.com/vicinaehq/vicinae/pull/2156
    - Stop missed key ups from sticking modifiers by @zerebos in https://github.com/vicinaehq/vicinae/pull/2157
    - feat(ai): image and thinking level support for ACP by @aurelleb in https://github.com/vicinaehq/vicinae/pull/2185
    New Contributors
