- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    ✨ Added
    - 🖱️ Highlight what matters, then hand it to your companion: Quote selected text from files, Markdown, and plugin artifacts—including a few lines of code—without attaching the entire source. Reference cards preserve the source and support previewing, removal, and navigation back to the original. You can also send references to another open conversation.
    - 🌐 Point to a webpage element: The built-in browser now offers an element picker. Click a target to create a reference with a text snapshot, then return from the message to locate and highlight its source. Saved reference content remains available even if the source can no longer be located.
    - 📁 Manage files without switching windows: The workspace file tree now supports creating files and folders, renaming, copying, cutting, pasting, and moving items to the trash, with context menus and keyboard controls. File conflicts, unsaved changes, and uncertain operation results are explicitly reported rather than treated as success.
    - 🎨 A new look for your files: Added file icon theme settings with plugin-provided icons for files and folders. Built-in icons also cover more common directory types. If a selected theme becomes unavailable, built-in icons are used temporarily while preserving your preference.
    - 💾 Updated local backup retention: Local backups now keep the latest 3 copies by default, configurable from 1 to 10 in Data Storage. Excess copies are removed after a successful backup or import. Pending uploads and restores are temporarily retained; cloud backups and exported copies are unaffected. Increase the limit or export backups separately if you need a longer history.
    ⚡ Improved
    - 🔌 Plugins that follow the task’s rhythm: Added hooks for task creation, pre-run preparation, and the start of a reply, including the ability to wait for pre-run plugin preparation. Plugin model calls also have improved task and branch association, expanding support for task assistance and custom interactions.
    - 📊 See where your storage goes: Storage usage now includes a proportion bar, category percentages, and expandable details for conversation records, attachments, file-change snapshots, web caches, local backups, and more. Statistics cover the current data directory only, excluding external working directories.
    - 🖼️ Fewer image copies, lighter long-running tasks: Improved storage for image attachments and images returned by tools by reusing identical image content, reducing duplicate writes and conversation-log growth while retaining compatibility with existing image records.
    - 🪟 Choose your Windows installation directory: First-time interactive installation now lets you choose where the program is installed. Reinstallation, upgrades, and in-app updates retain the existing installation path. Program and application-data locations remain separate, so changing the installation location does not move task data.
    🛠️ Fixed
    - 🔄 Update downloads and failure feedback: Fixed the update download path and improved proxy authentication handling. Download failures, timeouts, storage or permission problems, and package verification failures now have distinct explanations, with retry and manual-download options.
    - ☁️ More reliable cloud backup connection tests: Connection tests now verify directory access, uploading, reading back and checking content, and deletion—not just whether the service is reachable. Fixed WebDAV path and directory handling and added clearer errors for credentials, permissions, storage capacity, and service endpoints.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    ✨ 新增
    - 🖱️ 圈出重点，再交给伙伴：文件、Markdown 与插件产物支持选区引用，选中一段文字或几行代码，就能带着来源加入对话，不必再搬运整份内容。引用以卡片展示，可预览、移除并定位回原文，也可选择发送到其他已打开的对话。
    - 🌐 网页元素，也能“点名”：内置浏览器新增元素选择模式，点击页面上的目标即可生成带文本快照的引用。从消息中可返回来源页面并定位、高亮元素；即使来源已不可用，保存的引用内容仍会保留。
    - 📁 文件管理，不必来回切窗口：工作区文件树支持新建文件与文件夹、重命名、复制、剪切、粘贴和移到回收站，并提供右键菜单与键盘操作。遇到文件冲突、未保存内容或操作结果待核对时会明确提示，避免把不确定的结果当作成功。
    - 🎨 给文件换套图标：新增文件图标主题设置，支持通过插件扩展文件与文件夹图标；内置图标也补充了常见目录的专属样式。图标主题暂不可用时自动使用内置图标，恢复后继续沿用原选择。
    - 💾 本地备份保留策略调整：本地备份默认保留最近 3 份，避免备份快速膨胀，可在「数据存储」中调整为 1–10 份。成功创建或导入备份后会清理超额副本；待上传或恢复的副本暂时保留，云端备份与已导出的副本不受影响。如果需要保留更多历史存档，请先调整保留数量或另行导出。
    ⚡ 改进
    - 🔌 插件更懂任务节奏：扩展任务创建、运行前和开始回复等事件钩子，支持在运行前等待插件完成准备工作；同时完善插件模型调用的任务与分支关联，为任务辅助和定制交互提供更完整的扩展能力。
    - 📊 空间都去哪了，一眼看明白：空间占用增加比例条、分类占比与可展开明细，可进一步查看会话记录、附件媒体、文件变更快照、网页缓存及本地备份等占用。统计仅覆盖当前数据目录，不包含外部工作目录。
    - 🖼️ 图片少存几遍，长任务轻装一点：优化图片附件与工具返回图片的存储方式，复用相同图片内容，减少重复写入和会话记录膨胀，同时保留历史图片的读取兼容。
    - 🪟 Windows 首次安装可选目录：首次交互安装可自行选择程序位置；重装、升级与应用内更新继续沿用原安装路径。程序安装目录与应用数据目录独立管理，不会因为换了安装位置就搬动任务数据。
    🛠️ 修复
    - 🔄 更新下载与失败反馈：修复更新下载链路，改善代理认证场景；下载失败、超时、空间或权限不足、安装包校验失败现在会分别说明，并提供重试或手动下载入口。
    - ☁️ 云备份连接测试更可靠：连接测试会实际验证目录访问、上传、读回校验与删除，不再只看服务是否能连接；修复 WebDAV 路径与目录处理问题，并细化账号、权限、存储空间和服务地址等错误提示。
