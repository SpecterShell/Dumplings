- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    This release focuses heavily on optimizing the Windows runtime and sandbox architecture. We overhauled the underlying process, token, and permission handling on Windows—eliminating exit delays, shortening environment preparation, and removing redundant workspace scanning before commands for a noticeably snappier execution experience. Special thanks to @QAyong and @deqiying for their continuous testing and feedback on Windows.
    Additionally, this version brings native streaming media previews to artifact cards, the ability to move standalone tasks into spaces, and support for live supplements during in-flight runs.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    这个版本的重点是 Windows 运行体验与沙箱机制的深度优化。我们重构了 Windows 沙箱的底层进程、Token 与权限逻辑，修复了退出延迟、环境准备耗时，并移除了命令启动前不必要的工作目录扫描，指令执行更加干脆利落。特别感谢 @QAyong 与 @deqiying 在 Windows 环境下的细致测试与宝贵反馈。
    此外，本版本还补齐了产物卡片音视频流式预览、无空间任务归入空间、等待中即时补充等多项日常体验优化。
