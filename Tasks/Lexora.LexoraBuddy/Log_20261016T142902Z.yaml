- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    ✨ Added
    - 📊 Native Mermaid diagrams in conversation: Flowcharts, sequence diagrams, architecture maps, and state machines render directly as visual diagrams rather than raw code blocks. Styled to match light and dark themes seamlessly, making design discussions and logic flows intuitive at a glance.
    - 🌐 Web reading and snapshot mode: Enhanced the built-in browser with structured text extraction and full-page/element visual snapshots. Companions can read web articles cleanly and inspect actual visual layouts when gathering references.
    - 🗜️ Compressed backups: Local backups and export archives now use compressed packaging, significantly reducing disk footprint and network transfer times for cloud sync. Restoring remains fully automatic with backward compatibility.
    - 🎨 Window styling and visual materials for plugins: Opened workbench styling capabilities for plugin creators, including translucent materials, ambient glass accents, and custom workspace panels. Plugins can bundle local media and images securely for richer, more immersive interfaces.
    - 📖 Redesigned website and comprehensive guides: Relaunched the official site with a refreshed look and complete documentation covering multi-companion collaboration, security sandboxes, data migration, automations, and plugin creation.
    ⚡ Improved
    - 🧩 Deeper capabilities for official plugins: The plugin ecosystem gains access to task lifecycle hooks (on task creation, pre-run preparation, and reply start), alongside branch-aware model invocation, unlocking richer automation and assistant workflows.
    - 🗂️ Snappy file browsing in large projects: Optimized workspace directory listing and lazy-loading in the file explorer. Deep directory trees and heavy workspaces open instantly without UI stutters.
    - 🐧 Smoother updates on Linux: Linux packages (Deb, RPM, and Arch) feature guided in-app installation handover to system package managers with graceful fallback paths, minimizing manual command-line intervention.
    - 🧠 Accurate reasoning token accounting: Fixed uncounted thinking/reasoning token usage across supported models, ensuring usage analytics reflect the real token expenditure.
    - 🛠️ Streamlined tool exploration: Refined on-demand tool disclosure and CodeMode orchestration prompts to trim system prompt overhead and sharpen tool calling reliability during complex tasks.
    🛠️ Fixed
    - 🎯 Precise browser element selection: Fixed misaligned bounding boxes and text snapshots when picking webpage elements under page zoom, deep scrolling, or CSS transformations.
    - 🔌 Plugin themes and asset reliability: Resolved edge cases where plugin media assets were blocked by sandbox isolation, while improving runtime diagnostics for extension developers.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    ✨ 新增
    - 📊 对话原生支持 Mermaid 图表：对话中的流程图、时序图、架构图与状态机可直接渲染为交互式图表，告别冰冷的代码块。图表深度适配内置主题与明暗配色，技术讨论、方案设计与逻辑梳理一目了然。
    - 🌐 网页阅读与图文抓取新姿势：内置浏览器与阅读工具升级，支持智能提取页面正文与标题元数据，并支持多视口截图与特定元素截屏。伙伴在查阅网页资料时，既能读懂排版布局，也能摘录重点，信息获取更完整。
    - 🗜️ 备份体积大瘦身：本地备份全面引入压缩存储，导出的存档与云备份传输体积大幅缩减，既节省本地磁盘，也让网络同步更轻快。导入与恢复自动适配，无需手动解压。
    - 🎨 插件材质与沉浸式窗口样式：为插件开发者开放工作台视觉定制能力，支持半透明材质（如磨砂玻璃与云母质感）、沉浸式窗口区域与局部样式调整；插件还能安全打包本地图片与媒体资产，打造更灵动的扩展体验。
    - 📖 全新官网与全流程使用指南：官方站点与文档完成重构，上线全套使用手册，详细讲解多伙伴协作、权限隔离、数据迁移、自动化编排与插件开发，助你更全面地探索 Lexora。
    ⚡ 改进
    - 🧩 官方插件能力进阶：插件市场开放了更丰富的任务生命周期钩子，插件可在任务创建、执行前及回复开始时协同介入；模型调用能够保持对话分支上下文，为各类实用插件提供更扎实的底层支持。
    - 🗂️ 大项目文件树流畅如飞：重构空间文件读取与前端状态树，解决深层目录与海量文件下的浏览卡顿，大文件夹秒开，文件管理更顺手。
    - 🐧 Linux 体验升级，应用更新更丝滑：Linux（Deb / RPM / Arch）安装包支持更完善的应用内更新引导，配合系统包管理器平滑过渡，若更新遇到意外能安全回退，减少手动终端命令操作。
    - 🧠 思考过程用量不漏记：完善深度思考（Reasoning / Thinking）模型的用量记录，完整统计思考 Token，用量报表与费用核算更准确。
    - 🛠️ 工具探索轻装上阵：优化动态工具发现机制与 CodeMode 编排策略，精简传递给模型的说明提示词，降低上下文开销，让伙伴在复杂任务中调度工具更稳健。
    🛠️ 修复
    - 🎯 浏览器元素精准选取：修复页面在缩放、滚动或特殊 CSS 变换时元素高亮与快照区域错位的问题，选区引用指哪选哪。
    - 🔌 插件主题与资源稳定性：修复插件静态资源被沙箱误拦截的问题，并强化插件错误诊断与日志反馈，提升第三方扩展运行稳定性。
