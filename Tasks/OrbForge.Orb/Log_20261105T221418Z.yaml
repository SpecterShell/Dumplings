Version: 1.7.1.0
Installer:
- InstallerType: msix
  InstallerUrl: https://pkgs.orb.net/stable/windows/orb-1.7.1.0.msix
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - New: In-app sharing. Share your real-time network experience with anyone, anywhere! Generate a live link that opens directly in a browser, giving others instant access to your Orb's live metrics and up to 24 hours of history. Perfect for remote troubleshooting, collaboration, and diagnosing connectivity issues.
      Choose your privacy settings to control what information is visible, and find your shared sessions anytime under Menu > Sharing in the Orb app. Live sharing sessions automatically end after 10 minutes.
    - Bug fixes, security updates, and performance optimizations
