- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Burrow 0.1.10 Preview refines interface motion, themes, and list responsiveness, adds the project link to About, and fixes connection cleanup through WireGuard gateways.
    Changes
    - Add the GitHub repository address to Settings → About, with buttons to open it in the default browser and copy the address.
    - Show a confirmation after copying the project address or app version in Settings → About.
    - Refine interface animations with smoother spring motion for dialogs, sidebars, drawers, segmented tabs, and switches, plus smooth transitions when switching main sections, settings categories, dropdowns, menus, and server monitor meters.
    - Honor the app's Reduce motion setting for navigation, settings transitions, segmented controls, menus, and dropdowns while retaining fades and color transitions.
    - Stop SSH panes, the server monitor, and the MCP audit drawer from accepting input as soon as they start closing. Restore input to the window when a dialog finishes fading out.
    - Honor Reduce motion for pane reveals, drag returns, monitoring bars, and MCP dialogs and controls. In this mode, the SSH cursor stays steady even when a remote program requests blinking.
    - Reduce redraw work while a catalog drag is held still and keep long transfer lists responsive while progress updates.
    - Improve secondary text, list hover and selection, and segmented controls in light and dark themes.
    - Match the fill of inputs and dropdowns to the sidebar search field, with subtle outlines that become more visible on hover.
    - Use the accent color for the selected icon in the gateway type and file site protocol pickers, and the same gray for all unselected icons.
    - Keep the sliding selection visible over hover and press highlights in segmented controls, the main navigation, and the settings sidebar.
    - Keep the selected item in the light theme's main navigation visible over the translucent window background on macOS.
    - Close connections made through a WireGuard gateway on the server as well when their tab closes or the app quits, instead of sometimes leaving the server's side open.
    Validation
    - Commit checks passed for 21b88a4, including secret scanning, formatting, localization, licenses, Go race tests and vet, Linux compilation, and Windows dual-architecture compilation. Commit checks
    - Protocol E2E passed on release commit 21b88a4. Native UI and MCP E2E passed on application commit af8016b before the release version change. This release reuses those application results for its version and changelog update.
    - macOS ARM64 and Windows x64/ARM64 packaging and artifact checks passed. All 10 downloaded attachments matched their GitHub SHA-256 digests, installers and update archives matched SHA256SUMS, and all three update archives verified against the app's Ed25519 public key. The DMG passed hdiutil verify, and the macOS update bundle matched version 0.1.10 and the project's fixed signing identity. Packaging
    Preview validation status
    - Windows native installation, upgrade, and uninstallation, plus cross-version in-app replacement and relaunch, await platform acceptance.
    - macOS uses the project's fixed self-signed identity. Apple Developer ID signing, notarization, and Windows Authenticode signing remain pending. Platform support
    Full changelog · Release source 21b88a4
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Burrow 0.1.10 Preview 优化界面动效、主题和长列表响应，在关于页增加项目入口，并修复 WireGuard 网关连接的关闭清理问题。
    本次更新
    - 在设置 → 关于中新增 GitHub 项目地址，支持在默认浏览器中打开和复制地址。
    - 在设置 → 关于中复制项目地址或应用版本后显示成功提示。
    - 优化全局界面动效：弹窗、侧边栏、抽屉、分段切换条与开关采用更顺滑的弹簧过渡，并在主导航切换、设置分类切换、菜单与下拉框展开以及监控进度条变化时提供平滑过渡。
    - 修复导航、设置页切换、分段切换条、菜单和下拉框未遵循应用内减少动态效果设置的问题，同时保留透明度和颜色过渡。
    - SSH 窗格、服务器监控面板和 MCP 审计抽屉开始关闭时立即停止接收输入。弹窗淡出结束时同步恢复底层窗口的交互。
    - 窗格显现、拖拽回弹、监控条以及 MCP 弹窗和控件现在遵循减少动态效果设置。启用时，即使远端程序要求闪烁，SSH 光标也会保持静止。
    - 减少目录拖拽停住时的界面重绘，改善长传输列表在进度更新时的响应速度。
    - 优化浅色和深色主题，让次要文字、列表悬停与选中状态和分段切换条更容易分辨。
    - 输入框和下拉框沿用侧栏搜索框的底色，默认描边更淡，悬停时更明显。
    - 统一网关类型和文件站点协议选择器的图标配色，选中项使用强调色，未选中项使用同一种灰色。
    - 修复分段控件、主导航和设置侧栏切换时，悬停或按下底色遮挡滑动选中块的问题。
    - 修复 macOS 浅色主题下，主导航选中底色容易与半透明窗口背景融为一体的问题。
    - 经 WireGuard 网关建立的连接在关闭标签或退出应用时，服务器端也会同步关闭，不再偶尔残留。
    验证情况
    - 发布提交 21b88a4 的提交检查已通过，包括秘密扫描、格式、本地化、许可、Go 竞态测试与 vet、Linux 编译及 Windows 双架构编译。提交检查
    - 发布提交 21b88a4 已通过协议 E2E。原生 UI 与 MCP E2E 已在应用提交 af8016b 上通过，本次版本号和 CHANGELOG 更新沿用该轮应用验收结果。
    - macOS ARM64、Windows x64/ARM64 打包与产物检查均通过。下载的全部 10 个附件与 GitHub SHA-256 摘要一致，安装程序与更新归档符合 SHA256SUMS，三份更新归档均通过应用 Ed25519 公钥验签。DMG 通过 hdiutil verify，macOS 更新包的版本号为 0.1.10，签名身份与项目固定身份一致。打包结果
    预览版验收状态
    - Windows 原生安装、升级、卸载，以及应用内跨版本替换和重启，仍待平台验收。
    - macOS 使用项目固定的自签名身份，Apple Developer ID 签名、公证和 Windows Authenticode 签名仍待完成。平台支持
    完整变更 · 版本源码 21b88a4
