Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Keep collecting SSH server metrics while the app is in the background, and show gaps when sampling is interrupted.
    - Open the SSH port forwarding dock from the title bar to manage local TCP forwards and SOCKS5 proxies with configurable listen addresses alongside server monitoring.
    - Show a confirmation after copying an address from the SSH port forwarding dock.
    - Drag the top edge of the SSH port forwarding dock to resize it, or double-click the handle to reset its height.
    - Match the SSH forwarding rule editor to the session and gateway dialogs.
    - Smooth the rounded edges around Shell panes with and without translucency, and remove their decorative inner outline.
    - Keep the header, terminal background, and status bar the same color when a split Shell pane loses focus.
    - Draw the Shell focus ring inside the pane so split resize handles have equal space on both sides.
    - Expand and restore split Shell panes from their current visible position with the same smooth transition as sidebars and bottom docks.
    - Retract the original Shell pane before the new pane fades in and receives focus. Expand the remaining panes after a closed pane fades out.
    - Keep the far edge of the original Shell pane anchored when another pane is dragged to its side within a tab.
    - Make active Shell toolbar toggles stand out and respond to hover while selected.
    Verification
    The protocol integration, native macOS UI, and MCP gates passed on the release commit. GitHub Actions built and checked the macOS disk image and both Windows installers. The macOS app uses Burrow's fixed self-signing identity and has no Apple notarization. Windows installers are unsigned. In-app update bundles are signed. Native Windows and cross-version upgrades were outside this release's verification scope.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 应用退到后台时继续采集 SSH 服务器指标，并在趋势图上显示断采缺口。
    - 从 SSH 标题栏打开端口转发底栏，管理监听地址可设置的本地 TCP 转发和 SOCKS5 代理，同时查看服务器状态。
    - 在 SSH 端口转发底栏复制地址后显示成功提示。
    - 拖动 SSH 端口转发底栏的上沿可调整高度，双击拖拽柄可恢复默认高度。
    - 将 SSH 转发规则的新建和编辑弹窗统一为会话与网关弹窗的样式。
    - 改善 Shell 面板在开启和关闭半透明时的圆角锯齿感，并移除装饰性内描边。
    - 分屏中的 Shell 失去焦点时，标题栏、正文和状态栏的默认底色保持一致。
    - 将 Shell 焦点边框移到窗格内侧，让分屏拖拽柄两侧的间距保持一致。
    - 分屏 Shell 从窗格当前显示的位置展开和还原，动效与侧栏和底栏折叠一致。
    - 分栏时原有 Shell 窗格先平滑收回，新窗格随后淡入并获得焦点。关闭的窗格淡出后，其余窗格平滑展开填满空位。
    - 在同一标签内把 Shell 拖到另一窗格边缘时，原窗格固定远边并平滑收回让位。
    - 突出 Shell 标题栏开关的选中状态，并在选中后继续提供悬停反馈。
    验证
    发布提交已通过协议集成、macOS 原生界面和 MCP 门禁。GitHub Actions 已构建并校验 macOS 磁盘映像和两种架构的 Windows 安装包。macOS 应用使用 Burrow 的固定自签名，未经过 Apple 公证。Windows 安装包未签名。应用内更新包已签名。本次验证范围不含 Windows 原生运行和跨版本升级。
