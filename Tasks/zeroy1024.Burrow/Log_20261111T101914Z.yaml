  Key: ReleaseNotes
  Value: |-
    Burrow 0.1.5 是开发预览更新，新增可配置的后台运行与托盘面板，方便在关闭主窗口后继续使用已启用的 MCP、SSH 连接和文件传输。
    本次更新
    - 新增后台运行设置：可选择关闭主窗口时退出或仅隐藏窗口，后台保留已启用的 MCP、连接和传输。默认仍为关闭主窗口即退出；真正退出会保存状态并停止服务。
    - macOS 和 Windows 的托盘图标支持点击弹出自定义面板，查看及启停 MCP、复制完整 MCP 接入地址、查看今日调用次数、SSH 会话与延迟、进行中的传输，并打开主窗口或设置。点击 SSH 会话可跳转到对应标签；右键仍提供原生菜单。Linux 继续使用原生托盘菜单。
    - macOS 新增“隐藏程序坞图标”和“⌘Q 仅关闭窗口”两个独立选项，默认关闭。进入后台后可隐藏 Dock 图标，重新打开窗口时恢复；菜单中的“退出”始终完全退出应用。
    - macOS 菜单栏采用透明背景的单色兔子标识，由系统适配明暗外观及选中状态。
    - 再次启动 Burrow 会唤醒已有窗口；后台认证请求会显示主窗口供用户处理。后台运行时保留菜单栏／托盘入口，避免隐藏窗口后无法返回。
    使用说明
    后台运行相关选项位于“设置 → 通用 → 后台运行”。开启后台运行后，当前凭据保持解锁；MCP 是否启用仍由原有服务开关控制。若希望完全退出，请从应用菜单或托盘面板选择“退出”。
    本轮验证
    - 发布提交检查通过，覆盖秘密扫描、格式、许可、语言资源、主模块与终端扩展的已有 race 测试和静态检查、Linux 构建及 Windows 双架构交叉编译。
    - 安装包来自标签构建与内容校验：Windows 安装程序已解包核对 EXE、Ghostty DLL 和许可文件；macOS 已核对包内许可并验证 DMG 完整性。
    - 本地发布源码及全部本地 refs 的 96 个历史提交经 Gitleaks 扫描无发现；下载的三份安装包均与 CI 摘要一致，macOS DMG 另行通过完整性验证。
    预览版说明
    - macOS 使用项目固定的自签名身份，尚无 Apple Developer ID 签名或公证，首次打开可能被系统阻止。
    - Windows 安装程序未做代码签名，包含对应架构的 EXE 和 Ghostty DLL，并使用 UPX 压缩；原生启动、安装、升级、卸载及最低系统版本仍待实际环境验收。
    - 本轮已运行开发预览，但未完成后台 MCP 联调、Dock／⌘Q 行为的系统验收，也未执行发布安装包的原生安装测试。CI 与产物校验不代表这些场景已经验收。
    - 详细能力与限制见平台支持和已知限制。
