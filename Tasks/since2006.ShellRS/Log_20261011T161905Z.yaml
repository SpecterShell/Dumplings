- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新增
    - 设置 › 终端新增「本地终端」：可指定本地终端运行的 shell 和参数，下拉列出本机装的常用 shell。
    - 自定义快捷键可以用 Shift 加 Insert、Delete 等键，如 Shift+Insert 粘贴。
    改进
    - Windows 本地终端默认使用 PowerShell，标签只显示程序名。
    - Windows 安装程序在中文系统上显示中文。
    - 应用图标大小与 macOS 上的其他应用一致。
