- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    ## New Features

    - Added Web Panels to embed third-party web tools in the sidebar and remember their zoom levels
    - Added Writing Replay to play back your writing process as a video and export it as an MP4 file
    - Added document locking to prevent accidental changes to the body text while keeping the title, icon, and notes editable

    ## Improvements

    - Theme properties can now be shared across themes to keep them consistent
    - Added an alternating row background option to the mind map outline view for easier reading
    - Updated the panel for opening or creating a Library
    - Added a translucent effect to context menus in the document tree

    ## Bug Fixes

    - Fixed some known issues to improve the overall experience
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    ## 新功能

    - 新增 Web 面板，支持在边栏中嵌入第三方网页工具，并记住网页缩放比例
    - 新增码字回放功能，支持以视频形式回放码字过程，并可导出为 MP4 视频
    - 新增文档锁定功能，可锁定正文以防止误改，锁定后仍可编辑标题、图标和备注

    ## 改进

    - 支持将指定主题属性设为通用，使这些属性在各主题间持续保持一致
    - 为思维导图的大纲模式新增交替行底色选项，方便浏览与阅读
    - 调整打开或新建文档库的面板
    - 为目录树列表的右键菜单添加半透明效果

    ## 问题修复

    - 修复一些已知问题，提升使用体验
