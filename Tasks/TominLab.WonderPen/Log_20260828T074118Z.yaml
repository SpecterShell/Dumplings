- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    ## Editor & Writing

    - Added the Writing Plan feature
    - Added an option to enable or disable common Markdown syntax formatting in the editor
    - Added an option to automatically capitalize the first letter of English sentences
    - Improved English spell checking, with spelling suggestions and “Learn Spelling” available in the context menu
    - Added a “Full Width” mode for tables in the editor
    - Added support for customizing the color of text highlights
    - Added volume control for typing sound effects
    - Added Typewriter Mode support to floating windows
    - Added an option to remember each document’s scroll position; when disabled, documents always open at the top when switching between them
    - Fixed an issue when pressing Enter to exit nested blockquotes

    ## Documents & Metadata

    - Improved custom metadata with support for grouping and colored options
    - Improved the Overview view, allowing you to customize which fields are displayed for a document and their order, with support for sorting fields
    - When multiple documents are selected in the document tree, you can now use the context menu to batch toggle whether they are marked as reference materials
    - Fixed an issue with custom metadata

    ## Whiteboard

    - Improved multi-selection on the Whiteboard, including support for marquee selection of multiple cards
    - Added an option to duplicate a selected Whiteboard card from the context menu
    - Selected Whiteboard cards can now be copied or moved to another Whiteboard
    - Added snapshot support for Whiteboard cards
    - Added support for exporting Whiteboards as images or PDFs

    ## Export

    - Improved table handling when exporting to Markdown
    - Fixed an issue where nested ordered list numbering could differ between exported documents and the editor
    - Fixed several issues when exporting to EPUB and DOCX

    ## Other Improvements & Fixes

    - Fixed an issue with automatic lock timing
    - Various styling improvements, refinements, and minor bug fixes
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    ## 编辑器与写作

    - 添加写作计划功能
    - 增加编辑器中常用 Markdown 标记是否生效的开关
    - 增加英文句首字母自动大写选项
    - 改进英文拼写检查，右键菜单中支持拼写建议和学习拼写
    - 编辑器中的表格增加“满宽”模式
    - 划词高亮的颜色支持自定义
    - 打字特效的按键音支持调整音量
    - 浮动窗口支持打字机模式
    - 增加记住文档滚动位置的设置，关闭后切换文档时总是滚动到顶部
    - 修复多层引号按回车跳出时的一处问题

    ## 文档与元数据

    - 改进自定义元数据功能，支持分组，选项可以设置颜色
    - 改进概览视图，可自定义文档显示的字段及顺序，并支持字段排序
    - 在目录列表选中多个文档时，可通过右键菜单批量切换是否为“资料”
    - 修复自定义元数据的一处问题

    ## 白板

    - 改进白板多选功能，支持框选多张卡片
    - 白板中选中卡片后，可通过右键菜单生成副本
    - 白板中可将选中的多张卡片复制或移动到其他白板
    - 白板卡片支持快照
    - 支持将白板导出为图片或 PDF

    ## 导出

    - 改进导出为 Markdown 时对表格的处理
    - 修复有序列表的子列表导出时编号与编辑器中不一致的问题
    - 修复导出为 EPUB 和 DOCX 时的一些问题

    ## 其他改进与修复

    - 修复自动锁定计时的一处问题
    - 一些样式、细节和其他小问题的改进与修复
