- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    ## New Features

    - Added a mobile preview view in the right sidebar (hidden by default; can be enabled as needed)
    - Added a tool to calculate earnings based on a per-1,000-word rate

    ## Improvements

    - Increased the node limit to 5,000 per mind map
    - Mind map note windows now remember their size
    - Improved tab scrolling at the top of card lists
    - Improved tables on whiteboards
    - Improved snapshot previews
    - Improved Word export
    - Added support for creating a new card list when adding cards via the context menu

    ## Bug Fixes

    - Fixed an issue that could prevent the app from starting in certain situations
    - Fixed other known issues and improved stability
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    ## 新增功能

    - 新增手机预览视图（位于右侧边栏，默认关闭，可按需手动开启）
    - 新增千字稿费计算功能

    ## 功能改进

    - 思维导图节点数上限提升至每个思维导图 5000 个
    - 思维导图备注窗口支持记住尺寸
    - 优化卡片列表顶部标签的滚动体验
    - 改进白板表格功能
    - 改进快照预览功能
    - 改进 Word 导出效果
    - 右键添加卡片时，支持新建卡片列表

    ## 问题修复

    - 修复部分情况下无法正常启动的问题
    - 修复其他已知问题，提升稳定性
