- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Editing and Typography

    - Annotations now support custom text and background colors and color scheme reordering, with schemes synced across devices with your Library. Annotation panels can also be resized.
    - Editor headings can now scale by heading level. Added a Typography panel under Advanced settings.
    - Added text and background color controls to the selection toolbar, and options to copy and paste in a specific format to the context menu.
    - The status bar now supports customizable items and drag-and-drop reordering.
    - In-document search now wraps around and shows the current match position.

    Spell Check

    - Added spell check settings with a choice between the system spell checker and built-in dictionaries for multiple languages.
    - Added learned word management, with sorting, bulk deletion, and undo.

    Whiteboards and Data Cards

    - Data cards now support CSV, Excel, and JSON import and export, with an import preview, record selection, append or replace options, and undo.
    - Table and checklist views now support multiple-row selection, bulk actions, and dragging selected rows together.
    - Data card views can now be duplicated, reordered, and deleted, and the last-used view is remembered. Improved search, filtering, and field editing.
    - Mind maps now support OPML and Markdown file import and export, including compatibility with Markdown files from some popular outlining tools.

    Preview and Export

    - Added more themes for HTML and PDF export.
    - Clicking text in Phone Preview now moves the editor cursor to the corresponding position. Phone Preview preserves text formatting by default and includes an option to show or hide annotations.

    Writing Plans and Windows

    - You can now keep previous writing plans when starting a new one, and browse past plans and progress charts by year.
    - Floating document windows can now be restored after restarting, including their position, size, and display state. Enable this in Settings → Advanced → Other Settings.

    Improvements and Fixes

    - Improved find and replace, settings panels, document selection, and the experience in smaller windows and across interface languages.
    - Fixed issues with editor scroll positioning, One-Click Formatting, whiteboard selection and dragging, undoing imports, and export previews.
    - Improved automatic uploads when closing or hiding windows or switching Libraries, making saving and cloud sync more reliable.
    - Other minor improvements and bug fixes.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    编辑与排版

    - 标注支持自定义文字与背景颜色、方案排序，并随文档库同步；标注面板支持调整大小。
    - 编辑器标题支持按级别放大字号，新增「高级 → 排版」设置面板。
    - 选区工具栏新增文字颜色与背景颜色按钮，右键菜单支持按指定格式复制、粘贴。
    - 状态栏支持自定义显示项目和拖拽排序。
    - 文档内查找支持循环跳转，并显示当前命中位置。

    拼写检查

    - 新增拼写检查设置，可选择系统检查或多语言内置词典。
    - 新增已学词管理，支持排序、批量删除与撤销。

    白板与数据卡

    - 数据卡支持 CSV、Excel、JSON 导入导出，提供导入预览、记录选择、追加或覆盖导入及撤销。
    - 表格与清单支持多行选择、批量操作和整组拖拽排序。
    - 数据卡视图支持复制、排序与删除，并记住上次使用的视图；完善搜索、筛选及字段编辑。
    - 思维导图支持 OPML、Markdown 文件导入导出，兼容部分常见大纲工具的 Markdown 格式。

    预览与导出

    - HTML、PDF 导出新增多种主题。
    - 手机预览支持点击文字定位编辑器光标，默认保留正文格式，并可切换是否显示标注。

    写作计划与窗口

    - 支持保留旧写作计划并开始新计划，可按年份查看历史计划与进度图表。
    - 支持记住浮动文档窗口，重启后自动恢复位置、大小及显示状态（可在「设置窗口 → 高级 → 其他设置」面板开启）。

    优化与修复

    - 优化查找替换、设置面板、目录选择及小窗口、多语言界面的使用体验。
    - 修复编辑器滚动定位、一键排版、白板多选拖拽、导入撤销及导出预览等问题。
    - 完善关闭、隐藏窗口或切换文档库时的自动补传，提升保存与云同步的可靠性。
    - 一些其他细节改进和小问题修复。
