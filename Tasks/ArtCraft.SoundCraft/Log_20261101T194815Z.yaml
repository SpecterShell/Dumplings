  Key: ReleaseNotes
  Value: |-
    What's Changed
    - Updates: shared check-result dialog from craft-update by @aiongg in https://github.com/storytold/soundcraft/pull/1219
    - docs: tidy agent, contributor and release docs by @aiongg in https://github.com/storytold/soundcraft/pull/1218
    - Clip menu: act on the whole edit selection when the right-clicked clip is part of it by @ydking0911 in https://github.com/storytold/soundcraft/pull/1196
    - Zoom Toggle: Alt+Shift+E and Alt-click cancel it and keep the current view by @dotCooCoo in https://github.com/storytold/soundcraft/pull/1101
    - Mix: clamp clip-FX gain and send-level automation (fixes #884) by @SusieeTheLinuxUser in https://github.com/storytold/soundcraft/pull/1126
    - Fix integer overflow in AutomationLane::value_at for distant breakpoints by @Silvertree2010 in https://github.com/storytold/soundcraft/pull/1215
    - Fix overflow in GridValue::step_samples at extreme positions by @Silvertree2010 in https://github.com/storytold/soundcraft/pull/1216
    - Fix overflow in TempoMap bar math with a meter near i64::MAX by @Silvertree2010 in https://github.com/storytold/soundcraft/pull/1220
    - Fix remove_dc mean when a channel has non-finite samples by @Silvertree2010 in https://github.com/storytold/soundcraft/pull/1221
    - Reject oversized CAF cookie lengths by @TheGalitube in https://github.com/storytold/soundcraft/pull/1200
    - Reject skipped drop-frame timecode labels by @TheGalitube in https://github.com/storytold/soundcraft/pull/1201
    - Reject overflowing WAV byte rates by @TheGalitube in https://github.com/storytold/soundcraft/pull/1202
    - Keep RMS finite for large samples by @TheGalitube in https://github.com/storytold/soundcraft/pull/1222
    - Reject overflowing FLAC vendor string lengths by @kk376 in https://github.com/storytold/soundcraft/pull/1211
    - fix(engine): bound MIDI import tempo and track floods (#890) by @kk376 in https://github.com/storytold/soundcraft/pull/1212
    - automation: test that Remote returns app errors unchanged by @Silvertree2010 in https://github.com/storytold/soundcraft/pull/1128
    - Saturate H.264 POC type 0 bottom field order count by @Silvertree2010 in https://github.com/storytold/soundcraft/pull/1226
    - Fix H.264 DPB integer overflow on huge pic num differences by @Silvertree2010 in https://github.com/storytold/soundcraft/pull/1229
    - Default range start to the selection start in range_param by @Silvertree2010 in https://github.com/storytold/soundcraft/pull/1214
    - Play transport.play at the requested position, not the selection by @Silvertree2010 in https://github.com/storytold/soundcraft/pull/1075
    - Keep plugin parameter id case in AutoParam::parse by @Silvertree2010 in https://github.com/storytold/soundcraft/pull/1227
    - packaging(flatpak): add OCI image build and GHCR publishing helper by @dylanmtaylor in https://github.com/storytold/soundcraft/pull/1233
    New Contributors
    - @ydking0911 made their first contribution in https://github.com/storytold/soundcraft/pull/1196
    - @kk376 made their first contribution in https://github.com/storytold/soundcraft/pull/1211
