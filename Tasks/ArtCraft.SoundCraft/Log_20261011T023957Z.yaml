  Key: ReleaseNotes
  Value: |-
    What's Changed
    - Nudge clip gain with Ctrl+Shift+Up/Down on Windows and Linux too by @grovebit in https://github.com/storytold/soundcraft/pull/105
    - Keep the MIDI editor dock at its resized height by @reoniazx in https://github.com/storytold/soundcraft/pull/113
    - Stop playback when replacing the session by @reoniazx in https://github.com/storytold/soundcraft/pull/110
    - fix(ui): follow live system appearance changes by @coygeek in https://github.com/storytold/soundcraft/pull/85
    - Point I/O Setup rename and delete at setup.io. by @vbasky in https://github.com/storytold/soundcraft/pull/116
    - Send Tempo Operations stretch as a factor. by @vbasky in https://github.com/storytold/soundcraft/pull/117
    - Allocate Mix Window View menu paths once. by @vbasky in https://github.com/storytold/soundcraft/pull/118
    - Open New Tracks and Bounce only from the menu. by @vbasky in https://github.com/storytold/soundcraft/pull/119
    - Snap selected clips to their neighbours instead of past them. by @vbasky in https://github.com/storytold/soundcraft/pull/120
    - Put Cut All Automation on the clipboard. by @vbasky in https://github.com/storytold/soundcraft/pull/121
    - Give same-named clip exports their own files. by @vbasky in https://github.com/storytold/soundcraft/pull/122
    - Progress docs to the craftrules standard; re-measure against Pro Tools 2026.4.1 by @echelon in https://github.com/storytold/soundcraft/pull/155
    - Release 0.5.0: linux-riscv64 tarball, version bump by @echelon in https://github.com/storytold/soundcraft/pull/165
    New Contributors
    - @coygeek made their first contribution in https://github.com/storytold/soundcraft/pull/85
