  Key: ReleaseNotes
  Value: |-
    What's Changed
    - macOS DMG: branded window background and icon layout by @XusBadia in https://github.com/storytold/soundcraft/pull/12
    - Fix FreeBSD CI: VST3 editor tests expect 'unsupported' off macOS by @echelon in https://github.com/storytold/soundcraft/pull/44
    - Fix debug overflow panic on the first automation-write pass by @reoniazx in https://github.com/storytold/soundcraft/pull/37
    - fix(Play Audio): Resume the web AudioContext on the first user gesture by @hamada147 in https://github.com/storytold/soundcraft/pull/39
    - Fix keyboard shortcuts on Windows and Linux: Ctrl is the Cmd key (#15) by @MarekSpodBiedry in https://github.com/storytold/soundcraft/pull/20
    - Pause playhead follow when the timeline is moved away during playback by @reoniazx in https://github.com/storytold/soundcraft/pull/36
    - Fix tempo change from the tempo ruler not saving by @Garygunn94 in https://github.com/storytold/soundcraft/pull/25
    - Make the Click option audible: metronome in live playback by @Garygunn94 in https://github.com/storytold/soundcraft/pull/26
    - Fix input monitoring pitch and dropouts when input and session rates differ by @Garygunn94 in https://github.com/storytold/soundcraft/pull/28
    - Keep the clip context menu open while moving onto it by @Garygunn94 in https://github.com/storytold/soundcraft/pull/29
    - Use fontconfig for Linux system fonts by @vbasky in https://github.com/storytold/soundcraft/pull/31
    - Desktop: write log records to standard error and a rotating log file by @switch87 in https://github.com/storytold/soundcraft/pull/11
    - Fix the crash on quit after a VST3 scan: run module exits on the entry thread by @ebbicott in https://github.com/storytold/soundcraft/pull/17
    - Plugin menus by vendor (scrollable), Audio Units inserts, and an instrument picker by @ebbicott in https://github.com/storytold/soundcraft/pull/23
    - Default Windows startup to DirectX 12 by @DWAA1660 in https://github.com/storytold/soundcraft/pull/34
    - macOS: move application menus to the system menu bar by @reoniazx in https://github.com/storytold/soundcraft/pull/10
    - Add a selectable Light theme by @vbasky in https://github.com/storytold/soundcraft/pull/32
    - soundcraft-cli --help: stop at the closing code fence, no Rust source lines (#48) by @MarekSpodBiedry in https://github.com/storytold/soundcraft/pull/51
    - CLI: run --cmd and app reject malformed JSON instead of using empty params (#50) by @MarekSpodBiedry in https://github.com/storytold/soundcraft/pull/52
    - Warn about missing media when opening a session (#57) by @MarekSpodBiedry in https://github.com/storytold/soundcraft/pull/58
    - convert and bounce: refuse output extensions the encoder cannot write instead of saving WAV data (#47) by @MarekSpodBiedry in https://github.com/storytold/soundcraft/pull/53
    - Honor file.import_audio new_tracks (#60) by @salignatmoandal in https://github.com/storytold/soundcraft/pull/61
    - inspect: report sources[].loaded for agents by @salignatmoandal in https://github.com/storytold/soundcraft/pull/65
    - Show Ctrl instead of Cmd in shortcut text off macOS (#62) by @MarekSpodBiedry in https://github.com/storytold/soundcraft/pull/66
    - Report session audio health without changing the session by @vbasky in https://github.com/storytold/soundcraft/pull/54
    - Change clip gain with Ctrl+Shift+Up/Down and a fader on the clip by @grovebit in https://github.com/storytold/soundcraft/pull/76
