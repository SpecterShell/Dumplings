  Key: ReleaseNotes
  Value: |-
    What's Changed
    - Add shared docking with SoundCraft theme and MIDI sizing by @skylartaylor in https://github.com/storytold/soundcraft/pull/167
    - ci: refactor workflows to use storytold/craft-common-actions by @dylanmtaylor in https://github.com/storytold/soundcraft/pull/184
    - Keep each consolidation in its own audio file. by @vbasky in https://github.com/storytold/soundcraft/pull/123
    - Save a session copy without retargeting the open document. by @vbasky in https://github.com/storytold/soundcraft/pull/124
    - Export MIDI controllers and honour the tracks filter. by @vbasky in https://github.com/storytold/soundcraft/pull/125
    - Import multichannel audio onto a track of the same width. by @vbasky in https://github.com/storytold/soundcraft/pull/128
    - Keep going when the CLI's stdout is closed. by @vbasky in https://github.com/storytold/soundcraft/pull/126
    - Treat dotted command ids as engine.execute in the CLI app shorthand. by @vbasky in https://github.com/storytold/soundcraft/pull/127
    - Restore full playback speed when transport stops. by @vbasky in https://github.com/storytold/soundcraft/pull/129
    - Keep clip gain when AudioSuite inverts or duplicates. by @vbasky in https://github.com/storytold/soundcraft/pull/130
    - Render a named bus when bouncing, and reject an unknown one. by @vbasky in https://github.com/storytold/soundcraft/pull/131
    - Bake varispeed into rendered clip gain, then stop stretching it again. by @vbasky in https://github.com/storytold/soundcraft/pull/132
    - Compensate for an aux insert's latency on the same block that measures it. by @vbasky in https://github.com/storytold/soundcraft/pull/133
    - Convert only the selected volume automation into clip gain. by @vbasky in https://github.com/storytold/soundcraft/pull/134
    - Credit Vikram Bhaskaran by real name and display name. by @vbasky in https://github.com/storytold/soundcraft/pull/135
    - MCP batch: surface failures when keep_going is set (#145) by @salignatmoandal in https://github.com/storytold/soundcraft/pull/146
    - fix(theme): restore Light Mix Instrument label contrast by @coygeek in https://github.com/storytold/soundcraft/pull/177
    - CI: FreeBSD and Windows ARM64 nightly and on release, not per PR by @echelon in https://github.com/storytold/soundcraft/pull/178
    - macOS: build the DMG with hdiutil create so the app passes codesign --strict by @itrycodinganditsbad in https://github.com/storytold/soundcraft/pull/197
    - Windows: compile DX12 shaders with FXC by @itrycodinganditsbad in https://github.com/storytold/soundcraft/pull/198
    - Release workflow: pass the Azure signing secrets by @echelon in https://github.com/storytold/soundcraft/pull/203
    - perf: adapt meter polling and repaint rate by @Jafz2001 in https://github.com/storytold/soundcraft/pull/207
    - perf: reuse realtime mix buffers by @Jafz2001 in https://github.com/storytold/soundcraft/pull/208
    - Cmd+= only switches Mix/Edit, and the Interface scale slider drags smoothly by @grovebit in https://github.com/storytold/soundcraft/pull/147
    - Cmd+H heals instead of hiding SoundCraft on macOS (#140) by @grovebit in https://github.com/storytold/soundcraft/pull/148
    - Keep armed tracks' meters live while stopped; make Clear All Clip Indicators work by @grovebit in https://github.com/storytold/soundcraft/pull/187
    - Save safety: never overwrite audio or sessions, sync saves and keep backups by @grovebit in https://github.com/storytold/soundcraft/pull/195
    - fix(mix): push an instrument's stored params to its plugin before each block (#152) by @rollroyces in https://github.com/storytold/soundcraft/pull/181
    - Record takes straight to disk by @grovebit in https://github.com/storytold/soundcraft/pull/84
    - Shift+Cmd+K exports clips as files by @grovebit in https://github.com/storytold/soundcraft/pull/70
    - Clear clips and audio files from the Clip List (#4) by @grovebit in https://github.com/storytold/soundcraft/pull/75
    - Scroll long plugin windows; reopen the main window at its last size and scale by @grovebit in https://github.com/storytold/soundcraft/pull/188
    - Keep macOS plugin editors out of the Dock by @Jafz2001 in https://github.com/storytold/soundcraft/pull/202
    - Improve mixer routing menus and numeric controls by @Jafz2001 in https://github.com/storytold/soundcraft/pull/200
    - rustfmt the mix.send spec by @echelon in https://github.com/storytold/soundcraft/pull/211
    - Web: open, import, save and export files in the browser (fixes #63, fixes #64) by @natocool2 in https://github.com/storytold/soundcraft/pull/158
    - Fix drag selection and the insertion point in the Edit window by @grovebit in https://github.com/storytold/soundcraft/pull/49
    - Trackpad-friendly Edit window: smooth panning, pinch and Cmd+scroll zoom by @grovebit in https://github.com/storytold/soundcraft/pull/56
    - Let the desktop app sleep when idle or covered by @grovebit in https://github.com/storytold/soundcraft/pull/192
    - Clip > Rename opens its dialog; Undo and Redo name their step; the Window menu's keys work by @grovebit in https://github.com/storytold/soundcraft/pull/160
    - Ask before discarding unsaved changes; Save opens Save As for new sessions by @grovebit in https://github.com/storytold/soundcraft/pull/157
    - Add a built-in Sampler instrument by @scottcampbelldata in https://github.com/storytold/soundcraft/pull/108
