  Key: ReleaseNotes
  Value: |-
    Open Energy Studio v2026.45.0
    Programmaversie 2026.45.0, rekenkern 0.6.0.
    - Het goedgekeurde Snap Store-logo is verwerkt in de app, titelbalk, startweergave en toepassingsiconen.
    - De oorspronkelijke PNG, bronhash en reproduceerbare generatie staan in docs/branding/.
    - Deze uitgave bevat de huidige rekenkern. De versiegebonden rekenkernwijzigingen en handleiding horen bij deze bronversie. De versiegestempelde HTML-handleiding en het poortbewijs zijn ook als releasebestanden bijgevoegd.
    Controle en status
    De releasecontrole en platformbuilds zijn geslaagd, inclusief de volledige NTA-poort en Rust 1.77.2. Het bijbehorende poortbewijs staat bij die workflowrun.
    Dit blijft een voorlopige uitgave. Open Energy Studio is nog niet geattesteerd onder BRL 9501; deze logo-update verandert die status niet.
    Goedgekeurd app-logo
    Deze versie gebruikt het goedgekeurde Snap Store-logo in de app en actieve toepassingsiconen. De oorspronkelijke PNG, bronhashes en reproduceerbare generatie staan in docs/branding/.
