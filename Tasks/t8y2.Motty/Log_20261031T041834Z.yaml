  Key: ReleaseNotes
  Value: |-
    新功能
    - 新增「会话日志」页，在本机记录每次连接的目标、开始时间与结束方式，可按时间、状态、协议和收藏筛选。
    - 会话记录可以在设置里关闭，也能只清除收藏之外的记录或全部清除。
    - AI 助手的目标列表可以勾选多个连接，一个问题最多带上七个连接的内容。
    - 分隔标签页里的终端可以在右键菜单里重命名，选项和 @ 提及里能区分它们了。
    - 终端配色新增 Windows Terminal 的默认配色。
    - MCP 客户端配置新增 Pi Coding Agent。
    改进
    - 点击侧栏和设置分类时，图标会播放一次与字形含义相符的动效。
    修复
    - Tailscale SSH 连接会启用 shell 集成，文件面板重新跟随工作目录。
    - 提供方把工具调用写成文本时，助手会照常执行，而不是把标记当成回答。
    - 回答达到模型的输出上限时会注明末尾被截断。
    - 模型长时间不返回数据时，对话会结束并报错，而不是一直等待。
    - 工作台的主机卡片会显示地址，勾选框与文字居中对齐。
    - AI 助手的目标列表按最长一行决定宽度，较长的连接名不再被截断。
