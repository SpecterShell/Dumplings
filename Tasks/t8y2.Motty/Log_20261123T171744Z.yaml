  Key: ReleaseNotes
  Value: |-
    新功能
    - 快捷命令的分组支持多层嵌套，用 / 分隔，例如 Clients/Prod。
    - 终端里按住主修饰键（macOS 为 Command，Windows、Linux 为 Ctrl）加滚轮可以调整字号。
    - SSH 隧道可以自定义监听地址，默认仍只监听本机；这个设置只保存在本机，不随同步传播。
    - MCP 设置里可以查看对代理开放的主机，按分组显示并支持搜索。
    - 主机名可以在不同分组里重复。
    改进
    - 笔记页新增整行“新建笔记”按钮，没有笔记时有引导。
    - 切换更新源时，更新对话框保持打开并显示检查进度。
    - RDP 连接始终发送桌面缩放信息，改善 Windows 10 和 Server 上远端任务栏与 DPI 的显示。
    - 同一个堡垒机账号下各主机的文件窗口会复用各自终端的连接设置；SFTP 上传按偏移顺序发送，兼容要求顺序写入的服务端。
    修复
    - 缩放高于 100% 的显示器上，远程桌面在 100% 时按自身分辨率绘制，不再被放大。
    - 窗口最小化后退出，再次启动不会跑到屏幕角落。
    - 监控面板的手动排序拖拽恢复正常。
    - SFTP 列表刷新和搜索结果会显示系统文件类型图标。
    - OpenCode 端点的请求会带上会话标识。
