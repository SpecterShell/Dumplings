  Key: ReleaseNotes
  Value: |-
    新功能
    - SFTP 文件列表里可以直接行内重命名文件，侧栏、双栏窗口和标签页通用。
    - SFTP 文件可以拖出应用到桌面。
    - 工具栏按钮可以把输入广播到所选标签页。
    - 没有 Docker 时可以管理 Podman 容器。
    - Gitee 代码片段备份支持超过 1 MB 的内容。
    - 传输中心在涉及多台服务器时，按服务器分段显示。
    改进
    - SFTP 文件操作图标重新设计，上传、新建、返回上级一目了然。
    - 工作区命令按钮移到主机名称旁，地址不再被截断。
    - 多显示器的大尺寸 VNC 桌面不再被拒绝连接。
    修复
    - 在笔记文件夹内新建子文件夹不再崩溃。
    - 右键菜单重命名标签后，输入框立即获得焦点。
    - 工作区命令说明不再重叠显示。
    - 重命名遇到已存在的文件时可以替换。
    - 延迟突增后，后台端口转发会继续重试。
    - VNC 支持光标伪编码并显示本地指针。
