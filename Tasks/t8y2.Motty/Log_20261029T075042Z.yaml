  Key: ReleaseNotes
  Value: |-
    Motty 0.1.8：文件面板可以同步浏览两侧目录、保存成对的位置档案并收藏目录；文件可以直接拖到服务器终端上传；标签页可以锁定，本地标签会记住目录；Windows 多了便携版 zip 和 WSL 本地 Shell；程序会把日志和崩溃报告留在数据目录，启动失败时告诉你原因；AI 助手能在对话里切换审批范围，提示词前缀命中缓存后更快也更省。
    新功能
    - 文件面板同步浏览与位置档案。 双窗格可以开启「同步浏览」：进入一侧目录时，另一侧自动跳到对应目录；离开配对目录或名称无法映射时会暂停并说明原因。位置档案保存成对目录（本地可选、服务器必填），打开时两侧一起切换，可限定当前连接或所有连接复用。
    - 收藏与快捷位置。 文件面板侧边栏新增「收藏与快捷位置」：收藏当前目录，并列出主目录、桌面、下载、文档、图片、音乐、影片、应用程序和本机磁盘，点一下就跳转。
    - 拖文件到服务器终端即上传。 把系统文件拖到已连接 SSH 服务器的终端上，会通过 SFTP（没有时用 SCP）传到 shell 报告的目录，没有报告时用文件面板的目录；终端上会标出目标位置，开始和结束各有一条提示，传输中心不抢键盘。本地终端和容器会话保持原样。
    - 标签页锁定。 标签页右键可以锁定/解锁；关闭已锁定的标签（或包含它们的批量关闭）会先列出会话将被断开，确认后才关。本地标签页会记住并恢复上次的目录。
    - Windows 便携版 zip。 发布包新增 motty-<ver>-windows-<arch>.zip：解压后数据放在 motty.exe 旁的 motty-data，主机、设置、已知主机、保险库和 AI 数据都在里面，换机器时整个文件夹一起带走。便携版靠主密码保存口令，需要先在设置里设一个；应用内更新不会替换便携版，会引导到下载页。
    - WSL 作为本地 Shell。 设置 > 终端 > 本地 Shell 会列出已安装的 WSL 发行版，用发行版里的登录 shell 打开终端；文件面板通过 \\wsl.localhost 跟随 WSL 里的目录，拖到终端的路径按发行版看到的形式输入。
    - 诊断日志与崩溃报告。 数据目录的 logs 里保存 motty.log，异常退出还会留下运行时崩溃报告；下次启动会说明上次崩溃，诊断报告也带上它。启动失败（包括单实例冲突）会弹窗说明原因和日志位置，不再静默退出；再次启动会把已运行的窗口带到前面（登录自启除外）。
    - 快捷命令从页面直接发送。 每条快捷命令新增「发送到终端」按钮，双击行也能发送，右键菜单有发送、编辑、删除；开了多个终端时先选目标，发送后状态栏标明发到了哪个终端。
    - 对话内切换审批范围。 AI 助手里可以按低、中、高三档切换本次对话的自动执行范围，每档都写明哪些操作免确认；请求进行中或有待确认操作时不能切换。
    - 远程工具搜索。 进程和资源窗口可以按 PID、用户、命令或资源名称搜索已加载的快照，显示匹配数与总数；快照或命令被截断时会提示未匹配不代表主机上没有。
    改进
    - AI 助手的提示词前缀接入 Anthropic 的缓存断点，多步工具调用不再反复处理未变化的前缀；回答下方的用量行显示缓存命中的 token 数。
    - 文件面板读取大目录或遇到读取出错时如实说明：显示已加载项、加载上限、跳过项和读取错误，筛选只覆盖已加载的项目，不再当作完整目录。
    - 双窗格两侧的筛选、隐藏文件和排序各自作用于自己的窗格；表头菜单可以按名称、大小、修改时间排序，切换后尽量保留原来的选中项。
    - 传输中心可以「重试失败项」并处理冲突，范围限定在捕获到的那批失败任务（按连接和来源），不会改变后续传输的默认行为。
    - Bash 4.2 / 4.3（例如 CentOS 7）上「终端跟随文件栏目录」也能用了：通过私有的 DEBUG trap 上报命令开始，不改服务器上的启动文件；确实无法同步时会说明是缺少命令开始标记，而不是让人去结束一个并不存在的命令。
    - 私钥口令对话框会说明需要先在设置里设主密码，而不是承诺一个不会出现的保存框。
    修复
    - 导入 PuTTY .ppk 时，Private-MAC 长度不对不再被当成校验通过；Argon2 参数被限制在合理范围，损坏的密钥文件不会再要求离谱的内存或时间。
    - 从分屏布局回到单窗格后，终端恢复完整输出和宽度，不再留下窄化时被截断的行。
    - 关闭标签页后，正在进行的文本输入按会话 id 路由，不会串到别的终端。
    - 远程进程和资源窗口会标出快照采集时间；快照过期、进程实例已变化或身份无法验证时拒绝执行变更，并说明该刷新还是该重选。
    - 关闭标签页和远程工具的几处边角问题：标签数上限不再可能触发越界，锁定标签在拥挤的标签栏里保留自己的位置，本机的短/长主机名都能识别为本地目录上报，容器日志按与其他操作相同的权限检查，空列表不再被误报为进程身份问题。
