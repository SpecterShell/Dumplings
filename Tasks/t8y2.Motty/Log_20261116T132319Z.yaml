  Key: ReleaseNotes
  Value: |-
    新功能
    - 主机页可以用树形面板显示分组层级，拖动分组即可调整顺序或嵌套。
    - 凭据可以保存登录名，主机选择同一凭据时使用它登录。
    - 界面字体和终端字体可以分别选择字重。
    - 本地标签页显示对应编码助手的图标。
    - 服务器日志可以在终端工具栏中拖动到其他位置。
    改进
    - 传输中心把运行中的任务排在排队任务之前。
    - 传输中心与 SFTP 传输队列把失败的任务排在最前，便于重试或处理。
    - 密码字段的凭据选择改为字段末尾的箭头。
    - SFTP 文件地址栏的面包屑可以逐级返回上级目录。
    修复
    - 修复服务器拒绝新通道时 SFTP 无法连接的问题，SFTP 会为自己单独建立连接。
    - 修复从 Finder 启动时，Homebrew 安装的编码助手因找不到 node 而无法登录的问题，现在使用登录 shell 的 PATH 运行。
    - 修复服务器日志与快捷命令栏重叠的问题。
    - 修复 Gist 备份超过 1 MB 时无法读回、同步提示过大的问题。
