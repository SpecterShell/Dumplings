  Key: ReleaseNotes
  Value: |-
    新功能
    - 终端标签的标题可以选择显示连接名、终端标题或当前路径，手动改过的名字优先。
    - 新增内置终端配色方案，深色和浅色外观各自记住所选方案，并支持搜索。
    - 代码片段选择器的分组默认折叠，搜索仍能找到折叠分组里的片段；列表下方的命令框可以把一行命令发送到当前终端、所有已连接终端或勾选的终端，可选是否回车。
    - AI 助手的 Agent 模式可以选择本地文件上传到 SSH 主机；超过附件读取上限的文件会提示改用上传按钮。
    - 主机表单里新增跳板路由入口，跳板路由和端口转发里的主机选择器可以按名称、地址、账号、分组和标签搜索。
    - 已保存的主机可以从标签菜单里直接编辑。
    - 延迟读数可以停靠到工具栏，位置和顺序会保存。
    - 手动输入的会话名可以和其他标签重名，AI 助手的 @ 引用仍然各自指向唯一的终端。
    - 串口主机有了自己的图标，切换到串口协议时自动选中。
    - SFTP 支持多选后一次删除。
    改进
    - 分组的竖向标签改用统一的树键盘导航，上下键在两端不再循环。
    - 「代理」页改名为「跳板路由」，主机里的「代理转发」改为「出站代理」，不再和跳板路由混淆。
    - Windows 上悬停托盘图标会显示产品名和版本。
    - 右键复制/粘贴模式下，有选中文字时右键复制，没有选中时粘贴，Shift+右键打开菜单。
    修复
    - 从文件备份恢复时，自定义快捷键也会一并恢复。
    - 远程桌面支持 RealVNC 的 RSA-AES 认证。
    - 独立 MCP 服务只在开放传输工具时才在 sftp_read 里提示 sftp_download，并说明如何开启传输。
    - 在已经停止应答的网络上取消上传不再卡住。
