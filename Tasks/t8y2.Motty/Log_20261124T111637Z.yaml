  Key: ReleaseNotes
  Value: |-
    新功能
    - 设置新增圆角或直角的外观选项，外观设置移到独立分类。
    - 上传提议直接打开文件选择器。
    - 主机用户名留空时显示默认登录账号。
    - RDP 新增 TLS 兼容模式，可连接较旧的 Windows 服务器。
    改进
    - 标签页（窗口栏和侧边栏）在位置变化和拖放时带滑动动画。
    - 资源库行的展开箭头带弹性动效。
    - 已知主机列表可以滚动，并可切换每页数量。
    修复
    - 批量上传时 SFTP 目录列表会及时刷新。
    - 在终端里按 Tab 后，预测输入的文字会保留到回显到达。
    - SFTP 用系统编辑器打开非文本文件。
    - 终端输出嘈杂时，SFTP 文件在独立连接上打开。
    - PROMPT_COMMAND 只读时仍能上报当前文件夹。
    - 本地 zsh 首个提示符不再出现多余的 %。
    - XMODEM/YMODEM 传输开始时忽略多余的 NAK。
    - 精简设置页里重复的说明文字。
