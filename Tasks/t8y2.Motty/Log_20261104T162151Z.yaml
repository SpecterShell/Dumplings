- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新功能
    - 标签菜单新增「移动到新窗口」，也可以把标签拖出窗口；macOS 上拖拽时有跟随指针的标签预览。
    - 远程主机可以「通过本机代理」：用 SSH 隧道把本机 HTTP 代理暴露给服务器，一键复制配置和撤销命令，并附 Docker 设置。
    - 主机分组可以一键展开或收起，主机列表的筛选条件会被保留。
    - 主机列表和新建标签的主机选择会匹配每一个关键词，不再要求整串相同。
    - 命令补全的历史匹配最多列出 5 条。
    - Windows 和 Linux 上可以用 Control+1–9 直接跳到对应标签页。
    - 下载完成后可以在文件管理器中「打开所在位置」。
    - 新增 Homebrew cask 与 Scoop manifest：brew install --cask t8y2/tap/motty 或 scoop install t8y2/motty，之后随包管理器更新。
    - 标签标题默认跟随终端报告的名字，主机名只在程序没有报告标题时使用；可以在设置里关掉。
    改进
    - 侧边栏会记住上次调整的宽度。
    - 会话名居中显示在工作区上方，并避开两侧的按钮。
    - 窗口变窄时只保留一个抽屉，不再重复叠放。
    - 浅色主题更柔和：面板不再纯白，文字也略微柔化。
    - 仪表盘和工具栏的按钮按文字长度适配尺寸。
    - 终端判断字符宽度的常用路径更快。
    - 主机列表栏改用框架的滚动区域。
    修复
    - 垂直标签的滚动条在悬停时出现，并且可以拖动。
    - 悬停标签页会显示完整标题。
    - shell 启动较慢时，会把正确的终端尺寸同步给程序。
    - 系统信息探测超时不再导致整个会话断开。
    - 更新检查不再把签名未验证的包报告为缺失。
    - 分组筛选条上可以打开分组的右键菜单。
