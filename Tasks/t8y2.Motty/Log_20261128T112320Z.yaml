  Key: ReleaseNotes
  Value: |-
    新功能
    - 监控面板新增进程、内存和监听端口视图，可按 CPU、内存、PID 或名称排序并搜索进程。
    - 设置新增「外观跟随终端配色」，开启后窗口标题栏、标签页与侧边栏随当前终端配色方案切换。
    - 设置新增「终端滚动条宽度」，可选细、适中、宽。
    - 远程桌面（RDP）支持转发本地麦克风。
    - 底部快捷命令栏可拖动上沿增加行数，双击复原。
    改进
    - 端口转发被服务器拒绝时显示原因和处理建议，远程转发同样说明可能的限制。
    - 在密码提示框保存密码后，成功或失败都以通知显示。
    修复
    - 卡片视图拖拽分组：放到目标分组标题的上、下边缘为排序，放到中间为放入，分组可以拖回上一层。
    - 设置页打开时「关闭面板」关闭设置页，不再误关背后的终端标签。
    - 切换页面时保留文件面板，并在回到页面时刷新。
    - Gemini 工具调用所需的思考签名随对话历史回传，多轮工具调用不再被拒绝。
    - 垂直标签侧栏在展开的文件标签上仍可点击和右键。
    - SFTP 文件筛选框输入时光标滚到可见位置。
    - 端口转发与代理页的头部按钮、空状态和底部位置一致，切换时内容不再上下跳动。
