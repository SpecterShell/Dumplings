  Key: ReleaseNotes
  Value: |-
    新功能
    - 支持 TRZSZ 文件传输（trz / tsz，含文件夹），确认窗口与进度卡片和 ZMODEM 一致。
    - 远程桌面可以粘贴本机剪贴板里的图片，截图和从浏览器复制的图片都能直接贴进远程系统。
    - 终端关键词高亮规则可以使用自定义的 HEX / RGB 颜色。
    - 设置 > 连接 新增“SSH 浏览器”，可在自动、Google Chrome、Microsoft Edge、Chromium 之间选择。
    - 监控面板新增 GPU 数据，并调整了版面。
    - 容器列表显示 CPU 和内存占用，详情窗口新增启动命令、端口、挂载、网络、重启策略等 docker inspect 信息。
    - 文件传输窗口可以对批量冲突一次选择“全部覆盖”或“全部跳过”。
    - 关于页的项目链接里加入 Viva。
    改进
    - 打开远程文件的速度大幅提升：4 MiB 日志在 50 ms 延迟下从约 7 秒降到约 0.5 秒。
    - 快捷命令在输入时会内联联想已配置的命令。
    - 位置配置按钮改为点击打开菜单，不再停留预览。
    修复
    - 登录脚本启动 tmux 等全屏程序时，终端不再卡住 8 秒，也不会在提示符处出现 “62;22c” 之类的乱码。
    - 每次提示符出现都会清屏的问题已修复。
    - 远程桌面兼容 Windows 8 / Server 2012（RDP 8.0 管线）：画面不再发黑或残留碎片。
    - 远程桌面重置后保留服务器仍在绘制的画面。
    - 删除文件夹里最后一台主机后，文件夹不再消失。
    - 从传输窗口下载含冒号等 Windows 不接受的文件名时，会自动换成安全的本地文件名。
    - macOS 上本机终端里的程序可以使用麦克风。
