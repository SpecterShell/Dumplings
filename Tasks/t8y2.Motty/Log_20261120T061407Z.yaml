  Key: ReleaseNotes
  Value: |-
    新功能
    - 广播输入可以绑定快捷键：macOS 默认 Command+Option+I，其他平台默认 Control+Shift+I，也能在“键盘快捷键”页改动或清除。
    - SSH 密钥页新增“导出密钥”，把选中的私钥按保存时的原样写成文件，带口令的私钥仍然受口令保护。
    改进
    - 设置页以可关闭的“设置”标签页出现在窗口栏上，打开设置时其他标签页仍一键可达。
    - CNB 更新源改为按增量补丁下载，不再每次都拉完整安装包。
    修复
    - 导入的密钥文件会存进 Motty，原文件移动或删除后依然可用，也会随保险库同步到其他电脑。
