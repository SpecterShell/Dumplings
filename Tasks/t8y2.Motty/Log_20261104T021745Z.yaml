  Key: ReleaseNotes
  Value: |-
    新功能
    - 工作区：把多台主机的终端组合保存为工作区，一次打开，也可以存成模板再编辑；终端按网格排列。
    - 远程进程管理补全：可以列出远程进程并查看 PID、父进程、用户、状态、CPU 和内存，面板可开成独立窗口。
    - AI 设置可以逐个或批量「测速」模型端点，只列出可用于对话或推理的模型；批量探测可设置并发数和超时。
    - 快捷键可以绑定任意按键或组合：单键、标点、空格、导航键、F1–F12，搭配任意修饰键。
    - 会话日志可以排序和筛选，并记住上次的视图。
    - 新建标签的主机选择可以按最近登录排序，并显示「刚刚」「N 秒前」这类时间。
    - 后台终端输出提醒：标签标题用颜色提示未查看的输出——蓝色表示输出中，绿色表示结束或静默，黄色表示命令失败。
    - 导入时可以保存导出文件里可读取的明文 SSH 密码，导入前会列出数量并确认，且不覆盖已有密码；MobaXterm 文件编码有歧义时可以选择 UTF-8 或 GB18030。
    破坏性变更
    - 快捷键现在可以占用几乎任何按键，已绑定的按键会先触发快捷键，再到终端。默认绑定没有变化，只有你新增的绑定才会挡住程序。
    - macOS 上，没有绑定到 Motty 功能的 Command 组合，在程序启用 kitty 键盘协议后会转发给程序，不再被 Motty 丢弃。
    改进
    - 终端按字符宽度成批写入，并对连续相同样式只解析一次，滚动和大量输出更快。
    修复
    - 一个窗口在另一个窗口保存过之后会一直保存失败的问题已修复：现在会重新读取共享记录再保存。
    - 重连后的 shell 不再继承上一个程序的 kitty 键盘模式。
    - 主机标签的下拉选项不再被表单边界截断。
    - 跳板主机与目标主机的下拉框可以用滚轮滚动。
