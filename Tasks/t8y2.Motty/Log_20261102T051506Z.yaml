  Key: ReleaseNotes
  Value: |-
    新功能
    - 开启「与远程桌面共享剪贴板」的会话在前台时，本机复制的内容会直接同步过去，不必先移动鼠标。
    - Windows 上远程桌面接管键盘时，也会接管 Windows 键、Alt+Tab、Ctrl+Esc 等系统快捷键，交还键盘后恢复。
    - 远程桌面会把自己的指针形状显示为系统光标。
    - 主机可以用本机命令承载连接（%h、%p、%r 分别是主机、端口和用户）；从 SSH config 导入的 ProxyCommand 需要确认后才会执行。
    - 跳板路由可以手动启动和停止，列表显示运行状态，新连接按当前状态直连或经跳板。
    - 设置 → 连接 可以让本地终端跟随系统代理（HTTP_PROXY 等），默认不设置；对新建和重连的终端生效，WSL 除外。
    改进
    - 终端行号和时间栏改用等宽字形、亮青色和浅色底，时间列对齐了。
    - 设置 → 终端 新增「粗体文字」，可选亮色+加粗、亮色、加粗或不变；默认按亮色绘制，与 Windows Terminal 一致。
    修复
    - 终端字符格按整设备像素对齐，Windows 上 powerline 符号旁的细白线消失。
    - Windows 的 IdentityFile 路径里的反斜杠不再被当成转义。
    - 更新对话框的发布说明可以拖动滚动条。
    - 在 kitty 键盘模式下，Shift+Enter 会作为独立按键发送，Codex 等程序能区分换行和提交。
    - 文件面板的工具栏按钮可以关闭面板。
    - Windows 上数据目录位于某个文件之下时会直接报错，而不是稍后失败。
