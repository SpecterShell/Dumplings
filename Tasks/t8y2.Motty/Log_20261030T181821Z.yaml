  Key: ReleaseNotes
  Value: |-
    新功能
    - AI 助手可以拖入文件或图片一起提问，也可以用回形针选择。
    - 助手能读 Word、Excel 和 PowerPoint 文档，把内容作为附件带上。
    - 在输入框里粘贴剪贴板中的截图，会作为图片附件加入下一条消息。
    - 终端新增离线命令补全：Command+Shift+J（Windows、Linux 为 Control+Shift+J）列出能接在当前输入后的命令、子命令、选项和值。
    - 命令补全可以在设置里选择关闭、列表，或列表加内联灰字建议。
    - Windows 的本地终端可以按标签选择不同的 shell 或 WSL 发行版。
    - 快捷键新增「清屏」（macOS 为 Command+K，其他平台为 Control+K）。
    - 快捷键新增「下一个/上一个标签页」，默认 Control+Tab 和 Control+Shift+Tab。
    - macOS 上 Command+1..9 现在会切换标签页，并且在任何页面都生效。
    改进
    - AI 输入框的会话选择器字号和旁边的胶囊一致了。
    - 快捷键可以用 Tab、Page Up、Page Down、方向键这类命名键绑定。
    修复
    - 本地终端以 UTF-8 locale 启动，中文文件名和输出不再乱码。
    - 对只认 pty 和 shell 的网关不再发送 locale 请求，连接不会在打开 shell 前被断掉。
    - SFTP 列表滚到边缘后继续滚动不再抖动。
