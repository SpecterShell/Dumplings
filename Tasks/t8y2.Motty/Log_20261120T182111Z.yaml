  Key: ReleaseNotes
  Value: |-
    新功能
    - 导入的 SSH 密钥会一并保存旁边的用户证书（-cert.pub），密钥库新增“证书”操作和证书列。
    - 主机可以保存并复用 SOCKS5 / HTTP 出站代理配置，密码存进保险库，删除配置后主机恢复直连。
    - 本地 Shell 可以设置启动后命令，每次新建或重连执行一次，只保存在本机。
    - 服务器日志按面板宽度自动换行，可以选中、复制和全选。
    改进
    - 笔记的源码、分屏、预览切换合并成一组按钮。
    修复
    - 同一主机的多个标签页都显示连接名，不再自动加 -2 后缀。
    - 文件面板的“更多”菜单出现在按钮旁边，不再跑到面板左上角。
    - sudo、env、timeout、xargs 等包装命令后面的命令也能补全。
    - 按修饰键或松开按键不再取消终端里的选中内容，也不会跳回底部。
    - 通过 SSH 转发的远程桌面会正常提示输入用户名和密码。
    - 监控详情的空图表占位文字居中显示。
    - 从 MobaXterm 导入的主机不再带着用户名两侧的方括号，避免用错误的用户名登录。
    - 下载命令补全目录遇到中断会自动重试。
    - 浅色和深色主题下活动标签页更容易辨认。
