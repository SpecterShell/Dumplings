- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新功能
    - RDP 和 VNC 主机可以配置跳板路由：经 SSH 跳板访问桌面端口，桌面主机本身不需要运行 SSH。
    - 主机可以设置空闲保活：会话空闲一段时间后自动发送回车、空字符或自定义内容。
    - 本地终端按实际 Shell 显示不同图标，PowerShell、CMD、WSL 各自区分。
    - WSL 终端的文件面板在对应的 Linux 发行版内打开。
    - 支持 AIX 主机，带系统徽标并使用正确的退格键。
    改进
    - 更新控件移到「关于」页，与版本信息放在一起。
    - AI 助手面板的文字跟随界面的文字大小设置。
    修复
    - 修复 SSH 配置同步会把 Git 远程别名当成主机导入的问题。
    - 修复 Windows 应用内更新自动重启后，本地 PowerShell/CMD 中 Ctrl+C 失效的问题。
    - 修复切换到其他用户（出现密码提示）后，嵌套 Shell 的命令补全提示不出现的问题。
    - 修复 SFTP 文件面板「更多」菜单里重复出现名称、大小、修改时间排序的问题。
    - 修复 WSL 终端的监控数据在 Windows 主机而不是发行版内采集的问题。
    - 修复 mosh 会话中键盘输入重复、Tab 补全异常的问题。
    - 修复 sudo-rs 的密码提示无法被自动识别的问题。
    - 修复 Linux 安装包在 glibc 2.28 的发行版上无法启动的问题。
