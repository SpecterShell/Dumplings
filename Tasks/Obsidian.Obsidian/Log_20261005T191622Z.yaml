- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Improvements
    - Bases: Added “Hide column” to the right-click menu of a kanban column.
    - Bases: A base made with “Create new base” now names its first view “View” instead of “Table”.
    - Search in the File Explorer, Bookmarks, Outline, and Sync views now matches the full path of each item. Excluding a term (e.g. -Archive) now hides a matching folder and everything inside it.
    - The Outline and Outgoing links views now work for files opened from outside the vault.
    No longer broken
    - Bases: Fixed “Copy path” showing up below “Delete” when you right-click a file in a table, cards, or kanban view.
    - Bases: Fixed a base failing to load when a view’s groupOrder is not a list.
    - Bases: Fixed “Add group” in the Group menu not adding a group when selecting a link suggestion.
    - Fixed property suggestions sometimes showing results for an earlier query, which made Enter pick an old link instead of what you typed.
    - Fixed a memory leak in the metadata cache after opening and editing external files.
