- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    https://fluentbit.io/announcements/v5.1.5/
    What's Changed
    - api: v2: trace: plug leaks on trace requests with duplicated parameters by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12569
    - workflows: bump ossf/scorecard-action from 2.4.4 to 2.5.0 by @dependabot[bot] in https://github.com/fluent/fluent-bit/pull/12578
    - workflows: bump reviewdog/action-actionlint from 1.80.0 to 1.80.1 by @dependabot[bot] in https://github.com/fluent/fluent-bit/pull/12588
    - release: update to 5.1.5 by @github-actions[bot] in https://github.com/fluent/fluent-bit/pull/12591
    - tests: runtime: out_http: push JSON format records together by @edsiper in https://github.com/fluent/fluent-bit/pull/12600
    - router: apply input routes with a single input and output by @edsiper in https://github.com/fluent/fluent-bit/pull/12596
    - out_cloudwatch_logs: fix log stream leak when group allocation fails by @ParakhJaggi in https://github.com/fluent/fluent-bit/pull/12257
    - in_nginx_exporter_metrics: mitigate nginx plus response type confusion by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12609
    - lua: bound MessagePack reads when pushing values to Lua by @edsiper in https://github.com/fluent/fluent-bit/pull/12597
    - in_forward: mitigate forward trace decoding bypasses by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12615
    - http_server: address cumulative bytes on http2 headers by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12590
    - opentelemetry: in_opentelemetry: log_event_encoder: mitigate otel attributes quadratic encoding expansion by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12603
    - oauth2_jwt: mitigate leaks on duplicated JWT members by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12605
    - out_chronicle: add support for the Chronicle API by @cozybear-dev in https://github.com/fluent/fluent-bit/pull/12548
    - http_client: out_loki: Mitigate crlf injection on HTTP headers by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12613
    - filter_kubernetes: mitigate SEGV occurrences on using Use_Kubelet by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12580
    - out_http: add PATCH as an http method by @cestercian in https://github.com/fluent/fluent-bit/pull/12552
    - out_stackdriver: out_bigquery: out_chronicle: conceal jwt token on debug logs by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12604
    - in_collectd: mitigate collectd unaligned type read by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12606
    - filter_parser: free the previous parse buffer when Key_Name repeats by @cestercian in https://github.com/fluent/fluent-bit/pull/12539
    - out_stackdriver: fix cacheHit copied from cacheLookup in httpRequest by @riccardonar in https://github.com/fluent/fluent-bit/pull/12469
    - snappy: decompression: mitigate checksum fault on snappy decompression by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12614
    - in_tail: fix missed copytruncate after cached size refresh by @edsiper in https://github.com/fluent/fluent-bit/pull/12618
    New Contributors
    - @cozybear-dev made their first contribution in https://github.com/fluent/fluent-bit/pull/12548
    - @cestercian made their first contribution in https://github.com/fluent/fluent-bit/pull/12552
    - @riccardonar made their first contribution in https://github.com/fluent/fluent-bit/pull/12469
    Full Changelog: https://github.com/fluent/fluent-bit/compare/v5.1.4...v5.1.5
