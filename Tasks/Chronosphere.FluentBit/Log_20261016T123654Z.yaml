  Value: |-
    https://fluentbit.io/announcements/v5.1.4/
    What's Changed
    - release: update to 5.1.4 by @github-actions[bot] in https://github.com/fluent/fluent-bit/pull/12502
    - github: workflows: require publicly verified release metadata by @edsiper in https://github.com/fluent/fluent-bit/pull/12513
    - workflows: bump reviewdog/action-actionlint from 1.77.0 to 1.79.1 by @dependabot[bot] in https://github.com/fluent/fluent-bit/pull/12524
    - workflows: bump reviewdog/action-shellcheck from 1.34.0 to 1.34.1 by @dependabot[bot] in https://github.com/fluent/fluent-bit/pull/12514
    - output: fix failing internal output tests by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12509
    - filter_kubernetes: mitigate unbounded tag issue by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12530
    - in_opentelemetry: mitigate unbounded decompression of otlp gRPC by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12526
    - out_gelf: mitigate stuck issue on exceptions of UDP sockets by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12516
    - rewrite_tag: mitigate dropping metadata on rewrite tag by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12500
    - mp_preflight: in_forward: add object budget of unpacking msgpack objects by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12525
    - tests: integration: cover hot reload with glob includes by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12508
    - stream_processor: fix operator precedence for logical operations by @unitmatrix in https://github.com/fluent/fluent-bit/pull/9388
    - lib: flb_libco: upgrade to 1ae2c7f by @edsiper in https://github.com/fluent/fluent-bit/pull/12536
    - lib: cfl: upgrade to v1.0.2 by @edsiper in https://github.com/fluent/fluent-bit/pull/12537
    - workflows: bump helm/kind-action from 1.15.0 to 1.15.1 by @dependabot[bot] in https://github.com/fluent/fluent-bit/pull/12542
    - workflows: bump azure/setup-kubectl from 5.1.0 to 5.2.0 by @dependabot[bot] in https://github.com/fluent/fluent-bit/pull/12543
    - lib: zstd: only require a C compiler by @edsiper in https://github.com/fluent/fluent-bit/pull/12538
    - tests: fix signv4 fixtures with raw request targets by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12540
    - packaging: use archived Bullseye repositories by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12545
    - workflows: bump github/codeql-action/upload-sarif from 4.38.2 to 4.38.3 by @dependabot[bot] in https://github.com/fluent/fluent-bit/pull/12561
    - ripser.cpp: initialize temporary diameter entry by @AaronM3-97 in https://github.com/fluent/fluent-bit/pull/12533
    - multiline: enforce multiline_buffer_limit for EQ and ENDSWITH types by @psghahremani in https://github.com/fluent/fluent-bit/pull/12289
    - filter_kubernetes: fix uninitialized mem edge case by @runderwo in https://github.com/fluent/fluent-bit/pull/12078
    - build: enable C++ before configuring zstd with MSVC by @edsiper in https://github.com/fluent/fluent-bit/pull/12566
    - build: Enclose _C and _CXX and other variables with parentheses by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12567
    - workflows: bump actions/download-artifact from 8.0.1 to 8.0.2 by @dependabot[bot] in https://github.com/fluent/fluent-bit/pull/12562
    - workflows: bump actions/upload-artifact from 7.0.1 to 7.0.2 by @dependabot[bot] in https://github.com/fluent/fluent-bit/pull/12563
    - workflows: bump reviewdog/action-actionlint from 1.79.1 to 1.80.0 by @dependabot[bot] in https://github.com/fluent/fluent-bit/pull/12564
    - workflows: move Windows container storage to the build drive by @edsiper in https://github.com/fluent/fluent-bit/pull/12575
