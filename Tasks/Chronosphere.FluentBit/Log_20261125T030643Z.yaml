  Key: ReleaseNotes
  Value: |-
    https://fluentbit.io/announcements/v5.2.1/
    What's Changed
    - release: update to 5.2.1 by @github-actions[bot] in https://github.com/fluent/fluent-bit/pull/12767
    - workflows: bump actions/setup-python from 7.0.0 to 7.1.0 by @dependabot[bot] in https://github.com/fluent/fluent-bit/pull/12662
    - lib: wasm: fix 64-bit heap relocation on Windows by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12760
    - maintainers: update maintainers list and code owners by @edsiper in https://github.com/fluent/fluent-bit/pull/12785
    - wasm: let the browser SDK report routing decisions by @edsiper in https://github.com/fluent/fluent-bit/pull/12791
    - workflows: add manual rebuild of released container images by @edsiper in https://github.com/fluent/fluent-bit/pull/12804
    - parser: add static cri parser backend, 9 MB/s gain over the regex cri parser by @edsiper in https://github.com/fluent/fluent-bit/pull/12799
    - skills: add plugin authoring and verification guides by @edsiper in https://github.com/fluent/fluent-bit/pull/12797
    - in_mqtt: complete QoS 2 handshake and answer SUBSCRIBE by @cvas22 in https://github.com/fluent/fluent-bit/pull/12612
    - workflows: make released image rebuilds reliable across series by @edsiper in https://github.com/fluent/fluent-bit/pull/12805
    - workflows: index every build of released container images by @edsiper in https://github.com/fluent/fluent-bit/pull/12806
    - workflows: bump docker/login-action from 4.6.0 to 4.8.0 by @dependabot[bot] in https://github.com/fluent/fluent-bit/pull/12772
    - workflows: bump sigstore/cosign-installer from 4.1.2 to 4.1.3 by @dependabot[bot] in https://github.com/fluent/fluent-bit/pull/12771
    - in_forward: validate complete compressed payloads by @edsiper in https://github.com/fluent/fluent-bit/pull/12826
    - tests: fix parser Windows DST expectations and grace settings by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12768
    - in_tail: out_file: in_calyptia_feet: in_blob: custom_calyptia: out_s3: Harden file operations against symlink traversal by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12807
    - aws: mitigate accidentally downgrade to use plaintext payloads by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12810
    - out_file: mitigate dynamic output for moving across drive letters by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12812
    - out_kafka: mitigate unbounded data races on kafka by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12817
    - out_s3: persist uploader cooldowns and propagate spool backpressure by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12823
    - tls: handle windows certstore refresh by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12824
    - mp: serialized msgpack walker and faster log record counting by @edsiper in https://github.com/fluent/fluent-bit/pull/12809
    - workflows: bump reviewdog/action-shellcheck from 1.34.1 to 1.35.1 by @dependabot[bot] in https://github.com/fluent/fluent-bit/pull/12821
    - wasm: accept OTLP metrics and traces in the browser SDK by @edsiper in https://github.com/fluent/fluent-bit/pull/12801
    - config_format: cf_yaml: address duplicated elements with anchors on service section by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12815
    - tests: runtime: fix Windows parser daylight saving time cases by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12828
    - out_gcs: write the record timestamp to uploaded objects by @lecaros in https://github.com/fluent/fluent-bit/pull/12827
    - filter_kubernetes: trim trailing line breaks from bearer tokens by @edsiper in https://github.com/fluent/fluent-bit/pull/12837
    - mp: Use general constants for UINT32 by @cosmo0920 in https://github.com/fluent/fluent-bit/pull/12838
    - maintainers: document release operations and retire legacy CI by @edsiper in https://github.com/fluent/fluent-bit/pull/12825
    - upstream_ha: fix YAML upstream file group handling by @locker95 in https://github.com/fluent/fluent-bit/pull/12789
    - contributing: document C indentation rules by @edsiper in https://github.com/fluent/fluent-bit/pull/12840
    - workflows: fix macOS staging package builds by @edsiper in https://github.com/fluent/fluent-bit/pull/12841
    New Contributors
    - @cvas22 made their first contribution in https://github.com/fluent/fluent-bit/pull/12612
