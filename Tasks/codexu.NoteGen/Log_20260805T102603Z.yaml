  Key: ReleaseNotes
  Value: |-
    本次更新重点完善了同步、备份和知识检索体验。
    新功能
    - 新增 OneDrive 和跨平台云盘同步。
    - 不同工作区可以配置独立的同步仓库。
    - 支持自动同步对话，并在多设备间合并内容。
    - AI 可统一检索文章、记录和画布。
    - 支持导入 Notion 导出的 ZIP 笔记。
    - 新增本地备份与恢复功能。
    - 链接记录支持保存网页正文和图片。
    体验改进
    - 移动文章或图片时，自动更新关联的媒体路径。
    - 优化移动端文件和记录的菜单操作。
    - 优化面板折叠、滚动条和部分页面布局。
    - 页面异常时提供分级恢复和数据备份入口。
    问题修复
    - 修复 S3、WebDAV 和腾讯云 COS 的部分同步问题。
    - 修复历史对话无法删除。
    - 修复首次启动查询会话报错。
    - 修复整理模板丢失和快速整理不可用。
    - 修复 macOS 系统 OCR 无法识别。
    - 修复 iOS 部分环境下的启动崩溃。
    - 修复编辑器链接工具栏遮挡问题。
