  Key: ReleaseNotes
  Value: |-
    本次更新带来了全新的画布工作区，并显著增强 AI 检索、对话与跨端使用体验。
    新功能
    - 新增画布工作区，支持流程图、思维导图、时间线、自由绘制、数据图表及多种格式导出。
    - 支持让 AI 根据笔记内容生成图表和画布，并可在确认后直接应用。
    - AI 支持自动联网搜索与知识库检索，并提供多层搜索降级机制。
    - 支持在对话中搜索、安装和移除第三方 Skill。
    - 移动端新增画布管理与编辑能力。
    改进
    - 对话支持自动压缩上下文、探测模型容量并显示上下文使用情况，长对话更加稳定。
    - 完善图片识别与多轮图片上下文，AI 可以持续理解对话中的图片。
    - 重构文件管理器，改进拖放、文件监听、同步状态和系统回收站体验。
    - 优化长期记忆管理、Markdown 链接编辑、源码模式及编辑器显示设置。
    - 扩展图床与对象存储服务，并重新整理设置导航、搜索和移动端设置界面。
    - 新增记录浏览与保存偏好，以及关闭窗口行为和开机启动设置。
    问题修复
    - 修复 Android 较低系统版本的样式兼容问题。
    - 修复移动端无法打开照片库、画布触控缩放、抽屉和工具栏交互等问题。
    - 修复 Gitee 私人令牌无法修改的问题。
    - 修复多处移动端按钮尺寸、页头间距和界面展示不一致的问题。
