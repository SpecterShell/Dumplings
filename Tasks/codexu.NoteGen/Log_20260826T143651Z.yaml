  Key: ReleaseNotes
  Value: |-
    本次更新带来了更灵活的多窗口写作体验、可定制的新标签页与本地 MCP，并集中改善了 AI Agent、同步和编辑器稳定性。
    新功能
    - 编辑器支持多 Tab 分屏，可向上下左右拆分，并支持在独立窗口中打开或移动标签页。
    - 新标签页支持自定义模块顺序与显示内容，可配置快捷操作、新手引导、活动概览和活动详情。
    - 支持拖拽大纲标题，快速调整章节及其子章节的顺序。
    - 新增本地 MCP Server，允许其他本机 AI 工具安全访问和管理 NoteGen 当前工作区。
    - Agent 运行期间支持继续发送消息，可调整方向或加入待处理队列，并支持编辑、排序和删除排队任务。
    - 新增开发者模式、编辑器性能信息以及脱敏诊断日志导出。
    - 新增实验性的自托管同步与实时协作，支持工作区、个人数据、成员权限、邀请和冲突管理。
    - 新增完整德语界面。
    改进
    - 重新设计新标签页的品牌展示与模块布局。
    - 优化标签栏菜单、滚动体验以及编辑器组布局恢复。
    - 调整 Toast、滚动条、侧边栏状态栏和 AI 对话框等界面细节。
    - 补充“启动后隐藏”设置的多语言文案。
    - 增加 Infistar 模型服务配置与相关信息。
    - iOS 最低部署目标更新至 iOS 15，并补充 macOS 10.15 兼容支持。
    问题修复
    - 修复跨设备同步时图片路径异常、图片无法正确显示的问题。
    - 修复 OneDrive 账户连接被拒绝的问题。
    - 修复文件列表与磁盘实际状态不同步的问题。
    - 修复长笔记中选区操作条定位异常。
    - 修复 AI 代码输出的排版与语法高亮问题。
    - 修复行内代码复制后格式异常。
    - 修复链接编辑弹层滚动及定位异常。
    - 修复标签栏菜单显示、滚动抖动和空白标签页识别问题。
    - 修复唯一的新标签页仍然可以被关闭的问题。
    - 修复隐藏画布视口可能产生的 NaN 警告。
