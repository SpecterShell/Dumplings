  Key: ReleaseNotes
  Value: |-
    本次更新优化了知识检索，并修复文本选择、窗口操作和 Android 安装包版本号相关问题。
    改进
    - 优化多语言及中英文混合内容的知识检索，统一索引与查询的分词规则。
    - 改进错误码、版本号和文件名检索，减少未实际包含目标内容的结果。
    - 优化 Agent 的检索方式选择，自然语言和跨语言问题优先使用 RAG。
    问题修复
    - 修复 AI 回复内容无法选中、复制的问题。
    - 修复 Markdown 编辑器全选后选区被清空的问题。
    - 修复全选时误选侧栏、按钮等界面文本的问题。
    - 修复 macOS 使用 ⌘W 关闭标签页时直接隐藏窗口的问题。
    - 修复 Windows、Linux 窗口最大化与还原图标未随状态切换的问题。
    - 修复 Android 安装包版本号回退为默认值的问题。
