  Key: ReleaseNotes
  Value: |-
    本次更新带来 LLM Wiki 和 NoteGen 官方同步（测试版），并重做了桌面端和移动端的记录详情。
    新功能
    - LLM Wiki。选择单篇 Markdown 笔记或整个文件夹，用聊天模型生成可编辑的来源摘要和主题笔记，无需配置 Embedding 模型。原笔记变更后，Wiki 会增量更新。点击主题笔记中的引用可核对原文摘录，Agent 也可结合 Wiki 和 RAG 检索结果回答问题。
    - NoteGen 官方同步（测试版）。使用同一个账号在桌面端和移动端同步工作区文件、附件及选中的个人数据。首次启用时，可选择云端工作区，核对本地与云端的差异后再确认同步。
    - 入门指南。集中配置工作区、对话模型、知识库和同步方式，可随时从通用设置重新打开。桌面端还可以接着练习记录、用 AI 整理笔记，以及用 Agent 生成中英双语笔记。
    - 新增服务。网页搜索支持 Keenable，模型服务商新增球球 Token 预设。
    改进
    - 记录详情。正文打开即可编辑并自动保存，待办可在列表和详情中标记完成，图片支持标注，录音使用单行播放器，文件附件可直接打开。
    - Agent 修改审阅。编辑器滚动条会标记改动位置，可逐处跳转查看。会话历史支持回看修改前后的差异，并撤销符合条件的修改。
    - 精简移动端对话顶部和文件管理器界面。
    问题修复
    - 修复 AI 局部编辑时差异预览、列表缩进和编号异常。
    - 修复中文加粗失效，以及 Markdown 源码和所见即所得模式切换异常。
    - 修复 Gitea 文件重命名后的同步问题，并让历史记录和仓库链接适配仓库的默认分支。
    - 修复桌面端切换窗口误触发同步、仅本地存储时仍显示同步入口，以及旧的同步或图床连接检查结果覆盖当前状态的问题。
    - 修复清理应用数据后未重新显示入门指南及数据库报错的问题。
