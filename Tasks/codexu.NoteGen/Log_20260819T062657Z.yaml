  Key: ReleaseNotes
  Value: |-
    本次更新带来网页剪藏、多格式文档导入与大文档编辑优化，并全面改善移动端操作体验和应用稳定性。
    新功能
    - 支持配合浏览器扩展剪藏网页内容，并将正文与图片保存到 NoteGen。
    - 支持将 Word、Excel、PowerPoint、OpenDocument、PDF、RTF、EPUB、CSV 等文档转换为 Markdown 导入。
    - 全局搜索整合至左侧栏，查找和定位内容更加顺手。
    - 新增阿里云百炼、Kimi、智谱 GLM、MiniMax、火山方舟、百度千帆等主流国产模型平台。
    改进
    - 大幅优化超大 Markdown 文档的加载、滚动与编辑性能。
    - 优化移动端编辑器、顶部工具栏、键盘交互和上下文关联体验。
    - 移动端文本记录改用抽屉选择保存位置，触控操作更加直观。
    - 改进文件管理器的框选、多选与批量文件操作。
    问题修复
    - 修复代码块中的 ~~~ 围栏、嵌套围栏及特殊语言信息在编辑后丢失的问题。
    - 修复从 Excel 粘贴表格及表格工具栏交互异常。
    - 修复 Slash Command 执行后触发文本残留。
    - 修复本地与远程文件混选时无法分别删除。
    - 修复旧版同步配置可能导致文件列表崩溃。
    - 修复 Windows 记录详情无法滚动。
    - 修复 Intel Mac 发布包架构错误。
    - 修复 macOS 12 系统语音识别兼容性问题。
    - 修复移动端搜索索引状态、编辑器工具栏和软键盘相关问题。
