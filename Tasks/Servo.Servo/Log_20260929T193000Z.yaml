Version: 0.6.0
Installer:
- Architecture: x64
  InstallerUrl: https://github.com/servo/servo/releases/download/v0.6.0/servo-x86_64-windows-msvc.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Servo v0.6 updates our JavaScript engine SpiderMonkey from the ESR 140 branch to the current ESR 153 release. Hence this release is also the base of the next LTS release of servo. The previous 0.1 LTS branch will still receive another update with the last SpiderMonkey ESR 140 upstream release.
    Trying out the Servo Tech Demo
    Linux
    If you see an error loading shared libraries when starting servo on Linux, please refer to the troubleshooting guide.
    HarmonyOS
    Please note that the servo-aarch64-linux-ohos.hap attached here is signed for OpenHarmony, not HarmonyOS.
    For HarmonyOS self-signing is currently required - You can download the servo-aarch64-linux-ohos.so shared library and use DevEco Studio to follow the instructions in the ArkTS Servo Demo repository
    What's Changed
    This section will be updated with a link to the August blog-post once it is released with a curated overview over the recent changes.
    For now you can view the generated release notes below.
