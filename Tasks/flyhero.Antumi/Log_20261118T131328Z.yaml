- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新功能
    - 智能体可以接入 Slack、飞书和钉钉：同事在群里 @ 它提问或发截图，它只读你选中的项目来回答；Claude Code、Codex 和 Pi 都支持。在智能体配置页的「聊天平台」里添加。
    - 手机可经你自己的服务器，或服务器上的 Antumi 中转连回电脑，手机上不用装别的：在 设置 → 手机 → 连接方式 里设置。
    - 手机上能看各 Agent 的额度、把聊天移交给另一个 Agent，新建会话和任务时可以选多个项目。
    - 设置 → 存储 可以看附件和图片占了多少空间，并清理没人用的；删除会话或任务时顺带删掉只有它用过的图片。
    - 开发型智能体可设置「委派时的权限」，委派给它的工作按这个权限运行；在编辑智能体时选择。
    - 群聊的每位成员可以单独选择模型服务商及其模型。
    修复
    - Claude Code 用 1M 上下文的模型时，不再显示成 claude-opus-5-5[1m] 这样的原始名称。
    - DeepSeek Harness 0.2.2-rc.3 下不再无法选择模型。
    - Cursor 的执行步骤清单不再显示为原始 JSON，勾选状态随执行进度更新。
    - 检查器里查看文件变更时，返回和文件名固定在顶部，往下滚动仍能返回。
    - 智能体配置页的「保存」「取消」不再悬浮遮挡表单内容。
    - 被委派的智能体请求授权或提问时，手机上不再看不到。
    - 手机 App 切回前台或指纹解锁后，顶部状态栏图标不再变成看不清的白色。
    改进
    - 聊天平台的提问记录可展开看问题、回答和读取记录，失败时写明原因；Antumi 后台版本太旧时会提前提示。
    - 归档会话时，它委派出去的会话一起归档、一起恢复；删除时一起删除。
    - 新会话选不了模型时，模型栏会写明原因，点「去设置」即可处理。
    - 手机上能看到 Agent「预览」的图片，点图片可全屏放大；电脑上预览过的图片在原文件删掉后也还能看。
    - 手机打开时自动检查新版本；「新会话」「新建任务」改为底部悬浮按钮。
    - Claude Code 只读工作（只读委派、团队只读成员）读项目外的文件不再询问。
    - 设置 → 手机 的设备列表里，在线的手机名字前有绿点。
    - 智能体配置页的外部智能体、模型和服务商并排显示，窄窗口自动换行。
    - 设置 → 外部智能体 的「可安装」默认展开。
