  Key: ReleaseNotes
  Value: |-
    更新内容
    ✨ 新功能
    - 私聊可切回旧对话续聊——重新打开原会话，回复中切换需确认
    - 话题下拉限 10 个常用话题，其余进可搜索筛选的全部话题弹窗
    - 群聊话题切换与续聊，聚合侧栏与保护选择竞态
    - 群话题 IPC——新建 / 切换 / 改名 / 删除，首条消息定标题
    - 群话题共用根群的目录、笔记、记忆、看板、例行与浏览器
    - 群聊话题数据层——话题为根群下的子群，配置级联
    - start a new Bot conversation from the PWA
    - center Code/Bot mode switch over the whole window
    - route unmentioned messages alongside active replies
    - arbitrate concurrent tasks for the same member
    - 宽屏侧栏可切换常驻/折叠，选择持久化
    - 横屏宽窗口下会话列表常驻左栏，不再走浮层抽屉
    - prefer existing members for goal onboarding
    - make global turn concurrency configurable
    - 群聊输入框支持按住说话，识别文本插入光标处
    🐛 问题修复
    - 补齐群话题共享状态与配置级联边界
    - notify only when human review is required
    - confirm steering consumption and requeue idle-boundary deliveries
    - steer every active group recipient and preserve completion routing
    - keep standalone chat beside the docked sidebar
    - 宽屏判定去掉 orientation 条件，修 iPad PWA 启动时方向误报导致侧栏闪退
    - 追加 @ 其他成员时立即并行投递
    - 宽屏折叠态补全局展开入口，占位屏不再失联
    - 代审中（reviewing）的审批不再推送打扰真人
    - 群聊录音控件按内容展开宽度，不再压住输入框
    - fall back to group owner when selected members skip
    - keep sidebar busy dots lit for active delegations
