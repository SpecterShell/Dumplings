  Key: ReleaseNotes
  Value: |-
    更新内容
    ✨ 新功能
    - 优雅重启 (#279)
    - 提炼按项目聚合，窗口内多会话合并成一次蒸馏 (#288)
    - 后台矛盾复核，自动为被推翻的旧记忆建立 challenges 关系 (#287)
    - 默认 embedding 模型换成 qwen3-0.6b (#285)
    - 终态结果回传带上完整汇报，中间进度仍短截断 (#278)
    - 追加修复发回原会话，只在换分支、换基线或新任务时新建 (#276)
    🐛 问题修复
    - cleanup_list/cleanup_apply 不再超时，并认出 squash 合并的分支 (#295)
    - 远程客户端不再恢复宿主内置浏览器标签 (#283)
    - 派发指定模型时按显示名匹配 provider，失败附可用模型清单 (#290)
    - 评测 hook 给足超时，避免全量并发下超时；修 lint 行长 (#289)
    - challenges 关系参与检索，降权并标注争议 (#286)
    - ask-relay 回到发起会话，重启恢复的派出会话不再直接拒绝提问 (#282)
    - 一轮结束回传正文上限提到 2000，截断写明已截断 (#281)
    - 一轮结束马上通知秘书 (#280)
    - 恢复窗口位置时钳制到当前显示器可见区域 (#274)
    - 刷新全部模型后给出同步结果反馈 (#273)
    - 远程客户端不再显示宿主桌面操作 (#275)
    - 终态结果立即投递；等后台命令或子代理时不把「结束」送给秘书 (#277)
