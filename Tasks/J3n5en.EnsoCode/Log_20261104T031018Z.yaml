  Key: ReleaseNotes
  Value: |-
    更新内容
    ✨ 新功能
    - 插件子代理类型可选模型，并可被插件预设圈定
    - 自建预设可叠加插件预设
    - 新增 message.leaf 挂点，回复正文叶子后可追加内容
    - 新增 thinking.body 挂点，插件可接管思考正文渲染
    - 内置 arena 与 interrogate 预设
    - 插件作者类型声明与 plugin validate/init
    - 后台投递前自动启动没在运行的会话
    - codemode 提示词点名本会话已声明的禁用工具
    - 升级前可查看更新日志，并可手动下载新版本
    - 支持 enso://install-plugin 网页唤起安装
    🐛 问题修复
    - mac 公证 staple 断网时重试
    - scope tool-call text padding to Grok Responses (#188)
    - 插件预设没写 instruction 时沿用全局指令
    - 渲染层增量重载并隔离插件渲染错误
    - 插件服务收敛事件、日志、缓存与并发
    - 收紧 fs/fetch/产出边界，进程停止与异常退出不留孤儿
    - subagent 参数不合法时点名缺失字段或非法 operation
    - 修复链接安装输入框图标被遮挡与多余留白
