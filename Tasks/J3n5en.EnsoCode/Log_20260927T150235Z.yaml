Locale:
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    更新内容
    ✨ 新功能
    - 语音输入新增云端识别 Gemini Transcribe Live——在语音设置页填 Gemini API Key 与自定义词表（设备本地、不参与同步），按住说话走 Live WebSocket 边说边出字，静音录音以 ACTIVITY_END 结束；可用性变化时 Main 推送 speech:status-changed 让各窗口重查状态
    - 子代理「列出全部」展开逐个列出子代理名字与状态（最近一次运行结果与用时，已关闭 / 空闲 / 休眠单独标明），一个都没有时直接说明；原文收进「运行信息」
    - 子代理 spawn 行展开显示交代的任务（Markdown），不带 wait 的回执原文收进「运行信息」，不再显示整段 JSON
    - 子代理 spawn / send 带 wait:true 时，展开复用「等待」视图显示状态与用时（send 仍先显示发出的正文），回执原文收进「运行信息」
    - 子代理「查看报告」展开直接显示回答（结构化结果 / 失败原因单列），「等待」逐个列出子代理名字、状态与用时并提示超时 / 打断；运行信息原文收进折叠，解析不了时照旧显示原文
    - 子代理查看报告 / 等待 / 停止 / 解雇 / 列出等操作行显示「动作 · 子代理标题」，按 runId、agentId 对回 spawn 时起的名字，不再显示参数 JSON；起了名字的 spawn 行头带上名字
    - 语音快捷键改为输入框聚焦时长按空格（300ms），短按照常输入空格
    - 点击带行号的文件路径 chip（path:行 / path:起-止）在 Files 面板打开后跳到该行；文件已在编辑器打开时直接跳转，面板未挂载时补开也带行号
    - 询问用户工具行标题显示问题，展开列出当时全部选项并标出用户的选择；自定义回答单独列出，超时自动选择与等待中注明
    - 设置里可选录音麦克风，选中的设备不在时自动退回系统默认
    - 新装默认识别模型改为 Qwen3-ASR，已保存的选择不变
    - 本地整段模型（X-ASR、Qwen3-ASR、SenseVoice）按停顿逐句识别，录音中逐句出字
    - 探后折叠组分两层展开：首次展开只显示目标与结果，卡片底部「展开过程」再平铺工具调用；收起组时一并收起过程
    - 语音输入接入第三方识别服务 enso-asr，分流式与整段两个模型
    - 点按录音开口后停顿 2 秒自动结束识别；按住说话仍由松手决定
    - 主 agent 自己雇的 coworker 闲置超过 20 次工具调用时提醒解雇，提醒后仍被使用则间隔翻倍；subagent 工具说明补充用完即解雇
    - 记录记忆工具行标题显示记忆标题，展开以记忆卡片展示写入结果；重复或因相似未写入时注明原因
    - 搜索记忆工具结果以卡片列表展示，替代原始 JSON
    - 新增资源面板，显示 CPU、内存、存储占用并支持分类清理与按会话清理
    - 桌面录音时在工具栏显示实时波形
    - 按住说话时收起软键盘
    - 点麦克风切到按住说话前先申请麦克风权限，授权弹窗不再打断第一次按住
    - 桌面语音输入支持按住快捷键说话（默认 ⌘/Ctrl+Shift+Space），松开识别，可在设置里改绑
    - 手机语音改为微信式按住说话，蒙层显示音量波形与实时文字，上滑取消，识别纠错完再撤蒙层
    - 语音识别后可选大模型纠错，模型可选远程 API 或本地 GGUF（含语音纠错专用的 MyVoiceTyping 1.5B）
    - 语音输入可选识别模型（X-ASR 流式/整段、Qwen3-ASR、SenseVoice），流式模型边说边出字，手机端边录边传并回推中间结果
    - 手机 PWA 语音输入，录音分块经配对信道交桌面转写后回填输入框
    - 输入框增加麦克风按钮，录音降采样到 16kHz 后本地转写并插入光标处
    - 内置工具新增「语音输入」开关（默认关），开启后按需下载 sherpa-onnx 引擎与 SenseVoice 模型并在本机转写
    - 待审批/待回答的会话在分组内排最前，并在 Dock 图标显示待处理数
    - 一轮结束后在输入框上方提供「提交 / 创建 PR / 启动服务」快捷操作
    - MCP server 支持按需加载，经固定 mcp 代理工具懒连接并按真实工具审批
    - 调用规则改为按处理逻辑判断，并支持 call(原名，args) 调用工具
    - 支持过程折叠与待办条，并同步桌面时间线偏好
    🐛 问题修复
    - 识别文本去掉中文字之间的分块空格（Gemini Live 中间结果会夹空格），英文词两侧空格保留
    - 子代理 agentId 改取子会话 instanceId——Main 重启后按 instanceId 认领 coworker，原先随机的 agentId 让模型手里的 id 失效；spawn 与 child-ready 的 adopt 写同一个键，去掉按子会话去重
    - 重启后 subagent 雇的 coworker 不再被认领——worker 回流的 child metadata 来源恒为 typed-mention、不带 mode，覆盖了 Main 预约的 agent-tool / coworker 并落盘；合并时这两项沿用 Main 的权威值（含重启换代）
    - 手机 coworker 标签页点审批/发消息无反应——配对桥与桌面 IPC 对齐，会话内命令接受 child 身份，spawn 父身份与切模型仍只认根会话
    - spawn / send 带 wait:true 时点停止打不断、会话卡死——abort 现在只让 Main 打断附带的等待，仍等回执返回（带 interrupted），不丢 agentId / runId
    - subagent 雇的 coworker 首个 Run 永远停在 running——spawn 途中 child-ready 让 Main 按 instanceId 另 adopt 了一条记录，抢走该子会话的事件；spawn 落库前清掉同一子会话的记录，adopt 按子会话认领已有记录，不再重复登记
    - 没有摘要的出错工具行（如参数校验失败、参数为空）行头也显示错误首行，不再只剩工具名
    - macOS 应用菜单 About/Hide/Quit 显示 EnsoCode 而非包名 enso-code
    - 冷却清正文时保留最后活跃时刻，侧栏时间不再回落到创建时间
    - 点击聊天里的文件路径 chip 在右侧 Files 面板打开该文件，不再只静默复制路径；面板或 dock 未挂载时挂起、挂载后补开，越界路径提示
    - 长会话上滑分页不再停在半截或跳回底部：压缩提示锚点改用绝对下标，行原点按仍在的旧行对齐，首行不变时落页后主动续翻
    - stop 掉 task 的 Run 后关闭实例并回收子会话，不再留下孤儿 coworker 标签
    - todo 陈旧提醒阈值调至 12 次工具调用，提醒后未更新则间隔翻倍退避，减少重复打扰
    - 后台记忆 worker 调用 ModelRegistry.streamSimple 时保留 this，修复 Pi 0.87 下观察/反思卡死导致压缩只剩兜底摘要
    - 子代理 send/message 行显示收件人与消息正文，隐藏投递回执 JSON
    - 联系队员工具行显示收件人与消息正文；消息类工具只剥投递成功回执，捎带的系统提醒与发送失败回执照常显示
    - 应用补丁未出结果时标题摘要取补丁头里的目标文件，不再显示参数 JSON
    - 联系主 agent 工具行摘要与展开内容显示发送的消息正文，不再显示参数 JSON 和投递回执
    - 删除会话时一并清理其及子会话的 tool-output 目录
    - 会话抽屉时间与排序对齐桌面侧栏，冷会话不再显示创建时间，待处理会话置前
    - 麦克风真正出声才进入录音状态，按住说话先显示「麦克风准备中」
    - 授权后重连导致语音短暂不可用时不再退出按住说话
    - 纠错期间在识别气泡里显示加载状态，手机端也能看到
    - 录音中缩放窗口或开合侧栏时，识别文字气泡跟随麦克风按钮
    - 设置窗删除当前语音模型后主窗口立即隐藏麦克风
    - 退出应用前向 agent worker 发终止信号并等待收尾，确保 bash 与 MCP 子进程被回收
    - worker 退出前中止各会话，触发 pi 杀掉 detached bash 进程组，避免孤儿进程
    - 轮次改在 agent_settled 收口，避免溢出压缩续跑/排队消息前提前报完成或失败
    - 压缩后占用锚点按分支下标对齐，修复上下文百分比恒为约 2%
    - 加载方式改为「常驻 | 按需」分段切换，避免状态与动作混淆
    - 只读工具集标签注明会注入绑定的 MCP
    - 桌面端中继握手超时与换链不等 close，避免卡死不重连
    - 对端重新进房后重发模型表
    - 状态栏用量改由 worker 按完整记录计算并随 session-meta 下发
    - 状态栏 token/缓存/速度改由手机按本地消息计算
