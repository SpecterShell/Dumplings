  Value: |-
    更新内容
    ✨ 新功能
    - 真人可把群排队消息转入成员当前委派
    - 导出人物卡加悬停说明与成功提示，标注可用导入还原
    - 成员/选人模型不可用时明确提示成员、模型与原因，不再静默兜底
    - 团队模板加岗位约定，三位群主共用派单原则
    - 看板新增「待验收」——委派交付且执行人非创建人时进 review，由创建人或真人验收/退回
    🐛 问题修复
    - scope member admission and FIFO to originating chat
    - 模型测通结果持续有效，配置变化或真实投递报模型错误才重测
    - 成员模型整链不可用时临时回退默认模型并提示
    - polish en persona wording in team templates (#24)
    - 「查看过程」按委派状态分流——排队/进行中看实时视图，排队显示占位
    - 委派期限从真正开工起算，同成员排队时间不计入
    - 群聊头部窄宽度不溢出——新话题退为图标按钮，下拉限宽，文字不换行
