- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    更新内容
    ✨ 新功能
    - 代码编辑器增加格式化按钮
    - 设计器改为流水线画布，点击节点在下方编辑
    - 设计器提示词支持「插入参数」菜单
    - 图形化工作流设计器与脚本代码高亮
    - 关闭 workflow 工具后隐藏设置页入口与侧边栏工作流 tab
    - 侧边栏停止按钮，用户停止后告知主 agent 不要重跑
    - 支持 background 异步运行与 stop，取消时停掉在跑的子代理
    - 设置页可关闭内置预设，侧边栏与 worker 同步生效
    - 工具说明列出可用预设，主 agent 可自选合适的预设
    - 侧边栏可清除已结束的运行记录
    - 侧边栏触发预设工作流，设置页管理自定义预设
    - 增加可开关的 JavaScript workflow (#99)
    - 快捷键切换最小化到托盘，不休眠时可阻止息屏
    - 流式推理自动展开可关，默认保持原行为
    - 用统一 subagent 工具接管 task 与 coworker
    - xAI 订阅从上游拉取模型
    - support dollar-triggered skill suggestions
    - Add MCP 弹窗支持 JSON 导入
    🐛 问题修复
    - 轮次收束且已有新 user 落地时收掉排队回显
    - 乐观回显增加 deliveryId 投递回执兜底
    - 排队马上发送的超长正文截断后仍收掉回显
    - 超长 user 正文被投影截断后仍消费乐观回显
    - 阻止息屏开关与休眠策略单选分组
    - explore-fold 按 Pi 消息形态配对并只删除中间轮次
    - 投影消息中的 Pi system 消息不参与相邻轮次判断
    - explore-fold 折叠时保留区间内的 system 消息
    - 上下文占用不再把 Pi system 消息重复计入对话
    - 适配 Pi 0.87 会话恢复与首次落盘
    - 从持续记忆来源中排除 Pi 系统消息
    - 还原 Pi transcript 中的系统提示和工具定义
    - 主 agent 可为运行指定 model，要求选模型的类型不再直接失败
    - 运行预设后重置参数表单
    - 首 token 从 turn_start 起算
    - 带图消息的乐观回显能被追加图片提示的真消息消费
    - spawn 用模型枚举，漏掉描述时用名称或提示补标签
    - 同名自定义类型顶掉内置 worker 后仍能默认雇到
    - 派发 host 接上子代理模型解析
    - 冷历史重开、雇人不再抢焦点，并丢掉过期选中
    - PWA coworker tab 滑动底不再挤偏标签
    - spawn 缺描述或指令时点名缺哪个字段
    - 拒绝任意 gate 命令并按父会话工具档做 proof
    - OAuth 暂态空列表不再把手机模型服务锁死
    - 斜杠菜单里同名技能只保留一条
    - 子会话工具名单与实际挂载对齐
    - 关闭自动折叠时不显示收起按钮
    - 铺满宽度时隐藏左侧快速定位条
    - 切 tab 时立刻清掉已过 TTL 的正文
    - 切换 coworker 时不要把时间线一直藏住
    - 全折叠后文件列表按内容贴顶
    - safely optimize compound PowerShell commands
    - show distinguishing suffixes in file mention paths
    - restore green typecheck in production sources
    - reveal local file links in the system file manager
