  Key: ReleaseNotes
  Value: |-
    更新内容
    ✨ 新功能
    - 子代理记录图标旁显示记录数量 (#192)
    - 子代理跑完后可在右上角回看对话记录 (#191)
    - 壁纸遮罩可调，侧栏不再单独铺底
    - 插件市场按标签筛选，安装按钮与已安装文案对齐
    - 插件可读会话汇总状态（session.status / list state / scope:'all' + session.readAll）并订阅 session_status 事件
    🐛 问题修复
    - 顶栏态全屏时面板仍升进顶栏行，tab 条与顶栏齐平
    - Markdown 标题按 em 分级，列表与行内代码跟随正文字号
    - 子代理合同约束共享工作区，完成通知把报告标成待核实材料
    - 桌面侧栏改成与对话卡片一样的圆角
    - 开壁纸时给 Code 侧栏补一层与面板同档的遮罩
    - 分组条底线与会话标签栏对齐
    - 合成的 agent-notification 以 extension 来源投递，避免被插件 input 拦截改写
