- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    🎨 Improvements
    - Improve live status animations, elapsed-time information, and spacing in running and completed conversations. by @yixiangihsiang, @imccyu
    - Improve reliability when re-uploading expired images and continuing conversation requests. by @CreatixChu
    - Desktop update prompts clarify versions, downloads, and retries. by @liyao
    - History entries without a title display “Untitled” and open an empty rename field. by @liyao
    - Improve layouts and interactions in plugin management and the built-in plugin inventory, along with installation guidance. by @ZiyaZhang, @Yifffan
    - Improve switch color contrast in the dark theme. by @Yifffan
    - Improve text-selection visibility in Office and PDF previews in both light and dark themes. by @yudshj
    - Reduce waiting time when saving plugin configuration. by @turtle1999
    - Creator mode improves plugin-development guidance and provides the agent-experience skill. by @turtle1999
    - Conversations using DeepSeek account models can search the web without configuring an additional API key. by @lsdsjy
    🐛 Bug Fixes
    - The built-in Windows sandbox includes a permission-diagnosis skill that identifies supported causes of access denials and provides backed-up, recoverable permission repairs within a permitted directory. by @Elevator14B
    - Fix conversations becoming unable to continue after a tool-scheduling failure. Operations with unknown outcomes instruct the agent to verify side effects before retrying. by @tianyicui
    - Fix title-bar clearance for Desktop dialogs, menus, and floating panels, improving visibility and interaction in small windows and when switching fullscreen modes. by @yudshj
    - Fix hidden Explorer windows and unresponsive actions when opening a folder or revealing a file on Windows. by @yudshj
    - Fix missing audio-input permissions affecting microphone authorization on macOS Desktop. by @LegGasai
    - Fix reply recovery when refreshing Safari during a streaming response. by @grllll
    - Fix npm installation failures on some Linux systems when optional native prebuilt packages are unavailable. by @turtle2099
    ⚠️ Chores
    - Automation tasks are now provided by an optional plugin bundle. by @Chinesezjc, @ZiyaZhang
    - Adjust the default work-detail display for different initialization paths. by @imccyu
    Full Changelog: dsh-v0.1.7-rc.2...dsh-v0.2.0-rc.1
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    🎨 体验优化
    - 优化对话进行中和完成状态的实时动画、用时信息、过程信息间距。 @yixiangihsiang, @imccyu
    - 改善会话在图片失效后自动重传并继续请求的可靠性。 @CreatixChu
    - 桌面更新提示补全版本、下载和重试说明。 @liyao
    - 无标题的历史会话统一显示「未命名」，重命名时提供空白输入。 @liyao
    - 改善插件管理界面、内置插件界面布局及交互，改善安装引导。 @ZiyaZhang, @Yifffan
    - 改善深色主题下的开关色彩区分度。 @Yifffan
    - 改善 Office 与 PDF 预览的文字选区在浅色、深色主题下的清晰度。 @yudshj
    - 改善插件配置保存操作的等待时间。 @turtle1999
    - 创造模式完善插件开发指引，并提供体验技能。 @turtle1999
    - 使用 DeepSeek 账号模型的会话无需配置额外 API Key 即可进行网页搜索。 @lsdsjy
    🐛 问题修复
    - Windows 内置沙箱新增权限诊断技能，可定位部分访问被拒原因，并在限定目录内进行带备份、可恢复的权限修复。 @Elevator14B
    - 修复工具调度异常后对话无法继续的问题；已执行但结果未知的操作会提示先核实副作用，不盲目重试。 @tianyicui
    - 修复桌面端弹窗、菜单和浮动面板避让标题栏，改善小窗口和全屏切换时的内容遮挡及操作问题。 @yudshj
    - 修复 Windows 中「在文件资源管理器中打开」或定位文件可能打开隐藏窗口、操作无响应的问题。 @yudshj
    - 修复 macOS 桌面端缺少录音权限、影响麦克风授权的问题。 @LegGasai
    - 修复 Safari 在回答输出中刷新页面后无法恢复回复的问题。 @grllll
    - 修复部分 Linux 环境在缺少可选原生预构建包时的 npm 安装失败。 @turtle2099
    ⚠️ 其他变更
    - 自动化任务改由可选插件包提供。 @Chinesezjc, @ZiyaZhang
    - 调整工作过程展示在不同初始化路径的默认值 @imccyu
    This first release candidate for 0.2.0 summarizes the major user- and developer-facing changes since v0.1.7-rc.2.
