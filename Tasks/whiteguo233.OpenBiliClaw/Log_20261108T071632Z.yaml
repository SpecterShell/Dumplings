  Value: |-
    - Intel 安装包增加已验证产物发布流程：从成功且同提交的 CI 构建提取，核对人工复核的 SHA-256 后附到两个发行页，保留已签名／公证字节。
    - Safari 打包在 Apple 公证已接受后，对票据下载／验证的明确网络中断最多重试三次；不重新提交已接受公证，不跳过签名验证，永久错误仍立即失败。
    - 两个固定免费 LLM 实例和独立 BGE-M3 通过原有 Provider 设置选择；初始化所选模型进入默认调用链首位，切换立即生效。
    - 聊天添加网站／RSS 来源，支持试跑、确认、频率与占比管理；macOS 托管 Ego 按需无界面启动与空闲回收。
    - 发布验证修复：完整 pytest job 显式安装 Chromium；两项 macOS 专用 Ego 测试固定模拟平台，空闲回收等待任务完成而非固定睡眠。
    - 版本、下载入口与商店审核说明同步；发行与组件兼容验签结果见发布记录。
    免费 Provider 与评估集成
    - 免费 Provider 继续集成最新 Jev 主线（2026-11-08）：手机设置同时保留固定免费实例选择和 Jev 独立探测，合并双方文档并重新生成三语言目录；不恢复旧独立免费方案表单，不改变 Embedding 现有备选语义。验证范围见合入记录。
    - 合并验收补齐 Jev 新增无效证据停放计数的完整响应断言；首轮集成 1,270 项通过，遗漏字段修正后 5 项状态回归通过，保留严格字段校验与原始失败记录。
    - 免费 Provider 合入收尾（2026-11-07）：集成两个只读 Qwen 实例、独立 BGE-M3 与工具协议修复，保留 main 的不喜欢主题短语匹配修复。明确 Embedding 仍为默认端点加构建期备选，不承诺运行时实例链切换；当前 Rust 随包验签流程和固定 SDK 版本不变。合并验证与交付边界。
    - 全量合入检查识别并同步四处旧测试夹具：备用实例使用固定 4B ID，工具调用使用 Qwen 标记帧；保留付费渠道隔离、工具结果续接及流式不泄漏的断言，不放宽运行时协议。修正后相关 137 项回归通过。
    - 免费工具协议进一步修复（2026-11-07）：A/B 实测定位到工具结果之后重复原指令引发再次读取，以及原样 JSON 被误当操作。改用 Qwen 标记帧、保留结果身份并移除重复指令；普通 JSON 直接展示，替代此前的 reply 封套。明确点名工具而无调用记录时暂存正文并最多纠正一次，已有结果后的纠正聚焦剩余明确工具；保留结构化结果字段，支持说明文字后的正式调用，审批/失败操作不重放。证据与真实复测。
    - 工具协议正文修复（2026-11-07）：针对 4B 实测中正文混入 tool_call JSON，在流式和终态共用有界检查，纯协议空答复最多纠正一次。原始用户请求单独传递，避免输出语言规则误关闭检查；合法 JSON/代码请求保留，原生工具权限和审批保持。确定性回归与两个模型的真实结果见修复验收。
    - 免费工具协议补充原样答复封套；展示数据只解封一次，带答复或说明字段的对象不解析为调用。8B 在真实示例对照中仍有指令遵循失败，保留在验收记录；不能把解析保护视为模型能力保证。
    - 补充纯工具代码块的一次纠正，以及相同成功读取的无进展收敛；实测 8B 连续 11 次重复读取触发超时后，第三个相同计划改为无工具汇总，不阻止不同参数/结果或写操作。
    - 免费实例瞬时错误沿包装链恢复类型，使未输出、未执行工具的聊天接上已有的两次持久重试；包裹后的鉴权失败、已有输出和工具动作仍立即终止，避免重复执行。
    - 拦截完整工具代码块之后无执行依据的完成声明；协议内容不作为操作执行，必要时请求一次纠正。修复 PC/插件整表保存中未修改的 Tailnet 字段误阻断默认链即时切换，避免切换模型时等待后台学习排空。
    - 真实复测发现纠正回复仍可能虚构已执行读取：纠正前无工具结果时，暂存纠正正文并要求正式调用，否则明确失败；已有结果的收尾仍可直接答复。HTTP 回归验证失败不显示、记录或学习虚假成功。
    - 固定实例真实验收（2026-11-07）：从空调用链初始化选择两个 Qwen 模型，验证所选实例成为首位、PC 双向切换、重启持久化、真实流式工具对话与 BGE-M3 向量。补充空链回归；4B 一次正文混入工具 JSON 的质量异常及耗时波动保留在实测记录。
    - 固定内置实例（2026-11-07）：Qwen3-8B / Qwen3.5-4B 分为两个不可编辑、删除或复制的 LLM 实例，BGE-M3 固定模型参数；用户通过原有 Provider 选择与调用链切换。后端校验同步保护，迁移保留原模型选择与自有渠道。
    - Provider 结构统一：硅基流动免费 LLM 改为普通预置实例，BGE-M3 改为独立 Embedding Provider；移除四端独立方案表单和全局路由拦截。旧配置迁移为显式链，保留模块覆盖、自有凭据、SDK 验签/重试与过期通知；仅切换默认实例链可保留后台学习。结构与验收。
    - 合入 Jev 原生网关、上下文打包、预算 / 无效答案停放和精简设置说明的 10 个提交；与 main 的免费模型、鉴权及元信息更新共同保留。合并后 648 项 Python 专项 / 浏览器回归、1,884 项插件测试、4 项移动路径 JS 检查、Ruff / MyPy / 构建通过。此前真实 OpenRouter 一次 invalid_response 仍未解决，不把模拟服务回归当作真实问题修复；不启用 Jev、不重启日常服务、不发版，见合并记录。
    动态网站与 RSS 发现来源
    - 主线集成（2026-11-08）：动态来源接入主线静态资源合并与移动代理前缀，保留免费实例的有限重试及聊天防重复执行；修复 OpenClaw 灵感供给构造参数，补齐来源文案翻译。原生来源流程与扫码／依赖升级一起整合，详见合并验证。
    - 真实环境复验修复（2026-11-08）：修复代理 fake-IP DNS 导致公开网站被误拒；仅对全合成答案进行严格公共 DNS 复核，保持私网拒绝与原网络路径。通用 Ego 观察为带链接标题预留原有额度，避免 Solidot 等前置侧栏遮蔽新闻列表。PC 低高度窗口支持纵向滚动，窄屏会话抽屉增加可触达的关闭入口；托管 Ego 空闲退出显示「已准备，按需启动」，避免误报未就绪。真实流程、筛选结果与验收限制见本轮记录。
    - Ego 静默运行（2026-11-08）：托管官方 Ego 改用其自身无界面模式，消除首次设置和采集建页时短暂显示本机窗口的问题；原生接管截图、空闲回收与外部宿主管理边界保持。官方 0.6.2.9 全新初始化及真实采集的窗口／焦点采样通过，验收范围及测试网络前提见后台运行记录。
    - PC 聊天引导（2026-11-08）：将来源说明从折叠入口改为输入框上方默认可见的说明卡，直接显示如何添加网站／RSS 的说明与两个示例；已有聊天记录时也可看到，保留草稿与原发送行为。Ego 实测修复小窗口挤压聊天记录的问题，见 PC 页面验收。
    - 聊天输入框新增「添加来源 · 说明与示例」：桌面 Web、移动 Web、插件展示网站／RSS 两个自然语言示例，并说明试跑确认、频率与占比管理、异常提醒位置；已有聊天也可展开，保留草稿。原生 App 配套提供可滚动说明面板。见引导验证记录。
    - 聊天等待部署准备（2026-11-07）：后台仍在正常校验 Ego 签名时，聊天原先立即把“准备中”写成失败草稿并诱发重复工具调用。网页建源改用有界等待，复用部署任务的完成结果；真实失败仍保留，等待取消不停止安装任务，设置接口仍立即返回进度。
    - Ego 慢冷启动握手修复（2026-11-07）：真实原生 App 复验中，就绪 CLI 连续三次在 20 秒被提前终止；隔离对照确认进程始终存活并在约 70 秒后完成握手。单次握手改为最多 120 秒，连接阶段总时限仍为 300 秒，保留真实就绪校验及取消清理。原生端同时修复 HTTP 超时后的提前关闭异常，过程与最终复验见验收记录。
    - Ego 冷启动竞争修复（2026-11-07）：真实测试复现并发任务唤醒空闲宿主时，后到任务立即误报不可用。实际执行改为在连接预算内等待并复用启动结果，取消等待不终止正在启动的宿主；保留手动准备接口的进行中状态。冷安装、修复前失败和原生真实复验分别记录于本轮验收。
    - 同轮自然调度暴露多步原生初始化被统一 30 秒等待提前截断；初始化改用计划已有时限，保留单个原生命令超时和包含启动／导航／采集的整轮上限。原始周期失败与自动恢复仍分别保留，复测使用空候选数据库。
    - 持续采集故障接入异常事件流（2026-11-06）：普通网页／Feed 采集连续失败 3 次后进入消息提醒与现有异常报警，登录／验证立即提醒；成功恢复清除当前问题并保留历史。来源事件落盘、跨 worker 转发，避免重启丢历史和重复推送。原生 App 新增「设置 → 异常记录」，可定位对应来源。详见验收记录。
    - 来源暂停提醒（2026-11-06）：登录失效与网站安全验证分别提示；调度暂停保留策略和份额，Web／原生 App 消息入口与来源设置提供处理入口。提醒从数据库状态恢复并按来源合并，成功试采后才解除；诊断日志补充来源类别。替代网站的真实验收记录见 Rust／Django 与提醒验证。
    - 验证域授权修复（2026-11-06）：真实哔哩轻小说代理对照暴露 Cloudflare iframe 已被观察却无法授权的问题。明确验证页的被拒 iframe 现提供逐域授权选项，网页／原生 App 使用最新选项并移除旧按钮，普通广告不触发授权。代理可达但网站验证尚未通过，不能视为来源已可采集；原直连配置保留。见本轮对照与修复。
    - V2EX 验证与重复采集修复（2026-11-06）：Ego 人工接管支持在原授权和共享预算内加载自有 iframe，修复验证页一直停留；广告内嵌页拒绝与顶层登录跳转分开诊断。新增同容器重复行结构证据，避免模型把单条帖子编号固化到采集选择器。原生 App 聊天重新建源、最终版本三次自然调度各 3 条、真实评估入池与推荐接口均通过，NGA／HN／少数派各 3 条 Ego 兼容复测通过；哔哩轻小说当前直连仍受网络重置影响。完整范围见验证恢复验收。
    - 多站阻断修复（2026-11-06）：公开 HTTP 来源遵循现有网络代理并保留公共 IP 固定与 robots；聚合 Feed 的文章引用独立扩至 128 域；已知平台可独立创建 Ego 来源；明确网站验证页改为人工接管。BBC 与 Planet Python 各三轮真实聊天／调度验证，新增 6 候选中 3 入池、3 低分拒绝。配套 App 修复真实聊天工具事件解析，V2EX 聊天→接管→返回整轮通过；网站验证与哔哩轻小说直连仍保留站外阻断。915 项关联回归、网络声明专项 131 项及 App 168 项通过，详见后续修复验收。
    - 12 站真实验收（2026-11-06）：8 个站点聊天建源与正式采集通过，覆盖 Ego 网页、RSS、Atom、JSON Feed；HN、Django、少数派原生 App 完整流程通过。33 条新候选经真实评估后 12 条入池，最终关联回归 887 项通过。哔哩轻小说／BBC 仍有外部网络阻断，V2EX 通用 HTML／Planet Python 聚合范围属于现有限制，未宣称全部通过。详见多站记录。
    - 修复少数派卡片观察缺少细字段，导致标题混入摘要、作者和日期：为已抽样内容行保留有界子字段证据，编制优先使用真实标题节点。原始大卡片试跑与首次聊天更新的失败样本保留；新流程仍须真实试跑和审批，不自动迁移已发布计划。
    - 修复少数派首页大图导致后台采集偶发超过 16 MiB 预算：Ego 非交互观察、试跑及正式采集跳过图片、音视频、字体下载，保留文字、脚本、样式、数据请求与原域名观察；人工接管保持完整加载和原预算，不抬高安全上限。
    - 真实多站测试发现 BBC RSS 的 robots.txt 前置请求不可用；公开 URL 探测现在明确区分“robots 规则禁止”和“无法读取 robots.txt”，不再只返回笼统安全策略错误，不泄露底层地址或响应，也不绕过站点规则。
    - 修复真实冷安装中官方 Ego Lite 0.6.2.7 末页文案变化导致的 ego_setup_unknown_options：识别已观察到的“加入用户体验计划”并取消勾选，保留恰好三个已知选项的校验；不导入日常浏览数据、不设默认浏览器或添加 Dock。新旧文案回归及全新 profile 自动初始化通过。
    - 精确域名直连真实复验（2026-10-27）：按用户选择仅哔哩轻小说直连，NGA 实际仍经过系统代理。原生聊天新增哔哩轻小说＋Atom、三轮五分钟采集通过；最终代码严格原生截图／重开／继续试跑 42 秒通过，两站正常调度均采到 3 条。464 项关联回归与静态检查通过；新增 3 候选均按真实低分拒绝，没有虚增入池。详见本轮验收。
    - 修复 Ego 采集对整页 complete 的硬等待：真实哔哩轻小说后台页已提交、DOM 为 interactive，外围资源仍会拖至超时。现允许同一已解析文档稳定 8 秒后进入原提取验证，保留完整文档 1.5 秒等待、未解析文档超时、最终 URL 授权与所有内容范围校验；不扩大直连域名或网络权限。
    - 原生接管重开暴露初始化超时后持续复用同一宿主的问题：既有一次初始化重试前，先以独占会话租约确认无其他任务，再停止闲置托管宿主并按需自动启动；其他活跃会话、外部宿主、取消、网站错误与已开始步骤均不触发全局重启，原总预算保持。
    - 修复多个来源在 Ego 冷启动后因数字 task-space ID 复用而被误判身份变化：只接受另一个当前代次、同宿主和 profile 的已登记应用会话作为复用证据，再恢复缺失的原逻辑名称；用户接管、改名、未知碰撞与同名空间仍拒绝。
    - 托管 Ego 新增显式精确域名直连偏好与只读／写入 API，默认空列表。冷启动保留当前系统手动代理和原排除项，只给选定域名追加直连；持久配置不含代理凭据，不改系统设置。空闲宿主自动释放后按新规则启动，活跃会话／准备期间拒绝变更；PAC/WPAD 不静默降级。用于按用户选择修复哔哩轻小说代理路径阻断，其他网站仍使用同一系统代理。
    - 哔哩轻小说阻断归因（2026-10-27）：真实 Ego 对照定位到当前系统代理访问路径：默认路径和显式同一代理失败，测试宿主直连连续四轮各采到三本；重复导航没有解决。修复网络枚举在原生宿主、Python 和正式运行记录中的丢失，只保存安全 net::ERR_* 原因，不自动切换用户代理或证书。默认配置下持续采集仍未通过，详见阻断记录。
