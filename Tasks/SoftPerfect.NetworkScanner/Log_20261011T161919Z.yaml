  Key: ReleaseNotes
  Value: |-
    - Added: Live device monitoring with latency, loss, jitter and quality columns.
    - Added: Live charts and per-hop route quality in the device properties.
    - Added: MD5, SHA-1 and SHA-256 checksum columns in the remote file properties.
    - Added: Automatic detection of SNMPv3 authentication and privacy algorithms.
    - Added: Saved SNMPv3 credentials, SHA-224 authentication and AES-192-B/AES-256-B privacy.
    - Improved: New SNMP engine with IPv6 neighbour discovery and more reliable data retrieval.
    - Improved: MIB browser now uses a built-in database instead of separate MIB files.
    - Improved: Installed applications now include correct version numbers.
    - Improved: Workstation probes, such as OS version and LAN group, are now cross-platform.
    - Removed: Remote suspend/hibernate, Comment column, Uptime option and Telnet scripting object.
