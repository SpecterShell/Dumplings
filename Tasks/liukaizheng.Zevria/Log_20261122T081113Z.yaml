  Key: ReleaseNotes
  Value: |-
    Zevria v0.5.0
    Windows now launches natively without a WSL handoff. Both frontends gain live job and subtask controls and richer Plan questions, and Desktop source builds have a redesigned timeline.
    Breaking Changes
    - Remove --runtime and --wsl-distro from launch scripts and ACP clients; native Windows TUI and ACP now require Git for Windows Bash and RTK.
    - Native Windows no longer reads workspace history under .zevria/windows/; stop active sessions, back up both layouts, and follow the Windows migration guide without merging or overwriting directories.
    - zevria clean now deletes the five shared workspace state directories without confirmation, regardless of which OS wrote them; back up anything you want to keep.
    - Update integrations that parse question responses to accept arrays for multi-select answers and optional notes for predefined single choices.
    - Update strict ACP response-display decoders to accept optional answer sources; keep pre-upgrade backups because older builds cannot read newer incomplete-response records that contain this field.
    - Desktop replaces bulk turn folding with Collapse details and Expand details; the Fold older turns action and shortcut are removed.
    Features
    - Open live jobs and subtasks without interrupting a turn using /jobs, /subtasks, the Desktop status chips, or TUI Alt+J and Alt+S.
    - Stop individual commands or move eligible foreground commands to the background from the Jobs controls.
    - Plan questions support scrollable Markdown choice previews, multiple selections, and notes on predefined choices.
    - Desktop opens natively on Windows x64 in source builds, with a workspace picker when launched without a path.
    - Set [command].status_wait_timeout_seconds to cap command_status waits without stopping jobs or changing the foreground execution timeout.
    - Desktop groups web searches and page activity and shows clickable sources on cited answers.
    Bug Fixes
    - Align Desktop step status marks and Thought word counts, and keep Copy and Copy output clicks from toggling row details.
    - Keep adjacent Desktop Thoughts in order around commands and web searches, including after restoring a session.
    - Keep final answers and submitted plans visible under the TUI's bulk-fold rules.
    - Stabilize TUI selection scrolling and show ordinary Windows edit-path labels without changing stored paths.
    Improvements
    - Desktop places prompts, answers, and the composer in one column, with compact expandable rows for tool activity and reasoning.
    - Both frontends show Preparing… immediately after sending, before durable acceptance succeeds.
    - TUI folds show first-line previews and activity counts while preserving nested manual folds.
    - Image read results show compact dimensions and file details in the TUI and an expandable image preview in Desktop.
    Build and Dependencies
    - Stable downloads contain the unsigned zevria CLI for Windows x64, Linux x64, and Apple Silicon macOS plus SHA256SUMS; Desktop is not included in those archives or installers.
