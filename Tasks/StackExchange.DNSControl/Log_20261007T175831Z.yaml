  Key: ReleaseNotes
  Value: |-
    Greetings DNS fans!
    Thanks to all contributors involved in this release! This is a community project and we couldn't do it without all of your contributions!
    Sincerely,
    --Tom Limoncelli
    Monthly video call!
    Everyone is invited to the Monthly DNSControl Community Video Conference Call on the 2nd Tuesday of each month. Join whether you are a new user with questions or an experienced developer that wants to discuss DNSControl internals... or anything in between! Meeting details on
    GitHub Discussions.
    SECRET BETA: Try the new D() syntax!
    The new D() syntax in dnsconfig.js attempts to improve usability. It is fully backwards compatible. See the examples in the conversion guide. Feedback needed!
    Changelog
    Provider-specific changes:
    - 1aed32fde176fb90e8cfc20c84ae083aee27a000: fix(p/BUNNYDNS): return the zone's nameservers and ignore apex NS records (#4970) (@jfexyz)
    Bug fixes:
    - 094cc35309b4064c249c6db7ff95097dcd6f916d: fix: report IMPORT_TRANSFORM of a non-existent domain instead of crashing (#4969) (@SulimanAbdulrazzaq)
    CI/CD:
    - de420a9b1c43c0a7e7a70f5cdda118e6b4bd0d09: build(deps): bump alpine from 3.24.1 to 3.24.2 (#4960) (@dependabot[bot])
    - c06740bdf54859b8b90dd0da33b00cfccf020e95: build(deps-dev): bump @commitlint/cli from 21.2.2 to 21.2.3 (#4962) (@dependabot[bot])
    - 91b19cd14cdb62ed093b4fc413d16221b54b972f: build(deps-dev): bump prettier from 3.9.6 to 3.9.9 (#4961) (@dependabot[bot])
    Refactoring:
    - 2e501ac441fb79b29286ac605b4785677842f464: refactor: Reduce unused "metadata" parameters in provider initializations (#4959) (@TomOnTime)
    Deprecation warnings
    Warning

    - REV() will switch from RFC2317 to RFC4183 sometime after v5.0 is released. This is a breaking change. Warnings are output if your configuration is affected. See https://docs.dnscontrol.org/language-reference/top-level-functions/revcompat
    - NAMEDOTCOM, OPENSRS and SOFTLAYER need maintainers! These providers have no maintainer. Maintainers respond to PRs and fix bugs in a timely manner, and try to stay on top of protocol changes.
