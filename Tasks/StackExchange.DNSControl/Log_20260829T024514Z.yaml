  Key: ReleaseNotes
  Value: |-
    Greetings DNS fans!
    There were some small but significant bugs found in v5.0.0. If your configuration uses the IP() function, there's a 50% chance you're affected. CLOUDNS users of the CAA record type are also affected.
    Thanks to all contributors involved in this release! This is a community project and we couldn't do it without all of your contributions!
    Sincerely,
    --Tom Limoncelli
    Monthly video call!
    Everyone is invited to the Monthly DNSControl Community Video Conference Call on the 2nd Tuesday of each month. Join whether you are a new user with questions or an experienced developer that wants to discuss DNSControl internals... or anything in between! Meeting details on
    GitHub Discussions.
    Changelog
    Provider-specific changes:
    - a75b7f10a6c42568e617eaffe8348d9f39190eaf: CLOUDNS: BUGFIX: CAA records get unneeded updates (fixes #4819) (#4820) (@TomOnTime)
    - 9675a6bcdab7475ff20186f7fd53f9da6acac024: TRANSIP: Empty TXT records are not supported by TransIP (#4831) (@TomOnTime)
    - 4a120404ed9d3c424f501466a367f99e010b52cc: TRANSIP: TransIP does not support TXT with trailing whitespace (#4832) (@TomOnTime)
    - b81370f421aeefbd60a73192981cd6d0f259d2d9: TRANSIP: Write TXT records unquoted (v5 regression of #2708) (#4824) (@cafferata)
    - 6bcc8181ea5055e7302c17bd0a1b3dc5513943bd: chore(netnod): Add @vilhelmprytz as maintainer (#4822) (@vilhelmprytz)
    Documentation:
    - 6b54c2a011dee39b37cfc8b9c1116e92846de777: docs: Add TOC and fix MarkDown lint warnings (#4818) (@TomOnTime)
    Dependencies:
    - 9e512507e6eaa72283e7d17dd8f1ce60f19b74c9: chore: Update dependencies (#4826) (@TomOnTime)
    Other changes and improvements:
    - a39705794e0e7fcc71dafdcd4b9a9bf824af86e7: BUG: SPF parsing no longer rejects the bare "ptr" mechanism (#4640) (@shuvamk)
    - d32a8f15d0af9d035feb3d0603ccb238e7685af7: BUGFIX: DMARC_BUILDER handling of nonexistentSubdomain policy (#4823) (@eliheady)
    - d6e5ee72ca1db8835d3818305ac3d392994f543e: Release v5.0.1 (#4830) (@TomOnTime)
    - 71004334856264a011ddc0258fa2bc6154356028: Release v5.0.2 (#4833) (@TomOnTime)
    - 520cd670b5a330e68ff4050f3005ba46a84b0a21: bugfix(mustbe): Fix 32-bit compatibility (#4817) (@TomOnTime)
    - cffd0948e582414c5b300d6b72bb166864d98787: fix(IP): The IP() function breaks for 128/8 and higher (#4827) (@TomOnTime)
    - 77c68701773e3ad1163f9079e36aca106a725462: fix(SPF): detect include loops instead of crashing (#4641) (@shuvamk)
    Deprecation warnings
    Warning

    - REV() will switch from RFC2317 to RFC4183 sometime after v5.0 is released. This is a breaking change. Warnings are output if your configuration is affected. See https://docs.dnscontrol.org/language-reference/top-level-functions/revcompat
    - NAMEDOTCOM, OPENSRS and SOFTLAYER need maintainers! These providers have no maintainer. Maintainers respond to PRs and fix bugs in a timely manner, and try to stay on top of protocol changes.
