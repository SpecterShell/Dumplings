  Key: ReleaseNotes
  Value: |-
    Greetings DNS fans!
    This release fixes more bugs in the big v5.0 release. It's particularly important if you use BIND, BUNNY_DNS, or LINODE.
    Thanks to all contributors involved in this release! This is a community project and we couldn't do it without all of your contributions!
    Don't miss the video call next week!
    Sincerely,
    --Tom Limoncelli
    Monthly video call!
    Everyone is invited to the Monthly DNSControl Community Video Conference Call on the 2nd Tuesday of each month. Join whether you are a new user with questions or an experienced developer that wants to discuss DNSControl internals... or anything in between! Meeting details on
    GitHub Discussions.
    Changelog
    Provider-specific changes:
    - c1ebdb120bdf2574288823b8f5ac9f4c172c2997: BIND: BUGFIX: SOA not incrementing on the existing zone (fixes #4840) (#4842) (@TomOnTime)
    - 90984bb8d72d7f3d4512a9fd0a69b04f92158492: BUNNY_DNS: Fix TXT record creation (#4839) (@TomOnTime)
    - c798fcbf53abdcf545bd3c943ba5ea38a6c6cd52: LINODE: Add support for TTLs of 30s and 120s (#4835) (@dairiki)
    - f96fde4a270960d2d9fac75bed3632d4bd4e1c8b: LINODE: BUGFIX: too picky about hyphens in names of SRV records (#4828) (@TomOnTime)
    Dependencies:
    - b6ce13fde77aa6da5c98e53c2e62a4da810650c6: CHORE: Update dependencies (#4843) (@TomOnTime)
    Other changes and improvements:
    - 34db875e6cad43f44e7cbe820224b228293128e5: BUG: SPF flattening removes redirect= modifiers that an "all" mechanism ignores (#4634) (@shuvamk)
    - 0d6fe4b84c62fb47f5e36fe196c14def27d0cfaf: CHORE: Upgrade to glob v1 (#4841) (@TomOnTime)
    - 162a39bef784e611d4b04c469ace1356f1ae8efb: Potential fix for code scanning alert no. 50: Cache Poisoning via execution of untrusted code (#4837) (@TomOnTime)
    - 5196387f35f783af46b2c28bd37223a715ce583b: Release v5.0.3 (#4844) (@TomOnTime)
    Deprecation warnings
    Warning

    - REV() will switch from RFC2317 to RFC4183 sometime after v5.0 is released. This is a breaking change. Warnings are output if your configuration is affected. See https://docs.dnscontrol.org/language-reference/top-level-functions/revcompat
    - NAMEDOTCOM, OPENSRS and SOFTLAYER need maintainers! These providers have no maintainer. Maintainers respond to PRs and fix bugs in a timely manner, and try to stay on top of protocol changes.
