  Key: ReleaseNotes
  Value: |-
    ⚠️ Warning
    此版本删除了大量功能包括但不限于
    - embed 协议支持
    - 自动负载均衡
    - 日志储存到数据库，目前日志仅保存到内存
    - 单渠道多 KEY,多 URL
    重点优化了协议转换+日志+可视化完整请求流程
    🚀 Features
    - ⚡️ API 转换迁移到 axonhub/llm - by @bestruirui (97d6a)
    - ✨ 重构 - by @bestruirui (ae295)
    - ✨ 增强分组活动项管理，支持清空当前渠道 - by @bestruirui (994d6)
    🐞 Bug Fixes
    - 🐛 修复日志设置为关闭时日志内存延迟释放问题 - by @XyzenSun in https://github.com/bestruirui/octopus/issues/281 (51f10)
    - 🐛 修复日志清理和清空功能的并发问题 - by @bestruirui (da558)
    - 🐛 修复组件样式 - by @bestruirui (7c398)
    - 🐛 优化 ChannelHttpClient 和统计持久化逻辑，减少冗余代码 - by @bestruirui (ff968)
    - 🐛 价格数据获取逻辑 - by @bestruirui (e674c)
    🏎 Performance
    - ✨ 前端改为 vite - by @bestruirui (0fa0a)
    - ⚡️ 简化逻辑并移除冗余代码 - by @bestruirui (dbca8)
