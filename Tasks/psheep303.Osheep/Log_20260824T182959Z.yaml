- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    本版本重点增强了工作流编排、AI Agent 集成、技能管理和开发体验，并修复了多项稳定性问题。
    新增功能
    - 新增标准化 Agent Adapter 架构，支持更灵活地接入 Codex、Claude Code 等 AI Agent。
    - 新增多种工作流节点：
      - JavaScript 代码节点
      - 输入、条件、循环及环境变量节点
      - Git 分支切换、删除分支、提交、Diff、PR、推送等节点
      - Markdown 审批节点
      - 技能节点
    - 支持工作流断点恢复、重试、跳过和忽略中断。
    - 新增工作流设置、自动排序、多线程执行及使用统计。
    - 新增 Skills 管理功能，支持自定义技能、技能分组和技能市场。
    - 新增模板市场及模板管理能力。
    - 新增模型价格配置、API 自动切换、Provider 倍率和用量统计。
    - 新增 Markdown 导出、图片预览、链接打开和底部 Markdown 面板。
    - 新增 Git 视图、文件树增强、多文件选择及拖拽操作。
    - 新增用户数据迁移机制，升级时可自动迁移旧版本数据。
    - 完善 Codex、Claude Code 插件管理及更新流程。
    优化与修复
    - 优化工作流节点编辑、连接、删除、批量操作和运行状态展示。
    - 优化终端输出、上下文处理、换行显示及长文本渲染。
    - 修复工作流边缘连接、循环流程、自动成功判断和等待选择等问题。
    - 修复 Codex、Claude Code 权限请求、用户拒绝和启动异常。
    - 修复 Linux 环境下的构建、格式检查和运行兼容性问题。
    - 优化界面设计、图标、提示信息和多语言支持。
    - 更新项目文档、开发指南和使用示例。
    - 默认语言调整为英文，并补充完善英文文档。
    升级说明
    - 从旧版本升级时，应用会自动执行用户数据迁移。
    - 建议升级后检查工作流、技能和模板配置是否符合预期。
