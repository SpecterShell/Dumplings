    VS Code
    7.8.18
    Patch Changes
    - #15410 5f2aa0b Thanks @WebReflection! - Update DOMPurify to 3.4.17 to fix sanitization issues flagged by Dependabot alerts.
    - #15412 0377248 Thanks @WebReflection! - Update vite to 7.3.7 to fix the launch-editor editor CLI flag misinterpretation flagged by Dependabot (CVE-2026-112944).
    CLI
    7.8.18
    Minor Changes
    - #15358 f96361f - Expose hosted cloud sessions through the local Kilo API, so editors can discover, read, and interact with a hosted session without ever handling its provider credentials.
    Patch Changes
    - #15430 ef2f6d9 Thanks @WebReflection! - Update the MCP TypeScript SDK to 1.32.1 to fix security issues flagged by Dependabot, including MCP HTTP and OAuth requests following cross-origin redirects. Remote MCP servers whose URL redirects to another origin, or answers POST with a 301, 302 or 303 redirect, no longer connect; use the server's final URL instead.
