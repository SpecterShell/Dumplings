  Value: |-
    The Intelligence Upgrade 🎉
    v0.64.4 to v0.64.7 brings 12 PRs across 12 commits, with upgrades across memory, voice, agents, reliability, and developer foundations. Thank you to everyone who contributed to this release. ✨
    Highlights 🚀
    ✅ Tasks, chat & agent workflows
    Task, chat, and agent workflows become easier to steer and inspect, with better task boards, persistent run state, safer delegation, and clearer model/thread controls. (#6672, #6683, #6702, #6760) — Thank you @M3gA-Mind and @senamakel!
    🧩 Integrations, UI & developer foundations
    Integrations, UI polish, and developer foundations also move forward, including clearer connected-account surfaces, meeting-agent wiring, presentation/artifact improvements, and cleaner docs/code organization. (#6668, #6678, #6693, #6699, #6700, #6701, #6704, #6759) — Thank you @senamakel, @M3gA-Mind, and @siddarthkay!
