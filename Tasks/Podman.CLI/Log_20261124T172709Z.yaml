- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Bugfixes
    - Fixed a bug where ConfigMaps and Secrets mounted as executable were not being able to be executed immediately on pod launch when using podman kube play.
    - Fixed a bug where the Docker compatible image inspect responses returning an empty author for images with an author set.
    - Fixed a bug where the podman service did not use the correct server configured temporary directory for remote image builds (#20839).
    - Fixed a bug where --userns=nomap sets the wrong supplementary group (#30261).
    - Fixed a bug where the Docker compatible network inspect and list endpoints are failing when a network has no gateway.
    - Fixed a bug where podman pod clone would fail when it has no infra container (#30340).
    - Fixed a bug where podman-remote manifest push --compression-level had no effect.
    - Fixed a bug where read-only containers using secrets could fail to start (#30301).
    - Fixed a bug where podman-remote manifest add --artifact would fail when no storage driver was configured in storage.conf on the server (#30280).
    - Fixed a bug where the podman machine state with the WSL provider was not parsed not correctly (#30273).
    - Fixed a bug where podman exec could fail to set oom_score_adj as rootless user (#30245).
    Misc
    - Downgraded tags.cncf.io/container-device-interface to v1.1.0 (#30233).
