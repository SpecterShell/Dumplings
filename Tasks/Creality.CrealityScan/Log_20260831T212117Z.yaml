- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Win Update Notes：

    1. Added customization support for operation buttons and keyboard shortcuts.

    2. Models and projects in the homepage project list now support duplication.

    3. Added the More Visual Effects feature, with new ways to share and interact.

    4. Gaussian Rendering data now supports export in additional formats: splat and spz.

    5. Improved alignment when stitching multiple scans.

    6. Optimized the rendering effect during point cloud scanning.

    7. Fixed some known BUG.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Win 版更新说明：

    1. 新增操作按键和快捷键自定义的功能；

    2. 新增首页项目复制功能；

    3. 新增“更多特效”的分享玩法；

    4. 高斯渲染数据支持导出更多格式：splat、spz；

    5. 优化多个 Scan 拼接能力；

    6. 优化点云扫描时的渲染效果；

    7. 修复已知 BUG。
