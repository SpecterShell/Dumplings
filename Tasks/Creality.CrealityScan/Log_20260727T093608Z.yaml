- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Windows Update Notes：

    1. Added support for the Creality Pika scanner.

    2. Added marker-free laser scanning for the Sermoon X1 module via USB connection.

    3. Added a “Gaussian Rendering” feature.

    4. Added a “Gaussian Rendering” option within the AI re‑texturing feature.

    5. Added an AI body completion feature.

    6. Added support for converting imported generic models into project files.

    7. Added four new languages: Thai, Malay, Indonesian, and Vietnamese.

    8. Optimized some feature effects and user interface experience.

    9. Fixed known bugs.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Windows 版更新说明：

    1. 适配 Creality Pika 扫描仪；

    2. 新增 Sermoon X1 在 USB 连接时的蓝色线激光无标志点扫描；

    3. 新增“高斯渲染”功能；

    4. AI 重贴图功能中，新增“高斯渲染”选项；

    5. 新增 AI 人体补全功能；

    6. 支持将导入的通用模型转换为项目文件；

    7. 新增四国语言：泰语、马来语、印尼语、越南语；

    8. 优化部分功能效果、UI 界面体验；

    9. 修复已知 BUG。
