  Value: |-
    What's New in v0.4.12
    Open-source tool voor inspectie, oplevering & kwaliteitsborging bij bouwprojecten.
    Features
    - Tickets & gebrekenregistratie op plattegronden
    - Checklist-inspecties met 10 templates (pass/fail en NEN 2767)
    - Energielabel opname — volledige NTA 8800 data-verzameling
    - Monument inspectie — constructie, interieur, vocht/schade
    - Oplevering met proces-verbaal en digitale handtekeningen
    - Dashboard met real-time statistieken
    - Camera-integratie voor foto-opname op locatie
    - 4 talen: Nederlands, Engels, Duits, Frans
    - HTML/PDF rapporten
