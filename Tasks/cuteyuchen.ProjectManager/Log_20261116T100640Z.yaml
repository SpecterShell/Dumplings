  Key: ReleaseNotes
  Value: |-
    v1.9.0 - 2026-11-16
    优化
    - 快速管理弹窗与项目详情页的项目下拉框改为只列一级项目、只切换一级项目：下拉里不再把整棵项目树铺开，层级展开交给专门的入口。
    - 快速管理弹窗里选好一级项目后，它下面的所有子项目（二级、三级…）会在下拉框右侧逐个平铺成胶囊，点击即可切换；「二级套三级」时二级容器和三级项目都会出现，并按层级用颜色区分（二级蓝、三级紫）。
    - 子项目胶囊上补充运行状态与当前分支：运行中的项目显示绿色小圆点，Git 项目的分支名跟在项目名后面（与文件树共用 git summary 缓存，打开弹窗时按需拉取）。
    - 子项目胶囊的选中态改为「实心层级色 + 白字 + 勾选图标 + 投影」，未选中态退回中性文字色，两者一眼可辨；选中后仍能从底色看出是二级（蓝）还是三级（紫）。
    - 弹窗下拉的搜索保留子项目命中：输入子项目名（含拼音）时仍能搜到它所属的一级项目，避免「新建的子项目搜不到」。
    - 项目详情页不再提供子项目切换器——左侧项目文件树与面包屑已经可以直接选择子项目，头部只保留一级项目切换。
