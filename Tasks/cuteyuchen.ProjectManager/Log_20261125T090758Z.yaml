  Key: ReleaseNotes
  Value: |-
    v1.10.3 - 2026-11-25
    新功能
    - 自动识别项目目录内容变化：clone / pull / 切换分支后，若清单文件与项目配置不一致（例如空目录添加的项目刚拉下前端代码），自动弹窗提示项目类型、脚本与包管理器变化，确认后同步更新。
    - 项目文件树刷新按钮、项目列表刷新按钮、窗口重新聚焦均可立即触发检测，另有后台轮询兜底；软件内 Git 拉取、合并、切分支等操作完成后也会即时检测。
    - 项目类型更新后自动补齐对应命令：Node 项目添加「安装依赖」并按 lockfile 校正包管理器，Java 项目补齐构建预设命令。
    修复
    - 修复后期才拉取代码或通过扫描导入的项目缺少「安装依赖」命令的问题：添加、批量导入、扫描子项目与刷新入库的 Node 项目统一补齐。
    优化
    - 项目配置更新只改动软件内配置，保留自定义命令、备注、标签、分组与 Node 绑定；已选择「暂不更新」的同类变化不再重复提示。
