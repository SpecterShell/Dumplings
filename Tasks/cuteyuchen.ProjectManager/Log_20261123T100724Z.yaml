  Value: |-
    v1.10.1 - 2026-11-23
    新功能
    - 项目列表工具栏新增一键全部展开/全部折叠子项目按钮。
    - 项目管理面板与详情页支持记住每个项目上次手动选中的菜单页签，并同步持久化；重新进入或重启应用直接定位到该项目对应的页签。
    修复
    - 修复编辑项目时修改路径后，点击管理子项目仍使用修改前旧路径的问题。
    - 修复快速管理弹窗中子项目快捷切换胶囊按钮文字被截断省略的问题：增加按钮高度，移除最大宽度与文本省略限制，完整显示项目名称与分支名。
    - 修复设置页中 AI 生成提交信息的模型拖拽排序功能失效的问题。
    优化
    - 首页「最近使用」统计调整为一级项目维度，展示时呈现该一级项目下的所有子项目。
    - 扫描候选树与管理子项目弹窗增加层级缩进（28px）与分支图标指引，层级区分更直观。
