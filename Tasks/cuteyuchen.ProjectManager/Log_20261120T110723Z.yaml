  Key: ReleaseNotes
  Value: |-
    v1.10.0 - 2026-11-20
    新功能
    - 控制台命令运行状态下，停止按钮右侧新增「重启」按钮，支持一键停止并自动重启当前命令进程。
    - AI 提交信息生成支持多模型自动回退重试：当配置了多个模型时，首选模型报错（如 400 模型未找到/服务商无响应等）自动尝试下一个备选模型，直至生成成功。
    - 设置页 AI 模型列表支持拖拽排序，方便自由调整模型调用的优先顺序。
    - 工作区代码编辑器支持基于文件类型语法与文档上下文的智能联想输入（CodeMirror autocomplete）。
    - 工作区代码编辑器支持引用文件依赖分析与快捷跳转（Ctrl+鼠标左键 / Ctrl+B / F12 追踪引用文件与外部链接）。
    - 项目文件树工具栏新增手动刷新按钮。
    - 关联文件页面支持将外部文件直接拖拽绑定到当前项目。
    修复
    - 修复 Ctrl+左键跳转无后缀代码导入（如 import MenuTree from './menu/MenuTree'）时因存在性检测未校验抛出 Path does not exist 的问题。
    - 修复 UnoCSS 生产打包未扫描纯 .ts 导致大量文件类型图标无法正常渲染的问题。
    - 修复项目文件树中长分支名称与右侧快捷命令按钮重叠挤压的问题。
    - 修复保存文件时 Git 行状态标记刷新造成的短暂闪烁现象。
    - 修复修改项目路径导致关联文件和备忘录数据关联丢失的问题。
    优化
    - 顶部面包屑与管理弹窗的一级项目悬浮下拉框在打开时自动滚动居中定位到当前选中的项目。
    - 工作区代码编辑器支持外部修改平滑热同步与自动重新载入。
    - 项目列表点击项目名称直接打开管理弹窗，点击其余区域折叠/展开，子项目支持快速切回父级。
