  Key: ReleaseNotes
  Value: |-
    v1.7.1 - 2026-09-15
    新功能
    - 工作区编辑器显示 Git 修改状态：新增/修改行在行号槽标色条，删除行以两行交界处短红线标记。
    - Git 变更列表双击文件可直接跳转到应用内编辑器并切换页签。
    - 编辑器支持快速打开文件（Ctrl/Cmd+P）与全局查找（Ctrl/Cmd+Shift+F）：路径索引排除依赖目录，全文搜索有界并发且可取消。
    - 全局查找面板支持替换与全部替换；点击结果可在下方预览编辑器中定位命中行，并一键打开到主编辑器。
    优化
    - 控制台「重新运行」在会话结束或会话被清理后仍可用。
    - 资源管理器背景与编辑区统一为实色 surface，CodeMirror 主题改用全局 CSS 变量，消除左右割裂。
    - 快速管理弹窗中「编辑项目」不再关闭管理弹窗；编辑弹窗叠层显示在管理弹窗之上。
    - 编辑项目弹窗内「一级页快捷运行」改为横向标签与多列网格，去掉排序操作，更省空间。
