  Key: ReleaseNotes
  Value: |-
    - added bypass signon in menu - file - edit/new session.
      Specify whether you wants to bypass the AS/400 sign on page. Make sure AS/400 server QRMTSIGN value is set to verify.
      This option may not work on older AS/400 OS types. The current MochaSoft implementation uses SHA1. There is also an older 3DES and a PBKDF2 with HMAC SHA-512 option described in the IBM documentations, All 3 are not linked to specific AS/400 OS versions. If the protocol is not supported, the normal sign on screen will be displayed.
