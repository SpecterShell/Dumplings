  Key: ReleaseNotes
  Value: |-
    Style Updates
    We've updated the following built-in styles to make sure they reflect the latest guidance:
    - EU Style
    - UN Style
    - WHO Style
    - Microsoft Style
    - Chicago Manual of Style
    Bug Fixes and Improvements
    - Updated copyright information to reflect the current year
    - Fixed an issue where text in the preview pane wasn't always displaying correctly
    - The Abbreviations Not Used check now runs faster and more reliably
    - Fixed an issue where certain invisible characters or unusual formatting could cause unexpected errors
    - Resolved a problem where PerfectIt could crash when working on very large documents (those with 32,000 paragraphs or more)
    - Fixed an issue in PerfectIt Cloud where PerfectIt couldn't always pinpoint the location of abbreviations that were missing their definitions
    - Fixed a rare issue where clicking the Start button didn't always work as expected
    - Fixed an issue where abbreviations were sometimes flagged as undefined even when they had already been defined in an abbreviations table in the document
    - Resolved some display and scaling issues in PerfectIt for PowerPoint
    - Fixed a display issue that could affect how multiple locations were shown for a single check result
    - Fixed an issue where some checks could produce unexpected errors
    - Various improvements to performance, stability, and the overall interface
