  Key: ReleaseNotes
  Value: |-
    黑武士 5 Pro 空间站体验升级
    黑武士 5 Pro 现已支持空间站 5.0。升级后可使用更灵活的按键映射、Shift 配置层、宏动作、独立连发、模拟量映射和分区控制，让一套手柄配置适配更多游戏和使用场景。
    黑武士 5 Pro 当前可继续使用桌面版。升级 5.0 固件后，可通过网页版使用全新的空间站 5.0 功能；桌面端支持将在后续上线。升级后需要重新配置，原桌面版配置会保留，降级后仍可使用
