  Key: ReleaseNotes
  Value: |-
    clipkeep v0.2.0
    新增
    - 中文安装包，安装无需管理员权限，首次运行后自动开启开机自启
    - 右键菜单的「发送到设备」「移动到分组」改为级联子菜单，支持悬停展开和键盘操作
    优化
    - 窗口呼出与隐藏即时响应
    - 列表滚动更流畅，记录较多时也不卡顿
    - 内存占用降低约 40%
    - 滚动列表时，搜索栏下方显示分隔阴影
    - 开机自启：笔记本用电池时也能启动，长时间运行不再被系统结束，并以正常优先级运行
    修复
    - PixPin 等软件复制的截图不会被记录 (#1)；同时修复标准 V5 位图、带透明度的位图、自上而下排列的位图无法记录
    - 打开设置页和托盘菜单时，开关不再闪动
    - 未加入分组的条目不再显示「移出分组」
    - 移动分组后菜单正确关闭
    - 滚动列表时，选中项不再随鼠标跳动
    - 开机自启设置失败时，错误信息不再显示为乱码
