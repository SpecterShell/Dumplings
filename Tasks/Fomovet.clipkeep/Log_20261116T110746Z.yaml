  Value: |-
    clipkeep v0.2.5
    本版本修复面板可能变成“看不见但挡住点击”的隐形窗口的问题，并修正检查更新时误报已撤回版本的问题。
    修复
    - 隐形窗口挡住点击：WebView2 进程意外退出后，面板可能留在屏幕上但不显示任何内容，导致屏幕上一块区域无法点击，退出 clipkeep 才能恢复。现在会立即收起面板，并自动重启到托盘，历史记录和设置不受影响。
    - 面板显示“此页存在问题”：WebView2 渲染进程崩溃后，面板会显示一个无法关闭的错误页。现在会收起面板并自动重新加载，再次呼出即可正常使用。
    - 检查更新误报：GitHub 可以访问时，仍可能因 jsDelivr 的缓存提示一个已撤回或尚未发布的版本，且无法下载。现在以 GitHub 的结果为准，只有 GitHub 无法访问时才使用 jsDelivr。
    改进
    - 一分钟内连续发生上述故障时（例如 WebView2 运行时缺失或被拦截），只收起面板，不反复重启；之后再次呼出面板时会重新尝试恢复。
    - GitHub 可以访问时，检查更新不再等待 jsDelivr 响应。
