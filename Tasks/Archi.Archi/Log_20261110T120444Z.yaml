Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    New
    - Add “Delete Bendpoints” menu item for connections with bendpoints
    - Add a preference to export images on Windows with upscaling (fixes incorrect text height but uses anti-aliasing)
    Improvements
    - Built on Eclipse 4.41
    - Better handling of connection end-points with the Orthogonal Anchor (don’t snap to the figure’s centre)
    - Hide some right-click menu items if they are not relevant to selected objects
    - Use element domain name in palette entry descriptions
    - Optimise connection drawing if connection labels are empty
    - Remove the Alt-click shortcut for the Quick Add popup as it conflicts with figure resizing modifier keys (use Shift+A shortcut)
    - Add From/To labels to the “ArchiMate Relationships” dialog matrix’s top-left cell
    - Default Figures in Preferences are now sorted by domain
    - Better handling of opening unsupported models
    - Better handling of deleting read-only files on Windows
    Fixes
    - Fix “Invert Connection” menu item not bound to a shortcut key
    - Add Hide Strategy property to customizable report template
    - Show Physical elements in the Magic Connector popup list when Elements are shown first
    - Fix “Used in Views” and “Model Relations” analysis tables not sorting by name
    - Other internal fixes and optimisations
ReleaseTime: 2026-11-10
