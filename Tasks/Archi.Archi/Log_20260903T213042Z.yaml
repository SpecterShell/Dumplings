Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    New
    - Add Markdown/HTML support for documentation fields in Properties tab and HTML reports
    - Add “Quick Add” popup dialog in ArchiMate Views (Alt+click and Shift+A shortcuts)
    - Support for SVG image format in diagram figures
    - Support multi-monitor display scaling on Windows (Eclipse)
    - Add zoom support to the Visualiser
    - Add “Manhattan Router” option for connections to the Visualiser
    - Zoom in diagrams now centres on the mouse cursor location
    - New grid display in diagrams
    - Add new option for connection label offset (North, South, East, etc.)
    - New selection and drag outline figures
    - Allow Aggregation/Composition connections from Grouping/Location to Junction
    - Add relationships to the “ArchiMate Relationships” dialog
    - Add Clear Cache button for Edge browser in preferences on Windows
    - Import ArchiMate exchange format creates a bendpoint on connection for sourceAttachment and targetAttachment
    - Add a preference to show a circle indicator in tabs rather than an asterisk for unsaved changes
    Improvements
    - Built on Eclipse 4.40 and the latest Eclipse GEF/Draw2d frameworks
    - Bundled Java Runtime is version 21.0.11+10
    - Improvements to rendering of diagram figures
    - A figure’s width and height is no longer 1 pixel short due to fixes in GEF/Draw2d
    - Use a tooltip to display the parent folder paths in “Used in Views” and “Model Relations” analysis tables
    - Update themes to the latest Eclipse versions
    - The “Classic” theme has been removed as it’s no longer supported in Eclipse 4.40 and later
    - The round tabs option has been removed from appearance preferences as it’s no longer supported in Eclipse 4.40 and later
    - The focused element’s node in the Visualiser has an italic font to differentiate it
    - Improve calculation of some connection anchors
    - Improvements to link regex parsing in text fields
    - Archi version 4.x to 5.x automatic migrator removed
    - Set text position to bottom for some types in figure type preview
    - Improved columns widths in the “ArchiMate Relationships” dialog
    - Select All action in Tree views now updates the selection in other views
    - Improvements to diagram scale calculation
    - Improved handling of ArchiMate relationship rules
    - Added support for future handling of derived and direct relationships
    - Remove unnecessary “p2/org.eclipse.equinox.p2.core”, “org.eclipse.equinox.p2.engine/.settings” and “org.eclipse.equinox.p2.repository” directories from build
    - Improvements to error logging
    - Improvements to menu handling so that plug-ins can contribute to the main “View” menu
    - Update Jasper Reports Fonts library to version 6.21.4 – fixes some issues with emojis and other characters
    - [HTML Report] Update StringTemplate library to version 4.3.4 – fixes some issues with emojis and other characters
    - [HTML Report] Update jQuery to version 3.7.1
    Fixes
    - Fix “Delete From Model” not deleting all connected relationships
    - Ensure that only one Specialization is set for a Concept
    - Fix connection not highlighted blue when hovering with connection creation tool or magic connector
    - Fix possible image export not using display scaling when switching from 100% dislay to higher display scales
    - Fix possible exception in Templates Manager
    - Many fixes in the Eclipse frameworks
    - Many internal fixes and optimisations
ReleaseTime: 2026-09-03
