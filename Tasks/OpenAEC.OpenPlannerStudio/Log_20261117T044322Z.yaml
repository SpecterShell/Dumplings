- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    What's New in v2026.47.0
    - Create Gantt reports in the redesigned Report workspace: five steps follow the paper, layouts choose the rows, and columns and bar options remain under your control. Add dates beside bars, choose the new monospace font or embed a supported font from your computer.
    - Assign fixed amounts to tasks and milestones with cost resources, without changing work hours, availability or task duration. IFC preserves the amounts; MS Project and P6 exports report when they leave them out.
    - Add several predecessors or successors together and follow the dependency chain from the properties panel. Dissolve removes tasks while reconnecting their neighbours; choose how summary tasks are handled.
    - Choose the project’s default task type explicitly, keep resource hours when a duration does not change, and work more reliably when deleting rows, copying tasks between plans or adding subtasks in Table view. Phase templates now follow the interface language.
    - IFC reading better preserves calendar clocks, durations and literal dates. Experimental building-model support, disabled by default, adds guarded Save As and export to new files, source-aware crash recovery and an explicit planning-only choice; replacing an existing local model file remains blocked.
    - The desktop window appears after its first view is ready, feedback shows a link to the submitted issue, and updated dependencies improve security. All 28 interface languages are brought up to date.
