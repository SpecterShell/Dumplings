  Value: |-
    MailCraft's home on GitHub is moving to github.com/UCSLabs. This version finds updates under either name; earlier versions won't find updates after the move, so please update now. (ArtCraft Launcher users: update the launcher when it offers.)
    MailCraft 0.15.0 in short: new features and fixes for the public beta (testers welcome; sign up in #11)
    - Rules look for much more (people, words, size, categories, flags, days) and can copy, flag or show a desktop alert (#566).
    - Every installed font in the Font menu, and resize a picture in a message by its corner or its size (#1493, #1310).
    - Spelling checked as you write on Windows and macOS, with the system's own dictionaries (#954).
    - Select several appointments and copy, cut, paste or delete them together (#1663).
    - Folders and Favorites in your own order, and unsubscribe from the lists of several messages at once (#1514, #1207).
    - An easier-to-read message list, an accent colour of your own, and Paste Text Only (#1657, #1737, #1721).
    - Safer: a reply quotes only what the reading pane shows, an agent gets message text marked as untrusted in every answer and error, and on Linux and the BSDs an attachment opens only when the desktop knows its kind (GHSA-fj8q-crrw-7mxc, GHSA-78v3-fvm2-qhjx, GHSA-2669-rh8f-mcw8).
    - Sturdier: a rule's Delete never deletes for good, Undo of a server calendar change leaves alone what a download changed, and a changed signature is kept when MailCraft closes (#566, #1674, #1746).
    - And more fixes, listed below.
    What's new
    - Rules: more of Outlook's conditions, exceptions and actions. A rule can now look for mail from or sent to particular people, sent only to you, with your address in To, in Cc or in either, or not in To, words in the subject or body, a sensitivity, a size, a meeting invitation, an automatic reply, a category, a flag or the days it came, with several words or addresses in one, set apart by semicolons. "Sent to" is now the condition for particular people; the one that looks for words in the recipients is called "Recipient contains". Each of them can also be an exception (Except if), and a rule can copy mail to a folder, flag it with a due day, clear its flag or its categories, and show a desktop alert for the mail it acts on as it arrives, even when alerts for new mail are off or kept to Gmail's Primary (as those, not while the MailCraft window is in front). A rule's Delete puts mail in Deleted Items. On a Microsoft account, a rule the server can do is kept there; one that looks at the days mail came or whether you flagged it, flags mail, clears a flag or categories, copies mail out of the mailbox, copies it to more than one folder or to one not on the server yet, has two exceptions of one kind that look for different things and not for words (two importances, say), or shows an alert stays on this computer. On a Microsoft or Exchange server account, a rule on this computer that looks at the text of new mail, its size, its sensitivity, whether it is a meeting invitation or an automatic reply, or who it is from or to while the server gives that person by name alone (an Exchange server can), or that copies it into another account's folder, acts once the message is downloaded whole (a message too large or too old to download by itself, when you open it), and shows its desktop alert then, unless the MailCraft window is in front, as it is when you open a message; a later rule that moves it into another account waits with it, nothing is moved or copied into another account after a rule that still can't tell once it is here, and those rules don't copy or move it onto another account's server when its categories, flag or importance change meanwhile. Always Move Messages From This Sender makes a rule for the sender's whole address, and an agent's or a script's new rule that names no account is for the account of the folder in view, not for every account (#566).
    - The Font menu now offers every font installed on your computer, not only six. The six MailCraft has fallbacks for come first; after them every family your fonts name themselves by, with a field to find one among them and a "Check for new fonts" line for after you install some. What you choose is drawn as its own file draws it, in the composer and in File › Signatures, and goes out as a font-family with a font of its kind after it, so a recipient without it gets one of the same kind. Nothing is fetched, installed or shipped with MailCraft; the browser build keeps the six.
    - Picture size (#1310): resize a picture you pasted or inserted into a message: click it and drag its bottom-right corner, or type its width or height in pixels in the Picture size strip that appears along the foot of the message (Reset Size gives it its own size again). The height keeps its proportions, recipients see the new size, and Ctrl+Z puts the old size back.
    - The message list is easier to read (#1657): the line between messages is darker, an unread sender is in the accent color, a message with nothing to preview yet has its sender and subject in the middle of its row, and View › Shade Alternate Rows (the Shade Rows button in View › Messages) gives every other row a faint band.
    - Right-click in the body of a message (or a signature you are editing) and choose Paste Text Only to paste the text on the clipboard without the formatting it was copied with: it takes the message's own font, size and colour (#1721).
    - Accent colour (#1737): File › Options › General › Accent has a fifth swatch, Custom color, which opens a colour picker with a hex field, so the window's accent can be any colour of your own. The colour is fitted to the theme it sits in — darkened on a light window, lightened on a dark one — so text and outlines keep their contrast in the light and the dark theme and in high contrast. Kept in ui.json as customAccent; ui.accent takes {"accent": "custom", "color": "#rrggbb"}, or {"accent": "#rrggbb"}.
    - Folders within an account, and the Favorites kept in MailCraft, can be put in your own order: drag a folder up or down the folder pane, or use Move Up and Move Down in its right-click menu. Inbox, Drafts, Sent Items and Deleted Items stay at the top, the order is kept on this computer, and Favorites that come from Outlook keep Outlook's order (#1514).
    - Select several appointments in the calendar — click, Ctrl+click, Shift+click or Ctrl+A — and copy, cut, paste or delete them together, from the keys, an item's menu or the Home tab's Clipboard group. A move keeps an ordinary appointment's id, UID and details, its length and its spacing; a day of a series is changed as that day, the series never cancelled and made again; the whole set is one Undo; a cut stays where it is until it is pasted, and nothing changes if any item cannot go. The calendar keeps its own clipboard, and the system clipboard only receives a short text that says what was copied or cut. When deleting or moving the set would make an account's server write to people, you are asked once first, and the question lists the appointments under each account whose server sends the mail, each with its day and time (for a move, its new time too) and the people it goes to; somebody else's meetings under a heading that names the organizers a decline would tell; and what writes to nobody under a heading of its own: every appointment is listed, the first twelve that write to people with up to six names each and the rest with how many. Somebody invited to two of them is counted once, and somebody invited without an address is counted too. Copy, Cut and Paste also work from command search (#1663).
    - Spelling (#954): in the desktop composer on Windows and macOS, installed system dictionaries mark misspellings as you write. Right-click a marked word for suggestions, or choose a dictionary and find the next error under Review › Spelling. The check stays on your computer.
    - Left, centre and right alignment of a paragraph in a message and in a signature, kept when sent, on a paste and in a draft; a list item stays left. For now it is a command, format.align, for scripts and agents (#580).
    - Unsubscribe from the lists of several messages at once: select them, right-click and choose Unsubscribe from Their Lists. Each sender is handled once, after one question that shows where each request by mail goes and its subject; web pages are never opened in bulk, and mail with a warning about its sender is left out (#1207).
    Fixes
    - Check for Updates keeps finding new releases if MailCraft's home on GitHub moves (#1837).
    - On Linux and the BSDs, an attachment opens only when it is of a kind the desktop knows by name (documents, pictures, sound and video, archives, mail, calendars, cards, signatures and keys) and the desktop agrees the file is that kind; MailCraft asks it with gio or kmimetypefinder, and says so when neither is installed. Any other attachment can be saved with Save As (GHSA-2669-rh8f-mcw8).
    - In the Flatpak build, an attachment of a kind whose name stands for more than one kind of file (such as PNG pictures, JSON, Ogg audio, Markdown and web pages), or of a picture kind older computers don't know yet (AVIF, HEIC, JPEG XL), isn't opened from MailCraft; save it with Save As and open it yourself (GHSA-2669-rh8f-mcw8).
    - Markdown files, and keys, certificates and signatures (.asc, .gpg, .pem, .p7m, .p12, .pfx, .key, .crl and the like), are asked about before they open, as web pages and Office files with macros are; on Android, files that are asked about first are no longer offered to Share from the message (GHSA-2669-rh8f-mcw8).
    - A reply or forward of an HTML message quotes only what the reading pane shows of it, in HTML and in plain text: however the message nests a template, a hidden block or an element that is left out whole, and as the message looked at the width and in the theme of the reading pane or window the reply was started from (a message not read there is quoted as the other places it was read in showed it, or with only what it shows at every width and in both themes). A message the pane shows as plain text is quoted as that text. Text after a template inside an SVG picture or a hidden block is shown again. Outlook's list markers are quoted as the pane shows them; a picture the pane doesn't draw is no longer quoted, nor a tooltip or the description of a picture in the message that is drawn. An appointment or task made from a message starts with the text the pane showed (GHSA-fj8q-crrw-7mxc).
    - A reply or forward, by an agent or from the message list, of a message never shown in the pane or a window, whose look at every width and theme can't all be worked out, carries the header of the original only (GHSA-fj8q-crrw-7mxc).
    - An agent connected through MCP now gets text from a message, an invitation, a certificate or a server marked as untrusted in answers and in errors alike, whichever command or tool it used. Short words under the program's own fields and in the names of an answer's fields can pass unmarked, and an attachment or export handed over as base64 is marked at the level of the whole answer. A name the agent copies back from an answer, marks and all, still names the same folder or category (GHSA-78v3-fvm2-qhjx).
    - A message asking for a fixed-width family that MailCraft used to turn into Courier New — Consolas, Menlo, DejaVu Sans Mono, Liberation Mono — is now drawn in that family when it is installed here, and in a fixed-width family that is here — its metric cousin, or Courier New — where it isn't (#1493).
    - A Digitally signed or Encrypted message whose bytes Check Again was downloading, and that was put back in Drafts as a draft on another device meanwhile, now gets its new version; before, it kept its old text and files and the new version never came (#566).
    - A draft moved into the Outbox and sent with Send Again is filed in Sent Items as a sent message, not still a draft: Resend takes it, and it no longer offers to be opened for writing again (#1748).
    - Send Again no longer sends a draft that was moved into the Outbox without the questions Send asks of its recipients: it says to open the draft and send it, and Send then asks about a lookalike address or people outside the organisation who would see each other's addresses (#1747).
    - The reading pane scrolls with the keyboard after a click in the message: the arrows, Page Up and Page Down, Space and Shift+Space, Home and End move the message instead of the selection in the message list (#1739).
    - Closing MailCraft with a changed signature open in File › Signatures keeps the change, as leaving the page does; one that can't be saved is shown, saying why, before the window closes (#1746).
    - With the reading pane at the bottom, opening an empty folder or a search with no results no longer shrinks the message list, and its splitter remains resizable (#1787).
    - The addresses offered as you type a recipient now include your own, and list first the people you write to most often (#1776).
    - When an agent asks to undo or redo, MailCraft no longer asks you about an appointment of a subscribed (Internet) calendar that you have open with unsaved changes, as if the Undo would take it away: Undo and Redo keep those, also when the calendar was subscribed after the change or the computer has moved to another time zone since (#1745).
    - With View › Reading Pane › Off, or the Preview list view (which has no reading pane), selecting a message no longer marks it read, since nothing shows it; opening it in a window of its own does, and so does turning the reading pane back on while it is selected (#1734).
    - Insert Link, and the other dialogs a popped-out compose window opens (Word Count, Date & Time, Find…), now come up over that window instead of over the main window behind it, where they were hidden and Link seemed to do nothing (#1712).
    - Renaming a category on a Microsoft account (not one still on IMAP) also gives the new name to your older mail and events that MailCraft doesn't keep on this computer, in every folder and in your own calendars, and Undo gives them the old name again; a message or event with more than 100 categories, or with one whose name is longer than 255 characters or isn't plain text, keeps the old name; when Outlook won't change some of them or won't say which they are, MailCraft says so and the old name stays a category (#851).
    - Windows: a message window minimized while the main window was minimized works again once you bring it back: its close button, its buttons and resizing no longer wait for the main window to be restored (#1314).
    - Increase Indent moves an ordinary paragraph in from the left, not only a list item, and the message goes out with it indented (#1658).
    - macOS: Edit › Cut, Copy and Paste (⌘X, ⌘C, ⌘V) work in a message or an appointment open in a window of its own; they went to the main window (#1500).
    - Undo of a change to a calendar that a server keeps (Microsoft 365, Outlook.com) puts back only the events that change touched: an event that a download changed, brought or took away in the meantime stays as the server has it, instead of going back to how it was on this computer alone while the server was told nothing (#1674).
    - Run Rules Now no longer judges a draft that was changed or sent on another device, or a message that is a draft again, by the version downloaded before, while its new version isn't downloaded yet: a rule for mail with an attachment or with words in the body could act on it for a file or words taken out there. No rule acts on such a message until its new version is downloaded; Run Rules Now then goes by that version (#566).
    - In an Exchange server account (Exchange 2013 to 2019), Sent Items and other folders show who each message went to, instead of "(no recipients)"; a message already here before the update shows them once it is downloaded in full or changes on the server (#1151).
    - Mail that reaches a Microsoft 365 mailbox through a filtering gateway (Proofpoint, Mimecast and the like) no longer shows "Failed check" for every outside sender: when Exchange Online says it didn't enforce DMARC because the mail came through another service first, its failure is not read as the sender's. Mail from the account's own domain still gets the warning (#1568).
    - A line selected together with its line break no longer takes the line after it along: Bullets and Numbering leave that line as it was instead of making it a list item, Increase and Decrease Indent leave its level as it was, and Clear All Formatting no longer takes its bullet or number away (#580).
    - The Rules dialog names the account of the folder that a rule for every account moves mail to, and rules.fromMessage refuses a parameter it doesn't take, such as a misspelt server, instead of ignoring it (#566).
    - The Rules dialog says why it refused a rule in the window's language, as the status bar does; it said it in English before (#566).
    - A rule on this computer no longer moves new mail into another account past a rule made in Outlook that MailCraft can't show whole and that stops the rules after it (#566).
    - Renaming a category renames it in the rules for the mail that uses that list of categories too, except in a rule a Microsoft account's server already has: a rule kept putting on the old name. A rule that looks for the category, or leaves mail with it alone, looks for it by both names, so it still does what it did with mail that comes with the old name (#566).
    - Run Rules Now in the Rules dialog runs the rules it shows, over the folder in view when it is their account's and else over that account's Inbox: with "Rules for" set to another account, it ran the rules of the account in view instead (#566).
    - A rule no longer cuts a word over 200 characters short and so acts on more mail than it names: such a word is refused (#566).
    - Run Rules Now no longer takes the note MailCraft shows in place of a message's text it couldn't read from the disk for that text: a rule with words in the body could act on such a message by the words of the note (#566).
    - A message that a rule moves into another IMAP account as it arrives now reaches that account's server even after you undo an earlier step; before, in a mailbox with no Microsoft or Exchange account, it was moved on this computer only and stayed in the first account's Inbox on its server (#566).
    - Run Rules Now no longer counts among the messages it changed one its rules left as it was: already read, say, or already in the folder a rule moves it to (#566).
    - Moving a rule kept on a Microsoft account's server to a place the server's order can't take is refused, instead of putting the rule in the wrong place (#566).
    - An agent's rule with more than 20 conditions, exceptions or actions is refused instead of being cut short without a word, which let it act on more mail than it was meant to; so is one with "has an attachment" given false, which made a rule for mail with attachments, or a flag given a day, which flagged without one (#566).
    - A rule that puts a category on new mail and then moves it into another account's folder no longer adds the category to the first account's list of categories, but to that account's when it has one of its own, as a Microsoft account does (#566).
    - A rule that deletes mail now always puts it in Deleted Items and never deletes it permanently: mail already there (moved by an earlier rule, or with Run Rules Now over Deleted Items) stays, and so does mail of an account with no Deleted Items. Before, a rule deleted such mail permanently (#566).
    - In the Rules dialog, switching "Rules for" to another account no longer leaves a Move to folder chosen for the first account on that account's folder, which made the new rule move the other account's mail onto the first one's server (#566).
    - An agent now asks you as for sending before an Undo that puts a message back on its way onto another account's server, or brings back a rule that moves or copies mail onto another account's server, and before any change to the rules for the same mail while such a rule is switched on, other than switching that rule off or deleting it, or to the Safe or Blocked Senders that lets more mail through to it, and before a rename of a category that changes the rules for that mail, or a change of an account's address or of the calendar's time zone that a rule for that mail reads. The question names the rule and the server. It asks so too when such a change, beside a rule that gives mail a category Outlook doesn't have yet, has that category made in Outlook, and names the category; and before renaming a category kept on this computer only when a rule still gives the old name, which then went to Outlook unasked. Before, it asked only as for a change of settings, or not at all (#566).
    - A message on its way into a Microsoft account, then moved on into an IMAP account, still goes onto that account's server after Undo; before, Undo left it on this computer only (#566).
    - A rule that looks for words in the body no longer acts on a message too large to download because of the note MailCraft shows in place of its text; before, a word of that note, such as "attached", moved or deleted it (#566).
    - A message copied to another folder of a Microsoft account no longer shows up twice in that folder when MailCraft looked through the account's mail between the copy and the server's answer (#566).
    - An agent's question about your rules says a rule puts mail on another account's server only when it does, not for a rule that files mail into its own account's folders, and before it runs your rules it names each such account once, not once for every rule (#566).
    Public beta. For Microsoft accounts (personal, or work or school) MailCraft is a working mail, calendar and contacts program, kept in step with Outlook on the web; keep Outlook to hand while you try it, and tell us in an issue if anything is lost or out of step. Much of what a daily mail program needs is still to come, and other kinds of account are welcome but not part of the beta. What works is in the README.
    MailCraft keeps your mailbox in its settings folder and saves as you go; one window per mailbox. With a Microsoft 365 or Outlook.com account you sign in on Microsoft's page, and the sign-in is kept by the system's credential store (Windows, macOS, and the Secret Service of GNOME Keyring or KWallet on Linux). What works, and how far each part is from Outlook, is in the README and in docs/gaps.md.
    The builds are not signed with a publisher certificate yet: Windows SmartScreen and macOS Gatekeeper will ask before running them.
