  Key: ReleaseNotes
  Value: |-
    - Added: Support for platform-native image files as RAM disk backing store: VHDX (Windows), DMG (macOS) and RAW (Linux).
    - Added: Custom mount options on Linux and macOS, including noatime, noexec, nodiratime, nobrowse and noowners.
    - Improved: The main window size and column widths are now remembered between sessions.
    - Fixed: Kernel panic or freeze on macOS when creating large RAM disks of tens of gigabytes.
    - Fixed: Disks with hard disk emulation on Windows could stall when a drive letter was a mapped network drive.
