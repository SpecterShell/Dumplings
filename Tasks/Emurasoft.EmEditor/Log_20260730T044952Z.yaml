- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    EmEditor v26.2.4 现已发布。本次发布重点提升稳定性，并包含以下修复与改进。我们建议更新到最新版本，以获得最佳体验。
    - 修复了同时打开多个文件时可能导致崩溃的问题。
    - 修复了在 v26.2.1 中引入的一个问题：可能无法将整个超大文档发送到外部工具的标准输入。
    - 为减少下载和安装失败，Store 版和 MSIX 版的软件包不再包含本地帮助文档（与其他版本保持一致）。如需本地帮助，请下载并安装单独的“本地帮助”安装程序。
    - 修复了 Store 版和 MSIX 版图标的背景颜色问题。
    - 修复了一些与深色模式相关的界面（UI）问题。
    如果您使用的是旧版 MSI 安装程序，请选择 帮助 > 检查更新 来更新 EmEditor。如果更新未能成功完成，请下载最新版本并手动运行安装程序。
    Microsoft Store 版本预计将在未来几天内上线。如果您直接下载 MSI 安装程序，请确认其数字签名由 Emurasoft, Inc. 签发。
    我们建议使用 Microsoft Store 版本或新的 MSIX 安装程序。旧版 MSI 安装程序的更新目前计划于 2027 年 3 月结束。更多信息请参阅常见问题：商店版与新安装程序（MSIX）。
