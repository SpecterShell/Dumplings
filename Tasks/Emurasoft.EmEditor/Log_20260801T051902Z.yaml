  Key: ReleaseNotes
  Value: |-
    EmEditor v26.2.5 现已提供。本次发布以稳定性为重点，并包含以下修复与改进。我们建议更新到最新版本以获得最佳体验。
    - 修复了在禁用文档选项卡时，“打开”命令存在的问题。
    - 修复了当托盘图标运行时，Microsoft Store 版与 MSIX 版自动更新无法正常工作的问题。
    - 修复了在“自定义”对话框的 历史记录 页面更改选项后可能导致崩溃的问题。
    - 修复了部分与深色模式相关的 UI 元素问题。
    如果你使用旧版 MSI 安装程序，请选择 帮助 > 检查更新 来更新 EmEditor。若更新未能成功完成，请下载最新版本并手动运行安装程序。
    Microsoft Store 版本预计将在未来几天内上线。如果你直接下载 MSI 安装程序，请确认其数字签名由 Emurasoft, Inc. 颁发。
    我们建议使用 Microsoft Store 版本或新的 MSIX 安装程序。旧版 MSI 安装程序的更新目前计划于 2027 年 3 月结束。更多信息请参阅常见问题：商店版本与新安装程序（MSIX）。
