  Key: ReleaseNotes
  Value: |-
    Mostly stability fixes and for the first time MultiCommander now is Digitally Signed.
    Windows will shows the publisher name instead of the "Unknown publisher" warning, and security software is less likely to block it.

    The certificate costs are expansive and needs to be renewed every year.
    So if you want to help keep MultiCommander signed, please consider donating at
    https://MultiCommander.com/Donate

    15+ Changes since 16.2
    - Now all .exe/dll files are digitally signed
    - WebView can be disabled
    - 10+ Stability Issues
