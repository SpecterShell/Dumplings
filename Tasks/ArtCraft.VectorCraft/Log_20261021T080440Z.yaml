Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Note
    No FreeBSD aarch64 build in this release. We are having trouble building this architecture within the 5-hour CI timeout across all Craft apps, so we are releasing without it to unblock builds. FreeBSD x86_64 and every other platform are included. FreeBSD aarch64 builds will return once the build fits in CI.
    What's Changed
    - SVG import: hrefs that need no folder stay as written, and images in a non-absolute folder are read by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2837
    - MCP: parse errors and overlong lines wait for room in the 64-line queue by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2776
    - PDF import: an XMP packet nested more than 256 deep is skipped instead of overflowing the stack by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2816
    - PDF import: PDF and .ai layer names without a byte order mark are read as PDFDocEncoding by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2810
    - .ai import: a file whose editing data can't be decompressed says why its layers weren't read by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2800
    - EPS and .ai import: the note for editing data of another page size gives both sizes and the scale by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2799
    - .ai import: page type over a text object is left out only when that object's text has its letters by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2808
    - Legacy .ai export: warns when an image in art it flattens or expands can't be decoded by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2817
    - Legacy .ai export: radial gradients are written with their highlight (Bh) by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2807
    - Legacy .ai export: images are written in the form the version 7 specification shows by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2801
    - PDF export: an image that can't be decoded is left out with a note instead of failing the export by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2790
    - Render: raster exports warn about an undecodable image drawn from a kept Rasterize image by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2781
    - Place: Bounding Box measures only the art that shows by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2806
    - Place: justified RTF paragraphs marked right to left end their last line on the right by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2815
    - Tabs: Repeat Tab measures the first stop from the left indent by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2809
    - Type: Left and Right reach both sides of a character drawn with no width by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2795
    - Direct Selection: a group selected whole shows its anchors as selected by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2797
    - Fields: Shift+Enter applies a pattern, layer, artboard or asset name and keeps the field active by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2785
    - Accessibility: color and channel sliders report their values to screen readers by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2794
    - Appearance: the inline effect editor shows 3D, Warp, Rasterize and channel choices as dropdowns by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2796
    - Shaper: the Lasso, Smart Guides and the anchor tools skip a Shaper Group's original shapes by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2782
    - Selection: a marquee selects an Intertwine group or a repeat only where it meets their art by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2805
    - i18n: the History panel translates the step names that contain a style's name by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2803
    - Color: type, gradient, mesh and swatch commands store RGB input as color-managed CMYK in a CMYK document by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2812
    - Export: a .ait export names file.saveAsTemplate, and the CLI's convert writes the template by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2813
    - Save as Template: aiVersion 7 is an error for a .ait, and the dialog shows no Version by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2819
    - Patterns: Pattern Options refuses a name another swatch has by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2825
    - Save As: on Linux the file type picked in the save dialog decides the format by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2783
    - Tests: the drag-budget test sets its thread count, and no render test changes the default by @dotCooCoo in https://github.com/storytold/vectorcraft/pull/2836
