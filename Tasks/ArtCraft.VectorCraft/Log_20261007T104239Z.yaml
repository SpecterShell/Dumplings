  Key: ReleaseNotes
  Value: |-
    What's Changed
    - Windows on ARM64: release builds, PE header check, install test on ARM64 hardware by @echelon in https://github.com/storytold/vectorcraft/pull/215
    - Fonts: use craft-fonts as an optional build input; move the Japanese fonts out by @echelon in https://github.com/storytold/vectorcraft/pull/220
    - Fix #206: Live Paint treats every path as an edge, open lines included by @bflatastic in https://github.com/storytold/vectorcraft/pull/223
    - Fix #177: DXF Fit and Aligned text span their two points by @bflatastic in https://github.com/storytold/vectorcraft/pull/226
    - Fix #221: Effect > Pathfinder works on several selected objects by @bflatastic in https://github.com/storytold/vectorcraft/pull/227
    - CLI: a closed stdout ends vectorcraft-cli quietly by @japbcoelho in https://github.com/storytold/vectorcraft/pull/181
    - PDF/.ai import: fonts are found by their PostScript name, whatever hyphens the family holds by @p0lyg0n in https://github.com/storytold/vectorcraft/pull/214
    - Selection tool: Shift+drag on a selected object moves it, constrained by @theironchef in https://github.com/storytold/vectorcraft/pull/225
    - Fix #219: right-click on the canvas opens a context menu by @bflatastic in https://github.com/storytold/vectorcraft/pull/229
    - Type: find fonts by any of their names; say how each one resolved by @imachus in https://github.com/storytold/vectorcraft/pull/209
    - Type: input method composition (Japanese IME) in the Type tool by @imachus in https://github.com/storytold/vectorcraft/pull/207
    - Type: kinsoku, tate-chu-yoko and upright placement for vertical type by @imachus in https://github.com/storytold/vectorcraft/pull/208
    - i18n: Czech interface language by @petrleocompel in https://github.com/storytold/vectorcraft/pull/213
    - Fonts: the font menus leave out macOS's hidden "." families by @EthanSuquet in https://github.com/storytold/vectorcraft/pull/228
    - FreeBSD: release package and a packaging check in CI by @echelon in https://github.com/storytold/vectorcraft/pull/128
    - README: FreeBSD in the platform line and badge by @echelon in https://github.com/storytold/vectorcraft/pull/235
    - Tests: the font resolution test no longer depends on the installed fonts by @bflatastic in https://github.com/storytold/vectorcraft/pull/240
    - Dialogs: the button row is as wide as the fields, not the window by @theironchef in https://github.com/storytold/vectorcraft/pull/239
    - Panels: a flyout wider than 256 points grows towards the canvas by @theironchef in https://github.com/storytold/vectorcraft/pull/237
    - Canvas: a click just outside the canvas doesn't reach the tools by @theironchef in https://github.com/storytold/vectorcraft/pull/233
    - MCP: prompts, resource templates, completions and logging by @fahrim in https://github.com/storytold/vectorcraft/pull/216
    - i18n: UI localisation framework and a Traditional Chinese (zh-hant) catalog by @WildfootW in https://github.com/storytold/vectorcraft/pull/205
    - i18n: names are never translated; palette cache; locale probe off the UI thread by @bflatastic in https://github.com/storytold/vectorcraft/pull/243
    - Fix #231: docs/releasing.md describes the release pipeline by @bflatastic in https://github.com/storytold/vectorcraft/pull/244
    - Fix #234: EPS files from the reference app open by @bflatastic in https://github.com/storytold/vectorcraft/pull/249
    - ROADMAP: the DXF Fit/Aligned text, Effect > Pathfinder and translation fixes by @bflatastic in https://github.com/storytold/vectorcraft/pull/251
    - Control: close the connection on input that isn't a request by @Luskish in https://github.com/storytold/vectorcraft/pull/254
    - Type tool: a drag across text that isn't being edited selects it by @theironchef in https://github.com/storytold/vectorcraft/pull/246
    - Type tools: a dragged area-type frame is the dragged rectangle by @theironchef in https://github.com/storytold/vectorcraft/pull/253
    - Palette: entries rebuild when keyboard shortcuts change by @bflatastic in https://github.com/storytold/vectorcraft/pull/261
    - Canvas: a drag from a ruler onto the canvas makes a guide by @theironchef in https://github.com/storytold/vectorcraft/pull/263
    - i18n: Japanese translates every menu label by @p0lyg0n in https://github.com/storytold/vectorcraft/pull/262
    - Fix #255: selection exports report the encoder's warnings by @bflatastic in https://github.com/storytold/vectorcraft/pull/271
    - Fix #256: inspect_document reports the paint type's characters show by @bflatastic in https://github.com/storytold/vectorcraft/pull/272
    - Fix #259: the docs say document.inspect reports paint as a label by @bflatastic in https://github.com/storytold/vectorcraft/pull/273
    - Fix #258: the save_file tool says what it saves by @bflatastic in https://github.com/storytold/vectorcraft/pull/274
    - Fix #257: format lists name every format the engine reads and writes by @bflatastic in https://github.com/storytold/vectorcraft/pull/275
    - Toolbar: double-clicking Hand, Zoom and the transform tools works by @theironchef in https://github.com/storytold/vectorcraft/pull/265
    - Status bar: the artboard navigator works, and fitting shows its artboard by @theironchef in https://github.com/storytold/vectorcraft/pull/267
    - Free Transform: a handle drag follows the modifiers held during the drag by @theironchef in https://github.com/storytold/vectorcraft/pull/269
    - Fix #260: tate-chu-yoko numbers and upright glyphs keep their own cell in vertical text by @bflatastic in https://github.com/storytold/vectorcraft/pull/281
    - Fix #252: area type resizes its frame with the mouse by @bflatastic in https://github.com/storytold/vectorcraft/pull/289
    - Canvas: Ctrl with another tool drags with the selection tool used last by @theironchef in https://github.com/storytold/vectorcraft/pull/276
    - Canvas: Ctrl+Space zooms (Ctrl+Alt+Space out), Space alone pans by @theironchef in https://github.com/storytold/vectorcraft/pull/279
    - PDF/.ai import: type set on a path comes back as type on a path by @p0lyg0n in https://github.com/storytold/vectorcraft/pull/278
    - Shortcuts: chords with Shift and a punctuation key fire as typed by @theironchef in https://github.com/storytold/vectorcraft/pull/282
    - Canvas: double-clicking type with a selection tool puts the caret there by @theironchef in https://github.com/storytold/vectorcraft/pull/284
    - Symbols panel: drag art in to make a symbol, drag a symbol out to place it by @theironchef in https://github.com/storytold/vectorcraft/pull/288
    - PDF/.ai import: art of a neighbouring artboard stays on its own page by @p0lyg0n in https://github.com/storytold/vectorcraft/pull/286
    - Tests: Japanese file and folder names save, open, export and title documents by @p0lyg0n in https://github.com/storytold/vectorcraft/pull/287
    - Release: VectorCraft v0.4.0 by @bflatastic in https://github.com/storytold/vectorcraft/pull/294
