  Key: ReleaseNotes
  Value: |-
    Upgrade notes
    TypeScript plugins: BranchLifecycle.registerOpening was removed
    BranchLifecycle.registerOpening is removed from the generated dimcode/plugin declarations and the runtime dispatch surface, with no cross-language replacement. A TypeScript plugin that registered an opening receipt fails with TS2339 and must remove the call. activated() is not a replacement: it resolves after the branch is published, too late to delay or refuse an opening. Pre-publication opening receipts are Rust-only through the branch-private BranchOpening key. The client protocol, events and persistence format are unchanged. See Branch opening hook compatibility.
