Version: "9.1"
Installer:
- InstallerUrl: https://github.com/GyanD/codexffmpeg/releases/download/9.1/ffmpeg-9.1-full_build.zip
  NestedInstallerFiles:
  - RelativeFilePath: ffmpeg-9.1-full_build\bin\ffmpeg.exe
    PortableCommandAlias: ffmpeg
  - RelativeFilePath: ffmpeg-9.1-full_build\bin\ffplay.exe
    PortableCommandAlias: ffplay
  - RelativeFilePath: ffmpeg-9.1-full_build\bin\ffprobe.exe
    PortableCommandAlias: ffprobe
Locale:
- Key: ReleaseNotesUrl
  Value: https://raw.githubusercontent.com/FFmpeg/FFmpeg/release/9.1/Changelog
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - ASTC image encoding and decoding via libastcenc, with .astc and KTX 1.0 muxers and demuxers
    - extensively improved AAC encoder
    - APV Vulkan encoder
    - iTerm2 inline image protocol muxer
    - LCEVC payload merging bitstream filter
    - MVR demuxer
    - latticepal filter
    - DVD-Audio LPCM decoder and demuxing support
    - AVFoundation input device selection by unique ID and USB serial number
    - NVIDIA optical flow accelerated interpolation filter (vf_fruc_vulkan)
    - H.264 data partitioning support
    - DSD (dsd_msbf) encoder
    - Rhetorex ADPCM decoder
    - ADPCM IMA Citrix decoder
    - Panasonic RW2 decoder
    - xHE-AAC encoding via libfdk-xhe-aac
    - jpegapp bitstream filter
    - Infinity IMM6 video decoder
    - Remove the asf_o demuxer
    - D3D12 DirectML zero-copy inference for the ONNX Runtime DNN backend
ReleaseTime: 2026-11-20T06:57:57.0000000Z
