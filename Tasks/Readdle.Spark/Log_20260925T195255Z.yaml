  Key: ReleaseNotes
  Value: |-
    Sorry about the repeated "What's New" screens
    Some of you saw the same "What's New" screen over and over after updating Spark, even after closing it. A bug meant Spark didn't correctly remember that you'd already seen it. That shouldn't have happened, and we're sorry for the interruption. This update fixes it. Because Spark now saves this correctly, you may see the screen one last time after updating, but it won't come back after that.

    We're here for you at support@sparkmailapp.com.

    P.S. If you encounter any issues with the automatic update, please use the following link to download the update manually:
    https://downloads.sparkmailapp.com/Spark3/win/dist/3.31.3.141074/Spark.exe
