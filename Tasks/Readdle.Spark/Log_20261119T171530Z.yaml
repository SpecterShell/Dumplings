  Key: ReleaseNotes
  Value: |-
    What’s new:
    - Spark in the background: Spark keeps running after you quit, so AI agents can still reach it.
    - Raycast: Raycast joins the AI agents list, with setup that opens the Spark extension, and a What’s New for Raycast users.
    - Auto-Drafts:
      - You can Auto-Draft a reply to a specific email in a thread.
      - Turning Auto-Drafts on in Settings now asks for the Persona.
    - Autopilot: a new step-by-step setup. Choose what you want to automate and pick a ready-made task, or describe your own.
    - Fixes:
      - Retrying after an IMAP login error (Yahoo, AOL) no longer hangs or crashes.
      - Search indexing no longer keeps re-fetching a message that fails.
      - The application menu now shows every What’s New screen.
