  Key: ReleaseNotes
  Value: |-
    1. 新增了手机摄像头共享至电脑功能。会议或直播使用手机摄像头，满足高分辨率拍摄效果、自由灵活拍摄角度。
    2. 新增云盘、联系人等云端数据的查看与管理功能，以及设备查找功能；优化了网页版笔记、日历、相册等应用在手机、电脑等设备浏览器中的操作体验。
    3. 原子笔记的待办迁移合并至日历，新增了父子待办、分类管理、优先级设置待办等功能。
    4. 新增了原子笔记多级标题、缩进、子列表等样式；相册视频在线播放；录音机 AI 可视化升级、文本整理、要点关联；全局云同步实时查看状态与手动同步等功能。
    5. 优化了跨屏互联文件管理查看动图、电脑模式适配直板机、修复了已知问题。
