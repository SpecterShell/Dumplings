  Key: ReleaseNotes
  Value: |-
    🤖 更新摘要
    🧑‍🔧 此更新摘要由 AI 基于 commit 历史自动生成
    本次更新围绕「首次使用引导」与「版本更新可见性」展开，并优化了搜索体验细节。
    用户可见亮点
    - 首次启动会进入快速设置引导页，完成后不再自动弹出。
    - 升级后首次启动会展示版本区间内的更新说明，页面可关闭，并可在快速设置中再次查看。
    - 快速设置页与更新说明页支持按 Esc 或 Enter 直接返回搜索栏，键盘操作更连贯。
    - 候选初始化期间，搜索界面显示「正在初始化」而非「无结果」，避免误判。
    稳定性与体验改进
    查询亲和度改为按启动事件衰减，不再依赖冷却配置，使常用候选项排序更贴近实际使用节奏。
    开发者备注：移除了查询亲和度的冷却配置项，相关配置结构有调整。
    📋 完整更新记录（按类型分类）
    ✨ 新功能
