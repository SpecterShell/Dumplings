    - feat(search): 首次启动快速设置引导页，完成后不再自动显示 (ed20c9c) @ghost-him
    - feat(update): 升级后首次启动展示版本区间内的更新说明 (fb04bfd) @ghost-him
    - feat(update): 更新说明页可关闭并加入快速设置 (32e79e6) @ghost-him
    - feat(keyboard): 支持快速设置与更新说明页按 Esc 或 Enter 返回搜索栏 (e2b38ee) @ghost-him
