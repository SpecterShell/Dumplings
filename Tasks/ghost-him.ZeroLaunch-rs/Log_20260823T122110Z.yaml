    🤖 更新摘要
    🧑‍🔧 此更新摘要由 AI 基于 commit 历史自动生成
    一句话版本定位：v1.2.0 围绕搜索体验与图标性能升级，查询延迟显著降低。
    用户可见亮点：
    - 空查询时展示常用候选项主页，支持开关
    - 搜索匹配详情以平铺分数列展示，支持横向滚动
    - 应用与托盘图标统一更新，移除深色模式白色变体
    - 图标缓存无损 WebP 化并预载内存，查询延迟大幅下降；启动确认改为先隐藏窗口，失败时系统通知兜底
    稳定性与体验改进：修复唤醒搜索窗口时残留右键菜单、切换结果项动作选择未重置，以及 dev 模式前端加载阻塞约 1 分钟的问题。
