  Value: |-
    🤖 更新摘要
    🧑‍🔧 此更新摘要由 AI 基于 commit 历史自动生成
    本次更新聚焦于窗口交互的控制力与内置 AI 助手的使用体验。
    用户可见亮点
    - 新增“回车优先唤醒”开关，开启后按回车即等同 Shift+Enter，省去组合键操作。
    - 内置 AI 助手接入内嵌使用手册，提问时可引用手册内容，回答更贴合实际用法。
    - 助手提示词独立成文本并调整了语气与手册来源说明，对话风格更自然一致。
    稳定性与体验改进
    通知浮层高度现已计入窗口尺寸测算，矮窗口下提示不再被裁切；同时跳过 GitHub wiki 元页面，修复内嵌手册构建失败的问题。
    开发者备注：助手历史上下文预算由 64K 提升至 128K，长对话可保留更多轮次；工具调用过渡消息已单独拆分，便于后续扩展与调试。
    📋 完整更新记录（按类型分类）
    ✨ 新功能
    - feat(window): 新增回车优先唤醒开关，使默认动作等同 Shift+Enter (7b6d151) @ghost-him
    - feat(agent): 设置助手提示词拆为独立文本并补充手册来源与语气 (d65d948) @ghost-him
    - feat(agent): 接入内嵌使用手册并拆分工具调用过渡消息 (85dd8b2) @ghost-him
    - feat: 变更版本号 (d6f7271) @ghost-him
    🐛 Bug 修复
    - fix(window): 通知浮层高度纳入窗口尺寸测算，避免矮窗口裁切提示 (github #102) (5bab86b) @ghost-him
    - fix(agent): 将助手历史字符预算翻倍至 128K，避免长对话过早丢失上下文 (a65087d) @ghost-him
    - fix(wiki): 跳过 GitHub wiki 元页面，避免内嵌手册构建失败 (4597446) @ghost-him
    Full Changelog: https://github.com/ghost-him/ZeroLaunch-rs/compare/v1.5.0...v1.5.1
    📦 版本说明
    - 安装版 (.msi): 提供传统的安装体验，支持深层代码签名。
    - 便携版 (.zip): 无需安装，解压即用，适合移动或绿色版爱好者。
    - 命令行工具 (zerolaunch-cli_*.exe): zl 命令行客户端，可通过本地 HTTP API 与 ZeroLaunch 交互（文件名含版本和架构信息）。
