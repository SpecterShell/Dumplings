  Key: ReleaseNotes
  Value: |-
    🤖 更新摘要
    🧑‍🔧 此更新摘要由 AI 基于 commit 历史自动生成
    本次版本聚焦于细节体验打磨与若干设置项缺陷修复，同时补齐插件能力的审计与日志易用性。
    用户可见亮点
    - 结果列表的长路径副标题现在会自动省略，鼠标悬停即可查看完整路径。
    - 插件日志面板与错误提示支持一键复制，排查问题更方便（同时移除了日志颜色）。
    - 候选项声明的动作快捷键现在能真正生效。
    - 别名设置可正常添加标签，不再误报校验错误。
    稳定性与体验改进
    修复了别名校验、快捷键失效问题，移除结果列表中无实际效果的「显示启动命令」设置项；插件缺失请求语言时回退简体/英文，设置页不再出现裸 key。
    开发者备注：新增宿主能力暴露审计，插件 API 漏暴露将由 CI 拦截；CI 发布流程在审计前补充前端构建，修复无 dist 时的编译失败。
    📋 完整更新记录（按类型分类）
    ✨ 新功能
    - feat(ui): 结果副标题长路径省略显示并支持悬停查看完整路径 (github #94) (85be744) @ghost-him
    - feat(plugin): 日志面板与错误提示支持一键复制并移除插件日志颜色 (github #62) (be6dc37) @ghost-him
    🐛 Bug 修复
    - fix(keyboard): 让候选项声明的动作快捷键真正生效 (1ed33bc) @ghost-him
    - fix(appearance): 移除结果列表里无实际效果的显示启动命令设置项(github #94) (b5f1f54) @ghost-him
    - fix(alias): 修复别名设置无法添加标签且应用时报校验错误 (github #95) (8addab6) @ghost-him
    - fix(i18n): 插件缺请求语言时回退简体与英文，设置页不再显示裸 key (a5b6d21) @ghost-him
    📝 文档
    - docs(readme): 重写首页并补齐英文与繁體中文三语版本 (b002d45) @ghost-him
    - docs(readme): 区分行内与独立插件的触发方式并修正热键与组件表述 (github #88) (d7b202f) @ghost-him
    🧪 测试
