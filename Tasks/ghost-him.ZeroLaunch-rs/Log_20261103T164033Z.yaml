    - 搜索结果不再等待网址、书签图标下载完成，图标由后台补齐，检索响应更快（github #103）。
    稳定性与体验改进：修复了图标下载阻塞搜索导致的卡顿问题，查询时改为只读本地图标缓存，缺失图标在后台异步补全。
