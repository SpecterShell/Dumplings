    🤖 更新摘要
    🧑‍🔧 此更新摘要由 AI 基于 commit 历史自动生成
    一句话版本定位：本版本以插件化架构重构为主线，统一配置与命令通道，并引入多项用户可见的新功能。
    用户可见亮点：
    - 新增多引擎翻译插件，支持按输入语气翻译。
    - 新增书签详情预览面板，书签管理更直观。
    - 设置页全面升级：搜索管道改为列表-详情分栏，支持背景图片、图标大小、窗口边框与阴影等外观配置。
    - 结果列表单击即可执行，搜索栏右键菜单可刷新数据库，检测到的书签默认不启用。
    稳定性与体验改进：修复设置页不刷新、窗口焦点丢失、热键配置不生效、异步查询竞态等多项问题，并优化窗口提升与清除背景图片等体验。
    开发者备注：本次重构将核心能力拆分为 Plugin SDK 与 ConfigManager，统一了插件注册与生命周期管理，属架构级变化。
