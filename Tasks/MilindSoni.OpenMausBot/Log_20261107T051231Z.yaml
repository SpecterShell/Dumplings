  Key: ReleaseNotes
  Value: |-
    What's new in 0.1.146
    More than one workspace on this computer
    - The ＋ at the end of the rail now offers New workspace on this computer. Give it a name and a colour (Work, Personal, …), and it opens fresh with its own bots, chats and files.
    - One workspace runs at a time, and switching is one click. If a bot is still working, the switch waits for it to finish.
    - Right-click a workspace to rename it, change its colour or remove it. Remove asks first and moves the workspace to the Trash.
    - Every Cloud on the rail now has a small cloud on its tile, so Clouds and local workspaces are easy to tell apart.
    The app opens where you left off
    - When the app starts, it reopens the place that was open when you closed it: My Cloud, another Cloud, This Mac or another workspace, or your own server. If that place can't open, it opens My Cloud.
    - The "starts fresh" line at the top of This Mac and other workspaces now has a ✕. It also goes away by itself after a few days.
    Your phone after moving to My Cloud
    - After your bots move to My Cloud, your phone's existing pairing keeps working with This Mac whenever it's open in the app, with no need to pair again.
    - A phone that reaches the copy left behind on this computer now gets a plain message saying the bots moved to My Cloud, instead of trying to connect forever.
    Engines stay up to date by themselves
    - Engines the app installed (OpenCode, Codex, Gemini, Kimi, Cline, Copilot, Command Code, pi, MiniMax, DeepSeek, Cursor on Linux and Antigravity) now update themselves to the versions tested for this release.
    - Updates happen only when no bot is using the engine. The new version is checked before it replaces the old one, and the old one stays if anything goes wrong.
    - OpenCode copies installed before version 2 move to version 2 with your sessions, keys and models kept.
    Voice notes
    - A bot only says a voice note is recorded once the audio is saved. Otherwise it says the note wasn't sent, so a reply never claims a note that isn't there.
