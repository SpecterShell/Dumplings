  Key: ReleaseNotes
  Value: |-
    What's new in 0.1.154
    Settings, reorganised
    - Three groups, always in the same order: the place you are in (This computer or a Cloud), Your account, and This app. Every page says what it applies to.
    - Simple mode shows fewer pages. Turn on Advanced mode at the bottom of Settings to see the rest.
    - One AI page for engines, provider keys and models.
    - Search settings from the top of the window. A result names the page it lives on.
    - Phone & devices is in the profile menu, so pairing a phone is two clicks from anywhere.
    Replies appear as they are written
    - A bot's reply now streams into the chat instead of arriving all at once, in chats and in rooms.
    - Streamed text is shown as the bot produces it. Saved secrets are masked once the message is saved, as before.
    Put a site or web app online
    - Publish to Netlify. A bot can put a site or web app online on your own Netlify account.
    - Included hosting. On a Cloud plan, a bot can publish to the hosting your plan includes, with no Netlify account of your own.
    - Published apps. One page lists everything your bots have put online, with a preview beside the chat and Delete.
    Pairing a phone is clearer
    - Only the pairing code is a QR code now. The desktop app no longer shows store codes or download links: install MausBot from the App Store or Google Play, then pair.
    - The pairing screen says what to scan with: open MausBot on your phone and scan the code from inside the app.
    - A paired phone can delete a bot.
    Apps
    - Gmail or Google Calendar added as an MCP server and not signed in? The bot now offers the one-step connect card in the chat, or uses the app if it is already connected.
    - A bot is told when an app it asked to connect already has an account.
    My Cloud
    - A clear reason when a cloud computer can't start: hours used up, too many at once, or started too often, with the date the hours come back. A free trial gets its own wording.
    - Empty files move to My Cloud, files changed without a new timestamp are picked up, and two files with the same name are reported before a folder syncs.
    Team Cloud
    - A bot is its maker's until they share it with the team.
    - A secret a member types in their private chat stays theirs.
    - Simpler team screens, with "Owner" wording throughout and nothing shown that a member can't use.
    Update a self-hosted server from the app
    - Update server. When a server you're connected to is behind, Settings has an Update server button. It backs up first, updates to the stable version, and goes back by itself if the new version doesn't work. If the app is then older than the server, the same row offers Update app.
    - It works on servers set up with the one-command installer. On a hand-made Docker setup, run sudo ./update-runner.sh --install once. Servers installed with npm are shown the commands to run.
    - The installer sets file permissions itself. If you installed a server from a root shell with unusual settings, run the install command again: it closes the install folder to other users and tells you if it changed anything.
    Fixes
    - A chat you watched to the end no longer shows as unread on your phone or after a reload.
    - Stop reaches the running turn after the connection restarts.
    - OpenCode never runs a model it can't route, and says so plainly.
    - Goals: a decision is recovered when its closing tag is missing or followed by extra text.
    - Memory: Japanese words with a long vowel mark are recalled, and tidying only touches notes the model was shown.
    - Search matches upper and lower case in every language.
    - Calendar: every page is read before a bot reports when you're free.
    - Data: decimals sort correctly, export file names don't collide, and compressed files load with a folder.
    - Notion integration tokens are masked in chats and logs.
    - Emailed sign-in codes stop being read when the turn ends.
