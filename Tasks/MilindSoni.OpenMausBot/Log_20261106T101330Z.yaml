  Key: ReleaseNotes
  Value: |-
    Highlights
    - Groundwork for a new phone connection. Phones will reach your computer over Wi-Fi, Tailscale or MausBot Relay, end-to-end encrypted on every route. It's switched off for now and turns on in stages once the updated phone apps are out. Nothing changes for phones already paired.
    - Phone addresses that sit unused pause on their own. If no paired phone has connected for 30 days, the computer gives its secure address back. It comes back by itself when you open the Phones page.
    - Command Code is now a built-in engine.
    - Folder pages list every file they leave out and can carry map data.
    - Bot pages that fill their window keep a page's height in the chat.
    What's Changed
    Other changes
    - Companion: pause the HTTPS address after 30 days with no phone seen; room for a third domain by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4566
    - E2E phone connection: wire spec v1, Node reference and test vectors by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4561
    - MausBot Relay: control-plane host tokens (dark by default) by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4575
    - test: the credential-card lock test waits for the harness's last write by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4599
    - relay: the phone relay service (splices sealed WebSockets, no database) by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4565
    - Add Command Code as a built-in ACP engine by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4624
    - Control plane: keep the relay signing key across deploys, list only relay1 by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4631
    - Folder pages name every file they leave out, and carry map data by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4563
    - E2E phone connection: the sidecar serves Wi-Fi, Tailscale and the relay by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4571
    - E2E phone connection: the desktop app turns it on and shows the route by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4581
    - A bot page that fills its window keeps a page's height in the chat by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4573
    - Make four release-gate flakes reliable (one real data-interrupt bug) by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4578
    - chore(release): bump version to 0.1.143 by @github-actions[bot] in https://github.com/milind-soni/OpenMausBot/pull/4634
    Full Changelog: https://github.com/milind-soni/OpenMausBot/compare/v0.1.142...v0.1.143
