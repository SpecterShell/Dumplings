  Key: ReleaseNotes
  Value: |-
    What's new in 0.1.141
    Bots that don't get stuck
    - Work handed from one bot to another no longer stalls after a Cloud wakes from sleep. Before, it could wait up to an hour.
    - On a small Cloud, your own messages, and work continuing from your answers, go ahead of bot-to-bot work. Bot work still gets its turn after 5 minutes.
    - Typing "stop" works in every language the app speaks, and stops at once.
    - When something has to wait, it says why: "Waiting for memory on this Cloud", not "Thinking".
    - Stop means stop: your Stop also ends the teammates working on that request, and the same request coming back stays stopped.
    - A bot can't ask back a teammate that is already waiting on it, so two bots no longer wait on each other forever.
    - Results coming back from a teammate no longer send you a second notification.
    - A bot that works around a failed tool call now finishes its turn normally, on every model.
    - When an engine stops, the chat says why, with its last output (secrets hidden).
    When a bot needs you
    - A bot waiting for your password or sign-in now shows "Waiting" on the sidebar and phone, sends you its own notification, and keeps the card in view until you answer.
    - A conversation waiting on you no longer tells you it's "done".
    - Connected apps keep their saved keys when they restart, so you aren't asked for the same password again.
    - On a desktop connected to another computer, password cards show their field when the other computer keeps the password.
    - A new inbox in the right panel collects everything waiting on you: questions, approvals, passwords and sign-ins.
    Clicking a bot's message takes you there
    - Notifications, the bell, unread dots and "waiting" rows open the right conversation, including work threads another bot started.
    Your Mac from My Cloud
    - Cloud bots always reach your lent computer the same way, whichever place is open.
    - Normal bot work no longer locks a bot out of your lent Mac by mistake.
    - When something does need your OK, the chat shows what changed, with Allow and Not now, right where you are. It covers your own conversations and those a bot opened for you.
    - Bots stop retrying when only you can unlock something, and tell you what to do.
    Fewer tokens, less noise
    - Bots on the same role share one prompt cache. A new conversation or a new bot costs much less to start.
    - A reply that only says "noted" no longer starts another bot's turn.
    - @everyone on the Team map goes to your Chief, which passes it only to the bots it concerns.
    - Bots find their own memory notes first time.
    Plans
    - Starter makes up to 5 bots. Making a 6th offers the upgrade. Bots you already have stay.
    - At Full access, bots send messages through connected apps without asking, up to 25 a day.
    Teams
    - Bots are moved over one by one in "Bring your stuff".
    - The Team map is now in German and French.
    - A member's own MausBot's main chat is theirs alone, and its notes go to their memory.
    - A new member's first bot list shows their own MausBot in full.
    - In a group chat, a picked bot gets the message when two bots share a name; typing the shared name alone asks which one.
    - Which of your own accounts a bot uses is yours to say; a teammate's answer doesn't decide it.
    Accounts
    - The rail is the account switcher: every saved account's Clouds, one click away.
    Email and engines
    - Read and send mail on any mail host, connected with one card.
    - Antigravity now starts on a Cloud.
    Bot API
    - Each bot can be an API: call it with a key, and see a ready-to-copy curl example.
    Windows
    - The built-in browser no longer restarts on every action, which opened command windows, dropped the live view and slowed the PC.
    Voice
    - A turn that fails keeps the voice note it recorded, as it keeps its images.
    Moving to the Cloud
    - Moving from your computer lists what stayed behind, and why, instead of saying everything moved.
    - Connectors started with uvx now move to the Cloud like npx ones.
    - If some things never arrive, the rest still moves, the reason is shown, and the move no longer freezes every hour.
    Security
    - Work started from outside, such as webhooks or other people, stays confined to that work and what it hands on, and can't reach your private conversations, memory or rooms.
    - A skill runs by name only from your own typed words.
    - Webhook runs on your own instructions are no longer labelled "information only".
    - Only your own request opens new threads on a bot.
