  Key: ReleaseNotes
  Value: |-
    What's new in 0.1.148
    Connecting to your own server is simpler
    - One way to connect. In the app, ＋ → Connect to a server takes the link your server prints, or its address and a pairing code. A plain http:// address works on your own network (Wi-Fi, Tailscale, .local); a public http:// address is refused with what to do instead.
    - One pairing code. Servers and the web /pair page use the same 12-character code, and a code of the wrong kind says so.
    - Commands that work when pasted. The server prints one link per way in, checks that the address really reaches it, and prints every command the way you started it (npx, a global install or Docker). --lan makes it reachable on this network.
    - Nothing starts by itself. Each way into this computer has its own switch, all off by default. Tailscale and the phone link never start until you turn them on, and a desktop that only connects to your server starts none of it.
    - Phone & devices shows who can reach this computer, with one Pair a device dialog. Servers says how each server is reached, retries a lost connection on its own, and offers Pair again and Remove.
    - The self-hosting guide now has one short path per install method and a troubleshooting table.
    The private desktop stays chosen
    - A bot's Where it works now offers Private desktop.
    - On Let it choose, a bot keeps the place you picked, and starts your private desktop before waking or creating a cloud computer.
    Fixes and smaller changes
    - Codex starts on the chosen model's provider.
    - Linked files over 25 MB are saved, and size limits are explained plainly.
    - Long OpenRouter turns no longer stop on the reasoning size limit.
    - Google sign-in is handed to you when Google refuses the bot's browser.
    - Routines read the newest account when several Gmail accounts are connected.
    - The automation editors and shared-instruction dialogs no longer lag or spin up the fan.
    - A failed connected-apps connection no longer fails the whole turn.
    - An MCP tool's approval card names the custom server asking for it.
    - Paired clients can use "Continue when your limit resets".
    - A Watch button shows while a bot uses its screen.
    - Traditional Chinese is complete. French uses "vous" in the Cloud move messages.
    - Notification previews show as plain text.
    - The sign-in pill slows its checks when a server is down, then says so.
    - More security hardening around proxies, local key checks and shared working folders.
