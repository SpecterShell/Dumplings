  Key: ReleaseNotes
  Value: |-
    What's new in 0.1.142
    MausBot speaks Portuguese and better Japanese
    - The whole app is now in Brazilian Portuguese.
    - Japanese gets the 836 strings it was missing, and one set of terms throughout.
    - On a Team Cloud, each person keeps their own language in shared rooms.
    - With no language picked, the menus and tray now match the window's language.
    - A string a language hasn't translated yet shows in English.
    Bots keep working at their limit
    - A Claude bot at its usage limit carries on with any backup engine that has its tools, not only Codex or Pi.
    - A backup can be another model on the bot's own account.
    - Claude isn't held back at a full window while your paid extra usage still has room.
    Images, video and voice
    - Bots make images in the chat, with a backup provider if the first one fails.
    - Attach a video and bots that see images watch it as frames.
    - Replies can be read aloud with OpenAI's realtime voice.
    - One switch sends a voice note with every reply, for all bots, and a bot can differ.
    - Take turns and dictate on Windows and Linux, through Fish Audio.
    - A Gemini voice key is checked when you save it.
    Chiefs and teams
    - A Chief can answer, for you, a question a teammate asks you.
    - Set access for every bot in a department at once, from its new Access tab.
    - A login kept to some bots stays out of a browser the other bots share.
    Skills, apps and connectors
    - Skills from GitHub bring their whole folder.
    - Bots can turn their own skills on or off, or delete them, once you approve.
    - In Simple mode, a bot's panel lists the MCP servers it can use under Apps.
    - An MCP result over 50 KB is saved to a file in the bot's folder instead of filling the chat.
    - An MCP app card shows a Done note after it makes a change.
    - The MCP sign-in card points to Apps → MCP servers.
    Routines
    - A routine can run on its own model.
    - A recurring routine can skip the replay of a run missed during a reset.
    Engines
    - Connect Kimi, Gemini and DeepSeek in the setup wizard.
    - Claude bots can use DeepSeek and GLM endpoints, set per bot.
    - Cursor installs from its card on a Cloud, fixes a wrong CLI path by itself, and signs in with a link.
    - Plan usage reads OpenCode Go's allowance; OpenCode installs track its 2.x package.
    - Antigravity starts the new account's Google sign-in right after Add Google account, and Simple mode shows its thinking level.
    - Gemini tool calls carry their thought signature back, and OpenAI-compatible relays that send an older function call work.
    - Hermes offers its own default model when nothing else is listed, and its portable launcher works on Windows.
    - Settings explains that ChatGPT Business and Enterprise workspaces can block adding an account.
    Chat
    - Cite selected chat text into your message with Cmd+L (Ctrl+L).
    - A retried send keeps your choice to steer, queue or restart.
    - The reasoning level can change while a bot works.
    - An input method's confirming Enter no longer sends a half-typed answer.
    - Long chats colour code blocks only as they come into view, so they scroll faster.
    - HTML files open in the preview, with Open in browser on the desktop.
    - Right-click a bot's attachment to show the original in Finder.
    Notifications and usage
    - The bell moves into the window's top bar, beside Settings, and the tray's pin works.
    - The usage card says when it was checked, and its tracks fill as you use them.
    Computers and browsers
    - The built-in browser has a Full HD page size.
    - A failed image build no longer leaves stopped containers behind.
    - A computer's sleep no longer counts as a turn going silent.
    - Podman and Docker Desktop are found on a Mac when the app starts from Finder.
    - "Waiting for … to accept this Mac" shows until the Cloud really has it.
    - Persistent connection failures say what to do next.
    Security
    - A signed-in session ends after its idle window passes.
    - Temporary AWS access keys are masked in logs and chats.
    - Codex on My Cloud uses the bot box's proxy for your own connections.
    Fixes
    - No more getting stuck on "Opening My Cloud…" after moving bots to a server.
    - Slow engine detection no longer hides existing chats.
    - Quoted @devs reports send correctly.
