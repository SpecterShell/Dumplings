  Key: ReleaseNotes
  Value: |-
    0.1.137: fixes the blank window
    - Blank window fixed. After updating to 0.1.136, a window whose Cloud hadn't updated yet could show only the rail of places and an empty page. The app now keeps the piece that older Cloud pages still ask for, so they open normally whichever version the Cloud is on.
    - Updates: a failed update check counts once, and its notice stays up during the quiet hourly checks.
    - Goals: a one-on-one goal whose turn keeps losing its slot now stops as blocked instead of retrying forever.
    - Shared workspaces: MausBot's notification tools now refuse on any shared workspace, not only a Team Cloud.
    - Release reliability: the Mac build runs on macos-15 and retries stapling.
    What's Changed
    Other changes
    - Release: build the Mac app on macos-15 (GitHub retires macos-14 on November 2) by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4042
    - CI: wait up to two minutes for a lent computer's first command on a fresh Windows runner by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4046
    - Release: staple up to six times before failing the Mac build by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4043
    - fix(tests): repair main's failing and flaky checks by @zicochaos in https://github.com/milind-soni/OpenMausBot/pull/3977
    - One-on-one goal: a turn that keeps losing its slot ends blocked at the wait cap by @c-dreamer in https://github.com/milind-soni/OpenMausBot/pull/3967
    - Updater: count a failed check once, and keep the failure notice up during quiet checks by @c-dreamer in https://github.com/milind-soni/OpenMausBot/pull/3966
    - MausBot's notification tools refuse on any shared workspace, not only a Team Cloud by @c-dreamer in https://github.com/milind-soni/OpenMausBot/pull/3961
    - Desktop: keep desktopNotices.shown so a Cloud page on 0.1.135 doesn't go blank by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4053
    - chore(release): bump version to 0.1.137 by @github-actions[bot] in https://github.com/milind-soni/OpenMausBot/pull/4054
    Full Changelog: https://github.com/milind-soni/OpenMausBot/compare/v0.1.136...v0.1.137
