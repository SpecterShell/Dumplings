  Key: ReleaseNotes
  Value: |-
    Released on 2026-10-03.
    Python
    - Add CPython 3.15.0rc3 (#22164)
    Preview features
    - Sync from uv.lock without a workspace manifest using uv sync --frozen with frozen-lockfile (#22018)
    - Export from uv.lock without a workspace manifest using uv export --frozen with frozen-lockfile (#22007)
    - Inspect dependency trees from uv.lock without a workspace manifest using uv tree --frozen with frozen-lockfile (#22016)
    - Inspect workspace metadata and optionally sync its environment from uv.lock without a workspace manifest using uv workspace metadata --frozen with frozen-lockfile (#22017, #22018)
    Bug fixes
    - Reject alternate sources for workspace members across conflicting dependency selections, avoiding lockfiles that cannot be installed (#22153)
    - Allow x86-64 Python interpreters running under emulation on Windows ARM64 to install compatible win_amd64 wheels instead of building from source (#22099)
