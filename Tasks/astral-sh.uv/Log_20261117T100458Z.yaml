  Key: ReleaseNotes
  Value: |-
    Released on 2026-11-17.
    Preview features
    - Support PEP 832 .venv redirect files for project environments (#21822)
    - Add the http2-keep-alive preview feature to close unresponsive HTTP/2 connections with active requests (#23236)
    Performance
    - Reduce lockfile size and speed up reads by factoring repeated conditions in environment markers (#23184)
    Bug fixes
    - Reject wheels advertised by an index under a different package name (#23261)
    - Fix uv lock --locked rejecting lockfiles with equivalent platform markers written in different forms (#23185)
    - Correctly quote environment marker values that contain apostrophes (#23185)
    - Report which musl interpreter failed to return a readable version (#23213)
    Other changes
    - Raise the minimum supported Rust version to 1.98 (#23263)
