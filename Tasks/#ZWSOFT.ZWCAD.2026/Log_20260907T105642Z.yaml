  Key: ReleaseNotes
  Value: |-
    This update resolves known issues and significantly improves operational stability for a smoother and more‑efficient design experience. Key updates are listed below:

    1.【New Feature】 RVT File Import: Direct import of RVT files from Revit 2015‑2025.
    2.【New Feature】 3D Section Viewing: New section box and section objects for convenient 3D model section viewing.
    3.【Enhancement】 DATAEXTRACTION: Supports data extraction from multiple drawings. Create linked, updatable extraction tables.
    4.【Enhancement】 MEASUREGEOM: Adds new queries for volume, total area and total length.

    This update is applicable to the following versions:
