- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    中望 CAD2026 3.0 更新修复了已知问题，全面提升运行稳定性，让设计体验更流畅高效。主要更新内容如下：
    1. 数据提取优化：支持多文件提取，可创建带链接、可更新的提取表格；
    2. 测量功能增强：新增体积、总面积、总长度查询；
    3. RVT 文件导入：支持 Revit 2015–2025 版本 RVT 文件直接导入；
    4. 三维剖切浏览：新增剖切框与剖面对象，便捷实现三维模型剖切浏览。

