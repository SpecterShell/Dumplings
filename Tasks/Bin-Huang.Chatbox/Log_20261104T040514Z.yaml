Version: 1.24.0
Installer:
- InstallerUrl: https://download.chatboxai.app/releases/Chatbox-1.24.0-Setup.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    1. Added projects: group chats into projects, with Work Mode chats grouped by working directory
    2. Added a built-in browser to Work Mode on desktop: the AI can use web pages, and you can take over at any time
    3. Work Mode is now on iOS and Android: run code and read Office and PDF files
    4. Consecutive tool calls in Work Mode are shown as one line
    5. Settings are regrouped and searchable; helper models are merged into one Fast model
    6. Image generation supports reference images; added OpenRouter and custom OpenAI-compatible image models
    7. Choose which conversations to back up
    8. Requests retry automatically on network or provider errors
    9. Work Mode approval requests are denied after 45 seconds without a response
    10. Added Auto wrap for code blocks; knowledge bases support DashScope rerank
    11. Sending a message keeps your reading position; deleting a message keeps other branches
    12. Improved context compaction for long Work Mode tasks
    13. Fixed AGENTS.md not loading on Windows and other issues
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    1. 新增项目：对话可按项目分组，工作模式对话按工作目录自动归类
    2. 桌面端工作模式新增内置浏览器，AI 可以操作网页，你可以随时接手
    3. iOS 和 Android 支持工作模式，可以运行代码、读取 Office 和 PDF 文件
    4. 工作模式中连续的工具调用合并为一行显示
    5. 设置页重新分组，支持搜索；辅助模型合并为「快速模型」
    6. 生图支持参考图，新增 OpenRouter 和自定义 OpenAI 兼容图像模型
    7. 备份时可以选择要导出的对话
    8. 服务或网络暂时出错时自动重试
    9. 工作模式的审批请求 45 秒无响应会自动拒绝
    10. 代码块支持自动换行；知识库支持阿里云百炼重排序
    11. 发送消息时保持阅读位置；删除消息时保留其他分支
    12. 改进工作模式长任务的上下文压缩
    13. 修复 Windows 上 AGENTS.md 不生效等问题
ReleaseTime: 2026-11-04T03:19:17.0660000Z
