Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    1. Improved sending speed in long conversations
    2. Improved DeepSeek conversation import speed with lower memory usage
    3. Fixed conversations being unable to continue after importing very large images
    4. Fixed API keys and other credentials saved on this device being cleared after importing a backup
    5. Fixed Work Mode, image generation, and PDF parsing not working on some older Android and iOS versions
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    1. 优化长对话的发送速度
    2. 优化 DeepSeek 对话导入速度，减少内存占用
    3. 修复导入超大图片后无法继续对话的问题
    4. 修复导入备份后，本机已保存的 API Key 等凭据被清空的问题
    5. 修复部分旧版 Android / iOS 系统上工作模式、图片生成和 PDF 解析无法使用的问题
