- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Stable release. Recommended for everyone.
    Source: cd5d6726602f
    What's new
    This release also carries everything listed under 0.1.6, which was built for local review and never published on GitHub.
    Added
    - In-app update downloads show real progress, can be cancelled, and stay ready while you keep working. On writable macOS installs, Install and restart replaces the app after work finishes, preserves your data, and keeps the previous app for recovery. Other installs open their verified system installer. Compact sidebars show new releases too.
    - Settings → Runtime bridge → Sessions outside Squad: turn on recording for Claude Code or Codex and the sessions you start in a terminal appear in the Runs tab of the member on that engine and folder (and in All work), with the question, the tools used and the reply. Squad adds its own hooks to the engine's config, keeps a backup, and leaves your other hooks alone; turning it off removes only Squad's.
    - Chat with a new member. The first item in the sidebar's Direct messages "+", and a button beside New member on the Squad page, creates "New member" and opens its chat, where it says "Hey! I'm New member. What can I help you with?". Tell it what it is in plain English ("you're going to be my GTM Leader", "be our release manager") and it confirms in one line, gives itself a name, a role, instructions, a personality and skills, asks up to four things it needs to start, and gets on with it. The sidebar row renames, one quiet line under the reply says "Alex is now your GTM Leader", and the profile page shows what it set; Edit profile changes any of it. Say "actually, be my QA lead" later and it changes again. Works on every engine. New member's form and New team / Templates are unchanged and remain the other ways in.
    - Members can keep working between messages. Turn on "Keep working between messages" in a member's engine settings (the Runs with menu in the chat header, or the Harness page) and, when the member is idle, it picks up the next open task on its plan, or a goal a restart cut short, by itself: one at a time, at most six a day unless you change it, never within ten minutes of your last message. It shows as an ordinary run and as one quiet line above the composer with Stop, and your next message stops it. Off by default; the setting holds while the app is closed.
    - Talk about repeating work and the member sets it up. Every engine (Autohand, Claude Code, Codex and ACP agents) is now told to propose a routine when you describe work that repeats or ask for the same thing a second time, to ask you one short question when the time, days, time zone, destination or folder is missing, and to record it when you say "yes" or "do it". If you said "every weekday morning", "again", "as usual" or asked the same thing twice and the reply did not propose anything, the member's next turn is reminded to propose it or ask. The "Schedule this?" line is unchanged.
    - New Automation starts with one question, "What should happen, and when?". The member drafts the name, what it will do on each run and the schedule with its own engine, and shows them in the schedule editor for you to adjust and save; if something is missing it asks you first. The old fields are still there under "Fill in by hand".
    - Any coding agent from the ACP registry can run a member. The Runs with chooser now has a second group, From the ACP registry, listing Pi, Autohand Code (ACP), Claude Agent, Codex, Gemini CLI, Copilot, OpenCode, Cursor, Grok Build and everything else the registry publishes, each with a one-line description and whether it is installed or fetched on first use. Installed agents are found on this machine; npx and uvx ones are downloaded the first time they answer. Access works the same way as for Claude Code and Codex: Plan only refuses edits and commands the agent asks about, Edit in folders keeps edits inside the member's folders, Full access allows everything. Previous chats, New chat and Stop work unchanged, and members on different engines can still hand work to each other. The registry is read when the chooser opens, at most once a day, and a bundled copy keeps the chooser working offline. See docs/integration/acp.md.
    - Members keep their own plan. Tell a member what to do in plain English and it adds the work as tasks for itself, marks them done when finished and, when the work recurs ("every weekday morning send the NZ batch"), proposes the schedule as well. Ask "what are you working on" and it answers from its plan, which it now receives on every message, whichever engine it runs on: open tasks with due dates, routines with the next run and last outcome, goals and queued follow-ups. The plan lives on this computer's bridge, not in the browser.
    - The Execution panel's Tasks tab shows the member's plan above launched work: each task with its status, due date, who added it and the last outcome, with Done, Start, Blocked, Edit, Remove and "Ask Alex to work on it", plus Add a task for work you want on its list.
    - If you describe recurring work and the member does not set it up, the reply carries one line, "Schedule this?", with the rule read from your words (weekday mornings, twice a day, every Monday at 8am, every 2 hours, weekly, monthly). Set it up opens the schedule editor pre-filled; nothing is scheduled until you save.
    - A scheduled automation keeps a task in the member's plan: each run reopens it, and the finished run marks it done with the outcome, so the Tasks tab shows the recurring item and how its last run went. Marking it done yourself, or the member doing so, is noted in the automation's run history.
    - A control plane for MCP clients. squad mcp (or bun run mcp from a checkout) runs a stdio MCP server that Claude Desktop, Cursor or any MCP client can register to list members and channels, read channel threads, search, create channels, post to a channel, send work to a member and wait for the reply, and stop it. It talks only to the local bridge, never exposes approvals, deletion, credentials or computers, and replaces anything that looks like a key or token in replies with [redacted]. Members and their models are still created and changed in the app; those two tools say so instead of pretending. See docs/integration/control-plane.md.
    - A mic button in the member chat, quick chat and channel composers. Speak and the words appear in the field as they are recognised; review them and press Enter when you are ready. Nothing is sent on its own. Browsers that can recognise speech on the device are asked to, so audio stays on the computer. In the desktop app the button explains how to use the Mac's own dictation (the Dictation key, or Fn twice), which types into the same field.
    - Read a member's reply aloud with the speaker control on the reply, or turn on "Read replies aloud" in the member's profile so each new reply is read as it lands. Code blocks, file paths, links and tables are summarised instead of spelled out. Replies use the voices built into the computer, or an ElevenLabs voice when a key is added in Settings → Voice; the key stays with the local bridge and is never shown to the browser.
    - Remote access over Telegram. Settings → Remote access takes a bot token from @BotFather, shows "Polling as @bot", and pairs exactly one Telegram account with a single-use code or an Open in Telegram link. From the phone, /members picks a member, a plain message runs it on this machine with one live status message and the reply formatted for Telegram, /new starts a fresh conversation, /stop interrupts, /channels, /status and /help do what they say. The conversation also appears in that member's chat in the app. Handoffs, workflow approvals, channel proposals and failed runs always reach the phone with a link into the app, approvals and proposals with Approve/Decline buttons; finished runs follow the Long work / Everything / Off choice. The bridge polls Telegram outward; nothing is opened to the internet and the token never leaves this machine.
    - Usage shows a ledger of the last 30 days by member, by model and by day: runs, input, output and total tokens, steps when the harness reported them, and time. The same tables appear whether the analytics service or the bridge answers.
    - Settings has a System section with the number of members, channels, threads, messages and memory entries on this computer, the data folder with Copy path and Show in Finder, and a "Check for updates automatically" switch. Off, the app only looks for releases when you ask; manual checks still work everywhere.
    - Channel responder rules. Channel settings gain a Responder row: Everyone (every member answers, as before), Lead (one chosen member answers messages that mention nobody and hands off by mentioning others), or Auto (a quick model call picks who answers; below 60% confidence the lead answers, or everyone). @name and @here always win. If the lead leaves the channel the row says so and everyone answers until you choose another. Auto needs a provider the bridge can call directly with an API key (OpenAI, OpenRouter, DeepSeek, Z.ai, NVIDIA, Cerebras, Ollama, or Autohand AI with an API key); otherwise the row says "Auto is unavailable with this provider" and the channel falls back the same way. Threads show "Answered by Noah (auto · 80%)" or "Answered by Iris (lead)". Member-opened channels apply the same rule to their purpose. One request per un-mentioned message in an Auto channel, none for mentioned ones (bun run check:responders).
    - Settings has a Connectors section. Add an MCP server as a command or a URL, press Test to see the tools it offers, then turn it on; members whose MCP connectors permission is set to Allow get it on their next turn, whichever harness they run on. Keys and tokens stay on this machine and are never shown back.
    - A built-in Web research connector gives members web_search and web_fetch through Firecrawl, with the source address in every result so replies can cite what they read. Paste a Firecrawl key, Test checks it, and the switch turns it on.
    - Follow-ups you send while a member is busy now wait in a queue that lives on the bridge: they survive reopening the app, run one at a time in order, and you can edit, reorder, remove, pause and resume them above the composer (and in Quick Chat). Stop cancels the running follow-up and pauses the queue. After a restart the interrupted follow-up says so and the queue waits for you to resume it.
    - The member chat meta line shows how full the model's context is ("Context 42%") when the harness reports it, with a quiet warning above the composer past 85%. Claude Code members show it today; Codex and Autohand members show nothing until their harness reports a window.
    - Settings → Vault keeps logins, cards and personal details sealed on this computer, with the key held by the macOS Keychain (Windows DPAPI, Linux Secret Service, or a private key file outside the data folder). Each item is one row with Remove; there is no way to show a saved value.
    - Members can list the vault (labels and masked hints such as “Visa ···· 4242”), ask you for a secret through a secure form in the chat whose values go straight to the vault, and ask you to approve a payment: Approve with a saved card, I'll pay myself, or Decline. Requests wait in the chat and in Needs you, notify like an approval, survive a restart, and the member hears only the outcome with the item's id and hint.
    - vault_fill is present but refuses on this Mac with the reason: filling a value needs a member workstation, which arrives with lane L3.
    - Every member has the same menu on its directory row, its sidebar row and the chat header: Pin, Mark unread, Duplicate, Share as preset…, Hide and Remove. Pinned members sort first; a hidden member moves to a collapsed Hidden group under the directory list and leaves the sidebar, and can be shown again from there. Mark unread puts the reply back in Needs you and the sidebar count exactly as a new reply would. Duplicate opens New member filled in with the member's role, personality, brain card, skills and engine, and the copy is prepared like any member.
    - Share team… in the Squad directory saves one .squad-team.json file. The dialog lists what goes in, with a tick box per member and per skill: members (name, role title, instructions and brain card, look), skills (SKILL.md text only), channels (name, visibility, section, member names), workflows (saved paused) and, only when ticked, starter notes. Never credentials, conversations, permission grants, provider or model keys, folders or computers. Anything in the text that looks like a key or password is removed and listed afterwards.
    - Import team… reads a team or preset file, shows what will be created and what was dropped, and then adds it: members start on the Ask level with their skills switched off, channels get a number when the name is taken, workflows arrive paused. A file that is too large, malformed or carries fields a team file has no place for is refused with a sentence. If a workflow cannot be kept, the bridge removes the channels it just made and says so.
    - Presets: every member in an imported team file, and any member shared with Share as preset…, appears under Imported presets at the top of New member's role list.
    - Member automations now have a real schedule: once, weekdays, every N minutes, monthly (any day or the last day), yearly, or a custom cron expression, each in a chosen time zone. The editor shows the next three dates, and scheduled runs start on the bridge even while Squad is closed, as long as the member has chatted or run before and has a working folder; otherwise the automation says it needs Squad open and runs when you return.
    - Each scheduled automation keeps a run history on the bridge: last run and outcome, next run, occurrences skipped because the previous run was still going, and runs stopped by an optional run limit.
    - Ask a member in chat to schedule something and it proposes a routine; the chat shows the rule in words, the time zone and the next three dates with Confirm and Decline. Nothing is scheduled until you confirm.
    - Previous chats. New chat puts the conversation away instead of discarding it. The History button beside New chat lists them, newest first, with the first question, the number of turns, the engine and when; open one and it comes back as the live conversation, and a Claude Code or Codex member continues the very same engine session. Remove deletes one. Up to 100 chats per member are kept on this computer.
    - Every reply shows up in the Execution panel's Runs tab, whichever engine the member runs on: the question as the title, the engine, the model, the status, and the same activity feed as Work details. Stop there stops the reply. Goal turns, queued follow-ups, scheduled routines and Telegram messages appear the same way.
    - Finished runs stay in the Runs tab after Squad restarts (the newest 200).
    - Name a folder in your message ("look at ~/Documents/leads") and the member gets it: with Full access it is added to the member's folders on the spot; otherwise the message waits, the chat shows Allow and continue / Not now, the request appears under Folder access in Needs you, and you get a notification like a vault request.
    - Reasoning effort is a slider, not a drop-down, in the composer settings and the member's engine settings, for every engine: Claude Code and Codex levels from the installed CLI, and for Autohand Code the moa model's thinking levels. The thumb slides, the level name fades in, and a small reset returns to the engine default.
    - When a Claude Code member is refused a folder ("… is outside …; --restricted confines the file tools …"), the reply shows the folder with Allow and continue / Not now. Allow adds it to the member's folders for every later turn and asks it to carry on. Claude Code's own plans folder is allowed from the start, so plan mode can write its plan.
    - Previous chats is proven in a real browser as part of the checks: New chat puts the conversation away, the list shows it, opening it brings it back.
    - New team, beside New member in Squad and in the sidebar's "+". Type what the team is for ("Marketing team for our NZ launch") and Squad proposes three to five members with a name, role, one line of purpose and suggested skills, who leads, the channel they talk in and one or two routines. Untick anyone, rename, pick another lead, then Add team. The dialog closes at once: each member appears in the directory as "Preparing…" and becomes an ordinary member when ready, the channel and the routines (paused) are added after the last one, and a notification says when the team is ready or what could not be prepared, with Retry and Dismiss on the row. Duplicate names get a number.
    - Templates, in the Squad overflow and the sidebar's "+": six built-in teams (Marketing campaign team, SEO growth team, Engineering team, Lead research team, Competitor watch, Inbox follow-up), each with members, instructions, brain cards, skills, a channel, routines that arrive paused and the connections it would use, which stay off until you add a key and switch them on in Settings → Connectors. Search them, open one to see who is in it and what gets created, then Add team the same way. Import opens Import team with a file; From a folder lists every team file in a folder you choose, treated like an import (Ask level, skills off).
    - Team files now carry routines and connections (name and address only, never a key or token), so a team made from an objective or a template can be shared back out with Share team… and arrives the same way elsewhere: routines paused, connections off.
    - Members remember. Every direct message now starts with a short "Earlier conversations" note: the chats you put away with New chat (what was asked, what was answered last), what other members were asked recently, and the latest messages in channels the member belongs to. It works the same on Autohand, Claude Code and Codex, costs a bounded slice of context, and redacts anything that looks like a key. Work details shows whether it was included; the bridge answers the exact text at /api/members/<id>/recall.
    - Claude Code and Codex members get real controls in the composer settings: Access (Plan only / Accept edits / Full access for Claude Code; Read only / Workspace write / Full access for Codex), a model list read from the installed engine (Claude Code's fable, opus, sonnet, haiku and cached models; your Codex default), Custom… for a typed name, and Reasoning effort when the engine has one. Choosing Auto switches a plan-mode member to Accept edits. The same three fields under Advanced in the member's engine settings set the defaults.
    Changed
    - Updates is a simple status, installed/public versions, and one next action. Local builds ahead of GitHub are labelled as previews. Navigation and controls no longer highlight on mouse drag; messages, errors, release notes, and input text can still be copied.
    - Claude execution uses Anthropic's Agent SDK with the installed Claude CLI on compatible versions. Replies, progress, sessions and cancellation stay inside Squad; older CLIs keep their existing compatibility path.
    - Needs you is about what you have to decide. The page is three plain sections in a fixed order, each with a count: Decisions (workflow approvals, secret and payment requests, folder access, handoffs waiting for you, channels and routines a member proposed, memory proposals, grouped by kind with the newest first, each row saying what is asked, who asks, since when, and the action word: Approve, Decide payment, Allow or decline, Review handoff, Approve channel, Confirm routine), Unread (replies and channels you have not read), and Work that stopped (one line per failed or blocked item: the member, your question, "failed · 2m ago"). A reply that failed shows "Retry in chat" and opens the conversation at that reply, where Retry already is; Replay stays on launched runs only. The command line that started a run is no longer printed on this page, and a failed reply is no longer described as a standalone run that lost its parent task. The sentence under the title says what the page holds ("2 decisions · 1 unread · 3 stopped · 1 working") and the sidebar count is the decisions plus the unread, so a failed reply you have not read is counted once, not twice.
    - The Execution panel beside a member's chat now looks like the rest of the app. The title is followed by one sentence saying what is going on ("1 running · 1 handoff waiting", or "Nothing running right now."), a short Now list of open tasks only when there are any, and plain underlined Runs / Tasks / Automations tabs instead of three boxed buttons. Runs are grouped by day and each one is a single line: a small status dot, the member, your question, the time; a second muted line says "chat reply", "goal" or "launched" and names the engine or model only when it was not the member's usual one. Stop appears on a run that is still going. Tasks, handoffs and automations are plain rows too, with no pills, cards or icon tiles, and an empty tab is one sentence.
    - Settings is no longer one long page. Opening it hides the sidebar and shows a list of sections on the left (Setup guide, Appearance, Language, LLM Providers, Chat, Notifications, Voice, Vault, Self-improvement, Handoff retry policy, Needs you, Runtime bridge, Relay, Remote access, Connectors, Updates, System) with only the chosen section on the right. Clicking a section slides the marker to it and fades the section in; the browser's Back and Forward move between sections, Up/Down and Enter work in the list, Escape goes back to where you came from, and every existing link such as "Settings → Vault" opens that section directly. On a narrow window the list becomes one scrolling row.
    Fixed
    - A Claude member continues on another model when Claude says the current model's allowance is exhausted, preserving its conversation and showing which model answered. It remembers the exhausted model until its reset time, stops when the account itself is out of allowance, and keeps Stop working during recovery.
    - A second bug-hunt pass on the installed desktop app fixed 100 more things, listed with causes in docs/reports/bughunt-desktop-2026-10.md. The ones you are most likely to notice: a reply cut off by a restart gets its answer back when the member had in fact finished; a task stuck on "Running" for months now shows as stopped; channels open at the newest message; Needs you opens on Needs you; member History reads as plain sentences; Skills show as installed; the Permissions guardrails show your real settings; and the member pages are plain lists instead of cards.
    - A paused member's dot in the sidebar is grey and says Paused, matching the Squad list. Before, it stayed green whenever the member's session was still open.
    - Adding a team keeps every member. Before, members drafted together were given the same id, replaced each other and only the last one remained.
    - A new install no longer comes with someone else's work: no clients-pie-shop-nz channel, no tasks "running" in a folder you never opened, no pending decision in Needs you, no active "Smoke test" automation, and the four starting members no longer point at a folder on another computer or claim days of activity. Deleting #general or #release-reviews now sticks. The full list of fixes from this pass, with causes, is in docs/reports/bughunt-2026-10.md.
    - The member page's activity calendar shows what that member actually did, ending today, instead of the same made-up year for everyone.
    - Chat header: Stop appears only while something is running; Task list has its own icon; the runs button is called Runs. Suggested prompts read as sentences ("With testing strategies in mind…", "As an Operations Lead…").
    - Member page: the brain card renders its lists as lists, the autonomy line counts the tools that ask first, the memory policy is shown once, the two ✕ buttons that did nothing are gone, Memory & Growth no longer says "No memory updates yet" above a memory, and empty tables say so. The page drops its nested boxes for dividers.
    - A reply that was running when the page was reloaded or closed no longer spins forever: it is marked "stopped before it finished" with Retry. Retry no longer posts your question a second time. A message sent while Squad's local service is down says so in plain words instead of "Failed to fetch", and members show their initial when their picture cannot load.
    - A member that does not answer now fails with what to try (sign in with autohand login, check the model) instead of "chat timed out waiting for Autohand".
    - Channel settings open in a side panel, so Workflows, Repository, Export and Delete channel are no longer hidden below the fold. /squad-members/<id>/chat opens the chat, and unknown member pages open the member's Home.
    - Selected tabs, error cards and other coloured borders show their colour again; a global style had turned every coloured border grey. On a phone the chat header shows the member's status in full and the Squad buttons wrap instead of running off the screen. The start-up splash follows your theme and no longer fades over the app's own start-up screen.
    - The engine version no longer shows Squad's own commit ("Autohand Code 0.8.2 (865b66e)"), and the Harness page names the CLI the bridge actually runs. A reply cut off by a reload is recorded as such, not as "stopped by the user". Tasks in a member's navigation opens their tasks, the Projects page shows the folder the member really works in, and the permission counts agree between the ID card and the Permissions page.
    - New member: picking a ready-made role brings the filled-in form into view, the new member's first message no longer contains a stray "- " or your bio in parentheses, and a picked portrait no longer turns into a bird after a reload. Channel names are made one word as you type ("launch-plan"), and an empty channel offers Add members. Search shows the message, not the member's name twice. Stopping a reply no longer sends you a "could not reply" notification. The account menu loses chevrons that promised submenus.
    - Settings say what they do: Approval waiting names folder and secret requests too, the Vault key line is two sentences, Self-improvement shows each observation problem once with who it affects, Handoff retry stops repeating the default three times, Runtime bridge shows Squad's and Autohand Code's versions separately, Telegram's quietest option is "Only what needs me", and System counts channel messages under that name.
    - New team lists skills by name rather than id. Needs you → All work says why a reply failed, once. Analytics has one name, correct plurals, and "Work handled" instead of a "Queue volume" that contradicted its own "0 queued". About, Policies and Changelog opened in a browser have a way back.
    - Report a bug asks what went wrong instead of for a 1–5 rating. Removing a previous chat, a vault item or a connector asks first. Copy buttons say when they could not copy. Unsent drafts survive a reload. Member names are capped at 60 characters and kept unique (a second "Eva" becomes "Eva 2"). Disk-full and permission errors read as sentences. Run rows explain a failed Stop, say "No output" for finished runs and show hours for long runs. Permissions fits a phone screen, and the member page and forms use sentence case.
    - Sidebar: a member row's tooltip no longer covers its own menu, and the ⋯ button stays visible while its menu is open.
    - The Model page of a Claude Code, Codex or ACP member shows that engine, its model and its settings instead of the workspace's Autohand provider, which those members never use.
    - Renaming a member in chat now updates it everywhere (header, sidebar, every reply) even when you send the rename while the member is still answering, and when it arrives from a goal, Telegram or a routine. Before, the member said its new name but kept the old one.
    - Squad no longer gets stuck on "Waking the squad" after an update. Watching your members' folders under Documents waited for macOS to ask for permission, which froze the app's local service, and the new supervisor then restarted it before you could answer. Folder watching now runs on its own, and the supervisor waits a minute before restarting a service that is still running.
    - A member running on Claude Code, Codex or an ACP agent no longer shows "Autohand AI / moa" as its model in the chat header, the profile preview or /model. It now names the engine and its model ("Claude · fable", "Codex · gpt-6.1-sol"), or "Claude default" when the engine picks; Autohand members are unchanged. Replies show the same.
    - Drafting an automation never takes over the member's conversation: one-off runs no longer replace the engine session the chat resumes.
    - Replies are readable again: bullets sit beside their text instead of above it, and numbered lists keep their numbers.
    - Full access is the default on every engine (Claude Code, Codex, Autohand Code); Plan only / Read only are a choice per message or per member, no longer forced by the permission level.
    - Changing Access or Reasoning effort in the composer now actually reaches the engine; before, the main send path dropped both.
    - The app no longer opens to "Autohand Squad could not render — Cannot access uninitialized variable" after the routines update; a value was read before it was set up. The build is now opened in a browser as part of the checks so this cannot pass unnoticed again.
    - A Claude Code member whose permission level is Chat only no longer stays stuck in plan mode: the composer shows that it is in plan mode and lets you switch it off for a message, and "Auto" now really writes.
    - Previous chats actually keep real conversations: a chat with Work details is several megabytes and the bridge refused it silently. It is accepted now, and if keeping it ever fails the new chat says so.
    - New chat with a Claude Code or Codex member now really starts a new conversation. Before, the engine was resumed with its previous session id, so the "new" chat silently carried the old context.
    - A member no longer answers "Could not answer — error: An unknown error occurred (Unexpected)" when its engine fails to start. The bridge now says what happened in words (the disk is nearly full with the free space measured, the engine is not signed in, it is not installed, it rejected an option, or its runtime crashed before reading the request), writes the same line into Work details, and for a disk or runtime failure quietly tries once more before saying anything. A start failure no longer wipes the member's conversation: before, it was mistaken for a stale session and the next reply started from nothing.
    - The local service is watched. If the bridge stops answering or its process dies, the daemon restarts it on its own (within about five seconds for a dead process, about fifteen for one that hangs), logs it, and backs off if it keeps failing. While it is away the app shows one quiet line instead of a dead screen, and picks up where it was once the bridge is back without a reload.
    - A reply that was running when Squad restarted is no longer lost. It appears in the Execution panel's Runs tab as "interrupted by a restart" with a Retry that sends the same request again through the member's queue, continuing the engine session the member already had. Queued follow-ups, goals and routines keep recovering as before.
    - A member's self-improvement review never learns from a failed reply. Before, two engine errors in a row became a memory of the error text ("Remember: error: An unknown error occurred (Unexpected)").
