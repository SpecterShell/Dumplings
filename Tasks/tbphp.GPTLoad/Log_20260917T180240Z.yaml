    - feat(auth): add login mascot interaction by @tbphp in https://github.com/tbphp/gpt-load/pull/672
    - fix(groups): add missing gateway protocol probes by @tbphp in https://github.com/tbphp/gpt-load/pull/673
    - feat(codex): support standalone search by @tbphp in https://github.com/tbphp/gpt-load/pull/674
    - feat(logs): add model consistency filter by @tbphp in https://github.com/tbphp/gpt-load/pull/675
    - chore(deps): upgrade sdk core by @tbphp in https://github.com/tbphp/gpt-load/pull/676
    - chore(deps): bump github.com/sirupsen/logrus from 1.9.3 to 1.10.2 in /third_party/cpaembedded in the cpaembedded-minor-and-patch group by @dependabot[bot] in https://github.com/tbphp/gpt-load/pull/640
    - chore(deps): upgrade SDK by @tbphp in https://github.com/tbphp/gpt-load/pull/677
