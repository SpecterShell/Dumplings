    11.3.0 - 2026-11-10
    Ghostex 11.3.0 is out. Ghostex asks for approval only when someone new wants in, pairing a phone takes one window, connections between your computers and phones stay up, coordinators keep work items with what needs you right above the chat box, each project gets a main coordinator, terminals draw pictures, Windows builds are signed, and a new iPhone app is on its way.
    🔐 Approvals only at the door
    - Ghostex asks only at the door, with one click: a plain Approve card shows when a new phone or computer asks to pair (compare the three words), when a Collab guest sends a message in Ask me mode, and when an agent turns on Easy Connect, lets a device into it or shares a chat. Approve no longer asks for Touch ID, Windows Hello or a password unless you turn that on.
    - Everything else just works, for you and your agents: connecting your computers, every setting (including the ones agents were refused), GBots, Autopilot, Cloud Boxes, teams, extensions, secret providers and starting an agent with full access no longer ask or say "only you can do this". Agents still can't approve a card, answer a secret request or read your secrets.
    - New switch: require Touch ID or your password to approve (Settings > Security; Windows Hello on Windows), off by default; on the phone it's "Require Face ID to approve" on the computer's page under Machines. It applies to every device that approves for that computer.
    - Settings > Security shows what still asks, and holds the security log's switch: a short list says exactly what asks for an Approve, the Touch ID switch explains itself in its card, and "Show the security log" (moved here from Settings > Extensions > Experimental, same setting) sits beside Open log.
    - Approve any connected computer's cards from the one you're at: a card from a computer you added under Settings > Remote can be approved right there; the "act as the owner" step on the other computer is gone, agents reach your connected computers as soon as you connect them, and a Mac restored from another Mac's backup no longer hides that Mac's cards.
    - An approval card survives a restart and never dead-ends: a request still waiting when Ghostex or a computer's gxserver restarts comes back with the same words and time left, so Approve still works. The same phone or agent asking again gets that request back, a different request replaces the waiting one, and a request that ran out of time says so ("This request expired. Ask again from the phone.").
    - The security log says how each approval request ended: approved (in the Ghostex app, on a paired phone or with the CLI), expired, replaced by a newer request, or withdrawn because the session that asked was closed. gxserver's own log follows each request by its id, and neither log holds a secret or a key.
    - Older apps keep working: phones and computers on older Ghostex versions keep connecting, and their Face ID or Touch ID approvals count as a plain Approve.
    🤝 Pairing a phone or a computer
    - Connect a phone in one window: the sidebar menu's Connect a phone (was Mobile & Remote) opens a window that turns Easy Connect on by itself and shows the code at once, with two plain steps, a line that shows it's waiting for your phone, and Copy the code. It replaces the Remote Setup dialog and the separate Show QR popup, and says you can also use Tailscale or connect another computer from the same window.
    - One question for a phone that asks to pair: the Connect a phone window, the notice that shows when that window is closed and the row in Settings > Remote all ask "Is this your phone?" (or computer) with its name, the three words side by side in large letters and Not my phone beside Approve; after Approve the window says " is connected" with Done. The window's "Need the app?" iPhone link opens the App Store.
    - Settings > Remote fits on one screen: no more tabs. "Phones and computers that can reach this machine" holds Easy Connect's switch, Connect a phone, Connect a computer and every paired or waiting device (a waiting one first, with its three words and Approve, whether Easy Connect is on or off); then "Computers this machine connects to" with Add a computer; then This computer, Tailscale and Advanced (now holding the Relay choice), each opening in place.
    - The phone's first screen says what to do on each device: three steps with icons (get Ghostex on the computer, click Connect a phone there, scan the code here) and one Scan the code button; Paste a code and Use Tailscale moved into "Other ways to connect", and Try a demo computer is a small link under the button. With the new phone app.
    - The phone's scan screen says where the code is: two steps with the camera inside the second, Paste a code instead as a full button and "It won't scan" for tips. Android keeps its live camera there and gains a light button; an iPhone opens Apple's scanner from that step. With the new phone app.
    - Pairing a phone says what is happening, and why it failed: after the scan the phone shows "Check your computer" with the three words and how long it still waits; a failed pairing stays on screen with the real reason ("Nobody approved this phone in time" is no longer "This code has expired") and Scan again, and a pairing that works opens your sessions with "Connected to " on top. With the new phone app.
    - Phones on Tailscale, your network or SSH need no pairing: with the new phone app they work, and can approve, from the first sign-in, with no "Approve this phone?" on the computer. An older phone app still asks once, and a phone waiting to pair now shows in Settings > Remote whether Easy Connect is on or off.
    - Showing a pairing code no longer disconnects your connected devices: the Connect a phone window and the code in Settings > Remote used to restart Easy Connect twice for every code shown, whether anybody paired or not, which cut every connected phone and computer for up to a minute each time. A new phone now reaches the computer through an address of its own, so the others stay connected while the code is on screen and when the window closes. They reconnect once when a new device actually joins: when you approve a phone, or when another computer connects with the text code. Phones on 11.2.1 and later pair as before.
    🌐 Connections and remote computers
    - A computer you control over Easy Connect comes back in seconds, and working connections are left alone: when the other computer's Easy Connect starts again (Ghostex updated or restarted there, a device added), this computer now notices in about 12 seconds and reconnects by itself instead of hanging for about a minute, and a network that is gone only for a moment still resumes without a reconnect. Terminals keep running when the sidebar reconnects, a second window no longer cuts the first one's connection, a connection is no longer dropped the fourth time its live updates hiccup, and a crashed Ghostex no longer leaves an Easy Connect helper behind that drops the next connection every few seconds (macOS and Linux).
    - Every drop and return of a computer is written down with its reason: ghostex logs --file gpui-remote-gxserver-install-debug.log --grep link shows them, and ghostex logs --grep easyConnect.relay shows an Easy Connect relay that keeps dropping its connections.
    - Computers you control over Easy Connect stay connected to each other: a computer you already paired gets connection keys of its own for each computer it reaches, by itself, with nothing to approve and no need to pair again, so the app's connection, Ghostex's own connection and a connection to a second computer no longer get in each other's way.
    - A computer you first set up over SSH runs its newest Ghostex (#533): when that computer also has Ghostex installed (a package, the AppImage or the Mac app), connecting starts whichever Ghostex there is newest instead of always the copy Ghostex installed over SSH, and an older one still running is replaced without closing its sessions.
    - The Machine picker lists only connected computers: on Settings > Agents, Integrations, Dictation and Updates it shows this computer and the ones connected right now ("Only connected machines shown"), and goes back to this computer when the one you picked disconnects.
    🧭 Coordinators and work items
    - Coordinators keep work items: one item per line of work, with where it stands, who has the ball (you, the coordinator or a thread) and one of six statuses: Needs you, Blocked, In progress, Waiting, Later and Finished. Threads, steps, questions for you and what it waits on belong to the item, and a wait on another item or question clears itself once that's done. Coordinators update them with ghostex coordinator item (add, now, step, ask, wait, done, drop, list); your board's open items move over once, keeping their numbers, and the older ghostex coordinator board commands keep working.
    - Coordinators write news, not status sections: a coordinator's reply is a couple of sentences of news, and one quiet line under it says what that turn changed ("Release notes started · 1 ask"), which opens the Work panel at that item; for the latest turn it is part of the "Worked for" line. Running coordinators re-read their playbook at their next message, and Marked handovers keeps working for every other session and for a coordinator's threads.
    - What needs you waits right above the chat box, as one compact list: each question or task is one row with its answer buttons (the recommended one starred) or Done and how long ago, with blocked work and what the latest turn finished below them; at most four rows (three on the phone), then "N more need you". Click a row to open it in place: its full text, its links, Reply (your own words, in the same reply bubble as a message's Reply), Open for a form or page, Mention, Show in chat, Dismiss and Snooze. Its × hides the whole list until something new needs you or you click the Work pill. On the computer, the web and the phone.
    - Snooze or dismiss anything that asks you: Snooze (1 hour, 6 hours or 24 hours) takes it out of the list and the Needs you count until its time is up, also across a restart; Dismiss withdraws it for good and tells the agent that asked.
    - The Board pill is now Work, and it is the one place for the counts: it reads "Work · 4 need you · 7 in progress" while the row has room and shows its coloured counts when the row is tight. The panel lists every line of work by who has the ball (Needs you first, then Blocked, In progress, Waiting, Later and Finished today), and a card that needs you opens to the same Reply, Show in chat, Dismiss and Snooze as a row above the chat box. In Columns, a click on a column's header folds it to a strip, Finished today is a column like the others, and the row scrolls sideways when the open columns don't fit.
    - "In progress" instead of "Moving": wherever you read a work item's status (the Work panel, its Columns, the phone, ghostex coordinator item list) it says In progress.
    - GitHub links show their real state: a PR or issue on a work item shows GitHub's mark and its state in that state's colour (open, merged, closed), whether the coordinator linked it or a thread added it.
    - A question is asked once: when a coordinator's reply asks a question that a work item also asks, only the ask shows, and answering either settles both. A question or task still open when its work is finished stays under Needs you until you answer it or the coordinator withdraws it. ghostex coordinator item ask answers can hold a comma (--answer repeated, or \, in --answers).
    - Each project has a main coordinator on each computer: the first coordinator you create in a project gets a quiet "Main" tag, and right-click (or long-press on the phone) > Make main coordinator gives it to another one. It is the one agents and Chief of Staff contact about that project: ghostex agents send --main-coordinator --project-id <id> "…" (add --computer <name> for another computer, and --if-none create or --if-none session for a project that has none). Closing the main one passes the tag to the oldest coordinator left.
    - Coordinators wear a captain's hat: a coordinator's row, its chat pills, its message cards, the + picker and the phone show a captain's hat instead of the crown. Chief of Staff keeps its crown.
    - A coordinator's threads sit under its card in the Unified sidebar: folded by default, with the crew count on the card to open and close them; an open card lists the busy and recent threads first and the rest behind one "N older threads" row, and a search or Reveal opens the way to a matching thread. On the computer, the web and the phone, thanks to @sebastianarena.
    - New Coordinator picks where it runs: for a project that is on more than one computer (or cloned twice), the New Coordinator dialog has a Computer field listing each copy, with that computer's own agents, models and playbook; a computer that is not connected shows greyed. On the phone, a Folder row picks between the clones of one computer, thanks to @sebastianarena.
    - Coordinator in the New thread picker works in the Unified sidebar: picking it opens the New Coordinator dialog, also for a project merged into another entry, thanks to @sebastianarena.
    - Coordinators can save a rule for every coordinator: give a lasting rule and the coordinator proposes the wording, then saves it as a playbook override once you confirm. ghostex coordinator playbook --list-overrides numbers them, and --add-override, --replace-override <n> and --remove-override <n> change one without touching the others.
    - Make Coordinator sends its first message right away: turning a session into a coordinator (right-click or ghostex coordinator promote) types the message that gives it the role at once instead of queueing it until the agent is idle; a sleeping or closed session is woken and gets it first.
    - A message to a finished thread brings its report back: a coordinator's follow-up to a thread it marked done reopens it under the coordinator and says "reopened", and a reply the thread finished while it was done is shown instead of being lost (#541), thanks to @sebastianarena.
    - A message to a sleeping, closed or finished agent always says what happened (#531): ghostex agents send and ghostex coordinator reopen answer within seconds (sent, or waiting for the agent to start) instead of timing out, a reopened thread's reply always reaches its coordinator, and sending the same message again while the first copy waits no longer delivers it twice.
    - OpenCode threads open on their conversation, also on another computer (#538): a thread's terminal shows the conversation instead of OpenCode's empty start page, a thread on another computer is no longer listed as Finished while it still works, and its coordinator hears "finished its turn" within seconds instead of 8 minutes later. The terminal part needs Ghostex updated on the computer running OpenCode.
    💬 Chat
    - Unanswered forms and pages wait above the chat box in every chat: a form or question page from a reply that still has open questions shows there as a small card (its title, how many questions are open, and Open) until every question is answered, skipped or withdrawn. It is the same list the ? pill counts, so nothing counts twice, and For later questions stay out. On the computer, the web and the phone.
    - Nothing you click scrolls the chat to a question any more: the ? pill, a Q12 tag in a message, a row of the Resources list and Open on a waiting form open the form in the popup over the chat, a question page opens as the page, and a coordinator's question opens in the Work panel. Show in chat is the one exception, and only when you press it.
    - Quieter Autopilot and Resources pills: the Autopilot pill's tooltip says just "Autopilot is on" or "Autopilot is off"; the Resources pill says just "Resources", with a number only while a question is unanswered (it used to count every form, page and visual ever made), and its list shows the newest 30 per group with one "Show all N" row for the rest. On the computer, the web and the phone.
    - Chat look follow-ups (Settings > Chat > Advanced): the ! command card, picture-only messages and the loading placeholder follow Left aligned, Band and Compact, and Compact also tightens the gaps inside a reply. Agent work Reduced and Quiet fold a subagent's report into the agent's work line, keep questions and pictures in view, and the status line names the running call. A custom Transcript width is now the widest the transcript gets, so a side panel you open takes the empty space beside it first. On the computer, the web and the phone, thanks to @sebastianarena.
    - Chat, phone and web follow-ups: the chat's status bar names the running call while its sentence is folded, an answered question shows once, a Quiet chat shows its held words when the agent dies without a notice, and the web version follows this computer's Settings as they change, thanks to @sebastianarena.
    - The chat box opens the moment you scroll back to the end: after scrolling up folds it to one line, reaching the last message (with the wheel or the scrollbar), a click or a keystroke opens it at once, with no empty gap above it. On the computer and the web.
    - The Tasks pill drops tasks the agent no longer has: after a Claude session restarts, or when Claude answers with an empty TaskList or says a task doesn't exist, the old tasks leave the pill, and a TaskList that names tasks shows exactly those. Once Ghostex is updated on the computer running the session.
    - OpenCode keeps showing that it's working for the whole turn: the chat box shows Stop and the working word until OpenCode finishes, also when OpenCode's plugin stops reporting partway through a long turn (#529).
    - One question to Chief of Staff, a GBot or Ask Ghostex no longer starts a swarm of Help chats: Ghostex Help answers from its guide or says the guide doesn't cover it instead of asking itself again, asking again waits for the answer already on its way, and Chief of Staff, a GBot or Ghostex Help starts at most 6 sessions for one request.
    📱 On the phone
    - New phone apps: the new iPhone app (through the App Store after Apple's review) brings the full fix for the call microphone, which now starts again in place, and the new iPhone and Android apps connect to each Easy Connect computer with a key of their own, so two Easy Connect computers no longer slow each other down. Phones on the older apps keep working with this release, but get this release's phone changes and later updates only once you install the new app.
    - New session at the top of the phone's Sessions list: the pencil lists every project on every computer, recent ones first, and starts your remembered agent there in the view the phone's Default agent view picks; the phone also gets its own Hide projects without sessions switch, thanks to @sebastianarena.
    - A computer's page on the phone puts what matters first: Machines > a computer opens a page that says whether it is connected and how, shows its Approvals and the devices that can reach it, and keeps the rest behind one row each, instead of one long form with a Save button. With the new phone app.
    - The phone's Machines screen is tidier: a computer's state is coloured once ("Can't reach" instead of "Failed"), a tap opens the computer's page (swipe keeps Remove), and the ways to add a computer are one compact row each. With the new phone app.
    - A busy coordinator chat on the phone stays light: its live updates now carry only what changed, so watching it costs about 35 KB a minute of mobile data instead of about a megabyte.
    - The iPhone's local network question makes sense: it says Ghostex uses the local network to reach your computer directly, instead of a developer message about development servers. With the new iPhone app.
    🎙️ Voice and Dictate
    - Dictate types exactly what the engine heard: Ghostex no longer polishes dictated text with AI, removes filler words or keeps its own dictionary; set those up in Hex if you want them (OpenAI and xAI will mishear names more often). The speech models Ghostex's old built-in engine downloaded are deleted by themselves.
    - The voice agent's status answer is short: "What are my sessions doing?" gets the counts and the sessions waiting on you in a couple of sentences, with an offer to go into detail, instead of a half-minute list of every session.
    - A voice call from your phone reaches your other computers: the voice agent started from the phone reads and acts on the sessions of every computer that computer is connected to, as it does from the desktop. Needs Ghostex updated on the computer the call runs on.
    🖼️ Terminal, Files and the window
    - Pictures in terminals: programs that show pictures with the Kitty graphics protocol (agent CLIs that draw diagrams and charts, and TUIs that use Unicode placeholders) now draw them in Ghostex's terminals on the computer, as they do in Ghostty (#536, thanks to @adriancendon). The web terminal doesn't draw pictures yet, and a picture already on screen is gone after Ghostex reattaches to the session.
    - No more stray "23;24;28;32;42c" in an agent's terminal: with a session also open on a second computer, switching to its terminal no longer types that text into the agent's prompt or shrinks the terminal to the other computer's size. For sessions started after Ghostex is updated on the computer that runs them.
    - Cmd+= and Cmd+- zoom in half the steps: 5% around 100% instead of 10%, with the larger steps above and below halved too, and half a point for a terminal's own text zoom. 70%, 200% and Cmd+0 are unchanged. On the computer and the web.
    - Grok Bot and Claude buttons moved to the header: they sit, Grok Bot first, directly left of the "Talk to the voice agent" button (each only while its extension is on), and the Grok extension is now called Grok Bot in its tooltip and Settings.
    - Cmd+D from a session in a sidebar folder keeps the split: the new session joins that folder and opens beside it, and the other quick creates there do the same (#525), thanks to @roypadina.
    - A project's buttons work on an entry that merges two copies: Add Worktree, History, Create Agent and the launcher's agents act on the copy they name, and the Unified sidebar's project menu works for a project the Project sidebar hides (#534), thanks to @sebastianarena.
    - The VS Code view and the web runtime stay installed across updates (#530): when an update brings a new version of either, it updates by itself instead of asking again as if it were a first install, and a download identical to the one you have is kept without downloading it again.
    - .tsx and .jsx files are coloured in Files like .ts files: imports, strings, comments, keywords, JSX tags and attributes.
    - Arrow keys no longer type a blank into a Ghostex page's text field (a page's note box, the Code view or another web view) when a key was pressed before the web runtime finished loading.
    🪟 Windows
    - Ghostex for Windows is signed (#224): the installers and the app (Ghostex.exe, its runtime and helper, the editor, gxserver, wmx and the updater) carry a Certum code-signing certificate, and Windows names the publisher "Open Source Developer Mohamad Yahia Youssef", so SmartScreen and antivirus warnings about an unknown publisher should fade as the certificate gains reputation.
