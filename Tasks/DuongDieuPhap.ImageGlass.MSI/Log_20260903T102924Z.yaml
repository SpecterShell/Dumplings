    - Read the blogpost: https://imageglass.org/news/introducing-imageglass-10-rebuilt-for-speed-and-cross-platform-support-107
    📝 Changelog (since v10.0.4.819)
    New
    - core: Added new API IG_ApplySettings to allow user to update app settings via a custom action (such as toolbar button) #2042
    - core: Added support for platform dragging operation for Gallery thumbnails to share to other apps
    - doc: Published a tool for Migrating Settings From ImageGlass 9
    - misc: MSI installer is available for all Windows users. However, I recommend the modern MSIX package for a better installation experience, or the ZIP package for a portable version that runs without installation.
    Improvements
    - mac: Hid "Cut file" menu because it's not supported
    Bugfixes
    - core: Changing menu hotkeys caused app config error when reopening app in the second time #2425
    - core: Background color was reset when changing the opacity value when using Kobe theme #2426
    - core: Cut image file didn't work correctly #2422
    - core: LastSeenImagePath was still written when EnableLastSeenImage setting is disabled #2421
    - core: Could not restore maximized window state from secondary monitor #2417
    - win: "Open image location" always opened a new Explorer window in the background #2424
    - win: Folder shortcuts showed errors with mixed drag & drop #2429
    - win: Windows file type associations did not distinguish between specific image formats #2427
    - win: App frame was white in dark mode in Windows 10 #2420
    Full Changelog: https://github.com/d2phap/ImageGlass/compare/10.0.4.819...10.0.5.825
