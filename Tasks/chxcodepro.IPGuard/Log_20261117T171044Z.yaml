    0.15.2 - 2026-11-16
    修复
    - Xray / sing-box / Mihomo 切换时，将代理端口尚未监听、核心退出、配置缺失和查询超时分别反馈；放宽慢速进程查询的等待时间，保留配置与监听进程的严格核对。
