  Value: |-
    0.15.11 - 2026-11-20
    修复
    - 调整 Claude Desktop 内本机 Gradle / Java 编译 APK 时的守护心跳处理：两端会话的常驻管道读取改用独立线程，减少普通工作线程池争用。
    - 心跳超时门限由 1.8 秒调整为 10 秒，容忍短暂调度停顿；管道断开仍立即结束受控进程树，保持连接但持续无心跳时继续按期限终止。
    - 心跳超时日志增加实际接收间隔、超时门限和门卫 PID，便于定位后续异常。
    - 修复 Windows 构建从 PowerShell 7 继承模块搜索路径后混用压缩模块的问题，解压与扩展打包由 Windows PowerShell 自身的模块处理；解压失败立即停止构建。
    验证
    三种原生入口及心跳回归程序编译通过，修改代码和清理路径已审查。心跳回归程序尚未执行；本机 APK 编译场景仍待升级后复测。
