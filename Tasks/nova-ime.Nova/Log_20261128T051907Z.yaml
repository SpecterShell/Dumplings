- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新增
    - 设置窗口：右键托盘里的星语图标选「设置…」，或在开始菜单「Nova 星语」里点「设置」。有输入方式、选项、使用说明、高级四页。
    - 换辅助码：设置 → 选项 → 辅助码，可在自然码形码、小鹤形码、墨奇码之间切换。切换后在本机重新编译词库，约 1 分钟，进度条显示各阶段，编完自动收起。
    修复
    - 1.0.1、1.0.2 的程序里仍是旧的 Rime 图标，这一版换成了星语图标。装完如果任务栏还是旧图标，注销重新登录一次。
