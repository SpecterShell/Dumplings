- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    v0.15.0 connects writing and deep PDF reading into one workflow: writing projects can bind their own GitHub repositories, and PDFs gain section- and paragraph-level citations, shared annotations inside embedded readers, and arXiv HTML page loading. It also adds custom keyboard shortcuts, paper code-repository detection, text library properties, and a dedicated paper-reader agent seat, while fixing Windows compile and process cleanup, PDF rendering, scaling, and translation issues.
    Features
    - Project-based writing and GitHub sync: Writing projects move below the paper library, with project directories, sources, assets, and compiled PDFs sharing one source/preview workspace; each project can bind and sync to its own GitHub repository. (commit / commit by @qychen2001, @Phil-Fan)
    - Section and paragraph citations: Support paper.pdf#2.1#p3 citations, with agent answers, Markdown links, and wikilinks sharing one resolver and temporary highlight. (#879 by @ffy6511)
    - Embedded PDF readers: Embedded PDFs locate and highlight citation targets, share the original paper's annotations and comment cards, and return to the target page without reopening the document or resetting its zoom. (commit / commit / commit by @ffy6511)
    - Custom keyboard shortcuts: Record, clear, restore, and search shortcuts from Settings; Cmd+L is separated from Add to chat, and custom bindings sync to the macOS menu. (commit by @ffy6511)
    - Paper code-repository detection: Extract a GitHub repository from the abstract, footnotes, and final page, fill an empty code_repo, and remember values edited by hand. (commit / commit by @JiaheChen2002)
    - CLI / MCP paper metadata editing: Update a paper's venue, title, date, DOI, arXiv ID, and authors through the CLI and MCP, writing to the catalog and metadata.json. (#875 by @bet4it)
    - Text library properties: Custom properties gain a Text type for free-form reproduction notes and experiment settings edited directly in the cell. (#868 by @Immortal-Fates)
    - Dedicated paper-reader seat: Settings → Agent → Paper reader can choose its own agent and model instead of inheriting the default agent or ACP model. (#867 by @hanlife02)
    - External terminal choice: The picker shows each terminal's icon and falls back to the first installed terminal when unset; Otty windows come to the front after opening. (commit / commit / commit by @Phil-Fan)
    - Mermaid diagrams: Mermaid blocks in notes and agent messages render as diagrams by default, follow the light/dark theme, and reveal copy and edit actions on hover. (commit / commit by @Phil-Fan)
    - Windows Word template: Accept the official Windows Word template and write citations into the open document. (commit by @JiaheChen2002)
    Improvements
    - PDF rendering and lifecycle: Shorten first-screen high-resolution rendering and selection waits on complex PDFs, and fix native-link accumulation, async documents leaking across switches, and the shared layout ONNX session being destroyed when the viewer closes. (#874 by @ffy6511, commit by @JiaheChen2002)
    - Writing compile feedback: The compile button distinguishes idle, compiling, success, failure, and cancel, and a failure can no longer be overwritten by a completion; compile errors share the problem list, and failures use the warning button instead of a toast. (commit / commit / commit by @JiaheChen2002, @Aschenbath)
    - PDF overlay cards follow zoom: The page translate tab, comment rail, and Ask / Translate / Visual Trace cards re-layout type and icons at the PDF zoom ratio, halving at 50% and growing at 300%. (#883 by @ffy6511)
    - Sidebar file tree: Rework row hover and selected backgrounds, icon inset, and row actions, and keep the current tree selection and Library scope when clicking a non-paper folder. (#927 by @ffy6511, @Phil-Fan)
    - Windows compatibility: Align WebView2 and windows crate versions, and handle \\?\ extended paths, .claude/skills links, concurrent file replacement, and process-tree cleanup. (#908 / #922 by @Aschenbath, @Phil-Fan, @JiaheChen2002)
    - Dependency security updates: Upgrade zip, the Tauri updater, and dependencies affected by RustSec and npm advisories. (commit / commit / commit by @Phil-Fan)
    - Markdown by default for new files: New files in the tree default to .md, with the extension filled in when omitted. (#851 by @V-IOLE-T)
    - PDF selection toolbar: Add to chat becomes the primary action with Quick chat in the menu, and the annotation entry moves into the color group with a focused note editor. (commit / commit by @ffy6511)
    Fixes
    - Windows TeX paths: Strip the \\?\ prefix from paths passed to latexmk, cleanup, and SyncTeX, and restore the caller's spelling for paths reported back by tools. (#922 by @Aschenbath)
    - Compile problems with long or spaced paths: Parse wrapped TeX logs and paths so the problem list recognizes errors and jumps to the source line. (#910 by @Aschenbath)
    - Onboarding and diagnostics: Offer a nodejs.org download when no package manager exists, and stop re-seeding onboarding notes the user deleted. (#893 / #894 by @Aschenbath)
    - Loopback requests behind a proxy: Bypass the configured proxy for localhost and 127.0.0.1 so MinerU health checks no longer time out behind Clash or similar proxies. (#887 by @Aschenbath)
    - arXiv metadata: Decode XML entities in Atom fields so titles, abstracts, and BibTeX no longer show < and &. (commit by @Aschenbath)
    - ModelScope import labels: Imported rows keep showing Imported after a page reload. (commit by @JiaheChen2002)
    - Writing and PDF selection: Dragging a selection on the PDF no longer paints the native selection back into the source pane, and double-clicking PDF text only selects a word instead of moving the source caret. (commit / commit by @Phil-Fan)
    - PDF translation ghosting: The reflow preview's DOM selection no longer repaints translated glyphs as a second offset copy. (commit by @Phil-Fan)
    - Papers moved outside the app: Open tabs, PDF annotations, tree selection, and Library scope follow a paper id after a CLI or file-manager move, and papers that leave the Vault close their tabs. (commit by @Phil-Fan)
    - New-window crash: macOS window tiling returns to the main thread, so Cmd+N no longer traps in AppKit. (commit by @Phil-Fan)
    - Vault restore and metadata: Interrupted trash restores can be retried while preserving existing metadata, and failed catalog metadata sidecar projections are retried. (commit / commit / commit by @qychen2001)
    - Wikilink editing: Pressing Enter at the start or end of a wikilink no longer duplicates it, and Chinese brackets 【【 / ［［ trigger completions. (#853 by @V-IOLE-T)
    - arXiv HTML reading: Load arXiv HTML pages and inline assets directly in the WebView, and distinguish a missing HTML version from network errors and invalid URLs. (commit by @JiaheChen2002)
    - Blank chapter files: An \input of a whitespace-only .tex file no longer aborts the whole TeX document read. (commit by @Phil-Fan)
    - Agent mentions and model catalog: Mention, skill, and slash chips survive sending, and the Grok model picker follows the full catalog pushed over ACP. (commit / commit by @Phil-Fan)
    - Window layout presets: Reading mode stays immersive when switching or opening papers, related notes open in the background, and note and agent layouts no longer depend on the sidebar state. (#929 by @bet4it)
    Resolved Issues
    - Section and paragraph citations: Agent answers, Markdown links, and wikilinks resolve section and paragraph targets with a shared highlight. (#877 / #878 / #880 by @ffy6511)
    - PDF rendering and lifecycle: High-resolution rendering, selection waits, native-link accumulation, and document release on complex PDFs are fixed. (#871 / #872 / #873 by @ffy6511)
    - PDF card scaling: Translate and comment cards no longer grow when the page shrinks, and stay crisp when the page grows. (#883 by @qychen2001)
    - Translation ghosting: Selecting the translated preview no longer shows a second offset copy. (#884 by @qychen2001)
    - Onboarding notes: Deleted or renamed onboarding notes are not written back on the next Vault open. (#886 by @qychen2001)
    - Custom shortcuts: Cmd+L no longer conflicts with Add to chat, and shortcuts can be searched and rebound in Settings. (#869 by @ffy6511)
    - Per-project sync: First-level folders under thesis/ are recognized and synced as separate repositories. (#892 by @qychen2001)
    - Writing compile feedback: Compile failures use the warning button instead of a toast, and the compile button state and visuals stay consistent. (#896 / #905 / #906 by @qychen2001)
    - New windows and paper moves: Cmd+N opens multiple windows, and workspace state stays in sync after a paper is moved outside the app. (#897 / #900 by @qychen2001)
    - Code-repository detection: The PDF's own GitHub repository is extracted without mistaking a bibliography link for the code address. (#907 by @qychen2001)
    - Windows paths and links: TeX compilation under \\?\ paths, .claude/skills resolution, and concurrent writes work on Windows again. (#909 / #913 / #914 by @Sonder4, @Aschenbath)
    - arXiv metadata entities: Titles and abstracts no longer show XML entities verbatim, and BibTeX export is corrected. (#916 by @Aschenbath)
    - ModelScope import labels: Imported papers keep showing Imported after a refresh. (#924 by @cj-jssh)
    - Sidebar interactions: Overflow, hover colors, button states, click feedback, and selection on non-paper folders are corrected. (#927 by @Phil-Fan)
    Known Limitations
    - Windows Word template: The official template is wired up and passes code checks; acceptance inside a real Office installation is still in progress. (commit by @JiaheChen2002)
    Full diff: https://github.com/poco-ai/Agentero/compare/v0.14.0...v0.15.0
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    v0.15.0 把写作与 PDF 深度阅读串成一条完整工作流：写作项目可以独立绑定 GitHub 仓库，PDF 新增章节与段落级引用、嵌入阅读器内的共享批注，以及 arXiv HTML 页面加载。同期加入自定义快捷键、论文代码仓库识别、论文库文本属性与精读 Agent 席位，并集中修复 Windows 编译与进程清理，以及 PDF 渲染、缩放和翻译相关问题。
    新功能
    - 项目级写作与 GitHub 同步：写作项目移到论文库下方，项目目录、源码、资源与编译后的 PDF 共用一套源码/预览工作区；每个项目可以单独绑定并同步到自己的 GitHub 仓库。（commit / commit by @qychen2001, @Phil-Fan）
    - 章节与段落级引用：支持 paper.pdf#2.1#p3 形式的引用，Agent 问答、Markdown 链接与双链使用同一套解析和临时高亮。（#879 by @ffy6511）
    - 内嵌 PDF 阅读器：嵌入的 PDF 可以定位并高亮引用目标、共享原论文的批注与评论卡，并在不重新打开文档或重置缩放的情况下返回目标页。（commit / commit / commit by @ffy6511）
    - 自定义快捷键：设置页可以录制、清除、恢复和搜索快捷键，Cmd+L 与“加入对话”分开，macOS 菜单同步自定义键位。（commit by @ffy6511）
    - 论文代码仓库识别：从论文摘要、脚注和末页提取 GitHub 仓库，写入空的 code_repo，并记住手动修改过的值。（commit / commit by @JiaheChen2002）
    - CLI / MCP 论文元数据编辑：可以通过 CLI 与 MCP 更新论文的出版物、标题、日期、DOI、arXiv ID 与作者列表，并同步写入 catalog 与 metadata.json。（#875 by @bet4it）
    - 论文库文本属性：自定义属性新增 Text 类型，可直接在单元格里编辑复现备注、实验配置等自由文本。（#868 by @Immortal-Fates）
    - 精读论文独立席位：设置 → Agent → 精读论文可以单独选择 Agent 与模型，不再继承默认 Agent 或 ACP 默认模型。（#867 by @hanlife02）
    - 外部终端选择：选择终端应用时显示各自图标，未设置时使用首个已安装终端；Otty 打开窗口后自动置前。（commit / commit / commit by @Phil-Fan）
    - Mermaid 图表：笔记与 Agent 消息里的 Mermaid 代码块默认渲染为图表，主题色跟随明暗模式，悬停可复制源码或编辑。（commit / commit by @Phil-Fan）
    - Windows Word 模板：接入官方 Windows Word 模板，引用会写入当前打开的文档。（commit by @JiaheChen2002）
    改进
    - PDF 渲染与生命周期：缩短复杂 PDF 的首屏高清渲染和框选等待，修复原生链接重复累积、连续切换文档时异步文档未释放，以及阅读器关闭后共享版面 ONNX 会话被销毁的问题。（#874 by @ffy6511, commit by @JiaheChen2002）
    - 写作编译反馈：编译按钮区分空闲、编译中、成功、失败与取消，失败不会再被完成状态覆盖；编译错误统一进入问题列表，失败时用警示按钮展示具体错误。（commit / commit / commit by @JiaheChen2002, @Aschenbath）
    - PDF 叠加卡片随缩放：页面翻译入口、右侧批注卡与 Ask / 翻译 / 视觉批注浮卡都按 PDF 缩放比例重新布局字号与图标，50% 时同步减半、300% 时同步放大。（#883 by @ffy6511）
    - 侧边栏文件树：重做行的 hover 与选中背景、图标内边距和操作按钮，点击非论文文件夹时保留当前树选中与 Library 范围。（#927 by @ffy6511, @Phil-Fan）
    - Windows 兼容性：对齐 WebView2 与 windows crate 版本，处理 \\?\ 扩展路径、.claude/skills 链接、并发文件替换与进程树回收。（#908 / #922 by @Aschenbath, @Phil-Fan, @JiaheChen2002）
    - 依赖安全更新：升级 zip、Tauri updater 与受 RustSec / npm 公告影响的依赖。（commit / commit / commit by @Phil-Fan）
    - 新建文件默认 Markdown: 文件树新建文件默认使用 .md，没有扩展名时自动补全。（#851 by @V-IOLE-T）
    - PDF 选择工具栏：“加入对话”成为主按钮，“快速对话”收进菜单，批注入口移入颜色组并打开聚焦的批注编辑器。（commit / commit by @ffy6511）
    修复
    - Windows TeX 路径：传给 latexmk、清理和 SyncTeX 的路径去掉 \\?\ 前缀，工具返回的路径按调用方写法还原。（#922 by @Aschenbath）
    - 长路径或空格下的编译问题：处理 TeX 日志折行与路径解析后，问题列表能识别错误并跳转到对应源码行。（#910 by @Aschenbath）
    - 引导与诊断：没有包管理器时提供从 nodejs.org 下载 Node.js 的入口；已删除的引导笔记不会再被自动补回。（#893 / #894 by @Aschenbath）
    - 代理下的本地请求：localhost 与 127.0.0.1 绕过系统代理，MinerU 健康检查不再被 Clash 等代理接管而超时。（#887 by @Aschenbath）
    - arXiv 元数据：解码 Atom 字段里的 XML 实体，标题、摘要与 BibTeX 不再显示 <、& 等原文。（commit by @Aschenbath）
    - ModelScope 入库状态：刷新页面后仍显示“已入库”，不再把已导入的行画成未导入。（commit by @JiaheChen2002）
    - 写作与 PDF 选择：在 PDF 上拖选不再把原生选区画回源码面板；双击 PDF 只选词，不再移动源码光标。（commit / commit by @Phil-Fan）
    - PDF 翻译重影：翻译重排预览的 DOM 选区不再把译文重绘成第二层偏移文字。（commit by @Phil-Fan）
    - 外部移动论文：CLI 或文件管理器移动论文后，打开的标签、PDF 批注、树选中与 Library 范围跟随论文 id 更新，离开 Vault 的论文关闭标签。（commit by @Phil-Fan）
    - 新窗口崩溃：macOS 新窗口的 tiling 设置回到主线程，⌘N 不再触发 AppKit 崩溃。（commit by @Phil-Fan）
    - Vault 恢复与元数据：中断的回收站恢复可以重试，恢复索引时保留已有 metadata；catalog 元数据 sidecar 写入失败会重试。（commit / commit / commit by @qychen2001）
    - 双链编辑：双链源码节点首尾按 Enter 不再重复生成链接，并支持连续输入中文括号 【【 / ［［ 触发候选。（#853 by @V-IOLE-T）
    - arXiv HTML 阅读：直接在 WebView 中加载 arXiv HTML 页面与内联资源，并把没有 HTML 版本、网络错误和无效 URL 分开提示。（commit by @JiaheChen2002）
    - 空白章节文件：\input 引用空白 .tex 文件时不再中断整篇 TeX 读取。（commit by @Phil-Fan）
    - Agent 提及与模型列表：发送后保留 @、技能和斜杠 chips；Grok 的模型目录通过 ACP 通知更新后，选择器同步显示完整列表。（commit / commit by @Phil-Fan）
    - 窗口布局预设：阅读模式下切换或打开论文保持沉浸，关联笔记在后台打开；笔记与 Agent 布局不再受左侧栏开合影响。（#929 by @bet4it）
    已解决问题
    - 章节与段落引用：Agent 问答、Markdown 链接与双链可以统一解析章节和段落目标并高亮。（#877 / #878 / #880 by @ffy6511）
    - PDF 高清渲染与生命周期：复杂 PDF 的首屏渲染、框选等待、原生链接累积与文档释放得到修复。（#871 / #872 / #873 by @ffy6511）
    - PDF 卡片缩放：缩小页面时翻译入口和批注卡不再反而变大，放大时字号与图标保持清晰。（#883 by @qychen2001）
    - 翻译重影：选中翻译预览时不再出现第二层偏移文字。（#884 by @qychen2001）
    - 引导笔记：删除或改名的引导笔记不会在下次打开 Vault 时被重新写入。（#886 by @qychen2001）
    - 自定义快捷键：Cmd+L 与“加入对话”不再冲突，设置页可以搜索并重绑快捷键。（#869 by @ffy6511）
    - 项目级同步：thesis/ 下的一级子目录按项目分别识别并同步到独立仓库。（#892 by @qychen2001）
    - 写作编译提示：编译失败由警示按钮展示，不再弹 Toast，编译按钮状态与视觉反馈保持一致。（#896 / #905 / #906 by @qychen2001）
    - 新窗口与论文移动：⌘N 可以正常打开多个窗口，外部移动正在阅读的论文后工作区状态保持同步。（#897 / #900 by @qychen2001）
    - 代码仓库识别：从 PDF 提取本论文的 GitHub 仓库，避免把参考文献里的链接当成代码地址。（#907 by @qychen2001）
    - Windows 路径与链接：\\?\ 路径下的 TeX 编译、.claude/skills 解析与并发写入在 Windows 上恢复正常。（#909 / #913 / #914 by @Sonder4, @Aschenbath）
    - arXiv 元数据实体：标题与摘要不再原样显示 XML 实体，BibTeX 导出同步修正。（#916 by @Aschenbath）
    - ModelScope 入库标签：刷新后已入库的论文继续显示“已入库”。（#924 by @cj-jssh）
    - 侧边栏交互：溢出、hover 颜色、按钮状态与点击反馈动画，以及非论文文件夹的选中状态都得到修正。（#927 by @Phil-Fan）
    已知限制
    - Windows Word 模板：官方模板已接入并通过代码检查，真实 Office 环境中的写入验收仍在进行中。（commit by @JiaheChen2002）
