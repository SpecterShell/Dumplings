- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    This release adds trending feeds and filters to Hugging Face Daily Papers in the Plaza, lets you middle-click a translated block to read its source, redesigns folder cards in the paper library, and merges the title bar into the app header on Windows. It also fixes scroll and zoom sync in side-by-side PDF reading, sentence hover, supplement figure previews, inline formula selection, note reading position, Markdown images, and agent links.
    Features
    - Hugging Face trending: Hugging Face Daily Papers in the Plaza opens on the Trending feed and can switch between daily, weekly, and monthly views, with keyword search, secondary sorting, and one-click PDF opening in the workspace. (#1256 by @W-RMSL)
    - Middle-click source peek: In translated view, middle-click a translated block to read its English source in a read-only card without triggering translation or network requests. (commit by @Phil-Fan)
    - Open With for notes: The toolbar for plain Markdown notes adds Open With, which opens the note's folder or sends the note to a file manager, an installed editor, or the terminal. (commit by @JiaheChen2002)
    - PKU WPN sign-in: Selecting the Peking University WPN preset validates the saved session and opens PKU unified authentication when needed. A valid session is reused directly. (#1261 by @hanlife02)
    - Folder cards: Folder cards in the paper library are redesigned: click the upper part of a card to enter it, click the lower part to toggle selection, and hover to reveal the selection button and More Actions in the lower-right corner. (commit by @ffy6511)
    - Windows title bar: Windows windows merge the system title bar into the app header and no longer show two stacked bars. (commit by @JiaheChen2002)
    Fixes
    - Dual-pane sync: In side-by-side reading, both panes scroll and zoom in step, and the path bar above one pane no longer shifts the other pane's content. (commit by @Phil-Fan)
    - Sentence hover: Sentence hover highlighting waits for layout analysis and no longer shades both columns or adjacent pages. (commit by @ffy6511)
    - Inline formula selection: Inline formulas can be selected in drag selections instead of being dropped as display formulas. (commit by @JiaheChen2002)
    - Supplement figure preview: Hovering a supplement figure label such as Supplementary Figure N or Fig. SN previews the supplement instead of cropping the main figure. PLOS supplement links preview directly. (#1224 by @inverteum)
    - Reading position: When opening or closing a sidebar resizes the note pane, the reading position stays on the same character. (#1248 by @YasyaKarasu)
    - Image alt and paths: Markdown image alt text is preserved in rendering and in the selection hint, and angle-bracket destinations such as ![alt](<path with spaces>) render as images. (#1253 by @ColdInk4, #1254 by @ColdInk4)
    - Agent links: URLs with ports in agent chats display and open correctly, and a URL used as link text is no longer wrapped a second time. (#1252 by @ColdInk4)
    - Paper reader headings: Section headings in NOTES.md written by the paper reader follow the paper-reader skill, while the body language still follows the app language. (#1245 by @Aschenbath)
    Full changelog: https://github.com/poco-ai/Agentero/compare/v0.18.2...v0.18.3
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    本次发布为广场的 Hugging Face 每日论文加入热门榜和筛选，译文模式可用中键查看分块原文，论文库的文件夹卡片重新设计，Windows 窗口合并标题栏。同时修复了 PDF 对照阅读的滚动缩放同步、句子悬停、补充图预览和行内公式选区，以及笔记阅读位置、Markdown 图片和 Agent 链接等问题。
    新功能
    - Hugging Face 热门榜：广场的 Hugging Face 每日论文默认显示热门榜，可切换每日、每周和每月，支持关键词搜索、二次排序，以及一键在工作区打开 PDF。(#1256 by @W-RMSL)
    - 中键查看原文：译文模式中，中键点击译文分块，可在只读卡片中查看对应的英文原文，不触发翻译或网络请求。(commit by @Phil-Fan)
    - 笔记「打开方式」: 普通 Markdown 笔记的工具栏新增「打开方式」，可打开笔记所在文件夹，或用文件管理器、已安装的编辑器和终端打开。(commit by @JiaheChen2002)
    - 北大 WPN 登录：选择北京大学 WPN 预设时会验证已保存的会话：需要认证时自动打开北大统一身份认证，已有有效会话则直接复用。(#1261 by @hanlife02)
    - 文件夹卡片：论文库的文件夹卡片重新设计：点击卡片上部进入文件夹，点击下部切换选中，悬停时在右下角显示选择按钮和「更多操作」。(commit by @ffy6511)
    - Windows 标题栏：Windows 上，系统标题栏并入应用顶栏，窗口不再显示两条叠放的标题栏。(commit by @JiaheChen2002)
    修复
    - 对照栏同步：对照阅读时，双栏的滚动和缩放保持同步，一栏顶部的路径条不再使另一栏内容错位。(commit by @Phil-Fan)
    - 句子悬停：句子悬停高亮在版面分析完成后才启用，不再跨栏、跨页出现灰带。(commit by @ffy6511)
    - 行内公式选区：拖选时行内公式可以选中，不再被当作独立公式丢掉。(commit by @JiaheChen2002)
    - 补充图预览：悬停补充材料图号（如 Supplementary Figure N、Fig. SN）时显示补充图预览，不再误裁主图；PLOS 的补充材料链接可直接预览。(#1224 by @inverteum)
    - 阅读位置：开关侧栏使笔记窗格变宽或变窄时，阅读位置保持在原来的字符处。(#1248 by @YasyaKarasu)
    - 图片 alt 与路径：Markdown 图片的 alt 文字在渲染结果和选中提示中保留；![alt](<含空格的路径>) 这类尖括号写法可以正常显示图片。(#1253 by @ColdInk4, #1254 by @ColdInk4)
    - Agent 链接：Agent 聊天里带端口号的地址可以完整显示并点击，URL 作为链接文字时不再被二次包装。(#1252 by @ColdInk4)
    - 精读笔记标题：精读生成的 NOTES.md 的章节标题由 paper-reader Skill 决定，正文语言仍跟随应用语言。(#1245 by @Aschenbath)
