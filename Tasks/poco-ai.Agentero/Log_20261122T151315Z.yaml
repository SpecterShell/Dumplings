- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    This release unifies research work across the desktop agents, CLI, and MCP: all three share one set of core operations for papers, notes, annotations, and tables, writes, network access, and full-text reads are granted on demand, and the command-line and protocol interfaces have breaking changes. Plaza gains Hugging Face Daily Papers, and the library can import papers from an AlphaXiv library in bulk. PDF reading adds external-link previews, sentence hover, and translation layout improvements; imports handle OpenReview, PMC, and generic Cloudflare checks and archive web snapshots. Linux now detects desktop apps and reuses their bundled CLIs.
    Breaking Changes
    - CLI and MCP interfaces: CLI commands and MCP tools and resources were reorganized together, so existing callers need migration; agentero help --json exports the command tree, external clients read agentero://guide, and vault_list returns authorized vault IDs. Desktop MCP serves read-only queries by default and grants vault writes, network access, and full-text reads separately, taking effect on the next call. (#1209 by @qychen2001)
    Features
    - Unified research tools: The desktop sidebar and Zen now obtain turn grants from the bundled CLI, terminal installs keep their own copy, and the CLI, MCP, and desktop share one set of core operations for papers, notes, annotations, and tables. (#1209 by @qychen2001)
    - Hugging Face Daily Papers: Plaza adds a Daily Papers page that browses official thumbnails, authors, votes, and abstracts by date; abstracts can be translated and toggled back to the source, and papers import individually into a chosen folder. (#1210 by @Tippye)
    - AlphaXiv library import: Settings → General → Integrations accepts and validates an AlphaXiv API key, and the library menu imports selected papers from an AlphaXiv library; private papers stay visible but unselectable, imports reuse the existing identifier batch, and entries are tagged with the folder name. (#1227 · 1180aeb3a · 85559fe1d by @ffy6511)
    - OpenReview and generic checks: PDF downloads and page fetches that hit a Turnstile or Cloudflare wall open a verification window and retry once with that site's cookies; an unfinished check reports a readable reason instead of archiving the challenge page. The CLI reads the credential from settings.json and reports openreview_auth_required without a window. (#1157 · 8cb2f1a94 · dc6adc87d by @Phil-Fan)
    - External PDF link previews: Hovering an external PDF link frames the page through the agentero-web proxy with scrolling and in-page navigation, handing off-site links to the system browser; image targets show a thumbnail, while PDFs and downloads still fall back to the address. (#1212 · 73169eb59 by @Phil-Fan)
    - File-tree multi-select: Modifier-clicking rows multi-selects them, a batch action bar appears for two or more rows with move and delete, and Escape, Delete, and ⌘A are scoped to the focused tree. (#1218 · 4ebd06eea · c7f67542d by @Phil-Fan)
    - Linux desktop apps: Settings and onboarding detect installed apps through vendor .desktop files, Flatpak, Snap, and the default scheme handler, and reuse their bundled CLIs (QwenWork, WorkBuddy, Codex); apps without a Linux build are marked unsupported and point at the dsh CLI. (#1150 · 51ad571f3 · 39c06278b by @Phil-Fan)
    - ACP session modes: Detects the ACP standard category: Mode plus vendor modes such as Codex collaboration_mode, and keeps the mode list available after switching agents or reusing a warm session. (#1200 by @bet4it)
    - EasyScholar ranks: Settings can choose which rank systems to show; toggling only filters the display without refetching the API or rewriting stored tags. (4d62550d9 by @Phil-Fan)
    Improvements
    - Reuse translation layout: Reopening a full-text translation reuses the latest artifact keyed by source PDF, IR, translation, fonts, and build version, showing in about 0.5s even with the disk cache off; each window keeps at most one artifact plus fallback images, capped at 64 MiB. (#1179 · #1184 by @iiijiashu)
    - Sentence hover and paired highlight: Sentence hover publishes only prose blocks and cuts on real sentence boundaries, skipping figures, tables, and algorithms; hovering the source in the dual-pane reader highlights the matching translation. (#1216 · #1173 · 92fefbf3b · 7bf393196 by @ffy6511)
    - Reader left rail: Outline, references, and figures share one panel slot that is remembered per document, so writing a bookmark and reloading the PDF no longer closes the outline. (98de2315f by @Phil-Fan)
    - Editor bottom bar: Formatting, export, find, and properties move into one bottom bar shared by rendered and source modes; the find bar sits at the left end of the status row, and counts collapse as panes narrow so nothing clips. (e67e4fe85 · e02e32dac by @Phil-Fan)
    - Tree and path-bar menus: The paper path bar gains an open-with menu with installed editors, the terminal, and the paper's links; the file tree menu is regrouped, Finder and Terminal return to the path bar, and the "New research table" and "New experiment" entries are removed while existing files still open and edit. (d0912619e · 05b5a6063 · 9c6768acf by @Phil-Fan)
    - Auto-dismiss background tasks: Finished tasks dismiss 6s after completion and failures after 15s; the countdown pauses while details are open, and the task HUD unmounts once the last row is gone. (849b00808 by @Phil-Fan)
    - On-demand layout analysis: Layout analysis requests only the Paddle sub-pipelines it reads while PAPER.md parsing keeps the full pipeline; each renderer job runs in a single window, and raw JSONL is written only under a debug environment variable. (#1153 · 279f0fe7f · 30026f9af by @Phil-Fan)
    - Settings grouping and defaults: Plaza and PDF reading options move to Appearance, Vim moves to Keyboard and is off by default, and OpenReview moves under Integrations; fresh installs default to the free Bilibili Translate 2B service. (803f0cd18 · 6d5f8f1e0 by @Phil-Fan)
    - Archived web snapshots: Web imports archive a sanitized webpage.html along with PAPER.md, and reopening shows the live page so script-driven layouts no longer degrade to plain text; the snapshot remains the offline and search fallback. (312454354 · 66fb5c69b by @Phil-Fan)
    - Agent sidebar responsiveness: Local agent probing moves off the UI thread, and the panel is kept after first open so reopening shows the input and draft immediately; catalog scans and bundled adapter probes are cached too. (#1225 · #1226 by @YasyaKarasu)
    - Window and settings writes: Settings, document, and feature windows check their label under one create gate, so overlapping opens no longer leave extra windows; settings saves are chained per window and run off the UI thread, so the newest edit always wins. (#1144 · b83cb88d4 · fd49e1216 by @JiaheChen2002)
    Fixes
    - Citation and figure previews: Hovering a citation card no longer opens a hundreds-name author list when the pointer crosses the expand control; arXiv and CoRR numbers in reference text are recognized; supplements such as eLife's "Figure 5—figure supplement 1" preview as the supplement itself. (#1229 · #1219 · ccad85b7f by @W-RMSL, @Phil-Fan)
    - Independent note loading: Papers load the body and NOTES.md independently, so a pending iCloud note no longer blocks the PDF; a failed note read shows an error in the notes pane while the body stays readable. (#1220 by @Phil-Fan)
    - Codex terminal output: Codex ACP terminal_output_delta is read and accumulated into stdout / stderr with the exit code, using one conversion for live events and history replay. (#1206 by @CPbianma)
    - Adding a local PDF: Reopening a web-only paper after a local PDF is added switches the existing body tab to the PDF while keeping the tab ID and the notes split. (#1177 · #1181 by @iiijiashu)
    - Selection toolbar placement: The selection toolbar avoids the translation card's actual bounds, preferring the other side of the selection so it no longer covers mark or add-to-chat. (#1195 by @ErzatIam)
    - PDF scrollbars: Both source and translation viewports keep draggable native scrollbars visible while zoomed and overflowing, and both axes can be dragged precisely after the pointer leaves. (#1178 · #1182 by @iiijiashu)
    - Annotation formulas: Annotation-card editing uses the same math plugins as notes, so inline and block formulas render live and are no longer escaped on save. (#1194 · #1208 by @Shallow-dusty)
    - Pi attachment references: A Pi scratch attachment path on its own line renders as a filename chip with the full path on hover or focus, instead of stretching the user bubble over several lines. (#1203 by @Shallow-dusty)
    - Metadata fallback: A paper is kept when both auto-recognition and title lookup miss, with a warning or error per case and an "Edit metadata" fallback. (#1186 · #1202 by @Shallow-dusty)
    - Selection translations: The selection-translation tint follows the paper tone and overlapping selections no longer darken the source text; legacy highlight migration stops turning translation records into annotations. (#1156 · #1201 by @Shallow-dusty)
    - Bluetooth audio release: The audio context pauses after cue playback and releases the output, so a paired headset can switch back to the phone while Agentero is idle. (#1204 · #1205 by @YasyaKarasu)
    - PDF URL cache suffix: Cache keys appended by feeds such as Papers.cool (||md5=...) are stripped, so imports no longer fail with 404 and return no PDF. (#1197 by @GitZhaoo)
    - Selection chat shortcuts: Restores ⇧⌘L add-to-chat and ⌘K quick chat, and an unsent quick chat stays open when annotations refresh. (#1198 by @ErzatIam)
    - PMC full text: PMC open-access PDFs come from NCBI's public bucket, bypassing the JS proof-of-work page and Cloudflare, so PubMed imports get full text again. (#1191 by @dengfeng-0908)
    - Full-text translation stability: Renderer jobs are aborted when the host fails or the window closes, a stalled formula engine no longer takes the reader down, streaming requests are timed by silence instead of a fixed 30s deadline, and prompt echoes from services no longer reach translations or the cache. (#1211 · #1190 · #1192 · e2b100684 · f6ed83b2e · d121b44d6 by @ffy6511)
    - Reflow font downloads: Reflow fonts download from the ModelScope mirror with identical files and SHA-256 checks, so a first-download failure no longer fails the whole layout. (#1196 · 154d84325 by @Phil-Fan)
    - Tab overflow list: Closing a tab from the overflow popover refreshes the list and count immediately, keeping it consistent with the tab strip. (#1161 · 9c332cac7 by @Phil-Fan)
    - Math delimiters: Editing a note preserves the original \[...\] and \(...\) delimiters instead of rewriting them to dollar math on save. (#1171 · eae414383 by @Phil-Fan)
    - Wikilink creation: An existing note is no longer truncated by a [[wikilink]] create, a create race opens the file it found, and link text is kept as written. (#1169 · 0c173f1d6 · cf6d1e0d5 by @ffy6511)
    - Failed renames: A rejected rename clears the draft and input lock, so selection, context menus, and drag-and-drop work again. (#1185 · 2dfd1205d · f6cfdca0c by @Phil-Fan, @ffy6511)
    - Privacy prompts: Each turn envelope states the vault boundary and helper processes start in Agentero's private directory, so reading one paper no longer triggers folder and media-library prompts tied to $HOME. (#570 · #1119 · 3afdfbbf1 · 6673005fc by @Phil-Fan)
    - Android pairing: Bridge pairing commands register on Android, the device name is Android, native errors are preserved, and pairing data is stored in the app-private directory. (#1093 · #1094 by @iiijiashu)
    - dsh session root: History sessions load from the session root declared by the dsh profile, so listed sessions no longer fail to open. (#1090 · #1091 by @starxjys)
    - Model selection: When ACP reports a current model that differs from the one in effect, the explicit pick is re-sent so the picker matches real requests. (#1087 · ff654ea5f by @Phil-Fan)
    - Note figure paths: Notes resolve paper figures from note-relative paths, and a paper stays unread when paper-reader wrote no usable notes. (#958 · 1ad814fe1 · 174be383c by @Phil-Fan)
