- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Agentero v0.7.1 turns "what should I read next" into a real capability: Plaza gains an arXiv Daily recommendation feed, a paper folder can now scan backwards for new work that cites your library but is not in it yet, and the magic wand finally accepts a plain paper title. PAPER.md body parsing becomes a pluggable engine registry with MinerU, Paddle, and OpenAI-compatible VLM OCR backends. It also fixes broken sentences in cross-page translation, dead drag-and-drop in the macOS file tree, and duplicate downloads from the Zotero Connector.
    Features
    - arXiv Daily recommendations: Plaza ranks each day's arXiv papers against your Vault library so you can see what to read next: abstracts on both sides are embedded through the configured OpenAI-compatible endpoint and scored by cosine similarity weighted toward recently added papers. Vectors and the last run are cached in catalog.sqlite (schema v6), so a same-day open skips the network entirely, and cards support translating every abstract in one click. Agent settings gain a BYOK embedding endpoint (base URL / API key / model), with the API key reusing the *-mask redaction so the secret is never echoed back to the WebView. (b3529faf 8c024e37 f6bb0955 by @Phil-Fan, closes #342)
    - Discover new papers citing your library: A paper folder's context menu can now scan for new work that cites papers in your library but is not imported yet. Local TeX/.bbl only knows forward citations, so the data comes from Semantic Scholar — OpenAlex barely contains arXiv preprint-to-preprint edges and scans a preprint vault to almost nothing — with one batch request for the whole library and 8-way concurrent per-seed fan-out. Candidates pass three filters: skip mega-cited seeds, weight overlap by citation IDF, then gate on centered SPECTER2 max-similarity with a threshold calibrated from the library itself; ranking ends in a fixed budget with MMR so no per-folder tuning is needed. (a5c6cfc3 by @Phil-Fan, fixes #341)
    - Add papers by title in the magic wand: Users with only a paper title were previously rejected outright; the wand now searches by title. Search hits Semantic Scholar and falls back to arXiv because S2's key-less endpoint is aggressively rate limited. Search only maps text to candidate identifiers — the pick is fed back through the identifier pipeline, keeping Translator the single source of truth for metadata. The wand no longer splits input on spaces, so titles arrive intact, which also unbreaks the npx skills add … form the placeholder already advertised. (129a9f55 by @Phil-Fan, closes #326)
    - Pluggable cloud PAPER.md parse engines: Body parsing for papers without TeX gains an engine registry: alongside the local liteparse, you can pick MinerU full.md, Paddle PP-StructureV3 markdown, or OpenAI-compatible per-page VLM OCR (with a new isolated PDF render worker). Cloud engines share layout provider credentials and fall back to the local parser on failure. Settings and onboarding add engine selection, per-provider merged credential cards, a prompt override, and per-provider model presets. (03efc6fe e4f51033 1e6bd8d1 0b41bf11 by @qychen2001, closes #327)
    - Hover crossref links to preview figures, tables and equations: A single PDF walk now parses hyperref figure. / table. / equation. / algorithm. named destinations alongside cite.*, so hovering a \ref link resolves its destination to the matching layout region and shows a cropped preview instead of forcing a page jump. (604d0693 by @Phil-Fan, refs #349)
    - Reopen closed tabs and send selections to chat: ⇧⌘T restores a panel closed by mistake instead of hunting it down in the tree again, and ⇧⌘A hands the current selection to the Agent with the cursor already in the composer so a question can be typed straight away. Both chords are also exposed as palette commands. Reopen history lives in the workspace store (ephemeral, dropped on vault switch) and records the paper body rather than its NOTES companion, so a reopen brings the reading pair back. (479a91fd by @Phil-Fan, closes #345)
    - Bundled author-lookup skill: A new Vault-bundled author-lookup skill finds the email, homepage, GitHub, and OpenReview links of a paper's first and corresponding authors, cross-verifies across sources, and writes a contact section into {paper}/NOTES.md while preserving your existing content. It also generates an author research report under {paper}/attachments/ (creating the folder only when there is content), with a full publication list for the first author. Disambiguation prefers DBLP matched on name plus affiliation, merges the formal conference version with a same-title preprint keeping the published one, and uses Google Scholar only to fill gaps DBLP does not index. (3aa017a3 20cbef93 0d9936a5 by @Phil-Fan, closes #343)
    Improvements
    - Imports no longer auto-open the paper: Auto-opening a paper after import is switched off everywhere, so the file tree stops jumping and stealing focus and the sidebar no longer scrolls itself to the bottom. This covers every entry point reusing the wand's identifier pipeline (Plaza import, References panel, Zotero migration); a successful import shows "Imported" with the state cached, while failures only surface an error instead of polluting the sidebar, and the tree reveals a target once rather than re-scrolling on each background refresh. (80859d6f by @Phil-Fan, fixes #350)
    - Vault switches release the previous vault's resources: The vault:opened handler now returns a teardown, so what a vault switch sets up and what it releases live in one place — fixing catalog rows, the wiki rename flow, agent chat sessions, tab annotations, and layout analyses surviving a switch. A new vault_release command drops the Host catalog connection, which previously kept an open SQLite handle and its WAL alive for every vault visited in a session until exit. A new listenSafe also fixes event subscriptions leaking forever when disposed before listen() resolved. (97dc3eb8 4737b473 a8b32f8f 127ee400 by @Phil-Fan)
    - PDF sharpness on HiDPI screens: The previous 1.5 dpr cap applied to both the whole-page base coat and the sharp tile layer, so Retina screens rendered tiles at 75% of native linear density and small text looked soft. The base coat stays capped (it sits under the tiles and full-page rasters are the expensive path) while tiles now rasterize at min(devicePixelRatio, 2). (52e08e4e by @qychen2001, refs #348)
    - Anonymized activity telemetry: Twelve allowlisted local activity kinds are projected into anonymized PostHog events through the existing facet/status/qty projection, so paths, vault, search queries, and skill names never leave the device. The usageTrackingEnabled switch is dropped — local usage.sqlite recording is always on, and telemetryEnabled alone gates the PostHog leg (next launch). (8102c438 by @Phil-Fan)
    Fixes
    - Broken sentences in cross-page translation: The PDF text layer reached the engine with line-break hyphenation, ligatures, and running header/footer runs spliced into the prose, and a paragraph continued in the next column or page was sent as two half-sentences, so the output read broken. The source is now normalized, continuation fragments are chained into one request and split back per bbox, inline math/URL/DOI tokens are masked, and both prompt paths get academic-translation rules. (b4669241 by @Phil-Fan, fixes #340)
    - Zotero Connector duplicate downloads and duplicate paper folders: A save-directory change arriving while attachments were still downloading raced the writer still holding the old path, producing duplicate downloads, duplicate paper folders, and premature parsing. The target directory is now recorded in desired_parent and the move is deferred until the PDF finishes, then goes through the shared paper_move transaction, with connector:item-saved emitted only after paths are stable. The browser's saveAttachment upload takes priority, and the DOI/arXiv download is only a fallback when no attachment arrives. (#352 by @Winfred666)
    - Dead drag-and-drop in the macOS file tree: wry overrides WKWebView's NSDraggingDestination and Tauri's handler always returns true, so the page never receives DOM dragover/drop and the native drop is the only signal — but WebKit fires the source-side dragend first, which cleared the drag state before that drop arrived, silently no-oping every drop. Dragged paths are now retained for a short grace window past dragend and the drop-target highlight is driven from the native enter/over events; a paper unit is also treated as a leaf, so dropping onto a paper row targets its parent. (6a3478fb by @Phil-Fan, fixes #353)
    - Skill import frontmatter parsing: A shared frontmatter parser now handles quotes, folded blocks, multi-line continuations, and CRLF, replacing several hand-written implementations. description is truncated to 1024 characters instead of blocking installation, and a single unparsable SKILL.md only skips that candidate — the import fails as a whole only when no valid skill remains. (3ca7c2de 06c4d051 by @Phil-Fan, fixes #355)
    - Move destination picker readability: The move-folder panel's list is taller and hovering an entry reveals the full folder path. (f18705dc by @Phil-Fan, fixes #354)
    - Feeds without an explicit DOI could not be imported: Feeds that only link the publisher article page (e.g. Nature Communications subject feeds) carry no DOI/arXiv fields, so items were permanently classified as stories and never offered the import action. Parsing now maps nature.com/articles/<slug> to a DOI, fetching the article body scrapes citation_doi / prism.doi / dc.identifier to backfill paper_url, and a feed refresh uses COALESCE to keep the backfilled value. (45ed86f5 by @qychen2001, refs #348)
    - Wide import dialogs render at their requested width: DialogContent's base classes include sm:max-w-sm, and tailwind-merge does not let an unprefixed max-w-none override a variant-prefixed class, so the paper search and skill import dialogs asked for 36rem and silently rendered at 24rem — narrow enough that long paper titles burst out of the card. (c9e6d674 by @Phil-Fan)
    - Startup lifecycle ordering and teardown: Store seeding moves out of useState(() => …) — a render-phase side effect StrictMode can invoke twice — into boot(), awaited before createRoot so the pre-paint guarantee holds without the impure render. The JobCenter's two global subscriptions now set their idempotency guard synchronously and return disposers, app:ready waits for validateRestoredVault() to finish, and window:closed's two raw listeners are bridged into the event bus and handled centrally. (858878eb by @Phil-Fan)
    - DeepSeek-OCR layout labels and the Paddle body model: Live runs against SiliconFlow, MinerU, and AI Studio disproved two assumptions: DeepSeek-OCR's <|ref|> payload is a layout label rather than prose (it leaked text/sub_title lines into the body), and PP-StructureV3 is the layout model, so the body path now defaults to the markdown-producing PaddleOCR-VL-1.6 and reads the model from settings. PaddleOCR-VL's <|LOC_n|> box tokens are also stripped, since that model only accepts its canonical task prompts and otherwise degrades to detection output. (89efcf05 by @qychen2001)
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Agentero v0.7.1 把「下一篇读什么」做成了产品能力：Plaza 新增 arXiv Daily 每日推荐，论文文件夹可以反向扫出引用了库内论文却尚未入库的新工作，魔棒也终于支持直接用论文标题入库。PAPER.md 正文解析改为可插拔引擎并接入 MinerU、Paddle 与 OpenAI 兼容 VLM OCR 云端方案。同时修复了跨页跨栏翻译断句、macOS 文件树拖拽失效与 Zotero Connector 重复下载等问题。
    新功能
    - arXiv Daily 每日推荐：Plaza 会把当天的 arXiv 论文与你的 Vault 库做比对排序，通过配置的 OpenAI 兼容 Embedding 端点计算摘要向量，并按余弦相似度加权最近新增的论文，直接给出今天该读什么。向量与上次运行结果缓存在 catalog.sqlite（schema v6），当天再次打开完全不走网络；卡片支持一键批量翻译全部摘要。Agent 设置底部新增 BYOK Embedding 端点配置（Base URL / API Key / 模型），API Key 沿用掩码脱敏不会回传 WebView。（b3529faf 8c024e37 f6bb0955 by @Phil-Fan, 关闭 #342）
    - 发现引用你论文库的新论文：论文文件夹右键新增反向引用扫描，找出引用了库内论文但还没入库的新工作。本地 TeX/.bbl 只知道正向引用，因此数据来自 Semantic Scholar（OpenAlex 几乎没有 arXiv 预印本之间的引用边，对预印本库形同虚设）；先按整库批量请求再以 8 路并发按种子展开。候选依次经过三层过滤：跳过被引量过大的种子、按引用 IDF 加权重叠度、再用中心化 SPECTER2 最大相似度做门限（阈值由你的库自身校准），最后以固定预算加 MMR 排序输出，无需按文件夹调参。（a5c6cfc3 by @Phil-Fan, 修复 #341）
    - 魔棒支持按标题入库：只有论文标题时以往会被直接拒绝，现在魔棒可以直接搜标题。搜索走 Semantic Scholar，并在其无密钥端点限流时回退 arXiv；搜索只负责把文本映射为候选标识符，选中后仍回到标识符管线，Translator 保持元数据的唯一事实来源。魔棒输入不再按空格切分，标题得以完整送达，顺带修好了占位符早已提示的 npx skills add … 形式。（129a9f55 by @Phil-Fan, 关闭 #326）
    - 可插拔的 PAPER.md 云端解析引擎：无 TeX 论文的正文解析新增引擎注册表，除本地 liteparse 外可选 MinerU full.md、Paddle PP-StructureV3 markdown 与 OpenAI 兼容逐页 VLM OCR（配套独立 PDF 渲染 worker）。云端引擎复用 layout provider 凭据，失败自动回退本地解析。设置与引导页新增引擎选择、按 Provider 合并的凭据卡片、Prompt 覆盖与按 Provider 的模型预设。（03efc6fe e4f51033 1e6bd8d1 0b41bf11 by @qychen2001, 关闭 #327）
    - 交叉引用悬停预览图表与公式：一次 PDF 遍历中同时解析 hyperref 的 figure. / table. / equation. / algorithm. 命名目标（原先只有 cite.*），悬停 \ref 链接即把目标解析到对应版面区域并显示裁切预览，不必再跳页找图。（604d0693 by @Phil-Fan, 参考 #349）
    - 重开已关标签页与发送选区到聊天：⇧⌘T 恢复误关的面板，不必回文件树里翻找；⇧⌘A 把当前选区交给 Agent 并把光标直接落在输入框，可以立刻打字提问。两个组合键同时暴露为命令面板命令。重开历史存在 workspace store（临时，切换 Vault 即丢弃），记录的是论文正文而非其 NOTES 伴生文件，因此重开会带回完整阅读对。（479a91fd by @Phil-Fan, 关闭 #345）
    - author-lookup 内置技能：新增随 Vault 分发的 author-lookup 技能，检索论文一作与通讯作者的 email、主页、GitHub 与 OpenReview 链接，多来源交叉验证后写入 {paper}/NOTES.md 的联系方式小节并保留用户原有内容。技能还会在 {paper}/attachments/ 生成作者调研报告（仅在有内容时创建目录），一作附完整发表列表；作者去歧义优先用 DBLP 结合姓名与机构匹配，合并会议正式版与同题预印本并保留正式版，Google Scholar 仅用于补充 DBLP 未收录的条目。（3aa017a3 20cbef93 0d9936a5 by @Phil-Fan, 关闭 #343）
    改进
    - 导入后不再自动打开论文：统一取消导入完成后自动打开论文，避免文件树频繁跳转抢焦点导致侧栏自动滚到底部。改动覆盖复用魔棒标识符管线的全部入口（Plaza 入库、References 面板、Zotero 迁移）；成功入库显示「已入库」并缓存状态，失败仅提示错误而不污染侧栏；文件树对同一目标只定位一次，后台导入阶段的刷新不再重复滚动。（80859d6f by @Phil-Fan, 修复 #350）
    - 切换 Vault 时释放上一个库的资源：vault:opened 处理器现在返回 teardown，让一次 Vault 切换的建立与释放写在同一处，修好了 Catalog 行、Wiki 重命名流程、Agent 会话、标签页标注与版面分析在切库后仍保留旧库状态的问题。新增 vault_release 命令关闭 Host 侧 Catalog 连接，此前一次会话访问过的每个 Vault 都会把 SQLite 句柄与 WAL 一直留到进程退出。同时新增 listenSafe，修复事件订阅在 listen() 尚未 resolve 时被销毁导致监听器永久泄漏的问题。（97dc3eb8 4737b473 a8b32f8f 127ee400 by @Phil-Fan）
    - HiDPI 屏幕 PDF 清晰度：之前 1.5 的 dpr 上限同时作用于整页底图与锐化瓦片层，Retina 屏上瓦片只按原生线性密度的 75% 渲染，小字发虚。现在底图仍限流（它在瓦片之下，且整页栅格化最昂贵），瓦片放开到 min(devicePixelRatio, 2)。（52e08e4e by @qychen2001, 参考 #348）
    - 匿名活跃度遥测：12 类本地活动事件经既有 facet/status/qty 投影匿名化后上报 PostHog，路径、Vault、搜索词与技能名不会离开设备。原 usageTrackingEnabled 开关移除——本地 usage.sqlite 记录始终开启，仅由 telemetryEnabled 控制是否上报（下次启动生效）。（8102c438 by @Phil-Fan）
    修复
    - 跨页跨栏翻译断句：PDF 文本层送到翻译引擎时夹带换行连字符、合字与页眉页脚串流，跨栏或跨页续写的段落还会被拆成两个半句，译文因此读起来是断的。现在先归一化源文本，把续写片段串成一次请求再按 bbox 拆回，行内公式/URL/DOI 做 token 掩码，两条 prompt 路径都加上学术翻译规则。（b4669241 by @Phil-Fan, 修复 #340）
    - Zotero Connector 重复下载与重复论文目录：附件仍在下载时收到保存目录变更会与持有旧路径的 writer 竞态，产生重复下载、重复论文目录，并过早触发解析。现在用 desired_parent 记录目标目录延迟移动，待 PDF 下载结束后再走共享的 paper_move 事务，路径稳定后才发出 connector:item-saved；PDF 优先由浏览器 saveAttachment 上传，仅在未取得附件时才回退 DOI/arXiv 下载。（#352 by @Winfred666）
    - macOS 文件树拖拽移动无效：wry 覆写了 WKWebView 的 NSDraggingDestination 且 Tauri 的 handler 总返回 true，页面拿不到 DOM dragover/drop，原生 drop 是唯一信号；而 WebKit 先触发源侧 dragend 清掉了拖拽状态，于是每次放下都静默失效。现在 dragend 后保留拖拽路径一小段宽限期，高亮也改由原生 enter/over 事件驱动；同时把论文单元当叶子处理，放到论文行上会落到其父文件夹。（6a3478fb by @Phil-Fan, 修复 #353）
    - Skill 导入 frontmatter 解析：新增共享 frontmatter 解析模块，支持引号、折叠块、多行续行与 CRLF，替代多处手写实现；description 按字符截断至 1024，超长不再阻断安装；单个 SKILL.md 解析失败时只跳过该候选，仅当没有任何有效 Skill 时才整体报错。（3ca7c2de 06c4d051 by @Phil-Fan, 修复 #355）
    - 移动目标选择器可读性：移动文件夹面板的列表高度加大，悬停时显示完整文件夹路径。（f18705dc by @Phil-Fan, 修复 #354）
    - 无 DOI 的 Feeds 无法入库：只链接出版商文章页的订阅源（如 Nature Communications 主题源）不带 DOI/arXiv 字段，条目被永久判为资讯而拿不到入库操作。现在解析阶段把 nature.com/articles/<slug> 映射为 DOI，抓正文时同时刮取 citation_doi / prism.doi / dc.identifier 回填 paper_url，刷新订阅源时用 COALESCE 保住已回填的值。（45ed86f5 by @qychen2001, 参考 #348）
    - 宽导入对话框实际宽度：DialogContent 基础类含 sm:max-w-sm，而 tailwind-merge 不允许无前缀的 max-w-none 覆盖带 variant 前缀的类，导致论文搜索与 Skill 导入对话框申请 36rem 却静默渲染成 24rem，长标题会溢出卡片。（c9e6d674 by @Phil-Fan）
    - 启动生命周期顺序与清理：Store 预填从 useState(() => …)（渲染期副作用，StrictMode 下可能执行两次）移到 boot()，在 createRoot 前 await，保住首帧保证的同时去掉不纯渲染；JobCenter 的两个全局订阅改为同步设置幂等守卫并返回 disposer；app:ready 现在等待 validateRestoredVault() 完成后再发出；window:closed 的两个裸监听器合并进事件总线统一处理。（858878eb by @Phil-Fan）
    - DeepSeek-OCR 版面标签与 Paddle 正文模型：对 SiliconFlow、MinerU 与 AI Studio 的实测推翻了两个假设：DeepSeek-OCR 的 <|ref|> 载荷是版面标签而非正文（会把 text/sub_title 泄漏进正文），且 PP-StructureV3 是版面模型，因此正文路径改为默认产出 markdown 的 PaddleOCR-VL-1.6 并从设置读取模型。同时剥离 PaddleOCR-VL 的 <|LOC_n|> 框 token，该模型只接受其规范任务 prompt，否则会退化成检测输出。（89efcf05 by @qychen2001）
