- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    This release brings Agent conversations into a full-window Agents Window and continues refining translation selection and export in PDFs: finished translations now live in the paper folder and sync only when opted in, while element selection and display-formula hit testing follow what is actually rendered. Translation PDFs now embed only the glyphs they use and share source-page resources, bringing a 10-page paper to about 5 MB. The Azure and Google Cloud translation engines are removed.
    Features
    - Agents Window: A new title-bar entry switches the main window into a full-window Agents workspace. The left rail lists conversation history per agent, each open conversation becomes a tab that can sit side by side, model and collaboration controls move into the composer footer, and the conversation column can be centered and resized. The sidebar Agent node goes back to expanding like a normal folder. (commit by @Phil-Fan)
    - Translation storage and opt-in sync: Finished translations are written to translations/translated.pdf in the paper folder, bilingual exports go to translations/bilingual.pdf, and the export dialog opens there by default. Sync gains a Translation scope that stays off by default; the directory stays out of Git sync even when PDF, source, and attachments are all enabled. (#1268 by @ffy6511)
    Improvements
    - Title-bar quick open: The centered command palette is now an inline search field in the title bar. Results drop below it without a scrim, and Cmd+P, Shift+Cmd+P, Esc, click-outside, and keyboard navigation continue to work. (commit by @Phil-Fan)
    - Translation PDF size: Fonts embed only the glyphs the translation uses, and formulas from the same source page share one page resource instead of repeating the full page. The translation of a 10-page paper lands around 5 MB, cutting storage by roughly 80%. (#1270 by @ffy6511)
    Fixes
    - Element-selection bounds: Cmd+. selection over translated text keeps only the layout blocks the rectangle covers; grazing the next section no longer pulls in a whole sentence, while a rectangle that truly covers two sections keeps both. Drag hits are measured from rendered lines, click and hover land on the chosen sentence, and saved highlights match on the page. (#1266 by @ffy6511)
    - Display formulas and prose selections: Unnumbered display formulas are selectable in element mode and show a Formula label on hover, and a drag that starts on a formula keeps the formula under the pointer. Prose lines are no longer mistaken for display formulas, highlights no longer cut words out of a sentence, and descenders stay inside the selection. (#1267 by @ffy6511)
    - Copying a paper path from the sidebar: WKWebView rejects clipboard writes once the translated PDF has focus; the copy now happens during the click, and an open PDF selection no longer replaces a copy started from the sidebar. (#1271 by @ffy6511)
    - Claude detection on Windows: A leftover claude.cmd whose npm package is gone no longer hides a native claude.exe. Detection walks PATH candidates and keeps the first one the SDK can spawn; CLAUDE_CODE_EXECUTABLE stays authoritative and an explicit but unusable override fails instead of falling back. (#1259 by @JiaheChen2002)
    - Translation pane closes with the paper body: Closing the paper body tab now closes its comparison translation pane too; closing NOTES or the translation pane alone still leaves the body open. (commit by @Phil-Fan)
    - Trash clears translation cache: Moving a paper to the trash deletes its reflow-ir directory and removes matching reflow-build PDFs by content hash; unmapped hashes and font assets stay until a full cache clear. (#1268 by @ffy6511)
    Breaking Changes
    - Azure and Google Cloud translation engines removed: The Microsoft Translator (Azure) and Google Cloud Translate BYOK providers, their settings cards, host request paths, the Azure-only region field, and CLI profile fields are gone. Stored selections fall back to the default engine. (commit by @Phil-Fan)
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    本次更新把 Agent 会话集中到整窗的 Agents Window，并继续打磨 PDF 译文的选择与导出：译文成品归入论文目录并成为独立的可选同步项，版面元素框选和行间公式的点选边界更准确；译文 PDF 只嵌入实际用到的字形并共用源页资源，体积降到约 5 MB。同时移除了 Azure 与 Google Cloud 两个自带翻译引擎。
    新功能
    - Agents Window: 顶栏新增 Agents Window 入口，把主窗口切换为整窗工作区。左侧栏按 Agent 列出会话历史，打开的会话以标签页并排排列，模型与协作选项收进输入框底栏，会话列可居中调整宽度；侧栏 Agent 节点恢复为普通文件夹展开。（commit by @Phil-Fan）
    - 译文归档与可选同步：全文译文保存到论文目录的 translations/translated.pdf，双语导出去 translations/bilingual.pdf，导出对话框默认打开该目录。同步范围新增「译文」并默认关闭；即使 PDF、源码和附件全开，该目录也不会进入 Git 同步。（#1268 by @ffy6511）
    改进
    - 顶栏快速打开：居中的命令面板改为顶栏内联搜索框，结果在下方展开且不铺遮罩；Cmd+P、Shift+Cmd+P、Esc、点击外部与键盘导航保持可用。（commit by @Phil-Fan）
    - 译文 PDF 体积：字体只嵌入译文实际用到的字形，同一源页的公式共用一份页面资源，不再为每个公式复制整页内容。10 页论文的译文约 5 MB，存储占用降低约 80%。（#1270 by @ffy6511）
    修复
    - 版面元素框选边界：⌘. 在译文上框选时只保留框覆盖的版面块，指针擦到下一节边界不会带入整句；确实覆盖两节时两节都保留。拖选范围按实际渲染行计算，点击与悬停落在句子上，保存的高亮在同页重新匹配。（#1266 by @ffy6511）
    - 行间公式与正文选区：无编号的行间公式在版面元素模式下可点选，悬停显示 Formula，从公式起笔时保留指针下的公式。正文行不再被误判成行间公式，高亮不再挖掉句中的词，字母下伸部分也留在选区内。（#1267 by @ffy6511）
    - 侧栏复制论文路径：译文 PDF 获得焦点后，WKWebView 会拒绝剪贴板写入；现在改为在点击时写入，已打开的 PDF 选区也不会覆盖从侧栏发起的复制。（#1271 by @ffy6511）
    - Windows Claude 检测：PATH 中残留的 claude.cmd（对应 npm 包已删除）不再遮住原生 claude.exe；检测逐个尝试 PATH 候选取第一个可启动的入口，CLAUDE_CODE_EXECUTABLE 仍优先，显式指定但不可用时直接报错。（#1259 by @JiaheChen2002）
    - 译文面板随正文关闭：关闭论文正文标签时成对关闭对照译文页；单独关闭 NOTES 或译文页仍保留正文。（commit by @Phil-Fan）
    - 回收站清理译文缓存：论文进入回收站后删除其 reflow-ir 目录，并按内容哈希清掉对应的 reflow-build PDF；未映射的哈希与字体资产保留到整批清除。（#1268 by @ffy6511）
    破坏性变更
    - 移除 Azure 与 Google Cloud 翻译引擎：Microsoft Translator（Azure）与 Google Cloud Translate 两个 BYOK 提供商，连同设置卡片、Host 请求路径、Azure region 字段和 CLI 配置项一并移除。已保存的选择回退到默认引擎。（commit by @Phil-Fan）
