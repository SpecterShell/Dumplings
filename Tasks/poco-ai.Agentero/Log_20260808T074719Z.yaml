  Key: ReleaseNotes
  Value: |-
    Installers and CLI for Agentero v0.5.1.
    Desktop
    Platform installers from Tauri (see assets below).
    Android
    Agentero_<version>_aarch64.apk — arm64 devices, Android 7.0+.
    Sideload it directly; the app is a remote client for your desktop Vault.
    CLI (agentero)
    Headless Vault / Catalog machine interface (no BYOA).
    Download the matching agentero-cli-<version>-<rust-host>… archive, extract, and put agentero on your PATH.
    agentero --version
    agentero vault which --json
    Source install (slow; pulls desktop Rust deps):
    cargo install --git https://github.com/poco-ai/Agentero --tag v0.5.1 --locked --package agentero-cli
