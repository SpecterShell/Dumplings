- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    0.19.0 turns the right sidebar into a persistent tab workspace shared by Zen and the reading view, so Agent sessions, local documents, and a macOS sidebar browser can sit side by side. Zen also gets a compact session history, a new welcome page, and session-aware selection routing, alongside PDF memory, translation zoom, and theme color fixes.
    Features
    - Right sidebar tabs: the reading workspace and Zen share one right-sidebar tab strip for Agent sessions, local PDFs, Markdown, and HTML. Tab order, the selected tab, and whether the sidebar is open are restored per vault, and tabs can be dragged to reorder. (#1278, commit by @ffy6511)
    - New-tab launcher: Cmd+T (Ctrl+T on Windows/Linux) opens a launcher while the sidebar is collapsed, to start an Agent session, open the current paper's notes from the main workspace, open a local file, or search by path, paper title, or wiki alias. With focus in the right sidebar, Cmd+W closes the current tab, and closing the last tab collapses the sidebar. (commit by @ffy6511)
    - Sidebar browser on macOS: open HTTP(S) pages in the right sidebar with back, forward, and reload. Pages run in a temporary, isolated browsing session, and restoring the layout reopens the last URL. Other platforms open URLs in the system browser. (commit by @ffy6511)
    - Zen session history: the left rail starts collapsed in the Agent window, each agent shows its five most recent sessions behind a Show all reveal, and missing session titles are filled in the background. (commit by @ffy6511)
    - Zen welcome page: a new conversation in the Agent window shows “Build your library in with ”, where both names open their switchers; the activity heatmap from Settings sits below with the reading / token switch. (commit by @ffy6511)
    - Citations in the sidebar: local PDF, note, and HTML links in a Zen reply open in the right sidebar while the conversation stays in the main area. (commit by @ffy6511)
    Improvements
    - Conversation layout: Zen conversations cap at 56rem with no width drag handle, and the composer gets its own card surface with a higher start and more bottom clearance. (commit, commit by @ffy6511)
    - Left rail motion: collapsing or expanding the left rail transitions the Dockview panels together; opening or closing it in the Agent window no longer overwrites the reading workspace preference. (commit by @ffy6511)
    - Selection shortcuts: Cmd+L adds the current selection to the active conversation and focuses the composer, or toggles the right sidebar when nothing is selected; Shift+Cmd+L always focuses the conversation composer. Selections follow the Zen session or sidebar tab that owns them. (commit by @ffy6511)
    - Activity heatmap: the less / more legend is gone, future days fade out, and the card can fill a wider surface. (commit by @ffy6511)
    - Phone-width layout: side-by-side translations stack below the source, folder cards become square on phone widths and sit shorter overall, and the title-bar Agent entry folds into an icon button. (commit, commit, commit by @ffy6511)
    Fixes
    - Library scrolling: the file tree scrolls again when a vault has more folders than fit. (#1275 by @YasyaKarasu)
    - Translation zoom: zooming a translated PDF no longer flashes empty tiles, and a translation tab in the background keeps its tiles hidden. (#1276, commit, commit by @ffy6511)
    - Theme colors: bundled themes no longer reuse card or popover colors for muted text and accents, keeping state colors distinct from their surfaces. (commit by @ffy6511)
    - PDF memory: full-page translation previews use an approximately 16 MiB pixel budget, and idle PDF engines and Windows layout inference are reclaimed, lowering memory use after long reading sessions. (#1269 by @W-RMSL)
    - Sidebar tab focus: opening a sidebar tab hands keyboard focus to the sidebar, so an immediate Cmd+W closes the new tab and keeps the main tab open. (commit by @ffy6511)
    - Agent events after a window move: a window move rebinds only the sessions that were handed off, so other sessions and later runs keep reporting to their original window. (commit by @ffy6511)
    - Windows OCR builds: cached native OCR libraries now build with the Release configuration, so Windows development and test builds no longer fail looking for the leptonica static library. (#1263 by @Aschenbath)
    Full changelog: v0.18.4...v0.19.0
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    0.19.0 把右栏从单一 Agent 面板扩展成可持久化的标签工作区：Zen 与阅读界面共用同一组标签，Agent 会话、本地文档和 macOS 右栏浏览器可以并排使用。Zen 的历史、欢迎页和选区路由也一并重做，另有一批 PDF 内存、译文缩放与主题配色修复。
    新功能
    - 右栏标签页：阅读界面和 Zen 共用一组右栏标签，Agent 会话、本地 PDF、Markdown 和 HTML 都在同一条标签栏中打开；按资料库恢复标签顺序、选中项和开合状态，拖动标签可调整顺序。（#1278, commit by @ffy6511）
    - 新标签页启动器：⌘T（Windows / Linux 为 Ctrl+T）可在右栏收起时打开启动器，新建 Agent 会话、打开主区当前论文的笔记、打开本地文件，或按路径、论文标题和双链别名搜索文件；焦点在右栏时 ⌘W 关闭当前标签，最后一个标签关闭后右栏收起。（commit by @ffy6511）
    - 右栏浏览器（macOS）: 在右栏打开 HTTP(S) 网页，支持后退、前进和重载；网页使用临时、隔离的浏览环境，恢复布局时重新打开上次网址。其他平台会在系统浏览器中打开网址。（commit by @ffy6511）
    - Zen 会话历史：进入 Agent 窗口时左侧历史默认收起，每个 Agent 先显示最近 5 条会话，点「显示全部」展开其余记录；缺失的会话标题会在后台补全。（commit by @ffy6511）
    - Zen 欢迎页：Agent 窗口里的新会话显示「在 <资料库> 中与 共建文献库」，资料库和 Agent 名称可直接点开切换，下方复用设置中的阅读 / Token 活动热力图。（commit by @ffy6511）
    - 右栏打开引用：在 Zen 对话里点击本地 PDF、笔记或 HTML 链接时，文件在右栏打开，对话留在主区。（commit by @ffy6511）
    改进
    - 对话区布局：Zen 对话固定为 56rem 最大宽度并移除宽度拖拽手柄；输入区改用独立卡片底色，起始高度和底部间距重新调整。（commit, commit by @ffy6511）
    - 左栏动画：收起或展开左栏时，Dockview 面板一起过渡；Agent 窗口内的左栏开合不再改写阅读工作区的偏好。（commit by @ffy6511）
    - 选区快捷键：⌘L 有选区时把选中文字加入当前会话并聚焦输入框，无选区时显示或收起右栏；⇧⌘L 始终聚焦当前会话的输入框，选区跟随拥有它的 Zen 会话或右栏标签。（commit by @ffy6511）
    - 活动热力图：去掉「少 / 多」图例，未到来的日期淡出显示，并可在更宽的卡片中铺满。（commit by @ffy6511）
    - 窄窗口布局：对照译文在手机宽度下改为上下堆叠，文件夹卡片在手机宽度下改为方形且整体高度降低，标题栏的 Agent 入口收进图标按钮。（commit, commit, commit by @ffy6511）
    修复
    - 论文库滚动：文件树恢复纵向滚动，文件夹较多时可以滚到列表底部。（#1275 by @YasyaKarasu）
    - 译文缩放：缩放译文时不再闪现灰色瓦片，切到后台的译文标签也不会再把瓦片画到前台。（#1276, commit, commit by @ffy6511）
    - 主题颜色：内置主题的次要文字和强调色不再复用卡片或浮层的颜色，状态色与背景保持区分。（commit by @ffy6511）
    - PDF 内存：整页译文预览按约 16 MiB 的像素预算栅格化，空闲的 PDF 引擎和 Windows 版面分析进程会被回收，长时间阅读后的内存占用更低。（#1269 by @W-RMSL）
    - 右栏标签焦点：打开右栏标签时焦点先交给右栏，紧接着按 ⌘W 关闭的是新标签，主标签保持打开。（commit by @ffy6511）
    - 移窗后的 Agent 事件：移动窗口时只重绑实际交接的会话，其他会话和之后开始的运行仍把事件送回原窗口。（commit by @ffy6511）
    - Windows OCR 构建：缓存的原生 OCR 库改用 Release 配置编译，Windows 开发与测试构建不再因找不到 leptonica 静态库失败。（#1263 by @Aschenbath）
