  Key: ReleaseNotes
  Value: |-
    版本概览
    本版本针对 v0.6.6-r.1 后发现的数据迁移、会话持久化、目录搜索资源控制、模型 Key 健康策略和流式请求取消等问题进行集中修复，并补充 OpenAI Responses 推理摘要解析。建议所有使用 v0.6.6-r.1 的用户升级。
    问题修复
    数据迁移与会话恢复
    - 完善 Agent 与 User Profile 的跨模块迁移协调，避免并行首次加载、部分目标目录或迁移失败时留下不可恢复状态。
    - 迁移完成后发送成功通知，帮助用户确认迁移已完成并跳转到对应管理页面。
    - 统一智能体运行时资产路径，改善旧目录、归档目录和当前目录之间的资源查找。
    - 改进 LLM Chat 会话原子持久化与恢复，覆盖并发写入、索引恢复、删除后的迟到写入和分离窗口参与写入等场景。
    搜索、传输与资源控制
    - 为目录搜索增加取消生命周期、资源边界和并发控制，限制搜索深度、文件数量、读取字节数和整体截止时间。
    - 将 Tool Calling、VCP 分布式执行和目录搜索的取消信号贯通，减少超时后后台任务继续占用资源的情况。
    - 传播桌面流式请求取消信号，使用户停止生成后底层请求能够更及时结束。
    - 统一并隔离 LLM Key 健康策略，避免不同渠道或请求之间相互污染可用性状态。
    模型、知识库与隐私
    - 识别模型路由不可用错误，改善错误分类和用户提示。
    - 修复知识库删除后向量数据与内存状态未同步清理的问题。
    - 修复转写任务进行中时资产过滤可能误跳过活动资源的问题。
    - 对 Deep Link 日志中的凭据参数进行脱敏，降低敏感信息意外写入日志的风险。
    Responses 推理摘要
    - 支持解析 OpenAI Responses 格式中的推理摘要，并保持流式边界，改善推理过程展示和回放的一致性。
    升级提醒
    - 建议从 v0.6.6-r.1 升级后观察首次启动迁移、智能体资产、用户资料和历史会话是否正常加载。
    - 如果使用大目录搜索、VCP 分布式工具或长时间流式请求，建议重点验证取消操作后资源是否及时释放。
    - 如果使用 OpenAI Responses 或其他带推理摘要的模型，建议检查流式输出、推理展示和会话恢复。
