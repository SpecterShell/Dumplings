  Key: ReleaseNotes
  Value: |-
    Pure Clash v0.2.8
    新增
    - 记住运行模式：规则、全局、直连模式自动保存，下次启动恢复上次选择。
    - 记住节点选择：各手动分组（含 GLOBAL）在重启或订阅更新后恢复原节点；节点不存在时回退到该组第一项。
    - 节点延迟排序：代理页新增排序按钮，可切换默认顺序与延迟升序，未测速和超时节点排在末尾。
    优化
    - 模式和节点切换增加并发保护，避免与订阅更新相互覆盖。
    - 切换或保存失败时显示提示，支持重试。
    - 排序保留当前节点选择、分组展开状态和已加载数量。
    Full Changelog: https://github.com/prime-zt/pure-clash/compare/v0.2.7...v0.2.8
