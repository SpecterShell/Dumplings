  Key: ReleaseNotes
  Value: |-
    - The Database page is now five pages: Databases, Connection, Functions, Collations and Modules. Connection carries compile_options, the definitive answer to what the loaded SQLite library was built with; Functions lists every routine the connection answers to by name, including anything a loaded extension registered.
    - The table designer names the views and triggers that use a column you are removing, before the change is applied rather than after it has quietly broken them.
    - Two new limits under Tools → Options → Grid contents: Max TEXT size to show in grids bounds how much of a long value is drawn, and Max cell height in grids bounds how tall one cell can make a row.
    - Options that were check boxes on forms and dialogs are now switches. Grids keep their check boxes.
    - A database now opens even when an extension loaded automatically fails to initialise, and the message says which extension and why. The extensions list names the database each one was left out of.
    - Compare follows the database selected in the tree when the pair it remembered is no longer open, instead of starting with neither side chosen.
    - The Options window’s page list keeps the keyboard, so the pages can be walked with the arrow keys after one is clicked.
