- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    The second maintenance release of the 26.08 series is out with the usual batch of stability fixes and workflow improvements. Highlights include improved project handling and ability to set the frame count to start at 1 in the Dynamic Text filter which is useful for animation workflows. This release also fixes several issues in proxy clips, titles, and audio levels.
    Kdenlive needs your support
    Our small team has been working for years to build an intuitive open source video editor that does not track you, does not use your data, and respects your privacy. However, to ensure a proper development requires resources, so please consider a donation if you enjoy using Kdenlive - even small amounts can make a big difference.
    Full Changelog
    - Add option to control whether qmllint runs during build. Commit.
    - Do not set mlt cache to 0 to improve file handle situation. Commit. See bug #526044
    - Fix possibly incorrect detection of proxied clip, causing proxy to be considered the original clip. Commit.
    - Fix path detection on missing root. Commit.
    - Fix title images not found on project opening. Commit.
    - Fix project storage incorrectly switching from project folder to default location when editing settings of unsaved project. Commit.
    - Fix monitor not refreshing on subtitle cut, add or delete. Commit. See bug #526379
    - Avoid hardcoding absolute root path in generated MLT clip. Commit. Fixes bug #495091
    - Fix clip monitor image sometimes not cleared after deleting a bin clip. Commit.
    - Fix editor font size zoom. Commit.
    - Fix incorrect proxy param breaking nvidia encoding. Commit. Fixes bug #526155
    - Fix resize handles appearing on deselected titler items. Commit.
    - Fix stale selected pointer overriding new selection in Titler. Commit.
    - Fix titler animation viewports moving after being deselected. Commit.
    - Fix changing project's storage folder if not yet saved. Commit.
    - Fix ClipMonitor job info width binding loop. Commit.
    - Fix possible freeze on audio failed recording. Commit.
    - Fix audio recording sometimes correctly monitoring but recording nothing. Commit.
    - Fix proxy crash and proxying .kdenlive playlist clips. Commit.
    - Don't try to generate sub playlists if .kdenlive file only containe 1 sequence. Commit.
    - Do not seek playhead if clip did not insert. Commit.
    - Feat(effects): add keyword to dynamictext. Commit.
    - Disconnect monitor signal on deactivation in RotatedRectHelper. Commit. Fixes bug #523263
    - Fix leaking monitor helper caused rotation on wrong clip. Real fix for !998. Commit. Fixes bug #523263
    - Fix arrow keys moving playhead instead of grabbed clip after monitor interaction. Commit. Fixes bug #472365
    - Fix incorrect handling of missing proxies on document open. Commit.
    - Move default safe proxy params to C++ so that any change is not shadowed by a custom list. Commit.
    - Fix crash caused by uninitialized track in new project. Commit. See bug #525583
    - Fix master audio levels incorrect with latest MLT. Commit. Fixes bug #525578
    - Fix merge problem breaking qml. Commit.
    - Fix audio thumbs not correctly showing on clip monitor and audio/video drag icon inconsistently working. Commit.
    - Fix clip monitor clip name history not shown on hover monitor. Commit.
    - Remove incorrect cxx version set in kdenlivelib. Commit.
