  Key: ReleaseNotes
  Value: |-
    Win 顺 0.13.0：拖着文件左右晃几下鼠标，指针旁弹出收藏夹圆盘，松手就移动或复制过去；截图大升级：长截图自动滚动拼接、智能打码和涂抹打码、抹平、二维码、延时、取色，贴图能旋转、收起、选字；剪贴板能导入 Ditto 和文本、记住公式、不开面板直接粘贴；双击 Shift 也能打开；设置里有插件库；收藏夹能加带 的自定义命令；安装程序的“浏览文件夹”窗口和管理员程序的对话框也有搜索栏。WinShun 0.13.0: shake the mouse while dragging files and a ring of your favorite folders opens at the pointer, so letting go moves or copies there; a big screenshot update: scrolling screenshots that stitch themselves, smart and brush redaction, smoothing, QR codes, delay and a color picker, and pins you can turn, fold and pick text from; the clipboard imports from Ditto and text files, keeps equations and pastes without opening the panel; double Shift can open it too; a plugin library in the settings; custom commands with in favorites; and the search bar on installers' folder pickers and on administrators' dialogs.
    新功能 · What's new
    - 🎯 拖文件时晃一晃，弹出收藏夹圆盘：按住左键拖着文件或文件夹（资源管理器、桌面、别的程序都行），左右快速晃几下鼠标，指针处弹出一个圆盘：内圈选移动或复制，外圈是前 8 个文件夹收藏，名字长的分两行写。拖到哪个文件夹上松开，就移动或复制到哪里，进度和重名提示都是 Windows 自己的，在资源管理器里按 Ctrl+Z 能撤销。在中间松开或按 Esc 什么也不做，拖出圆盘它就收起，接着拖到别处照常放。默认开，在 设置 › 收藏夹 里关；Win 顺 以管理员身份运行时用不了。
      Shake while dragging, get a ring of favorites: drag files or folders with the left button (from File Explorer, the desktop or another program) and shake the mouse left and right a few times: a round menu opens at the pointer. The inner ring picks Move or Copy; the outer ring is your first 8 favorite folders, a long name written on two lines. Release on a folder to move or copy there; the progress and name-conflict windows are Windows' own, and Ctrl+Z in File Explorer undoes it. Release in the middle or press Esc and nothing happens; drag out of the menu and it closes, and the drag goes on as usual. On by default; turn it off in Settings › Favorites. It does not work while WinShun itself runs as administrator.
    - 📜 长截图（#59）：网页、聊天记录、文档、文件列表比屏幕还长时，选好区域按 Ctrl+L（或工具条的“长截图”），Win 顺 自己往下滚着截，拼成一张长图，在编辑窗口里打开。固定在上下两头的栏只留一份。哪个窗口它滚不动，或者那个程序是管理员身份，就请你自己滚，滚完点“完成”。只能左右滚的、一直在动的画面不适合。
      Scrolling screenshots (#59): for a web page, a chat, a document or a file list longer than the screen, choose the area and press Ctrl+L (or Long screenshot on the toolbar): WinShun scrolls it by itself while it shoots and stitches one long picture, opened in the editing window. Bars fixed at the top and bottom are kept once. Where it cannot scroll a window, or the program runs as administrator, it asks you to scroll and click Done. Content that only scrolls sideways, or keeps moving, does not suit it.
    - 🙈 智能打码、涂抹打码、抹平：选好区域停一会儿，Win 顺 在本机找出图里的手机号、身份证号、银行卡号、邮箱、密钥、带用户名的路径和本机名，提示“发现 N 处”，点一下（或 Shift+B）全部盖上，一次 Ctrl+Z 全撤。找的可能有漏，发出去前再看一眼；不想自动找，在 设置 › 截图 里关掉，按 Shift+B 时再找。打码还能像刷子一样涂过去，多了一种“抹平”：用四周的底色盖住，像擦掉了一样。打码的地方还原不出来；编辑窗口里也有这些。
      Smart redaction, brush redaction and Smooth: once an area is chosen, WinShun reads it on your PC and finds phone numbers, ID card and bank card numbers, e-mail addresses, keys, paths with your user name and this PC's name, and offers "N found"; one click (or Shift+B) covers them all, and one Ctrl+Z takes it back. It can miss some, so look once more before you send; to stop the automatic reading, turn it off in Settings › Screenshot and Shift+B reads on demand. Redaction can also be painted along a stroke, and there is a new kind, Smooth: covered with the surrounding background, as if wiped away. What is under a redaction cannot be worked back out; the edit window has the same tools.
    - 🔍 框选、取色、延时、二维码：鼠标移到窗口或按钮上，它就被框出来，框外整片变暗，点一下选中（#59）；设置、计算器这类程序里的小按钮、侧栏也认得出来。但 Chrome、Edge、VS Code、微信这类 Chromium 内核的程序里面不识别，只能框整个窗口，需要时手动拖选。Shift+R 回到上一次的那一块。放大镜里 C 复制颜色，Shift+C 在 #RRGGBB、rgb()、hsl() 之间换。D 或工具条的“延时”倒计时 3、5 或 10 秒再定住屏幕，用来截菜单和悬停提示；设置里可以让截图带上鼠标指针（默认关）。Q 读选区里的二维码，文字显示出来可以复制，是网址时多一个“打开链接”，点了才会打开。工具条上的按钮改成了图标，复制放在最右边，要显示哪些按钮在 设置 › 截图 里选（#57）。
      Choosing, color, delay and QR codes: rest the pointer on a window or a button and it is outlined, with everything outside it dimmed; click to take it (#59). Small buttons and side panels in apps such as Settings and Calculator are found too, but not inside Chromium apps such as Chrome, Edge, VS Code and WeChat, where only the whole window is outlined; drag an area there. Shift+R goes back to the last area. In the magnifier C copies the color and Shift+C switches between #RRGGBB, rgb() and hsl(). D, or Delay on the toolbar, counts down 3, 5 or 10 seconds and freezes the screen only at the end, for menus and tooltips; the settings can put the mouse pointer in the picture (off by default). Q reads a QR code in the area and shows its text to copy; for a web address there is an Open link button, and nothing opens until you click it. The toolbar buttons are icons now, with Copy at the far right, and Settings › Screenshot chooses which ones show (#57).
    - 📌 贴图更好用（#57 #59）：设了“鼠标穿透”的贴图，按住 Ctrl 就又能拖动、点右键菜单；双击贴图做什么（回到 100%、关闭、收成小块、不做什么）在设置里选；可以转（R）、翻（H V），收成小块或收到屏幕上边的标签，用 T 在图上拖选文字直接复制，还有“关闭其他”、全部隐藏或显示、全部置顶。设置里可以另设两个快捷键：隐藏或显示全部贴图、找回穿透的贴图（一开始都是空的）。设置里打开“复制截图时同时贴图”，复制的同时也贴在屏幕上。序号可以选 1 2 3、A B C、a b c、罗马数字、圈里的数字，放好序号后接着打字，字就跟在它旁边。识别文字之后可以复制、拿它搜索或去网页搜索。
      Better pins (#57 #59): a pin set to click through can be reached again by holding Ctrl over it, to drag it or use its right-click menu; what a double click on a pin does (back to 100%, close, fold to a tile, nothing) is a setting; pins turn (R) and flip (H V), fold to a tile or a tab on the screen's top edge, let you drag over text with T to copy it, and have Close others, hide or show all and all on top. Two optional hotkeys, both empty at first, hide or show all pins and bring back click-through ones. "Pin screenshots when copying" in the settings also pins a screenshot whenever it is copied. Numbers can be 1 2 3, A B C, a b c, Roman numerals or numbers in circles, and the words you type next stand beside the number. After reading text you can copy it, search with it, or search it on the web.
    - 📋 剪贴板（#56 #57 #58）：设置 › 剪贴板 里能导入别处的历史：Ditto 的数据库（装了 Ditto 就是一键）、.txt 文本、.csv 表格（中文 Excel 存的 GBK 文件也认），导进来的放进新分组，不会被自动清理，已经有的条目会跳过（#56）。Word 里单独复制的公式、文档里嵌入的对象，记成一条带图的历史，公式的文字也搜得到，粘回 Word 里还是能编辑的公式或对象，只认图片的程序拿到的是图片；Shift+Enter 把公式粘贴成一行文字（用 Word 测过，WPS 没测）（#58）。想不打开面板就粘贴前九条，在 设置 › 剪贴板 › 快捷键 里打开 Ctrl+1–9 或 Alt+1–9，默认关，打开后这些键在别的程序里原来的用处（比如浏览器切换标签页）就让给它。在 Windows 的“打开”文件选择框里粘贴历史里的文件，完整路径会直接填进“文件名”，多个也行；把几张图片一起拖出去，或粘进资源管理器的文件夹，都存成 PNG 文件（#57）。
      Clipboard (#56 #57 #58): Settings › Clipboard imports history from elsewhere: a Ditto database (one click if Ditto is installed), .txt text and .csv tables (GBK files saved by Chinese Excel are recognised); what comes in goes into a new group, is never cleaned out automatically, and entries you already have are skipped (#56). An equation copied alone from Word, or an embedded object, is kept as a picture entry whose text is searchable and is pasted back into Word as an equation or object you can still edit; a program that only takes pictures gets the picture, and Shift+Enter pastes the equation as a line of text (tested with Word, not with WPS) (#58). To paste the first nine entries without opening the panel, turn on Ctrl+1–9 or Alt+1–9 under Settings › Clipboard › Shortcuts; off by default, and when on those keys no longer do their usual job in other programs (switching browser tabs, say). In a Windows "Open" file box, pasting files from the history puts their full paths in the File name field, several at once if you like; several pictures dragged out together, or pasted into a File Explorer folder, are saved as PNG files (#57).
    - ⌨️ 双击 Shift 也能打开：设置 › 打开 Win 顺 的“双击哪个键”现在有 Ctrl、Alt、Shift 三个。只认单独按下又放开的 Shift，打大写字母和 Shift+ 组合键不算。用 Shift 切换中英文的输入法，双击 Shift 会切换两次，最后回到原来的状态。
      Press Shift twice to open: Settings › Open WinShun, Key to press twice, now takes Ctrl, Alt or Shift. Only a Shift pressed and released on its own counts; capital letters and Shift+ combinations do not. An input method that switches language with Shift switches twice on a double Shift, so it ends where it began.
    - 🧩 插件库：设置 › 插件 › 插件库 里看别人写的插件（来自 WinShun-plugins），点一下安装或更新，下载后先核对大小和校验值。只在打开这一页、点“刷新”或安装时联网。
      Plugin library: Settings › Plugins › Plugin library lists plugins other people wrote (from WinShun-plugins); one click installs or updates one, after its size and checksum are checked. It goes online only when that page is opened, on Refresh, or to install.
    - 🛠️ 自定义命令（#61）：设置 › 收藏夹 › 添加命令，起个关键词，命令里写 {query}，关键词后面打的字就替换到那里。比如关键词 code、命令 "C:\Tools\Code.exe" {query}，输入 code D:\我的项目 回车，就把这个文件夹交给编辑器。不经命令提示符，搜索和导入都不会自己运行命令。存了命令的收藏夹文件，旧版本只会读、不会改，免得把命令弄丢。
      Your own commands (#61): Settings › Favorites › Add command. Give it a keyword and put {query} in the command; what you type after the keyword goes there. With the keyword code and the command "C:\Tools\Code.exe" {query}, typing code D:\my-project and Enter hands that folder to the editor. No command prompt is involved, and searching or importing never runs a command. A favorites file that holds commands is only read, never changed, by older versions, so they cannot lose the commands.
    - 🗂️ 对话框和资源管理器（#62 #60）：安装程序（Inno Setup 做的）里的“浏览文件夹”窗口也有搜索栏了，选好只是把路径填进去，“确定”还是你自己点（选开始菜单文件夹的那个不接管）。以管理员身份运行的程序的“打开”“另存为”对话框旁也有搜索栏，但只能复制选中的路径，要你自己粘贴到路径框里，不会自动转过去，Ctrl+G 也不管用。资源管理器里直接打字搜索时，选中一个文件或文件夹按 Ctrl+Enter，会在这个标签页里转到它所在的文件夹并选中它（设置里选的文件管理器是资源管理器时）。
      Dialogs and File Explorer (#62 #60): the "Browse for folder" window of installers made with Inno Setup has the search bar now; a pick only fills in the path, and you press the installer's OK yourself (the Start Menu folder picker is left alone). The Open / Save dialogs of programs running as administrator have the bar too, but it can only copy the chosen path for you to paste into the path box yourself: no automatic jump, and Ctrl+G does nothing there. When you type to search in File Explorer, Ctrl+Enter on a file or folder goes, in the same tab, to the folder holding it and selects it (when the file manager set in Settings is File Explorer).
    - 🚀 启动程序的方式改了（#64）：Foxit 曾提示直接启动它的程序没有签名。现在从 Win 顺 打开程序，先交给资源管理器去启动，这样程序看到的是桌面在叫它，应该能避开这个提示。这一点我们这边还没有用 Foxit 验证过，如果你那里还提示，请在 #64 里告诉我们。没有资源管理器时照旧直接启动，“以管理员身份运行”也不变。
      How programs are started (#64): Foxit warned that the program starting it was unsigned. WinShun now hands a program to File Explorer to start, so the program sees the desktop as its caller; that should avoid the warning. We have not checked this with Foxit ourselves, so if it still warns on your PC, please tell us in #64. Without File Explorer it starts programs directly as before, and "Run as administrator" is unchanged.
    - 🔧 其他改进：截图时鼠标移过 VS Code、Chrome、Edge、新版微信，不会再让它们一直开着读屏模式（VS Code 曾因此显示“已针对屏幕阅读器优化”，要重启才好）；截图里能选到 Win 顺 自己的设置等窗口了，放大镜的底框和放大的画面一样宽；设置页搜索能直接找到截图卡片里的选项（比如“中键”“智能打码”）；关掉设置窗口后，内存会及时还回去；滚轮滚动结果和剪贴板列表时，停在整行的边上，不再停在半行；按键提示的外框更简洁；150% 缩放下，边线、分隔线、开关的边都落在整像素上；便携版放在 D:、F: 这类盘上时，“按意思找”等插件不会再报“数据文件夹不能用”，以前因此停下的会自己恢复。
      Other improvements: the capture's hover no longer makes VS Code, Chrome, Edge or the new WeChat switch their screen-reader mode on for good (VS Code used to say "optimized for a screen reader" until restarted); WinShun's own windows, such as the settings, can be picked in a screenshot again, and the magnifier's box is as wide as the magnified picture; the settings search finds options inside the screenshot card (such as "middle click" or "smart redaction"); memory is given back after the settings window closes; wheel scrolling in the results and the clipboard stops on whole rows instead of halfway through one; the frames around key hints are simpler; at 150% scaling, edges, separators and the borders of switches fall on whole pixels; with the portable copy on a drive such as D: or F:, semantic search and other plugins no longer stop with "the data folder can't be used", and ones that stopped this way recover by themselves.
    升级提示 · Upgrading
    升级后，拖文件时晃一晃的圆盘默认是开的，不想要的话在 设置 › 收藏夹 里关。截图插件和不开面板直接粘贴原来是关的，仍然是关的，要用请自己打开；双击仍默认是 Ctrl，想用 Shift 在设置里选。
    After upgrading, the ring for shaking while dragging is on by default; turn it off in Settings › Favorites if you do not want it. The screenshot plugin and pasting without opening the panel were off and stay off until you turn them on; the key pressed twice is still Ctrl, and Shift is a choice in the settings.
