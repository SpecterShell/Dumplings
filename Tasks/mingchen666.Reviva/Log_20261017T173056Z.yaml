  Key: ReleaseNotes
  Value: |-
    v1.4.2 更新
    ✨ 本次更新
    1. 新增输入框思考强度参数控制(关闭/自动/low/medium/high/xhigh/max 等)
    2. 新增 Reviva 自管工具 reviva_manage，开启后可在 Agent 对话中直接帮你查看用量统计、切换主题、管理偏好设置、调整创作工具显示和查看 Agent/技能/MCP 列表等等。
    内置读写白名单、权限分级和写操作限流三重安全机制。全局开关位于「设置 > 偏好设置 > Reviva 应用管控」，默认关闭，需手动开启。
    开启后可尝试以下对话：
    - 「这个月用了多少 token，花了多少钱」
    - 「帮我切换到深色模式」
    - 「把强调色改成紫色」
    - 「现在有哪些 Agent 和已安装的技能」
    - 「把测验创作工具隐藏掉」
    - 「当前应用版本和工作区路径是什么」
    3. 优化一些屎山代码～
    4. 移除 agent 执行命令白名单等，默认启用 agent 执行命令能力
    5. 修复一些小问题
    🚀 主要能力
    - 以 Agent 为核心的本地 AI 学习工作台
    - 支持切换 Agent、共享上下文和自定义 Agent
    - 支持本地文档、文件夹、 Wiki 知识库和外部知识库对话
    - 支持 Office、PDF、图片、URL、音视频等资料处理
    - 支持音视频转录、关键帧提取和媒体内容问答
    - 支持测验、闪卡、思维导图、知识图谱、图表、PPT 和深度研究等创作工具
    - 支持笔记、Wiki 知识沉淀和全局 Agent 记忆
    - 支持自定义模型、OCR、语音输入和数据备份等
    升级前建议先通过 Reviva 的备份功能保存重要数据。
    从旧版本升级时：
    1. 退出正在运行的 Reviva
    2. 建议备份本地数据库和重要资料
    3. 下载并安装 v1.4.2
    4. 启动后检查模型、工作目录和 Agent 配置
    💬 反馈与交流
    感谢所有参与测试、反馈问题和提供建议的用户。
    如果遇到问题，请提交 GitHub Issue
    如需交流合作，可以联系作者。
    Reviva 用户交流群
