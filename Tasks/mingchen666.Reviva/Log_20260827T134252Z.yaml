  Key: ReleaseNotes
  Value: |-
    v1.2.1 版本发布
    ✨ 本次更新
    1. 新增对话工作台侧边栏的 skills 面板显示和隐藏控制，默认隐藏，可在设置里面调整
    2. 优化回收站页面相关 ui
    3. 优化消耗统计页面相关 ui
    4. 新增支持 mac arm 系统安装包，通过 Actions 打包(beta)
    🚀 主要能力
    - 以 Agent 为核心的本地 AI 学习工作台
    - 支持切换 Agent、共享上下文和自定义 Agent
    - 支持本地文档、文件夹和 Wiki 知识库对话
    - 支持 Office、PDF、图片、URL、音视频等资料处理
    - 支持音视频转录、关键帧提取和媒体内容问答
    - 支持测验、闪卡、思维导图、知识图谱、图表、PPT、播客和深度研究
    - 支持笔记、Wiki 知识沉淀和全局 Agent 记忆
    - 支持自定义模型、OCR、语音识别、权限控制和数据备份
    📦 下载安装
    请根据自己的系统和处理器架构下载对应安装包：

    | 平台            | 文件                                 | 下载                      |
    | --------------- | ------------------------------------ | ------------------------- |
    | Windows x64     | Reviva-Windows-1.2.1-x64-Setup.exe   | GitHub Release · 夸克网盘 |
    | Windows ARM64   | Reviva-Windows-1.2.1-arm64-Setup.exe | GitHub Release · 夸克网盘 |
    | macOS Intel x64 | Reviva-Mac-1.2.1-x64-Installer.dmg   | GitHub Release · 夸克网盘 |
    | macOS ARM64     | Reviva-Mac-1.2.1-arm64-Installer.dmg | GitHub Release · 夸克网盘 |

    夸克网盘链接会打开安装包目录，请选择与系统和处理器架构对应的文件。
    完整安装说明请查看项目 README。
    升级前建议先通过 Reviva 的备份功能保存重要数据。
    从旧版本升级时：
    1. 退出正在运行的 Reviva
    2. 建议备份本地数据库和重要资料
    3. 下载并安装 v1.2.1
    4. 启动后检查模型、工作目录和 Agent 配置
