  Value: |-
    v1.5.1 发布
    ✨ 本次更新
    2. 新增化学、数学、物理三个讲解视频技能，支持把题目生成带中文配音和动画的讲解视频，已适配平台并绑定到对应学习助手与教学教研助手，感谢原作者的开源！
    3. 对话列表支持「移动到分组」
    4. 修复新建对话自动归入当前激活会话所在分组。
    升级前建议先通过 Reviva 的备份功能保存重要数据。
    从旧版本升级时：
    1. 退出正在运行的 Reviva
    2. 建议备份本地数据库和重要资料
    3. 下载并安装 v1.5.1
    4. 启动后检查模型、工作目录和 Agent 配置
