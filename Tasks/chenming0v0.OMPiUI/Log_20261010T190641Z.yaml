    - test: 新增正常延迟清理与卡死清理回归；编译产物验收增加真实 OMP runtime 的优雅关闭路径。
    - chore: 全部 workspace、Tauri 与锁文件统一为 0.6.12；0.6.11 保留为预发布，稳定更新以本版本为准。
