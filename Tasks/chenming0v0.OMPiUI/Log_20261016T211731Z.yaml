  Key: ReleaseNotes
  Value: |-
    修复与更新
    - #319：隧道 pong 准入不再把数据面正常背压误判为硬熔断。
    - #320：父会话保留已有子代理消息块缓存，避免同步时退化为整段历史重下。
    - #321、#323：目标附图和异步合并遵守 16 MiB 附件总量限制；省略态图片不再被错误复用为编辑附件。
    - #322：删除排队图片不再与取回编辑共用完整图片响应。
    - #324：终端输入负确认采用退避重试，避免背压期间反复重传同一输入片。
    - #325：终端退出后仍可回放尚未读取的尾部输出。
    - #326：原生 HTTP 客户端对 GET/HEAD 字符串拒绝值正确执行网络重试。
    - #327、#328：Tailnet 网桥的空闲与响应头期限不再中断持续单向下载，或短于 packages 命令预算。
    - 补充 pong、背压、终端输入与回放、附件及 HTTP 客户端回归测试。
