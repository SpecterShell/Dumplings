  Key: ReleaseNotes
  Value: |-
    VS Code
    7.7.9
    Minor Changes
    - #14444 f85f62c - Add Close to the Right to the Agent Manager tab menu. It closes the session, terminal, and review tabs that sit after the target tab and keeps pinned tabs open.
    - #14485 9088b7d - Install Marketplace plugins from a git repository. Plugin catalog entries can now use a git source such as git:github.com/owner/repo@v1.2.3#subdir, so a plugin can be distributed from a public repository without publishing to npm. The client clones the repository at the pinned ref into the plugin cache and loads the plugin from there.
    - #14281 7c59855 - Install plugins from the Kilo Marketplace. The Marketplace now lists plugin items alongside agents, skills, and MCP servers, and installing one adds the npm package to Kilo's plugin configuration for the chosen project or global scope. Removing a plugin item cleans the configuration entry again.
    - #14446 fccda25 - Add pinning and Close to the Right to the sidebar session tabs. Pinned tabs stay at the front and survive Close Others and Close to the Right.
    Patch Changes
    - #14482 ae5cfbc - Show the latest output of long-running terminal commands in chat. Bash output now keeps the end of the stream instead of the start, follows new lines while the command runs, and stops following while you scroll up.
    - #14487 c887e66 - Keep Agent Manager status icons current for sessions in other projects. A session that reconnects after a network drop no longer shows "Error or connection lost.", and completed, failed, waiting, and scheduled states now also update while another project is selected.
    - #14447 390b92c - Show the full arguments of a pending MCP tool call in the permission prompt so they can be inspected before approval, including nested objects and arrays.
    - #13513 3add597 - Adopt OpenCode v1.18.19 through v1.18.20 improvements, including subagent error and permission handling in non-interactive runs, network and stream error retry coverage, Cerebras completion limit handling, Cloudflare AI Gateway support, and TUI reasoning status updates.
    - #14464 b9dc741 - Explain that file checkpoints require Git when a revert cannot restore files. Reverting in a folder that is not a Git repository now shows "File checkpoints require a Git repository" instead of the generic "No file checkpoint was available" notice.
    - #14484 065bc5c - Keep session costs complete after reopening paginated conversations, including nested subagents without counting their parents or siblings.
    - #14486 d52cd88 - Fix messages and tool calls above the last reply sometimes disappearing after switching sessions until the transcript was scrolled.
    - #14361 f27140a - Render streaming shell output faster in the chat transcript by highlighting only the lines that changed since the previous chunk instead of rebuilding the whole output block on every update.
    - Updated dependencies [065bc5c]:
      - @kilocode/sdk@7.7.8
      - @kilocode/kilo-ui@7.7.8
      - @kilocode/plugin@7.7.8
      - @opencode-ai/ui@7.7.8
      - @opencode-ai/core@7.7.8
      - @kilocode/kilo-gateway@7.7.8
      - @kilocode/kilo-indexing@7.7.8
    CLI
    7.7.9
    Minor Changes
    - #14445 1ac7cc1 - Let the agent start or resume a session goal itself with the goal tool. The agent's call arms the goal without cancelling the current turn, then the goal loop continues after that turn. The tool uses the goal permission, which is allowed by default and can be set to ask or deny.
    - #14312 dfeeb48 - Add a monitor action to the background_process tool that streams a long command's output back as it arrives, bounded by a line cap (default 200) and a wall-time cap (default 120000 ms) so a waiting agent reads progress instead of polling logs. Existing background_process actions are unchanged. Add session cron scheduling through cron_create, cron_list, and cron_delete: a recurring 5-field expression or a one-shot time/delay fires the session between turns after it goes idle, missed windows are not replayed, fire times carry deterministic jitter, each task expires seven days after creation, and tasks survive --resume.
    - #14268 f330846 - Add experimental get_context_info and compact tools that let an agent inspect and compact its own context. Reach them with KILO_EXPERIMENTAL=1, or KILO_EXPERIMENTAL_CONTEXT_TOOLS=true.
    - #14485 9088b7d - Install Marketplace plugins from a git repository. Plugin catalog entries can now use a git source such as git:github.com/owner/repo@v1.2.3#subdir, so a plugin can be distributed from a public repository without publishing to npm. The client clones the repository at the pinned ref into the plugin cache and loads the plugin from there.
    - #14281 7c59855 - Install plugins from the Kilo Marketplace. The Marketplace now lists plugin items alongside agents, skills, and MCP servers, and installing one adds the npm package to Kilo's plugin configuration for the chosen project or global scope. Removing a plugin item cleans the configuration entry again.
    Patch Changes
    - #14318 5edf432 - An empty compaction response no longer replaces the conversation; the CLI reports that compaction did not run and lets you retry with /compact.
    - #14315 3fbb454 - Link a session to its pull request reliably, on GitHub, GitLab and Bitbucket. An explicit link (link_pr, kilo pr link, or the app's set-PR-link action) always wins, and a check every 5 minutes asks the session's own git host whether an open pull request exists for its branch. A stale link is cleared when that check finds the pull request no longer open, so the app row updates when the pull request closes.
    - #14492 43f5d55 - Fix git-hosted Marketplace plugins so ~/ repository paths resolve, a failed clone leaves no staging directory, and POSIX paths that contain a backslash are preserved. The plugin install dialog no longer describes every plugin as an npm plugin.
    - #14196 49df20f - Fix kilo mcp auth failing at the last step when another Kilo process touches the same MCP server while the browser tab is open: the OAuth flow now keeps its own state and PKCE verifier instead of reading them back from the process-shared mcp-auth.json, and every remaining failure names the step that failed (the token exchange, the browser authorization, a timeout, or a superseded authorization attempt). Running kilo mcp auth for the same server at the same time in two terminals now works too: the newer attempt takes the local callback listener over, the later browser tab completes, and the earlier command reports that it was replaced.
    - #13513 3add597 - Adopt OpenCode v1.18.19 through v1.18.20 improvements, including subagent error and permission handling in non-interactive runs, network and stream error retry coverage, Cerebras completion limit handling, Cloudflare AI Gateway support, and TUI reasoning status updates.
    - #14448 9340d34 - Fix provider initialization failing with an HTTP 500 when enabled_providers excludes Kilo while a Kilo login is stored. Excluded providers are now skipped before their auth loader runs.
    - #14464 b9dc741 - Explain that file checkpoints require Git when a revert cannot restore files. Reverting in a folder that is not a Git repository now shows "File checkpoints require a Git repository" instead of the generic "No file checkpoint was available" notice.
    - #14484 065bc5c - Keep session costs complete after reopening paginated conversations, including nested subagents without counting their parents or siblings.
    - Updated dependencies [065bc5c]:
      - @kilocode/sdk@7.7.8
      - @kilocode/plugin@7.7.8
      - @opencode-ai/tui@7.7.8
      - @opencode-ai/ui@7.7.8
