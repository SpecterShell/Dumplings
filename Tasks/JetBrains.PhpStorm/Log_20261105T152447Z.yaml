  Key: ReleaseNotes
  Value: |-
    PhpStorm 2026.3 is now available!
    The highlights of this update include:

    - JetBrains Air: a central workspace to run your agents and review their changes.
    - PHP 8.6 support.
    - Git worktrees: easier PR/MR reviews and switching between tasks.
    - Quick tasks and edits without opening a project.
    - Fixes in UI freezes and automatic error and freeze reporting.
    Explore the full list of the new features on our What's New page.
    The full list of changes in PhpStorm 2026.3 is available in the release notes.

