    Features
    - app: 悬浮窗支持按前台应用黑白名单显隐 (2660e9b)

    Downloads
    macOS
    macOS 12 or later. Desktop widgets are included and require macOS 14 or later.

    | Architecture             | Download  |
    | ------------------------ | --------- |
    | Apple Silicon (M series) | DMG · ZIP |
    | Intel                    | DMG · ZIP |

    The app is ad-hoc signed and not notarized. Prefer the .dmg for manual install; if macOS cannot verify the developer, right-click Quosparr.app and choose Open, or click Open Anyway in System Settings → Privacy & Security. If macOS says the app is damaged, move it to Applications and run:
    xattr -dr com.apple.quarantine /Applications/Quosparr.app
    Windows
    Windows 10 or 11.

    | Architecture | Download                       |
    | ------------ | ------------------------------ |
    | x64          | Installer · Portable (.tar.gz) |
    | ARM64        | Installer · Portable (.tar.gz) |

    The installer installs for the current user into %LOCALAPPDATA%\Programs\Quosparr and supports in-app updates; no administrator rights needed. The portable build needs no installation: extract it and run Quosparr.exe from any folder you can write to.
    Linux
    Needs GTK3, AppIndicator, a desktop with a system tray, and a Secret Service session such as GNOME Keyring or KWallet.

    | Architecture | Download       |
    | ------------ | -------------- |
    | x64 (amd64)  | .deb · .tar.gz |
    | ARM64        | .deb · .tar.gz |

    Install the .deb with your package manager, or put install.sh next to the .tar.gz and run sh install.sh to install into ~/.local.
    Verify downloads with SHA256SUMS.
