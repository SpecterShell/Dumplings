    - settings: 外观与菜单新增显示字体，可选默认或本机已安装字体 (d80d493)
    - website: 主面板截图换为新版，中文用 1.webp、其他语言用 1-en.webp (15ebbb4)
    - website: 站点字体优先使用思源宋体与各系统宋体、明朝体 (0bc6657)
    - website: 分享图改为七语言各一张，使用思源宋体排入名称由来与简介 (f168bd2)
    - website: 新增 quosparr.com 七语言官网并经 GitHub Pages 自动部署 (1895f35)
    These builds are ad-hoc signed and not notarized. Prefer the .dmg download for manual install; if macOS blocks the app, use right-click Open or Privacy & Security > Open Anyway.
    Desktop widgets are included and require macOS 14 or later.
    Windows installers support per-user updates; Linux archives support user-directory installs and Debian packages use the system package manager.
