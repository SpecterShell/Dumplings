Version: 2026.0.3
Installer: []
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    1. Added Slot Feature.
    2. Added an along-axis creation method for sections.
    3. Added support for re-editing selected measurement objects during section measurement.
    4. Added RPS Alignment.
    5. Added Manual Alignment.
    6. Added Local Alignment.
    7. Added Coordinate System Alignment.
    8. Added Datum Alignment.
    9. Added Local Deviation measurement.
    10. Added the Create from Auxiliary Object mode for Plane features.
    11. Added a one-click option to simplify label display.
    12. Added support for exporting reports in CSV format.
    13. Added support for organizing point deviations into groups and configuring the deviation display direction.
    14. Enhanced the Deviation Map editor with expanded parameter configuration options.
    15. Improved line rendering when creating features from CAD.
    16. Added drag-and-drop import support for scan and reference models.
    17. Added support for configuring which measurement data is displayed for each feature.
    18. Fixed several known issues.
    19. Optimizes user experience for certain features.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    1. 新增槽特征
    2. 创建截面新增沿轴创建方式
    3. 支持截面测量时对已选中测量对象二次编辑
    4. 新增 RPS 对齐功能
    5. 新增手动对齐功能
    6. 新增局部对齐功能
    7. 新增对齐到坐标系功能
    8. 新增基准对齐功能
    9. 新增测量局部偏差功能
    10. 平面特征新增从辅助对象创建模式
    11. 新增一键精简标签功能
    12. 支持导出 CSV 格式的报告
    13. 支持点偏差中创建分组，设置点偏差显示方向
    14. 优化色谱图编辑功能，支持更丰富的参数设置
    15. 优化 CAD 创建特征时线条显示效果
    16. 支持拖拽导入扫描、参考模型
    17. 支持设置特征测量项显示内容
    18. 修复了一些已知问题
    19. 优化了部分功能的用户体验
