    TiLex 0.2.2
    相比 0.2.1 的改动。直接运行新安装包升级即可，设置和生词本会保留。
    新增
    - 设置窗口快捷键：在「翻译」页截图翻译快捷键下方新增一项，按一次打开设置窗口，再按一次关闭。默认留空。
    - AI 翻译不再思考：所有 AI 请求默认关闭模型的思考过程，必须思考的模型用最低档，响应更快。服务端不接受时自动降一档重试，并记住可用的档位。
    - 生词本搜索高亮：搜索词在列表和详情里都会高亮显示。
    修复与改进
    - 结果窗口
      - 滚动条换成细滑块，悬停不再展开，不会挡住收藏按钮。
      - 服务标题在滚动时固定在顶部。
      - 未命名的服务显示默认名称，不再显示内部 id。
      - 窗口置顶时，新的翻译在原位置刷新，不再跳动。
    - 设置窗口
      - 各页卡片随窗口放大而变宽。
      - 最小尺寸为 800×600。
      - 已在运行时再次启动 TiLex，设置窗口能稳定弹到最前面。
    - 生词本：详情滑块贴近卡片右边，内容区更宽。输入框聚焦时改用浅色描边。
    - 图标：DeepL 图标按比例显示。腾讯交互翻译换成高清图标。

    TiLex 0.2.2 (English)
    Changes since 0.2.1. Run the new installer to upgrade. Your settings and wordbook are kept.
    New
    - Settings window hotkey: A new entry under the screenshot hotkey on the Translate page. Press it once to open the settings window, and again to close it. Empty by default.
    - No thinking for AI translation: All AI requests turn off the model's thinking by default, or use the lowest level for models that must think, so replies come faster. If a server rejects a level, TiLex retries one level lower and remembers the level that works.
    - Wordbook search highlight: Search terms are highlighted in both the list and the detail view.
    Fixes & Improvements
    - Result window
      - The scrollbar is now a thin thumb. It no longer expands on hover or covers the favorite button.
      - Service headers stay at the top while scrolling.
      - Unnamed services show a default name instead of an internal id.
      - When the window is pinned, a new translation refreshes in place instead of moving the window.
    - Settings window
      - Page cards widen as the window grows.
      - The minimum size is 800×600.
      - Launching TiLex again while it is running now reliably brings the settings window to the front.
    - Wordbook: The detail scroll thumb sits closer to the card edge, giving the content more room. Input fields now use a light border when focused.
    - Icons: The DeepL icon keeps its proportions. Transmart has a new high-resolution icon.
