  Key: ReleaseNotes
  Value: |-
    New
    - Gemini API Platform presets. Gemini providers now have an API Platform selector:
      - Google AI Studio fills in https://generativelanguage.googleapis.com/v1beta.
      - Vertex AI fills in https://aiplatform.googleapis.com/v1/publishers/google.
      - Any other address is shown as Custom.
      - When you edit a provider that has a saved key or custom headers, the selector is locked, so a relay's key is never sent to Google hosts.
      - With Vertex AI Express Mode, which has no model list, model discovery now tells you to add Gemini model IDs manually.
      (#1412, via #1416)
    Improved
    - Gemini 4 keeps the xhigh thinking level. Saving a Gemini provider no longer lowers xhigh to high. Models that support it, such as gemini-4-neon and gemini-4-hydrogen, now get XHIGH; other models are still capped at high. (#1412, via #1416)
    - Saved API keys stay masked. An unedited saved key always shows the same 8 dots, including after you reveal it and hide it again. Before, it showed 7 dots on open and the real key length after a reveal. Saving still never replaces an ${ENV_VAR} reference with its value. (#1411, via #1416)
    - Bundled K-brain is now v0.107.46. This release fixes three Gemini issues:
      - Gemini 3/4 now send thinkingLevel with uppercase levels. This fixes the "Thinking budget is not supported" 400 on Gemini 4.
      - Vertex AI /publishers/google base URLs, and base URLs that end in /models, are no longer double-prefixed.
      - Native JSON-array streams are parsed.
      Thanks to @Is14w. (#1413, via #1414)
    Quality
    - API key row moved into its own component. This reduces ProviderModalView.tsx from 2,088 to 2,015 lines; the file-size budget is lowered to match. (#1416)
    - New tests: the saved-key mask round trip, Gemini platform detection and lock, the Vertex AI Express discovery message, and saving xhigh. (#1416)
