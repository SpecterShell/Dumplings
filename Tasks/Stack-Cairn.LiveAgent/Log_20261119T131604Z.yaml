  Key: ReleaseNotes
  Value: |-
    Changes
    - Bundled K-brain updated to v0.107.38 (#1355)
      - Auto-compaction no longer fires far below its threshold. The default threshold is now 90%, adjustable from 10% to 95%. (Stack-Cairn/K-brain#216)
      - Context usage in the footer and in the compaction checks now uses the same measure: the provider-reported prompt tokens plus an estimate of newer messages.
      - When the full output limit no longer fits, the request's output limit shrinks to the remaining room instead of compacting early.
