  Value: |-
    LiveAgent v1.2.4
    LiveAgent v1.2.4 improves chat reliability, provider configuration, workspace-level Skills/MCP setup, and shared GUI/WebUI polish.
    Overview
    This release focuses on smoother day-to-day chat usage, richer provider and workspace configuration, and a more consistent interface across desktop GUI and WebUI. It also includes several chat/composer fixes, DeepSeek provider corrections, platform build improvements, and repository automation updates.
    Highlights
    - Reliable desktop chat ingress mirror with CHAT_INGRESS_V1 support. (#313 by @su-fen)
    - Per-tool execution approval gate and streamlined tool settings. (#329 by @yyg-max)
    - Workspace-level Skills and MCP configuration. (#317 by @NotToday1024)
    - Provider auto-failover for the same vendor and model. (#385 by @coder-hhx)
    - Shared GUI/WebUI interface refactor. (#399 by @yyg-max)
    - First-time contributors in this release: @Islatri, @FlowerRealm, @ISO-N, @xiaYuTian11, and @Is14w.
    Added
    - Custom request header import for providers, later moved into its own import view. (#316 by @AlphaCatMeow, #319 by @su-fen)
    - Direct provider editing entry from the model selector. (#330 by @hopingmiao)
    - AGENTS global skills import support. (#372 by @ISO-N)
    - MCP configuration metadata for descriptions and documentation links. (#400 by @su-fen)
    - Task progress indicator for the current chat session. (#345 by @AlphaCatMeow)
    - Distinct sidebar styling for pinned workspaces and conversations. (#395 by @su-fen)
    - Improved system settings UI with a shared Switch component. (#394 by @Loosand)
    Changed
    - Chat transcript handling now uses block-level transcript units and windowed history. (#318 by @su-fen)
    - Built-in CLI identity user-agent was removed. (#351 by @FlowerRealm)
    - README API relay service information and LLM tech-stack dependency notes were updated. (#368, #373 by @FlowerRealm)
    - Shared interface translation keys were completed for GUI/WebUI parity. (#401 by @su-fen)
    Fixed
    - Queued prompts now resume correctly after stopping. (#314 by @su-fen)
    - Git review action menu positioning no longer drifts. (#322 by @su-fen)
    - Cross-platform chat file links open correctly. (#321 by @AlphaCatMeow)
    - Custom provider header values are shown in plaintext. (#331 by @AlphaCatMeow)
    - Ask-user-question tool startup race was fixed. (#327 by @AlphaCatMeow)
    - Composer text leak below the input card is covered with background. (#363 by @FlowerRealm)
    - Sidebar remains visible with the workspace editor. (#312 by @Mieluoxxx)
    - DeepSeek provider request format is respected, and max thinking level maps to max instead of high. (#370 by @ISO-N, #360 by @xiaYuTian11)
    - Pasted user message newlines are preserved. (#353 by @AlphaCatMeow)
    - Live transcript activity, transcript scrolling, and thinking collapse behavior were stabilized. (#350 by @AlphaCatMeow, #406 by @su-fen)
    - IME composition end Enter tail window was reduced from 80ms to 20ms. (#387 by @Is14w)
    - Structured tags are preserved across copy, cut, and paste in the composer. (#398 by @su-fen)
    - skill:// files under the Skills directory can be opened from the workspace. (#407 by @su-fen)
    - Desktop settings sync page Logo display was fixed in WebUI. (#412 by @su-fen)
    - rquickjs now enables the bindgen feature for aarch64 platform compilation. (#301 by @Islatri)
    Internal
    - Background stdio timing tests for Tauri were stabilized. (#328 by @su-fen)
    - GitHub governance automation, stale workflow, and draft conversion handling were updated. (#340, #347 by @yyg-max)
    - Daily chart SVG updates now target the chart-assets branch instead of main. (#341 by @yyg-max)
    - Model catalog refresh automation was added. (#411 by @yyg-max)
    - Issue templates, pull request template, contributing guide, and PR governance workflow were added.
    - Full changelog: https://github.com/Stack-Cairn/LiveAgent/compare/v1.2.3...v1.2.4
