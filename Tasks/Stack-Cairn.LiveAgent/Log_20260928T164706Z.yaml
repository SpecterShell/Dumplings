  Key: ReleaseNotes
  Value: |-
    LiveAgent v1.3.7
    A polish-and-correctness release that fixes macOS fullscreen layout, restores split-pane drafts, and keeps model/thinking settings per conversation.
    Overview
    This release focuses on GUI layout fixes across platforms, per-conversation model and thinking configuration, and provider-level thinking-level accuracy. It also includes a refreshed model catalog.
    Highlights
    - macOS native fullscreen no longer stretches the top bar based on traffic-light button geometry.
    - Switching focus between split panes restores the input draft that had been cleared in the original pane.
    - Model and thinking settings are now saved independently per conversation, with cross-client sync fixed.
    - Windows title bar window controls got a styling pass, and the boot screen now uses the main UI theme tokens.
    Fixed
    - Providers: Gemini 3.1 Pro no longer collapses from the medium tier to HIGH; tier folding is narrowed to the 3.0 generation. (#851, @coder-hhx)
    - GUI: Optimized the Windows title bar window control button styling. (#855, @AlphaCatMeow)
    - GUI: Boot screen colors now match the main UI theme tokens. (#861, @AlphaCatMeow)
    - GUI: macOS native fullscreen no longer blows out the top bar based on traffic-light geometry. (#865, @yovinchen)
    - Chat: Model and thinking configuration is saved per conversation, and cross-client sync is fixed. (#863, @coder-hhx)
    - Workbench: Switching split-pane focus now restores the original pane's cleared input draft. (#874, @yovinchen)
    Changed
    - Refreshed the model catalog. (#853, @github-actions[bot])
    Internal
    - Added and updated test coverage for conversation thinking, pane composer send/draft behavior, workbench window sessions, model thinking consistency, thinking levels, and settings normalization across agent-gui and agent-gateway.
    - Touched shared settings types/normalization and theme tokens in agent-ui, plus GUI layout components and Tauri app command code.
    - 36 files changed (1,100 insertions, 182 deletions).
    Full Changelog: https://github.com/Stack-Cairn/LiveAgent/compare/v1.3.6...v1.3.7
