  Key: ReleaseNotes
  Value: |-
    What's new
    Textus 1.4.5 fixes PDF export, Select All and selecting into tables on the Mac, input methods in code blocks, the font list and the tools over code blocks and tables, and follows the system's proxy by default.
    Improved
    - Follows the system's proxy by default (Settings › General › Network), so plugins, themes and updates install behind a proxy without setting one up; the proxy setting moved there from Textus AI's page, where it was hidden with the AI turned off, and None (direct) still goes straight out.
    - Moves a picture in the viewer with two fingers on a trackpad and zooms it with a pinch or the mouse wheel; a zoomed or dragged picture always keeps part of itself in the window.
    Fixed
    - Exports to PDF a document with pictures further down: the export waited for pictures that load only as they come near, and never finished.
    - Prints PDF exports on the Mac at the usual size: text came out about a third larger than on Windows, so a long document took far more pages.
    - Shows the highlight of Select All on the Mac in a document that starts with a heading or starts or ends with a table; it selected everything but showed nothing.
    - Keeps a selection dragged or Shift-extended from text into a table; it was pulled back to the paragraph it began in.
    - Keeps pinyin and other input methods' text in an empty code block on the Mac; it piled up as "nnini hni hao" and never reached the document.
    - Lists every installed font in Settings' text font list, Latin fonts included when Textus is in Chinese, Japanese or Korean, and shows Chinese, Japanese and Korean fonts by their own names too (微软雅黑 Microsoft YaHei).
    - Puts a code block's language, Copy and Select All above the block, as a table's tools are, so they no longer cover the first line or stop a drag selection.
    - Keeps a table's tools shown while the pointer moves up to them.
    - Opens a picture in the viewer centred and fitted to the window, not empty until a double-click.
    - Leaves the caret and the headings' fold arrows out of exports, where the caret showed as a dark bar over the text, and exports folded sections in full.
    - Keeps a plugin's underlines and the problem count in the corner when the plugin is slow to answer for a moment, as after picking a problem from the count's list; they used to vanish until the next edit or scroll.
    - Draws the caret beside a picture as tall as the picture.
