Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Security fixes
    - GHSA-8wmh-xr5f-qvj7: reject unsolicited agent-forwarding channels when agent forwarding is disabled — a malicious or compromised SSH server could otherwise reach the local SSH agent unsolicited in https://github.com/Eugeny/tabby/commit/b091dc51
    Changes
    - Allow per-profile custom SSH $TERM by @H-TTTTT in https://github.com/Eugeny/tabby/pull/11480
    - Add insert-new-line hotkey by @justtal in https://github.com/Eugeny/tabby/pull/11346
    - Add searchable vault feature for saved connections by @xhatt in https://github.com/Eugeny/tabby/pull/11121
    - Add long-press repeat for Enter key and retain search queries by @bluekani in https://github.com/Eugeny/tabby/pull/11389
    - Add Hotkey to toggle Option/Meta key on Mac based Systems by @theredcmdcraft in https://github.com/Eugeny/tabby/pull/11385
    - Added basic MRU tab switching #9961 by @aparfenov2 in https://github.com/Eugeny/tabby/pull/11311
    Fixes
    - fix(core): save tab recovery state before disabling it on close by @uadhran in https://github.com/Eugeny/tabby/pull/11621
    - fix(ssh): parse X11 display specs without a screen number by @uadhran in https://github.com/Eugeny/tabby/pull/11620
    - fix: do not hide docked window while a native dialog is open by @uadhran in https://github.com/Eugeny/tabby/pull/11622
    - fix: show persistent activity indicator on background tab when bell fires by @uadhran in https://github.com/Eugeny/tabby/pull/11292
    - fix(terminal): reset terminal modes on connectable session destroy by @uadhran in https://github.com/Eugeny/tabby/pull/11423
    - fix(cli): CLI subcommands crash in v1.0.235 by @bluekani in https://github.com/Eugeny/tabby/pull/11513
    - Default value of host changed from null to empty string by @ianaflous in https://github.com/Eugeny/tabby/pull/11558
    - fix(ssh): import hosts without explicit HostName by @VALLIS-NERIA in https://github.com/Eugeny/tabby/pull/11598
    - Fix Sogou IME commit when pressing Shift on Windows by @hymsk in https://github.com/Eugeny/tabby/pull/11650
    - Fix Windows-only plugin install failures via broken postinstall/prepare scripts by @Blauschirm in https://github.com/Eugeny/tabby/pull/11525
    - fix(local): only accept directories as the session CWD by @werner-balonius in https://github.com/Eugeny/tabby/pull/11592
    - fix(ssh): try agent auth before disk publickey for imported profiles by @uadhran in https://github.com/Eugeny/tabby/pull/11357
    - Fix window title not syncing with renamed tabs by @H-TTTTT in https://github.com/Eugeny/tabby/pull/11494
    - Flash taskbar/dock icon when the terminal bell rings by @Yahiro025 in https://github.com/Eugeny/tabby/pull/11651
    - fix(electron): guard window opacity and traffic-light IPC against closed windows by @fxd0h in https://github.com/Eugeny/tabby/pull/11524
    - fix: add output encoding in releaseNotesTab.component.ts by @anupamme in https://github.com/Eugeny/tabby/pull/11535
    - fix(build): remove unused dependencies and deprecated webpack loaders by @bluekani in https://github.com/Eugeny/tabby/pull/11386
    - fix(ssh): surface SFTP upload errors by @chill-DA in https://github.com/Eugeny/tabby/pull/11640
    - fix(terminal): fix Clear terminal hotkey action in PowerShell and Clink by @bluekani in https://github.com/Eugeny/tabby/pull/11405
    - fix: release terminal resources on close by @nbb2025 in https://github.com/Eugeny/tabby/pull/11586
    - fix(local): resolve guest cwd against the shell's fsBase before validating by @vjandrea in https://github.com/Eugeny/tabby/pull/11625
    - fix(serial): fix serial quickConnect not working by @bluekani in https://github.com/Eugeny/tabby/pull/11384
    - fix(terminal): refresh profile defaults on reconnect #9834 by @AngKernel in https://github.com/Eugeny/tabby/pull/11486
    - feat(ssh): option to reopen duplicated/restored tabs in the last working directory by @singhible in https://github.com/Eugeny/tabby/pull/11502
    - fix: avoid unnecessary GPU initialization on startup by @chvrs12 in https://github.com/Eugeny/tabby/pull/11673
    - fix: make local file links clickable by @xnne-bot in https://github.com/Eugeny/tabby/pull/11666
    - fix: invalid version fallback in pluginManager.service.ts by @anupamme in https://github.com/Eugeny/tabby/pull/11675
    - fix(terminal): allow Fcitx5 to handle punctuation by @jairw955 in https://github.com/Eugeny/tabby/pull/11500
    - Fix WSL sessions not starting in home directory on newer Windows builds by @sykuang in https://github.com/Eugeny/tabby/pull/11663
    - Fix PowerShell 7 (pwsh) detection for Microsoft Store/MSIX installs by @sykuang in https://github.com/Eugeny/tabby/pull/11654
    - fix(UAC): fix "Unknown verb -- 'inject '" error in CMD(clink) by @bluekani in https://github.com/Eugeny/tabby/pull/11367
    - fix profile proxy usage by @Eugeny in https://github.com/Eugeny/tabby/commit/4d01477a
