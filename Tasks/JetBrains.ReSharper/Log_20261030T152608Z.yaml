  Key: ReleaseNotes
  Value: |-
    ReSharper 2026.2.4 is here!
    Fix for compromised eMudhra certificates
    This build fixes a vulnerability caused by the compromise of eight eMudhra intermediate certificates. An attacker who can intercept your network traffic can use these certificates to impersonate websites and services.
    Install this update as soon as possible so that ReSharper stops trusting connections that rely on the compromised certificates.
    Learn more.
    Notable fixes:
    - Resolved an installation failure that happened when ReSharper C++ was selected because the path was too long (RSRP-504745).
    - Resolved one more memory leak issue (RSRP-504269).
    - Fixed an issue where auto-detected license server settings were not preserved after upgrading (RSRP-504375).
    For the full list of updates included in this release, see the release notes.
