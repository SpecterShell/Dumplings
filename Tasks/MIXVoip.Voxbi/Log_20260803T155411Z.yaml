  Key: ReleaseNotes
  Value: |-
    New Features
    - External call detection - detect when another app uses your microphone and offer to mark you as in a call
    - Keyboard shortcuts - replacing internal implementation
    - The application theme can be changed from the main Window -> Settings -> Advanced -> Themes

    Enhancements
    - Updated desktop application icons
    - Updated desktop application theme
