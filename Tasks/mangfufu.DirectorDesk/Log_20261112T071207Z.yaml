  Key: ReleaseNotes
  Value: |-
    更新内容
    - 新增 Blender 工程导入，支持布景、摄影机、灯光和动画，默认导入为独立戏段。
    - 优化复杂场景的移动、转视角、时间轴与播放响应；停止操作后恢复完整预览。
    - 简易识别随软件内置，可离线使用，无需额外安装。
    - 新增 FlowHMR 人物动作识别，支持固定或移动镜头，显示识别耗时与进度。
    - 改进视频反推的文件管理、识别方式选择与存储清理。
    - 首次启动跟随系统语言，非中文环境默认英文，保留手动选择。
    - 改善大型工程的保存与导入稳定性，同步更新 MCP 和配套 Skill。
    下载
    - Windows：Setup 安装包，或 Portable 便携 ZIP。
    - Linux x64：AppImage，或 tar.gz。
    - Skill：独立 ZIP，可用于外部 AI Agent。
    Blender 工程导入需要本机已安装 Blender 4.2 或更新版本。FlowHMR 为可选下载，人体文件需按官方许可另行获取；简易识别无需下载这些文件。
