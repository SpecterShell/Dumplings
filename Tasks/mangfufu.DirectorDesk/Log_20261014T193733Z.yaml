  Key: ReleaseNotes
  Value: |-
    本版更新
    - 中英文切换：在“编辑 → 设置 → 语言”选择中文或 English，自动记住选择；支持英文搜索模型与动作。
    - 动作库拖放：左侧新增动作库，内置动作与个人收藏可直接拖入人物轨道。
    - 时间轴插入：动作和路径片段可放到其他片段前后或两段之间，需要时自动后移后续片段；支持多选一起移动。
    - 拖动预览：片段跟随鼠标，半透明落点显示松手后的位置，改进边界吸附和自动滚动。
    - 右键菜单：时间轴可调整时长、在播放头处分割、删除片段或交给 AI；画布可定位、复制和隐藏对象。右键拖动仍用于平移。
    - 操作响应：改善动作添加与拖动的流畅度，动作添加完成后可立即点击播放。
    - 新增英文 README，更新中英文使用说明。
    Downloads
    - DirectorDesk-Setup-0.5.0.exe — Windows x64 installer / 安装版
    - DirectorDesk-Portable-0.5.0-win-x64.zip — Windows x64 portable edition / 免安装版，完整解压后运行 DirectorDesk.exe
    - director-desk-skill-0.5.0.zip — Agent skill / 配套技能，两种软件包均已内置
    - SHA256SUMS-0.5.0.txt — File checksums / 文件校验
    What’s new
    - Switch between English and Chinese in Edit → Settings → Language. Search models and actions in English.
    - Drag built-in or saved actions from the new Actions tab onto character tracks.
    - Insert action and path clips before, after, or between other clips. Later clips shift when needed to make room. Multi-selection is supported.
    - See a floating clip and a translucent landing preview while dragging, with improved edge snapping and timeline scrolling.
    - Right-click clips to edit timing, split at the playhead, delete, or ask AI to edit the selection. Right-click stage objects to frame, duplicate, or hide them. Right-drag still pans the stage view.
    - Smoother action placement and timeline dragging. Click Play as soon as an action finishes loading.
    - New English README and updated usage instructions.
