  Key: ReleaseNotes
  Value: |-
    本版更新
    - 新增 Linux x64 版，提供 AppImage 与 tar.gz。
    - Linux AppImage 支持在软件内下载更新并重启应用。
    - 修复 WSL 中拖动时间轴时，播放头和画面只在松手后更新的问题。
    - 改进部分 AI 渠道异常工具调用的处理，避免影响后续对话。
    下载
    - DirectorDesk-Setup-0.5.1.exe：Windows x64 安装版。
    - DirectorDesk-Portable-0.5.1-win-x64.zip：Windows x64 免安装版，完整解压后运行 DirectorDesk.exe。
    - DirectorDesk-0.5.1-linux-x64.AppImage：Linux x64，添加执行权限后运行，支持应用内更新。请保存在用户可写目录。
    - DirectorDesk-0.5.1-linux-x64.tar.gz：Linux x64，解压后运行 DirectorDesk，手动更新。
    - director-desk-skill-0.5.1.zip：独立 Skill，以上软件包均已内置。
    - SHA256SUMS-0.5.1.txt、SHA256SUMS-0.5.1-linux-x64.txt：文件校验。
    Linux 版已在 Ubuntu 24.04 / WSL 2 验证；尚未覆盖所有发行版。保存 AI 密钥和 MCP 凭据需要可用的桌面密钥环。
    What’s new
    - Linux x64 packages are now available as AppImage and tar.gz.
    - AppImage supports downloading updates in the app and restarting to apply them.
    - Fixed timeline scrubbing in WSL that could leave the playhead and preview unchanged until the mouse was released.
    - Improved handling of malformed AI tool calls so they do not disrupt subsequent conversation turns.
    Windows installer and Linux AppImage editions support in-app updates. ZIP and tar.gz editions are updated manually. All packages include the agent skill. Linux has been tested on Ubuntu 24.04 under WSL 2; other distributions have not all been verified. A desktop keyring is required to save AI keys and MCP credentials.
