  Key: ReleaseNotes
  Value: |-
    本次更新
    - 新增简易识别，默认使用，无需独立显卡，模型下载约 21 MB。
    - 从视频提取人物动作，支持更换人物外形、裁剪和调整动作速度。
    - 标准识别可按需下载，提供设备要求、模型来源和许可确认。
    - 视频反推设置改为下拉选择，显示已安装状态及对应模型信息。
    - 同步更新 MCP 和配套 Skill。
    简易识别适合提取人物动作，走位为近似结果，不还原场景或原摄影机；多人遮挡时可能漏检或拆成人物片段。
    简易识别基于 Google MediaPipe；标准识别基于 Human3R，需 NVIDIA 显卡，模型仅限非商业使用，商用需另行取得授权。
    提供 Windows 安装版、免安装版、Linux AppImage 与 tar.gz，以及独立 Skill 包。
