  Key: ReleaseNotes
  Value: |-
    FocusPocus 2.2.0 moves the resident engine to Rust while retaining the native WinUI 3 settings interface.
    - Native Rust engine with Direct2D/DirectComposition graphics, dedicated input hooks and event-driven updates.
    - One Rust installer with .NET and Windows App SDK runtimes included. No Inno Setup or administrator account is required.
    - Rust uninstaller, per-user installation, and preservation of existing settings.
    - Shared settings locking and field-level merging to preserve concurrent edits.
    - Organized Rust workspace, shared assets, build scripts and bilingual documentation; retired WPF code and obsolete files removed.
    Download FocusPocus-Setup-2.2.0.exe and run it. The accompanying SHA-256 file lets you verify the download.
    Validation includes Rust and C# tests, static analysis, Windows builds, GPU diagnostics, and isolated install/upgrade/uninstall checks. Manual visual review and physical testing across mixed-DPI monitors remain pending.
    Full changelog: https://github.com/ezenwa/FocusPocus/compare/v2.1.1...v2.2.0
