  Key: ReleaseNotes
  Value: |-
    This release of Supermium incorporates the latest upstream patches and security fixes, as well as:
    - A fix for the "scs" file-controlled layout constants. They should now be customizable again.
    - A fix for a crash when accessing various websites, including some bank login pages on Windows XP.
    Several users reported various other crashes on different environments, but none were reproducible. Any crash details should include (on Windows Vista and above) crash dumps corresponding to the time of the crash, which will usually be located in %LOCALAPPDATA%\Supermium\User Data\Crashpad\reports. If you do not want the data to be viewable publicly, send the dumps to admin@win32subsystem.live.
    As for users experiencing widespread Cloudflare Turnstile failures ("Verify if you're human" prompts), please try adjusting your DNS server to 1.1.1.1, 8.8.8.8 or any other alternative you may want to use.
