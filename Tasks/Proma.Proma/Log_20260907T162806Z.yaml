  Value: |-
    Proma v0.19.37 更新
    新功能
    - GitHub Copilot 订阅登录 — 渠道设置新增 GitHub Copilot 订阅类型，通过 device-code OAuth 授权本机登录，也支持填写 GitHub Enterprise 地址；登录成功后自动拉取当前账号与组织策略允许的模型目录，空列表同样作为权威结果处理，不会沿用上一个账号的旧模型导致选择器出现无法调用的选项。凭据加密保存并自动续签，Token 过期后无需手动重复授权。
    - 计划审批时预览计划文档 — Agent 在计划模式提交审批时，可在确认横幅中打开当前会话 plan/ 目录内的 Markdown 计划文件并在右侧只读预览，确认前先完整过目计划内容再决定接受或修改。计划文档必须是该目录下的真实常规文件（大小不超过 1 MB，经 realpath 归一化与符号链接校验），防止审批内容被文件替换或链接跳转绕过初始检查；计划模式下的 Markdown 写入同样强制限定在当前会话 plan/ 目录，相对路径一律拒绝，避免写操作逃逸到项目或用户文件。
    - Agent 可跨工作区创建定时任务 — 定时任务创建时支持 Agent 先查询可用工作区再绑定到指定工作区运行，适合需要跨项目落地的无人值守任务；省略目标时仍默认落在当前工作区，原有行为保持不变。
    - 项目区块一键折叠 — 侧栏「项目」标题栏新增折叠按钮，可一键收起当前显示的全部项目组（含自动任务合成组）；全部已折叠时按钮自动禁用，避免无效点击，单个项目的手动展开与折叠不受影响。
    Bug 修复
    - Markdown 预览查找交互恢复 — 重构 Markdown 预览与编辑器内的查找条：输入时即时高亮匹配项并显示数量，支持切换上一个 / 下一个与一键清除高亮，编辑内容变化时匹配结果同步更新，长文档或频繁编辑场景下不再丢失焦点或停留在过期结果。
    - Skills 刷新保留编辑器与资源状态 — 技能详情与资源面板在目录刷新后保留正在编辑的文件与已加载的资源视图，不再因刷新把正在编辑的内容重置；技能文件写入路径继续按会话工作区校验，改名与重载行为保持一致。
    - Vault 支持正文双链显示与跳转 — Vault 笔记正文中的 [[笔记名]] 双链以可读 chip 形式展示，点击即可跳转到对应笔记；目标笔记缺失或路径过期时自动刷新 Vault 文件树后重新解析，双链的外观与选中态一并打磨。
    - Slack 会话命名与计划审批对齐桌面体验 — Slack 会话首条消息不再以「频道 ID + thread 时间戳」作为长期标题，改走与桌面端一致的自动命名流程；外部（Slack）触发的计划模式不再向桌面输入框注入「接受计划」残留草稿——Slack 渠道自身的审批交互保持不变；设置页补充了从零创建 Slack App 的引导提示。
    - Vault 标题回车后直接进入正文编辑 — 在笔记标题输入框按回车提交后，光标直接落入正文首行，保留输入法与异步提交保护；独立识别 YAML 与正文边界，修复快速切换笔记时刷新接管读取、加载态迟迟不结束的竞态。
    - 本地 Markdown 相对引用可解析预览 — 预览面板对本地 Markdown 中的文件引用（相对路径、文件名片段、绝对路径）按候选根安全解析后打开，不再扫描 home 目录或全盘查找同名文件；文件路径 chip 与预览跳转统一使用新的解析规则，路径越界时明确提示不可预览。
    - 对话回退不再误称“恢复文件” — Agent 对话回退的确认文案只描述「截断该消息之后的所有对话且不可撤销」，移除「并恢复文件到该时刻状态」的不实表述；回退成功后将“不支持文件回退”作为正常能力边界返回，不再误报为错误并触发警告。新增静态契约测试防止旧文案回归。
    - Skill 改名后消息标签即时更正 — Agent 会话中引用 Skill 的消息标签在 Skill 重命名后显示新名称，按会话工作区读取启用与禁用 Skill 的当前名称，配合目录通知与缓存刷新，消息队列与历史消息中的标签不再停留在旧名。
    - 右键菜单与下拉菜单样式统一 — 侧栏右键菜单与下拉菜单抽取共享的表面、菜单项、分隔线与子菜单样式类，悬停、选中、动画与最大高度行为一致，不同入口弹出的菜单不再出现忽大忽小的观感差异。
    - 更新缓存自动清理更安全 — 升级包下载与安装后的缓存建立显式生命周期：待安装包只在目标版本成功启动后才删除，下载进行期间禁止任何清理；macOS 差分更新的基线文件与待安装包状态独立持久化；所有删除限定在 updater 自身的缓存目录，清理为尽力而为，失败不影响更新下载与安装能力。既避免磁盘残留，也不会误删正在使用或即将安装的更新包。
    - GPT-6 Astra 上下文窗口对齐 GPT-5.6 — GPT-6 Astra 的上下文窗口由 1M 调整为与 GPT-5.6 系列一致的 372K 注册与推断，第三方同名模型的外推同步修正，避免按 1M 估算导致上下文占用判断失真。
    - 移除旧内置搜索与生图工具 — 下线 Chat 与 Agent 中的旧 Tavily / Nano Banana 搜索、生图执行链路及其专用配置入口，工具列表与设置页随之精简；外部 MCP、其他 Chat 工具与既有历史记录不受影响。同步修复工具配置原子替换后的监听问题，覆盖首次创建、连续替换与停止清理三种路径。
