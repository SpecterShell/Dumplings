  Key: ReleaseNotes
  Value: |-
    Proma v0.17.15 更新
    新功能
    - 受管内嵌浏览器自动化 — Agent 现在可以直接操作内置浏览器：打开网页、观察页面结构、点击/填写控件、切换多个标签页，并可对预览中的本地 HTML 页面做真实浏览器验证；配套新增 in-app-browser 内置技能，将网页操作（站内搜索、登录后页面、动态内容）标准化，无需用户手动复制粘贴。
    - HTML 文件默认渲染 — 差异与预览标签页中的 HTML 文件默认以网页形式渲染，而不是直接展示源码；本地网页预览更直观，同时保留代码视图的切换入口。
    - 历史消息选区引用 — 在会话历史中选中一段消息即可引用：输入框以 chip 展示引用内容，正文中渲染为引用样式，点击引用可跳回原文位置并高亮，回顾与追问上下文更顺手。
    - turn 级 Skill 使用记录 — 每次对话轮次调用了哪些 Skill 现在都有迹可循，记录可随会话迁移并预览，Agent 行为更透明。
    - 设备数据迁移简化 — 移除自定义迁移包流程，改为引导式 .proma 归档 + Agent 辅助恢复路径：换机时只需导出归档，由 Agent 引导完成数据恢复，流程大幅简化。
    - 会话列表可读性改进 — 侧边栏会话列表重新布局，会话标题、时间与状态信息层级更清晰，长列表浏览更省力。
    - 活动 worktree 持久化 — Agent 会话关联的活动 worktree 会随会话持久保存，切换会话或重启应用后无需重新指定，多仓库协作更连贯。
    - 工作区记忆保留时间上下文 — 工作区记忆维护时自动保留事实/状态的发生时间与截止时间上下文，后续 Agent 判断历史信息时不再把旧状态当现状。
    Bug 修复
    - 草稿 Tab 滚动位置恢复 — 切换 Tab 后草稿（Scratch Pad）恢复之前的滚动位置，不再跳回顶部；切换到其他 Tab 时自动收起草稿分栏，布局更干净。
    - 内嵌浏览器导航与用户上下文 — 改进浏览器导航与 Agent 用户上下文：页面导航更准确，Agent 对当前页面的理解更完整。
    - 浏览器标签页处理 — 本地预览协议注册为独立浏览器会话；保留 Agent 创建的标签页标题、正确激活 Agent 选中的标签页；会话超过 20 个标签页时自动回收陈旧的 Agent 标签页，避免无限制膨胀。
    - 防止重复 resume 消息 — Agent 恢复会话时不再重复发送 resume 消息，避免消息队列出现重复记录。
    - Git diff 未跟踪文件行数 — 变更列表正确统计未跟踪（untracked）文件的行数，差异统计不再漏算新文件。
    - 生成文件改动显示 — Agent 生成的文件的改动现在会出现在文件变更列表中，并完善文件变更归属与附件监听，后台会话不再误报或漏报附件改动。
    - 目录条目消失容错 — 文件目录读取时条目中途消失不再导致整个列表失败，目录浏览更稳健。
    - 文件预览崩溃防护 — 不支持的文件类型预览不再导致应用崩溃，新增预览错误边界统一兜底；同时保留超长剪贴板附件内容，不再截断。
    - MCP HTTP 会话恢复 — 过期的 MCP HTTP 会话会自动恢复，长时间运行后工具调用不再因会话过期而失败。
    - 多仓库 worktree 选择器修复 — 多个仓库目录并存时，worktree 选择器能正确匹配与展示，不再选错仓库。
    - Windows Tab 栏操作区位置修复 — Windows 下 Tab 栏操作区位置正确，窗口控制按钮不再错位。
    - @ 提及异步启动支持 — 输入框与文件浏览器的 @ 提及在 TipTap 异步初始化时也能正常弹出建议。
    - 委派会话不再打扰灵动岛 — 委派（delegated）子会话不再出现在 Agent 灵动岛的事件流中，主会话运行状态更干净。
