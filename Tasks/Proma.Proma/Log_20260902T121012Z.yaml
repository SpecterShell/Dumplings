  Value: |-
    Proma v0.19.23 更新
    新功能
    - Agent 会话可拖入输入框生成引用 — 左侧会话列表中的会话可以直接拖到输入框，快速插入该会话的引用；也可通过会话菜单的「引用此会话」触发。自带自引用保护（拖拽自己的会话时给出提示），只读输入框不会被误插入，引用插入后可见性更清晰。
    - 委派观察收敛为单一 Tab，完成状态不再漏看 — 协作子 Agent（委派）运行时只使用一个固定的观察 Tab，避免多个委派堆积出大量标签；委派完成但尚未查看时会话在侧栏保持「未查看完成」标记，打开查看后自动清除，停止/切流等快捷键目标也随观察槽位正确对齐。
    - Vault 文件侧栏支持折叠 — Vault 视图左侧文件列表可一键折叠为窄条，展开后焦点自动回到折叠按钮，键盘操作更顺手，给笔记编辑留出更多空间。
    Bug 修复
    - 修复长文档目录导航后的预览与滚动竞态 — 点击目录（TOC）跳转前先等待编辑器就绪，防止预览在导航后不展示；作废跨文件切换留下的陈旧滚动恢复，并加竞态保护，避免恢复滚动位置时“先闪顶部再跳转”或跳到旧文件的错误位置。
    - 重复打开笔记不再反复重挂载 — 同一篇 Vault 笔记重复打开时避免编辑器反复重建；单篇笔记的渲染异常现在被错误边界隔离在内容区，不再让整个 Vault 或右侧工作区呈现空白，并可在内容区直接重试。
    - 清理会话文件变更中的已删除文件残留 — 会话里“先创建后删除”的文件不再一直残留在文件变更列表中，已删除路径会按授权目录校验后自动清理。
    - 预览文件支持在文件夹中定位 — 预览面板的「在文件夹中显示」改为基于预览实际解析到的目录定位文件，相对路径、附件与外部目录也能在 Finder/Explorer 中正确 reveal，不再出现“预览正常却定位不到文件”。
    - 为文件 chip 增加完整路径 Tooltip — 悬停消息中的文件 chip 显示完整路径，长路径不再因截断无法查看；文件存在性与路径解析逻辑统一整理，悬停时刷新结果更准确。
    - 适配 Fable 5.1 思考参数 — Pi 模型注册表识别整个 Fable 5 家族，强制走 Pi 的 adaptive + effort 思考路径，避免较新的 Fable 5.1 因旧式 thinking 参数被官方 Anthropic Messages 端点拒绝。
    - 并排模式下切换委派子会话给出明确提示 — 父会话仍处于并排（split）视图时，从侧栏切换到其委派子会话会先提示「请先退出并排模式」，避免布局状态让人困惑。
