  Key: ReleaseNotes
  Value: |-
    Linux release assets
    - CLIProxyAPI_<version>_linux_<arch>.tar.gz is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
    - CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.
    FreeBSD release assets
    - CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.
    Changelog
    - fix(claude): preserve 1h cache ttl and beta header for subagent requests (6a73f396)
    - fix(openai): preserve prewarm input and allow named tool outputs in responses websocket (bd03aabc)
    - fix(openai): preserve nested error details and sequence numbers in responses stream (25913086)
    - fix(codex): treat model capacity errors as bootstrap overload failures (3ae9093d)
    - fix(auth): enable model cooldown and rotation for model not found errors (dde250f1)
    - fix(translator): ignore null and empty finish reasons in openai to gemini response (4dce5f3a)
    - fix(stream): handle split CRLF across chunk boundaries in SSE validation (638ed7e1)
    - docs(readme): remove RunAPI sponsor (09a29bd3)
