    - Merge pull request #4588 from adityavkk/fix/preserve-sdk-executors (2135379c)
    - Merge pull request #4591 from cyclopentadiene/fix/claude-oauth-sse-tool-names (411dc9a9)
    - fix(auth): replace return with break in filestore equality checks (22ec4159)
    - refactor(translator): enhance tool call handling for streaming responses (58ede93e)
    - fix(executor): add failure tracking and reporting for video execution (90c2ff90)
