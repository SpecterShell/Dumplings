- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Linux release assets
    - CLIProxyAPI_<version>_linux_<arch>.tar.gz is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
    - CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.
    FreeBSD release assets
    - CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.
    Changelog
    - feat(xai): allow grok imagine aspect_ratio 9:20 (75bd6a60)
    - feat(xai): also allow grok imagine aspect_ratio 20:9 (f049e00b)
    - fix(claude): skip retry-after header on overage-only rejections (1cce9325)
    - fix(codex): strip item-level and tool output prompt cache breakpoints (3662d153)
    - fix(xai): restore aliased client web search tool name in responses (660a5800)
    - feat(codex): append (Devin) suffix to Devin model display names (28743473)
    - fix(codex): normalize and support ultrafast service tier (859c4865)
    - feat(codex): record upstream response model and warn on silent model substitution (25f40d8c)
    - fix(openai): align tool call messages and preserve ordering on ambiguous outputs (cc545cbf)
    - feat: add PatewayAI (784285a4)
    - feat: add FluxA (0b9a91fb)
    - Merge pull request #5919 from Fesaluo/feat/xai-imagine-aspect-ratio-9-20 (05391d7b)
