  Key: ReleaseNotes
  Value: |-
    Linux release assets
    - CLIProxyAPI_<version>_linux_<arch>.tar.gz is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
    - CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.
    FreeBSD release assets
    - CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.
    Changelog
    - feat(config): preserve unknown nested fields as comments during v8 migration (48686ccc)
    - fix(codex): normalize empty function call arguments in responses requests (5d8bb3d9)
    - fix(claude): remap MCP aliases in tool_addition/tool_removal blocks (958eeca7)
    - feat(codex): extract and persist subscription plan type (59baf731)
    - feat(sdk): add Home credential capabilities and quota APIs (b9971ee3)
    - fix(codex): use resolved compat for multi-agent v2 (d3cd466d)
    - Merge pull request #6175 from magoz/fix/claude-oauth-tool-change-alias (e8156ec7)
    - fix(openai): use routed home model compatibility options (ac42accc)
    - Merge pull request #6176 from router-for-me/home (673e58d5)
    - feat(logging): switch request ID generation to UUIDv7 (d33f63f8)
