  Key: ReleaseNotes
  Value: |-
    Linux release assets
    - CLIProxyAPI_<version>_linux_<arch>.tar.gz is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
    - CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.
    FreeBSD release assets
    - CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.
    Changelog
    - feat(xai): bump client version to 0.2.120 and include Grok Shell auth headers on XAI requests (e400d719)
    - fix(home): preserve requested usage metadata before auth preparation (076ec64c)
    - fix(claude): skip context management when thinking is disabled (533b69e3)
    - fix(responses): support custom tool calls and namespace collisions in request/response conversion (ea37d13a)
    What's Changed
    - fix(home): preserve requested usage metadata before auth preparation by @sususu98 in https://github.com/router-for-me/CLIProxyAPI/pull/4792
    - fix(claude): skip context management when thinking is disabled by @DefinitelyNotSpammy in https://github.com/router-for-me/CLIProxyAPI/pull/4785
