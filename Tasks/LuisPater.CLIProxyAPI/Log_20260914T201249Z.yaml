- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Linux release assets
    - CLIProxyAPI_<version>_linux_<arch>.tar.gz is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
    - CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.
    FreeBSD release assets
    - CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.
    Changelog
    - fix(codex): buffer keepalive and empty item announcements during codex bootstrap (cb73cd99)
    - feat(devin): support port-free manual code login in no-browser mode (fe2fdde8)
    - fix(devin): align OAuth authorization URL parameter order with official CLI binary (09807c57)
    - fix(devin): mock AuthService in headless token test and validate prompt before printing URL (c35db127)
    - feat(discovery): add LAN gateway discovery (3428110d)
    - fix(translator): preserve html characters in tool arguments and fix devin sequential tool calls (c1cb0c5d)
    - docs(readme): remove FastAIToken sponsor (fd3cd151)
    - test(devin): route status calls to mock server in headless auth tests (f465ebdd)
    - fix(claude): repair tool call pairing and handle standalone tool outputs (2bcebaa8)
    - fix(discovery): harden advertiser lifecycle and browse limits (b9005770)
    - fix(discovery): honor caller cancellation and reload endpoint (c1b7c91f)
    - Merge pull request #5724 from Viggo95/fix/codex-bootstrap-buffer-noncontent-events (bb20fa2d)
    - fix(discovery): bound browse resource usage (f5c19d25)
    - fix(cmd/fetch_antigravity_models): support symlinked auth dir and multi-auth fallback (f341e07b)
    - feat(models): add gemini-3.5-flash-lite model definition (d48590a4)
    - feat(codex): add optional time ceiling for stream bootstrap buffering (6e307553)
    - test(discovery): report temp cleanup failures (c3a5e8c0)
    - fix(discovery): close lifecycle and routing gaps (20ec9b83)
    - Merge pull request #5818 from router-for-me/feat/codex-bootstrap-timeout (6c5fef91)
    - fix(discovery): keep JSON scans clean and honor interface filters (7d687054)
    - fix(discovery): load default scan config and sanitize hostnames (2dd2fd6d)
    - fix(discovery): uniquify instance names without a startup browse (9e847e59)
    - fix(devin): share manual paste parsing and surface oauth callback errors (5f74accd)
    - fix(discovery): tighten scan timeout, flags, and TCP-only types (13af6c00)
    - Merge pull request #5808 from router-for-me/feat/devin-code-login (c9b3dbef)
    - Merge pull request #5796 from router-for-me/feat/ai-gateway-discovery (9b52a499)
    - fix(pluginhost): keep request and method buffers alive during native call (b8477c71)
    - feat(pluginabi): support HTTP status code propagation in plugin error envelopes (6ba44455)
    - test(openai): add tests for responses websocket compaction replay and routing (ca929459)
    - feat(pluginhost): propagate forced provider and auth ID in host model execution (748d5767)
    - feat(auth): add tests to ensure async operations don’t block unrelated actions (e3cbe437)
    - feat(executor): strip unsupported id fields from Gemini interactions payload (1fac8cc0)
    - feat(auth): add retry logic for pre-HTTP transport failures and related tests (bef1f65c)
    - feat(translator): handle orphan function outputs as user text in OpenAI and Gemini translators (8c984672)
    - feat(executor): promote reasoning content as summary and sanitize inputs (7bbfeaf8)
    What's Changed
