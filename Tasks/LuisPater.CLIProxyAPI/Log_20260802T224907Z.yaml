  Key: ReleaseNotes
  Value: |-
    Linux release assets
    - CLIProxyAPI_<version>_linux_<arch>.tar.gz is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
    - CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.
    FreeBSD release assets
    - CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.
    Changelog
    - feature(codex): Normalize invalid sub2api message item IDs during Codex input sanitization (8d675e69)
    - feat(codex): support max-context-length overrides for configured models (a303fd86)
    - feat(executor): normalize OpenAI tool results for text-only compatibility models (13435c93)
    - fix(translator): accept snake_case Gemini usage metadata in interactions conversion (abbb1c75)
    - fix(translator): emit function_call_arguments.done and make function call stream events idempotent (0cc24b2e)
    - Handle encrypted collaboration message schemas (1cf9a45c)
    - fix(translator): preserve content block order when building non-stream Claude OpenAI responses (aea71c00)
    - fix(translator): preserve non-object Claude tool inputs when building function call args (08799298)
    - fix(translator): emit response.completed on stream end when finish_reason is missing (87207025)
    - Merge pull request #4748 from patrick-fu/p/patrick/fix-codex-collaboration-message-encryption (ffdb9c9f)
    What's Changed
    - Handle encrypted collaboration message schemas by @patrick-fu in https://github.com/router-for-me/CLIProxyAPI/pull/4748
