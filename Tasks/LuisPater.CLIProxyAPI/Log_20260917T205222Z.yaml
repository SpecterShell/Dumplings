  Key: ReleaseNotes
  Value: |-
    Linux release assets
    - CLIProxyAPI_<version>_linux_<arch>.tar.gz is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
    - CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.
    FreeBSD release assets
    - CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.
    Changelog
    - feat(management): paginate auth file listings (76ac75e6)
    - Merge pull request #5897 from camy-x/feat/auth-files-pagination (46d4baff)
    - fix(devin): support images in tool results (64c9433f)
    - fix(config): preserve plugin configurations when saving yaml (afba07ba)
    - feat(plugin): support scheduling across priorities (b715526a)
    - fix(management): reject unresolved token placeholders in api-call (0b550539)
    - fix(devin): aggregate tool calls by id and track cache write tokens (9e10db53)
    - fix(devin): handle orphaned tool results and normalize function result payloads (b6fe4f20)
    - feat(claude): support model-level cooling and scope overage rate limits (44eaef00)
    - fix(xai): unify forced hosted tool choice normalization (c616193a)
    - fix(ci): replace go-cross/cgo-actions with direct FreeBSD sysroot cross-compilation (b773607e)
    What's Changed
    - feat(management): paginate auth file listings by @camy-x in https://github.com/router-for-me/CLIProxyAPI/pull/5897
