- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Linux release assets
    - CLIProxyAPI_<version>_linux_<arch>.tar.gz is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
    - CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.
    FreeBSD release assets
    - CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.
    Changelog
    - fix(util): guard const, enum, and additionalProperties schema passes with isPropertyDefinition (cad3ae5d)
    - fix(util): normalize tuple and non-object array items for native Gemini schemas (c9e6e2e3)
    - fix(xai): evict ephemeral and 24h idle websocket ID states (679166b8)
    - fix(antigravity): honor per-auth user_agent on probes, fence model publication, and omit empty project (753bfa19)
    - fix(antigravity): preserve NONE tool calling mode for Claude models (e0cc1cf8)
    - fix(antigravity): enforce short cooldowns, 429 bookkeeping, and schema sanitization in CountTokens (94b164bf)
    - fix(registry): include copilot in static model lookup (cbfc90ad)
    - feat(management): add copilot oauth support to v8 api (feadc90b)
    - fix(translator): preserve cache_control on Responses tool outputs for Claude (8cab158f)
    - fix(pluginhost): fall through to next scheduler plugin when PickAuth declines (254d0c2c)
    - fix(antigravity): guard credits refresh and project discovery on config and disabled auth (d2086b4c)
    - fix(management): fail Antigravity OAuth session when project ID discovery fails (d214f881)
    - fix(thinking/antigravity): avoid recreating orphan includeThoughts after stripping invalid Claude budget (b2151d64)
    - fix(antigravity): default omitted minimumCreditAmountForUsage to zero when parsing credits (737ba4c6)
    - fix(claude): preserve adjacent same-response thinking blocks in openai responses translation (c71aa824)
    - fix(antigravity): set X-Goog-User-Project header on Cloud Code PA requests (acf238f6)
    - fix(antigravity): scope incoming request.sessionId per credential and subagent (14e12fb5)
    - fix(codex): preserve requested Responses include values by upstream backend (7f22743a)
    - fix(devin): preserve Gemini bare-Tink thought signatures on Responses replay (28b281d5)
    - fix(antigravity): isolate reasoning replay keys using canonical and body session identities (3988a389)
    - fix(antigravity): emit uppercase thinkingLevel enum names (127c50bc)
    - fix(auth): populate canonical session metadata on Antigravity credits execute (dd0d80c8)
    - fix(session): isolate subagent identities for header-based sessions (f9ac9ffc)
    - fix(antigravity): use signed int64 session IDs matching Hub format (55e5a7ea)
    - Revert "fix(antigravity): set X-Goog-User-Project header on Cloud Code PA requests" (ca43428b)
    - fix(antigravity): populate request.model and strip request.stream in CountTokens (fb989e5f)
    - fix(antigravity): detach caller cancellation when committing reasoning replay state (327b4c61)
    - fix(antigravity): handle non-stream in-band errors and evict idle transports on 403/401 (ec25cc83)
    - feat(registry): unify copilot and devin published routes (f89d408e)
    - fix(antigravity): canonicalize multimodal media field names (08098d24)
    - fix(antigravity): isolate native search from chat tools (28134004)
    - Merge pull request #7900 from router-for-me/registry (c6f1d626)
    - fix(antigravity): defer non-stream reasoning replay commit until after translation error checks (555bdb4b)
    - fix(antigravity): isolate credits state by credential (16bf182f)
    - feat(registry): add Gemini 4 Neon model definition (8a8c2343)
    - chore(deps): update Go modules and upgrade moego to v0.1.0-alpha.5 (6eb8554f)
    What's Changed
    - feat(registry): unify copilot and devin published routes by @hkfires in https://github.com/router-for-me/CLIProxyAPI/pull/7900
