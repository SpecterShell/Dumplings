  Key: ReleaseNotes
  Value: |-
    Linux release assets
    - CLIProxyAPI_<version>_linux_<arch>.tar.gz is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
    - CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.
    FreeBSD release assets
    - CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.
    Changelog
    - perf(auth): optimize scheduler result updates with targeted model shards (fa01468e)
    - feat(pluginhost): expose outbound HTTP wire profile to plugin requests (00c63a56)
    - feat(antigravity): add conversation compaction support and capsule encryption (70f45604)
    - fix(xai): support compaction fallback from payload input or previous response id (0e85eb46)
    - fix(gemini): append trailing user turn for requests ending with model content (5dc428f3)
    - fix(claude): preserve non-result block positions during tool result alignment (8564142f)
    - fix(antigravity): omit tools when tool_choice is none (a76da711)
    - fix(auth): preserve active cooldown deadlines on subsequent failures (1c22598d)
    - fix(antigravity): enable thinking summary when responses reasoning effort is set (e92f6cf5)
    - fix(claude): normalize codex agent messages in responses conversion (d2f71220)
    - feat: add Aiberm sponser (63fd2550)
    - fix Aiberm sponser logo (578ac8fd)
    - feat: add Aiberm sponsorship information to README_JA.md (4cd8ee7f)
    - feat: add link to Aiberm in sponsorship section of README files (934fb792)
