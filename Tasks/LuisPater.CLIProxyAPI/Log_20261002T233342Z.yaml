  Key: ReleaseNotes
  Value: |-
    Linux release assets
    - CLIProxyAPI_<version>_linux_<arch>.tar.gz is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
    - CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.
    FreeBSD release assets
    - CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.
    Changelog
    - feat(pluginhost): add host routing reset cooldown callback (8348923a)
    - fix(codex): retain template freeform apply_patch capability by default (d306f2c5)
    - fix(claude): pin session date in cloaked reminder to prevent prompt cache invalidation (6d57ac90)
    - feat(management): inject auth indexes into v8 api-keys config (0fb50a18)
    - fix(auth): preserve terminal unauthorized state and prevent unsafe refresh retry (c163bae4)
    - fix(claude): handle pause_turn stop reason in responses translation (e6f6f26a)
    - fix(codex): preserve web search sources in responses request include (2044a01f)
    Full Changelog: https://github.com/router-for-me/CLIProxyAPI/compare/v8.0.11...v8.0.12
