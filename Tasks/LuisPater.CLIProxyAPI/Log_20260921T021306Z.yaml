  Key: ReleaseNotes
  Value: |-
    Linux release assets
    - CLIProxyAPI_<version>_linux_<arch>.tar.gz is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
    - CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.
    FreeBSD release assets
    - CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.
    Changelog
    - feat(translator): support builtin tools in gemini and antigravity interactions (cdfb79ef)
    - fix(claude): accept newer patch releases as native clients (#5820) (83a4913a)
    - docs(claude): clarify patch version floor rationale for native passthrough (c52ca7bd)
    - fix(auth): avoid unnecessary scheduler rebuilds by checking sync needs from auth map (e56547f3)
    - feat(steering): add documentation for Codex response steering and duplex transport (ddc3f731)
    - fix(translator): preserve reasoning content across tool turns in responses conversion (40cc6489)
    - feat(auth): propagate context compaction and node kind session metadata (28100e54)
    - Merge pull request #5982 from ysntony/add-kimi-ai-code-link (29bdd856)
    - feat: add full support for kimi.ai oauth and runtime execution (a5ab6952)
    What's Changed
    - fix(claude): accept newer patch releases as native clients by @camy-x in https://github.com/router-for-me/CLIProxyAPI/pull/5820
    - docs: add international Kimi Code link (kimi.ai/code) to all README locales by @ysntony in https://github.com/router-for-me/CLIProxyAPI/pull/5982
    New Contributors
    - @ysntony made their first contribution in https://github.com/router-for-me/CLIProxyAPI/pull/5982
