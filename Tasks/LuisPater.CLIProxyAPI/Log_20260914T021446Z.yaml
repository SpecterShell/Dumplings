  Key: ReleaseNotes
  Value: |-
    Linux release assets
    - CLIProxyAPI_<version>_linux_<arch>.tar.gz is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
    - CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.
    FreeBSD release assets
    - CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.
    Changelog
    - fix(openai): convert responses tool choice to chat completions format (8c5f6e18)
    - fix(devin): parse field 8 header submessages, accumulate field 4 prompt tokens, and add field 28 usage fallback (b4749cb2)
    - test(devin): add unit test for devin oauth-model-alias channel routing (01483310)
    - fix(devin): reject case-insensitive duplicate model IDs (db0b957c)
    - feat(api-call): support \(TOKEN\) replacement in request body data (0719520f)
    - fix(devin): unwrap repeated field 28 groups, merge partial field 7 usage, and harden APICall escaping (4c331bb9)
    - fix(devin): trigger dimension group fallback if any usage metric is zero (5f56ce92)
    - fix(devin): use loopback callback endpoint for oauth redirect uri (cca35aee)
    - Merge pull request #5806 from router-for-me/feat/devin-followups (7fa443dc)
    What's Changed
    - fix(devin): wire protocol submessage decoding, usage fallbacks, model uniqueness, and APICall body token replacement by @sususu98 in https://github.com/router-for-me/CLIProxyAPI/pull/5806
