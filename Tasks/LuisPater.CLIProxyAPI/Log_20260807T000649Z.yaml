  Key: ReleaseNotes
  Value: |-
    Linux release assets
    - CLIProxyAPI_<version>_linux_<arch>.tar.gz is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
    - CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.
    FreeBSD release assets
    - CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.
    Changelog
    - feat(codex): add model-level is-compat flag to rewrite MultiAgentV2 agent_message for Responses-compatible endpoints (e5ea945e)
    - feat(codex): add model-level is-compat flag to rewrite MultiAgentV2 agent_message for Responses-compatible endpoints (7fef08ea)
    - fix(responses): correct request wrapper detection in antigravity response conversion (94808f10)
    - fix(responses): translate text.format into response_format in request conversion (2e91e99e)
    - fix(auth): preserve session affinity across priorities (65fc536e)
    - feat(compat): preserve compat-mode thinking/signature blocks for API-key models (dcee14dd)
    - fix(responses): merge consecutive OpenAI response turns and align tool call/result blocks for Claude conversion (f1a21a9b)
    - fix(claude): accumulate consecutive role turns during request conversion (71e87111)
    - fix(openai): expose only client-fault streaming errors (fe28d582)
    - fix(auth): avoid penalizing credentials for client faults (c1d69e7b)
    - fix(auth): rotate credentials for unknown upstream failures (579f5e30)
    - fix(api): escape the model name in the unroutable model error (b148af80)
    - fix(cliproxy): canonicalize thinking-suffix model states for cooldown and scheduler sharing (1674aaf4)
    - fix(cliproxy): avoid credential cooldown for connection-lifecycle disconnect errors (8392b180)
    What's Changed
    - fix(auth): preserve session affinity across priorities by @sususu98 in https://github.com/router-for-me/CLIProxyAPI/pull/4809
    - fix(openai): classify streaming failures by client fault instead of HTTP status by @sususu98 in https://github.com/router-for-me/CLIProxyAPI/pull/4820
