  Key: ReleaseNotes
  Value: |-
    Linux release assets
    - CLIProxyAPI_<version>_linux_<arch>.tar.gz is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
    - CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.
    FreeBSD release assets
    - CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.
    Changelog
    - fix(gemini): support camelCase systemInstruction in request translation (d510dccf)
    - fix(gemini): map refusal finish reasons and handle partless stream completion in Claude response translation (a0d31924)
    - fix(gemini): handle carrier thinking blocks for signed visible text and tool calls in Claude response translation (68ea171d)
    - test(cliproxy): fix model catalog restore configuration in tests (da5f109f)
    - fix(cliproxy): avoid selecting rejected credentials during refresh and preserve active quota cooldowns (50d5fe18)
    - fix(cliproxy): propagate credential version and registration epoch in execution results (6920ed5d)
    - fix(cliproxy): prevent in-flight token refresh from overwriting concurrently updated credentials (935aa6e3)
    - fix(gemini): ignore context cancellation after terminal chunk in Vertex stream (dbc4aad9)
    - fix(claude): keep system prompt at top level for single terminal user turn (eca1d113)
    - fix(claude): keep system prompt at top level for leading user message runs (39632e52)
    - fix(executor): preserve upstream usage on apply patch failures (57bde351)
    Full Changelog: https://github.com/router-for-me/CLIProxyAPI/compare/v8.0.16...v8.0.17
