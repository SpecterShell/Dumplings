  Key: ReleaseNotes
  Value: |-
    Linux release assets
    - CLIProxyAPI_<version>_linux_<arch>.tar.gz is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
    - CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.
    FreeBSD release assets
    - CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.
    Changelog
    - fix(pluginhost): preserve disabled state in host auth callbacks (5756d76e)
    - feat(config): warn on unrecognized sections during v8 migration (01274e22)
    - fix(meta): strip unsupported search_content_types from web search tools (2c27e61f)
    - feat(openai): support quality parameter for xAI image requests (4b99d1d6)
    - fix(openai): prevent false positive namespace prefix matches in responses tools (4ad5bba7)
    - fix(translator): append trailing newlines to SSEEventData frames (0a45f253)
    - fix(gemini): preserve thought signatures in interactions translation (04f88169)
    - fix(discovery): support bonded interfaces and deduplicate build warnings (acdace93)
    Full Changelog: https://github.com/router-for-me/CLIProxyAPI/compare/v8.0.2...v8.0.3
