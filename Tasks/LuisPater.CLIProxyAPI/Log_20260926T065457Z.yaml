    - fix(auth): unschedule disabled invalid_grant credentials and apply exponential backoff for enabled invalid_grant (58461c8f)
    - fix(claude): apply cloaking by default for direct Messages OAuth requests (4332048d)
    - fix(auth): unschedule disabled invalid_grant credentials and apply exponential backoff for enabled invalid_grant (#6123) (960be012)
    - fix(auth): preserve resolved model capabilities and configuration update support (ed980be3)
