  Key: ReleaseNotes
  Value: |-
    Linux release assets
    - CLIProxyAPI_<version>_linux_<arch>.tar.gz is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
    - CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.
    FreeBSD release assets
    - CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.
    Changelog
    - fix(antigravity): sanitize Claude tool IDs and resolve collisions (580df95a)
    - feat(registry): update devin model definitions (65459cac)
    - fix(logging): prevent request log collisions and select latest log by ID (e6fcfa34)
    - feat(usage): track execution request ID and trace ID across usage records (2fe9932b)
    - fix(gemini): stringify function responses containing JSON schema $ref (5af6cd75)
    - fix(auth): isolate credential-scoped quota cooldown from model quota state (aafa4e95)
    - feat(pluginhost): add host http operation bridge and lifecycle scoping (855a7223)
    - feat(auth): persist meta mint subscription metadata in auth record (7d888bf3)
    - fix(claude): merge adjacent text blocks into single assistant message (781a203b)
    - fix(auth): preserve file priority across plugin auth refreshes (c404af96)
