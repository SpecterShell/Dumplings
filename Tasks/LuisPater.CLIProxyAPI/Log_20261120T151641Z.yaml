  Key: ReleaseNotes
  Value: |-
    Linux release assets
    - CLIProxyAPI_<version>_linux_<arch>.tar.gz is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
    - CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.
    FreeBSD release assets
    - CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.
    Changelog
    - fix(auth): honor stop rules and retry limits in antigravity credits fallback (a35e8be3)
    - fix(claude): strip foreign advisor blocks after credential rebind (91a3f455)
    - feat(plugin): support credential-scoped after-auth request termination (5bfae629)
    - fix(codex): synthesize baseline model from visible API-supported template and deflake wstunnel auth test (5f7c0553)
    - chore(examples): update moego dependency to v0.1.0-alpha.4 (f19d4a6f)
    - fix(antigravity): align OAuth token refresh transport and User-Agent (0861f9e1)
    - fix(antigravity): bound post-refresh credits warm to prevent goroutine leak and refresh deadlock (99a1c1ca)
    - fix(antigravity): separate 403 probe backoff from token rotation and skip disabled auths (f8e297aa)
    - feat(antigravity): scope synthesized request.sessionId per credential (3a24d03c)
    - fix(gemini): cap Gemini 4 max completion tokens at 65536 (c1040cc0)
    - fix(executor): ignore Claude Code attribution block in reasoning replay lane (bba22ed9)
    - fix(api): decode gzip request bodies and honor Content-Encoding on Claude routes (6e7a1b29)
    - fix(auth): stop credential loop on cancellation during auth preparation and Home execution (dfdb3ba4)
    - fix(auth): enforce consistent cancellation and Retry-After cooldown handling (3ad507bf)
    - fix(auth): preserve streamResult.Headers on invalid-request bootstrap errors and avoid double-wrapping streamBootstrapError (d52047a6)
    - fix(auth): classify anthropic stop_reason consistently for message and message_delta payloads (3a0d3023)
    - fix(auth): end home selection on empty stream and drain upstream chunks on cancel (9be2d5f1)
    - fix(auth): align executeHome and executeHomeOnce with execution-path parity (84e0cd9b)
    - fix(auth): clone metadata before interceptor session updates and publish refreshed auth on 401 retry (2dbad4dd)
    - fix(meta): synthesize unstreamed Responses messages and translate refusal parts (ca459712)
    - fix(meta): tighten Responses output synthesis tracking and refusal fallbacks (e442c32d)
    - test(meta): add regression coverage for incomplete synthesis and refusal fallbacks (2e940ba1)
    - fix(auth): honor request-scoped-errors, Retry-After, and credential scope on PrepareRequestAuth failure (2f57a5a6)
    - fix(auth): serialize request auth preparation with refresh locks and abort unregistered credentials (0a34244e)
    - fix(auth): scope stream bootstrap retry-after annotation to the same upstream attempt (d4f6edb1)
    - fix(auth): publish selected auth metadata only after executable model check (0399de38)
    - fix(auth): capture per-attempt access token on streaming failure results (f5c5681a)
    Full Changelog: https://github.com/router-for-me/CLIProxyAPI/compare/v8.0.79...v8.0.80
