  Key: ReleaseNotes
  Value: |-
    Linux release assets
    - CLIProxyAPI_<version>_linux_<arch>.tar.gz is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
    - CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.
    FreeBSD release assets
    - CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.
    Changelog
    - fix(openai): process reasoning deltas before content in responses stream (c8ecb4f3)
    - fix(antigravity): keep active block open on empty text parts in claude stream (fd3e6623)
    - fix(auth): treat cloudflare 520-526 origin errors as transient upstream failures (9fad5055)
    - fix(gemini): preserve function call pairing for interrupted calls and replay failures (b8e6ec0a)
    - fix(auth): bound force refresh all concurrency using worker pool (6dce7867)
    - fix(translator): ignore fco output item IDs when extracting responses call ID (5a07045e)
