  Key: ReleaseNotes
  Value: |-
    Linux release assets
    - CLIProxyAPI_<version>_linux_<arch>.tar.gz is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
    - CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.
    FreeBSD release assets
    - CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.
    Changelog
    - perf(claude): prefilter JSON payloads before diagnostic walks (5dbce4f3)
    - fix(antigravity): replace retired Claude 4.6 models with 5.5 (e3abd9ae)
    - fix(antigravity): align Claude 5.5 token limits with upstream catalog (c575291a)
    - fix(antigravity): use actual Claude 5.5 high model IDs (6b037f61)
    - fix(claude): map request timeout status to timeout_error (42d484f9)
    - fix(auth): snapshot auth before unlocking during registration and update (d4692663)
    - fix(devin): stream content early and defer thought stop for late signatures (ea8ffd5f)
    - fix(responses): complete reasoning summary stream lifecycle events (ed4d972e)
    - fix(codex): publish main usage before image tool usage in execute (a3b77566)
    - fix(claude): include web search sources in codex request when search tool is present (2c1dcc7c)
    - fix(codex): expand integer field normalization mappings for tools (d7914afd)
    Full Changelog: https://github.com/router-for-me/CLIProxyAPI/compare/v8.0.12...v8.0.13
