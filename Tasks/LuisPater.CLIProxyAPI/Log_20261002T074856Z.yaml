  Key: ReleaseNotes
  Value: |-
    Linux release assets
    - CLIProxyAPI_<version>_linux_<arch>.tar.gz is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
    - CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.
    FreeBSD release assets
    - CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.
    Changelog
    - docs(readme): refresh provider models and add Muse Code and Devin (#6118) (028f6a19)
    - fix(signature): suppress routine Gemini bypass logs (f3fd2f23)
    - refactor(signature): improve logging and sanitize logic for Gemini signatures (9f35c1dc)
    - refactor(executor): optimize translation logic and improve plugin invocation handling (cf3102cc)
    - fix(executor): publish antigravity stream usage first (2783e10c)
    - Merge pull request #6271 from router-for-me/gemini (6fecc6e5)
    What's Changed
    - docs(readme): refresh provider models and add Muse Code and Devin by @kdcokenny in https://github.com/router-for-me/CLIProxyAPI/pull/6118
    - Suppress redundant logging and optimize Gemini signature handling by @hkfires in https://github.com/router-for-me/CLIProxyAPI/pull/6271
