- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Linux release assets
    - CLIProxyAPI_<version>_linux_<arch>.tar.gz is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
    - CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.
    FreeBSD release assets
    - CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.
    Changelog
    - feat(auth): enhance retry logic with enriched error handling and tests (6724a958)
    - fix(interactions): strip invalid id from function_result and redundant call_id from function_call (f51d3ae9)
    - Merge pull request #5830 from router-for-me/fix/issue-5828-gemini-interactions-tool-result-id (10d464d4)
    - feat(translator): enhance finish reason handling and tool call translations (6f908cbc)
    - feat(translator): enhance cache usage handling and input token computation logic (e54a8e97)
    - feat(translator): introduce namespace-aware tool name capping and collision handling (e3e97ad9)
    - fix(devin): support swe-1-6-slow model variant (dea4ce8a)
    - feat(antigravity): support web search translation and URL resolution in OpenAI Responses (ef63d2e7)
    - feat(translator): preserve tool names in tool result messages (7def8425)
    - fix(devin): classify high-demand errors as rate limits (d44901f9)
    - Merge pull request #5867 from avabbbb/fix/devin-swe-1-6-slow (44f8343f)
    - fix(executor): prevent stream failure on client disconnect after claude completion (7c32971b)
    - Merge pull request #5862 from sususu98/feat/antigravity-websearch (8c6d4dcd)
    - feat(translator): enhance web search streaming and citation mapping in OpenAI Responses (7fcbdf88)
    - Merge pull request #5870 from avabbbb/fix/devin-high-demand-rate-limit (4613cfd4)
    - feat(translator): support alternative reasoning fields in OpenAI Claude translation (77820cb2)
    - fix(devin): buffer content deltas to handle late thinking signatures (c2bb91d2)
    - feat(translator): wrap demoted mid-session system messages in system-reminder envelope (b681a1e0)
    What's Changed
    - fix(interactions): strip invalid id from function_result and redundant call_id from function_call by @sususu98 in https://github.com/router-for-me/CLIProxyAPI/pull/5830
    - fix(devin): support swe-1-6-slow model variant by @avabbbb in https://github.com/router-for-me/CLIProxyAPI/pull/5867
    - feat(antigravity): support web search translation and URL resolution in OpenAI Responses by @sususu98 in https://github.com/router-for-me/CLIProxyAPI/pull/5862
    - fix(devin): classify high-demand errors as rate limits by @avabbbb in https://github.com/router-for-me/CLIProxyAPI/pull/5870
