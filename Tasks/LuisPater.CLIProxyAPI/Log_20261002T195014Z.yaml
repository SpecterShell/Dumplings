  Key: ReleaseNotes
  Value: |-
    Linux release assets
    - CLIProxyAPI_<version>_linux_<arch>.tar.gz is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
    - CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.
    FreeBSD release assets
    - CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.
    Changelog
    - fix(gemini): handle split usage metadata and max tokens in responses translation (5ec31442)
    - test(executor): relax connection reuse bounds in transport tests (30aa1f12)
    - fix(executor): preserve top-level responses token usage when service tier is present (8fbf152b)
    - feat(antigravity): trace upstream connection reuse in debug logs (d7c3c0aa)
    - feat(config): add shared upstream provider settings (52d5507d)
    - fix(config): support historical v8 aliases (3be5fa44)
    - Merge pull request #6285 from sususu98/feat/antigravity-connection-debug-trace (e2bff010)
    What's Changed
