  Key: ReleaseNotes
  Value: |-
    Linux release assets
    - CLIProxyAPI_<version>_linux_<arch>.tar.gz is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
    - CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.
    FreeBSD release assets
    - CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.
    Changelog
    - fix(claude): synthesize belated tool_use starts for empty-name calls (37609fa1)
    - fix(cliproxy): centralize client error status mapping and apply context cancellation/deadline HTTP codes (4b3cc55c)
    - fix(kimi): canonicalize K2.7 Code model aliases to official Kimi-For-Coding IDs (36936340)
    - fix(codex): resolve credential-aware model before forwarding API-key alpha search requests (e64cdbf5)
    - fix(cliproxy): delegate OpenAI-compatible OAuth refresh to plugin auth providers (01a21b77)
    - fix(cliproxy): stop non-streaming keep-alive after OpenAI handler execution (9829bd9d)
    - fix(codex): deduplicate Responses tools when converting to OpenAI Chat Completions (aff2095a)
    - feat(signature): identify Kimi thinking signatures by fixed size (8558f443)
    - feat(signature): add Grok as a target-only provider family (4abb0e66)
    - fix(codex): normalize custom_tool_call IDs with ctc_ prefix during Codex input sanitization (197f5204)
    What's Changed
    - feat(signature): identify Kimi thinking signatures and scope Grok as target-only by @sususu98 in https://github.com/router-for-me/CLIProxyAPI/pull/4835
