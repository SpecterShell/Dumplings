  Key: ReleaseNotes
  Value: |-
    Linux release assets
    - CLIProxyAPI_<version>_linux_<arch>.tar.gz is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
    - CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.
    FreeBSD release assets
    - CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.
    Changelog
    - test(executor): allow non-negative TTFT in xAI usage record assertions (fd5cd228)
    - fix(claude): gate fallback-credit beta on fallback tokens or explicit fallbacks (ed751ea0)
    - fix(translator): hoist tool-result content part cache_control to the block (#5432) (bcd13ca9)
    - refactor(translator): encapsulate tool-result cache-control hoisting in common (50585bf2)
    - fix(responses): support mid-connection prewarm in websocket handler (7b6fafce)
    - fix(responses): filter upstream private and telemetry events in SSE streams (dd013f9e)
    - feat(pluginapi): propagate response model, service tier, and stream flag to usage plugins (ac3849e5)
    - fix(gemini): enforce array type for schema nodes declaring items (ffe6ad3c)
    What's Changed
    - fix(translator): hoist tool-result content part cache_control to the block by @ggbdpq in https://github.com/router-for-me/CLIProxyAPI/pull/5432
    New Contributors
    - @ggbdpq made their first contribution in https://github.com/router-for-me/CLIProxyAPI/pull/5432
