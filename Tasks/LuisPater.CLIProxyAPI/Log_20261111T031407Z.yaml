    - fix(claude): emit anthropic-ratelimit-unified headers on local cooldown 429s (cb70eacf)
    - fix(xai): classify non-stream terminal SSE errors and empty or incomplete streams (949b43b3)
    - fix(logging): preserve bounded upstream responses in error logs (ece3f52a)
    - fix(registry): restore model listings once bounded cooldown deadlines expire (69ed202a)
    - fix(meta): pass through explicit client prompt_cache_retention (f77a3c10)
    - feat(executor): add sensitive-words-replace and harden Antigravity obfuscation (9a7e1e6b)
