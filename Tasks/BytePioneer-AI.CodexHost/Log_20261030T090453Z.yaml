  Key: ReleaseNotes
  Value: |-
    What's New
    Urgent compatibility fix for Codex Desktop 26.1027.30824, restoring external Harness chat creation and conversation, with all features and fixes from v0.16.0 included. Create scheduled tasks for all external Harnesses, with more reliable Windows updates, Thread deletion, and usage reporting.
    紧急修复 Codex Desktop 26.1027.30824 兼容性问题，恢复外部 Harness 聊天创建和对话，同时包含 v0.16.0 的全部功能与修复。支持给所有外部 Harness 创建定时任务，并改进 Windows 更新、Thread 删除和用量显示。
    Features
    - Schedule Harness tasks in local chats (#630).
    Fixes
    - Restore external Harness chat creation and conversation on Codex Desktop 26.1027.30824 (#660).
    - Prevent late-arriving queued messages from getting stuck after a Turn completes, and prevent stale Harness selections from affecting new chats after reconnection (#660).
    - Improve Windows one-click updates, installer process cleanup, and system proxy handling (#640, #652).
    - Complete local deletion of external Threads without deleting native Harness history (#646).
    - Keep Pi's effective Model selectable when absent from its available catalog, including reported thinking options (#634).
    - Include known cached input when calculating cache hit rates (#642).
    - Honor Claude Code's effective context window in usage reporting (#635).
    - Keep CodeBuddy history readable after compaction (#641).
    - Show DSH approval reasons in approval cards (#651).
    - Restore account information when a Composer's Host becomes ready.
    新功能
    - 本地聊天支持 Harness 定时任务 (#630)。
    修复
    - 修复 Codex Desktop 26.1027.30824 上外部 Harness 无法创建聊天和对话的问题 (#660)。
    - 修复 Turn 完成后才到达的排队消息停滞，以及重连后旧 Harness 选择影响新聊天的问题 (#660)。
    - 改进 Windows 一键更新、安装前进程清理和系统代理传递 (#640, #652)。
    - 完成外部 Thread 的本地删除，不删除 Harness 原生历史 (#646)。
    - Pi 当前实际使用的 Model 即使未列入可用目录仍可选择，并保留原生上报的思考选项 (#634)。
    - 缓存命中率计算计入已知的缓存输入 (#642)。
    - Claude Code 用量显示遵守会话实际生效的上下文窗口 (#635)。
    - CodeBuddy 压缩上下文后仍可读取历史 (#641)。
    - DSH 审批卡片展示审批原因 (#651)。
    - Composer 的 Host 就绪后恢复账号信息显示。
