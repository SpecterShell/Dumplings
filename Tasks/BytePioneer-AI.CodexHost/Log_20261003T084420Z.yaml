  Key: ReleaseNotes
  Value: |-
    What's New
    This release focuses on remote connections. Settings adds a Remote Connections page: enter a remote computer's connection details, then install and configure codexhost on it with one click. Sessions now stay in sync between your computer and the remote: a session started on one shows up on the other, and messages update live. ZCode is now supported as a Harness.
    本次更新重点优化了远程连接的能力。设置新增「远程连接」页面：填写远程电脑的连接信息，即可一键完成 codexhost 的安装和配置。本机与远程的会话实时同步：在一台电脑上发起的会话会出现在另一台上，消息实时更新。新增接入 ZCode。
    Features
    - Manage SSH remotes from Settings or the web console: add, edit, connect and remove computers, and install, update, restart, repair or uninstall the remote service with one click (#473)
    - Keep sessions in sync between your computer and an SSH remote that also runs Codex Desktop through codexhost
    - Add ZCode as a Harness on macOS, Windows and Linux, with Start Plan support (#407)
    - Install Harness CLIs from the Connections page, and import sessions from more Harnesses, including Kiro CLI, Grok, CodeBuddy, Kimi Code and Qoder (#459)
    - Support DSH 0.2.0-rc, Hermes usage and commands, and show live context usage for both (#456)
    - Upgrade from the terminal with codexhost update
    Fixes
    - Pass native Codex requests that codexhost does not handle to official Codex, and stop Codex Desktop from waiting forever when a request fails (#480, #481)
    - Release unused Harness prewarms so they no longer block new Claude Code sessions (#481)
    - Make remote setup and multi-Host use more reliable: find tools through the login shell, show remote host names, steer remote native tasks again, and keep each Host's Composer separate (#391, #466)
    - Improve DSH tool cards, permission mode selection and old-version prompts (#456, #475)
    - Create External tasks inside a Project on Codex Desktop 26.924 and later (#430)
    - Fix startup and install issues on macOS and when the Renderer debugging endpoint hangs (#333, #336, #457)
    - Clarify Harness login, configuration and version states on the Connections page, and hide unavailable entries from session import
    - Stop Antigravity results leaking between conversations and retrying region or quota rejections (#458)
    Breaking Changes
    - The console's default port changes from 26339 to 4399; set CODEXHOST_CONSOLE_PORT=26339 to keep the old address
    - DSH CLI versions below 0.1.7-rc.1 are no longer supported; the Connections page installs 0.2.0-rc.2 (#456)
    新功能
    - 在设置或 Web 控制台管理 SSH 远程电脑：添加、编辑、连接、移除，一键安装、更新、重启、修复或卸载远程服务 (#473)
    - 本机与 SSH 远程电脑的会话实时同步（远程电脑同样通过 codexhost 运行 Codex Desktop）
    - 新增 ZCode Harness，支持 macOS、Windows 和 Linux，并支持 Start Plan (#407)
    - 连接页可直接安装 Harness CLI，会话导入支持更多 Harness，包括 Kiro CLI、Grok、CodeBuddy、Kimi Code 和 Qoder (#459)
    - 支持 DSH 0.2.0-rc 及 Hermes 的 Usage 和命令，两者均显示实时上下文占用 (#456)
    - 终端运行 codexhost update 即可升级
    修复
    - codexhost 不处理的原生 Codex 请求转发给官方 Codex，请求出错时 Codex Desktop 不再一直等待 (#480, #481)
    - 释放未使用的 Harness 预热，不再阻塞新的 Claude Code 会话 (#481)
    - 远程安装和多 Host 更稳定：通过登录 shell 查找工具、显示远程主机名、远程原生任务可再次插话、各 Host 的 Composer 互相隔离 (#391, #466)
    - 改进 DSH 工具卡片、权限模式选择和旧版本提示 (#456, #475)
    - Codex Desktop 26.924 及以上版本可在 Project 内创建 External 任务 (#430)
    - 修复 macOS 及 Renderer 调试端点卡住时的启动和安装问题 (#333, #336, #457)
    - 连接页更清晰地区分 Harness 登录、配置和版本状态，会话导入隐藏不可用条目
    - Antigravity 不再串对话结果，也不再重试地区和额度类拒绝 (#458)
    破坏性变更
    - console 默认端口由 26339 改为 4399，如需沿用旧地址可设置 CODEXHOST_CONSOLE_PORT=26339
    - 不再支持低于 0.1.7-rc.1 的 DSH CLI，连接页安装的版本为 0.2.0-rc.2 (#456)
