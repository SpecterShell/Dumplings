  Value: |-
    Important
    npm 用户请注意： 由于 npm 官方原因，近三天 npm 上的版本暂时无法更新到最新版。如果您通过 npm 安装，请在本 Release 页面手动下载安装包安装（macOS 选择 DMG，Windows 选择 EXE）。之前通过 npm 安装的用户可以直接安装安装包，两者不冲突。
    Note for npm users: Due to an issue on the npm side, the npm version cannot be updated to the latest release for the next three days. If you installed via npm, please download the installer from this Release page (DMG for macOS, EXE for Windows). Existing npm installations do not conflict with the installer.
    What's New
    This release removes Codex multi-account capabilities and refocuses codexhost on its core purpose: bringing multiple Harnesses into Codex Desktop.
    本版本移除 Codex 多账号能力，重新明确 codexhost 的功能定位：专注于在 Codex Desktop 中接入和运行多个 Harness。
    Important Changes
    - Remove codexhost-managed Codex credential storage, login, logout, multi-account switching, inactive-account quota inspection, legacy startup proxying, and automatic credential import. Codex account lifecycle operations now use the official Codex experience.
    变更注意事项
    - 移除 codexhost 托管的 Codex 凭据存储、登录、退出、多账号切换、非当前账号额度查询、旧账号启动代理及凭据自动导入。Codex 账号生命周期操作现统一使用官方 Codex 体验。
