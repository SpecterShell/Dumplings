  Key: ReleaseNotes
  Value: |-
    What's New
    This release expands DSH compatibility, streams DSH reasoning live, and makes OMP subagent activity and conversations accessible in Codex Desktop. It also fixes SSH connections, Pi cancellation, and reopening DeepSeek sessions after retries.
    本版扩展 DSH 版本兼容，实时展示 DSH 思考，并让 OMP 子代理活动与对话可在 Codex Desktop 中查看。同时修复 SSH 连接、Pi 取消操作和 DeepSeek 重试后的会话恢复问题。
    Features
    - Support DSH 0.1.5-rc.3 and 0.1.7-rc.1, and select the V4 protocol for 0.1.7-rc.2 and later versions, subject to native protocol validation (#379, #388)
    - Stream DSH reasoning live and show full PowerShell commands with available output in expandable tool cards (#379)
    - Add a GitHub Star banner to the Updates page
    Fixes
    - Show OMP subagent activity and allow opening saved subagent conversations in Codex Desktop (#386)
    - Avoid prematurely closing Pi sessions while cancellation is still settling (#389)
    - Restore SSH connections when official Codex uses a symlinked socket (#380)
    - Reopen DeepSeek sessions whose history contains fractional LLM retry delays (#367, #390)
    - Refine GitHub support link icons and labels
    新功能
    - 支持 DSH 0.1.5-rc.3 和 0.1.7-rc.1；为 0.1.7-rc.2 及后续版本选择 V4 协议，兼容性仍由原生协议校验把关 (#379, #388)
    - 实时展示 DSH 思考，并在可展开的工具卡片中显示完整 PowerShell 命令及可用输出 (#379)
    - Updates 页面增加 GitHub Star 引导
    修复
    - 展示 OMP 子代理活动，并支持在 Codex Desktop 中打开已保存的子代理对话 (#386)
    - 避免 Pi 取消操作尚未完成收尾时过早关闭会话 (#389)
    - 修复官方 Codex 使用符号链接 socket 时的 SSH 连接 (#380)
    - 修复历史记录包含小数形式 LLM 重试延迟时，DeepSeek 会话无法重新打开的问题 (#367, #390)
    - 优化 GitHub 支持入口的图标与文案
