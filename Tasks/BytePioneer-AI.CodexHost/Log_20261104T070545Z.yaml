  Key: ReleaseNotes
  Value: |-
    What's New
    Fixes the severe slowdown introduced in v0.17.1 and restores compatibility with Codex Desktop 26.1029.
    修复 v0.17.1 引入的严重卡顿，并恢复对 Codex Desktop 26.1029 的兼容。
    Fixes
    - Fix severe lag and high CPU use while external Harness Threads are open (#732)
    - Detect native SSH, schedule, language and Thread creation services on Codex Desktop 26.1029 (#732)
    - Show a single Model button on external Harness Threads on Codex Desktop 26.1029 (#732)
    - Stop steered messages from lingering in the queue or showing it as paused (#732)
    - Keep an accepted Harness command from being reported as failed (#732)
    修复
    - 修复打开外部 Harness Thread 时严重卡顿和 CPU 占用过高的问题 (#732)
    - 在 Codex Desktop 26.1029 上恢复识别原生 SSH、计划任务、语言和 Thread 创建服务 (#732)
    - 在 Codex Desktop 26.1029 上，外部 Harness Thread 不再显示两个 Model 按钮 (#732)
    - 引导消息不再残留在队列中，也不再让队列显示暂停 (#732)
    - 已接受的 Harness 命令不再被报告为失败 (#732)
