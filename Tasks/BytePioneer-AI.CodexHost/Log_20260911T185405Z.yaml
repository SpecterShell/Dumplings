  Key: ReleaseNotes
  Value: |-
    What's New
    codexhost adds CodeBuddy and Cursor CLI integrations. This release also improves Antigravity quota and approval handling, Claude Code background Subagents, external Thread reliability, Pi compaction, Linux launch behavior, and update checks.
    codexhost 新增 CodeBuddy 和 Cursor CLI 集成。本版还改进了 Antigravity 配额和审批处理、Claude Code 后台 Subagent、外部 Thread 可靠性、Pi 上下文压缩、Linux 启动行为和更新检查。
    Features
    - Add CodeBuddy Harness support with Sessions, history, permissions, file observations, and Subagents (#254)
    - Add Cursor CLI Harness support with Sessions, Tasks, history, Subagents, and file diffs (#255)
    - Prioritize Antigravity's 5-hour quota window and localize model-specific quota labels (#256)
    Fixes
    - Preserve Claude Code background Subagent settlements, including their order and delivery outside active Turns (#253)
    - Route Antigravity tool approvals through Desktop and expose only native skip-permissions modes (#230)
    - Prevent stale Session recovery operations from overwriting newer Thread history mappings (#211)
    - Keep queued follow-up messages reliable in external Harness Threads
    - Allow Pi context compaction to complete without a fixed wall-clock timeout
    - Start managed Codex Desktop in an independent process session on Linux (#259)
    - Keep multi-account Thread lists isolated using exact account page prefixes (#264)
    - Use authenticated GitHub CLI access for GitHub Release update checks (#156)
    新功能
    - 新增 CodeBuddy Harness，支持 Session、历史记录、权限交互、文件观察和 Subagent (#254)
    - 新增 Cursor CLI Harness，支持 Session、Task、历史记录、Subagent 和文件 Diff (#255)
    - Antigravity 配额展示优先使用 5 小时窗口，并本地化模型专属额度标签 (#256)
    修复
    - 保留 Claude Code 后台 Subagent settlement，确保其顺序正确且可在活跃 Turn 之外送达 (#253)
    - 通过 Desktop 处理 Antigravity 工具审批，并只提供原生支持的 skip-permissions 模式 (#230)
    - 防止过期的 Session 恢复操作覆盖较新的 Thread 历史映射 (#211)
    - 保证外部 Harness Thread 中排队的 follow-up 消息可靠送达
    - Pi 上下文压缩不再受固定 wall-clock timeout 限制
    - Linux 上在独立进程 Session 中启动受管理的 Codex Desktop (#259)
    - 使用精确的账号页面前缀隔离多账号 Thread 列表 (#264)
    - 使用已认证的 GitHub CLI 检查 GitHub Release 更新 (#156)
