  Key: ReleaseNotes
  Value: |-
    What's New
    This release adds compatibility with the latest Codex Desktop (26.924) and moves the codexhost entry into Codex Desktop's new navigation rail.
    本版兼容最新的 Codex Desktop（26.924），并将 codexhost 入口移至 Codex Desktop 新的左侧导航栏。
    Improvements
    - Move the codexhost entry into the new left navigation rail, directly above More, with a line icon that matches the native rail icons; available updates now show as a badge on the icon
    Fixes
    - Launch with Codex Desktop 26.924 and later, which moved the bundled Codex CLI into its own app bundle; earlier Codex Desktop versions remain supported
    - Let external Harnesses send messages again when Codex usage is exhausted on Codex Desktop 26.924
    优化
    - codexhost 入口移至新的左侧导航栏，位于"更多"上方，图标改为与原生导航图标一致的线条风格；有可用更新时在图标上显示提示点
    修复
    - 支持启动 Codex Desktop 26.924 及后续版本（该版本将内置 Codex CLI 移入独立的 App 包），旧版 Codex Desktop 仍可正常使用
    - 修复 Codex Desktop 26.924 下 Codex 用量耗尽时，外部 Harness 无法发送消息的问题
