  Key: ReleaseNotes
  Value: |-
    What's New
    Hermes now includes global usage statistics. This release also fixes session recovery, cross-Harness reads, Claude Code history, SSH remote updates and Codex usage reporting.
    Hermes 新增全局用量统计。本版还修复了会话恢复、跨 Harness 读取、Claude Code 历史记录、SSH 远程更新和 Codex 用量统计问题。
    Features
    - Add global Hermes usage statistics from native session data (#516)
    Fixes
    - Prevent duplicate Harness Sessions when recovering an idle External Thread after a failure (#513)
    - Allow same-host cross-Harness Thread reads (#511)
    - Preserve Claude Code conversation history after an autonomous turn fails (#515)
    - Clean up SSH remote update helpers after a startup timeout (#510)
    - Include all Codex sessions in usage statistics (#519)
    新功能
    - Hermes 新增全局用量统计 (#516)
    修复
    - 修复恢复空闲 Thread 时可能重复启动 Harness Session 的问题 (#513)
    - 修复同一主机上无法跨 Harness 读取 Thread 的问题 (#511)
    - 修复 Claude Code 自主运行失败后无法读取对话历史的问题 (#515)
    - 修复 SSH 远程更新启动超时后辅助进程残留的问题 (#510)
    - 修复部分 Codex 会话未显示在用量统计中的问题 (#519)
