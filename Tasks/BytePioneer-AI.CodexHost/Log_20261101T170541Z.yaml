  Key: ReleaseNotes
  Value: |-
    What's New
    Add Devin CLI and Qwen Code. Also improve Pi progress visibility, local image display, and Desktop and remote connection reliability.
    加入 Devin CLI 与 Qwen Code。同时改善 Pi 进度展示、本地图片显示，以及 Desktop 和远程连接的稳定性。
    Features
    - Add Devin CLI with native sessions, streaming output, tools, approvals, and session import (#364)
    - Add Qwen Code through its official SDK, with native Model and Permission Mode selection and conversation resume (#127)
    - Show the Grok subscription name on the account page (#666)
    Fixes
    - Display relative local images in external Harness replies and restore user attachment thumbnails, including history replay (#604)
    - Preserve image references when sending messages or adding input to a running external Thread (#654)
    - Keep Pi message and subagent identities stable across live output and history; show native notifications, retries, and autonomous execution progress without duplicating streamed text (#697)
    - Keep slow usage queries from blocking Thread interactions and refresh the selected Harness's credits after Host reconnection (#697, #653)
    - Improve Desktop connection recovery and external draft routing, and exclude stale Renderer contexts (#663, #692)
    - Support Qoder CLI 1.1.81+ and reliably load the native Model catalog for each project, including on a fresh daemon (#662, #694)
    - Stop Claude Code's native execution when cancelling a Turn after a steering message, and preserve API failures when reopening conversations (#690, #695)
    - Avoid duplicate Antigravity replies and keep Cursor background notifications from changing Turn or checkpoint identity (#696, #683)
    - Keep WorkBuddy context-injection records in the correct Turn and allow a slow DeepSeek Harness to finish starting (#655, #664)
    - Connect Hermes delegation to its resident gateway and make delegation arguments, long waits, and paginated Thread lists more reliable (#668, #671, #670, #673)
    - Detect an existing stock Codex app-server without timing out during remote Host startup (#112)
    - Let native app tools use Desktop-signed Node on macOS and remove the external MSVC runtime requirement for Windows executables (#593)
    - Make CLI help, version, broker, and remote usage output consistent; enforce the supported Node.js range for npm and SSH hosts (#680, #675)
    - Recover from corrupt Harness launch settings and isolate unreadable Thread metadata instead of blocking normal use (#672, #676)
    - Keep session import sources aligned with the selected Host's available Harnesses
    新功能
    - 新增 Devin CLI，支持原生会话、流式输出、工具、审批与会话导入 (#364)
    - 通过官方 SDK 接入 Qwen Code，支持原生 Model、Permission Mode 选择与会话续接 (#127)
    - 账号页面显示 Grok 订阅名称 (#666)
    修复
    - 外部 Harness 回复中的相对路径本地图片可正常投影显示，用户附件恢复缩略图，历史回放保持一致 (#604)
    - 发送消息及向运行中的外部 Thread 追加输入时保留图片引用 (#654)
    - Pi 实时输出与历史保持消息及子代理身份一致；展示原生通知、重试与自主执行进度，避免流式正文重复 (#697)
    - 较慢的用量查询不再阻塞 Thread 交互，Host 重连后刷新当前 Harness 额度 (#697, #653)
    - 改善 Desktop 连接恢复与外部草稿路由，排除失效 Renderer 上下文 (#663, #692)
    - 兼容 Qoder CLI 1.1.81+，按项目可靠加载原生 Model 目录，包括 daemon 刚启动的情况 (#662, #694)
    - Claude Code 发送调整方向消息后取消 Turn 时，停止对应原生执行；重新打开会话时保留 API 失败状态 (#690, #695)
    - 避免 Antigravity 重复显示回复，防止 Cursor 后台通知改变 Turn 与检查点身份 (#696, #683)
    - WorkBuddy 上下文注入记录归属正确 Turn，DeepSeek Harness 启动较慢时可继续等待完成 (#655, #664)
    - Hermes 委派连接常驻 gateway，改善委派参数、长时间等待及 Thread 列表分页 (#668, #671, #670, #673)
    - 远程 Host 启动时，检测已有官方 Codex app-server 不再因握手超时失败 (#112)
    - macOS 原生应用工具使用 Desktop 签名的 Node，Windows 可执行文件无需额外安装 MSVC 运行库 (#593)
    - 统一 CLI 帮助、版本、broker 与远程命令用法输出，npm 和 SSH Host 使用一致的受支持 Node.js 版本范围 (#680, #675)
    - 损坏的 Harness 启动设置可重新保存，不可读的 Thread 元数据被隔离而不阻塞正常使用 (#672, #676)
    - 会话导入来源与所选 Host 实际可用的 Harness 保持一致
