  Key: ReleaseNotes
  Value: |-
    What's New
    codexhost v0.9.2 adds Pi account credential imports and subagent transcripts, Harness installation guides in Settings, and a redrawn app icon, alongside several connection and Composer stability fixes.
    codexhost v0.9.2 新增 Pi 账号凭据导入、子代理工作流记录、设置中的 Harness 安装指引和重绘的应用图标，并修复多个连接与 Composer 稳定性问题。
    Features
    - Add Harness installation guides in Settings > Connections
    - Import Pi account credentials in Settings > Accounts, with a clearer account list
    - Show Pi subagent workflows and child transcripts
    - Redraw the app icon as a crisper vector graphic
    Fixes
    - Honor Claude Code's modelPicker.options in model discovery so custom gateway models show up (#342)
    - Keep Composer footer chips (Model/Permission/Usage/Credits) from overlapping when the sidebar opens or the window narrows (#284, #343)
    - Preserve the selected Harness across new or replaced drafts
    - Prioritize the active Harness and Model when loading
    - Resolve remote Claude executables through Adapter discovery
    - Keep connection error details from overflowing
    - Decouple Host connections from Composer routing
    - Scope CodeBuddy's "always approve" choice to the current session
    新功能
    - 设置 > 连接 中新增 Harness 安装指引
    - 设置 > 账号 支持导入 Pi 账号凭据，账号列表展示更清晰
    - 显示 Pi 子代理的工作流和子会话记录
    - 重绘应用图标，线条更清晰
    修复
    - 模型选择器正确读取 Claude Code 的 modelPicker.options,自定义网关模型可正常显示 (#342)
    - 打开侧边栏或缩小窗口时，Composer 底部的模型/权限/用量/额度标签不再重叠 (#284, #343)
    - 新建或替换草稿时保留已选择的 Harness
    - 优先加载当前激活的 Harness 和模型
    - 通过 Adapter 发现机制解析远程 Claude 可执行文件
    - 修复连接错误详情溢出显示的问题
    - Host 连接与 Composer 路由解耦
    - CodeBuddy 的"始终允许"选择仅在当前会话内生效
