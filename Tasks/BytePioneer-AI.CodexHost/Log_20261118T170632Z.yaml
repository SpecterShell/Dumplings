  Key: ReleaseNotes
  Value: |-
    What's New
    Claude Code now projects MCP tools and web searches as native Codex items, offers per-model thinking options, and forwards Desktop image attachments. Pi and OMP gain native tool-boundary steering, Web adds an open-containing-folder action and remote thread usage, and Antigravity history loading moves to native SQLite.
    Claude Code 现已支持将 MCP 工具与网络搜索投影为原生 Codex 项、按模型提供思考选项并透传 Desktop 图片附件。Pi 与 OMP 新增原生工具边界插话（steering），Web 新增“打开所在文件夹”与远程 Thread Usage 显示，Antigravity 历史读取也切换为原生 SQLite。
    Features
    - Native Claude Code MCP tools, web searches, and image attachments: project MCP tool calls and web searches as native Codex items with failed-search durations preserved, and send Desktop image attachments as native image blocks (#914, #917)
    - Per-model Claude Code thinking options: derive per-model thinking effort options from native capabilities and keep options updated across selections (#915)
    - Native tool-boundary steering for Pi and OMP: steer active Pi and OMP sessions at tool boundaries while retaining delivery receipts and ensuring clean session shutdown (#409)
    - Open containing folder in Web: add an action in the Web file preview bar to open the containing folder and bring it to the foreground (#907)
    Fixes
    - Claude Code queued input and malformed history: confirm queued input persistence by source UUID and report malformed history as a protocol error (#901)
    - Antigravity history and turn recovery: read Antigravity history from native SQLite instead of ACP replay, prevent stale turn drops, and avoid duplicate nativeTurnKey fallbacks across history gaps (#908)
    - Remote Web thread usage: display usage for remote threads and keep it refreshed across same-second turns and reconnects (#912)
    - Grok model catalog refresh: refresh native Grok model catalogs after startup (#900)
    - Launcher, Updater, and Desktop Control stability: report staged stop-for-update errors with Host chain timeout diagnostics, preserve the recorded shared data directory across SSH repair, and bound the V8 inspector script cache when reading the Renderer module catalog (#913, #916, #918)
    新功能
    - Claude Code 原生投影 MCP 工具、网络搜索与图片附件： 将 MCP 工具调用与网络搜索投影为原生 Codex 项并保留失败搜索耗时，同时将 Desktop 图片附件作为原生图片块发送 (#914, #917)
    - Claude Code 按模型提供思考选项： 根据各模型原生能力生成对应的思考强度选项，并在选项切换时保持状态同步 (#915)
    - Pi 与 OMP 原生工具边界插话（steering）： 支持在工具执行边界对运行中的 Pi 与 OMP 会话进行插话引导，保留投递回执并确保会话清理时正常关闭 (#409)
    - Web 支持打开所在文件夹： 在 Web 文件预览栏新增“打开所在文件夹”按钮，并支持前置激活对应窗口 (#907)
    修复
    - Claude Code 排队输入与异常历史处理： 通过 source UUID 确认排队输入持久化状态，并将格式异常的历史记录上报为协议错误 (#901)
    - Antigravity 历史读取与轮次恢复： 改用原生 SQLite 读取历史而非 ACP 回放，防止陈旧轮次被误丢弃，并避免历史缺口时重复生成兜底的 nativeTurnKey (#908)
    - Web 远程 Thread Usage 显示： 为远程 Thread 展示 Usage 信息，并在同秒多轮对话及重连时持续刷新 (#912)
    - Grok 模型目录刷新： 修复 Grok 启动后原生模型目录的刷新逻辑 (#900)
    - Launcher、Updater 与 Desktop Control 稳定性： 细化更新停服报错与 Host 链超时诊断，在 SSH 修复期间保留已记录的共享数据目录，并限制读取 Renderer 模块目录时的 V8 inspector 脚本缓存占用 (#913, #916, #918)
