  Key: ReleaseNotes
  Value: |-
    What's New
    Composer adds a # menu for delegation targets, Harness commands, and skills. Kimi Code joins the preinstalled Harnesses. This release also improves update feedback and fixes external Harness submission when Codex subscription usage is exhausted.
    Composer 新增 # 菜单，可查找委派目标、Harness 命令和技能。Kimi Code 加入预装 Harness。本版还改进了更新提示，并修复 Codex 订阅额度耗尽时外部 Harness 无法发送消息的问题。

    Features
    - Use the Composer # menu to find delegation targets and Harness commands and skills from the current workspace (#372, #373)
    - Add Kimi Code integration with native session history, model and Thinking configuration, commands, forking, and last-turn revision (#335)
    - Make update controls less intrusive while keeping manual download available when an update fails
    - Allow newer DeepSeek Harness CLI versions after protocol compatibility checks
    Fixes
    - Allow external Harnesses to submit messages when Codex subscription usage is exhausted, without removing Codex's own limits (#378)
    - Keep Composer controls and open menus stable when Desktop replaces the send button or Renderer connectivity changes (#369, #370, #371)
    - Keep sidebar Agent icons aligned with thread titles when Desktop wraps them (#362)
    - Preserve the source permission mode when forking external Threads
    - Keep update status tracking after request timeouts and direct failed updates to GitHub Releases
    - Limit attachment recovery retries when the Launcher reconnects
    - Use Kimi Code's current ACP Thinking options instead of assuming a fixed list
    新功能
    - Composer 新增 # 菜单，统一查找委派目标以及当前工作区的 Harness 命令和技能 (#372, #373)
    - 新增 Kimi Code 集成，支持原生会话历史、模型及 Thinking 配置、命令、分叉和上一轮消息修订 (#335)
    - 更新入口更简洁，更新失败时仍可手动下载安装包
    - DeepSeek Harness CLI 新版本通过协议兼容检查后也可使用
    修复
    - Codex 订阅额度耗尽时仍可通过外部 Harness 发送消息，同时保留 Codex 自身的额度限制 (#378)
    - Desktop 替换发送按钮或 Renderer 连接发生变化时，Composer 控件及已打开的菜单不再闪烁或意外关闭 (#369, #370, #371)
    - Desktop 中会话标题换行时，侧边栏 Agent 图标仍与标题对齐 (#362)
    - 分叉外部 Thread 时保留来源会话的权限模式
    - 更新请求超时后继续跟踪状态，更新失败时引导至 GitHub Releases
    - 限制 Launcher 重连时的附件恢复重试
    - 使用 Kimi Code 当前通过 ACP 提供的 Thinking 选项，不再假定固定列表
