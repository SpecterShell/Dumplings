  Key: ReleaseNotes
  Value: |-
    Important
    npm 用户请注意： 由于 npm 侧的问题，npm 版本暂时无法更新到最新版。如果您通过 npm 安装，请在本 Release 页面的 Assets 中下载对应安装包（macOS 选择 DMG，Windows 选择 EXE）。之前通过 npm 安装的用户可以直接安装，两者不冲突。
    Note for npm users: Due to an issue on the npm side, the npm package is temporarily unable to update to the latest release. If you installed via npm, please download the matching installer from this release's Assets (DMG for macOS, EXE for Windows). You can install it directly alongside an existing npm installation; the two do not conflict.
    What's New
    Qoder Global and CN join codexhost, alongside native Claude Code session import, model favorites, and optional idle resource release. This release also improves file-change summaries, remote conversations, and Harness startup reliability.
    Qoder Global 和 CN 加入 codexhost，同时带来 Claude Code 原生会话导入、模型收藏和可选的空闲资源释放。本版还改善了文件变更汇总、远程对话和 Harness 启动稳定性。
    Features
    - Add Qoder Global and CN Harnesses with native model selection, permission modes, conversation history, and context compaction (#289)
    - Import native Claude Code sessions into Codex Desktop
    - Save favorite models and pin them immediately in the model picker
    - Optionally release idle external Harness sessions and view loaded sessions in resource settings (#303)
    - Place uninstalled Harnesses last in the Agent picker (#307)
    Fixes
    - Improve file-change summaries across external Harnesses, including repeated edits and file deletions (#231)
    - Keep Subagent Threads active while their Subagents are still running (#249)
    - Restore side-chat routing and reduce unnecessary sidebar scans (#302)
    - Fix Remote SSH Composer routing and native Thread recovery through POSIX relays (#282, #273)
    - Keep Harnesses available when another plugin is slow to load, and avoid blocking Desktop requests during loading (#295)
    - Refresh account quota after a Turn completes and keep Usage subscriptions connected
    - Keep settings below the Windows titlebar and position the settings button before native header actions (#200, #250)
    - Preserve official Computer History summarizer routing (#204)
    - Restore macOS node_repl sandbox startup with a sanitized environment (#278)
    - Isolate OpenCode's managed server working directory (#272)
    - Handle CodeBuddy history where a tool result appears before its call (#298)
    - Detect DeepSeek Harness versions even when Node.js emits warnings (#300)
    新功能
    - 新增 Qoder Global 和 CN Harness，支持原生模型选择、权限模式、对话历史和上下文压缩 (#289)
    - 支持将 Claude Code 原生会话导入 Codex Desktop
    - 支持收藏模型，并在模型选择器中即时置顶
    - 可选择释放空闲的外部 Harness 会话，并在资源设置中查看已加载会话 (#303)
    - 未安装的 Harness 排到 Agent 选择器末尾 (#307)
    修复
    - 改善外部 Harness 的文件变更汇总，正确处理重复编辑与文件删除 (#231)
    - Subagent 仍在运行时，其 Thread 保持运行状态 (#249)
    - 修复侧边聊天路由，减少不必要的侧栏扫描 (#302)
    - 修复 Remote SSH Composer 路由及通过 POSIX 中继恢复原生 Thread 的问题 (#282, #273)
    - 避免单个插件加载缓慢导致其他 Harness 不可用，并避免加载过程阻塞 Desktop 请求 (#295)
    - Turn 完成后刷新账号额度，并保持 Usage 订阅正常连接
    - 设置弹窗不再遮挡 Windows 标题栏，设置按钮排列在原生标题栏操作之前 (#200, #250)
    - Computer History 摘要继续使用官方处理路径 (#204)
    - 修复 macOS 精简环境下 node_repl 沙箱无法启动的问题 (#278)
    - 隔离 OpenCode 托管服务的工作目录 (#272)
    - 正确处理工具结果先于调用记录出现的 CodeBuddy 历史 (#298)
    - Node.js 输出警告时仍能正确识别 DeepSeek Harness 版本 (#300)
