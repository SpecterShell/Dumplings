  Key: ReleaseNotes
  Value: |-
    What's New
    This release significantly expands native Harness integration: WorkBuddy joins codexhost, while Cursor, CodeBuddy, and Hermes gain richer native session, command, history, and delegation support. It also improves reliability for Antigravity, OMP, Qoder, and Harness discovery, and unifies the app and installer branding.
    本版大幅扩展了原生 Harness 集成：新增 WorkBuddy，并增强 Cursor、CodeBuddy 和 Hermes 的原生会话、命令、历史记录与委派能力。同时改进 Antigravity、OMP、Qoder 和 Harness 发现的稳定性，并统一应用与安装包的品牌图标。
    Features
    - Add the WorkBuddy Harness, including automatic discovery of Windows and user-installed macOS applications
    - Fork Cursor native historical sessions and reduce session startup latency
    - Add Cursor thinking commands and outbound delegation
    - Add native CodeBuddy commands, delegation discovery, and native fork and revision sessions
    - Add verified Hermes native gateway sessions with precise history, native file diffs, and context commands
    - Unify codexhost application and installer icons across supported platforms
    Fixes
    - Restore native fork positions after an ACP reload (#334)
    - Show WorkBuddy's native product model catalog, including on Windows
    - Keep WorkBuddy project paths and derived sessions aligned with its native application
    - Make CodeBuddy, Cursor, and Hermes native commands available reliably, including commands that require input
    - Preserve Hermes custom-provider model references and model catalogs, and avoid opening sessions after shutdown
    - Release stuck Antigravity subagent sessions and reject invalid observation timeouts (#330)
    - Preserve OMP native question details and timeouts, and tolerate late tool events from background jobs (#332)
    - Require the Qoder CLI instead of falling back to editor launchers (#329)
    - Preserve the selected Node runtime in the Harness process PATH (#326)
    - Place uninstalled Harnesses in the More section of the model picker
    新功能
    - 新增 WorkBuddy Harness，并自动发现 Windows 及用户安装的 macOS 应用
    - 支持 Fork Cursor 原生历史会话，并缩短会话启动时间
    - Cursor 新增 thinking 命令和向外委派能力
    - CodeBuddy 新增原生命令、委派发现，以及原生 Fork 和修订会话
    - Hermes 新增经验证的原生 Gateway 会话、精确历史记录、原生文件差异和上下文命令
    - 统一各平台 codexhost 应用和安装包图标
    修复
    - ACP 重载后可恢复原生 Fork 的位置 (#334)
    - 可显示 WorkBuddy 的原生产品模型目录，包括 Windows 平台
    - WorkBuddy 的项目路径和派生会话与原生应用保持一致
    - CodeBuddy、Cursor 和 Hermes 的原生命令可稳定显示和使用，包括需要输入的命令
    - 保留 Hermes 自定义 Provider 模型引用和模型目录，并避免 Adapter 关闭后继续打开会话
    - 释放卡住的 Antigravity 子代理会话，并拒绝无效的观察超时设置 (#330)
    - 保留 OMP 原生问题的详情和超时语义，并兼容后台任务迟到的工具事件 (#332)
    - Qoder 必须使用 CLI，不再回退到编辑器 Launcher (#329)
    - 在 Harness 进程 PATH 中保留所选 Node runtime (#326)
    - 未安装的 Harness 会归入模型选择器的 More 分组
