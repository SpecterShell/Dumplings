  Key: ReleaseNotes
  Value: |-
    What's New
    Grok now projects native Subagents into Codex Desktop, DeepSeek Harness supports the current DSH RC protocols, and Accounts settings have been redesigned. This release also improves delegation workflows, Kiro model selection, thinking transcript readability, and Harness error reporting.
    Grok 现可将原生 Subagent 投影到 Codex Desktop，DeepSeek Harness 支持当前 DSH RC 协议，Accounts 设置也完成了重新设计。本版还改进了 delegation 工作流、Kiro 模型选择、Thinking transcript 可读性和 Harness 错误报告。
    Features
    - Project native Grok Subagents with their status, Model, thinking level, and read-only transcript history (#104)
    - Support DSH 0.1.2-rc.1 and 0.1.5-rc.1 in DeepSeek Harness (#242)
    - Keep Kiro model selection reliable when the native model catalog arrives asynchronously
    - Add optional soft wrapping for Thinking transcripts in Appearance settings (#240)
    - Provide compact delegation CLI output, command-specific help, and Harness discovery
    - Redesign Accounts settings with clearer account details, usage periods, reset information, and account management
    Fixes
    - Preserve the resolved working directory when starting delegated Threads (#137)
    - Restore DeepSeek V3 Sessions reliably and confirm native persistence before recovery or rollback (#242)
    - Show structured native turn errors from Antigravity
    - Keep renderer settings loading safely when a document has no window
    Breaking Changes
    - Remove the DeepSeek Harness Legacy implementation. DeepSeek Harness now accepts only DSH 0.1.2-rc.1 and 0.1.5-rc.1 (#242)
    新功能
    - Grok 原生 Subagent 会显示状态、Model、Thinking 档位和只读 transcript 历史 (#104)
    - DeepSeek Harness 支持 DSH 0.1.2-rc.1 与 0.1.5-rc.1 (#242)
    - Kiro 原生模型目录异步到达时，模型选择仍可可靠确认
    - Appearance 设置支持为 Thinking transcript 启用软换行 (#240)
    - delegation CLI 提供紧凑输出、按命令帮助和 Harness 发现
    - 重新设计 Accounts 设置，优化账户详情、用量周期、重置时间和账户管理
    修复
    - 启动 delegated Thread 时保留解析后的工作目录 (#137)
    - DeepSeek V3 Session 可可靠恢复，并在恢复或回滚前确认原生持久化完成 (#242)
    - Antigravity 可显示原生返回的结构化 Turn 错误
    - document 没有 window 时，Renderer 设置仍可安全加载
    破坏性变更
    - 移除 DeepSeek Harness Legacy 实现。DeepSeek Harness 现在只接受 DSH 0.1.2-rc.1 和 0.1.5-rc.1 (#242)
