  Key: ReleaseNotes
  Value: |-
    What's New
    Hermes is now available in codexhost, and Codex supports native multi-account switching.
    新增 Hermes，实现 Codex 原生多账户切换能力。
    Features
    - Add Hermes as a native ACP Harness (#206)
    - Add native multi-account switching for Codex (#262)
    - Load and display each Harness account quota as soon as it is available
    Fixes
    - Keep Hermes sessions, approvals, cancellation, model selection, and warmed startup stable across Threads (#206)
    - Restore the current Codex Thread after switching accounts (#262)
    - Let OpenCode start its managed server from a writable working directory (#266)
    - Settle Claude Code background-subagent turns after they complete (#267)
    - Improve diagnostics when Codex Desktop filters the Host runtime environment (#143)
    新功能
    - 新增 Hermes 原生 ACP Harness (#206)
    - 新增 Codex 原生多账户切换能力 (#262)
    - Harness 账号额度逐项加载，任一结果返回后立即显示
    修复
    - 修复 Hermes 跨 Thread 的会话、审批、取消、模型选择和预热启动稳定性问题 (#206)
    - 切换 Codex 账号后恢复当前 Thread (#262)
    - OpenCode 可在可写工作目录中启动受管服务 (#266)
    - Claude Code 后台子代理完成后会正确结束对应 Turn (#267)
    - 改进 Codex Desktop 过滤 Host 运行时环境时的诊断信息 (#143)
