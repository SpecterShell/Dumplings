  Key: ReleaseNotes
  Value: |-
    What's New
    Claude Code now supports Ultracode, so you can follow the progress of multiple agents working in parallel and open their conversations. You can also view local usage statistics in Desktop settings and check estimated costs, cache usage and output speed in official Codex conversations. This release also improves task cancellation, app updates and tool compatibility.
    Claude Code 现在支持 Ultracode，可以查看多个智能体并行工作的进度，也能点开各自的对话。Desktop 设置里可以查看本机用量统计，官方 Codex 对话也能查看估算费用、缓存使用情况和输出速度。此外，还修复了任务取消、应用更新和部分工具无法正常使用的问题。
    Features
    - Add Claude Code's Ultracode thinking option, with availability checks and actionable errors instead of silent fallback; requires Claude Code 2.1.154 or later, Dynamic workflows enabled and a supported model (#488)
    - Show Claude Code Workflow subagents with live status, permission approvals and read-only subthreads available as soon as they start (#488)
    - Add local usage statistics and model price editing to Desktop settings, sharing the same interface as the local console
    - Meter official Codex session costs and cache usage, with time to first output and output speed when reliable timing is available
    - Show readable session titles and projects in usage statistics, including Desktop-saved titles, with recent sessions listed before top usage sessions
    - Order the Harness picker and settings by discovered plugins rather than a fixed built-in list
    Fixes
    - Show clear feedback when a model or thinking-option switch is rejected, preserving the previous selection
    - Stop Claude Code background subagents and Workflows when cancelling a turn, and recover the session for the next message after a confirmed forced shutdown
    - Retain the last valid Host-metered output speed while waiting for tools or starting a new turn
    - Reduce sidebar scanning and Host routing overhead
    - Keep update status tied to the current operation and wait for the updater handoff before exiting
    - Restore Pi Bash confirmation dialogs without prematurely completing the command (#508)
    - Recover stale or unsupported OMP thinking levels during session startup (#509)
    - Avoid intercepting native submissions when a Composer cannot be classified, closing a remaining Dots / Orbit submission-blocking path (#505)
    - Fix Windows sandbox callback startup when official tools clear CLI path environment variables (#507)
    新功能
    - Claude Code 新增 Ultracode 思考档位，检查是否实际生效，不再静默降级，并提供明确的错误提示；需要 Claude Code 2.1.154 及以上、开启 Dynamic workflows 且使用支持的模型 (#488)
    - Claude Code Workflow 子智能体显示实时状态和权限审批，开始运行后即可打开只读子线程 (#488)
    - Desktop 设置新增本机用量统计和模型价格编辑，与本地控制台使用同一套界面
    - 官方 Codex 会话支持费用和缓存用量计量，并在有可靠计时数据时显示首次输出时间和输出速度
    - 用量统计显示易读的会话标题和项目，优先采用 Desktop 已保存的标题，最近会话排在最耗会话之前
    - Harness 选择器和设置按已发现的插件排序，不再使用固定的内置列表
    修复
    - 模型或思考档位切换被拒绝时显示明确提示，并保留原来的选项
    - 取消回合时停止 Claude Code 后台子智能体和 Workflow；确认强制关闭进程后，下一条消息可自动恢复会话
    - 工具等待或新回合开始时，保留 Host 计量的最近有效输出速度
    - 减少侧边栏扫描和 Host 路由开销
    - 更新状态仅反映当前操作，退出前等待更新器完成接管
    - 修复 Pi Bash 确认对话框，作答后不会提前结束命令 (#508)
    - OMP 会话启动时可恢复过期或不受支持的思考档位 (#509)
    - 无法确认 Composer 类型时不再拦截原生提交，补齐 Dots / Orbit 无法发送问题的防护 (#505)
    - 修复 Windows 官方工具清空 CLI 路径环境变量后，sandbox 回调无法启动的问题 (#507)
