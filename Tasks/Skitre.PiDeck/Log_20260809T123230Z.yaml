  Value: |-
    PiDeck v0.1.7
    本次更新带来完整的 Apple 风格主题，并同步升级 macOS 与 Windows 的原生窗口质感。
    Apple 主题
    - 新增 Apple 主题，支持浅色、深色和跟随系统，并提供新的主题预览选择器。
    - 统一侧边栏、对话顶栏、编辑器、设置页、工具卡片和右侧 Dock 的 macOS 风格层级与细节。
    - 左侧边栏使用更轻的磨砂材质；“新对话”调整位置，并取消 Apple 主题下的实色底板。
    - 对话顶栏下缘改为渐进模糊过渡，减少硬边界感。
    原生窗口与跨平台适配
    - 普通窗口新增圆角轮廓，最大化和全屏时自动贴合屏幕边缘，适用于 PiDeck、Vercel 和 Apple 三个主题。
    - macOS 使用系统背景材质并调整红绿灯位置。
    - Windows 新增 Acrylic 磨砂效果，并补齐圆角、最大化/全屏和侧边栏透明材质适配。
    - 为减少透明度偏好和不支持材质的环境保留清晰的不透明回退。
    候选安装包
    - Windows x64
    - macOS Apple Silicon
    - macOS Intel
    完整变更：https://github.com/Skitre/PiDeck/compare/v0.1.6...v0.1.7
