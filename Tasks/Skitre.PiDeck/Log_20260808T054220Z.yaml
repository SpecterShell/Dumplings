  Key: ReleaseNotes
  Value: |-
    PiDeck v0.1.6
    本次更新集中修复会话压缩后的状态问题，并优化部分界面细节。
    修复
    - 修复会话压缩后可能因 Invalid outbound session.snapshot payload 而无法再次打开的问题。
    - 已受影响的会话无需手动修改或删除数据，升级后即可直接重新打开。
    - 修复压缩后上下文使用量显示为未知的问题；精确数据恢复前会显示带 ~ 标记的本地估算值。
    界面优化
    - 将代码块语言标题整合到代码块内部，并调整复制按钮位置。
    - 缩小英文设置页 “Back to conversation” 的字号，避免换行。
    - 右侧 Dock 展开/折叠按钮默认隐藏，在悬停或键盘聚焦时显示。
