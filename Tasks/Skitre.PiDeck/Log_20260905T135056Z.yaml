  Key: ReleaseNotes
  Value: |-
    PiDeck v0.3.0
    本次更新主要改进扩展 UI 的布局与交互：扩展组件可以在主界面、Dock 和浮窗之间移动，浮窗也可以成为独立系统窗口。同时新增模型思考级别快捷控制和系统通知，并修复多项 Windows 与 macOS 窗口问题。
    扩展 UI 与独立浮窗
    - 支持配置扩展组件的展示位置，通过拖动或菜单在主界面、Dock 和浮窗之间切换。
    - 拖动时高亮可放置区域，优化组件菜单和首次使用提示。
    - 支持将浮窗分离为独立系统窗口，改进拖动区域、前后层级和窗口位置保存。
    - 扩展组件支持结构化内容与操作按钮，并加强操作来源校验。
    - 改进扩展 UI 的恢复与清理，修复浮窗打开、关闭和布局切换时的状态不同步问题。
    对话体验
    - 可以在输入区直接调整模型的思考级别。
    - 新增系统通知：PiDeck 位于后台时，可在回复完成、需要输入或执行失败时发送提醒；支持在设置中开关。
    - 修复通知初始化和临时发送失败可能影响后续提醒的问题。
    - 隐藏扩展组件中不应展示的内部传输信息。
    平台修复
    - Windows：修复不同缩放比例显示器之间的浮窗定位与尺寸换算问题。
    - Windows：改进凭据文件短暂被占用时的保存重试。
    - macOS：改进全屏切换与窗口状态处理。
    候选安装包与已知限制
    - 提供 Windows x64、macOS Apple Silicon 和 macOS Intel 安装包，三个平台的 CI 构建与打包检查均已通过。
    - 当前附件为候选安装包，安装、从 v0.2.2 升级及自动更新仍待实机验收。
    - macOS 包使用 ad-hoc 签名，尚未公证，可能被 Gatekeeper 阻止。
    - Windows 开发版已确认通知进入通知中心，但尚未观察到右下角横幅；桌面端点击通知跳转会话目前不可用。
    完整变更：v0.2.2 → v0.3.0
