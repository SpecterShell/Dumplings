  Key: ReleaseNotes
  Value: |-
    PiDeck v0.1.8
    本次更新重点改善会话连续性、跨工作区检索、思考与工具信息展示，并新增 Pi 包市场。
    草稿与会话体验
    - 对话草稿会按工作区和会话自动保存，切换会话或重新启动 PiDeck 后可继续编辑。
    - 发送失败时保留原有内容，减少意外丢失。
    - 优化工作区切换过程，让会话恢复和界面过渡更加稳定。
    全局搜索
    - 新增跨工作区全局搜索，可检索历史会话中的消息内容。
    - 搜索结果按工作区分组，并显示命中片段和对应会话。
    - 支持搜索归档会话，并可直接切换工作区打开结果。
    - 简化搜索界面，移除输入框底色和多余阴影。
    思考与工具展示
    - 统一思考过程、工具调用和搜索结果的展开与收起交互。
    - 长篇流式思考内容保持在有限高度内，并在用户主动浏览历史内容时停止自动跟随。
    - 改进工具输出和代码内容的排版，使较长结果更容易阅读。
    Pi 包市场
    - 新增由 pi.dev 提供数据的包市场。
    - 支持搜索、类型筛选，并可按下载量或更新时间排序。
    - 展示包详情和已安装状态，并沿用现有的安装审核与安全确认流程。
    通知与界面优化
    - 通知现在可以堆叠显示，并新增未读状态和历史记录。
    - 打开通知中心后自动标记已读，重要警告和错误更加醒目。
    - 修复侧边栏会话菜单的定位和裁切问题。
    - 移除新对话输入框下方不必要的快捷提示按钮。
    候选安装包
    - Windows x64
    - macOS Apple Silicon
    - macOS Intel
    完整变更：https://github.com/Skitre/PiDeck/compare/v0.1.7...v0.1
