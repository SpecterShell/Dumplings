- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    PiDeck v0.2.2
    本次更新把内置 Pi Coding Agent 升到 0.84.2，让桌面端跟上当前 Pi CLI；并修正关掉全部 Provider 时仍可能自动选中已禁用模型的问题。
    Pi SDK
    - 内置 SDK 从 0.82.1 升到 0.84.2（设置 → Host 会显示新版本）。
    - 与 Pi CLI 共用的 ~/.pi/agent（认证、模型、用户级包）更对齐当前上游。
    - 仍不依赖本机安装 pi 或 Node；Windows 版继续内置 Git。
    模型与 Provider
    - 没有任何已启用 Provider 时，不会再自动挑回一个已关掉的模型。
    - 闲置会话在这种情况下会保持无模型，而不是悄悄换到别的 Provider。
    候选安装包
    - Windows x64
    - macOS Apple Silicon
    - macOS Intel
    注意： 当前附件仍是开发候选安装包。Windows 尚未完成 Authenticode 签名与人工安装验收；macOS 使用 ad-hoc 签名且未公证，可能被 Gatekeeper 阻止。请勿将这些附件视为已经认证的公开安装包。
    完整变更：https://github.com/Skitre/PiDeck/compare/v0.2.1...v0.2.2
