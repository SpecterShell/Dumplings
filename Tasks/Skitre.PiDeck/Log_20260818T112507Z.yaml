  Key: ReleaseNotes
  Value: |-
    PiDeck v0.2.0
    本次更新让同一工作区可以同时跑多个会话，切换工作区也不会打断正在生成的内容；同时收拢了包管理页，并补齐用量、侧栏和
    窗口细节。
    多会话并行
    - 发送后可以立刻打开或新建另一个会话继续提问，上一轮不会被中止。
    - 侧栏用小绿点标出仍在运行的会话；有后台任务的工作区同样会显示绿点。
    - 切回正在运行的会话会接上实时输出和计时，而不是整页重载。
    - 有会话在跑时也可以切换工作区，切走后任务继续；回来时仍是原来的运行中会话。
    编辑、重新生成与忙碌时发送
    - 支持在当前会话中编辑重发和重新生成，形成兄弟分支，而不必另开一份会话。
    - 编辑在原位修改，发送后才回到当时的对话状态。
    - 会话忙碌时，可在设置中选择「追加提问」或「引导打断」，默认仍是追加提问。
    包管理
    - 包管理页收成「已安装」和「市场」两栏；每个包的资源开关放进已安装详情。
    - 市场改为按页加载，打开更快，并展示卡片详情、发布日期和外链。
    - 只管理用户范围的包，不再加载项目本地包目录。
    - 修复卸载或禁用刚删掉的包时误报文件不存在，以及本地包更新在 macOS 上失败的问题。
    用量与侧栏
    - 用量页改为按最近更新整理的活动视图，展示热力图、趋势和 token 构成。
    - 工作区列表和最近对话之间增加可拖动分隔，长工作区列表不会把最近对话挤掉。
    - 收窄侧栏或 Dock 时仍可关闭标签、拖动宽度，并保留收起按钮。
    窗口与界面优化
    - Windows 下 Alt+Tab 切回后，输入框会重新获得键盘焦点。
    - 通知弹层对齐铃铛，并去掉会在窗口角落留下残影的半透明层。
    - 修正 Extension 小组件抽屉在窗口左上角重复绘制、超出 Dock 边界等问题。
    - 首次切换工作区或打开会话时，全局 Extension 只加载一次，冷启动等待明显缩短。
    候选安装包
    - Windows x64
    - macOS Apple Silicon
    - macOS Intel
    │ 注意： 当前附件仍是开发候选安装包。Windows 尚未完成 Authenticode 签名与人工安装验收；macOS 使用 ad-hoc
    签名且未公证，可能被 Gatekeeper 阻止。请勿将这些附件视为已经认证的公开安装包。
    完整变更：https://github.com/Skitre/PiDeck/compare/v0.1.9...v0.2.0
