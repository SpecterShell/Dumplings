  Value: |-
    What's new
    Quill is an unofficial Telegram client and still in beta.
    Smoother and sharper
    - A mouse-wheel notch now glides to its spot like in a browser, instead of jumping. It still covers the same distance. Quick notches add up, a turn the other way stops at once, and trackpads and reduced motion work as before (#1517). Reported by @lowngly in #1507.
    - Photos in the fullscreen viewer and in photo stories load at full size. Before, they could stay on the blurry thumbnail when a smaller copy was already on disk (#1517). Reported by @lowngly in #1507.
    - Glass effects do less work per pixel on every system. This should help most on Windows and Linux laptops with integrated graphics (#1517).
    Floating, glass and compact
    - In Floating, the search filter chips, the sticker panel's tabs and search field, and the section chips at the bottom of the sticker and GIF panels are rounded to match the cards around them (#1517).
    - The Search button in the Floating title bar sits on a small pill, so it stays readable over any wallpaper (#1517).
    - The search tabs no longer show a coloured box at their edges with glass on, or in Classic (#1517).
    - With glass on, the chat row whose menu is open keeps its highlight (#1517).
    Not yet tested on real hardware
    - These changes were checked with tests, CI on all three systems and offline demos on macOS. The glass and scrolling changes were not run on real Windows or Linux hardware, so Quill on those systems is still experimental.
