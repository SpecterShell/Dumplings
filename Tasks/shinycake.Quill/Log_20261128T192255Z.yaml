  Key: ReleaseNotes
  Value: |-
    What's new
    Quill is an unofficial Telegram client and still in beta.
    Albums you can select and forward
    - Photo, video and file albums now behave like any other message. Right-click one for its menu, click it in selection mode to pick the whole album, or click one tile to pick just that item. Drag selection, Shift+click and swipe to reply take albums whole (#1519).
    - Forward, Select and Delete from an album's menu act on the whole album, not only its first item. Forwarding keeps the album grouped (#1519).
    - The forward box and the forward bar above the composer show small pictures of what you're forwarding, up to four in the box and three in the bar, so you can see what you're sending. Spoiler and secret media stay hidden (#1520).
    - Deleting an album in a group you moderate opens the moderator's delete box for every item, with Report Spam, Delete all from the user and Ban (#1520).
    A clearer selection check
    - One check is used everywhere you pick things: messages, album photos and files, shared media and the story album picker. It's drawn in your chat's accent colour with a clean tick, shows a ring when empty, and stays readable over wallpapers, photos and outgoing bubbles. Message checks sit in their own column, clear of the bubbles (#1521).
    - A picked photo keeps its colours and gets an accent ring, instead of a grey wash (#1521).
    A steady chat wallpaper
    - The chat wallpaper no longer shifts slightly every time you switch chats. It's now fitted to the window, so the pattern, gradient or photo stays in exactly the same place whatever the chat shows: a pinned bar, a long draft, the info panel or a channel's Unmute bar. Classic and Floating show the same picture (#1522).
    Not yet tested on real hardware
    - These changes were checked with tests, CI on all three systems and offline demos on macOS. They were not tried on a live account or on real Windows or Linux hardware, so Quill on those systems is still experimental.
