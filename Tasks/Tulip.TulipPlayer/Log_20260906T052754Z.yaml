  Value: |-
    Player 2.11.1 Release – September 2026
    We're excited to announce the release of Tulip Desktop Player version 2.11.1.
    Version 2.11.1 of Desktop Player is available for download at 9:00PM ET on September 5th, 2026! If you have auto updates enabled, the Desktop Player application will update in the background and changes will take effect the next time the application is restarted. Alternatively, you can manually initiate the update process from the file menu.
    Bug Fixes
    - Fixed an issue where a torque controller using the OpenProtocol driver could stop responding after a network interruption and would not reconnect until the operator left the step and returned, or restarted Tulip Player. Affected controllers now reconnect automatically.
    Improvements
    - Replaced a deprecated hashing algorithm used for local configuration checksums in the Desktop Player with a current equivalent, in line with Tulip's cryptographic standards.
    - The Desktop Player now restricts which domains it will load an instance from, so it will only connect to Tulip-hosted and approved white-label domains.
    - The Desktop Player now validates file types before writing downloaded content to disk.
    - Hardened update handling in the Windows Desktop Player so the update source cannot be redirected.
    Full List of Ticket IDs Included in Release
    If you are tracking any of these tickets and would like more details, please contact Tulip Customer Support via support@tulip.co or live chat through your instance.
