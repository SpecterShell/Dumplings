  Key: ReleaseNotes
  Value: |-
    Features
    - dashboard One status button gathers core, update and resource states, with counts, download progress and new card icons
    - rules Added rules can go to named custom exits; a profile's script and added rules run together and open from the extend page
    - proxy PAC mode for the desktop system proxy; new Windows installs bypass ; GTK apps on KDE Plasma follow the proxy
    - dns respect-rules, hosts and cache-algorithm in the DNS overrides; macOS system DNS through tun.dns-mode native
    - logs Open a log on a phone to select and copy it
    - resources Geo resources update automatically by default
    - desktop Impeller on Windows and Intel Macs; the Apple Silicon download no longer carries Intel code
    - Update the core to mihomo v1.19.34, with editor completion for its new keys
    Bug Fixes
    - core A start that fails or a lost Core says why; a mixed port of 0 is replaced; the mixed port opens without a profile
    - config Process rules match by default; picked override keys are written as set, empty included
    - android WireGuard, Hysteria2 and TUIC reconnect after a network change; core sockets opened before the VPN are protected
    - dashboard Service and exit IP checks no longer fail while the proxy starts, stops or changes network
    - core HTTPUpgrade share links no longer import as WebSocket
    - connections App icons show whenever the app is known and keep their place while loading
    - desktop macOS tray windows stay on the current Space; windows use the target display's scale; AppImage without a bundled libstdc++; cleaner deb removal; the Windows installer only stops its own processes
    - ui Pages open at the top and on the selected profile; sheets open from sheets as pages; the editor shows its spinner and grows its sheet; calmer success and warning colors; remote icons hold their size
    Performance
    - connections Connections rank and sort off the UI thread; proxy and group icons use less memory
