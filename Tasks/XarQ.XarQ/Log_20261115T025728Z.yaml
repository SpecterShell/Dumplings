  Key: ReleaseNotes
  Value: |-
    The second alpha of XarQ, a Qt6 vector, photo and web design studio that reads and writes native Xara .xar files. It is still an alpha: expect rough edges, and keep copies of files you care about.
    The same XarQ everywhere
    Windows, Linux and Haiku now open the same formats and have the same tools:
    - Every system opens PDF, AutoCAD DWG, the GDAL map formats (DGN, MapInfo, GeoPackage, S-57, GML), JPEG XL, JPEG XR, WMF, DICOM, whole-slide microscopy images and Mobipocket e-books.
    - Hyphenation and spelling use English dictionaries that come with XarQ, so they work without anything installed on the system.
    - CMYK separations and soft proofing always have a profile: FOGRA39 is built in, and any profiles on your system are listed before it.
    The Windows downloads grow to about 156 MB and the AppImage to about 84 MB, mostly for the map formats.
    Haiku
    XarQ runs natively on Haiku, and this is its first release built from the release itself. HaikuPorts didn't accept the recipe, so XarQ has its own package repository; the libraries HaikuPorts doesn't have (LibreDWG, GDCM, OpenSlide, libdicom, jxrlib, libmobi and Poppler 26) are there too, each built from its own repository in XarQ-design. Menus show the keys you press on Haiku: Alt+C for Copy, not Ctrl+C.
    New in this alpha
    - Painting apps' files with their layers: GIMP (.xcf, .xcf.bz2), Krita, OpenRaster, Paint.NET, MediBang Paint and FireAlpaca, and PaintTool SAI.
    - Corel PHOTO-PAINT files import fully, with their objects.
    - Every dialog has the new dialog design, every shortcut runs a single command, and the save sound plays only when a save works.
    - The Text tool picks the right font weight on 32-bit long systems (Windows and Haiku).
