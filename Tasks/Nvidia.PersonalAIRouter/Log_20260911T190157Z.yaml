- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Fixed
    - Building from source for an Intel/AMD (x64) target failed while compiling the
      bundled log sanitizer. The packaging script passed Electron's x64
      architecture name straight to the Go toolchain, which expects amd64. Arm64
      targets were unaffected.
    Notes
    This release contains no application changes. The fix is to the build tooling
    only, and the published 0.1.0 installers were not affected by it, so 0.1.1 is
    functionally identical to 0.1.0 for anyone installing it.
