  Key: ReleaseNotes
  Value: |-
    - Agent sessions are now available on the web and sync seamlessly with the PC app. You can also move sessions into projects to continue working with project context.
    - Preview and open generated artifacts directly from a session.
    - Bug fixes and stability improvements.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 网页端现已支持发起 Agent 会话，可与 PC 端实时同步。后续可将会话移入项目，结合项目资料继续研究。
    - 支持直接预览和打开会话中生成的文件。
    - 修复已知问题，提升稳定性与使用体验。
