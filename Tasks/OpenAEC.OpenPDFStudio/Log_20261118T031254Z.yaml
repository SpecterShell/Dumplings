- Locale: en-GB
  Key: ReleaseNotes
  Value: |-
    What's New in v2026.47.1
    New
    - One "Units" setting (Metric, Imperial or both) in Preferences > General. Imperial switches measuring to feet and inches: the display, the calibration and scale dialogs and the paper unit follow. When you measure on a drawing without a scale, the app says so and points to Calibrate.
    - Type feet, inches and fractions in every length field: 12', 6", 12'-6 3/8" or 1.5', also directly while drawing and measuring.
    - Acres and hectares as an area unit, in the panel, in schedules and when saving.
    - Fit Box to Text: a command that sizes text boxes and callouts to their text, also for several at once.
    - Close all tabs and close other tabs, in the tab menu and the File menu.
    - Bookmarks to a place on the page: with selected text the title becomes that text and the destination its position; an existing bookmark can be re-pointed to the current view.
    - Own markup statuses in named sets with colours, shareable as a file; a status column and "open items only" in the markups list; an optional status badge on the page.
    - Compare: select several changes at once (Ctrl+click, Shift+click, Ctrl+A) and place clouds in one go; a precision slider.
    - Symbol search: exclude regions, a check score, and matches inside a legend or title block are flagged for review.
    - Presentation view in full screen, with Alt+Enter as a second key; documents open in continuous view by default; a preference for the startup tool (Select or Hand).
    - Save, Save As and export as one button in the title bar; rotate buttons in the status bar; the page size follows the units setting.
    - For connections with AI assistants: delete and update schedules, closed perimeters, captures as images, and clear errors for an unknown unit or setting.
    - "What's New" shows a one-time note about virus scanner warnings, with a button to report such a warning to us. We are working hard to solve this.
    Fixed
    - The window position and maximised state are kept, also when closing with the X.
    - Alignment, line spacing and bold or italic chosen for a text tool apply to the next text box or callout.
    - A form field keeps its embedded font, on screen and when saving; before, it was lost after one save.
    - A link from another program follows the zoomed area it defines and shows its border.
    - Bookmarks from other programs keep their own destination when saving; "Add Bookmark" in the page menu works.
    - Compare: the vector option works for vector drawings; zoomed in you can reach the left edge again and the sheet no longer jumps.
    - "Show in Explorer" opens the right folder.
    - The Schedules and Measurements panels scroll vertically; the header row of a long schedule stays in view.
    - The wall, concrete beam and system grid sections of the Properties panel follow the app language.
    - Text highlights are no longer opaque in continuous view; the comment popup closes when its markup is removed; switching between tabs in different views shows the right document.
    - Saving with the Iosevka font works.
    - In the web version a new blank document can be saved again.
    Free, open-source PDF annotation editor built with Tauri.
- Locale: nl-NL
  Key: ReleaseNotes
  Value: |-
    Wat is nieuw in v2026.47.1
    Nieuw
    - Eén instelling "Eenheden" (metrisch, imperiaal of beide) in Voorkeuren > Algemeen. Imperiaal schakelt het meten om naar voet en inch: de weergave, de kalibratie- en schaalvensters en de papiereenheid volgen mee. Meet je op een tekening zonder schaal, dan zegt de app dat en wijst naar Kalibreren.
    - Voet, inch en breuken typen in elk lengteveld: 12', 6", 12'-6 3/8" of 1.5', ook direct tijdens het tekenen en meten.
    - Acres en hectares als oppervlakte-eenheid, in het paneel, in staten en bij opslaan.
    - Kader passend maken: een opdracht die tekstvakken en toelichtingen op hun tekst afstelt, ook voor meerdere tegelijk.
    - Alle tabbladen sluiten en andere tabbladen sluiten, in het tabbladmenu en het menu Bestand.
    - Bladwijzers naar een plek op de pagina: met geselecteerde tekst wordt de titel die tekst en de bestemming de plek ervan; een bestaande bladwijzer kun je verleggen naar de huidige weergave.
    - Eigen markupstatussen in benoemde sets met kleuren, deelbaar als bestand; een statuskolom en "alleen open punten" in de markuplijst; een optioneel statusvierkantje op het blad.
    - Vergelijken: meerdere wijzigingen tegelijk selecteren (Ctrl+klik, Shift+klik, Ctrl+A) en in één keer wolken plaatsen; een schuif voor de precisie.
    - Symboolzoeken: gebieden uitsluiten, een controlescore, en treffers in een legenda of onderhoek worden gemarkeerd om na te kijken.
    - Presentatieweergave bij volledig scherm, met Alt+Enter als tweede toets; documenten openen standaard in de doorlopende weergave; een voorkeur voor het startgereedschap (Selecteren of Hand).
    - Opslaan, Opslaan als en exporteren als één knop in de titelbalk; draaiknoppen in de statusbalk; het paginaformaat volgt de eenhedeninstelling.
    - Voor koppelingen met AI-assistenten: staten verwijderen en bijwerken, gesloten omtrekken, schermopnamen als afbeelding, en duidelijke foutmeldingen bij een onbekende eenheid of instelling.
    - Bij "Wat is nieuw" staat eenmalig uitleg over meldingen van virusscanners, met een knop om zo'n melding aan ons door te geven. We zijn er druk mee bezig om dit op te lossen.
    Opgelost
    - De vensterpositie en de gemaximaliseerde stand blijven bewaard, ook bij sluiten met het kruisje.
    - Uitlijning, regelafstand en vet of cursief die je voor een tekstgereedschap kiest, gelden voor het volgende tekstvak of de volgende toelichting.
    - Een formulierveld houdt zijn ingesloten lettertype, op het scherm en bij opslaan; voorheen ging dat na één keer opslaan verloren.
    - Een koppeling uit een ander programma volgt het zoomgebied dat erin staat en toont zijn rand.
    - Bladwijzers uit andere programma's houden bij opslaan hun eigen bestemming; "Bladwijzer toevoegen" in het paginamenu werkt.
    - Vergelijken: de vector-optie werkt bij vectortekeningen; ingezoomd kun je de linkerrand weer bereiken en het blad verspringt niet meer.
    - "Tonen in Verkenner" opent de juiste map.
    - Het staten-paneel en het paneel Metingen schuiven verticaal; de kopregel van een lange staat blijft in beeld.
    - Het wand-, betonbalk- en systeemrasterdeel van het eigenschappenpaneel volgt de taal van de app.
    - Tekstmarkeringen zijn in de doorlopende weergave niet meer dekkend; het opmerkingvenster sluit als de markup wordt verwijderd; wisselen tussen tabbladen in verschillende weergaven toont het juiste document.
    - Opslaan met het lettertype Iosevka werkt.
    - In de webversie is een nieuw leeg document weer op te slaan.
    Gratis, open-source PDF-annotatie-editor gebouwd met Tauri.
