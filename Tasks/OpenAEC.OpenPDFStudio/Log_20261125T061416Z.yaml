  Value: |-
    What's new in Open PDF Studio 2026.48.27
    1. Preserve vector snippets and the placement of surrounding annotations when flattening a PDF. (#1259, #1261)
    2. Save edited PDFs through Android document providers. When a document is read-only, Save As offers its original filename and keeps edits available if saving is cancelled. (#1260)
    3. Choose from all 16 PDF blend modes in the Appearance panel and preserve the selected mode after saving and reopening the annotation. (#1262)
    Other changes since v2026.48.8
    4. Recover PDFs with blank generation fields in classic cross-reference tables. (#1250)
    5. Restore a hidden drawing toolbar from the View ribbon. (#1256)
    6. Keep separate pen strokes intact when editing, saving and reopening a compound ink annotation. (#1257)
    7. Reuse embedded watermark images when saving the document again. (#1257)
    8. Discard unused embedded image data after removing a watermark. (#1257)
    9. Reuse the closest available cached bitmap while zooming. (#1257)
    10. Cap render allocations on very large sheets. (#1257)
    11. Share font and graphics resources used by repeated headers. (#1257)
    12. Keep linked callout arrows attached when moving the annotation. (#1257)
    13. Branch an arrow from an existing callout bend with Shift-click. (#1257)
    14. Add an independent callout arrow with the plus control. (#1257)
    15. Retain branching callout arrows when exchanging XFDF. (#1257)
    16. Give a pasted callout its own arrows at the original relative positions. (#1257)
    17. Resize the Properties panel by dragging its edge. (#1257)
    18. Resize the Symbol Palette by dragging its edge. (#1257)
    19. Read the scale calibration dialog in dark themes. (#1257)
