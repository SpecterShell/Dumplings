- Locale: en-GB
  Key: ReleaseNotes
  Value: |-
    What's New in v2026.47.0
    New
    - OCR in more languages: choose any installed language in the OCR window, add one with "Add language…" (more than a hundred languages from the Tesseract project) and combine a language with English. You can also put language files in the language folder yourself.
    - Calibrate with a drawn line: in the calibration window choose "Draw line on drawing", click the two ends of a known dimension and type the real length. Hold Shift for a straight horizontal or vertical line.
    - Pan with the space bar: hold Space and drag to move the sheet; the chosen tool stays active.
    - Larger Rotate Left and Rotate Right buttons, now also on the Home tab.
    - Commands for copy style, paste style and set as default, which you can bind to a shortcut.
    - Heavy pages are drawn through PDFium for print, image export and compress.
    Fixed
    - Form fields no longer show the old text under newly typed text; signatures and buttons stay visible, also when zoomed in.
    - Changing the unit of a length or dimension line works and stays (for example from feet to inches).
    - Dimensions in feet and inches with fractions keep their format and precision when recalculated.
    - Rectangles and circles from other PDF programs no longer open too large.
    - "Recover unsaved work" now appears once per file; after that you find it under File.
    - Text in right-to-left languages is split into letters correctly when it is read.
    - PDFs with a damaged cross-reference table are read within limits instead of freezing the app.
    Free, open-source PDF annotation editor built with Tauri.
- Locale: nl-NL
  Key: ReleaseNotes
  Value: |-
    Wat is nieuw in v2026.47.0
    Nieuw
    - OCR in meer talen: kies in het OCR-venster uit elke geïnstalleerde taal, voeg met "Taal toevoegen…" een taal toe (meer dan honderd talen van het Tesseract-project) en combineer een taal met Engels. Je kunt ook zelf taalbestanden in de taalmap zetten.
    - Kalibreren met een getekende lijn: kies in het kalibratievenster "Lijn tekenen op de tekening", klik de twee uiteinden van een bekende maat aan en typ de werkelijke lengte. Houd Shift ingedrukt voor een rechte horizontale of verticale lijn.
    - Pannen met de spatiebalk: houd Spatie ingedrukt en sleep om het blad te verschuiven; het gekozen gereedschap blijft actief.
    - Grotere knoppen Linksom en Rechtsom draaien, nu ook op het tabblad Start.
    - Opdrachten voor stijl kopiëren, stijl plakken en als standaard instellen, die je aan een sneltoets kunt koppelen.
    - Zware pagina's worden bij afdrukken, afbeeldingen exporteren en comprimeren via PDFium getekend.
    Opgelost
    - Formuliervelden tonen de oude tekst niet meer onder nieuw getypte tekst; handtekeningen en knoppen blijven zichtbaar, ook bij inzoomen.
    - De eenheid van een lengte of maatlijn wijzigen werkt en blijft staan (bijvoorbeeld van voet naar inch).
    - Maten in voet en inch met breuken behouden hun notatie en precisie als ze opnieuw worden berekend.
    - Rechthoeken en cirkels uit andere PDF-programma's openen niet meer te groot.
    - "Niet-opgeslagen werk herstellen" verschijnt nog maar één keer per bestand; daarna vind je het onder Bestand.
    - Tekst in van rechts naar links geschreven talen wordt bij het uitlezen goed in letters gesplitst.
    - PDF's met een beschadigde kruisverwijzingstabel worden begrensd gelezen in plaats van de app te laten vastlopen.
    Gratis, open-source PDF-annotatie-editor gebouwd met Tauri.
