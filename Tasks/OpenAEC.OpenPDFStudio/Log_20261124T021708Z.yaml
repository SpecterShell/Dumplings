- Locale: en-GB
  Key: ReleaseNotes
  Value: |-
    What's New in v2026.48.5
    New
    - Count groups: set the size of the count markers per group (50% to 300%), delete a group with its markers, and rename the active group from the ribbon.
    - Links to an area: a link to a page can show a chosen area of that page. In the link dialog choose View > Area on the page, then Pick area and drag a rectangle on the target page.
    - Links to a bookmark: a link can lead to a bookmark of the document, as a named place.
    - Add bookmarks for the selected pages from the thumbnail menu, named after the page label or the page number.
    - Paint annotation styles onto other annotations with a single command.
    - Geometric line patterns for lines and polylines, including batting insulation.
    - Existing annotations snap to other annotations while you drag them.
    - Preferences > Behavior > Dragging with the right mouse button: optionally let a right-button drag move the sheet. The default is unchanged, and a click still opens the context menu.
    - The preferences window can be resized.
    - Schedules show a colour as a swatch instead of its code.
    - Plugin API: getPageLinks() reads the links a page has in the file and addPdfLinks() adds standard PDF links.
    Fixed
    - Print: the margins from Page Setup are applied and take decimal numbers.
    - Print: with Auto-rotate off a page that stands across the sheet stays upright.
    - Print: with several pages per sheet each page fills its cell, without wide white bands around it.
    - Callout: rotating the box turns box, knee and arrow together; the leader stays attached at every angle.
    - A text box from another program keeps the colour of its border.
    - Masonry bond and earth hatches are drawn correctly.
    - The app no longer freezes when opening Send Feedback or the symbol library settings.
    - Preferences > Keyboard Shortcuts is readable in dark themes.
    Free, open-source PDF annotation editor built with Tauri.
    Downloads
    - Windows (System): Download the *_x64-setup.exe installer for system-wide installation (requires admin)
    - Windows (User): Download the *_x64_user-setup.exe installer for current user only (no admin required)
    - Windows (Portable): Download *_x64_portable.zip, extract it and run open-pdf-studio.exe; nothing is installed, all data stays in the data folder next to it
    - macOS: Download the .dmg file (universal - supports Intel and Apple Silicon)
    - Linux: Download the .deb package, .AppImage, or .snap (also available on the Snap Store)
    OpenAEC Linux
    Memory at rest (Linux AppImage, no document open, software rendering): 378 MiB PSS over 7 processes
