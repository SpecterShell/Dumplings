- Locale: en-GB
  Key: ReleaseNotes
  Value: |-
    What's new in 2026.48.2
    - Semi-transparent annotation fills keep their color and opacity when the document is saved and reopened. (#1201)
    - A text box with a stray callout line keeps its original type unless the PDF explicitly marks it as a callout. (#1202)
    - The tab bar docking hint follows the selected interface language. (#1203)
    - Drawing objects support a subject independent of their note. The subject is saved in the standard PDF subject field. (#1204)
    - Choose File → Print Area, drag a rectangle and print the selection. The preview follows the selection, including on rotated pages. Vector content stays sharp. At actual size, large selections can span multiple sheets. (#1205)
    - Windows release builds now scan the signed installer before running it when Defender is available on the build runner.
    - Imported composite stamps display their complete appearance, including image masks, overlaid artwork and text. (#1207)
    OpenAEC Linux
    Memory at rest (Linux AppImage, no document open, software rendering): 377 MiB PSS over 7 processes
    Verification
    Signed desktop packages are available for Windows, macOS and Linux. A 100 mm reference line measured 100.076 mm in the Windows virtual printer output and remained a vector. Android packaging requires the permanent signing credentials. The Flatpak sandbox rejected the manifest source path.
    The installed Windows application opened and zoomed all 41 verification PDFs in a visible window. Median times were 1.672 seconds to open and 0.547 seconds to zoom.
