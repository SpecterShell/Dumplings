Locale:
- Locale: en-GB
  Key: ReleaseNotes
  Value: |-
    What's New in v2026.46.3
    New
    - Own markup statuses: define statuses with your own name and colour under Preferences → Annotations → Comments, such as "Approved" or "In progress". They appear next to the standard statuses in the Status menu, the markups list and the filter, and are saved in the PDF.
    - Show only open items: one click in Show → Status hides every finished markup, in the list and on the drawing.
    - Page scale per page: each thumbnail shows the scale of its page; click it to set it, also for several pages at once. Detect scales from the page text or from an area in the title block, with progress and Cancel. The scale is saved in the PDF and moves with its page.
    - Reverse the mouse wheel zoom direction under Preferences → Behaviour → Navigation.
    - Central documents (first step): sign in to your own collaboration server through File → Central documents, upload and share PDFs, and open a snapshot.
    - Extensions can follow a selection of several markups.
    Fixed
    - The OpenAEC Installer no longer opens when you start the app.
    - Filled-in forms print with their values, also with Save as PDF.
    - A rotated page no longer turns upside down when zooming after a save.
    - Fonts from a font collection (such as MS Gothic) are embedded correctly, so the text looks the same in other programs.
    - Headers and footers are no longer doubled on a rotated document after saving.
    - A status with accents comes back correctly after reopening; the "Reviewed" status can be filtered too.
    Free, open-source PDF annotation editor built with Tauri.
- Locale: nl-NL
  Key: ReleaseNotes
  Value: |-
    Wat is nieuw in v2026.46.3
    Nieuw
    - Eigen statussen voor markeringen: leg onder Voorkeuren → Annotaties → Opmerkingen statussen vast met een eigen naam en kleur, zoals "Approved" of "In uitvoering". Ze staan naast de standaardstatussen in het menu Status, de lijst met markeringen en het filter, en worden in de PDF bewaard.
    - Alleen open punten: één klik in Weergeven → Status verbergt alle afgeronde markeringen, in de lijst en op de tekening.
    - Schaal per pagina: elke miniatuur toont de schaal van die pagina; klik erop om hem in te stellen, ook voor meerdere pagina's tegelijk. Schalen herkennen uit de tekst van de pagina of uit een gebied in de titelhoek, met voortgang en Annuleren. De schaal wordt in de PDF bewaard en verhuist mee met zijn pagina.
    - Zoomrichting van het muiswiel omkeren, onder Voorkeuren → Gedrag → Navigatie.
    - Centrale documenten (eerste stap): via Bestand → Centrale documenten aanmelden bij een eigen samenwerkingsserver, PDF's uploaden en delen, en een momentopname openen.
    - Extensies kunnen een selectie van meerdere markeringen volgen.
    Opgelost
    - De OpenAEC Installer gaat niet meer open als je de app start.
    - Ingevulde formulieren komen met hun ingevulde waarden op papier, ook bij Opslaan als PDF.
    - Een gedraaide pagina staat na opslaan niet meer op zijn kop bij inzoomen.
    - Lettertypen uit een lettertypeverzameling (zoals MS Gothic) worden goed ingebed, zodat de tekst er in andere programma's hetzelfde uitziet.
    - Kop- en voetteksten staan na opslaan niet meer dubbel op een gedraaid document.
    - Een status met accenten komt na opnieuw openen goed terug; de status "Beoordeeld" is ook te filteren.
    Gratis, open-source PDF-annotatie-editor gebouwd met Tauri.
