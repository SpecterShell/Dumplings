  Key: ReleaseNotes
  Value: |-
    nomacs has now single-instance feature.
    KDSingleApplication is new dependency on Windows and macOS.
    On Linux, single-instance is implemented via Qt D-Bus by default, however, it is possible to build with KDSingleApplication when ENABLE_DBUS option is set to OFF.
