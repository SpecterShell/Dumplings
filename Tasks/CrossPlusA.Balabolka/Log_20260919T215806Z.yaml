  Key: ReleaseNotes
  Value: |-
    [+] Added the dictionary for replacing ligatures (thanks to Doug Edmunds).
    [*] Updated the voice list for IBM Watson.
    [*] The IBM Watson TTS service documentation states that the service always synthesizes audio with a sampling rate of 22.05 kHz. However, new natural voices returns audio data with a sampling rate of 24 kHz. The application will perform resampling.
    [*] Resources for Bulgarian, Czech, Hungarian and Slovak languages were updated (thanks to Nencho Nedelev-Karlov, Adaptech s.r.o. and Zoltan Magyar).
