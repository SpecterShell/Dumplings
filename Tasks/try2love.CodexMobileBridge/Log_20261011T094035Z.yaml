  Value: |-
    v2.0.1 · 修复 macOS 客户端扫描中断
    - 修复 macOS 扫描应用时，某个应用的 Info.plist 存在 XML 格式错误，导致整轮客户端发现中断、已启用客户端无法继续自动接入的问题。
    - 遇到这类异常应用时跳过该候选，继续发现其他客户端，并在网关日志中记录具体文件路径和解析原因，便于定位。
    - 受影响的 macOS 用户建议更新电脑端网关；已有账号、会话与连接配置无需重新设置。
