- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Weave Office 0.1.2：同步最新代码，改进 Markdown 表格、文件快捷键、链接打开和 PDF 中文编辑体验。
    本次更新
    - Markdown 实时预览与阅读视图支持表格，改进表格编辑体验。
    - 新建面板按 Office、文本与网页、代码与数据分组，并增加六种代码文件格式。
    - 增加 Office 风格的保存、另存为和关闭快捷键；修复 macOS Dock 图标被默认图标替换的问题。
    - 修复表格与 PDF 确认打开链接后未启动浏览器的问题。
    - PDF 编辑遇到日文字体缺少的汉字时，回退到简体中文字体。
    - CLI 保留输入文本原值，并修复带标签颜色时的工作表重命名。
    - 修复 Linux 窗口系统特性配置，并锁定相关依赖。
