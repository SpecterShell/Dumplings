  Value: |-
    2026.10.16
    ✨ Highlights
    This release is headlined by the Desktop Companion — a new always-on assistant
    surface with translation, read-aloud, quick input, capture, and task follow-up —
    alongside a reworked model selector with presets and a configurable Expert Plaza.
    🚀 Features
    Desktop Companion
    - Add the desktop companion surface (#2860, #2865)
    - Add translation and read-aloud cards (#2816)
    - Add deskstop companion composer (#2847)
    - Improve capture, task follow-up, and quick input (#2870)
    - Improve translation request handling and login guidance (#2873)
    - Add usage analytics (#2881)
    Models & Routing
    - Add model presets and conversation usage (#2879)
    - Distinguish custom models in the selector (#2869)
    - Unify virtual preset routing and preserve conversation usage (#2887)
    Experts & Navigation
    - Add a configurable Expert Plaza with first-run deliverables (#2849)
    - Add sidebar capabilities menu and library source icons (#2885)
    - Generate titles for new desktop sessions (#2846)
    - Add "open with" (#2848)
    Media & Analytics
    - Improve generation recovery and status feedback (#2872)
    - Enable account-scoped image and video defaults (#2884)
    - Connect expert and task usage funnels (#2866)
    🐛 Bug Fixes
    Desktop Companion
    - Preserve TTS playback speed across segments (#2861)
    - Stabilize selection toolbar menu (#2862)
    - Require login for selection tools (#2871)
    - Improve drag, login, capture, and follow-up interactions (#2876)
    - Stabilize orb toggles, card placement, and navigation (#2877)
    - Preserve selection context and refine window interactions (#2882)
    - Prevent panel flicker and correct screenshot bounds (#2883)
    - Show source expansion hint only for truncated text (#2890)
    Platform & Settings
    - Safely destroy background accumulators (#2850)
    - Stop re-injecting AGENTS.md instructions into the first message (#2812)
    - Activate preset model routing for scheduled tasks (#2889)
    - Isolate development app identity on Windows (#2864)
    - Default Windows child processes to UTF-8 (#2868)
    - Secure provider exports and preserve legacy imports (#2863)
    - Preserve media recovery and companion turn attribution (#2886)
    - Refine companion popovers and sidebar menu dismissal (#2888)
    Skills
    - Remove retired film and music search skills (#2878)
    👥 New Contributors
    - @changjing9527 made their first contribution in #2850
