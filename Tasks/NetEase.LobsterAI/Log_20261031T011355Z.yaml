  Key: ReleaseNotes
  Value: |-
    2026.10.30
    Highlights
    - Image Studio lands — a new image creation surface with close-up erase-and-blend, per-conversation media model selection, and a fixed sharing path for generated images
    - Conversation polish — large pastes collapse into cards, and history keeps loading until the viewport is full
    - Account & settings — one saved API key per decision-model provider; redesigned IM settings with WeChat DMs always admitted
    - Faster startup — startup migrations no longer rerun on every launch, and state databases are prewarmed
    ✨ New Features
    - media: Image Studio and a reworked conversation media workflow (#2952) @fisherdaddy
    - media: erase from a close-up and blend the result back into the source image (#2954) @fisherdaddy
    - cowork: collapse large pastes into pasted-text cards (#2946) @fisherdaddy
    - settings: keep a saved API key per decision-model provider (#2943) @fisherdaddy
    - im: redesigned IM settings layout, WeChat DMs always admitted (#2942) @fisherdaddy
    - account: penny trial campaign entry in the account menu (#2950) @Mind-Hand
    🚀 Improvements
    - cowork: refined inline context tags and clearer media model selection (#2958) @fisherdaddy
    - cowork: keep loading older messages until the viewport fills (#2937) @fisherdaddy
    - openclaw: stabilized prompt caching and attributed heartbeat usage separately (#2949) @Mind-Hand
    - openclaw: hot-reload IM agent cwd and drop stale model overrides (#2960) @fisherdaddy
    - perf: skip repeated startup migrations and prewarm state databases (#2939) @fisherdaddy
    🐛 Bug Fixes
    - artifacts: load image artifacts from their files instead of data URLs (#2953) @fisherdaddy
    - artifacts: restore sharing of generated images (#2962) @btc69m979y-dotcom
    - media: encode MiniMax H3 audio references with audio MIME types (#2961) @Mind-Hand
    - openclaw: repaired OAuth proxy routing and Computer Use MCP auth (#2951) @fisherdaddy
    - account: penny trial requests no longer block the account menu (#2955) @Mind-Hand
    - im: correct wrapped message line counts and avoid WeChat QR restarts (#2963) @btc69m979y-dotcom
    - packaging: isolate macOS skill dependencies by target architecture (#2948) @liuzhq1986
    📚 Docs
    - Revamped the README and added contributing guides (#2934) @fisherdaddy
    - Host the WeChat QR code in-repo so it renders on GitHub (#2935) @fisherdaddy
    🧰 Internal
    - Startup: profile the untimed steps before the AskUser server (#2941) @fisherdaddy
    - Dev: stale immutable Vite deps no longer block the dev renderer (#2945) @fisherdaddy
    - CI: run regression tests even when main builds are skipped (#2957) @Mind-Hand
    Thanks
    @fisherdaddy @Mind-Hand @liuzhq1986 @btc69m979y-dotcom
    Full Changelog: https://github.com/netease-youdao/LobsterAI/compare/2026.10.23...2026.10.30
