  Key: ReleaseNotes
  Value: |-
    What’s Changed
    This release introduces Office document editing, Computer Use support for macOS, and improved MCP tool management. It also brings a refreshed interface, a smoother task experience, and significant improvements to OpenClaw stability and reliability.
    ✨ Highlights
    - Office Document Editing — Create and edit Word, Excel, and PowerPoint documents directly in LobsterAI, with support for manual editing, AI-assisted updates, and automatic saving.
    - Computer Use for Mac — AI can now interact with desktop applications on both Apple Silicon and Intel Macs.
    - MCP Tool Picker — Search, browse, and select which MCP tools to enable, with estimated token usage for better context management.
    - Refreshed UI — Updated colors, layouts, agent views, and task interactions for a cleaner and more consistent experience.
    - Improved Agent Reliability — More robust OpenClaw gateway startup, configuration recovery, model responses, and task execution.
    🚀 New Features & Improvements
    Office Editing
    - Added integrated editing support for Word, Excel, and PowerPoint documents. (#2770, #2776)
    - Added table and image insertion to the Word editor. (#2833)
    - Improved PowerPoint navigation with a slide thumbnail panel. (#2813)
    - Improved file-saving behavior when documents are open in Excel or WPS. (#2828)
    Computer Use & MCP
    - Added Computer Use support for Apple Silicon and Intel Macs. (#2805, #2844)
    - Added an MCP tool picker for selecting and managing enabled tools. (#2789)
    - Improved Computer Use installation and startup behavior. (#2835, #2845)
    Interface & Task Experience
    - Refreshed the interface colors, layouts, and visual consistency. (#2762)
    - Improved agent headers, task hierarchy, and sidebar organization. (#2829, #2840)
    - Added double-click task renaming. (#2840)
    - Improved long-running task displays, progress tracking, and execution timing. (#2777, #2830)
    - Improved the question dock interaction and task input experience. (#2810)
    - Added LLM request tracing and per-turn usage tracking. (#2814)
    - Added open-source project information and a GitHub star prompt to the About page. (#2808)
    File Preview & Markdown
    - Added direct navigation from Markdown file links to their corresponding artifact previews. (#2780)
    - Improved preview refresh when AI modifies files. (#2832, #2836)
    - Improved preview persistence while files are being saved. (#2838)
    - Improved zooming and panning for images, SVGs, and Mermaid diagrams. (#2841)
    - Refactored the Markdown live-editing engine for better maintainability. (#2767)
    - Fixed currency values being incorrectly interpreted as inline math. (#2781)
    🐛 Bug Fixes & Stability
    OpenClaw & Agent Execution
    - Improved gateway startup, restart handling, and timeout recovery. (#2768, #2775, #2783, #2825)
    - Fixed configuration synchronization and recovery issues that could delay or block task execution. (#2755, #2819, #2821, #2824)
    - Fixed malformed tool calls and model output truncation issues. (#2759, #2761, #2786)
    - Improved task recovery and prevented unnecessary replay of model calls. (#2763)
    - Fixed stale gateway locks, plugin repair issues, and configuration recovery edge cases. (#2771, #2804, #2831)
    - Improved compatibility with Windows Firewall and local gateway connections. (#2817)
    Models & Task Management
    - Fixed custom model routing and model availability issues. (#2787, #2788)
    - Improved model thinking configuration compatibility. (#2811)
    - Fixed task interruption and follow-up input handling. (#2823, #2827)
    - Improved task progress and completion-state handling. (#2826)
    Skills, Files & Installation
    - Fixed Skills installation, metadata parsing, and migration edge cases. (#2706, #2782, #2799, #2800, #2809)
    - Fixed file library synchronization issues involving deleted or missing artifacts. (#2815)
    - Fixed clipboard access in the Office editor. (#2822)
    - Improved network error reporting and screenshot scaling. (#2807)
    - Added Windows network diagnostics for troubleshooting local connection issues. (#2820)
    Internal Improvements
    - Improved development tooling, test stability, and CI automation. (#2769, #2803, #2834)
    - Removed obsolete messaging gateway code. (#2802)
    - Improved compatibility with legacy session storage. (#2772)
    👏 New Contributors
    - @alison-xx made their first contribution in #2706.
