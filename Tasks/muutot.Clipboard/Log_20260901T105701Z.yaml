  Value: |-
    重要通知：同步系统属内测功能，不保证跨版本可用性，建议仅尝鲜
    Clipboard Desktop v1.5.1
    增量打磨：分组标签显示、同步链路与设置面板的细节修复
    Released: 2026-09-01

    分组与紧凑模式
    - 分组标签显示模式 — 新增图标+文字/仅图标/仅文字三档切换，适配紧凑与常规布局 | 6e37bf2
    - 紧凑模式默认开启并收紧参数 — 默认启用紧凑布局，微调卡片与行高指标 | e720287 b6b5d70

    同步与设置重构
    - 同步页面重构 — S3 页以“测试连接”为首项、移除外层卡片与 Advanced 标题，按 cloud / advanced / s3 重排为 cloud+S3 二级页 | a024de9 e9f0cab 7fe056a d1716af
    - 设置面板惰性化与入口收敛 — OCR/存储路径/传输/同步/S3 等抽取为独立惰性面板，统一经 LAZY_PANEL_DESCRIPTORS 描述表分发；S3 同步配置、传输导入导出、存储路径管理分别由 SyncPanel/TransferPanel/StoragePathsPanel 承载 | 1a4a6e5 a5d9772 31e6adb c7d6014
    - 面包屑与导航 — 面包屑完全由导航元数据推导，多标签组统一二级路径；修复分组切换与存储状态空值访问 | af7b99d 22a883b 12c233d 66f4c05

    样式与交互细节
    - 按钮居中与工具栏间距 — 图标+文字按钮在 5 处统一改为 inline-flex + justify-center + line-height:1 水平垂直居中；移除工具栏按钮组间 3px 间隙 | 554a35a 5ec8e44
    - 设置条目 28px 规范化 — 统一入口按钮/下拉至固定 28px 高度，恢复资源路径网格输入的共享控件样式 | 60b80b4 71e5aa2
    - 设置视觉打磨 — 补齐 entry-textarea/entry-actions 共享规则、资源路径与动作行间距、关闭按钮图标化及同步行图标等 | 338233c 0800776 7f28870 2994cb5
    - 同步反馈 — S3 测试连接结果经 toast 展示并防标签抖动；未选 S3 时禁用测试并给出文案提示 | 0b4b08c a0ae974 e3f9882

    搜索、OCR 与稳定性
    - 搜索 — 标题/类型排序支持升序；标题排序与 cycleFilter 守卫、历史筛选、搜索缓存维护等抽取为独立工具并补 Vitest 覆盖 | 417896d 6661456 ac11e58 990906a
    - OCR — 回退引擎使用 tesseract_languages 配置而非硬编码 chi_sim；检测滑条迁移至 SliderEntry | d92a409 498d031 fd06ac3
    - 前端一致性 — 修复注释与删除占位符乱码、批量删除结果重命名残留、窗口边界持久化与搜索历史帮助函数等 | b3bba33 313a8b0 666c2f5 8f13e4c

    工程与依赖
    - 依赖升级 — zip 8、RustCrypto 0.11/0.13 + rand 0.10、oar-ocr 0.9.2 / ort rc.13 / window-vibrancy 0.8；移除 walkdir，补 lockfile | f5cde22 eb81336 942af68 4f3d9b5
    - 测试与工具抽取 — 快捷键目标检测、日期查询边界、卡片高度估算及批删规划/回滚快照等补单测 | 47cd5af f866f40 696959c 88f3443

