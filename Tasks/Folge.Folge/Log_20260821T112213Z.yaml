Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    🎁 New Features
    - Capture Typing – Folge now creates steps from the text you type, not just from your clicks. Clicking into a field and typing becomes a single clean "Type ..." step.
    - WebP Image Format (Experimental) – A new image format for HTML and SCORM exports, at roughly half the file size of JPG with the same visual quality.
    - Custom JPG Quality – Pick any quality from 1 to 100 for exported images.
    - Overwrite Automated Backups – Automated backups can now replace the previous backup file instead of creating a new one every time, which is much friendlier for synced folders like OneDrive.
    - New Time Placeholders – Added [[Date_Time]], [[Guide_CreatedAt_Time]], and [[Guide_UpdatedAt_Time]].
    ⭐ Improvements
    - Much better JPG export quality.
    - HTML exports: clicking an image now shows it pixel-sharp at full resolution, and the zoom backdrop is slightly transparent.
    - The step description editor now uses the full height of the right sidebar.
    - Smarter focused view zoom: Folge now aims for a consistent visible area around each click, so large and ultrawide captures zoom in more and smaller windows less.
    🔧 Bug Fixes
    - WordPress export: images inside sub-steps are now uploaded correctly.
    - Placeholders can we used in tables in the cover page editor for PDF.
    - macOS: the first click after starting a capture now registers immediately.
    - Minor fixes and improvements.
ReleaseTime: 2026-08-22
