  Key: ReleaseNotes
  Value: |-
    🎁 New Features
    - Quick Guides – The fastest way to explain something in a few screenshots and paste it straight into an email or chat. Press Cmd+Shift+2 (Mac) or Ctrl+Shift+2 (Windows) from any app, drag over the part of the screen you want to show, and repeat for the next step. Add captions and annotations, and copy the result as an image or HTML.
    - Arrow Styles – Arrows can now be dashed or dotted, and each end can have its own shape: arrowhead, circle, square, diamond, bar, or none.
    - Step Number Shapes – Step numbers no longer have to be circles. Choose betwee square, rounded square, tag, and other shapes.
    - WordPress Block Editor Support – Guides are now published as native WordPress blocks.
    - WordPress Custom Post Types – Publish to any post type your site offers, such as documentation types from knowledge base plugins, not just Pages and Posts.
    ⭐ Improvements
    - Toolbar: hold a grouped tool button to open its submenu.
    - Cleaner destination pickers in the WordPress, Confluence, and Hudu export screens.
    - WordPress export: search now finds drafts and private items, and uploaded screenshots use the step title as alt text.
    - PowerPoint export: set a slide background color and footer font size.
    - Windows: shortcut icons are now displayed correctly.
    🔧 Bug Fixes
    - GIF and SCORM exports no longer fail when a title or description contains text pasted from a terminal or PDF.
    - Blurred areas no longer show a white border when used together with a spotlight.
    - AI features now work with the newest models, like GPT-5.5 and GPT-5.6.
    - Images now display correctly in guides exported to Hudu.
    - Minor fixes and improvements.
ReleaseTime: 2026-09-16
