- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    This release upgrades DeepSeek Harness to v0.1.5-rc.2, updates packaging across platforms, and improves checks for the packaged runtime and bundled skills. Stable and Beta include the same runtime upgrade and packaging improvements.
    DSH Desktop is a community-maintained open-source project, not an official DeepSeek product.
    New and improved
    - Upstream runtime upgrade: Updated from v0.1.5-rc.1 to v0.1.5-rc.2, along with desktop dependencies and compatibility patches.
    - Consistent packaging across platforms: Stable and Beta on macOS, Windows, and Linux now store application resources in ordinary directories instead of ASAR archives.
    - Aligned Windows Stable and Beta on normal compression.
    - Added checks for packaged file-system access, directory metadata, and discovery and reading of bundled Cordis skills.
    Fixes
    - Adjusted Electron launch configuration and validation rules to match the application structure without ASAR.
    - Corrected Windows Portable ZIP checks to validate the new application directory layout.
    - Updated macOS packaging, release, and runtime checks for the new resource paths.
    Usage notes
    Quit the previous version before installing. The bundled DeepSeek Harness v0.1.5-rc.2 is an upstream release candidate.
    Full changelog · Project website
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    本次更新将 DeepSeek Harness 升级至 v0.1.5-rc.2，并调整各平台打包方式，完善打包后的运行时与内置技能检查。稳定版与测试版包含相同的运行时升级和打包改进。
    DSH Desktop 是社区维护的开源项目，并非 DeepSeek 官方产品。
    新增与改进
    - 上游运行时升级：从 v0.1.5-rc.1 升级至 v0.1.5-rc.2，同步更新桌面端依赖和适配补丁。
    - 统一各平台打包方式：macOS、Windows、Linux 的稳定版与测试版均取消 ASAR 归档，以普通目录存放应用资源。
    - Windows 稳定版与测试版统一使用普通压缩级别。
    - 补充打包后文件系统访问、目录元数据和内置 Cordis 技能发现、读取检查。
    修复
    - 调整 Electron 启动配置与校验规则，使其匹配不使用 ASAR 的应用结构。
    - 修正 Windows Portable ZIP 检查，使其验证新的应用目录结构。
    - 同步更新 macOS 打包、发布和运行时检查，适配新的资源路径。
    使用提示
    请先退出旧版应用再安装。本次使用的 DeepSeek Harness v0.1.5-rc.2 为上游候选发布版本。
    完整变更记录 · 项目网站
