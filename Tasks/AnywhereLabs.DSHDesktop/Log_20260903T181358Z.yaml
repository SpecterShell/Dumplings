- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    DSH Desktop 2.0.5 adds compatibility with the latest stable upstream release.
    DSH Desktop is a community-maintained open-source project built on DeepSeek Harness. It is not an official DeepSeek product and does not represent DeepSeek’s official position.
    What’s New
    Improvements
    1. Windows Fixes
    Fixed several known issues on Windows.
    2. Recovery Assistant Fixes
    1. Fixed errors that occurred when switching Profiles or performing another action on the rollback selection page.
    2. Fixed an issue where creating a new Profile could become unresponsive and fail.
    3. Fixed an issue where attempting to load a deleted Profile prevented other Profiles from loading properly.
    3. Enhanced Stability and Compatibility
    New Features
    1. Support for the Latest Upstream Release — v0.1.2-rc.1
    Important: Upstream changes may cause many existing plugins to become unavailable or stop working.
    2. “Quick Recovery” in the Recovery Assistant
    1. Added guidance and a Safe Mode option to Quick Recovery.
    2. Safe Mode:
       1. Automatically creates a completely new Profile environment and opens it for the user to perform recovery operations.
       2. After the user exits Safe Mode, its environment and data will be deleted automatically the next time the application starts.
       3. Safe Mode uses an isolated environment and data directory instead of the default .dsh directory.
    3. Stable and Beta Version Compatibility
    1. The stable and Beta versions can be installed side by side, but they share the same data and configuration.
    2. A warning will appear if the same Profile is loaded by both the stable and Beta versions.
    Upgrade Instructions
    Upgrading from v0.1.0
    Download the appropriate v2.0.5 installer for your platform:
    - macOS: Open the new DMG, drag DSH Desktop into the Applications folder, and replace the previous version.
    - Windows: Run the new installer and follow the on-screen instructions.
    Upgrading from v2.0.0 or Later
    1. Right-click the application icon in the system tray to check for updates.
    2. In Extended Mode or Compatibility Mode, you can also check for updates from the version information section in the top navigation bar.
    We recommend closing the currently running version of DSH Desktop before upgrading.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    DSH Desktop 2.0.5 是最新上游的稳定版适配。
    DSH Desktop 是由社区团队维护的开源项目，基于 DeepSeek Harness 构建，并非 DeepSeek 官方产品，也不代表 DeepSeek 官方立场。
    主要更新
    优化
    一、修复部分 windows 上的已知问题
    二、修复恢复助手的部分已知 bug
    1. 切换 profile、选择回滚的页面二次操作的报错问题；
    2. 新建 profile 卡顿，导致新建失败；
    3. 加载已经删除的 profile 时无法正常加载其他 profile。
    三、增强稳定性，增强兼容性
    新增
    一、适配上游最新版本——v0.1.2-rc.1
    注意！！！： 因为上游更新可能会导致很多插件不可用
    二、恢复助手界面新增“快速恢复”
    1. 快速恢复新增引导信息和安全模式；
    2. 安全模式：
       1. 自动创建一个全新的 profile 环境，然后进入页面，用户在此进行操作；
       2. 用户一旦退出安全模式后，下一次启动时直接删除安全模式的环境及数据；
       3. 安全模式使用的是隔离的环境和数据，不是默认的.dsh 目录。
    三、与 beta 版
    1. 说明：稳定版和 beta 版可以共存，但是共享了数据和配置信息；
    2. 增如果同一个 profile 先后被稳定版和 beta 版加载，会出现警告。
