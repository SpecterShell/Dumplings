- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    This release keeps DeepSeek Harness at v0.1.5-rc.2 and focuses on Windows path compatibility, legacy preset upgrades, and third-party sidebar plugin compatibility.
    DSH Desktop is a community-maintained open-source project, not an official DeepSeek product.
    New and improved
    - Stable keeps DeepSeek Harness v0.1.5-rc.2 and continues to use the ~/.dsh data directory.
    Fixes
    - Fixed runtime commands and plugin installation failing on Windows when a user name or installation path contains non-ASCII characters.
    - Migrated the legacy default code preset to ptc, fixing preset-not-found errors when selecting a workspace or creating a session after an upgrade. Migration failures no longer block startup.
    - Fixed some third-party plugins designed for the Web interface being unable to locate the sidebar in extended and advanced modes.
    - Improved advisory text readability in light mode for shared-data-directory and Profile compatibility dialogs.
    Usage notes
    Quit the previous version before installing. The bundled DeepSeek Harness v0.1.5-rc.2 is an upstream release candidate.
    Full changelog · Project website
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    本次更新保持 DeepSeek Harness v0.1.5-rc.2，重点修复 Windows 路径兼容、旧预设升级和第三方侧边栏插件兼容性。
    DSH Desktop 是社区维护的开源项目，并非 DeepSeek 官方产品。
    新增与改进
    - 稳定版保持 DeepSeek Harness v0.1.5-rc.2，继续使用 ~/.dsh 数据目录。
    修复
    - 修复 Windows 用户名或安装路径含中文等非 ASCII 字符时，运行时命令和插件安装可能失败的问题。
    - 将旧版默认 code 预设迁移为 ptc，修复升级后选择工作区或新建会话时报预设不存在的问题；迁移失败时不再阻断启动。
    - 修复扩展和高级模式下，部分面向 Web 界面的第三方插件无法定位侧边栏的问题。
    - 改善浅色模式下，共享数据目录与 Profile 兼容性提示的文字可读性。
    使用提示
    请先退出旧版应用再安装。内置的 DeepSeek Harness v0.1.5-rc.2 为上游候选发布版本。
    完整变更记录 · 项目网站
