- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    This release keeps DeepSeek Harness at v0.1.5-rc.2 and focuses on Windows terminal startup, interface recovery, and desktop actions when the background service fails.
    DSH Desktop is a community-maintained open-source project, not an official DeepSeek product.
    New and improved
    - Stable keeps DeepSeek Harness v0.1.5-rc.2. Beta upgrades to v0.1.6-alpha.1 and defaults to its own ~/.dsh-beta directory.
    - After automatic interface recovery is exhausted, choose “Reload Interface” from the tray without quitting the app.
    - Aligned sidebar footer launchers vertically across presentation modes.
    - Windows now explicitly repaints content when restoring a window and allows the renderer to enter the background while minimized.
    Fixes
    - Fixed cmd, Windows PowerShell, and pwsh failing to start in read-only or workspace-write sandboxes on Windows.
    - Fixed “Open DSH Terminal,” “Export Diagnostics,” and “Restart” failing or getting stuck after the background DSH Host exits unexpectedly.
    - Fixed failed automatic recovery and a persistent blank window after repeated renderer crashes.
    Usage notes
    Quit the previous version before installing. The bundled DeepSeek Harness v0.1.5-rc.2 is an upstream release candidate. Stable continues to use ~/.dsh. If you also use Beta, read its release notes for the separate-directory and upgrade guidance.
    Full changelog · Project website
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    本次更新保持 DeepSeek Harness v0.1.5-rc.2，重点修复 Windows 终端启动、界面恢复，以及后台服务异常时的桌面操作。
    DSH Desktop 是社区维护的开源项目，并非 DeepSeek 官方产品。
    新增与改进
    - 稳定版保持 DeepSeek Harness v0.1.5-rc.2，Beta 升级至 v0.1.6-alpha.1，并默认使用独立的 ~/.dsh-beta 目录。
    - 界面自动恢复次数耗尽后，可从托盘选择“重新加载界面”，无需退出应用。
    - 统一各显示模式下侧边栏底部入口的纵向排列。
    - Windows 窗口恢复时显式重绘内容，最小化时允许渲染进程进入后台状态。
    修复
    - 修复 Windows 在只读或工作区可写沙箱下，cmd、Windows PowerShell 和 pwsh 可能无法启动的问题。
    - 修复后台 DSH Host 意外退出后，“打开 DSH 终端”“导出诊断信息”和“重启”失效或卡住的问题。
    - 修复渲染界面反复崩溃后自动恢复失败、窗口持续白屏的问题。
    使用提示
    请先退出旧版应用再安装。内置的 DeepSeek Harness v0.1.5-rc.2 为上游候选发布版本。稳定版继续使用 ~/.dsh；同时使用 Beta 的用户，请留意 Beta 发布说明中的独立目录与升级提示。
    完整变更记录 · 项目网站
