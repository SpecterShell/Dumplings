- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    DSH Desktop 2.0.4 adds compatibility with the latest upstream release.
    DSH Desktop is a community-maintained open-source project built on DeepSeek Harness. It is not an official DeepSeek product and does not represent DeepSeek’s official position.
    What’s New
    Improvements
    1. Windows Fixes
    1. Fixed several issues caused by the packaging changes introduced in v2.0.3.
    2. Improved installation speed.
    3. Removed the acrylic effect on Windows.
    2. Desktop Settings
    1. Fixed an issue where certain settings would apply globally across multiple Profiles.
    2. Added initialization detection: after upgrading from an earlier version, users will be guided through the initial setup again.
    3. Enhanced Stability and Compatibility
    New Features
    1. Support for the Latest Upstream Release — v0.1.2-alpha.1
    Important: Breaking changes in the upstream release may cause many existing plugins to become unavailable or stop working.
    2. “Allow Local Network Access” Now Uses HTTPS
    1. Manual confirmation is required when enabling this feature.
    2. Following the latest upstream changes, URLs must include a system-generated token. Please open the link from the corresponding settings page; otherwise, access will be denied for security reasons.
    Upgrade Instructions
    Upgrading from v0.1.0
    Download the appropriate v2.0.4 installer for your platform:
    - macOS: Open the new DMG, drag DSH Desktop into the Applications folder, and replace the previous version.
    - Windows: Run the new installer and follow the on-screen instructions.
    Upgrading from v2.0.0 or Later
    1. Right-click the application icon in the system tray to check for updates.
    2. In Extended Mode or Compatibility Mode, you can also check for updates from the version information section in the top navigation bar.
    We recommend closing the currently running version of DSH Desktop before upgrading.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    DSH Desktop 2.0.4 是最新上游版本的适配。
    DSH Desktop 是由社区团队维护的开源项目，基于 DeepSeek Harness 构建，并非 DeepSeek 官方产品，也不代表 DeepSeek 官方立场。
    主要更新
    优化
    一、修复部分 windows 上的已知问题
    1. 修复因为 v2.0.3 更换打包方式而引起的部分 bug；
    2. 优化安装速度；
    3. 移除 windows 的亚克力效果。
    二、桌面设置
    1. 此前某些设置会垮 profile 全局生效；
    2. 初始化检测：从旧版本升级后会重新引导用户进行初始化设置。
    三、增强稳定性，增强兼容性
    新增
    一、适配上游最新版本——v0.1.2-alpha.1
    注意！！！： 因为上游的破坏性更新会导致很多插件不可用
    二、“允许局域网访问”设置改为使用 https
    1. 使用这个功能时需要手动确认；
    2. 根据上游的更新，使用 url 访问时必须要附带系统生成的 token，因此请在对应的设置页面打开链接，否则会因为安全问题而被拒绝。
