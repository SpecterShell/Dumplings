- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    DSH Desktop 2.0.1 is a major update focused on improving the desktop experience, native capabilities, and installation reliability.
    DSH Desktop is an open-source project maintained by the community and built on DeepSeek Harness. It is not an official DeepSeek product and does not represent DeepSeek’s official position.
    What’s New
    Improvements
    1. Fixed several known crashes on Windows.
    2. Fixed a crash that could occur after switching workspaces on Windows.
    3. Improved installation speed on Windows.
    4. Enhanced stability and compatibility.
    5. Improved the workspace selection interface.
    New Features
    1. Intel Mac Support
    This release includes an installer for Intel-based Macs.
    2. Upgraded DeepSeek Harness to RC7
    Important: Some plugins have not yet been updated for compatibility with the latest upstream release. Please contact the relevant plugin developers regarding compatibility updates.
    3. Plugin Marketplace
    1. A built-in Plugin Marketplace plugin makes it easier to install, remove, and manage plugins.
    2. The open-source plugin development specification has also been published, allowing you to develop your own plugins.
    4. Logging
    DSH Desktop writes UTF-8 logs to the Electron user data directory:
    - Windows: %APPDATA%\DSH Desktop\logs
    - macOS: ~/Library/Application Support/DSH Desktop/logs
    5. Rollback and Recovery Assistant
    1. If the client crashes because a plugin or an AI model performs an incorrect operation, you can use the Rollback and Recovery Assistant to repair it.
    2. The Recovery Assistant can resolve most plugin-related issues. However, it cannot fix issues caused by software that severely violates standard development practices, such as directly modifying environment files.
    Upgrade Instructions
    Upgrading from v0.1.0
    Download the appropriate v2.0.1 installer for your platform:
    - macOS: Open the new DMG, drag DSH Desktop into the Applications folder, and replace the previous version.
    - Windows: Run the new installer and follow the on-screen instructions.
    Upgrading from v2.0.0
    Right-click the application icon in the system tray and select the update option.
    We recommend closing the currently running version of DSH Desktop before upgrading.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    DSH Desktop 2.0.1 是一次面向桌面使用体验、原生能力和安装可靠性的大版本更新。
    DSH Desktop 是由社区团队维护的开源项目，基于 DeepSeek Harness 构建，并非 DeepSeek 官方产品，也不代表 DeepSeek 官方立场。
    主要更新
    优化
    一、修复部分已知的 windows 端闪退
    二、修复 windows 端切换工作区后崩溃
    三、优化 windows 安装速度
    四、增强稳定性，增强兼容性
    五、优化选择工作区的界面
    新增
    一、Intel Mac 的支持
    本次版本提供了 Interl 芯片的 Mac 安装包。
    二、更新上游（DeepSeek Harness）版本到 rc7
    注意！！！： 部分插件暂未适配最新上游版本。请联系相关插件开发者适配。
    三、插件市场
    1. 内置了插件市场（插件），大家可以更方便的安装、删除、管理插件。
    2. 同步开源插件设计规范，您也可以依据此开发自己的插件。
    四、日志功能
    DSH Desktop 将 UTF-8 日志写入 Electron 用户数据目录：Windows 位于%APPDATA%\DSH Desktop\logs，macOS 位于 ~/Library/Application Support/DSH Desktop/logs
    五、回滚和恢复助手
    1. 如果因为插件或大模型自行执行了错误的操作导致客户端崩溃，可以使用回滚和恢复助手来修复。
    2. 恢复助手可以解决大部分插件的问题，但是不能解决某些极度不符合软件开发规范（如直接改环境文件）的软件引发的问题。
