- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    DSH Desktop 2.0.0 is a major release focused on the desktop experience, native capabilities, and installation reliability.
    DSH Desktop is a community-maintained open-source project built on DeepSeek Harness. It is not an official DeepSeek product and does not represent DeepSeek.
    Highlights
    A more complete desktop experience
    - Improved Compatibility Mode and Advanced Mode for both ready-to-use and advanced workflows
    - Refined native windows, title bars, and system tray behavior on macOS and Windows
    - Added a native NSIS installer and improved Mica window effects on Windows
    - Unified application icons, tray icons, and desktop branding
    Update checks and installer handoff
    - Added stable release checks from the system tray
    - Downloads begin only after explicit user confirmation
    - On macOS, the downloaded DMG is opened for manual application replacement
    - On Windows, users can confirm before launching the installer
    - Download failures do not interrupt the running application and can be retried later
    Profiles, plugins, and terminal tools
    - Added support for managing and switching DSH profiles
    - Added an Open DSH Terminal command to the system tray
    - Bundled matching Node.js, DSH CLI, and pnpm environments with the desktop package
    - Enabled plugin installation, updates, and management without modifying the global system PATH
    - Expanded profile, pnpm, and terminal services for third-party plugins
    Packaging and runtime reliability
    - Improved macOS signing, notarization, and release artifact verification
    - Fixed Windows packaging paths, permissions, and node-pty prebuild handling
    - Completed the packaged runtime closure for Host, Client, CLI, and dependencies
    - Added installer structure, platform format, and runtime integrity checks
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    DSH Desktop 2.0.0 是一次面向桌面使用体验、原生能力和安装可靠性的大版本更新。
    DSH Desktop 是由社区团队维护的开源项目，基于 DeepSeek Harness 构建，并非 DeepSeek 官方产品，也不代表 DeepSeek 官方立场。
    主要更新
    更完整的桌面体验
    - 完善兼容模式与高级模式，兼顾开箱即用和进阶使用场景
    - 优化 macOS 与 Windows 的原生窗口、标题栏和系统托盘体验
    - Windows 支持原生 NSIS 安装程序，并改进 Mica 窗口效果
    - 统一应用图标、托盘图标和桌面端品牌呈现
    更新检查与安装交接
    - 新增稳定版本检查，可从系统托盘检查更新
    - 发现新版本后先征得用户确认，再下载安装包
    - macOS 下载完成后打开 DMG，由用户手动替换应用
    - Windows 下载完成后可确认启动安装程序
    - 下载失败不会中断当前应用，可稍后重新尝试
    Profile、插件与终端能力
    - 支持管理和切换 DSH Profile
    - 新增从系统托盘打开 DSH Terminal 的能力
    - 桌面包内置匹配版本的 Node.js、DSH CLI 与 pnpm 环境
    - 无需修改系统全局 PATH，即可进行插件安装、更新和管理
    - 完善面向第三方插件的 Profile、pnpm 与终端服务接口
    打包与运行可靠性
    - 完善 macOS 签名、公证和发布产物校验流程
    - 修复 Windows 打包路径、权限与 node-pty 预构建问题
    - 完善打包后 Host、Client、CLI 与依赖运行时闭包
    - 增加安装包结构、平台格式和运行时完整性检查
