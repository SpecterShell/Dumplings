  Key: ReleaseNotes
  Value: |-
    1. 章节右键菜单新增「刷新目录」：外部改名后可重新扫描项目文件树；菜单高度按内容撑开，靠近窗口底部时会上移，不再出现滚动条。
    2. 正文删空后允许重新保存到原章：保存到章节库后若正文被清空或文件已不在，按钮不再永久禁用，也不会误存成下一章。
    3. 一键提取记忆成功后会写入章节完结状态，列表不再一直显示草稿；提取失败不改状态。
    4. MCP 复制出来的配置改成可直接导入的 JSON。
    5. 修复 Cursor CLI 模型档位拉取不完整的问题。
    6. 反重力 CLI 长输入改为分轮传递，避免正文指令被截断。
    7. 写作对话异常中断后残留的「进行中」状态会自动清理，不再一直拦着新的对话。
