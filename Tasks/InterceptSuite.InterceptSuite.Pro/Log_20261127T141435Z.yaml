  Value: |-
    InterceptSuite Pro 2.2.1
    27th November 2026 - Fixes traffic redirect on macOS and adds an Appearance setting with five themes.
    New features
    - Appearance setting with five themes. Choose your look in Settings. The default background is lighter, and the accent colour follows the logo.
    Fixes
    - Traffic redirect on macOS. 27 Setting up and starting a redirect failed with "macOS did not answer". It now works on macOS
    - The extension shows its icon in System Settings, so it is easy to recognise when you approve it.
    - No more "unknown certificate chain" warning on macOS.
    - Security Patch - Security patch added
