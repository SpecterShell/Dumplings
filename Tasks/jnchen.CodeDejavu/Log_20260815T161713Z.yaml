  Key: ReleaseNotes
  Value: |-
    新增
    - 新增 PiAgent 会话来源，支持 macOS、Windows 和 WSL 下的会话浏览、搜索、用量统计与
      pi --session 恢复，并可识别默认目录、环境变量和 Pi 配置中的自定义 sessionDir。
    - PiAgent 支持创建、恢复、重命名和删除快照；归档会话可在“归档”范围中继续查看和搜索，
      恢复前会生成 auto-* 备份，同时保留当前 auth.json 登录状态。
    - 会话详情可展示关联的 PiAgent 进程；PiAgent、Claude Code 和 OpenCode 进程保持只读，
      Codex 仍可在二次确认后关闭精确关联的进程树。
    改进
    - PiAgent 追加式树会话按持久化顺序完整展示，包括思考、并行工具调用、工具结果、压缩摘要、
      模型上下文与所有历史分支。
    - PiAgent 的原生与 WSL 数据、索引和快照按主机隔离；无关联进程时不显示进程操作入口。
    - 模型价格刷新、联网失败时的内置价格和厂商前缀规范化继续覆盖 Fable 5 及常用模型系列。
