  Key: ReleaseNotes
  Value: |-
    更新日志 v2.2.1
    性能
    - 优化曲库加载，优化载入速度
    - 列表排序移到后台执行，排序结果按需缓存
    - 播放时后台任务自动让出资源，播放更稳定
    - 封面缓存调整，滚动列表时封面显示更稳定
    - 文件夹、歌单、数据库加载提速
    歌词
    - 优化【垂直】上抬参数，变得更加丝滑哦
    - 优化在线歌词搜索匹配，应该更精准了
    - 搜索失败自动换关键词重试，增加备用方案
    - 新增「保留歌词歌曲信息」设置（默认开启）
    - TTML 翻译按系统语言选择版本
    - 选择歌词来源前先验证能否下载，失败时给出提示
    播放
    - 无法播放的文件自动跳过
    - 随机播放后切回单曲循环行为修正
    - 播放次数记录更可靠，统计页自动刷新
    - 优化独占模式在不同情况下的播放体验
    界面
    - 标签切换动画改为纯淡入淡出
    - 专辑详情按唱片分组显示
    - 新建歌单防重复提交，重名提示
    - 新增 F11 最大化 / 还原窗口快捷键
    桌面歌词
    - 进程通信重构，长时间运行更稳定
    - 新增「暂停时隐藏」选项
    - 锁定 / 解锁状态正确显示
    - 新增鼠标指针悬停在窗口上可解锁
    - 自定义已播 / 未播颜色正确同步
    歌曲信息
    - 支持读取更多音频格式的歌曲信息
    - 编辑歌曲信息支持唱片号
    背景 / 主题
    - 修复应用封面主题色异常
    - 动态背景按封面亮度自适应
