  Value: |-
    What's Changed
    - Windows on ARM64: release builds, PE header check, install test on ARM64 hardware by @echelon in https://github.com/storytold/filmcraft/pull/69
    - codecs: resampled MP4 audio reads apply the edit list once by @punkhop in https://github.com/storytold/filmcraft/pull/42
    - engine: file.exportInterchange refuses an unknown format by @punkhop in https://github.com/storytold/filmcraft/pull/46
    - interchange: an export names every title it cannot carry by @punkhop in https://github.com/storytold/filmcraft/pull/51
    - engine: a project saved after an interchange import opens again by @punkhop in https://github.com/storytold/filmcraft/pull/43
    - engine: sequence.inspect reports clip ends, gain and marker comments by @punkhop in https://github.com/storytold/filmcraft/pull/48
    - engine: sequence.inspect reports a reversed clip by @punkhop in https://github.com/storytold/filmcraft/pull/59
    - engine: clip.replaceFromBin can keep the clip's source In by @punkhop in https://github.com/storytold/filmcraft/pull/49
    - engine: Replace With Clip reports clips that run past the new media by @punkhop in https://github.com/storytold/filmcraft/pull/50
    - engine: a command whose targets are named in the parameters does not need a selection by @punkhop in https://github.com/storytold/filmcraft/pull/52
    - filmcraft: --help prints usage and an unknown option is an error by @punkhop in https://github.com/storytold/filmcraft/pull/47
    - engine: naming a track that does not exist is an error by @punkhop in https://github.com/storytold/filmcraft/pull/44
    - engine: timeline.place on an audio track places the sound there by @punkhop in https://github.com/storytold/filmcraft/pull/60
    - engine: timeline.move takes linked partners along by @punkhop in https://github.com/storytold/filmcraft/pull/45
    - edit: a ripple trim takes a later split edit along by @punkhop in https://github.com/storytold/filmcraft/pull/56
    - edit: ripple delete closes one gap for a clip with a split edit by @punkhop in https://github.com/storytold/filmcraft/pull/57
