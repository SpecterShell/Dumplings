  Value: |-
    Nomi· 诺米 2.5.3
    将 Antigravity CLI 调整为仅限人工直接交互的独立对话模式，禁止自动化编排、跨模型上下文回放与后端切换，并进一步对齐官方 ACP 协议规范。
    - 将 Antigravity 移出代理委派、模型路由预设与定时/后台任务，避免通过自动化流程调用。
    - 禁止在 Antigravity 与其他模型/底座之间互相切换、分叉对话或回放历史上下文，新建 Antigravity 会话保持独立对话与原样透传用户输入。
    - 取消 Antigravity 空标签后台预热与设置页打开时的自动登录探针，仅在用户主动发送消息或手动刷新时发起真实会话与状态检查。
    细节
    - 对 Antigravity 关闭外层沙箱包装、系统提示注入、computer-mcp 注入与自动续写提示词，保留原生工具与原始输入体验。
    - Antigravity 默认初始权限调整为逐项确认，不跟随全局「全部自动」开关默认放开。
    - 在 ACP initialize 握手中声明客户端标识与显式能力，会话退出时按服务端能力发送 session/close，移除硬编码的 --disable-telemetry 参数；模型列表优先通过不消耗会话配额的 agy models 获取并在必要时回退 ACP，同时不再直接读取本机凭据文件。
    English
    Restricts Antigravity CLI to direct interactive conversations—excluding automated orchestration, cross-model replay, and backend switching—and aligns its ACP lifecycle with official protocol requirements.
    - Remove Antigravity from agent delegation, routing presets, and scheduled/background tasks so it only runs under direct user interaction.
    - Block switching, forking, or replaying conversation history into or out of Antigravity; new Antigravity chats stay isolated and pass user prompts verbatim.
    - Stop background tab prewarming and automatic sign-in probing when opening Settings, initiating real ACP sessions or auth checks only when the user sends a message or clicks refresh.
    Details
    - Skip outer sandbox wrapping, system note injection, computer-mcp injection, and automatic follow-up prompts for Antigravity.
    - Default new Antigravity conversations and tabs to step-by-step confirmation (manual / ask) instead of inheriting global auto-approve.
    - Advertise clientInfo and explicit clientCapabilities during ACP initialize, send session/close on teardown when supported, drop hardcoded --disable-telemetry, prefer agy models before ACP model discovery fallback, and stop reading local credential files directly.
