  Value: |-
    Nomi· 诺米 2.3.16
    再次打开时，品牌开屏不会再一直停着；会话详情里的 Agents 跟着实时状态更新，空着输入框按 ↑ 找回的是刚发出的提问。
    - 让再次打开时的品牌开屏在 8 秒内收起。点「跳过动画」会马上关掉，会话和侧栏在后面继续加载。
    - 让会话详情的 Agents 跟上实时状态：这一轮刚出现的子任务马上列出来，并标成进行中；出错后在子任务里继续，会再显示进行中，这一轮结束后按它的结果显示。编程助手这一轮结束后还在跑的后台子代理，也按实时状态显示。
    - 在空着的输入框按 ↑，找回刚发出的那条提问。
    - 把标题栏里的会话详情按钮贴到显示或隐藏标签页的按钮旁边（间距 4px），不再挡住它。macOS 上不再空出大约 40px；Windows 和 Linux 上它仍留在最小化、最大化和关闭的左边。
    - 让侧栏的用量卡片只留彩色图标和原来的标记，不再写编程助手的名字。点开详情仍看得到名字。
    细节
    - 单个启动任务最多等 5 秒，字体最多等 1.5 秒。窗口藏着、排版帧排不上时，开屏仍会按时收起。启动过程中新建或清空会话，也不会让开屏一直等着历史加载。
    - 用量卡片上的名字仍留给读屏，点开的详情里也还在。
    English
    When you open Nomi again, the brand splash no longer stays up. Agents in session details follow live status, and ↑ in an empty composer brings back the question you just sent.
    - Close the brand splash within 8 seconds when you open Nomi again. Skip animation closes it at once, and conversations and the sidebar keep loading behind it.
    - Keep Agents in session details on live status: a sub-task is listed as running as soon as it appears in the current turn. After an error, continuing in that sub-task shows it running again, then the result of that follow-up. A background sub-agent that is still running after a coding-assistant turn ends keeps its live status.
    - Press ↑ in an empty composer to recall the question you just sent.
    - Place the session details button next to the button that shows or hides the tab row (4 px apart) so it no longer covers it. On macOS the extra gap of about 40 px is gone. On Windows and Linux it stays to the left of minimize, maximize, and close.
    - Leave the coding assistant's name off the sidebar usage card, and keep the colored icon and the same badges. The name is still in the details.
    Details
    - Each startup task waits at most 5 seconds, and fonts at most 1.5 seconds. If the window is hidden and layout frames do not run, the splash still closes on a timer. Starting a new conversation or clearing one during startup no longer leaves the splash waiting for history.
    - The usage card's name is still read by screen readers, and it remains in the details you open.
