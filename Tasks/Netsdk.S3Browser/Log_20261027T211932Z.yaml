  Key: ReleaseNotes
  Value: |-
    - Added drag-and-drop copying and moving of files and folders
    - Added bucket filtering by name, creation date, and region
    - Added column sorting and a flat display mode to the Versions tab
    - Added custom storage classes for Amazon S3 compatible accounts
    - Added per-account proxy and TLS certificate validation settings
    - Added an option to skip empty folders during Folder Sync
    - Expanded CLI account, listing, and sync options; cleaner output
    - Improved High-DPI scaling, dark-theme rendering, and dialog layouts
    - Fixed a possible hang while closing the application and saving settings
