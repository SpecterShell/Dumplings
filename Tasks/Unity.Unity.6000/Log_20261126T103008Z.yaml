  Value: |-
    Known Issues in 6000.6.11f1
    - Accessibility: [Android][GameActivity] Application Not Responding (ANR) when the app is sent to the background during startup with the Accessibility module included (UUM-162994)
    - Burst (Trunk): Burst native link fails with an "undefined symbol: strlen" error when building a Linux ARM64 dedicated server Player with IL2CPP (UUM-161029)
    - Multiplayer FPS/Third Person Templates: Crash on memcpy when entering Play mode in a project with Multiplayer FPS template (UUM-151778)
    - Multiplayer FPS/Third Person Templates: Multiplayer FPS Template has a continuous error loop when first opened on Linux (UUM-148119)
    - Native Editor Application Lifecycle: [WinEditor] Play Mode framerate drops significantly when moving the mouse cursor with high polling rate (UUM-142550)
    - Scene Management: Crash on Object::IsPersistent when applying an override on a Prefab in a specific project (UUM-161458)
    - Search: Search databases are leaked when calling SearchService.Request after domain reloads (UUM-161715)
    - SRP Foundation: RenderPass related Android errors are logged in Logcat and Console when physically rotating the device (UUM-157974)
    - WebRequest: UnityWebRequest keeps failing with "Cannot resolve destination host" for around 20~30 seconds when the network is restored on Android (UUM-163141)
    6000.6.11f1 Release Notes
    Features
    - Editor: Added the Update Time Budget preference which limits how long the Hierarchy window spends updating each frame. The default is 0.5 ms per update.
    Improvements
    - Editor: Improved Hierarchy window responsiveness in large scenes by spreading its update over multiple frames instead of completing it in a single blocking pass. (UUM-153593)
    - Graphics: Stopped the render thread from freezing when the async upload buffer is corrupted, and logged an error in that case in release builds too. (UUM-150567)
    Changes
    - Profiler: Changed "App Committed Memory" counter to return a sum of resident and swapped memory on Android. (UUM-155041)
    Fixes
    - 2D: Fixed a crash when Graphics.RenderSpriteInstanced rendered a Sprite whose Texture was destroyed before the Sprite was first drawn. (UUM-161488)
    - Android: Fixed problem with Back gesture/button closing the app after returning from background when "Run In Background" and "Predictive Back Support" are both enabled. (UUM-159613)
    - Asset Import: Fixed the Model Importer Materials tab showing a blank Location field for models that use the obsolete external materials mode. (UUM-161031)
    - Asset Pipeline: Fixed the Import Activity window logging a warning when the restored layout selected an asset that is not in the project.
    - Audio: Fixed a bug where the Quad speaker mode would never output more than 2 channels. (UUM-146928)
    - Audio: Fixed an issue where an Audio Source playing an Audio Random Container was silent while Time.timeScale was 0 if a Rigidbody was attached to the GameObject or one of its parents. (UUM-159324)
    - Audio: Fixed AudioSource.isPlaying returning false while a one-shot or sample provider was playing on an AudioSource that had previously played an Audio Random Container. (UUM-160362)
    - Build System: Avoid BuildProgram hang when trying to use https:// in a local path string. (UUM-131187)
    - Burst: Fixed incorrect struct size calculation for structs using StructLayoutAttribute.Pack with an under-aligned field. (UUM-143671)
    - Burst: Fixed that on weakly ordered memory architectures like ARM64, Burst now compiles volatile reads and writes to have acquire/release semantics. (UUM-159683)
    - Cache Server: Fixed connecting to a Unity Accelerator when no port is specified in the cache server IP address: the default port now follows the TLS/SSL setting (10443 with TLS enabled, 10080 without). (UUM-156913)
    - DX12: Fixed a crash in batch mode when rendering a camera to the screen. (UUM-159254)
    - DX12: Fixed an Editor crash when capturing an editor window that uses MSAA, such as the Inspector. (UUM-160893)
    - DX12: Fixed the -force-d3d12-debug command line argument reporting a missing Windows "Graphics Tools" optional feature when the D3D12 debug layer library was absent from the build instead. (UUM-137188)
    - Editor: Fixed a "FormatVariableName can only be called from the main thread" exception when ObjectNames.NicifyVariableName was called from a background thread, such as during Project Auditor analysis. (UUM-161327)
    - Editor: Fixed a crash when an editor extension passes an invalid index to ActiveEditorTracker.GetVisible or SetVisible. (UUM-160115)
    - Editor: Fixed an intermittent crash when quitting the Editor on macOS. (UUM-160348)
    - Editor: Fixed an issue where clicking a GameObject near the bottom of the Hierarchy window selected the GameObject above it when the display scale was set to a non-standard value such as 110%. (UUM-156214)
    - Editor: Fixed issue where the Editor crashed instead of exiting with an error when launched with -openfile in batch mode. (UUM-160183)
    - Editor: Graphics: Fixed an issue where depth-sorted entities rendered with Entities Graphics could disappear, or render with another entity's position, on Metal while an entity with an empty mesh was present. (UUM-159040).
    - Editor: Hierarchy: Fixed an error "HierarchyNode not found" when dropping an asset between items while the Hierarchy window is updating. (UUM-161561)
    - Editor: Hierarchy: Fixed an issue where a GameObject dropped between two others in the Hierarchy window moved to the bottom of the list when its parent or scene contained a hidden GameObject. (UUM-159508)
    - Editor: Prevent safe area objects from being manipulated by scene view gizmos. (UUM-144066)
    - GI: Fixed a NullReferenceException when generating lighting for an Adaptive Probe Volume Baking Set after unloading one of its scenes. (UUM-159309)
    - Graphics: Avoid crashing when uploading skinned mesh buffers to the GPU fails using GPU Batched skinning mode. The upload failure now results in a clear error message and skinned meshes may render incorrectly each frame the failure occurs. (UUM-141190)
    - Graphics: Component Activation/Deactivation tracked by ObjectDispatcher. (UUM-145787)
    - Graphics: Ensure correct backbuffer dimensions when using multiple displays. (UUM-134688)
    - Graphics: Fixed a GPU hang with DirectX 12 ray tracing under high GPU memory pressure, for example when baking Adaptive Probe Volumes in a scene with a large Terrain. (UUM-130872)
    - Graphics: Fixed a potential freeze or crash during scene loads when crunch-compressed cubemaps stream in at half-resolution or lower. (UUM-150567)
    - Graphics: Fixed a rare memory corruption in the Direct3D 12 renderer when warming up a GraphicsStateCollection. (UUM-153131)
    - Graphics: Fixed batch mode builds overwriting custom render queue settings in materials. (UUM-147947)
    - Graphics: Fixed crash in GraphicsCaps:IsFormatSupported when creating a RenderTexture with an out-of-range RenderTextureFormat value. (UUM-158897)
    - iOS: Fixed crash on FindWorkspaceDocumentForPath when the Xcode process launched by Build And Run is replaced by another application. (UUM-156774)
    - Kernel: Fixed a crash when JobsUtility.CreateJobReflectionData was called with a null Type. An ArgumentNullException is now thrown instead. (UUM-150954)
    - Linux: Fixed a crash on Linux when the window manager closed the Editor launch screen during project load. (UUM-132175)
    - Linux: Fixed il2cpp.usym being generated without usable source paths on Linux when the toolchain emits DWARF v5 (Clang 15+). (UUM-150040)
    - macOS: Fixed an issue where an exported Xcode project failed to build at the code signing step when Burst debug symbols were included. (UUM-156483)
    - Particles: No longer ignores custom data during particle prewarm. (UUM-160600)
    - Profiler: Fixed an issue where scrolling the CPU Usage Timeline view with the mouse wheel was much slower than in other Editor views. (UUM-137730)
    - Scene/Game View: Fixed the camera frustum gizmo in the Scene view keeping its old shape after the camera's target Render Texture was resized. (UUM-140016)
    - Scripting: Scripting: free the Mono type name string in scripting_type_get_reflection_qualified_name. (UUM-160774)
    - Security: Fixed a potential crash in text shaping caused by a null-pointer dereference in HarfBuzz when memory allocation fails. (UUM-153188)
    - Services: Fixed the Organization and Cloud project dropdowns in Project Settings > Services opening away from their fields on Windows when monitors use different display scales. (UUM-159338)
    - Shaders: Fixed an assertion failure when calling Shader.SetGlobalVectorArray with an invalid property ID that was previously used with a different property type. (UUM-161397)
    - Shaders: Fixed an Editor crash on Metal when a shader pass raised its target for a fragment-only keyword (for example #pragma target 5.0 with a keyword) and the GPU Resident Drawer was enabled. (UUM-156494)
    - SRP Core: Added a dedicated alpha upscale pass to preserve the alpha channel of the camera output. (UUM-135242)
    - Terrain: Fixed grass billboards and SpeedTree7 billboards not receiving real-time lights with the Deferred or Deferred+ rendering path when Use Rendering Layers is enabled. (UUM-156479)
    - TextCore: Fixed an issue where the Characters field in the Font Subsetting section of the TextCore Font Asset Inspector did not update when a subset was applied from the Properties window. (UUM-156933)
    - TextMeshPro: Fixed a "TextMesh Pro Essential Resources are missing" error that could appear when closing the TMP Importer window after importing the TMP Essential Resources. (UUM-147231)
    - UI Toolkit: Fixed a reorderable TreeView dropping nothing when the dragged item leaves the window and comes back before the drop. (UUM-161109)
    - UI Toolkit: Fixed an issue where a Translate UXML attribute value lost its Z component when its X and Y components were equal. (UUM-159483)
    - UI Toolkit: Fixed changes being ignored when a list read back from an inline style property, such as style.transitionProperty, was modified and assigned back to the style. (UUM-161384)
    - UI Toolkit: Fixed changes being ignored when a MaterialDefinition was modified and assigned again to an element's inline style, and fixed such changes affecting the inline style before it was assigned.
    - UI Toolkit: Fixed inconsistent and unclear counter names and tooltips in the UI Toolkit and UI Toolkit Details Profiler modules. (UUM-149707)
    - UI Toolkit: Fixed SVG import using the fill from an earlier "<style>" element when a later "<style>" element overrides the same class. (UUM-161453)
    - UI Toolkit: Fixed the End key moving the caret to the start of the next line in multiline text fields that use the Advanced Text Generator. (UUM-157916)
    - Unity Physics: Fixed a NullReferenceException when calling Collider.ToMesh() on a sphere or capsule collider, or a compound collider containing one, in Edit Mode or when entering Play Mode. (UUM-160642)
    - URP: Fixed Forward+ point lights being missing or cut off in tile-shaped blocks when a camera renders to a Render Texture and Render Scale is not 1. (UUM-160869)
    - URP: Fixed multi-display support in standalone URP 2D/3D applications. (UUM-155833)
    - VFX Graph: Added an issue where the GPU could crash during editor time object destruction. (UUM-159682)
    - VFX Graph: Fixed duplicate property and category names that end in a number, such as "New Vector 3", having that number incremented instead of getting a counter in parentheses, such as "New Vector 3 (1)". (UUM-157382)
    - VFX Graph: Fixed duplicating a category giving its properties names longer than the property name length limit.
    - VFX Graph: Fixed duplicating a custom attribute whose name starts or ends with an underscore, such as "_heat", removing that underscore from the copy's name.
    - VFX Graph: Fixed duplicating a property or category with a name at the length limit leaving two spaces before the counter.
    - VFX Graph: Fixed duplicating a property, category or custom attribute whose name ends in a large number, such as "Group (2147483647)", giving the copy a negative number.
    - VFX Graph: Fixed duplicating a property, category or custom attribute whose name ends in a number almost as long as the length limit replacing the whole name with the counter.
    - VFX Graph: Fixed opening a graph giving a property the name of a later property, which then got a new name instead.
    - VFX Graph: Fixed opening a graph removing leading and trailing underscores from property names and giving duplicate property names an underscore counter. (UUM-155586)
    - VFX Graph: Fixed property and category names keeping leading and trailing whitespace other than spaces, such as tabs, which opening a graph now also removes from existing property names.
    - Video: Fixed a crash with DirectX 12 when changing the URL of a playing VideoPlayer on Windows. (UUM-141179)
    - Video: Fixed potential crash when opening multiple webcam sessions. (UUM-155060)
    - XR: Now when using intermediate textures in URP (such as with post-processing), the XR eye texture will no longer force MSAA when enabled which previously incurred a performance cost with no additional benefit due to already resolving to 1x sampling before the final pass. (UUM-155648)
