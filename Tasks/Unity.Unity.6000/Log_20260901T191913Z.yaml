    - Physics 2D: Added: Added "ChainSegmentGeometry.CreateSegments()" method to create an array of ChainSegmentGeometry based upon a set of vertices. This can be used as an alternative to using PhysicsChain directly. (UUM-141997)
    - Physics 2D: Added: Added "PhysicsChain.UpdateVertices()" method so a PhysicsChain can now update its vertices. This removes the need to recreate the chain or iterate all existing segments, changing each one individually. (UUM-141997)
    - Physics 2D: Added: Added aPhysicsUserData.objectValueId property to expose the EntityID used for the objectValue property. The property now also displays the EntityId, object name, and type as a tooltip, or "None" if no Entity exists, or "Invalid Object Id" if the EntityID does not represent a valid object. (UUM-134952)
    - Physics 2D: Added: PhysicsComposer can now both get or destroy all composers using PhysicsComposer.GetComposers() and PhysicsComposer.DestroyAll() methods. (UUM-134952)
    - Physics 2D: Added: PhysicsComposer can now convert both CircleGeometry and CapsuleGeometry to PolygonGeometry using a static method of PhysicsComposer.ToPolygons(). (UUM-134952)
    - Physics 2D: Added: PhysicsWorld, PhysicsBody, PhysicsShape and PhysicsJoint can set owner-only PhysicsUserData with SetOwnerUserData() and retrieve it with .ownerUserData. (UUM-134952)
    - Physics 2D: Obsoleted: "ChainGeometry(ReadOnlySpan<Vector2> vertices)" is now obsolete as it can lead to invalid vertices when used with managed arrays. Please use "PhysicsChain.Create(PhysicsBody body, ReadOnlySpan<Vector2> vertices, PhysicsChainDefinition definition)" instead. (UUM-141997)
