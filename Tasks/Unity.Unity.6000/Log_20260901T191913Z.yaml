    - 2D: Fixed Global Lights 2D error in URP 2D when opening a scene for preview. (UUM-141886)
    - 2D: Fixed GridView showing empty space after scrolling to the bottom of the GridView for Tile Palette Brush Picks. (UUM-142144)
    - 2D: Fixed Install 2D Package button is disabled when it should not be. (UUM-143583)
