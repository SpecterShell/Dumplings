    - Graph Toolkit: Added: Added API to set, get, and clear wire visuals in Play mode. The wire visuals are set using the WireAppearance struct, which determines the width, opacity, dashed appearance, and animation state of the wire.
    - Graph Toolkit: Added: Added API to the Graph Visualization Context class to allow developers to set a fill amount and a looping animation on a node's accent.
    - Graph Toolkit: Added: Added overloads to GraphLogger to make it possible to add actions associated with the logs. These can be quick fixes to the logged issue or arbitrary code.
    - Graph Toolkit: Added: Added the Graph.AssetGuid API to retrieve graph and subgraph asset GUIDs.
    - Graph Toolkit: Added: Added the Graph.IsConnectionAllowed API to define ports constraints.
    - Graph Toolkit: Added: Added the INodeOption.TrySetValue API.
    - Graph Toolkit: Added: Added: API to set, get, and clear Port Previews. Port previews are labels displayed next to ports and can display port information as a string in both Edit Mode and Play Mode.
    - Graph Toolkit: Changed: Added an overload to the NodeAttribute constructor that accepts a path to a stylesheet. The specified stylesheet is applied to VisualElement instances of that Node type.
    - Graphics: Added: Added additional overloads to the GraphicsStateCollection APIs, AddVariant, AddVariants, RemoveVariant, and ContainsVariant that now allow passing in an explicit GlobalKeywords list to use when specifying variants.
    - Graphics: Added: Added ReflectionProbeSortingCriteria.ImportanceThenSizeInverse and CullingOptions.SkipTexturelessReflectionProbes.
    - Graphics: Added: Added LoadFromJson function to GraphicsStateCollection that allows to load collections directly from a JSON-formatted string.
    - Graphics: Added: Added UnityEngine.Rendering.GraphicsApiValidation.IsValidationSupported(), which returns true only when the active GraphicsDeviceType has a validation-layer backend.
    - Graphics: Added: Extend the GraphicsStateCollection Importer Inspector window to link Shaders to existing shader assets.
    - Graphics: Changed: Moved the GraphicsStateCollection API from UnityEngine.Experimental.Rendering to UnityEngine.Rendering namespace.
    - Graphics: Changed: Renamed the public UnityEngine.D3D12Validation class to UnityEngine.GraphicsApiValidation.
    - Graphics: Obsoleted: RayTracingAccelerationStructure.InstanceData.instanceID is deprecated. Use entityId instead.
    - Graphics: Obsoleted: RenderParams.instanceID is deprecated. Use entityId instead.
    - HDRP: Added: Added an Editor-only graphics validation function to enable warnings for specific platforms.
    - iOS: Added: Added iPhone 17e device generation enum and screen cutouts.
    - iOS: Deprecated: The X86_64 and Universal options for the iOS Simulator Architecture setting are now marked as deprecated.
    - Kernel: Obsoleted: TransformAccessArray.Add(int instanceId) is obsolete. Use TransformAccessArray.Add(EntityId) instead.
    - Netcode for Entities: Added: Added NetworkStreamDriver.Disconnect that has some checks before disconnecting, and is in the same place as where Connect is located.
    - Netcode for Entities: Added: When using the experimental single world host, added BroadcastTargets to SendRpcCommandRequest to filter RPCs from being sent to the host world when sending RPCs from server to all clients.
    - Netcode for Entities: Deprecated: Added UnmanagedGhostPresentationGameObjectPrefab, an unmanaged IComponentData equivalent of GhostPresentationGameObjectPrefab (now deprecated) that references its client/server prefabs through UnityObjectRef<GameObject>. The Ghost Presentation GameObject baker populates both variants during the deprecation window. Please only use UnmanagedGhostPresentationGameObjectPrefab moving forward.
    - Netcode for Entities: Obsoleted: NetworkDriverStore.Disconnect is obsoleted in favor of the new NetworkStreamDriver.Disconnect.
