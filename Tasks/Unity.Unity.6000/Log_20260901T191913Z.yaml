    - Entities: Added: Add ReadOnlySpan overload to DynamicBuffer<T>.AddRange
    - Entities: Added: Added EntitySceneImporterDeterminismChecker.Check to help validate if a SubScene's bakers bakes deterministically.
    - Entities: Added: Added the CompanionComponent<T> unmanaged wrapper and the EntityManager.GetCompanion<T> extension so that companion components can be read from systems without using the obsolete managed component API.
    - Entities: Added: Added BlobArray<T>.AsSpan(), returning a ReadOnlySpan<T> view on the underlying data.
    - Entities: Added: Added BlobString.AsSpan(), returning a ReadOnlySpan<byte> view of the underlying UTF-8 characters.
    - Entities: Added: Adds an excludedFlags parameter to TypeManager.GetSystemTypeIndices, by default to WorldSystemFilterFlags.Disabled, then all existing callers are unaffected. (UUM-140773)
    - Entities: Added: Introduced IDebugOnAdded and IDebugOnRemoved, which can be added to an IComponentData to receive callbacks when the component has been added/removed to/from an Entity.
    - Entities: Added: RequestSceneLoaded now has an optional ImportEntity field, also exposed via SceneSystem.LoadParameters.ImportEntity, that references a main-world entity whose components are copied into each section's streaming world before ProcessAfterLoadGroup runs. Use this to deliver per-instance data (for example, a unique transform offset) to ProcessAfterLoad systems on scenes loaded with SceneLoadFlags.NewInstance.
    - Entities: Changed: HierarchySubSceneHandler has been renamed to HierarchySubSceneAuthoringHandler, to better describe its purpose. If you are making use of the HierarchySubSceneHandler class, please update your code to HierarchySubSceneAuthoringHandler instead.
    - Entities: Changed: IDebugOnAdded and IDebugOnRemoved callback signatures now require Entity parameter. Update callbacks from OnAdded(ref T component) to OnAdded(Entity entity, in T component).
    - Entities: Deprecated: Managed components are now deprecated and will be removed in a future version.
    - Entities: Deprecated: PlaybackPolicy for EntityCommandBuffers have been deprecated. In the future EntityCommandBuffers can only be played back once. This is done as multi-playback has caused a lot of bugs in the past and required extensive infrastructure.
    - Entities: Deprecated: The static class EntitiesJournaling is scheduled for removal in a future release. It is recommended to remove dependencies on this API.
    - Entities: Deprecated: PostLoadCommandBuffer is deprecated. Build the per-instance data on a regular entity in the main world and pass it via SceneSystem.LoadParameters.ImportEntity (or set RequestSceneLoaded.ImportEntity on the scene or section meta entity). The streaming system copies the referenced entity into the per-section streaming world for ProcessAfterLoadGroup systems to query.
    - Entities: Deprecated: SubScene.HierarchyColor is now obsolete because the SubScene Hierarchy color support has been removed from the Hierarchy window.
    - Entities Graphics: Changed: RenderMeshArray is now an unmanaged shared component; query it with GetSharedComponent<RenderMeshArray> instead of GetSharedComponentManaged.
    - Entities Graphics: Deprecated: Support for OpenGL ES for Entities Graphics is deprecated. While the graphics API itself remains a valid choice, the Entities Graphics package specifically will no longer support it in a future version of Unity.
    - GI: Added: Added UnityComputeGPU enum to LightingSettings.Lightmapper. Use this light baker for cross platform GPU light baking.
