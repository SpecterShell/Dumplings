    Final 6000.6.0f1 Release Notes
    Features
    - 2D: Added a text filter for the Active Target drop down menu in the Tile Palette.
    - 2D: Added extensibility for Light2D and ShadowCaster2D components via custom provider classes to modify or extend their behavior.
    - 2D: Added Light2D shader stripping support. Option to enable it can be found in the Renderer2DData asset.
    - 2D: Added rendering layer mask support for Lights2D.
    - 2D: Added the Tilemap Profiler module.
    - 2D: You can now link a brush or palette to an active target in the Tile Palette. When switching to a new active target, the Tile Palette switches to the corresponding linked brush or palette.
    - 2D: You can now render the active brush's icon or name next to the brush marquee in the Scene view. This can be toggled in Preferences > 2D > Grid Brush.
    - Android: Removed legacy and round Android icons.
    - Asset Pipeline: Import result caching in the Accelerator is now disabled by default for new projects since Unity 6.5. Projects upgrading to U6.5 can continue to cache import results, if they already have cache configuration enabled.
    - Audio: Added support for using AudioClip as a scriptable generator.
    - Build Pipeline: Added a jsonl log file in the build history containing messages logged during the build. Both Player and ContentDirectory builds now create this file.
    - Build Pipeline: The build report directory for player builds now contains a trace event profile file BuildPlayerTEP.json. This is a copy of Library/Bee/buildreport.json, which is overwritten for each build. By being part of Build History it is possible to see results from past builds, and to compare build performance.
    - Core: Added automatic stripping of Tetgen (used by LightProbes) if not using it, to reduce the build size.
    - Core: Added Dictionary serialization and authoring in the Inspector with sort-by-key and duplicate-key detection.
    - Documentation: Added a step in the UDP docs pipeline to resolve xref links in engine documentation.
    - Editor: Added a new expression node to simplify inlining mathematical statements.
    - Editor: Added a new shortcut to toggle Gizmos in the Scene view.
    - Editor: Added a slider to the CanvasGroup editor to adjust the alpha value.
    - Editor: Added custom footer actions to the derived platform sdk.
    - Editor: Added custom styling support for lists and array from the DataTypeStyleMapper.
    - Editor: Added Mesh Collider triangle counts to the Project Auditor Mesh Colliders view.
    - Editor: Added Selection History, users can now use optional buttons in the main toolbar or Ctrl/Cmd+[ and Ctrl/Cmd+] keyboard shortcuts to navigate the history of selected objects. This allows users to return to a previous selection if they accidentally change the active Inspector object.
    - Editor: Added selection wireframe support for GPU Resident Drawer (GRD).
    - Editor: Added support for customizing the Sprite Editor minimum and maximum zoom range in Preferences > 2D > Sprite Editor window (50%-5000%; defaults: 90% minimum, 5000% maximum).
    - Editor: Added the 2D Graphics Profiler module.
    - Editor: Added the Swift project type (experimental) option in iOS Player settings.
    - Editor: Added Vivox to Quick Installer menu.
    - Editor: Added Volume and Vertex Density columns to the Project Auditor Meshes view.
    - Editor: Enabled Define Constraints for native plugins in the Plugin Inspector across platforms.
    - Editor: GTK : Added list support for variables in the Blackboard and Inspector.
    - Editor: GTK : Added support for the flag attribute on enum fields.
    - Editor: Improved memory usage by sharing detail atlas textures across Terrain tiles with identical non-instanced detail prototypes.
    - Editor: Improved the Project Auditor to now use theAutoStaticsCleanup analyzer when Roslyn is enabled.
    - Editor: Project Auditor: add Target Framework column to Precompiled Assemblies table.
    - Editor: Re-Adding the Linux Headless Simulation build target for Simulation Pro clients.
    - Editor: The macOS Editor is now signed and notarized by Apple for added security. It is no longer necessary to override the system security policy to start the Editor application.
    - Editor: The Project Auditor now detects the use of API that will become obsolete in a future Unity version.
    - Editor: [uGUI] Added the SafeArea component to inset RectTransform by the device reported SafeArea.
    - EmbeddedLinux: Added an option to select the Full or Thin Link Time Optimization (LTO) mode.
    - Entities: Added ECS Components to the new Hierarchy search filter window.
    - Entities: SubScene nodes in the Hierarchy window now support double-click to toggle open/close, and right-click context menu actions for Reimport and Open/Close.
    - Entities: You can now use IComponentData, ISharedComponentData, IBufferElementData, or ICleanupComponentData to filter the Hierarchy. To do so, enter t:ComponentName in the search field. For example: t:LocalToWorld. Make sure you have the new Hierarchy enabled, as this feature only works there.
    - GI: Added the Unity Compute GPU Light Baker. This new light baker is built upon Unity .compute shaders and can utilize hardware accelerated ray tracing. On devices without hardware raytracing a compute shader based emulation path is used. When upgrading to the Unity Compute Light Baker, note that the Unity Compute Light Baker samples the environment and emissive surfaces with the direct sample count. To improve quality increase the direct sample count. To reduce bake time, set GPU Baking Profile to Highest Performance.
    - Graph Toolkit: Added Graph Visualization feature that allows reporting visualization data to a GraphToolkit graph. This can be used in Edit mode or Play mode to visualize data within the graph.
    - Graphics: Added GPU Resident Drawer telemetry to the Rendering Profiler module including a Chart Mode dropdown for GRD views and a details card with coverage, culling, LOD, and pipeline timing breakdowns.
    - Graphics: Added Mesh LOD GPU Instancing support.
    - Graphics: Added per shadow cascade small mesh culling values to support more aggressive shadow culling.
    - Graphics: Introduced Hardware Profiles. Fine-tune Graphics API selection and filter devices on Android using the new Editor scripting API, allowing faster deployment of APK configuration changes.
    - Graphics: Modified the Frame Debugger to display inner ConstantBuffer values that are now transferable over a remote connection.
    - iOS: Added support for gRPC through UnityWebRequest on iOS.
    - iOS: Split the UnityFramework target and created public API module UnityFrameworkAPI.
    - Kernel: A modernised logging backend is now available for editor platforms. The framework is enabled by default but can be disabled via Editor Preferences. The new framework allows us to easily support structured logging. When enabled, structured logging output is written to a new file, Editor.jsonl, created alongside the existing Editor.log. This makes it significantly easier to parse, filter, and integrate editor logs with external tools and log aggregation pipelines. Player support is planned for a future release.
    - License: Added Kerberos proxy authentication support.
    - Linux: Added an option to select the Full or Thin Link Time Optimization (LTO) mode.
    - Multiplayer: Added support for using transports originally written for Netcode for GameObjects directly within Unity Transport, via the new NetworkTransportInterface network interface.
    - N/A (internal): Added libupb library support for InsightModules (auto generate C code & library linking).
    - Netcode for Entities: Added interpolation smoothing support for ghost prefabs when in Single World mode by interpolating the LocalToWorld values between the current and last tick's LocalTransform result. If this smoothing is enabled, the host player observes about half a ticks worth of input latency on smoothed ghosts. This feature is not yet supported for GameObject ghosts.
    - Netcode for Entities: Added support for overiding GhostComponentVariation defaults through baking code. Add the GhostVariantBakedOverride dynamic buffer, then use the Append... extension methods to set a new default variant for that prefab. Note: The IBaker.AppendToBuffer method does not support adding to the same buffer from two different bakers.
    - Networking: UnityWebRequest now support TLS 1.3. No change is required to enable this. The protocol is automatically used with servers that support it. TLS 1.2 remains supported and is used with servers that don't support 1.3.
    - Package: Moved the Performance Testing API package from its own repository into the Unity Engine as a built-in package.
    - Package Manager: Added a View More Samples button to the Samples details tab.
    - Package Manager: Added a package signature check confirmation dialog for non-interactive .unitypackage imports, with a Console-log fallback in batchmode.
    - Package Manager: Added an images field to the package Sample class to allow displaying images in the Samples details tab.
    - Package Manager: Added multi-select support to bulk import, re-import, and update samples.
    - Package Manager: Added publish date as a sorting option in the samples page.
    - Package Manager: Added signature information in the Import window for .unitypackage files.
    - Package Manager: Display name of the .unityPackage coming from outside of the Asset Store is nicified to be more readable.
    - Physics 2D: Added a Buoyancy feature: Use PhysicsBody.BuoyancyInput struct with PhysicsWorld.ApplyBuoyancy(), PhysicsBody.ApplyBuoyancy(), PhysicsShape.ApplyBuoyancy() to apply buoyancy forces to an area, specific bodies, or specific shapes.
    - Physics 2D: Added a Wind feature: Use PhysicsBody.WindInput struct with PhysicsWorld.ApplyWind(), PhysicsBody.ApplyWind(), PhysicsShape.ApplyWind() to apply wind forces to an area, specific bodies, or specific shapes.
    - Physics 2D: Added PhysicsSpace type to provide generic broadphase and narrowphase access for existing physics objects or custom objects. Includes built-in queries such as OverlapAABB(), OverlapPoint(), CastRay(), and CastShape(), which can be customized for custom objects.
    - Profiler: Added a Hide 0ms Samples filtering option in the Profiler Hierarchy, Raw Hierarchy, and Inverted Hierarchy views for the CPU and GPU modules.
    - Profiler: Added a Screenshots module to Profiler and the ability to pin modules to the top of the Profiler window. You can control the capture rate of screenshots from the Profiler preferences.
    - Profiler: Added macOS support for managed code symbols when using usamply.
    - QNX: Added an option to select the Full or Thin Link Time Optimization (LTO) mode.
    - Scripting: Added Managed Code Variant Player Setting (ManagedCodeVariant enum + PlayerSettings.GetManagedCodeVariant / SetManagedCodeVariant) controlling diagnostic preprocessor defines emitted to player scripts independently of the native binary configuration. Checked and instrumented variants get new preprocessor defines UNITY_ENABLE_CHECKS and UNITY_INCLUDE_INSTRUMENTATION, respectively.
    - Shaders: Added Shader Build Settings the capability of having a list of numerical constants defined globally for the shaders. Since Shader Build Settings can be controlled per build profile, this allows having different constants for different build targets without modifying the shader assets.
    - Shaders: Added shader compiler selection control between FXC and DXC on DX12 targets to ShaderBuildSettings.
    - TextMeshPro: Added support for ReadOnlySpan<char> to SetText().
    - uGUI: Added Max width and Max height properties to the ILayoutElement interface. The ContentSizeFitter PreferredSize fit mode now respects Max width and Max height from Layout Elements. Added a Clamped fit mode to ContentSizeFitter.
      HorizontalLayoutGroup, VerticalLayoutGroup, and GridLayoutGroup now calculate their max width and Max height.
    - uGUI: Added the RaycastReceiver component.
    - uGUI: Made the Selectable methods IsPressed and IsHighlighted public.
    - UI Toolkit: Added a new scene search filter for visual element references called veRef. This can be used to do the following:
      - veRef:any: Match any reference.
      - veRef:empty: Match references with an empty path and no panel renderer.
      - veRef:missing: Match references where the path does not resolve to an element or the PanelRenderer/VisualTreeAsset is missing.
      - veRef:[1/2]: Match references with a partial path match.
      - veRef=[1/2/3]: Match references with an exact path match.
    - UI Toolkit: Added animation support for the cursor style property and type-filtered asset fields for
      object-reference style curves in the Animation Window.
    - UI Toolkit: Added animation support for BackgroundPosition and BackgroundRepeat to UI Toolkit.
    - UI Toolkit: Added initial support for the CSS backdrop-filter property to UI Toolkit.
    - UI Toolkit: Added mesh modification callbacks that allow iterating through the generated meshes and altering them.
    - UI Toolkit: Added Scene view picking support for VisualElement.
    - UI Toolkit: Added support for custom vertex data to UI Toolkit custom meshes.
    - UI Toolkit: Added support for simulate.Click on world-space content in UIToolkit Test Framework.
    - UI Toolkit: Added the drop-shadow filter function.
    - UI Toolkit: Added transform handles for VisualElements in staging mode.
    - UI Toolkit: Introduced a UXML upgrade framework for applying automated UXML upgrades to fix common issues and deprecated patterns. It can be accessed from the VisualTreeAsset Inspector or through script via UnityEditor.UIElements.UxmlUpgradeService.
    - URP: Added depth as input attachment support to URP shaders and draw transparent pass.
    - URP: Added On-Tile Post Processing to optimize GPU bandwidth for Tile Based GPUs on platforms such as Android and iOS.
    - URP: Enabled the Extensible On-Tile Renderer using the Tile-Only Mode setting.
    - Version Control: Added Add to Source Control and Undo Changes actions for folders from the Project browser and Inspector.
    - Version Control: Added a new Branch Explorer to visualize and navigate branches.
    - Version Control: Added persistence for all splitter positions across window reloads and sessions.
    - Version Control: Added support in the merge view to partially apply a shelve.
    - Version Control: Added the F2 keyboard shortcut to rename branches and labels.
    - VFX Graph: Added a button in the ShaderGraph output contexts to quickly create a new ShaderGraph supporting VFX Graph from a template and use it in the context.
    - VFX Graph: Added support for Shader Subgraph Promoted Properties and Keywords generates Input ports in VFX Graph Output.
    - VisionOS: Added support for gRPC through UnityWebRequest on VisionOS.
    - Web: Add plugin settings for Web Platform: Allow to configure compatibility of plugins with certain Web build settings(Exception Support, WebAssembly 2023, Native C/C++ Multithreading, WebAssembly 64-bit). Plugins are automatically selected for a build depending on the current build settings.
    - Web: Added support for building Player that uses up to 16 GB of WebAssembly memory (Wasm64).
    - Web: Added support for progressive asset loading on the Web, which enables improved load times by downloading assets on a per-scene basis.
    - Web: Enabled Burst for builds using WebAssembly64.
    - Web: Updated Emscripten SDK compiler toolchain used by Unity's Web platform from earlier Emscripten 3.1.38 to version 4.0.19.
    Improvements
    - 2D: Added Delaunay triangulation and subdivision support to SpriteImporter.
    - 2D: Added more detail to the Tilemap.GetTiles API when the withinBounds parameter is set to true. (UUM-136524)
    - 2D: Improved how Sprite Atlases generate when Block Offset is greater than 1. Sprite placement offsets now span the full atlas in this case. (UUM-143877)
    - 2D: Improved shadow caster performance for shadow providers.
    - 2D: Improved SetBlendShapeWeight out-of-bounds error message. (UUM-136992)
    - 2D: Shadow caster 2D now supports GPU skinning when the Casting source is SpriteSkin.
    - 2D: SpriteRenderer: Optimized SpriteRender processing when trailing blend shape channels have zero weight.
    - Accessibility: Added support for AccessibilityState.Expanded on Android.
    - Adaptive Performance: Improved the samples in the Adaptive Performance package to function in an OpenXR environment.
    - Android: Added a new context menu in the Project window to create .androidlib plugins (Assets > Create > Plugins > Android Library).
    - Android: Added code examples for the AndroidAssetPacks API.
    - Android: Added profiler markers for Android input system initialization and event processing.
    - Android: Android integration tests now assert on expected editor errors instead of silently suppressing them.
    - Android: Fixed an issue where multiple unnecessary append line calls occurred back to back in Android Gradle project generation.
    - Android: In PlayerSettings->Android->Gamepad Support Level settings will be applicable and visible for both - Android TV and regular Android devices.
    - Android: Matched initialization sequence between Activity and GameActivity.
    - Android: Moved UnityPlayerGameActivity.java and UnityPlayerActivity.java from PlatformDependent/AndroidPlayer/Source/Java/com/unity3d/player/ to PlatformDependent/AndroidPlayer/Source/Java/com/unity3d/player_entries/.
    - Android: Now caching microphone permission state instead of interacting with the Android system each time when checking it. (UUM-135443)
    - Android: Removed AndroidApiLevel from AndroidUtilities.cs and switched all places to AndroidBuild.Version.apiLevel.
    - Animation: Added a field to the AnimationEvent inspector to control the reporting of errors when the event method cannot be found on the target object.
    - Asset Pipeline: Added clarification detail the differences between the various 'preview' type helper functions that exist to fetch an image to represent an asset in some way.
      AssetDatabase.GetCachedIcon
      AssetPreview.GetAssetPreview
      AssetPreview.GetMiniThumbnail
      AssetPreview.GetMiniTypeThumbnail
      Also added the EntityID overload for AssetPreview.IsLoadingAssetPreview, so we're not linking to a function signature that is marked obsolete.
    - Asset Pipeline: AssetDatabase.GetCachedIcon is now much faster when called for the first time on a Scriptable Object (and no longer deserializes the object in question).
    - Asset Pipeline: The VideoClip importer is now running out of process when "parallel import" is turned On in the project settings.
    - Audio: Added support for up to third-order Ambisonic audio (16 channels), increased from first-order (4 channels) only. Ambisonic decoder plug-ins can now receive up to 16 input channels.
    - Audio: Enabled EnhancedAudioFoundation on Linux
    - Build Pipeline: BuildPipeline.BuildContentDirectory used with the option BuildContentOptions.FailBuildWhenErrorsLogged will also fail if any asset included in the build had errors during their import.
    - Build Pipeline: Improve build errors for build usage asset issues.
    - Build Pipeline: Improved build errors for build usage asset issues to mention the Game Objects tab in Project Auditor.
    - Build Pipeline: Improved Build Pipeline callbacks documentation to mention ContentDirectory and how to use the version number and BuildPipelineContext to enforce dependencies and rebuild of scenes properly.
    - Build Pipeline: Player builds now report BuildSteps for all pre/post callbacks in the BuildReport. Fixed collection of logged messages and ability to fail a build during IPostProcessBuildWIthContext callbacks.
    - Build Pipeline: The BuildReports for Player Builds are collected in the Library/BuildHistory to allow retrieval of past builds for comparison and analysis purposes. the history location can be configured (and history erased) in the BuildPipeline section of the Preferences dialog.
    - Build System: Updated the bundled 7-Zip to version 26.00.
    - Build System: Updated the bundled 7-Zip to version 26.01.
    - Build System: Updated the bundled 7-Zip to version 26.02.
    - Core: Optimized string comparisons/searches.
    - Documentation: Clarified in the MonoBehaviour.OnValidate scripting reference when values set by OnValidate are saved and when they exist in memory only. (UUM-134473)
    - Documentation: Updated Project Auditor documentation to include the new Game Objects section and improved welcome view.
    - DX12: Added "NVIDIA Aftermath" automatic GPU crash dump generation for extra analysis. The Editor must be started with a new argument -force-d3d12-nvidia-aftermath (can not be combined with -force-d3d12-debug, -force-d3d12-debug-gbv).
    - Editor: - The Platform Browser package list now shows a Deprecated label next to packages that Unity marks as deprecated (registry/version deprecation and/or curated lifecycle deprecation).
      - Deprecated packages can display a tooltip with the deprecation message when one is available.
    - Editor: Added a "Shader Compiler Backend Selection" section to Shader Build Settings to choose the shader compiler backend per graphics API. It's currently exposed for D3D12 (FXC or DXC). Settings are configurable per build profile only and require a Graphics override on the profile.
    - Editor: Added a Hierarchy GameObject icon preference with options for components and gizmos, components only, and GameObject icons only.
    - Editor: Added a new Project Auditor check for AnimationEvent parameters on MonoBehaviour event callbacks.
    - Editor: Added a search field to the Animation Property Selection popup.
    - Editor: Added fixes and improvements to the LightingSearch feature.
    - Editor: Added informational HelpBox at the top of the Colors panel explaining that some colors may not be available until their associated tool or window is opened at least once. This addresses user confusion about "missing" color settings caused by lazy static initialization of PrefColor fields.
      Reduced visual clutter and make navigation easier by converting categories into collapsible foldouts' after last entry
    - Editor: Added minor design improvements for the Platform SDK custom actions in the Build Profiles window footer.
    - Editor: Added options in Project Settings > Graphics to enable automatic Pipeline State Object (PSO) tracing and prewarming using the GraphicsStateCollection API. This allows easier access to the performance improvements provided by the GraphicsStateCollection API.
    - Editor: Added support for a sticky Inspector header.
    - Editor: Added support in FrameTimingManager for getting GPU frame times from XR devices running OpenXR.
    - Editor: Added the ability to cycle the mode of the dynamic panel overlay container.
    - Editor: Added the relevant URP replacement component button to the BIRP deprecation message help box.
    - Editor: Adjusting a RectTransform's pivot now properly handles rotated and scaled transform hierarchies, as well as counter-adjusts non-RectTransform children.
    - Editor: Changed the no animatable properties message when searching and no results are available.
    - Editor: Improved diagnostics checks for LMDB MDB_BAD_RSLOT runtime errors. (UUM-110320)
    - Editor: Improved documentation for RectTransform.reapplyDrivenProperties, RectTransform.ForceUpdateRectTransforms(), and RectTransform.ReapplyDrivenProperties.
    - Editor: Improved HierarchyV2 Drag and Drop to support multi-type drag.
    - Editor: Improved performance and reliability of the Unity Editor in multi-display environments on Windows platform.
    - Editor: Improved performance for first time script compilation in the Editor. (UUM-137057)
    - Editor: Improved responsiveness in Project Settings > Quality, resulting in faster OnInspectorGUI performance and smoother scrolling. (UUM-136218)
    - Editor: Improved Roslyn rules' diagnostic messages for dictionary serialization.
    - Editor: Improved the quality of search results in Preferences and Project Settings, by removing certain generic keywords from Unity's built-in SettingsProviders.
    - Editor: Improved the RSUV sample to leverage the new shader reflection API.
    - Editor: Improved UX and performance for the levels table in Project Settings > Quality. (UUM-136218)
    - Editor: Optimized asset preview loading by eliminating a copy of the preview image data.
    - Editor: Project Auditor: flag issues for unsafe use of EntityId.
    - Editor: Refactored Physics Debug Inspector UI so it uses common Inspector window patterns.
    - Editor: Removed the warning under Canvas component when Normal or Tangent are enabled in Overlay mode. (UUM-137367)
    - Editor: Texture dependency tracking for the project's "HDR Cubemap Encoding", "Texture Compression Formats" and "Color Space" Player Settings is now done in a more fine-grained manner. This means that changing any of these settings typically results in a smaller number of textures being re-imported.
    - Editor: The macOS Rosetta 2 installation helper app is no longer necessary and has been removed.
    - Editor: The SceneView camera extension for HDRP has been converted to UITK and it is now per Scene view.
    - Editor: The serialization rules analyzer will now warn about unsupported tuples and FormerlySerializedAs being shadowed by actual serialized properties.
    - Editor: UI Toolkit: The UI Toolkit Debugger is now also accessible from Window > Analysis, in addition to its existing location under Window > UI Toolkit.
    - Editor: Updated the existing required components structure to no longer be no-op.
    - Editor: When compressing textures to Crunch formats using "EditorUtility.CompressTexture" / "EditorUtility.CompressCubemapTexture", Unity will now compress without perceptual colorspace distance metrics if it is able to determine that the texture to compress is a normal map (similarly to the TextureImporter). The detection mechanism is driven by internal "usage modes" that are not exposed today: as such, textures created through script are unaffected.
    - EmbeddedLinux: Core configuration handling is improved.
    - Entities: Changed SubScene nodes in the Hierarchy window to be named after the SubScene and displayed with the Scene icon.
    - Entities: Improved the Entities Memory profiler module and the Entities Structural Changes profiler module by indenting children in the hierarchy, making it easier to parse the data in the module.
    - Entities: Memory allocations from Entities, Collections, and Entities Graphics now appear with descriptive labels in the Memory Profiler, making it easier to identify and debug memory usage in ECS-based projects.
    - Entities: Switched the Entities Component inspector to use Quick Search.
    - Entities: Switched the Entities Relationship inspector to use Quick Search.
    - Entities: The WorldTime Entity is now hidden in the Hierarchy to reduce clutter in the Hierarchy window. Hidden Entities can be made visible in the Preferences > Entities > Show Hidden Entities.
    - Entities: World nodes now remain visible in the Hierarchy window when filtering on Entities, matching the behavior of Scene nodes.
    - Entities: Write link.xml when building Entities Content.
    - GI: Added Gradient mode support for environment lighting in Surface Cache.
    - GI: Eliminated undefined behavior that caused stack corruption resulting in crashes and hangs. (GFXLIGHT-2141)
    - GI: Reduced light leaking issues with the Surface Cache.
    - GI: Surface Cache now reacts to the Environment Intensity setting from Lighting / Environment.
    - GI: Use hardware raytracing when available in Surface Cache.
    - Graphics: Add guards against null index buffer in GfxDeviceGLES::DrawBuffersBatchMode. (UUM-135891)
    - Graphics: Add texture-compression version dependency tracking to the TextureImporter to unlock finer-grained forced reimports of Textures upon future compressor code changes.
    - Graphics: Added shadow map caching for Quad Views in XR to skip redundant shadow work in the inner view pass.
    - Graphics: Updated the mipmap streaming manual pages to describe how Unity selects mipmap levels from mesh UV data and camera positions, clarified the behaviour for objects Unity can't calculate a level for (including procedurally-generated geometry such as Particle Systems), and added a Texture2D.requestedMipmapLevel code example. (UUM-131691)
    - Graphics: XR: Implemented three shader micro-optimizations to improve GPU performance on Meta Quest headsets.
    - Graphics: Mesh.vertexBufferTarget and Mesh.indexBufferTarget now throw an InvalidOperationException when changing the buffer target on a mesh that lacks the data required to recreate its buffers. (UUM-131725)
    - HDRP: Added a warning message for DepthOfField Inspector on certain platforms.
    - HDRP: Improved Inspector messaging to indicate when advanced water features could impact performance on a given platform.
    - HDRP: Improved inspector messaging when RTX, SSS, or Film Grain can have a perfomance impact in a given platform.
    - HDRP: On building the project. Show messages about RTX, SSS or Film Grain performance impact if the platform will have a performance impact.
    - HLSLcc: Missing shader intrinsics 'firstbitlow' and 'firstbithigh' now emit software fallback on GLES 3.0/WebGL2.
    - IL2CPP: Added Intrinsics for Interlocked.Compare and Interlocked.CompareExchange.
    - IL2CPP: Build il2cpp with nativeaot again. This restores some conversion time performance that was lost when we had to switch back to coreclr due to https://github.com/dotnet/runtime/issues/121632.
    - IL2CPP: Improved performance of field access in fully shared generic code.
    - IL2CPP: Optimized selection of isinst/castclass handlers in generic code.
    - IL2CPP: Performance improvements for generic delegates in fully shared generic code.
    - IL2CPP: Reduced binary size by deduplicating generic methods.
    - IL2CPP: Reduced generated code size when accessing generic sharing data from a non-generic method on a generic type.
    - IL2CPP: Reduced metadata memory usage of implemented interface data on classes.
    - IL2CPP: Reduced overall size and improved build time by moving code generated metadata to the global-metadata.dat file.
    - IL2CPP: Reduced size of generated generic code.
    - IL2CPP: Reduced storage size of generic method defintions
    - IL2CPP: Reduced the size of generic method pointer tables.
    - IL2CPP: Removed a small set of metadata initialization code.
    - IL2CPP: Removed redundant initialization checks in generic code.
    - IL2CPP: Removed redundant initialization checks on static access and in generic code.
    - IL2CPP: Removed runtime metadata initialization checks for types that we can guaranteed are loaded at startup.
    - IL2CPP: Removed un-needed generic sharing context from methods that make no use of the data in the context.
    - IL2CPP: Small reduction in amount of the generic sharing metadata IL2CPP generates.
    - IL2CPP: [InternalsVisibleTo] attributes will no longer survive code trimming when targeting il2cpp.
    - Installer: Installers on Windows can now take up to 60% less time due to an optimization in the compression strategy. (UUM-136633)
    - iOS: Gyroscope.updateInterval now reports the effective update interval, including OS limitations and adjustments.
    - Mono: Added support for TLS 1.3 in the networking APIs.
    - Multiplayer: Added a warning on the Multiplayer Center Quick Starts page reminding users that samples require the project to be linked to cloud services.
    - Multiplayer: Fixed Write access error with "VirtualProjectSettings.json" when creating a MPPM Player Tag with Perforce connected.
    - Multiplayer: Install buttons now show a disabled "Installing..." state while a package or sample installation is in progress.
    - Multiplayer: Prompting users to save current seen before importing a sample from the multiplayer center.
    - Multiplayer: Unity Transport will not drop packets that arrive out of order but within the same frame anymore (for unreliable sequenced pipelines). This could lead to unnecessary packet loss in network environments with heavy jitter.
    - Multiplayer: Unity Transport: Implementations of INetworkInterface are no longer required to be unmanaged types. Consequently, there is now no need to call WrapToUnmanaged on network interfaces and this API is thus now deprecated.
    - Netcode for Entities: Added Single World Host compatibility to the Network Profiler. Improved contextual information messages explaining profiler behavior across different networking configurations, including Single World Host, Dedicated Server, and Client-only scenarios. Added a visual indicator for host mode configuration and renamed ClientAndServerWorld to HostWorld for clarity.
    - Netcode for Entities: Improved the readability of byte values in the Ghost Snapshot Tab of the Netcode Profiler.
    - Netcode for Entities: Removed the 'must be a serialized component' limitation from the GhostComponentVariation dropdown selection in the GhostAuthoringInspectionComponent, as non-serialized components already support things like PrefabType stripping, just not explicitly. Handling of invalid ComponentOverrides has also been improved.
    - Netcode for Entities: Support for variants so they can target internal ECS components (as long as they are part of the same assembly).
    - Netcode for Entities: Turning off new GameObject missing connection event warning by default for entities connection flows.
    - Netcode for Entities: MaxSendRate is now bypassed when ArchetypeChunk structural changes (i.e. order changes) occur, so that ghost spawns and deletions are not delayed or rate-limited. Note that bandwidth consumption may increase marginally.
    - Netcode for Entities: NetworkTime.PredictedTickIndex is now incremented on Server and Host worlds, aligning its behavior with Client worlds.
    - Package Manager: Removed the icons in the Asset Store buttons to make them consistent.
    - Particles: Improved ParticleSystem size on disk by stripping out unused curves. This should improve loading performance of ParticleSystems in the Editor, which affects prefab operations.
    - Particles: Refactored Particle Shader Includes to use UnityTexture2D instead of TEXTURE2D_ARGS for mutualization with Shader Graph.
    - Particles: Refactored Particle shaders to not write to CBuffers, for DXC compliance.
    - Physics: Added a drop-down offering the ability to switch between multi-threaded and single-threaded simulation under Project Settings -> Physics -> Settings -> GameObjects. (UUM-144574)
    - Physics 2D: PhysicsComposer now implements the IDisposable interface where the public IDisposable.Dispose method simply calls PhysicsComposer.Destroy(). (UUM-134952)
    - Profiler: Added a details panel to the Highlights module in the Profiler Window.
    - Profiler: Added Deep Profiling support to CoreCLR Players.
    - Profiler: Added support for profiling GC.Alloc events on CoreCLR scripting backend
    - Profiler: Added two new colors to the Color Blind Mode palette for the Highlights Profiler module.
    - Profiler: Profiler Capture List rename/frame time UI rework.
    - Profiler: Replaces the legacy CustomSampler-based implementation of ProfilingSampler in com.unity.render-pipelines.core with the ProfilerMarker / ProfilerRecorder API.
    - QNX: Core configuration handling is improved.
    - Scripting: Implement LayerMask.ToString to return a comma separated list of each Layer Name in the mask
    - Scripting: Improved the error message when a player build fails due to assemblies referencing 'UnityEditor.dll'. The output includes offending assembly list.
    - Search: Improved performance when merging Search Index artifacts of large projects with "Deep Indexing" enabled. (UUM-133013)
    - Shadergraph: Added a custom binding hint to match behavior in subgraph properties. (UUM-136838)
    - Shadergraph: Added an option in subgraphs to mark them for deprecation.
    - Shadergraph: Added Apply and Revert to Shader Graph importer settings for consistency with other importers.
    - Shadergraph: Added the ability to set custom pragmas, includes, and defines on Shader Graphs.
    - Shadergraph: Disabled the main preview context menu when using a UITK workflow. (UUM-140044)
    - Shadergraph: Gave subgraph node dropdowns an opaque background. (UUM-143563)
    - Shadergraph: Hid reflected functions that do not have a provider key are no longer presented in the SG searcher. (UUM-136837)
    - Shadergraph: Improved alignment of Shader Graph project settings. (UUM-135930)
    - Shadergraph: Improved padding on inline sliders. (UUM-143533)
    - Shadergraph: Improved Particle Shader Graph Templates to support Mesh GPU Instancing and Texture Sheet Animation.
    - Shadergraph: Improved UGUI Shaders sample to take advantage of promoted properties and subgraph improvements, by replacing former custom nodes with subgraphs.
    - Shadergraph: More reflected information is now presented in the node inspector for reflected functions.
    - Shadergraph: Mutualized Particle Includes between Shader Graph and URP (with shared includes in RP Core), exposing Particle Shader Functions to Shader Graph with Reflection API.
    - Shadergraph: Reflected Functions now support hints for API management: Version, Deprecated, and Obsolete.
    - Shadergraph: Reflected Functions support grouping, allowing multiple functions to be handled by a single node, selectable via dropdown.
    - Shadergraph: Shader graphs with long path names should now open correctly. (UUM-142738)
    - Shadergraph: Suppress superfluous warning messages when slot count changes from keyword/dropdown properties. (UUM-143642)
    - Shadergraph: Updated the Node Reference sample to include new nodes (Append, Switch, Expression and Reflected Functions).
    - Shaders: Added an "Unapplied Changes" dialog that appears when navigating away from the Shader Build Settings UI with pending modifications.
    - Shaders: Improved shader compilation reliability and performance with updated shader compilers, including DXC 1.10.2605.2 and SPIRV-Cross 1.4.341.0.
    - Shaders: Surface shaders now use caching preprocessor for the analysis step.
    - Shaders: Updating unlisted shader properties via Material Set[Type] APIs mark the material dirty.
    - Shaders: Pass.CompileVariant() / ShaderUtil.CompileShaderVariant() now read from and write to the shader disk cache, so repeated calls with identical inputs return cached results instead of recompiling from source.
    - SRP Core: Added Search filter for Rendering Debugger.
    - SRP Core: Improved performance for RenderGraph compilation on large graphs.
    - SRP Core: Improved render pipeline creation performance by avoiding debug UI initialization.
    - SRP Core: Improved the way VolumeManager collects VolumeComponent types to avoid slow reflection overhead on Player startup. (UUM-134911)
    - TextMeshPro: * Added OnFontMaterialRequest callback to complement the existing OnFontAssetRequest callback that allows custom loading of font related resources that are not contained in a Resources folder when using the <font> and <material> markup tag variants.
      - Added new variant to the <font> markup tag to allow referencing a font asset by the source font's family and style name. Example: <font familyName="Roboto" styleName="Bold">. This new variant assumes the referenced font asset has already been loaded.
      - Added missing OnColorGradientRequest callback to provide the same custom loading functionality that is available with the <font> and <material> markup tags.
      - Added OnCharacterRequest callback to allow loading font asset resources based on the requested character.
    - uGUI: Improved uGUI Canvases and Canvas renderers batching performance. They no longer invalidate their respective batches when their global transformation matrix changes as long as their transformation matrix remains the same relative to their root Canvas (or target Camera if the Canvas is set to the ScreenSpace render mode).
    - UI Toolkit: Added a documentation shortcut button in the UI Toolkit Profiler module.
    - UI Toolkit: Added a Find References in Scene option to the right-click context menu for visual elements in the Hierarchy window that have an authording-id.
    - UI Toolkit: Added a HelpBox with button to enable the Hierarchy window v2 when Hierarchy Integration is enabled. (UUM-133279)
    - UI Toolkit: Added an option in the UI Builder to export the UXML Attributes of elements in alphabetical order.
    - UI Toolkit: Added an updater metrics table in the UI Toolkit Profiler module.
    - UI Toolkit: Added events support in UI Toolkit Profiler module.
    - UI Toolkit: Added panel component details to the Profiler panel view.
    - UI Toolkit: Added per-batch render metrics and Details view to profiler.
    - UI Toolkit: Added totals row in batch detail view in UI Toolkit profiler.
    - UI Toolkit: Added UI Toolkit Batch Breaking Reason into the Frame Debugger.
    - UI Toolkit: Added TreeView support to Visual Element Reference picker.
    - UI Toolkit: Fields with data bindings will now be disabled and always show the live value in the inspector.
    - UI Toolkit: Handle package paths in UI Builder.
    - UI Toolkit: Improved element creation performance by using pre-allocated and static data for some common event callbacks.
    - UI Toolkit: Improved error handling in UXML attribute parsing. Previously silent attribute parsing failures are now reported through the importer as warnings for the UXML asset. (UUM-126240)
    - UI Toolkit: Improved GPU performance by reducing the area where edge antialiasing is applied on default meshes.
    - UI Toolkit: Improved memory usage for event callback registration.
    - UI Toolkit: Improved memory usage of VisualElement hierarchy data.
    - UI Toolkit: Improved mesh update performance.
    - UI Toolkit: Improved performance of USS selector matching
    - UI Toolkit: Improved performance of USS variable resolution.
    - UI Toolkit: Improved performance of VisualElement.UpdateWorldTransformInverse. (UUM-138067)
    - UI Toolkit: Improved performance of VisualElement.SetEnabled method.
    - UI Toolkit: Improved readability of batch breaking reasons in batch detail view in UI Toolkit profiler.
    - UI Toolkit: Improved LayoutNode initialization performance.
    - UI Toolkit: Reduce GC allocations when parsing USS properties the first time
    - UI Toolkit: Reduced garbage collection allocations during style matching.
    - UI Toolkit: Reduced overhead of registering element for style processing.
    - UI Toolkit: Reduced overhead of using numerous @import statements in a Theme or Style Sheet, getting performance closer to having all selectors inlined directly.
    - UI Toolkit: Reduced the memory footprint of the layout algorithm.
    - UI Toolkit: Removed internal reference to IMGUIContainer in the player, enabling the type to be stripped from builds.
    - UI Toolkit: Removed the "Element" from the Visual Element Reference picker so it no longer says "Select VisualElement Element Reference...".
    - UI Toolkit: The "Find References in Scene" option for Visual Elements is now always shown but disabled it when its not available instead of it being hidden.
    - Unity Physics: Improved query performance for Collector Types (Any, Closest, All) for query types: Raycast, ColliderCast, Point Distance and Collider Distance, when casting against a MeshCollider. Improvement is particularly observable with Burst enabled. (UUM-146273)
    - Unity Physics: Only perform direct solver related processing when required, that is, when either joints or contacts require use of the direct solver. (PHYS-729)
    - Unity Physics: ScheduleUpdateBroadphase previously overwrote the dynamic-tree update's JobHandle with the static-body change-check handle before scheduling the static-tree update, dropping the dynamic-tree job from the dependency chain, which can cause job safety errors when invoking Unity.Physics systems manually (for example; as is done by Netcode for Entities).
    - Unity Physics: Unity.Physics jobs (BakeGeometryJobs, mesh-hashing baking systems) are now [BurstCompile]-decorated on 32-bit ARM Android in addition to 64-bit Android which relies on Burst supporting ARM32, which is the case in current Unity versions.
    - URP: Improved performance of URP Lit shader for the URP forward render path by pack per draw batch light indices into a single float4 uniform.
    - URP: Improved shader performance by removing a dynamic branch in URP shaders that was used to test whether a surface is opaque or transparent.
    - URP: URP specific shader macro 'FIRST_BIT_LOW' is obsolete, intrinsic 'firstbitlow' now functions correctly on all supported platforms.
    - VFX Graph: Reduced the number of shader variants produced by VFX Graph outputs in builds.
    - WebGL: Lifted restriction of integer vertex attributes which was inherited from WebGL 1 and GLES 2 and isn't relevant anymore for WebGL 2 and GLES 3+.
    - Windows: Improved performance of issuing async reads with DirectStorage
    - Windows: Improved performance on loading archive files with DirectStorage enabled.
    - XR: Added support for transparent and UI elements for SpaceWarp (UGUI & TMP).
    - XR: Added XRLayoutType enum and derived properties to XRPass for explicit XR rendering layout identification, replacing fragile multi-condition checks across URP and HDRP.
    - XR: Implemented four shader micro-optimizations to improve GPU performance on Meta Quest headsets. As a side effect, DistanceAttenuation function now takes three arguments on the Meta Quest platform.
    - XR: Improved GPU performance on Meta Quest devices when a render batch is not affected by spotlights.
    - XR: Updated the default settings for the Meta Quest Build Profile's custom Quality Setting.
    API Changes
    - 2D: Added: Added overloads for RenderSpriteInstanced to support List, NativeArray, and ReadOnlySpan.
    - Adaptive Performance: Added: Added CpuUtilization and GpuUtilization APIs for CPU and GPU utilization.
    - AI: Added: Added new structs in the Unity.AI.Navigation.LowLevel namespace with methods that you can call in jobs. To help you debug race conditions, the added queries can throw safety exceptions when ENABLE_UNITY_COLLECTIONS_CHECKS is defined. The new structs are: NavWorld, NavNode, NavLocation and NavQueryBuffer. Two new enums, NavQueryStatus and NavNodeType, help in various operations.
    - Android: Added: Added PlayerSettings.Android.gamepadSupportLevel, the UI was already present, only API was missing.
    - Android: Added: Added support for SDK Platform 37.
    - Android: Changed: AndroidGamepadSupportLevel.SupportsDPad was renamed to AndroidGamepadSupportLevel.None.
    - Animation: Obsoleted: GenericBinding.scriptInstanceID is deprecated. Use scriptEntityId instead.
    - Animation: Obsoleted: GenericBindingUtility.BindProperties(GameObject, NativeArray<GenericBinding>, out NativeArray<BoundProperty>, out NativeArray<BoundProperty>, Allocator) is deprecated. Use the overload which includes out instanceIDProperties instead.
    - Apple TV: Deprecated: The X86_64 and Universal options for the tvOS Simulator Architecture setting are now marked as deprecated.
    - Asset Pipeline: Changed: Deprecated AssetImportContext.GetArtifactFilePath in favour of AssetImportContext.GetArtifactData.
    - Asset Pipeline: Deprecated: Removed the AssetdatabaseExperimental.ActiveOnDemandMode API. The OnDemand feature was experimental and could cause a deadlock when used.
    - Audio: Added: Added GeneratorInstance.Result.isFinished and Finished() to determine whether a nested generator finished producing samples.
    - Audio: Added: Added UnityWebRequestMultimedia.GetAudioClip(string uri, AudioType audioType, bool ambisonic) overload and corresponding DownloadHandlerAudioClip constructors for loading ambisonic audio from StreamingAssets or other runtime sources.
    - Audio: Removed: Removed a number of obsolete audio APIs.
    - Build Pipeline: Added: Added the method BuildReport.LoadReport() to support loading BuildReports files from past builds, regardless of their location inside or outside of the active Unity project.
    - Build Pipeline: Changed: Made BuildContentDirectoryParameters.targetPlatform and BuildContentDirectoryParameters.subtarget internal.
    - Build Pipeline: Removed: Removed obsolete APIs.
