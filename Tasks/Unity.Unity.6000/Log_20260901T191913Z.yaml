    - Multiplayer: Unity Transport: Avoided throwing a NullReferenceException when passing null to NetworkEndpoint.Parse and NetworkEndpoint.TryParse. Instead, a default-valued NetworkEndpoint is returned. (UUM-136498)
    - Multiplayer: Unity Transport: Fixed an issue where the server endpoint would fail to be parsed in multithreaded WebGL builds, leading WebSocket connections to be established to the URL the game is served on, which is generally wrong. (UUM-135737)
    - Multiplayer: Unity Transport: Fixed the accuracy of bandwidth calculations in NetworkDriver statistics. When bandwidth usage varied significantly over short periods of time, the calculations would be slightly off compared to reality. (UUM-143167)
    - Multiplayer: Unity Transport: Fixed UAC1001 warnings being emitted when installing the package by making FixedPEMString properly serializable, and by removing the Serializable attribute of RelayNetworkParameter (the structure was not serializable anyway, and there's no use case to serializing it). (UUM-136758)
    - Multiplayer: Unity Transport: Network interfaces are now automatically disposed of before domain reloads. Without this protection, socket handles could be leaked which would cause errors when trying to re-bind to the same port later on. Note that this isn't a replacement for properly disposing of NetworkDriver objects; it's only a protection in cases where that's not done. (UUM-146443)
    - Netcode for Entities: A ghosted FixedList - that is cleared and later repopulated with the same data (e.g. during prediction rollback) - now replicates correctly. (UUM-131602)
    - Netcode for Entities: Extraordinarily rare correctness bug introduced with the static ghost early-out optimisation, where the early-out would be applied even when new snapshot data arrived, but only if said snapshot arrived so late that it was older than the lastInterpolationTick.
    - Netcode for Entities: Fixed a missing Profiler marker for GhostReceiveSystem.
    - Netcode for Entities: Fixed a null reference exception when editing the lists in Project Settings > Multiplayer > Build immediately after adding the Netcode for Entities package. (UUM-135202)
    - Netcode for Entities: Fixed a predicted ghost divergence caused by running at very high framerates with very low SimulationTickRate, which meant that the client to not even fully predict one tick ahead of the latest snapshot arrival, causing the snapshot to be applied on a partial tick, which in turn resulted in the prediction-history backup failing to write, so it would constantly be stale. (UUM-147343)
    - Netcode for Entities: Fixed a regression in the handling of partial sends. In rare cases, the same dynamic ghost chunk hits the partial boundary at roughly the same entity index every tick. This indefinitely causes a subset of its ghosts to no longer be added to the snapshot. (UUM-145646)
    - Netcode for Entities: Fixed a spurious "JobTempAlloc has allocations that are more than the maximum lifespan of 4 frames old" warning that appeared when baking a ghost prefab set to Owner Predicted mode without a GhostOwner component.
    - Netcode for Entities: Fixed an issue in the Netcode Profiler where an incorrect prediction tick value was displayed in the Prediction and Interpolation Tab.
    - Netcode for Entities: Fixed an issue in the netcode profiler where tick navigation was inconsistent when capturing more than two sessions without clearing the profiler.
    - Netcode for Entities: Fixed dragging the Importance field below its minimum of 1 (or Max Send Rate below 0) in the Ghost Authoring inspector triggering a re-bake pop-up even though the clamped value did not actually change.
    - Netcode for Entities: Fixed obscure error messages when the RpcCollection.DynamicAssemblyList value is not configured the same way between client and server.
    - Netcode for Entities: Fixed source generator deadlock where Roslyn Analyzers were never finishing in Rider
    - Netcode for Entities: If two GhostGroup entities happened to contain children that shared the same ArchetypeChunk - and both group root entities were sent in the same snapshot, the snapshot data of the first child would be clobbered by the snapshot data of each successive child, leading to unrecoverable snapshot read errors.
    - Netcode for Entities: Interpolated static ghosts will now wait until the interpolation timeline reaches new snapshot data before applying any new snapshot after updates have been paused.
    - Netcode for Entities: Issue where placeholder ghosts would fail to be cleaned up reliably - nor would they be removed from the SpawnedGhostMap.
    - Netcode for Entities: Issue where prediction switching a static, unchanging ghost (to predicted) would cause massive 64-tick rollbacks.
    - Netcode for Entities: Issue where the GhostUpdateSystem's predicted ghost history backup lookups were failing whenever other entities within the chunk were deleted (which caused the cached entityIndexInChunk to be incorrect).
    - Netcode for Entities: Issue where; if a ghost became irrelevant to a connection, and was then destroyed, there was a small chance that the ghostId would be recycled before the client could ack the despawn, leading to correctness issues if that same ghostId was reused immediately via a new spawn (which happened to re-use that same ghostId).
    - Netcode for Entities: Switched usage of 'PlayMode' to 'Play Mode' to be more consistent with other areas of the menu. (UUM-131598)
    - Netcode for Entities: The GhostUpdateSystem's snapshot rollback is now constrained below 64 ticks typically, massively reducing the severity of rollbacks in some esoteric cases, at the cost of minor misprediction issues (which will get resolved by eventual consistency).
    - Netcode for Entities: When the serialization of ghost groups aborts, it no longer leaves phantom history slot entries.
    - Netcode for Entities: GhostRelevancyMode.SetIsIrrelevant now respects false values being written to PrioChunk.isRelevant from the batched importance function, which enables use of this relevancy fast-path when in this mode.
    - Netcode for Entities: NetworkProtocolVersion.k_NetCodeVersion is now private, use NetworkProtocolVersion.DefaultNetCodeVersion instead to get the builtin netcode version.
    - Networking: Added back some missing Mono configuration files in Linux player builds, which would result in exceptions being thrown when trying to use certain .NET networking APIs (notably WebRequest). (UUM-135731)
    - Networking: Bump libcurl artifactory that utilizes updated nghttp2 that mitigates CVE-2026-27135. (UUM-140912)
    - Networking: Bumps libcurl library to 8.20.
    - Networking: De-referencing invalid texture pointer when a webrequest is teared down abruptly. (UUM-144540)
    - Networking: Expose the httpForcedVersion property on UnityWebRequest, so that the network communication can be forced to use a specific http protocol version, if needed. (UUM-131759)
    - Networking: Fixed a parsing bug when multiple proxies are returned by PAC script and only uses the first entry in the proxy failover chain. (UUM-135025)
    - Networking: Fixed a possible editor-only crash when using a custom certificate handler with UnityWebRequest in long editor sessions involving many domain reloads. (UUM-147347)
    - Networking: Fixed a regression in MbedTLS that would result in TLS handshake errors when trying to download assets from the Asset Store from the package manager. Potentially other HTTPS endpoints could have been impacted by this regression. (UUM-141298)
    - Networking: Fixed a situation where Curl errors coming from UnityWebRequest could fail to be logged appropriately, making issues harder to debug. Note that even in this situation the failure would still be reported correctly to calling code. This bug only impacted logging. (UUM-145433)
    - Networking: Fixed an issue in UnityWebRequest where an error 26 or 65 ("necessary data rewind was not possible") would sometimes be logged when resuming upload requests. (UUM-144767)
    - Networking: Updated MbedTLS to version 3.6.6 to address some (minor and likely unexploitable) security vulnerabilities. (UUM-140908)
