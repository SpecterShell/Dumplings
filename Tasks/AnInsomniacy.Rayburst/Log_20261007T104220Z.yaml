  Key: ReleaseNotes
  Value: |-
    Caution
    Resuming a partial download now requires its original task and recovery data. Re-adding the same URL creates a new task instead of adopting an existing file by name or size.
    What's Changed
    Rayburst 4.0.1 adds filename controls and an Extensions panel, improves download recovery and desktop integration, and bundles Aria2 Next 2.8.6.
    ✨ New Features
    - Preview and edit filenames before downloading, with optional remote filename lookup.
    - Rename completed single-file downloads from task details, with collision protection and recoverable history updates.
    - Install Rayburst Connect for Chrome, Edge or Firefox from the new Extensions sidebar panel.
    🛠 Improvements
    - Choose whether browser downloads ask for confirmation, start in the background or show Rayburst. Confirmation is the default.
    - Simplify update channels to Stable and Beta. Beta selects the newest version across both channels; neither channel offers downgrades.
    - Bundle Aria2 Next 2.8.6, with background disk I/O, transactional recovery checkpoints and improved handling of interrupted or compressed HTTP responses.
    - Support hostname patterns in proxy bypass rules and improve filename detection across redirects.
    - Refresh the website with interactive product previews, localized copy and a promotional film.
    🐛 Bug Fixes
    - Prevent concurrent downloads from sharing an output file or resuming another task's partial data.
    - Fix retries and re-downloads that rejected full output paths as invalid filenames (#684).
    - Restore automatic magnet file selection for browser submissions and after reopening the window. Preserve pending selections and Choose Later choices.
    - Remove empty task subdirectories when deleting downloaded content, while preserving download roots, shared files and nonempty directories.
    - Prevent long filenames from wrapping vertically in task details; add ellipsis, full-name tooltips and horizontal scrolling (#686).
    - Preserve browser download URLs and confirmation IDs, and keep the Windows app running independently of its browser launcher.
    - Keep verified update packages available after installation failures and prevent older update checks from replacing newer results.
    - Register Windows file and public protocol handlers without replacing existing defaults, and support native mouse, pen and touch window dragging.
    - Repair Linux tray activation and menus, add a targeted NVIDIA Wayland startup workaround, and include native WebKitGTK diagnostics.
    - Fix the Windows engine crash when starting HTTP/HTTPS downloads in the earlier 4.0.1 betas.
    Known Issue
    - Some Linux NVIDIA/Wayland systems still show page-transition flicker (#650).
