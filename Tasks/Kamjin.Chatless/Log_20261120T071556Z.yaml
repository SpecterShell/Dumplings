- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    功能与体验
    - 会话侧栏支持按工作区或时间分组，可归档和恢复工作区，主导航可单独折叠。
    - 新会话页以输入框为中心。输入 / 选技能、# 选提示词、@ 选 MCP 服务或工作区文件；这些入口也可通过 + 打开。
    - 工具审批弹窗并列说明两种模式，并提示哪些操作仍需确认。
    修复与性能
    - 会话工具现在使用实际绑定的项目目录：@WorkDir、相对路径和命令的默认目录不再指向独立的会话产物目录。绑定工作区不会自动授予文件权限。
    - 界面外壳出错时，可在恢复页重新加载或关闭桌面窗口。
    - 减少启动时的重复数据库查询，延后非必要任务，让会话历史和输入框更早可用。
    - 应用窗口预设或恢复窗口尺寸时，将窗口限制在当前屏幕的可用区域内，避免在 Windows 缩放场景下超出屏幕。
