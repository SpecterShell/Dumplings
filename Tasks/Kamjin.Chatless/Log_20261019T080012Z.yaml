- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    修复
    - 请求不再携带应用自己的内部字段（调度器租约、请求 ID、内部标记、流式开关等）：严格校验的服务端（如 build.nvidia.com）不再对所有模型回 400 Unsupported parameter(s)
    - 同一个参数不再同时以应用内名称与线上名称出现（如 maxTokens 与 max_tokens），提供商不认识的通用参数也不再下发
    - 测试连接不再把「请求失败」显示成「响应内容为空」：错误原样上报；走 SSE 传输的提供商在 400 时也会带上服务器自己的说明，而不是只有固定话术
    - 参数对话框与发送读同一个已清洗的参数袋：手改过的非法值（例如把 temperature 写成 "0.9"）不再显示成「已选中」而线上却没有；保存时也不会把这类值再写回存储
    优化
    - 聊天页首屏 JS 从 866 kB 降到 594 kB：Markdown 渲染器改为按需加载，扩展页也不再预加载它
    - 移除未使用的代码高亮组件及其依赖，安装树少约 8.6 MB
