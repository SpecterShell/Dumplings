- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    修复
    - 请求不再自行附带 stop 列表（四个对话模板边界 token）：用户没有设置过的采样参数不再替他发出去；模板泄漏仍由客户端在流里截断，行为不变
    - 时间上下文只精确到日期：同一会话连续两轮请求的 system 前缀逐字节一致，服务端的前缀缓存才有机会命中（此前每分钟变一次，等于整段重新 prefill）
    - 改了会话参数后，输入框下方不再多出一条「参数」标签占用一行高度；会话参数入口仍在右上角菜单
    - 托盘图标点击恢复窗口：Linux 上点击图标打开菜单，菜单第一项是「显示窗口」；Windows/macOS 保留点击切换。菜单里任何一项执行前都会先把窗口带回来，并移除了多余的「最小化」
    - 托盘菜单不再因为一个已最小化的窗口而看起来「点了没反应」
    优化
    - 玻璃主题重做：窗口只有一层玻璃，全应用只有一处实时模糊；侧栏变成同一张玻璃上的平面区（用分隔线代替第二张卡片），输入框是唯一抬起来的面
    - 没选壁纸时，背景收敛为单一色相的柔雾（此前青/蓝/琥珀三层渐变压在每个强调色后面）
    - 选了壁纸时按「氛围」处理：一次降采样并烘焙模糊（长边 1600），旧壁纸自动补生成，再压一层暗色或白纱，把任何照片压进可读范围。代价是壁纸更接近氛围而不是相册——这是正文与次要文字对比度下限的必然结果
    - 弹窗、菜单、通知与提示改为近不透明，长文字不再压在照片上
    - 「减少动态效果」现在是关闭实时模糊并改用更实的填充，而不是把模糊半径调小（成本一样，观感更差）
