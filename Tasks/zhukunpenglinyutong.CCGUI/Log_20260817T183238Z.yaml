    - 收口 PI 卡片、Windows 摘录与长对话首屏回放
    - 给挂起的后台 Agent 预结果等待加空闲上限
    - 探测列表纳入 PI，摘录卡改回纵向块级布局
    - detect_all 补上 PI，摘录折叠补齐 CSS
    - 按 0.8.9 簇补 picker/Shared 菜单、认证页样式与摘录折叠
    - 按 0.8.9 PR 簇补闭环并更新盘点文档
    - 接通 PI 发送/认证页，HTML 改走内嵌 Dock
    - 修复挂载期 ReferenceError 并补齐 PI/Dock 类型缺口
    - 固定 Git Diff 弹窗滚动层并拆出 compare 样式
