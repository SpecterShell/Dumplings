  Key: ReleaseNotes
  Value: |-
    New Features
    - 内置 agency-agents 目录与 composer 触发菜单，SDK 0.3.9 composer 状态项
    - 问题弹层改为覆盖输入框（对照理想布局重做）
    - 问题卡改为输入框上方悬浮层（上问下选）+ 其他自由输入框
    - claude 支持 AskUserQuestion 控制协议（弹窗提问）
    - 添加会话 effort 修改 API
    - 状态栏分支跟随文件树选中的嵌套仓库
    - SDK 0.3.7 新增 ctx.sessions.refresh，插件直写后即时刷新侧栏
    Fixes
    - 修复评审阻塞项、同批建议与 v1.0.4 合并语义损伤
    - 修复推理强度切换对已有会话无效的问题
    - 补齐 RunContext 测试构造的 _tree_guard,恢复 test-cfg 编译
    - show pending new chats in the sidebar
    - 解决 origin/v1.0.3 合并冲突
    - route fast turn completion before send returns
    - isolate Claude and Kimi channel routing from native aliases
    - preserve CLI provider configs and settle chat context state
    - explorer /select 的路径自带引号，含空格路径不再跳「文档」
    - 补齐 RunContext 测试构造的 _tree_guard,恢复 test-cfg 编译
    - 文件链接解析加索引回退(含 gitignore 产物),提及路径统一为 @/… 规范形
