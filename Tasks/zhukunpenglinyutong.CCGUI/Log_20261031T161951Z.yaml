- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    New Features
    - 插件市场安装量从 950 起缩写为一位小数的 K
    - 聊天查找统一为同款只读查找浮层
    - 预览查找统一为只读查找浮层
    - 编辑器查找替换改为 dbx 风格浮层
    - 工作区行透传名下所有会话的运行状态点
    - 支持大会话外部编辑与自动换行
    - 添加会话原生编辑与定向刷新渲染
    - add OS-level desktop notifications for turn completion and questions
    Fixes
    - 修复 Windows 上 OpenCode 迁移行扫描测试的路径文本不一致
    - plugin_http_request 逐跳跟随重定向并重新校验网络授权
    - 删除 worktree 只在确属本仓库的孤儿目录上递归删除
    - 查找浮层合并前跟进：逐字输入不跳过命中、F3 走卡片、macOS ⌥⌘F 生效
    - 输入框图片附件评审跟进：换键途中落地跟到新会话、移除工作区清理、无标签页粘贴不再被吞
    - 聊天查找按命中单词滚动并支持 Esc 关闭
    - 查找框聚焦时可用 Ctrl+H 展开替换
    - 切换文件页签时关闭查找替换浮层
    - 输入框图片附件按会话隔离，切标签不再串图
    - 回应 Claude 控制协议的全部 control_request，MCP elicitation 不再卡死会话
    - 取消 30 分钟 prompt 硬超时，孤儿清扫先向宿主确认 run 是否存活
    - 修复 macOS 上 OpenCode 保存必然失败及备份文件破坏旧版 OpenCode 会话列表
    - 评审跟进——权限被拒不再吞掉完成通知、按工具调用 id 去重、截断不切 emoji、点击跳转修正
    - address shell credential review feedback
    - 准确提示远端保存结果未确认
    - 接通 OpenCode 私有聚合备份
    - 绑定远端保存快照并限制聚合备份权限
    - 防止过期会话编辑覆盖新对话并保留原版本
    - 评审跟进——打包版本对齐、宠物窗口抢焦点、发送失败上报与通知去重
    - 支持行号整行选择并修正外部编辑器会话路径
    - 评审跟进——发送失败回落、失败设置不缓存、补齐触发测试
    - GUI 拉起 PI/OMP 时补上 shell profile 里的密钥变量
