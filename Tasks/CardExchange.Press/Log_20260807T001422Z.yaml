  Key: ReleaseNotes
  Value: |-
    [New Functionality] Support for Authentys Pro 300: The system now supports the Authentys Pro 300 card printer (PrintersList v35).
    [New Functionality] Support for Evolis Agilia: The Evolis Agilia card printer is now supported (PrintersList v33).
    [Improvement] Matica XID Printer Updates: Updates and enhancements for Matica XID 8300 and XID 8600 printers.
    [Improvement] Swiftpro SDK Update: The Swiftpro K30 and K60 printers now use the updated SDK version 2.0.1.0.
    [Improvement] Zebra SDK Update: Updated Zebra SDK to version 4.0.4100.1 for improved functionality.
    [Improvement] Magicard SDK Update: Magicard printers now operate with SDK version 3.2.6.1.
    [Improvement] Improved Name Handling: The system now supports names that include apostrophes ( ' ).
    [Improvement] Vietnamese Character Support: Vietnamese characters can now be properly generated in QR codes.
    [Bug Fix] Signature Export Fix: Exporting signatures in .jpg format no longer results in a black square.
    [Bug Fix] Assist Tab Connectivity: The “No Internet Connection” error in the Assist tab has been resolved.
    [Bug Fix] Configuration File Update Fix: Fixed an issue where updates to the CardExchange.Config.exe file were not being recognized by the application.
    [Bug Fix] Camera Issue Resolved: The application no longer freezes if no camera is available when attempting to take a picture.
    [Bug Fix] Admin Role Fix: Users without the “Press Admin” role can now access and use the Configuration tab.
    [Bug Fix] Magicard 600 Printing Fix: Fixed an issue where the Magicard 600 failed to print multiple records in a single job over Ethernet.
    [Bug Fix] Sort Order Fix: The system now properly recognizes the defined Sort Order for records.
ReleaseTime: 2024-10-18
