  Key: ReleaseNotes
  Value: |-
    The Early Access Program (EAP) for CLion 2026.3 has launched, and the first EAP build is now available.
    This build improves data breakpoints, also known as watchpoints, which are helpful when you need to focus on a specific variable and track its behavior as the program runs. Setting a data breakpoint is now much easier and no longer interrupts your debugging workflow. You can now:
    - Set a data breakpoint from the Breakpoints dialog, as you would with regular breakpoints, or directly in the editor by right-clicking a variable.
    - Add a data breakpoint using either a variable name or its address.
    - Configure the same parameters available for regular breakpoints, such as conditions, hit counts, and detailed logging.
    Read our roadmap blog post to learn what else to expect from this EAP.
    Give this build a try, share your feedback, and report any issues to our issue tracker.
    Thank you for using CLion!
