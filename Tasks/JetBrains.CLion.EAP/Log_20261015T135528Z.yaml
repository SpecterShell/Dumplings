  Key: ReleaseNotes
  Value: |-
    A new EAP build for CLion 2026.3 is available.
    - CLion can now visualize the memory layout of C and C++ classes, structs, and unions, so you can analyze memory usage more easily. Place the caret on a type name, click the Show Context Actions icon, and select Class Layout to open the layout in a separate window.
    - Each debug profile now has a Configure Profile in .json action that opens the profile's configuration file in the editor.
    - We've fixed an issue caused by recent PlatformIO updates that prevented CLion from loading the list of boards when creating a new PlatformIO project. The wizard now shows the boards instead of staying on Gathering info....
    - The Markdown preview now updates when a linked image file changes on disk.
    Please try this build, share your feedback, and report any issues to our issue tracker.
    Thank you for using CLion!
