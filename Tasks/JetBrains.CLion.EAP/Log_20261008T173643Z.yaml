  Key: ReleaseNotes
  Value: |-
    The latest CLion 2026.3 EAP build is out with the following highlights:
    - Debug profiles are now stored as JSON files by default. You can configure them manually or with an AI agent, and use existing JSON debug configurations from other environments, such as VS Code. This also provides you with configuration options that are not currently exposed in CLion’s UI.
    - When a requires expression evaluates to false, the IDE now shows more detailed diagnostics explaining why the requirement is ill-formed. For example, it can show that a function is inaccessible, deleted, ambiguous, or unresolved.
    - The new Inspect This action helps you quickly find relevant ways to analyze the code at the caret. Use ⌘⌥⇧A on macOS or Ctrl+Alt+Shift+A on Windows/Linux. Depending on the context, the popup gives you access to class layout, code issues, type hierarchy, or all these at once.
    - The bundled CMake has been updated to v4.4.2.
    Please try this build, share your feedback, and report any issues to our issue tracker.
    Thank you for using CLion!
