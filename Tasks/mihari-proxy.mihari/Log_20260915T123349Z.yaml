  Value: |-
    Installation: Use the complete installation commands in the README or these release notes. Do not download and run individual release assets directly.
    安装建议： 请使用 README 或本 Release notes 提供的完整安装命令；不建议单独下载并直接运行 Release assets。
    升级提示 / Upgrade notes
    - CLI/TUI 与 daemon 必须同步升级。升级前请停机备份完整业务数据；旧版本无法读取新增的订阅持久字段，降级需恢复兼容备份。
    - Upgrade CLI/TUI and daemon together. Stop the daemon and back up all business data before upgrading; older versions cannot read the new subscription fields, so downgrading requires restoring a compatible backup.
    - 文件日志、快照与导出保留未经脱敏的原始诊断，可能包含凭据、完整 URL、路径及配置片段；分享前请检查并移除敏感内容。
    - File logs, snapshots and exports retain unredacted diagnostics and may contain credentials, full URLs, paths and configuration fragments. Review and remove sensitive content before sharing.
