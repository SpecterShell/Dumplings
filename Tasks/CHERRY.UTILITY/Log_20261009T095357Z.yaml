  Key: ReleaseNotes
  Value: |-
    Device Support:
    - Added support for Pixiu 99 (ANSI layout): system shortcut keylock, configuration of key sounds, Audio Sync feature for light effects, 3 different HW profiles, disable single keys via key actions
    - Added support for MX Board 3.0s Pro NBL (ANSI layout)
    - Added support for MX Board 3.0s Pro RGB (ANSI layout)
    - Added support for MX Board 3.0s Pro RGB Wireless (ANSI layout): additional light effects, switch between Win/Mac mode via SW, 2 different layers (default and FN) of key actions for each Win and Mac mode, Snappy Tap, 3 different HW profiles, disable single keys via key actions, FW update
    - Added support for Cherry Xtrfy LumiPad – Pokémon Edition
    Software Update:
    - Added a hint on how to switch between HW profiles via the keyboard
    - Improved stability of device communication
    Firmware Update:
    - Added latest MX 3.0S Pro firmware versions
    Bug Fixes:
    - Pixiu 98: Macro actions were not saved on the first attempt
