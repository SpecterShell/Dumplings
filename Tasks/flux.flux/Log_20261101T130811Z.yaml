Version: "4.148"
Installer:
- InstallerUrl: https://justgetflux.com/flux-setup4-148.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - major rework of system sleep/wake and add/remove monitors. This should fix some new issues in Windows 11 (beta, send us any bugs) - if you have been seeing f.lux go to “fallback mode” with a white cursor after sleep, this should fix it
    - uses “low power E-cores” and a couple other changes to reduce background impact
    - better treatment of monitors with different gamut
    - preliminary WINE support - better handling of missing color APIs
    - fixed a fullscreen disable bug and an EDID issue from our earlier beta
