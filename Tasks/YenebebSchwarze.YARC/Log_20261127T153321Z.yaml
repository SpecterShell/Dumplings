  Key: ReleaseNotes
  Value: |-
    What's Changed
    - Keep tool footers out of What's New, and ask for short What's New sections by @yenebeb in https://github.com/yenebeb/yarc/pull/155
    - Open the command bar when YARC launches to an empty window by @krlmrr in https://github.com/yenebeb/yarc/pull/153
    - Sync history between computers, encrypted, through a place you own by @yenebeb in https://github.com/yenebeb/yarc/pull/151
    - Open What's New at launch when a big feature waits by @yenebeb in https://github.com/yenebeb/yarc/pull/156
    - Right-click the sidebar for New Space, Edit Space, Appearance and its side by @krlmrr in https://github.com/yenebeb/yarc/pull/154
    - Keep an extension's popup open when its button is clicked again while it loads by @krlmrr in https://github.com/yenebeb/yarc/pull/152
    - Search eBay: send eBay Chrome's client hints and a UA without Electron by @krlmrr in https://github.com/yenebeb/yarc/pull/158
    - Give the address field's shield, extension and puzzle buttons one size and even spacing by @krlmrr in https://github.com/yenebeb/yarc/pull/157
    - Bump the dependencies group with 3 updates by @dependabot[bot] in https://github.com/yenebeb/yarc/pull/165
    - Wait for main to hold an extension's badge before checking the sidebar draws it by @yenebeb in https://github.com/yenebeb/yarc/pull/168
    - Show the puzzle button with no extensions installed, offering Get extensions by @krlmrr in https://github.com/yenebeb/yarc/pull/159
    - Show toasts where they can be seen with the sidebar on the right or hidden by @krlmrr in https://github.com/yenebeb/yarc/pull/160
    - Give the keyboard to the canvas or sidebar when an overlay closes over no page by @krlmrr in https://github.com/yenebeb/yarc/pull/164
    - Gate pull requests and releases behind a security review by @yenebeb in https://github.com/yenebeb/yarc/pull/167
    - Fix the design drift found while documenting YARC's look, and add docs/design.md by @yenebeb in https://github.com/yenebeb/yarc/pull/169
    - Share the design tokens with every page and add radius, type and motion scales by @yenebeb in https://github.com/yenebeb/yarc/pull/170
    - Redesign the README as YARC's front page by @yenebeb in https://github.com/yenebeb/yarc/pull/171
    - Fix the code scanning findings that are real by @yenebeb in https://github.com/yenebeb/yarc/pull/172
    - Fix a startup crash in the spell checker, and start the daily release off the hour by @yenebeb in https://github.com/yenebeb/yarc/pull/173
    Full Changelog: https://github.com/yenebeb/yarc/compare/v0.3.7...v0.3.8
