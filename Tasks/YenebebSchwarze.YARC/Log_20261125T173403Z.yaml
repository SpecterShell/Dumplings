  Key: ReleaseNotes
  Value: |-
    What's Changed
    - Highlight the selected canvas row and show drop markers over it by @yenebeb in https://github.com/yenebeb/yarc/pull/131
    - Save canvas text as it's typed, and fix typing, pasting and undo on the board by @yenebeb in https://github.com/yenebeb/yarc/pull/132
    - Split the canvas page by responsibility by @yenebeb in https://github.com/yenebeb/yarc/pull/133
    - Give the canvas a dot grid, grouped tools and a style bar beside the selection by @yenebeb in https://github.com/yenebeb/yarc/pull/134
    - Notes on the canvas: wrapping text, a Note tool, lists, checkboxes and links by @yenebeb in https://github.com/yenebeb/yarc/pull/135
    - Paste a live card as its picture, so a clip can't load a page by @yenebeb in https://github.com/yenebeb/yarc/pull/136
    - Plan a canvas as a split pane in the canvas doc by @yenebeb in https://github.com/yenebeb/yarc/pull/138
    - Find on a canvas: ⌘F searches its texts and pans to each match by @yenebeb in https://github.com/yenebeb/yarc/pull/140
    - Canvas: style bar list and link buttons, Add Selection to Canvas, canvases in the command bar by @yenebeb in https://github.com/yenebeb/yarc/pull/137
    - Remove an extension from Settings by @yenebeb in https://github.com/yenebeb/yarc/pull/143
    Full Changelog: https://github.com/yenebeb/yarc/compare/v0.3.4...v0.3.5
