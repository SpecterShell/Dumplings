    - Preferences ▸ Identity: the name on new comments, remembered by @echelon in https://github.com/storytold/printcraft/pull/56
    - Windows: no console window, and the Start Menu shortcut gets its icon (#57) by @echelon in https://github.com/storytold/printcraft/pull/58
    - Identity test: wait for the page's text before selecting it by @echelon in https://github.com/storytold/printcraft/pull/64
