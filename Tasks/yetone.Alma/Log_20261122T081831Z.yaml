  Key: ReleaseNotes
  Value: |-
    0.4.992
    Features
    - Built-in tool usage cost estimates are now calculated in Go. Results are automatically compared with previous Node.js estimates, and Go’s values are used when they match.
    - MCP tools continue to use Node.js-based cost estimates.
    - Added an option to disable the new Go-based calculation by setting ALMA_NODE_GEN_PREPARE=1 (also supports _OWNER or _REGISTRY).
