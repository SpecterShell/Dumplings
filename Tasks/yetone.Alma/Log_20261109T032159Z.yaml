  Key: ReleaseNotes
  Value: |-
    Features
    - Added voice capsules in personal conversations across server, iOS, Android, and desktop.
    - Mobile now groups a run of tool calls into one stacked segment, similar to desktop, showing overlapping avatars, “N tools used”, and a compact row list. It appears live while streaming and collapses when finished.
    Bug Fixes
    - Fixed an issue where a long tool run’s “+N” chip could wrap into a tall column and get covered by the next avatar on iOS and Android.
    - Fixed an issue on iPhone Duo where rail buttons could squeeze the Chats title until it disappeared.
