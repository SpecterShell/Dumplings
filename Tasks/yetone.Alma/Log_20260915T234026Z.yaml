  Value: |-
    0.4.51
    Bug Fixes
    - Subagent cards now display in a single, consistent voice.
    - Context flyouts stay inside the viewport instead of overflowing.
    - Removed a duplicate caption from the pure-thinking rail.
    - The follow-bottom control re-arms correctly after toggling the rail when scrolled to the bottom.
    - Time-clue reference rows are now read as clues, not markup.
    Improvements
    - Tidied the chat activity header: the timeline switch appears only when its rail is open, aligns with the rail chevrons, and no stray elements sit at the far edge.
    - Activity rows now reveal their chevron on hover, reducing visual clutter.
    - Moved the injected-context tally from the message body to the more menu.
