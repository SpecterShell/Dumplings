  Key: ReleaseNotes
  Value: |-
    0.4.1257 (Android 5.20)
    Bug Fixes
    - Fixed an issue where Fit to Phone Screen was refused when another app's virtual display was active, such as a MacBook with its lid closed using UU Remote. The phone display is now used as a second display.
    - Fixed repeated conflicts where a Mac kept trying to make Alma the main display; Alma now restores the Mac's own display and logs the reason.
    Improvements
    - Only Alma's own display is adjusted; other displays are left exactly as they are.
