  Key: ReleaseNotes
  Value: |-
    Bug Fixes
    - Context usage and compaction now only look at the active conversation path. Previously, discarded branches, subagent transcripts, and other off-path messages could be counted or summarized, causing inflated context readings and incorrect compactions. The context gauge and manual compaction now reflect only the current thread.
    - Fixed iOS scrolling when sending a new message. The app no longer snaps back to your message while you’re reading, so you can scroll down naturally without being pulled back to the chat bubble.
