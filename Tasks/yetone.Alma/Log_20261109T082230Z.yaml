  Key: ReleaseNotes
  Value: |-
    0.4.537
    Bug Fixes
    - Fixed an issue where starting a new chat in a pane could show the previous conversation until the new one started. A pane with no active session now starts clean.
    - Fixed the Escape key not reaching the program in a terminal pane; the pane now handles Escape correctly.
    - Fixed tool calls with no result being incorrectly recorded as completed calls with empty output.
    - Fixed command output being truncated before it reached the model; larger outputs are now delivered in full.
    - Fixed invisible browser tabs (such as parked or phone-watched tabs) intercepting clicks in the main window.
    - Fixed headless image handling on Linux remote sessions that could cause failures.
    Improvements
    - Release downloads now automatically fall back to GitHub’s API when the regular download link is unavailable.
