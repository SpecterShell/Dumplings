  Value: |-
    0.4.570
    Bug Fixes
    - Fixed browser login reuse on Mac to show browsers installed on this Mac, not the remote server’s Mac, and to refresh the list each time the popover opens.
    - Fixed Markdown rendering in the iOS chat source view: footnotes, reference links across paragraphs, GitHub alerts, expandable sections, inline HTML (keyboard keys, sub/superscript, line breaks), math formulas, and indented list paragraphs now render correctly. Inline code styling is restored.
