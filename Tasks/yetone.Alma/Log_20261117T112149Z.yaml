  Key: ReleaseNotes
  Value: |-
    0.4.722
    Features
    - Desktop: You can now quote text in chat, similar to Alma chat. Select text in an agent’s reply or use Reply on hover to add a citation card above the composer. The agent receives the quote as a blockquote, and your sent message shows the citation card. Clicking the card jumps to the quoted words. Quote context is preserved even after restarting the app.
    Bug Fixes
    - iOS: Increased the size of the agent composer’s round buttons (attach, model, command/mic, and send) from 36pt to 40pt, making them easier to tap. The input field height now matches the larger buttons.
