  Key: ReleaseNotes
  Value: |-
    0.4.724
    Features
    - On iOS and Android, viewed chat images and opened files are kept on the phone, so they don’t need to be downloaded again.
    - Alma’s own conversation now appears as a card at the top of the desktop sidebar.
    - Added an Open Log Folder option in Settings → General → Advanced.
    - Sub-agents can be turned off for all chats from Settings → Agents → Advanced.
    - The Gallery can remove one image or clear all images without affecting conversations.
    - Compact and GTD sidebars now show a chat’s project name.
    - The Reasoning picker now shows thinking levels for ACP agents, and Alma’s reasoning level can be applied to compatible agents.
    - The mobile chat list now offers a GTD layout alongside Recents and Projects.
    - Assistant messages on mobile now show reply time.
    Improvements
    - The plugin update badge in the sidebar is now off by default and can be enabled in Settings → General → Advanced.
    - Clarified the Activity Recorder description: text recognition runs on device, while session text, window titles, and URLs are sent to the Tool Model for summarization.
    Security
    - Desktop secrets are now encrypted using the operating system keychain instead of stored as plain text.
    Bug Fixes
    - Fixed desktop conversation scrolling so it no longer stutters or jumps over cards and images.
    - Notification cards now reuse an existing window instead of creating a new one, preventing potential freezes on Windows.
    - Fixed New Chat starting with the previous unsent message as a draft.
    - SVG images in chat now display text, arrowheads, and styling correctly.
    - Fixed Agy conversations not showing correctly regardless of how Agy was installed or started.
    - Server startup no longer triggers a false positive in Bitdefender.
    - Fixed voice model installation failing when a local configuration file had incompatible settings.
    - Chinese text now uses a Chinese font on English Windows instead of a Japanese-style fallback.
    - Large commit diffs no longer lock up the app; big files load behind a Load diff button.
    - Codex now uses the latest supported package and reports clear errors if startup fails.
    - Feishu group topics now have separate threads instead of sharing context.
    - Activity Recorder now starts on its own in the native app, avoids capturing password managers, and respects configuration set through the API.
    - Fixed images in steering messages failing to send.
    - Remote computer projects now keep their order and open sections instead of being overwritten.
    - Opening the mobile app no longer leaves an empty untitled chat in the desktop sidebar.
    - New Chat in project mode now starts in the currently open chat’s project.
    - Very large messages no longer hang the app; only the first portion is shown with an option to open the full text.
    - Hovering over the read-aloud icon no longer starts the voice model worker or loads voice models.
    - Browser element change requests now start a new chat when no thread is open.
    - On mobile, tapping an open Thinking block folds it; long press still selects text.
    - The Codex pane now follows the thread it is writing to.
    - Tool permission prompts now show as needing your attention instead of showing as working.
    - Mouse wheel scrolling now works in Pi and OMP full-screen views.
    - Close to tray and Start minimized now work on Linux and Windows.
    - Fixed duplicate titlebars on KDE Plasma.
