    0.4.591
    Features
    - Press Esc to stop the current turn.
    - When the composer is empty, press number keys 1–9 or Enter to answer the agent’s question after a short pause.
    Improvements
    - Stopping a turn is now click-safe, with a brief delay to prevent accidental double-clicks.
    - Press Esc to dismiss a Herdr prompt.
    - If an approval fails, you’ll now see a clear message.
