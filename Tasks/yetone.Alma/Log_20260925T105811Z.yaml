  Key: ReleaseNotes
  Value: |-
    0.4.145
    Features
    - The Picture-in-Picture (PIP) now opens at the bottom-right of the Alma window, just above the composer.
    - When the dock is closed, the agent's browser opens in the PIP instead of opening the dock.
    - You can now translate selected text in a plain-text file preview.
    Bug Fixes
    - Phone video is now encoded from device-resolution captures instead of the lower-resolution 1024px screencast.
