  Key: ReleaseNotes
  Value: |-
    Bug Fixes
    - Computer Use: Stopped the assistant from repeatedly stealing focus or the cursor, and eliminated the associated error beeps. A new hard rule now permanently prevents such behavior.
    - Computer Use: Removed every path that allowed the assistant to fake app interactions (e.g., pretending to open an app without actually doing it).
    - Chrome Relay: Receipts now accurately reflect what actually happened, instead of providing misleading information.
    Improvements
    - Chrome Relay: Receipt integrity is now enforced by locking the honest-receipt verification to a dedicated page that records every click, making receipts tamper-proof and trustworthy.
