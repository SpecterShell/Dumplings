  Key: ReleaseNotes
  Value: |-
    0.4.1092
    Features
    - New Replies now catches replies that ended while the app was closed. On Android it uses the push notification; on iOS it uses the notification in Notification Center. Reading a chat clears its reply notification.
    Bug Fixes
    - Fixed the remote screen going black on iPhone in landscape when the keyboard appeared automatically. The keyboard now only appears when you ask for it, and rotating the phone dismisses it.
    - Fixed video connections that got stuck while connecting. They are now dropped after 12 seconds and retried automatically.
    - Fixed the reply list jumping upward when a reply ended, especially near the end of the list.
    - Fixed a background process that could keep running for about a minute after quitting Alma.
    Improvements
    - Improved server-side handling for G7 6c(b) group 3 tools (catalog, keys, dropSkill, toolKeys) and made startup more efficient.
