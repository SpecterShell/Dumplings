  Key: ReleaseNotes
  Value: |-
    0.4.1209
    Features
    - Android: Added easier ways to find a chat in long Agents lists, including date sections (Today, Yesterday, Previous 7 Days, Earlier), a time × project scrubber, and search through chat content.
    - Android: Added a queue pill that jumps to the chat waiting on you or the newest finished chat.
    Bug Fixes
    - iOS: Fixed the queue pill scrolling to an empty section. It now opens the first chat waiting on you, or the newest finished chat, and unfolds its section.
    - Desktop: Fixed the sidebar queue pill jumping to the wrong chat when nothing waits on you. It now opens the newest finished chat and unfolds its section.
    Improvements
    - Removed the “Next Up” prompt above the composer on iOS and Desktop to prevent accidental jumps to another chat.
