  Value: |-
    0.4.142
    Features
    - Added a Browser tab in the workspace sheet on iPhone/iPad that mirrors the Mac’s in-app browser live.
    - You can now control the Mac browser from your phone: tap, scroll, type, press Enter/Backspace, enter URLs, and navigate back/forward/reload.
    - Live browsing works over a direct connection or through the mobile relay, and automatically reconnects if the Mac restarts, with a clear status when unavailable.
