  Key: ReleaseNotes
  Value: |-
    Bug Fixes
    - Fixed a memory issue that could cause out-of-memory errors when streaming responses from sub-agents.
    - Fixed a misleading “Task completed successfully.” message that appeared when a sub-agent actually did nothing.
    - Fixed additional causes of application freezes and crashes on Windows that weren’t addressed in a previous fix.
    - Key press actions now report whether the keystroke was actually delivered to the target, instead of a simple “pressed” indicator.
    - Fixed a bug where keystrokes that didn’t reach any target were incorrectly reported as successfully typed.
    - Fixed an issue where element indices could become stale after interface updates, ensuring they continue to point to the correct elements.
