  Key: ReleaseNotes
  Value: |-
    0.0.981
    Features
    - References: Added 5 more referenceable item types: artifact, tool, task, provider, cron, and MCP tool.
    - References: You can now create object-to-object links using body tokens and manual relations.
    - References: Use @-mentions to link any Alma object, resolve references, and view backlinks.
    - Capture: Added a color picker for solid redaction.
    - Capture: Redaction styles are now selectable: mosaic, blur, or blackout.
    - Capture: New region-redaction editor lets you pixelate any area, with smart suggestions and undo/redo.
    Bug Fixes
    - UI: Fixed icon button sizes so they control their own geometry and aren’t overridden by density CSS.
    - Capture: Moved the editor toolbar out of the preview frame.
