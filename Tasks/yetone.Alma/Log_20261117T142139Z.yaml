  Key: ReleaseNotes
  Value: |-
    0.4.731
    Bug Fixes
    - Fixed a freeze and excessive memory usage during long conversations with large tool outputs.
    - Reduced memory usage by decoding each output once instead of up to six times per frame.
    - Bash cards now show only the last 64 KB of output to keep the interface responsive.
    - A crash while building the conversation list is now logged to a file instead of closing the app.
