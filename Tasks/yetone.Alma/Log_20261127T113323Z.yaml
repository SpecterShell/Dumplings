  Key: ReleaseNotes
  Value: |-
    0.4.1232
    Features
    - Auto-archive inactive chats: You can now automatically archive chats after 1, 3, 7, or 30 days without new messages. Turn it on in Settings → Chat. Favorites, pinned, to-do, in-progress, and generating chats are not archived. Nothing is deleted, and a new message brings the chat back.
    - Better Collapse all / Expand all on mobile: The option now appears under the user message and collapses or expands the whole turn—every reply up to the next user message.
    - Better Collapse all / Expand all on desktop: The option now appears in the user message toolbar and controls the whole turn, without needing to hover.
    Bug Fixes
    - Fixed the title capsule on iOS so it responds visually to taps again.
