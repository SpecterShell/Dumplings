  Key: ReleaseNotes
  Value: |-
    0.4.811
    Features
    - Presentation list designs, layouts, and icons are now served from a pinned copy of the catalogs in the Go turn. The seven presentation tools that compile, render, review, or extract remain in Node.
    - Hashline mode now runs in the Go turn: LINE#HASH tags are read and the hashline edit is applied in Go. Built-in tools' Edit now follows the setting again instead of being fixed at import time.
