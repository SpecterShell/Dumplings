  Key: ReleaseNotes
  Value: |-
    0.4.823
    Improvements
    - Moved maximum output token calculation for turn preparation to the backend, applying to Anthropic/Claude subscription requests and user overrides.
    - Extended backend support for remote SSH workspaces to run Bash, Bash Output, and Kill Shell tools.
    - Moved turn-end recipe evaluation and recipe ready notifications to the backend.
    - Moved turn finalization and related metadata updates to the backend, with more precise first-token and last-stream timing.
    Bug Fixes
    - Fixed a narrow composer layout issue when working in a worktree so the model button and context gauge no longer collapse; the project chip now truncates to its icon first.
