  Key: ReleaseNotes
  Value: |-
    v0.4.25
    Features
    - Scoped plan progress and added names to text snippets.
    - Added support for running Alma as a harness under the official FrontierHarness evaluation.
    Bug Fixes
    - Fixed an issue where the OpenCode Go session identity was not sent correctly.
    - Improved app stability by limiting the impact of app-wide freeze failures.
    - Prevented blank retries and fixed UI loading hangs.
    - Kept saved message parts when continuing the same chat bubble.
    - Made function calling overrides work correctly on tool-wrapped requests.
    Improvements
    - Applied FrontierHarness harness fixes from the trajectory review.
    - Worked around a Runta container initialization issue in FrontierHarness trials.
    - Updated pier and pinned deep-swe for evaluation stability.
