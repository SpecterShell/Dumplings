  Key: ReleaseNotes
  Value: |-
    0.4.1140
    Bug Fixes
    - Fixed an issue where selecting Always Allow on a tool permission prompt did not apply to all parallel tool requests, so another prompt still appeared.
    - On iOS, the slash (/) command list can now be closed by tapping outside, dismissing the keyboard, or pressing Esc. It stays closed until you type a new /, and scrolling the list no longer dismisses the keyboard.
    - On Android, the slash (/) command list can now be closed by tapping outside, dismissing the keyboard, pressing Back, or pressing Esc. It stays closed until you type a new /.
    - In the composer, the slash (/) command list now stays closed after being dismissed. Typing more letters no longer brings it back until you start a new /, Esc works when there are no matches, and sending a message clears the list along with the draft.
