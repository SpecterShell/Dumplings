  Value: |-
    0.4.1121
    Bug Fixes
    - Fixed rendering on legacy Intel GPUs (Haswell Iris, OCLP non-Mac2) so drawing uses the GPU again instead of hanging. The MYGO_GPU=0 option still allows in-memory drawing.
    Android 4.54
    Bug Fixes
    - Fixed the chat screen jumping when opened by reserving space for the composer before the first frame is drawn.
    Improvements
    - Page transitions now slide in smoothly instead of cutting, and swipe-back settles in place before showing the new top page.
