  Key: ReleaseNotes
  Value: |-
    0.4.952
    Features
    - Added search to the desktop chat list. You can now search by chat title, latest task, workspace, agent, or folder, with matches shown in a single list. Press Esc to clear and close the search.
    - Added search to the Android agents list. You can search by chat title, subtitle, agent, folder, or workspace, with matches shown in a single list.
    - Added a thinking level indicator next to the active model in the Android model sheet, matching iOS. The indicator shows a dot meter and opens a slider for adjusting the thinking level.
    Bug Fixes
    - Fixed an issue on desktop where macOS app bundles (.app) were greyed out when selecting sensitive apps in Activity Recorder, making them selectable again.
