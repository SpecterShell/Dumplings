  Key: ReleaseNotes
  Value: |-
    0.4.1149
    Features
    - Mermaid diagrams in replies are now rendered as diagrams. Tap a diagram to open it full screen, fitted and centred, with pinch to zoom.
    - New Tab now starts omp (oh-my-pi) as a chat.
    Bug Fixes
    - Remote browser scrolling now stays under your finger and keeps up, making it feel like a local page.
    - In trackpad mode, the touch surface now covers the whole screen, so black bars beside or below the remote picture no longer ignore pointer movement.
    - The remote screen’s close button no longer cuts off the rounded corner when your phone is sideways.
    Improvements
    - Snippets and text/web scratch promotion are now handled by the Go server, making them faster and avoiding an extra Node process.
