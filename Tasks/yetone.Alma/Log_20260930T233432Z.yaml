  Key: ReleaseNotes
  Value: |-
    0.4.154
    Features
    - Each subagent can pin Fast mode on or off.
    Bug Fixes
    - Fixed an issue where reasoning split per token rendered one word per line.
    - Fixed gateway providers not showing in settings, the About page, and alma version on alma-server.
    - Fixed "Compact now" incorrectly saying there was nothing to compact for threads with a few long turns.
    - Fixed thinking-level options so they show English level names and make clear where unchecked levels go.
    - Fixed sidebar header buttons overflowing at larger UI fonts.
