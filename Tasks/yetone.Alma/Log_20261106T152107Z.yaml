  Key: ReleaseNotes
  Value: |-
    0.4.477
    Features
    - Added a new voice reading engine for Apple Silicon devices, with an automatic fallback option.
    - Hold-to-talk now appears as a WeChat-style card above the composer, with “按住 说话” (Hold to Talk) shown when empty.
    - After speaking, hold-to-talk places the recognized words into the text field so you can edit them before sending.
    - Alma can now read her replies aloud in personal chats.
    Bug Fixes
    - Hold-to-talk card now grows out of the composer instead of floating over the screen.
    - Loading earlier messages no longer loses the reader’s place in the conversation.
    - Replies are no longer read aloud unless the read-aloud setting is enabled.
