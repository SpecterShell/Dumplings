  Value: |-
    0.4.892
    Bug Fixes
    - Fixed Windows UI issues: Settings' "Restore defaults" no longer overlaps the window buttons, the last navigation group now has a "System" heading instead of an empty gap, and long file names on end cards no longer push the Project badge out.
    Features
    - Improved server turn lifecycle: the backend now marks a turn as fully finished before allowing new turns or stops, making turn handling more reliable.
