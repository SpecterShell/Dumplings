  Key: ReleaseNotes
  Value: |-
    0.4.147
    Features
    - Codex/Cursor sign-in is now available from the web UI when Alma runs headless.
    - Terminal now sizes to the smallest connected client, so the phone mirror fits its screen.
    - iOS terminal color schemes: Same as Mac, Alma, or 74 base46 themes.
    - iOS terminal font setting with bundled Nerd Fonts.
    - Compaction and image-edit blocks now appear as cards on iOS.
    - Terminal tab now mirrors your Mac terminals, with Browser/Terminal tab chips on iOS.
    Bug Fixes
    - Stopped the terminal mirror from echoing emulator replies into the Mac shell.
    - Fixed update checks hanging and RPM patches not loading.
    - Fixed clearing the terminal blanking the mirror on iOS.
