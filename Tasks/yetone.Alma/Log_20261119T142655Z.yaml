  Key: ReleaseNotes
  Value: |-
    0.4.866
    Bug Fixes
    - Fixed an issue where opening Alma could request titles for many agent panes at once, overloading the tool model and causing timeouts.
    - Turn titles are now generated two at a time and saved to disk, so they don't need to be requested again after restarting.
    - Notification titles are now generated first, and background title generation waits for its turn instead of timing out.
