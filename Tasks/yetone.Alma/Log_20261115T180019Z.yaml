  Key: ReleaseNotes
  Value: |-
    Features
    - Improved file pattern matching: common glob patterns (*, ?, **, character classes, and {a,b}) now run in Go, with results matched against fast-glob. Advanced glob features (extglobs, negation, ranges, and escapes) still run in Node. Added contract tests to ensure all five native tools return the same results in Node and Go modes.
