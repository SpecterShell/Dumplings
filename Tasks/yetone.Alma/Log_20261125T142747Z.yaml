  Key: ReleaseNotes
  Value: |-
    0.4.1166
    Features
    - Archived chats are now organized by workspace on iOS and Android, matching desktop. Each workspace shows only its own archived chats, and the full list groups them under workspace headings.
    Bug Fixes
    - Fixed an iOS trackpad mode issue where the strip under a sidebar (such as an opened-out Duo status bar or a phone camera area) moved the pointer and clicked, and the picture appeared centered on the full screen instead of within the space left by the bars.
    - Fixed server-side session identification so internal model calls correctly carry the chat’s session ID. This prevents tools and skills from appearing as anonymous sessions.
