  Key: ReleaseNotes
  Value: |-
    0.4.862
    Bug Fixes
    - Fixed the MCP Resources viewer so the list stays in the left column, rows align properly, and long lists no longer overflow the dialog.
    Features
    - Added Go-based handling for Telegram detected text, including text and voice branches, reply photos, and recent group image collection. Transcription remains in Node.js.
    - Added a kill switch (ALMA_NODE_TG_DETECTEDTEXT=1) to fall back to the previous Node.js behavior if needed.
