  Key: ReleaseNotes
  Value: |-
    0.4.18
    Features
    - Added a container benchmark harness to run Alma-the-agent on any Dockerized task suite.
    - Added an ALMA_SSH_BIN override so you can specify the SSH binary used for remote workspaces.
    - You can now pick resume pointers with the @ reference picker instead of typing alma:// URIs manually.
    Bug Fixes
    - Fixed evaluation runs to fail fast when a turn never starts and to respect an absolute output path (--out).
    - Fixed network policy being taken from the re-published suite instead of the originating suite.
    - Fixed sending Anthropic cache control headers to strict OpenAI-compatible endpoints.
    - Made workspace setup idempotent.
    - Resolved manifest paths relative to the manifest file and pinned the Node.js fetch version.
    - Fixed Windows window controls remaining clickable above the artifact dock.
