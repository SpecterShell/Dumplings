    0.4.1043
    Features
    - Added Show in Project to chat menus and the command palette. It opens the chat's project in the Projects tree, scrolls to it, and reveals chats opened from search. Archived chats are now grouped under collapsible project headers.
    Bug Fixes
    - Fixed keycap emoji (1️⃣ 2️⃣ #️⃣) and similar emoji sequences rendering incorrectly on Windows.
