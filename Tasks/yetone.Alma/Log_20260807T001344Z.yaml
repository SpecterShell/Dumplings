  Key: ReleaseNotes
  Value: |-
    0.0.942
    Features
    - Integrated Codex’s Computer Use API directly, giving you access to its full set of capabilities.
    - Added the missing “select text” action, completing the Codex command set — now with a focus guard to prevent accidental interactions.
    Improvements
    - The accessibility tree is now diffed by default, matching Codex’s behavior so you can more easily see what changed after each step.
    Bug Fixes
    - Fixed overlapping window control buttons in the corner of the Settings screen.
