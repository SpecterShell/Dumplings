  Key: ReleaseNotes
  Value: |-
    0.4.1099
    Features
    - Boards can now schedule Herdr chats: moving a card to In Progress opens its own chat, and when the chat stops, the card moves to Review with the chat’s last message.
    - Auto-run can keep a set number of cards in progress automatically.
    - Added a REST API and real-time board update notifications.
    - Added an alma board command-line tool and a board skill so your personal agent can manage and follow boards.
    Documentation
    - Added documentation for kanban boards, including columns, rules, REST, and CLI.
