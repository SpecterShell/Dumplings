  Key: ReleaseNotes
  Value: |-
    0.4.100
    Bug Fixes
    - Fixed an issue where editing or resending a message while a reply was still thinking could start two replies at the same time and leave the old one stuck streaming.
    - Fixed chat jumping to earlier messages when collapsing a subagent card.
    iOS 1.18
    Features
    - The message composer now supports slash commands and @ mentions like the desktop app.
      - Type / to access commands, prompts, and skills, including /compact.
      - Type @ to search and reference threads or other items.
      - Selected references now appear as bold labels in sent messages.
