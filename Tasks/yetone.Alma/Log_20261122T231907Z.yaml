  Key: ReleaseNotes
  Value: |-
    0.4.1020
    Features
    - The finish step now supports provider and run context from Go’s turn state, including vision input, tool catalog, and allowed skills.
    - /turn/finalize ingredients and step posts’ model and binding hash now come from Go’s turn state and are adopted when Go and Node agree (controlled by ALMA_NODE_GEN_FINISH_STATE=1).
    Improvements
    - Step 1 entry claim now logs the fallback decision for each send. This is off by default and can be enabled with ALMA_GO_TURN_ENTRY_CLAIM=1.
