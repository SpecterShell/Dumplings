  Key: ReleaseNotes
  Value: |-
    0.4.516
    Bug Fixes
    - Fixed Pi running in a Windows Herdr pane being treated as a bare shell instead of a chat with its talk.
    - Fixed narrow desktop windows squeezing the chat and hiding the model picker. The sidebar now steps aside while the side panel is open, the chat keeps a 360px minimum width, and the sidebar returns when space allows.
    - Fixed built-in skills you turned off being re-enabled after a Linux update.
    Improvements
    - On mobile, only topology changes are sent now instead of the full snapshot each time.
