  Key: ReleaseNotes
  Value: |-
    0.4.548
    Features
    - Remote Browser: Links in another computer's agent chat now open in that computer’s browser, using its sign-ins and localhost. The Remote Screen shows just that browser window so you can drive it from your current device.
    Bug Fixes
    - New sessions appear immediately: A Pi’s chat now switches to a new /new session right away, even before the first message is sent. Previously, the old chat stayed visible until the new session’s first message.
    - Session switching stability: A Pi with two sessions no longer flips back to the previous session when starting a new one.
