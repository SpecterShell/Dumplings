  Key: ReleaseNotes
  Value: |-
    0.4.693
    Features
    - Live agent progress: see steps while the agent works, with a progress pill that expands into a checklist.
    - Stop now shows “Stopping…” while the agent is stopping.
    - Edits awaiting approval show a diff with Deny, Always Allow, and Allow actions.
    - “/” menu lists agent commands and skills, filtering as you type.
    - Reconnecting state shows “Reconnecting…” and holds Send.
    - Hardware keyboard shortcuts: Esc stops, and ⌘1–⌘3 answer.
    - Chat list: swipe to delete with Undo.
    - Chat list: snooze a chat until Later, kept on this phone.
    - On phone, search field sits at the bottom with New Chat beside it.
