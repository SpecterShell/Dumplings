  Key: ReleaseNotes
  Value: |-
    0.4.714
    Features
    - Redesigned General settings on desktop into three clear sections: Models, Behavior, and System. Each setting now shows its name on the left and its control on the right, uses switches for on/off, and includes at most one line of explanation.
    - Added a keyboard shortcut: ⌘F now focuses search even from a text field.
    Improvements
    - Rarely changed settings are now tucked under a collapsed Advanced section. If search jumps to one, the Advanced section opens automatically.
    - Opening Activity Recorder no longer saves immediately.
    Bug Fixes
    - Fixed the agent key strip on iOS so taps near a key now land correctly. Touch areas are now taller and cover the gaps between keys, without changing the visuals.
