  Key: ReleaseNotes
  Value: |-
    0.4.846
    Bug Fixes
    - Resuming interrupted tasks after an update or relaunch no longer fails with an incompatible API request. Quitting now handles aborts without clearing the generation state too early.
    Features
    - AIHubmix task subagent and summary compaction now run in Go for better performance. Use ALMA_NODE_AIHUBMIX_ADMISSION=1 to keep this in Node if needed.
