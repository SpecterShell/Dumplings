  Key: ReleaseNotes
  Value: |-
    Features
    - Desktop (0.4.1069): While the model is replying, an accent arc now animates around the message composer to show a response is still in progress. If reduced motion is enabled, a static accent edge is shown instead.
    - Android (4.43): Chat links now open in the system browser. Long-press a link to open it in-app, on a computer, or copy it.
    Improvements
    - Android (4.43): The remote browser now glides smoothly after a flick.
    Bug Fixes
    - Android (4.44): Opening a file’s changes no longer freezes the app. The changes screen now uses lazy loading, processes diffs and colors off the main thread, and calculates line counts once.
