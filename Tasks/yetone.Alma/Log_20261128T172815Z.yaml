  Value: |-
    0.4.1256
    Bug Fixes
    - Fixed an issue where real-time updates sent while the service was waking from idle could miss clients that connected during startup.
    Improvements
    - Simplified and centralized the startup handoff for real-time updates, making delivery more reliable and consistent.
    Testing
    - Added regression tests to cover real-time update delivery while the service is starting up.
