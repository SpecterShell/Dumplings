  Key: ReleaseNotes
  Value: |-
    0.4.228
    Features
    - CLI: alma thread notify sends a plain-text message into a thread without running the model.
    - iOS agents: Added Spaces and Agents lists, plus per-pane chat identity.
    - iOS: Added a short note when the link moves from the relay to local Wi-Fi.
    Bug Fixes
    - Fixed the Thinking shimmer to show one highlight sweeping across the text instead of a ghost copy.
    - Fixed chats interfering with the reader and pages losing content when a link is dropped.
    - Fixed fallback to still images when desktop video never arrives.
    - Fixed agent terminal screens wrapping to the phone’s width.
    Improvements
    - Improved the Herdr desktop sheet: opens with its model, cleaner glass strips, and lists in a More menu.
    - iOS agents: Made chat scrolling steadier and Needs-you cards quieter.
