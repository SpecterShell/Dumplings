  Key: ReleaseNotes
  Value: |-
    0.4.1250
    Features
    - Added a conversation timeline to Herdr Chat with one marker per sent message. Clicking a marker scrolls to that message, and the marker follows as you scroll.
    Bug Fixes
    - Fixed the Android remote desktop trackpad not appearing in mouse mode on some Linux (Wayland) computers, matching iOS behavior.
    - Fixed bold formatting when the closing bold marker touches Chinese punctuation, so asterisks no longer appear in text like "**完整测试套件：**我的".
