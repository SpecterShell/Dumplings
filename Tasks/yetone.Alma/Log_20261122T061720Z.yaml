  Key: ReleaseNotes
  Value: |-
    0.4.985
    Features
    - Added smoother handoff when a stop arrives before generation begins. The backend can now handle reset, stop holds, and plugin permission checks directly.
    Bug Fixes
    - Fixed a memory issue where offscreen diffs and clip masks could stay around too long. They now use a 24 MB byte budget and drop the least recently drawn entries.
    - Fixed shell detection when only a partial set of environment variables is provided, resolving type-check failures.
    - Fixed skill extraction for newer AI SDK tool call formats. Threads are now analyzed and re-analyzed as tool usage grows, instead of never being analyzed.
