  Key: ReleaseNotes
  Value: |-
    0.4.1226
    Features
    - New Tab and New Workspace now only show agents installed on your computer. Agents like pi, omp, and Amp no longer appear if you haven't installed them (desktop, iOS, and Android).
    Bug Fixes
    - Fixed saving skills whose description contains a colon and space. Previously this could cause a 500 error and leave a broken file.
    - On Android, long-pressing a reply that contains only tool calls no longer shows emoji, reply, or copy actions.
