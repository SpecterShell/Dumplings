  Value: |-
    0.4.585
    Bug Fixes
    - Fixed the new chat composer shrinking in narrow desktop windows and improved toolbar layout.
    - Fixed a white flash when launching the desktop app in dark theme.
    - Fixed iOS replies that finish while offline so they appear after reconnecting or tapping the notification, without a stale “Thinking…” indicator or stop button.
    - Fixed routine replies that produce only “(no output…)” with stray text so they no longer create phone bubbles, and cleaned up previously posted ones.
