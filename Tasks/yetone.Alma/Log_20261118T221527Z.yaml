  Key: ReleaseNotes
  Value: |-
    0.4.818
    Features
    - Added Go backend support for listing and merging Herdr pull requests, including branch lookup, status checks, caching, merge method selection, and clearer error reporting.
    - Added Go backend support for Windows file tools such as reading, writing, editing, searching, and file matching, with improved Windows path handling.
    - Added Go backend support for viewing data storage and reclaiming space, including database checkpointing and cleanup.
    - Added direct Go-based turn archiving when the Go archiver is enabled, reducing an extra handoff step.
