  Key: ReleaseNotes
  Value: |-
    0.4.820
    Features
    - Migrated image generation for Volcengine, OpenRouter, and GPT-image providers to the Go service, including caching of generated images.
    Improvements
    - When Go cannot read a response body the same way Node can, the request is automatically handed back to Node to preserve compatibility.
    - Certain image generation flows, such as prompts, broadcasts, and async/plugin/AI SDK branches, continue to run in Node.
    - Added an option to keep all image generation in Node by setting ALMA_NODE_IMAGE_GEN=1.
    - Network request logging now keeps image generation calls in Node when enabled.
