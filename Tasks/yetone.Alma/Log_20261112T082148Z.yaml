  Value: |-
    0.4.575
    Features
    - Antigravity (agy) tabs now open as a chat on desktop and iOS. Alma names each conversation from the presence lock its agy holds and reads the agy transcript, including thinking, replies, tools, and their results.
    Bug Fixes
    - Android: Markdown now renders correctly in chat, including footnotes, reference links across paragraphs, GitHub alerts, <details>, inline HTML (kbd, sub, sup, mark, br), LaTeX math, and indented paragraphs in lists — matching iOS and desktop.
