  Key: ReleaseNotes
  Value: |-
    0.4.150
    Features
    - File cards now include an arrow to open the file in your default app.
    - You can now choose a self-hosted relay in remote access settings.
    Bug Fixes
    - Resumed chat turns after a background task now keep the thread’s thinking level.
    - The selection toolbar no longer squeezes its labels near the window edge.
    - Fixed code files rendering blank on iOS.
    - Fixed sharing a text file to another app on iOS.
    - Gateways now honor their own reasoning levels and limits.
    - Nightly self-reflection now actually runs.
