  Key: ReleaseNotes
  Value: |-
    0.4.832
    Features
    - Feishu / Lark bots now run core logic in Go, including mapping, turns, commands, typing reactions, background monitoring, early sending, duplicate prevention for final replies, and error summaries. The previous Node.js behavior can still be enabled with ALMA_NODE_FEISHU=1.
    Bug Fixes
    - On macOS, the built-in browser now shows a helpful error page when a page cannot load due to a refused, timed-out, or unreachable address. It includes the reason and a Try Again button instead of showing a blank or stale page.
    Improvements
    - The built-in browser now logs the reason a page failed to load on all operating systems.
    - Added an Inspect option to the built-in browser’s page menu to open the web inspector.
