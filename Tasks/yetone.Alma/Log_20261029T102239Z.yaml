  Key: ReleaseNotes
  Value: |-
    0.4.233
    Features
    - Mute a single tab in herdr instead of muting a whole space.
    - On iPad, herdr's spaces and tabs now appear in the sidebar on agent pages.
    - On iPad, the chat list now sits beside the open page.
    - Live Activity now uses Alma's icon with a status badge in the corner.
    Improvements
    - Alma now appears directly on the working bar instead of on a white tile.
    - Alma typing at her laptop now replaces the sparkle in an agent's working bar.
    - A relay dial stuck on "Connecting" for more than a minute is now automatically dropped and redialed.
    Bug Fixes
    - Fixed the Live Activity badge clipping by keeping it inside the icon frame.
    - Fixed the agent terminal staying landscape-wide after rotating back to portrait.
    - Pairing now says "device" instead of "Mac" because Linux desktops can pair too.
