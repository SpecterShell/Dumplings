  Key: ReleaseNotes
  Value: |-
    0.4.139
    Features
    - Introduced Alma Server, a headless version of Alma for Linux x64 and arm64.
    - Access Alma Server through a browser over SSH port forwarding, the iOS app via relay pairing, or a built-in terminal chat.
    - Added ALMA_TOOL_APPROVAL to control tools that need approval with auto, ask, or deny.
    - Alma Server keeps its data in its own directory and does not start computer use or activity recording.
    Bug Fixes
    - Fixed the terminal UI dropping the first streamed response chunk, so replies now appear complete from the start.
