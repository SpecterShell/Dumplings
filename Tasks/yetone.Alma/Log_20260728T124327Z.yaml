  Key: ReleaseNotes
  Value: |-
    Features
    - Added a toggle for the Win98 window trail Easter egg, which is now enabled by default.
    - The Win98 window trail Easter egg now also gives the project sidebar a matching 98-inspired look.
    Bug Fixes
    - Fixed the Win98 window trail so it paints correctly as a dense, smeared trail, drawing the oldest content first instead of causing flicker.
    - Prevented the theme system from accidentally clearing the pre-loaded theme on startup, ensuring the bootstrapped look applies reliably.
    - Resolved a visual glitch where the settings window briefly displayed un-themed chrome before switching to the Win98 style.
