  Key: ReleaseNotes
  Value: |-
    Bug Fixes
    - Fixed broken links in threads by addressing the root cause rather than just the symptoms.
    - Resolved an issue where a thread could become stuck because its active path referenced non-existent messages.
    - Prevented the app from running out of memory by limiting the queue size during streaming.
    - Fixed a bug where a 60-second watchdog timeout would prematurely cancel generation turns that were still in progress.
    - Tool results no longer expose credentials, and helper processes now use a consistent idle timeout.
