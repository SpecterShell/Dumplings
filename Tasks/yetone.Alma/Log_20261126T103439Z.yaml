  Key: ReleaseNotes
  Value: |-
    0.4.1186
    Bug Fixes
    - Fixed the mobile agent terminal so the cursor is visible.
    - Fixed a terminal pane sizing issue so the input box and status line aren’t hidden.
    - Fixed the Android home screen profile picture being cut off.
    - Fixed the Windows workspace folder picker so it can access all drives and hides legacy system shortcuts.
    - Fixed the alma iab fetch command so it works in the native app.
    Improvements
    - Improved iOS TestFlight builds so the newest run cancels older ones cleanly and uses separate build directories.
    - Improved SSH remote sign-in timing and error messages, and Windows hosts are now named correctly.
