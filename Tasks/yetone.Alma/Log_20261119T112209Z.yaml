  Key: ReleaseNotes
  Value: |-
    0.4.858
    Bug Fixes
    - Fixed Settings → Permissions showing a "Permissions granted" toast every time it opened. The toast now appears only when the last permission is granted, and granted permissions show a green check.
    - Fixed the Live Coding window staying stuck on "Initializing..." by starting its engine as soon as the window opens. If startup fails, the window now says so and Play retries.
    - Fixed an open submenu in a sidebar thread's menu (Snooze, Move to project, Copy…) flickering repeatedly instead of staying still.
