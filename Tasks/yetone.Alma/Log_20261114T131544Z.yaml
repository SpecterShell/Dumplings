  Key: ReleaseNotes
  Value: |-
    0.4.612
    Bug Fixes
    - Fixed an issue where clicking in the sidebar could open the wrong conversation when the list shifted under the cursor after a thread moved to the top.
    - Fixed keyboard scrolling after clicking in a conversation: Page Up/Down and arrow keys now scroll the last clicked area, not the area under the mouse pointer.
    - Fixed opening a thread from the sidebar so the composer is focused and you can start typing right away.
