  Value: |-
    0.4.718
    Features
    - Dictation is now visible across threads: a red microphone appears on the sidebar row for the active thread, and other threads’ composers show which thread is dictating and allow you to stop it.
    - File cards in messages can be dragged out to Finder or Explorer as the actual file.
    - A worktree thread’s composer now names the worktree folder.
