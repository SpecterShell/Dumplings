  Value: |-
    0.4.794
    Bug Fixes
    - Desktop: When conversation search fails, the app now says the search couldn’t be completed instead of showing “No results found.”
    - iOS: Improved the agent composer’s glass blur effect so content fades smoothly instead of showing a sharp edge.
    - iOS: Fixed the chat list title bar on phones so the title is centered, with Settings on the left and Control Computer/Agents on the right.
    Improvements
    - Android: When away from home, Tailscale is now used only when it provides a faster connection than the relay.
