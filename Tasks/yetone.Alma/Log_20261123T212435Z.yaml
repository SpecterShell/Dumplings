  Key: ReleaseNotes
  Value: |-
    0.4.1072
    Features
    - Telegram groups are now supported in the Go server, including group metadata, logging, group context, and formatted message sending.
    - The /model picker is now available even when no plugin is enabled.
    - iOS Share Extension: send text, links, images, and files from any app to an Alma chat.
    Bug Fixes
    - Fixed direct connections over Tailscale being blocked by iOS App Transport Security.
