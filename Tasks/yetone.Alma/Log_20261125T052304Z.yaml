  Value: |-
    0.4.1133
    Features
    - Added a lightweight server that handles common background requests (agents, loops, speech, Chrome relay, computer use, recorder, team, plugin reads, tools list, cron, heartbeat, and personal reads) without starting the full Node.js backend.
    Bug Fixes
    - Fixed large Mermaid diagrams rendering incorrectly and causing display issues in the desktop app.
    - Fixed a blank white screen when connecting to another computer fails; the app now shows a “can’t reach that computer” message with a Try again option.
