  Key: ReleaseNotes
  Value: |-
    0.4.476
    Features
    - On iOS, hold the composer field itself to talk, like in WeChat.
    - On iOS, hold the composer’s microphone to talk and release to send.
    - On iOS, reach your computer directly through a VPN while using cellular data.
    Bug Fixes
    - Fixed an issue where resuming an interrupted Codex session didn’t continue correctly.
    - Dictation now starts immediately and recovers properly.
    - Composer bars no longer overlap each other.
    - Sending a message in a personal chat no longer causes a blank page.
