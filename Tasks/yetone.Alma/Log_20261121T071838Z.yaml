  Key: ReleaseNotes
  Value: |-
    0.4.937
    Improvements
    - Improved desktop scrolling performance for sessions with many tool cards when the timeline is open. Off-screen finished rows, thoughts, and timeline phases now keep their measured height instead of being rebuilt every frame.
    - Reduced memory usage by limiting cached data to a smaller fixed amount instead of keeping raw data for up to 16,384 parts across refetches.
    Bug Fixes
    - Fixed an iOS issue where tapping a subagent in the list didn’t open it on the first tap because the row constantly redrew and canceled the tap. The sheet now opens from the correct pane.
