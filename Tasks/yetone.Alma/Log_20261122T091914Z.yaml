  Value: |-
    0.4.993
    Features
    - Scheduled Discord messages are now sent directly by the server’s Go backend for better reliability. Set ALMA_NODE_CHANNEL_DISCORD=1 to keep the previous Node-based delivery if needed.
    Bug Fixes
    - Fixed the Antigravity model list hanging on Homebrew-installed setups. It now loads correctly and reports a clear error immediately if a required component is missing.
