  Key: ReleaseNotes
  Value: |-
    0.4.928 / Android 4.25
    Features
    - Added a microphone button in the conversation composer on Android. It appears when the input is empty; tap to dictate into the field, or hold to talk.
    - Alma's conversation now shows the step she is on, including the current step under her messages during a running turn so long tasks no longer look idle.
    Bug Fixes
    - Fixed markdown reports in the desktop app so embedded HTML (like centered text, images, links, headings, lists, and summaries) renders as content instead of code.
    - Fixed wide tables in desktop markdown reports so they scroll sideways while the preview still scrolls down.
    - Fixed Android step labels for active steps to read in the present tense (Running, Reading, Editing) instead of past tense (Ran).
