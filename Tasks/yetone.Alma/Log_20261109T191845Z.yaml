  Key: ReleaseNotes
  Value: |-
    Features
    - Android now aligns with iOS, including: hold-to-talk read-aloud, Alma dictation engine, app shortcuts, attention-sorted agents, Herdr Core setup, Stop returns the prompt, Load earlier keeps your place, direct VPN-on-cellular route, hedged relay dial, Mac sound in screen view, roomier chat, larger faces, Mac-path images, and rotation support.
    Bug Fixes
    - Fixed cross-device copy and paste so text copied on one device is correctly sent and pasted on another.
    - Fixed hardware-keyboard paste in screen view to use the device’s clipboard instead of the computer’s own clipboard (iOS and Android).
    - Fixed the “Needs You” section so it can be collapsed like other sections (Android and iOS).
    Improvements
    - Improved Android chat image quality by displaying images at the correct size, reducing grainy text in screenshots.
