  Key: ReleaseNotes
  Value: |-
    0.4.164
    Features
    - Dragging a project's "+" now shows the project's icon and name instead of a generic plus sign.
    Bug Fixes
    - Fixed a scrolling issue where returning to a conversation mid-turn opened it near the top instead of at the bottom.
    - Fixed model selection so the model chosen for a turn is kept when switching conversations mid-turn, and the next message no longer silently uses the previous model.
    - Fixed the floating browser/screen mirror so closing it keeps it closed while the agent is working.
