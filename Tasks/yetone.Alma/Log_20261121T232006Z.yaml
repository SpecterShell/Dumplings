  Key: ReleaseNotes
  Value: |-
    0.4.971
    Improvements
    - The Go server now determines the enabled plugin set directly, reducing round trips to the Node service for plugin provider and model lists when no provider-capable plugin is active.
    - Added environment variables (ALMA_NODE_GEN_PLUGIN_SET=1, _OWNER, or _REGISTRY) to restore the previous Node-managed plugin set behavior.
