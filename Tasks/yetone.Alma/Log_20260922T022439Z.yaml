  Key: ReleaseNotes
  Value: |-
    0.4.98
    Features
    - Smarter window resizing for the sidebar: Opening the right sidebar in a narrow window now widens the window just enough to fit the sidebar, chat, and dock without crushing the chat. The window only grows as needed within the screen, and maximized, full-screen, or fixed-size windows are not changed. Closing the sidebar restores the previous width unless you manually resized in the meantime. Switching threads does not trigger this resize.
    Bug Fixes
    - Consult assistant understands @-mentions: The consult assistant can now see what @-mentioned content and resume pointers actually refer to, instead of only seeing internal links. This helps it judge whether resume points are relevant or correct.
