  Key: ReleaseNotes
  Value: |-
    0.4.88
    Features
    - Chat split panes now form a group based on available window space instead of always being a pair.
    - The iOS native thinking indicator now uses the desktop-style animated orb with a shimmering "Thinking…" label, replacing the three blinking dots.
    Bug Fixes
    - Fixed "Last checked" showing "Never" for checks that finished before the About page was opened.
    - Fixed Windows frontmost-window polling that never worked due to a PowerShell script invocation issue.
