  Key: ReleaseNotes
  Value: |-
    Features
    - Added a master switch (ALMA_NODE_GEN_MEMORY=1) that controls memory-related features: Layer 3 merges, /ws/memory events, crystal thread reads, and small text. OWNER and REGISTRY modes enable this automatically.
    - Time clues now remain controlled by their own separate switch.
    Improvements
    - Go mode no longer requests memory-related features from Node unless the master switch is enabled.
    - Updated B76 and B21 tests to explicitly request the expected memory workloads.
