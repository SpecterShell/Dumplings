  Key: ReleaseNotes
  Value: |-
    0.4.844
    Features
    - Starting a new goal now streams the first response from Go, so you see it sooner.
    - Failed messages now show Edit and Delete actions next to Retry.
    - Remote screen in mouse mode now includes a scroll strip on the right edge and a Natural scrolling toggle under Settings → Advanced.
    - Added an option to keep the previous goal-start behavior if needed (ALMA_NODE_GOAL_START=1).
    Bug Fixes
    - Fixed a race condition where hold-to-talk audio and route changes could interfere with a session that was finishing.
