  Key: ReleaseNotes
  Value: |-
    0.4.137
    Features
    - File viewer soft wrap: Added a wrap toggle in the file viewer header and an Alt+Z shortcut to wrap long lines. Your preference is remembered across files and launches.
    Bug Fixes
    - Browser tools no longer hang: Fixed an issue where opening a browser page could hang, especially with visible agent browsing enabled. It now opens pages in the sidebar browser when available and falls back to the hidden window otherwise. Page loads are bounded and no longer stall other requests.
    - “Launch Chrome with extension” now gives feedback: If your installed Chrome version doesn’t support launching with the extension flag (for example, Google Chrome 137+), the app now explains why it can’t launch and shows manual installation steps instead of doing nothing.
    - iOS chat stays at the bottom: Fixed the chat jumping to the first message when the keyboard appeared or disappeared. Readers at the end of a thread now stay pinned to the latest message while typing or dismissing the keyboard.
