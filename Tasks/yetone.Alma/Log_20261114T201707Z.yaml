  Key: ReleaseNotes
  Value: |-
    0.4.628
    Bug Fixes
    - Fixed the composer’s project picker to respect your manual project order in the sidebar.
    Features
    - If a reply fails while you’re away, its thread now shows a red indicator in the sidebar instead of the normal completed dot.
    - Opening the thread or continuing the conversation clears the red failed-reply indicator.
    - Closed projects with failed replies now show a red roll-up dot.
