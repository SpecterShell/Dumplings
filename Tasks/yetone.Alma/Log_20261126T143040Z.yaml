  Key: ReleaseNotes
  Value: |-
    0.4.1193
    Features
    - iOS: Long agent lists are now easier to navigate — chats show what they’re about and when they last moved, settled chats are grouped under Today / Yesterday / Previous 7 Days / Earlier, and you can search through what chats said.
    - iOS: Added a time × project scrubber, a compact Needs You section (max 3 with a pill when scrolled away), and a Next Up bar for the next waiting or finished chat (⌥⌘↓).
    - herdr: Snapshots now record when each chat last moved (to the minute), and search can find chats by what was said.
    Improvements
    - Android: herdr composer stays up and remains readable while the chat scrolls.
    - Android: Antigravity (agy) is now available in New Tab/Workspace.
    Bug Fixes
    - Android: Fixed FlClash fake-ip so the phone no longer stays on the relay.
