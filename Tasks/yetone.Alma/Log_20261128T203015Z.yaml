  Key: ReleaseNotes
  Value: |-
    0.4.1258
    Features
    - Activity recording now runs directly in the server on macOS and Windows when activity tracking is enabled and the desktop app is in lazy mode. It captures, deduplicates, redacts, rotates, and stores frames; reads the active window via accessibility; and keeps analyzer and embedder schedules running, so a background Node process no longer needs to stay active.
    - The retry-failed sessions endpoint is now served by the server when the server handles analysis. Failed sessions return to pending with a fresh retry budget and trigger a background analysis pass if needed.
    Updates
    - Android APK updated to version 5.20.
