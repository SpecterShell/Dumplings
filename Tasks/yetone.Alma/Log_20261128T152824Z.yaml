  Key: ReleaseNotes
  Value: |-
    0.4.1255
    Bug Fixes
    - Improved path handling for terminals and workspace resolution so absolute paths behave consistently across Windows, macOS, and Linux, including edge cases like C:\x and UNC paths.
    - Fixed an issue where idle terminals could inherit an internal auto-archive setting.
    - Fixed terminals opened in a workspace subfolder to use that subfolder as the working directory, preserving symlinked workspace paths correctly.
    - Improved compatibility with strict OpenAI-compatible endpoints: if a provider rejects requests that include cache control, the request is automatically retried without it and the setting is remembered for that provider and model.
