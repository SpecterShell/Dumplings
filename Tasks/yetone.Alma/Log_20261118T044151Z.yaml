  Key: ReleaseNotes
  Value: |-
    Features
    - The browser panel now asks before trusting a self-signed certificate from a local server. Your approval applies to that host, port, and certificate until you quit, while invalid certificates from public hosts are still blocked.
    Bug Fixes
    - At launch, slow login shells now get one extra 20-second retry, so your system PATH is still picked up even with a slow profile.
    - Switching away and back now preserves each thread’s opened files and scroll position in the Changes tab, and each workspace’s open folders in Files.
    - Back and forward mouse buttons over the side panel no longer interrupt the current chat.
    - A stalled update download now ends in a retryable error after 60 seconds instead of showing “Downloading…” forever.
    - If sending a message fails, your text returns to the message box unless you’ve started typing something new. Failed split-pane or pull request sends no longer leave empty message bubbles.
    - Renaming a sidebar item no longer overwrites a newer title that arrived while the rename was open.
    - Back and forward mouse buttons now navigate through a browser tab’s history as expected.
    - Copy Absolute Path now keeps backslashes in Windows folder paths.
    - Prompt Stash now stays within a short window.
    - Project favicons added later now appear without restarting.
