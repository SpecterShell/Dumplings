  Key: ReleaseNotes
  Value: |-
    0.4.397
    Features
    - Launched the native Android app, a port of the iOS app.
    - Added Android APK download (beta) on the website. Android visitors now see an APK button instead of the iPhone beta.
    Bug Fixes
    - Fixed a chat with half an emoji failing to load on phones.
    - Fixed Android monospace text spacing to match iOS.
    - Fixed Android visual inconsistencies with iOS, including source view, file error states, titles, markdown text, inline code, disabled text, scroll edge, centered title, and loading indicator.
    - Fixed long-press preview fading on Android.
    Improvements
    - Android release builds are now signed and ship for arm64 devices only.
