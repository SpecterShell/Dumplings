  Key: ReleaseNotes
  Value: |-
    0.0.911
    Features
    - Windows 98 theme: the project sidebar now appears as a classic Explorer tree.
    Bug Fixes
    - Fixed endless loading screen caused by a hidden fetch error.
    - Threads stuck on the loading screen now recover on their own, and new chat submissions are no longer lost.
    - Sidebar thread rows no longer jitter when the rename field is cleared.
    - Windows 98 theme: user chat bubbles immediately show the sunken bevel style after sending.
    Improvements
    - Windows 98 theme: chat bubbles now use a consistent 12px grid for a cleaner, more uniform look.
    - Removed the experimental pixel font feature entirely.
