  Key: ReleaseNotes
  Value: |-
    0.4.594
    Features
    - Deleting a thread can now be undone. The thread disappears from the sidebar immediately, and an Undo toast appears. The deletion is only sent to the server after the toast goes away; pending deletions are flushed when quitting.
    - The empty command palette now shows Recent Threads first, with the most recently visited threads at the top. Pressing ⌘F then Enter takes you straight back to your last thread. Thread rows without a snippet now occupy a single line.
