  Key: ReleaseNotes
  Value: |-
    0.4.854
    Features
    - The Go server now manages the rearview ledger, including open chains, counts, milestones, and files. Updates from Node turns, subagents, and support sessions are applied in order, and readers sync first. Set ALMA_NODE_REARVIEW_LEDGER=1 to keep this behavior in Node.
    - Task subagents and compaction summaries for Copilot now run in Go, using inherited and summary models from the Copilot SDK. Go handles accounts, while a preferred Copilot model remains in Node. Set ALMA_NODE_COPILOT_ADMISSION=1 to keep Copilot in Node.
