  Key: ReleaseNotes
  Value: |-
    Bug Fixes
    - Desktop (Linux, 0.4.1244): Scheduled updates now restart Alma properly on desktops that don’t report user activity, such as Xfce and other X11 desktops.
    - Mobile (Android & iOS, 5.12 & 5.13): Subagent sheets and pages now open at the latest step and collapse finished steps into a single line, making long subagent activity easier to review. The “Auto-collapse reasoning” chat setting is now also applied to subagent thinking.
