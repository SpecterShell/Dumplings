  Key: ReleaseNotes
  Value: |-
    0.4.474
    Bug Fixes
    - Fixed an issue on iOS where a direct connection that drops immediately after connecting now falls back to the relay.
    - Fixed the Compacting strip hanging after a missed compaction event on iOS and Android.
    - Fixed terminal screens showing visible stripes between rows.
    - Updated terminal scrolling to follow key-driven changes, so /resume pickers appear and arrow keys move the view.
    - Stopped coding work from being sent to herdr when herdr isn’t active on this Mac.
    - Limited how much history is replayed into a new agent session, preventing compaction failures.
    - Fixed an iOS issue where sending a message could blank the whole conversation.
    - Fixed an iPad crash when switching apps.
    - Fixed an iOS issue where a lost update stalled responses, leaving a thought stuck at its first token and tools spinning.
