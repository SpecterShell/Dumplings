  Key: ReleaseNotes
  Value: |-
    0.4.864
    Features
    - Added new Herdr commands for working with terminal panes:
      - run: types a command and presses Enter. Use --wait to show the screen after running.
      - keys: sends control keys like Ctrl+C, Enter, or Escape.
      - read: shows the current screen and can include previous lines with --lines.
    - These commands work even in panes without an agent, including plain shells.
    - Made the commands available through the API, so they also work in computer/remote mode.
    Improvements
    - When a pane cannot receive input, the error now points you to the new run command.
