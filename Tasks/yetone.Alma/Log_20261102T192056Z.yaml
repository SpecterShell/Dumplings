  Key: ReleaseNotes
  Value: |-
    0.4.399
    Bug Fixes
    - Herdr: Fixed the working bar dropping the box drawing beside the spinner.
    - Android: Draw tool now uses the iOS scribble glyph instead of a looped squiggle.
    - Android: Annotate palette now shows the selected colour’s ring, and ALMA_DEV_ANNOTATE opens the editor like iOS.
    - Android: Brain glyph now matches the iOS side view.
    - Android: Tool keys now hyphenate like iOS (e.g., run_in_back-/ground), and the lightbox glass fill matches iOS.
    - Android: Tool-sheet keys now wrap at word boundaries instead of mid-word.
    - Android: Stacked sheets now behave like iOS — the lower sheet dims, the new one sits slightly lower, and only one scrim is shown.
    - Android: Folder picker path header now uses the section-header colour.
    - Android: Nav-bar edge blur now sits on the page colour, so text under the chat header blurs like iOS.
    - Android: Selected segment keeps the full “Changes…” label.
    - Android: Workspace empty states now centre in the safe area.
    App Updates
    - Android 1.70, 1.71, and 1.72 APKs are now available on the website.
