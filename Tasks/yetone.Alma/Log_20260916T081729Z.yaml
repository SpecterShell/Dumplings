  Key: ReleaseNotes
  Value: |-
    0.4.52
    Features
    - One-time scheduled tasks now appear in the time clues on their scheduled day.
    Bug Fixes
    - Fixed chat layout issues during tool activity that caused the conversation to jump or disappear.
    - Fixed missing translations for the send and stop buttons’ accessibility labels.
    - Fixed Windows remote sessions leaving behind an unnecessary file in the workspace.
    - Fixed parallel subagents freezing the app; the chat card now remains after a reload.
    - Fixed the time clues dialog: unread dots are no longer clipped or misaligned, and the Apply button matches its inputs.
    - Fixed thread chips not navigating to the thread.
    - Fixed artifact docks in narrow layouts: the browser address bar wraps to its own line, and tabs collapse into a “…” menu instead of scrolling.
