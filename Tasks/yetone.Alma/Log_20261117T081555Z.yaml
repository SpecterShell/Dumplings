  Key: ReleaseNotes
  Value: |-
    0.4.717
    Features
    - Dragging a folder onto the project sidebar now creates a project, with visual feedback while dragging. Dropping files instead shows a reminder that folders become projects.
    - Added a setting under General → Behavior to keep your computer awake while agents are working.
    - On iOS, quoting selected text now shows a card in the sent message with surrounding context and the quoted part highlighted. Tapping the card scrolls back to the original message.
