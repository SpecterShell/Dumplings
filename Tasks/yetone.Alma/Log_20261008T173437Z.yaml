  Key: ReleaseNotes
  Value: |-
    0.4.168
    Features
    - Added a private conversation pane next to the channel in Team, with sharing planned for later.
    - Timeline markers are now limited in density, and you can scroll the marker rail with the mouse wheel.
    - On Linux tiling compositors, the window control cluster is hidden automatically.
    Bug Fixes
    - Live tool activity now appears in the plain timeline again instead of a card box.
    - Non-stream completions now respect the LLM timeout, and timeout values are stored as applied.
    - ACP models now correctly detect thinking, context, and vision capabilities from the catalog.
    - Opening an external file whose name contains spaces now opens in the sidebar rather than the system viewer.
    - Long Discord messages are split into multiple sends instead of being silently cut off at 2000 characters.
