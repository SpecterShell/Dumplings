  Key: ReleaseNotes
  Value: |-
    0.4.478
    Features
    - Added custom CosyVoice reference voice support and an ALMA_TTS_ENGINE override.
    - Added iOS Action Button and Shortcuts support for starting voice chat, creating a new chat, and sending a message.
    Bug Fixes
    - Fixed ACP agent shutdown to kill the full agent tree, clean up idle agents, and carry Stop through to sessions and cancellations.
    - Improved CLI error reporting for connection failures.
    - Fixed ACP agents not receiving skill paths.
    - Fixed the Herdr trust screen and listing of agentless panes in chats.
    - Fixed Android and iOS Herdr cards to show the folder name instead of a truncated path.
    - Fixed iOS composer frost placement under the Duo rail.
    - Fixed iOS hold-to-talk card and field to read as one pane.
    - Fixed iOS long-press composer to talk while the keyboard is open or text is typed.
