    Features
    - Improved server performance by preparing prompt, channel, project, reference, and history request data in Go. Node.js now only verifies the data matches exactly before using it, instead of generating it from scratch.
    - Reduced unnecessary Node.js wake-ups for memory state in lazy mode.
    - Added a kill switch to disable the new request body generation behavior if needed.
