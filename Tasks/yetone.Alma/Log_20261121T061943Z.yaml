  Key: ReleaseNotes
  Value: |-
    Features
    - Desktop: Turn footers now show a file-change summary (+N −M). Click it to view the changed files (up to three at once) and open them in the editor.
    - Desktop: Added an Outputs and Subtasks side panel. It lists files created during the conversation, newest first, with previews and actions to attach, open, or reveal them, plus background subtask status.
    - iOS and Android: Finished agent turns now show a file-change summary (+N −M) in the footer. Tap it to see the changed files and their diffs.
    - Android: Turn footers now include work duration, time, and a copy action.
    Improvements
    - Desktop: The changed-files card no longer appears separately between a reply and its footer. File changes are now accessible from the turn footer.
    Bug Fixes
    - iOS: Fixed the changes sheet styling. It now opens from the turn footer, uses standard caption styling, shows diff text in the primary color, and rows fill the full width.
