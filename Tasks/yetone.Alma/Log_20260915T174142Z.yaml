  Key: ReleaseNotes
  Value: |-
    0.4.50
    Features
    - Added a hand-drawn icon for the injected-context tally in chat.
    Bug Fixes
    - Refined the new injected-context icon to fix a ragged last line and adjust the arrow proportions to match the app’s icon style.
    - Fixed the context tally icons to better represent imported context, capabilities, and blocks instead of a generic brain icon.
    - Aligned the context tally line and the memories, tools, and skills counts with the activity header for a cleaner layout.
    - Fixed the day divider in chat so it only appears when the day actually changes.
    - Moved the send time onto the hover toolbar and added a tooltip that shows the full date and time on hover.
