  Key: ReleaseNotes
  Value: |-
    0.4.645
    Features
    - If the agent asks a question in a thread you’ve left, you’ll now get a notification with the question. Clicking it opens the thread, and the notification clears once the question is answered.
    - If a call is waiting for approval in a thread you’ve left, you’ll now get a notification with Allow and Deny actions. The notification clears once the approval is decided anywhere.
    Bug Fixes
    - Calls waiting for approval no longer show as “Running.” They now clearly show “Needs your OK” or “Waiting for approval.”
