  Key: ReleaseNotes
  Value: |-
    0.4.1064
    Features
    - Go now builds and shares lifecycle and model-wire values (turnId, savedUserMessageId, workspace, reasoning, provider wire) with Node.
    - Go slug and section requests now include the x-session-id header, matching Node behavior.
    Bug Fixes
    - Go turn retries now keep the original saved user message ID.
    - The finish state now sends the completed system prompt only after the step request includes it.
    - Summary hint headers now include x-session-id.
    - Fixed a Go vet build-tag issue that unintentionally built the contract test package.
