  Key: ReleaseNotes
  Value: |-
    v0.4.480
    Features
    - Remote now opens your remembered host automatically in client-only mode.
    - Added hold-to-talk: hold to speak, slide to Cancel or Edit, and see those options while talking.
    - Added a new dictation engine that shows your words live and reads them back when you release.
    Bug Fixes
    - Dictation now releases the voice engine as soon as you stop speaking.
    - Fixed the bottom scroll fade to match the top and system edge effect.
    - Hold-to-talk now sends immediately on release, like WeChat, without an extra edit step.
    - Fixed the subagent pill so it responds on the first tap.
