Version: "2026.8"
Installer:
- InstallerUrl: https://downloads.valentin.de/pvsol/setup_pvsolpremium_2026_8.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    The following new features and changes are included:
    - New map providers for planning with map sections for Poland and the Czech Republic.
    - New map providers for planning for the German states of Baden-Württemberg, Hesse and Mecklenburg-Western Pomerania.
    - 3D:
      - The “Determine Relative Orientation” dialog for mounting systems with east/west orientation is now pre-filled with more appropriate values.
    The following bugs have been fixed:
    - When updating feed-in tariffs while loading a project, the validity (“Valid from”) of the rates was discarded.
    - Crash in the consumption dialog.
    - 3D:
      - In some cases, values from the “Determine Relative Orientation” dialog were not carried over to the “Edit Mounting System” dialog.
      - When exiting the “Determine Relative Orientation” dialog, angles for “Orientation Relative to Reference Edge” greater than 180° could occur.
      - When reassigning PV modules in the string configuration - for example, by changing the string direction - the string diagram was not updated.
    - MeteoSyn:
      - It was not possible to generate climate data for a new location from measurement data in the form of monthly values.
      - Solcast:
        - It was not possible to register new users.
        - It was not possible to use existing accounts if the user ID was no longer known (due to a move or similar).
      - URLs for NREL Meteosat have been updated (it is now NLR).
ReleaseTime: 2026-09-22
