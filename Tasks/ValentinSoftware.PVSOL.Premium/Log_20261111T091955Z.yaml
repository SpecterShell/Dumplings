Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    The following new features and changes are included:
    - 3D Planning:
      - Increased usable RAM.
      - The RAM indicator turns red only when it exceeds 1,500 MB.
      - The maximum allowed number of modules is now 15,000 for roof-mounted systems and 10,000 for ground-mounted systems.
      - Map Tool:
        - Rexplorer: The radius of the circle used to select 3D models can be adjusted. The maximum size remains 100 m.
        - Google Solar API: Coverage layer updated.
    - Economic Efficiency:
      - Tariffs with capacity prices can now be defined.
      - Importing of dynamic tariffs is now supported.
      - Follow-up investments can now be taken into account.
    - Energy Management for Battery Systems expanded:
      - Delayed battery charging can now be configured.
      - The battery can now be used for peak shaving.
      - When using dynamic tariffs, battery charging and discharging can be configured based on predefined electricity prices.
    - Consumers can now also be added to favorites and selected via a quick selection menu.
    - The annual total consumption of load profiles can now be edited with a single click. There is no longer any need to open the “Load Profiles” dialog.
    - Circuit Diagram:
      - Circuit symbols can now be added for DC intermediate coupled battery systems.
      - A surplus consumer can now be displayed with its power rating.
      - Improved circuit diagram generation for large-scale projects.
      - Revised arrangement of circuit symbols.
    - Databases:
      - New example products for battery systems and batteries (LiFePO).
      - In the "Databases" dialog, product types in the combo box are now sorted alphabetically.
      - When importing load profiles, the system now checks whether the maximum file size is exceeded.
      - The maximum file size for imported load profiles has been increased to 1024 MB.
      - The SolarEdge inverter WR SE20K-EU-APAC/AUS has been added.
    - MeteoSyn:
      - Improved correction of PVGIS datasets.
      - The detail dialog for climate datasets now includes information on data quality.
    - New example projects are now available.
    - The notification regarding the 60% power limitation in Germany is now also displayed when total power-clipping is defined.
    - In the diagram editor, the four-data-series limit when using minute-based values has been removed.
    - Improved button highlighting behavior when navigating dialogs using the keyboard.
    - Page navigation has been revised.
    The following bugs have been fixed:
    - The settings "Calculate yield losses due to shading" and "Record characteristic curves for modules" were not saved in the project file (*.pvprj).
    - In the configuration check on the inverter page, incorrect symbols were sometimes displayed at the top level.
    - Occasional issues when clicking a page navigation button.
    - Database dialog:
      - In some languages, sorting by "Favorites" and "Suitable/Not Suitable" did not work correctly.
      - The existing sorting order was not retained when switching companies.
    - Circuit Diagram/Cables:
      - Crash on the cabling page when a DC-coupled battery system was selected after 3D planning with multiple inverters, followed by an autosave, and then another element was selected in the tree view.
      - For different power optimizers, the number (2) was displayed twice in the diagram.
      - When loading the “Cable” page in "Detailed" mode, "xxx cable losses" was initially displayed.
    - Crash when displaying tooltips in the configuration dialog of the 3D planning if the dialog had already been closed.
    - Occasional crashes during the simulation of very large 3D projects with only a few but large module areas, many inverters with identical configurations, and low levels of shading.
    - The "Edit Loan" dialog could not be canceled.
    - The coordinates of the SAP climate data record for "North East England" have been corrected.
ReleaseTime: 2026-11-11
