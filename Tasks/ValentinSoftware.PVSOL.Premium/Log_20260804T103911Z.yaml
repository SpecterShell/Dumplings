Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    The following bugs have been fixed:
    - A message is displayed if a surplus consumption has been defined but only one from-grid tariff has been selected.
    - An example project with Rexplorer API planning has been added.
    - The “Report a Problem with the Rexplorer Model” dialog has been revised.
    - The state (open, collapsed) of the group boxes in the 3D map tool is now saved.
    - If the program fails to start, the system now checks whether there are any special characters in the installation path.
    The following bugs have been fixed:
    - Crash after deleting a load profile from measured values whose name had just been changed.
    - Crash in the tree view of the load profile dialog.
    - The number of cables in the circuit diagram was sometimes displayed incorrectly.
    - Options dialog: The checkbox for NEC temperature calculation was not visible.
    - Crash when displaying plans if they were transferred twice from 3D.
    - 3D:
      - An attic could not be defined for 3D models.
      - When using Rexplorer API, a reference edge could not be selected when defining a mounting system.
      - When the default edge was selected, the correct orientation was not shown on the info button.
      - Error messages related to the Rexplorer API have been revised.
ReleaseTime: 2026-08-04
