  Key: ReleaseNotes
  Value: |-
    The following new features and changes are included:
    - The loading of the inverter page has been speeded up.
    - The Meteosyn detailed view has been improved.
    The following bugs have been fixed:
    - Partial crash when selecting inverters if parallel operation had been set for the preselected inverter and another inverter was then selected.
    - In some cases, the costs of solar power have been calculated incorrectly when using capacity tariffs and taking module degradation into account.
    - Partial crash in the simulation involving electric vehicles and dynamic tariffs when no dynamic tariff had been selected.
    - Crash if, in the energy management dialogue, the minimum SOC of the battery system was below the default value for grid-friendly charging.
    - The ‘Import’ button in the tariff list view for feed-in and net metering tariffs has been disabled.
    - Crash when loading projects with old net metering tariffs.
    - Crash when selecting battery systems with the ‘Unknown’ coupling type.
ReleaseTime: 2026-11-18
