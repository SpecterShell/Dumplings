  Key: ReleaseNotes
  Value: |-
    🦖 Deprecations
    - Remove feature_dynamic_room_predecessors (#35759). Contributed by @Half-Shot.
    ✨ Features
    - [Backport staging] Update banner module to v2.2.0 in Dockerfile (#35924). Contributed by @RiotRobot.
    - Take document previews out of labs (#35869). Contributed by @ZacksBot.
    - Disable release announcement for restricted guest user (#35566). Contributed by @florianduros.
    - Add keyboard navigation to the new timeline(labs) (#35545). Contributed by @langleyd.
    - Hook up new timeline(labs) to RoomView's timeline shortcuts (#35544). Contributed by @langleyd.
    - New timeline(labs) add jump to event and queuing (#35543). Contributed by @langleyd.
    - Add homeserver URL to profile module API (#35786). Contributed by @dbkr.
    - Element Desktop sign .dll & .node files (#35776). Contributed by @t3chguy.
    - Add module apis for watching for deviceId (#35741). Contributed by @Half-Shot.
    - Add isEncrypted watchable to module room object (#35717). Contributed by @dbkr.
    - Add module api to wait for the client to be started (#35712). Contributed by @dbkr.
    - Expose document viewer as a module API (#35440). Contributed by @Half-Shot.
    - Room list: add EC preview on room tile (#35670). Contributed by @florianduros.
    - Add module API for extending the credits section with additional credits (#35683). Contributed by @Half-Shot.
    - Check the recovery key without leaving the logout dialog (#35404). Contributed by @kaylendog.
    - Add support for m.livekit (#35602). Contributed by @Johennes.
    🐛 Bug Fixes
    - Fix whitespace-only names being accepted when creating a room or space (#35883). Contributed by @ciefa.
    - Fix the Add button being taller than Cancel in the add subspace dialog (#35853). Contributed by @VityaSchel.
    - Fix custom theme Compound overrides being ignored when the theme has font faces (#35888). Contributed by @lazerg.
    - Center the avatars of collapsed event summaries on their text (#35834). Contributed by @VityaSchel.
    - Display name of a room from when previewed (#35867). Contributed by @florianduros.
    - Fix room list notification menu not updating after changing the notification setting (#35866). Contributed by @ciefa.
    - Disregard the bits property of keyInfo.passphrase (#35870). Contributed by @andybalaam.
    - Improve message retention(labs) (#35820). Contributed by @langleyd.
    - Space the language and timezone settings like other form fields (#35852). Contributed by @VityaSchel.
    - Fix status emoji being hidden by long display names in the member list (#35841). Contributed by @mxandreas.
    - Fix untranslated "Unable to decrypt" text in room list message previews (#35819). Contributed by @ciefa.
    - Fix inconsistent knocked room in the room list (#35791). Contributed by @florianduros.
    - Hide discovery settings when UIFeature.identityServer is disabled (#35775). Contributed by @langleyd.
    - Allow exporting keys when key storage is out of sync or the device is unverified (#35707). Contributed by @kaylendog.
    - Fix not being able to rejoin an Element Call after reloading (#35723). Contributed by @Half-Shot.
    - Avoid showing room encryption badge while encryption state is loading (#35708). Contributed by @kaylendog.
    - Show the URL preview's thumbnail in the timeline, not the original image (#35624). Contributed by @n3tman.
    - Fix missing icon in new room intro (#35695). Contributed by @florianduros.
    - Fix New room offered when lacking space permissions (#35692). Contributed by @t3chguy.
    - Fix Sign in with QR out of band confirmation logic (#35251). Contributed by @hughns.
