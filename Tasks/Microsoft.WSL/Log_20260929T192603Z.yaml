  Key: ReleaseNotes
  Value: |-
    WSLc is generally available.
    Linux containers are central to modern development, from cloud-native applications to AI workloads. We're making those workflows simpler and easier to access on Windows with WSL containers, which is generally available today. Read more about the feature below.
    Official announcement: https://blogs.windows.com/windowsdeveloper/2026/09/29/wsl-containers-now-generally-available/
    Architecture deep dive: https://devblogs.microsoft.com/commandline/wslc-architecture-deep-dive/
    What's Changed
    - Simplify event reader cleanup by @beena352 in https://github.com/microsoft/WSL/pull/41667
    - Fix config's handling of non-ascii characters by @chemwolf6922 in https://github.com/microsoft/WSL/pull/41657
    - Prevent potential invalid access for string array pretty print by @chemwolf6922 in https://github.com/microsoft/WSL/pull/41673
    - Follow up to PR #41512 by @chemwolf6922 in https://github.com/microsoft/WSL/pull/41642
    - Use a static CRT in debug builds by @OneBlue in https://github.com/microsoft/WSL/pull/41684
    - Increase the VM termination timeout to 30 seconds by @OneBlue in https://github.com/microsoft/WSL/pull/41688
    - Impersonate the caller before making various filesystem operations by @OneBlue in https://github.com/microsoft/WSL/pull/41689
    - Support STDIN through SDK by @JohnMcPMS in https://github.com/microsoft/WSL/pull/41698
    - Followup to STDIN PR by @JohnMcPMS in https://github.com/microsoft/WSL/pull/41703
    - Remove references to WSLC being in preview by @OneBlue in https://github.com/microsoft/WSL/pull/41704
    Full Changelog: https://github.com/microsoft/WSL/compare/2.9.13...3.0.1
