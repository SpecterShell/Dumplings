  Value: |-
    v0.2.0
    v0.1.1 之后最大的一个功能更新：拆书引擎整条线上线——把读过的小说、剧本、字幕导入 Closure，拆解成可复用的写作知识。同时对话框支持上传文件和图片了。
    新增
    - 对话框可传文件与图片：对话框新增「上传文件…」——文档（txt / docx / pdf 等）自动解析后作为参考资料进入对话；图片交给具备视觉能力的模型识别，识图进度实时可见。
    - 材料库：侧边栏新增「材料」页。批量导入外部作品——txt / docx / pdf / epub 以及 srt / ass / vtt 字幕等常见格式，自动识别章节结构并建立全文索引。每份材料带质量标记与出处信息，支持导入历史与批量管理。
    - 拆书：侧边栏新增「拆书」页。选一本导入的小说，按档位与维度跑拆解管线：提取事实设定（世界观 / 人物 / 势力等），生成读法、章评与细批，分析风格特征；关键节点停下来等你人工把关。风格分析可导出为风格卡，之后写章直接参考。
    - 经验蒸馏：材料中的写作经验可切条提炼，经人工审核沉淀为「手艺」页的手艺卡，与内置知识库一样可被写手、导演、审核查证引用。
