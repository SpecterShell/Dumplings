  Key: ReleaseNotes
  Value: |-
    Rider 2026.2.1 What's New
    Rider 2026.2.1 is now available.
    Here are some notable features included in this update:
    - The bundled refactoring-code skill.
    - The bundled debugging-code skill.
    - The bundled dottrace-analyze skill can now analyze snapshots captured while profiling Unity projects.
    - Rider's quality-check hooks now support Codex.
    - Updated recommended Unreal Engine C++ skills, including ue-code-authoring and ue-test-authoring; reinstall them from Settings | Tools | AI Assistant | Skills to get the latest versions.
    For the full list of updates included in this release, see the release blog post.
