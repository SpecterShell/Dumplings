  Value: |-
    Rider 2026.2.0.1 Release Notes
    Rider 2026.2.0.1 is out with the following fixes:
    Fixes for Unreal Engine development
    This build resolves RiderLink compile failures and Gameplay Tag usage tracking issues affecting UE projects. Key issues resolved:
    - [RIDER-141265] RiderLink can now be installed and compiled again for projects targeting Unreal Engine 5.5 and earlier, resolving a compile failure caused by a recent engine API change.
    - [RIDER-141227] Gameplay Tags declared with UE_DECLARE_GAMEPLAY_TAG_EXTERN and UE_DEFINE_GAMEPLAY_TAG_COMMENT now correctly report their Blueprint usage count in Code Vision instead of showing 0 usages.
    - [RIDER-141223] The Code Vision usage counter for Gameplay Tags no longer drops to 0 or stops reporting usages after the tag is referenced in more places in Blueprints.
    For the complete list of issues resolved, please see our release notes.
