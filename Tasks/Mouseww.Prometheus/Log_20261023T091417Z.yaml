  Key: ReleaseNotes
  Value: |-
    Prometheus v0.8.0
    新增子代理配置插件与「子代理增强」模式，并重新整理设置页与插件顺序。
    变化
    - 新增「设置 → 子代理」：配置内置与自定义子代理的说明、提示词模式、提示词、模型、思考强度、工具与上下文限制，定义与 PI 终端（pi-subagents）共用。
    - 新增「子代理增强」模式：主代理优先把任务委派给子代理，并行处理独立任务，汇报前先验证。
    - 隐私面罩从侧边栏移到设置页；设置标签页按用途分组，插件停用后对应标签页不再显示。
    - 调整内置插件加载顺序（模式插件保持最后，以便改写完整系统提示词）。
