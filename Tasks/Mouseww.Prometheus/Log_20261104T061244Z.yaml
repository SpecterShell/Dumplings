  Key: ReleaseNotes
  Value: |-
    新增
    - 内置 12 个办公与生产力技能，开箱即用，不需要另外安装：
      - 办公：office-pptx 做 PPT、office-docx 写文档、office-xlsx 做表格、diagram-chart 画图表与示意图、work-report 工作汇报、meeting-minutes 会议纪要、email-writing 写邮件
      - 创作：novel-writing 写小说、make-video 做视频、make-poster 做海报封面
      - 工具：web-research 上网查资料、pc-maintenance 电脑维护
    - 个人空间主页新增「普罗能做什么」：按办公 / 创作 / 工具分组展示这些能力，每张卡带一句示例请求，点一下就把这句话填进助理的输入框（可以直接改，不会替你直接发出）
    - 助理知道这些能力，说「做个 PPT」「写份周报」时会直接动手，不再回答「我做不到」
    说明
    - 技能正文按需读取，平时不占上下文；技能页里能看到每个内置技能的人话名称，也可以随时停用（停用后主页卡片一并消失）
    - PPT / 文档 / 表格类技能生成的是真正可编辑的 .pptx / .docx / .xlsx，首次使用若缺 Python 库，会按提示安装运行时后再继续
    - 模型能读图但不能生成图片：海报封面类需求会先用排版或给出可直接使用的生图提示词，这一点在技能里写明了
