  Key: ReleaseNotes
  Value: |-
    新功能
    - 启动动画：打开软件时播放“点火”开屏动画（火星 → 描出火焰 → 点燃 → 字样浮现），跟随当前皮肤与亮/暗主题；本地服务启动较慢时会一直覆盖到界面就绪，不再出现白屏或空白窗口。
    - 新会话页：火焰光晕、按时间问候，以及“梳理项目 / 排查问题 / 代码审查 / 写个脚本”快捷卡片，点击即填入输入框。
    - 设置 → 外观：新增“界面动效”和“启动动画”开关（系统开启“减少动画”时也会自动精简）。
    改进
    - 桌面端窗口在页面可绘制后才显示，消除 WebView 初始化时的白屏。
    - 切换主题 / 皮肤时，新外观从点击位置圆形扩散。
    - 弹窗与侧边栏加入过渡动画；AI 回复浮入，生成中的光标换成跳动的小火苗；运行中的工具卡片有扫光，完成图标轻弹。
    - 标题栏火焰在 Agent 工作时更亮，每轮结束时闪一下；成功提示带火花效果。
    - Logo 火焰颜色跟随皮肤；面板与主按钮增加高光和光晕质感。
