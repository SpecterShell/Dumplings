  Key: ReleaseNotes
  Value: |-
    Prometheus v0.10.8
    修复 Android 本机模式下 SSH 不可用的问题。
    变化
    - Android：在 PRoot 的 Ubuntu 里用 apt 安装的命令（如 ssh、scp）现在可直接从宿主调用；apt/dpkg 执行完会自动刷新，宿主已有的命令不受影响。
    - Android：SSH 密码认证的 askpass 变量和目录会传入 PRoot。
    - SSH 找不到客户端时，Android 上给出具体的安装指引。
