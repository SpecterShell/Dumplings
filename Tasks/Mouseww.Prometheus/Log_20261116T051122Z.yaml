  Value: |-
    改进
    - 独立工作树：合并被拦时不再只给一个灰按钮。原因和处理办法直接显示在面板上，一键解决：
      - 项目文件夹里有同名未提交文件：可选「用本对话的版本合并」（项目里的旧版本会自动备份，合并后可一键恢复）或「保留项目里的版本，只合并其余文件」
      - 项目文件夹不在基础分支：「切回基础分支并合并」
      - 同步有冲突：「让 AI 解决冲突」，由当前对话处理后再合并
    - 重复的提示合并为一条
    修复
    - 文件预览里的 HTML 在桌面版丢失样式的问题
