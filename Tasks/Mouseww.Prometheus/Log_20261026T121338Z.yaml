  Key: ReleaseNotes
  Value: |-
    Prometheus v0.10.9
    工具商店、手机端菜单与 SSH 修复。
    变化
    - 运行环境页新增「工具商店」：约 80 个语言、编译器和命令行工具，支持搜索和分类，一键安装 / 卸载。Android 装进 PRoot Ubuntu（并可搜索整个软件源），Windows 用 winget，macOS 用 Homebrew，Debian/Ubuntu 桌面用 apt（pkexec 授权）。
    - Android：SSH 连接时若缺少 ssh / scp，自动在 PRoot 里安装 openssh-client 并重试。
    - Android：修复对话列表「…」菜单被遮挡（改为浮层，靠近底部自动向上翻）。
    - Android：PRoot 内 ssh 连接局域网设备：DNS 优先使用 Wi-Fi 网关，ssh 加 IPQoS=none 并在主机名时只用 IPv4。
