  Key: ReleaseNotes
  Value: |-
    更新内容
    1. 新增隐私屏功能，被控端支持隐藏本地画面。
    2. 增强 P2P 穿透能力，提升网络适应性，优化复杂网络下音视频传输效果。
    3. Windows 端默认屏幕采集方式修改为 DXGI。
    4. 修复物理鼠标不可见、位置异常和拖动窗口时出现重复光标的问题；修复 macOS 窗口缩放光标识别映射的问题。
    5. 修复 Windows、macOS 与 Linux 系统音频采集可能卡住的问题。
    6. 修复 Linux X11 远程键盘输入异常，改进全平台鼠标操作和光标状态传输的可靠性。
    7. 优化网络状态卡片布局与显示效果。
    8. 修复部分平台任务栏图标显示异常的问题。
