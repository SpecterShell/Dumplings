  Key: ReleaseNotes
  Value: |-
    更新内容
    1. 新增帧率优先、画质优先和平衡三种画面偏好，优化带宽变化时的分辨率、帧率与码率调节，提升远程桌面的清晰度和流畅度。
    2. 优化 Windows 与 macOS 原生视频采集、硬件编码和渲染流程，Linux 新增 CUDA/OpenGL 视频渲染，提升硬件解码画面的显示效率。
    3. 优化 P2P 连接建立与 UPnP 支持，支持连接从中继升级为 P2P，改进 ICE 连接，提升弱网和网络变化时的连接稳定性。
    4. 修复 Windows 锁屏界面无法远程控制，以及部分设备因 OpenGL 初始化失败导致启动崩溃的问题，优化锁屏画面采集与恢复。
    5. 新增原生 iOS/iPadOS 客户端，支持远程画面与音频、触控鼠标和键盘输入、多显示器切换、双向文件传输及接收远端文本剪贴板。
    PC 客户端版本为 v1.5.0，iOS/iPadOS 客户端暂未上架 App Store，目前仅支持作为控制端连接远端电脑。
