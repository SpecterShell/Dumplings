    Linux packages
    Choose one package for your architecture; both contain the complete CrossDesk application:
    - Standard (recommended): crossdesk-linux-ARCH-VERSION.deb, for existing desktops.
    - Virtual desktop: crossdesk-virtual-desktop-xfce-linux-ARCH-VERSION.deb, which additionally installs Xfce, Xvfb and D-Bus session tools through APT.
      The packages replace each other and preserve user settings. Installation does not switch your default desktop or start a virtual session.
