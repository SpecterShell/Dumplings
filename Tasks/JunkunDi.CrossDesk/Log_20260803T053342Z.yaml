  Key: ReleaseNotes
  Value: |-
    更新内容
    1. 修复 Web 客户端连接 Windows 被控端时没有声音的问题。
    2. 修复 Linux X11 环境下远程键盘输入失效及部分按键无法正确映射的问题。
    3. 优化 Linux 音频驱动自动选择，提升不同桌面环境下的音频兼容性。
    4. 优化 Linux X11 与 Wayland 窗口标题栏适配，避免窗口行为异常。
    5. 优化本机设备 ID 显示，较长 ID 可自动缩放以避免截断。
    6. Linux 发布包改用 Ubuntu 20.04 兼容基线，并完善 GCC 10、CMake、PipeWire 及 GLIBC 校验，提升旧版发行版兼容性。
    7. 完善 Slint 等第三方依赖与 Windows 资源编译配置，提升跨平台构建稳定性。
