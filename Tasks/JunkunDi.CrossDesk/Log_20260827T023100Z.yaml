  Key: ReleaseNotes
  Value: |-
    更新内容
    1. 全面优化远程桌面画面渲染，macOS 新增原生 Metal 渲染，Windows 与 Linux 新增 OpenGL NV12 渲染，并解除 30 帧限制，提升高帧率流畅度。
    2. 优化网络拥塞控制、码率调节与视频自适应策略，优先保障远程桌面帧率，提升带宽变化及弱网环境下的连接稳定性。
    3. 支持远端鼠标光标形状同步，完善 Windows、macOS 及 Linux X11/Wayland 环境下的光标显示。
    4. 优化 Linux 系统托盘与主窗口行为，提升不同桌面环境下的兼容性；修复弹出菜单区域的鼠标操作仍会传递到被控端的问题。
    5. 修复 NVIDIA NVENC/NVDEC 重配及退出崩溃、VideoToolbox 分辨率适配和 NV12 缩放绿屏等硬件编解码问题。
    6. 修复密码修改异常恢复、切换服务器后的状态同步，以及 WebSocket 与 ICE 退出重连问题，提升连接和退出稳定性。
    7. 支持服务器下发 TURN 凭据并上报客户端版本与平台，优化显示器变化后的画面流稳定性。
    8. 完善 Windows 版本信息与 SignPath 签名流程，更新使用文档和隐私政策，并提升跨平台构建兼容性。
