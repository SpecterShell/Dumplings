- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    [Enhancements]
    - Added support for signing in to your NAS using your QNAP Account (formerly QNAP ID), offering a simpler and more secure way to connect.
    - Upgraded OpenSSL and other underlying components to further strengthen application security.
    [Fixed Issues]
    - Improved synchronization and backup task reliability in certain scenarios, including large-scale file synchronization, backup task setup, and selective sync folder selection.
    - Improved the display of cloud file notifications and error messages for a clearer, more consistent experience.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    [改善项目]
    - 支持使用 QNAP account (旧称 QNAP ID) 登录 NAS，提供更简单且安全的连接方式。
    - 升级 OpenSSL 及其他内核组件，进一步强化应用程序安全性。
    [修复问题]
    - 优化特定情境下的同步与备份任务稳定性，涵盖大量文件同步、备份任务设置与选择性同步文件夹勾选等情境。
    - 优化云端文件通知与错误消息的显示方式，提供更清楚一致的使用体验。
