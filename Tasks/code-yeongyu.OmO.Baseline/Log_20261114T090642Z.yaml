  Key: ReleaseNotes
  Value: |-
    Plain omo login signs a computer in from the terminal while OmO accounts are closed. A computer with no OmO desktop app — a server over SSH, a fresh Linux box — runs omo login, gets a device code to approve on another device, and stores the credential in the OS credential store; the attach-before-mint refusal (#13096) answers a computer that already has its device before anything is asked of the service. The success line names the signed-in account (Signed in to OmO as <email>.), and omo whoami names it too; a failed account read still says how to see it. omo logout and omo whoami run while closed, so no message names a command that refuses. login --help describes the route (the command stays hidden from omo --help), every other closed login form refuses with a message that names the route, the closed hints name both routes, and the compiled entry classifies bare login, logout and whoami as one-shot launches with the same shared parse the command uses (login -- included). The damaged-item message names the terminal route too instead of a desktop-app-only dead end. Tests run the flow through the npm launcher (against a service-auth bundle built from this source into a temp copy of the launcher tree), the compiled entry and the toolkit CLI, with an isolated HOME and runtime dir, no inherited session bus, an injected store, and a refusal-text assertion on every zero-mint case. (#13281) (#13328)
    The computer-use conformance preflight tests pass on Windows. The missing-driver message now prints its repo-relative path with forward slashes on every OS, so a run reads the same on every host, and the stdio-probe test builds its stand-in engine as a real executable for the host instead of a POSIX shell script. QA tooling only; no runtime behaviour changes. (#13295, part of #13221)
    Computer use gets a declared-outcome conformance catalog for its QA. script/qa/computer/conformance/ adds a typed catalog in which every action, toolkit and mode cell on each OS declares that it delivers or refuses with an exact engine code, a report that fails a missing, duplicate, skipped or mis-coded cell or one that disturbed the person's session, an environment preflight that ends a broken host's run as ENVIRONMENT_ERROR, and twelve model-free reference tasks. QA tooling only; no runtime behaviour changes. (#13241, part of #13221)
    The desktop session's actionability wait test no longer fails on a busy host. The battery's wait now runs on an injectable clock: the host's monotonic time in a session, as before, and the fake backend's own clock in the test. So the_battery_waits_for_an_element_that_appears_enabled_after_500_ms checks the 500 ms wait in fake time instead of wall-clock bounds that host load could break. Runtime behaviour does not change. (#13180, fixes #13178)
    A fuzzy handoff no longer fails on an account with many ended sessions, and never goes to a different session than an exact name would. A fuzzy handoff first tries the thread's exact id, alias or name across every session, ended ones on other devices included, so a name that exactly matches one session always reaches that session. Otherwise local, live and ended sessions are compared together and the clearly best match wins wherever it lives; two equally good matches ask you to pick. Ended sessions that cannot match no longer count against the 500-candidate fuzzy cap, so a large history no longer blocks a unique match. (#13141, follows #13066)
    A thread whose alias claim asks for a sign-in after it was created is still named by the alias. When the account token expires between thread_create checking an alias and claiming it, the thread it already created is now named by the alias on its device and the call answers ok with alias_scope: "local", instead of an error. thread_rename does the same when the account is gone by the claim. An alias used as a local name is now trimmed on every path. (#13179, follows #13112) (#13141)
    omo login no longer registers a second device for a computer that already has one. Before any code, browser tab or new key, it checks the stored sign-in and the device the computer's OmO device service holds (parked included). A held, uncertain, locked or unreadable state refuses a new device and keeps the existing one, instead of adding an "omo CLI on " row beside the desktop's. When the service advertises machine identity, both sign-in flows send a hashed hardware id (SHA256("omo-machine-v1" + id); the raw id never leaves the computer), and a machine_exists refusal ends the sign-in without removing or taking over any device. (#13096) (#13141)
    A thread alias no longer blocks thread creation when no account is signed in. thread_create with an alias now creates the thread when the alias registry cannot get an account token. A desktop launch is always in that state. The alias becomes the thread's local name unless a name is given, and the result says the alias is local only (alias_scope: "local"). thread_rename with an alias does the same. Every other alias error is unchanged. (#13112, fixes #13104)
    Fixed: file reads through the bundled bunshin SDK over the relay work again (readText, readBytes and read no longer reject with "truncated must be a boolean for byte results"), an op sent with a minted capability token is no longer refused as malformed, and an unsupported clientName now fails at once with invalid_client_name naming the supported role. (#13108)
    The machine-binding module no longer exports an unused helper. deviceProfileOf from #13095 is now module-private, so the knip dead-code check on dev is green again. No behavior change. (#13097)
    One computer is one OmO device: omo login binds to the machine's device service instead of registering its own. A sign-in now advertises machine binding. When the service asks for the machine hash, omo asks this machine's device service (device.machine_binding) for it, and computes the same hash itself when no device service runs. The sign-in presents the device keys this machine already holds, so the service keeps the machine's existing device instead of adding a row. If the device service holds a device whose keys omo does not have (the desktop app's sign-in), omo refuses and points to the desktop app instead of minting a second device. The raw OS machine id never leaves the computer. A computer with no readable machine id signs in exactly as before. (#13095)
    The programming skill opens with code ownership. Its first paragraph tells the model it owns the code: fit new behavior into the existing structure, leave no duplicate or dead code, and fix a defect in the code being changed at its root cause instead of excusing it as pre-existing or someone else's. It replaces the "lazy senior engineer" persona line. (#13091)
    A monitor no longer loses a batch that arrives while the previous one is being sent. flushMonitor deleted the monitor's pending entry after awaiting a dispatch, so a batch queued during that await vanished without counting as dropped. The flush now deletes the entry only when it is still the one it drained. (#13089)
    A foreground task waits for its child instead of failing at once. Every task with run_in_background: false ended with Session error about a second in and aborted the child, because opencode reports a running assistant turn with error: null and the poller treated the key itself as a failure. Only an error that is set ends the child now. (#13076)
    The beta channel no longer falls behind the stable release. Every stable release now also moves omo-ai@beta on npm and the beta installer channel on get.omo.dev to that release, unless beta already holds a newer prerelease, so bun add -g omo-ai@beta and install.sh beta never install something older than latest. The beta move and its beta >= latest guard now also run when a release is re-run after it was already published, and after the move beta is re-read: a beta someone moved further forward is left alone, while a beta still older than latest or the newest prerelease fails the run with the exact npm dist-tag add omo-ai@<version> beta repair command. (#12987, #13148, #13149, #12990)
    - Computer use: the omo computer tool now runs through the desktop SDK; omo sessions open with an explicit report mode (sandbox default unchanged). (#12840)
    Fixed
    - The hashline test project's lockfile now resolves zod 4.6.7, matching the ^4.6.6 its manifest asks for since #13151, so that project no longer installs the zod 4.6.5 affected by GHSA-mrhx-c7xc-m3w5. (#13282, follows #13151) (#13328)
    - omo remote bootstrap can install the device service on macOS again. The release check required a macOS signing identity that was still an empty placeholder, so every download was refused as "failed verification"; it now requires the published identity of the notarized release binaries. (#13237, fixes #13229) (#13328)
    - The browser skill now uses omowright 0.3.1, which brings the fixes merged since 0.3.0: page navigation owns its readiness and keeps committed state, live regions survive snapshots, cleanup failures are reported instead of swallowed, aria-hidden is matched case-insensitively, and BrowserSkill's "more than one browser is online" error lists every browser and the browser option to pass. (#13113) (#13328)
    - omo remote send in wait mode stayed silent for as long as its message waited behind a running turn. A queued send now reports its fate at once on stderr (Queued on <device>/<session> at position N.) while stdout keeps only the streamed answer. (#13273)
    - Computer use v3: the write-scope guard now counts packages/omo-computer-protocol/src/engine-schema.generated.ts, the file the protocol generator actually writes, as a generated output. A row that changes the engine schema and regenerates the protocol module is no longer reported as writing outside its scope. Repository tooling only; nothing user-visible changes. (#13249)
    - thread_create with no cwd now opens the new thread in the calling session's folder instead of the folder the engine process runs in. A thread created from a desktop thread with no project used to land in the home folder, where its link could not be opened and a follow-up thread_send needed all_scope. An explicit cwd still wins, and a thread created on another device keeps that device's own default. (#13125) (#13141)
    - From senpi 2026.11.10-3: the footer names the account actually serving the session when the pinned account is blocked, pinned Ultrafast variants no longer warn that Ultrafast is undocumented, provider error text is value-redacted in the model configuration error event, the assistant message and the transcript, every fallback-log field goes through redaction, and after a mid-session model switch the context usage no longer shows the previous model's token count against the new model's window. (#13109) (#13141)
    - From senpi 2026.11.11 and 2026.11.12: startup no longer fails when the agent's extensions directory is read-only (a sandboxed review child), Claude connection tests keep the redacted provider error and HTTP status and bind each result to the credential they tested, show_html_page called from an eval cell is refused instead of silently reaching no reader, and task hosts started from the compiled binary no longer exit with EBADF seconds after spawn. (#13109) (#13141)
    - computer-v3-guards --residue now reports a dangling symlink left at a class A or class B removal path. It used to count the broken link as absent and exit 0. (#13099, fixes #13065)
    - Standalone omo update now installs the release instead of printing a curl command (#13084). It downloads the matching platform asset from get.omo.dev with GitHub fallback, verifies published SHA256SUMS and the existing macOS signature, stages beside the installed executable, and keeps a rollback copy until the installed --version succeeds. Failures report a typed error; an unwritable directory is refused without partial files. Windows rollback files still held by a running process are cleaned on a later launch. --dry-run and --print remain print-only. (#13087)
    - Interrupted standalone updates recover dead or expired install locks without removing a successor's lock. Cleanup failures still release the lease, and symlink launchers update their targets while preserving the links. (#13087)
    - Count prompt-cache writes when deciding whether to compact and when reporting used and remaining context, so cold-cache turns do not leave tool-output truncation with an inflated context budget. Context-used reporting continues to include generated output tokens. (#13083)
    - Thread names on other devices now resolve when their sessions are resumable, and fuzzy handoff searches the account's remote candidates as well as local candidates. (#13066)
    - Failed lookups through a configured relay return their typed error (host_unavailable with the device-service state: offline, connecting, keychain locked, authorization stale, degraded or update required); a relay that is not set up (not configured, disabled, signed out, sign-in required) preserves local address resolution. Renaming a remote thread checks names on its own device before changing its name or alias. (#13066)
    - ast-grep skill: the smoke tests (tests/smoke.sh, tests/smoke.ps1) pass the search path before --lang, the order the skill's own recipes require, and the recipes now say which Python versions reject the other order (3.9 and 3.12 reject it; 3.13+ accept both) instead of naming only 3.9. (#12714, thanks @cynkai)
    Changed
    - omo login --new-device is gone. The OmO service keeps one device per computer, so registering another device over an unreadable stored sign-in either failed after approval or left two live devices. When the stored sign-in cannot be read, omo login gives one recovery: remove this computer's device on the Devices page if it is still listed, then run omo account forget (which also has the device service forget the device), then sign in again. When the device service holds the device, it also names that device and says these steps sign out the device service, and the OmO desktop app if it is installed, on this computer. (#13276) (#13328)
    - When the credential store is locked, omo login says to unlock it and try again. (#13276) (#13328)
    - When the device service is installed but does not answer, omo login names the service's leftover endpoint file and says that opening the OmO desktop app starts the service. (#13276) (#13328)
    - omo login's refusals no longer suggest omo logout, which does not work while OmO accounts are closed. A sign-in with an unknown refresh outcome first points to sharing the sign-in from the OmO desktop app when a device service holds this computer's device, and gives the start-over steps only as the fallback, with what they also end. When no device service holds the device, it gives the start-over steps directly. (#13276) (#13328)
    - The standalone omo binary stages every package its eval extension needs that the engine does not provide, so the eval tool loads in the binary on senpi 2026.11.13 and later (#13358). (#13358) (#13328)
    - The EQ.omo linux-x64 goldens are re-recorded at senpi 2026.11.13 (follow-up to #13328) (#13341). (#13341) (#13328)
    - One protocol doc and one web test fixture describe the private desktop app instead of naming its repository. No behaviour changes. (#13326)
    - Contributors: knip's configuration now lives with the code it describes. The root knip.ts composes knip.base.jsonc (global settings) with one knip.workspace.jsonc per directory (a workspace's config, the root entries under that directory and its pre-existing export rows), so two PRs for two packages no longer conflict on one shared knip.jsonc. The composed configuration is identical to the old file, and knip reports the same results. Add or change knip config in your own directory's knip.workspace.jsonc. (#13204, fixes #13200)
    - OmO now runs on senpi 2026.11.13 (from 2026.11.10-2). Senpi's own zod pin moves to 4.6.7, which fixes GHSA-mrhx-c7xc-m3w5 for that copy. The Security entry of this release names the one zod copy below 4.6.6 that still ships. (#13109) (#13141)
    - From senpi 2026.11.10-3 (#6342, with a follow-up in 2026.11.11): a session follows the permission setting of the machine it runs on whatever the origin of the work. Work sent from another device of the same account, which the relay states as such, no longer asks for approval, and one remote command no longer makes every later automatic turn on that session ask. Devices of another account still ask. (#13109) (#13141)
    - From senpi 2026.11.11 and 2026.11.12: a goal that is waiting out a usage limit no longer spends its continuation budget, a status-only 429 counts as a limit wait, and a goal whose subscription accounts are all limited keeps waiting for the reset, re-checks a limit that named no reset, and resumes on its own after its session restarts or a config reload. An account blocked for a usage limit serves again once its named reset has passed, without a re-login. (#13109) (#13141)
    - From senpi 2026.11.11: a rate-limited Opus 5.5 turn falls back to Fable 5.2 first, then Opus 5. (#13109) (#13141)
    - JS/TS source is formatted with bun fmt (print width 120, no semicolons), and bun run lint fails on unformatted code. The reformat commit and the dev merges that reformat incoming files are listed in .git-blame-ignore-revs. (#12227, fixes #12225)
    Added
    - A Windows live tier for computer use measures, on the hosted Windows runner, whether it can carry five live legs (an elevated target, a locked and a disconnected session, a mixed-DPI second monitor, the elevation prompt's secure desktop) and records the answers in crates/omo-computer-backend-win32/probes/hosted-windows-live.tsv. The elevated and mixed-DPI legs run there; the other three are recorded for an owned Windows guest. (#13233, part of #13221)
    - The senpi contextFiles.globalPath setting loads the global context file from an explicit file or directory (for example ~/.agents/AGENTS.md). It is read from global settings only, and an unset value keeps the current behavior. (#13109) (#13141)
    - Computer use v3: the engine's result and error contract lands in omo-computer-core: Disposition with exactly the seven valid (delivery, retry) pairs, ActionReport with receipts decided by verb (a value verb is confirmed only on a read-back equal to what it requested, a pointer or key verb only on an OS-level consumption receipt), wire validation that refuses an overclaiming report, and the one COMPUTER_* table keyed by (engineCode, data.reason), total over the closed engine codes and every reason the design emits, checked against a cited inventory of the design. Backend refusals and exec replies now resolve through it. Nothing user-visible changes yet; the existing desktop engine is untouched. (#13117)
    - Computer use v3: the engine's contract root lands in omo-computer-core (the method table with host-only methods split by peer kind, engine.hello with generation, limits and machineId, the computer.* settings table, the enumerated environment seams, the untrusted-text listing records and the refusing Backend / AxBackend traits), with the generated engine schema and protocol doc and the generated @oh-my-opencode/omo-computer-protocol types and call-chain classifier. Nothing user-visible changes yet; the existing desktop engine is untouched. (#13107)
    - Interactive standalone release launches now check and install updates asynchronously through the same verified updater, at most once per UTC day. Background diagnostics go to the canonical agent directory's auto-update.log without disturbing the terminal. Offline mode and OMO_SKIP_VERSION_CHECK (including legacy Senpi/Pi equivalents) disable this startup check. Maintainer builds, headless commands and directly invoked provisioned runtime copies never auto-update. (#13087)
    - Computer use v3: the new engine workspace is registered as empty building units (10 omo-computer-* crates, 7 @oh-my-opencode/omo-computer-* packages), with a bun run test:computer script and the computer native contract CI matrix on macOS, Linux and Windows. Nothing user-visible changes yet; the existing desktop engine is untouched. (#13028)
    Security
    - Desktop memory sync no longer risks running out of memory on an oversized reply from the sync service. zod moves to 4.6.7 (GHSA-mrhx-c7xc-m3w5: validating a huge array collected one issue per bad element), and every array the sync channel reads is now capped at 100,000 items, so an oversized reply is rejected up front. This release pins senpi 2026.11.13. The only zod below 4.6.6 that still ships is the copy the Claude agent SDK embeds in its prebuilt code, which is used only to parse the local Claude Code subprocess output. (#13151) (#13141)
