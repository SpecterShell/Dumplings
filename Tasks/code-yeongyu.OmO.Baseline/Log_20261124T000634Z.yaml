  Key: ReleaseNotes
  Value: |-
    What senpi 2026.11.23 changes for you.
    - Images on text-only models: when a tool returns an image and the current model cannot read images, the look_at vision model now describes it and the description takes the image's place, so the model still gets the content.
    - macOS paths under /home: a tool call naming a path under /home (an automount that may never answer) no longer stalls every file operation in the session; a mount that never answers is refused instead.
    - Self-hosted Anthropic-compatible proxies: a custom models.json provider using anthropic-messages with an sk-ant-oat... key works again; the key is sent as a plain API key instead of failing before the first request.
    - Reopening right after an engine handover no longer fails with read ECONNRESET.
    - Claude, GLM and Kimi models are told to edit files with the session's file-editing tool directly, instead of from code cells. (#14840)
    The memory footer no longer keeps showing "reflecting" after a reflection finishes. A footer refresh that was still reading when the reflection ended could leave the spinner on screen until the next change; the line now always returns to the memory status once the reflection completes. (#14838) (#14838)
    The memory status line no longer flickers through repeated identical updates. Footer refreshes from a memory write, a settle and the reflection backlog land in whatever order their async work finishes, and several could publish the same line one after another; the line looked the same, but the number of updates depended on timing. An unchanged line is now published once, while every change and every clear still goes through. (#13046) (#14825)
    A slow memory status refresh can no longer put an outdated line back on screen. Each refresh now takes its place in line before it reads anything, and a line read earlier never replaces one read later; the uncommitted-changes marker is read only between memory writes, so it no longer flashes while a write is being committed. (#13046) (#14825)
    omo now runs on senpi 2026.11.23. The pinned engine moves from 2026.11.22 to 2026.11.23, which carries senpi#7392; the bundled plugin, the service-auth table and the EQ.omo goldens are regenerated for it. (#14822) (#14822)
    Fixed
    - A task child started as its own process no longer fails with chain_not_held: timeout when its engine takes longer than 10 s to boot, as on a cold Windows runner. The wait for the engine's first answer now ends only when the engine stops making CPU progress for 10 s, uses more than 120 s of CPU, or reaches a 10 minute outer limit; the 10 s limit now covers only the fallback-chain exchange itself. (#14808, fixes #13165)
    - The Senpi plugin build no longer fails every queued bundle when its shared Node minifier process is killed mid-build: a request the lost process did not answer is sent once to a fresh one, and a second loss still fails with that exit. (#14767)
    - The browser skill now uses omowright 0.3.2: the BrowserSkill daemon stays on its pinned release and no longer contacts a third-party update mirror or replaces its own binary, a command sent after the browser closed rejects instead of relaunching an unowned browser, the multiple-browsers and extension-outdated errors keep their coded error when the daemon sends unusual field values, and the Windows native-host installer allows a slower PowerShell cold start. (#14760)
    - omo thread and the thread SDK answer another device's typed refusal of a session control with the same code, details and next action as the thread tools. For example, omo thread read <device>/<thread> whose reply the device service lost (request_gone) now answers host_unavailable naming the device and exits 3. Before, it answered internal_error ("Thread operation failed: ...") and exited 5. (#14758)
    - A script using the thread SDK (or omo thread send) can now message a session on another of your devices. Another device's engine accepts no command-line delivery from a different machine, so these sends answered unsupported (sender_not_allowed). They now go the way omo remote send does: the text arrives as your own input, and the result names the device that answered. Sends to sessions on the same device are unchanged. (#14668, fixes #14616)
    - thread_create returns deduplicated: true when the same arguments and idempotency key reuse the original thread. A first create still returns false. (#14665)
    - A session no longer sticks at "Starting session..." when the OS refuses to start ps (EPERM from posix_spawn, a process limit or a sandbox refusal on macOS). The thread gateway now treats that as an unreadable process start time, which it already counts as a live claimant, instead of failing every gateway read, including the pending completion arms the session waits on at start. (#14639, fixes #12314)
    - Concurrent thread_read calls of local terminals no longer fail together with thread RPC request timed out, EPIPE or ECONNRESET when another call in the same engine blocks its event loop (a cold remote read, for example). A local socket conversation's deadline now stops while the caller itself cannot run, and a read whose connection the terminal dropped during such a stall, before any response byte arrived, is dialed once more. Other commands are never retried. (#14624, fixes #14444)
    - Installing a newer omo no longer cuts running sessions off the thread tools. The binary that migrates the gateway store now records the oldest schema whose code can keep using it, and an older omo opens a newer store that meets it instead of answering gateway_schema_too_new on every call. Schemas 15 and 16 record floor 14, so a later omo that reads the floor keeps using them at schema 14. A newer store that an older omo cannot use is still refused with gateway_schema_too_new, also by a session that opened the store before the newer omo migrated it. omo 5.1.81 and older, schema 14 included, do not read the floor and still refuse any newer store once they reopen it, so this protects installs from this release on. (#14622, fixes #14382)
    - A source build (omob) no longer migrates a gateway store that released sessions may read: the shared agent dir under any of the account's homes (the OS account record included, so an alternate HOME does not hide it), a gateway/ linked into it, or any store when the account's home cannot be read. It answers gateway_migration_failed and names OMO_CODING_AGENT_DIR for an isolated agent dir. (#14622)
    - A queued workflow node whose child never launched can run again after the workflow resumes. Nodes still queued in the same session retain their place instead of failing as orphans. (#12109) (#14553)
    - Installing or uninstalling the local launcher leaves compiled binaries, symlinks and foreign wrappers alone. The installer checks the file header rather than searching for a marker and reports each launcher it kept. (#13258) (#14553)
    - Escape cancels a stalled memory call. Calls that exceed their deadline report which stage stopped responding. (#14546) (#14553)
    - The shipped thread SDK lists and reads sessions on other account devices by default. An explicit remote still takes precedence. (#14620) (#14553)
    - Parked sessions can drain cross-device messages as soon as the host consumer is serving, without waiting for the startup sweep that woke them. (#14621) (#14553)
    - thread_list rows for threads on another device show when the thread was created. They showed the time the holder last synced its listing, the same value as updated_at. (#14479)
    - Tests: the omo-native daemon real-engine contract tests no longer fail on machines whose umask makes new directories group-writable; the test fixture now keeps its RPC directories private, which the senpi RPC host requires. (#13161)
    Added
    - Set OMO_THREAD_READ_TRACE=1 in the caller to diagnose failed local read RPCs. The diagnostic reports the command, last socket phase, elapsed time, error code, how long the caller's own event loop was blocked and how many attempts were made, without printing addresses, credentials or transcript data. It is silent by default. A socket that connects without an auth exchange and fails before its request reports connected, not handshake. (#14624, from #14489 and #14498)
    - Frontend QA now checks request, failure and re-entry states. visual-qa reports an unobserved changed flow as UNVERIFIED rather than passing it. (#14545) (#14553)
    Changed
    - OpenCode's session message-directory lookup accepts an explicit storage root so tests can use isolated fixtures without replacing the shared storage paths. The default OpenCode storage path is unchanged. (#14594)
    - Remote session listings can display a holder's retry wait and engine version. The client negotiates older row formats with services that do not provide them. (#14511) (#14553)
    - omo now pins senpi 2026.11.22. (#14270) (#14553)
    - The remote attach test waits for endpoint closure instead of a filesystem timer. The DAG ordering test uses an in-memory task store with the file store's contract; both DAG stores use the same session-capacity lock path. (#14530, #14503) (#14553)
