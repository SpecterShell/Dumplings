  Key: ReleaseNotes
  Value: '- 修复已登录时每次打开仍弹出扫码登录（#4）：启动时会先读取 WebKit 保存的抖音登录 cookie，而 WebKit 在网络进程刚启动或重启时可能返回空列表且不报错，应用误以为已退出登录，删掉保存的登录信息并弹出扫码窗，几秒后又自己认出登录恢复过来。现在先确认 cookie 读全了再判断，读不全时保留现有登录，不再弹窗，也不再删除保存的登录信息；扫码登录、退出登录读取 cookie 时同样先确认读全。'
