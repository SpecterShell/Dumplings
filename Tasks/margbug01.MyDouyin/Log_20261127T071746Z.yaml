  Value: |-
    - 修复红果系列剧新一季未上线时卡在「正在加载剧集列表…」并完善季/剧上线状态显示：播放器每帧恢复检查补齐剧集列表错误、已加载空列表与未上线守卫，消除加载失败后的无限重发循环；在红果接口层区分 0 集未上线剧集与真实匿名受限，不再把未上线新季误报为「匿名访问受限」或显示「更新至 0 集 / 全 0 集」。详情页与选集抽屉明确标注「第 N 季 · 待上线」，详情页未上线季保留简介与「追剧」入口并将播放按钮置灰为「暂未上线」，播放器抽屉点击未上线季不打断当前播放。
    - 提升弹幕可读性并参考 B 站网页版完善弹幕设置：默认样式改为「重墨」描边（8 方向紧贴 1px 描边 + 轻柔投影）、粗体（700）、100% 不透明度与 18pt 标准字号，描边选项升级为「重墨 / 描边 / 45° 投影 / 无」；半透明弹幕改用整层组透明度合成，彻底消除低透明度下白字压在黑底上发灰发脏的问题；弹幕设置弹窗与设置页新增「粗体」开关与「显示区域」（1/4 屏 / 半屏 / 3/4 屏 / 满屏），按视频画面高度动态调整轨道数。
