  Key: ReleaseNotes
  Value: |-
    - 新增 4K 与 2K 超清清晰度支持：解析抖音 H.265 MP4 音画合流超清档位（兼容 3840×2160 与 4096×2048 电影画幅及 1440P 2K），「智能」与 1080P 及以下仍优先 H.264 保证兼容；偏好选择 4K/2K 观看低分视频时就近向下回退至最高可用清晰度，不再退回 540P。
    - 倍速弹幕自动稳速与弹幕样式自定义：2 倍速等倍速播放时自动按倍速补偿弹幕飞行时间，保持与 1 倍速一致的舒适阅读速度；在抖音点播/直播、红果播控栏「弹幕」旁新增「弹幕设置」浮层（同步支持设置弹窗与持久化），可实时调节弹幕速度（0.5x–1.5x）、字号（小/标准/大/超大）、描边样式（阴影/细描边/粗描边/无）与透明度（100%/90%/75%/55%）。
    - 修复进入博主主页默认滚动到偏下方的问题：为网格页（博主主页、搜索、关注、我的、精选等）与评论/榜单/弹幕虚拟列表启用 KeepOffset，消除首帧锚定底部加载行导致的加载后滚底跳转。
    - 修复视频正常播放期间偶发叠加「视频暂时无法播放」「重新加载」提示：跟踪播放进度推进状态与原生层隐藏状态，避免 Windows Media Foundation 缓冲状态未复位或 macOS 原生层隐藏时误判 20 秒无画面超时，并在恢复播放后自动清除瞬时超时错误。
