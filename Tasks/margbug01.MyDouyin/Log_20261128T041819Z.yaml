  Key: ReleaseNotes
  Value: '- 修复全新安装后扫码登录卡住（感谢 @SinclairLin，#7）：新设备在手机上确认后，抖音会要求二次验证（刷脸、原设备扫码或短信）。以前电脑端认不出这个验证弹层，弹层里的验证二维码还会被当成登录二维码，所以一直停在扫码框。现在会自动切到网页视图让你完成验证，验证通过后自动登录。扫码进度改为直接读登录组件的状态，不再拦截页面请求；二维码载入后也一直保留「网页登录」入口。'
