- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 新增弹幕悬停查看：播放时把鼠标停在一条弹幕上，它就原地停住、压上深色底，方便看清，其他弹幕照常飞。鼠标移开后从停下的地方接着飞；如果停着时同一行后面的弹幕已经追上来，移开后它直接消失，不和别的弹幕叠在一起。鼠标在右侧按钮、文案和底部控制栏上时不会触发，点击暂停、双击点赞不受影响。抖音点播、直播和红果短剧都生效。
    - 修复 0.2.39 开启合并重复弹幕后屏幕反而更挤、更卡：合并只把重复的拿掉，空出来的位置不再塞进原本放不下的长句，弹幕密集时屏幕更清爽。拖动进度条时不再逐条往后比对重复弹幕；重复多的视频里，每帧要画的弹幕也少了很多。直播里重复的只在弹幕还在右半屏时并入，不再让快飞出屏幕的弹幕次数一直涨；次数胶囊变宽后会等整条连胶囊都飞出屏幕才消失，不再在左边缘被切掉一截。
    - 修复 Windows 上短剧播放中途画面定格，而且暂停、拖动都没反应：视频服务器连接不发数据又不断开时，等待超过 15 秒就自动断开、从断点续传；有声视频 20 秒没有进度时提示「没有画面」，可以从当前位置重试。
