  Key: ReleaseNotes
  Value: |-
    Highlights
    - In local Labs Identity graph, summarize a conversation into editable identity cards. Choose which drafts to save and link agents or roles to an AI Identity; nothing is saved until you confirm.
    - AI Now uses application storage for new installations while keeping existing files in place. Windows file paths are easier to read.
    - Background AI keeps the selected model and funding account through retries and PDF OCR, and applies spending limits to the route each task uses. Subscription and local routes retain paid usage history without being blocked by limits that do not apply to them.
    - Conversations keep their precise activity time in the list. Records with only a calendar date keep that date instead of appearing many hours old.
    Improved
    - Desktop and self-hosted MCP connections can save, search and read Memories in the selected Space. Conversation search and reading are also available while legacy Graph storage is authoritative.
    - Locally extracted Memories follow the conversation's language when no output language is set in your Profile. An explicit Profile language still takes priority, and names keep their original spelling.
    - Local relationship and cleanup reviews retain usable suggestions when a model returns an invalid one. Partially reviewed Memories receive bounded follow-up reviews, and dismissed contradictions stay dismissed.
    - Local Memory relationship reviews use shared entities, labels and conversations. Older conversations imported later become predecessors of newer statements; statements with no clear order remain review cards.
    - Choose low, medium or high reasoning effort for native Gemini 3.8 Flash in provider settings. Structured background tasks can use its lowest supported effort.
    - Locally extracted Memories resolve phrases such as "yesterday" to dates using the original message time and your timezone, while retaining dates mentioned in passing.
    - Remote MCP connections support registered client secrets when enabled by the operator. Existing public-client connections keep their current setup.
    - Local embedding repairs make room for waiting foreground requests between batches.
    - Experimental HawDB storage uses engine 0.30.0. Older experimental datasets may need separately verified preparation in a new location; existing data is preserved and incompatible startup is refused.
    Fixed
    - AI Now uses application storage for new installations while keeping existing files in place. Windows file paths are easier to read.
    - Background AI keeps the selected model and funding account through retries and PDF OCR, and applies spending limits to the route each task uses. Subscription and local routes retain paid usage history without being blocked by limits that do not apply to them.
    - Settings keep limits returned by older servers and preserve unsaved edits when a conflicting or outdated response arrives, until you explicitly reload.
    - In HawDB Labs storage modes, conversation repair can consolidate obsolete conversations whose IDs differ only in letter case, while retaining retry recovery.
    - In HawDB Labs storage modes, Identity activity and profiles use the selected storage consistently. Saved changes and pending cleanup work are retained when a later verification fails; unavailable evidence is reported rather than treated as empty.
    - In HawDB Labs storage modes, Skill publication keeps the saved procedure and recovery files when the final confirmation fails. Memory vector search also filters Memory records within the same read snapshot.
    - OpenCode automatic sync avoids repeated imports of legacy JSON already covered by its active database. If sync stops partway through a database, it keeps completed conversations and resumes unfinished work after restart.
    - Manual and automatic local distillation share progress for each conversation revision, avoiding repeated extraction of the same content while allowing new messages to be processed.
    - Onboarding keeps failed imports, recovery guidance and Retry import available on both history-import screens. Retrying preserves successful imports, and finished imports no longer appear to await an AI read before AI is configured.
    - Conversations keep their precise activity time in the list. Records with only a calendar date keep that date instead of appearing many hours old.
    - Skill creation keeps saved Skills visible when background setup cannot be confirmed. Retrying keeps review-only Skills inactive, enrichment retains saved examples, and completed updates stop showing Updating.
    - Successful Source refreshes, reparsing, indexing and status changes stay successful when storage compaction is unavailable.
    - Memory type reviews in the CLI distinguish queued, already queued, skipped and unconfirmed requests, with recovery guidance when admission cannot be confirmed.
    - Dragging the Skill helper title moves its desktop window.
    Full Changelog
