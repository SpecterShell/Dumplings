  Key: ReleaseNotes
  Value: |-
    Highlights
    - Open an Artifact’s version history to review earlier edits and restore a version as a new one. Version history is available when your connected server supports Artifact revisions.
    - Download an entire Artifacts folder as a ZIP that preserves its structure. AI Now and the browser extension can save files directly into a folder, and folder changes from other devices appear without a reload. These features are available when your connected server has Artifact folders enabled.
    - Explore an interactive Graph preview while the full overview loads. The completed Graph preserves your selection and view.
    - Read the first page of Artifact text while related details load. The Artifacts list also fetches the next page before you reach the end, and keeps your filters when a page needs a retry.
    Improved
    - Browse a Skill’s supporting files in its file tree. You can also export and import Skill bundles as ZIP files.
    - A saved conversation opens after you import a single file. If it takes longer to load, retry opening the saved conversation.
    - On phones, the Close button in Home’s Memory Health Review sits below the system status bar.
    - Mem can suggest Skills from your work before you connect an agent. Review suggested Skills and proposed updates from Home.
    - Memory search now shows when no results match. Press Enter to run the search.
    - The Desktop About page shows whether an update is being checked, downloaded, or installed. Help and diagnostics are grouped below.
    - Explore an interactive Graph preview while the full overview loads. The completed Graph preserves your selection and view.
    - Read the first page of Artifact text while related details load. The Artifacts list also fetches the next page before you reach the end, and keeps your filters when a page needs a retry.
    - On narrow AI Now windows, the model picker gives model names more room. On Windows and Linux, Skill previews leave the window controls accessible when you resize the pane.
    - Memories and Threads prepare the next page in the background so you can keep browsing with less waiting.
    - Desktop settings group related backup and transfer actions. Search by font name in General settings to find a reading font.
    Fixed
    - Moving multiple conversations between Spaces now keeps each conversation and its messages together through interrupted moves and restart recovery.
    - Choose Keep existing history when reviewing a Codex archive. Mem remembers the decision for that archive revision across watcher restarts.
    - Pressing Enter to confirm Chinese, Japanese or Korean text composition no longer submits the affected forms. Captured tables also preserve line breaks inside cells in conversations and AI Now.
    - Processing shows the last recorded reply check for supported distillation failures. Knowledge Graph errors provide more specific recovery details when the cause is known.
    Platform
    - The experimental HawDB backend now uses HawDB 0.36.0. Preparing that backend avoids holding Search open during its comparison checks.
    Full Changelog
