- Locale: cs-CZ
  Key: ReleaseNotes
  Value: |-
    Byla vydána Datovka 4.30.0.
    Nové vlastnosti
    - Položky v seznamu schránek lze filtrovat podle jména, identifikátoru nebo loginu.
    - Položky v seznamu schránek lze řadit podle jména, počtu nepřečtených zpráv, času poslední synchronizace nebo je lze zobrazit v uživatelem určeném pořadí.
    - Datové zprávy je možné nahlásit do ISDS jako spam.
    - V případě, že je zpráva v ISDS označena jako spam, je v seznamu zpráv zobrazeno upozornění.
    Vylepšení
    - Vnitřní struktura souborů databází zpráv je totožná s mobilní aplikací.
    - Do databáze zpráv je ukládáno číslo verze formátu. Kontroly na kompatibilitu jsou prováděny podle čísla formátu. Opakované otevření databáze by mělo být rychlejší.
    - Struktura databáze uživatelských účtů je sdílená s mobilní aplikací.
    Opravy chyb
    - Opravena chyba při zpracování dat pro zpřístupnění v seznamu datových zpráv, která mohla vést k pádu aplikace.
    Pro překlad a běh aplikace je vyžadována libdatovka-0.8.0 nebo novější.
