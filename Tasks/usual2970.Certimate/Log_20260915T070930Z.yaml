  Value: |-
    Changelog
    ✨ 新增功能
    - 新增部署提供商：腾讯云 DDoS 高防
    - 新增部署提供商：橙域网络网迹 CDN
    - 部署证书到 SSH 远程主机时支持以 REPL 模式执行前、后置命令
    - 部署证书到火山引擎 CLB 传统型负载均衡时支持指定扩展域名
    - 部署证书到 LeCDN 时支持 LeCDN v4
    - LeCDN 授权凭据中支持选择 API 认证方式为 API Key
    🐛 修复 Bug
    - 修复 #1452：新网 DNS API 接口返回 404 错误
    - 修复 #1453：部署证书到 Kubernetes 时当 Secret 不存在时返回 405 错误
    - 修复因 DCloud 登录接口变更导致无法部署证书到 uniCloud 的问题
    🛠 优化 & 其他改动
    - 升级 gomod 依赖项
    - 升级 npm 依赖项

