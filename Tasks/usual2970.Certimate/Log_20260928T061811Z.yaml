  Key: ReleaseNotes
  Value: |-
    Changelog
    ✨ 新增功能
    - 申请 ZeroSSL 证书时支持自动获取 EAB 凭据：EAB KID 与 HMAC Key 留空时，将使用证书联系邮箱自动向 ZeroSSL 获取
    - 证书列表新增「主题名称（CN）」与「主题备用名称（SAN）」两列，SAN 列最多展示 3 个域名，超出部分以 +N 显示
    - 证书详情中的主题备用名称改为以标签形式逐个展示
    🐛 修复 Bug
    - 修复 #1461：部署证书到火山引擎 WAF（CNAME 接入模式）时因缺少源站配置导致 InvalidParameter 错误
    - 修复部署证书到 LeCDN v4 时 API 认证失败及证书部署异常的问题
    🛠 优化 & 其他改动
    - 代码清理与重构（LeCDN、火山引擎 WAF 部署提供商）

    Comparing changes: https://github.com/certimate-go/certimate/compare/v0.4.33...v0.4.34, by @asd80703406, @fudiwei, @usual2970, @Yeqingky
