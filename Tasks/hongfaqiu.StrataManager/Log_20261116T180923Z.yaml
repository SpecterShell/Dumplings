- Locale: en-US
  Key: ReleaseNotes
  Value: '- Resolve official cross-release download URLs in a verified feed (#235): starting with official v0.2.15, Windows/Linux regular engines 0.1.60 and dsv41/SYCL 0.1.59 are published as absolute URLs on older release pages. Manager previously treated those URLs as filenames and only searched the current release, so new installs and upgrades could not build a download plan. Relative filenames in a verified feed still resolve on the current tag; absolute URLs are accepted only for official Niko1221/Strata GitHub Release download paths, and downloads still require matching SHA256 and size on that older tag. This does not bypass DeepSeek retirement in newer official source. The Mac engine pin remains 0.1.47.'
