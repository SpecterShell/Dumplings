Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Linux split engines of Strata 0.2.10 (engine 0.1.56): strata-split-<N> executables (optionally suffixed) at the package root are allowed; other new files are still rejected.
    - DFlash2 drafting on engine 0.1.56+: Drafting (speculative decoding) offers DFlash2; with 2 or more concurrent requests it says DFlash2 serves one request at a time and MTP runs instead. The 0.2.9 concurrency defaults are unchanged.
    - DeepSeek engine update notice after an update: when a Strata update completes and the local DeepSeek engine is older than the latest, "DeepSeek engine update available" and "Update" appear; preparing DeepSeek-V4.1-Flash again on the Models page updates it.
    - CUDA 13 hint for CUDA 12 users: with an NVIDIA driver ≥580.65 on a CUDA 12 package, the update dialog says CUDA 13 is supported (first start about 1 min vs about 5 min on CUDA 12); updates keep CUDA 12 and never switch automatically.
    - Fall back to the previous engine after a crash: when the engine crashes or exits abnormally, the startup failure card offers "Fall back to" the previous installed version (such as engine 0.1.55) without downloading; with no older local copy it opens the engine version list.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 适配 Strata 0.2.10（引擎 0.1.56）的 Linux 拆分引擎：允许安装包根目录下的 strata-split-<N> 可执行文件（可带后缀），其它新文件仍会被拦下。
    - 引擎 0.1.56 起可选 DFlash2 预测：「预测（投机解码）」多了 DFlash2；同时处理 2 个以上请求时会说明 DFlash2 一次只服务一个请求、将改用 MTP。0.2.9 的并发默认值不变。
    - 更新完成后提示 DeepSeek 引擎可更新：Strata 更新完成而本机 DeepSeek 引擎低于最新版本时，显示「DeepSeek 引擎可更新」和「去更新」，在模型页重新准备 DeepSeek-V4.1-Flash 即可更新。
    - CUDA 12 用户可改用 CUDA 13 的提示：NVIDIA 驱动 ≥580.65 而当前是 CUDA 12 包时，更新弹窗说明已支持 CUDA 13（首次启动约 1 分钟，CUDA 12 约 5 分钟）；更新仍保留 CUDA 12，不会自动切换。
    - 引擎崩溃时可回退到上一版引擎：启动失败卡片在引擎崩溃或异常退出时提供「回退到」本机已安装的上一版（如引擎 0.1.55），无需下载；本机没有旧版时可去选择其他引擎版本。
