Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: "- No more \"Confirm Strata update\" when the selected runtime is already current: with an older and a newer runtime on the same computer (for example Manager's v0.2.10 and an old D:\\AI\\Strata at v0.2.2), the automatic check picked whichever folder was older, so the dialog showed the old folder as Installed while the Strata page said the selected runtime was up to date. The automatic prompt and the Strata page now both follow the runtime selected under Runtime: once it is current nothing is offered, and choosing another runtime makes the check follow that one. The default choice is now the same everywhere: the runtime you last picked on the Strata page (saved, so it survives a restart; ignored if the folder is gone), then the one marked In use, then the newest ready runtime, then the first ready one. An old folder listed first no longer brings the prompt back after a restart."
- Locale: zh-CN
  Key: ReleaseNotes
  Value: '- 当前运行环境已是最新时不再弹「确认更新 Strata」：电脑上同时有新旧两个运行环境（例如 Manager 安装的 v0.2.10 和旧的 D:\AI\Strata v0.2.2）时，自动检查会找到任意一个旧版本来提示更新，弹窗里的「本机」显示的是旧目录，而 Strata 页上选中的运行环境已显示「已是最新版本」。现在自动提示和 Strata 页都只看「运行环境」里选中的那一个：它已是最新就不再提示；切换到别的运行环境后，按新选中的那个判断。默认选中哪个也统一了：先用上次在 Strata 页手动选的（会保存，重启 Manager 后仍有效；目录已不存在就忽略），其次是「当前使用」的，再次是本机可用的里版本最新的，最后才是第一个可用的。因此重启后不会再因为列表里排在前面的旧目录弹出更新。'
- Locale: en-US
