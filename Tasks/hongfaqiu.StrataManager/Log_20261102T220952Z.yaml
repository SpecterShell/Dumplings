Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Fixed engine updates on Windows AMD defaulting to an old package (#194): when download settings had saved a specific package from an older release (such as strata-engine-0.1.47-windows-x86_64-hip-rdna3.tar.gz), the update dialog reused that name, which the new release does not have, so the list showed the old package and Confirm stayed disabled. It now switches to the same kind of package in the target release and says so; if the target has none, it falls back to automatic matching and explains why.
    - Shared chat settings are no longer wiped when switching back to an older engine: upstream engines up to v0.2.9 drop all shared chat settings at startup when .shared-settings.json has a single key they do not know (upstream #4934). When .shared-settings.json is copied to such an engine, only the 8 keys it knows are kept (reasoning effort, temperature, top_p, top_k, seed, max tokens, reasoning budget, speed projection). Engines that accept new keys, and files that cannot be parsed, are left unchanged.
    - Intel Arc discrete GPUs are no longer treated as AMD: with an unsupported AMD iGPU beside an Intel discrete GPU, engine updates reported an AMD error. The Intel GPU is now recognised, the iGPU is ignored, and the message says engine updates do not offer the Intel (SYCL) package yet and that you can reinstall with the Intel (SYCL) backend on the setup page.
    - The Windows AMD single-GPU notice also shows with the Automatic backend: it used to appear only when HIP was chosen. It now also shows on Windows when several AMD GPUs are selected.
    - "Faster on 12 GB NVIDIA" is renamed "Faster on small-VRAM NVIDIA (≤12 GB)" and notes that accuracy may drop slightly; it stays off by default.
    - The website, README and download guide list macOS (Apple Silicon) as a supported platform: the "experimental" label is gone. They say the DMG is signed and notarized by Apple and list the current limits: the engine is the upstream prebuilt Metal package, pinned to 0.1.47 until upstream #4634 is fixed; DeepSeek-V4.1-Flash is not available on Mac; there is no Intel Mac build.
    - DeepSeek V4.1 Flash support for Strata 0.2.9 (upstream #4814): the disk check and "Use existing model" now recognise 0.2.9's six-shard ISTA layout next to the old four-shard one, check both against upstream's pinned sizes, and use files already on disk instead of counting them as downloads. The Unsloth 1-bit sets UD-IQ1_S (about 241 GB) and UD-IQ1_M (about 258 GB) are offered on Strata 0.2.9 and later only, as manual choices that are never recommended automatically; with an ISTA set already present their Engram is reused, saving about 111 GB. Their notes give upstream's 61-task results (53 for UD-IQ1_S and UD-IQ1_M, 56 for ISTA 2.25) and say they are untested on Windows and Strix Halo. DeepSeek uses no MTP file, so "Use existing model" no longer asks for one. Ryzen AI Max (Strix Halo) has no DeepSeek engine package on Linux yet; the download page and engine selection now say so and suggest running DeepSeek on Windows or Qwen on Linux.
    - Engine 0.1.55 parallel defaults (upstream #4841): from engine 0.1.55 the engine turns on STRATA_BATCH_ATTN_ROWS / STRATA_BATCH_GDN_GROUPS itself only on Linux + NVIDIA (CUDA) when serving 2 or more requests at once (not for DeepSeek, nor with AMD/HIP, Intel/SYCL, Vulkan or Metal). On such machines with engine 0.1.55 or newer, the concurrency card and the concurrency comparison no longer offer or write these two switches and explain that the engine decides; a value already in the config still applies (0 turns it off) and keeps its switch so it can be removed. Windows, AMD and other platforms where upstream does not turn them on keep both switches and the experimental comparison, with a note that the engine leaves them off there.
    - Recalibrate prompt after an engine upgrade (upstream #4841): when the last Speed Boost calibration was measured on an older engine, the tuning page says the new engine's defaults may have changed and offers a one-click recalibration, or "Not now" (remembered per calibration and engine version).
    - Multi-GPU all-cards default explained (upstream #4841): with GPU selection on Automatic and 2 or more discrete cards actually detected on this machine (nothing for one card or a dGPU plus iGPU), the selector explains the Strata 0.2.9 defaults: DeepSeek uses every AMD card on Linux, Intel Arc fills all cards, an iGPU beside a dGPU is left out; AMD on Windows still uses one card and Qwen on several AMD cards still needs them named; strata launch --gpu N is remembered. The GPU selector no longer shows two simulated cards when none are detected.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 修复 Windows AMD 显卡更新引擎时默认选中旧版安装包（#194）：下载设置里保存过旧版本的具体安装包（如 strata-engine-0.1.47-windows-x86_64-hip-rdna3.tar.gz）时，更新弹窗直接沿用这个名字，新版本里没有这个文件，下拉框显示旧包、确认按钮不可用。现在会换成目标版本的同类包，并提示已更换；目标版本没有同类包时改为自动匹配并说明原因。
    - 切回旧引擎时共享聊天设置不再被清空：上游 v0.2.9 及更早的引擎只要在 .shared-settings.json 里遇到一个不认识的设置项，就会在启动时清空全部共享聊天设置（上游 #4934）。复制 .shared-settings.json 到这类引擎时只保留它认识的 8 项（推理强度、温度、top_p、top_k、seed、最大输出、思考预算、速度投影）；能接受新设置项的引擎和无法解析的文件保持原样。
    - Intel Arc 独显不再被认成 AMD：Intel 独显旁边有不受支持的 AMD 核显时，引擎更新以前会报 AMD 的错误。现在识别 Intel 独显并忽略这块核显，直接说明引擎更新暂不提供 Intel（SYCL）包、可在安装页选 Intel（SYCL）后端重装。
    - 后端选「自动」时也提示 Windows AMD 仅支持单卡：此前只有手动选 HIP 才显示。现在 Windows 上选了多张 AMD 显卡时同样提示。
    - 「12 GB N 卡提速」改名「小显存（≤12 GB）N 卡提速」，并写明可能轻微降低准确度；默认仍关闭。
    - 官网、README 与下载指南把 macOS（Apple Silicon）列为正式支持平台：去掉「实验」标注，写明已签名并经 Apple 公证，以及当前限制：引擎使用上游预编译 Metal 包，上游 #4634 修复前固定 0.1.47；Mac 不支持 DeepSeek-V4.1-Flash；不提供 Intel Mac 版。
    - DeepSeek V4.1 Flash 适配 Strata 0.2.9（上游 #4814）：磁盘检查和「使用已有模型」认得 0.2.9 的 6 分片 ISTA 布局（与旧的 4 分片布局都按上游固定大小核对，已有的文件就地使用、不重复计入下载）。新增 Unsloth 1-bit 版本 UD-IQ1_S（约 241 GB）和 UD-IQ1_M（约 258 GB），只在 Strata 0.2.9 及以上显示、只能手动选择、不会被自动推荐；已有 ISTA 版本时可复用其 Engram，少下载约 111 GB。说明里写明上游 61 题测试成绩（UD-IQ1_S、UD-IQ1_M 各 53，ISTA 2.25 为 56），以及尚未在 Windows 和 Strix Halo 上测过。DeepSeek 不用 MTP 文件，「使用已有模型」不再要求选择。Ryzen AI Max（Strix Halo）在 Linux 上暂无 DeepSeek 引擎包，下载页和引擎选择会直接说明，建议在 Windows 上运行 DeepSeek 或在 Linux 上使用 Qwen。
    - 适配引擎 0.1.55 的并发默认值（上游 #4841）：引擎 0.1.55 起，只在 Linux + NVIDIA（CUDA）、同时处理 ≥2 个请求时自己打开 STRATA_BATCH_ATTN_ROWS / STRATA_BATCH_GDN_GROUPS（DeepSeek 与 AMD/HIP、Intel/SYCL、Vulkan、Metal 除外）。在这类机器上检测到引擎 ≥0.1.55 时，并发卡片和并发对比不再提供、也不再写入这两个开关，改为说明由引擎决定；配置里已有的值仍会生效（设为 0 可关闭），并保留开关方便去掉。Windows、AMD 等上游不自动开启的平台继续保留这两个开关和实验对比，并说明引擎在这里不会自动开启。
    - 引擎升级后提示重新校准（上游 #4841）：上次「一键提速」校准是在旧版引擎上测的时，调优页会提示新引擎的默认值可能已变，可一键重新校准，也可选择「以后再说」（按本次校准和引擎版本记住）。
    - 多 GPU 默认用全部显卡的说明（上游 #4841）：GPU 选择为「自动」且本机实际检测到 2 张以上独立显卡时（单卡、独显加核显都不显示），说明 Strata 0.2.9 起的默认行为：DeepSeek 在 Linux 上用全部 AMD 显卡、Intel Arc 多卡默认铺满、与独显同在的核显不参与；Windows 上 AMD 仍只用一张，Qwen 多张 AMD 卡仍需指定；strata launch --gpu N 会被记住。GPU 选择不再在未检测到显卡时显示模拟的两张卡。
