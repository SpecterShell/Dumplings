  Key: ReleaseNotes
  Value: |-
    - Added "Legacy" icon pack (Application settings -> Theme -> Icon pack).
    - Region capture improvements:
      - Added "Multi region mode" option (Task settings -> Region capture).
      - Added "Compact region capture toolbar" option (Task settings -> Region capture).
      - The region capture toolbar can now be dragged to a different position.
      - Added "Region (Transparent)" capture back to the capture menu.
    - The image editor and photo editor now open on the same monitor as the main window.
    - Improved startup speed and first region capture speed.
