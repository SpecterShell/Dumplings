  Key: ReleaseNotes
  Value: |-
    适配 7.1 新角色，自动剧情语音检测优化等。
    自动战斗
    - 优化实验性自动连招的战技冷却判断与站场动作，支持技能打断普攻，并在技能空窗期执行兜底攻击 (#3679 #3691) @FishmanTheMurloc
    - 战斗策略匹配人数相同时优先选择匹配比例更高的策略，避免通用策略覆盖专用策略 (#3698) @zmylol
    - 修复万叶、琴战后拾取时可能未切换到对应角色的问题 (#3689) @this-Fish
    地图追踪
    - 修复万叶拾取配置无法正确生效的问题 (#3579) @Bedrockx
    - 扩大大地图左上角界面遮挡区域的点击避让范围，减少传送误点 (#3688) @1004452714
    JS 脚本
    - 背包物品计数支持自动切换所属页面和按物品排序提前结束扫描，结果统一返回物品数量映射 (#3657 #3705) @1004452714
    - 移除受 10 MB 限制的 GitCode 脚本仓库更新源
    其他
    - 一条龙首领讨伐：可分别设置单次及跨运行的成功领奖上限，并可清空累计次数 (#3683) @ShadowLemoon
    - 自动秘境：至冬秘境交互项改用文字识别选择，并等待交互生效，减少误选附近造物
    - 自动剧情：修正对话选项语音检测的 Silero VAD 前处理，新增实时诊断面板与录音保存 (#3694) @ShadowLemoon
    - 物品图标识别默认使用 ItemV2，并支持在设置中切换模型，覆盖钓鱼、自动吃药、合成和奖励识别等场景 (#3644) @1004452714
    - 界面多语言：新增繁体中文动态翻译（关联 #3674）
    - 至冬枪械操作，检测到预设二时给出调整提示，避免滚轮绑定影响部分脚本及战斗结束检测
