6.2.3.875:
  ReleaseNotes: 1. Fixes some bugs
  ReleaseNotesCN: 1. 修复一些 bug
6.3.2.1028:
  ReleaseNotes: |-
    1. Adds real-time point cloud merging during Global Marker + Line Laser scanning; point cloud is generated immediately upon scan completion.
    2. Point cloud merging for Line Laser scanning now supports GPU acceleration, improving merge processing efficiency.
    3. Adds Smart Trim for objects scanned with Line Laser.
    4. Supports adjusting the target point distance at any time during Line Laser scanning; model rendering updates in real time accordingly.
    5. Adds Two-Point Distance Measurement, supporting point selection on point cloud, mesh, texture, and 3DGS models.
    6. Adds Smooth Brush for smoothing local areas of a model.
    7. Supports hybrid stitching in Color Stitching mode (color texture + markers), improving stitching stability.
    8. Adds 3D mouse support, enhancing 3D model manipulation.
    9. Supports deleting scan files currently in editing.
    10. Merged and aligned models support 3DGS training (both models must be color models before merging).
    11. Fixes POP 4 connection issue on Mac.
    12. Adds New Scan and Resume Scan buttons on the Edit page for quick access.
    13. Fixes known issues.
  ReleaseNotesCN: |-
    1. 全局标记点-线激光扫描支持边扫边融合，扫描完成后即可立即生成点云
    2. 线激光扫描的点云融合支持 GPU 加速，提升融合处理效率
    3. 针对线激光扫描的物体，新增智能裁剪功能
    4. 线激光扫描过程中支持随时调整扫描目标点距，模型渲染效果会根据目标点距实时更新
    5. 新增两点测距功能，支持在点云、网格、贴图和 3DGS 模型中选择两点进行测量
    6. 新增平滑笔刷功能，支持对模型局部区域进行平滑处理
    7. 彩色拼接模式下支持混合拼接（彩色纹理 + 标记点），提升拼接稳定性
    8. 适配 3D 鼠标，提升三维模型操作体验
    9. 编辑中的扫描文件支持删除
    10. 合并对齐后的模型支持 3DGS 训练（合并前两个模型均需为彩色模型）
    11. 解决 Mac 电脑 POP 4 设备连接问题
    12. 在编辑页面，新增新建扫描和续扫的按钮，方便快速开始
    13. 修复已知问题
