    - Update deps by @hatoo in https://github.com/hatoo/oha/pull/900
    - Reject invalid values for -p, -q and --burst-rate by @FalkWoldmann in https://github.com/hatoo/oha/pull/901
    - Fix h3 latency correction by @FalkWoldmann in https://github.com/hatoo/oha/pull/902
    - Fix HTTP/3 shutdown hangs in debug and fast modes by @Zaczero in https://github.com/hatoo/oha/pull/903
    - docs: add Simplified Chinese README translation (README_zh.md) by @WanderLandWalker in https://github.com/hatoo/oha/pull/904
    - docs: explain what --latency-correction does by @monsterlag in https://github.com/hatoo/oha/pull/905
    - Show first byte stats in text output by @ZensykU2 in https://github.com/hatoo/oha/pull/906
    - avoid macos-14 by @hatoo in https://github.com/hatoo/oha/pull/908
    - Update deps by @hatoo in https://github.com/hatoo/oha/pull/909
    - Collect results during rate-limited runs without a TUI by @hatoo in https://github.com/hatoo/oha/pull/911
    - Reserve the Linux FD table before starting runtime workers by @hatoo in https://github.com/hatoo/oha/pull/912
