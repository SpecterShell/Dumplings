  Key: ReleaseNotes
  Value: |-
    New Features
    Resident license support for OEM licenses
    It is now possible for a controlling application to install a resident license that will only be stored in caller's memory. It is now also possible to restrict the functionality of created virtual serial ports.
    Bug Fixes
    RTS/DTR clear on disconnect
    RTS and DTR lines are now cleared on disconnect for network ports.
