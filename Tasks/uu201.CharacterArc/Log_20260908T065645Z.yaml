  Key: ReleaseNotes
  Value: |-
    1.19.1 - 2026-09-08
    Added
    - Codex CLI 工具桥接：本机 Codex 现在可以按需调用弧光提供的项目工具，读取角色、世界观、章节等资料，并生成暂存变更
    - Codex CLI 多轮处理：Codex 可以先读取资料，再根据结果继续分析或生成修改，不再只能一次性返回文本
    Changed
    - 暂存变更安全确认：Codex CLI 生成的修改会先放入暂存区，仍需用户审核后才会写入项目；相同的工具和参数不会重复执行
    - Codex CLI 使用体验：支持自动查找本机 Codex、获取模型和选择推理强度，并在工具执行过程中显示进度和结果
    - AI 配置档案：首次保存配置时会自动启用第一个配置档，新增或切换配置后，当前模型和配置参数会同步到实际运行环境
    Fixed
    - 章节全文读取：项目级全局助手分析指定章节时可以读取完整正文，不再被强制限制为摘要或预览
    - 番茄 AI 扫榜历史：按顺序保存扫榜记录，并忽略过期的读取结果，避免新记录被旧快照覆盖或当前记录消失
