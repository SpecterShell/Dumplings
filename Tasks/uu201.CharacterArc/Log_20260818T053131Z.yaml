  Key: ReleaseNotes
  Value: |-
    1.18.0 - 2026-08-18
    Added
    - 网文风向标扩展：新增起点中文网和七猫中文网榜单，支持榜单、分类和市场趋势查看
    - AI 扫榜与选题工作流：从榜单生成市场风向报告和原创选题方向，并支持历史记录、进度状态、取消重试和结果复用
    - AI 采样参数：设置中新增 Presence Penalty 和 Frequency Penalty，并按接口协议自动判断是否发送
    - 工作台菜单排序：支持拖拽调整菜单顺序、上下移动和恢复默认，设置会自动保存
    - 章节与设定批处理：支持章节批量定稿、分卷折叠记忆，以及角色、世界观、关系组织、灵感和剧情线批量选择删除
    - 大纲扩写要求：AI 扩写大纲时可填写补充要求，生成内容更贴合创作意图
    Changed
    - AI 后台任务：统一收纳到窗口栏，切换页面后仍可查看任务进度和结果
    - 全局助手长内容处理：优化续读、截断和上下文读取，大段资料与长对话处理更稳定
    - 角色图鉴：重新整理布局和标签展示，资料浏览更清晰
    - 网文风向标交互：优化扫榜弹窗、创作方向生成状态和任务期间的页面锁定
    Fixed
    - 网文风向标返回：修复返回主页时可能出现白屏的问题
