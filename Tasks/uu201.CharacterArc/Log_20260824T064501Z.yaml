    1.18.5 - 2026-08-24
    Added
    - 纵横中文网风向标：新增纵横榜单数据，选题方向支持刷新和收藏，方便继续整理创作思路
    - 章节一键排版：编辑器支持快速整理段落和换行格式
    Changed
    - 章节助手与编辑器工具栏：章节助手可按需暂存世界观设定修改，编辑器工具栏在窄窗口下可滚动适配
    - AI 反馈：全局助手和章节助手补充更清晰的错误信息，并在推理内容疑似重复时提醒用户
    - 暂存变更写回：写回前先保存工作区，批量写回增加并发保护；写库成功与界面刷新解耦，减少误报失败
    Fixed
    - 写回失败处理：失败项现在会显示具体原因、处理建议和可用的单项重试入口，章节内容发生变化时避免覆盖用户的新修改
