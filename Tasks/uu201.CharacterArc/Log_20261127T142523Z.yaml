  Key: ReleaseNotes
  Value: |-
    1.23.5 - 2026-11-27
    伏笔列表
    - 不再只显示 30 条：修复知识库“世界状态”中伏笔列表的显示上限和计数问题，现在可以查看全部未回收伏笔，显示数量与实际记录一致。清理伏笔时，不会再不断有之前隐藏的条目补进来。
    写作技能与分步协作
    - 更新内置写作技能：同步长短篇写作、拆书分析和中文润色技能及参考资料，修复部分参考资料无法读取、辅助脚本运行失败的问题。
    - 需要决定时先确认：全局助手和章节助手支持按技能流程展示步骤。需要确认题材、方案或创作方向时，可展示选项，也可以填写自己的想法；提交后从当前步骤继续。
    - 已确认的选择会保存：问题、回答和步骤记录随会话保存，重新打开会话后仍可继续，减少重复确认和前后选择不一致的情况。
    - 自动选择更贴合需求：优先根据本次提问选择技能，减少只因处于某个页面或写作阶段，就选入一批无关技能的情况。初次选择有遗漏时，助手也能按需补选其他已启用、可用的技能，并显示实际加载记录。
    - 尊重你的使用要求：修复技能名称相似时误选，以及“不要使用某技能”仍被当作点名的问题。“仅使用指定”“不使用”和停用设置继续严格生效，当前不支持执行的技能不会被自动调用。
    - 减少无关工具干扰：完善技能分类，部署环境、导入小说和工具介绍类技能不再因为包含“写作”等字样，就混入普通大纲或正文任务。
    AI 助手界面
    - 对话阅读更清爽：统一全局助手和章节助手的配色、消息间距与阅读宽度，重新整理输入框、附件入口和技能选择区，让发送、停止等操作更容易找到。
    - 历史记录更好分辨：“新建对话”改为醒目的实心按钮，当前会话增加底色、边框和左侧标记，并加深时间与分组文字。
    - 工具过程更紧凑：工具图标、名称、执行状态和展开箭头集中在同一行，减少分散的重复信息，需要时再展开查看详情。
    - 深色和窄侧栏更清楚：调整深色模式的按钮与列表对比度，改善窄侧栏中的换行和布局，减少文字、状态和操作按钮相互挤压。
    下载说明
    - Windows Intel / AMD 电脑：下载 CharacterArc-1.23.5-x64-setup.exe，绝大多数 Windows 电脑选择这一版。
    - Windows ARM 电脑：下载 CharacterArc-1.23.5-arm64-setup.exe，适用于使用 Snapdragon 等 ARM 处理器的 Windows 设备。
    - macOS Apple 芯片：使用 M 系列芯片的 Mac 下载 CharacterArc-1.23.5-mac-arm64.dmg。
    - macOS Intel 芯片：下载 CharacterArc-1.23.5-mac-x64.dmg；如需解压使用，可选择对应芯片版本的 .zip 压缩包。
    - Linux Intel / AMD 电脑：下载 CharacterArc-1.23.5-linux-x64.AppImage；Debian、Ubuntu 等系统也可选择 CharacterArc-1.23.5-linux-x64.deb。
    - Linux ARM 设备：下载 CharacterArc-1.23.5-linux-arm64.AppImage；Debian、Ubuntu 等 ARM 系统也可选择 CharacterArc-1.23.5-linux-arm64.deb。
