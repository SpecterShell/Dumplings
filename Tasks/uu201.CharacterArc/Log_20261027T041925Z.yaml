  Key: ReleaseNotes
  Value: |-
    1.22.6 - 2026-10-27
    知识库章节号
    - 修复旧项目的异常大章号：修复部分旧项目升级后，人物状态、伏笔、人物关系、时间线和世界规则中的章节号变成异常大数字的问题；启动时会自动修正能确认所属章节的旧记录
    - 界面和 AI 参考保持一致：知识库展示和提供给 AI 的章节信息统一从“第 1 章”开始计算，减少显示为第 0 章或相差一章的问题
    - 保留正常记录和未来计划：已经正常写入的记录、伏笔预定回收章节和倒计时截止章节保持原样；无法确认所属章节的旧记录也会保留，避免改错
    AI 对话体验
    - 长回复连贯阅读：全局助手和章节助手移除每段回复重复出现的“助手回复”标题和卡片，分析过程、工具执行和待确认的暂存变更仍单独展示，方便查看
    - 生成状态一眼看清：明确区分“正在生成、已完成、已停止、生成失败”；停止或失败后，未完成的工具和分析会显示对应状态，不再一直显示进行中或误报完成
    - 窄侧栏减少拥挤：消息布局根据侧栏实际宽度调整，长文字自动换行，时间、状态和操作按钮分行排列；即使应用窗口很宽，较窄的助手侧栏也能正常适配
    - 查看和操作更清楚：改善深色模式下状态标签的清晰度，键盘切换到分析、工具折叠栏时更容易看清焦点，并遵循系统减少动画的设置
    下载说明
    - Windows Intel / AMD 电脑：下载 CharacterArc-1.21.0-x64-setup.exe；绝大多数 Windows 电脑选择这一版
    - Windows ARM 电脑：下载 CharacterArc-1.21.0-arm64-setup.exe，适用于使用 Snapdragon 等 ARM 处理器的 Windows 设备
    - macOS Apple 芯片：M1、M2、M3、M4 等机型下载 CharacterArc-1.21.0-mac-arm64.dmg
    - macOS Intel 芯片：下载 CharacterArc-1.21.0-mac-x64.dmg；.zip 是对应架构的免安装解压版本
    - Linux Intel / AMD 电脑：下载 CharacterArc-1.21.0-linux-x64.AppImage；Debian、Ubuntu 等系统也可以选择同名 .deb
    - Linux ARM 设备：下载 CharacterArc-1.21.0-linux-arm64.AppImage；Debian、Ubuntu ARM 系统也可以选择同名 .deb
