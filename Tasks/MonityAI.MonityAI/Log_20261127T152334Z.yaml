  Key: ReleaseNotes
  Value: |-
    Monity 0.3.6: datasets as often as every 5 minutes, and a tidier app.
    Monity watches websites for you and tells you what changed, what went down and what broke. This app does it on your own computer: no account, no subscription, no credits, and your monitors stay on your machine.
    New in 0.3.6
    - Datasets can run every 5, 15 or 30 minutes, not only hourly or slower. A scheduled run is skipped while the one before it is still collecting; the next one runs as usual.
    - Rows and changes for each run. Every run on a dataset's page has a "Rows and changes" button that opens what that run collected and what changed.
    - Set up with AI in the dataset editor. With a model connected and the Monity AI panel closed, one button asks Monity AI to set the steps up for you.
    - Bulk import can add uptime too. When you import a list of pages, Monity can also add one uptime monitor for each site. Untick the box if you only want the page monitors.
    - Monity AI shows times in your time zone, in its answers, check rows and recent chats.
    Fixed
    - With a model connected in Settings, a page that starts showing a CAPTCHA or refusing automated visits is reported as a failed check, with that reason, not as a change.
    - Closing a check that you opened from a link or from Monity AI takes you back, not to an empty page.
    - An alert's summary in webhooks and in your AI tools says "Minor changes detected." where it said "No significant changes detected."
    - In a dataset's rows, an open row's details stay in view while you scroll. In a narrow window they open at the side.
    - Messages no longer cover the buttons at the top of a page.
    - The dataset editor's steps, icons and inputs line up, and an open step uses the full height.
    - The globe button beside a monitor is gone: it led to a page the desktop app does not have.
    Still here
    - Uptime monitors (website, keyword, port, DNS and email), Tests and Datasets, alerting like a monitor, with incidents, maintenance windows and reports.
    - Watch any page for changes: the whole page, one element or an area, text or visuals, as often as every 5 minutes, with a picture of the difference.
    - Pages behind a login: sign in once in Monity's own browser; the session stays on your computer.
    - Optional AI that you choose: Ollama, your own OpenAI-compatible key, or the Claude Code or Codex subscription you already use.
    - Works with your AI tools over MCP: Claude Code, Codex and others can create and review monitors, ask what needs attention and run a check.
    - One-file export and import of your monitors, their history and your settings.
    - Nothing goes to Monity: no error reports, no usage traces, nothing fetched from Monity's servers.
    Not in the desktop app, because they need an address the internet can reach or Monity's servers: heartbeat monitors for cron jobs, public status pages, checks from a second location, starting a dataset signed in to a site, and a dataset's live Google Sheet link. Monity in the cloud has them.
