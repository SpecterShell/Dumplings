  Key: ReleaseNotes
  Value: |-
    Version 161.0, first offered to Release channel users on November 24, 2026

    New
    - You can now copy the current tab's URL with a keyboard shortcut. No shortcut is assigned by default, so you can choose your own key combination in Customize keyboard shortcuts in Firefox Settings. Learn more
    - Tab groups are now listed in the application menu, making it easier to find and reopen them.
    - The Themes page in the Add-ons Manager now includes a Classic themes section, with the Proton theme from earlier versions of Firefox, a Firefox OLED theme, and a selection of solid-colored themes.
    - Firefox’s built-in VPN can now be turned on or off for specific sites, so it only runs where extra privacy or a different location is wanted. Learn more.

    Fixed
    - Fixed the Windows taskbar staying visible over full-screen Firefox windows after switching back from another application.
    - Fixed Firefox hanging on macOS 26+ when opening Spotlight with a large number of bookmarks.
    - Fixed WebRTC video calls with some services sending low-resolution H.264 video since Firefox 158.
    - Fixed some tabs not being restored after a restart when the saved session referred to a tab group that no longer existed.
    - Fixed typing with an input method, such as for Japanese or Korean, stopping after the first character in Canva Docs.
    - Various security fixes.

    Changed
    - On macOS, keyboard shortcuts assigned to Firefox menu items in System Settings now replace the built-in shortcuts for those items.
    - Browsing history imported from Chrome now includes how often you visited each page, so the sites you use most rank higher in address bar suggestions and shortcuts.

    Enterprise
    - For Firefox Enterprise updates and fixes, see the Firefox Enterprise Release Notes. For policy changes, see the Firefox admin docs changelog.

    Developer
    - Fixed the Developer Tools eyedropper showing the wrong colors after the page is scrolled.

    Web Platform
    - Firefox now supports the random() CSS function, which allows authors to introduce randomness into their styles, generating a random value in a given range (with an optional increment) that is usable anywhere that math functions can be specified. Learn more.
    - Firefox now supports nested arbitrary substitution functions in the primary parameters of var(), attr(), and env(); for example, var(attr(data-theme-prop type(<custom-ident>))) and env(var(--safe-area-block-start)).
    - Firefox now supports the CSS Typed Object Model, which lets scripts read and write CSS values as typed JavaScript objects instead of strings. Color values, such as CSSColorValue, are not supported yet.
    - Firefox now supports web custom formats in the Async Clipboard API (navigator.clipboard.read() and write()), letting websites copy and paste their own data formats between pages of the same origin.

    Community Contributions
    - With the release of Firefox 161, we are pleased to welcome the developers who contributed their first code change to Firefox in this release, 15 of whom were brand new volunteers! Please join us in thanking each of these diligent and enthusiastic individuals, and take a look at their contributions:
