  Key: ReleaseNotes
  Value: |-
    Version 156.0, first offered to Release channel users on September 15, 2026

    New
    - Firefox on macOS can now be set to open automatically when the computer starts up, from the Startup section of Settings.
    - Localized Wikipedia and occasional sponsored suggestions in the address bar are now available in France, Germany, and Italy. These suggestions can be turned off in Firefox Suggest settings.

    Fixed
    - Fixed an issue where dragging an image to a new position in a rich-text editor could replace it with a long line of text instead of moving it.
    - Fixed high-sample-rate FLAC audio in MP4 failing to play on sites such as Bilibili.
    - Fixed subtitles not appearing in the Picture-in-Picture window when they are turned on in the video player after the window has already opened.
    - Fixed bookmarks moving out of their folder when the folder and the bookmarks inside it were selected and dragged together in the Bookmarks sidebar.
    - Fixed the find bar becoming permanently unavailable in a tab after reversing the panes in Split View.
    - Fixed some sites failing to load when DNS over HTTPS is enabled and the site does not support HTTPS.
    - Fixed Firefox losing all network connectivity for some users with the built-in VPN enabled.
    - Fixed an issue on Windows where Firefox could block an auto-hiding taskbar from showing.
    - Various security fixes.

    Changed
    - Firefox's built-in PDF viewer now starts up to 45% faster.
    - Improved memory and CPU usage when Firefox displays large JPEG images scaled down to fit a page.
    - On Windows devices with ARM64 processors, WebRTC video calls may now use hardware H264 decoding instead of falling back to software.

    Enterprise
    - You can find information about policy updates and enterprise-specific bug fixes in the Firefox for Enterprise 156 Release Notes.

    Developer

    Web Platform
    - text-box-trim now uses the font metrics of a ::first-line pseudo-element when one applies, matching other browsers and the specification.

    Community Contributions
    - With the release of Firefox 156, we are pleased to welcome the developers who contributed their first code change to Firefox in this release, 10 of whom were brand new volunteers! Please join us in thanking each of these diligent and enthusiastic individuals, and take a look at their contributions:
