  Value: |-
    Rovai AI v0.3.1
    本次更新优化任务、执行证据与会话体验，减少执行记录的存储占用，并提升文件变更查看和版本更新体验。
    其他更新
    -【功能】任务统一使用“责任范围与要求”正文。 创建和编辑任务不再拆分多个要求字段，历史任务中的结构化要求仍会合并展示，减少重复填写和理解成本。
    -【性能】减少执行证据的重复存储。 同一命令或工具操作从开始到结束只保留一条生命周期记录，输入与结果分别存储，不再重复生成组合副本；被替换的新证据文件支持安全回收，减缓证据目录持续膨胀。
    -【隐私】不再持久化模型的私有思考正文。 执行过程中只保留“思考中”和“执行中”等状态反馈，不将私有推理写入数据库、证据文件、日志或界面缓存。
    -【修复】执行过程更新更加稳定。 同一命令或工具操作原位更新并保持固定顺序，减少重复记录、状态跳动以及迟到结果造成的错位。
    -【修复】文件变更刷新不再打断阅读。 新的文件变化到达后自动重新计算；刷新期间保留已打开文件、当前选择、展开状态和滚动位置，失败时继续显示上一份可读结果。
    -【界面】新增品牌化启动加载画面。 打开应用或恢复会话时使用全窗口品牌画布，支持日夜主题、柔和呼吸动效和减少动态效果设置。
    -【交互】简化空白 Camp 欢迎页。 聚焦“想先做些什么？”，展示当前项目或快速对话、队长名称和在队人数，起步操作更加直接。
    -【界面】优化版本更新提示与关于页面。 重新整理信息层级、按钮、间距和状态提示，下载进度更加醒目；移动端更新操作改为单列全宽布局，改善窄屏触控体验。
