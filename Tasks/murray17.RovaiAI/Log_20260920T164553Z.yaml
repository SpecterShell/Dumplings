  Value: |-
    Rovai AI v0.3.0
    本次更新重点完善使命工作流，新增完整的使命板、独立执行工作区和累计文件变更查看，并改善消息排队、执行跟踪与会话阅读体验。
    其他更新
    -【功能】新增完整的使命板工作流。 支持创建、编辑和管理使命，通过状态分栏、筛选、标签、项目及队员快速组织工作，并可在抽屉或完整页面中查看详情。
    -【功能】使命支持独立 Worktree 执行。 每项使命可在隔离工作区中持续推进，保留跨轮次文件修改；支持安全清理工作区，并在存在未保存改动时阻止误删。
    -【功能】支持查看使命累计文件变更。 提供可搜索的文件目录与 Git 差异预览，大量文件时仍可流畅浏览，并可从执行记录打开对应工作区文件。
    -【功能】使命启动与执行状态更加清晰。 启动后即时展示排队和执行状态，支持查看当前 Run、已完成步骤及最新进展，避免重复启动。
    -【功能】队员可以发现并读取全部使命。 队员能够查找使命、读取完整定义，并根据整体目标判断完成状态；更新使命状态不再要求先发送一条关联消息。
    -【功能】公开消息支持可靠排队与批量执行。 发给同一队员的消息按顺序处理，可合并进入一次执行；发送后显示处理状态，在所有接收队员尚未读取时可以撤回。
    -【交互】执行台支持总览与多种布局。 可在右侧、底部或浮层中查看执行过程；进入正在运行的会话时自动打开总览并定位最新执行，后台刷新不会打断当前阅读。
    -【交互】使命板操作更加顺畅。 各状态列可以独立滚动，拖动卡片到列边缘时自动滚动；宽屏充分利用空间，窄窗口支持横向浏览。
    -【界面】使命卡片与会话状态更易识别。 优化执行成员、未读回复、排队层数和运行状态展示，并统一侧栏会话图标、加载状态及标题对齐。
    -【功能】Markdown 文件预览支持元数据。 可识别并单独展示文件顶部的 YAML 元数据，同时保留搜索、源码阅读和阅读位置。
    -【修复】修复使命与消息执行中的多项可靠性问题。 改善消息接收者显示、排队卡片交互、执行结果读取、文件定位及通知跳转，并修复 Windows 中使命工作区路径和启动异常。
