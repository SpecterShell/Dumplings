  Value: |-
    Rovai AI v0.2.6
    本次更新新增桌面前进与后退导航，统一“回到最新”入口，并提升复杂操作下的导航稳定性与执行摘要清晰度。
    其他更新
    -【功能】新增桌面前进与后退导航。 会话、设置和记忆页面共用窗口内访问历史，支持界面按钮、键盘快捷键和鼠标侧键操作；新跳转会自动裁剪前进分支，并保留页面原有状态。
    -【交互】统一“回到最新”入口。 会话、单聊和执行视图共用阅读区底部的返回按钮，离开底部时才显示；新消息或新输出只提示更新，不打断当前阅读位置，返回后继续保留执行步骤展开状态。
    -【修复】修复连续导航时旧请求覆盖当前页面的问题。 改善页面打开、资源清理、新建会话和队员切换等异步场景，确保取消或迟到的操作不会写入错误历史，也不会覆盖用户最新选择。
    -【界面】执行完成摘要更简洁。 收口后的执行组只显示已完成步骤数量，失败、停止和跳过等结果继续在展开后的具体步骤中查看。
