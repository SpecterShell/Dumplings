  Value: |-
    Rovai AI v0.2.7
    本次更新新增 DeepSeek Harness 接入和可持续更新的队员附件，并改善文件预览、执行过程及会话阅读体验。
    其他更新
    -【功能】新增 DeepSeek Harness 运行时。 支持在 macOS 和 Windows 中接入本机 DeepSeek Harness，读取原生模型与 BYOK 配置，并支持会话恢复、Skills、MCP、用量统计、文件操作和差异预览。
    -【功能】队员附件直接引用实际文件与目录。 发送附件时不再重复复制，后续修改可通过刷新预览获取；支持显示和复制完整路径、本机定位、图片更新及 HTML 相对资源。
    -【功能】文件预览支持跨会话保留。 切换 Camp 后继续保留标签、内容、阅读位置和 HTML 页面状态；刷新失败时保留原页面，减少重复加载。
    -【修复】命令产生的文件可从正确的执行工作区打开。 项目目录与独立工作区中路径相同的文件不再混淆，文件预览和差异内容在桌面端与窄窗口中保持正常滚动。
    -【修复】HTML 交互预览更加稳定。 页面不再因空闲超时自动关闭，诊断连接异常不会影响已加载页面和现有操作。
    -【交互】执行过程反馈更加清晰。 运行文字增加动态提示并显示当前工具；展开命令、加载结果或异步更新时保持阅读位置，运行失败信息按顺序显示在记录末尾。
    -【界面】执行入口展示运行状态。 通过动态双弧和头像显示正在运行的队员，空闲后显示参与过执行的队员数量，并保留历史入口。
    -【修复】固定会话在桌面端正常显示。 桌面会话列表补齐固定会话图标，并统一未读提示、标题和项目行的对齐。
    -【界面】改善文件与长内容阅读。 文件变更使用“目录/文件名”顺序并优先保留文件名；行内文件引用自动补充间距，文件更新提示更加醒目，长代码和表格不再撑宽会话。
    -【界面】统一配置名称与操作样式。 模型推理强度显示运行时提供的真实名称，新建对话统一使用“队长”称呼，并优化普通操作按钮的日夜主题颜色。
