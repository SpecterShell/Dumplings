  Key: ReleaseNotes
  Value: |-
    The primary motivation for this release is a bug fix for a performance regression introduces in v0.166.0 where we improved the return keyword in partial templates. Note that this was not an issue if you don't use this keyword and also only an issue for bigger sites.
    What's Changed
    - deps: Upgrade github.com/bep/imagemeta v1.1.1 ⇒ v1.1.2 e6d7bcba @bep
    - tpl/tplimpl: Don't add file context to partial return sentinel errors 5f34065b @bep #15604
    - images: Add fgColor and bgColor options to images.QR and the qr shortcode 93be9f1f @bep #15600
    - tpl/tplimpl: Cleanup vimeo shortcode comments and arg logic 6c6b1eea @jmooring
    - Delete hugolib/integrationtest_builder_test.go b8765e1f @bep
    - tests: Address deprecation errors 7a15e872 @jmooring
