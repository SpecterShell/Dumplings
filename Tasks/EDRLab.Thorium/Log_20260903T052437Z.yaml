    Expand the 'Assets' section below to reveal the download links.
    - Note that the terms x64 and amd64 in the filenames refer to the Intel computer architecture (also sometimes known as x86_64, which includes both Intel and AMD chipsets).
    - The term arm64 refers to modern ARM hardware including Apple Silicon "M" computers.
    If in doubt:
    - Apple users should download the arm64 variant.
    - Windows / Linux users should download the x64 / amd64 variants, respectively.
