  Key: ReleaseNotes
  Value: |-
    提升会话可靠性，Agent 回复中支持更多 slash 命令
    - 修复同一插件安装在多个项目时，/plugins 列表状态显示错误的问题
    - 修复 MCP server 在获取 prompts 或 resources 列表失败时，会话中丢失该 server 全部工具的问题
