  Key: ReleaseNotes
  Value: |-
    企业策略控制与 MCP 修复
    - 修复 MCP 或工具列表刷新后，上下文占用比例显示异常的问题
    - 修复插件刷新导致部分 MCP 重新加载的问题
    - 修复 MCP OAuth 获取或刷新令牌时未携带 resource 参数导致的认证失败问题
    - 后续建议功能改为沿用主对话的计费归属
    - 支持通过企业策略管理 CLI 客户端使用权限，可对指定用户组启用或禁用
    - 修复 TUI 代码块带标题等附加信息时无法正确高亮的问题
    - 修复 CodeMode 以短间隔轮询无新输出的长任务时误触发重复调用确认的问题
    - 修复 TUI /model 中预设模型列表过长导致后续配置步骤不可见的问题
