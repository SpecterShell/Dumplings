  Key: ReleaseNotes
  Value: |-
    技能管理与 BYOK 优化
    - 使用 BYOK 模型时，停用会话内任务跟踪和自动任务／待办提醒
    - 修复 SDK 流式消息与会话历史的消息 uuid 不一致问题
    - 支持技能启停管理，可以针对技能设置启用、仅展示名称、手动调用、禁用
    - 修复企业预设 BYOK 经 Qoder 服务端连接 Responses 供应商时，工具调用关联信息在后续请求和会话历史中丢失的问题
    - 使用个人 BYOK 连接自定义 Responses API 端点时，系统提示词现在作为 input 的首条 developer 消息发送，使其可参与前缀缓存
    - 优化技能清单发送逻辑，在技能简介变化时，仅发送当前技能，不再重复发送完整技能清单
    - 修复 SDK 集成中模型拥堵状态缺失的问题
    - 修复 /mcp 中项目 MCP 服务禁用后仍显示已启用的问题
    - 修复长对话中压缩重试失败的问题，提升压缩成功的稳定性
