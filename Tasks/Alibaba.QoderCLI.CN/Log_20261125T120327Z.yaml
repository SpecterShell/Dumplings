  Key: ReleaseNotes
  Value: |-
    模型切换钩子与多项会话稳定性修复
    - 新增模型切换钩子 PreModelSwitch / PostModelSwitch，在手动切换模型前后触发
    - 修复在 /mcp 中切换 MCP 服务的 Enabled 开关后，当前会话中不生效的问题
    - 用户主动终止会话时，正在进行的后台任务会被停止
    - 修复子进程执行缓慢时，自动编辑器探测导致启动耗时过长的问题
    - 修复恢复包含旧目录附件的历史排队消息后，发送纯文本仍提示“不支持的模型内容块”的问题
    - 修复在 /sites 列表按 Esc 误入站点详情的问题
    - 修复 SDK 流式聊天中，上下文压缩后上下文占用比例仍显示旧值的问题；收到新用量后即可更新，无需等待本轮对话结束
