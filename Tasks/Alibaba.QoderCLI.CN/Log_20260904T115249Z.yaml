  Key: ReleaseNotes
  Value: |-
    性能与可靠性提升
    - 优化大型会话恢复和长内容流式渲染的响应速度，降低 CPU 占用
    - 限制会话选择器加载的对话记录量，提升大量历史会话下的浏览性能
    - 修复切换会话后或同一项目打开多个会话时，持久化定时任务可能不执行的问题
    - 在定时任务列表的 OWNER 列标记当前会话创建的任务
    - 将 /goal 默认最大交互轮次从 20 提升至 100
    - 默认将子 Agent 的嵌套创建限制为一层
    - Quest Skill 仅可由用户通过 /quest 命令手动触发
