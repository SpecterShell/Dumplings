Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Fixed Issues
    1. Fixed an issue where Changed Block Tracking information might be lost if a Linux device running the backup agent was rebooted between backups, potentially resulting in missing backup data. After updating to this version, the agent will perform a one-time full backup to ensure backup data integrity.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    问题修正
    1. 修正若在两次备份间重新启动执行备份代理程序的 Linux 设备，可能会丢失异动区块追踪信息，进而造成备份数据遗漏的问题。更新至此版本后，代理程序将执行一次完整备份，以确保备份数据的完整性。
