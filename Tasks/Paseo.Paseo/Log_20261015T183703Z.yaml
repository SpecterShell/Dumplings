    Added
    - Added Hoplite as an opt-in provider in the ACP provider catalog (#6953 by @odinglyn0)
    - Added search to the Add provider catalog (#6953, #7030)
    Changed
    - Changed Add provider failures to show as a toast (#7030)
    Fixed
    - Fixed Remove being offered for plugin providers such as Antigravity and Muse Code (#6568 by @Ctrl-Creeper)
