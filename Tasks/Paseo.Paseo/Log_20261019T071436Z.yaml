  Key: ReleaseNotes
  Value: |-
    0.12.0 - 2026-10-19
    Background workspaces, a new Markdown renderer with selection across paragraphs on phones, a reworked phone layout, and more than 120 fixes.
    Before upgrading: paseo run --background is deprecated in favor of --no-wait, and paseo permit allow and deny now exit non-zero when the daemon doesn't confirm within 15 seconds
    Added
    - Added background workspaces, hidden from the sidebar unless Show background is on (#5039, #7141 by @gpambrozio, @marvin-ambrozio)
    - Added a Send feedback button to the diff pane, so review comments reach an agent without opening its chat (#6455)
    - Added a fullscreen composer on phones (#6531, #6902, #6945, #6987, #7130, #7170)
    - Added the sender's name to messages one agent sends another (#6373)
    - Added Claude Mythos 5.1 when the installed Claude Code advertises it (#6403)
    - Added option previews to Claude question cards (#6171 by @gabrielgiordan)
    - Added paseo usage to show account quotas, balances, and reset times from the CLI (#6474)
    Improved
    - Changed text selection in replies on iOS and Android to cross paragraphs, headings, and lists (#6973)
    - Added a copy button to code blocks on iOS and Android (#6973)
    - Changed wide Markdown tables on iOS and Android to scroll sideways (#6973)
    - Changed phone layouts to a floating header (#6431)
    - Moved New agent and New terminal on phones into the tab switcher (#6431)
    - Moved workspace scripts on phones into ⋯ → Scripts, which shows what is running (#7122)
    - Changed phones to open files and subagents in a closable sheet, with Open as tab for subagents (#6827, #6885, #6958)
    - Changed diff comments on phones to open in a sheet instead of an editor inside the code (#6455)
    - Changed Settings on phones to large tiles grouped into App and Host (#7129)
    - Changed Command Center to rank workspaces and agents by match and then recency, and to show timestamps, project icons, and highlighted matches (#7277)
    - Added each Paseo subagent's model, thinking, mode, and context under its title in the subagents list (#7290)
    - Made subagent rows in the Subagents panel taller on phones, and gave their archive and detach buttons the standard press highlight (#7364)
    - Changed Paseo tool calls in chats to lead with the action and its context, such as Send message · the first line of the prompt (#7283)
    - Changed the New workspace form on phones to full-width fields, with Import session in the header (#7239)
    - Reduced rendering work in long chats while a reply streams (#7052 by @colonelpanic8, #7342)
    - Made reopening the sidebar about 45% faster (#7157)
    - Made projects and workspaces load faster after the app reconnects (#7242)
    - Changed messages one agent sends another through the CLI or MCP to steer its running turn instead of interrupting it (#5164 by @derwells)
    - Changed Gitea and Forgejo fork PR checkouts to include the fork owner in the branch name, such as bob/patch-1 (#6829 by @alexanderadam)
    Plugins
    - Fixed plugins that import Paseo protocol types failing to install with "Could not resolve type dependency" (#7023)
    - Fixed providers.waitForReady throwing in plugins on the mobile app (#6760 by @GeorgeR)
    - Fixed the chat outline not jumping to prompts rendered by a timeline plugin (#6690 by @lukeRRD)
    - Fixed Escape stopping the running agent instead of first closing an open plugin preview (#7110 by @RRD-dev, @luoph)
    - Fixed paseo plugin reload failing with a 60-second timeout while the reload was still running (#6306 by @Mtuchel)
    - Fixed follow-ups sent while a plugin ACP agent runs failing with "Provider does not support prompt.steer" (#7270 by @simonepri)
    - Fixed Find showing no matches for prompt text drawn by a timeline plugin (#7253 by @a-grasso)
    - Fixed late-loading composer plugin pills covering Copy and Fork after reopening a chat (#7341 by @sholiday)
    Fixed
    - Fixed iOS replies with list items that render blank, and text that keeps a stale width after a resize or rotation (#6973)
    - Fixed plugin hosts, the CLI, and the desktop app growing to about 1 GB of memory after running for 30 to 75 minutes (#6847 by @babo-jeonguk)
    - Fixed the daemon running out of memory during long OpenCode v2 reply or reasoning streams (#6262)
    - Fixed archived ACP agents starting a provider process that kept running each time their timeline loaded (#6766 by @apple-ouyang)
    - Fixed oversized attachments disconnecting the host in a loop instead of failing with a size error (#6285)
    - Fixed Download in Files failing on hosts connected over relay, SSH, or a socket (#6595 by @odoo-mvds, @YASICJUNWOO, @JrDw0)
    - Fixed Changes showing no diff lines with custom Git diff settings, such as color.diff=always or an external diff command (#6536, #6562 by @Mar-garet)
    - Fixed an incomplete font name in Appearance breaking the app's styling (#6695)
    - Fixed the Linux desktop window never appearing when the hidden window renders no frames (#6726 by @EhEo)
    - Fixed opening another agent or workspace stalling while a different agent on the same host is streaming (#7074 by @colonelpanic8)
    - Fixed the project's New workspace button choosing the first host instead of the active workspace's host (#7308)
    - Fixed the composer staying focused after switching tabs with keyboard shortcuts in touch browsers (#7352)
    - Fixed the daemon running out of memory when several directory searches overlap on a large folder tree (#7265)
    - Fixed dragging the Explorer edge stuttering with several panes open (#7284 by @colonelpanic8)
    - Fixed agent creation showing an error and a retry draft when the provider rejected the first prompt (#6379)
    - Fixed new agent drafts staying on "Loading…" when the host is disconnected; they now say "Host is not connected" and keep your draft (#7303 by @colonelpanic8)
    - Fixed reloading a chat during a streaming reply showing a frozen copy above the live one and dropping the ending (#7256)
    - Fixed question cards spinning forever when an answer fails to send; they now show the error and keep your answers (#7098 by @xzthemeofsss)
    - Fixed parent agents missing the finish notification when a child finished its first turn very quickly (#6008 by @ahmet-izgi)
    - Fixed parent agents being told a child finished when its task was stopped or reloaded (#6660 by @Mar-garet)
    - Fixed Codex chats containing U+2028 or U+2029 failing to reopen on Node 24 (#5999 by @grahameger, @jtsang4, @kotusenka)
    - Fixed resumed Codex goals appearing idle and refusing Stop after a continuation (#7339 by @hemaaanth)
    - Fixed Add Project directory search hanging the daemon on macOS when it entered ~/Library (#5789 by @lardissone)
    - Fixed New workspace failing with "Invalid mode" when the saved mode isn't offered by the provider (#5847 by @mcowger)
    - Fixed answering multi-select OpenCode v2 questions failing with "Invalid answer" (#6149 by @gammons)
    - Fixed browser screenshots failing the turn on OpenCode v2 agents (#6330)
    - Fixed OpenCode v2 agents receiving "HTTP 500" instead of the Paseo tool error (#6519)
    - Fixed OpenCode agents receiving "HTTP 500" instead of a readable error when they call a Paseo tool with invalid arguments or an unknown name (#7183)
    - Fixed rewinding a Claude conversation failing with "Session not found" when the provider sets CLAUDE_CONFIG_DIR (#6325)
    - Fixed changing a running Claude agent's thinking level and then its mode killing its running command (#7179)
    - Fixed Claude models that need a recent Claude Code being hidden when the provider command is a wrapper script (#7209 by @SulthanZahran1)
    - Fixed background Claude subagent cards staying empty while the subagent works, including after the parent finishes (#6242, #7266)
    - Fixed Copilot staying in Plan mode and refusing edits after you select Allow All (#7234)
    - Fixed imported Claude Code sessions taking their first prompt as the name instead of their /rename title (#6930 by @platanus-kr)
    - Fixed a wrongly shaped answer to a Claude question reporting success and discarding the question (#6936 by @thomasvan)
    - Fixed Cursor agents showing no plan usage in their context details (#6353 by @gengjiawen)
    - Fixed the Claude context meter counting only output tokens when a proxy reports input usage at the end of the response (#6703 by @kywoo26)
    - Fixed the Claude context meter showing a 1M maximum after switching back to a 200k model (#6814)
    - Fixed the context meter staying empty during the first turn on custom Claude [1m] models (#6767)
    - Fixed a schedule never running again after one of its runs could not be recorded (#6334)
    - Fixed schedules sharing a cron minute running a slot twice and skipping the next occurrence (#6532 by @keithpk)
    - Fixed Committed showing no changes for worktrees created from an existing branch (#6462 by @cr-2takumax)
    - Fixed Discard and commit diffs in Changes for workspaces opened at a repository subdirectory (#6777, #6801, #6882 by @Mar-garet)
    - Fixed renamed and edited files showing every line as added in Changes (#6559)
    - Fixed renamed files opened from a commit showing as new files (#6895)
    - Fixed Changes showing no diff for filenames containing quotes, backslashes, or tabs (#6583 by @Mar-garet)
    - Fixed Changes dropping removed lines that start with --, such as SQL comments (#6569 by @Mar-garet)
    - Fixed the Diff tab staying on a spinner after the first edit in a clean workspace (#6745)
    - Fixed worktree creation failing after running git init in a project added before Git (#6785)
    - Fixed new worktrees not opening the terminals configured in paseo.json after setup (#6999 by @davidyang)
    - Fixed a service newly added to paseo.json failing to start until the daemon restarted (#6542)
    - Fixed workspace service URLs returning 502 when the service listens only on IPv6 localhost (#6753 by @marcelocastrobarbosa)
    - Fixed terminals that could not be closed when their command was missing or exited immediately (#6792 by @KiraPC)
    - Fixed MCP terminal key commands typing arrow and modifier key names instead of sending the keys (#7343 by @Aling33)
    - Fixed CJK text gaining spaces between characters after returning to a workspace in the native terminal (#6452 by @jasonhnd, @liujin0506, @seob717)
    - Fixed copying Korean text from the terminal on iOS and Android adding spaces between characters or dropping the first one (#7254, #7260 by @helloimdevman)
    - Fixed long-pressing a Korean word in the terminal on iOS and Android selecting only one character instead of the whole word (#7353)
    - Fixed the self-hosted web app failing to connect through a reverse proxy on port 80 or 443 (#6638 by @kiawin)
    - Fixed the Hub connection never reconnecting after a silent network failure (#7315)
    - Fixed remote connections failing on slow networks when another resolved address is unreachable (#7336)
    - Fixed assistant file links with spaces or non-ASCII characters failing with ENOENT (#6520 by @apple-ouyang, @sunshinehomeyu-blip)
    - Fixed local images in agent replies failing to load when their path contains spaces or non-ASCII characters (#6877)
    - Fixed Markdown file previews not showing images referenced by relative paths (#6750 by @apple-ouyang)
    - Fixed folder links in chats and Markdown previews opening an error tab or doing nothing; they now open Files with the folder's contents visible (#7205, #7210, #7229)
    - Fixed Markdown links to files such as [Capture](capture.png) doing nothing for some file types (#7233)
    - Fixed iOS sidebar rows staying highlighted and swallowing the next tap after a brief hold (#7159 by @kassamkhoja)
    - Fixed Android chats scrolling when you long-press to select text (#7131 by @RRD-dev, @luoph)
    - Fixed sidebar rows, footer buttons, and Settings items showing no feedback when tapped on touch devices (#7150)
    - Fixed home screen actions being cut off on short phone screens (#7167)
    - Fixed Android dictation stopping with "Dictation was interrupted by another audio source" when another app plays audio (#7200)
    - Fixed Page Up and Page Down not scrolling the chat after clicking a message or closing Find (#7033, #7263 by @panta82)
    - Fixed Add Project keyboard selection moving to directories scrolled out of view (#7081 by @superheher)
    - Fixed Enter replacing an email address in the composer with a file mention (#6471 by @jasonhnd)
    - Fixed letter shortcuts not running with non-Latin keyboard layouts such as Russian (#6755)
    - Fixed shortcut recording saving the QWERTY key instead of the typed letter on layouts such as Dvorak (#6652)
    - Fixed rebinding Jump to tab or Jump to workspace keeping only the pressed number instead of 1–9; record existing overrides again (#7065 by @dbunk903)
    - Fixed Previous and Next workspace shortcuts stopping at workspace 9 (#6586 by @IEatCodeDaily)
    - Fixed unreadable Android status bar icons in the Light theme and after the system theme changes (#6707 by @terayang)
    - Fixed the pairing QR code getting clipped on iOS and Android (#6758 by @fdkevin0)
    - Fixed a write EPIPE error dialog on Linux desktop when the launcher stops reading console output (#6639)
    - Fixed paseo permit allow and deny reporting success over SSH while the request stayed pending (#6607 by @budivoogt)
    - Fixed files and folders whose names start with two dots, like ..notes.txt, being hidden and rejected (#6604, #6720 by @Mar-garet)
    - Fixed Markdown previews dropping table rows after a < that isn't HTML, such as List<Item> (#6370 by @gengjiawen)
    - Fixed a literal heading tag appearing when an HTML heading contains a linked image (#6650)
    - Fixed Astro diffs with an empty {} expression failing to render (#6763)
    - Fixed slash command argument hints missing from autocomplete for ACP providers (#6920 by @bwestlund17)
    - Fixed terminal profiles configured with the agy icon showing a generic bot instead of the Antigravity icon (#6938 by @noahg9)
    - Fixed the Pi thinking level not updating when a Pi extension changes it (#6741)
    - Fixed Pi subagents from @tintinweb/pi-subagents staying running after their turn limit (#6594 by @Chen-DaYi)
    - Fixed manual /compact on OMP agents showing no progress and leaving the context meter stale (#6106)
    - Fixed follow-ups to idle OMP agents staying queued instead of starting the agent (#7169 by @nhthung)
    - Fixed voice mode TTS rejecting model and voice names from OpenAI-compatible servers (#6060 by @khimaros)
    - Fixed the xhigh thinking option showing "Extra high" instead of its configured label (#6005 by @EliorFureraj)
    - Fixed the Remove button going off screen for long custom model names in provider settings (#6507)
    - Fixed the starting-ref picker not finding GitLab merge requests and issues by number (#6525)
    - Fixed the starting-ref picker hiding change requests that match only in their description (#6558)
    - Fixed @-mentions not finding plan files under .cursor/plans (#6641 by @chyendongnhanh338)
    - Fixed Paseo replacing a symlinked config.json with a regular file when saving settings (#6023)
    - Fixed the published config schema rejecting valid settings such as agentProfiles and plugins (#6621 by @ragokan)
    - Fixed duplicating a folder turning its relative symlinks into absolute links to the original (#6771 by @Mar-garet)
    - Fixed renaming an untracked file like [id].tsx failing when a tracked file matches it as a pattern (#6573 by @Mar-garet)
    - Fixed saving workspace files with long names failing with ENAMETOOLONG (#6658 by @Mar-garet)
    - Fixed worktree creation and Changes failing for projects whose folder name ends in a space (#6686)
    - Fixed merging a worktree when the base branch's worktree path contains a newline or ends in a space (#6668 by @Mar-garet)
    - Fixed paseo agent ls listing only the first 200 agents (#6033 by @hteo1337)
    - Fixed paseo worktree ls and paseo worktree archive failing with "cwd or repoRoot is required" (#6467 by @jasonhnd)
    - Fixed paseo worktree ls listing an archived worktree for up to 15 seconds (#6545 by @Mar-garet)
    - Fixed paseo logs --since printing activity from before the requested timestamp (#6514 by @Mar-garet)
    - Fixed paseo logs --follow splitting words across lines as text streams in (#6528 by @fiorelorenzo)
    - Fixed paseo logs printing reasoning after the reply that followed it (#6546)
    - Fixed the daemon keeping files open after a canceled HTTP download (#6567 by @Mar-garet)
    - Fixed Linux desktop windows showing a generic icon instead of the Paseo icon (#6645 by @whme, @panta82)
    - Fixed Google Play listing Android devices without a camera as incompatible (#6339)
    - Fixed nix build .#desktop running out of memory on Macs with less than 15 GB of RAM (#6537 by @truelecter)
    - Fixed usage providers changing places after Refresh all (#6947 by @sleroq)
    - Fixed usage cards losing their last values and showing "Updated" when a refresh fails (#7246)
    - Fixed Usage merging distinct Cursor accounts into one card (#7344)
    - Fixed the OpenCode Go usage icon being nearly invisible on dark themes (#6362 by @az33zy)
    - Fixed generic icons for Devin, Hermes, Kiro, and Antigravity in provider lists (#7330 by @OMEG-Lu, @kevenhu001-cyber)
    - Fixed sidebar setup buttons overflowing the card with long translated labels (#7312 by @gentslava)
