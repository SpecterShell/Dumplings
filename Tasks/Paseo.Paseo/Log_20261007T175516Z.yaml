  Key: ReleaseNotes
  Value: |-
    0.11.0 - 2026-10-07
    Paseo 0.11 adds support for the plugin registry. Browse community plugins there, install one with paseo plugin add owner/slug, or submit your own.
    Before upgrading: paseo plugin add owner/repo now installs from the registry, so use github:owner/repo to install straight from GitHub and ./path for a local directory.
    Added
    - Added Muse Code as a provider, with model, approval mode, and reasoning effort controls (#5719, #5775 by @millerben95)
    - Added Antigravity as a provider that drives the installed agy CLI, always in Full access (#5714, #5795)
    - Added Usage, opened from the sidebar footer as a dialog on desktop and a sheet on mobile, showing each subscription account's quota windows with Refresh (#5465, #5685, #5786, #5805, #5921, #6216)
    - Added an opt-in Usage summary to the sidebar footer that shows the windows you pin (#5903, #5975, #6089)
    - Added Usage discovery of ChatGPT logins from Codex CLI, OpenCode, Pi, and OMP (#5844)
    - Added Usage discovery of Claude logins from the Claude Code credential file, the macOS keychain, Pi, and OMP (#5844)
    - Added OpenCode Go to Usage (#5465)
    - Added the reason a Usage card is unavailable, such as an expired login with the command that refreshes it, listing each login's error when none works (#5876, #6156)
    - Added mid-turn steering to OMP agents (#5550 by @n24q02m)
    - Added Fast mode and an Auto thinking level to OMP (#5550 by @n24q02m, @abhi-wan-kenobi)
    - Added MCP servers to OMP schedules and Hub runs (#5550 by @omercnet)
    - Added a Content width setting for the maximum width of chat and Markdown files on wide screens (#5680)
    - Added syntax highlighting for Vue files (#6205 by @Davnn1)
    - Added agents.providers.<id>.options in config.json as default options for every provider, with per-agent overrides (#5780)
    - Added the terminal key bar and Paste to terminal panes on iPad and Android tablets (#5712 by @lardissone)
    Plugins
    - Changed paseo plugin add owner/slug to install the reviewed plugin from the plugin registry, so local directories need a path such as ./slug and direct GitHub installs need github:owner/repo (#6224)
    - Added screens and sidebar header and footer items to the plugin SDK (#5685)
    - Added usage sources to the plugin SDK (#5465, #5876)
    - Added spawnProcess(), execCommand(), and terminateProcess() to the plugin SDK for launching CLIs, including Windows .cmd and .bat scripts (#6151)
    - Added client.playAudio() to the plugin SDK for playing audio on every client (#5976)
    - Added an agent.closed plugin lifecycle event (#5971 by @ilteoood)
    - Added command and environment overrides and availability diagnostics for plugin providers (#5707)
    - Added a display name, icon, screenshots, and videos to the plugin manifest (#6263)
    - Added an OVERVIEW.md template to paseo plugin init for plugin registry listings (#6226)
    Changed
    - Changed the context window details to show usage for the account the agent runs under, including custom CLAUDE_CONFIG_DIR and CODEX_HOME homes (#5465)
    - Changed the context window details on desktop to a hover card with Refresh (#5975, #6185)
    - Changed the context window meter to show before an agent's first turn (#6089)
    - Changed Codex Fast to a Speed menu listing the Normal, Fast, and Ultrafast speeds each model offers, shown as a lightning bolt on desktop that turns yellow while Fast or Ultrafast is selected (#5708, #6152 by @Nurshot)
    - Changed Explorer tabs to work like workspace tabs, with a + menu, drag and drop, and Close for Files and Changes (#5942)
    - Changed Pi and OMP extension context to show as expandable tool rows instead of assistant text, and to hide Pi messages marked hidden (#6090)
    - Moved Import session from the sidebar footer to the New workspace screen (#5805)
    - Changed the sidebar workspace row to show last activity by default on new installs (#6087)
    - Changed compact sidebar footer buttons to 44×44 tap targets (#6044)
    - Changed new workspaces branched from origin/main or another remote branch to fetch that branch first (#5788 by @odoo-mvds)
    - Changed Paseo's internal Claude agents for branch names, commit messages, and PR text to run with Claude hooks disabled (#5750)
    - Changed OMP approval mode changes to apply on the next idle relaunch, and to be refused during a turn (#5550)
    - Changed relative timestamps in agent, schedule, and Import session rows to keep advancing while on screen (#5340)
    Fixed
    - Fixed Claude agents never showing Thought rows on Claude Opus 4.7 and later (#4355 by @ThePharmer)
    - Fixed a Claude agent showing as running while only its background helpers worked, and a send or Stop killing those helpers (#6295 by @IsakPersson)
    - Fixed a Claude agent in Auto mode failing to switch modes when Claude Code uses Bedrock or Vertex (#6272)
    - Fixed a Claude subagent's auto-mode report showing as a raw SubagentHandback tool card instead of markdown (#6248)
    - Fixed background Claude subagent cards showing as a bare "Task" that stayed running, as "Agent" after a daemon restart, or unlabeled when two launch together (#6067, #6100, #6268)
    - Fixed Claude Code terminals not showing as needing input when Claude is idle (#6022)
    - Fixed Claude usage calling a rate-limited login again before its retry time (#6089)
    - Fixed a Claude agent that entered plan mode on its own still showing and storing its previous mode (#6074)
    - Fixed a resumed agent returning to its creation-time mode after its mode was changed in the session (#5140 by @ThePlenkov)
    - Fixed ACP plugin providers failing to launch a .cmd or .bat CLI on Windows (#6151)
    - Fixed ACP agents running on their default model when the configured model is one the agent does not advertise (#6273)
    - Fixed archiving an ACP agent leaving its provider running when the provider never answers close (#6213 by @apple-ouyang)
    - Fixed an archived ACP agent showing an empty chat after its worktree was removed (#6228)
    - Fixed ACP agents rejecting every following message after a turn failed with a permission request open (#6045)
    - Fixed the context window meter never appearing for ACP agents that report context usage (#4848 by @apple-ouyang)
    - Fixed schedule runs and workspace metadata recording [object Object] when an ACP agent rejects a session setting (#5765)
    - Fixed OMP agents staying bound to a dead omp process after it crashed (#5550 by @viet-initx)
    - Fixed OMP multi-select questions showing radio buttons and asking once per choice (#5550)
    - Fixed /compact on OMP reporting a failure after 60s while OMP kept compacting (#5550 by @Kh05ifr4nD)
    - Fixed paseo import --provider omp starting the agent on the default model instead of the session's (#5550 by @alloevil)
    - Fixed OMP-injected rows showing a [custom_message] prefix after a reload (#5550 by @jegork)
    - Fixed OMP tool rows showing raw objects or generic labels for failed tools, Task, Wait, web search, and fetch (#5550)
    - Fixed results of OMP xd:// writes disappearing from the timeline (#5550 by @kasrakhosravi)
    - Fixed the composer showing the stale model after an OMP model fallback (#5550 by @gray-graff)
    - Fixed opening an archived OMP agent starting an omp process that stayed running (#5550 by @thomasvan)
    - Fixed an OMP turn staying running forever when the run contains a message Paseo does not show, such as an OMP rule reminder (#6112)
    - Fixed a prompt OMP rejects, such as for a missing API key, ending as a completed turn with no error (#6110, #6115)
    - Fixed reopened OMP chats showing "Custom message" rows for compactions and other entries OMP writes on its own (#6198, #6215)
    - Fixed Pi and OMP sessions whose model was removed failing to import or reopen (#6061)
    - Fixed Pi agents on Pi 0.99 starting without Paseo's MCP servers when pi-mcp-adapter is not installed (#5762 by @ArietidsZ)
    - Fixed a running Pi subagent showing an empty transcript until it finished (#5755)
    - Fixed a grouped Tintinweb pi-subagents completion marking only its first agent completed and leaving the rest on working (#5826)
    - Fixed OpenCode ask rules for paseo_* tools running the tool without a prompt (#5801 by @ymarcus93)
    - Fixed the first OpenCode prompt waiting for the event stream timeout when the OpenCode server was slow to become ready (#5873 by @axsuul)
    - Fixed OpenCode v2 agents staying running after a question is dismissed or a tool permission is denied (#6177, #6188)
    - Fixed the Nix packages failing to start the daemon and to open terminals (#5523 by @wongcallum)
    - Fixed OpenCode v2 agents failing to start on the Nix packages (#5988)
    - Fixed each Paseo skill appearing twice in Codex's skill list (#5827 by @3ae3ae)
    - Fixed a failed Codex image generation leaving no row in the chat (#5810 by @3ae3ae)
    - Fixed a denied Codex command or file edit keeping a running spinner after the turn ended (#5717 by @3ae3ae)
    - Fixed rewinding a legacy Codex chat failing with unknown variant thread/rollback on Codex 0.156 and newer (#5711 by @3ae3ae)
    - Fixed Codex custom prompt arguments containing $ sequences reaching Codex altered (#5669 by @3ae3ae)
    - Fixed Codex structured output failing when the schema has a field named properties (#5684)
    - Fixed a Codex agent created without a thinking option losing its default effort after a daemon restart (#5686)
    - Fixed only one permission showing when Codex asks to approve two commands from one item (#5758)
    - Fixed Codex terminal rows reading only "Terminal" without the command on current Codex (#5774)
    - Fixed the composer showing the catalog default thinking level instead of the one the agent runs on (#5804)
    - Fixed the composer showing another model's label when the agent's model is missing from the loaded catalog (#5796)
    - Fixed the chat jumping back by several screens when scrolling up through older history on web and desktop (#5945, #5970, #6172)
    - Fixed images in chat shifting the text below them when they finish loading (#5970)
    - Fixed copying all the code in a chat code block sometimes including its ``` fence lines (#6138)
    - Fixed copying across a code block nested in a numbered list item renumbering the next item (#6158)
    - Fixed copying a chat selection across an image losing its alt text and source, or including the image when the selection started below it (#6181, #6195)
    - Fixed relative path:line file links in chat opening at the first line referenced for that file (#5653 by @3ae3ae)
    - Fixed PR comments with linked pictures showing raw HTML tags and losing the image link (#5968)
    - Fixed text typed by the browser tool appearing in your message box instead of the browser tab (#6207)
    - Fixed Astro expressions losing their colors after a nested template string (#6219)
    - Fixed downloading files whose names contain non-ASCII characters (#6278, #6281 by @dillonzq, @jasonhnd)
    - Fixed the PR panel, sidebar workspace status, and "Worked for" line showing English in other app languages (#6196, #6208, #6225 by @dillonzq)
    - Fixed French translations that read as word-for-word machine translation (#6004 by @fxlelouarn)
    - Fixed the desktop window not dragging from the workspace header after scrolling a long chat (#5233 by @Zhou-Ruichen)
    - Fixed opening an agent on a touch screen in the desktop layout raising the on-screen keyboard (#5477 by @dinhphieu)
    - Fixed Option+arrow, Cmd+arrow, and Cmd+Backspace line editing in the macOS terminal (#3339 by @gpambrozio)
    - Fixed the daemon freezing when an Add Project directory search reached a folder whose read never returns (#6029, #6041 by @lardissone)
    - Fixed a new worktree workspace being archived when its paseo.json cannot be parsed (#6036 by @3ae3ae)
    - Fixed workspace script status not updating in other connected clients (#6007 by @swbiggart)
    - Fixed agents and terminals inheriting the voice library path, which truncated Git Bash's PATH on Windows (#5987 by @hanh9898)
    - Fixed dictation failing until the model was deleted by hand when the daemon stopped while extracting a local speech model (#6210 by @3ae3ae)
    - Fixed macOS hosts showing as UNKNOWN when the network supplies no hostname (#5922)
    - Fixed paseo daemon status reporting a daemon in a Linux VM as stopped after the host wakes from sleep (#6279)
    - Fixed relay reconnects being ignored after a relay connection stalled before its handshake (#5648 by @3ae3ae)
    - Fixed paseo daemon run exiting with "Daemon failed to start" when the program that launched it stops reading its output (#6117)
    - Fixed CLI commands crashing with EPIPE, and the Windows desktop app showing an error dialog, when their output stops being read (#6097)
    - Fixed daemon self-update on a linked global install giving the wrong reason for refusing (#6095)
    - Fixed daemon self-update failing for an npm install under a prefix other than npm's global prefix (#5649 by @3ae3ae)
    - Fixed opening an archived agent whose worktree was removed showing "Workspace unavailable" when the workspace had no recorded branch (#5694)
    - Fixed a failed send to an archived agent whose directory was removed taking it out of History (#6255)
    - Fixed a host's version staying stale on the host page after its daemon restarts (#5351 by @bashrusakh)
    - Fixed Remote SSH hosts failing to connect to a password-protected daemon, with a new Daemon password field (#6081 by @royenheart)
    - Fixed removing a host during its first connection attempt not stopping the connection (#5722)
    - Fixed a file upload started while reconnecting failing with Connection changed during file upload (#5585)
    - Fixed the centered New workspace form collapsing and overlapping when the keyboard opens on tablets (#6093 by @colonelpanic8)
    - Fixed the Android sidebar jumping back to the top when reopened after selecting a workspace (#6058)
    - Fixed tapping the context ring and long-pressing a workspace tab doing nothing on native tablets (#5713 by @JichenZhang)
    - Fixed iPad chat text keeping its old width after the pane resizes (#5716)
    - Fixed the context ring filling from three o'clock instead of twelve on web and desktop (#5598)
    - Fixed browser annotation screenshots capturing the wrong region when the app is zoomed (#5703)
    - Fixed the desktop app launching a daemon status process every second when no local daemon runs (#5636)
    - Fixed the / menu listing /clear and /exit in a draft before a project or model is chosen (#5594 by @colonelpanic8)
    - Fixed paseo agent delete --all and --cwd leaving archived agents behind (#6027 by @3ae3ae)
    - Fixed paseo agent commands reporting a generic failure instead of AGENT_NOT_FOUND for an unknown agent ID (#6053)
    - Fixed paseo agent open opening Desktop and exiting 0 for an agent that does not exist (#5727)
    - Fixed paseo restart exiting with RESTART_NOT_CONFIRMED when provider checks take more than a second (#6009)
    - Fixed paseo schedule update --no-max-runs and --no-expires-in failing before reaching the daemon (#5973 by @Mar-garet)
    - Fixed daemon.log saying nothing when a resumed Claude agent's transcript is missing or cannot be read (#5818 by @gabrielgiordan)
    - Fixed reloading a plugin adding [System Error] Provider connection closed to finished chats on its provider (#5579)
    - Fixed paseo plugin add . looking for the plugin in the daemon's directory instead of the CLI's (#6239)
    - Fixed plugin settings screens on desktop having no way back to the Plugins page (#5620)
    - Fixed plugin client code failing to import npm packages that declare only main or module (#5838)
    - Fixed the SDK's send() and run() rejecting activeTurnBehavior in TypeScript (#5605 by @wjxdy)
    - Fixed bundling @getpaseo/client from npm failing with Could not resolve "@getpaseo/relay/e2ee" (#5815)
