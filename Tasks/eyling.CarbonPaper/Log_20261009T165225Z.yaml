  Key: ReleaseNotes
  Value: |-
    What's NEW / 新增了什么？
    现代化 UI
    独立设置窗口 #207
    我们将设置移到了独立窗口，并重新整理了各个设置页面。现在，你可以在浏览记录的同时调整偏好，也可以在统一的维护页面管理模型和搜索索引。文字与图片索引的进度展示亦已统一，排队、等待解锁、处理中和停止等状态将更加清晰。
    Settings now opens in a separate window, allowing you to adjust preferences while browsing your records. We have also reorganized the settings pages and brought model and search index maintenance together. Text and image indexing now share a consistent progress display, making queued, waiting-for-unlock, processing, and stopping states easier to understand.
    更清晰的首次使用引导 #213
    首次使用 CarbonPaper 的过程现在更加连贯。新的四步引导将功能选择、性能偏好、浏览器扩展和开机启动整合到了一起，你也可以直接采用推荐设置。下载和配置过程会展示进度，并支持失败后重试。
    与此同时，我们统一了启动提示、解锁、维护和迁移界面的样式与显示顺序，避免多个提示同时出现。新用户将在完成引导后开始记录，已有用户则会看到简短的更新介绍。
    Getting started with CarbonPaper is now more straightforward. A unified four-step wizard brings together feature choices, performance preferences, browser integration, and startup options, with a shortcut to apply recommended settings. Downloads and setup actions show their progress and support retries.
    Startup prompts, unlock screens, maintenance, and migration overlays now share a consistent design and coordinated display order. New installations begin capturing after onboarding is complete, while returning users receive a brief introduction to the changes.
    新图标 #231
    CarbonPaper 迎来了新的应用图标！
    CarbonPaper has a new application icon！
    新功能
    直接向你的屏幕历史提问 #214 #221 #230
    现在，你可以在高级搜索的 AI 页面中，用自然语言查找和梳理过去的屏幕记录。AI 可以结合截图中的文字、画面内容和时间范围进行搜索，并通过回答中的引用带你回到原始记录。你亦可以继续追问，沿用此前找到的线索，或随时停止搜索、开启新的对话。
    新的 AI 设置页面支持配置兼容 OpenAI 或 Anthropic 接口的模型服务，也提供了 Ollama、LM Studio 等本地服务的预设。使用外部服务处理屏幕文字前，应用会征得你的同意，API 密钥则在本地加密保存。AI 搜索与外部 MCP 助手现在也能直接查询每日回顾。
    You can now ask questions about your screen history in the AI tab of advanced search. The assistant searches captured text, visual content, and time ranges, then links its answers back to the original records through citations. Follow-up questions can reuse previously discovered evidence, and you can stop a search or start a new conversation at any time.
    The new AI settings page supports OpenAI-compatible and Anthropic endpoints, with presets for local services such as Ollama and LM Studio. Sending screen text to an external service requires your consent, and API keys are encrypted locally. Both AI search and external MCP assistants can also query Daily Recaps directly.
    串联你的一天：每日回顾 #215 #218 #223 #225
    我们新增了每日回顾，将屏幕记录整理为按时间排列的活动和时段概述。你可以浏览一天的经过，查看同一件事在不同时间的进展，并随时打开支撑这些内容的原始记录。
    启用后，应用会在解锁状态下自动整理已结束的四小时时段，并在独占全屏应用运行时暂缓新的自动请求。你也可以手动生成、补全或重新生成回顾，查看各个时段的生成进度，以及修改事件名称、合并事件或调整片段归属。
    每日回顾亦支持按天删除，原始记录会保留。删除后的日期将停止自动生成，直到你再次手动生成当天的回顾。
    Daily Recap turns your screen history into chronological activities and period summaries. You can browse the day's events, follow an activity across different times, and open the original records behind each entry.
    When enabled, completed four-hour periods are processed automatically while the archive is unlocked. New automatic requests are deferred while an exclusive fullscreen application is active. You can also generate, complete, or regenerate recaps manually, inspect progress by period.
    Recaps can be deleted by day while preserving the original records. Deleted days remain excluded from automatic generation until you explicitly generate them again.
    重启后，后台整理继续进行 #204
    新增的“重启后继续后台整理”功能，可以让新记录的分类和文字、图片索引任务在应用重启后继续处理，即使你尚未解锁历史记录。查看历史和执行搜索仍需解锁，关键词搜索索引也会在解锁后自动补全。
    启用时，Windows 会请求管理员授权以安装后台组件，随后重启应用。你可以在设置中调整待处理内容的保留时间和暂存容量，也可以修复或移除该组件。
    The new background processing option allows classification, text embedding, and image indexing for newly captured records to continue after an application restart, even before the archive is unlocked. Browsing history and searching still require an unlocked session, and keyword indexing catches up after unlocking.
    Enabling this feature requires Windows administrator approval to install the background component, followed by an application restart. Settings provides controls for retention, staging capacity, repair, and removal.
    性能与运行体验
    更合适的后台处理时机 #201 #206
    后台整理现在支持“自动”和“仅空闲”两种模式。接通电源时，自动模式会结合计算机的可用资源和任务的实际运行情况安排处理；仅空闲模式则在停止操作一分钟后开始工作。
    我们也减少了不同任务之间反复加载模型的开销，让后台任务能够在处理边界为前台请求让出资源。图片搜索索引的构建新增了检查点，中断后可以接续已有进度。
    Background processing now offers Automatic and Only when idle modes. While connected to power, Automatic mode schedules work according to available resources and observed task costs, while Only when idle waits until there has been no input for one minute.
    We have also reduced repeated model loading between tasks and improved how background work yields to foreground requests. Image search index builds now save checkpoints so interrupted builds can resume their progress.
    时间线与存储性能优化 #200 #216 #226 #227
    针对记录较多时的浏览体验，我们优化了时间线的数据读取和解密过程。快速拖动或缩放时，已经过时的读取请求会被取消，减少后台积压。搜索索引的增量更新也经过调整，降低了历史记录增长后反复处理大块索引数据的开销。
    数据库现在默认使用 WAL，并让时间线、OCR 详情和应用统计等读取通过独立连接执行，减少浏览与写入之间的相互等待。启动时检查未完成截图的查询亦已优化。
    We have optimized timeline reads and metadata decryption for larger archives. Rapid panning or zooming now cancels outdated requests, reducing queued work. Incremental search indexing has also been revised to avoid repeatedly rewriting large portions of historical index data.
    The database now defaults to WAL, with independent read connections for the timeline, OCR details, and application statistics to reduce contention with writes. Startup recovery queries for unfinished screenshots have also been optimized.
    调整与升级提示
    重大变更：完成原生运行迁移 #205 #210 #212
    CarbonPaper 已完成剩余功能向 Rust 的迁移，运行和安装均不再需要 Python。旧版本留下的应用专用 Python 环境会在启动后由后台逐步清理，释放其占用的磁盘空间。
    旧版“任务聚类”及其关联活动视图已移除，“智能聚类”继续保留。旧 Chroma 向量数据的处理也改为重建：如果你仍在使用 v0.8.3 或更早版本，并希望保留已有的图片搜索向量，请先升级到 v0.8.5，等待迁移完成后再升级。直接升级的用户可以通过历史图片索引补全恢复更早记录的图片搜索能力。原始截图会保留，已在 v0.8.4 或 v0.8.5 完成迁移的索引可继续使用。
    CarbonPaper has completed the migration of its remaining functionality to Rust. Python is no longer required for installation or operation, and the application-specific Python environment left by older releases is cleaned up in the background to reclaim disk space.
    Legacy task clustering and its related activity views have been retired; Smart Clusters remains available. Legacy Chroma vectors are now rebuilt instead of imported. Users upgrading from v0.8.3 or earlier who want to preserve their existing image vectors should first upgrade to v0.8.5 and let its migration finish. Direct upgrades can restore image search for older records through historical backfill. Original screenshots are preserved, and indexes already migrated by v0.8.4 or v0.8.5 remain usable.
    个人信息过滤调整 #211 #230
    个人信息识别现在使用内置的 Rust 规则，无需额外下载语言模型，并加强了对电话号码、身份证号和银行卡号中部分 OCR 识别错误的处理。默认过滤方式调整为移除包含敏感内容的段落，敏感词词库也经过整理，以减少正常内容被误判的情况。个人信息过滤与敏感词等级可以独立设置。
    识别范围亦有变化：姓名，以及美国社会安全号码、IBAN 等原先由部分英文识别器提供的类别，目前不再覆盖。
    Personal information detection now uses built-in Rust rules without requiring additional language model downloads, with improved handling of certain OCR errors in phone numbers, Chinese identity numbers, and bank card numbers. The default filtering mode removes affected text segments, and the sensitive-word dictionaries have been curated to reduce false positives. Personal information filtering can be configured independently of the keyword filtering level.
    Detection coverage has also changed: names and categories previously supplied by certain English recognizers, including US social security numbers and IBANs, are no longer detected.
    修复
    修补了 OCR 删除队列无法正确清空，导致相关截图清理持续积压的问题。#196
    修补了后台启动时，删除队列清理可能在尚未解锁的情况下弹出 Windows 身份验证提示的问题。#208
    修补了后台任务调整 CPU 限制时可能出现 0x80070057 错误，导致分类和索引任务失败的问题，并恢复了受此问题影响的重试状态。#209
    修补了捕获服务启停过程中，旧会话退出可能干扰新会话的问题，并限制了异常停止后的自动重启次数。#212
    修补了轻量模式下发生的关键错误，在主窗口重新打开后可能无法显示的问题。#212
    修补了旧个人信息识别服务超时或出错时，可能返回未经该服务过滤的内容的问题。#211
    修补了部分正常词语因敏感词重叠或匹配边界不准确而被误过滤的问题。#230
    修补了部分控件的键盘焦点样式被裁切，以及每日回顾操作按钮变化时日期导航位置跳动的问题。#225
    Technical Summary for Developers
    This release completes the native runtime migration and adds AI-assisted search, daily recaps, protected background processing, and further storage improvements:
    - Removed the remaining Python monitor, interpreter discovery, virtual-environment setup, installers, launchers, and packaging paths. Capture lifecycle, classification, correction learning, and PII detection now run through Rust implementations. Legacy task clustering and Chroma dependencies have been retired.
    - Added app-bound processing backed by a LocalSystem key service. Staged inputs use independent AES-256-GCM task keys, verified runtime identities, short-lived consumer leases, and receipt-checked result commits. Existing archive reads retain their session authorization requirements.
    - Added adaptive background scheduling, model-affinity execution windows, request-level inference cancellation, and resumable ANN builds with durable cursors and checkpoints.
    - Made WAL the default archive journal mode while retaining controlled startup conversion and synchronous=FULL. Added a covering partial index for startup pending-screenshot recovery.
    - Added selective sharding for large blind-index postings to reduce incremental write amplification. Timeline queries now use lightweight records, materialized sample selections, independent read connections, and cancellation checks during SQLite execution and CNG decryption.
    - Added streaming OpenAI-compatible and Anthropic provider adapters, bounded multi-turn search, tool-transcript replay, context management, and encrypted provider configuration. Interactive search exposes read-only tools and retains remote-data consent checks.
    - Added encrypted recap storage, source-checked citations, durable summary-update jobs, reversible corrections, and deletion markers that prevent unwanted automatic regeneration. Evidence selection deduplicates OCR text, while request budgeting uses local token estimates reconciled with provider-reported usage.
    - Added the read-only MCP tools get_daily_recap and list_daily_recaps, including privacy filtering and support for user-corrected content. Retired the legacy task-clustering tools.
    - Expanded behavioral regression coverage for capture, storage, search, indexing, cancellation, and recovery. Build and CI workflows now include frontend linting, broader native-worker coverage, and protected-runtime packaging checks.
