  Key: ReleaseNotes
  Value: |-
    SketchCraft 0.3.10 "Makers"
    Plan the cut, check the print, fix the model: tools for people who build what they draw. Always free. Never freemium. Never paid.
    Highlights
    - Cut plan. Tools › Cut plan… packs your parts onto real sheets and boards: diagrams drawn to scale with every part numbered, waste, what to buy and what it costs. Set kerf, trim, sheet and board sizes, prices and grain. Export the diagrams as PDF or SVG and print part labels.
    - CNC files and joinery. Export a .zip with one DXF per part (outline, through holes, pockets by depth, optional dog-bone corners). Tools › Joinery cuts a dado, a rabbet or a tenon and mortise between two boards.
    - The cut list knows lumber. Boards show as 2×4, 1×6, 4×4 and so on, with board feet and a total.
    - Print check and 3MF export. Tools › Print check… tells you if a model is ready for a slicer: closed solid, thin walls, overhangs, size in millimetres and whether it fits your printer. File › Export › 3MF sits next to STL.
    - Fix model. Tools › Fix model closes holes, turns reversed faces back, joins split faces and removes repeated, trapped and stray geometry in one step, with one Undo.
    - Curve, Make faces and Flatten to height. A Curve tool (key U) draws a smooth curve through the points you click. Make faces closes loops of loose lines, and Flatten to height tidies imported DWG and DXF linework.
    - Name things in Properties. Type a group's or component's name in Properties › Name.
    - Edit texture in PhotoCraft. Open a face's picture in PhotoCraft with the UV layout as a guide. Each save comes back onto the model.
    - An example to open: a finished two-storey Townhouse in Library › Examples.
    - Seven languages. View › Language adds Français, Español, Deutsch, Português and 简体中文 beside English and Italian. Chinese was contributed by fanhui.
    - Linux on arm64: AppImage, .deb, .rpm and a CLI zip for Raspberry Pi 5, Ampere and Snapdragon machines.
    - Android tablets (early): same engine and interface, built for touch. Build it yourself for now (docs/dev/android.md).
    - Standard views work in Parallel projection (MaxonT).
    - New guides: "Coming from SketchUp", and "Bring your own AI" with MCP setup and recipes (MaxonT).
    Fixed
    - Older SketchUp files open properly: SketchUp 6 files with guide lines, SketchUp 7 and 8 files with components (with all of them), and SketchUp 2017 files with dimensions.
    - SketchUp, FBX, DXF and OBJ files import on Android.
    - Plugins work on macOS and Linux again. The sandbox check no longer turns them off by mistake.
    - Print check measures every wall, up to 600,000 triangles.
    Safer with agents and plugins
    SketchCraft 0.3.10 had its biggest security review yet (WildLeopard): 10 rounds, 56 fixes, and nothing above Info left at the end.
    - Every command from an agent or a plugin has a time limit and is undone if it runs out. Your own commands have no limit.
    - When an agent and you edit the same model, your saves are never lost. An agent's conflicting work is set aside in a private copy.
    - Very large and deeply nested models open and stay fast.
    Thank you
    To MaxonT for the "Coming from SketchUp" guide, the bring-your-own-AI docs and the Parallel projection fix. To Tim Rowledge for the old SketchUp files that made them open. To fanhui for Simplified Chinese. And to everyone who files issues and tries the builds.
    Full details are in the changelog.
    Installing: Windows may show "Windows protected your PC". Choose More info › Run anyway. macOS may say Apple could not verify it. Open it from System Settings › Privacy & Security › Open Anyway. Signed installers for both are coming. Existing installs update in the app.
