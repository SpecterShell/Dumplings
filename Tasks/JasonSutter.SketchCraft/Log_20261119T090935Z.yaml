  Key: ReleaseNotes
  Value: |-
    SketchCraft 0.3.8 "Drafting"
    Turn your models into real drawing sheets, from start to finish, inside SketchCraft. Always free. Never freemium. Never paid.
    Highlights
    - Layout workspace. A new fifth workspace for drawing sheets: pages, viewports of your model at any scale, A-series, ARCH and ANSI paper, and an inspector for everything on the page.
    - Lay out a sheet entirely by mouse. A tool bar beside the paper: Select, Viewport, Line, Arc, Dimension, Text, Table and more.
    - Tables and text blocks. Door schedules, drawing indexes and notes. Paste straight from a spreadsheet or CSV. Drawing indexes fill themselves from your sheets.
    - Crisp vector output. Sheets export as PDF, SVG and DXF, with hidden lines removed.
    - Dimensions that stay attached. Dimensions on sheets follow the model when it changes, follow copies of grouped geometry, and come in from SketchUp files.
    - Hatches, cut fills, line weights and line styles per tag. Built-in patterns plus your own .pat files. Hatches show on screen at their true weight.
    - Cut intersection priority. Where a wall meets a slab in a section, the higher-priority tag wins, the way Archicad does it.
    - Trim, extend and offset line work on sheets.
    - Customizable keyboard shortcuts, with an import from SketchUp.
    - Agents can draw the sheets. Over MCP, an agent can lay out a whole permit set, dimension the plans, hatch and check them.
    - Big drawing sets stay fast. A 52-page A1 permit set now uses about half the memory and redraws in under a second.
    Fixed
    - SketchUp 2013 to 2020 files with curves, pictures or text labels import again.
    - Changes the app sends as one group now undo in one step.
    - Adding pages quickly no longer gives two pages the same name.
    - Security: hardened limits on sheets, tables, rendering and imported text (WildLeopard).
    Thank you
    To Kad26 for the vertical toolbar layout, VFF rotation, mirrored-winding, trim/subtract and crossing-selection fixes, and to the Reddit community for the cut intersection priority idea.
    Full details are in the changelog.
    Installing: Windows may show "Windows protected your PC". Choose More info › Run anyway. macOS may say Apple could not verify it. Open it from System Settings › Privacy & Security › Open Anyway. Signed installers for both are coming. Existing installs update in the app.
