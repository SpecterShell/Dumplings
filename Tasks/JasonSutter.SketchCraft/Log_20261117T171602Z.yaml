  Key: ReleaseNotes
  Value: |-
    SketchCraft 0.3.5: scale figures (and a beaver), move a single corner, plugins with a cut list, a Classic SketchUp-style look, and a Windows portable ZIP.
    On 0.3.3 or 0.3.4? SketchCraft offers this update when it opens. On an older version, download it once below.
    Added
    - Scale figures. New models start with a person standing at the origin, a flat figure that always turns to face you, for a sense of size (as in SketchUp). Pick who it is under Document › Scale figure: a person, the SketchCraft beaver with a clipboard, or nobody. On April 1, the beaver clocks in. Both are in the Library, renders turn them to the camera too, and any component can be set to Always face the camera.
    - Move a single corner. With nothing selected, the Move tool grabs the corner under the cursor: its edges stretch as you go, and the faces around it fold to stay flat (as in SketchUp).
    - Windows portable ZIP. SketchCraft_<version>_x64_portable.zip: unzip anywhere and open SketchCraft.exe, no installer. When a new version is out, the portable copy links to the new ZIP instead of installing.
    - Classic layout. The tool bar, view bar and workspace strip dock edge to edge above the model, outside it, like SketchUp, and the Value box sits in the corner. Themes › Layout, Shift+S › Classic layout, or per workspace under Customize › Toolbar.
    - Plugins. Small JavaScript plugins add commands (File › Plugins ▸, and Shift+S). They run sandboxed: no network, no files, only engine commands, and what they change can be undone. Drop a folder in ~/Documents/SketchCraft/Plugins; see docs/PLUGINS.md.
    - Cut list (the first plugin). Lists the parts to cut, grouped by size and material, and roughly how many 4×8 sheets and 8 ft boards to buy. Copy the table or save it as CSV.
    - Icons in themes. A theme can bring its own tool icons: Themes › Icons › Load icons… takes image files named after the tools (line.svg, push.png…; File names lists them). They're saved in the theme file, so an icon set can be shared like any theme.
    Changed
    - Classic is the new default. New installs start in the Classic theme (neutral greys, a blue accent) with the tool bars docked above the model, at home for SketchUp users. SketchCraft's own Workshop look and floating tool bars, and every other theme, are in the Themes gallery; picking one brings its layout. Your current theme is kept.
    - Every field (dropdowns, text and number boxes) shares one look from the theme: corners, border and height.
    - Skins are now Themes. The Themes button (top right, with a palette) opens one window for the look: Theme (the gallery), Layout (Classic or Floating, with a picture of each) and Icons (built in, or load your own). Theme files are still .sketchskin, so shared ones keep working.
