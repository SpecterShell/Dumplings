  Key: ReleaseNotes
  Value: |-
    SketchCraft 0.3.7: a Subdivide button, a new Vertical tools layout, and a safety net so files from newer versions can never be damaged by older ones.
    On 0.3.3 or later? SketchCraft offers this update when it opens. On an older version, download it once below.
    New
    - Subdivide from the app. Right-click a group or component (or Shift+S) › Subdivide… turns it into a smooth surface and opens SubD mode, so you can shape its cage (Tab to shape, Enter when done). Or start from a SubD box. There's a Learn lesson too.
    - Vertical tools layout (Themes › Layout): tools down the left, the Outliner and properties on the right. Contributed by Kad26, thank you!
    - Files from a newer SketchCraft open read-only. Drawing sheets are coming in 0.3.8. From this version on, an older SketchCraft (or an AI agent using one) can never silently drop what it doesn't understand: it opens newer files for looking only and never saves over them.
    Fixed
    - Trim keeps nested hardware (cutting a door no longer deletes its handle). Also contributed by Kad26.
    - The axis gizmo is fully visible in every layout.
    - Typed lengths like 10' 6 1/2" stay one length.
    - Flip edge works on terrain without opening its group.
    Behind the scenes
    Every pull request now runs a full test suite: browser tests that drive every tool with a real mouse and keyboard, screenshot comparisons in each layout and theme, unit tests, and SketchUp's own test files. This is also the first release signed with SketchCraft's new update key. Your copy switched over when it installed 0.3.6, so nothing changes for you.
    What's next
    0.3.8 is drafting: LayOut-class sheets with line weights, hatches and cut fills per tag, dimensions that stay attached, and customizable keyboard shortcuts. See the roadmap.
    Every file is listed in SHA256SUMS.txt, and the installers carry build provenance (gh attestation verify <file> -R jasonsutter87/sketchcraft). Full list of changes: CHANGELOG.md.
