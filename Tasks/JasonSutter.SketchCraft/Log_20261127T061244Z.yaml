  Key: ReleaseNotes
  Value: |-
    SketchCraft 0.3.11 "Architects"
    Doors, windows and walls you can change after you place them, a welcome screen, and two themes that feel like home if you're coming from SketchUp. Always free. Never freemium. Never paid.
    Highlights
    - A welcome screen. Start a new model in a look and its units (Simple, Architectural or Visualization, each in metric or feet and inches), open a starter, an example or a recent file, or go to Learn. Help › Welcome… brings it back; a switch turns it off at start.
    - Door and Window tools. In the Arch tab, hover the side of a wall and click. The opening is centred where you clicked, cut through the wall and marked as an IFC door or window. Change its size or sill later in Entity Info.
    - Walls, stairs, roofs and columns keep their settings. Select one and change its thickness, height, rise, pitch or roof type in Entity Info: it's remade in place, with its doors and windows cut again.
    - Harbor and Harbor Desktop themes for people coming from SketchUp: a web layout with floating cards and a tool rail, or a docked tool bar with document tabs, a tray and a status bar. Classic Color draws every tool with an original colour icon, and the Classic layout can show a tray of panels.
    - Orbit around the spot under the cursor, a right-click menu on empty space, View › Hidden geometry (Shift+H) and Edit › Unhide all (⌘⇧H / Ctrl+Shift+H).
    - Scenes that show only the selection, and a switch for the camera's glide (Camera › Smooth camera).
    - 3D mouse support. A 3Dconnexion SpaceMouse orbits, pans and zooms in the desktop app on macOS, Windows and Linux, with no extra software.
    - More of SketchUp's Ruby API: tools, HtmlDialog, observers, timers, Follow Me and textures. Solid Inspector² loads and inspects a group.
    - A report after every SketchUp import, and SketchUp 2017–2020 files now bring their materials and textures.
    - The Room tool snaps to the rooms already there, and a room drawn between two rooms shares their walls.
    - The standard views are flat (Parallel projection), and orbiting away goes back to perspective.
    Fixed
    - Cuts never leave a solid open without saying so. A push/pull, door, window or rebuilt wall that would open a gap in a closed solid is refused with a message, and the model stays as it was.
    - Push/Pull through a wall opens a hole right through. Cuts side by side, at any size and on turned parts, stay closed solids.
    - Doors keep a wall a closed solid, including several doors in a row and doors in a closed ring of walls.
    - Deleting a line across a face heals it into one face, as in SketchUp.
    - Cleaner ambient occlusion, which also no longer blanks the view; no black specks with Profiles on; the floor no longer flickers through faces at ground level.
    - Shift still snaps to other geometry; hovering an edge says "On Edge" again; .12 works in the Value box.
    - Undo after a refused change goes back exactly one step.
    Safer with agents and plugins
    - Hardening for 0.3.11: stricter checks on what agents and plugins can write and save, on numbers read from imported files, and on how much a model's scenes may hold. Plugins' menus, names and messages are capped and cleaned.
    - Every round of the release's security review ended with nothing above Info left.
    Thank you
    To everyone who files issues, sends SketchUp files that don't open, and tries the builds.
    Full details are in the changelog.
    Installing: Windows may show "Windows protected your PC". Choose More info › Run anyway. macOS may say Apple could not verify it. Open it from System Settings › Privacy & Security › Open Anyway. Signed installers for both are coming. Existing installs update in the app.
