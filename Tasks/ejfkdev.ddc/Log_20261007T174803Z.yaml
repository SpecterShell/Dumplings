- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    v0.1.27
    New Features
    - Every REST route now accepts GET (query params) and POST (JSON body): all 10 query commands under ddc serve / ddc http (upgrades xyz-rust to 0.4.6)
    - findrefs accepts kind=class as the plain-word alias of type
    Bug Fixes
    - /openapi.json listed zero parameters for every route: the OpenAPI generator skipped fields without an explicit http location even though the runtime bound them (fixed in xyz-rust 0.4.6; all routes now document input/class/dex/... plus requestBody on POST)
    Docs
    - serve/http help cards (en+zh) and README/cli.md gained POST curl examples; findrefs help documents the class alias and points definition-level queries at ddc hierarchy
    Follow-up on the HTTP API / MCP integration (#6).
    Full Changelog: https://github.com/ejfkdev/ddc/compare/v0.1.26...v0.1.27
