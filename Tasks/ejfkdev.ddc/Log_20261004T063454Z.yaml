- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    v0.1.24
    CLI polish; the decompiler core is unchanged.
    - no arguments prints the help (exit 0); errors print one line only
    - ddc help (and ddc --help): each command's
      own arguments, options, and worked examples, in both languages
    - language detection now DDC_LANG > LC_ALL > LC_MESSAGES > LANG >
      LANGUAGE; on Windows with no locale variable set (plain cmd.exe /
      PowerShell) the system UI language is used, so DDC_LANG is no longer
      required there
    - help text rewritten in a reference tone, subcommand count corrected
      to the actual 15; pkg documented as covering subpackages too
    - info accepts -d/--dex like the other subcommands
    Full Changelog: https://github.com/ejfkdev/ddc/compare/v0.1.23...v0.1.24
