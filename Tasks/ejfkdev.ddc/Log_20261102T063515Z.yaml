  Key: ReleaseNotes
  Value: |-
    v0.1.34
    Quality first, not just fast: the same javac-verified output, with a much
    smaller getclass footprint and faster queries across the board.
    - getclass: dependency-closure parsing is now the default. Only the defining
      image and images reachable from the target's supertypes, signatures and
      code references (plus nested/enclosing classes) are parsed; unresolved
      lookups add images and retry, with a full-pool fallback. Peak RSS for a
      typical class on large APKs drops from ~1.2GB to ~0.3-0.9GB.
      --low-memory keeps the two-tier on-demand mode.
    - Query speed: probe-gated DEX prefix inflation for strings, members,
      listclasses, pkg, hierarchy and disasm; count-only findrefs summaries;
      paged top-K full scans; a bounded inflater pool; libdeflater fast paths;
      buffered text output; heap-based largest; and fast ASCII/UTF-8 string
      quoting.
    - findrefs / HTTP / MCP: count and top scans now back summaries and paged
      results; MCP stdio processes a final request without a trailing newline
      (xyz-rust 0.4.14 / rmcp 3.8).
    - Packaging: direct-install npm tarball, AUR bundle and WinGet local
      manifests are attached to every release; npm GitHub Packages, the
      Homebrew tap and the Scoop bucket update automatically.
    - Docs: both READMEs now lead with verified quality (javac parse gate,
      full-classpath semantic battery, cure's exact simplification) and carry
      the refreshed 2026-11-02 benchmarks; the CLI reference covers the current
      getclass closure, --fast/--symbols and the md format alias.
    Full Changelog: https://github.com/ejfkdev/ddc/compare/v0.1.33...v0.1.34
