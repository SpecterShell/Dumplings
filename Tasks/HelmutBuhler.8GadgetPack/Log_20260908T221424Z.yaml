  Key: ReleaseNotes
  Value: 'Fixed a bug that was introduced in Version 42: Users other than the one that installed GadgetPack were not able to access gadgets. Fixed a bug that caused the Analog Clock Gadget to show a stale time for a few minutes during certain times in some circumstances. Desktop Calculator Gadget: Fix multiple bugs that caused wrong calculation results. Volume-Control Gadget: Fixed a bug that made it stop working when the default audio device changes (e.g. plugging/unplugging headphones). Changed Calendar Gadget back to the original orange skin. Then also upscaled that skin for High-DPI monitors. Added the blue version of the Calendar as a separate Gadget. Clipboarder: Put in workaround so Win+Shift+S in Windows 11 no longer puts the image into the clipboard history twice. Fix Edgeicon for the contextmenu of copied links and also hide IE icon.'
