  Key: ReleaseNotes
  Value: |-
    更新内容：
    - 弹弹 play 客户端框架升级至 .NET Framework 4.8，部分旧版本 Windows 需要先安装 .NET 更新才可继续使用；
    - 现在需要先注册并登录弹弹 play 账号才能使用相关在线服务；
    - 优化用户中心登录、注册、找回密码、邮箱验证等相关流程；
    - 当播放器加载和播放失败时，使用统一的错误窗口显示问题原因；
    - 『弹幕外挂』控制台窗口合并至播放器主窗口，不再有窗口丢失、状态错误等问题出现；
    - 在线观看功能支持 Kazumi 源；
    - 远程媒体库支持连接到阿里云盘；
    - 远程媒体库支持通过 SFTP 连接到服务器；
    - 新增弹幕 GPU 渲染（实验性），需要在设置中开启；
    - 优化了弹幕渲染时的内存占用；
    - 更新了部分缺失的多国语言翻译；
    - 修复了显示 SRT 字幕时可能漏掉最后一句字幕的问题；
    - 修复了设置弹幕偏移时间后可能导致弹幕残留在屏幕上的问题；
    - 修复了 DirectVobSub 相关的字幕显示问题；
    - 修复了使用 v3+ 下载内核时，下载出错可能导致主程序退出的问题；
    - 修复了使用 VLC 内核并关闭弹弹 play 字幕渲染器时，部分情况下无法显示字幕的问题；
    - 修复了媒体库刷新时可能会报错的问题；
    - 修复了 libass 可能和部分组件冲突的问题；
    - 修复了部分情况下进程没有正确退出的问题；
    - 修复了自动下载功能与 qBittorrent 5.0 相关的兼容性问题；
    - 修复了自动下载 RSS 解析的问题并优化了检查时机；
    - 修复了 5dm 插件的弹幕解析问题；
    - 修复了部分情况下媒体库后台刷新异常问题；
    - 修复了远程媒体库中与 Jellyfin 12 版本的兼容性问题；
    - 修复了暗黑模式下部分颜色错误的问题；
    - 修复了首次进入媒体库和没有添加监视文件夹时，无法触发刷新番剧列表的问题；
    - 完善了启动失败的检测机制，启动失败时会记录相关问题日志并提示用户。
