  Key: ReleaseNotes
  Value: |-
    更新内容：
    - 在线观看页面的搜索结果列表支持收藏和置底数据源；
    - 完善了使用内置浏览器（WebView2）时的流程引导与错误处理；
    - 新增允许自动下载使用按流量计费网络的设置；
    - 新增对 MP4 容器内封字幕文件格式（MOV_TEXT）的支持；
    - 修复了 Windows 7/8/8.1 系统无法打开登录窗口的问题；
    - 修复了使用热点连接到互联网时无法检测按流量计费网络的问题；
    - 修复了部分 dll 版本错误的问题；
    - 修复了未登录状态下无法管理自动下载规则的问题；
    - 完善了字幕格式兼容性与加载失败提示。
