  Key: ReleaseNotes
  Value: |-
    Important
    这是一个 beta 版本。 每个 beta 版本都可能会发生接口的变化和数据结构的调整，不承诺数据的兼容和自动迁移。请在更新前手动导出供应商数据（模型管理 → 导出）备份，以备不时之需。
    为什么不兼容见 https://github.com/yinxulai/osw/issues/24。
    Important
    This is a beta build. Every beta release may change internal APIs and data structures; data compatibility and automatic migration are not promised. Export your provider data before updating (model management → export) as a backup, just in case.
    See https://github.com/yinxulai/osw/issues/24 for why.
    Highlights
    A preview of 1.3.0. This cycle turns OSW from "a proxy you point clients at" into "a gateway you configure once", and gives it an illustrated handbook.
    Functional iterations
    - Client configuration is now automatic. OSW detects the AI clients on your machine and can write their config for you (apply to all), keeping a revertible copy of each file before it changes it. The client registry was split into per-client directories, so adding a client no longer touches the engine.
    - Request rewriting gained a sandboxed script action. Beyond the structured match + action rules, a script action runs in a sandbox and replaces the whole payload — for the logic that structured actions cannot express. Script samples were trimmed to a stage-paired set and are filtered by action stage; the event-level SSE response stage sits behind a feature flag while its streaming gap is closed.
    - Live metrics are unified and on by default. One live-speed readout across surfaces now follows the latest in-flight request, estimates output tokens so TPS lights up during streaming, and falls back to the last settled speed (expiring after 5 seconds) when a request goes quiet.
    - Identity was reworked around a stable record id. Routes, workflows and rewrite rules are keyed by a mutable model id (renaming no longer breaks references) while records keep a stable id.
    - Onboarding shrank to two steps and now embeds the client-config editor inline; the guide is a straight line instead of a checklist.
    - Scheduling — session-level cache affinity keeps a session on the upstream that already holds its prompt cache, so the cache is not thrown away on failover (#39).
    - Handbook. A new documentation site ships with English support (Chinese is the primary language), content grouped by tab, and a screenshot on every guide page.
    Upgrade notes
    - Beta releases do not promise data compatibility or automatic migration (see the notice at the top). Export your provider data before updating.
    - Model identity is now the record id. If you renamed a logical model or reimported providers in an earlier version, re-check your routes, workflows and rewrite rules after upgrading.
    - Rewrite-rule script actions and event-level SSE response rewriting are new; review existing rules whose behavior depended on the previous payload semantics.
