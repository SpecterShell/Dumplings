Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    New
    - console: add a cache hit rate to channel diagnostics and reuse the request-detail readings
    Fixed
    - console: keep Follow system selected and undo the language preview on reset (#115)
    - console: stop stacking cache and reasoning tokens already inside the totals (#99)
    - console: keep request-log date filters on calendar days across DST (#111)
    - secrets: serialize overlapping secret file writes (#96)
    - console: keep a saved script timeout when its field blurs untouched (#108)
    - management: return 400 when a rewrite dry-run receives invalid JSON (#105)
    - updater: keep a downloaded update ready to install after another check (#114)
    - client-config: keep trailing TOML comments out of scalar values (#100)
    - client-config: keep user keys when JSON and YAML setObject runs (#102)
    - client-config: honor XDG_CONFIG_HOME and APPDATA for VS Code paths (#109)
    - database: default a new scheduling policy to the provider model's enabled flag (#107)
    - runtime: do not let a stopping heartbeat rewrite the instance lock (#117)
    - proxy: return 502 when a whole-body conversion fails (#97)
    - proxy: ignore idle time while the upstream is paused for backpressure (#116)
    - proxy: concatenate tool names split across OpenAI stream deltas (#103)
    - console: append a new model binding after the arranged failover order (#98)
    - console: print the daily bill from the same window the stats query uses (#110)
    - core: soft-delete scheduling policies when a provider is deleted (#104)
    - proxy: name converted SSE events with the payload type (#101)
    - provider: reject updates to a deleted provider (#106)
    - app: hide the main window when macOS opens the app at login (#113)
    - client-config: keep a Claude model named only in ANTHROPIC_MODEL (#94)
    - conversion: keep placeholder zero usage from hiding real token counts (#93)
    - provider-transfer: overwrite modelName when an imported model matches by key (#92)
    - proxy: decode multibyte characters split across response frames
    - observers: avoid double-counting mixed cache usage (#63)
    - console: give the request detail six readings worth a judgement
    - console: the previous pass leaked the diagnostic metric style into the request log; split the two apart
    - diagnostics: derive TPS in both modes and turn the diagnostic detail into metric blocks
    - diagnostics: always stream, report output tokens, and stop StrictMode from killing the start button
    Changed
    - core: read token usage through per-protocol adapters (#64)
    - console: move the workflow studio's state into useWorkflowStudio
    - console: split the request contents sheet into view-only parts
    - console: split the workflow studio's canvas JSX into subcomponents
    - console: lift the model test panel's rules into lib and gate the view layer
    - console: separate metric blocks with a column rule only and drop every fill
    - console: turn the diagnostic detail into raised metric chips instead of a grey panel with hairlines
    Under the hood
    - console: pin the workflow studio page's shell with a render test
    - require commit messages to be written in English
- Locale: en-US
  Key: ReleaseNotesUrl
