Version: 5.5.3.895
Installer:
- InstallerUrl: https://pspad.poradna.net/release/pspad553_setup.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    - Backup - new backup style: file.ext.date-time with 10 versions. Backup into the designated folder was separated from the backup styles
    - 64b version - IDE style support + added new styles
    - %ProjectRoot% - new variable contains Project Default directory value
    - Program settings / System integration - new button reregister Windows context menu integration
    - PowerShell, Go - new internal highlighters including code folding and code parser
    - DockerFile - new user highlighter definition
    - Minimap - show minimap from the menu View
    - AI support - new user highlighter specification and user scripting (PSPad 32b) for AI in the new subfolder Docs. Attach it to prompt and instruct AI to create new syntax or new script based on the attached specification
    - User settings - in case PSpad is installed into system protected folder (e.g. Program files), changed files like color schemes, scripts, syntax definitions... will be stored in user profile %appdata%\PSpad. Files in this folder and will be loaded with higher priority than Default ones.
    - Updater - removed dependance of the OpenSSL, clearer update instruction
    - AviSynth - new user highlighter definition added nested comments [* ... *] in the user highlighter definition
    - Autocomplete logic changed - automatical start (after delay) will occur after 2 chars. It will always show list even there is one item. It will never rewrite your text automatically
    - FTP - possibility to define File tab color based on FTP server in the edit FTP connection settings dialog
    - Shellextension - to Unregister/Register it use CMD schripts from the .\Docs subfolder. For more informations how the Windows explorer shell extension works read the .\Docs\PSpad shell extension alchemy.txt
    - Optimalization and speed up application start - highlighters are created on demand, not all at PSPad start
    - WebView (Edge) is set as default preview browser for HTML
    - Windows Explorer context menu integration directly in menu, for Windows 11 26h2 registration in the APP extension. Steps: in the Program settings / System integration switch to Registry integration and Apply. Rewrite pspShellx64.dll with the one from ZIP, in Program settings switch back to DLL registration and confirm.
    - FTP - communication library - OpenSSL was replaced with CryptLib. Delete libcrypto*.dll and libssl*.dll. Please test your FTP connections.
    - FTP - SFTP support added - choose FTP/FTPS or SFTP in FTP connection settings
    - Sort function - possibility to store/load sort profile. Stored in the Recent.ini file
    - 64b version - system dialogs localization
    - UTF-8 no BOM - changed detection to prevent false positive detections
    - Join Lines, Split Lines now offer posibility to enter delimiter string with history. \t means real tab
    - Using AI translated missing localization strings in translation files
    - First run should load localization, corresponding to Windows primary language
    - File tabs - visual separation for better visibility
    - Extract text from HTML - new action in HTML menu
    - MS Shell Script highlighter - updated keywords
    - Program settings / Files - ignore list can contain wildchars (*, ?)
    - Highlighters: Pas, SQL (MS SQL, Oracle), C#, Java, PHP, Java Script, HTML - updated keywords
    - PAS Code explorer - click in the Explorer sends you directly into the implementation
    - Code Explorer - new action in the context menu - Copy path to Clipboard
    - Code Explorer - as Hint is now displayed path on the second line
    - Compilation or Run external application doesn't save automatically new files
    - Splitted window - occurences of the selected text are displayed in both parts
    - MarkDown - new highlighter, include HTML preview using F10 from HTML menu
    - ChatGPT inside PSPad
    - TopStyle - hasn't been developed over 10 years
    - External program execution in case when LOG file was fill in
    - Program settings / KeyMap - overlapping section list with shortcuts
    - Minimize to Tray icon
    - Load project - file tabs
    - PHP highlighter - dblclick selects variable including $
    - Python highlighter - select text inside brackets function didn't work inside {xxx}, even they were part of string
    - Compilation - PSPad will automatically switch to tab with reported error in LOG
    - Complete StatusBar redraw when PSPad is activated - prevent blurry StatusBar
    - PSPad start - the file tabs order is preserved from last program exit
    - File exist query - focus is set to modified file
    - Search in files - search/replace in open files
    - HTML highlighter - end of block comment
    - CSharp highlighter - wrong file extension *.CSS
    - Menu flickering after start
    - Redraw problem after icon set change
    - Code explorer for Assembler - automatic sort
    - 64b version - fixing exceptions
    - WordWrap symbol - symbol background is the same as line numbers
    - Problem with select word with double click in some highlighters
    - Running action dialog was displayed over other dialogs
    - Program exit or file close - exceptions joined to code folding
    - Windows Shell Script highlighter - escaped brackets highlighting + many other reports
    - Macro and assigned shortcuts
    - * char with Delete Word (Ctrl+Del) function
    - HTML, XHTML highlighter - entities on the start of the line or entities right behind each other
    - SpellCheck, Add accent marks function works with words starts with accented char too
    - File list - click on the modified column header
    - Bookmark icon size in the Search menu or in the Bookmark list window coresponds to the menu icon set size
    - working in WordWrap mode
    - Project load with active WordWrap
    - LOG with dark style has black font
    - Exception after program close when IDE style is switched off in settings
    - External applications and char � as splitter for LOG file
    - Other fixes reported by users
