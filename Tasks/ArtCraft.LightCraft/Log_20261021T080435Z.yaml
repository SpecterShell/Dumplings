  Key: ReleaseNotes
  Value: |-
    Note
    No FreeBSD aarch64 build in this release. We are having trouble building this architecture within the 5-hour CI timeout across all Craft apps, so we are releasing without it to unblock builds. FreeBSD x86_64 and every other platform are included. FreeBSD aarch64 builds will return once the build fits in CI.
    What's Changed
    - Integration batch 42: 31 community PRs by @echelon in https://github.com/storytold/lightcraft/pull/2236
    - Contributors: add Marco Arnulfo by @marcoarnulfo in https://github.com/storytold/lightcraft/pull/1964
    - Ignore zero or negative ISO when importing XMP by @Silvertree2010 in https://github.com/storytold/lightcraft/pull/2040
    - Start crop drags in the zone the cursor showed at the press by @Silvertree2010 in https://github.com/storytold/lightcraft/pull/2046
    - Reject signed hex digits in #rrggbb colour parsing by @Silvertree2010 in https://github.com/storytold/lightcraft/pull/2083
    - Reject trailing text after a bracketed IPv6 host in Url::parse by @Silvertree2010 in https://github.com/storytold/lightcraft/pull/2091
    - l10n: unify zh-hant library term and contact sheet wording by @wly-p in https://github.com/storytold/lightcraft/pull/2105
    - Strip XML 1.0-forbidden characters from XMP sidecar output by @Silvertree2010 in https://github.com/storytold/lightcraft/pull/2144
    - Refuse catalog snapshots with an out-of-range seq by @Silvertree2010 in https://github.com/storytold/lightcraft/pull/2149
    - Keep face index records aligned after a torn or failed append by @Silvertree2010 in https://github.com/storytold/lightcraft/pull/2150
    - X-Trans CMOS 4 bodies take the X-T3's spectral matrices by @smyrgeorge in https://github.com/storytold/lightcraft/pull/2224
    - Georgian: a symbol Noto Sans Georgian cannot paint by @Hamza0101 in https://github.com/storytold/lightcraft/pull/2235
    - Localize Info Overlay mode-change notices by @skybluu in https://github.com/storytold/lightcraft/pull/1416
    - LR-EXP-TYPE: omit redundant alpha from opaque 8-bit exports (#1670) by @FredApps in https://github.com/storytold/lightcraft/pull/1691
    - Model downloads: Time out and cancel the name lookup (#1532) by @endthestart in https://github.com/storytold/lightcraft/pull/1778
    - Drop out-of-range GPS coordinates read from XMP by @Silvertree2010 in https://github.com/storytold/lightcraft/pull/1838
    - fix(import): keep Lightroom luminance ranges open at white, report unmapped local sliders by @egegl in https://github.com/storytold/lightcraft/pull/1844
    - Match f:/aperture:/focal: search tokens at f32 precision by @Silvertree2010 in https://github.com/storytold/lightcraft/pull/1845
    - AI denoise: support 102 MP Bayer raws (#1880) by @justinjohn0306 in https://github.com/storytold/lightcraft/pull/1884
    - JPEG XL: check dimensions during loading & bound tracked allocations (#1517) by @bogusyogi in https://github.com/storytold/lightcraft/pull/1893
    - HEIF: max_pixels on uncropped SPS sizes and grid totals (#1518) by @bogusyogi in https://github.com/storytold/lightcraft/pull/1894
    - LR-MERGE-HEADLESS: merge dialogs remember the last settings per kind by @mattsivak in https://github.com/storytold/lightcraft/pull/1898
    - docs: refresh README features, counts and setup requirements by @shurkanTwo in https://github.com/storytold/lightcraft/pull/1902
    - Contributors: credit nledford by real name by @nledford in https://github.com/storytold/lightcraft/pull/1911
    - Hasselblad FFF: colour matrix from the embedded 3FR header by @06needhamt in https://github.com/storytold/lightcraft/pull/1919
    - raw: alias Canon EOS R6 Mark II to EOS R6m2 by @naryzach in https://github.com/storytold/lightcraft/pull/1935
    - Merged develop settings are kept in range, as XMP import keeps them by @marcoarnulfo in https://github.com/storytold/lightcraft/pull/1960
    - TIFF: read strips and tiles larger than 128 MiB by @marcoarnulfo in https://github.com/storytold/lightcraft/pull/1989
    - Reject out-of-range start in photo.rename and photo.renamePreview by @Silvertree2010 in https://github.com/storytold/lightcraft/pull/2035
    - Show the applied profile when hovering it in the profile browser (#2057) by @MarekSpodBiedry in https://github.com/storytold/lightcraft/pull/2070
    - Make TIFF chunk-length inference and header-plan merging fast by @Silvertree2010 in https://github.com/storytold/lightcraft/pull/2151
    - docs: drop references to competing commercial software by @dylanmtaylor in https://github.com/storytold/lightcraft/pull/2213
    - ci: configure Dependabot for Cargo and GitHub Actions by @dylanmtaylor in https://github.com/storytold/lightcraft/pull/2256
    - #1949: pt-BR for Include selected photos and the mask overlay modes by @francoisgn in https://github.com/storytold/lightcraft/pull/2033
