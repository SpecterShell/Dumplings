  Key: ReleaseNotes
  Value: |-
    Note
    FreeBSD aarch64 is dropped from this release. We had to cut releases, and we cannot build this target within the 5-hour CI limit for any of the Craft apps, so we are dropping it for now. This is a known blocker, flagged for a future fix in storytold/craft-common-actions#39. FreeBSD x86_64 and every other platform are included.
    What's Changed
    - security: enforce HTTPS on curl downloads (SonarCloud S6506) by @dylanmtaylor in https://github.com/storytold/lightcraft/pull/2493
    - Use chrono instead of hand-rolled UTC conversion by @dylanmtaylor in https://github.com/storytold/lightcraft/pull/2457
    - Integration of 85 reviewed PRs (round 2) by @aiongg in https://github.com/storytold/lightcraft/pull/2515
    - LR-IMP-LOCAL: Opening on Missing Photos no longer checks every original by @alexbystrow in https://github.com/storytold/lightcraft/pull/2024
    - LR-META-XMP: reread embedded JPEG metadata by @sanyamsingh001 in https://github.com/storytold/lightcraft/pull/2042
    - LR-VIEW-PHOTOGRID: the grid reads only the photos an import batch or an edit touched by @nledford in https://github.com/storytold/lightcraft/pull/2054
    - LR-BEHAV-LOCALIZE: German catalog filled, 217 interface strings and 862 What's New lines (80% → 97%) by @helgehelge123 in https://github.com/storytold/lightcraft/pull/2066
    - LRC-DEV-AUTOSYNC: sync HDR state while retaining per-photo tuning by @sanyamsingh001 in https://github.com/storytold/lightcraft/pull/2177
    - LRC-DEV-AUTOSYNC: sync camera local tone Off by @sanyamsingh001 in https://github.com/storytold/lightcraft/pull/2208
    - LR-EDIT-OPTICS-PROFILE: look up Nikon DSLR lenses by their lens specification by @nerdislb in https://github.com/storytold/lightcraft/pull/2217
    - LR-META-XMP: fewer false "XMP adjustments were not imported" warnings for Lightroom raws by @mattsivak in https://github.com/storytold/lightcraft/pull/2257
    - LR-IMP-PREVIEW-READ: thumbnails of Lightroom HDR/panorama DNGs develop from their reduced raw copies (38 s → 1 s) by @mattsivak in https://github.com/storytold/lightcraft/pull/2263
    - Analyse a photo listed twice once in Assisted Culling by @Silvertree2010 in https://github.com/storytold/lightcraft/pull/2271
    - i18n: Indonesian (id) interface language by @RevDonz in https://github.com/storytold/lightcraft/pull/2295
    - test(ui): wait for menu registration and visible sync rows by @sanyamsingh001 in https://github.com/storytold/lightcraft/pull/2296
