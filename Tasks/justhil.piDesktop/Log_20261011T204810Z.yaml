  Value: |-
    pi Desktop v0.7.5
    新增
    - 链接右键菜单与悬停预览：回复里的网页链接可以右键在外部浏览器打开或复制地址，鼠标停留片刻会弹出卡片，显示域名、网页标题、摘要和分享图；文件链接右键可以打开文件、在文件夹中显示或复制路径，悬停卡片显示文件名和完整路径。工作区内的文件在 Files 面板里预览并定位到引用的行，工作区外的文件用系统默认程序打开；Windows、WSL 路径以及带中文、空格的文件名都能识别
    修复
    - 冷启动后点开输入框的模型选择器，经常显示「无可用模型」：启动初期模型列表还没准备好时拿到的空结果不再被当成最终结果，会自动重试几次；等待期间显示「正在加载模型…」
    - 新对话发送第一条消息时卡住不动（项目有未提交改动并开启 Dirty Repo Guard 时会多弹一次确认）；发送失败或取消后，已清空的输入和附件现在会恢复到输入框
    - 从别的项目点进另一个项目的「新会话」，之前写好的草稿不显示，要再进一次才出现
    - 新对话里删光文字后继续按退格，空行越删越多，后面输入的内容落到提示文字下方

    安装包见本页 Assets。更新说明以本正文为准（应用内「发现新版本」弹窗会展示）。
