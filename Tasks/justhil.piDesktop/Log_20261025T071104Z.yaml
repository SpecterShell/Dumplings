  Key: ReleaseNotes
  Value: |-
    pi Desktop v0.7.7
    修复
    - 分屏会话：Windows 上从侧栏 Ctrl+点击，在旁边打开另一个会话时，原窗格不再被一起替换，左右窗格保持各自的会话
    - 回复截断：长回复输出时切走再切回，不再只显示开头一部分；刷新历史时也会保留已经收到的完整内容（#130）
    - 会话切换：消息、运行状态、模型与思考强度、排队消息等按会话分别保存，减少切换时内容和状态串到其他会话的问题；删除会话或草稿转为正式会话后，也会清理旧状态（#129）
    - Windows MCP：启动命令不存在时明确提示缺失的命令，不再只显示连接关闭；修复可执行文件扩展名大小写导致的命令识别问题
    - 依赖安全：更新 DOMPurify，修复已知安全问题（#131）
    优化
    - 代码高亮加载：语法和主题资源拆分为按需加载，不再全部打进同一个高亮资源包

    安装包见本页 Assets。更新说明以本正文为准（应用内「发现新版本」弹窗会展示）。
