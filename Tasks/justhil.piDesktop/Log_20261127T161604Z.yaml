  Key: ReleaseNotes
  Value: |-
    pi Desktop v0.8.1
    新增
    - Google AI Ultra 订阅抢先体验（上游 PR #12614）：在「设置 → 模型」新增 Google AI Ultra 订阅 卡片，支持按需从上游 earendil-works/pi#12614 拉取非侵入式本地兼容扩展，无需等待或升级内置 Pi SDK 即可一键登录并使用 Gemini 4 系列模型（gemini-4-hydrogen、gemini-4-neon、gemini-4-carbon、gemini-3.5-flash-lite）；采用系统代理感知的 PKCE + DPoP OAuth 授权流（提供手动粘贴回调 URL 兜底），并在后续升级到原生内置 google-ai-plan 的 Pi SDK 后自动检测并清理旧版抢先扩展，同时保留已有登录凭据
    - 四栏工作台重构、AI 画布（AI Canvas）与外观引擎升级：桌面端重构为无缝 L 型四栏工作台（48px 对齐顶栏、极简左侧活动栏、固定序侧栏与无损收藏置顶、按需打开且支持中键关闭的右侧多标签工作坞、Codex 风格新标签启动台）；新增 AI 画布（Canvas） 与 canvas_* 主机工具，支持沙盒 HTML、结构化 UI 块、图表、Markdown、委派树与设备画面流渲染（默认保持干净空白）；升级 4 标签页实时外观调校与工作台预览，新增极光/网格底衬、Codex Light / Nord / Catppuccin 主题及面板显隐与预设布局切换
    - 会话分支树（Tree）全面重做（#150）：用「轮次聚合微卡片 + 彩色缩进分支轨」取代旧版泳道图，直接展示每轮提问、回复摘要与工具步数；筛选时完整保留全部分叉锚点，支持按分支折叠、一键聚焦当前分支、实时关键词搜索与快速定位当前节点
    - 侧栏长会话列表自动折叠（#151）：项目会话较多时自动折叠并支持展开/收起切换与键盘导航，保持侧栏清爽紧凑
    优化与修复
    - 右键菜单与窄侧栏弹出层防裁切（#149）：按 UI 缩放比例精确测量菜单尺寸，贴近窗口边缘自动向上或向左翻转，低视口高度自动启用内部滚动；窄右侧栏下拉菜单统一通过 Portal 挂载至 document.body，消除宽度裁切与遮挡
    - 侧栏与右侧栏交互优化：侧栏「已置顶」区块移至项目列表最上方；点击已展开的项目名支持直接折叠收起；侧栏展开项目会话列表统一使用悬浮滚动条；右侧栏关闭最后一个业务标签页后保留「新标签页」启动台不自动收起，仅在关闭新标签页本身时收起右侧栏

    安装包见本页 Assets。更新说明以本正文为准（应用内「发现新版本」弹窗会展示）。
