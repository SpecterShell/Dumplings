  Key: ReleaseNotes
  Value: |-
    Grox v0.3.4
    本版本集中修复 Grok Build 兼容服务的配置边界、ACP 事件归属，以及思考、工具调用、流式输出和会话删除体验。
    模型服务与配置
    - 兼容服务改用 Grox 自有的 grox-relay-* 模型段，不再覆盖官方或用户维护的模型配置。
    - 供应商档案成为账户模式和活动档案的单一真相源，并自动迁移 v0.3.3 的遗留配置。
    - 中转服务使用独立的兼容 API 凭据，避免被官方 xAI 辅助请求误用。
    - 启动时统一载入供应商状态和目录；配置损坏或读取失败会明确呈现。
    会话、思考与工具
    - 思考过程实时展开，完成后保留思考、工具和计划轨迹；工具批次默认可见。
    - ACP 增量内容逐片投影，保留重复正文和 GFM 表格片段，并减少重复滚动与布局刷新。
    - 兼容服务没有返回思考、工具或来源事件时会如实提示，不再伪造搜索记录。
    - 已取消或过期请求的迟到响应不会再触发错误的“协议错误”提示。
    稳定性与体验
    - 删除当前会话会取消过期导航并返回任务首页，不再停留在“正在恢复任务”。
    - 收紧 Host 事件顺序、回合终止和终端清理，降低重复事件与残留状态。
    - 项目、会话、工作树重命名和命令面板支持输入法组合输入，避免回车误提交。
    - 修复删除确认框的点击穿透，避免操作结束后重新打开底层入口。
    平台
    - Windows 10/11 x64
    - macOS Apple Silicon
    - macOS Intel
    完整变更：https://github.com/dandandujie/Grox/compare/v0.3.3...v0.3.4
