- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    本次更新
    - 左侧边栏现在可以通过标题栏按钮、侧栏按钮或 Ctrl/⌘B 隐藏与恢复，并会记住显示状态。
    - 会话和项目删除升级为真正的永久删除：同步清理 CLI 会话、本地历史、缓存与索引，并通过删除标记防止重启或重新导入后复活；删除项目不会触碰项目源码文件。
    - “归档项目”改为归档该项目下的全部会话，不再创建单独的归档项目目录；归档会话仍保留在归档管理界面，可恢复或永久删除。
    - 新增正式版本一键回退能力，自动选择低于当前版本的最近稳定版，并继续执行平台匹配、可信下载来源与 SHA-256 完整性校验。
    - 完成 Grok Build v1.0.0 的 ACP 集成与跨平台验证，并将上游跟踪改为按公开稳定版本推进，避免对同一版本的普通源码提交重复创建适配 Issue。
    - 改进会话离线恢复、历史持久化、长时间线渲染与自适应布局，并修复未跟踪文件未计入 Git 变更统计的问题。
