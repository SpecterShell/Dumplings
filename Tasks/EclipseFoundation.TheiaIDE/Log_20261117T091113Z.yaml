    Breaking Changes:
    - [all] the runtime packages are ES modules now, see the migration guide #13272
    - [ai-anthropic, ai-google, ai-ollama, ai-openai] AnthropicModel, GoogleModel, OllamaModel and OpenAiModel no longer take constructor arguments; they are @injectable, configured by an injected <provider>ModelParams, and created via <provider>LanguageModelFactory #17623
    - [ai-ollama, ai-openai] removed the unused OllamaModelFactory and OpenAiModelFactory symbols; use OllamaLanguageModelFactory and OpenAiLanguageModelFactory #17623
    - [ai-openai] moved OpenAiModelUtils from openai-language-model.ts to openai-model-utils.ts #17623
    - [ai-openai] replaced the SDK runTools runner: OpenAiModel.createTools() returns ChatCompletionTool[], and OpenAiModel.runnerOptions and the runnerOptions parameter of OpenAiResponseApiUtils.handleRequest were removed #17623
    - [ai-openai] removed the openAiModelUtils and responseApiUtils fields of OpenAiLanguageModelsManagerImpl #17623
    - [core] replaced KeyboardLayout.key2KeyCode with candidatesByCharacter and candidatesByFoldedCharacter. Consumers must select KeyboardLayoutCandidate values containing the physical key, logical character, and layout modifiers. The protected KeyboardLayoutService.transformKeyCode() and getCharacterIndex() extension points were removed; subclasses must move custom resolution logic to resolveKeyCode() and candidate lookup #17892
    - [core] changed KeyboardLayoutService.validateKeyCode to require the normalized keyboard input as its second argument. Callers must pass the input used to create the KeyCode #17892
    - [core] changed KeyCode identity and serialization for logical keybindings: equals() now requires the same physical key and dispatchString(), character-only values are no longer modifier-only, and toString() preserves authored spelling rather than exposing runtime identity. Consumers comparing or serializing KeyCode values must choose the appropriate method #17892
    - [core] changed KeybindingRegistry.matchKeybinding() results from match.binding to match.runtime, which contains the binding and resolved sequence. Pass resolved sequences from resolveKeybinding() or runtime interpretations; raw KeySequence.parse() output is no longer guaranteed to match under keyboard.dispatch: 'code'. Protected chord handling now uses keySequenceCandidates, and keybinding-tree values are runtime records instead of ScopedKeybinding[]; subclasses consuming or overriding these members must adapt #17892
    - [core, plugin-ext] changed AcceleratorSource.getAccelerator to require a form: 'logical' | 'physical' argument. Custom implementations must return logical labels for browser UI and physical accelerators for Electron native menus #17892
    - [core] added withContext(context: HTMLElement | Context, callback) to the ContextKeyService interface #18113
    - [core] upgraded to TypeScript 6.0.x: configs/base.tsconfig.json now enables esModuleInterop, uses moduleResolution: bundler, and declares global types explicitly. Published extensions that emit import helpers must declare tslib; consumers compiling Theia's declarations need esModuleInterop, allowSyntheticDefaultImports, or skipLibCheck. TreeProps.viewProps and TreeWidget.ViewProps no longer accept the inherited HTML width, height, or rows properties, and @theia/localization-manager now depends on TypeScript 6. See the migration guide #18100
    - [core] TreeSelectionState keeps the ids of the selected nodes rather than the nodes themselves, so that it does not retain nodes the tree has replaced. selectionStack became a getter that resolves those ids against the tree and leaves out the nodes it no longer holds, so it can no longer be redeclared as a property by a subclass #18111
    - [core] added the required restoreWidget method to the SecondaryWindowService interface; implementations that don't extend DefaultSecondaryWindowService need to add it. Removed the unused secondaryWindowHandler field from ColorApplicationContribution and StylingService #18211
    - [core] the tabs of TheiaDockPanels with drag and drop enabled, e.g. the main and bottom areas, are dragged with native HTML drag and drop instead of Lumino's pointer-based drag. Their ToolbarAwareTabBars set tabsMovable to false, so Lumino no longer emits tabDetachRequested for them, and tabMoved is only emitted when a tab is dropped within its tab bar. Drop targets for tabs keep receiving Lumino's lm-* drag events, translated by the new NativeTabDragService #18211
    - [core] FrontendApplication.start() no longer waits for the loading indicator (.theia-preload) to fade out before reaching ready: revealShell() resolves when the fade-out starts and the indicator is removed in the background through the new removeStartupIndicator(). The default fade-out was shortened from 0.8 s to 0.15 s. Code that assumes .theia-preload is gone at ready must wait for its removal, see the migration guide #18201
    - [debug] removed the copyValue, valueRef and setValueRef members from DebugVariable and DebugWatchExpression; adopters that use these public members need to update their integrations #18132
    - [debug] DebugConsoleSession.debugSession is now a read-only DebugSession | undefined, as the console releases the session once it terminates. The setter is replaced by startFor(session), the new label and configurationName describe a session that has already ended, and id is now generated, so a console is no longer found by ConsoleSessionManager.get(session.id) #18111
    - [electron] upgraded Electron from 42.8.1 to 44.4.5. Downstream Electron applications must update their electron devDependency to 44.4.5. Electron 44 requires macOS 13 (Ventura) or later and ships only 64-bit (x64/arm64) builds, and its clipboard module was rearchitected to the async W3C Clipboard API and is no longer exposed to the renderer process. As a result the TheiaCoreAPI preload method readClipboard() now returns Promise<string> (backed by ipcRenderer.invoke/ipcMain.handle instead of synchronous IPC) and ElectronClipboardService.readText() now returns a Promise<string>; adopters with a custom Electron preload script must return a promise from readClipboard(). Rebuilding native modules for Electron 44 requires GCC 13 or later, or Clang; on Ubuntu 22.04, whose GCC is older, build with Clang, e.g. CC=clang CXX=clang++. See the Electron breaking changes for 43.0 and 44.0. #18150
    - [filesystem] renamed ParcelFileSystemWatcherService to FileSystemWatcherServiceImpl and moved it to node/filesystem-watcher-service-impl.ts. Removed its watchers and watcherHandles maps and its createWatcher, getWatcherKey, registerWatcher, and getLiveWatcher methods; adopters overriding them should move that logic into a RecursiveWatcherProvider or DirectoryWatcherProvider. Moved ParcelWatcher to node/parcel-watcher/parcel-watcher.ts, renamed ParcelWatcherOptions to ParcelWatcherExcludes, and deprecated the initialClientId constructor argument of ParcelWatcher. parcel-filesystem-service.ts re-exports the old names and is deprecated #17875
    - [plugin-ext] removed the workspaceService constructor parameter and the shouldSkipWatch method from MainFileSystemEventService. They implemented a mitigation that dropped non-recursive plugin watches rooted above a workspace root, which is obsolete now that the backend honors recursive #17875
    - [plugin-ext] PluginDebugAdapterTracker.create and DebugExtImpl.createDebugAdapterTracker now resolve to undefined when no factory provides a tracker for the session. Callers must handle undefined, and PluginDebugAdapterSession now accepts an optional tracker #18255
    - [plugin-ext] browser-only plugin globalState and workspaceState moved from localStorage to files and are not migrated. The protected API of BrowserOnlyPluginServer changed accordingly #18122
    - [core] reworked the preference API to use explicit override identifiers instead of encoding them into preference names (e.g. [typescript].editor.tabSize). Adopters that read, write or listen to language-scoped preferences through PreferenceService, PreferenceProvider or the change events must migrate to the new signatures #16046. Preference change events for "override names" like [typescript].editor.tabSize will no longer be sent. Listen for the base name (editor.tabSize) and check whether the event affects your use case. The typed getters like getBoolean(...) in PreferenceServiceImpl have been removed in favor of typed overloads of get(...) in the PreferenceService interface.
    - [plugin-ext] the plugin host resolves the workspace folders of debug sessions and folder scoped tasks through WorkspaceExtImpl instead of creating them. DebugExtImpl injects WorkspaceExtImpl, TasksExtImpl takes it as a third constructor argument, and TaskProviderAdapter takes a function returning the workspace folder of a URI as a second constructor argument. The toTask type converter requires such a function and returns undefined for a task scoped to a folder that is not in a workspace folder; use the new toTaskDefinition to convert only the definition. TasksMain.$executeTask takes a request id as a second argument, which TasksExtImpl uses to give the execution reported by $onDidStartTask the task passed to tasks.executeTask #18186
    - [task] made TaskService.isEventForThisClient public, so that the plugin system can tell whether a task event is for this client. Subclasses that override it have to make their override public as well #18186
    - [telemetry] moved TelemetryPrimitive, TelemetryValue, TelemetryData, isTelemetryData, snapshotTelemetryData, TelemetryEventKind, isTelemetryEventKind and TelemetryReportOptions from telemetry-service.ts to telemetry-types.ts. They are still re-exported from @theia/telemetry/lib/common, so only deep imports of telemetry-service must be updated #18020
