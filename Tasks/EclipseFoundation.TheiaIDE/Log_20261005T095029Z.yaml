  Key: ReleaseNotes
  Value: |-
    - [ai] added gpt-6-astra, claude-fable-5-1 and gemini-3.8-flash to the default models #18033
    - [ai] clamped the reasoning level to the model's supported levels #18048
    - [ai] surfaced reasoning summaries on OpenAI Responses and fixed non-streaming thinking handling #18046
    - [ai] surfaced userInteraction calls from delegated sessions #17984
    - [ai-anthropic, ai-openai] supported custom HTTP headers for custom model endpoints #17907 - Contributed on behalf of K2view
    - [ai-chat] supported resuming delegation sessions via sessionId #17965 - Contributed on behalf of K2view
    - [ai-chat-ui] added sticky response headers and a live thinking preview #18069
    - [ai-chat-ui] kept chat input cursor visible on wrapped lines #18013
    - [ai-chat-ui] labeled streaming tool calls from top-level fields only #18026
    - [ai-chat-ui] skipped doomed JSON.parse on streaming tool arguments #17975
    - [ai-chat-ui] supported searching text within a chat session #18024
    - [ai-copilot] fixed visibility of "I have authorized" button when using the authorization dialog twice #18034 - Contributed on behalf of MVTec Software GmbH
    - [ai-copilot] supported images with copilot models #17992 - Contributed on behalf of MVTec Software GmbH
    - [ai-core, ai-openai] kept model discovery from throwing on the body-less models request #18058
    - [ai-core-ui] fixed agent detail select font and truncated tool descriptions #17987
    - [ai-google] fixed token usage showing incorrect values for Gemini models #17991
    - [ai-ide] rejected malformed userInteraction arguments #17964
    - [ai-ide] unclipped the AI configuration breadcrumb popup list scrollbar #18028
    - [ai-ollama] accepted the tool_calls done reason #17972
    - [ai-registry] resolved MCP entries via any approval with a usable install config #17997
    - [ai-registry] routed AI settings links through the AI settings command #18000
    - [ai-tool-sketchpad] made SketchedToolServiceImpl.onStart non-blocking (265.66ms → 0.56ms) #17953
    - [bundle-plugin] resolved ripgrep from app.asar.unpacked in asar-packaged apps #18018
    - [core] aligned icon and label in viewsWelcome buttons #18004
    - [core] recovered file decorations dropped by large change events #17766 - Contributed on behalf of K2view
    - [core] rendered hovers in the document of their target element #17934
    - [core] scrolled tree widgets to the focused node once per request #18063
    - [core] stopped the dialog overlay retaining the first dialog #18060
    - [core] translation update for version 1.76.0 #18071
    - [core] upgraded npm dependencies after 1.75.0 #18005 - Contributed on behalf of STMicroelectronics
    - [docs] required a changelog entry only for breaking changes #18056
    - [external-api] added contributable HTTP API for external tools #17791
    - [getting-started] supported SVG rendering and interactive command links in walkthroughs #17954
    - [monaco] kept the tokenizer state when a line exceeds the line limit #18008
    - [plugin-ext] fixed saving editors that are not text editors #17977
    - [plugin-ext] handled native Windows separators in relative() #18035 - Contributed on behalf of JuliaHub, Inc.
    - [plugin-ext] ignored OS metadata files when resolving a local plugin directory #18009
    - [plugin-ext] routed setTextDocumentLanguage to the notebook cell model #17990
    - [preferences] filtered settings editor by selected category #17526
    - [preview] removed deprecated @theia/preview extension code #18002
    - [private-eslint-plugin] added the preload-localization-check ESLint rule #18017 - Contributed on behalf of STMicroelectronics
    - [vscode] bumped the VS Code API compatibility and updated the nls metadata to 1.139.0 #18068 - Contributed on behalf of STMicroelectronics
    - [workflows] authenticated SBOM uploads with PIA #18050

    Breaking Changes:
    - [ai-anthropic, ai-google, ai-openai] removed the curated model list preferences ai-features.anthropic.AnthropicModels, ai-features.google.models and ai-features.openAiOfficial.officialOpenAiModels; the models are discovered from the provider and can be pinned with the new ai-features.<provider>.modelOverrides. An API key found in the environment is no longer used until it has been confirmed once, per provider in ai-features.<provider>.allowEnvironmentApiKey. The AnthropicLanguageModelsManager, GoogleLanguageModelsManager and OpenAiLanguageModelsManager interfaces gained fetchAvailableModels, getApiKeySource and setAllowEnvironmentApiKey, and CopilotLanguageModelsManager.fetchAvailableModelIds was replaced by fetchAvailableModels. See the migration guide #18011
    - [ai-copilot] removed the direct REST transport and its GitHub OAuth App sign-in; all requests are now served by the official GitHub Copilot CLI, which is signed in from within the application and needs to be reachable on the machine hosting the backend. Access to the Copilot models is granted per OAuth application, and the built-in application was never entitled for the current lineup, so the REST path only ever exposed a small legacy subset. Removed as a consequence: the CopilotOAuthConfig symbol and its DEFAULT_COPILOT_OAUTH_CONFIG value, the CopilotLanguageModel class, getCopilotApiBaseUrl, COPILOT_API_BASE_URL, and the enableStreaming and supportsStructuredOutput members of CopilotModelDescription. CopilotAuthService.initiateDeviceFlow, pollForToken, getAccessToken and signOut are replaced by startSignIn, waitForSignIn and cancelSignIn, since the CLI performs and polls the flow itself and owns the resulting token, and setExecutablePath has been added so that the frontend can hand the configured location of the CLI to the backend. Users have to sign in again: the sign-in of the previous version belongs to an OAuth app that is no longer used, so it is removed from the credential store on first start and a notification asks for a new sign-in. Adopters that rebound CopilotOAuthConfig to their own OAuth App no longer need to, and adopters relying on the REST transport should note that structured output is not available on the CLI path. See the migration guide #17919
    - [ai-core-ui] replaced the .ai-variant-action-button and .ai-configuration-value-row-copy CSS classes with the shared .ai-configuration-icon-button of the new AiConfigurationIconButton component #18011
    - [ai-ide] IdeChatWelcomeMessageProvider no longer renders the default-agent picker (renderAgentSelectionScreen) or the tool-confirmation explainer (renderToolConfirmationAlert), and no longer blocks the chat on a missing default chat agent; that content moved to the getting started walkthrough. AiConfigurationDetailWidget.centerInBody() became revealInBody() and scrolls a deep-linked row to the top of the page rather than its centre. @theia/ai-ide now depends on @theia/getting-started #17969
    - [ai-ide] rebound ScmCommitWidget to AiAwareScmCommitWidget, which renders the stock SCM commit input plus an AI overlay. Adopters that rebind ScmCommitWidget themselves now override this binding and lose the commit-message button; they should extend AiAwareScmCommitWidget instead of ScmCommitWidget to keep it #17669
    - [core] made the contextMatcher parameter of TabBarToolbarItem.isVisible mandatory, so that neither a caller nor an override that drops the argument can fall back to the context of the focused widget. Adopters calling isVisible themselves have to pass a matcher, and subclasses overriding it have to declare and forward the argument; passing the injected ContextKeyService reproduces the previous behavior #17978
    - [core] changed the CHANNEL_WC_METADATA Electron channel to answer with the whole TheiaCoreAPI.WindowMetadata object ({ webcontentId, launchArgs }) instead of just the webContents id, so that a window also receives the parsed CLI options of a forwarded launch synchronously; adopters with a custom Electron preload script must return the object #17801
    - [core] widened DecorationsProvider.onDidChange to Event<URI[] | undefined>, where undefined is a flush signalling that all decorations may have changed. DecorationsService.onDidChangeDecorations now fires batched payloads that never list removals: an empty map means an unspecified set changed, and clients must re-query the decorations they display on every event #17766
    - [core] the browser-only EnvVariablesServer stub now returns file:///.theia from getConfigDirUri() and file:/// from getHomeDirUri() instead of an empty string. Browser-only application state moves from the OPFS root to /.theia and is not migrated automatically, see doc/Migration.md #17966
    - [dev-container] added an electronMain entry point to @theia/dev-container (lib/electron-main/dev-container-electron-main-module); Electron adopters that assemble their extension list manually must include it, otherwise a --attach-container launch into a running instance opens a regular window instead of attaching #17801
    - [getting-started] Walkthrough.pluginId is now optional, since a walkthrough contributed by a Theia extension has no contributing plugin. WalkthroughService.syncWalkthroughsFromPlugins() became syncWalkthroughs(), registerWalkthrough(contribution) became registerWalkthrough(id, definition, pluginId?, pluginIcon?). The hard-coded AI banner and news sections were removed from GettingStartedWidget (renderAIBanner, renderNews); the AI packages contribute a walkthrough instead #17969
    - [plugin-ext] moved PluginPaths from lib/main/node/paths/const to lib/main/common/paths/const so the browser-only frontend can share it. The old module still re-exports it but is deprecated #17966
    - [plugin-ext] @theia/plugin-ext now depends on @theia/telemetry. createAPIFactory takes a new trailing telemetryExt argument. TelemetryExtImpl tracks a TelemetryLevel instead of a boolean, its isTelemetryEnabled setter is replaced by setLevel(level). TelemetryLogger takes the level and a level-change Event in its constructor, and its telemetryEnabled property is replaced by a level getter #17963
    - [telemetry] TelemetryConsentProvider has a new required ready promise, which custom implementations must settle even when consent cannot be determined. isKindAllowedByLevel, TelemetryEventKind and isTelemetryEventKind moved to telemetry-types, deep imports need updating #17963
