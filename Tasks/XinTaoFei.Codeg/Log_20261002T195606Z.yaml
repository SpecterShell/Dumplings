- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    This one lets agents see and operate your desktop. With the new Computer Use preview, you share a window, a whole app or the entire screen, and agents can read it and click, type and drag in it, with Stop sharing always one click away. Codex moves up to its 2.1.1 adapter and Claude Code to 0.85.1, and seven more bundled agents get new versions.
    Alongside that: the desktop app reopens the workspace windows you had open when you quit, the on-screen keyboard stays down when you switch conversations on a touch device, icons draw a little lighter, a to-do runs the agent its picker shows, and on Windows codeg-server installs into a folder of its own.
    New
    - Agents can see and operate the windows you share with them (preview) — switch it on under Settings → Computer Use, share a window from the status bar's Computer use panel as "Read only" or "Read and act", and agents can take screenshots, read what the window shows, and click, scroll, type and press keys in it on macOS, Windows and Linux, while the panel lists what they just did; nothing is readable until you share it. (#870)
    - One click or one shortcut stops everything — "Stop sharing" in the Computer use panel or on the floating stop bar, or Ctrl+⌘+Esc (Ctrl+Alt+Esc on Windows and Linux), ends every sharing and cuts off whatever agents are doing, and a shared window no agent has used for 30 minutes (adjustable) stops being shared by itself. (#870)
    - codeg's own windows and your never-share list stay off limits — password managers and system settings are on the list by default, and you can add or remove apps. (#870)
    - You can share a whole app or the entire screen — an app shared as a whole includes the windows it opens later, its menus and its own shortcuts, and "Offer the entire screen" (macOS and Windows, off by default) lets agents see one picture of the screen and click anywhere on it, with codeg's windows and never-share apps painted over. (#870)
    - Agents can do more than click — drag, hold keys, restore minimized or hidden windows and, for apps that take no keys in the background (such as Edge, Chrome and VS Code on Windows), bring the window to the front, which you can switch off; opening apps, moving windows and using the clipboard have their own switches, off by default, and an agent can only paste what it put on the clipboard itself. (#870)
    - codeg-server can offer computer use too — start it with CODEG_COMPUTER_USE=1 and its web clients can share the server machine's windows and stop them from the same panel. (#870)
    - The desktop app reopens the workspace windows you had open when you quit — the local one and each remote workspace, with the one you were using back in front, and a remote workspace that can't be reached is reported in the local window.
    Improved
    - Updated bundled agents: Claude Code ACP 0.85.1 (Claude Code 2.1.286), Codex ACP 2.1.1 (Codex CLI 0.159.3), OpenCode 1.18.34, Cline 3.0.67, CodeBuddy 2.161.0, Grok 1.0.46, Qoder 1.1.65, OpenClaw 2026.9.7, Cursor 2026.09.28.
    - Forking a conversation no longer leaves the original session held by the agent — codeg closes it after the fork, so Codex lets go of it within about a minute and Claude Code stops keeping a process running for every fork, and the "open elsewhere" banner now says to reload in about a minute if you just forked.
    - Icons draw a little lighter — those at the icon set's default weight of 2 now use 1.75, which sits better beside small text, while icons given a deliberate weight keep it. (#866, @SousekiL)
    - Settings → "Browser" is now "Browser Use", next to the new "Computer Use" page, and "Collaboration" moves up to follow "General". (#870)
    - On Windows, codeg-server installs into its own folder, %LOCALAPPDATA%\codeg-server, so neither install overwrites the other's files or stops the other's processes, and re-running the install script moves a server that shares the desktop app's folder out of it. (#870)
    - The desktop app drops about 70 MB it never used — the standalone server binary is no longer bundled with it. (#870)
    - The built-in model catalog is refreshed — 8,339 models from 225 providers, up from 8,281 models.
    Fixed
    - On a touch device, switching to another conversation no longer pops up the on-screen keyboard over it — tapping the message box still brings it up, and desktop behavior is unchanged. (#865, @Flyneen)
    - A to-do runs the agent its picker shows — on a fresh install, or when the usual agent is disabled, the picker could show an agent that wasn't actually saved, and the to-do then failed to start with "no agent configured"; now the agent shown is saved with the to-do, and the hint under the picker says whether it is inherited or saved. (#864 reported by @qq974969638)
    - Quitting with ⌘Q, from the Dock or by logging out now runs the full quit cleanup — agent processes, terminals and the web service are stopped as they are when you quit from inside codeg, and logging off on Windows does the same.
    - Cline runs on macOS 27 — macOS 27 killed Cline 3.0.65 and earlier at launch, while 3.0.67 ships with a valid signature, so upgrade it in Settings → Agents; OpenCode 1.18.34 is now properly signed too.
    - A background command in a Claude Code conversation no longer has its card overwritten with internal marker text when it finishes, and one that moved to the background because you sent a message or it timed out shows the Background badge.
    - Codex conversations reopen more faithfully — a question you answered with your own text under "Other" comes back as that text rather than as two picks, a failed compaction shows the service's error message instead of raw JSON, and a conversation started in the Codex desktop app shows its attachments as links followed by your request, titled after what you wrote.
    - A search pipeline that finds nothing no longer shows as a failed command — a command like rg --files src | rg foo that ends in rg or grep and matches nothing now reads as completed with its exit code still shown, instead of a red failure counted as an error in its tool group, while real errors such as exit code 2 or an error message still show as failed. (#877 reported by @Ryn-Mic)
    - Grok's model picker picks up the full model list — in a session opened before Grok had fetched its model catalog, such as after your sign-in expired, the picker kept the short built-in list for the rest of the connection; it now updates as soon as Grok announces the catalog, and the model and reasoning effort you chose stay selected. (#876 reported by @goon-13)
    Note
    - Computer use downloads the open-source cua-driver (0.32.0) the first time it is needed, or when you press Install in Settings → Computer Use.
    - On macOS, grant Accessibility and Screen Recording to codeg-computer-helper, not to codeg — only codeg can use that helper, so agents' own shells can't borrow the permissions; Windows and Linux have no such separation, so there the settings decide what agents get through codeg.
    - On Windows, codeg-server's web files now live in %LOCALAPPDATA%\codeg-server\web — if your server moves there, update a CODEG_STATIC_DIR that still points at %LOCALAPPDATA%\codeg\web.
    - With Claude Code 2.1.286, sending a message moves a running command, MCP call or sub-agent to the background instead of waiting for it or interrupting it — codeg marks such a command with the Background badge, and a question card still open is dropped when you send, as before.
    - Behind a custom API address, Claude Code's model list no longer has separate "(1M context)" entries — since 2.1.285 those models use their 1M window by default, and a conversation saved on such an entry carries on with the plain model; if your gateway stops at 200K, Claude Code's advice is /autocompact 200k.
    - Cline 3.0.66 and later count output tokens without reasoning tokens, so reasoning models show lower output token counts.
    Thanks to @Flyneen and @SousekiL for contributing to this release, and to @qq974969638, @Ryn-Mic and @goon-13 for the reports.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    这一版让智能体能看见并操作你的桌面：在新的「电脑操作」（预览）里，你可以共享一个窗口、一个应用或整个屏幕，智能体就能读取画面，并在其中点击、输入、拖拽，「停止共享」则随时一键就能按下。Codex 升级到 2.1.1 适配器，Claude Code 升级到 0.85.1，另有七个内置智能体更新了版本。
    同期还有：桌面版会重新打开你退出时开着的工作区窗口，触屏设备切换会话时不再弹出软键盘，图标线条细了一点，待办任务会运行选择器里显示的智能体，Windows 上的 codeg-server 也装进了自己的文件夹。
    新增
    - 智能体可以查看并操作你共享给它的窗口（预览）——在「设置 → 电脑操作」里启用后，从状态栏的「电脑操作」面板把窗口共享为「仅读取」或「读取并操作」，智能体就能在 macOS、Windows 和 Linux 上截图、读取窗口内容，并在窗口里点击、滚动、输入和按键，面板里还会列出它们刚做了什么；没有共享的窗口一律读不到。（#870）
    - 一键或一个快捷键就能停下全部——「电脑操作」面板或悬浮停止条上的「停止共享」，以及快捷键 Ctrl+⌘+Esc（Windows、Linux 上是 Ctrl+Alt+Esc），都会立即结束所有共享并中断智能体正在做的事；共享的窗口 30 分钟没有智能体用过（时长可调）也会自动停止共享。（#870）
    - codeg 自己的窗口和「永不共享」名单里的应用始终无法共享——名单默认包含密码管理器、系统设置等，可以自行增删。（#870）
    - 可以共享整个应用或整个屏幕——共享整个应用时，它之后打开的窗口、菜单和自己的快捷键都包含在内；「允许共享整个屏幕」（仅 macOS 和 Windows，默认关闭）开启后，智能体能看到整屏画面并在任意位置点击，codeg 自己的窗口和永不共享的应用会被遮盖。（#870）
    - 智能体能做的不止点击——还能拖拽、按住按键、恢复被最小化或隐藏的窗口，遇到在后台收不到按键的应用（比如 Windows 上的 Edge、Chrome、VS Code），还能把窗口切到前台（可关闭）；打开应用、移动窗口和使用剪贴板各有单独的开关，默认关闭，智能体也只能粘贴它自己放进剪贴板的内容。（#870）
    - codeg-server 也可以提供电脑操作——启动时设置 CODEG_COMPUTER_USE=1，网页端就能在同一个面板里共享服务器所在机器的窗口，也能随时停止共享。（#870）
    - 桌面版会重新打开你退出时开着的工作区窗口——本地的和每个远程工作区都一样，退出时正在用的那个回到最前面；连不上的远程工作区会在本地窗口里提示。
    改进
    - 内置智能体版本更新： Claude Code ACP 0.85.1（Claude Code 2.1.286）、Codex ACP 2.1.1（Codex CLI 0.159.3）、OpenCode 1.18.34、Cline 3.0.67、CodeBuddy 2.161.0、Grok 1.0.46、Qoder 1.1.65、OpenClaw 2026.9.7、Cursor 2026.09.28。
    - 分叉会话后，原会话不再被智能体一直占着——分叉之后 codeg 会关掉原会话，Codex 约一分钟内就会放开它，Claude Code 也不再为每次分叉多留一个进程；「会话在别处打开」的提示现在也会说明：刚分叉过的话，约一分钟后重新加载即可。
    - 图标线条略微变细——原本使用图标库默认粗细 2 的图标改为 1.75，与小号文字搭配更协调，特意指定过粗细的图标保持不变。（#866，@SousekiL）
    - 「设置」里的「浏览器」更名为「浏览器操作」，与新增的「电脑操作」并排，「协作」也挪到了「常规」后面。（#870）
    - Windows 上的 codeg-server 装进自己的文件夹 %LOCALAPPDATA%\codeg-server，两边安装时互不覆盖文件，也不再互相结束对方的进程；重新运行安装脚本，会把与桌面版共用目录的服务器挪出来。（#870）
    - 桌面版去掉了约 70 MB 用不上的内容——不再捆绑独立服务器程序。（#870）
    - 内置模型目录已更新——共 225 个供应商、8339 个模型，此前为 8281 个。
    修复
    - 触屏设备上切换到另一个会话时，不再弹出软键盘遮住对话——点一下输入框仍会弹出，桌面端行为不变。（#865，@Flyneen）
    - 待办任务会运行选择器里显示的智能体——全新安装，或常用智能体被禁用时，选择器里显示的智能体其实没有被保存，任务启动时报「no agent configured」；现在显示的智能体会随任务保存，选择器下方的提示也会说明它是继承来的还是随任务保存的。（#864 由 @qq974969638 反馈）
    - 用 ⌘Q、Dock 菜单退出或注销登录时，也会执行完整的退出清理——结束智能体进程、终端和 Web 服务，与在 codeg 里点退出一样；Windows 上注销时同样如此。
    - Cline 能在 macOS 27 上运行了——macOS 27 会在启动时杀掉 3.0.65 及更早的 Cline，而 3.0.67 带有有效签名，请在「设置 → 智能体」里升级；OpenCode 1.18.34 也补上了正式签名。
    - Claude Code 会话里的后台命令结束时，卡片不再被改写成内部标记文字；因为你发了消息或超时而转入后台的命令，会标上「后台运行」徽标。
    - Codex 会话重新打开后更贴近原样——在「其他」里输入自己的文字作答的提问，回来时还是那段文字，不再变成两个选项；压缩失败时显示服务返回的错误信息，而不是原始 JSON；在 Codex 桌面版里发起、带附件的会话，附件显示为链接，后面跟着你的请求，标题也取自你写的内容。
    - 以搜索收尾的管道命令没有匹配项时，不再显示成失败——像 rg --files src | rg foo 这样以 rg 或 grep 结尾的命令没有匹配时，现在显示为已完成，退出码仍保留在卡片上，不再是红色失败，也不会被计入工具组的错误数；退出码 2、错误信息这类真正的错误仍显示为失败。（#877 由 @Ryn-Mic 反馈）
    - Grok 的模型选择器会补全完整的模型列表——在 Grok 拉取到模型目录之前打开的会话（比如登录已过期的情况），选择器原本在整个连接期间都只有内置的几个模型；现在 Grok 一发出模型目录更新，选择器就会随之刷新，你选好的模型和推理强度保持不变。（#876 由 @goon-13 反馈）
    注意
    - 电脑操作首次使用时会下载开源的 cua-driver（0.32.0），也可以在「设置 → 电脑操作」里点「安装」提前装好。
    - 在 macOS 上，请把「辅助功能」和「屏幕录制」授予 codeg-computer-helper，而不是 codeg——只有 codeg 能使用这个 helper，智能体自己运行的命令借不到这些权限；Windows 和 Linux 没有这层隔离，那里由设置决定智能体能通过 codeg 拿到什么。
    - Windows 上 codeg-server 的网页文件现在位于 %LOCALAPPDATA%\codeg-server\web——如果你的服务器被挪到了那里，而 CODEG_STATIC_DIR 还指向 %LOCALAPPDATA%\codeg\web，请改成新路径。
    - Claude Code 2.1.286 起，发消息会把正在运行的命令、MCP 调用或子智能体挪到后台，不再等它结束或直接中断；codeg 会给这类命令标上「后台运行」徽标，仍开着的提问卡片会像以前一样随发送被收起。
    - 通过自定义 API 地址使用 Claude Code 时，模型列表里不再有单独的「(1M context)」条目——2.1.285 起这些模型默认就用 1M 窗口，原本选了这类条目的会话会继续使用对应的普通模型；如果你的网关只支持 200K，Claude Code 的建议是用 /autocompact 200k。
    - Cline 3.0.66 及以上版本统计输出 Token 时不再包含推理 Token，所以推理模型显示的输出量会偏低。
    感谢 @Flyneen、@SousekiL 为本次发布做出的贡献，也感谢 @qq974969638、@Ryn-Mic 和 @goon-13 的反馈。
