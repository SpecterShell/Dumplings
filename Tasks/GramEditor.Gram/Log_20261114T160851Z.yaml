  Value: |-
    [3.5.1] - 2026-11-14
    Note that the Windows build is based on commit 7e6eb46dff1ae6a8ba93fcdc3a5d2149bcd63970,
    one extra fix was needed to build the CLI.
    Changed
    - Update embedded git binary to 2.56.1 (Mac OS)
    Fixed
    - Display user label for task key bindings in which-key popup (#723) by @Yo3-Y
    - Fix diacritic positioning using glyph offsets (#721) by @Holbormon
    - Fix pasting URLs copied from Safari (#720) by @pcantrell
    - Increase default contrast between search match and active match backgrounds (#717)
    - Fix tombi LSP path on Windows (#654)
    - Fix window activation by another process on Wayland (#726) (#728) by @palant
    - Handle text/uri-list clipboard contents on Wayland (#733) (#734) by @palant
    - Fix download URL for zk on Windows (#735)
