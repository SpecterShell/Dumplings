Version: 1.13.0
Installer:
- Architecture: x64
  InstallerType: portable
  InstallerUrl: https://github.com/paopaoandlingyia/PrismCat/releases/download/v1.13.0/prismcat-v1.13.0-windows-amd64.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    中文
    - 新增 WebSocket Upgrade 代理支持。
    - 重构请求覆盖规则编辑界面，完善规则名称、匹配条件、请求体与请求头编辑。
    - 新增请求覆盖中英文文档及仓库级 Agent Skill。
    - 示例规则改为安全追加，Usage 默认规则不再覆盖已有配置。
    - 修复 exists: false 无法匹配缺失字段的问题。
    - 修复敏感请求头覆盖值写入日志的问题。
    - 改进上游高级设置、剪贴板兼容性及 Gemini 思考内容展示。
    English
    - Added WebSocket upgrade proxy support.
    - Redesigned request override editing for names, match conditions, body operations, and headers.
    - Added bilingual request override documentation and a repository-level Agent Skill.
    - Made example insertion non-destructive and preserved existing Usage rules.
    - Fixed exists: false matching for missing JSON fields.
    - Prevented sensitive header override values from leaking into logs.
    - Improved upstream advanced settings, clipboard compatibility, and Gemini thought rendering.
