  Key: ReleaseNotes
  Value: |-
    What's fixed:
    - We've fixed synchronization between the designs in Figma and the corresponding nodes in the Figma Connect tool window (WEB-79536).
    - We've fixed the behavior of the Layers tree in the Figma Connect tool window, so newly created nodes are added to the tree (WEB-79537).
    - We've updated the empty-state text in the Currently selected section of the Figma Connect tool window for the sake of clarity (WEB-79021).
    - We've added support for wrapping long paragraphs of text into multiple lines in Markdown files (WEB-66842).
    - We've fixed formatting in Markdown files, so empty lines in block quotes are preserved during autoformatting (WEB-71613).
    - We've fixed a problem with loading a base reporter from ./lib/reporters/base.js when running Mocha 12 tests (WEB-79510).
    - We've fixed the Unexpected term error in Sass when namespaced functions or variables are used as calc() arguments (WEB-56489).
    - We've fixed erroneous reporting of default imports from the svelte-fa package in Svelte components as unused (WEB-57512).
    - We've fixed parsing in Angular applications, so @default never in template @switch blocks is no longer reported as unknown block (WEB-78903).
    - We've fixed incorrect type inference in Angular templates on WSL when the service-powered type engine is enabled (WEB-79345).
    - We've improved performance when resolving references in Angular templates (WEB-77483).
    - We've improved user experience with JavaScript debugging by suppressing stepping into anonymous evaluated scripts (WEB-57355).
    - We've introduced improved syntax to specify patterns for scripts to be skipped when stepping during a debugging session and improved the corresponding configuration UX (WEB-79401).
    - We've fixed support for running Stylelint from a container (WEB-79412).
    - We've fixed the issue with CSS pseudo-selectors being reported as unknown on disabling the Images plugin (WEB-79295).
    - We've fixed a formatting issue, so spaces are preserved or processed correctly when converting a number into a String thus preventing invalid JavaScript syntax (WEB-73189).
    - We've optimized IDE project graph consumption (WEB-76899).
    - We've fixed the Storybook Set Up and Update actions with npx provided by a shim script, such as asdf (WEB-79475).
    - We've fixed the appearance of the Storybook index error card, so it no longer displays raw ANSI escape codes (WEB-79371).
    - We've fixed the appearance and behaviour of Storybook cards, so their text scales correctly with the IDE scale (WEB-79334).
    - We've fixed the appearance and behaviour of the Storybook tool window, so it no longer remains in the Update state after an unsuccessful upgrade (WEB-79370).
    - The Brave browser configuration is now indicated with a dedicated icon (WEB-51602).
    - We've fixed Storybook setup in WSL projects where Node.js is installed with nvm and isn't available in PATH (WEB-79434).
    - We've fixed Storybook detection in Yarn PnP projects, so a proper Plug'n'Play message is shown instead of reporting missing dependencies (WEB-79381).
    - We've converted the optional dependencies of the Node.js, Karma, Pug, CoffeeScript, Polymer & Web Components, Handlebars/Mustache, and Meteor plugins to content modules (WEB-78672, WEB-78671, WEB-78670, WEB-78668, WEB-78666, WEB-78669, WEB-78667).
    For more details, please see the release notes.
