  Key: ReleaseNotes
  Value: |-
    What's fixed:
    - We've added a simplified splash screen and an option to invoke it (WEB-78901).
    - We've implemented the possibility to use Vue legacy tools in Vue 3 projects with class-based components (WEB-80443, WEB-80592).
    - We've added code completion and highlighting in Vue projects running on VM with one CPU core (WEB-80292).
    - We've fixed a performance issue with infinite analysis in TypeScript projects (WEB-78858).
    - We've added auto-import suggestions for HttpEffect and HttpServerResponse from the effect package (WEB-80220).
    - We've fixed auto-import completion for symbols that are re-exported from an entire module (WEB-61981).
    - We've fixed a false positive Unexpected token error reporting for Svelte declaration tags with trailing semicolons, such as {const ...;} and {let ...;} (WEB-80487).
    - We've fixed JSX formatting, so that line breaks between tags are preserved when the Keep line breaks in text option is disabled (WEB-37966).
    - We've fixed HTML formatting so that the Chop down if long option works correctly even when an element has only one attribute (WEB-59303).
    - We've fixed GraphQL configuration and schema loading in headless environments, such as intellij-server (WEB-80352).
    - We've fixed an issue with the TypeScript Language Service sometimes using the bundled TypeScript version instead of the version installed in the project (WEB-80204).
    - We've added prop autocompletion for auto-imported and custom components in Nuxt 4, including components referenced through the #components alias (WEB-76306).
    For more details, please see the release notes.
