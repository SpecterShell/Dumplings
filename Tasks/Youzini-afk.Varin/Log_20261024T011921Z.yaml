  Key: ReleaseNotes
  Value: Varin 0.9.32 updates code retrieval, conversation reading and settings. Code retrieval now uses native Agent investigations without requiring a prebuilt code vector index. The default chat layout puts answers first and keeps execution details in expandable live activity rows. This release also improves structured questions, plan editing, project trust and local knowledge embeddings, and fixes task continuation after answering questions and Windows upgrades involving long paths.
