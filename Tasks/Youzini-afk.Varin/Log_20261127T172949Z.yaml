Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Bot schedules and conversations
    - Open a schedule in the Bot side panel to see its execution history. An independent execution shows the original final reply, with Markdown and attachments, or the recorded failure reason. New execution conversations use the schedule name and a short UTC timestamp in the workbench. In Varin mode, open them from the schedule.
    - When a schedule continues an existing conversation, its record jumps to the exact turn. Back to schedules returns to the record and preserves the previous draft. Schedules & Watches and New Schedule open directly in the main area on desktop and mobile.
    - Fixed workbench stalls when switching the conversation sidebar from Categories back to Recent. Expanding, moving, and reordering individual rows still animates.
    Managed deployments
    - Operators can use deployment policies and a gateway for managed Hosts. On POSIX systems, a configured supervisor can stop an idle Host, retain incoming messages, and restart the Host to deliver them.
    - Deployments can acquire workspace, Browser, Computer, and extension resources on demand. Supported external Agent sessions, scripts, project MCP, Git, and Office operations can use managed nodes. Extension sandboxes default to one per user, with a separate sandbox per extension available through configuration.
    - Rebuildable caches can live outside the durable data directory. A stopped Host's storage formats can be inspected before an upgrade. Deployment guide
    Runtime updates
    - Updated Electron, Monaco, CodeMirror, and the Android runtime dependencies.
    Full changelog
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Bot 日程与会话
    - 在 Bot 侧栏展开日程，即可查看历次执行。独立执行显示那一次的原始最终回复，保留 Markdown 和附件。失败时可查看已记录的原因。新建的独立执行会话在工作台使用日程名和简短的 UTC 时间，在 Varin 模式里从日程记录进入。
    - 接续已有会话的日程可跳到对应轮次。点「返回日程」回到原记录，之前的草稿也会保留。「安排与关注」和「新建日程」在桌面和手机上都直接打开主区域页面。
    - 修复工作台会话侧栏从「分类」切回「最近」时的卡顿。单条展开、移动和排序动效保留。
    托管部署
    - 托管 Host 支持由运维方配置部署策略和网关。在 Linux 等 POSIX 系统上，启用 supervisor 后，Host 空闲时可以停止运行，收到的消息会先入队，待 Host 唤醒后继续交付。
    - 工作区、浏览器、电脑操作和扩展资源可以按需分配。受支持的外部 Agent 会话、脚本、项目 MCP、Git 和 Office 操作可以在托管节点运行。扩展默认按用户共用沙箱，也可配置为每个扩展单独使用沙箱。
    - 可重建缓存可以存到持久数据目录之外。升级前可以检查已停止 Host 的存储格式。部署指南
    运行时更新
    - 更新了 Electron、Monaco、CodeMirror 和 Android 运行时依赖。
    完整更新记录
