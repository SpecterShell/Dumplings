  Key: ReleaseNotes
  Value: |-
    [0.15.1] — 2026-11-13
    Fixed
    - A huge fontconfig file slowed down Linux with large libraries. Every font
      you switched off got four lines of its own in the fontconfig file, and the
      whole file was also copied into the settings of every Flatpak app. With a few
      thousand fonts switched off that came to several megabytes, and every app had
      to check each of its fonts against every line whenever it started or noticed
      the file had changed, which made switching a font slow and the whole desktop
      sluggish. The file is now built per folder: when most fonts in a folder are
      off, it hides the folder in one line and lists only the fonts that stay on.
      Fonts LibreOffice bundles are only mentioned when LibreOffice really has
      them, Flatpak apps get only the paths they can see, and the file is only
      rewritten when something actually changed. Switching a font on or off no
      longer rebuilds the system's font cache either, since that's only needed when
      font files are added. A library of 3,000 fonts with 200 switched on now takes
      about 200 short lines instead of 11,000 long ones, and it takes effect on the
      first start of 0.15.1. Checked against fontconfig itself: exactly the fonts
      that are switched on show up.
      Reported by MLteY. (#49)
