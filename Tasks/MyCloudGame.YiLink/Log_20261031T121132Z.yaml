Version: 0.9.29
Installer:
- InstallerUrl: https://download.mycloudgame.com/YiLink-0.9.29-Setup.exe
Locale:
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 主机端：优化建连流程，从打开链接到出画面的等待时间更短
    - 主机端：默认连接方式改为仅使用 UDP，减少多余候选与握手轮次，建连更快、更省流量
    - 主机端：Gamespace 模式新增主机端编码设置，可按机器性能与带宽调整画质和帧率
    - 网页端：不再"连上就黑屏"。首帧关键帧丢失时自动重试并显示"正在获取画面"，真正解出画面后才提示连接成功
    - 网页端：修复同网段 / 同一公网出口下局域网直连候选丢失的问题，这类网络现在一次就能连上，不再反复重试
    - 网页端：中继统一走 UDP，建连超时判定放宽到 20 秒，中继回退更快，也不会误断已经出画面的连接
    - 网页端：锁屏或切到后台再回来时立即重连，不再卡在"连接中"约一分钟
    - 网页端：登录 / 兑换页去掉阻塞渲染的第三方 CDN 样式，弱网和中国大陆访问不再白屏；登录态校验偶发失败不再误退出登录
    - 网页端：NAT 检测在代理 / VPN 环境被拒绝时立即给出原因，不再空等 30 秒
    - Gamespace：试玩页同样加入等待首帧遮罩与自动恢复，网络短暂抖动时给 12 秒恢复时间，不再直接判定试玩失败
    - 辅助工具：NAT 检测服务安全加固与重构（自建 STUN、候选校验、配额），判定更准、失败原因更明确；文件传输支持文件夹只授权一次并可在中途取消
ReleaseTime: 2026-10-31
