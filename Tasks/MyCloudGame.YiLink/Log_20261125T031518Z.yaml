Version: 1.0.0
Installer:
- InstallerUrl: https://download.mycloudgame.com/YiLink-1.0.0-Setup.exe
Locale:
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    - 主机端：主机内核全面重构（连接 / 会话 / 媒体 / 输入 / 诊断分层），与现有网页端、客户端及 0.9.x 主机配置保持兼容；0.9.29 主机可直接自动升级到 1.0.0
    - 主机端：修复锁屏、远程会话进入锁屏桌面、以及休眠 / 唤醒后偶发无画面的问题，恢复后自动重新出图
    - 主机端：移除旧版"模拟鼠标移动"的保活方式，避免本地光标被无意扰动
    - 主机端：重写窗口采集 / 游戏模式与编码链路，硬件编码优先、软件编码自动回退
    - 主机端：重写输入链路，键盘、鼠标、手柄（最多 4 个）与剪贴板行为对齐旧版并更稳定
    - 主机端：设置页重写（总览 / 配置 / TURN / 房间管理 / Gamespace / 诊断），支持运行期切换日志等级、查看最近错误、一键导出诊断
    - 主机端：日志统一到安装目录 log\（文件名保持兼容），远程排查更方便
    - 网页端：修复 Safari / WebKit 上"已连接，正在获取画面"遮罩一直不消失的问题（这些浏览器的视频统计缺少媒体类型字段），首帧与卡顿检测同样生效
    - 网页端：房间页显示实时在线连接数与主机 NAT 类型；进入远控后自动停止房间状态推送，节省流量
    - 网页端：登录状态下打开自己主机列表里的分享房间，直接走登录态连接，不再经过匿名确认流程
    - Gamespace：加入 / 暂停 / 恢复、区域选择与目标游戏拉起流程重写；修复主机长时间关机后授权过期导致 Gamespace 断开并反复弹窗的问题（现在会自动刷新授权，无需重启主机）
    - 辅助工具：文件传输新增传输历史，扫码打开后自动发起连接，并在复杂网络下自动使用签发的中继
    - 安装升级：新版安装程序（中英文许可协议、第三方开源声明入口、升级 / 卸载流程重做），安装包与组件均带数字签名；正式版自动升级走独立通道，与测试版互不影响
    - 兼容性：Windows 10/11 x64；从 0.9.29 自动升级已验证通过
ReleaseTime: 2026-11-25
