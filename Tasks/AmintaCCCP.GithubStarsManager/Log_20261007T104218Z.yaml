    🧩 Plugin Guide: Marketplace, Repo Info Card & Repo Insights / 插件系统使用指南
    1. 🏪 Plugin Marketplace / 插件市场（插件商店）使用方法
    EN: Built into the desktop client. Installing plugins only stores files locally, and an explicit permissions prompt is shown before enabling any plugin to keep your data secure.

    ZH: 桌面端内置支持。插件安装仅将文件存入本地，启用前会严格展示所需权限清单，保障数据安全。
    - Open the Marketplace / 打开插件市场：
      - EN: Navigate to Settings → Plugin Management in the sidebar, then click Browse plugins on the top Marketplace card.
      - ZH: 在主程序左侧导航点击 「设置」→「插件管理」，在顶部的「社区插件注册表 / 插件市场」卡片上点击 「浏览插件」。
    - Browse & Install / 浏览与安装：
      - EN: The modal lists plugins from the official example source (and any external sources you add), such as Repo Info Card, Repo Insights, and Markdown Exporter Example. Click Install next to a plugin to automatically download and verify it via the GitHub API.
      - ZH: 弹窗中会展示官方示例源（以及你添加的第三方源）提供的插件，例如 Repo Info Card、Repo Insights、Markdown Exporter Example 等。点击插件右侧的 「安装」 按钮，系统将自动通过 GitHub API 下载插件包并完成校验。
    - Review Permissions & Enable / 权限确认与启用：
      - EN: After installation, toggle the plugin switch. A permission dialog will show the exact capabilities requested (e.g., read repository metadata, invoke AI, read-only GitHub API endpoints). Review and click Enable to activate.
      - ZH: 安装完成后，在插件列表点击启用开关，应用会弹出权限确认窗口，清晰展示该插件请求的权限（如只读仓库信息、调用 AI、只读 GitHub API 端点等）。确认无误后点击启用即可开始使用。
    - Manage Custom Plugin Sources / 管理自定义插件源：
      - EN: Click Manage Sources at the top right of the marketplace to add any public GitHub directory (e.g. https://github.com/owner/repo/tree/branch/path or repository root). Sources can be edited, refreshed individually, or removed anytime.
      - ZH: 在插件市场右上角点击 「管理插件源」，可以添加任意公开的 GitHub 仓库目录（格式支持 https://github.com/owner/repo/tree/branch/path 或仓库根目录）。添加后支持单源刷新与编辑。

    2. 🪪 Repo Info Card / 仓库信息卡使用方法
    EN: Uses your configured AI provider to distill any repository's README and metadata into an elegant, customizable, export-ready single-file HTML card.

    ZH: 使用你配置的 AI 服务，将仓库的 README 和元数据浓缩为一张高颜值、可定制、支持导出的单文件 HTML 卡片。
    - Open from Repository / 从仓库打开：
      - EN: On any repository card, click … (More actions) → Plugin actions → 生成仓库信息卡 (Generate info card). The plugin opens in a modal with that repository's metadata and README already loaded.
      - ZH: 在任意仓库卡片右上角点击 …（更多操作）→「插件操作」→「生成仓库信息卡」，插件将在大弹窗中打开，并自动载入当前仓库上下文与 README。
    - Customize Style & Dimensions / 定制外观与参数：
      - EN: Choose a theme style ("TE Paper", "Dark Instrument", "Minimal B&W") for instant re-skinning. Select an aspect ratio (1:1 · 1200×1200, 5:2 · 1500×600, 3:4 · 1200×1600), or enter custom dimensions (400–3000px). Select your preferred card language (follow UI or pick from 10 supported languages). Optionally type custom requirements (e.g., "Emphasize cross-platform features and security").
      - ZH: 选择风格（「TE 纸面」、「暗色仪器」、「极简黑白」实时换肤）；选择画幅预设（1:1 方形、5:2 横幅、3:4 竖版，或输入 400~3000px 自定义尺寸）；指定卡片语言（跟随界面或 10 种语言）；可选填附加说明（如“重点突出跨平台与安全特性”），AI 会针对性提炼。
    - Generate & Edit / 生成与编辑：
      - EN: Click 生成信息卡 (Generate info card) with live loading feedback. Switch between Preview and Code tabs at the top to inspect or directly edit the generated HTML source with immediate updates.
      - ZH: 点击 「生成信息卡」（具有清晰的加载进度反馈）。顶部可在 「预览」 与 「代码」 间自由切换，进入「代码」模式可直接修改生成的 HTML 源码并即时生效。
    - Export & Share / 导出与分享：
      - EN: Use the bottom action bar to Copy HTML, Copy screenshot to system clipboard, or Save screenshot as a crisp @2x PNG image. The preview canvas supports Ctrl / ⌘ + Scroll or drag-panning, while exports always preserve full @2x ultra-high resolution.
      - ZH: 底部操作栏支持 「复制 HTML 代码」、「复制截图」（直接写入系统剪贴板）以及 「保存截图」（导出高清 @2x PNG 图片）。预览区支持 Ctrl / ⌘ + 滚轮 缩放或平移，导出始终保持完整超清分辨率。

    3. 📊 Repo Insights / 仓库洞察使用方法
    EN: Gain deep visibility into repository activity, health metrics, and community evolution to make informed dependency and tech stack decisions.

    ZH: 深度了解仓库活跃度、维护健康度与社区演进，辅助判断依赖价值与技术选型。
    - Open from Repository / 从仓库打开：
      - EN: On any repository card, click … (More actions) → Plugin actions → 仓库洞察 (Repo Insights).
      - ZH: 在任意仓库卡片右上角点击 …（更多操作）→「插件操作」→「仓库洞察」。
    - In-Depth Analytics Dashboard / 多维深度看板：
      - EN:
        - Repository Health Check: Instant maintenance activity indicator (e.g., "Active maintenance · latest commit today"), popularity metrics, and license compliance facts.
        - Maintainers & Contributors: Owner profile card, top 12 contributors breakdown, and Bus Factor analysis (highlighting single-point-of-failure dependency risks).
        - Multi-Dimensional Charts: 52-week commit activity bar chart, code churn line chart, multi-axis health radar, language byte distribution, star growth history, and security advisory tallies.
      - ZH:
        - 仓库体检：即时呈现维护活跃度标签（如“维护活跃 · 最近提交 今天”）、关注热度、许可证规范等客观体检事实。
        - 贡献者与巴士因子（Bus Factor）：展示仓库所有者基本资料、前 12 名主要贡献者分布比例，以及巴士因子评估（分析项目是否存在单点依赖风险）。
        - 多维图表分析：包含 52 周提交活动柱状图、代码增减趋势折线图、综合健康度六边形雷达图、语言字节分布饼图、星标增长历史趋势图与安全公告统计。
    - AI-Powered Recent Activity Summary / AI 近期动态分析：
      - EN: Click 生成动态分析 (Generate dynamic analysis). The plugin gathers recent merged PRs, release notes, and commit statistics, using your configured AI model to generate a structured executive summary of recent project developments (prompts are reviewed and confirmed by the host before sending).
      - ZH: 点击 「生成动态分析」 按钮，插件将结合仓库近期的已合并 PR、发布日志与提交数据，通过你配置的 AI 智能总结出该项目近期的核心更新重点与演进方向（调用前会经宿主确认）。
    - Privacy & Security Guarantee / 安全与隐私保障：
      - EN: The plugin only issues read-only requests against an allowlist of official GitHub API endpoints using your logged-in GitHub token. Your local repository data and private tokens never leave your machine.
      - ZH: 本插件仅使用你已登录的 GitHub Token 发起官方 API 白名单只读请求，本地仓库私密数据绝不外泄。

