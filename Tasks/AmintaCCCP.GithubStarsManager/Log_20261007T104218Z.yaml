    What's New in v0.8.6 / 新版本特性
    🌟 Highlights & Special Notes / 特别说明
    English:
    🏪 Plugin Marketplace & Maintained Plugin Sources (PR #427): Community plugin registry has evolved into a full-featured Plugin Marketplace! You can browse, search, install, update, and manage plugins directly from GitHub plugin sources. You can also add your own custom GitHub plugin sources in Settings.
    📊 Repo Insights Plugin (PR #433, #434): Powered by the new V1.5 plugin network capability, Repo Insights brings an in-depth repository analytics dashboard right into the app — commit activity trends, health radar, language distribution, contributor breakdown, bus factor, security advisories, and AI-powered recent activity summaries.
    🪪 Redesigned Repo Info Card Plugin (PR #432, #435): The Repo Info Card example plugin receives a major UI overhaul with a side-by-side workspace, Linear design aesthetic, live code/preview tabs, customizable canvas ratios (including custom pixel dimensions), 10 interface languages, and smooth loading feedback.
    ⚡ Sharded State Persistence & Performance (PR #424, #434): Replaced monolithic IndexedDB writes with sharded atomic persistence. Changes to UI state (modal toggles, route switches) now touch only tiny lightweight shards instead of reserializing ~140MB of repository data, completely eliminating console serialization warnings and UI micro-stutters.
    🔍 Diagnostic Logging & Global Request Auditing (PR #428, #434): Introduced a unified diagnostic logging system covering frontend, backend, main process, and plugins. Sensitive tokens are automatically redacted, transient network failures are cleanly categorized, and complete diagnostic bundles can be exported with one click for easy troubleshooting.
    📖 Near Fullscreen README Modal (PR #431): Repository README reading dialogs now expand to near-fullscreen dimensions (calc(100vw - 2rem)), providing a much roomier and comfortable reading experience matching plugin page modals.
    中文：
    🏪 社区插件市场与可维护插件源（PR #427）：社区插件注册表全面升级为插件市场！现已支持按源浏览、搜索、一键安装、更新、启停和卸载 GitHub 插件源中的插件。你还可以在设置中自由添加自定义 GitHub 插件源。
    📊 仓库洞察（Repo Insights）插件（PR #433、#434）：基于全新的 V1.5 页面只读网络能力，仓库洞察插件为每个仓库提供专业的数据看板——涵盖 52 周提交活动、代码增删、多维健康度雷达、语言分布、贡献者概览与巴士因子、安全公告，以及一键调优的 AI 近期动态总结。
    🪪 仓库信息卡全新重构（PR #432、#435）：示例插件「仓库信息卡」迎来重大 UI/UX 重构，采用左右分栏工作台、Linear 风格设计、实时预览/代码编辑双模式、丰富画幅预设（支持自定义像素宽高）、覆盖 10 种语言，并补充了清晰的生成加载与状态反馈。
    ⚡ 分片持久化与性能飞跃（PR #424、#434）：IndexedDB 存储重构为原子分片持久化与脏检查机制。开关弹窗、切换视图等高频界面操作仅重写几 KB 的轻量配置分片，彻底告别以往 140MB 级全量 JSON 序列化带来的卡顿与警告。
    🔍 全量诊断日志与请求捕获（PR #428、#434）：建立覆盖主进程、渲染端、后端与插件的完整日志体系。密钥与 Token 全程自动脱敏，网络状态智能分级，支持一键打包导出诊断日志，让排查问题省时省力。
    📖 README 近全屏沉浸阅读（PR #431）：点击仓库卡片弹出的 README 弹窗全面扩大至近全屏尺寸（四周各留 1rem 边距），阅读长篇文档与项目介绍更加舒展高效。

