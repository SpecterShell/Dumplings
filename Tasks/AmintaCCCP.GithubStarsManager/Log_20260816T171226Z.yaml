  Key: ReleaseNotes
  Value: |-
    Highlights
    - Resilient batch AI analysis. A shared AI request limiter now handles provider rate limits with retry-aware cooldowns, exponential backoff, a circuit breaker, and optional concurrency and requests-per-minute controls. Proxy responses also forward supported rate-limit signals so retries can use the provider's guidance. #265
    - Reliable release asset refresh. Refreshing an existing repository release now detects changed assets and metadata, merges updates safely, and preserves each release's read/unread state. The update also handles stable asset fingerprints and uses the newest non-prerelease release when prereleases are excluded. #266
    - Compact repository list view. The repositories toolbar now includes a persisted Grid/List switch. The new compact list layout keeps essential repository metadata and actions accessible, while the existing grid view remains the default. #268
