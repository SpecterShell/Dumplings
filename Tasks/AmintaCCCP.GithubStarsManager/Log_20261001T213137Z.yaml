    ✨ Example Plugin Showcase: Repo Info Card / 示例插件：生成仓库信息卡
    v0.8.5 ships with a brand-new example plugin, Repo Info Card（生成仓库信息卡）. With the AI provider you already configured, it turns any repository's metadata and README into a beautiful, shareable single-file HTML info card — with live preview, clipboard export, and PNG saving.
    v0.8.5 附带全新示例插件生成仓库信息卡（Repo Info Card）。它调用你已配置的 AI 服务，把任意仓库的元信息与 README 整理成一张精美的、可分享的单文件 HTML 信息卡，支持实时预览、复制到剪贴板和保存 PNG。效果图见上方「📸 界面预览」。
    How to install / 安装方法（桌面端）
    1. Get the plugin folder / 获取插件目录：Clone or download this repository, then locate examples/plugins/repo-info-card.（克隆或下载本仓库，找到 examples/plugins/repo-info-card 目录。）
    2. Install it / 安装：In the app, go to Settings → Plugin Management → Install local plugin, select the repo-info-card folder, review the requested permissions (repositories:read, ai:invoke, clipboard:write, downloads:create), confirm, and enable the plugin.（在应用中进入 设置 → 插件管理 → 安装本地插件，选择 repo-info-card 目录，确认所需权限（repositories:read、ai:invoke、clipboard:write、downloads:create）后启用插件。）
    How to use / 使用方法
    1. Open from a repository / 从仓库打开：On any repository card, open the … menu → Plugin actions → 生成仓库信息卡 (Generate info card). The plugin opens in a modal with that repository's metadata and README already loaded.（在任意仓库卡片上打开 … 菜单 → 插件操作 → 生成仓库信息卡。插件会在弹窗中打开，并自动载入该仓库的元数据与 README。）
    2. Generate / 生成：Pick a style (TE Paper 纸面 / Dark Instrument 暗色仪器 / Minimal B&W 极简黑白), an aspect ratio (1:1 · 1200×1200, 5:2 · 1500×600, 3:4 · 1200×1600), and the card language (follow UI / 中文 / English), then click 生成信息卡. Each AI invocation asks for your confirmation.（选择风格、画幅与卡片语言，点击「生成信息卡」。每次调用 AI 都会先请求你的确认。）
    3. Export / 导出：Use the buttons at the bottom to copy the full HTML code, copy the screenshot to the clipboard, or save the screenshot as a @2x PNG via the native save dialog.（使用底部按钮复制 HTML 代码、复制截图，或通过系统保存对话框把截图保存为 @2x 的 PNG。）
    4. Zoom the preview / 预览缩放：Use −/+, the percentage, Fit to window, or Actual size; hold Ctrl/⌘ and scroll to zoom freely. Zoom only changes the display — exports always use the full @2x resolution.（用 −/+、百分比、适应窗口或实际大小调整预览；按住 Ctrl/⌘ 滚动可自由缩放。缩放只影响显示，导出始终是完整 @2x 分辨率。）
    5. No repository context? / 没有仓库上下文？：You can also open the plugin from Settings → Plugin Management → Open page. That entry has no repository context, so the page offers a search box to pick a repository instead.（也可以从 设置 → 插件管理 → 打开页面 进入插件；该入口没有仓库上下文，页面会提供搜索框供你选择仓库。）
    💡 Tip / 小贴士：The card is generated by AI from the repository's metadata and full README text — make sure an AI provider is configured in Settings → AI first.（卡片由 AI 根据仓库元数据与完整 README 生成——请先在 设置 → AI 中配置好 AI 服务。）
