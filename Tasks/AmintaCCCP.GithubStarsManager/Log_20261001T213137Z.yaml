    What's New in v0.8.5 / 新版本特性
    🌟 Highlights & Special Notes / 特别说明
    English:
    🔌 Plugin Modal Actions + "Repo Info Card" example plugin (PR #420): repository plugin actions can now open a plugin page inside a sandboxed modal — no Worker required. This release ships a new example plugin, Repo Info Card, which turns any repository into a shareable info card with your configured AI (see the showcase section below for install & usage).
    📡 Custom Discovery feeds (PR #419): add your own JSON/RSS/Atom feeds as discovery channels and browse the GitHub repositories they publish. Feeds are validated, removable, and never receive your GitHub token.
    🔑 Token permission guidance (PR #417): the login screen and settings now explain exactly which permissions classic and fine-grained tokens need, and batch starring shows a clear, localized error when the token lacks Star permissions.
    🛡️ Data-safety fix for batch starring (PR #418): syncing again no longer wipes AI analysis and category tags from batch-starred repositories — and already-affected data self-heals on the next sync.
    ⚡ Smaller installers, faster builds (PR #412, #413): desktop installers slim down from ~180–190 MB to ~100 MB, and the build pipeline drops from ~8 minutes to ~3.
    中文：
    🔌 插件弹窗动作 + 「生成仓库信息卡」示例插件（PR #420）：仓库插件动作现在可以在弹窗中打开沙箱化的插件页面——无需启动 Worker。本版本附带全新示例插件生成仓库信息卡，用你配置的 AI 把任意仓库变成可分享的信息卡（安装与使用方法见下方示例插件介绍）。
    📡 发现页自定义订阅源（PR #419）：把自己的 JSON/RSS/Atom 订阅源添加为发现频道，浏览其中的 GitHub 仓库。订阅源经过校验、可随时移除，且永远不会收到你的 GitHub Token。
    🔑 Token 权限指引（PR #417）：登录页与设置页明确说明经典令牌与细粒度令牌分别需要哪些权限；批量 Star 时若令牌缺少 Star 权限，会给出清晰的本地化错误提示。
    🛡️ 批量 Star 数据安全修复（PR #418）：再次同步不再清空批量 Star 仓库的 AI 分析与分类标签——已受影响的数据会在下次同步时自动恢复。
    ⚡ 安装包更小、构建更快（PR #412、#413）：桌面安装包从约 180–190 MB 瘦身到约 100 MB，构建流水线从约 8 分钟缩短到约 3 分钟。

