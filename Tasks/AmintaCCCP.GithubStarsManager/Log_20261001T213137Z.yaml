    What's Changed / 更新内容

    | PR   | English Summary                                                                                                                                                                                                                                                                                                                                                                                                                                                                              | 中文说明                                                                                                                                                                                                                                                                                  |
    | ---- | -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | ----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
    | #412 | build(releases): Slim desktop packages and consolidate electron-builder config<br>Frontend libraries moved to devDependencies so installers pack only the single runtime dependency (undici); electron-builder.yml becomes the one shared config for local and CI builds. Installer size drops from ~180–190 MB to ~100 MB and the packaging stage is 3–4× faster, with identical artifact names.                                                                                            | 桌面安装包瘦身，打包配置收敛<br>前端依赖移入 devDependencies，安装包只打包唯一运行时依赖（undici）；electron-builder.yml 成为本地与 CI 共用的唯一配置。安装包从约 180–190 MB 降到约 100 MB，打包阶段提速 3–4 倍，产物命名不变。                                                           |
    | #413 | build(releases): Build the web bundle once and cache Electron binaries<br>The platform-independent web bundle is now built once and shared by all three desktop targets, and Electron/builder toolkits are cached between runs. Total pipeline wall time drops from ~8 to ~3 minutes.                                                                                                                                                                                                        | Web 产物只构建一次，Electron 二进制加入缓存<br>平台无关的 web 产物只构建一次、三个桌面目标共用；Electron 与打包工具包跨构建缓存。整条流水线墙钟时间从约 8 分钟降到约 3 分钟。                                                                                                             |
    | #414 | feat: README previews and editable batch Star paste history<br>In the "Star from links" dialog, click a repository to preview its README without leaving the dialog. The last 10 pasted texts are saved per GitHub account as editable, reusable history. (Contributed by @Khk-NL)                                                                                                                                                                                                           | 批量 Star 支持 README 预览与可编辑粘贴历史<br>「从链接 Star」弹窗中点击仓库即可直接预览 README，无需离开弹窗；最近 10 条粘贴文本按 GitHub 账号保存为历史，可再次载入编辑复用。(感谢 @Khk-NL 的贡献)                                                                                       |
    | #415 | fix(releases): Match and list assets by the active filters' keywords<br>Fixes "the filter is broken": include keywords no longer match GitHub's auto-generated source archives, and a matching release now lists only the assets that hit the keywords — with a per-card "show all" toggle — instead of dumping the entire asset list.                                                                                                                                                       | Release 资产按过滤器关键词匹配与展示<br>修复「过滤器不生效」：包含关键词不再命中 GitHub 自动生成的源码压缩包；命中的 Release 现在只列出符合关键词的下载资产（卡片上可一键「显示全部」），不再罗列全部文件。                                                                               |
    | #416 | fix(webdav): Route browser requests through the backend proxy<br>WebDAV requests now go through the backend proxy when a backend is available (direct fetch otherwise), fixing CORS "Failed to fetch" failures with servers that don't send CORS headers for DAV methods; connection tests accept inline credentials. (Contributed by @lostiv)                                                                                                                                               | WebDAV 请求改走后端代理<br>配置了后端时 WebDAV 请求统一经由后端代理转发（无后端时仍直连），修复不返回 CORS 头的 WebDAV 服务器报「Failed to fetch / CORS 策略阻止」的问题；连接测试支持内联凭据。(感谢 @lostiv 的贡献)                                                                     |
    | #417 | feat: Guide GitHub token permissions at sign-in and Star import<br>A reusable token-permission guide lands on the login screen and in General settings (classic vs fine-grained PAT), and GitHub's "Resource not accessible by personal access token" 403 is surfaced as a clear, localized permission error during batch starring. (Contributed by @Khk-NL)                                                                                                                                 | 登录与 Star 导入时的 Token 权限指引<br>登录页与设置页新增可复用的 Token 权限说明（经典/细粒度令牌分别需要什么）；批量 Star 遇到 GitHub 403「令牌无权访问」时，会显示明确的本地化权限错误。(感谢 @Khk-NL 的贡献)                                                                           |
    | #418 | fix(sync): Batch-starred repositories keep AI analysis and category tags after re-sync<br>New repositories keep their real GitHub IDs instead of synthesized ones, so re-syncing no longer wipes AI summaries, AI tags, and categories. Already-affected data self-heals on the next sync via a full_name fallback match — no need to re-run AI analysis.                                                                                                                                    | 批量 Star 的仓库再次同步后保留 AI 分析与分类<br>新增仓库改用 GitHub 真实 ID，再次同步不再清空 AI 摘要、AI 标签与分类；已受影响的历史数据会在下次同步时按 full_name 兜底匹配自动恢复，无需重跑 AI 分析。                                                                                   |
    | #419 | feat: Configurable external feeds for Discovery<br>Add your own discovery channels from public HTTPS JSON/RSS/Atom feeds of GitHub repository links. Feeds are validated before saving, can be removed anytime, never receive your GitHub token, and are capped at 10 per user (up to 30 repos per feed per load). Repository search is also easier to find. (Contributed by @Khk-NL)                                                                                                        | 发现页支持自定义外部订阅源<br>可从公开的 HTTPS JSON/RSS/Atom 订阅源添加自己的发现频道，浏览其中的 GitHub 仓库。添加前校验格式、可随时移除；订阅源永远不会收到你的 GitHub Token；每位用户最多 10 个源（每个源每次最多 30 个仓库）。仓库搜索入口也更显眼。(感谢 @Khk-NL 的贡献)             |
    | #420 | feat(plugins): V1.4 modal actions (opensPage) and the Repo Info Card example plugin<br>Repository plugin actions can now open a plugin page inside a sandboxed modal (no Worker needed). The host delivers repository context and README to the page, and adds clipboard-image and save-file host operations. Ships with the "Repo Info Card" example plugin — see the showcase below.                                                                                                       | 插件系统 V1.4 弹窗动作（opensPage）+ 仓库信息卡示例插件<br>仓库插件动作现在可以把插件页面装进沙箱弹窗打开（无需 Worker）。宿主会向页面下发仓库上下文与 README，并新增「写剪贴板图片」「保存文件」宿主能力。随版本发布「生成仓库信息卡」示例插件——见下方示例插件介绍。                     |
    | #421 | feat(settings): Dedicated Appearance menu, card-field checkmarks, plugin menu rename, vector index panel<br>Appearance, card display fields, and language move into a dedicated "Appearance" settings menu; selected card fields show a checkmark; the sidebar "Plugins" entry is renamed "Plugin Management"; vector-search indexing gets its own panel plus an unindexed-count badge on the sidebar.                                                                                       | 独立外观设置菜单、卡片字段对勾、插件管理改名、向量索引面板<br>外观、仓库卡片显示字段与语言设置移入独立的「外观设置」菜单，选中字段前显示对勾；左侧导航「插件」更名为「插件管理」；向量搜索的重建/增量索引获得独立操作面板，存在未索引仓库时导航显示数量徽标（超 99 显示 99+）。           |
    | #422 | fix: Desktop console errors and Markdown rendering audit fixes<br>The desktop app no longer probes file:///api/health on startup; README images inside \<picture>/srcset now resolve correctly in dark themes, protocol-relative links are forced to https, anchor decoding tolerates odd escapes, image downloads get proper MIME-based extensions, and the plugin snapshot 64 MiB budget is measured against sanitized data — no more spurious "snapshot exceeds the size limit" warnings. | 桌面控制台报错与 Markdown 渲染审计修复<br>桌面端启动不再请求 file:///api/health（消除控制台报错）；README 中 \<picture>/srcset 的图片在深色主题下正确加载、协议相对链接固定为 https；锚点解码容错；图片下载按 MIME 取正确扩展名；插件快照 64 MiB 上限改为按脱敏后数据计量，不再误报超限。 |

