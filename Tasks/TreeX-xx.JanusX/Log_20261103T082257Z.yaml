- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    本次更新完善 CLI 终端与对话双模式，带来更丰富的输入、命令和长会话体验，并新增离线 PDF 预览。
    更新亮点
    - 终端与对话双模式：完善 Claude Code、Codex、OpenCode 和 Pi 的会话启动、状态与模式切换。
    - 更灵活的对话输入：支持跨会话输入历史、文件引用、图片附件预览，以及图片产物查看与复用。
    - 命令与技能入口：提供搜索、目录刷新和调用入口，按各 CLI 的实际能力展示操作。
    - 离线 PDF 预览：无需联网即可只读查看 PDF 文件。
    体验优化
    - 改进长对话展示、工作过程折叠、文件变更查看、启动反馈和输入响应。
    - 首次使用 CLI 时提供安装引导和独立 Node 运行时；统一辅助面板的收起控制，优化设置入口和插件图标。
    问题修复
    - 修复部分 OpenCode 会话选择和终端启动问题。
    - 改善 Windows 下 Claude 可执行文件及 PATH 转发脚本的解析。
    升级须知
    - Blueprint、CPA 和 Docker 均为可选插件，安装主程序不会自动安装；可在设置中导入下方签名插件包。
    - Android 为 debug 签名的局域网测试包，支持 Android 8.0 及以上；手机与电脑需连接同一局域网，首次使用需扫码并在电脑上批准。
    - Windows 主程序未进行 Authenticode 签名。
    已知限制
    - 命令和技能的支持范围因 CLI 而异；Claude 对话模式中的相关命令需切换到同一终端手动执行。远端原生输入历史尚未接入。
    - 图片生成取决于所用 CLI、工具及账户能力。Android 长期稳定性和所有机型尚未验收；Docker 插件仍为实验功能。
    查看完整变更
