    本次更新完善原生 CLI 对话交互，新增本地 Skills / MCP 管理与纯白主题，并改进 Git 工作台、侧栏和阅读体验。
    更新亮点
    - 更完整的原生对话交互：完善 Claude Code、Codex、OpenCode、Pi 和 DSH 的审批、提问与回答流程；需要终端执行的命令可自动交给同一终端，并保留参数。
    - 本地 Skills / MCP 管理：在设置中查看和管理受支持客户端的用户级、工作区级配置，提供来源信息、编辑及连接检查入口。
    - Git 工作台升级：分开展示工作区变更与提交历史，增加真实提交关系图，并改进差异预览和操作控件。
    - 纯白主题：新增纯白外观，统一主程序常用控件、选择器与主题颜色。
    体验优化
    - 优化推理强度选择、中文名称与颜色记忆；OpenCode 模型按供应商分组，方便查找。
    - 侧栏折叠后仍可识别和切换工作区，保留折叠偏好；手机控制入口移至右侧工具栏，并提供设置开关。
    - 用量统计增加模型细分，缓存命中率支持小数显示。
    - 对话消息区与输入框获得更舒适的宽度，窄面板自动适配；右上角模式切换控件在闲置时弱化。
    - 终端类型选择改用更柔和的中性反馈；对话和工具面板统一滚动条样式，扩大拖动区域，文件列表保留可见滚动入口，较矮窗口中的右侧工具栏也可滚动。
    - 移除 Janus 的歪头好奇待机动作，保留其他待机与交互反馈。
    问题修复
    - 修复等待用户审批或回答时，交互请求因长时间未操作而失效的问题。
    - 完善运行中继续输入的原生适配和会话切换同步，减少消息交接异常。
    - 修复输入框占位提示判断不完整，以及点击消息区后按空格出现明显白框的问题；键盘滚动仍可使用。
    - 修复右侧工具预览中，键盘方向键可能无法将焦点移入当前面板的问题。
    升级须知
    - Blueprint、CPA 和 Docker 均为可选插件，安装主程序不会自动安装。本次附件沿用此前已发布的签名插件版本。
    - Android 附件沿用 0.1.13，为 debug 签名的局域网测试包，支持 Android 8.0 及以上；手机与电脑需连接同一局域网，首次使用需扫码并在电脑上批准。
    - Windows 主程序未进行 Authenticode 签名。
    已知限制
    - 命令、技能、审批与运行中追加输入的支持范围因 CLI 而异；部分命令仍需在自动切换后的原生终端中完成交互。远端原生输入历史尚未接入。
    - 图片生成取决于所用 CLI、工具及账户能力。Android 长期稳定性和所有机型尚未验收；Docker 插件仍为实验功能。
    查看完整变更
