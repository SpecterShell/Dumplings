- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    JanusX 支持 Windows 10 / 11 x64 和 macOS 15 及以上的 Apple Silicon Mac。Windows 0.9.10 安装版和便携版已补充到本版本；此前使用 Windows 0.9.9 的用户可升级。
    本次 Mac 修订
    已安装早期 0.9.10 的用户，请重新下载下方 DMG 或 ZIP 并替换应用。同版本修订需要手动安装。
    - SuperAgent 在设置中导入并启用后，才会出现在终端选择页、工具菜单和灵动岛。停用或卸载会关闭已打开的 SuperAgent 面板。
    - Mac 窗口左上角按钮更新了点击范围、悬停图标和失焦样式。
    - 终端侧聊按钮显示展开状态，面板打开和收起时增加了过渡动画。
    桌面端更新
    - Mac 支持原生 CLI 对话和工作区文件拖入。双击顶部 Island 可展开 Janus 对话；启动已启用的 SuperAgent 工作台后，双击打开通知。
    - 终端对话支持侧聊、按输入导航和回合用时显示，便于在长会话中定位上下文。
    - SuperAgent 以可选实验插件提供。普通 Janus 对话可独立使用，启用插件后可分派后台 Worker、调整模型与调度偏好。
    官方插件
    以下安装包均声明 Windows x64 和 macOS arm64。可在设置的插件目录中安装，也可下载对应的 .jxp 文件后导入。
    - Blueprint 1.0.9
    - CPA 1.0.1
    - Docker 1.0.1
    - SuperAgent 0.1.0（实验，需要 JanusX 0.9.10）
