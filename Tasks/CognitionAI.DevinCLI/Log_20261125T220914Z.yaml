  Key: ReleaseNotes
  Value: |-
    Added
    - Cloud MCP tool approvals now offer “Allow for this session” to approve a tool once for the rest of the session.
    - devin worker start --concurrency N now runs N workers concurrently so child sessions on an outpost do not wait behind their parent.
    - Devin CLI is now available as devin-cli (devin-cli-next for Next) .deb and .rpm packages from the Devin Desktop apt and yum repositories.

    Fixed
    - The CLI now draws the prompt immediately on startup without waiting for the agent process, model list, or team settings to finish loading.
    - Smart mode now refuses PowerShell commands that recursively delete your home directory, a drive root, or a system directory, matching bash.
    - The session monitor (devin ls, devin -r, /resume) now shows status labels (Needs you, Working, Unread, Open, Idle, Done), color-coded titles, and full details below the list, and /resume now includes the current session.
    - Claude Code skills with unquoted argument-hint or description values now load instead of being skipped silently.
    - A read-only shell command whose file argument or cd target contains a glob or brace pattern now asks for approval instead of auto-approving.
    - Typing /<skill-name> after other text in a prompt now tells the agent to invoke that skill.
    - Resumed sessions now preserve separate thinking blocks in place, keep assistant text above subagent rows, and show running turns with grouped tool rows.
    - devin invoked by an agent command inside Devin Desktop now uses the CLI’s own login instead of reporting “Not logged in”.
    - /accept-edits <prompt> now runs the prompt after switching to Accept Edits mode instead of discarding it.
    - /model now selects versions with repeated digits (such as /model opus 5.5), selects searched variants directly, accepts pasted text, and no longer shifts the screen layout.
    - /config search now finds settings inside collapsed sections and shows their full dotted paths.
    - Bash mode (!) no longer opens slash-command or @ menus, and pressing Esc after closing a completion menu no longer reopens it.
    - Accepting a slash command from the completion menu now immediately opens its argument completions.
    - Searching the session list by directory name now finds sessions in the current directory, and devin list, /continue, and /resume no longer show empty unsaved sessions.
    - devin plugins update now downloads uploaded plugins up to 28 MiB instead of failing over 8 MiB, and devin plugin install re-enables disabled plugins instead of creating duplicate entries.
    - devin rules list now displays each rule’s file path and devin rules show accepts paths to disambiguate same-named rules.
    - Rules in .devin/rules and .windsurf/rules now accept single quoted globs strings, and plugin rules match paths relative to the repository root.
    - Command and approval cards now preserve blank lines, render tabs cleanly, wrap long unbroken tokens, show carriage-return progress updates in place, and name each file in multi-file patch cards.
    - Markdown tables in replies now follow column alignment, wrap long words inside cells, avoid flashing raw pipe text while streaming, and label stacked narrow-terminal tables accurately.
    - Pasting large text no longer consumes excessive memory, and pasting text with a trailing newline no longer leaves a blank line.
    - Ctrl+G now falls back to vi when $VISUAL and $EDITOR are unset.
    - Interrupting a turn while the agent is thinking no longer keeps unfinished thinking as a reply or leaves paused subagents shown as running.
    - devin -p now starts a new paragraph after tool calls instead of concatenating text across them.
    - TypeScript, TSX/JSX, and C++ code blocks now render with full syntax highlighting, and replace-all edits report the actual number of changed lines.
    - devin models, devin skills list, devin rules list, and devin mcp list now exit cleanly when piped to commands like head.
