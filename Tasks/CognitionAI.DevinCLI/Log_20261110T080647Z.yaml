  Key: ReleaseNotes
  Value: |-
    Added
    - Image reads take an image_size. The default sends 70% of the original’s longest side, at least 1024 px, and images sent to GPT and Gemini models use those models’ own size limits.

    Changed
    - When a response stops at the output limit before a tool call, the CLI continues the turn instead of ending it. --continue-on-output-truncation=false restores the old behavior.
    - GPT models keep working instead of stopping to ask for input they can work out, and add fewer low-value tests.
