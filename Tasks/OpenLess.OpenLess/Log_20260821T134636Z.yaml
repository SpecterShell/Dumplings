  Key: ReleaseNotes
  Value: |-
    macOS 用户首次安装提示
    下载 DMG 拖入 /Applications 后，必须在终端运行：
    xattr -cr /Applications/OpenLess.app
    否则 Gatekeeper 会提示「OpenLess 已损坏」——这是因为当前 build 用 ad-hoc 签名、没做 Apple 公证。
    渠道说明
    - 以 -tauri 结尾的 tag 是正式版（自动推送给所有 in-app 检查更新的用户）。
    - 以 -beta-tauri 结尾或包含 -Beta.N-tauri 的 tag 是 Beta 版（GitHub 标 pre-release，不通过 in-app updater 推送给正式版用户；只对在「设置 → 关于 → 加入 Beta 渠道」开关切到 Beta 的用户可见，且需要手动从此页面下载安装）。
    行为变更提示
    - 流式输入默认开启；不兼容场景会自动回落到一次性插入。可在「设置 → 高级」关闭。
    - 流式输入成功后默认把最终文本同步到剪贴板，方便再次粘贴；可在「设置 → 高级」关闭。
    What's Changed
    - chore(cask): update OpenLess to 1.3.17 by @appergb in https://github.com/Open-Less/openless/pull/956
    - feat(dictation): 落字失败时把话交还给用户，换行不再劈开聊天消息 by @bigsongeth in https://github.com/Open-Less/openless/pull/943
    - fix(asr): fallback to CPU after Foundry CUDA failure by @H-Chris233 in https://github.com/Open-Less/openless/pull/945
    - fix(settings): keep experimental state consistent by @appergb in https://github.com/Open-Less/openless/pull/959
    - fix(history): 详情面板同层 key 去重，切换条目不再残留「播放录音」按钮 by @bigsongeth in https://github.com/Open-Less/openless/pull/964
    - feat(linux): 选区读取集成进 fcitx5 插件（clipboard addon），删除外部工具依赖 by @aeoform in https://github.com/Open-Less/openless/pull/961
    - fix(settings): 选区润色快捷键录制改用通用修饰键 by @aeoform in https://github.com/Open-Less/openless/pull/962
    - fix(linux): 屏蔽 Less Computer / Claude 控制台入口 by @aeoform in https://github.com/Open-Less/openless/pull/967
    - fix(polish): 长稿润色不再卡死在 30 秒——超时按稿子长度伸缩，流式改用首字/空闲两把尺子 by @bigsongeth in https://github.com/Open-Less/openless/pull/966
    - fix(vocab-card): 收起添加词卡片后，胶囊要回到屏幕中间 by @bigsongeth in https://github.com/Open-Less/openless/pull/969
    - docs(readme): restore jiangmuran and Cooper by @jiangmuran in https://github.com/Open-Less/openless/pull/971
    - fix(ui): 修复模型选择刷新闪烁 by @H-Chris233 in https://github.com/Open-Less/openless/pull/970
    - 本地模型增加 whisper 相关模型的支持；增加 qwen3-asr 的 rust 版本，相比 C 版本速度更快 by @jimersylee in https://github.com/Open-Less/openless/pull/940
    - fix(linux): avoid audio OSD on startup and exit (#968) by @H-Chris233 in https://github.com/Open-Less/openless/pull/973
    - fix: localize Windows tray menu labels (#957) by @H-Chris233 in https://github.com/Open-Less/openless/pull/972
    New Contributors
    - @jimersylee made their first contribution in https://github.com/Open-Less/openless/pull/940
    Full Changelog: https://github.com/Open-Less/openless/compare/v1.3.17-tauri...v1.3.18-tauri
    Android 安装说明
    - 推荐：真机下载 OpenLess_<version>_arm64-v8a.apk（arm64 设备）。
    - 模拟器：x86_64 模拟器用 OpenLess_<version>_x86_64.apk。
    - 首次安装需在系统设置中允许「安装未知应用」；应用内更新会拉起系统安装器。
    - adb 调试：adb install -r OpenLess_<version>_arm64-v8a.apk
    Android 应用内更新
    - Stable 用户检查 latest-android-aarch64.json（及 mirror 变体）。
    - Beta 用户（设置 → 高级 → 加入 Beta）检查带 -beta 后缀的 manifest。
