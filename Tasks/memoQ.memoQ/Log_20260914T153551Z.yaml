  Key: ReleaseNotes
  Value: |-
    Import

    Percentage values from Excel are now imported correctly. (BUG-17189)

    Improved segmentation for text with line breaks in memoQ 12.4. (BUG-17262)

    memoQ editor

    Vietnamese tone marks are now handled correctly during typing. (BUG-15996)

    Alt+F8 now keeps tags in the correct order when adding them to segments with existing tags. (BUG-16059)

    Project history now displays the correct user for pretranslation. (BUG-16190)

    Fixed overlapping options in the Confirm and Update dialog. (BUG-16626)

    Chinese character input in Safari on Mac now matches typed and selected characters. (BUG-16690)

    Users can now see all available translation memory and LiveDocs hits when filtering is turned off. (BUG-16897)

    Project task lists no longer collapse after accepting or rejecting a task. (BUG-16961)

    Preview now updates correctly when navigating between segments. (BUG-17017)

    Improved project loading reliability and user experience. (BUG-17034)

    Tag numbering is now consistent between source and target segments. (BUG-17065)

    Fixed an issue that could prevent rows from being confirmed. (BUG-17145)

    memoQ TMS, memoQweb & collaboration

    Clarified QA messages for inconsistent translations 3000 and 30001 to make their purpose clearer. (BUG-14745)

    Images in online term base entries are now visible by default. (BUG-16693)

    Translation now works as expected when source text editing is restricted. (BUG-16707)

    Qterm filter now returns results that match the selected criteria. (BUG-16864)

    Project reports now show the correct Delivery (R1) column header after the Deadline (R1) column. (BUG-16970)

    QA checks now handle language-specific punctuation correctly. (BUG-17032)

    Offline packages now support locking and unlocking segments. (BUG-17049)

    Processing now completes correctly, with progress windows closing after errors. (BUG-17080)

    Improved server responsiveness and stability during high CPU usage. (BUG-17190)

    Authentication, licensing & upgrades

    Server updates now handle changed SQL configurations correctly. (BUG-16623)

    Machine translation

    memoQ AGT now handles pretranslation in large projects better when character limits are reached. (BUG-17048)

    Plugins

    Norwegian language selection now works correctly with the Microsoft Azure AI Translation plugin. (BUG-14760)

    Globalese MT now works correctly during pretranslation. (BUG-16963)

    Fixed authentication issues in the Google Cloud Translation Advanced plugin (memoQ 12.3). (BUG-16974)

    Google Advanced MT plugin can now be configured for online projects. (BUG-17108)

    Installation & desktop

    License checks during installation now work correctly and more reliably. (BUG-16985)
