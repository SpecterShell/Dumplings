  Key: ReleaseNotes
  Value: |-
    PGPony Desktop 3.0.3
    Fixed
    - Ed448 keys made by GnuPG or Kleopatra imported but could not be used for encryption. These are LibrePGP v5 keys: an Ed448 primary key with an X448 encryption subkey. Encrypting to one failed with "exception constructing public key", whether it was the only recipient or one of several. GnuPG stores the X448 public value without the prefix byte that Bouncy Castle, the OpenPGP library PGPony uses, insists on, so the library refused the key. PGPony now does the X448 key agreement itself for these keys and writes the encrypted session key the way GnuPG reads it. Decrypting with such a key had the same mismatch from the other side, and it works now too.
    - Signatures from a v5 key did not verify. For a v5 signature over a message or a file, GnuPG also hashes the file name and date of the signed data, or a fixed marker for detached and clear-signed signatures, and Bouncy Castle leaves that part out. Detached, clear-signed and inline signatures from these keys now verify in the app, on the command line, in pgpony sop and in the git signing shim.
    - Signing with a v5 key made signatures that GnuPG reported as BAD, and PGPony could not verify its own either. PGPony now writes v5 signatures itself, so messages, files, clear-signed text and key changes (expiry, User IDs, revocations) signed with one of these keys check out in GnuPG.
    Reported by email. PGPony Android gets the same fix in 4.7.3. Nothing changes for v4 and v6 keys.
