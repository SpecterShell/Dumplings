  Value: |-
    💫 3.5.8
    LynxHub: 3.5.8, Build: 55, Chromium: 150.0.7871.47
    This update introduces a dashboard feedback form and performance options like parallel downloads and Skia Graphite rendering, alongside Linux rounded windows, improved search, faster plugin updates, and major fixes for modal overlays, tab switching, and scroll behavior.
    Warning
    Non-main windows on Linux have been disabled and replaced with native windows where possible. Some features, including in-browser search, link previews, and a few others, are temporarily disabled until find a way to support custom window positioning under the new Wayland display server in Ubuntu 26.
    ✨ New Features
    - Added the feedback form to the dashboard page.
    - Added a performance setting to enable parallel downloads for the built-in browser.
    - Added a performance setting to enable Skia Graphite rendering.
    ⚡ Improvements
    - Enabled rounded corners for application windows on Linux.
    - Improved data updating for plugins and notifications.
    - Set the default browser user agent to Chrome.
    - Improved search functionality throughout the entire application.
    🐛 Bug Fixes
    - Fixed relaunching tab issue.
    - Fixed an issue where modals would incorrectly cover the full application, title bar, and window buttons.
    - Fixed an issue where switching tabs failed to update or close the active modal.
    - Fixed an issue preventing tooltips, confirmation dialogs, and popovers from functioning inside modals.
    - Fixed a bug where the Ignore GPU Blocklist toggle was not working.
    - Fixed an issue where overlapping page content was not scrollable.
    - Fixed scrollbars not hiding when content is not scrollable.
    - Fixed the default background color of browser web pages to white.
    📌 Minor Changes
    - Made tab icon backgrounds transparent and removed their rounded corners.
    - Improved home search performance.
    - Specified a default file name when saving terminal output to a file.

    💖 Amazing Supporters
    A huge “Thank You” to patrons! Your contributions keep LynxHub alive.

