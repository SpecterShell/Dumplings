Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    [New Functionality] Introduced a new LDAP plug-in with full support for LDAPS connections
    [New Functionality] Introduced a new Paxton NET2 plug-in providing compatibility with Paxton NET2 v7.0 and its API.
    [New Functionality] Added support for TLS 1.3 connections
    [New Functionality] Added support for folder naming using emojis
    [New Functionality] Users can now export photos for multiple records simultaneously, with customisable file formats and save locations
    [New Functionality] Added support for the Evolis Zenius 2
    [New Functionality] Added support for the Dascom DC-7600
    [Improvement] Updated Magicard SDK to version 3.2.8.2
    [Improvement] Enhanced face detection and "crop-to-face" precision
    [Improvement] Improved support for Magicard NEO and Authentys 600 printers
    [Improvement] Improved support and stability for Python scripts
    [Improvement] Enhanced Magicard 600 connectivity via Ethernet when using the CardExchange® Print Server
    [Bug Fix] Fixed an issue where names from LDAP sources containing apostrophes (e.g., O’Riley) were being incorrectly escaped (O''Riley)
    [Bug Fix] Fixed photo loading issues from LDAP sources
    [Bug Fix] Resolved an issue where mappings were deleted if a card was created without a defined database
    [Bug Fix] Fixed a bug preventing the deletion of database connections within the Database Manager
    [Bug Fix] Fixed false positive font-missing warning for fonts with weight-encoded family names (e.g. Arial Black)
    [Bug Fix] Fixed a navigation bug where clicking the drop-down in the Cards tab would switch tabs instead of opening the menu
    [Bug Fix] Corrected an issue where the image editor would default to "Cancel" instead of "Confirm."
    [Bug Fix] Improved Dutch translation accuracy
    [Bug Fix] Resolved module licensing issues and "Check for Updates" failures
    [Bug Fix] Disabled deprecated calls to the e-marketing portal to prevent connection failures
    [Bug Fix] Resolved PDF147 generation failures caused by invalid ASCII characters
    [Bug Fix] Fixed an "object reference not found" error when modifying MIFARE/DESFire definitions
    [Bug Fix] Fixed an issue where typing the colour name or the hex color code would display an error
ReleaseTime: 2026-04-20
