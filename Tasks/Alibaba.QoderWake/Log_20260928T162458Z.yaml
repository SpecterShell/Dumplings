    Personal Avatar and Wakey Experience Improvements
    Improvements
    - Personal Avatar: Improved the Memory Globe and relationship view so dense information is easier to read and explore.
    - Learning Sources: Made collection progress easier to follow and improved the page layout and source selection experience.
    - Wakey Floating Window: Improved positioning, sizing, and movement, with a cleaner compact chat view.
    Bug Fixes
    - Fixed Auto model selection changing unexpectedly.
    - Fixed repeated upgrade prompts in Recording Learning.
    - Fixed Wakey dragging and notification access on Linux cloud computers.
    - Fixed unclear recovery guidance after DingTalk sign-in expires.
