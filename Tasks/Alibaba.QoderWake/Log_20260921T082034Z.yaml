Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Group Chat Q&A, IM Access, and Messaging Updates
    Improvements
    - Group Chat Q&A: Uses recent group messages and Q&A records when requesting expert help, and supports expert handoffs, answer delivery, and knowledge updates.
    - Reply Settings: Adds custom reply styles for controlling how final Group Chat Q&A responses are expressed.
    - Runtime Reliability: Improves resource-pressure handling and background process continuity to reduce incorrect restrictions and interruptions.
    Bug Fixes
    - Fixed expert answers occasionally not returning to the original group, as well as some expert handoffs being repeated or interrupted.
    - Fixed organization pairing incorrectly triggering or repeating automatic pairing, and first-time setup not listing configured IM connections.
    - Fixed Skill management potentially triggering repeated synchronization.
    - Fixed WeCom real-time messages potentially being affected while message history was still loading.
    - Fixed local file uploads to knowledge bases failing in some cases.
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    群聊答疑、IM 接入与消息处理优化
    体验优化
    - 群聊答疑：专家求助会结合近期群消息和答疑记录，并支持专家间转交、答案回流及知识更新。
    - 回复设置：支持自定义群聊答疑的回复风格，用于控制最终答复的表达方式。
    - 运行稳定性：优化资源压力处理和后台进程衔接，减少误判及中断。
    问题修复
    - 修复专家回复后答案可能未回流原群，以及部分专家转交可能重复或中断的问题。
    - 修复组织配对可能误触发或重复自动配对，以及首次接入无法选择已配置 IM 连接的问题。
    - 修复 Skill 管理后可能触发重复同步的问题。
    - 修复企业微信历史消息仍在加载时可能影响实时消息处理的问题。
    - 修复知识库本地文件上传可能失败的问题。
