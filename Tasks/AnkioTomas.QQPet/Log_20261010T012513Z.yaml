- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    新功能
    - 社区景点、打架招式、图图和小艾台词改由 AI 生成，所有默认台词至少 10 句候选
    - 岛民任务新增逛地方、照顾自己、送礼，打架分硬拼智取说服并配原版横幅，开 AI 时任务和打架说法随机生成
    - ui：设置里可检查更新，默认每天自动检查一次，有新版跳转 GitHub 下载
    - pet：岛民任务覆盖全岛，新增出题、捉迷藏、景点、打妖怪等玩法
    - pet：社区底栏的物品、新闻能打开，好友、家园提示不支持
    - ai：add AI-driven island content and fix looping text
    - pet：社区有会走路聊天的 AI 企鹅，底栏和大乐斗能用
    - pet：社区 NPC 能打开本地小游戏，失效网页给提示
    - pet：风语广场能进能走，补齐地图实体
    - pet：补齐社区大地图和小地图底图
    - pet：社区场景互通，传送门和世界地图能换场景
    - pet：接入企鹅岛社区，单机进入夏帕海岸
    - pet：鱼塘补齐可买鱼种，投放可选数量
    - pet：把官方丢丢乐加进陪我玩
    - pet：补齐桌面索取，并加入可选随机走动
    - ui：移除粉钻相关 UI 样式与逻辑依赖，简化界面设计
    - ai：支持带动作指令的多行 AI 回复
    修复
    - pet：降低饥饿导致的死亡速率，延长未喂食存活时间
    - pet：神秘岛不再等缺失的脚本，粉钻雪山缺图的 NPC 补上
    - pet：社区聊天框用输入法打中文不再卡顿
    - pet：社区里的小游戏叠在社区上，NPC 不再卡 10 秒才出现
    - pet：社区边缘出口能换场景，缺资源时企鹅提示
    - pet：社区企鹅能点地走路，加载不再闪
    - pet：社区按 taskID 回资源，夏帕海岸能画出来
    - ui：打开聊天后抢到系统焦点，输入法才能切
    优化
    - ui：弹窗统一用原版提示框，去掉三端系统原生 messageBox
