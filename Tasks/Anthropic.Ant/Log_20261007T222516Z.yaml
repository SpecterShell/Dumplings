    - client: keep a piped value in the request body when a path parameter has the same name (f0b8001)
    - client: send array header params as a single comma-separated header (f50220f)
    Chores
    - docs: describe a federation rule's target by its type (5f16257)
    - docs: fix example IDs in sessions, agents and vault credentials (5f16257)
    - docs: update Managed Agents multiagent and thread descriptions (5f16257)
    - internal: add REVIEW.md with review instructions (5f16257)
    - internal: group imports in two blocks in all files (5f16257)
    - tests: run tests skipped for a query param bug that is now fixed (4d8e250)
    - tests: run tests that an older mock server could not serve (dc98ed1)
    - tests: run the skipped skill create tests (#150) (5f16257)
    - tests: run the tests skipped for incomplete example responses (c80fcf5)
    Documentation
    - api: state the agent tools limit as 256 (57cb228)
