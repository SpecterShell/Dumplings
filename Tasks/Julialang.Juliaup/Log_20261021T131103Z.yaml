  Key: ReleaseNotes
  Value: |-
    What's Changed
    - remove: accept several channels and wildcard patterns by @IanButterworth in https://github.com/JuliaLang/juliaup/pull/1639
    - shell completions: Use "$" instead of hardcoding home by @staticfloat in https://github.com/JuliaLang/juliaup/pull/1638
    - download: retry requests that get no response, and deflake the deadline test by @IanButterworth in https://github.com/JuliaLang/juliaup/pull/1646
    - add: accept several channels by @IanButterworth in https://github.com/JuliaLang/juliaup/pull/1640
    - Allow unsetting an override whose directory no longer exists by @Deepak-negi11 in https://github.com/JuliaLang/juliaup/pull/1633
    - Support build variants of releases (1.14+opt, release+assert) by @KristofferC in https://github.com/JuliaLang/juliaup/pull/1636
    New Contributors
    - @staticfloat made their first contribution in https://github.com/JuliaLang/juliaup/pull/1638
    - @Deepak-negi11 made their first contribution in https://github.com/JuliaLang/juliaup/pull/1633
