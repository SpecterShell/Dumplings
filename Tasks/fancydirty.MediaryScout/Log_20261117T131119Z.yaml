  Key: ReleaseNotes
  Value: |-
    - 新增 通用选源要求：可在「设置 → 获取偏好」直接编写或套用模板（如「优先 HDR10，避开杜比视界，控制单部体积」），保存后对电影、剧集、巡检补缺与换源统一生效，并在通知卡片中记录当次生效的要求
    - 新增 影视服务器入库自动刷新：可在「设置 → 巡检与通知」配置 Emby、Jellyfin、Plex 或自定义入库 Webhook，新视频落盘后自动触发媒体库扫描，通过 CloudDrive2 / OpenList / rclone 挂载网盘时无需再手动扫库
    - 修复 文件名难以识别集号的已入库剧集不再被遗漏，巡检不会再反复误报这些集数新增
    - 修复 多块网盘追踪同一部剧集时，巡检不会再把别的网盘上已获得的集数误写进当前网盘的记录

    桌面版：macOS（Apple 芯片）下载 .dmg，Windows 下载 .exe。覆盖安装，数据和设置都会保留。
    Docker 自部署：按升级说明更新。
