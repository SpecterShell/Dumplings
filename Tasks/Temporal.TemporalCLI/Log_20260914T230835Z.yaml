  Key: ReleaseNotes
  Value: |-
    💥 Breaking Changes
    - temporal activity unpause no longer accepts --reset-attempts or --reset-heartbeats. Both flags were no-ops and have been removed; remove them from any scripts, which will otherwise fail on an unknown flag.
    - temporal activity describe returns the full DescribeActivityExecutionResponse, rather than the bare ActivityExecutionInfo. Anything parsing --output json must move execution fields one level down, from .activityId to .info.activityId and so on. The response also adds a top-level runId, which is useful when --run-id was not passed. The command now requests last-failure details, so lastFailure is populated inside info, and text output gains an Activity Execution Info: heading.
    - temporal operator namespace update now requires --active-cluster to be used on its own. Changing the active cluster is a failover operation, so it can no longer be combined with any other namespace update option — configuration changes such as --description, --retention or the archival flags, or --promote-global — and it can no longer be passed empty. Previously these combinations were accepted and silently applied. Split them into two invocations: update the namespace configuration first, then change the active cluster. Connection and output flags such as --namespace and --address are unaffected, and no other flag combination changed.
    Highlights
    This is the first official release in the v1.9.x series (v1.9.0 was published as pre-release only). Users upgrading from v1.8.3 should read the breaking changes above.
    Added
    - Standalone Activities can now be operated entirely from the CLI. temporal activity covers the full lifecycle: start or execute an activity, inspect it with describe, list, and count, wait on its result, and act on it with cancel, terminate, delete, pause, unpause, and reset. Operator actions work on a single activity or in batch across a query. They also work against the local dev server, so the whole flow can be tried without a Cloud namespace. pause, unpause, reset, and update-options remain Experimental.
    - Nexus Operations can be started and managed directly, without wrapping them in a Workflow. The new temporal nexus operation command group provides start, execute, describe, list, count, result, cancel, and terminate. This command group is Experimental.
    - temporal worker count reports how many workers are running in a namespace, optionally narrowed with --query (Experimental).
    - Clearer diagnosis when a connection fails. Rather than surfacing an opaque dial error, the CLI now reports the likely cause — for example that the server requires a client certificate (mTLS) — within a short time budget. Set TEMPORAL_CLI_DISABLE_CONNECT_DIAGNOSIS to disable it.
    - Config profile improvements: a new client-authority setting, and easier discovery of profile configuration.
    - One-time move versioning overrides can now be applied from the CLI.
    Changed
    - temporal server start-dev now runs OSS Server v1.32.0, so local development picks up v1.32.0 server behavior — including the query support the new Nexus Operation commands depend on. The bundled Web UI moves to v2.54.1.
    - Event history is easier to read for Nexus users. System Nexus Operation internals are unwrapped, so history shows the operation itself rather than the underlying machinery.
    - temporal activity describe reports more execution detail for Standalone Activities, including attached links.
    - update-options --start-delay now applies only to Standalone Activities and is rejected for Workflow Activities, where it had no meaning.
    - The dev server refreshes Nexus endpoints when they are read, so endpoint changes take effect without restarting it.
    - The published Docker image is built on Alpine 3.24.1, and the bundled Go SDK moves to v1.47.0.
    Fixed
    - Batch activity update-options now applies the options passed to it; previously they were dropped.
    - operator namespace delete no longer documents --yes backwards.
    - Help text corrections across the Standalone Activity and Nexus Operation commands, including stability labels and flag value placeholders, plus a corrected schedule update example and a clarification that --query on activity commands targets Workflow Activities rather than Standalone ones.
