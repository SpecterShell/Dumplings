  Key: ReleaseNotes
  Value: |-
    What's Changed
    - Backport for CLI v1.8.3 (monthly public/latest) by @ks-temporal in https://github.com/temporalio/cli/pull/1185
    - chore: pin alpine docker image to 3.23.5 (backport to release/1.8.x) by @ks-temporal in https://github.com/temporalio/cli/pull/1192
    Full Changelog: https://github.com/temporalio/cli/compare/v1.8.2...v1.8.3
    Additional notes:
    - activity update-options --task-queue now works. It silently did nothing in v1.8.2 (wrong update-mask path).
      Users with automation passing that flag will see behavior change.
    - activity reset --reset-attempts removed — it was a no-op. --reset-heartbeats is unaffected.
    - AWS AgentCore compute provider added for worker deployment create-version.
    - UI Server stays at v2.50.1 — better stated in the notes than discovered later.
