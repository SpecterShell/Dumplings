Version: 2.2.0
Installer:
- Architecture: x64
  InstallerType: nullsoft
  InstallerUrl: https://github.com/anywhere-labs/Agents-Anywhere/releases/download/v2.2.0/Agents.Anywhere.Setup.2.2.0.exe
Locale:
- Locale: en-US
  Key: ReleaseNotes
  Value: |-
    Agents Anywhere v2.2.0 is an interface update to the 2.x series. It adds unified native Plan mode (/plan) with inline composer review across Codex, Claude Code, and DSH, introduces unified Goal mode (/goal) for Codex and Claude Code, adds Pi and Hermes Agent support, brings model gateway management and (disabled-by-default) Tokens Anywhere sign-in and linking, significantly reduces database and memory overhead under heavy load, hardens large-history sync and network recovery for DSH, Codex, and Claude, adds in-app document previews and a foldable two-pane layout on Android, and updates Desktop's minimum requirement to macOS 13.
    Updates
    Unified Plan
    - Codex, Claude Code, and DSH sessions support /plan, /plan <task>, and /plan off; new sessions can enter native planning on the first turn, while bare /plan sets creation intent without burning an empty model turn
    - Web, Desktop, Android, and iOS add streaming plan cards with inline Approve & Execute / Revise Plan / Dismiss actions in the composer instead of modal dialogs; long plans expand inline, and Open Plan supports copying, exporting, and side-by-side reading on Web and Desktop
    - Plans are stored as immutable revisions that remain readable offline; revisions become sequential versions (v2, v3…) of the same plan with older revisions collapsed into a single timeline row, and stale approvals or duplicate executions are blocked
    - Added localized /plan descriptions in the slash menu; runtime, workspace preparation, session creation, and native history errors now map stable error codes to localized messages in the client language
    Session Creation, New Agents, and Message Delivery
    - Added Pi support (compatible with local Pi 1.2.0+ in the 1.x line): reuses compatible local models, auth, and config; supports initial and follow-up attachments, tool approvals, in-flight steering, browsing native local history, and Resume Task after the CLI exits; displays the monochrome Pi icon across all clients and warns before sending when the selected model does not support images
    - Added local Hermes Agent support: conversations, tool approvals, text and image attachments, in-flight steering, interrupt, and resume; sessions without native history show Resume Session after disconnects so you can keep working without starting over
    - Desktop separates dependency installation from Connector launch and pre-installs the Pi adapter, skipping setup dialogs when cached; during Connector reconnect recovery, Web and Desktop wait for agents to become ready and allow retrying failed loads
    - Attachment uploads and downloads are now streamed without buffering entire files in Server memory, and image attachments expose WebP thumbnail URLs
    - Reduced database and memory pressure at scale:
      - Session list queries read a precomputed latest-item summary instead of querying each session individually, and dashboard pushes coalesce per user (default 2s via AGENT_SERVER_DASHBOARD_MIN_INTERVAL_SECONDS);
      - Superseded streaming message versions no longer accumulate in Server memory, with optional periodic memory trimming via AGENT_SERVER_MALLOC_TRIM_INTERVAL_SECONDS;
      - Fixed multi-hour stalls and pool exhaustion during reconnect/backlog bursts, ~5-minute write blocks on Redis reconnects, out-of-range orderSeq blocking entire sessions, and read-only composer states when taking over during connect/disconnect
    Codex and Claude
    - Added unified Goal mode (/goal) for Codex and Claude Code across Web, Desktop, Android, and iOS with inline editing, pause, resume, and clear controls above the composer
    - Fixed file descriptor leaks in long-running Codex Connector sessions ("Too many open files") and unclosed database handles after reading or writing planning records
    - Fixed Codex takeover send failures, ineffective stops, and stale running states when the original client goes offline, as well as sessions staying stuck on "Waiting for approval" after responding in the Codex App or IDE; turn failures now show an error card without locking the composer
    - Codex auto-review and image-view timeline items no longer render as unknown; fixed backfilled older messages appearing at the bottom or out of order
    - Claude dynamic wakeups preserve the original process and distinguish initial resume messages from stale background task notifications; tool-result images (such as screenshots) sync as compact summaries instead of raw payloads to avoid 413 failures
    - Oversized Codex and Claude Code histories upload in pages and isolate persistently rejected sessions with per-session exponential backoff; transient retryable rejections from Server write contention are retried automatically instead of quarantined
    - Periodic inventory scans write only changed sessions, skip unchanged re-uploads, and stagger startup/reconnect scans; resuming Codex sessions with a model gateway preserves the original provider, and local Codex 0.166 / 0.167 automatically uses AA's bundled Codex when a gateway is configured
    DSH Sync and Plugin (@agents-anywhere/dsh-bridge-next)
    - Turn errors or empty-reply completions in DSH show an error/notice card without locking the composer; retryable errors (rate limits, timeouts, connection drops) include a Continue action to resume generation without resending (requires DSH 0.2.2-rc.3+)
    - DSH 0.2.2 compatibility: fixed Cordis / Schemastery peer-dependency warnings on plugin install, and restored Chinese authorization prompts for experimental Computer Use with selectable options
    - More resilient large-history and streaming sync:
      - Full histories up to 45 MiB commit in one request with diff-only updates; larger histories or 413 responses shrink page size (down to 1 MiB) and replace by orderSeq range;
      - Large history uploads no longer block real-time messages from Codex, Claude, or other runtimes on the same device;
      - Streaming replies coalesce roughly every 0.25s to reduce Server write load;
      - Slow uplinks, 5xx errors, and transient write-lock contention adapt timeouts and retry the current batch without dropping sync or rescanning everything
    - Startup sync and connection reliability:
      - Runtimes stay "Running" during initial sync and resyncs (showing "Syncing DSH sessions…"), allowing you to open sessions, send messages, and answer approvals; active or open sessions sync first, and initial sync orders sessions by last used time;
      - When the 7-day plugin account sign-in expires, sync continues using local device credentials with a Sign in again prompt; auto-start on boot retries until network and Server are ready;
      - Fixed false errors when opening data/log folders on Windows, modal close/focus conflicts with theme plugins, missing uv executable permissions, registry errors on plugin re-enable, and DSH exiting on busy Connector or manager-lock disconnects
    Local Connection, Desktop, and Ownership
    - After repeated connection-pool timeouts caused by network jitter, the Connector recreates its HTTP pool and resumes history and DSH sync without restarting Desktop; running DSH alongside Desktop no longer drops the local control connection
    - Added Connector Network settings (Follow System / Direct / Custom Proxy) in Desktop and the DSH plugin so API requests, real-time sockets, and terminals use the same path; fixed proxy bypass rules, NO_PROXY parsing, and unreachable connections when a system proxy app has exited
    - Connector uses the OS certificate store on Windows and macOS; first-time setup on Intel Macs no longer stalls compiling cryptography
    - Desktop cleans up orphaned Connector processes after abnormal macOS exits and shuts down the local Connector directly on OS shutdown, restart, or sign-out without blocking prompts (optional Ask before quitting on shutdown toggle in Settings → Startup & Notifications)
    - Silent sign-in launch stays hidden unless port ownership fails or device credentials expire; unresponsive local Connectors auto-recover, and Codex version checks no longer block heartbeats or local control
    - Deleting a user as admin now cleans up their devices, projects, and sessions; stopped or deleted runtimes no longer emit error log spam every 30 seconds
    Web and Desktop Interface
    - Clicking file links in agent replies (including file:// URLs, paths with spaces or CJK characters, and line/column anchors) opens an in-session preview tab; right-clicking selected text in Web chats opens the browser's native context menu
    - Switching back to recently viewed sessions renders cached messages immediately and preserves scroll position before catching up on new items, fixing state mix-ups across session switches and credential refreshes
    - Settings → Model Gateways lets you choose a default gateway or add model services with automatic protocol/model detection and masked key hints; admins can configure Tokens Anywhere in Admin → General, enabling sidebar linking, embedded console access, and AA sign-in confirmation (off by default unless configured on the Server)
    - Admin usage reports read hourly rollups, and turn/approval latency percentiles compute across all samples in range; Beta and experimental runtimes display status badges
    - Desktop's Auto (Follow System) theme updates live when OS appearance changes; long model lists scroll within the window without overlapping the titlebar; fixed ACP model loading placement and transient "Target state unavailable" banners when creating sessions
- Locale: zh-CN
  Key: ReleaseNotes
  Value: |-
    Agents Anywhere v2.2.0 是 2.x 系列的接口更新：在 Codex、Claude Code 和 DSH 中支持统一原生 Plan（/plan）并在输入区直接审阅，为 Codex 与 Claude Code 新增统一目标模式（/goal），新增 Pi 与 Hermes Agent 接入，支持模型网关管理与（默认关闭的）Tokens Anywhere 账号登录和链接；同时大幅优化高负载下的数据库读写与实时刷新，全面提升 DSH、Codex 和 Claude 大历史同步与网络抖动恢复的稳定性，Android 新增站内文档预览与折叠屏双栏布局，Desktop 从本版起需要 macOS 13 及以上。
    本次更新
    统一 Plan
    - Codex、Claude Code 和 DSH 会话统一支持 /plan、/plan <任务> 与 /plan off；新会话首条任务即可进入原生规划，裸 /plan 只设置创建意图，不消耗空模型回合
    - Web、Desktop、Android 和 iOS 新增流式计划卡片，直接在输入区「同意并执行／修改计划／暂不执行」，不再弹出审批窗口；长计划可展开全文，「打开计划」支持复制、导出，Web 与 Desktop 支持与聊天并排阅读
    - 计划按不可变版本保存，设备离线仍可查阅；修改意见产生的新计划作为同一份计划的下一版本（版本 2、3…），旧版本在时间线中收为一行，阻止旧版本批准或重复执行
    - 斜杠菜单补充 /plan 及各端中英文说明；Runtime、工作区准备、会话创建和原生历史错误改为按稳定错误码显示对应界面语言的文案，英文界面不再出现中文提示
    会话创建、Agent 接入与消息交付
    - 新增 Pi 接入（支持本机 1.2.0 及之后的 1.x 版本）：优先复用本机兼容的模型、认证与配置；支持首条及后续附件、工具审批、运行中追加指令、浏览本机原生历史并在 CLI 退出后「继续任务」；四端统一显示 Pi 单色图标，并在所选模型不支持图片时提前提示
    - 新增本机 Hermes Agent 接入：支持对话、工具审批、文本和图片附件、运行中追加指令、中断与恢复；Agent 连接断开后，没有原生历史的会话显示「恢复会话」，可直接接着用
    - Desktop 准备本机 Connector 时将依赖安装与启动分开进行，同时准备 Pi 适配器，缓存有效时直接启动；Connector 重连恢复期间，Web 与 Desktop 等待 Agent 就绪后允许创建，加载失败可查看原因并重试
    - 附件上传与下载改为流式处理，不再整包占用服务端内存；图片附件同时提供缩略图地址，浏览大图更省流量
    - 显著降低多会话与高负载场景的数据库和内存压力：
      - 会话列表改为直接读取最新记录摘要，同一用户的实时变化默认至少每 2 秒合并推送一次（AGENT_SERVER_DASHBOARD_MIN_INTERVAL_SECONDS）；
      - 同一条流式消息的旧版本不再持续积压占用 Server 内存，支持配置 AGENT_SERVER_MALLOC_TRIM_INTERVAL_SECONDS 定期向系统归还已释放内存；
      - 修复断线重连或集中补传时会话写入卡住数小时、占用连接池以及 Redis 环境下个别会话约 5 分钟写不进消息的问题；
      - 修复时间线条目序号越界导致整条会话后续消息无法入库，以及重连/断开期间开启接管后输入框仍显示只读的问题
    Codex 与 Claude
    - Web、Desktop、Android 和 iOS 新增统一目标模式 /goal（Codex / Claude Code），可在输入区上方编辑、暂停、恢复或清除目标，停止时阻止自动续跑
    - 修复 Codex 长时间运行逐渐占满文件句柄导致「Too many open files」离线的问题，以及读写计划记录后未关闭数据库文件的问题
    - 修复 Codex 接管后原客户端离线导致发送失败、停止无效和状态残留，以及在 Codex App / IDE 中处理审批后 AA 仍一直显示「等待批准」的问题；回合失败后只显示错误卡片，不再锁住输入框
    - Codex 自动审查（auto-review）和查看图片记录不再显示为 unknown；修复接入已有会话后旧消息排到末尾或顺序交错的问题
    - Claude 动态唤醒等待时保留原进程，区分首条恢复消息与旧后台任务通知；工具结果里的图片（如截图）同步为摘要而非原文，避免 413 失败
    - Codex 和 Claude Code 超出单次请求上限的历史改为分批上传，仍被拒收的会话按指数退避单独隔离，不再拖慢同设备其他会话；遇到 Server 写入短暂排队（retryable 拒收）时自动重试，不进入长期隔离
    - 定时清单扫描仅在真正变化时写入数据库，未变化时不再重复上报，并错开启动和重连扫描；接入模型网关后恢复 Codex 会话保留原服务商，本机 Codex 0.166 / 0.167 在配置网关时改用 AA 自带 Codex，避免重启后无法继续
    DSH 同步与插件（@agents-anywhere/dsh-bridge-next）
    - DSH 回合出错或正常结束却没有回复时显示错误/提示卡片（不锁住输入框）；因限流、超时、连接中断等可重试错误失败时，卡片上出现「继续」，点击即可接着生成（需 DSH 0.2.2-rc.3 及以上）
    - 适配 DSH 0.2.2：修复安装插件时提示 Cordis / Schemastery 版本不满足的问题；实验性 Computer Use 的授权提问重新在 AA 中以中文显示，可从给定选项中选择允许或拒绝
    - 大历史与流式同步全面加固：
      - 45 MiB 以内的完整历史一次提交并只改写变化条目，超过 45 MiB 或遇代理 413 时自动缩小分页（最低 1 MiB）并按区间替换；
      - 大历史上传不再阻塞同设备 Codex / Claude 等会话的实时消息；
      - 流式回复约每 0.25 秒合并提交一次，显著降低服务端请求和写入压力；
      - 上行较慢或遇 5xx、短暂写锁排队时自动延长等待并退避重发当前批次，不再断开重扫全部会话；被拒收会话在重连/重建同步流后仍记住退避状态
    - 启动同步体验与连接稳定性优化：
      - 首次同步或重新同步期间 Runtime 保持「运行中」，设备页显示「正在同步 DSH 会话…」，可正常打开会话、发消息和回答审批；已打开或正在运行的会话优先完成同步，首次同步后列表按最后使用时间排序；
      - DSH 插件账号登录 7 天到期后改用本机设备凭据继续同步，并在面板提示「重新登录」；开机自启网络未就绪时自动重试启动 Connector；
      - 修复 Windows 点击打开数据/日志目录误报失败、安装主题插件后远程控制面板无法关闭、内置 uv 缺少执行权限、停用再启用插件报错，以及 Connector 忙碌或管理锁断开导致 DSH 退出的问题
    本机连接、桌面端与所有权
    - 网络抖动连续无法获取连接池时，Connector 自动重建连接池并恢复历史与 DSH 同步，无需重启桌面端；启用 DSH 时桌面端与 DSH 共存不再断开控制连接
    - Desktop 和 DSH 插件新增「Connector 网络」设置（跟随系统 / 直连 / 自定义代理），接口、实时连接和终端统一走同一链路；修复系统代理例外、NO_PROXY 解析与本机代理软件已退出时连不上服务器的问题
    - Windows 和 macOS 上 Connector 改用系统证书库校验服务器证书；Intel Mac 首次安装不再卡在编译 cryptography
    - macOS 上 Desktop 异常退出后自动回收残留 Connector 进程；电脑关机、重启或注销时直接停止本机连接并退出，不再弹窗阻塞关机（可在「设置 → 启动与通知」开启「关机时询问是否退出」）
    - Desktop 静默启动仅在端口占用、归属失败或凭据失效时弹窗一次；本机 Connector 持续无响应时自动重建后台；Codex 版本检测不再阻塞心跳与控制通道
    - 管理员删除用户时同步清理该用户的设备、项目和会话；停止或删除 Runtime 后不再每 30 秒刷屏日志
    Web 与桌面端界面
    - 对话中点击 Agent 回复的文件超链接（含 file://、空格/中文路径、行号锚点）直接在会话内打开预览标签页；Web 对话中已选中文字时右键打开浏览器自带菜单
    - Web 与 Desktop 切回最近查看的会话时立即显示缓存消息并恢复阅读位置，随后补齐新消息与运行状态，修复切换会话或刷新凭据时的状态错乱
    - 「设置 → 模型网关」支持选择默认网关或手动添加模型服务，保存时自动识别协议和模型，Key 只保留首尾提示；管理员可在「管理 → 常规」配置 Tokens Anywhere 地址，侧边栏支持一键授权链接、内嵌打开 Tokens Anywhere 控制台以及使用 AA 账号登录确认（默认关闭，需服务端配置开启）
    - 管理看板使用报表改为读取按小时汇总，轮次耗时和审批等待分位数统计范围内全部样本；Beta 和实验性 Runtime 显示状态标记
    - Desktop 选择「自动（跟随系统）」主题时立即响应系统亮暗外观切换；模型列表过长时在窗口内滚动且不遮挡标题栏；修复新建会话时短暂显示「目标状态暂不可用」和 ACP 模型加载位置错位的问题
