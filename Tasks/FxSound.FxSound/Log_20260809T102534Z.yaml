  Key: ReleaseNotes
  Value: |-
    1. MCP server included to let AI assistants like Claude to interact with FxSound
    2. Fix to prevent Bluetooth device disconnect from removing the device from device preference list
    3. Fix for mute getting applied when device is muted in Windows
    4. Audio controls for the equalizer are moved to main window from settings
    5. Normalization control removed since volume leveling provides a superset of the functions
    6. Czech language support added
