  Key: ReleaseNotes
  Value: |-
    新增
    - 支持网易云音乐、QQ 音乐、酷我音乐账号登录，使用本人账号优先解析和播放对应平台歌曲，无需安装音乐脚本。实际音质与可播放范围按账号权益，播放开始后显示账号来源。
    - 个人歌单每页 10 个，支持跨页多选、全选、批量导入、停止与失败重试。
    - 歌单预览弹窗每页 20 首，可直接点歌、播放本页、暂停 / 继续、收藏与整份导入。
    优化与修复
    - 平台下拉与刷新统一 128 × 32px，复用现有按钮、选择器、分页、弹窗和歌曲表格，移除默认深色边框。
    - QQ 登录弹窗保留官网回调所需的 opener 与会话环境，酷我指定 HTTP 回调升级 HTTPS。
    - 登录、退出、重新登录和账号失效会更新播放缓存，预加载、暂停恢复、换队列与循环不再复用旧账号链接。
    - 修复隐藏 macOS WebView 暂停动画帧时启动检查等待的问题。
    验证与安装
    - 持有人开发模式验收通过；1,075 项前端测试、100% 行覆盖、15 项浏览器回归、macOS 291 项与 Windows 355 项 Rust 测试通过。
    - GitHub Actions 执行共享门禁、Windows / macOS 原生构建与隔离启动、macOS 双架构验证、更新签名及安装包 / 清单完整性检查。
    - Windows 下载 TuneFree_1.1.44_x64-setup.exe；macOS 下载 TuneFree_1.1.44_universal.dmg。已安装用户可在应用中检查更新。.sig、.app.tar.gz 与 latest.json 用于自动更新。
    开发计划与界面 · 开源参考与许可 · PR #12
