  Key: ReleaseNotes
  Value: |-
    更新内容
    - 新增音源管理页面，支持文件、拖放和链接导入，以及启停、重新加载和查看音源详情。
    - 新增酷狗、咪咕搜索入口；搜索选项会随音源加载状态更新。
    - 将 GD 音乐台接入内置脚本运行时，兼容上一版的网易云、QQ、酷我、JOOX 和哔哩哔哩调用方式；校准平台声明和 GD Studio 作者归属，区分适配版本与请求音质。
    - 修复跨音源匹配时歌词、封面和歌曲标识不一致的问题，保留翻译、罗马音及逐字歌词，补回搜索结果去重。
    - 改善音源解析缓存、请求取消、并发导入和脚本重新加载；本地保存失败时保留原有状态并给出提示。
    - 精简音源页布局和说明，将详细资料与诊断信息收起，修复样式影响其他界面的问题。
    - 移除桌面伙伴旁遮挡内容的小笑脸按钮，保留右键菜单和键盘入口；拖动时立即移除菜单面板，避免拖影和遮挡。
    - 加强音源网络请求的目标地址、超时和响应处理校验。
