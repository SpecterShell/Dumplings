  Key: ReleaseNotes
  Value: |-
    修复内容
    - 修复 macOS 桌面歌词无法通过边缘拉高、拉宽的问题，支持上下左右及四角缩放，适配 Retina 比例并保存窗口尺寸。
    - 桌面歌词在悬停、拖动和缩放时显示中性灰色圆角边框，离开后自动隐藏，锁定时隐藏边框和缩放控件。
    - 默认歌词字号由 22px 提高至 32px，最大可调到 64px；新窗口默认高度提高至 420，保留已有自定义窗口尺寸。
    - 修复靠近窗口四角的悬浮提示被挤成一字一行，保持内容自然宽度并避开屏幕边缘。
    - 修复快速切页时动画对象累积、榜单缓存无界、取消音源请求后排队请求仍启动，以及取消推荐后后台网络任务未结束的问题；加强音频元素与 Web Audio 资源释放。
    - 降低高刷新率屏幕上的装饰动画和布局开销，更新前端稳定版依赖及 9 项 Rust 传递依赖。
    macOS 媒体与歌词兼容
    已验证关闭 TuneFree 桌面歌词后，Vorssaint 仍可识别 TuneFree 的当前歌曲、播放状态和进度，并独立显示歌词。Vorssaint 根据歌曲信息查找歌词，具体曲目的可用性由其歌词服务决定。
    验证
    - 1021 项前端测试通过，业务源码行覆盖率 100%；10 项浏览器回归通过。
    - macOS 原生 252 项测试、严格 Clippy、构建和真实启动检查通过。
    - 5000 首歌单的反复切页测试中，已修复的 Animation / KeyframeEffect 对象没有新增累积，页面异常数为 0。
    - 正式安装包与更新签名由 GitHub Actions 完成 Windows / macOS 质量门禁后构建，资产和更新清单完整才公开发布。
    性能测试场景与适用范围见 检查报告。
