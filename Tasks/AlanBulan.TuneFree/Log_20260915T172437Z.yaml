  Key: ReleaseNotes
  Value: |-
    更新内容
    - 模型列表改用与应用一致的自定义下拉框，适配浅色和深色主题；支持长列表滚动、键盘选择，并按内容区域空间向上或向下展开。
    - 保留远程模型列表的获取、刷新和错误提示；刷新失败时保留当前配置，长模型名称可在菜单中完整查看。
    - 修复音源后台未处理异常只写日志、仍显示“已加载 · 待验证”的问题。脚本崩溃后立即显示“运行异常”和具体原因，停止脚本并撤销解析能力。
    - 普通 console.error 仍作为诊断日志保留，不会单独导致音源停用。作者接口拒绝下载等上游错误继续如实展示。
